<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Verification checks the path a user takes, then each app node</title>
  <desc>Verification checks the path a user takes through HTTPS and nginx, asserts the deployed version, and checks every app node directly.</desc>
  <defs>
    <!-- Green Arrowhead (18px) -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#207448"/>
    </marker>
    <!-- Orange Arrowhead (18px) -->
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#db8129"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Verification checks the path a user takes, then each app node</text>

  <!-- ==================== LEFT COLUMN: verify.yml ==================== -->
  <g id="box-verify-yml">
    <rect x="50" y="105" width="430" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Verification Shield Icon (56px) -->
    <g transform="translate(75, 120)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z"/>
      <polyline points="18,28 25,35 38,20"/>
    </g>
    <!-- Title -->
    <text x="155" y="159" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">verify.yml</text>
  </g>

  <!-- ==================== STEP 1 BOX ==================== -->
  <g id="step-1">
    <rect x="50" y="225" width="430" height="470" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Number circle 1 -->
    <circle cx="95" cy="270" r="24" fill="#207448"/>
    <text x="95" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <!-- Globe / HTTPS endpoint icon (56px) -->
    <g transform="translate(135, 242)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <path d="M 28 6 C 36 14, 40 22, 40 28 C 40 34, 36 42, 28 50"/>
      <path d="M 28 6 C 20 14, 16 22, 16 28 C 16 34, 20 42, 28 50"/>
    </g>
    <!-- Step 1 Title -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="210" y="268">HTTPS endpoint</tspan>
      <tspan x="210" y="304">answers</tspan>
    </text>
    <!-- Monospace code box -->
    <rect x="75" y="340" width="380" height="155" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="95" y="385">https://</tspan>
      <tspan x="95" y="423">{{ nginx_server_name }}</tspan>
      <tspan x="95" y="461">/readyz</tspan>
    </text>
    <!-- Note -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" y="555">the path a user takes,</tspan>
      <tspan x="75" y="595">delegated to localhost</tspan>
    </text>
  </g>

  <!-- Arrow from Step 1 to nginx -->
  <line x1="480" y1="460" x2="535" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== NGINX BOX ==================== -->
  <g id="box-nginx">
    <rect x="535" y="390" width="160" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Router icon (56px) -->
    <g transform="translate(587, 408)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="16" width="48" height="26" rx="4"/>
      <line x1="14" y1="29" x2="20" y2="29"/>
      <line x1="26" y1="29" x2="32" y2="29"/>
      <line x1="38" y1="29" x2="44" y2="29"/>
      <line x1="16" y1="16" x2="16" y2="8"/>
      <circle cx="16" cy="6" r="2" fill="#207448"/>
      <line x1="40" y1="16" x2="40" y2="8"/>
      <circle cx="40" cy="6" r="2" fill="#207448"/>
    </g>
    <!-- Label -->
    <text x="615" y="504" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">nginx</text>
  </g>

  <!-- Arrow from nginx to Step 2 -->
  <line x1="695" y1="460" x2="750" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== STEP 2 BOX ==================== -->
  <g id="step-2">
    <rect x="750" y="225" width="400" height="470" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Number circle 2 -->
    <circle cx="795" cy="270" r="24" fill="#207448"/>
    <text x="795" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <!-- Assert / Checkmark icon (56px) -->
    <g transform="translate(835, 242)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <polyline points="16,28 25,37 40,18"/>
    </g>
    <!-- Step 2 Title -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="775" y="342">Version served matches</tspan>
      <tspan x="775" y="378">what we deployed</tspan>
    </text>
    <!-- Monospace check badge -->
    <rect x="775" y="415" width="220" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="885" y="450" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">app_version</text>
    <!-- Note -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="775" y="525">the assert compares the</tspan>
      <tspan x="775" y="562">served version with</tspan>
      <tspan x="775" y="599">the pinned one</tspan>
    </text>
  </g>

  <!-- Arrow from Step 2 to Step 3 -->
  <line x1="1150" y1="460" x2="1205" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- ==================== STEP 3 BOX ==================== -->
  <g id="step-3">
    <rect x="1205" y="225" width="345" height="470" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <!-- Number circle 3 -->
    <circle cx="1250" cy="270" r="24" fill="#207448"/>
    <text x="1250" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <!-- Cluster node / direct query icon (56px) -->
    <g transform="translate(1290, 242)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="20" rx="4"/>
      <rect x="6" y="34" width="44" height="14" rx="4"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <circle cx="22" cy="18" r="2" fill="#207448"/>
      <line x1="32" y1="18" x2="42" y2="18"/>
    </g>
    <!-- Step 3 Title -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="1225" y="342">Every app node</tspan>
      <tspan x="1225" y="378">reports ready (direct)</tspan>
    </text>
    <!-- Monospace code box -->
    <rect x="1225" y="415" width="305" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1242" y="458">http://{{</tspan>
      <tspan x="1242" y="498">hostvars[item]</tspan>
      <tspan x="1242" y="538">['ansible_host'] }}:</tspan>
      <tspan x="1242" y="578">{{ app_port }}/readyz</tspan>
    </text>
  </g>

  <!-- ==================== STEP 3 FAN-OUT (ORANGE HIGHLIGHT) ==================== -->
  <g id="fan-out-connections">
    <!-- Fan-out trunk down from Step 3 -->
    <line x1="1377" y1="695" x2="1377" y2="745" stroke="#db8129" stroke-width="4"/>
    <!-- Branch to app01 (left and down) -->
    <path d="M 1377 745 L 1195 745 L 1195 780" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <!-- Branch to app02 (right and down) -->
    <path d="M 1377 745 L 1435 745 L 1435 780" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- Orange Callout Banner for Step 3 Fan-Out -->
  <g id="orange-highlight-label">
    <rect x="50" y="780" width="985" height="110" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <!-- Orange Alert Icon (56px) -->
    <g transform="translate(75, 807)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <line x1="28" y1="16" x2="28" y2="30"/>
      <circle cx="28" cy="38" r="2" fill="#db8129"/>
    </g>
    <!-- Label -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="150" y="828">a single broken host is found even when</tspan>
      <tspan x="150" y="866">nginx would have routed around it</tspan>
    </text>
    <!-- Connector from orange callout to fan-out trunk -->
    <line x1="1035" y1="835" x2="1080" y2="835" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  <!-- ==================== APP NODES ==================== -->
  <!-- app01 -->
  <g id="box-app01">
    <rect x="1080" y="780" width="230" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1096, 796)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="36" height="24" rx="3"/>
      <circle cx="8" cy="16" r="2" fill="#207448"/>
      <line x1="16" y1="16" x2="30" y2="16"/>
    </g>
    <text x="1150" y="825" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">app01</text>
    <text x="1096" y="865" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">asked directly</text>
  </g>

  <!-- app02 -->
  <g id="box-app02">
    <rect x="1320" y="780" width="230" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1336, 796)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="36" height="24" rx="3"/>
      <circle cx="8" cy="16" r="2" fill="#207448"/>
      <line x1="16" y1="16" x2="30" y2="16"/>
    </g>
    <text x="1390" y="825" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">app02</text>
    <text x="1336" y="865" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">asked directly</text>
  </g>

  <!-- ==================== TAKEAWAY BAR ==================== -->
  <g id="takeaway-bar">
    <rect x="50" y="940" width="1500" height="60" rx="10" fill="#207448"/>
    <text x="800" y="978" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Modules verify state, while uri and assert verify behaviour, and you need both.</text>
  </g>
</svg>