<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A common frame</title>
  <desc>Architecture comparison of BeeGFS, IBM Storage Scale / GPFS, WEKA, and VAST Data storage systems.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A common frame</text>

  
  <g id="subgraph-beegfs">
    
    <rect x="50" y="130" width="730" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(75, 152)">
      <ellipse cx="28" cy="12" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 4 12 V 44 C 4 52 52 52 52 44 V 12" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 4 28 C 4 36 52 36 52 28" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="28" y1="20" x2="28" y2="48" stroke="#207448" stroke-width="3" stroke-dasharray="4 3"/>
    </g>

    
    <text x="145" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">BeeGFS (Sharded Meta + Storage)</text>

    
    <rect x="75" y="235" width="680" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="415" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">mgmtd + meta servers + storage targets</text>
    <text x="415" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">(+ BeeOND job-local NVMe scratch)</text>
  </g>

  
  <g id="subgraph-gpfs">
    
    <rect x="820" y="130" width="730" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(845, 152)">
      <rect x="8" y="22" width="40" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 16 22 V 14 A 12 12 0 0 1 40 14 V 22" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="34" r="4" fill="#207448"/>
      <line x1="28" y1="38" x2="28" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="915" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">IBM Storage Scale / GPFS</text>

    
    <rect x="845" y="235" width="680" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">Distributed Metadata + Token Lock Manager</text>
    <text x="1185" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">+ NSD Servers / ESS Declustered RAID</text>
  </g>

  
  <g id="subgraph-weka">
    
    <rect x="50" y="550" width="730" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(75, 572)">
      <rect x="6" y="6" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 30 12 L 18 28 L 27 28 L 22 44 L 38 24 L 28 24 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    </g>

    
    <text x="145" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">WEKA (WekaFS)</text>

    
    <rect x="75" y="655" width="680" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="415" y="755" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">User-Space DPDK/SPDK Data Plane</text>
    <text x="415" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">Distributed Meta/Data (N+2/N+4) + S3 Tier</text>
  </g>

  
  <g id="subgraph-vast">
    
    <rect x="820" y="550" width="730" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(845, 572)">
      
      <rect x="4" y="6" width="18" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="34" y="6" width="18" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      
      <line x1="13" y1="18" x2="13" y2="28" stroke="#db8129" stroke-width="3"/>
      <line x1="43" y1="18" x2="43" y2="28" stroke="#db8129" stroke-width="3"/>
      <line x1="8" y1="28" x2="48" y2="28" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="28" x2="28" y2="38" stroke="#db8129" stroke-width="3"/>
      
      <rect x="8" y="38" width="40" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="915" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">VAST Data (DASE)</text>

    
    <rect x="845" y="655" width="680" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="755" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">Stateless CNodes -&gt; NVMe-oF Fabric</text>
    <text x="1185" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="500" fill="#303a36">-&gt; Shared-Everything QLC/SCM DBoxes</text>
  </g>
</svg>