<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <title>Node roles: control, compute, login, service, and storage</title>
  <desc>Visual infographic explaining HPC and AI cluster node roles and their relationships.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Node roles: control, compute, login, service, and storage</text>

  
  <path d="M 420 975 H 120 A 20 20 0 0 1 100 955 V 475 A 20 20 0 0 1 120 455 H 340" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10,8"/>

  
  <path d="M 1300 975 H 1480 A 20 20 0 0 0 1500 955 V 475 A 20 20 0 0 0 1480 455 H 1440" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10,8"/>

  
  <line x1="560" y1="625" x2="560" y2="545" stroke="#207448" stroke-width="4"/>

  
  <line x1="1160" y1="625" x2="1160" y2="545" stroke="#207448" stroke-width="4"/>

   Sched (Login nodes to Control node) -->
  <line x1="560" y1="285" x2="560" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1160" y1="365" x2="1160" y2="285" stroke="#207448" stroke-width="4"/>

  
  <line x1="780" y1="200" x2="880" y2="200" stroke="#207448" stroke-width="4"/>

   Compute (Primary Job Dispatch: Single Orange Accent) -->
  <line x1="780" y1="455" x2="880" y2="455" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

   Login -->
  <line x1="240" y1="200" x2="340" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="245" y="158" width="90" height="32" rx="4" fill="#f5f8f5"/>
  <text x="290" y="182" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ssh, web</text>

  
  <circle cx="180" cy="200" r="60" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="180" cy="172" r="13"/>
    <path d="M 160 205 A 20 16 0 0 1 200 205"/>
  </g>
  <text x="180" y="238" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">User</text>

  
  <rect x="340" y="115" width="440" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="532" y="132" width="56" height="42" rx="6"/>
    <polyline points="544,147 553,153 544,161"/>
    <line x1="559" y1="161" x2="572" y2="161"/>
  </g>
  <text x="560" y="225" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Login and access nodes</text>

  
  <rect x="880" y="115" width="560" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="1160" cy="140" rx="26" ry="8"/>
    <path d="M 1134 140 V 166 C 1134 171 1146 175 1160 175 C 1174 175 1186 171 1186 166 V 140"/>
    <path d="M 1134 153 C 1134 158 1146 162 1160 162 C 1174 162 1186 158 1186 153"/>
  </g>
  <text x="1160" y="218" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1160" dy="0" font-size="30" font-weight="bold">Shared storage:</tspan>
    <tspan x="1160" dy="37" font-size="24">home, scratch, checkpoints</tspan>
  </text>

  
  <rect x="340" y="365" width="440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="532" y="382" width="56" height="44" rx="5"/>
    <line x1="532" y1="404" x2="588" y2="404"/>
    <circle cx="544" cy="393" r="2.5" fill="#207448"/>
    <circle cx="554" cy="393" r="2.5" fill="#207448"/>
    <circle cx="544" cy="415" r="2.5" fill="#207448"/>
    <circle cx="554" cy="415" r="2.5" fill="#207448"/>
    <line x1="566" y1="393" x2="578" y2="393" stroke-width="3"/>
    <line x1="566" y1="415" x2="578" y2="415" stroke-width="3"/>
  </g>
  <text x="560" y="475" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="560" dy="0" font-size="30" font-weight="bold">Control / head node:</tspan>
    <tspan x="560" dy="37" font-size="24">scheduler, DB, images</tspan>
  </text>

  
  <rect x="880" y="365" width="560" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <rect x="1136" y="382" width="48" height="44" rx="4"/>
    <rect x="1147" y="393" width="26" height="22" rx="2"/>
    <line x1="1146" y1="375" x2="1146" y2="382"/>
    <line x1="1160" y1="375" x2="1160" y2="382"/>
    <line x1="1174" y1="375" x2="1174" y2="382"/>
    <line x1="1146" y1="426" x2="1146" y2="433"/>
    <line x1="1160" y1="426" x2="1160" y2="433"/>
    <line x1="1174" y1="426" x2="1174" y2="433"/>
    <line x1="1129" y1="394" x2="1136" y2="394"/>
    <line x1="1129" y1="404" x2="1136" y2="404"/>
    <line x1="1129" y1="414" x2="1136" y2="414"/>
    <line x1="1184" y1="394" x2="1191" y2="394"/>
    <line x1="1184" y1="404" x2="1191" y2="404"/>
    <line x1="1184" y1="414" x2="1191" y2="414"/>
  </g>
  <text x="1160" y="475" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1160" dy="0" font-size="30" font-weight="bold">Compute field:</tspan>
    <tspan x="1160" dy="37" font-size="24">CPU and GPU nodes</tspan>
  </text>

  
  <rect x="420" y="625" width="880" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="860" cy="658" r="9"/>
    <circle cx="860" cy="658" r="18" stroke-width="7" stroke-dasharray="10,4.14"/>
  </g>
  <text x="860" y="735" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="860" dy="0" font-size="30" font-weight="bold">Service nodes:</tspan>
    <tspan x="860" dy="37" font-size="24">DNS, DHCP, NTP, LDAP, license, build</tspan>
  </text>

  
  <rect x="420" y="885" width="880" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="832" y="904" width="56" height="28" rx="4"/>
    <rect x="840" y="912" width="7" height="11" rx="1" fill="#207448"/>
    <rect x="851" y="912" width="7" height="11" rx="1" fill="#207448"/>
    <rect x="862" y="912" width="7" height="11" rx="1" fill="#207448"/>
    <rect x="873" y="912" width="7" height="11" rx="1" fill="#207448"/>
  </g>
  <text x="860" y="995" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="860" dy="0" font-size="30" font-weight="bold">Out-of-band management:</tspan>
    <tspan x="860" dy="37" font-size="24">BMC, PDU, switches</tspan>
  </text>
</svg>