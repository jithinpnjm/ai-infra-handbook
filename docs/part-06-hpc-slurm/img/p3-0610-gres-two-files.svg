<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Where Slurm learns about GPUs: two files and slurmd -G</title>
  <desc>Visual explanation of where Slurm learns about GPUs via slurm.conf and gres.conf merging into slurmctld, verified by slurmd -G.</desc>
  <defs>
    <marker id="arr-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">Where Slurm learns about GPUs: </tspan><tspan x="800" dy="54">two files and slurmd -G</tspan></text>

  
  <g id="def-card">
    <rect x="40" y="186" width="1520" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 210)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="#ffffff" />
      <line x1="18" y1="2" x2="18" y2="8" />
      <line x1="28" y1="2" x2="28" y2="8" />
      <line x1="38" y1="2" x2="38" y2="8" />
      <line x1="18" y1="48" x2="18" y2="54" />
      <line x1="28" y1="48" x2="28" y2="54" />
      <line x1="38" y1="48" x2="38" y2="54" />
      <circle cx="28" cy="28" r="8" stroke-width="3" />
    </g>
    <text x="145" y="228" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="145" dy="0">a GRES is a consumable resource other than CPU and memory: Slurm keeps a count and </tspan><tspan x="145" dy="34">subtracts what each job takes; also licences, network devices, burst buffers</tspan></text>
  </g>

  
  <g id="box-slurm-conf">
    <rect x="40" y="336" width="740" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(65, 360)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 4 L 34 4 L 46 16 L 46 52 L 10 52 Z" fill="#e8f1ea" />
      <polyline points="34,4 34,16 46,16" />
      <line x1="18" y1="26" x2="38" y2="26" stroke-width="3" />
      <line x1="18" y1="34" x2="38" y2="34" stroke-width="3" />
      <line x1="18" y1="42" x2="30" y2="42" stroke-width="3" />
    </g>
    <text x="145" y="376" font-family="monospace" font-size="24" fill="#303a36"><tspan x="145" dy="0">slurm.conf: declares for </tspan><tspan x="145" dy="34">the whole cluster: </tspan><tspan x="145" dy="34">GresTypes=gpu,shard; </tspan><tspan x="145" dy="34">AccountingStorageTRES=gres/gpu,</tspan><tspan x="145" dy="34">gres/gpu:h100; </tspan><tspan x="145" dy="34">NodeName=gpu[01-16] </tspan><tspan x="145" dy="34">Gres=gpu:h100:8 (name, type, count)</tspan></text>
  </g>

  
  <g id="box-gres-conf">
    <rect x="820" y="336" width="740" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(845, 360)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="44" rx="5" fill="#e8f1ea" />
      <line x1="16" y1="18" x2="40" y2="18" stroke-width="3" />
      <line x1="16" y1="26" x2="32" y2="26" stroke-width="3" />
      <rect x="18" y="34" width="20" height="10" rx="2" stroke-width="2" />
    </g>
    <text x="925" y="376" font-family="monospace" font-size="24" fill="#303a36"><tspan x="925" dy="0">gres.conf: describes devices on </tspan><tspan x="925" dy="34">each node: device files, types, </tspan><tspan x="925" dy="34">CPU affinity, links; can be </tspan><tspan x="925" dy="34">minimal if slurm.conf already </tspan><tspan x="925" dy="34">gives name and count</tspan></text>
  </g>

  
  <line x1="410" y1="621" x2="410" y2="684" stroke="#207448" stroke-width="3.5" marker-end="url(#arr-green)" />

  
  <line x1="1190" y1="621" x2="1190" y2="684" stroke="#207448" stroke-width="3.5" marker-end="url(#arr-green)" />

  
  <g id="box-slurmctld">
    <rect x="40" y="686" width="1520" height="104" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(65, 710)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10" stroke-width="3" fill="#e8f1ea" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12.5 12.5 L 16.7 16.7 M 39.3 39.3 L 43.5 43.5 M 12.5 43.5 L 16.7 39.3 M 39.3 16.7 L 43.5 12.5" />
    </g>
    <text x="145" y="728" font-family="monospace" font-size="24" fill="#303a36"><tspan x="145" dy="0">slurmctld with select/cons_tres </tspan><tspan x="145" dy="34">tracks GRES, NUMA sockets and NVLink</tspan></text>
  </g>

  
  <line x1="800" y1="790" x2="800" y2="854" stroke="#db8129" stroke-width="4" marker-end="url(#arr-orange)" />

  
  <g id="box-verification">
    <rect x="40" y="856" width="1520" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(65, 880)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="5" fill="#ffffff" />
      <path d="M 14 22 L 22 28 L 14 34" stroke-width="3.5" />
      <line x1="26" y1="34" x2="36" y2="34" stroke-width="3.5" />
    </g>
    <text x="145" y="896" font-family="monospace" font-size="24" fill="#303a36"><tspan x="145" dy="0">slurmd -G on the GPU node prints the GRES configuration </tspan><tspan x="145" dy="34">(slurm.conf GRES merged with gres.conf for this node) and exits; </tspan><tspan x="145" dy="34">check for each device: type matches the product you bought, </tspan><tspan x="145" dy="34">file list covers every GPU in the box, cores belong </tspan><tspan x="145" dy="34">to the socket the GPU is attached to</tspan></text>
  </g>
</svg>