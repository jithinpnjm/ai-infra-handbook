<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Nine levels of parallelism from memory banks to many servers</title>
  <desc>Visual infographic explaining the nine hardware and software levels of parallelism, side examples, debugging rule, and performance warning.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Nine levels of parallelism from memory banks to many servers</text>

  
  <rect x="40" y="105" width="880" height="560" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="40" y="105" width="100" height="42" rx="8" fill="#207448"/>
  <text x="90" y="136" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">HW</text>

  
  <rect x="58" y="155" width="844" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 169)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="44" height="32" rx="3"/>
    <rect x="7" y="12" width="7" height="14" fill="#207448"/>
    <rect x="20" y="12" width="7" height="14" fill="#207448"/>
    <rect x="33" y="12" width="7" height="14" fill="#207448"/>
    <line x1="10" y1="38" x2="10" y2="42"/>
    <line x1="17" y1="38" x2="17" y2="42"/>
    <line x1="24" y1="38" x2="24" y2="42"/>
    <line x1="31" y1="38" x2="31" y2="42"/>
    <line x1="38" y1="38" x2="38" y2="42"/>
  </g>
  <text x="145" y="187" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">1 multiple memory banks working</tspan>
    <tspan x="145" dy="34">independently across channels</tspan>
  </text>

  
  <rect x="58" y="236" width="844" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 243)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="4" width="20" height="9" rx="2"/>
    <rect x="9" y="18" width="30" height="10" rx="2"/>
    <rect x="4" y="33" width="40" height="11" rx="2"/>
    <line x1="24" y1="13" x2="24" y2="18"/>
    <line x1="24" y1="28" x2="24" y2="33"/>
  </g>
  <text x="145" y="275" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">2 multiline CPU cache hierarchies</text>

  
  <rect x="58" y="301" width="844" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 308)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="18" height="28" rx="2"/>
    <rect x="26" y="8" width="18" height="28" rx="2"/>
    <line x1="22" y1="16" x2="26" y2="16"/>
    <line x1="22" y1="22" x2="26" y2="22"/>
    <line x1="22" y1="28" x2="26" y2="28"/>
    <circle cx="13" cy="22" r="3" fill="#207448"/>
    <circle cx="35" cy="22" r="3" fill="#207448"/>
  </g>
  <text x="145" y="340" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">3 multiple CPUs on a motherboard</text>

  
  <rect x="58" y="366" width="844" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 373)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="40" height="40" rx="3"/>
    <rect x="9" y="9" width="12" height="12" rx="1"/>
    <rect x="27" y="9" width="12" height="12" rx="1"/>
    <rect x="9" y="27" width="12" height="12" rx="1"/>
    <rect x="27" y="27" width="12" height="12" rx="1"/>
  </g>
  <text x="145" y="405" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">4 multiple CPU cores inside one chip</text>

  
  <rect x="58" y="431" width="844" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 445)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="4,6 18,6 24,16 30,6 44,6 36,38 12,38"/>
    <line x1="20" y1="38" x2="20" y2="44"/>
    <line x1="28" y1="38" x2="28" y2="44"/>
  </g>
  <text x="145" y="463" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">5 multiple functional execution</tspan>
    <tspan x="145" dy="34">devices inside one core</tspan>
  </text>

  
  <rect x="58" y="512" width="844" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 519)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="38" height="28" rx="2"/>
    <circle cx="23" cy="20" r="8"/>
    <line x1="4" y1="34" x2="16" y2="34"/>
    <line x1="8" y1="34" x2="8" y2="42"/>
    <line x1="12" y1="34" x2="12" y2="42"/>
    <line x1="42" y1="4" x2="42" y2="38"/>
  </g>
  <text x="145" y="551" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">6 accelerators such as GPUs and FPGAs</text>

  
  <rect x="58" y="577" width="844" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 591)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="34" height="26" rx="2"/>
    <rect x="2" y="14" width="6" height="14"/>
    <line x1="18" y1="34" x2="32" y2="34"/>
    <line x1="22" y1="34" x2="22" y2="40"/>
    <line x1="28" y1="34" x2="28" y2="40"/>
    <path d="M 20 21 Q 25 15 30 21"/>
  </g>
  <text x="145" y="609" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">7 network devices with DMA and</tspan>
    <tspan x="145" dy="34">protocol offloading</tspan>
  </text>

  
  <rect x="40" y="685" width="880" height="353" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="40" y="685" width="100" height="42" rx="8" fill="#207448"/>
  <text x="90" y="716" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">SW</text>

  
  <rect x="58" y="735" width="844" height="124" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 773)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="24" r="5" fill="#207448"/>
    <path d="M 13 24 Q 22 10 32 10 T 44 10"/>
    <path d="M 13 24 Q 22 24 32 24 T 44 24"/>
    <path d="M 13 24 Q 22 38 32 38 T 44 38"/>
  </g>
  <text x="145" y="771" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">8 multiple UNIX processes and</tspan>
    <tspan x="145" dy="34">threads on one server, such as</tspan>
    <tspan x="145" dy="34">OpenMP threads in one process</tspan>
  </text>

  
  <rect x="58" y="871" width="844" height="152" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(74, 923)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="40" height="14" rx="2"/>
    <circle cx="36" cy="11" r="2" fill="#207448"/>
    <rect x="4" y="26" width="40" height="14" rx="2"/>
    <circle cx="36" cy="33" r="2" fill="#207448"/>
    <line x1="16" y1="18" x2="16" y2="26"/>
    <line x1="28" y1="18" x2="28" y2="26"/>
  </g>
  <text x="145" y="907" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">9 multiple servers running one</tspan>
    <tspan x="145" dy="34">parallel program using MPI for</tspan>
    <tspan x="145" dy="34">message passing, plus CUDA or</tspan>
    <tspan x="145" dy="34">OpenACC on accelerators</tspan>
  </text>

  

  
  <rect x="940" y="105" width="620" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(962, 143)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="6" height="40" rx="1"/>
    <rect x="14" y="4" width="6" height="40" rx="1"/>
    <rect x="24" y="4" width="6" height="40" rx="1"/>
    <rect x="34" y="4" width="6" height="40" rx="1"/>
  </g>
  <text x="1030" y="145" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1030" dy="0">four memory slots of 8 GB,</tspan>
    <tspan x="1030" dy="32">one per bank, beat a</tspan>
    <tspan x="1030" dy="32">single module</tspan>
  </text>

  
  <rect x="940" y="246" width="620" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(962, 329)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="12" height="34" rx="2"/>
    <rect x="18" y="6" width="12" height="34" rx="2"/>
    <rect x="34" y="6" width="12" height="34" rx="2"/>
    <polyline points="6,2 8,6 10,2"/>
    <polyline points="22,2 24,6 26,2"/>
    <polyline points="38,2 40,6 42,2"/>
  </g>
  <text x="1030" y="284" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1030" dy="0">pipelining cuts an operation into</tspan>
    <tspan x="1030" dy="32">stages with hardware per stage:</tspan>
    <tspan x="1030" dy="32">a car factory welds, paints, fits</tspan>
    <tspan x="1030" dy="32">seats; total cycles = K times</tspan>
    <tspan x="1030" dy="32">(N minus 1) plus S</tspan>
  </text>

  
  <rect x="940" y="477" width="620" height="345" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(962, 626)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="20"/>
    <line x1="8" y1="24" x2="40" y2="24"/>
    <line x1="24" y1="8" x2="24" y2="40"/>
    <circle cx="24" cy="24" r="6" fill="#207448"/>
  </g>
  <text x="1030" y="513" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1030" dy="0">parallel job slow but MPI starts</tspan>
    <tspan x="1030" dy="32">without errors: walk down the list;</tspan>
    <tspan x="1030" dy="32">classic culprit near the bottom</tspan>
    <tspan x="1030" dy="32">is MPI configured to send</tspan>
    <tspan x="1030" dy="32">messages over the slow Ethernet</tspan>
    <tspan x="1030" dy="32">management network instead of</tspan>
    <tspan x="1030" dy="32">the fast fabric</tspan>
  </text>

  
  <rect x="940" y="838" width="620" height="200" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(962, 914)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="24,4 46,42 2,42"/>
    <line x1="24" y1="18" x2="24" y2="28"/>
    <circle cx="24" cy="35" r="2" fill="#db8129"/>
  </g>
  <text x="1030" y="880" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1030" dy="0">parallel is not always faster:</tspan>
    <tspan x="1030" dy="32">threads can fight over the</tspan>
    <tspan x="1030" dy="32">same memory and defeat</tspan>
    <tspan x="1030" dy="32">the cache</tspan>
  </text>
</svg>