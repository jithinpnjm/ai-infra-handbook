<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>A job sees its GPUs renumbered from zero</title>
  <desc>Infographic demonstrating how Slurm and Linux cgroups constrain physical GPUs and expose renumbered GPU devices to job tasks.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-thin" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">A job sees its GPUs renumbered from zero</text>

  
  
  
  <rect x="40" y="125" width="570" height="540" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />

  
  <g transform="translate(65, 148)">
    <rect x="0" y="0" width="38" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="8" y1="10" x2="14" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="16" x2="14" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="22" x2="14" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="27" cy="16" r="3" fill="#207448" />
  </g>
  <text x="118" y="173" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">gpu node</text>

  
  
  <rect x="58" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(78, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 87, 400)" x="87" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia0</text>

  
  <rect x="124" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(144, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 153, 400)" x="153" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia1</text>

  
  <rect x="190" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(210, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 219, 400)" x="219" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia2</text>

  
  <rect x="256" y="210" width="58" height="330" rx="6" fill="#207448" stroke="#165333" stroke-width="2.5" />
  <text transform="rotate(-90, 285, 275)" x="285" y="275" font-family="sans-serif" font-weight="bold" font-size="24" fill="#a8e8c3" text-anchor="middle">allocated</text>
  <text transform="rotate(-90, 285, 435)" x="285" y="435" font-family="monospace" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">/dev/nvidia3</text>

  
  <rect x="322" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(342, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 351, 400)" x="351" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia4</text>

  
  <rect x="388" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(408, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 417, 400)" x="417" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia5</text>

  
  <rect x="454" y="210" width="58" height="330" rx="6" fill="#e9ece9" stroke="#9aa8a0" stroke-width="2" />
  <g transform="translate(474, 226)">
    <rect x="0" y="7" width="18" height="14" rx="2" fill="#71877b" />
    <path d="M 3 7 V 4 a 6 6 0 0 1 12 0 v 3" fill="none" stroke="#71877b" stroke-width="2.5" />
  </g>
  <text transform="rotate(-90, 483, 400)" x="483" y="400" font-family="monospace" font-size="24" fill="#4a5851" text-anchor="middle">/dev/nvidia6</text>

  
  <rect x="520" y="210" width="58" height="330" rx="6" fill="#207448" stroke="#165333" stroke-width="2.5" />
  <text transform="rotate(-90, 549, 275)" x="549" y="275" font-family="sans-serif" font-weight="bold" font-size="24" fill="#a8e8c3" text-anchor="middle">allocated</text>
  <text transform="rotate(-90, 549, 435)" x="549" y="435" font-family="monospace" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">/dev/nvidia7</text>

  
  <path d="M 58 550 v 8 h 190 v -8" fill="none" stroke="#71877b" stroke-width="2" />
  <path d="M 322 550 v 8 h 190 v -8" fill="none" stroke="#71877b" stroke-width="2" />
  <path d="M 153 558 v 10 h 264 v -10" fill="none" stroke="#71877b" stroke-width="2" />
  <path d="M 285 568 v 12" fill="none" stroke="#71877b" stroke-width="2" />

  
  <text x="325" y="612" text-anchor="middle" font-family="monospace" font-size="24" fill="#4a5851">hidden by ConstrainDevices=yes</text>

  
  <text x="325" y="705" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">the cgroup exposes /dev/nvidia3 and /dev/nvidia7</text>

  
  
  
  
  <path d="M 285 210 V 162 H 549 V 210" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 549 162 H 635 V 425 H 670" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="680" y="365" width="280" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(805, 382)">
    <circle cx="15" cy="15" r="7" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 15 3 v 4 M 15 23 v 4 M 3 15 h 4 M 23 15 h 4 M 6.5 6.5 l 3 3 M 20.5 20.5 l 3 3 M 6.5 23.5 l 3 -3 M 20.5 9.5 l 3 -3" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="820" y="450" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SLURM_JOB_GPUS=3,7</text>

  
  
  
  
  
  <path d="M 960 425 H 995 V 295 H 1178" fill="none" stroke="#207448" stroke-width="2" marker-end="url(#arrow-thin)" />
  
  <path d="M 960 425 H 995 V 555 H 1178" fill="none" stroke="#207448" stroke-width="2" marker-end="url(#arrow-thin)" />

  
  <rect x="1005" y="392" width="160" height="66" rx="8" fill="#db8129" />
  <text x="1085" y="419" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">relative to</text>
  <text x="1085" y="447" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the job</text>

  
  
  
  
  <rect x="1190" y="130" width="370" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1375" y="165" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">--gpus-per-task=1</text>

  
  <rect x="1190" y="214" width="370" height="162" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1215" y="250" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Task 0</text>
  <text x="1375" y="296" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">CUDA_VISIBLE_DEVICES=0</text>
  <rect x="1265" y="322" width="220" height="38" rx="6" fill="#e8f1ea" />
  <text x="1375" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">physical GPU 3</text>

  
  <rect x="1190" y="474" width="370" height="162" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1215" y="510" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Task 1</text>
  <text x="1375" y="556" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">CUDA_VISIBLE_DEVICES=1</text>
  <rect x="1265" y="582" width="220" height="38" rx="6" fill="#e8f1ea" />
  <text x="1375" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">physical GPU 7</text>

  
  
  
  <rect x="40" y="805" width="1520" height="76" rx="12" fill="#207448" />
  <text x="800" y="852" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">The job sees a renumbered world, so scripts should follow the renumbering, not the physical labels.</text>
</svg>