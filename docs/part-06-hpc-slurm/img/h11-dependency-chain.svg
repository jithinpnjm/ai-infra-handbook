<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">A training run split across segments, then evaluated</title>
  <desc id="diagramDesc">A left-to-right chain of three jobs: J1 runs train segment 1 with train.sh, J2 runs train segment 2 and resumes from the latest checkpoint with train.sh, and J3 evaluates with evaluate.sh. An afterany dependency links J1 to J2; an afterok dependency links J2 to J3. An orange-bordered note explains DependencyNeverSatisfied, and a green bar gives the takeaway.</desc>

  <defs>
    <marker id="arrowHead" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L17 9 L1 17 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f5f8f5"/>

  <text font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#303a36" text-anchor="middle">
    <tspan x="800" y="78">A training run split across segments,</tspan>
    <tspan x="800" y="134">then evaluated</tspan>
  </text>

  
  <circle cx="215" cy="196" r="24" fill="#207448"/>
  <text x="215" y="205" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="800" cy="196" r="24" fill="#207448"/>
  <text x="800" y="205" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="1385" cy="196" r="24" fill="#207448"/>
  <text x="1385" y="205" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  
  <rect x="50" y="236" width="330" height="274" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="635" y="236" width="330" height="274" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="1220" y="236" width="330" height="274" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <text x="74" y="290" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#303a36">J1</text>
  <g transform="translate(74,310)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 2 H34 L54 22 V54 H2 Z"/>
    <path d="M34 2 V22 H54"/>
    <path d="M13 34 L19 40 L13 46"/>
    <path d="M26 46 H41"/>
  </g>
  <text x="170" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#303a36">train.sh</text>
  <text x="74" y="444" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">train segment 1</text>

  
  <text x="659" y="290" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#303a36">J2</text>
  <g transform="translate(659,310)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 2 H34 L54 22 V54 H2 Z"/>
    <path d="M34 2 V22 H54"/>
    <path d="M13 34 L19 40 L13 46"/>
    <path d="M26 46 H41"/>
  </g>
  <text x="755" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#303a36">train.sh</text>
  <text x="659" y="412" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">train segment 2</text>
  <text x="659" y="446" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">resumes from</text>
  <text x="659" y="480" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">latest checkpoint</text>

  
  <text x="1244" y="290" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#303a36">J3</text>
  <g transform="translate(1244,310)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2 2 H34 L54 22 V54 H2 Z"/>
    <path d="M34 2 V22 H54"/>
    <path d="M13 34 L19 40 L13 46"/>
    <path d="M26 46 H41"/>
  </g>
  <text x="1340" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#303a36">evaluate.sh</text>
  <text x="1244" y="444" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">evaluate</text>

  
  <line x1="380" y1="376" x2="635" y2="376" stroke="#207448" stroke-width="4" marker-end="url(#arrowHead)"/>
  <line x1="965" y1="376" x2="1220" y2="376" stroke="#207448" stroke-width="4" marker-end="url(#arrowHead)"/>

  
  <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="507" y="306">--dependency=</tspan>
    <tspan x="507" y="338">afterany:$J1</tspan>
  </text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1092" y="306">--dependency=</tspan>
    <tspan x="1092" y="338">afterok:$J2</tspan>
  </text>

  
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4a5852" text-anchor="middle">
    <tspan x="507" y="546">a timeout counts as a failure,</tspan>
    <tspan x="507" y="576">so afterany lets the chain continue.</tspan>
  </text>
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4a5852" text-anchor="middle">
    <tspan x="1092" y="546">the evaluation runs only</tspan>
    <tspan x="1092" y="576">if segment 2 succeeds.</tspan>
  </text>

  
  <rect x="490" y="610" width="620" height="232" rx="14" fill="#fdf6ec" stroke="#db8129" stroke-width="3"/>
  <text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="514" y="674">if a job with afterok fails, the</tspan>
    <tspan x="514" y="708">dependent job stays pending with</tspan>
    <tspan x="514" y="742">DependencyNeverSatisfied; add</tspan>
    <tspan x="514" y="776" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--kill-on-invalid-dep=yes</tspan>
    <tspan x="514" y="810">to cancel it instead.</tspan>
  </text>

  
  <rect x="50" y="870" width="1500" height="68" rx="12" fill="#207448"/>
  <text x="800" y="912" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">Each segment resumes from the latest checkpoint, so no work repeats.</text>
</svg>