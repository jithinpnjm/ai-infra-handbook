<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>Slinky: slurm-operator</title>
  <desc>Comparison of SchedMD Slinky (slurm-operator) and Nebius Soperator (SlurmCluster) architectures</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="950" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Slinky: slurm-operator</text>

  
  <g id="subgraph-slinky">
    
    <rect x="60" y="110" width="710" height="780" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="60" y="110" width="710" height="64" rx="16" fill="#207448" />
    <rect x="60" y="150" width="710" height="24" fill="#207448" />
    <text x="415" y="154" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">SchedMD Slinky (slurm-operator)</text>

    
    <rect x="110" y="215" width="610" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(387, 235)">
      <path d="M28 8 L33 13 L40 11 L43 18 L50 20 L49 28 L54 33 L49 38 L50 46 L43 48 L40 55 L33 53 L28 58 L23 53 L16 55 L13 48 L6 46 L7 38 L2 33 L7 28 L6 20 L13 18 L16 11 L23 13 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="28" cy="33" r="8" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="415" y="340" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Slinky Operator</text>
    <text x="415" y="378" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">K8s Cordon &lt;-&gt; slurm-operator: Drain</text>

    
    <line x1="415" y1="400" x2="415" y2="486" stroke="#db8129" stroke-width="3" />
    <rect x="250" y="486" width="330" height="46" rx="23" fill="#db8129" />
    <text x="415" y="518" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">JWT via slurmrestd</text>
    <line x1="415" y1="532" x2="415" y2="618" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="110" y="620" width="610" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(387, 638)">
      <path d="M10 4 L36 4 L46 14 L46 52 L10 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M36 4 L36 14 L46 14" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="18" y1="24" x2="38" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="34" x2="38" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="44" x2="30" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="415" y="745" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CRDs: Controller, NodeSet,</text>
    <text x="415" y="785" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">LoginSet, Accounting, RestApi, Token</text>
  </g>

  
  <g id="subgraph-soperator">
    
    <rect x="830" y="110" width="710" height="780" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="830" y="110" width="710" height="64" rx="16" fill="#207448" />
    <rect x="830" y="150" width="710" height="24" fill="#207448" />
    <text x="1185" y="154" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Nebius Soperator (SlurmCluster)</text>

    
    <rect x="880" y="195" width="610" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1157, 212)">
      <path d="M28 6 L50 14 C50 36 28 50 28 50 C28 50 6 36 6 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M18 28 L24 34 L38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="1185" y="315" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Soperator + ActiveCheck CRs</text>
    <text x="1185" y="353" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(k8sJob &amp; slurmJob probes)</text>

    
    <line x1="1185" y1="375" x2="1185" y2="428" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="880" y="430" width="610" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1157, 448)">
      <rect x="6" y="8" width="44" height="10" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="6" y="24" width="44" height="10" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="6" y="40" width="44" height="10" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="13" r="1.5" fill="#207448" />
      <circle cx="14" cy="29" r="1.5" fill="#207448" />
      <circle cx="14" cy="45" r="1.5" fill="#207448" />
    </g>
    <text x="1185" y="550" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">StatefulSets:</text>
    <text x="1185" y="590" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Login, Controller, Worker</text>

    
    <line x1="1185" y1="625" x2="1185" y2="678" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="880" y="680" width="610" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1157, 698)">
      <ellipse cx="28" cy="12" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M6 12 L6 40 C6 46 16 50 28 50 C40 50 50 46 50 40 L50 12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M6 26 C6 32 16 36 28 36 C40 36 50 32 50 26" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="1185" y="798" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shared 'Jail' Rootfs PVC</text>
    <text x="1185" y="838" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Unified / across all nodes</text>
  </g>
</svg>