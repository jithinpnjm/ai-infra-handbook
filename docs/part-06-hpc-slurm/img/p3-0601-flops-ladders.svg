<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>FLOPS prefixes and precision: read a headline number carefully</title>
  <desc>Infographic explaining FLOPS metric prefixes, precisions to workloads, scales analogy, and key evaluation questions.</desc>

  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">FLOPS prefixes and precision: read a headline number carefully</text>

  
  <g id="prefix-ladder">
    <rect x="50" y="110" width="460" height="840" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    
    <rect x="80" y="140" width="400" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="125" cy="190" r="24" fill="#207448"/>
    <path d="M115 190 L122 180 L135 198" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="200" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">exa 10^18</text>

    
    <rect x="80" y="260" width="400" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="125" cy="310" r="24" fill="#207448"/>
    <text x="125" y="319" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">^</text>
    <text x="170" y="320" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">peta 10^15</text>

    
    <rect x="80" y="380" width="400" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="125" cy="430" r="24" fill="#207448"/>
    <text x="125" y="439" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">^</text>
    <text x="170" y="440" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">tera 10^12</text>

    
    <rect x="80" y="500" width="400" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="125" cy="550" r="24" fill="#207448"/>
    <text x="125" y="559" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">^</text>
    <text x="170" y="560" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">giga 10^9</text>

    
    <rect x="80" y="625" width="400" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="280" y="662" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">an exaflop is one thousand</tspan>
      <tspan x="280" dy="32">petaflops</tspan>
    </text>

    
    <rect x="80" y="735" width="400" height="185" rx="12" fill="#fff3e6" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(100, 788)">
      <polygon points="28,4 54,48 2,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

    
    <text x="175" y="805" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129">
      <tspan x="175" dy="0">a missed prefix hides</tspan>
      <tspan x="175" dy="36">a thousand times</tspan>
    </text>
  </g>

  
  <g id="precision-workloads">
    
    <rect x="540" y="110" width="1010" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M570 145 H605 V175 H570 Z M580 175 V185 M595 175 V185 M575 185 H600" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="625" y="148" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="625" dy="0" font-weight="bold" fill="#207448">FP64 double: physics simulation and TOP500 Linpack, highest</tspan>
      <tspan x="625" dy="34">silicon cost per operation, many AI GPUs run FP64 at a small</tspan>
      <tspan x="625" dy="34">fraction of their tensor rate</tspan>
    </text>

    
    <rect x="540" y="280" width="1010" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M570 315 H605 V345 H570 Z M587 345 V355 M575 355 H600" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="625" y="325" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="625" dy="0" font-weight="bold" fill="#207448">FP32: graphics, CAD, legacy simulation, older ML</tspan>
    </text>

    
    <rect x="540" y="400" width="1010" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="572" y="445" width="30" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M582 460 H592 M587 455 V465" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="625" y="440" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="625" dy="0" font-weight="bold" fill="#207448">TF32, BF16, FP16: mixed-precision deep-learning training,</tspan>
      <tspan x="625" dy="34">Tensor Core paths deliver an order of magnitude more throughput</tspan>
      <tspan x="625" dy="34">than scalar FP64</tspan>
    </text>

    
    <rect x="540" y="570" width="1010" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="587" cy="625" r="16" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M587 615 V625 L594 630" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="625" y="618" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="625" dy="0" font-weight="bold" fill="#207448">FP8, FP4: frontier LLM training and high-throughput inference,</tspan>
      <tspan x="625" dy="34">highest floating-point rates</tspan>
    </text>

    
    <rect x="540" y="730" width="1010" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="572" y="760" width="32" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="580" y1="760" x2="580" y2="784" stroke="#207448" stroke-width="2"/>
    <line x1="588" y1="760" x2="588" y2="784" stroke="#207448" stroke-width="2"/>
    <line x1="596" y1="760" x2="596" y2="784" stroke="#207448" stroke-width="2"/>
    <text x="625" y="775" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="625" dy="0" font-weight="bold" fill="#207448">INT8, INT4: quantized inference</tspan>
    </text>

    
    <rect x="540" y="850" width="1010" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(565, 875)">
      <line x1="24" y1="8" x2="24" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="44" x2="38" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="44" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M4 16 L0 32 H14 Z" fill="none" stroke="#207448" stroke-width="2"/>
      <path d="M44 16 L37 32 H51 Z" fill="none" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="635" y="910" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">FP64 is the jeweler's scale, low precision is the warehouse scale</text>
  </g>

  
  <g id="three-questions">
    <rect x="50" y="980" width="1500" height="390" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="50" y="980" width="1500" height="70" rx="18" fill="#207448"/>
    
    <circle cx="100" cy="1015" r="20" fill="#ffffff"/>
    <text x="100" y="1025" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">?</text>
    <text x="135" y="1026" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Three questions to ask of any FLOPS figure</text>

    
    
    <rect x="85" y="1080" width="430" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="125" cy="1125" r="18" fill="#207448"/>
    <text x="125" y="1133" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">1</text>
    <text x="160" y="1132" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Precision</text>
    <text x="110" y="1195" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="110" dy="0">What precision?</tspan>
    </text>

    
    <rect x="545" y="1080" width="490" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="585" cy="1125" r="18" fill="#207448"/>
    <text x="585" y="1133" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">2</text>
    <text x="620" y="1132" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Sparsity</text>
    <text x="575" y="1185" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="575" dy="0" font-weight="bold">Dense or sparse</tspan>
      <tspan x="575" dy="34">(sparse assumes many zeros</tspan>
      <tspan x="575" dy="34">the hardware can skip,</tspan>
      <tspan x="575" dy="34">so it looks larger)?</tspan>
    </text>

    
    <rect x="1065" y="1080" width="455" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1105" cy="1125" r="18" fill="#207448"/>
    <text x="1105" y="1133" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">3</text>
    <text x="1140" y="1132" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Measurement</text>
    <text x="1095" y="1185" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="1095" dy="0" font-weight="bold">Theoretical peak Rpeak</tspan>
      <tspan x="1095" dy="34" font-weight="bold">or measured Rmax?</tspan>
    </text>
  </g>
</svg>