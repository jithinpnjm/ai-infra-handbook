<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1165" viewBox="0 0 1600 1165">
  <title>How munge proves who sent a request</title>
  <desc>Two nodes, Submitting node and Controller node, each running munged. A shared key /etc/munge/munge.key lets munged encode a short-lived credential carrying the numeric UID and GID, which the controller decodes and reports back.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1165" fill="#f5f8f5"/>

  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">How munge proves who sent a request</text>

  <rect x="60" y="120" width="600" height="760" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="940" y="120" width="600" height="760" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="78" y="148" width="52" height="22" rx="4"/>
    <rect x="78" y="176" width="52" height="22" rx="4"/>
  </g>
  <circle cx="89" cy="159" r="2.5" fill="#207448"/>
  <circle cx="89" cy="187" r="2.5" fill="#207448"/>
  <text x="148" y="184" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Submitting node</text>

  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="958" y="148" width="52" height="22" rx="4"/>
    <rect x="958" y="176" width="52" height="22" rx="4"/>
  </g>
  <circle cx="969" cy="159" r="2.5" fill="#207448"/>
  <circle cx="969" cy="187" r="2.5" fill="#207448"/>
  <text x="1028" y="184" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Controller node</text>

  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="138" cy="222" r="12"/>
    <path d="M116 261 a22 22 0 0 1 44 0"/>
  </g>
  <text x="182" y="242" font-family="sans-serif" font-size="28" fill="#303a36">user alice</text>

  <path d="M138 266 V486" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <circle cx="185" cy="360" r="24" fill="#207448"/>
  <text x="185" y="369" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="225" y="368" font-family="sans-serif" font-size="26" fill="#303a36">ask for a credential</text>

  <rect x="100" y="486" width="244" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="144" cy="541" r="11"/>
    <path d="M144 526 V520 M144 556 V562 M159 541 H165 M123 541 H117 M155 530 L159 526 M129 552 L125 556 M155 552 L159 556 M129 530 L125 526"/>
  </g>
  <text x="184" y="551" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">munged</text>

  <path d="M300 600 V672" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <circle cx="238" cy="636" r="24" fill="#207448"/>
  <text x="238" y="645" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <rect x="150" y="676" width="320" height="184" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="166" y="710" font-family="sans-serif" font-size="24" fill="#303a36">numeric UID and GID</text>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="190" cy="748" r="24"/>
    <path d="M190 748 V733 M190 748 H202"/>
  </g>
  <text x="228" y="756" font-family="sans-serif" font-size="24" fill="#303a36">validity window</text>
  <text x="166" y="810" font-family="sans-serif" font-size="24" fill="#303a36">five minutes</text>
  <text x="166" y="842" font-family="sans-serif" font-size="24" fill="#303a36">by default</text>

  <path d="M345 545 H1272" stroke="#207448" stroke-width="5" fill="none" marker-end="url(#ar)"/>
  <text x="800" y="452" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">credential</text>
  <text x="800" y="484" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">sent with the</text>
  <text x="800" y="516" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">request</text>
  <circle cx="800" cy="600" r="24" fill="#207448"/>
  <text x="800" y="609" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <rect x="1200" y="240" width="320" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="1244" cy="290" r="11"/>
    <path d="M1244 275 V269 M1244 305 V311 M1259 290 H1265 M1223 290 H1217 M1255 279 L1259 275 M1229 301 L1225 305 M1255 301 L1259 305 M1229 279 L1225 275"/>
  </g>
  <text x="1282" y="300" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">slurmctld</text>

  <rect x="1276" y="486" width="244" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="1320" cy="541" r="11"/>
    <path d="M1320 526 V520 M1320 556 V562 M1335 541 H1341 M1299 541 H1293 M1331 530 L1335 526 M1305 552 L1301 556 M1331 552 L1335 556 M1305 530 L1301 526"/>
  </g>
  <text x="1360" y="551" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">munged</text>

  <path d="M1440 600 V672" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#ar)"/>
  <circle cx="1370" cy="636" r="24" fill="#207448"/>
  <text x="1370" y="645" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <rect x="1160" y="676" width="364" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round">
    <rect x="1322" y="702" width="40" height="48" rx="4"/>
    <path d="M1330 720 H1354 M1330 731 H1354 M1330 742 H1346"/>
  </g>
  <text x="1342" y="790" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">numeric UID and GID</text>
  <text x="1342" y="824" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">reported back</text>

  <rect x="100" y="924" width="1040" height="100" rx="14" fill="#fdf4ea" stroke="#db8129" stroke-width="6"/>
  <g stroke="#db8129" stroke-width="5" fill="none" stroke-linecap="round">
    <circle cx="418" cy="974" r="13"/>
    <path d="M431 974 H456 M446 974 V984 M453 974 V984"/>
  </g>
  <text x="486" y="983" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">/etc/munge/munge.key</text>
  <text x="1176" y="983" font-family="sans-serif" font-size="26" fill="#303a36">same key on every node</text>

  <path d="M116 924 V600" stroke="#207448" stroke-width="3" fill="none" stroke-dasharray="9 9"/>
  <path d="M1120 924 V656 H1400 V600" stroke="#207448" stroke-width="3" fill="none" stroke-dasharray="9 9"/>

  <rect x="80" y="1060" width="1440" height="64" rx="10" fill="#207448"/>
  <text x="800" y="1101" font-family="sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">This is how Slurm can trust user 1042 sent this without passwords.</text>
</svg>