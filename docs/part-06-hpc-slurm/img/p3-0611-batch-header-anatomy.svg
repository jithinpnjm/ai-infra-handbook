<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Anatomy of the bert-pretrain batch script header</title>
  <desc>Visual infographic detailing the Slurm batch script header directives, body commands, and execution rules for distributed BERT pretraining.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Anatomy of the bert-pretrain batch script header</text>

  
  <rect x="40" y="115" width="1520" height="650" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 132)">
    <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="1" x2="16" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="1" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="1" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="48" x2="16" y2="55" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="48" x2="28" y2="55" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="48" x2="40" y2="55" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="48" y1="16" x2="55" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="48" y1="28" x2="55" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="48" y1="40" x2="55" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="140" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Annotated script</text>
  <text x="410" y="172" font-family="sans-serif" font-size="24" fill="#303a36">Lines with callouts</text>

  
  
  <rect x="65" y="195" width="720" height="48" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="228" font-family="monospace" font-size="24" fill="#303a36">#SBATCH --job-name=bert-pretrain</text>

  
  <rect x="65" y="253" width="720" height="48" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="286" font-family="monospace" font-size="24" fill="#303a36">--partition=gpu</text>

  
  <rect x="65" y="311" width="720" height="48" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="344" font-family="monospace" font-size="24" fill="#303a36">--nodes=2</text>

  
  <rect x="65" y="369" width="720" height="78" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="401" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">--ntasks-per-node=8</tspan>
    <tspan font-family="sans-serif" x="85" dy="30">(one task per GPU)</tspan>
  </text>

  
  <rect x="65" y="457" width="720" height="48" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="490" font-family="monospace" font-size="24" fill="#303a36">--gpus-per-node=8</text>

  
  <rect x="65" y="515" width="720" height="48" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="548" font-family="monospace" font-size="24" fill="#303a36">--cpus-per-gpu=12</text>

  
  <rect x="65" y="573" width="720" height="78" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="605" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">--mem=0</tspan>
    <tspan font-family="sans-serif" x="85" dy="30">(all memory on the exclusive node)</tspan>
  </text>

  
  
  <rect x="815" y="195" width="720" height="46" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="227" font-family="monospace" font-size="24" fill="#303a36">--exclusive</text>

  
  
  <rect x="815" y="251" width="720" height="106" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="835" y="280" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#db8129">--time=12:00:00</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> (always give one;</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">backfill slips short jobs into gaps only</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">if it knows how long each will take)</tspan>
  </text>

  
  <rect x="815" y="367" width="720" height="46" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="399" font-family="monospace" font-size="24" fill="#303a36">--requeue</text>

  
  <rect x="815" y="423" width="720" height="102" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="452" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">--signal=B:USR1@300</tspan>
    <tspan font-family="sans-serif"> (warn the batch</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">shell 5 minutes before</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">the limit)</tspan>
  </text>

  
  <rect x="815" y="535" width="720" height="102" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="564" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">--output=logs/%x-%j.out</tspan>
    <tspan font-family="sans-serif"> (%x name,</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">%j job ID, %A and %a array job and index,</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">%N short hostname)</tspan>
  </text>

  
  <rect x="815" y="647" width="720" height="102" rx="6" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="676" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">--open-mode=append</tspan>
    <tspan font-family="sans-serif"> (a requeued job reuses</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">its job ID and log name; truncate would</tspan>
    <tspan x="835" dy="28" font-family="sans-serif">erase the first run log)</tspan>
  </text>

  
  <rect x="40" y="780" width="1520" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 792)">
    <rect x="8" y="8" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="20" x2="48" y2="20" stroke="#207448" stroke-width="3"/>
    <path d="M 15 29 L 21 34 L 15 39" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="25" y1="39" x2="33" y2="39" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="140" y="828" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Body lines</text>

  
  <rect x="65" y="844" width="720" height="32" rx="4" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="868" font-family="monospace" font-size="24" fill="#303a36">set -euo pipefail</text>

  <rect x="65" y="880" width="720" height="32" rx="4" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="904" font-family="monospace" font-size="24" fill="#303a36">module purge</text>

  <rect x="65" y="916" width="720" height="32" rx="4" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="940" font-family="monospace" font-size="24" fill="#303a36">module load cuda/12.4 nccl/2.21</text>

  
  <rect x="815" y="844" width="720" height="40" rx="4" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="872" font-family="monospace" font-size="24" fill="#303a36">export OMP_NUM_THREADS=$SLURM_CPUS_PER_GPU</text>

  <rect x="815" y="888" width="720" height="58" rx="4" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="835" y="912" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="835" dy="0">srun --mpi=pmix python train.py</tspan>
    <tspan x="835" dy="26">--resume-if-exists</tspan>
  </text>

  
  <rect x="40" y="965" width="1520" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 977)">
    <path d="M 28 6 L 46 14 C 46 36 28 50 28 50 C 28 50 10 36 10 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 20 27 L 26 33 L 37 20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="140" y="1008" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Rules strip</text>

  
  <rect x="65" y="1016" width="1470" height="154" rx="8" fill="#ffffff" stroke="#c4d8c7" stroke-width="1.5"/>
  <text x="85" y="1044" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">every #SBATCH line must come before the first executable command or the shell treats it as a comment;</tspan>
    <tspan x="85" dy="26">command-line options override the directives; default --export=ALL copies the submitter environment</tspan>
    <tspan x="85" dy="26">including modules and conda, so for reproducibility use --export=NONE with explicit setup;</tspan>
    <tspan x="85" dy="26">--wrap for a one-liner; --test-only reports when and where the job would start without submitting;</tspan>
    <tspan x="85" dy="26">if the --output directory does not exist the job fails without a log</tspan>
  </text>
</svg>