<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1470" width="1600" height="1470">
  <title>Anatomy of the bert-pretrain batch script header</title>
  <desc>Visual explanation of Slurm directives, job configuration, shell environment, and execution rules for BERT pretraining.</desc>

  
  <rect width="1600" height="1470" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Anatomy of the bert-pretrain batch script header</text>

  

  
  <g>
    <rect x="50" y="110" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="150" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">#SBATCH --job-name=bert-pretrain</text>
    
    <path d="M 720,132 L 742,132 L 754,144 L 736,162 L 720,146 Z M 727,138 A 2,2 0 1,1 727,142 A 2,2 0 1,1 727,138" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>

  
  <g>
    <rect x="50" y="188" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="228" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--partition=gpu</text>
    
    <rect x="720" y="200" width="34" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="720" y="222" width="34" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="728" cy="208" r="2" fill="#207448"/>
    <circle cx="728" cy="230" r="2" fill="#207448"/>
  </g>

  
  <g>
    <rect x="50" y="266" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="306" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--nodes=2</text>
    
    <rect x="716" y="278" width="18" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="742" y="278" width="18" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="725" y1="312" x2="751" y2="312" stroke="#207448" stroke-width="3"/>
    <line x1="738" y1="300" x2="738" y2="312" stroke="#207448" stroke-width="3"/>
  </g>

  
  <g>
    <rect x="50" y="344" width="730" height="94" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" font-family="monospace" font-weight="bold">--ntasks-per-node=8 </tspan>
      <tspan x="80" dy="34">(one task per GPU)</tspan>
    </text>
    
    <rect x="720" y="366" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="740" y="366" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="720" y="386" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="740" y="386" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  
  <g>
    <rect x="50" y="452" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="492" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--gpus-per-node=8</text>
    
    <rect x="718" y="466" width="36" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="736" cy="478" r="5" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="724" y1="492" x2="724" y2="498" stroke="#207448" stroke-width="3"/>
    <line x1="732" y1="492" x2="732" y2="498" stroke="#207448" stroke-width="3"/>
  </g>

  
  <g>
    <rect x="50" y="530" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="570" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--cpus-per-gpu=12</text>
    
    <rect x="722" y="542" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="730" y="550" width="12" height="12" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="728" y1="538" x2="728" y2="542" stroke="#207448" stroke-width="2"/>
    <line x1="744" y1="538" x2="744" y2="542" stroke="#207448" stroke-width="2"/>
    <line x1="728" y1="570" x2="728" y2="574" stroke="#207448" stroke-width="2"/>
    <line x1="744" y1="570" x2="744" y2="574" stroke="#207448" stroke-width="2"/>
  </g>

  
  <g>
    <rect x="50" y="608" width="730" height="94" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="644" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" font-family="monospace" font-weight="bold">--mem=0 </tspan>
      <tspan x="80" dy="34">(all memory on the exclusive node)</tspan>
    </text>
    
    <rect x="716" y="632" width="40" height="22" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="724" y1="638" x2="724" y2="646" stroke="#207448" stroke-width="3"/>
    <line x1="732" y1="638" x2="732" y2="646" stroke="#207448" stroke-width="3"/>
    <line x1="740" y1="638" x2="740" y2="646" stroke="#207448" stroke-width="3"/>
    <line x1="748" y1="638" x2="748" y2="646" stroke="#207448" stroke-width="3"/>
  </g>

  
  <g>
    <rect x="50" y="716" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="756" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--exclusive</text>
    
    <rect x="726" y="736" width="24" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 732,736 L 732,730 A 6,6 0 0,1 744,730 L 744,736" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  

  
  <g>
    <rect x="820" y="110" width="730" height="158" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="850" y="146" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" font-family="monospace" font-weight="bold">--time=12:00:00 </tspan>
      <tspan x="850" dy="34">(always give one; backfill slips short</tspan>
      <tspan x="850" dy="32">jobs into gaps only if it knows how</tspan>
      <tspan x="850" dy="32">long each will take)</tspan>
    </text>
    
    <circle cx="1506" cy="144" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="1506,132 1506,144 1516,148" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <g>
    <rect x="820" y="282" width="730" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="850" y="322" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--requeue</text>
    
    <path d="M 1494,310 A 14,14 0 1,1 1516,324" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <polyline points="1490,302 1494,312 1504,310" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <g>
    <rect x="820" y="360" width="730" height="126" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="850" y="396" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" font-family="monospace" font-weight="bold">--signal=B:USR1@300 </tspan>
      <tspan x="850" dy="34">(warn the batch shell 5 minutes</tspan>
      <tspan x="850" dy="32">before the limit)</tspan>
    </text>
    
    <path d="M 1496,428 C 1496,416 1502,408 1508,408 C 1514,408 1520,416 1520,428 L 1524,432 L 1492,432 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="1504" y1="436" x2="1512" y2="436" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <g>
    <rect x="820" y="500" width="730" height="126" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="850" y="536" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" font-family="monospace" font-weight="bold">--output=logs/%x-%j.out </tspan>
      <tspan x="850" dy="34">(%x name, %j job ID, %A and %a array</tspan>
      <tspan x="850" dy="32">job and index, %N short hostname)</tspan>
    </text>
    
    <path d="M 1496,522 L 1514,522 L 1524,532 L 1524,554 L 1496,554 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="1514,522 1514,532 1524,532" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="1502" y1="540" x2="1516" y2="540" stroke="#207448" stroke-width="2"/>
    <line x1="1502" y1="546" x2="1512" y2="546" stroke="#207448" stroke-width="2"/>
  </g>

  
  <g>
    
    <rect x="820" y="640" width="730" height="158" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="850" y="674" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" font-family="monospace" font-weight="bold">--open-mode=append </tspan>
      <tspan x="850" dy="34">(a requeued job reuses its job ID</tspan>
      <tspan x="850" dy="32">and log name; truncate would erase</tspan>
      <tspan x="850" dy="32">the first run log)</tspan>
    </text>
    
    <path d="M 1494,680 L 1512,680 L 1522,690 L 1522,714 L 1494,714 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="1508" y1="702" x2="1508" y2="724" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1497" y1="713" x2="1519" y2="713" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <g>
    <rect x="50" y="825" width="1500" height="342" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="75" y="845" width="1450" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="115" cy="872" r="18" fill="#207448"/>
    <text x="115" y="880" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="155" y="880" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">set -euo pipefail</text>

    
    <rect x="75" y="907" width="1450" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="115" cy="934" r="18" fill="#207448"/>
    <text x="115" y="942" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="155" y="942" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">module purge</text>

    
    <rect x="75" y="969" width="1450" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="115" cy="996" r="18" fill="#207448"/>
    <text x="115" y="1004" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="155" y="1004" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">module load cuda/12.4 nccl/2.21</text>

    
    <rect x="75" y="1031" width="1450" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="115" cy="1058" r="18" fill="#207448"/>
    <text x="115" y="1066" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <text x="155" y="1066" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">export OMP_NUM_THREADS=$SLURM_CPUS_PER_GPU</text>

    
    <rect x="75" y="1093" width="1450" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="115" cy="1120" r="18" fill="#207448"/>
    <text x="115" y="1128" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <text x="155" y="1128" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">srun --mpi=pmix python train.py --resume-if-exists</text>
  </g>

  
  <g>
    <rect x="50" y="1195" width="1500" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 85,1230 L 115,1218 L 145,1230 C 145,1270 115,1292 115,1292 C 115,1292 85,1270 85,1230 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="102,1254 112,1264 128,1244" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    
    <text x="175" y="1245" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="175" dy="0">every #SBATCH line must come before the first executable command or the shell treats it as a comment;</tspan>
      <tspan x="175" dy="36">command-line options override the directives; default --export=ALL copies the submitter environment</tspan>
      <tspan x="175" dy="36">including modules and conda, so for reproducibility use --export=NONE with explicit setup;</tspan>
      <tspan x="175" dy="36">--wrap for a one-liner; --test-only reports when and where the job would start without submitting;</tspan>
      <tspan x="175" dy="36">if the --output directory does not exist the job fails without a log</tspan>
    </text>
  </g>
</svg>