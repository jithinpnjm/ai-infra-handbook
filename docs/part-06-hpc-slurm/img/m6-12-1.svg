<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <title>Layers</title>
  <desc>Visual diagram of distributed training layers from Slurm allocation down to NVLink and GPUDirect RDMA fabric.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Layers</text>

  
  <g id="node-slurm">
    <rect x="300" y="110" width="1000" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(335, 137)">
      <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="10" y1="17" x2="36" y2="17" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="33" x2="36" y2="33" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="45" cy="17" r="3" fill="#207448"/>
      <circle cx="45" cy="33" r="3" fill="#207448"/>
    </g>
    <text x="420" y="152" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Slurm: </tspan>
      <tspan x="420" dy="38" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">allocation, cgroups, srun steps</tspan>
    </text>
  </g>

  
  <line x1="800" y1="215" x2="800" y2="255" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="node-launcher">
    <rect x="300" y="255" width="1000" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(335, 282)">
      <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="12,16 22,25 12,34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="34" x2="44" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="420" y="297" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Launcher: </tspan>
      <tspan x="420" dy="38" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">srun or torchrun</tspan>
    </text>
  </g>

  
  <line x1="800" y1="360" x2="800" y2="400" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="node-rendezvous">
    <rect x="300" y="400" width="1000" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(335, 427)">
      <circle cx="28" cy="25" r="10" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="9" cy="11" r="5" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="47" cy="11" r="5" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="28" cy="44" r="5" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="13" y1="14" x2="21" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="43" y1="14" x2="35" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="35" x2="28" y2="39" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="420" y="442" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Rendezvous: </tspan>
      <tspan x="420" dy="38" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">MASTER_ADDR/PORT, c10d store or PMIx</tspan>
    </text>
  </g>

  
  <line x1="800" y1="505" x2="800" y2="545" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="node-framework">
    <rect x="300" y="545" width="1000" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(335, 572)">
      <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="14" cy="25" r="4" fill="#207448"/>
      <circle cx="28" cy="14" r="4" fill="#207448"/>
      <circle cx="28" cy="36" r="4" fill="#207448"/>
      <circle cx="42" cy="25" r="4" fill="#207448"/>
      <line x1="17" y1="23" x2="25" y2="16" stroke="#207448" stroke-width="2"/>
      <line x1="17" y1="27" x2="25" y2="34" stroke="#207448" stroke-width="2"/>
      <line x1="31" y1="16" x2="39" y2="23" stroke="#207448" stroke-width="2"/>
      <line x1="31" y1="34" x2="39" y2="27" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="420" y="587" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Framework: </tspan>
      <tspan x="420" dy="38" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">torch.distributed, DDP/FSDP, DeepSpeed, Megatron</tspan>
    </text>
  </g>

  
  <line x1="800" y1="650" x2="800" y2="690" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="node-nccl">
    <rect x="300" y="690" width="1000" height="105" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(335, 717)">
      <circle cx="28" cy="25" r="21" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="7 4"/>
      <circle cx="28" cy="4" r="5" fill="#db8129"/>
      <circle cx="49" cy="25" r="5" fill="#db8129"/>
      <circle cx="28" cy="46" r="5" fill="#db8129"/>
      <circle cx="7" cy="25" r="5" fill="#db8129"/>
    </g>
    <text x="420" y="732" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#db8129">NCCL: </tspan>
      <tspan x="420" dy="38" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">topology detection, rings/trees</tspan>
    </text>
  </g>

  
  <path d="M 550 795 L 550 827 Q 550 835 542 835 L 438 835 Q 430 835 430 843 L 430 875" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1050 795 L 1050 827 Q 1050 835 1058 835 L 1162 835 Q 1170 835 1170 843 L 1170 875" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="node-nvlink">
    <rect x="100" y="875" width="660" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(130, 907)">
      <rect x="5" y="5" width="46" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="16" y="15" width="24" height="22" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="15" y1="0" x2="15" y2="5" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="0" x2="28" y2="5" stroke="#207448" stroke-width="3"/>
      <line x1="41" y1="0" x2="41" y2="5" stroke="#207448" stroke-width="3"/>
      <line x1="15" y1="47" x2="15" y2="52" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="47" x2="28" y2="52" stroke="#207448" stroke-width="3"/>
      <line x1="41" y1="47" x2="41" y2="52" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="215" y="917" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">NVLink / NVSwitch </tspan>
      <tspan x="215" dy="38" font-size="24" fill="#303a36">in node</tspan>
    </text>
  </g>

  
  <g id="node-ib">
    <rect x="840" y="875" width="660" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(865, 907)">
      <rect x="0" y="7" width="22" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="34" y="7" width="22" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 22 26 L 34 26" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="29,21 34,26 29,31" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="27,21 22,26 27,31" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="945" y="917" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">GPUDirect RDMA </tspan>
      <tspan x="945" dy="38" font-size="24" fill="#303a36">over IB or RoCE between nodes</tspan>
    </text>
  </g>
</svg>