    <text x="250" y="318" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="250" dy="0">login nodes:</tspan>
      <tspan x="250" dy="38" font-family="monospace" font-size="26">sbatch, srun</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="75" y="470" width="350" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
