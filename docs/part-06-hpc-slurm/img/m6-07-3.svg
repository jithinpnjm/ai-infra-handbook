      <tspan x="785" dy="38">(standby)</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="530" y="720" width="510" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(757, 742)">
