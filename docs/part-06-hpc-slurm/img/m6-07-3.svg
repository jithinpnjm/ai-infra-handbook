      <path d="M 23 4 V 9 M 23 37 V 42 M 4 23 H 9 M 37 23 H 42 M 10 10 L 14 14 M 32 32 L 36 36 M 10 36 L 14 32 M 32 14 L 36 10" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="1335" y="335" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      slurmdbd
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1155" y="460" width="360" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1310, 480)">
      <ellipse cx="25" cy="9" rx="25" ry="8" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 0 9 V 20 C 0 25 11 28 25 28 C 39 28 50 25 50 20 V 9" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 0 20 V 31 C 0 36 11 39 25 39 C 39 39 50 36 50 31 V 20" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="1335" y="575" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1335" dy="0">MariaDB with</tspan>
      <tspan x="1335" dy="38">replication or Galera</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1155" y="730" width="360" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1312, 750)">
