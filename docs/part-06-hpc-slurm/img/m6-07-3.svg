<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>What lives where</title>
  <desc>Slurm architecture diagram showing clients, HA controller pair, and accounting tier.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#143d26" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">What lives where</text>

  
  <rect x="50" y="120" width="400" height="880" rx="16" fill="#e8f1ea" stroke="#c2d8c7" stroke-width="2"/>
  <text x="75" y="165" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Clients and nodes</text>

  
  <g filter="url(#shadow)">
    <rect x="75" y="210" width="350" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <rect x="225" y="232" width="50" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
