  <rect x="1120" y="120" width="430" height="880" rx="16" fill="#e8f1ea" stroke="#c2d8c7" stroke-width="2"/>
  <text x="1145" y="165" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Accounting tier</text>

  
  <g filter="url(#shadow)">
    <rect x="1155" y="210" width="360" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1312, 235)">
