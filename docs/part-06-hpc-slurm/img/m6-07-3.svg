      <path d="M 23 4 V 9 M 23 37 V 42 M 4 23 H 9 M 37 23 H 42" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="1335" y="835" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1335" dy="0"><tspan font-family="monospace">slurmdbd</tspan> standby</tspan>
      <tspan x="1335" dy="38">(optional)</tspan>
    </text>
  </g>

  

   P -->
