<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>What lives where</title>
  <desc>Architecture infographic illustrating Slurm deployment topology across clients and nodes, controller HA pair, and accounting tier.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5c6f66" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#143324" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What lives where</text>

  
  
  
  <g id="subgraph-clients">
    <rect x="40" y="110" width="460" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="155" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Clients and nodes</text>

    
    <g id="node-submit" filter="url(#card-shadow)">
      <rect x="65" y="190" width="410" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(242, 215)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="46" rx="6" />
        <line x1="0" y1="14" x2="56" y2="14" />
        <circle cx="10" cy="7" r="2" fill="#207448" />
        <circle cx="18" cy="7" r="2" fill="#207448" />
        <polyline points="12,24 20,30 12,36" />
        <line x1="24" y1="36" x2="36" y2="36" />
      </g>
      
      <text x="270" y="325" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">login nodes:</text>
      <text x="270" y="380" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">sbatch, srun</text>
    </g>

    
    <g id="node-nodes" filter="url(#card-shadow)">
      <rect x="65" y="650" width="410" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(242, 675)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <rect x="18" y="18" width="20" height="20" fill="#e8f1ea" />
        <line x1="18" y1="2" x2="18" y2="10" />
        <line x1="28" y1="2" x2="28" y2="10" />
        <line x1="38" y1="2" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="54" />
        <line x1="28" y1="46" x2="28" y2="54" />
        <line x1="38" y1="46" x2="38" y2="54" />
        <line x1="2" y1="18" x2="10" y2="18" />
        <line x1="2" y1="28" x2="10" y2="28" />
        <line x1="2" y1="38" x2="10" y2="38" />
        <line x1="46" y1="18" x2="54" y2="18" />
        <line x1="46" y1="28" x2="54" y2="28" />
        <line x1="46" y1="38" x2="54" y2="38" />
      </g>
      
      <text x="270" y="785" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">slurmd</text>
      <text x="270" y="840" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">on compute nodes</text>
    </g>
  </g>

  
  
  
  <g id="subgraph-ha">
    <rect x="560" y="110" width="480" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="590" y="155" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Controller HA pair</text>

    
    <g id="node-p" filter="url(#card-shadow)">
      <rect x="585" y="190" width="430" height="210" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(772, 210)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="12" fill="#fdf6ee" />
        <path d="M28,6 L28,12 M28,44 L28,50 M6,28 L12,28 M44,28 L50,28 M12.5,12.5 L16.7,16.7 M39.3,39.3 L43.5,43.5 M12.5,43.5 L16.7,39.3 M39.3,16.7 L43.5,12.5" />
      </g>
      
      <text x="800" y="325" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">slurmctld primary</text>
    </g>

    
    <g id="node-ss" filter="url(#card-shadow)">
      <rect x="585" y="480" width="430" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(772, 498)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 C 6 6, 50 6, 50 12 C 50 18, 6 18, 6 12 Z" fill="#e8f1ea" />
        <path d="M 6 12 L 6 42 C 6 48, 50 48, 50 42 L 50 12" />
        <path d="M 6 22 C 6 28, 50 28, 50 22" />
        <path d="M 6 32 C 6 38, 50 38, 50 32" />
      </g>
      
      <text x="800" y="595" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Shared StateSaveLocation</text>
      <text x="800" y="640" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">NFS or clustered FS</text>
    </g>

    
    <g id="node-b" filter="url(#card-shadow)">
      <rect x="585" y="770" width="430" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(772, 790)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 8 L 48 16 L 48 32 C 48 44, 28 52, 28 52 C 28 52, 8 44, 8 32 L 8 16 Z" fill="#e8f1ea" />
        <circle cx="28" cy="28" r="6" />
      </g>
      
      <text x="800" y="905" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">slurmctld backup (standby)</text>
    </g>
  </g>

  
  
  
  <g id="subgraph-acct">
    <rect x="1100" y="110" width="460" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1130" y="155" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Accounting tier</text>

    
    <g id="node-dbd1" filter="url(#card-shadow)">
      <rect x="1125" y="190" width="410" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1302, 210)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="8" fill="#e8f1ea" />
        <line x1="28" y1="12" x2="28" y2="16" />
        <line x1="28" y1="40" x2="28" y2="44" />
        <line x1="12" y1="28" x2="16" y2="28" />
        <line x1="40" y1="28" x2="44" y2="28" />
      </g>
      
      <text x="1330" y="325" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">slurmdbd</text>
    </g>

    
    <g id="node-dbc" filter="url(#card-shadow)">
      <rect x="1125" y="480" width="410" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1302, 498)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 C 6 6, 50 6, 50 12 C 50 18, 6 18, 6 12 Z" fill="#e8f1ea" />
        <path d="M 6 12 L 6 42 C 6 48, 50 48, 50 42 L 50 12" />
        <path d="M 6 22 C 6 28, 50 28, 50 22" />
        <path d="M 6 32 C 6 38, 50 38, 50 32" />
      </g>
      
      <text x="1330" y="595" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">MariaDB with</text>
      <text x="1330" y="640" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">replication or Galera</text>
    </g>

    
    <g id="node-dbd2" filter="url(#card-shadow)">
      <rect x="1125" y="770" width="410" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1302, 790)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" stroke-dasharray="4 3" />
        <circle cx="28" cy="28" r="8" fill="#e8f1ea" />
        <line x1="28" y1="12" x2="28" y2="16" />
        <line x1="28" y1="40" x2="28" y2="44" />
      </g>
      
      <text x="1330" y="885" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">slurmdbd</text>
      <text x="1330" y="930" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">standby (optional)</text>
    </g>
  </g>

  
  
  

  
  <path d="M 475 270 L 577 270" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 475 740 L 515 740 L 515 320 L 577 320" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-green)" />

  
  <path d="M 800 400 L 800 472" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 750 770 L 750 408" fill="none" stroke="#5c6f66" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-grey)" />
  <g transform="translate(620, 715)">
    <rect x="0" y="0" width="120" height="34" rx="6" fill="#f5f8f5" stroke="#5c6f66" stroke-width="1.5" />
    <text x="60" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">heartbeat</text>
  </g>

  
  <path d="M 850 770 L 850 698" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 475 450 L 535 450 L 535 830 L 577 830" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <g transform="translate(485, 495)">
    <rect x="0" y="0" width="100" height="34" rx="6" fill="#fdf6ee" stroke="#db8129" stroke-width="1.5" />
    <text x="50" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">failover</text>
  </g>

  
  <path d="M 475 890 L 577 890" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)" />
  <g transform="translate(485, 905)">
    <rect x="0" y="0" width="100" height="34" rx="6" fill="#fdf6ee" stroke="#db8129" stroke-width="1.5" />
    <text x="50" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">failover</text>
  </g>

  
  <path d="M 1015 295 L 1117 295" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1330 400 L 1330 472" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1330 770 L 1330 698" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

</svg>