<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" style="background:#f5f8f5; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>What lives where</title>
  <desc>Architecture infographic illustrating Slurm deployment components: clients, compute nodes, controller HA pair with shared storage, and the accounting tier.</desc>

