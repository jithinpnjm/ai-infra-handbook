  </g>
  <text x="1105" y="750" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="28px" font-weight="bold">slurmrestd (optional):</tspan>
    <tspan x="1105" dy="38" font-size="24px">REST API</tspan>
  </text>


  
