    <tspan x="605" dy="38" font-size="24px">shared StateSaveLocation</tspan>
  </text>

  
  <rect x="1085" y="670" width="440" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8,6"/>
  <g transform="translate(1105, 690)">
