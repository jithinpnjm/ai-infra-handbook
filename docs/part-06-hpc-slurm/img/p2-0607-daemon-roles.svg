    <line x1="42" y1="40" x2="42" y2="48" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="12" x2="36" y2="12" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="20" x2="30" y2="20" stroke="#207448" stroke-width="3"/>
