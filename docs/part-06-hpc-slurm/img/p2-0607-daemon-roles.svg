      <tspan x="75" dy="38" font-size="24px">accounting database</tspan>
    </text>
  </g>

  
  <rect x="585" y="670" width="440" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8,6"/>
