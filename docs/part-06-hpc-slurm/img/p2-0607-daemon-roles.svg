<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Slurm's cooperating daemons and the commands that reach them</title>
  <desc>Slurm's cooperating daemons and the commands that reach them</desc>

  <defs>
