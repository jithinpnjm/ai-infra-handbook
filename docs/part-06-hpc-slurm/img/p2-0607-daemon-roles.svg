      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Slurm's cooperating daemons</tspan>
    <tspan x="800" dy="54">and the commands that reach them</tspan>
  </text>

  
  <rect x="50" y="145" width="1500" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
