  <text x="410" y="249" font-family="ui-monospace, monospace" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">salloc</text>

  <rect x="490" y="215" width="130" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="555" y="249" font-family="ui-monospace, monospace" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">squeue</text>

