  </g>
  <text x="135" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Login and submit nodes</text>

  
  <rect x="75" y="215" width="130" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
