  <text x="605" y="565" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30px" font-weight="bold">slurmdbd:</tspan>
    <tspan x="605" dy="38" font-size="24px">accounting daemon, port 6819</tspan>
  </text>

  
  <g transform="translate(1085, 475)">
    <path d="M 10 20 v 125 a 210 20 0 0 0 420 0 v -125 Z" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <ellipse cx="220" cy="20" rx="210" ry="20" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
