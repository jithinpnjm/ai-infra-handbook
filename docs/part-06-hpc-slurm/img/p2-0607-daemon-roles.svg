    <line x1="16" y1="50" x2="16" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="34" y1="50" x2="34" y2="56" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="175" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">slurmd on each node</text>


  
  
