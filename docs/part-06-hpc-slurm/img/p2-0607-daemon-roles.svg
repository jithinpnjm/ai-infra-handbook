  <rect x="50" y="1115" width="1500" height="55" rx="8" fill="#207448"/>
  <text x="800" y="1151" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">When a job is stuck, the first question is which daemon is involved.</text>
