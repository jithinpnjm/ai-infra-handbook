<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Tracing a slow job down the stack</title>
  <desc>Infographic illustrating the HPC system hierarchy and troubleshooting path from users down through login nodes, scheduler, compute, fabric, storage, management, and facility.</desc>

  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Tracing a slow job down the stack</text>

  
  <rect x="50" y="105" width="1500" height="110" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  <circle cx="95" cy="160" r="24" fill="#db8129"/>
  <text x="95" y="169" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="145" y="148" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="145" dy="0">user says the job is slow and GPUs look busy: 1 scheduler, where did the job land; 2 fabric counters</tspan>
    <tspan x="145" dy="36">on the nodes of that job; 3 storage latency; the GPU looked fine all along because the wait was elsewhere</tspan>
  </text>

  
  <rect x="50" y="245" width="1140" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 260)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="26" cy="18" r="14"/>
    <path d="M6 50 C6 36, 16 34, 26 34 C36 34, 46 36, 46 50"/>
  </g>
  <text x="150" y="299" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Users and workflows</text>

  
  <path d="M 620 330 L 620 355" stroke="#207448" stroke-width="4" fill="none"/>
  <polygon points="612,355 620,369 628,355" fill="#207448"/>

  
  <rect x="50" y="370" width="1140" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 385)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="6" width="46" height="42" rx="6"/>
    <path d="M14 20 L24 27 L14 34"/>
    <line x1="28" y1="36" x2="40" y2="36"/>
  </g>
  <text x="150" y="424" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Login nodes: SSH, Open OnDemand (6.2, 6.25)</text>

  
  <path d="M 620 455 L 620 480" stroke="#207448" stroke-width="4" fill="none"/>
  <polygon points="612,480 620,494 628,480" fill="#207448"/>

  
  <rect x="50" y="495" width="1140" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 535)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="26" cy="26" r="22"/>
    <polyline points="26,12 26,26 38,26"/>
  </g>
  <text x="150" y="547" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="150" dy="0">Scheduler: Slurm or Kueue; allocates nodes and GPUs exclusively,</tspan>
    <tspan x="150" dy="42">fair-share, QoS (6.7 to 6.17)</tspan>
  </text>
  
  <circle cx="1145" cy="535" r="24" fill="#db8129"/>
  <text x="1145" y="544" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <path d="M 620 630 L 620 655" stroke="#207448" stroke-width="4" fill="none"/>
  <polygon points="612,655 620,669 628,655" fill="#207448"/>

  
  
  <rect x="50" y="670" width="365" height="320" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 695)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="10" y="10" width="34" height="34" rx="4"/>
    <line x1="18" y1="2" x2="18" y2="10"/><line x1="27" y1="2" x2="27" y2="10"/><line x1="36" y1="2" x2="36" y2="10"/>
    <line x1="18" y1="44" x2="18" y2="52"/><line x1="27" y1="44" x2="27" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
    <line x1="2" y1="18" x2="10" y2="18"/><line x1="2" y1="27" x2="10" y2="27"/><line x1="2" y1="36" x2="10" y2="36"/>
    <line x1="44" y1="18" x2="52" y2="18"/><line x1="44" y1="27" x2="52" y2="27"/><line x1="44" y1="36" x2="52" y2="36"/>
  </g>
  <text x="75" y="785" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="75" dy="0">Compute nodes and apps:</tspan>
    <tspan x="75" dy="36">MPI, OpenMP, NCCL,</tspan>
    <tspan x="75" dy="36">PyTorch, Enroot</tspan>
    <tspan x="75" dy="36">(6.3 to 6.6, 6.12, 6.13, 6.29)</tspan>
  </text>

  
  <rect x="435" y="670" width="370" height="320" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(460, 695)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="14" cy="14" r="8"/>
    <circle cx="42" cy="14" r="8"/>
    <circle cx="28" cy="42" r="8"/>
    <line x1="19" y1="18" x2="24" y2="36"/>
    <line x1="37" y1="18" x2="32" y2="36"/>
    <line x1="22" y1="14" x2="34" y2="14"/>
  </g>
  
  <circle cx="765" cy="710" r="24" fill="#db8129"/>
  <text x="765" y="719" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="460" y="785" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="460" dy="0">Compute fabric:</tspan>
    <tspan x="460" dy="38">InfiniBand or RoCEv2</tspan>
    <tspan x="460" dy="38">(6.12, Part 12)</tspan>
  </text>

  
  <rect x="825" y="670" width="365" height="320" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(850, 695)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="27" cy="14" rx="20" ry="8"/>
    <path d="M7 14 v24 c0 4.4 9 8 20 8 s20 -3.6 20 -8 v-24"/>
    <path d="M7 26 c0 4.4 9 8 20 8 s20 -3.6 20 -8"/>
  </g>
  
  <circle cx="1150" cy="710" r="24" fill="#db8129"/>
  <text x="1150" y="719" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="850" y="785" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="850" dy="0">Parallel storage:</tspan>
    <tspan x="850" dy="36">Lustre, GPFS, BeeGFS,</tspan>
    <tspan x="850" dy="36">WEKA, VAST</tspan>
    <tspan x="850" dy="36">(6.18 to 6.21, Part 13)</tspan>
  </text>

  
  <rect x="1215" y="495" width="335" height="495" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1240, 520)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="27" cy="27" r="12"/>
    <path d="M27 7 v6 M27 41 v6 M7 27 h6 M41 27 h6 M13 13 l5 5 M36 36 l5 5 M13 41 l5 -5 M36 18 l5 -5"/>
  </g>
  <text x="1240" y="605" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1240" dy="0">Management plane:</tspan>
    <tspan x="1240" dy="38">BMC Redfish,</tspan>
    <tspan x="1240" dy="38">PXE provisioning</tspan>
    <tspan x="1240" dy="38">xCAT Warewulf BCM,</tspan>
    <tspan x="1240" dy="38">LDAP, monitoring</tspan>
    <tspan x="1240" dy="38">(6.22 to 6.27)</tspan>
  </text>

  
  <path d="M 620 990 L 620 1015" stroke="#207448" stroke-width="4" fill="none"/>
  <polygon points="612,1015 620,1029 628,1015" fill="#207448"/>

  
  <rect x="50" y="1030" width="1500" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 1048)" stroke="#207448" stroke-width="4" fill="none">
    <polygon points="26,4 12,28 26,28 22,50 40,22 26,22" fill="none"/>
  </g>
  <text x="145" y="1088" font-family="sans-serif" font-size="27" font-weight="bold" fill="#303a36">
    Facility: power distribution, UPS, chillers, direct-to-chip liquid cooling (6.30, Part 9)
  </text>

  
  <rect x="50" y="1150" width="1500" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1198" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
    find the layer first, then use the table to find the chapter
  </text>
</svg>