<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Choosing how to share a GPU, with the config for each</title>
  <desc>A decision table from workload need to whole GPU, MIG, MPS or sharding with the slurm.conf syntax for each.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800">Choosing how to share a GPU, </tspan><tspan x="800" dy="48">with the config for each</tspan></text>

  
  <g id="row-whole-gpus">
    <rect x="40" y="176" width="1520" height="88" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#e8f1ea"/>
      <line x1="18" y1="2" x2="18" y2="10"/>
      <line x1="28" y1="2" x2="28" y2="10"/>
      <line x1="38" y1="2" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="54"/>
      <line x1="28" y1="46" x2="28" y2="54"/>
      <line x1="38" y1="46" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="10" y2="18"/>
      <line x1="2" y1="28" x2="10" y2="28"/>
      <line x1="2" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="54" y2="18"/>
      <line x1="46" y1="28" x2="54" y2="28"/>
      <line x1="46" y1="38" x2="54" y2="38"/>
    </g>
    <text x="142" y="226" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">Training, multi-GPU, performance-sensitive: </tspan><tspan font-family="monospace">whole GPUs, never share</tspan></text>
  </g>

  
  <g id="row-mig">
    <rect x="40" y="304" width="1520" height="280" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(62, 416)" stroke="#db8129" fill="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="50" height="50" rx="4" fill="none"/>
      <line x1="3" y1="19" x2="53" y2="19" stroke-width="3" fill="none"/>
      <line x1="3" y1="37" x2="53" y2="37" stroke-width="3" fill="none"/>
      <line x1="19" y1="3" x2="19" y2="37" stroke-width="3" fill="none"/>
      <line x1="37" y1="3" x2="37" y2="37" stroke-width="3" fill="none"/>
      <line x1="28" y1="37" x2="28" y2="53" stroke-width="3" fill="none"/>
      <circle cx="11" cy="11" r="2.5"/>
      <circle cx="28" cy="11" r="2.5"/>
      <circle cx="45" cy="11" r="2.5"/>
      <circle cx="11" cy="28" r="2.5"/>
      <circle cx="28" cy="28" r="2.5"/>
      <circle cx="45" cy="28" r="2.5"/>
      <circle cx="15" cy="45" r="2.5"/>
      <circle cx="41" cy="45" r="2.5"/>
    </g>
    <text x="142" y="340" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">Many small inference or dev jobs, isolation required: </tspan><tspan font-weight="bold" fill="#207448">MIG; </tspan><tspan>hardware partition of A100 or </tspan><tspan x="142" dy="31">H100 into up to seven isolated instances, each with own SMs, memory and bandwidth; Slurm </tspan><tspan x="142" dy="31">treats each instance as a GPU with cgroup isolation and task binding; config example </tspan><tspan x="142" dy="31" font-family="monospace">Gres=gpu:a100:1,gpu:a100_3g.20gb:2 </tspan><tspan>with </tspan><tspan font-family="monospace">AccountingStorageTRES gres/gpu:a100_3g.20gb; </tspan><tspan>Slurm </tspan><tspan x="142" dy="31">does not partition the GPU: create instances with </tspan><tspan font-family="monospace">nvidia-smi mig </tspan><tspan>or the GPU Operator MIG </tspan><tspan x="142" dy="31">manager before </tspan><tspan font-family="monospace">slurmd </tspan><tspan>starts; no dynamic MIG partitioning; static and fragmenting, a </tspan><tspan x="142" dy="31">3g.20gb instance cannot be merged; no NVLink or multi-GPU use; </tspan><tspan font-family="monospace">AutoDetect=nvml </tspan><tspan>is the only </tspan><tspan x="142" dy="31">mode that handles MIG</tspan></text>
  </g>

  
  <g id="row-mps">
    <rect x="40" y="624" width="1520" height="94" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 643)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <circle cx="28" cy="28" r="9" fill="#e8f1ea"/>
      <line x1="28" y1="4" x2="28" y2="14"/>
      <line x1="28" y1="42" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="14" y2="28"/>
      <line x1="42" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="18" y2="18"/>
      <line x1="38" y1="38" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="18" y2="38"/>
      <line x1="38" y1="18" x2="45" y2="11"/>
    </g>
    <text x="142" y="662" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">Many cooperating small processes, throughput, trusted users: </tspan><tspan font-weight="bold" fill="#207448">MPS; </tspan><tspan font-family="monospace">gres/mps count, </tspan><tspan x="142" dy="32" font-family="monospace">Gres=gpu:2,mps:200 </tspan><tspan>means 100 per GPU</tspan></text>
  </g>

  
  <g id="row-sharding">
    <rect x="40" y="758" width="1520" height="118" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 789)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="50" height="50" rx="4"/>
      <line x1="3" y1="19" x2="53" y2="19"/>
      <line x1="3" y1="37" x2="53" y2="37"/>
      <line x1="19" y1="3" x2="19" y2="53"/>
      <line x1="37" y1="3" x2="37" y2="53"/>
    </g>
    <text x="142" y="794" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">Maximum density, trusted workloads, simple: </tspan><tspan font-weight="bold" fill="#207448">sharding; </tspan><tspan x="142" dy="29" font-family="monospace">gres/shard, Gres=gpu:2,shard:64 </tspan><tspan>gives 32 shards per GPU; </tspan><tspan x="142" dy="29">by default it does not fence the processes or constrain device memory</tspan></text>
  </g>

  
  <g id="row-kubernetes">
    <rect x="40" y="916" width="1520" height="94" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 935)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="18"/>
      <circle cx="28" cy="28" r="7" fill="#e8f1ea"/>
      <line x1="28" y1="3" x2="28" y2="53"/>
      <line x1="3" y1="28" x2="53" y2="28"/>
      <line x1="10" y1="10" x2="46" y2="46"/>
      <line x1="10" y1="46" x2="46" y2="10"/>
    </g>
    <text x="142" y="954" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">Fractional GPUs for notebooks and serving across a platform: </tspan><tspan x="142" dy="32">consider Kubernetes (time-slicing, MIG, DRA)</tspan></text>
  </g>

  
  <g id="row-tip">
    <rect x="40" y="1050" width="1520" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(62, 1069)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="16,28 24,37 40,19"/>
    </g>
    <text x="142" y="1088" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-weight="bold" fill="#207448">keep MIG partitions and whole-GPU partitions separate; </tspan><tspan>check with a one-GPU test in each </tspan><tspan x="142" dy="32">and compare </tspan><tspan font-family="monospace">nvidia-smi -L; </tspan><tspan>MIG layout must be recreated before </tspan><tspan font-family="monospace">slurmd </tspan><tspan>after reboot</tspan></text>
  </g>
</svg>