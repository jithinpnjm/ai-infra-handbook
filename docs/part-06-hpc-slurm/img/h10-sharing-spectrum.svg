<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Sharing one GPU trades isolation for density</title>
  <desc>An arrow runs left to right from more isolation to more density. Above its left end sits a Whole GPU box, the default for training, noted never share. Below the arrow, three equal cards order MIG, MPS, and Sharding by increasing density, with MPS highlighted in orange. A green bar at the bottom states the takeaway.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  <text x="800" y="70" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" fill="#303a36">Sharing one GPU trades isolation for density</text>

  
  <rect x="46" y="110" width="440" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(70,126)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="2" width="52" height="52" rx="8"/>
    <rect x="18" y="18" width="20" height="20" rx="4"/>
  </g>
  <text x="142" y="168" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#303a36">Whole GPU</text>
  <text x="70" y="212" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#303a36">the default for training</text>
  <text x="70" y="244" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#207448">never share</text>

  
  <text x="46" y="310" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#303a36">more isolation</text>
  <text x="1554" y="310" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#303a36">more density</text>
  <line x1="46" y1="336" x2="1522" y2="336" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1554,336 1526,326 1526,346" fill="#207448"/>

  
  <rect x="46" y="390" width="476" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(72,414)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="2" width="52" height="52" rx="8"/>
    <path d="M28 2 L28 54"/>
    <path d="M2 28 L54 28"/>
  </g>
  <text x="72" y="504" font-family="Helvetica Neue, Arial, sans-serif" fill="#303a36">
    <tspan x="72" dy="0" font-size="34" font-weight="700">MIG </tspan>
    <tspan x="72" dy="38" font-size="30" font-weight="700">(Multi-Instance GPU)</tspan>
  </text>
  <text x="72" y="580" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="72" dy="0">hardware partitioned,</tspan>
    <tspan x="72" dy="34">strong isolation, static</tspan>
    <tspan x="72" dy="34">layout, no NVLink</tspan>
    <tspan x="72" dy="34">across slices</tspan>
  </text>

  
  <rect x="562" y="390" width="476" height="360" rx="16" fill="#fbeee2" stroke="#db8129" stroke-width="4"/>
  <g transform="translate(588,414)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="2" width="52" height="52" rx="8"/>
    <circle cx="17" cy="19" r="5"/>
    <circle cx="39" cy="19" r="5"/>
    <circle cx="28" cy="39" r="5"/>
  </g>
  <text x="588" y="504" font-family="Helvetica Neue, Arial, sans-serif" fill="#db8129">
    <tspan x="588" dy="0" font-size="34" font-weight="700">MPS</tspan>
    <tspan x="588" dy="38" font-size="30" font-weight="700">(Multi-Process Service)</tspan>
  </text>
  <text x="588" y="580" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="588" dy="0">several processes share</tspan>
    <tspan x="588" dy="34">one GPU, a percentage of</tspan>
    <tspan x="588" dy="34">GPU resources each, no</tspan>
    <tspan x="588" dy="34">memory isolation, trusted</tspan>
    <tspan x="588" dy="34">users only</tspan>
  </text>

  
  <rect x="1078" y="390" width="476" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1104,414)" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="28" cy="28" r="24"/>
    <path d="M28 28 L28 12"/>
    <path d="M28 28 L40 28"/>
  </g>
  <text x="1104" y="524" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700" fill="#303a36">Sharding</text>
  <text x="1104" y="580" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1104" dy="0">takes turns on a GPU,</tspan>
    <tspan x="1104" dy="34">does not fence processes</tspan>
    <tspan x="1104" dy="34">or constrain device memory</tspan>
    <tspan x="1104" dy="34">by default.</tspan>
  </text>

  
  <rect x="46" y="792" width="1508" height="64" rx="14" fill="#207448"/>
  <text x="800" y="833" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#f5f8f5">Each sharing method trades isolation for density, so choose by what the workload can tolerate.</text>
</svg>