<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>A warning signal, a clean stop, and a requeue</title>
  <desc>Swim lane infographic showing how Slurm sends a USR1 signal to trigger checkpointing, waits for training to cleanly terminate, and requeues the job.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A warning signal, a clean stop, and a requeue</text>

  
  <line x1="1250" y1="50" x2="1520" y2="50" stroke="#207448" stroke-width="3" stroke-dasharray="6,6" />
  <polygon points="1520,44 1545,50 1520,56" fill="#207448" />
  <text x="1310" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Time flows left to right</text>

  

  
  <rect x="40" y="100" width="1520" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="40" y="100" width="300" height="52" rx="12" fill="#207448" />
  <text x="55" y="136" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Batch shell (the script)</text>

  
  <rect x="40" y="380" width="1520" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="40" y="380" width="360" height="52" rx="12" fill="#207448" />
  <text x="55" y="416" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Training (srun python train.py)</text>

  
  <rect x="40" y="660" width="1520" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="40" y="660" width="280" height="52" rx="12" fill="#207448" />
  <text x="55" y="696" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">slurmctld (controller)</text>

  
  
  <path d="M 40,230 L 160,230" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <circle cx="190" cy="190" r="24" fill="#207448" />
  <text x="190" y="198" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <rect x="170" y="222" width="410" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="190" y="259" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">#SBATCH --signal=B:USR1@600</text>

  
  <rect x="170" y="286" width="390" height="64" rx="8" fill="#f5f8f5" stroke="#303a36" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="186" y="313" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="186" dy="0">600 seconds before the time</tspan>
    <tspan x="186" dy="28">limit, the batch shell receives USR1</tspan>
  </text>

  
  <path d="M 585,250 L 610,250" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(620, 160)">
    
    <rect x="0" y="0" width="320" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="24" fill="#207448" />
    <text x="36" y="44" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(240, 14)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="14" />
      <path d="M 24,4 L 24,10 M 24,38 L 24,44 M 4,24 L 10,24 M 38,24 L 44,24 M 10,10 L 14,14 M 34,34 L 38,38 M 10,38 L 14,34 M 34,14 L 38,10" />
    </g>
    
    <text x="24" y="98" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="24" dy="0">trap runs</tspan>
      <tspan x="24" dy="34" font-family="monospace">checkpoint_and_requeue</tspan>
    </text>
  </g>

  
  
  <circle cx="680" cy="365" r="24" fill="#207448" />
  <text x="680" y="373" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <path d="M 720,345 L 720,445" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="735" y="365" width="420" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="750" y="400" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kill -TERM on the training process</text>

  
  <g transform="translate(620, 455)">
    <rect x="0" y="0" width="530" height="155" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 20)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="24" cy="14" rx="20" ry="8" />
      <path d="M 4,14 L 4,38 A 20 8 0 0 0 44 38 L 44,14" />
      <path d="M 4,26 A 20 8 0 0 0 44 26" />
    </g>
    <text x="85" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">SIGTERM received</text>
    <text x="24" y="96" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">the training program writes a</tspan>
      <tspan x="24" dy="32">checkpoint on SIGTERM</tspan>
    </text>
  </g>

  
  
  <path d="M 970,250 L 1005,250" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <g transform="translate(1015, 160)">
    
    <rect x="0" y="0" width="310" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="24" fill="#207448" />
    <text x="36" y="44" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(240, 14)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="20" />
      <polyline points="24,12 24,24 34,24" />
    </g>
    
    <text x="24" y="100" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="24" dy="0">wait for training</tspan>
      <tspan x="24" dy="34">to exit</tspan>
    </text>
  </g>

  
  
  <path d="M 1335,250 L 1380,250 L 1380,725" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <circle cx="1380" cy="390" r="24" fill="#db8129" />
  <text x="1380" y="398" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  
  <rect x="1150" y="430" width="400" height="56" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="1165" y="466" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">scontrol requeue $SLURM_JOB_ID</text>

  
  <g transform="translate(780, 730)">
    
    <rect x="0" y="0" width="650" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="36" cy="38" r="24" fill="#207448" />
    <text x="36" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

    
    <g transform="translate(570, 16)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 12,24 A 18,18 0 1,1 36,40" />
      <polygon points="36,46 44,36 32,36" fill="#207448" />
    </g>

    
    <text x="75" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="75" dy="0">job goes back to the queue</tspan>
      <tspan x="75" dy="32">with the same job ID</tspan>
    </text>

    
    <rect x="24" y="130" width="590" height="76" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="40" y="162" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">the next run sees</tspan>
      <tspan x="40" dy="28" font-family="monospace" font-weight="bold">SLURM_RESTART_COUNT</tspan>
      <tspan font-family="sans-serif"> increase</tspan>
    </text>
  </g>

  
  <rect x="40" y="1015" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1062" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Periodic checkpoints are the real safety net; the signal handler saves the wait for the next checkpoint.</text>
</svg>