<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>The accounting model</title>
  <desc>Association tree hierarchy for cluster mycluster showing root account, department accounts for physics and biology, and individual user accounts with usage and fairshare metrics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The accounting model</text>

  
  <g id="TREE">
    <rect x="50" y="120" width="1500" height="870" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="50" y="120" width="760" height="50" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="154" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">sacctmgr Association Tree (Cluster: mycluster)</text>

    
    <g id="ROOT">
      <rect x="480" y="200" width="640" height="170" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(772, 216)">
        <rect x="0" y="0" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
        <circle cx="10" cy="7" r="2.5" fill="#207448"/>
        <line x1="22" y1="7" x2="46" y2="7" stroke="#207448" stroke-width="3"/>
        <rect x="0" y="19" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
        <circle cx="10" cy="26" r="2.5" fill="#207448"/>
        <line x1="22" y1="26" x2="46" y2="26" stroke="#207448" stroke-width="3"/>
        <rect x="0" y="38" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
        <circle cx="10" cy="45" r="2.5" fill="#207448"/>
        <line x1="22" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="3"/>
      </g>
      <text x="800" y="316" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">root account</text>
      <text x="800" y="350" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(100 total shares)</text>
    </g>

    
    <g id="PHYS">
      <rect x="170" y="450" width="520" height="170" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(430, 496)">
        <circle cx="0" cy="0" r="5" fill="#207448"/>
        <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="3"/>
        <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="3" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="3" transform="rotate(-60)"/>
      </g>
      <text x="430" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">physics account</text>
      <text x="430" y="600" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(shares=60, LF=0.622)</text>
    </g>

    
    <g id="BIO">
      <rect x="910" y="450" width="520" height="170" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(1170, 496)">
        <path d="M -8 -20 L 8 -20 M -5 -20 L -5 -8 L -23 20 A 4 4 0 0 0 -19 26 L 19 26 A 4 4 0 0 0 23 20 L 5 -8 L 5 -20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M -15 12 Q 0 16 15 12" fill="none" stroke="#207448" stroke-width="2.5"/>
        <circle cx="-3" cy="3" r="2" fill="#207448"/>
        <circle cx="6" cy="-2" r="1.5" fill="#207448"/>
      </g>
      <text x="1170" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">biology account</text>
      <text x="1170" y="600" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(shares=40, LF=11.400)</text>
    </g>

    
    <g id="ALICE">
      <rect x="90" y="700" width="320" height="240" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3.5"/>
      
      <g transform="translate(250, 742)">
        <circle cx="0" cy="-10" r="14" fill="none" stroke="#db8129" stroke-width="3.5"/>
        <path d="M -22 22 C -22 6, -12 4, 0 4 C 12 4, 22 6, 22 22" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="250" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">alice</text>
      <text x="250" y="862" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(usage=5000,</text>
      <text x="250" y="898" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">FairShare=0.25)</text>
    </g>

    
    <g id="BOB">
      <rect x="450" y="700" width="320" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(610, 742)">
        <circle cx="0" cy="-10" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M -22 22 C -22 6, -12 4, 0 4 C 12 4, 22 6, 22 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="610" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">bob</text>
      <text x="610" y="862" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(usage=500,</text>
      <text x="610" y="898" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">FairShare=0.50)</text>
    </g>

    
    <g id="CAROL">
      <rect x="830" y="700" width="320" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(990, 742)">
        <circle cx="0" cy="-10" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M -22 22 C -22 6, -12 4, 0 4 C 12 4, 22 6, 22 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="990" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">carol</text>
      <text x="990" y="862" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(usage=100,</text>
      <text x="990" y="898" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">FairShare=1.00)</text>
    </g>

    
    <g id="DAVE">
      <rect x="1190" y="700" width="320" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(1350, 742)">
        <circle cx="0" cy="-10" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M -22 22 C -22 6, -12 4, 0 4 C 12 4, 22 6, 22 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="1350" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">dave</text>
      <text x="1350" y="862" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(usage=100,</text>
      <text x="1350" y="898" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">FairShare=0.75)</text>
    </g>

    
     PHYS -->
    <path d="M 640 370 L 640 410 L 430 410 L 430 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

     BIO -->
    <path d="M 960 370 L 960 410 L 1170 410 L 1170 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

     ALICE -->
    <path d="M 330 620 L 330 660 L 250 660 L 250 700" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

     BOB -->
    <path d="M 530 620 L 530 660 L 610 660 L 610 700" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

     CAROL -->
    <path d="M 1070 620 L 1070 660 L 990 660 L 990 700" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

     DAVE -->
    <path d="M 1270 620 L 1270 660 L 1350 660 L 1350 700" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>