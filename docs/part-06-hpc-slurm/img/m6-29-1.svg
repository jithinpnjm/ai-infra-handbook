<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>What a container is, and why HPC needed new runtimes</title>
  <desc>Flowchart diagram showing the four-stage HPC container pipeline from pinned recipe in git, to CI build and sign, to shared filesystem storage, to Slurm launch with hybrid MPI and host drivers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="50" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What a container is, and why HPC needed new runtimes</text>

  
  <g id="node-recipe">
    
    <rect x="50" y="140" width="710" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(78, 162)">
      <path d="M 10 6 L 36 6 L 46 16 L 46 50 L 10 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 36 6 L 36 16 L 46 16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="22" cy="26" r="4" fill="#207448" />
      <circle cx="34" cy="38" r="4" fill="#207448" />
      <path d="M 22 26 L 22 42 M 22 34 L 34 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="152" y="200" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">1. Pinned Recipe in Git</text>
    
    
    <line x1="78" y1="234" x2="732" y2="234" stroke="#207448" stroke-width="2" stroke-opacity="0.25" />

    
    <rect x="74" y="250" width="662" height="176" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    <text x="100" y="315" font-family="monospace" font-size="24" fill="#303a36">@sha256 + requirements.lock</text>
    <text x="100" y="385" font-family="monospace" font-size="24" fill="#303a36">+ container_lint.py</text>
  </g>

  
  <line x1="760" y1="295" x2="840" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-build">
    
    <rect x="840" y="140" width="710" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(868, 162)">
      <path d="M 28 6 L 46 14 C 46 34 28 48 28 48 C 28 48 10 34 10 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 19 26 L 25 32 L 37 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="942" y="200" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">2. CI Build &amp; Sign</text>
    
    
    <line x1="868" y1="234" x2="1522" y2="234" stroke="#207448" stroke-width="2" stroke-opacity="0.25" />

    
    <rect x="864" y="250" width="662" height="176" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    <text x="890" y="315" font-family="monospace" font-size="24" fill="#303a36">apptainer build --fakeroot</text>
    <text x="890" y="385" font-family="monospace" font-size="24" fill="#303a36">%test + syft SBOM + sign</text>
  </g>

  
  <path d="M 1195 450 L 1195 500 Q 1195 510 1185 510 L 415 510 Q 405 510 405 520 L 405 570" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-store">
    
    <rect x="50" y="570" width="710" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(78, 592)">
      <ellipse cx="28" cy="14" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 14 L 10 38 C 10 44 46 44 46 38 L 46 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 26 C 10 32 46 32 46 26" fill="none" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="152" y="630" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">3. Shared FS / Registry</text>
    
    
    <line x1="78" y1="664" x2="732" y2="664" stroke="#207448" stroke-width="2" stroke-opacity="0.25" />

    
    <rect x="74" y="680" width="662" height="176" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    <text x="100" y="745" font-family="monospace" font-size="24" fill="#303a36">/shared/containers/app.sif</text>
    <text x="100" y="815" font-family="monospace" font-size="24" fill="#303a36">or Enroot .sqsh</text>
  </g>

  
  <line x1="760" y1="725" x2="840" y2="725" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-run">
    
    <rect x="840" y="570" width="710" height="310" rx="16" fill="#fdf8f3" stroke="#db8129" stroke-width="3.5" />
    
    
    <g transform="translate(868, 592)">
      <rect x="14" y="14" width="28" height="28" rx="4" fill="none" stroke="#db8129" stroke-width="4" />
      <rect x="22" y="22" width="12" height="12" rx="2" fill="#db8129" />
      
      <path d="M 21 6 L 21 14 M 28 6 L 28 14 M 35 6 L 35 14" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 21 42 L 21 50 M 28 42 L 28 50 M 35 42 L 35 50" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 6 21 L 14 21 M 6 28 L 14 28 M 6 35 L 14 35" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 42 21 L 50 21 M 42 28 L 50 28 M 42 35 L 50 35" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="942" y="630" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">4. Slurm Launch (srun --mpi=pmix)</text>
    
    
    <line x1="868" y1="664" x2="1522" y2="664" stroke="#db8129" stroke-width="2" stroke-opacity="0.3" />

    
    <rect x="864" y="680" width="662" height="176" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5" stroke-opacity="0.35" />
    <text x="890" y="745" font-family="monospace" font-size="24" fill="#303a36">apptainer exec --nv --cleanenv</text>
    <text x="890" y="815" font-family="sans-serif" font-size="24" fill="#303a36">(Hybrid MPI + Host Driver)</text>
  </g>
</svg>