<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Rendezvous stalls: checks in the order they bite</title>
  <desc>Numbered checklist and diagnostic order for distributed PyTorch training jobs that stall during c10d rendezvous.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Rendezvous stalls: checks in the order they bite</text>
  <text x="800" y="104" font-family="sans-serif" font-size="25" font-weight="500" fill="#303a36" text-anchor="middle">Numbered checklist for a job that stalls before training starts.</text>

  
  <g id="item-1">
    <rect x="60" y="140" width="1480" height="155" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <circle cx="115" cy="217" r="24" fill="#db8129"/>
    <text x="115" y="226" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <rect x="171" y="196" width="48" height="42" rx="6" fill="none" stroke="#db8129" stroke-width="4"/>
    <path d="M183 238 V226 H207 V238" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="187" y1="205" x2="187" y2="215" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="195" y1="205" x2="195" y2="215" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="203" y1="205" x2="203" y2="215" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

    
    <text x="255" y="190" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">1 Port: </tspan>
      <tspan font-size="24">derive it from the job ID or ask the site which ports are free;</tspan>
      <tspan x="255" y="226" font-size="24">firewalls must allow the range between compute nodes; a blocked port leaves</tspan>
      <tspan x="255" y="262" font-size="24">other nodes waiting with no clear error</tspan>
    </text>
  </g>

  
  <g id="item-2">
    <rect x="60" y="320" width="1480" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="115" cy="422" r="24" fill="#207448"/>
    <text x="115" y="431" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <rect x="171" y="400" width="48" height="20" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="171" y="426" width="48" height="20" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="181" cy="410" r="2.5" fill="#207448"/>
    <circle cx="189" cy="410" r="2.5" fill="#207448"/>
    <circle cx="181" cy="436" r="2.5" fill="#207448"/>
    <circle cx="189" cy="436" r="2.5" fill="#207448"/>
    <line x1="201" y1="410" x2="211" y2="410" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="201" y1="436" x2="211" y2="436" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <text x="255" y="360" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">2 </tspan>
      <tspan font-size="30" font-weight="bold" font-family="monospace">MASTER_ADDR </tspan>
      <tspan font-size="24">must resolve and be reachable from every node on the</tspan>
      <tspan x="255" y="394" font-size="24">interface you intend to use; the first hostname in the nodelist is usually the</tspan>
      <tspan x="255" y="428" font-size="24">management name, so ask if the management network is the one you want; if</tspan>
      <tspan x="255" y="462" font-size="24">management and fabric networks differ the torch TCP store uses whichever</tspan>
      <tspan x="255" y="496" font-size="24">address </tspan>
      <tspan font-size="24" font-family="monospace">MASTER_ADDR </tspan>
      <tspan font-size="24">resolves to</tspan>
    </text>
  </g>

  
  <g id="item-3">
    <rect x="60" y="550" width="1480" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="115" cy="615" r="24" fill="#207448"/>
    <text x="115" y="624" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <circle cx="195" cy="615" r="9" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="175" cy="600" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="215" cy="600" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="195" cy="635" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="180" y1="604" x2="188" y2="610" stroke="#207448" stroke-width="3.5"/>
    <line x1="210" y1="604" x2="202" y2="610" stroke="#207448" stroke-width="3.5"/>
    <line x1="195" y1="624" x2="195" y2="629" stroke="#207448" stroke-width="3.5"/>

    
    <text x="255" y="600" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">3 c10d rendezvous: </tspan>
      <tspan font-size="24">endpoint host reachable and </tspan>
      <tspan font-size="24" font-family="monospace">--rdzv-id</tspan>
      <tspan font-size="24"> unique per job;</tspan>
      <tspan x="255" y="638" font-size="24">reusing an ID can collide with an earlier run</tspan>
    </text>
  </g>

  
  <g id="item-4">
    <rect x="60" y="705" width="1480" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="115" cy="770" r="24" fill="#207448"/>
    <text x="115" y="779" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <rect x="175" y="760" width="40" height="30" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M183 760 V749 A12 12 0 0 1 207 749 V760" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="195" cy="772" r="3" fill="#207448"/>
    <line x1="195" y1="775" x2="195" y2="781" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

    
    <text x="255" y="755" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">4 One job per port per node at a time; </tspan>
      <tspan font-size="24" font-family="monospace">--exclusive</tspan>
      <tspan font-size="24"> helps because the</tspan>
      <tspan x="255" y="793" font-size="24">nodes are yours alone</tspan>
    </text>
  </g>

  
  <g id="item-5">
    <rect x="60" y="860" width="1480" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="115" cy="937" r="24" fill="#207448"/>
    <text x="115" y="946" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    
    <circle cx="195" cy="940" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="195" y1="913" x2="195" y2="918" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M195 926 V940 L205 940" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    
    <text x="255" y="910" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">5 Ranks starting at different times </tspan>
      <tspan font-size="24">(slow image pull or module load) can fire</tspan>
      <tspan x="255" y="946" font-size="24">the rendezvous timeout; raise the timeout and fix the slow start too;</tspan>
      <tspan x="255" y="982" font-size="24">a longer timeout hides the symptom</tspan>
    </text>
  </g>

  
  <g id="footer-takeaway">
    <rect x="60" y="1045" width="1480" height="85" rx="12" fill="#207448"/>
    <text x="800" y="1098" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">port problems are quiet and look like a slow start rather than a broken one</text>
  </g>
</svg>