<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Controller starts with an empty queue: recovery options</title>
  <desc>Visual infographic explaining Slurm controller empty queue causes, startup recovery flags, and split-brain recovery sequence.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Controller starts with an empty queue: recovery options</text>

  
  
  
  <g id="part-1-container">
    <rect x="40" y="100" width="740" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Part 1 causes</text>

    
    <rect x="65" y="160" width="690" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 184)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="8" width="48" height="40" rx="6" />
      <line x1="14" y1="20" x2="22" y2="20" />
      <line x1="14" y1="28" x2="22" y2="28" />
      <line x1="36" y1="18" x2="36" y2="30" />
      <circle cx="36" cy="38" r="2" fill="#207448" />
      <line x1="28" y1="4" x2="28" y2="8" />
    </g>
    <text x="150" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" y="193"><tspan font-family="monospace">slurmctld</tspan> exits with a permission</tspan>
      <tspan x="150" y="221">or I/O error, or after a crash</tspan>
      <tspan x="150" y="249">queued jobs have vanished</tspan>
    </text>

    
    <rect x="65" y="276" width="690" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 282)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 4 12 L 18 12 L 24 18 L 50 18 L 50 48 L 4 48 Z" />
      <rect x="22" y="28" width="16" height="14" rx="2" />
      <path d="M 26 28 L 26 22 A 4 4 0 0 1 34 22 L 34 28" />
    </g>
    <text x="150" y="316" font-family="sans-serif" font-size="24" fill="#303a36">directory not writable by <tspan font-family="monospace">SlurmUser</tspan></text>

    
    <rect x="65" y="350" width="690" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 356)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="7" />
      <path d="M 6 14 L 6 38 A 22 7 0 0 0 50 38 L 50 14" />
      <path d="M 6 26 A 22 7 0 0 0 50 26" />
      <line x1="38" y1="38" x2="48" y2="48" />
    </g>
    <text x="150" y="390" font-family="sans-serif" font-size="24" fill="#303a36">full or slow filesystem</text>

    
    <rect x="65" y="424" width="690" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 430)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="10" width="18" height="32" rx="3" />
      <rect x="34" y="10" width="18" height="32" rx="3" />
      <line x1="22" y1="26" x2="26" y2="26" />
      <line x1="30" y1="26" x2="34" y2="26" />
      <line x1="25" y1="21" x2="31" y2="31" />
    </g>
    <text x="150" y="464" font-family="sans-serif" font-size="24" fill="#303a36">not shared in an HA pair</text>

    
    <rect x="65" y="498" width="690" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 504)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 26 A 18 18 0 1 1 38 14" />
      <polyline points="38 6 38 16 48 16" />
      <line x1="18" y1="26" x2="32" y2="26" />
    </g>
    <text x="150" y="538" font-family="sans-serif" font-size="24" fill="#303a36">wiped during a reinstall</text>

    
    <rect x="65" y="572" width="690" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(80, 584)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 6 8 L 32 8 L 42 18 L 42 48 L 6 48 Z" />
      <line x1="14" y1="22" x2="24" y2="22" />
      <line x1="14" y1="30" x2="34" y2="30" />
      <circle cx="34" cy="38" r="8" />
      <line x1="40" y1="44" x2="48" y2="52" />
    </g>
    <text x="150" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" y="604">check the log for</tspan>
      <tspan x="150" y="632"><tspan font-family="monospace">StateSaveLocation</tspan> errors</tspan>
    </text>
  </g>

  
  
  
  <g id="part-2-container">
    <rect x="820" y="100" width="740" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="850" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Part 2 recovery flags</text>

    
    <rect x="845" y="160" width="690" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(860, 207)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="44" height="44" rx="8" />
      <path d="M 16 20 L 24 28 L 40 14" />
      <line x1="16" y1="36" x2="38" y2="36" stroke-dasharray="4 4" />
    </g>
    <text x="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" y="200"><tspan font-family="monospace">default:</tspan> recover partial state,</tspan>
      <tspan x="935" y="234">jobs and node DOWN or DRAIN state</tspan>
      <tspan x="935" y="268">with reasons, but not partition state</tspan>
    </text>

    
    <rect x="845" y="330" width="690" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(860, 367)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="7" />
      <path d="M 6 14 L 6 40 A 22 7 0 0 0 50 40 L 50 14" />
      <path d="M 6 27 A 22 7 0 0 0 50 27" />
      <path d="M 20 27 L 26 33 L 38 21" />
    </g>
    <text x="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" y="380"><tspan font-family="monospace">slurmctld -R:</tspan> recover full state</tspan>
      <tspan x="935" y="414">including partitions</tspan>
    </text>

    
    <rect x="845" y="480" width="690" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(860, 517)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" />
      <line x1="28" y1="20" x2="28" y2="30" />
      <circle cx="28" cy="37" r="2" fill="#207448" />
    </g>
    <text x="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" y="530"><tspan font-family="monospace">-i:</tspan> ignore errors reading state files</tspan>
      <tspan x="935" y="564">(has a cost)</tspan>
    </text>
  </g>

  
  
  
  <g id="recovery-order-container">
    <rect x="40" y="695" width="1520" height="405" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="735" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Recovery order after two controllers believed they were primary</text>

    
    <rect x="65" y="760" width="450" height="135" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
    <circle cx="105" cy="798" r="24" fill="#db8129" />
    <text x="105" y="806" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(145, 774)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="24" cy="24" r="20" />
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#db8129" />
    </g>
    <text x="90" y="852" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="852">1 stop all but one</tspan>
      <tspan x="90" y="880">controller</tspan>
    </text>

    
    <rect x="575" y="760" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="615" cy="798" r="24" fill="#207448" />
    <text x="615" y="806" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(655, 774)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="36" height="32" rx="4" />
      <line x1="6" y1="24" x2="42" y2="24" />
      <path d="M 24 32 L 24 16 L 18 22" />
    </g>
    <text x="600" y="852" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" y="852">2 restore <tspan font-family="monospace">StateSaveLocation</tspan></tspan>
      <tspan x="600" y="880">from backup</tspan>
    </text>

    
    <rect x="1085" y="760" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="1125" cy="798" r="24" fill="#207448" />
    <text x="1125" y="806" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(1165, 774)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="40" height="36" rx="6" />
      <polygon points="20,16 32,24 20,32" fill="#207448" />
    </g>
    <text x="1110" y="852" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1110" y="852">3 start with the</tspan>
      <tspan x="1110" y="880">default or <tspan font-family="monospace">-R</tspan></tspan>
    </text>

    
    <rect x="1085" y="935" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="1125" cy="973" r="24" fill="#207448" />
    <text x="1125" y="981" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(1165, 949)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="36" height="38" rx="4" />
      <path d="M 14 18 L 20 24 L 34 10" />
      <line x1="14" y1="32" x2="32" y2="32" />
    </g>
    <text x="1110" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1110" y="1018">4 validate with <tspan font-family="monospace">squeue</tspan> and</tspan>
      <tspan x="1110" y="1046"><tspan font-family="monospace">sinfo</tspan> before reopening the queue</tspan>
    </text>

    
    <rect x="575" y="935" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="615" cy="973" r="24" fill="#207448" />
    <text x="615" y="981" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(655, 949)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="20" cy="14" r="8" />
      <path d="M 8 36 C 8 28 14 26 20 26 C 26 26 32 28 32 36" />
      <path d="M 32 18 L 42 18 L 42 34 L 32 34 Z" />
      <line x1="36" y1="24" x2="38" y2="24" />
    </g>
    <text x="600" y="1027" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" y="1027">5 have users resubmit</tspan>
      <tspan x="600" y="1055">what was lost</tspan>
    </text>

    
    <rect x="65" y="935" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="105" cy="973" r="24" fill="#207448" />
    <text x="105" y="981" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g transform="translate(145, 949)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="22" cy="20" r="14" />
      <line x1="32" y1="30" x2="44" y2="42" />
      <circle cx="22" cy="20" r="4" fill="#207448" />
    </g>
    <text x="90" y="1027" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="1027">6 find why two</tspan>
      <tspan x="90" y="1055">controllers ran</tspan>
    </text>

    
    
    <line x1="515" y1="827" x2="573" y2="827" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <line x1="1025" y1="827" x2="1083" y2="827" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <line x1="1310" y1="895" x2="1310" y2="933" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <line x1="1085" y1="1002" x2="1027" y2="1002" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <line x1="575" y1="1002" x2="517" y2="1002" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  
  
  <g id="takeaway-bar">
    <rect x="40" y="1120" width="1520" height="65" rx="12" fill="#207448" />
    
    <g transform="translate(65, 1128)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 24 4 L 42 12 L 42 26 C 42 38 24 46 24 46 C 24 46 6 38 6 26 L 6 12 Z" />
      <path d="M 16 24 L 22 30 L 32 18" />
    </g>
    <text x="130" y="1161" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">do not run two active controllers on independent state; exactly one controller can ever be primary</text>
  </g>
</svg>