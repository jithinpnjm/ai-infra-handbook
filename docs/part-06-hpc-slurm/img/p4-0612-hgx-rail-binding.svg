<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Rail-Optimized HGX NUMA, GPU, and NIC Binding Architecture</title>
  <desc>Architecture infographic illustrating NUMA domain isolation, local GPU-to-NIC rail alignment, and the cross-socket interconnect traversal anti-pattern on an 8-GPU HGX system.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-upi" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 6 L 11 6 M 6 1 L 11 6 L 6 11" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
