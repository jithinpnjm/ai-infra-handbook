<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Cluster roles and the doors between them</title>
  <desc>Architecture infographic illustrating Slurm cluster roles, port connections between slurmctld, slurmd, slurmdbd, client tools, and foundational cluster prerequisites.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Cluster roles and the doors between them</text>

  
  <g transform="translate(240, 85)">
    <rect x="0" y="0" width="1120" height="52" rx="10" fill="#fdf3e7" stroke="#db8129" stroke-width="2"/>
    
    <path d="M 32 32 L 32 23 C 32 17 37 13 43 13 C 49 13 54 17 54 23 L 54 32 Z M 27 32 L 59 32 L 59 44 L 27 44 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="43" cy="37" r="2" fill="#db8129"/>
    <text x="575" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#964b00">a shut door gives no helpful message: the sender waits until it gives up</text>
  </g>

  

  
  <line x1="400" y1="285" x2="600" y2="285" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="420" y="254" width="160" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="500" y="280" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">6817 to</text>
  <text x="500" y="306" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">slurmctld</text>

  
  <line x1="1020" y1="285" x2="1220" y2="285" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1040" y="254" width="160" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1120" y="280" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">6819 to</text>
  <text x="1120" y="306" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">slurmdbd</text>

  
  <line x1="810" y1="610" x2="810" y2="770" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="715" y="663" width="190" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="810" y="698" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">6818 to slurmd</text>

  
  <path d="M 220 390 L 220 500" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
  <path d="M 500 620 L 530 620 L 530 870 L 560 870" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

  

  
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="360" height="225" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="24" y="24" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="35" x2="70" y2="35" stroke="#207448" stroke-width="2"/>
    <circle cx="32" cy="30" r="2" fill="#207448"/>
    <circle cx="40" cy="30" r="2" fill="#207448"/>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" y="92" font-weight="bold" fill="#207448">Login or submit nodes:</tspan>
      <tspan x="24" y="128">client tools, munge,</tspan>
      <tspan x="24" y="164">sackd; scale with</tspan>
      <tspan x="24" y="200">users</tspan>
    </text>
  </g>

  
  <g transform="translate(600, 165)">
    <rect x="0" y="0" width="420" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="24" y="22" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="34" y="32" width="24" height="24" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="32" y1="14" x2="32" y2="22" stroke="#207448" stroke-width="2"/>
    <line x1="44" y1="14" x2="44" y2="22" stroke="#207448" stroke-width="2"/>
    <line x1="56" y1="14" x2="56" y2="22" stroke="#207448" stroke-width="2"/>
    <line x1="32" y1="66" x2="32" y2="74" stroke="#207448" stroke-width="2"/>
    <line x1="44" y1="66" x2="44" y2="74" stroke="#207448" stroke-width="2"/>
    <line x1="56" y1="66" x2="56" y2="74" stroke="#207448" stroke-width="2"/>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" y="95" font-weight="bold" fill="#207448">Controllers: slurmctld</tspan>
      <tspan x="24" y="131">primary and backup; fast</tspan>
      <tspan x="24" y="167">CPU cores because the</tspan>
      <tspan x="24" y="203">scheduler is largely single-</tspan>
      <tspan x="24" y="239">threaded in critical sections,</tspan>
      <tspan x="24" y="275">plenty of RAM, local SSD or</tspan>
      <tspan x="24" y="311">very reliable shared filesystem</tspan>
      <tspan x="24" y="347">for StateSaveLocation;</tspan>
      <tspan x="24" y="383">not a GPU node</tspan>
    </text>
  </g>

  
  <g transform="translate(1220, 165)">
    <rect x="0" y="0" width="340" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <ellipse cx="48" cy="28" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 26 28 L 26 44 C 26 48 36 52 48 52 C 60 52 70 48 70 44 L 70 28" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 26 44 L 26 60 C 26 64 36 68 48 68 C 60 68 70 64 70 60 L 70 44" fill="none" stroke="#207448" stroke-width="3"/>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" y="95" font-weight="bold" fill="#207448">Accounting database</tspan>
      <tspan x="20" y="131" font-weight="bold" fill="#207448">host: MariaDB or</tspan>
      <tspan x="20" y="167">MySQL plus slurmdbd;</tspan>
      <tspan x="20" y="203">own host or at least</tspan>
      <tspan x="20" y="239">own disk; InnoDB</tspan>
      <tspan x="20" y="275">buffer pool sized for</tspan>
      <tspan x="20" y="311">job history;</tspan>
      <tspan x="20" y="347">back it up</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 500)">
    <rect x="0" y="0" width="460" height="235" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" y="44">srun opens ephemeral ports</tspan>
      <tspan x="24" y="80">on the submit node for I/O</tspan>
      <tspan x="24" y="116">and step traffic; restrict with</tspan>
      <tspan x="24" y="152" font-family="monospace" font-weight="bold" fill="#964b00">SrunPortRange;</tspan>
      <tspan x="24" y="188">compute nodes must also</tspan>
      <tspan x="24" y="218">resolve and reach each other</tspan>
    </text>
  </g>

  
  <g transform="translate(560, 770)">
    <rect x="0" y="0" width="500" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="24" y="24" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="36" x2="72" y2="36" stroke="#207448" stroke-width="2"/>
    <line x1="24" y1="48" x2="72" y2="48" stroke="#207448" stroke-width="2"/>
    <circle cx="32" cy="30" r="2" fill="#207448"/>
    <circle cx="32" cy="42" r="2" fill="#207448"/>
    <circle cx="32" cy="54" r="2" fill="#207448"/>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" y="96" font-weight="bold" fill="#207448">Compute nodes: slurmd</tspan>
      <tspan x="24" y="132">and munge; reserve some</tspan>
      <tspan x="24" y="168">CPU and memory for OS</tspan>
      <tspan x="24" y="204">and daemons</tspan>
    </text>
  </g>

  
  <g transform="translate(1120, 770)">
    <rect x="0" y="0" width="440" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,6"/>
    
    <circle cx="48" cy="44" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 48 24 L 48 30 M 48 58 L 48 64 M 28 44 L 34 44 M 62 44 L 68 44 M 34 30 L 39 35 M 57 53 L 62 58 M 34 58 L 39 53 M 57 35 L 62 30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" y="96" font-weight="bold" fill="#207448">Optional: slurmrestd</tspan>
      <tspan x="24" y="132">host, monitoring exporter,</tspan>
      <tspan x="24" y="168">often on a management</tspan>
      <tspan x="24" y="204">node</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1070)">
    <rect x="0" y="0" width="1520" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="760" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="760" dy="0">DNS or /etc/hosts consistency, time sync, consistent UIDs and GIDs,</tspan>
      <tspan x="760" dy="34">shared home or data filesystem, dedicated unprivileged slurm system user</tspan>
    </text>
  </g>

</svg>