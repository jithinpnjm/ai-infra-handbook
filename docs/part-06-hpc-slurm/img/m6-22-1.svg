<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The boot chain</title>
  <desc>Visual explanation of the five-stage boot chain from firmware initialization to rootfs and system services.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">The boot chain</text>

  
  <g id="node-1">
    <rect x="48" y="150" width="268" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="182" cy="204" r="24" fill="#207448"/>
    <text x="182" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(154, 246)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="40" height="40" rx="4"/>
      <rect x="18" y="18" width="20" height="20"/>
      <line x1="20" y1="2" x2="20" y2="8"/>
      <line x1="28" y1="2" x2="28" y2="8"/>
      <line x1="36" y1="2" x2="36" y2="8"/>
      <line x1="20" y1="48" x2="20" y2="54"/>
      <line x1="28" y1="48" x2="28" y2="54"/>
      <line x1="36" y1="48" x2="36" y2="54"/>
      <line x1="2" y1="20" x2="8" y2="20"/>
      <line x1="2" y1="28" x2="8" y2="28"/>
      <line x1="2" y1="36" x2="8" y2="36"/>
      <line x1="48" y1="20" x2="54" y2="20"/>
      <line x1="48" y1="28" x2="54" y2="28"/>
      <line x1="48" y1="36" x2="54" y2="36"/>
    </g>

    
    <text x="182" y="350" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="182" dy="0">1. Firmware</tspan>
      <tspan x="182" dy="40">(BIOS / UEFI)</tspan>
    </text>

    
    <line x1="72" y1="460" x2="292" y2="460" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

    
    <text x="182" y="550" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="182" dy="0">DHCPDISCOVER</tspan>
      <tspan x="182" dy="38">(Opt 60, 93)</tspan>
    </text>
  </g>

  
  <g id="arrow-1-2">
    <line x1="316" y1="480" x2="339" y2="480" stroke="#207448" stroke-width="4"/>
    <polygon points="339,471 357,480 339,489" fill="#207448"/>
  </g>

  
  <g id="node-2">
    <rect x="357" y="150" width="268" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="491" cy="204" r="24" fill="#207448"/>
    <text x="491" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(463, 246)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="44" height="18" rx="3"/>
      <rect x="6" y="32" width="44" height="18" rx="3"/>
      <circle cx="14" cy="15" r="2" fill="#207448"/>
      <circle cx="22" cy="15" r="2" fill="#207448"/>
      <circle cx="14" cy="41" r="2" fill="#207448"/>
      <circle cx="22" cy="41" r="2" fill="#207448"/>
      <line x1="28" y1="24" x2="28" y2="32"/>
    </g>

    
    <text x="491" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="491" dy="0">2. DHCP +</tspan>
      <tspan x="491" dy="40">TFTP</tspan>
      <tspan x="491" dy="40">(Port 69)</tspan>
    </text>

    
    <line x1="381" y1="460" x2="601" y2="460" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

    
    <text x="491" y="530" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="491" dy="0">Loads</tspan>
      <tspan x="491" dy="38">undionly.kpxe /</tspan>
      <tspan x="491" dy="38">ipxe.efi</tspan>
    </text>
  </g>

  
  <g id="arrow-2-3">
    <line x1="625" y1="480" x2="648" y2="480" stroke="#207448" stroke-width="4"/>
    <polygon points="648,471 666,480 648,489" fill="#207448"/>
  </g>

  
  <g id="node-3">
    <rect x="666" y="150" width="268" height="660" rx="16" fill="#fdf6ed" stroke="#db8129" stroke-width="4"/>
    
    
    <circle cx="800" cy="204" r="24" fill="#db8129"/>
    <text x="800" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(772, 246)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="14" width="26" height="16" rx="8" transform="rotate(-30 19 22)"/>
      <rect x="24" y="26" width="26" height="16" rx="8" transform="rotate(-30 37 34)"/>
    </g>

    
    <text x="800" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">3. iPXE</tspan>
      <tspan x="800" dy="40">Chain-Load</tspan>
      <tspan x="800" dy="40">(Opt 175)</tspan>
    </text>

    
    <line x1="690" y1="460" x2="910" y2="460" stroke="#db8129" stroke-width="2" stroke-opacity="0.3"/>

    
    <text x="800" y="530" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">Fetches HTTP</tspan>
      <tspan x="800" dy="38">boot.ipxe -&gt;</tspan>
      <tspan x="800" dy="38">node.ipxe</tspan>
    </text>
  </g>

  
  <g id="arrow-3-4">
    <line x1="934" y1="480" x2="957" y2="480" stroke="#207448" stroke-width="4"/>
    <polygon points="957,471 975,480 957,489" fill="#207448"/>
  </g>

  
  <g id="node-4">
    <rect x="975" y="150" width="268" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="1109" cy="204" r="24" fill="#207448"/>
    <text x="1109" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(1081, 246)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="28" y1="6" x2="28" y2="34"/>
      <polyline points="16,22 28,34 40,22"/>
      <path d="M 8,36 v 10 a 4,4 0 0,0 4,4 h 32 a 4,4 0 0,0 4,-4 v -10"/>
    </g>

    
    <text x="1109" y="360" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1109" dy="0">4. HTTP</tspan>
      <tspan x="1109" dy="40">Image Fetch</tspan>
    </text>

    
    <line x1="999" y1="460" x2="1219" y2="460" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

    
    <text x="1109" y="530" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1109" dy="0">vmlinuz +</tspan>
      <tspan x="1109" dy="38">initrd.img +</tspan>
      <tspan x="1109" dy="38">rootfs.squashfs</tspan>
    </text>
  </g>

  
  <g id="arrow-4-5">
    <line x1="1243" y1="480" x2="1266" y2="480" stroke="#207448" stroke-width="4"/>
    <polygon points="1266,471 1284,480 1266,489" fill="#207448"/>
  </g>

  
  <g id="node-5">
    <rect x="1284" y="150" width="268" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="1418" cy="204" r="24" fill="#207448"/>
    <text x="1418" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    
    <g transform="translate(1390, 246)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="12" rx="20" ry="6"/>
      <path d="M 8,12 v 14 c 0,3.3 9,6 20,6 s 20,-2.7 20,-6 v -14"/>
      <path d="M 8,26 v 14 c 0,3.3 9,6 20,6 s 20,-2.7 20,-6 v -14"/>
    </g>

    
    <text x="1418" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1418" dy="0">5. Rootfs</tspan>
      <tspan x="1418" dy="40">(OverlayFS /</tspan>
      <tspan x="1418" dy="40">Disk)</tspan>
    </text>

    
    <line x1="1308" y1="460" x2="1528" y2="460" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

    
    <text x="1418" y="530" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1418" dy="0">systemd PID 1 +</tspan>
      <tspan x="1418" dy="38">cloud-init /</tspan>
      <tspan x="1418" dy="38">Slurm</tspan>
    </text>
  </g>
</svg>