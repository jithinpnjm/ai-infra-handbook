<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">First bring-up order for a new Slurm cluster</title>
  <desc id="dsc">Eight numbered steps in two rows of four, from users and time through verification. Each step depends on the one before it, and order matters when a cluster is brought up for the first time.</desc>

  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="1600" height="1180" fill="#f5f8f5"/>

  <text class="sans" x="800" y="64" font-size="48" font-weight="700" fill="#1c4a33" text-anchor="middle">First bring-up order for a new Slurm cluster</text>

  <text class="sans" x="800" y="124" font-size="26" font-weight="700" fill="#db8129" text-anchor="middle">each step depends on the one before it</text>

  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="384" y1="360" x2="432" y2="360"/>
    <line x1="776" y1="360" x2="824" y2="360"/>
    <line x1="1168" y1="360" x2="1216" y2="360"/>
    <polyline points="1388,560 1388,595 212,595 212,630"/>
    <line x1="384" y1="830" x2="432" y2="830"/>
    <line x1="776" y1="830" x2="824" y2="830"/>
    <line x1="1168" y1="830" x2="1216" y2="830"/>
  </g>
  <g fill="#207448">
    <polygon points="432,360 414,351 414,369"/>
    <polygon points="824,360 806,351 806,369"/>
    <polygon points="1216,360 1198,351 1198,369"/>
    <polygon points="212,630 203,612 221,612"/>
    <polygon points="432,830 414,821 414,839"/>
    <polygon points="824,830 806,821 806,839"/>
    <polygon points="1216,830 1198,821 1198,839"/>
  </g>

  
  <rect x="40" y="160" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="84" cy="204" r="24" fill="#207448"/>
  <text class="sans" x="84" y="213" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(340,204)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-11" cy="-10" r="7"/>
    <path d="M-24,15 a13,13 0 0 1 26,0"/>
    <circle cx="13" cy="-4" r="5.5"/>
    <path d="M4,12 a9.5,9.5 0 0 1 19,0"/>
  </g>
  <text class="sans" x="56" y="272" font-size="30" font-weight="700" fill="#1c4a33">Users and time</text>
  <text class="sans" x="56" y="340" font-size="24" fill="#303a36">create the slurm and</text>
  <text class="sans" x="56" y="370" font-size="24" fill="#303a36">munge users with</text>
  <text class="sans" x="56" y="400" font-size="24" fill="#303a36">fixed, identical</text>
  <text class="sans" x="56" y="430" font-size="24" fill="#303a36">UIDs on all nodes;</text>
  <text class="sans" x="56" y="460" font-size="24" fill="#303a36">confirm chrony is</text>
  <text class="sans" x="56" y="490" font-size="24" fill="#303a36">synchronised.</text>

  
  <rect x="432" y="160" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="476" cy="204" r="24" fill="#207448"/>
  <text class="sans" x="476" y="213" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(732,204)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-14" cy="-2" r="8"/>
    <path d="M-6,-2 H22 M12,-2 V7 M18,-2 V5"/>
  </g>
  <text class="sans" x="448" y="272" font-size="30" font-weight="700" fill="#1c4a33">Munge</text>
  <text class="sans" x="448" y="340" font-size="24" fill="#303a36">create the key on one</text>
  <text class="sans" x="448" y="370" font-size="24" fill="#303a36">node, copy it to all</text>
  <text class="sans" x="448" y="400" font-size="24" fill="#303a36">nodes with mode <tspan class="mono">0400</tspan></text>
  <text class="sans" x="448" y="430" font-size="24" fill="#303a36">and owner munge,</text>
  <text class="sans" x="448" y="460" font-size="24" fill="#303a36">then test with</text>
  <text class="mono" x="448" y="490" font-size="24" fill="#303a36">munge -n | unmunge</text>

  
  <rect x="824" y="160" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="868" cy="204" r="24" fill="#207448"/>
  <text class="sans" x="868" y="213" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(1124,204)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-15" rx="18" ry="6"/>
    <path d="M-18,-15 V13 a18,6 0 0 0 36,0 V-15"/>
    <path d="M-18,-1 a18,6 0 0 0 36,0"/>
  </g>
  <text class="sans" x="840" y="272" font-size="30" font-weight="700" fill="#1c4a33">Database</text>
  <text class="sans" x="840" y="340" font-size="24" fill="#303a36">install MariaDB,</text>
  <text class="sans" x="840" y="370" font-size="24" fill="#303a36">create the</text>
  <text class="mono" x="840" y="400" font-size="24" fill="#303a36">slurm_acct_db</text>
  <text class="sans" x="840" y="430" font-size="24" fill="#303a36">database and the</text>
  <text class="sans" x="840" y="460" font-size="24" fill="#303a36">slurm user.</text>

  
  <rect x="1216" y="160" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="1260" cy="204" r="24" fill="#207448"/>
  <text class="sans" x="1260" y="213" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(1516,204)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="9"/>
    <path d="M0,-18 V-11 M0,11 V18 M-18,0 H-11 M11,0 H18 M-13,-13 L-8,-8 M8,8 L13,13 M13,-13 L8,-8 M-8,8 L-13,13"/>
  </g>
  <text class="sans" x="1232" y="272" font-size="30" font-weight="700" fill="#1c4a33">slurmdbd</text>
  <text class="sans" x="1232" y="340" font-size="24" fill="#303a36">write <tspan class="mono">slurmdbd.conf</tspan></text>
  <text class="sans" x="1232" y="370" font-size="24" fill="#303a36">with mode <tspan class="mono">600</tspan></text>
  <text class="sans" x="1232" y="400" font-size="24" fill="#303a36">and owner slurm,</text>
  <text class="sans" x="1232" y="430" font-size="24" fill="#303a36">start it, and read</text>
  <text class="sans" x="1232" y="460" font-size="24" fill="#303a36">its log because it</text>
  <text class="sans" x="1232" y="490" font-size="24" fill="#303a36">creates the tables</text>
  <text class="sans" x="1232" y="520" font-size="24" fill="#303a36">on first start.</text>

  
  <rect x="40" y="630" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="84" cy="674" r="24" fill="#207448"/>
  <text class="sans" x="84" y="683" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <g transform="translate(340,674)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-20" y="-18" width="40" height="14" rx="3"/>
    <rect x="-20" y="4" width="40" height="14" rx="3"/>
    <path d="M-4,-11 H12 M-4,11 H12"/>
    <circle cx="-12" cy="-11" r="2.5" fill="#207448"/>
    <circle cx="-12" cy="11" r="2.5" fill="#207448"/>
  </g>
  <text class="sans" x="56" y="742" font-size="30" font-weight="700" fill="#1c4a33">Controller</text>
  <text class="sans" x="56" y="810" font-size="24" fill="#303a36">put <tspan class="mono">slurm.conf</tspan></text>
  <text class="sans" x="56" y="840" font-size="24" fill="#303a36">in <tspan class="mono">/etc/slurm</tspan></text>
  <text class="sans" x="56" y="870" font-size="24" fill="#303a36">create the state and</text>
  <text class="sans" x="56" y="900" font-size="24" fill="#303a36">log directories owned</text>
  <text class="sans" x="56" y="930" font-size="24" fill="#303a36">by slurm, start</text>
  <text class="mono" x="56" y="960" font-size="24" fill="#303a36">slurmctld</text>

  
  <rect x="432" y="630" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="476" cy="674" r="24" fill="#207448"/>
  <text class="sans" x="476" y="683" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <g transform="translate(732,674)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-15" y="-15" width="30" height="30" rx="3"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2"/>
    <path d="M-15,-8 H-21 M-15,0 H-21 M-15,8 H-21 M15,-8 H21 M15,0 H21 M15,8 H21"/>
    <path d="M-8,-15 V-21 M0,-15 V-21 M8,-15 V-21 M-8,15 V21 M0,15 V21 M8,15 V21"/>
  </g>
  <text class="sans" x="448" y="742" font-size="30" font-weight="700" fill="#1c4a33">Compute nodes</text>
  <text class="sans" x="448" y="810" font-size="24" fill="#303a36">start <tspan class="mono">slurmd</tspan> on</text>
  <text class="sans" x="448" y="840" font-size="24" fill="#303a36">each node, copy the</text>
  <text class="sans" x="448" y="870" font-size="24" fill="#303a36">config or use</text>
  <text class="sans" x="448" y="900" font-size="24" fill="#303a36">configless mode.</text>

  
  <rect x="824" y="630" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="868" cy="674" r="24" fill="#207448"/>
  <text class="sans" x="868" y="683" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <g transform="translate(1124,674)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-16" r="5"/>
    <circle cx="-15" cy="14" r="5"/>
    <circle cx="15" cy="14" r="5"/>
    <path d="M0,-11 V-2 M-15,9 V-2 M15,9 V-2 M-15,-2 H15"/>
  </g>
  <text class="sans" x="840" y="742" font-size="30" font-weight="700" fill="#1c4a33">Accounting</text>
  <text class="sans" x="840" y="778" font-size="30" font-weight="700" fill="#1c4a33">hierarchy</text>
  <text class="sans" x="840" y="810" font-size="24" fill="#303a36">run the <tspan class="mono">sacctmgr</tspan></text>
  <text class="sans" x="840" y="840" font-size="24" fill="#303a36">commands.</text>

  
  <rect x="1216" y="630" width="344" height="400" rx="16" fill="#e8f1ea" stroke="#b9d3c3" stroke-width="2"/>
  <circle cx="1260" cy="674" r="24" fill="#207448"/>
  <text class="sans" x="1260" y="683" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <g transform="translate(1516,674)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="19"/>
    <path d="M-9,1 L-3,8 L10,-6"/>
  </g>
  <text class="sans" x="1232" y="742" font-size="30" font-weight="700" fill="#1c4a33">Verify</text>
  <text class="sans" x="1232" y="810" font-size="24" fill="#303a36">run <tspan class="mono">sinfo,</tspan></text>
  <text class="mono" x="1232" y="840" font-size="24" fill="#303a36">scontrol ping,</text>
  <text class="sans" x="1232" y="870" font-size="24" fill="#303a36">and <tspan class="mono">sacct</tspan></text>

  
  <rect x="40" y="1062" width="1520" height="70" rx="12" fill="#207448"/>
  <text class="sans" x="800" y="1107" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Order matters when you bring a cluster up for the first time.</text>
</svg>