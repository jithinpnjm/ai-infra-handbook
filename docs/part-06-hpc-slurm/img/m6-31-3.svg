  <path d="M 860 481 L 890 481" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 860 635 L 890 635" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 860 791 L 890 791" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  
  <path d="M 435 977 L 435 1045" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
