  <text x="255" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Node DOWN/DRAIN or rank exited</text>

  
  <path d="M 110 331 L 70 331 L 70 632 L 110 632" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <g transform="translate(78, 480) rotate(-90)">
    <rect x="-120" y="0" width="240" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="0" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">All 512 ranks alive</text>
  </g>

  
  <path d="M 230 680 L 230 735" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <rect x="245" y="692" width="290" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="255" y="716" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">MISMATCH row static</text>

  
  <path d="M 110 660 L 85 660 L 85 931 L 110 931" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <g transform="translate(93, 805) rotate(-90)">
    <rect x="-105" y="0" width="210" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="0" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">INCOMPLETE row</text>
  </g>

  
