<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>AutoDetect values and mixed node groups</title>
  <desc>Visual infographic explaining Slurm gres.conf AutoDetect parameter values, failure recovery, and mixed cluster configuration examples.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">AutoDetect values and mixed node groups</text>

  
  <rect x="40" y="95" width="1520" height="660" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 110)">
    <rect x="0" y="0" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="52" y2="16" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="16" x2="18" y2="52" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="34" x2="52" y2="34" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="135" y="146" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Table of AutoDetect values from the gres.conf man page</text>

  
  <rect x="70" y="175" width="1460" height="120" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="95" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#db8129">nvml: </tspan><tspan>NVIDIA GPUs through the NVIDIA Management Library; needs Slurm built</tspan>
    <tspan x="95" dy="32">with NVML support and the library present; fills Type, File, Cores (CPU affinity),</tspan>
    <tspan x="95" dy="32">Links (NVLink connectivity) and UUID; the only mode that handles MIG devices</tspan>
  </text>

  
  <rect x="70" y="305" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="337" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">nvidia: </tspan><tspan>NVIDIA GPUs without a library; does not detect MIGs or NVLinks; added in 24.11</tspan>
  </text>

  
  <rect x="70" y="361" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="393" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">rsmi and amd: </tspan><tspan>AMD GPUs</tspan>
  </text>

  
  <rect x="70" y="417" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="449" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">oneapi: </tspan><tspan>Intel</tspan>
  </text>

  
  <rect x="70" y="473" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="505" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">nrt: </tspan><tspan>AWS Trainium and Inferentia</tspan>
  </text>

  
  <rect x="70" y="529" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="561" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">full: </tspan><tspan>tries all of these in order</tspan>
  </text>

  
  <rect x="70" y="585" width="1460" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="617" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">off: </tspan><tspan>turns detection off</tspan>
  </text>

  
  <rect x="70" y="641" width="1460" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,4" />
  <g transform="translate(88, 663)">
    <path d="M 0 5 L 20 -7 L 40 5 L 40 26 Q 40 46 20 54 Q 0 46 0 26 Z" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="12" x2="20" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="38" r="2" fill="#207448" />
  </g>
  <text x="145" y="678" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">slurmd fails with unable to load NVML: </tspan><tspan>Slurm built without NVML or library missing;</tspan>
    <tspan x="145" dy="36">check build config and </tspan><tspan font-family="monospace" font-weight="bold">ldconfig -p | grep nvidia-ml</tspan>
  </text>

  
  <rect x="40" y="785" width="1520" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 800)">
    <rect x="0" y="0" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="17" x2="52" y2="17" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="35" x2="52" y2="35" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="9" r="2.5" fill="#207448" />
    <circle cx="12" cy="26" r="2.5" fill="#207448" />
    <circle cx="12" cy="43" r="2.5" fill="#207448" />
    <line x1="24" y1="9" x2="42" y2="9" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="43" x2="42" y2="43" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  </g>

  
  <text x="135" y="836" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Mixed cluster example lines</text>

  
  <rect x="70" y="865" width="1460" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="900" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">NodeName=tux[0-7] AutoDetect=nvml</text>

  
  <rect x="70" y="929" width="1460" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="964" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">NodeName=tux[8-11] AutoDetect=rsmi</text>

  
  <rect x="70" y="993" width="1460" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="1028" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">NodeName=tux[12-15] Name=gpu File=/dev/nvidia[0-3] (manual definition)</text>

  
  <rect x="40" y="1105" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1143" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">a single typo in a device path can leave one GPU invisible to the scheduler</text>
</svg>