<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Environment Modules (Tcl) and Lmod (Lua) in depth (Supercomputers for </title>
  <desc>Hierarchical module tree in Lmod illustrating Core, Compiler, and MPI MODULEPATH tiers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Environment Modules (Tcl) and Lmod (Lua) in depth </tspan>
    <tspan x="800" dy="54">(Supercomputers for </tspan>
  </text>

  
