  <rect x="80" y="915" width="690" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(397, 928)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
