<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>One slow node holds the whole job</title>
  <desc>Infographic illustrating how a single slow node with a failing fan delays an entire distributed training job at the synchronization barrier.</desc>

