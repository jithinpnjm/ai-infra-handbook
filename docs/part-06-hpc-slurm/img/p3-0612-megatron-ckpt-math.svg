<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Sizing a Megatron-LM checkpoint: theory versus disk</title>
  <desc>Worked arithmetic comparing theoretical checkpoint size against measured disk footprint for an 8B GPT model.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Sizing a Megatron-LM checkpoint: theory versus disk</text>

  
  <g id="model-scope">
    <rect x="40" y="95" width="1520" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 104)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" fill="#207448" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="145" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Worked arithmetic for an 8B GPT model with 8.03 billion parameters.</text>
  </g>

  
  <g id="comparison-section">
    
    <rect x="40" y="195" width="1520" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g id="bar-1">
      <rect x="60" y="215" width="500" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(80, 240)">
        <rect x="5" y="5" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="28" y1="5" x2="28" y2="51" stroke="#207448" stroke-width="3" />
        <line x1="5" y1="28" x2="51" y2="28" stroke="#207448" stroke-width="3" />
        <circle cx="16.5" cy="16.5" r="3.5" fill="#207448" />
        <circle cx="39.5" cy="16.5" r="3.5" fill="#207448" />
        <circle cx="16.5" cy="39.5" r="3.5" fill="#207448" />
        <circle cx="39.5" cy="39.5" r="3.5" fill="#207448" />
      </g>
      <text x="155" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">bf16 weights about 16.06 GB</text>
    </g>

    
    <g id="bar-2">
      <rect x="580" y="215" width="960" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(605, 240)">
        <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4" />
        <circle cx="28" cy="28" r="6" fill="#207448" />
        <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="11" y1="11" x2="17" y2="17" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="39" y1="39" x2="45" y2="45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="11" y1="45" x2="17" y2="39" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="39" y1="17" x2="45" y2="11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>
      <text x="680" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">fp32 Adam states about 64.24 GB</text>
    </g>

    
    <g id="sum-theory">
      <rect x="60" y="335" width="1480" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(80, 352)">
        <rect x="5" y="5" width="46" height="46" rx="8" fill="none" stroke="#207448" stroke-width="4" />
        <path d="M 39 17 L 17 17 L 27 28 L 17 39 L 39 39" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="155" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">theory 80.30 GB</text>

      
      <rect x="520" y="360" width="1000" height="40" rx="6" fill="#d9e6dc" />
      
      <rect x="520" y="360" width="148.7" height="40" rx="6" fill="#207448" />
      
      <rect x="670.7" y="360" width="592.8" height="40" rx="6" fill="#2d8c58" />
    </g>

    
    <g id="bar-3">
      <rect x="40" y="460" width="1520" height="165" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(65, 485)">
        <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#db8129" stroke-width="4" />
        <path d="M 6 14 L 6 42 A 22 8 0 0 0 50 42 L 50 14" fill="none" stroke="#db8129" stroke-width="4" />
        <path d="M 6 28 A 22 8 0 0 0 50 28" fill="none" stroke="#db8129" stroke-width="4" />
      </g>
      <text x="145" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">measured checkpoint about 108 GB on disk</text>

      
      <rect x="520" y="550" width="1000" height="45" rx="6" fill="#faede1" />
      <rect x="520" y="550" width="1000" height="45" rx="6" fill="#db8129" />
    </g>
  </g>

  
  <g id="resume-plan">
    <rect x="40" y="650" width="1520" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 715)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 14 L 28 28 L 38 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 44 12 L 50 18 L 44 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="145" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="145" dy="0">write periodic async checkpoints so the training loop does not stop while the write finishes;</tspan>
      <tspan x="145" dy="45">key resume logic on <tspan font-family="ui-monospace, monospace" font-weight="bold">SLURM_RESTART_COUNT</tspan> or whether the latest checkpoint exists;</tspan>
      <tspan x="145" dy="45">coordinate with <tspan font-family="ui-monospace, monospace" font-weight="bold">--signal</tspan> and <tspan font-family="ui-monospace, monospace" font-weight="bold">--requeue</tspan></tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="860" width="1520" height="80" rx="12" fill="#207448" />
    
    <g transform="translate(65, 872)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#ffffff" stroke-width="4" />
      <path d="M 17 28 L 24 35 L 39 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="145" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">checkpoints are larger than the weights alone; size them before you plan storage</text>
  </g>
</svg>