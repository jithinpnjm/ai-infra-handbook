<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
  <title>Generic resources (GRES)</title>
  <desc>SVG infographic explaining Slurm Generic Resources (GRES) discovery, scheduling, isolation, and task binding.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" stroke="#207448" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" stroke="#db8129" stroke-linejoin="round" />
    </marker>

    
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#143d26" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1010" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Generic resources (GRES)</text>

  
  
  
  <g id="subgraph-discovery">
    
    <rect x="50" y="110" width="1500" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <text x="80" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">1. Node GRES Discovery (slurmd -G)</text>

    
    <g id="node-nvml" filter="url(#card-shadow)">
      <rect x="80" y="185" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(420, 226)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-18" y="-18" width="36" height="36" rx="4" />
        <rect x="-10" y="-10" width="20" height="20" rx="2" />
        
        <path d="M -8 -18 V -24 M 0 -18 V -24 M 8 -18 V -24" />
        <path d="M -8 18 V 24 M 0 18 V 24 M 8 18 V 24" />
        <path d="M -18 -8 H -24 M -18 0 H -24 M -18 8 H -24" />
        <path d="M 18 -8 H 24 M 18 0 H 24 M 18 8 H 24" />
      </g>
      
      <text x="420" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">gres.conf: AutoDetect=nvml</text>
      
      <text x="420" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Type, File, Cores, Links, MIG</text>
    </g>

    
    <g id="node-sconf" filter="url(#card-shadow)">
      <rect x="80" y="385" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(420, 426)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -16 -22 H 6 L 18 -10 V 22 H -16 Z" />
        <path d="M 6 -22 V -10 H 18" />
        <path d="M -9 -2 H 9 M -9 6 H 9 M -9 14 H 2" />
      </g>
      
      <text x="420" y="492" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">slurm.conf: GresTypes=gpu</text>
      
      <text x="420" y="532" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">NodeName=gpu[01-16] Gres=gpu:h100:8</text>
    </g>

    
    <g id="node-sched" filter="url(#card-shadow)">
      <rect x="840" y="285" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1180, 326)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="10" />
        <path d="M -3 -19 H 3 L 5 -14 L 10 -15 L 12 -19 L 17 -16 L 16 -11 L 20 -8 L 24 -10 L 25 -4 L 20 -2 L 20 2 L 25 4 L 24 10 L 20 8 L 16 11 L 17 16 L 12 19 L 10 15 L 5 14 L 3 19 H -3 L -5 14 L -10 15 L -12 19 L -17 16 L -16 11 L -20 8 L -24 10 L -25 4 L -20 2 L -20 -2 L -25 -4 L -24 -10 L -20 -8 L -16 -11 L -17 -16 L -12 -19 L -10 -15 L -5 -14 Z" />
      </g>
      
      <text x="1180" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">slurmctld (select/cons_tres)</text>
      
      <text x="1180" y="432" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Tracks GRES, NUMA Sockets &amp; NVLink</text>
    </g>

    
    <path d="M 760 272.5 H 792 Q 800 272.5 800 280.5 V 327 Q 800 335 808 335 H 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <path d="M 760 472.5 H 792 Q 800 472.5 800 464.5 V 418 Q 800 410 808 410 H 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  </g>

  
  
  
  
  <path d="M 1180 460 V 618 Q 1180 630 1168 630 H 432 Q 420 630 420 642 V 745" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  
  
  <g id="subgraph-launch">
    
    <rect x="50" y="670" width="1500" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <text x="80" y="716" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">2. Isolation &amp; Task Binding (slurmstepd)</text>

    
    <g id="node-cgroup" filter="url(#card-shadow)">
      <rect x="80" y="745" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(420, 786)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 -22 C 14 -22 20 -15 20 -7 C 20 12 10 20 0 24 C -10 20 -20 12 -20 -7 C -20 -15 -14 -22 0 -22 Z" />
        <rect x="-7" y="-2" width="14" height="12" rx="2" />
        <path d="M -4 -2 V -7 C -4 -10 4 -10 4 -7 V -2" />
      </g>
      
      <text x="420" y="852" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#303a36">cgroup.conf: ConstrainDevices=yes</text>
      
      <text x="420" y="892" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Allows only /dev/nvidia3, /dev/nvidia7</text>
    </g>

    
    <g id="node-bind" filter="url(#card-shadow)">
      <rect x="840" y="745" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1180, 786)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-24" y="-12" width="18" height="24" rx="3" />
        <rect x="6" y="-12" width="18" height="24" rx="3" />
        <path d="M -6 0 H 6" />
        <circle cx="-15" cy="0" r="3" fill="#207448" />
        <circle cx="15" cy="0" r="3" fill="#207448" />
      </g>
      
      <text x="1180" y="852" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">--gpus-per-task=1 / --gpu-bind=closest</text>
      
      <text x="1180" y="892" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Rank 0 -&gt; CVD=0; Rank 1 -&gt; CVD=1</text>
    </g>

    
    <path d="M 760 832.5 H 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  </g>
</svg>