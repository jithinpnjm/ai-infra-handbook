<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Which benchmark tells you what</title>
  <desc>Visual infographic explaining what various HPC and AI benchmarks stress, what they leave out, burn-in practices, and key caveats.</desc>

  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <text x="50" y="60" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which benchmark tells you what</text>

  
  <rect x="40" y="90" width="1520" height="735" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <path d="M 40 102 A 12 12 0 0 1 52 90 L 1548 90 A 12 12 0 0 1 1560 102 L 1560 145 L 40 145 Z" fill="#e8f1ea"/>
  <line x1="40" y1="145" x2="1560" y2="145" stroke="#207448" stroke-width="2"/>

  
  <line x1="410" y1="90" x2="410" y2="145" stroke="#207448" stroke-width="1.5"/>
  <line x1="990" y1="90" x2="990" y2="145" stroke="#207448" stroke-width="1.5"/>

  
  <text x="60" y="128" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">benchmark</text>
  <text x="430" y="128" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">what it stresses</text>
  <text x="1010" y="128" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">what it leaves out</text>

  
  <rect x="41" y="235" width="1518" height="95" fill="#f9fbf9"/>
  <rect x="41" y="415" width="1518" height="80" fill="#f9fbf9"/>
  <rect x="41" y="565" width="1518" height="70" fill="#f9fbf9"/>
  <rect x="41" y="705" width="1518" height="119" fill="#f9fbf9"/>

  
  <line x1="40" y1="235" x2="1560" y2="235" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="330" x2="1560" y2="330" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="415" x2="1560" y2="415" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="495" x2="1560" y2="495" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="565" x2="1560" y2="565" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="635" x2="1560" y2="635" stroke="#d0dfd4" stroke-width="1"/>
  <line x1="40" y1="705" x2="1560" y2="705" stroke="#d0dfd4" stroke-width="1"/>

  
  <line x1="410" y1="145" x2="410" y2="330" stroke="#e0ece2" stroke-width="1.5"/>
  <line x1="990" y1="145" x2="990" y2="330" stroke="#e0ece2" stroke-width="1.5"/>
  
  <line x1="410" y1="330" x2="410" y2="825" stroke="#e0ece2" stroke-width="1.5"/>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="180" font-weight="bold">TOP500 (June at ISC, November at SC): </tspan>
    <tspan x="430" y="180">ranks by Rmax on HPL in FP64; </tspan>
    <tspan x="1010" y="180">leaves out low-precision AI speed, </tspan>
    <tspan x="1010" y="210">storage I/O, multi-job mixes</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="275" font-weight="bold">HPL: </tspan>
    <tspan x="430" y="265">dense linear system Ax = b by LU factorization in FP64; </tspan>
    <tspan x="430" y="300">stresses compute, power, cooling and regular collectives; </tspan>
    <tspan x="1010" y="265">leaves out memory-bound sparse kernels, </tspan>
    <tspan x="1010" y="300">irregular communication, file systems</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="375" font-weight="bold">HPCG: </tspan>
    <tspan x="430" y="362">sparse system with irregular memory access and global reductions; </tspan>
    <tspan x="430" y="396">typically a few percent of Rpeak</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="452" font-weight="bold">HPL-MxP: </tspan>
    <tspan x="430" y="452">Linpack with mixed-precision tensor arithmetic and FP64 iterative refinement</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="534" font-weight="bold">Green500: </tspan>
    <tspan x="430" y="534">TOP500 re-ranked by GFLOP/s per watt</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="604" font-weight="bold">Graph500: </tspan>
    <tspan x="430" y="604">graph traversal in traversed edges per second</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="674" font-weight="bold">IO500: </tspan>
    <tspan x="430" y="674">parallel storage via IOR bandwidth and mdtest metadata</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" y="750" font-weight="bold">MLPerf Training and Inference: </tspan>
    <tspan x="430" y="750">time to train reference models to a target accuracy, or inference </tspan>
    <tspan x="430" y="785">throughput and latency under quality limits</tspan>
  </text>

  
  <rect x="40" y="855" width="1520" height="110" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <path d="M 40 867 A 12 12 0 0 1 52 855 L 56 855 L 56 965 L 52 965 A 12 12 0 0 1 40 953 Z" fill="#db8129"/>
  
  <path d="M 75 880 L 105 880 L 105 918 L 90 906 L 75 918 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
  <text x="120" y="900" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Habit strip</text>
  <text x="120" y="942" font-family="sans-serif" font-size="24" fill="#303a36">write down the workload a score does not test; if that is your workload, the score does not answer your question</text>

  
  <rect x="40" y="990" width="1520" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 70 1045 A 25 25 0 1 1 110 1045" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="1035" x2="105" y2="1020" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="1035" r="4" fill="#207448"/>
  <text x="130" y="1038" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Burn-in use:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" y="1085">run HPL, watch power and temperature per node, compare efficiency with the vendor expectation; </tspan>
    <tspan x="130" y="1125">a node that draws less power or runs hotter than peers points to a bad transceiver or throttling cooling loop</tspan>
  </text>

  
  <rect x="40" y="1200" width="1520" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 75 1228 L 95 1220 L 115 1228 L 115 1248 C 115 1262 95 1272 95 1272 C 95 1272 75 1262 75 1248 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="95" y1="1234" x2="95" y2="1248" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="1256" r="2" fill="#207448"/>
  <text x="130" y="1248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Caveats:</text>

  
  <rect x="65" y="1275" width="455" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="90" y="1335">many large AI clusters </tspan>
    <tspan x="90" y="1370">never submit to TOP500</tspan>
  </text>

  
  <rect x="545" y="1275" width="315" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="1352" font-family="sans-serif" font-size="24" fill="#303a36">TOP500 rewards FP64</text>

  
  <rect x="885" y="1275" width="650" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="910" y="1335">exascale means 10^18 sustained </tspan>
    <tspan x="910" y="1370">FP64 operations per second on HPL</tspan>
  </text>
</svg>