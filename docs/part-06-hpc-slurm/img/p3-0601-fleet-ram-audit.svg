<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Finding nodes that lost memory after a power-on</title>
  <desc>Visual explanation of diagnosing fleet nodes that lost memory on boot using pdsh and awk benchmarking</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="50" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Finding nodes that lost memory after a power-on</text>

  
  <rect x="50" y="85" width="810" height="940" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(80, 102)">
    <rect x="0" y="6" width="36" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 36 18 L 48 18" stroke="#207448" stroke-width="3"/>
    <rect x="48" y="6" width="36" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="180" y="130" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Pipeline</text>

  
  <rect x="75" y="155" width="760" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="195" r="22" fill="#207448"/>
  <text x="115" y="203" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(155, 175)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="40" height="34" rx="4"/>
    <path d="M 8 12 L 16 17 L 8 22"/>
    <line x1="20" y1="22" x2="30" y2="22"/>
  </g>
  <text x="215" y="202" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Run on one node first:</text>
  <text x="100" y="244" font-family="monospace" font-size="24" fill="#207448">grep MemTotal /proc/meminfo | awk print $2,</text>
  <text x="100" y="278" font-family="sans-serif" font-size="24" fill="#303a36">read the output, then run across the fleet with</text>
  <text x="100" y="312" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace" fill="#207448">pdsh</tspan> or <tspan font-family="monospace" fill="#207448">clush</tspan></text>

  
  <line x1="455" y1="335" x2="455" y2="368" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="370" width="760" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="415" r="22" fill="#207448"/>
  <text x="115" y="423" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(155, 395)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="20" cy="10" rx="18" ry="6"/>
    <path d="M 2 10 v 16 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -16"/>
    <path d="M 2 18 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6"/>
  </g>
  <text x="215" y="423" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Collect one value per node</text>

  
  <line x1="455" y1="480" x2="455" y2="513" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="515" width="760" height="220" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="555" r="22" fill="#207448"/>
  <text x="115" y="563" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(155, 535)" stroke="#207448" stroke-width="3" fill="none">
    <line x1="20" y1="6" x2="20" y2="34"/>
    <line x1="6" y1="12" x2="34" y2="12"/>
    <path d="M 6 12 L 2 24 L 14 24 Z"/>
    <path d="M 34 12 L 26 24 L 38 24 Z"/>
  </g>
  <text x="215" y="563" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Compare each value with the expected benchmark</text>
  <text x="100" y="605" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace" fill="#207448">528,482,304 kB</tspan> within a 2 percent tolerance</text>
  <text x="100" y="645" font-family="sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace" fill="#207448">filter_nodes_missing_ram</tspan></text>
  <text x="100" y="685" font-family="sans-serif" font-size="24" fill="#303a36">in <tspan font-family="monospace" fill="#207448">code/part06/flops.py</tspan>)</text>

  
  <line x1="455" y1="735" x2="455" y2="768" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="770" width="760" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="815" r="22" fill="#207448"/>
  <text x="115" y="823" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(155, 795)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 4 4 L 36 4 L 24 18 L 24 32 L 16 36 L 16 18 Z"/>
  </g>
  <text x="215" y="823" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Print only the nodes that fall outside</text>

  

  
  <rect x="890" y="85" width="660" height="395" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(920, 106)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="36" height="26" rx="4"/>
    <circle cx="8" cy="13" r="3" fill="#207448"/>
    <line x1="16" y1="13" x2="30" y2="13"/>
  </g>
  <text x="970" y="130" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Worked example</text>

  
  <text x="920" y="174" font-family="sans-serif" font-size="24" fill="#303a36">10 nodes, nine healthy at 512 GB,</text>
  <text x="920" y="208" font-family="sans-serif" font-size="24" fill="#303a36">one lost one of eight 64 GB DIMMs on boot</text>
  <text x="920" y="242" font-family="sans-serif" font-size="24" fill="#303a36">and reports 448 GB; the 2 percent</text>
  <text x="920" y="276" font-family="sans-serif" font-size="24" fill="#303a36">threshold flags it at once</text>

  
  
  <g transform="translate(920, 305)">
    
    <rect x="0" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="12" y1="42" x2="93" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="20" cy="18" r="4" fill="#207448"/>
    
    <rect x="124" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="136" y1="42" x2="217" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="144" cy="18" r="4" fill="#207448"/>
    
    <rect x="248" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="260" y1="42" x2="341" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="268" cy="18" r="4" fill="#207448"/>
    
    <rect x="372" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="384" y1="42" x2="465" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="392" cy="18" r="4" fill="#207448"/>
    
    <rect x="495" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="507" y1="42" x2="588" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="515" cy="18" r="4" fill="#207448"/>
  </g>

  
  <g transform="translate(920, 385)">
    
    <rect x="0" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="12" y1="42" x2="93" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="20" cy="18" r="4" fill="#207448"/>
    
    <rect x="124" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="136" y1="42" x2="217" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="144" cy="18" r="4" fill="#207448"/>
    
    <rect x="248" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="260" y1="42" x2="341" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="268" cy="18" r="4" fill="#207448"/>
    
    <rect x="372" y="0" width="105" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="384" y1="42" x2="465" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    <circle cx="392" cy="18" r="4" fill="#207448"/>
    
    <rect x="495" y="0" width="105" height="60" rx="6" fill="#fdf3eb" stroke="#db8129" stroke-width="3"/>
    <line x1="507" y1="42" x2="577" y2="42" stroke="#207448" stroke-width="4" stroke-dasharray="7 4"/>
    
    <line x1="580" y1="42" x2="588" y2="42" stroke="#db8129" stroke-width="4"/>
    <circle cx="515" cy="18" r="4" fill="#db8129"/>
    <path d="M 570 14 L 586 14 L 578 26 Z" fill="#db8129"/>
  </g>

  
  <rect x="890" y="500" width="660" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(920, 520)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="20" r="14"/>
    <path d="M 18 6 L 18 2"/>
    <path d="M 18 12 L 18 20 L 24 20"/>
  </g>
  <text x="970" y="542" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Result</text>
  <text x="920" y="586" font-family="sans-serif" font-size="24" fill="#303a36">one node reports less than its peers</text>
  <text x="920" y="620" font-family="sans-serif" font-size="24" fill="#303a36">and becomes the first lead; seconds not hours,</text>
  <text x="920" y="654" font-family="sans-serif" font-size="24" fill="#303a36">versus opening a graphical monitor</text>
  <text x="920" y="688" font-family="sans-serif" font-size="24" fill="#303a36">on a hundred nodes</text>

  
  <rect x="890" y="735" width="660" height="290" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(920, 755)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="36" height="28" rx="4"/>
    <line x1="0" y1="8" x2="36" y2="8"/>
    <line x1="12" y1="16" x2="24" y2="22"/>
    <line x1="24" y1="16" x2="12" y2="22"/>
  </g>
  <text x="970" y="777" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Contrast panel</text>
  <text x="920" y="820" font-family="sans-serif" font-size="24" fill="#303a36">panacea console trap:</text>
  <text x="920" y="856" font-family="sans-serif" font-size="24" fill="#303a36">enterprise suites such as HP OpenView or</text>
  <text x="920" y="892" font-family="sans-serif" font-size="24" fill="#303a36">Zenoss solve only parts of the problem;</text>
  <text x="920" y="928" font-family="sans-serif" font-size="24" fill="#303a36">adapters for missing fabric counters break</text>
  <text x="920" y="964" font-family="sans-serif" font-size="24" fill="#303a36">when a new fabric arrives; scripts written in</text>
  <text x="920" y="1000" font-family="sans-serif" font-size="24" fill="#303a36">the first week outlive the console</text>

  
  <rect x="50" y="1045" width="1500" height="64" rx="8" fill="#207448"/>
  
  <g transform="translate(80, 1059)" stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M 18 2 L 4 8 L 4 20 C 4 28 18 34 18 34 C 18 34 32 28 32 20 L 32 8 Z"/>
    <path d="M 12 18 L 16 22 L 24 14"/>
  </g>
  <text x="135" y="1086" font-family="sans-serif" font-size="25" fill="#ffffff">
    <tspan font-weight="bold">Rule: </tspan>
    <tspan>a command safe on one node can still do damage on a hundred</tspan>
  </text>
</svg>