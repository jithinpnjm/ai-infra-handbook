<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420" style="background-color: #f5f8f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>The daemons</title>
  <desc>Slurm architecture diagram showing the interactions between login nodes, control plane daemons, compute nodes, and munge authentication.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-munge" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-bi" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 10 2 L 1 6 L 10 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <text x="50" y="65" font-size="48" font-weight="bold" fill="#303a36">The daemons</text>

  
  
  
  <rect x="40" y="110" width="460" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="65" y="152" font-size="30" font-weight="bold" fill="#207448">Login / submit nodes</text>

  
  <g transform="translate(65, 175)">
    <rect x="0" y="0" width="410" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 24 30 L 36 42 L 24 54 M 42 54 L 56 54" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="16" y="18" width="48" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="80" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sbatch, srun, salloc,</text>
    <text x="80" y="78" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">squeue, sinfo,</text>
    <text x="80" y="112" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">scancel</text>
  </g>

  
  <g transform="translate(65, 350)">
    <rect x="0" y="0" width="410" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="18" y="24" width="42" height="48" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="26" y1="36" x2="50" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="46" x2="44" y2="46" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="56" x2="48" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="80" y="52" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sacct, sacctmgr,</text>
    <text x="80" y="86" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sreport</text>
    <text x="80" y="122" font-size="24" fill="#303a36">(accounting queries)</text>
  </g>

  
  
  
  <rect x="540" y="110" width="560" height="890" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="565" y="152" font-size="30" font-weight="bold" fill="#207448">Control plane</text>

  
  <g transform="translate(565, 175)">
    <rect x="0" y="0" width="510" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="45" cy="48" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <ellipse cx="45" cy="48" rx="10" ry="22" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="23" y1="48" x2="67" y2="48" stroke="#207448" stroke-width="2" />
    <text x="90" y="42" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">slurmrestd (optional)</text>
    <text x="90" y="74" font-size="24" fill="#303a36">REST API</text>
  </g>

  
  <g transform="translate(565, 310)">
    <rect x="0" y="0" width="510" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="22" y="26" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="22" y1="44" x2="68" y2="44" stroke="#207448" stroke-width="2" />
    <circle cx="34" cy="35" r="3" fill="#207448" />
    <circle cx="44" cy="35" r="3" fill="#207448" />
    <path d="M 35 60 L 30 72 L 60 72 L 55 60" fill="none" stroke="#207448" stroke-width="3" />
    <text x="90" y="44" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">slurmctld</text>
    <text x="90" y="78" font-size="24" fill="#303a36">controller, port 6817</text>
    <text x="90" y="112" font-size="24" fill="#303a36">queue, scheduler,</text>
    <text x="90" y="144" font-size="24" fill="#303a36">node and job state</text>
  </g>

  
  <g transform="translate(565, 510)">
    <rect x="0" y="0" width="510" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
    
    <rect x="22" y="24" width="46" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="22" y="56" width="46" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="32" cy="36" r="3" fill="#207448" />
    <circle cx="32" cy="68" r="3" fill="#207448" />
    <text x="90" y="44" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">backup slurmctld (optional)</text>
    <text x="90" y="82" font-size="24" fill="#303a36">shared StateSaveLocation</text>
  </g>

  
  <g transform="translate(565, 680)">
    <rect x="0" y="0" width="510" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="45" cy="58" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 45 34 L 45 42 M 45 74 L 45 82 M 21 58 L 29 58 M 61 58 L 69 58" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="90" y="48" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">slurmdbd, port 6819</text>
    <text x="90" y="88" font-size="24" fill="#303a36">accounting daemon</text>
  </g>

  
  <g transform="translate(565, 840)">
    <rect x="0" y="0" width="510" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <ellipse cx="45" cy="38" rx="22" ry="10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 23 38 L 23 78 C 23 85, 67 85, 67 78 L 67 38" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 23 58 C 23 65, 67 65, 67 58" fill="none" stroke="#207448" stroke-width="3" />
    <text x="90" y="52" font-size="28" font-weight="bold" fill="#303a36">MariaDB / MySQL</text>
    <text x="90" y="94" font-size="24" fill="#303a36">accounting database</text>
  </g>

  
  
  
  <rect x="1140" y="110" width="420" height="890" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1165" y="152" font-size="30" font-weight="bold" fill="#207448">Compute nodes (data plane)</text>

  
  <g transform="translate(1165, 175)">
    <rect x="0" y="0" width="370" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="20" y="24" width="44" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="48" x2="64" y2="48" stroke="#207448" stroke-width="2" />
    <circle cx="32" cy="36" r="3" fill="#207448" />
    <circle cx="32" cy="60" r="3" fill="#207448" />
    <text x="82" y="56" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">slurmd, port 6818</text>
  </g>

  
  <g transform="translate(1165, 290)">
    <rect x="0" y="0" width="370" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="20" y="18" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="32" cy="32" r="3" fill="#207448" />
    <circle cx="32" cy="50" r="3" fill="#207448" />
    <text x="82" y="49" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">slurmd</text>
  </g>

  
  <g transform="translate(1165, 390)">
    <rect x="0" y="0" width="370" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="20" y="18" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="32" cy="32" r="3" fill="#207448" />
    <circle cx="32" cy="50" r="3" fill="#207448" />
    <text x="82" y="49" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">slurmd</text>
  </g>

  
  <g transform="translate(1165, 520)">
    <rect x="0" y="0" width="370" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="42" cy="42" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 36 34 L 52 42 L 36 50 Z" fill="#207448" />
    <text x="78" y="46" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">slurmstepd</text>
    <text x="78" y="82" font-size="24" fill="#303a36">one per job step</text>
    <text x="78" y="112" font-size="24" fill="#303a36">per node</text>
  </g>

  
  <g transform="translate(1165, 740)">
    <rect x="0" y="0" width="370" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="18" y="24" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="36" x2="66" y2="36" stroke="#207448" stroke-width="2" />
    <circle cx="26" cy="30" r="2" fill="#207448" />
    <circle cx="34" cy="30" r="2" fill="#207448" />
    <circle cx="42" cy="30" r="2" fill="#207448" />
    <text x="78" y="52" font-size="26" font-weight="bold" fill="#303a36">application</text>
    <text x="78" y="84" font-size="26" font-weight="bold" fill="#303a36">processes</text>
  </g>

  
  
  
  <g transform="translate(40, 1040)">
    <rect x="0" y="0" width="1520" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="40" y="46" width="38" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 48 46 L 48 34 C 48 26, 70 26, 70 34 L 70 46" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="59" cy="60" r="3" fill="#207448" />
    <text x="100" y="52" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">munge on every node</text>
    <text x="100" y="90" font-size="24" fill="#303a36">(shared key, authenticates every request)</text>
  </g>

  
  
  

  
  <path d="M 475 250 L 565 350" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <g transform="translate(390, 280)">
    <rect x="0" y="0" width="280" height="36" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="140" y="26" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">RPC + munge credential</text>
  </g>

  
  <path d="M 475 425 L 520 425 L 520 720 L 565 720" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(485, 540)">
    <rect x="0" y="0" width="70" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="35" y="26" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">RPC</text>
  </g>

  
  <path d="M 750 475 L 750 510" fill="none" stroke="#207448" stroke-width="3" marker-start="url(#arrow-bi)" marker-end="url(#arrow-green)" />

  
  <path d="M 720 620 L 720 680" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(585, 634)">
    <rect x="0" y="0" width="270" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="135" y="26" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">job and usage records</text>
  </g>

  
  <path d="M 820 800 L 820 840" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 820 270 L 820 310" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1075 350 L 1120 350 L 1120 220 L 1165 220" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(945, 270)">
    <rect x="0" y="0" width="310" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="155" y="26" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">launch and control RPCs</text>
  </g>

  
  <path d="M 1075 390 L 1165 330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1075 430 L 1165 430" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <path d="M 1500 270 L 1500 520" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1350 650 L 1350 740" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(1230, 678)">
    <rect x="0" y="0" width="240" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="120" y="26" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">runs your program</text>
  </g>

  
  <path d="M 270 175 L 270 78 L 1350 78 L 1350 175" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="600" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="300" y="26" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">srun talks to slurmd and slurmstepd directly</text>
  </g>

  
  
  <path d="M 680 1040 L 680 800" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-munge)" />

  
  <path d="M 600 1040 L 600 950 L 540 950 L 540 450 L 565 450" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-munge)" />

  
  <path d="M 1480 1040 L 1480 890 L 1550 890 L 1550 220 L 1535 220" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-munge)" />

</svg>