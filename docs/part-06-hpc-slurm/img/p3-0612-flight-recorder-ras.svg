<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Two tools that say which rank is stuck</title>
  <desc>Visual comparison and combined workflow for PyTorch flight recorder and NCCL RAS.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="50" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two tools that say which rank is stuck</text>

  
  <g id="card-pytorch-flight-recorder">
    <rect x="50" y="130" width="730" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 160)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="8"/>
      <path d="M 6,14 L 6,42 A 22 8 0 0 0 50,42 L 50,14"/>
      <path d="M 6,28 A 22 8 0 0 0 50,28"/>
    </g>

    
    <text x="166" y="198" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">PyTorch flight recorder:</text>

    
    <text x="90" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">a ring buffer (fixed-size log that</tspan>
      <tspan x="90" dy="34">overwrites oldest entries) of recent</tspan>
      <tspan x="90" dy="34">collectives kept on every rank; after</tspan>
      <tspan x="90" dy="34">a timeout or hang you can see which rank</tspan>
      <tspan x="90" dy="34">was stuck on which collective, instead of</tspan>
      <tspan x="90" dy="34">a crash message that does not say</tspan>
    </text>
  </g>

  
  <g id="card-nccl-ras">
    <rect x="820" y="130" width="730" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(860, 160)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28,6 L 48,14 C 48,34 28,48 28,50 C 28,48 8,34 8,14 Z"/>
      <path d="M 16,28 L 22,28 L 26,20 L 30,36 L 34,28 L 40,28"/>
    </g>

    
    <text x="936" y="198" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NCCL RAS</text>

    
    <text x="860" y="245" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="860" dy="0">(reliability, availability and</tspan>
      <tspan x="860" dy="34">serviceability), available from NCCL 2.24:</tspan>
      <tspan x="860" dy="34">while a job runs the <tspan font-family="monospace">ncclras</tspan> client connects</tspan>
      <tspan x="860" dy="34">to the RAS port on a node, <tspan font-family="monospace">28028</tspan> by default,</tspan>
      <tspan x="860" dy="34">and prints which ranks and nodes NCCL</tspan>
      <tspan x="860" dy="34">considers alive or unresponsive</tspan>
    </text>
  </g>

  
  <g id="combined-flow-container">
    <rect x="50" y="580" width="1500" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(90, 605)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="14" cy="14" r="8"/>
      <circle cx="42" cy="14" r="8"/>
      <circle cx="28" cy="42" r="8"/>
      <path d="M 14,22 L 14,30 L 28,30 L 28,34"/>
      <path d="M 42,22 L 42,30 L 28,30"/>
    </g>

    
    <text x="166" y="643" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Combined flow</text>

    
    <rect x="90" y="680" width="1420" height="150" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="125" y="722" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0">timeouts turn a hang into a crash; set</tspan>
      <tspan x="125" dy="38" font-family="monospace">TORCH_NCCL_ASYNC_ERROR_HANDLING=1, TORCH_NCCL_ENABLE_MONITORING=1,</tspan>
      <tspan x="125" dy="38" font-family="monospace">TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC;</tspan>
    </text>

    
    <rect x="90" y="855" width="695" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="130" y="930" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">then read the flight recorder</tspan>
      <tspan x="130" dy="38">dump per rank;</tspan>
    </text>

    
    <rect x="815" y="855" width="695" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="855" y="930" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">use <tspan font-family="monospace">ncclras</tspan> while the</tspan>
      <tspan x="855" dy="38">job is still hanging</tspan>
    </text>
  </g>
</svg>