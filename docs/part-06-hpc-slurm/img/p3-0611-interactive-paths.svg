<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Two ways to get an interactive GPU shell</title>
  <desc>Visual comparison between Path A (two-step salloc workflow) and Path B (direct srun interactive shell), along with essential cluster allocation policies.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Two ways to get an interactive GPU shell</text>
  
  <rect x="710" y="82" width="180" height="36" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="107" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Two paths</text>

  
  <g id="path-a">
    
    <rect x="50" y="135" width="730" height="665" rx="16" fill="#fbfdfb" stroke="#207448" stroke-width="2"/>

    
    <rect x="75" y="152" width="48" height="36" rx="6" fill="#207448"/>
    <text x="99" y="177" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">&gt;_</text>
    <text x="135" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Path A</text>

    
    <rect x="75" y="202" width="680" height="116" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="102" cy="228" r="14" fill="#207448"/>
    <text x="102" y="236" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="128" y="236">salloc --partition=gpu --gres=gpu:1</tspan>
      <tspan x="128" y="268">--cpus-per-gpu=8 --mem-per-gpu=64G</tspan>
      <tspan x="128" y="300">--time=2:00:00</tspan>
    </text>

    
    <rect x="75" y="332" width="680" height="148" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <circle cx="102" cy="358" r="14" fill="#db8129"/>
    <text x="102" y="366" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
    <text x="128" y="366" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">a shell opens with Slurm variables set</text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="128" y="400">by default that shell runs on the submission host,</tspan>
      <tspan x="128" y="432">the shared login node, so a heavy test there</tspan>
      <tspan x="128" y="464">slows everyone</tspan>
    </text>

    
    <rect x="75" y="494" width="680" height="146" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="102" cy="520" r="14" fill="#207448"/>
    <text x="102" y="528" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="128" y="527">then srun --pty bash gives a shell</tspan>
      <tspan x="128" y="557">on the compute node</tspan>
      <tspan x="128" y="591">srun python quick_test.py runs a step</tspan>
      <tspan x="128" y="623">exit releases the allocation</tspan>
    </text>

    
    <rect x="75" y="654" width="680" height="126" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 94 676 L 98 676 L 100 679 L 104 677 L 107 680 L 105 684 L 108 686 L 108 690 L 105 692 L 107 696 L 104 699 L 100 697 L 98 700 L 94 700 L 92 697 L 88 699 L 85 696 L 87 692 L 84 690 L 84 686 L 87 684 L 85 680 L 88 677 L 92 679 Z" fill="none" stroke="#207448" stroke-width="2"/>
    <circle cx="96" cy="688" r="4" fill="#207448"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="128" y="688">many sites use LaunchParameters</tspan>
      <tspan x="128" y="722">use_interactive_step so the shell</tspan>
      <tspan x="128" y="756">lands on the compute node</tspan>
    </text>
  </g>

  
  <g id="path-b">
    
    <rect x="820" y="135" width="730" height="665" rx="16" fill="#fbfdfb" stroke="#207448" stroke-width="2"/>

    
    <rect x="845" y="152" width="48" height="36" rx="6" fill="#207448"/>
    
    <polyline points="857,163 866,170 857,177" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="869" y1="177" x2="881" y2="177" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="905" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Path B</text>

    
    <rect x="845" y="202" width="680" height="116" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="872" cy="228" r="14" fill="#207448"/>
    <text x="872" y="236" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="898" y="246">srun --partition=gpu --gres=gpu:1</tspan>
      <tspan x="898" y="284">--time=1:00:00 --pty bash</tspan>
    </text>

    
    <rect x="845" y="342" width="680" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="880" cy="380" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 870 380 L 890 380 M 883 373 L 890 380 L 883 387" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="918" y="380" font-weight="bold">Direct Compute Allocation</tspan>
      <tspan x="870" y="432">one command requests, waits and drops you</tspan>
      <tspan x="870" y="474">into a shell on the node</tspan>
    </text>

    
    <rect x="845" y="546" width="680" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="880" cy="614" r="22" fill="#207448"/>
    
    <polyline points="871,614 877,621 891,607" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="918" y="605">shorter when you do not need</tspan>
      <tspan x="918" y="639">several steps</tspan>
    </text>
  </g>

  
  <g id="policy">
    
    <rect x="50" y="830" width="1500" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="75" y="848" width="48" height="34" rx="6" fill="#207448"/>
    
    <path d="M 91 856 L 99 853 L 107 856 L 107 865 C 107 872 99 876 99 876 C 99 876 91 872 91 865 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="135" y="874" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Policy</text>

    
    <rect x="75" y="894" width="455" height="196" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="107" cy="926" r="16" fill="#207448"/>
    
    <rect x="101" y="922" width="12" height="10" rx="2" fill="#ffffff"/>
    <path d="M 103 922 L 103 918 C 103 915 111 915 111 918 L 111 922" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="135" y="934">Resource Retention</tspan>
    </text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" y="985">an idle shell still holds</tspan>
      <tspan x="95" y="1025">its resources</tspan>
    </text>

    
    <rect x="560" y="894" width="480" height="196" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="592" cy="926" r="16" fill="#207448"/>
    
    <circle cx="592" cy="926" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polyline points="592,921 592,926 596,928" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="620" y="934">Cluster Limits</tspan>
    </text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="580" y="976">sites use short time limits and a</tspan>
      <tspan x="580" y="1010">dedicated interactive or debug</tspan>
      <tspan x="580" y="1044">partition with high priority</tspan>
      <tspan x="580" y="1076">and small limits</tspan>
    </text>

    
    <rect x="1070" y="894" width="455" height="196" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2"/>
    <circle cx="1102" cy="926" r="16" fill="#db8129"/>
    
    <line x1="1102" y1="918" x2="1102" y2="928" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1102" cy="933" r="2" fill="#ffffff"/>
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="1130" y="934">Cleanup Etiquette</tspan>
    </text>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1090" y="976">release when finished because</tspan>
      <tspan x="1090" y="1010">forgetting exit lets an allocation</tspan>
      <tspan x="1090" y="1044">run quietly to its limit</tspan>
    </text>
  </g>
</svg>