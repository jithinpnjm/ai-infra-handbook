<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Two ways to get an interactive GPU shell</title>
  <desc>Visual comparison between Path A (multi-step salloc workflow) and Path B (single-step srun direct shell) for interactive GPU sessions in Slurm, including cluster policy best practices.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two ways to get an interactive GPU shell</text>

  
  <rect x="710" y="86" width="180" height="38" rx="19" fill="#207448"/>
  <text x="800" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Two paths</text>

  
  <rect x="50" y="145" width="730" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(75, 170)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="38" rx="6"/>
    <line x1="0" y1="12" x2="48" y2="12"/>
    <circle cx="8" cy="6" r="1.5" fill="#207448"/>
    <circle cx="15" cy="6" r="1.5" fill="#207448"/>
    <circle cx="22" cy="6" r="1.5" fill="#207448"/>
    <path d="M10 22 L16 26 L10 30"/>
    <line x1="20" y1="30" x2="30" y2="30"/>
  </g>
  <text x="135" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Path A</text>

  
  <circle cx="85" cy="275" r="20" fill="#207448"/>
  <text x="85" y="283" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <rect x="120" y="225" width="635" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="140" y="258">salloc --partition=gpu --gres=gpu:1</tspan>
    <tspan x="140" y="290">--cpus-per-gpu=8 --mem-per-gpu=64G</tspan>
    <tspan x="140" y="322">--time=2:00:00</tspan>
  </text>

  
  <circle cx="85" cy="385" r="20" fill="#207448"/>
  <text x="85" y="393" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <rect x="120" y="355" width="635" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="140" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a shell opens with Slurm variables set;</text>

  
  <rect x="75" y="435" width="680" height="135" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(95, 480)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 2 L34 32 L2 32 Z"/>
    <line x1="18" y1="12" x2="18" y2="22"/>
    <circle cx="18" cy="27" r="1.2" fill="#db8129"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" y="472">by default that shell runs on the</tspan>
    <tspan x="145" y="504">submission host, the shared login node,</tspan>
    <tspan x="145" y="536">so a heavy test there slows everyone;</tspan>
  </text>

  
  <circle cx="85" cy="650" r="20" fill="#207448"/>
  <text x="85" y="658" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <rect x="120" y="585" width="635" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" y="620">then srun --pty bash gives a shell</tspan>
    <tspan x="140" y="652">on the compute node,</tspan>
    <tspan x="140" y="684">srun python quick_test.py runs a step,</tspan>
    <tspan x="140" y="716">exit releases the allocation;</tspan>
  </text>

  
  <rect x="75" y="755" width="680" height="120" rx="10" fill="#f0f5f1" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <g transform="translate(95, 795)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="7"/>
    <path d="M18 4 L18 8 M18 28 L18 32 M4 18 L8 18 M28 18 L32 18 M8 8 L11 11 M25 25 L28 28 M8 28 L11 25 M25 11 L28 8"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" y="792">many sites use LaunchParameters</tspan>
    <tspan x="145" y="824">use_interactive_step so the shell</tspan>
    <tspan x="145" y="856">lands on the compute node</tspan>
  </text>

  
  <rect x="820" y="145" width="730" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(845, 170)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="38" rx="6"/>
    <line x1="12" y1="38" x2="6" y2="46"/>
    <line x1="36" y1="38" x2="42" y2="46"/>
    <line x1="6" y1="46" x2="42" y2="46"/>
    <circle cx="12" cy="19" r="3" fill="#207448"/>
    <line x1="22" y1="19" x2="38" y2="19"/>
  </g>
  <text x="910" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Path B</text>

  
  <rect x="845" y="225" width="680" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="870" y="268">srun --partition=gpu --gres=gpu:1</tspan>
    <tspan x="870" y="302">--time=1:00:00 --pty bash</tspan>
  </text>

  
  <rect x="845" y="365" width="680" height="510" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="875" y="415">one command requests, waits and drops</tspan>
    <tspan x="875" y="450">you into a shell on the node;</tspan>
    <tspan x="875" y="485">shorter when you do not need</tspan>
    <tspan x="875" y="520">several steps</tspan>
  </text>

  
  <g transform="translate(875, 570)">
    
    <rect x="0" y="30" width="190" height="160" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
    <line x1="0" y1="65" x2="190" y2="65" stroke="#207448" stroke-width="2"/>
    <circle cx="20" cy="48" r="4" fill="#207448"/>
    <circle cx="36" cy="48" r="4" fill="#207448"/>
    <circle cx="52" cy="48" r="4" fill="#207448"/>
    
    <path d="M25 100 L40 112 L25 125" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="125" x2="85" y2="125" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <line x1="190" y1="110" x2="350" y2="110" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>

    
    <rect x="350" y="30" width="270" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="370" y="50" width="230" height="30" rx="4" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="390" cy="65" r="4" fill="#207448"/>
    <line x1="410" y1="65" x2="570" y2="65" stroke="#207448" stroke-width="1.5"/>

    
    <rect x="435" y="100" width="100" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="455" y="115" width="60" height="40" rx="3" fill="#207448"/>
    
    <line x1="425" y1="115" x2="435" y2="115" stroke="#207448" stroke-width="2"/>
    <line x1="425" y1="135" x2="435" y2="135" stroke="#207448" stroke-width="2"/>
    <line x1="425" y1="155" x2="435" y2="155" stroke="#207448" stroke-width="2"/>
    <line x1="535" y1="115" x2="545" y2="115" stroke="#207448" stroke-width="2"/>
    <line x1="535" y1="135" x2="545" y2="135" stroke="#207448" stroke-width="2"/>
    <line x1="535" y1="155" x2="545" y2="155" stroke="#207448" stroke-width="2"/>
  </g>

  
  <rect x="50" y="920" width="1500" height="245" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(75, 940)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 2 L44 10 L44 24 C44 36 24 46 24 46 C24 46 4 36 4 24 L4 10 Z"/>
    <circle cx="24" cy="20" r="4"/>
    <line x1="24" y1="24" x2="24" y2="32"/>
  </g>
  <text x="135" y="972" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Policy strip</text>

  
  <rect x="75" y="995" width="420" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(95, 1015)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <polyline points="16 8 16 16 22 16"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" y="1080">an idle shell still holds</tspan>
    <tspan x="95" y="1114">its resources;</tspan>
  </text>

  
  <rect x="515" y="995" width="530" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(535, 1010)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="8" x2="28" y2="8"/>
    <circle cx="12" cy="8" r="3" fill="#ffffff"/>
    <line x1="4" y1="18" x2="28" y2="18"/>
    <circle cx="20" cy="18" r="3" fill="#ffffff"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="535" y="1045">sites use short time limits and</tspan>
    <tspan x="535" y="1075">a dedicated interactive or debug</tspan>
    <tspan x="535" y="1105">partition with high priority and</tspan>
    <tspan x="535" y="1135">small limits;</tspan>
  </text>

  
  <rect x="1065" y="995" width="460" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(1085, 1010)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 6 L4 6 L4 26 L14 26"/>
    <polyline points="18 11 24 16 18 21"/>
    <line x1="8" y1="16" x2="24" y2="16"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" y="1045">release when finished</tspan>
    <tspan x="1085" y="1075">because forgetting exit</tspan>
    <tspan x="1085" y="1105">lets an allocation run</tspan>
    <tspan x="1085" y="1135">quietly to its limit</tspan>
  </text>
</svg>