<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What each framework expects the launcher to export</title>
  <desc>Table comparing launcher export expectations, distributed initialization, and runtime behavior across PyTorch DDP, PyTorch FSDP, DeepSpeed ZeRO, and Megatron-LM.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">What each framework expects the launcher to export</text>

  
  <rect x="40" y="75" width="1520" height="46" rx="8" fill="#207448"/>
  <text x="60" y="107" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Table framework to what to export</text>

  
  <g id="pytorch-ddp">
    <rect x="40" y="133" width="1520" height="202" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <path d="M 40 143 Q 40 133 50 133 L 360 133 L 360 335 L 50 335 Q 40 335 40 325 Z" fill="#e8f1ea"/>
    <line x1="360" y1="133" x2="360" y2="335" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(65, 178)">
      <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="19" y="19" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="140" y="244" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">PyTorch DDP</text>

    
    <text x="385" y="167" font-family="monospace" font-size="24" fill="#303a36">torchrun or direct srun python</text>
    <text x="385" y="204" font-family="monospace" font-size="24" fill="#303a36">manual dist.init_process_group(backend nccl)</text>
    <text x="385" y="241" font-family="monospace" font-size="24" fill="#303a36">export MASTER_ADDR, MASTER_PORT, WORLD_SIZE, RANK, LOCAL_RANK</text>
    <text x="385" y="278" font-family="monospace" font-size="24" fill="#303a36">model replicated on each GPU with DDP(model, device_ids=[local_rank])</text>
    <text x="385" y="315" font-family="sans-serif" font-size="24" fill="#303a36">gradients all-reduced and averaged before the optimizer step</text>
  </g>

  
  <g id="pytorch-fsdp">
    <rect x="40" y="347" width="1520" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <path d="M 40 357 Q 40 347 50 347 L 360 347 L 360 507 L 50 507 Q 40 507 40 497 Z" fill="#e8f1ea"/>
    <line x1="360" y1="347" x2="360" y2="507" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(65, 399)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="21" y1="8" x2="21" y2="48" stroke="#207448" stroke-width="3" stroke-dasharray="4 3"/>
      <line x1="35" y1="8" x2="35" y2="48" stroke="#207448" stroke-width="3" stroke-dasharray="4 3"/>
      <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="140" y="437" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">PyTorch FSDP</text>

    
    <text x="385" y="381" font-family="monospace" font-size="24" fill="#303a36">torchrun</text>
    <text x="385" y="418" font-family="monospace" font-size="24" fill="#303a36">same as DDP, example --cpus-per-task=28 --mem=200G for sharded CPU offload</text>
    <text x="385" y="455" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">shards parameters, gradients and optimizer states</tspan>
      <tspan x="385" dy="32">so a model too large for one GPU can train</tspan>
    </text>
  </g>

  
  <g id="deepspeed">
    <rect x="40" y="519" width="1520" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <path d="M 40 529 Q 40 519 50 519 L 360 519 L 360 714 L 50 714 Q 40 714 40 704 Z" fill="#e8f1ea"/>
    <line x1="360" y1="519" x2="360" y2="714" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(52, 588)">
      <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="120" y="605" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="120" dy="0">DeepSpeed</tspan>
      <tspan x="120" dy="36">ZeRO-1/2/3</tspan>
    </text>

    
    <text x="385" y="552" font-family="monospace" font-size="24" fill="#303a36">srun --label bash -c ... python train.py --deepspeed</text>
    <text x="385" y="589" font-family="monospace" font-size="24" fill="#303a36">deepspeed.init_distributed() automatic</text>
    <text x="385" y="626" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">reads Slurm vars but needs explicit export LOCAL_RANK=$SLURM_LOCALID,</tspan>
      <tspan x="385" dy="31">RANK=$SLURM_PROCID, CUDA_VISIBLE_DEVICES=$SLURM_LOCALID</tspan>
    </text>
    <text x="385" y="694" font-family="monospace" font-size="24" fill="#303a36">loop calls model_engine.backward(loss) and model_engine.step()</text>
  </g>

  
  <g id="megatron-lm">
    <rect x="40" y="726" width="1520" height="202" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <path d="M 40 736 Q 40 726 50 726 L 360 726 L 360 928 L 50 928 Q 40 928 40 918 Z" fill="#e8f1ea"/>
    <line x1="360" y1="726" x2="360" y2="928" stroke="#207448" stroke-width="1.5"/>

    
    <g transform="translate(65, 771)">
      <rect x="6" y="6" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="34" y="6" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="34" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="34" y="34" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="22" y1="14" x2="34" y2="14" stroke="#207448" stroke-width="3"/>
      <line x1="22" y1="42" x2="34" y2="42" stroke="#207448" stroke-width="3"/>
      <line x1="14" y1="22" x2="14" y2="34" stroke="#207448" stroke-width="3"/>
      <line x1="42" y1="22" x2="42" y2="34" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="140" y="837" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Megatron-LM</text>

    
    <text x="385" y="760" font-family="monospace" font-size="24" fill="#303a36">srun --label bash -c ... torchrun ... pretrain_gpt.py</text>
    <text x="385" y="797" font-family="monospace" font-size="24" fill="#303a36">automatic via megatron.training</text>
    <text x="385" y="834" font-family="monospace" font-size="24" fill="#303a36">needs CUDA_DEVICE_MAX_CONNECTIONS=1 and OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK</text>
    <text x="385" y="871" font-family="sans-serif" font-size="24" fill="#303a36">builds tensor, pipeline, context or sequence and data parallelism from ranks</text>
    <text x="385" y="908" font-family="sans-serif" font-size="24" fill="#303a36">tensor-parallel groups stay inside a node over NVLink</text>
  </g>

  
  
  <g id="footer-porting-callout">
    <rect x="40" y="940" width="1520" height="92" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(68, 958)">
      <polygon points="28,4 52,48 4,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>
    <text x="135" y="981" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="135" dy="0">porting is where subtle bugs appear: a variable one framework sets for you</tspan>
      <tspan x="135" dy="32">is one another leaves empty</tspan>
    </text>
  </g>

  
  <g id="footer-containers">
    <rect x="40" y="1044" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(65, 1079)">
      <rect x="6" y="12" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="6" y1="24" x2="50" y2="24" stroke="#207448" stroke-width="3"/>
      <line x1="21" y1="24" x2="21" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="35" y1="24" x2="35" y2="46" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="135" y="1094" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">containers: pyxis or enroot with --container-image and --container-mounts,</tspan>
      <tspan x="135" dy="36">NCCL and CUDA from the image, driver and IB device nodes from the host</tspan>
    </text>
  </g>
</svg>