<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Following one two-node job through the daemons</title>
  <desc>A sequence diagram tracking an sbatch job lifecycle across Slurm daemons from submission to pending, execution across two nodes, and epilog cleanup.</desc>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="60" y="75" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Following one two-node job through the daemons</text>

  

  
  <rect x="50" y="120" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="94" cy="164" r="24" fill="#207448" />
  <text x="94" y="164" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <circle cx="338" cy="152" r="14" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 316 186 C 316 172 326 170 338 170 C 350 170 360 172 360 186" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="70" y="235" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">User runs <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">sbatch</tspan></tspan>
    <tspan x="70" dy="36"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">job.sh</tspan>, RPC with</tspan>
    <tspan x="70" dy="36">munge credential</tspan>
  </text>

  
  <line x1="390" y1="285" x2="430" y2="285" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="430" y="120" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="474" cy="164" r="24" fill="#207448" />
  <text x="474" y="164" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <path d="M 718 140 L 738 148 C 738 168 728 184 718 190 C 708 184 698 168 698 148 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <path d="M 708 165 L 715 172 L 728 157" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="450" y="222" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="450" dy="0"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">slurmctld</tspan></tspan>
    <tspan x="450" dy="34">authenticates,</tspan>
    <tspan x="450" dy="34">runs <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">job_submit</tspan></tspan>
    <tspan x="450" dy="34">plugin, checks</tspan>
    <tspan x="450" dy="34">limits</tspan>
  </text>

  
  <line x1="770" y1="285" x2="810" y2="285" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="810" y="120" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="854" cy="164" r="24" fill="#207448" />
  <text x="854" y="164" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <rect x="1070" y="142" width="54" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1070" y1="154" x2="1124" y2="154" stroke="#207448" stroke-width="3" />
  <path d="M 1078 165 L 1085 171 L 1078 177" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="1090" y1="177" x2="1102" y2="177" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="830" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="830" dy="0">Returns</tspan>
    <tspan x="830" dy="38"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">Submitted batch</tspan></tspan>
    <tspan x="830" dy="38"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">job 4217</tspan></tspan>
  </text>

  
  <line x1="1150" y1="285" x2="1190" y2="285" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="1190" y="120" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1234" cy="164" r="24" fill="#207448" />
  <text x="1234" y="164" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <circle cx="1478" cy="164" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="1478,150 1478,164 1490,164" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="1210" y="230" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1210" dy="0">Job <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">PENDING</tspan>:</tspan>
    <tspan x="1210" dy="36">scheduler and</tspan>
    <tspan x="1210" dy="36">backfill</tspan>
    <tspan x="1210" dy="36">evaluate it</tspan>
  </text>


  

  
  <path d="M 1210 450 L 1210 624 Q 1210 640 1194 640 L 236 640 Q 220 640 220 656 L 220 670" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="1460" y1="670" x2="1460" y2="450" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="1205" y="505" width="235" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <line x1="1440" y1="560" x2="1458" y2="560" stroke="#207448" stroke-width="2" stroke-dasharray="3,3" />
  <text x="1322" y="540" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1322" dy="0">Free nodes</tspan>
    <tspan x="1322" dy="32">A and B,</tspan>
    <tspan x="1322" dy="32">schedule again</tspan>
  </text>


  

  
  <rect x="50" y="670" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="5" />
  <circle cx="94" cy="714" r="24" fill="#db8129" />
  <text x="94" y="714" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <rect x="312" y="694" width="46" height="16" rx="3" fill="none" stroke="#db8129" stroke-width="3.5" />
  <rect x="312" y="718" width="46" height="16" rx="3" fill="none" stroke="#db8129" stroke-width="3.5" />
  <line x1="335" y1="710" x2="335" y2="718" stroke="#db8129" stroke-width="3.5" />
  <circle cx="348" cy="702" r="2" fill="#db8129" />
  <circle cx="348" cy="726" r="2" fill="#db8129" />
  
  <text x="70" y="780" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">Resources found:</tspan>
    <tspan x="70" dy="36">allocate nodes</tspan>
    <tspan x="70" dy="36">A and B, state</tspan>
    <tspan x="70" dy="36"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">RUNNING</tspan></tspan>
  </text>

  
  <line x1="390" y1="835" x2="430" y2="835" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="430" y="670" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="474" cy="714" r="24" fill="#207448" />
  <text x="474" y="714" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <circle cx="718" cy="694" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
  <circle cx="702" cy="730" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
  <circle cx="734" cy="730" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="714" y1="699" x2="705" y2="724" stroke="#207448" stroke-width="3.5" />
  <line x1="722" y1="699" x2="731" y2="724" stroke="#207448" stroke-width="3.5" />
  
  <text x="450" y="770" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="450" dy="0">Launch batch</tspan>
    <tspan x="450" dy="34">step on node A</tspan>
    <tspan x="450" dy="34">via RPC tree</tspan>
    <tspan x="450" dy="34">fan-out; prolog</tspan>
    <tspan x="450" dy="34">on node B</tspan>
  </text>

  
  <line x1="770" y1="835" x2="810" y2="835" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="810" y="670" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="854" cy="714" r="24" fill="#207448" />
  <text x="854" y="714" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
  
  <rect x="1076" y="694" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <polygon points="1092,706 1104,714 1092,722" fill="#207448" />
  <line x1="1086" y1="688" x2="1086" y2="694" stroke="#207448" stroke-width="3" />
  <line x1="1106" y1="688" x2="1106" y2="694" stroke="#207448" stroke-width="3" />
  <line x1="1086" y1="734" x2="1086" y2="740" stroke="#207448" stroke-width="3" />
  <line x1="1106" y1="734" x2="1106" y2="740" stroke="#207448" stroke-width="3" />
  
  <text x="830" y="776" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="830" dy="0">Node A runs the</tspan>
    <tspan x="830" dy="36">batch script;</tspan>
    <tspan x="830" dy="36"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">srun</tspan> starts steps</tspan>
    <tspan x="830" dy="36">on both nodes</tspan>
  </text>

  
  <line x1="1150" y1="835" x2="1190" y2="835" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="1190" y="670" width="340" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1234" cy="714" r="24" fill="#207448" />
  <text x="1234" y="714" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">8</text>
  
  <ellipse cx="1478" cy="696" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 1458 696 L 1458 726 C 1458 733 1498 733 1498 726 L 1498 696" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 1458 711 C 1458 718 1498 718 1498 711" fill="none" stroke="#207448" stroke-width="3.5" />
  
  <text x="1208" y="770" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1208" dy="0">Epilog and cleanup,</tspan>
    <tspan x="1208" dy="34">job complete RPC,</tspan>
    <tspan x="1208" dy="34"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">slurmdbd</tspan> records</tspan>
    <tspan x="1208" dy="34">times, resources</tspan>
    <tspan x="1208" dy="34">and exit code</tspan>
  </text>


  
  <rect x="50" y="1030" width="1500" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1064" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Each arrow is one message between two daemons.</text>

</svg>