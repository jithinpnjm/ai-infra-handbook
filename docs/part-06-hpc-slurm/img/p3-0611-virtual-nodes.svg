<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Testing a multi-node script on one 8-GPU workstation</title>
  <desc>Diagram of one physical 8-GPU host running two slurmd daemons (Slurm built with --enable-multiple-slurmd). Virtual node node6: NodeHostname=localhost Port=17016 CPUs=112 RealMemory=240000 Gres=gpu:1, gres.conf File=/dev/nvidia6. Virtual node node7: Port=17017 same sizes, File=/dev/nvidia7. Partition gpu Nodes=node[6-7] Default=YES MaxTime=INFINITE. Checks: 'sinfo shows gpu* up infinite 2 idle node[6-7]: first proof the scheduler sees two nodes', 'srun -N 1 hostname and srun -N 2 hostname verify multi-node execution'. Purpose: 'a bug found at the end of a long wait in the shared queue costs the afternoon; test on a workstation first'.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Testing a multi-node script on one 8-GPU workstation</text>

  
  <rect x="50" y="120" width="1500" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(80, 142)">
    <rect x="0" y="0" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="8" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="28" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="12" r="3" fill="#207448"/>
    <circle cx="38" cy="22" r="3" fill="#207448"/>
  </g>

  
  <text x="145" y="166" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">one physical 8-GPU host running two slurmd daemons</text>
  <text x="1030" y="166" font-family="monospace" font-size="24" fill="#207448">(Slurm built with --enable-multiple-slurmd)</text>

  
  <rect x="80" y="205" width="690" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(105, 224)">
    <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="32" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="40" x2="16" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="40" x2="32" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="8" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="32" x2="48" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <text x="165" y="255" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Virtual node node6</text>
  <text x="105" y="300" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">NodeHostname=localhost Port=17016</tspan>
    <tspan x="105" dy="38">CPUs=112 RealMemory=240000 Gres=gpu:1,</tspan>
    <tspan x="105" dy="38">gres.conf File=/dev/nvidia6</tspan>
  </text>

  
  <rect x="830" y="205" width="690" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(855, 224)">
    <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="32" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="40" x2="16" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="40" x2="32" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="8" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="32" x2="48" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <text x="915" y="255" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Virtual node node7</text>
  <text x="855" y="318" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="855" dy="0">Port=17017 same sizes,</tspan>
    <tspan x="855" dy="40">File=/dev/nvidia7</tspan>
  </text>

  
  <rect x="80" y="445" width="1440" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(105, 476)">
    <rect x="0" y="0" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="16" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="32" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  
  <text x="175" y="511" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">Partition gpu Nodes=node[6-7] Default=YES MaxTime=INFINITE</text>

  
  <rect x="50" y="630" width="1500" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(80, 650)">
    <rect x="6" y="8" width="36" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M16 8 V4 A2 2 0 0 1 18 2 H30 A2 2 0 0 1 32 4 V8" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="20" x2="34" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="26" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <text x="135" y="682" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Checks</text>

  
  <rect x="80" y="700" width="1440" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(105, 723)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="12,20 18,26 28,14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="165" y="752" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">sinfo shows gpu* up infinite 2 idle node[6-7]: </tspan>
    <tspan font-family="sans-serif">first proof the scheduler sees two nodes</tspan>
  </text>

  
  <rect x="80" y="805" width="1440" height="85" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(105, 828)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <polyline points="12,20 18,26 28,14" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="165" y="857" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">srun -N 1 hostname</tspan>
    <tspan font-family="sans-serif"> and </tspan>
    <tspan font-family="monospace" font-weight="bold">srun -N 2 hostname</tspan>
    <tspan font-family="sans-serif"> verify multi-node execution</tspan>
  </text>

  
  <rect x="50" y="970" width="1500" height="100" rx="10" fill="#207448"/>

  
  <g transform="translate(80, 996)">
    <path d="M24 6 C15.16 6 8 13.16 8 22 C8 27.5 11.5 32.2 16 34.6 V40 H32 V34.6 C36.5 32.2 40 27.5 40 22 C40 13.16 32.84 6 24 6 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="16" y1="44" x2="32" y2="44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  
  <text x="145" y="1015" font-family="sans-serif" font-size="24" fill="#ffffff">
    <tspan x="145" dy="0" font-weight="bold">Purpose: </tspan>
    <tspan font-weight="normal">a bug found at the end of a long wait in the shared queue costs the afternoon; </tspan>
    <tspan x="145" dy="34" font-weight="normal">test on a workstation first</tspan>
  </text>
</svg>