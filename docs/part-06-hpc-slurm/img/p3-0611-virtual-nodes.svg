<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Testing a multi-node script on one 8-GPU workstation</title>
  <desc>Architecture and validation workflow for running dual slurmd daemons on a single multi-GPU workstation</desc>

  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="80" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Testing a multi-node script on one 8-GPU workstation
  </text>

  
  <g id="physical-host">
    <rect x="60" y="105" width="1480" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(90, 130)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="38" x2="44" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="40" cy="18" r="2" fill="#207448"/>
      <circle cx="40" cy="28" r="2" fill="#207448"/>
      <circle cx="40" cy="38" r="2" fill="#207448"/>
    </g>

    
    <text x="165" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      one physical 8-GPU host running two slurmd daemons
    </text>
    <text x="165" y="184" font-family="monospace" font-size="24" fill="#207448">
      (Slurm built with --enable-multiple-slurmd)
    </text>

    
    <g id="node6-card">
      <rect x="90" y="210" width="690" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(115, 230)">
        <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
        <circle cx="24" cy="24" r="10" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="24" y1="6" x2="24" y2="14" stroke="#207448" stroke-width="3"/>
        <line x1="24" y1="34" x2="24" y2="42" stroke="#207448" stroke-width="3"/>
        <line x1="6" y1="24" x2="14" y2="24" stroke="#207448" stroke-width="3"/>
        <line x1="34" y1="24" x2="42" y2="24" stroke="#207448" stroke-width="3"/>
      </g>

      <text x="180" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        Virtual node node6:
      </text>
      
      <text x="115" y="315" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="115" dy="0">NodeHostname=localhost Port=17016</tspan>
        <tspan x="115" dy="38">CPUs=112 RealMemory=240000 Gres=gpu:1,</tspan>
        <tspan x="115" dy="38">gres.conf File=/dev/nvidia6</tspan>
      </text>
    </g>

    
    <g id="node7-card">
      <rect x="820" y="210" width="690" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(845, 230)">
        <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
        <circle cx="24" cy="24" r="10" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="24" y1="6" x2="24" y2="14" stroke="#207448" stroke-width="3"/>
        <line x1="24" y1="34" x2="24" y2="42" stroke="#207448" stroke-width="3"/>
        <line x1="6" y1="24" x2="14" y2="24" stroke="#207448" stroke-width="3"/>
        <line x1="34" y1="24" x2="42" y2="24" stroke="#207448" stroke-width="3"/>
      </g>

      <text x="910" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        Virtual node node7:
      </text>
      
      <text x="845" y="330" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="845" dy="0">Port=17017 same sizes,</tspan>
        <tspan x="845" dy="38">File=/dev/nvidia7</tspan>
      </text>
    </g>

    
    <g id="partition-panel">
      <rect x="90" y="465" width="1420" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(115, 505)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="4"/>
        <line x1="28" y1="12" x2="28" y2="44" stroke="#207448" stroke-width="4"/>
      </g>
      <text x="195" y="525" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="195" dy="0">Partition gpu Nodes=node[6-7]</tspan>
        <tspan x="195" dy="38">Default=YES MaxTime=INFINITE</tspan>
      </text>
    </g>
  </g>

  
  <g id="checks-section">
    
    <g id="check-sinfo">
      <rect x="60" y="655" width="1480" height="145" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(90, 695)">
        <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
        <polyline points="16,28 24,38 40,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="175" y="715" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="175" dy="0">sinfo shows gpu* up infinite 2 idle node[6-7]:</tspan>
        <tspan x="175" dy="38">first proof the scheduler sees two nodes</tspan>
      </text>
    </g>

    
    <g id="check-srun">
      <rect x="60" y="825" width="1480" height="145" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(90, 865)">
        <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
        <polyline points="16,28 24,38 40,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="175" y="885" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="175" dy="0">srun -N 1 hostname and srun -N 2 hostname</tspan>
        <tspan x="175" dy="38">verify multi-node execution</tspan>
      </text>
    </g>
  </g>

  
  <g id="purpose-takeaway">
    <rect x="60" y="995" width="1480" height="150" rx="14" fill="#207448"/>
    
    <rect x="60" y="995" width="16" height="150" rx="4" fill="#db8129"/>
    
    
    <g transform="translate(105, 1038)">
      <path d="M26,6 C16,6 8,14 8,24 C8,30 12,36 16,40 L16,46 L36,46 L36,40 C40,36 44,30 44,24 C44,14 36,6 26,6 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
      <line x1="16" y1="52" x2="36" y2="52" stroke="#ffffff" stroke-width="3"/>
    </g>
    
    <text x="175" y="1055" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan x="175" dy="0">a bug found at the end of a long wait in the shared queue costs the</tspan>
      <tspan x="175" dy="40">afternoon; test on a workstation first</tspan>
    </text>
  </g>
</svg>