<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Translating Slurm variables into PyTorch variables</title>
  <desc>Visual infographic showing how Slurm environment variables are mapped to PyTorch distributed configuration variables via dist_env().</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-loop" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">
    Translating Slurm variables into PyTorch variables
  </text>

  
  <rect x="50" y="105" width="450" height="745" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="275" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Slurm variables</text>

  
  <rect x="1100" y="105" width="450" height="745" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1325" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">PyTorch variables</text>

  
  <g transform="translate(710, 120)">
    <rect x="0" y="0" width="180" height="48" rx="10" fill="#207448" stroke="#207448" stroke-width="2" />
    <text x="90" y="32" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">dist_env()</text>
  </g>

  
  
  <rect x="75" y="185" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="275" y="226" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">SLURM_PROCID</text>
  <text x="275" y="260" font-family="sans-serif" font-size="24" fill="#66726c" text-anchor="middle">(global task number)</text>

  
  <line x1="475" y1="233" x2="1098" y2="233" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="635" y="210" width="330" height="46" rx="23" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="241" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">global task number</text>

  
  <rect x="1125" y="185" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1325" y="244" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">RANK</text>

  
  
  <rect x="75" y="315" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="275" y="356" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">SLURM_LOCALID</text>
  <text x="275" y="390" font-family="sans-serif" font-size="24" fill="#66726c" text-anchor="middle">(position on its own node)</text>

  
  <line x1="475" y1="363" x2="1098" y2="363" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="655" y="340" width="290" height="46" rx="23" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="371" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">position on node</text>

  
  <rect x="1125" y="315" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1325" y="374" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">LOCAL_RANK</text>

  
  
  <rect x="75" y="445" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="275" y="486" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">SLURM_NTASKS</text>
  <text x="275" y="520" font-family="sans-serif" font-size="24" fill="#66726c" text-anchor="middle">(total number of tasks)</text>

  
  <line x1="475" y1="493" x2="1098" y2="493" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="685" y="470" width="230" height="46" rx="23" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="501" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">total tasks</text>

  
  <rect x="1125" y="445" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1325" y="504" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">WORLD_SIZE</text>

  
  
  <rect x="75" y="575" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="275" y="616" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">SLURM_JOB_NODELIST</text>
  <text x="275" y="650" font-family="sans-serif" font-size="24" fill="#66726c" text-anchor="middle">(compressed nodelist)</text>

  
  <line x1="475" y1="623" x2="1098" y2="623" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="615" y="600" width="370" height="46" rx="23" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="631" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">first host in the nodelist</text>

  
  <rect x="1125" y="575" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1325" y="634" font-family="monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">MASTER_ADDR</text>

  
  
  <rect x="75" y="705" width="400" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="275" y="746" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">SLURM_JOB_ID</text>
  <text x="275" y="780" font-family="sans-serif" font-size="24" fill="#66726c" text-anchor="middle">(job number)</text>

  
  <line x1="475" y1="753" x2="1098" y2="753" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)" />
  <rect x="560" y="730" width="480" height="46" rx="23" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="800" y="761" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">10000 plus job ID modulo 20000</text>

  
  <rect x="1125" y="705" width="400" height="96" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="1325" y="764" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">MASTER_PORT</text>

  
  
  <path d="M 1480 671 C 1585 671, 1585 890, 1345 890 C 1145 890, 1145 803, 1145 803"
        fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-loop)" />
  <rect x="1005" y="915" width="530" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1270" y="947" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    a value already set in the environment wins
  </text>

  
  <rect x="50" y="1005" width="1500" height="85" rx="14" fill="#207448" />
  <text x="800" y="1058" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    The glue only maps variables; it does not prove the network is fast.
  </text>
</svg>