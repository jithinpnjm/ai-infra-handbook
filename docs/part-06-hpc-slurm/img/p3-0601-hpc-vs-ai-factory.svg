<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Traditional HPC center versus AI factory</title>
  <desc>Two-column comparison between a traditional HPC center and an AI factory across workloads, precision, traffic, jobs, storage, packaging, failure, north star, and rack power, with the public library versus manufacturing plant analogy and operational takeaway.</desc>
  <rect width="1600" height="1180" fill="#f5f8f5"/>
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Traditional HPC center versus AI factory</text>
  <g id="banner-analogy">
    <rect x="350" y="72" width="900" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(366, 80)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6 C10 4 18 4 24 7 C30 4 38 4 44 6 V29 C38 27 30 27 24 30 C18 27 10 27 4 29 Z"/>
      <line x1="24" y1="7" x2="24" y2="30"/>
    </g>
    <g transform="translate(1194, 80)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 29 V15 L14 20 V15 L24 20 V11 L36 17 V29 Z"/>
      <line x1="2" y1="29" x2="38" y2="29"/>
    </g>
    <text x="800" y="107" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">public library versus manufacturing plant</text>
  </g>
  <g id="header-hpc">
    <rect x="297" y="134" width="588" height="56" rx="8" fill="#207448"/>
    <g transform="translate(315, 144)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="32" height="32" rx="3"/>
      <line x1="2" y1="12" x2="34" y2="12"/>
      <line x1="2" y1="22" x2="34" y2="22"/>
      <circle cx="7" cy="7" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="17" r="1.5" fill="#ffffff"/>
      <circle cx="7" cy="27" r="1.5" fill="#ffffff"/>
    </g>
    <text x="606" y="172" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Traditional HPC center</text>
  </g>
  <g id="header-ai">
    <rect x="897" y="134" width="663" height="56" rx="8" fill="#207448"/>
    <g transform="translate(915, 144)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="28" height="28" rx="4"/>
      <rect x="11" y="11" width="14" height="14" rx="2"/>
      <line x1="11" y1="1" x2="11" y2="4"/>
      <line x1="25" y1="1" x2="25" y2="4"/>
      <line x1="11" y1="32" x2="11" y2="35"/>
      <line x1="25" y1="32" x2="25" y2="35"/>
    </g>
    <text x="1243" y="172" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">AI factory</text>
  </g>
  <!-- Row 1: Workloads -->
  <g id="row-1-workloads">
    <rect x="40" y="198" width="245" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 234)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="32" height="28" rx="4"/>
        <line x1="2" y1="11" x2="34" y2="11"/>
        <polyline points="7,18 12,22 7,26"/>
        <line x1="16" y1="26" x2="24" y2="26"/>
      </g>
    <text x="96" y="262" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Workloads</text>
    <rect x="297" y="198" width="588" height="108" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="247" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="317" dy="0">physical simulation in C, C++ and</tspan>
      <tspan x="317" dy="30">Fortran with MPI and OpenMP</tspan>
    </text>
    <rect x="897" y="198" width="663" height="108" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="234" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">neural-network pre-training, fine-tuning,</tspan>
      <tspan x="917" dy="28">data curation and inference in Python with</tspan>
      <tspan x="917" dy="28">PyTorch or JAX and NCCL</tspan>
    </text>
  </g>
  <!-- Row 2: Precision -->
  <g id="row-2-precision">
    <rect x="40" y="314" width="245" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 324)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="24" height="24" rx="3"/>
        <path d="M12 2 v4 M24 2 v4 M12 30 v4 M24 30 v4 M2 12 h4 M2 24 h4 M30 12 h4 M30 24 h4"/>
        <circle cx="18" cy="18" r="4"/>
      </g>
    <text x="96" y="352" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Precision</text>
    <rect x="297" y="314" width="588" height="56" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="353" font-family="sans-serif" font-size="24" fill="#303a36">heavy FP64</text>
    <rect x="897" y="314" width="663" height="56" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="353" font-family="sans-serif" font-size="24" fill="#303a36">BF16, FP16, FP8, FP4; FP64 rarely used</text>
  </g>
  <!-- Row 3: Traffic -->
  <g id="row-3-traffic">
    <rect x="40" y="378" width="245" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 414)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="18" r="5"/>
        <circle cx="28" cy="9" r="5"/>
        <circle cx="28" cy="27" r="5"/>
        <line x1="13" y1="16" x2="23" y2="11"/>
        <line x1="13" y1="20" x2="23" y2="25"/>
      </g>
    <text x="96" y="442" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Traffic</text>
    <rect x="297" y="378" width="588" height="108" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="427" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="317" dy="0">domain decomposition with halo</tspan>
      <tspan x="317" dy="30">exchanges and small global reductions</tspan>
    </text>
    <rect x="897" y="378" width="663" height="108" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="414" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">data, tensor, pipeline, expert and context</tspan>
      <tspan x="917" dy="28">parallelism; AllReduce, AllGather,</tspan>
      <tspan x="917" dy="28">ReduceScatter, AllToAll elephant flows</tspan>
    </text>
  </g>
  <!-- Row 4: Jobs -->
  <g id="row-4-jobs">
    <rect x="40" y="494" width="245" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 517)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="15" width="28" height="17" rx="3"/>
        <path d="M8 15 V9 A3 3 0 0 1 11 6 H25 A3 3 0 0 1 28 9 V15"/>
        <path d="M12 6 V3 A2 2 0 0 1 14 1 H22 A2 2 0 0 1 24 3 V6"/>
        <line x1="10" y1="23" x2="26" y2="23"/>
      </g>
    <text x="96" y="545" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Jobs</text>
    <rect x="297" y="494" width="588" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="317" dy="0">wide mix of small and medium jobs plus</tspan>
      <tspan x="317" dy="30">occasional hero runs</tspan>
    </text>
    <rect x="897" y="494" width="663" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">bimodal: a few thousand-GPU jobs for weeks</tspan>
      <tspan x="917" dy="30">plus fine-tuning and 24/7 inference</tspan>
    </text>
  </g>
  <!-- Row 5: Storage -->
  <g id="row-5-storage">
    <rect x="40" y="584" width="245" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 607)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="18" cy="8" rx="14" ry="5"/>
        <path d="M4 8 v10 c0 3 6 5 14 5 s14 -2 14 -5 v-10"/>
        <path d="M4 18 v8 c0 3 6 5 14 5 s14 -2 14 -5 v-8"/>
      </g>
    <text x="96" y="635" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Storage</text>
    <rect x="297" y="584" width="588" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="620" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="317" dy="0">scratch, home and simulation dumps</tspan>
      <tspan x="317" dy="30">with heavy POSIX metadata</tspan>
    </text>
    <rect x="897" y="584" width="663" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="620" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">streaming dataloader reads and periodic</tspan>
      <tspan x="917" dy="30">multi-terabyte synchronous checkpoint bursts</tspan>
    </text>
  </g>
  <!-- Row 6: Packaging -->
  <g id="row-6-packaging">
    <rect x="40" y="674" width="245" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 684)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 3 L32 10 L18 17 L4 10 Z"/>
        <path d="M4 10 V24 L18 31 V17"/>
        <path d="M32 10 V24 L18 31"/>
        <line x1="11" y1="7" x2="25" y2="14"/>
      </g>
    <text x="96" y="712" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Packaging</text>
    <rect x="297" y="674" width="588" height="56" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="713" font-family="sans-serif" font-size="24" fill="#303a36">environment modules, Spack, EasyBuild</text>
    <rect x="897" y="674" width="663" height="56" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="713" font-family="sans-serif" font-size="24" fill="#303a36">OCI containers from NGC base images</text>
  </g>
  <!-- Row 7: Failure -->
  <g id="row-7-failure">
    <rect x="40" y="738" width="245" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 774)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 3 L32 9 V18 C32 26 18 32 18 32 C18 32 4 26 4 18 V9 Z"/>
        <line x1="18" y1="10" x2="18" y2="19"/>
        <circle cx="18" cy="24" r="1.5" fill="#207448"/>
      </g>
    <text x="96" y="802" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Failure</text>
    <rect x="297" y="738" width="588" height="108" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="777" font-family="sans-serif" font-size="24" fill="#303a36">periodic checkpoint and restart</text>
    <rect x="897" y="738" width="663" height="108" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <text x="917" y="774" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">at thousands of GPUs faults every few hours</tspan>
      <tspan x="917" dy="28">or days; automated health checks and</tspan>
      <tspan x="917" dy="28">sub-minute checkpointing</tspan>
    </text>
  </g>
  <!-- Row 8: North star -->
  <g id="row-8-north-star">
    <rect x="40" y="854" width="245" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 877)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="18" r="14"/>
        <polygon points="18,6 21,15 30,18 21,21 18,30 15,21 6,18 15,15" fill="#207448"/>
      </g>
    <text x="96" y="905" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">North star</text>
    <rect x="297" y="854" width="588" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="890" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="317" dy="0">high node utilization and fair queue</tspan>
      <tspan x="317" dy="30">turnaround</tspan>
    </text>
    <rect x="897" y="854" width="663" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="890" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">high MFU, minimum time-to-train, lowest cost</tspan>
      <tspan x="917" dy="30">per token or tokens per watt</tspan>
    </text>
  </g>
  <!-- Row 9: Rack power -->
  <g id="row-9-rack-power">
    <rect x="40" y="944" width="245" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(52, 967)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="19,2 7,18 17,18 14,32 28,15 18,15"/>
      </g>
    <text x="96" y="995" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Rack power</text>
    <rect x="297" y="944" width="588" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="317" y="983" font-family="sans-serif" font-size="24" fill="#303a36">15 to 40 kW</text>
    <rect x="897" y="944" width="663" height="82" rx="8" fill="#ffffff" stroke="#c5d8c8" stroke-width="1.5"/>
    <text x="917" y="980" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="917" dy="0">40 to 130 kW or more with direct-to-chip</tspan>
      <tspan x="917" dy="30">liquid cooling</tspan>
    </text>
  </g>
  <!-- Takeaway Bar -->
  <g id="takeaway-bar">
    <rect x="40" y="1038" width="1520" height="80" rx="10" fill="#207448"/>
    <g transform="translate(60, 1058)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 3 L36 9 V19 C36 29 20 37 20 37 C20 37 4 29 4 19 V9 Z"/>
      <polyline points="12,19 18,25 28,13"/>
    </g>
    <text x="820" y="1072" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="820" dy="0">Slurm, fabric and storage skills carry over;</tspan>
      <tspan x="820" dy="30">what changes is the size of each failure and how quickly you must respond</tspan>
    </text>
  </g>
</svg>