<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Per node or total: the first two request options</title>
  <desc>Slurm GPU allocation comparison between per-node and total job requests, common usage recipes, and option notes.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Per node or total: the first two request options</text>
  <text x="800" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#207448" text-anchor="middle">Worked comparison on a two-node job asking for four GPUs.</text>

  
  
  <g id="box-per-node">
    <rect x="50" y="130" width="725" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="80" y="155" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="167" x2="108" y2="167" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="179" x2="108" y2="179" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="89" cy="167" r="1.5" fill="#207448"/>
    <circle cx="89" cy="179" r="1.5" fill="#207448"/>

    
    <text x="130" y="181" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">--gres=gpu:4 (or --gpus-per-node=4):</text>
    
    
    <text x="80" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0" font-weight="bold" fill="#207448">per node; with --nodes=2 every node gets four GPUs,</tspan>
      <tspan x="80" dy="44" font-weight="bold" fill="#207448">eight in total</tspan>
    </text>
  </g>

  
  <g id="box-total">
    <rect x="825" y="130" width="725" height="300" rx="16" fill="#fdf6ed" stroke="#db8129" stroke-width="2.5"/>
    
    <rect x="855" y="155" width="36" height="36" rx="6" fill="none" stroke="#db8129" stroke-width="3"/>
    <path d="M867 179 L879 167 M879 179 L867 167" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

    
    <text x="905" y="181" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">--gpus=4 (-G 4):</text>

    
    <text x="855" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">total for the job; Slurm decides the split,</tspan>
      <tspan x="855" dy="38">for example 2 plus 2, or all four on one node; can fragment</tspan>
      <tspan x="855" dy="38">placement and hurt NCCL, use only for jobs that tolerate it</tspan>
    </text>
  </g>

  
  
  <g id="recipe-single-node">
    <rect x="50" y="460" width="725" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="75" y="485" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="84" y="494" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <text x="125" y="511" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">single-node training, all GPUs:</text>

    
    <text x="75" y="565" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="75" dy="0">--gres=gpu:8 or --gpus-per-node=8,</tspan>
      <tspan x="75" dy="44" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">add --exclusive for a dedicated node</tspan>
    </text>
  </g>

  
  <g id="recipe-multi-node">
    <rect x="825" y="460" width="725" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="855" y="485" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="875" y="485" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="855" y="505" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="875" y="505" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <text x="905" y="511" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">multi-node, one process per GPU (PyTorch):</text>

    
    <text x="855" y="560" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="855" dy="0">--nodes=N --ntasks-per-node=8 --gpus-per-node=8</tspan>
      <tspan x="855" dy="38" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">plus <tspan font-family="monospace" fill="#207448">--cpus-per-gpu</tspan> or <tspan font-family="monospace" fill="#207448">--cpus-per-task</tspan></tspan>
      <tspan x="855" dy="38" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">for data-loader threads, result N times 8 ranks,</tspan>
      <tspan x="855" dy="38" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" fill="#207448">one GPU each</tspan>
    </text>
  </g>

  
  <g id="recipe-independent-tasks">
    <rect x="50" y="765" width="725" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="85" cy="808" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="102" cy="808" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M75 790 h36 v36 h-36 z" fill="none" stroke="#207448" stroke-width="2.5" rx="6"/>

    
    <text x="125" y="815" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">several independent tasks in one allocation:</text>

    
    <text x="75" y="870" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="75" dy="0">--gpus-per-task=1 with an explicit -n,</tspan>
      <tspan x="75" dy="44" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">each task gets its own GPU</tspan>
    </text>
  </g>

  
  <g id="recipe-interactive">
    <rect x="825" y="765" width="725" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="855" y="790" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M862 801 L869 808 L862 815" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="873" y1="815" x2="883" y2="815" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

    
    <text x="905" y="815" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">interactive:</text>

    
    <text x="855" y="865" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="855" dy="0">salloc --gres=gpu:1 --cpus-per-gpu=8</tspan>
      <tspan x="855" dy="38">--mem-per-gpu=64G --time=1:00:00</tspan>
      <tspan x="855" dy="38" fill="#303a36">then srun --pty bash</tspan>
    </text>
  </g>

  
  
  <g id="note-1">
    <rect x="50" y="1070" width="1500" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="91" cy="1106" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="91" y="1114" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448" text-anchor="middle">i</text>

    
    <text x="125" y="1118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0"><tspan font-family="monospace" font-weight="bold" fill="#207448">--gpus-per-task</tspan> needs an explicit task count and implicitly sets</tspan>
      <tspan x="125" dy="38" font-family="monospace" font-weight="bold" fill="#207448">--tres-bind=gres/gpu:per_task:N</tspan>
    </text>
  </g>

  
  <g id="note-2">
    <rect x="50" y="1200" width="1500" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="91" cy="1236" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="85" y1="1230" x2="97" y2="1242" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="97" y1="1230" x2="85" y2="1242" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

    
    <text x="125" y="1260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">--cpus-per-gpu</tspan> is not compatible with <tspan font-family="monospace" font-weight="bold" fill="#207448">--cpus-per-task</tspan>
    </text>
  </g>

  
  <g id="note-3">
    <rect x="50" y="1320" width="1500" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="91" cy="1356" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="91" y="1364" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448" text-anchor="middle">!</text>

    
    <text x="125" y="1365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0"><tspan font-family="monospace" font-weight="bold" fill="#207448">--mem-per-gpu</tspan> is exclusive with <tspan font-family="monospace" fill="#207448">--mem</tspan> and <tspan font-family="monospace" fill="#207448">--mem-per-cpu</tspan>,</tspan>
      <tspan x="125" dy="40">default is the partition DefMemPerGPU</tspan>
    </text>
  </g>
</svg>