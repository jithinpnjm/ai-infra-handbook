<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Binding answers two separate questions</title>
  <desc>SVG infographic explaining GPU and CPU binding on an 8-GPU 2-socket HGX node.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Binding answers two separate questions</text>

  
  <rect x="50" y="95" width="1500" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(68, 110)">
    <rect x="0" y="4" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="20" x2="44" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="36" x2="44" y2="36" stroke="#207448" stroke-width="3"/>
    <circle cx="46" cy="12" r="3" fill="#207448"/>
    <circle cx="38" cy="12" r="3" fill="#207448"/>
  </g>

  <text x="145" y="132" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Two-lane diagram on an 8-GPU, 2-socket HGX node:</text>
  <text x="145" y="162" font-family="sans-serif" font-size="24" fill="#303a36">GPUs 0 to 3 on socket 0 (NUMA 0), GPUs 4 to 7 on socket 1</text>

  
  <rect x="50" y="200" width="730" height="625" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 50 212 Q 50 200 62 200 L 768 200 Q 780 200 780 212 L 780 338 L 50 338 Z" fill="#e8f1ea"/>
  
  
  <g transform="translate(68, 215)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="3"/>
  </g>

  <text x="145" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Lane 1</text>
  <text x="145" y="278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Which GPU does each task get:</text>
  <text x="145" y="314" font-family="monospace" font-size="24" fill="#207448">--gpu-bind or --tres-bind=gres/gpu:...</text>

  
  <g>
    <rect x="65" y="350" width="700" height="45" rx="6" fill="#f5f8f5"/>
    <text x="80" y="381" font-family="sans-serif" font-size="24" fill="#303a36">closest binds each task to the nearest GRES</text>

    <rect x="65" y="405" width="700" height="70" rx="6" fill="#f5f8f5"/>
    <text x="80" y="433" font-family="sans-serif" font-size="24" fill="#303a36">map:LIST assigns GPU IDs to tasks,</text>
    <text x="80" y="461" font-family="monospace" font-size="24" fill="#207448">as in map:0,1,2,3 or map:0*4,1*4</text>

    <rect x="65" y="485" width="700" height="45" rx="6" fill="#f5f8f5"/>
    <text x="80" y="516" font-family="sans-serif" font-size="24" fill="#303a36">mask:LIST uses hexadecimal masks</text>

    <rect x="65" y="540" width="700" height="45" rx="6" fill="#f5f8f5"/>
    <text x="80" y="571" font-family="monospace" font-size="24" fill="#207448">per_task:N, single:N</text>

    <rect x="65" y="595" width="700" height="45" rx="6" fill="#f5f8f5"/>
    <text x="80" y="626" font-family="sans-serif" font-size="24" fill="#303a36">verbose prints the decision</text>

    <rect x="65" y="650" width="700" height="70" rx="6" fill="#f5f8f5"/>
    <text x="80" y="678" font-family="sans-serif" font-size="24" fill="#303a36">none turns binding off including the</text>
    <text x="80" y="706" font-family="sans-serif" font-size="24" fill="#303a36">implicit binding from --gpus-per-task</text>

    <rect x="65" y="730" width="700" height="82" rx="6" fill="#f5f8f5"/>
    <text x="80" y="755" font-family="sans-serif" font-size="24" fill="#303a36">with task/cgroup and ConstrainDevices=yes</text>
    <text x="80" y="781" font-family="sans-serif" font-size="24" fill="#303a36">the IDs are zero-based relative to the</text>
    <text x="80" y="805" font-family="sans-serif" font-size="24" fill="#303a36">allocation, otherwise global IDs</text>
  </g>

  
  <rect x="820" y="200" width="730" height="625" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 820 212 Q 820 200 832 200 L 1538 200 Q 1550 200 1550 212 L 1550 338 L 820 338 Z" fill="#e8f1ea"/>
  
  
  <g transform="translate(838, 215)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="16" y="16" width="10" height="10" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="30" y="16" width="10" height="10" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="16" y="30" width="10" height="10" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="30" y="30" width="10" height="10" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="3"/>
  </g>

  <text x="915" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Lane 2</text>
  <text x="915" y="268" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Which CPUs may a task run on,</text>
  <text x="915" y="296" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">given its GPU:</text>
  <text x="915" y="324" font-family="monospace" font-size="24" fill="#207448">Cores= in gres.conf and --gres-flags</text>

  
  <g>
    <rect x="835" y="350" width="700" height="85" rx="6" fill="#f5f8f5"/>
    <text x="850" y="400" font-family="sans-serif" font-size="24" fill="#303a36">by default cores near a GPU are preferred</text>

    <rect x="835" y="450" width="700" height="95" rx="6" fill="#f5f8f5"/>
    <text x="850" y="488" font-family="monospace" font-size="24" fill="#207448">--gres-flags=enforce-binding restricts the</text>
    <text x="850" y="522" font-family="sans-serif" font-size="24" fill="#303a36">job to the cores bound to its GPUs</text>

    <rect x="835" y="560" width="700" height="85" rx="6" fill="#f5f8f5"/>
    <text x="850" y="610" font-family="monospace" font-size="24" fill="#207448">disable-binding lifts it</text>

    <rect x="835" y="660" width="700" height="152" rx="6" fill="#f5f8f5"/>
    <text x="850" y="725" font-family="sans-serif" font-size="24" fill="#303a36">pending reason appears when more CPUs are</text>
    <text x="850" y="765" font-family="sans-serif" font-size="24" fill="#303a36">requested than are bound to the GPU</text>
  </g>

  
  <rect x="50" y="845" width="1500" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(68, 885)">
    <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="14,18 26,28 14,38" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="30" y1="38" x2="44" y2="38" stroke="#207448" stroke-width="4"/>
  </g>

  <text x="145" y="888" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Walkthrough</text>
  <text x="145" y="926" font-family="monospace" font-size="24" fill="#303a36">eight tasks with --gpus-per-task=1 --cpus-per-gpu=N --gpu-bind=closest</text>
  <text x="145" y="958" font-family="sans-serif" font-size="24" fill="#303a36">put each rank on a GPU with CPUs from the same NUMA node</text>

  
  <rect x="50" y="1000" width="1500" height="175" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  
  <g transform="translate(68, 1025)">
    <path d="M 28 4 L 52 14 L 52 32 Q 52 48 28 54 Q 4 48 4 32 L 4 14 Z" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="4"/>
    <circle cx="28" cy="40" r="2.5" fill="#db8129"/>
  </g>

  <text x="145" y="1040" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Reason</text>
  <text x="145" y="1078" font-family="sans-serif" font-size="24" fill="#303a36">a GPU on the far socket means every host-to-device copy crosses the slow path;</text>
  <text x="145" y="1108" font-family="sans-serif" font-size="24" fill="#303a36">data still arrives so nothing fails</text>
  <text x="145" y="1150" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Check with nvidia-smi topo -m</text>
</svg>