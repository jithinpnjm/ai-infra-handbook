    <line x1="117" y1="237" x2="117" y2="243"/>
    <line x1="79" y1="205" x2="85" y2="205"/>
    <line x1="79" y1="216" x2="85" y2="216"/>
    <line x1="79" y1="227" x2="85" y2="227"/>
    <line x1="127" y1="205" x2="133" y2="205"/>
