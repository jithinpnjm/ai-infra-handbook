<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>The tool landscape</title>
  <desc>Visual tool landscape showing Telemetry Collectors flowing into TSDB and Analytics, feeding Grafana Dashboards, Alertmanager, and Open XDMoD.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" fill="#303a36" font-size="48" font-weight="bold" font-family="sans-serif">The tool landscape</text>

  
  
  
  <rect x="40" y="105" width="480" height="915" rx="16" fill="#e8f1ea" fill-opacity="0.45" stroke="#207448" stroke-width="2.5"/>
  <text x="65" y="152" fill="#207448" font-size="32" font-weight="bold" font-family="sans-serif">1. Telemetry Collectors</text>

  
  <rect x="60" y="175" width="440" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
