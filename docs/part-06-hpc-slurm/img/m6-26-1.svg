  </text>
  <text x="85" y="568" fill="#506059" font-size="24" font-family="sans-serif">CPU, RAM, IB, /tmp, IPMI</text>

  
  <rect x="60" y="615" width="440" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
