  <text x="85" y="972" fill="#506059" font-size="24" font-family="sans-serif">PDUs, CDUs, Switches, UPS</text>

  
  
  
  <rect x="570" y="105" width="470" height="915" rx="16" fill="#e8f1ea" fill-opacity="0.45" stroke="#207448" stroke-width="2.5"/>
  <text x="595" y="152" fill="#207448" font-size="32" font-weight="bold" font-family="sans-serif">2. TSDB &amp; Analytics</text>

  
  <rect x="595" y="190" width="420" height="250" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
  
  <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="645" cy="222" rx="24" ry="9" fill="#fdf6ee"/>
    <path d="M 621 222 v 28 c 0 5 11 9 24 9 s 24 -4 24 -9 v -28" fill="#fdf6ee"/>
    <path d="M 621 236 c 0 5 11 9 24 9 s 24 -4 24 -9"/>
    <polyline points="630,242 638,233 645,246 652,236 660,242"/>
  </g>
  <text x="625" y="325" fill="#303a36" font-size="32" font-weight="bold" font-family="sans-serif">
    <tspan x="625" dy="0">Prometheus /</tspan>
    <tspan x="625" dy="42">VictoriaMetrics</tspan>
  </text>

  
  <rect x="595" y="570" width="420" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
