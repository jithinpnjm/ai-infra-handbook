  </g>
  <text x="625" y="680" fill="#303a36" font-size="30" font-weight="bold" font-family="sans-serif">Open XDMoD + SUPReMM</text>
  <text x="625" y="735" fill="#506059" font-size="24" font-family="sans-serif">
    <tspan x="625" dy="0">Per-Job Efficiency &amp;</tspan>
    <tspan x="625" dy="32">Chargeback</tspan>
  </text>

  
  
  
  <rect x="1090" y="190" width="470" height="250" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1125" y="215" width="38" height="28" rx="3" fill="#e8f1ea"/>
    <line x1="1144" y1="243" x2="1144" y2="251"/>
    <line x1="1136" y1="251" x2="1152" y2="251"/>
    <polyline points="1131,232 1138,225 1145,234 1155,223"/>
    <path d="M 1184 234 c 0 -8 -5 -12 -9 -12 s -9 4 -9 12 c -2 2 -4 4 -4 6 h 26 c 0 -2 -2 -4 -4 -6 Z" fill="#e8f1ea"/>
    <circle cx="1175" cy="244" r="2.5" fill="#207448"/>
  </g>
  <text x="1125" y="315" fill="#303a36" font-size="30" font-weight="bold" font-family="sans-serif">3. Grafana Dashboards &amp;</text>
  <text x="1125" y="365" fill="#506059" font-size="25" font-family="sans-serif">
    <tspan x="1125" dy="0">Alertmanager</tspan>
    <tspan x="1125" dy="34">(Runbooks / Drain)</tspan>
  </text>

  
  
  
   Prom -->
  <line x1="520" y1="315" x2="595" y2="315" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

   Graf -->
