<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>The life of a job</title>
  <desc>Sequence diagram illustrating the complete lifecycle of a Slurm job from submission through scheduling, execution, and cleanup.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5"/>

  
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">The life of a job</text>

  

  
  <line x1="150" y1="185" x2="150" y2="1470" stroke="#a3b899" stroke-width="2.5" stroke-dasharray="8,8"/>
  <line x1="480" y1="185" x2="480" y2="1470" stroke="#a3b899" stroke-width="2.5" stroke-dasharray="8,8"/>
  <line x1="810" y1="185" x2="810" y2="1470" stroke="#a3b899" stroke-width="2.5" stroke-dasharray="8,8"/>
  <line x1="1140" y1="185" x2="1140" y2="1470" stroke="#a3b899" stroke-width="2.5" stroke-dasharray="8,8"/>
  <line x1="1450" y1="185" x2="1450" y2="1470" stroke="#a3b899" stroke-width="2.5" stroke-dasharray="8,8"/>

  
  <rect x="30" y="70" width="240" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="130" y="80" width="40" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="138" y1="94" x2="146" y2="94" stroke="#207448" stroke-width="3"/>
  <line x1="140" y1="108" x2="160" y2="108" stroke="#207448" stroke-width="3"/>
  <text x="150" y="138" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">User on</text>
  <text x="150" y="166" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">login node</text>

  
  <rect x="360" y="70" width="240" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="480" cy="95" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="480" cy="95" r="5" fill="#207448"/>
  <path d="M 480 77 L 480 82 M 480 108 L 480 113 M 462 95 L 467 95 M 493 95 L 498 95" stroke="#207448" stroke-width="3"/>
  <text x="480" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">slurmctld</text>

  
  <rect x="690" y="70" width="240" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <ellipse cx="810" cy="88" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 792 88 L 792 106 A 18 6 0 0 0 828 106 L 828 88" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="810" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">slurmdbd</text>

  
  <rect x="1020" y="70" width="240" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="1118" y="80" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1128" cy="94" r="3" fill="#207448"/>
  <line x1="1138" y1="94" x2="1152" y2="94" stroke="#207448" stroke-width="3"/>
  <text x="1140" y="138" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">slurmd on</text>
  <text x="1140" y="166" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">node A</text>

  
  <rect x="1330" y="70" width="240" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="1428" y="80" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1438" cy="94" r="3" fill="#207448"/>
  <line x1="1448" y1="94" x2="1462" y2="94" stroke="#207448" stroke-width="3"/>
  <text x="1450" y="138" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">slurmd on</text>
  <text x="1450" y="166" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">node B</text>


  
  
  <circle cx="70" cy="265" r="20" fill="#207448"/>
  <text x="70" y="273" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <rect x="135" y="202" width="360" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="315" y="226" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sbatch job.sh</text>
  <text x="315" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(RPC with munge credential)</text>
  <line x1="150" y1="265" x2="470" y2="265" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="425" cy="345" r="20" fill="#207448"/>
  <text x="425" y="353" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <path d="M 480 325 L 515 325 L 515 365 L 488 365" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="525" y="315" width="510" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="341" font-family="sans-serif" font-size="24" fill="#303a36">authenticate, run job_submit plugin,</text>
  <text x="545" y="367" font-family="sans-serif" font-size="24" fill="#303a36">check limits and associations</text>


  
  > U: Submitted batch job 4217 -->
  <circle cx="70" cy="445" r="20" fill="#207448"/>
  <text x="70" y="453" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <rect x="145" y="395" width="340" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="315" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Submitted batch job 4217</text>
  <line x1="480" y1="445" x2="160" y2="445" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/>


  
  
  <circle cx="425" cy="525" r="20" fill="#207448"/>
  <text x="425" y="533" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <path d="M 480 505 L 515 505 L 515 545 L 488 545" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="525" y="495" width="510" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="521" font-family="sans-serif" font-size="24" fill="#303a36">job PENDING in queue,</text>
  <text x="545" y="547" font-family="sans-serif" font-size="24" fill="#303a36">scheduler loop and backfill evaluate it</text>


  
  
  <circle cx="425" cy="615" r="20" fill="#db8129"/>
  <text x="425" y="623" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <path d="M 480 595 L 515 595 L 515 635 L 488 635" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="525" y="585" width="550" height="64" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2.5"/>
  <text x="545" y="611" font-family="sans-serif" font-size="24" fill="#303a36">resources found: allocate nodes A and B,</text>
  <text x="545" y="637" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">state RUNNING</text>


  
  
  <circle cx="425" cy="715" r="20" fill="#207448"/>
  <text x="425" y="723" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <rect x="560" y="665" width="500" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="810" y="695" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">launch batch step (RPC tree fan-out)</text>
  <line x1="480" y1="715" x2="1130" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="425" cy="805" r="20" fill="#207448"/>
  <text x="425" y="813" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
  <rect x="800" y="755" width="330" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="965" y="785" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">prepare node (prolog)</text>
  <line x1="480" y1="805" x2="1440" y2="805" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="1085" cy="885" r="20" fill="#207448"/>
  <text x="1085" y="893" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
  <path d="M 1140 865 L 1175 865 L 1175 905 L 1148 905" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1185" y="855" width="370" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1205" y="881" font-family="sans-serif" font-size="24" fill="#303a36">prolog, fork slurmstepd,</text>
  <text x="1205" y="907" font-family="sans-serif" font-size="24" fill="#303a36">run the batch script</text>


  
  
  <circle cx="1085" cy="990" r="20" fill="#207448"/>
  <text x="1085" y="998" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">9</text>
  <rect x="1115" y="925" width="360" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1295" y="951" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">script runs srun,</text>
  <text x="1295" y="975" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">steps launched on both nodes</text>
  <line x1="1140" y1="990" x2="1440" y2="990" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="1085" cy="1075" r="20" fill="#207448"/>
  <text x="1085" y="1083" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">10</text>
  <path d="M 1140 1055 L 1175 1055 L 1175 1095 L 1148 1095" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1185" y="1052" width="370" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1370" y="1081" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>


  
  
  <circle cx="1010" cy="1168" r="20" fill="#207448"/>
  <text x="1010" y="1176" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">11</text>
  <path d="M 1450 1148 L 1485 1148 L 1485 1188 L 1458 1188" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1055" y="1147" width="370" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1240" y="1176" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">epilog, cleanup of processes</text>


  
  
  <circle cx="425" cy="1275" r="20" fill="#207448"/>
  <text x="425" y="1283" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">12</text>
  <rect x="680" y="1225" width="260" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="810" y="1255" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">job complete RPC</text>
  <line x1="1140" y1="1275" x2="490" y2="1275" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="425" cy="1365" r="20" fill="#207448"/>
  <text x="425" y="1373" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">13</text>
  <rect x="490" y="1302" width="340" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="660" y="1327" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">job record: times, resources,</text>
  <text x="660" y="1351" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">exit code, usage</text>
  <line x1="480" y1="1365" x2="800" y2="1365" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>


  
  
  <circle cx="425" cy="1440" r="20" fill="#207448"/>
  <text x="425" y="1448" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">14</text>
  <path d="M 480 1420 L 515 1420 L 515 1460 L 488 1460" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="525" y="1410" width="340" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="1434" font-family="sans-serif" font-size="24" fill="#303a36">free nodes A and B,</text>
  <text x="545" y="1458" font-family="sans-serif" font-size="24" fill="#303a36">run scheduler again</text>

</svg>