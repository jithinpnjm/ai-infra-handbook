<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The life of a job</title>
  <desc>Sequence diagram illustrating the life cycle of a Slurm batch job across login node, controller, database daemon, and compute nodes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="48" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The life of a job</text>

  
  <line x1="160" y1="215" x2="160" y2="1170" stroke="#c0d4c5" stroke-width="2" stroke-dasharray="8,8" />
  <line x1="480" y1="215" x2="480" y2="1170" stroke="#c0d4c5" stroke-width="2" stroke-dasharray="8,8" />
  <line x1="800" y1="215" x2="800" y2="1170" stroke="#c0d4c5" stroke-width="2" stroke-dasharray="8,8" />
  <line x1="1120" y1="215" x2="1120" y2="1170" stroke="#c0d4c5" stroke-width="2" stroke-dasharray="8,8" />
  <line x1="1440" y1="215" x2="1440" y2="1170" stroke="#c0d4c5" stroke-width="2" stroke-dasharray="8,8" />

  
  <rect x="40" y="70" width="240" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="135" y="80" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="135" y1="92" x2="185" y2="92" stroke="#207448" stroke-width="3" />
  <line x1="143" y1="102" x2="149" y2="102" stroke="#207448" stroke-width="3" />
  <line x1="153" y1="102" x2="167" y2="102" stroke="#207448" stroke-width="3" />
  <line x1="160" y1="114" x2="160" y2="124" stroke="#207448" stroke-width="4" />
  <line x1="148" y1="124" x2="172" y2="124" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="160" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">User on<tspan x="160" dy="34">login node</tspan></text>

  
  <rect x="360" y="70" width="240" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="480" cy="102" r="14" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="480" cy="102" r="23" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="9 4.5" stroke-linecap="round" />
  <text x="480" y="185" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">slurmctld</text>

  
  <rect x="680" y="70" width="240" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="800" cy="88" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 778 88 V 116 A 22 8 0 0 0 822 116 V 88" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 778 102 A 22 8 0 0 0 822 102" fill="none" stroke="#207448" stroke-width="4" />
  <text x="800" y="185" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">slurmdbd</text>

  
  <rect x="1000" y="70" width="240" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="1102" y="84" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="1111" y="93" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1109" y1="79" x2="1109" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1120" y1="79" x2="1120" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1131" y1="79" x2="1131" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1109" y1="120" x2="1109" y2="125" stroke="#207448" stroke-width="3" />
  <line x1="1120" y1="120" x2="1120" y2="125" stroke="#207448" stroke-width="3" />
  <line x1="1131" y1="120" x2="1131" y2="125" stroke="#207448" stroke-width="3" />
  <text x="1120" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle"><tspan font-family="monospace">slurmd</tspan> on<tspan x="1120" dy="34">node A</tspan></text>

  
  <rect x="1320" y="70" width="240" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="1422" y="84" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="1431" y="93" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1429" y1="79" x2="1429" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1440" y1="79" x2="1440" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1451" y1="79" x2="1451" y2="84" stroke="#207448" stroke-width="3" />
  <line x1="1429" y1="120" x2="1429" y2="125" stroke="#207448" stroke-width="3" />
  <line x1="1440" y1="120" x2="1440" y2="125" stroke="#207448" stroke-width="3" />
  <line x1="1451" y1="120" x2="1451" y2="125" stroke="#207448" stroke-width="3" />
  <text x="1440" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle"><tspan font-family="monospace">slurmd</tspan> on<tspan x="1440" dy="34">node B</tspan></text>

  
  <circle cx="108" cy="254" r="24" fill="#207448" />
  <text x="108" y="254" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="320" y="234" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle"><tspan font-family="monospace" font-weight="bold">sbatch job.sh</tspan> (RPC with munge credential)</text>
  <line x1="160" y1="254" x2="466" y2="254" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="426" cy="324" r="24" fill="#207448" />
  <text x="426" y="324" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <path d="M 480 308 H 530 V 340 H 494" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="546" y="294" width="520" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="562" y="320" font-family="sans-serif" font-size="24" fill="#303a36">authenticate, run <tspan font-family="monospace">job_submit</tspan> plugin,<tspan x="562" dy="26">check limits and associations</tspan></text>

  > U -->
  <circle cx="534" cy="396" r="24" fill="#207448" />
  <text x="534" y="396" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="320" y="386" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Submitted batch job 4217</text>
  <line x1="480" y1="400" x2="174" y2="400" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />

  
  <circle cx="426" cy="460" r="24" fill="#207448" />
  <text x="426" y="460" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <path d="M 480 444 H 530 V 476 H 494" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="546" y="430" width="536" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="562" y="456" font-family="sans-serif" font-size="24" fill="#303a36">job <tspan font-family="monospace" font-weight="bold">PENDING</tspan> in queue,<tspan x="562" dy="26">scheduler loop and backfill evaluate it</tspan></text>

  
  <circle cx="426" cy="534" r="24" fill="#db8129" />
  <text x="426" y="534" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <path d="M 480 518 H 530 V 550 H 494" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <rect x="546" y="504" width="548" height="64" rx="8" fill="#fff6ee" stroke="#db8129" stroke-width="2" />
  <text x="562" y="530" font-family="sans-serif" font-size="24" fill="#303a36">resources found: allocate nodes A and B,<tspan x="562" dy="26">state <tspan font-family="monospace" font-weight="bold">RUNNING</tspan></tspan></text>

  
  <circle cx="426" cy="608" r="24" fill="#207448" />
  <text x="426" y="608" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="800" y="598" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">launch batch step (RPC tree fan-out)</text>
  <line x1="480" y1="612" x2="1106" y2="612" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="426" cy="676" r="24" fill="#207448" />
  <text x="426" y="676" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="960" y="666" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">prepare node (<tspan font-family="monospace">prolog</tspan>)</text>
  <line x1="480" y1="680" x2="1426" y2="680" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="1066" cy="746" r="24" fill="#207448" />
  <text x="1066" y="746" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">8</text>
  <path d="M 1120 730 H 1170 V 762 H 1134" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1184" y="716" width="376" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1198" y="742" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">prolog</tspan>, fork <tspan font-family="monospace">slurmstepd</tspan>,<tspan x="1198" dy="26">run the batch script</tspan></text>

  
  <circle cx="1066" cy="824" r="24" fill="#207448" />
  <text x="1066" y="824" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">9</text>
  <text x="1280" y="806" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">script runs <tspan font-family="monospace">srun</tspan>,<tspan x="1280" dy="26">steps launched on both nodes</tspan></text>
  <line x1="1120" y1="838" x2="1426" y2="838" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="1066" cy="912" r="24" fill="#207448" />
  <text x="1066" y="912" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">10</text>
  <path d="M 1120 896 H 1162 V 928 H 1134" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  <rect x="1178" y="874" width="204" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1280" y="904" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle"><tspan font-family="monospace">epilog</tspan>,<tspan x="1280" dy="30">cleanup of processes</tspan></text>

  <circle cx="1494" cy="912" r="24" fill="#207448" />
  <text x="1494" y="912" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">11</text>
  <path d="M 1440 896 H 1398 V 928 H 1426" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="1174" cy="996" r="24" fill="#207448" />
  <text x="1174" y="996" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">12</text>
  <text x="800" y="986" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">job complete RPC</text>
  <line x1="1120" y1="1000" x2="494" y2="1000" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="426" cy="1066" r="24" fill="#207448" />
  <text x="426" y="1066" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="640" y="1046" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">job record:<tspan x="640" dy="26">times, resources, exit code, usage</tspan></text>
  <line x1="480" y1="1078" x2="786" y2="1078" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="426" cy="1136" r="24" fill="#207448" />
  <text x="426" y="1136" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">14</text>
  <path d="M 480 1120 H 530 V 1152 H 494" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="546" y="1106" width="374" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="562" y="1132" font-family="sans-serif" font-size="24" fill="#303a36">free nodes A and B,<tspan x="562" dy="26">run scheduler again</tspan></text>
</svg>