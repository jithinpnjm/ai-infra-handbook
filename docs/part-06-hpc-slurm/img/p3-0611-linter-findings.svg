<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading sbatch linter output by prefix</title>
  <desc>Infographic explaining sbatch linter output categorized into ERROR, warn, and info tiers with runner footer.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading sbatch linter output by prefix</text>

  
  <rect x="40" y="110" width="1520" height="255" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>

  
  <polygon points="84,128 112,128 126,142 126,166 112,180 84,180 70,166 70,142" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
  <line x1="98" y1="140" x2="98" y2="158" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  <circle cx="98" cy="168" r="2.5" fill="#db8129"/>

  
  <text x="145" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ERROR means the script is wrong, do not submit</text>

  
  <circle cx="82" cy="204" r="4" fill="#db8129"/>
  <text x="105" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">no shebang line, <tspan font-family="ui-monospace, monospace">sbatch</tspan> rejects scripts that do not start with <tspan font-family="ui-monospace, monospace">#!</tspan></text>

  <circle cx="82" cy="240" r="4" fill="#db8129"/>
  <text x="105" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">--mem</tspan> and <tspan font-family="ui-monospace, monospace">--mem-per-gpu</tspan> are mutually exclusive</text>

  <circle cx="82" cy="276" r="4" fill="#db8129"/>
  <text x="105" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">--cpus-per-gpu</tspan> is not compatible with <tspan font-family="ui-monospace, monospace">--cpus-per-task</tspan></text>

  <circle cx="82" cy="312" r="4" fill="#db8129"/>
  <text x="105" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">--gpus-per-task</tspan> needs an explicit task count</text>

  
  <rect x="40" y="385" width="1520" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <polygon points="98,405 125,453 71,453" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <line x1="98" y1="421" x2="98" y2="437" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="98" cy="445" r="2" fill="#207448"/>

  
  <text x="145" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">warn means it will probably run but likely cause a problem later</text>

  
  <circle cx="82" cy="479" r="4" fill="#207448"/>
  <text x="105" y="487" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">line 8 <tspan font-family="ui-monospace, monospace">--tasks-per-node</tspan> is not in the reference option list (typo or different Slurm version)</text>

  <circle cx="82" cy="515" r="4" fill="#207448"/>
  <text x="105" y="523" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">no <tspan font-family="ui-monospace, monospace">--time</tspan> so the partition default applies</text>

  <circle cx="82" cy="551" r="4" fill="#207448"/>
  <text x="105" y="559" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">requeued job writes to a fixed output name so use <tspan font-family="ui-monospace, monospace">--open-mode=append</tspan> or include <tspan font-family="ui-monospace, monospace">%j</tspan></text>

  <circle cx="82" cy="587" r="4" fill="#207448"/>
  <text x="105" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">module load</tspan> without <tspan font-family="ui-monospace, monospace">module purge</tspan> mixes toolchains</text>

  
  <rect x="40" y="660" width="1520" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="98" cy="704" r="24" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="98" cy="694" r="2.5" fill="#207448"/>
  <line x1="98" y1="702" x2="98" y2="718" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="145" y="708" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">info is advice</text>

  
  <circle cx="82" cy="754" r="4" fill="#207448"/>
  <text x="105" y="762" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">job array without a <tspan font-family="ui-monospace, monospace">%N</tspan> throttle can flood the scheduler and file system</text>

  <circle cx="82" cy="790" r="4" fill="#207448"/>
  <text x="105" y="798" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">--requeue</tspan> without <tspan font-family="ui-monospace, monospace">--signal</tspan> gives no warning before preemption or time limit</text>

  <circle cx="82" cy="826" r="4" fill="#207448"/>
  <text x="105" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">no <tspan font-family="ui-monospace, monospace">set -e</tspan></text>

  <circle cx="82" cy="862" r="4" fill="#207448"/>
  <text x="105" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve"><tspan font-family="ui-monospace, monospace">mpirun</tspan> inside a batch script, <tspan font-family="ui-monospace, monospace">srun --mpi=pmix</tspan> lets Slurm launch and bind ranks</text>

  
  <rect x="40" y="935" width="1520" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="72" y="955" width="52" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="82,971 90,977 82,983" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="96" y1="983" x2="112" y2="983" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="145" y="995" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" xml:space="preserve">run from <tspan font-family="ui-monospace, monospace">sbatch_lint.py</tspan> or from a <tspan font-family="ui-monospace, monospace">job_submit</tspan> Lua plugin or a <tspan font-family="ui-monospace, monospace">sbatch</tspan> wrapper;<tspan x="145" dy="45">it can also set defaults for partition, time, GPU CPU and memory and account;</tspan><tspan x="145" dy="45">good script gives 0 findings, the broken script gives 4 ERRORs and 8 warnings</tspan></text>
</svg>