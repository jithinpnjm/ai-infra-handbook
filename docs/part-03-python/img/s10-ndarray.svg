<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>What a NumPy array is</title>
  <desc>Visual explanation of a NumPy array consisting of a contiguous block of typed memory and a metadata box with dtype, shape, and strides that tell how to read it.</desc>
  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What a NumPy array is</text>

  <rect x="80" y="140" width="540" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(322, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="8" width="56" height="38" rx="4"/>
    <line x1="8" y1="46" x2="8" y2="52"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="48" y1="46" x2="48" y2="52"/>
    <rect x="8" y="16" width="16" height="20" rx="2"/>
    <rect x="32" y="16" width="16" height="20" rx="2"/>
  </g>
  <text x="350" y="248" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">one block of typed memory</text>

  <rect x="110" y="300" width="480" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(130, 340)">
    <rect x="0" y="0" width="55" height="100" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="55" y="0" width="55" height="100" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="110" y="0" width="55" height="100" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="165" y="0" width="55" height="100" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="220" y="0" width="55" height="100" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="275" y="0" width="55" height="100" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="330" y="0" width="55" height="100" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="385" y="0" width="55" height="100" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="0" y1="20" x2="440" y2="20" stroke="#207448" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="0" y1="80" x2="440" y2="80" stroke="#207448" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  </g>

  <line x1="940" y1="410" x2="638" y2="410" stroke="#207448" stroke-width="4"/>
  <polygon points="620,410 638,401 638,419" fill="#207448"/>
  
  <rect x="655" y="348" width="250" height="48" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="780" y="381" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">how to read it</text>

  <rect x="940" y="140" width="580" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1202, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="4" width="56" height="48" rx="6"/>
    <line x1="0" y1="18" x2="56" y2="18"/>
    <line x1="20" y1="18" x2="20" y2="52"/>
    <line x1="26" y1="28" x2="48" y2="28"/>
    <line x1="26" y1="38" x2="44" y2="38"/>
    <circle cx="9" cy="11" r="2.5" fill="#207448"/>
    <circle cx="17" cy="11" r="2.5" fill="#207448"/>
  </g>
  <text x="1230" y="248" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">metadata</text>

  <rect x="970" y="275" width="520" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1230" y="322" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">dtype (bytes per element)</text>

  <rect x="970" y="365" width="520" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1230" y="412" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">shape (elements per axis)</text>

  <rect x="970" y="455" width="520" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1230" y="502" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">strides (bytes to step per axis)</text>

  <rect x="80" y="610" width="1440" height="110" rx="16" fill="#fff7f0" stroke="#db8129" stroke-width="3.5"/>
  <g transform="translate(115, 637)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <line x1="28" y1="16" x2="28" y2="28"/>
    <circle cx="28" cy="38" r="2.5" fill="#db8129"/>
  </g>
  <text x="185" y="674" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">transpose changes only the metadata, so it is nearly free</text>

  <rect x="80" y="750" width="1440" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g transform="translate(115, 777)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="16" width="28" height="34" rx="4"/>
    <path d="M 20 16 V 8 A 4 4 0 0 1 24 4 H 44 A 4 4 0 0 1 48 8 V 32 A 4 4 0 0 1 44 36 H 36"/>
    <line x1="16" y1="26" x2="28" y2="26"/>
    <line x1="16" y1="34" x2="28" y2="34"/>
  </g>
  <text x="185" y="814" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">changing the dtype forces a copy</text>
</svg>