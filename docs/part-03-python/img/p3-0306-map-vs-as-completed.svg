<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>pool.map versus as_completed with 20 hosts and a slow second host</title>
  <desc>Visual comparison illustrating blocking in pool.map versus immediate yielding and per-task error tracking in as_completed.</desc>

  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">pool.map versus as_completed with 20 hosts and a slow second host</text>

  
  <g transform="translate(50, 110)">
    <rect width="1500" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(30, 25)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="100" y="60" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">pool.map(fn, hosts, timeout=..)</text>

    
    
    <rect x="100" y="90" width="120" height="36" rx="6" fill="#207448" opacity="0.85"/>
    <text x="160" y="116" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">host 1</text>

    
    <rect x="230" y="90" width="600" height="36" rx="6" fill="#75857e" stroke="#303a36" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="530" y="116" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">host 2 (slow)</text>

    
    <rect x="840" y="90" width="610" height="36" rx="6" fill="#a4b5aa"/>
    <text x="1145" y="116" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">hosts 3..20 (finished early, held in buffer)</text>

    
    <rect x="30" y="150" width="1440" height="175" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="50" y="195" font-family="sans-serif" font-size="24" fill="#303a36">results come out in input order; hosts 3 to 20 sit finished but unreported until host 2 returns,</text>
    <text x="50" y="235" font-family="sans-serif" font-size="24" fill="#303a36">so a progress display appears to freeze even though workers are busy; raises the first exception</text>
    <text x="50" y="275" font-family="sans-serif" font-size="24" fill="#303a36">when that item is reached.</text>
  </g>

  
  <g transform="translate(50, 490)">
    <rect width="1500" height="420" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(30, 25)">
      <polygon points="32,4 12,32 28,32 20,52 44,22 28,22" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    </g>

    
    <text x="100" y="60" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">as_completed over futs = {pool.submit(check, h): h for h in hosts}</text>

    
    <rect x="1030" y="28" width="440" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1250" y="60" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">as_completed(futs, timeout=120)</text>

    
    <g transform="translate(30, 95)">
      
      <rect x="0" y="0" width="140" height="36" rx="6" fill="#207448"/>
      <text x="70" y="26" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">host 1</text>

      <rect x="150" y="0" width="700" height="36" rx="6" fill="#207448"/>
      <text x="500" y="26" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">hosts 3..20 yielded immediately as finished</text>

      <rect x="860" y="0" width="580" height="36" rx="6" fill="#db8129"/>
      <text x="1150" y="26" font-family="sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">host 2 yields last</text>
    </g>

    
    <rect x="30" y="155" width="1440" height="75" rx="10" fill="#e8f1ea" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="50" y="202" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">each future is yielded as soon as it finishes;</tspan>
      <tspan dx="15">one slow host does not hold up the report</tspan>
    </text>

    
    <rect x="30" y="245" width="1440" height="150" rx="10" fill="#fdf8f3" stroke="#db8129" stroke-width="1.5"/>
    <text x="50" y="290" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#db8129">h = futs[fut]</tspan>
      <tspan dx="15">ties each exception to the host that caused it;</tspan>
    </text>
    <text x="50" y="330" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" fill="#303a36">fut.result() re-raises the worker's exception here</tspan>
      <tspan dx="15">inside try/except Exception that records errors[h] = repr(exc);</tspan>
    </text>
    <text x="50" y="370" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">Output example</tspan>
      <tspan dx="10" font-family="monospace" font-weight="bold" fill="#207448">50 workers, thread_name_prefix=probe, print(len(results), ok; len(errors), failed)</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 940)">
    <rect width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(30, 20)">
      <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M28,6 L28,12 M28,44 L28,50 M6,28 L12,28 M44,28 L50,28 M12,12 L16,16 M40,40 L44,44 M12,44 L16,40 M40,12 L44,16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="100" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Future methods strip</text>
    
    <rect x="30" y="75" width="1440" height="58" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="50" y="112" font-family="monospace" font-size="24" fill="#303a36">result(timeout), exception(), add_done_callback(), done(), cancel() works only if the task has not started</text>
  </g>

  
  <g transform="translate(50, 1115)">
    <rect width="1500" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(30, 22)">
      <path d="M28,8 L48,16 L48,32 C48,44 28,52 28,52 C28,52 8,44 8,32 L8,16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <text x="100" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Shutdown strip</text>

    
    <rect x="30" y="75" width="1440" height="120" rx="8" fill="#e8f1ea" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="50" y="110" font-family="sans-serif" font-size="24" fill="#303a36">leaving the with block waits for pending work (shutdown(wait=True)); on exception shutdown(wait=False, cancel_futures=True)</text>
    <text x="50" y="145" font-family="sans-serif" font-size="24" fill="#303a36">from 3.9 drops queued tasks; executors do not interrupt running tasks when a timeout expires, so set timeouts on the</text>
    <text x="50" y="180" font-family="sans-serif" font-size="24" fill="#303a36">I/O inside each task</text>
  </g>

  
  <g transform="translate(50, 1355)">
    <rect width="1500" height="75" rx="12" fill="#207448"/>
    <text x="750" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Order of input is not order of completion</text>
  </g>
</svg>