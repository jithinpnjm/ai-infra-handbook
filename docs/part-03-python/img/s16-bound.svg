<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Bound methods carry the instance</title>
  <desc>Visual comparison showing bob.give_raise(0.1) creates a bound method containing the instance bob and function give_raise, equivalent to Person.give_raise(bob, 0.1).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="80" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Bound methods carry the instance</text>

  
  <g id="left-node">
    <rect x="80" y="170" width="360" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(232, 220)">
      <rect x="0" y="0" width="56" height="46" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="4" />
      <polyline points="12,25 20,31 12,37" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="37" x2="42" y2="37" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <rect x="105" y="365" width="310" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="260" y="405" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">bob.give_raise(0.1)</text>
  </g>

  
  <line x1="440" y1="395" x2="498" y2="395" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="bound-method-box">
    <rect x="500" y="170" width="490" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(540, 205)">
      <rect x="4" y="12" width="28" height="32" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="24" y="12" width="28" height="32" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="615" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">bound method</text>

    
    <rect x="530" y="295" width="430" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(555, 332)">
      <circle cx="23" cy="14" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 5 44 C 5 32, 41 32, 41 44" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="625" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">the instance bob</text>

    
    <rect x="530" y="445" width="430" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(555, 482)">
      <circle cx="23" cy="23" r="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 23 5 L 23 11 M 23 35 L 23 41 M 5 23 L 11 23 M 35 23 L 41 23 M 10 10 L 15 15 M 31 31 L 36 36 M 10 36 L 15 31 M 31 15 L 36 10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="625" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">the function give_raise</text>
  </g>

  
  <g id="right-node">
    <rect x="1040" y="170" width="480" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1075, 205)">
      <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" />
      <circle cx="14" cy="13" r="2.5" fill="#207448" />
      <circle cx="23" cy="13" r="2.5" fill="#207448" />
    </g>
    
    <text x="1150" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">the explicit form</text>

    
    <rect x="1065" y="325" width="430" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1280" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Person.give_raise(bob, 0.1)</text>

    
    <rect x="1170" y="455" width="220" height="58" rx="29" fill="#207448" />
    <text x="1280" y="493" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">same result</text>
  </g>

  
  <g id="orange-note">
    <rect x="80" y="670" width="1440" height="150" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(120, 717)">
      <circle cx="20" cy="28" r="14" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="34" y1="28" x2="52" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="28" x2="44" y2="36" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="52" y1="28" x2="52" y2="36" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="205" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">self is the instance passed as the first argument</text>
  </g>
</svg>