<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>Abstract base classes</title>
  <desc>Visual flowchart of Python interface and type checking models from Fluent Python Chapter 13</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Abstract base classes</text>

  
  
  <path d="M 405 225 L 405 321" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1195 225 L 1195 321" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <path d="M 780 225 L 780 630 L 405 630 L 405 671" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 820 225 L 820 630 L 1195 630 L 1195 671" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <g id="node-typing">
    <rect x="250" y="100" width="1100" height="125" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="285" y="135" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="285" y1="153" x2="341" y2="153" stroke="#207448" stroke-width="3" />
    <path d="M 300 171 L 308 177 L 300 183 M 317 183 L 327 183" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="370" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Python Interface &amp; Type Checking Models</text>
    <text x="370" y="194" font-family="sans-serif" font-size="25" fill="#303a36">(Fluent Python Chapter 13)</text>
  </g>

  
  <g id="node-duck">
    <rect x="70" y="325" width="670" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 135 375 C 130 363 118 360 110 364 C 103 368 102 374 104 380 C 98 382 92 384 88 384 C 94 388 101 389 106 388 C 108 396 114 402 122 405 C 116 410 108 412 102 413 C 114 418 136 418 145 407 C 151 398 147 385 135 375 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <circle cx="118" cy="372" r="2.5" fill="#207448" />
    
    <text x="180" y="375" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1. Duck Typing</text>
    <text x="180" y="412" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(Runtime)</text>
    
    <line x1="105" y1="440" x2="705" y2="440" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="105" y="495" font-family="sans-serif" font-size="25" fill="#303a36">Call methods directly (len, __getitem__)</text>
  </g>

  
  <g id="node-goose">
    <rect x="860" y="325" width="670" height="250" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <path d="M 915 415 C 925 415 940 412 947 400 C 945 385 935 380 930 375 C 928 368 932 360 926 356 C 920 352 912 355 908 360 C 902 362 895 363 892 363 C 897 367 904 368 908 368 C 910 378 916 392 910 405 C 905 408 900 410 895 412 C 901 414 908 415 915 415 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <circle cx="920" cy="360" r="2.5" fill="#db8129" />
    
    <text x="970" y="375" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">2. Goose Typing</text>
    <text x="970" y="412" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(Runtime ABCs)</text>
    
    <line x1="895" y1="440" x2="1495" y2="440" stroke="#db8129" stroke-opacity="0.3" stroke-width="1.5" />
    
    <text x="895" y="482" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">abc.ABC, @abstractmethod,</text>
    <text x="895" y="522" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">isinstance(x, Sequence)</text>
  </g>

  
  <g id="node-nominal">
    <rect x="70" y="675" width="670" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="105" y="705" width="46" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="117" y1="723" x2="139" y2="723" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="117" y1="735" x2="139" y2="735" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 116 748 L 123 754 L 136 743" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="180" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3. Static Nominal Typing</text>
    <text x="180" y="762" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(mypy/pyright)</text>
    
    <line x1="105" y1="790" x2="705" y2="790" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="105" y="845" font-family="sans-serif" font-size="25" fill="#303a36">Explicit class/ABC inheritance &amp; annotations</text>
  </g>

  
  <g id="node-staticduck">
    <rect x="860" y="675" width="670" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="895" y="705" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 910 733 L 923 733 C 923 727 927 723 932 723 C 937 723 941 727 941 733 L 951 733" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="918" cy="746" r="3.5" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="934" cy="746" r="3.5" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="970" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4. Static Duck Typing</text>
    <text x="970" y="762" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(typing.Protocol)</text>
    
    <line x1="895" y1="790" x2="1495" y2="790" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="895" y="845" font-family="sans-serif" font-size="25" fill="#303a36">Structural conformance without inheritance</text>
  </g>
</svg>