<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Golden files, contracts and integration tests: what each pins down</title>
  <desc>Comparison table of golden or snapshot testing, contract testing, and integration testing: use cases, methods, and cautions.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800">Golden files, contracts and integration tests:</tspan>
    <tspan x="800" dy="52">what each pins down</tspan>
  </text>

  
  <g>
    
    <rect x="25" y="124" width="234" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="142" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Test kind</text>

    
    <rect x="271" y="124" width="330" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="436" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Use for</text>

    
    <rect x="613" y="124" width="600" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="913" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">How</text>

    
    <rect x="1225" y="124" width="350" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1400" y="158" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Caution</text>
  </g>

  
  <g>
    
    <rect x="25" y="184" width="234" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(114, 236)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="14" width="52" height="38" rx="6"/>
      <circle cx="28" cy="33" r="12"/>
      <circle cx="28" cy="33" r="4" fill="#207448"/>
      <path d="M16 14 L20 6 L36 6 L40 14"/>
    </g>
    <text x="142" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="142">Golden or</tspan>
      <tspan x="142" dy="36">snapshot</tspan>
    </text>

    
    <rect x="271" y="184" width="330" height="260" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="291" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="291">config generators,</tspan>
      <tspan x="291" dy="32">Jinja templates,</tspan>
      <tspan x="291" dy="32">tabular output,</tspan>
      <tspan x="291" dy="32">Kubernetes</tspan>
      <tspan x="291" dy="32">manifests: text with</tspan>
      <tspan x="291" dy="32">no single input to</tspan>
      <tspan x="291" dy="32">argue about</tspan>
    </text>

    
    <rect x="613" y="184" width="600" height="260" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="631" y="248" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="631">compare output with a reviewed</tspan>
      <tspan x="631" dy="32">expected file using syrupy,</tspan>
      <tspan x="631" dy="32">pytest-regressions or your own</tspan>
      <tspan x="631" dy="32">helper; update with</tspan>
      <tspan x="631" dy="32"><tspan font-family="monospace">--snapshot-update</tspan> as a deliberate</tspan>
      <tspan x="631" dy="32">reviewed act</tspan>
    </text>

    
    <rect x="1225" y="184" width="350" height="260" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="1242" y="278" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1242">keep snapshots small,</tspan>
      <tspan x="1242" dy="32">large ones invite</tspan>
      <tspan x="1242" dy="32">approving diffs</tspan>
      <tspan x="1242" dy="32">without reading</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="25" y="456" width="234" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(114, 552)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M10 4 L34 4 L46 16 L46 52 L10 52 Z"/>
      <path d="M34 4 L34 16 L46 16"/>
      <line x1="18" y1="24" x2="38" y2="24" stroke-width="3"/>
      <line x1="18" y1="32" x2="38" y2="32" stroke-width="3"/>
      <line x1="18" y1="40" x2="28" y2="40" stroke-width="3"/>
    </g>
    <text x="142" y="640" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Contract</text>

    
    <rect x="271" y="456" width="330" height="320" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="291" y="584" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="291">services and clients</tspan>
      <tspan x="291" dy="32">drifting apart</tspan>
      <tspan x="291" dy="32">quietly</tspan>
    </text>

    
    <rect x="613" y="456" width="600" height="320" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="631" y="504" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="631">validate payloads against the provider</tspan>
      <tspan x="631" dy="32">OpenAPI or JSON Schema with</tspan>
      <tspan x="631" dy="32">schemathesis, jsonschema,</tspan>
      <tspan x="631" dy="32">openapi-core; pact for consumer-driven</tspan>
      <tspan x="631" dy="32">contracts; refresh recorded real</tspan>
      <tspan x="631" dy="32">responses on a schedule; share</tspan>
      <tspan x="631" dy="32">pydantic models; for Redfish or vendor</tspan>
      <tspan x="631" dy="32">APIs keep sanitised real payloads from</tspan>
      <tspan x="631" dy="32">each platform as fixtures</tspan>
    </text>

    
    <rect x="1225" y="456" width="350" height="320" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="1242" y="584" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1242">vendor differences</tspan>
      <tspan x="1242" dy="32">from 3.8 become</tspan>
      <tspan x="1242" dy="32">regression tests</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="25" y="788" width="234" height="280" rx="10" fill="#fdf8f3" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(114, 872)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="6" width="20" height="18" rx="4"/>
      <rect x="34" y="6" width="20" height="18" rx="4"/>
      <rect x="18" y="32" width="20" height="18" rx="4"/>
      <line x1="22" y1="15" x2="34" y2="15"/>
      <line x1="12" y1="24" x2="18" y2="34"/>
      <line x1="44" y1="24" x2="38" y2="34"/>
    </g>
    <text x="142" y="960" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Integration</text>

    
    <rect x="271" y="788" width="330" height="280" rx="10" fill="#ffffff" stroke="#e8b888" stroke-width="1.5"/>
    <text x="291" y="880" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="291">real PostgreSQL,</tspan>
      <tspan x="291" dy="32">Redis, Prometheus,</tspan>
      <tspan x="291" dy="32">Kafka or an S3</tspan>
      <tspan x="291" dy="32">stand-in</tspan>
    </text>

    
    <rect x="613" y="788" width="600" height="280" rx="10" fill="#ffffff" stroke="#e8b888" stroke-width="1.5"/>
    <text x="631" y="872" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="631">testcontainers-python or</tspan>
      <tspan x="631" dy="32">docker-compose; kind or k3d clusters</tspan>
      <tspan x="631" dy="32">created and deleted by a pytest</tspan>
      <tspan x="631" dy="32">fixture; envtest-style API servers;</tspan>
      <tspan x="631" dy="32">mark integration and run in CI</tspan>
    </text>

    
    <rect x="1225" y="788" width="350" height="280" rx="10" fill="#ffffff" stroke="#e8b888" stroke-width="1.5"/>
    <text x="1242" y="832" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1242">keep each test</tspan>
      <tspan x="1242" dy="31">independent with</tspan>
      <tspan x="1242" dy="31">unique namespaces or</tspan>
      <tspan x="1242" dy="31">names and cleanup in</tspan>
      <tspan x="1242" dy="31">teardown; poll with</tspan>
      <tspan x="1242" dy="31">tenacity with generous</tspan>
      <tspan x="1242" dy="31">but bounded waits,</tspan>
      <tspan x="1242" dy="31">never <tspan font-family="monospace">sleep(30)</tspan></tspan>
    </text>
  </g>

  
  <g>
    <rect x="25" y="1084" width="1550" height="64" rx="10" fill="#207448"/>
    <text x="800" y="1125" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each of these checks something an example unit test cannot</text>
  </g>
</svg>