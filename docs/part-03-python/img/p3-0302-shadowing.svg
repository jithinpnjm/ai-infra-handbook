<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Shadowing: your json.py wins because the script's folder is first on sys.path</title>
  <desc>Visual infographic explaining Python module shadowing, sys.path precedence order, common symptoms, and practical fixes.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#207448">Shadowing: your json.py wins because the</text>
  <text x="50" y="110" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#207448">script's folder is first on sys.path</text>

  

  
  <rect x="50" y="145" width="200" height="75" rx="8" fill="#207448"/>
  <text x="150" y="192" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">import json</text>

  
  <rect x="265" y="148" width="515" height="70" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="522" y="177" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">first match wins; the real json</text>
  <text x="522" y="205" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">is never reached</text>

  
  <path d="M 150 220 V 238 H 522 V 254" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="50" y="260" width="730" height="185" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <rect x="70" y="275" width="280" height="38" rx="6" fill="#db8129"/>
  <text x="210" y="301" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">your file is found first</text>
  <text x="70" y="345" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">home directory of the script (or empty string for</text>
  <text x="70" y="380" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">the REPL, -c and -m): contains json.py,</text>
  <text x="70" y="415" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">random.py, requests.py or test.py</text>

  
  <rect x="50" y="460" width="730" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="75" y="502" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#207448">PYTHONPATH directories</text>

  
  <rect x="50" y="535" width="730" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="75" y="570" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">standard-library directories,</text>
  <text x="75" y="602" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">including python312.zip</text>

  
  <rect x="50" y="630" width="730" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="75" y="672" font-family="'Courier New', Courier, monospace" font-size="25" font-weight="bold" fill="#207448">site-packages</text>

  
  <rect x="50" y="705" width="730" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="75" y="747" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#303a36">directories listed in .pth files</text>

  
  <rect x="50" y="790" width="730" height="180" rx="10" fill="#fdf5ec" stroke="#db8129" stroke-width="2"/>
  
  <path d="M 85 812 L 105 804 L 125 812 V 828 C 125 842 105 852 105 852 C 105 852 85 842 85 828 Z" fill="none" stroke="#db8129" stroke-width="3"/>
  <text x="105" y="836" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">!</text>
  <text x="140" y="836" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#db8129">Warning</text>
  <text x="75" y="888" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">the same risk applies to untrusted download folders,</text>
  <text x="75" y="928" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">because Python runs whatever it imports</text>

  
  <rect x="50" y="990" width="730" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="1028" r="18" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="105" y="1036" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">i</text>
  <text x="140" y="1036" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#207448">Side note</text>
  <text x="75" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">path entries come from the environment, so a script</text>
  <text x="75" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a36">that imports a library in your terminal can fail</text>
  <text x="75" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#207448">under cron: only where Python looked changed</text>

  

  
  <rect x="820" y="145" width="730" height="350" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="870" cy="188" r="18" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 870 178 V 190 M 870 196 V 198" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="905" y="198" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#207448">Symptoms</text>

  
  <rect x="845" y="220" width="680" height="110" rx="8" fill="#f5f8f5" stroke="#c8d8cb"/>
  <text x="865" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#db8129">baffling AttributeError:</text>
  <text x="865" y="298" font-family="'Courier New', Courier, monospace" font-size="24" fill="#303a36">module x has no attribute ...</text>

  
  <rect x="845" y="345" width="680" height="130" rx="8" fill="#f5f8f5" stroke="#c8d8cb"/>
  <text x="865" y="388" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">circular import errors because the traceback</text>
  <text x="865" y="428" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#db8129">names a module you never wrote</text>

  
  <rect x="820" y="515" width="730" height="745" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="870" cy="558" r="18" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 860 558 L 867 565 L 880 550" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="905" y="568" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#207448">Fixes</text>

  
  <rect x="845" y="595" width="680" height="75" rx="8" fill="#e8f1ea"/>
  <text x="865" y="642" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#207448">name your files carefully</text>

  
  <rect x="845" y="685" width="680" height="105" rx="8" fill="#e8f1ea"/>
  <text x="865" y="728" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">never run Python from a folder</text>
  <text x="865" y="764" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">containing such files</text>

  
  <rect x="845" y="805" width="680" height="75" rx="8" fill="#e8f1ea"/>
  <text x="865" y="852" font-family="'Courier New', Courier, monospace" font-size="25" font-weight="bold" fill="#207448">python -I isolated mode</text>

  
  <rect x="845" y="895" width="680" height="165" rx="8" fill="#e8f1ea"/>
  <text x="865" y="938" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#303a36">check python -c</text>
  <text x="885" y="978" font-family="'Courier New', Courier, monospace" font-size="24" fill="#207448">"import json, sys;</text>
  <text x="885" y="1018" font-family="'Courier New', Courier, monospace" font-size="24" fill="#207448"> print(json.__file__)"</text>

  
  <rect x="845" y="1075" width="680" height="75" rx="8" fill="#e8f1ea"/>
  <text x="865" y="1122" font-family="'Courier New', Courier, monospace" font-size="25" font-weight="bold" fill="#207448">remove __pycache__</text>

  
  <rect x="50" y="1285" width="1500" height="65" rx="8" fill="#207448"/>
  <text x="800" y="1327" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The environment quietly decides what your code imports</text>
</svg>