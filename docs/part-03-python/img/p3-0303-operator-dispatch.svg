<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>How x + y finds an implementation: __add__, NotImplemented and the reflected method</title>
  <desc>Visual flowchart and design rules explaining Python operator dispatch, reflected methods, and NotImplemented fallback mechanisms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <text x="50" y="60" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">How x + y finds an implementation: __add__, NotImplemented and the reflected method</text>

  

  
  <rect x="50" y="95" width="980" height="770" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(80, 115)">
    
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#207448"/>
    <text x="110" y="32" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">v + other</text>
    <path d="M 235 24 L 920 24" stroke="#e8f1ea" stroke-width="4"/>
  </g>

  
  <g transform="translate(80, 185)">
    
    <circle cx="28" cy="40" r="24" fill="#207448"/>
    <text x="28" y="49" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <rect x="70" y="0" width="850" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="95" y="48" font-family="monospace" font-size="26" fill="#303a36">Python calls type(v).__add__(v, other)</text>
  </g>

  
  <line x1="575" y1="265" x2="575" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(435, 310)">
    <polygon points="140,0 280,45 140,90 0,45" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="140" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">is other a Vector?</text>
  </g>

  
  <path d="M 715 355 L 755 355 L 755 425" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="720" y="335" width="55" height="30" rx="6" fill="#207448"/>
  <text x="747" y="357" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">yes</text>

  
  <rect x="520" y="430" width="480" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="540" y="468" font-family="monospace" font-size="24" fill="#303a36">returns Vector(self.x + other.x,</text>
  <text x="690" y="500" font-family="monospace" font-size="24" fill="#303a36">self.y + other.y)</text>

  
  <path d="M 435 355 L 305 355 L 305 425" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="330" y="335" width="50" height="30" rx="6" fill="#db8129"/>
  <text x="355" y="357" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">no</text>

  
  <rect x="80" y="430" width="410" height="90" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <text x="96" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">returns NotImplemented,</text>
  <text x="96" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">it does not raise</text>

  
  <line x1="305" y1="520" x2="305" y2="585" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(80, 590)">
    
    <circle cx="28" cy="48" r="24" fill="#207448"/>
    <text x="28" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <rect x="70" y="0" width="850" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="95" y="40" font-family="sans-serif" font-size="24" fill="#303a36">Python tries the reflected method on the other operand:</text>
    <text x="95" y="74" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">__radd__</text>
  </g>

  
  <line x1="495" y1="685" x2="495" y2="725" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(80, 730)">
    
    <circle cx="28" cy="45" r="24" fill="#207448"/>
    <text x="28" y="54" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <rect x="70" y="0" width="850" height="90" rx="10" fill="#fdf0ed" stroke="#b83a28" stroke-width="2"/>
    <text x="95" y="54" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">if both return NotImplemented, TypeError</text>
  </g>

  
  <g transform="translate(50, 880)">
    <rect width="980" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 25 35 A 15 15 0 1 1 45 45" fill="none" stroke="#207448" stroke-width="3"/>
    <polygon points="45,45 42,35 52,38" fill="#207448"/>
    <text x="65" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">__iadd__ for +=, falling back to __add__</text>
  </g>

  
  <g transform="translate(50, 965)">
    <rect width="980" height="185" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="25" y="20" width="140" height="44" rx="8" fill="#207448"/>
    <text x="95" y="51" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3 * v</text>
    
    <text x="25" y="100" font-family="sans-serif" font-size="24" fill="#303a36">int.__mul__ does not know Vector and returns NotImplemented; Python</text>
    <text x="25" y="134" font-family="sans-serif" font-size="24" fill="#303a36">tries v.__rmul__(3); __rmul__ = __mul__ so the result</text>
    <text x="25" y="168" font-family="sans-serif" font-size="24" fill="#303a36">is Vector(self.x * k, self.y * k)</text>
  </g>

  

  <g transform="translate(1055, 95)">
    <rect width="495" height="1055" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect width="495" height="70" rx="16" fill="#e8f1ea"/>
    
    <g transform="translate(25, 12)">
      <path d="M 20 5 L 40 12 L 40 28 C 40 40 20 48 20 48 C 20 48 0 40 0 28 L 0 12 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 12 25 L 18 31 L 28 19" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="80" y="47" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Four design rules</text>

    
    <g transform="translate(25, 95)">
      <circle cx="20" cy="24" r="16" fill="#207448"/>
      <text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="50" y="28" font-family="sans-serif" font-size="24" fill="#303a36">return NotImplemented instead</text>
      <text x="50" y="60" font-family="sans-serif" font-size="24" fill="#303a36">of raising for unsupported</text>
      <text x="50" y="92" font-family="sans-serif" font-size="24" fill="#303a36">operand types</text>
    </g>
    <line x1="25" y1="210" x2="470" y2="210" stroke="#e8f1ea" stroke-width="2"/>

    
    <g transform="translate(25, 230)">
      <circle cx="20" cy="24" r="16" fill="#207448"/>
      <text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="50" y="28" font-family="sans-serif" font-size="24" fill="#303a36">keep __eq__ and __hash__</text>
      <text x="50" y="60" font-family="sans-serif" font-size="24" fill="#303a36">consistent: equal objects must</text>
      <text x="50" y="92" font-family="sans-serif" font-size="24" fill="#303a36">hash equal, mutable objects</text>
      <text x="50" y="124" font-family="sans-serif" font-size="24" fill="#303a36">should not be hashable;</text>
      <text x="50" y="156" font-family="sans-serif" font-size="24" fill="#303a36">defining __eq__ without</text>
      <text x="50" y="188" font-family="sans-serif" font-size="24" fill="#303a36">__hash__ makes instances</text>
      <text x="50" y="220" font-family="sans-serif" font-size="24" fill="#303a36">unhashable</text>
    </g>
    <line x1="25" y1="480" x2="470" y2="480" stroke="#e8f1ea" stroke-width="2"/>

    
    <g transform="translate(25, 500)">
      <circle cx="20" cy="24" r="16" fill="#207448"/>
      <text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="50" y="28" font-family="sans-serif" font-size="24" fill="#303a36">make __repr__ always useful</text>
      <text x="50" y="60" font-family="sans-serif" font-size="24" fill="#303a36">by including the fields that</text>
      <text x="50" y="92" font-family="sans-serif" font-size="24" fill="#303a36">identify the object</text>
    </g>
    <line x1="25" y1="620" x2="470" y2="620" stroke="#e8f1ea" stroke-width="2"/>

    
    <g transform="translate(25, 640)">
      <circle cx="20" cy="24" r="16" fill="#207448"/>
      <text x="20" y="32" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="50" y="28" font-family="sans-serif" font-size="24" fill="#303a36">prefer composition and</text>
      <text x="50" y="60" font-family="sans-serif" font-size="24" fill="#303a36">abstract bases such as</text>
      <text x="50" y="92" font-family="sans-serif" font-size="24" fill="#303a36">collections.abc.Sequence,</text>
      <text x="50" y="124" font-family="sans-serif" font-size="24" fill="#303a36">Mapping and</text>
      <text x="50" y="156" font-family="sans-serif" font-size="24" fill="#303a36">MutableMapping</text>
    </g>
  </g>

  
  <g transform="translate(50, 1170)">
    <rect width="1500" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(25, 40)">
      <circle cx="24" cy="24" r="14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 24 4 L 24 10 M 24 38 L 24 44 M 4 24 L 10 24 M 38 24 L 44 24 M 10 10 L 14 14 M 34 34 L 38 38 M 10 38 L 14 34 M 34 14 L 38 10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="90" y="45" font-family="sans-serif" font-size="24" fill="#303a36">repr is unambiguous for developers and logs, str is for humans;</text>
    <text x="90" y="78" font-family="sans-serif" font-size="24" fill="#303a36">__slots__ = (x, y) gives smaller, faster objects with fixed attributes;</text>
    <text x="90" y="111" font-family="sans-serif" font-size="24" fill="#303a36">__bool__ is bool(abs(self)); __iter__ lets x, y = v unpack</text>
  </g>

  
  <g transform="translate(50, 1325)">
    <rect width="1500" height="65" rx="10" fill="#207448"/>
    <text x="750" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Return NotImplemented so Python can try the other operand before it gives up</text>
  </g>
</svg>