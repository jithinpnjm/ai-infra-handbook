<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Syntax calls special methods</title>
  <desc>A two-column mapping showing how Python syntax translates directly into special method calls.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Syntax calls special methods</text>

  
  <g id="headers">
    <rect x="100" y="125" width="580" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="390" y="161" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">what you write</text>

    <rect x="900" y="125" width="600" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1200" y="161" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">the special method Python calls</text>
  </g>

  
  <g id="row-1">
    
    <rect x="100" y="210" width="580" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(124, 230)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="14" width="48" height="28" rx="4" />
      <line x1="16" y1="14" x2="16" y2="26" />
      <line x1="28" y1="14" x2="28" y2="22" />
      <line x1="40" y1="14" x2="40" y2="26" />
    </g>
    <text x="210" y="269" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">len(x)</text>

    
    <line x1="680" y1="258" x2="896" y2="258" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="900" y="210" width="600" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(924, 230)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="14" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 16 16 M 40 40 L 45 45 M 11 45 L 16 40 M 40 16 L 45 11" />
    </g>
    <text x="1010" y="269" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x.__len__()</text>
  </g>

  
  <g id="row-2">
    
    <rect x="100" y="330" width="580" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(124, 350)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 18 10 L 10 10 L 10 46 L 18 46" />
      <path d="M 38 10 L 46 10 L 46 46 L 38 46" />
      <line x1="28" y1="20" x2="28" y2="36" />
    </g>
    <text x="210" y="389" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x[i]</text>

    
    <line x1="680" y1="378" x2="896" y2="378" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="900" y="330" width="600" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(924, 350)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="12" width="40" height="32" rx="4" />
      <line x1="8" y1="28" x2="48" y2="28" />
      <circle cx="28" cy="20" r="3" fill="#207448" />
    </g>
    <text x="1010" y="389" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x.__getitem__(i)</text>
  </g>

  
  <g id="row-3">
    
    <rect x="100" y="450" width="580" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(124, 470)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="20" />
      <line x1="28" y1="18" x2="28" y2="38" />
      <line x1="18" y1="28" x2="38" y2="28" />
    </g>
    <text x="210" y="509" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x + y</text>

    
    <line x1="680" y1="498" x2="896" y2="498" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="900" y="450" width="600" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(924, 470)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="40" height="40" rx="8" />
      <line x1="28" y1="18" x2="28" y2="38" />
      <line x1="18" y1="28" x2="38" y2="28" />
    </g>
    <text x="1010" y="509" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x.__add__(y)</text>
  </g>

  
  <g id="row-4">
    
    <rect x="100" y="570" width="580" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(124, 590)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 24 C 42 16 35 10 26 10 C 16 10 8 18 8 28 C 8 38 16 46 26 46 C 35 46 42 41 45 34" />
      <polyline points="36 24 46 24 46 14" />
    </g>
    <text x="210" y="629" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">for item in x</text>

    
    <line x1="680" y1="618" x2="896" y2="618" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="900" y="570" width="600" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(924, 590)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="16" cy="28" r="6" />
      <circle cx="28" cy="28" r="6" />
      <circle cx="40" cy="28" r="6" />
      <path d="M 12 16 C 18 8 38 8 44 16" />
      <polyline points="38 16 44 16 44 10" />
    </g>
    <text x="1010" y="629" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">x.__iter__()</text>
  </g>

  
  <g id="row-5">
    
    <rect x="100" y="690" width="580" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(124, 710)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 8 L 46 16 L 46 30 C 46 41 38 48 28 52 C 18 48 10 41 10 30 L 10 16 Z" />
    </g>
    <text x="210" y="749" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">with x</text>

    
    <line x1="680" y1="738" x2="896" y2="738" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="900" y="690" width="600" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(924, 710)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 10 46 L 10 10 L 26 10 L 26 46" />
      <polyline points="18 24 24 28 18 32" />
      <path d="M 46 10 L 46 46 L 30 46 L 30 10" />
      <polyline points="38 32 32 28 38 24" />
    </g>
    <text x="1005" y="749" font-family="monospace" font-size="25px" font-weight="bold" fill="#303a36">x.__enter__() and x.__exit__()</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="100" y="825" width="1400" height="80" rx="14" fill="#207448" />
    <text x="800" y="874" text-anchor="middle" font-family="sans-serif" font-size="27px" font-weight="bold" fill="#ffffff">implement the method and your class works with the built-in syntax.</text>
  </g>
</svg>