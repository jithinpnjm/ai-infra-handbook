  </g>
  <text x="590" y="365" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">KeyboardInterrupt</text>


  
  <polygon points="410,515 480,445 700,445 770,515 700,585 480,585" fill="#e8f1ea" stroke="#db8129" stroke-width="4.5" stroke-linejoin="round" />
  
  <g transform="translate(569, 454)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
