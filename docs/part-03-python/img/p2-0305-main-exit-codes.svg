  <text x="1000" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">full traceback</text>


  
  <polygon points="860,785 910,720 1090,720 1140,785 1090,850 910,850" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  
