  <rect x="50" y="1025" width="1500" height="60" rx="12" ry="12" fill="#207448" />
  <text x="800" y="1064" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Expected errors get a message, bugs get a traceback.</text>

</svg>