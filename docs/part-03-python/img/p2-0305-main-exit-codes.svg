    <polyline points="7,22 11,26 17,19" />
    <line x1="22" y1="22" x2="33" y2="22" />
  </g>
  <text x="590" y="805" text-anchor="middle" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#303a36">Results list</text>


  

  
  <rect x="840" y="120" width="320" height="110" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(979, 131)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="42" height="28" rx="4" />
    <line x1="8" y1="8" x2="34" y2="8" />
    <line x1="8" y1="15" x2="26" y2="15" />
    <line x1="8" y1="21" x2="20" y2="21" />
  </g>
  <text x="1000" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">log.error, message only</text>


  
  <rect x="840" y="290" width="320" height="110" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(979, 301)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="21,2 40,32 2,32" />
    <line x1="21" y1="13" x2="21" y2="21" />
    <circle cx="21" cy="26" r="1" fill="#207448" />
  </g>
  <text x="1000" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">log.warning interrupted</text>


  
  <rect x="840" y="460" width="320" height="110" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(979, 471)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
