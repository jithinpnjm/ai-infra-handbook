    <path d="M 12 19 L 24 19 M 18 13 L 24 19 L 18 25" />
  </g>
  <text x="1410" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">return 130</text>


  
  <rect x="1240" y="465" width="280" height="100" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  <g transform="translate(1265, 495)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="36" height="38" rx="4" />
