  <text x="590" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(expected, user-facing)</text>


  
  <polygon points="410,345 480,275 700,275 770,345 700,415 480,415" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  
