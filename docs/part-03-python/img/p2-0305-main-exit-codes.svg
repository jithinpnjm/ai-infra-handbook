  </g>
  <text x="590" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Any other Exception (a bug)</text>


  
  <polygon points="410,785 480,715 700,715 770,785 700,855 480,855" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  
  <g transform="translate(570, 727)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="30" rx="4" />
