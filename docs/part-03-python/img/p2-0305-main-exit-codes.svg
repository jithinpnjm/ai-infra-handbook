<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>A main function maps each class of failure to one exit code</title>
  <desc>Flowchart mapping main execution and argument parsing to four distinct failure classes and their corresponding log styles and exit codes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A main function maps each class of failure to one exit code</text>

  
  
  <path d="M 190 295 L 190 365" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 330 425 L 370 425" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 370 175 L 370 785" stroke="#207448" stroke-width="3.5" fill="none" />

  
  <path d="M 370 175 L 410 175" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 370 345 L 410 345" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 370 515 L 410 515" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 370 785 L 410 785" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 770 175 L 840 175" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1160 175 L 1240 175" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 770 345 L 840 345" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1160 345 L 1240 345" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 770 515 L 840 515" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1160 515 L 1240 515" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 770 785 L 860 785" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 1140 785 L 1175 785 L 1175 715 L 1220 715" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  <text x="1182" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <path d="M 1140 785 L 1175 785 L 1175 855 L 1240 855" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
  <text x="1182" y="842" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>


  
  <rect x="60" y="205" width="260" height="90" rx="45" ry="45" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(170, 218)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="28" rx="5" />
    <path d="M 8 9 L 16 14 L 8 19" />
    <line x1="20" y1="19" x2="30" y2="19" />
  </g>
  <text x="190" y="278" text-anchor="middle" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#303a36">main(argv)</text>


  
  <rect x="50" y="365" width="280" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(169, 378)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="9" />
    <path d="M 21 4 L 21 9 M 21 33 L 21 38 M 4 21 L 9 21 M 33 21 L 38 21 M 9 9 L 13 13 M 29 29 L 33 33 M 9 33 L 13 29 M 29 13 L 33 9" />
  </g>
  <text x="190" y="458" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">parse_args and run</text>


  

  
  <polygon points="410,175 480,105 700,105 770,175 700,245 480,245" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  
