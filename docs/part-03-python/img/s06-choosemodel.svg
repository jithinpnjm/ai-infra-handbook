<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Choosing a concurrency model</title>
  <desc>A decision tree infographic guiding Python concurrency model selection based on workload characteristics: CPU-bound to processes, waiting on I/O with many connections to asyncio, and waiting on I/O with blocking libraries to threads.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Choosing a concurrency model</text>
  <text x="800" y="106" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">A decision tree.</text>

  
  <g id="start-node">
    <rect x="520" y="140" width="560" height="110" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="560" cy="216" r="7" />
      <circle cx="540" cy="174" r="6" />
      <circle cx="560" cy="174" r="6" />
      <circle cx="580" cy="174" r="6" />
      <path d="M 560 209 L 560 180" />
      <path d="M 560 198 Q 540 198 540 180" />
      <path d="M 560 198 Q 580 198 580 180" />
    </g>
    <text x="615" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">what is the work?</text>
  </g>

  
  <path d="M 640 250 L 640 330 Q 640 350 620 350 L 320 350 Q 300 350 300 370 L 300 570" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="460" y="335" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">CPU-bound</text>

  
  <path d="M 800 250 L 800 570" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="825" y="420" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="825" dy="0">waiting on I/O,</tspan>
    <tspan x="825" dy="32">many connections and</tspan>
    <tspan x="825" dy="32">async libraries</tspan>
  </text>

  
  <path d="M 960 250 L 960 330 Q 960 350 980 350 L 1280 350 Q 1300 350 1300 370 L 1300 570" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="1130" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1130" dy="0">waiting on I/O with</tspan>
    <tspan x="1130" dy="30">blocking libraries</tspan>
  </text>

  
  <g id="node-processes">
    <rect x="75" y="570" width="450" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g stroke="#207448" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="280" y="598" width="40" height="40" rx="4" stroke-width="4" />
      <rect x="291" y="609" width="18" height="18" rx="2" stroke-width="3" />
      <path d="M 288 598 L 288 591 M 300 598 L 300 591 M 312 598 L 312 591" stroke-width="3.5" />
      <path d="M 288 638 L 288 645 M 300 638 L 300 645 M 312 638 L 312 645" stroke-width="3.5" />
      <path d="M 280 606 L 273 606 M 280 618 L 273 618 M 280 630 L 273 630" stroke-width="3.5" />
      <path d="M 320 606 L 327 606 M 320 618 L 327 618 M 320 630 L 327 630" stroke-width="3.5" />
    </g>
    <text x="300" y="682" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">processes</text>
    <text x="300" y="722" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="300" dy="0">(multiprocessing,</tspan>
      <tspan x="300" dy="32">ProcessPoolExecutor)</tspan>
    </text>
  </g>

  
  <g id="node-asyncio">
    <rect x="575" y="570" width="450" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 778 618 A 22 22 0 1 1 822 618" />
      <path d="M 822 618 A 22 22 0 1 1 778 618" />
      <path d="M 814 607 L 823 618 L 832 607" />
      <path d="M 786 629 L 777 618 L 768 629" />
      <circle cx="800" cy="618" r="5" fill="#207448" />
    </g>
    <text x="800" y="715" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">asyncio</text>
  </g>

  
  <g id="node-threads">
    <rect x="1075" y="570" width="450" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g stroke="#207448" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 1284 595 Q 1276 607 1284 619 T 1284 645" stroke-width="3.5" />
      <path d="M 1300 595 Q 1308 607 1300 619 T 1300 645" stroke-width="3.5" />
      <path d="M 1316 595 Q 1308 607 1316 619 T 1316 645" stroke-width="3.5" />
      <circle cx="1284" cy="610" r="4.5" fill="#207448" />
      <circle cx="1300" cy="632" r="4.5" fill="#207448" />
      <circle cx="1316" cy="614" r="4.5" fill="#207448" />
    </g>
    <text x="1300" y="692" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">threads</text>
    <text x="1300" y="740" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(ThreadPoolExecutor)</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="75" y="840" width="1450" height="80" rx="16" fill="#207448" />
    
    <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 492 893 A 22 22 0 1 1 528 893" stroke-width="3.5" />
      <path d="M 510 888 L 521 873" stroke-width="4" />
      <circle cx="510" cy="888" r="4.5" fill="#ffffff" />
      <path d="M 495 870 L 499 874 M 510 864 L 510 870 M 525 870 L 521 874" stroke-width="3" />
    </g>
    <text x="550" y="891" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">measure before you choose.</text>
  </g>
</svg>