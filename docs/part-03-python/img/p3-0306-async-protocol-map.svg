<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Async iteration, generators and comprehensions: what runs when</title>
  <desc>Visual infographic explaining Python async iteration, context managers, async generators, comprehensions, concurrency pitfalls, and blocking I/O bridges.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Async iteration, generators and comprehensions: what runs when</text>

  
  <g id="construct-async-for">
    <rect x="50" y="115" width="1500" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="103" cy="167" r="22" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="105 30" stroke-linecap="round"/>
    <polygon points="126,160 134,142 118,148" fill="#207448"/>
    
    <text x="150" y="157" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="150" dy="0">async for over an</tspan>
      <tspan x="150" dy="34">async iterable</tspan>
    </text>
    
    <line x1="535" y1="125" x2="535" y2="210" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    
    <text x="565" y="157" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="565" dy="0">__aiter__ returns an asynchronous iterator whose async def</tspan>
      <tspan x="565" dy="36">__anext__ raises StopAsyncIteration when it runs out</tspan>
    </text>
  </g>

  
  <g id="construct-async-with">
    <rect x="50" y="235" width="1500" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 103 262 L 125 271 C 125 295 114 306 103 312 C 92 306 81 295 81 271 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 96 286 L 101 292 L 112 279" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="150" y="297" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">async with</text>
    
    <line x1="535" y1="245" x2="535" y2="330" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    
    <text x="565" y="277" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="565" dy="0">enters and exits through __aenter__ and __aexit__, or</tspan>
      <tspan x="565" dy="36">contextlib.asynccontextmanager builds the pair</tspan>
    </text>
  </g>

  
  <g id="construct-async-generator">
    <rect x="50" y="355" width="1500" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="103" cy="420" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 103 398 L 103 406 M 103 434 L 103 442 M 81 420 L 89 420 M 117 420 L 125 420 M 88 405 L 94 411 M 112 429 L 118 435 M 88 435 L 94 429 M 112 411 L 118 405" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="150" y="428" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">async generator</text>
    
    <line x1="535" y1="365" x2="535" y2="475" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    
    <text x="565" y="395" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="565" dy="0">async def with yield; example: a probe starts one coroutine</tspan>
      <tspan x="565" dy="35">per host, loops over asyncio.as_completed, awaits each</tspan>
      <tspan x="565" dy="35">finished one and yields its result</tspan>
    </text>
  </g>

  
  <g id="construct-pep-530">
    <rect x="50" y="500" width="1500" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 94 573 L 83 573 L 83 617 L 94 617" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 112 573 L 123 573 L 123 617 L 112 617" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="103" cy="595" r="3" fill="#207448"/>
    
    <text x="150" y="585" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="150" dy="0">PEP 530</tspan>
      <tspan x="150" dy="36">comprehensions</tspan>
    </text>
    
    <line x1="535" y1="510" x2="535" y2="680" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    
    <rect x="555" y="515" width="970" height="160" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
    
    <text x="580" y="552" font-family="monospace" font-size="24" fill="#303a36">[x ** 2 async for x in AsyncRange(1, 5)]</text>
    <text x="580" y="604" font-family="monospace" font-size="24" fill="#303a36">{name: found async for name, found in multi_probe(names)}</text>
    <text x="580" y="656" font-family="monospace" font-size="24" fill="#303a36">{name for name in names if (await probe(name)).found}</text>
  </g>

  
  <g id="warning-strip">
    <rect x="50" y="710" width="1500" height="115" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 103 741 L 130 790 L 76 790 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="103" y1="755" x2="103" y2="771" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="103" cy="781" r="2.5" fill="#db8129"/>
    
    <text x="160" y="756" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="160" dy="0">async for awaits each item in turn as the iterator yields it;</tspan>
      <tspan x="160" dy="38">to run a batch concurrently use await asyncio.gather(*coros) or asyncio.TaskGroup</tspan>
    </text>
  </g>

  
  <g id="blocking-bridge-strip">
    <rect x="50" y="845" width="1500" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <ellipse cx="103" cy="902" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 81 902 L 81 934 C 81 938 91 941 103 941 C 115 941 125 938 125 934 L 125 902" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 81 918 C 81 922 91 925 103 925 C 115 925 125 922 125 918" fill="none" stroke="#207448" stroke-width="4"/>
    
    <text x="160" y="893" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="160" dy="0">await asyncio.to_thread(save, data, path) for blocking file writes;</tspan>
      <tspan x="160" dy="36">writer.write(data); await writer.drain(); asyncio.create_subprocess_exec(*cmd, stdout=PIPE)</tspan>
      <tspan x="160" dy="36">then await proc.communicate() reads both streams and avoids pipe deadlocks</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="50" y="1015" width="1500" height="75" rx="10" fill="#207448"/>
    <text x="800" y="1062" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Each await is a place where the loop can switch tasks</text>
  </g>
</svg>