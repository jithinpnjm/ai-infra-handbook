<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Pick the metric type first</title>
  <desc>A table of four rows comparing Prometheus metric types Counter, Gauge, Histogram, and Summary with what each answers.</desc>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pick the metric type first</text>

  
  <g id="row-counter">
    <rect x="80" y="120" width="1440" height="180" rx="16" fill="#ffffff" stroke="#cfe0d4" stroke-width="2"/>
    <rect x="100" y="140" width="340" height="140" rx="16" fill="#e8f1ea"/>
    
    
    <circle cx="155" cy="210" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 155 224 L 155 196 M 145 206 L 155 196 L 165 206" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    
    <rect x="195" y="176" width="225" height="68" rx="34" fill="#207448"/>
    <text x="307" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Counter</text>
    
    
    <line x1="460" y1="140" x2="460" y2="280" stroke="#cfe0d4" stroke-width="2"/>
    
    
    <text x="490" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#303a36">
      <tspan x="490" dy="0">only goes up, </tspan>
      <tspan x="490" dy="45">query with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">rate()</tspan>.</tspan>
    </text>
  </g>

  
  <g id="row-gauge">
    <rect x="80" y="325" width="1440" height="180" rx="16" fill="#ffffff" stroke="#cfe0d4" stroke-width="2"/>
    <rect x="100" y="345" width="340" height="140" rx="16" fill="#e8f1ea"/>
    
    
    <path d="M 135 427 A 24 24 0 1 1 175 427" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="155" cy="419" r="3.5" fill="#207448"/>
    <line x1="155" y1="419" x2="169" y2="401" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    
    <rect x="195" y="381" width="225" height="68" rx="34" fill="#207448"/>
    <text x="307" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Gauge</text>
    
    
    <line x1="460" y1="345" x2="460" y2="485" stroke="#cfe0d4" stroke-width="2"/>
    
    
    <text x="490" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#303a36">
      <tspan x="490" dy="0">moves up and down, </tspan>
      <tspan x="490" dy="45">temperature or queue depth.</tspan>
    </text>
  </g>

  
  <g id="row-histogram">
    <rect x="80" y="530" width="1440" height="180" rx="16" fill="#ffffff" stroke="#cfe0d4" stroke-width="2"/>
    <rect x="100" y="550" width="340" height="140" rx="16" fill="#e8f1ea"/>
    
    
    <line x1="135" y1="636" x2="175" y2="636" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="141" y1="636" x2="141" y2="622" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="636" x2="150" y2="604" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="636" x2="159" y2="612" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="168" y1="636" x2="168" y2="628" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    
    <rect x="195" y="586" width="225" height="68" rx="34" fill="#207448"/>
    <text x="307" y="631" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Histogram</text>
    
    
    <line x1="460" y1="550" x2="460" y2="690" stroke="#cfe0d4" stroke-width="2"/>
    
    
    <text x="490" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#303a36">
      <tspan x="490" dy="0">bucketed observations with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">_sum</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">_count</tspan>, </tspan>
      <tspan x="490" dy="45">latency distributions, <tspan fill="#db8129" font-weight="bold">can be aggregated</tspan></tspan>
    </text>
  </g>

  
  <g id="row-summary">
    <rect x="80" y="735" width="1440" height="180" rx="16" fill="#ffffff" stroke="#cfe0d4" stroke-width="2"/>
    <rect x="100" y="755" width="340" height="140" rx="16" fill="#e8f1ea"/>
    
    
    <line x1="171" y1="789" x2="139" y2="821" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="145" cy="795" r="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="165" cy="815" r="6" fill="none" stroke="#207448" stroke-width="4"/>
    
    
    <rect x="195" y="791" width="225" height="68" rx="34" fill="#207448"/>
    <text x="307" y="836" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Summary</text>
    
    
    <line x1="460" y1="755" x2="460" y2="895" stroke="#cfe0d4" stroke-width="2"/>
    
    
    <text x="490" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#303a36">
      <tspan x="490" dy="0">quantiles computed on the client, </tspan>
      <tspan x="490" dy="45">cannot be aggregated across instances.</tspan>
    </text>
  </g>
</svg>