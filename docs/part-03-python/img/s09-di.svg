<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Inject the dependency instead of patching</title>
  <desc>Visual comparison showing dependency injection in production and test environments versus patching internals</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="92" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="bold" text-anchor="middle">Inject the dependency instead of patching</text>

  
  <g id="production-panel">
    <rect x="60" y="140" width="720" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(95, 168)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 11 L 45 15" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="175" y="206" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="bold">Production</text>

    
    <rect x="90" y="245" width="660" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(392, 268)">
      <rect x="6" y="8" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="6" y="34" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="15" cy="15" r="2" fill="#207448" />
      <circle cx="15" cy="41" r="2" fill="#207448" />
      <line x1="28" y1="22" x2="28" y2="34" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="420" y="375" fill="#303a36" font-family="sans-serif" font-size="26" text-anchor="middle">
      <tspan x="420" dy="0">function receives the real client</tspan>
      <tspan x="420" dy="40">and calls the real API</tspan>
    </text>
  </g>

  
  <g id="test-panel">
    <rect x="820" y="140" width="720" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(855, 168)">
      <path d="M 22 6 L 34 6 M 25 6 L 25 18 L 10 46 A 4 4 0 0 0 14 52 L 42 52 A 4 4 0 0 0 46 46 L 31 18 L 31 6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="17" y1="36" x2="39" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="935" y="206" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="bold">Test</text>

    
    <rect x="850" y="245" width="660" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1152, 268)">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 14 L 8 42 A 20 8 0 0 0 48 42 L 48 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 28 A 20 8 0 0 0 48 28" fill="none" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="1180" y="375" fill="#303a36" font-family="sans-serif" font-size="25" text-anchor="middle">
      <tspan x="1180" dy="0">the same function receives a fake client</tspan>
      <tspan x="1180" dy="40">that returns canned data</tspan>
    </text>
  </g>

  
  <g id="crossed-out-note">
    <rect x="60" y="550" width="1480" height="110" rx="16" fill="#e5ebe6" stroke="#8c968f" stroke-width="2" stroke-dasharray="8 6" />
    
    
    <g transform="translate(100, 577)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#7a857e" stroke-width="4" />
      <line x1="12" y1="12" x2="44" y2="44" stroke="#7a857e" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="180" y="615" fill="#303a36" font-family="sans-serif" font-size="26">patching internals couples tests to the implementation</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="700" width="1480" height="110" rx="16" fill="#207448" />
    
    
    <g transform="translate(100, 727)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#db8129" stroke-width="4" />
      <path d="M 30 30 L 48 48 M 40 40 L 46 34 M 45 45 L 51 39" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="180" y="766" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="bold">the function takes the client as an argument</text>
  </g>
</svg>