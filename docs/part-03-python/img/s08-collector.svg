<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>A custom collector reads at scrape time</title>
  <desc>Visual infographic showing how a Prometheus custom collector reads hardware directly at scrape time and returns fresh metrics without caching stale values.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A custom collector reads at scrape time</text>

  
  <line x1="280" y1="420" x2="320" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="590" y1="420" x2="630" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="905" y1="420" x2="945" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1220" y1="420" x2="1260" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="step-1">
    <rect x="60" y="160" width="220" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="170" cy="225" r="24" fill="#207448" />
    <text x="170" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(142, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="50" height="36" rx="5" />
      <path d="M 18 40 L 14 50 L 42 50 L 38 40" />
      <path d="M 10 22 L 18 22 L 23 13 L 31 31 L 37 19 L 42 22 L 46 22" />
    </g>

    
    <text x="170" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Prometheus</text>
  </g>

  
  <g id="step-2">
    <rect x="320" y="160" width="270" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="455" cy="225" r="24" fill="#207448" />
    <text x="455" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(427, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="23" />
      <polyline points="28,14 28,28 40,28" />
      <line x1="28" y1="5" x2="28" y2="9" />
      <line x1="51" y1="28" x2="47" y2="28" />
      <line x1="28" y1="51" x2="28" y2="47" />
      <line x1="5" y1="28" x2="9" y2="28" />
    </g>

    
    <text x="455" y="415" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">GET /metrics</text>
    <text x="455" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="455" dy="0">every scrape</tspan>
      <tspan x="455" dy="38">interval</tspan>
    </text>
  </g>

  
  <g id="step-3">
    <rect x="630" y="160" width="275" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="768" cy="225" r="24" fill="#207448" />
    <text x="768" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(740, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="9" />
      <path d="M 28 6 L 28 13 M 28 43 L 28 50 M 6 28 L 13 28 M 43 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
      <circle cx="28" cy="28" r="20" stroke-width="3" stroke-dasharray="8 6" />
    </g>

    
    <text x="768" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">exporter</text>
    <text x="768" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="768" dy="0">with a custom</tspan>
      <tspan x="768" dy="38" font-size="28" font-weight="bold" fill="#303a36">collector</tspan>
    </text>
  </g>

  
  <g id="step-4">
    <rect x="945" y="160" width="275" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="1083" cy="225" r="24" fill="#207448" />
    <text x="1083" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(1055, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="11" y="11" width="34" height="34" rx="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" />
      <line x1="19" y1="4" x2="19" y2="11" />
      <line x1="28" y1="4" x2="28" y2="11" />
      <line x1="37" y1="4" x2="37" y2="11" />
      <line x1="19" y1="45" x2="19" y2="52" />
      <line x1="28" y1="45" x2="28" y2="52" />
      <line x1="37" y1="45" x2="37" y2="52" />
      <line x1="4" y1="19" x2="11" y2="19" />
      <line x1="4" y1="28" x2="11" y2="28" />
      <line x1="4" y1="37" x2="11" y2="37" />
      <line x1="45" y1="19" x2="52" y2="19" />
      <line x1="45" y1="28" x2="52" y2="28" />
      <line x1="45" y1="37" x2="52" y2="37" />
    </g>

    
    <text x="1083" y="415" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">collect()</text>
    <text x="1083" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1083" dy="0">reads the</tspan>
      <tspan x="1083" dy="38" font-size="26" font-weight="bold">hardware now</tspan>
    </text>
  </g>

  
  <g id="step-5">
    <rect x="1260" y="160" width="280" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="1400" cy="225" r="24" fill="#207448" />
    <text x="1400" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    
    <g transform="translate(1372, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="5" width="40" height="46" rx="4" />
      <polyline points="16,36 24,24 32,30 40,16" />
      <circle cx="40" cy="16" r="2" fill="#207448" />
      <line x1="16" y1="42" x2="40" y2="42" stroke-width="3" />
    </g>

    
    <text x="1400" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">yields fresh</text>
    <text x="1400" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1400" dy="0">metrics in</tspan>
      <tspan x="1400" dy="38" font-size="26" font-weight="bold">the response</tspan>
    </text>
  </g>

  
  <g id="orange-note">
    <rect x="60" y="740" width="720" height="150" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(95, 791)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 42 12 C 42 30 24 42 24 44 C 24 42 6 30 6 12 Z" />
      <line x1="24" y1="16" x2="24" y2="27" />
      <circle cx="24" cy="34" r="2" fill="#db8129" />
    </g>

    
    <text x="175" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      <tspan x="175" dy="0">no stale values are cached</tspan>
      <tspan x="175" dy="36">between scrapes</tspan>
    </text>
  </g>

  
  <g id="green-note">
    <rect x="820" y="740" width="720" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(855, 791)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="20" />
      <polyline points="24,12 24,24 33,18" />
      <path d="M 10 32 C 14 36 20 38 24 38 C 28 38 34 36 38 32" stroke-width="3" />
    </g>

    
    <text x="935" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">also expose an <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">up</tspan> metric and</tspan>
      <tspan x="935" dy="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">scrape_duration_seconds</tspan>
    </text>
  </g>
</svg>