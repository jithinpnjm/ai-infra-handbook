<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Picturing offsets</title>
  <desc>Visual explanation of Python string offsets and slicing: forward and backward indexing and slice bounds on a string.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Picturing offsets</text>

  
  <g id="main-panel">
    <rect x="60" y="130" width="940" height="560" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(100, 155)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="52" height="40" rx="6"/>
      <line x1="19" y1="8" x2="19" y2="48"/>
      <line x1="36" y1="8" x2="36" y2="48"/>
    </g>
    <text x="175" y="196" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">S = &apos;spam&apos;</text>

    
    <text x="100" y="285" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">forward offsets</text>
    <text x="495" y="285" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">0</text>
    <text x="625" y="285" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">1</text>
    <text x="755" y="285" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">2</text>
    <text x="885" y="285" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">3</text>

    
    <g id="cells">
      
      <rect x="440" y="325" width="110" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <text x="495" y="388" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">s</text>

      
      <rect x="570" y="325" width="110" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <text x="625" y="388" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">p</text>

      
      <rect x="700" y="325" width="110" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <text x="755" y="388" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">a</text>

      
      <rect x="830" y="325" width="110" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <text x="885" y="388" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">m</text>
    </g>

    
    <text x="100" y="475" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">backward offsets</text>
    <text x="495" y="475" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">-4</text>
    <text x="625" y="475" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">-3</text>
    <text x="755" y="475" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">-2</text>
    <text x="885" y="475" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">-1</text>

    
    <path d="M 570 515 Q 570 535 595 535 H 675 Q 690 535 690 550 Q 690 535 705 535 H 785 Q 810 535 810 515" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="520" y="570" width="340" height="66" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text x="690" y="613" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">S[1:3] gives &apos;pa&apos;</text>
  </g>

  
  
  <g id="chip-1">
    <rect x="1040" y="160" width="500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1070, 200)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 8 H 6 V 48 H 12"/>
      <path d="M 44 8 H 50 V 48 H 44"/>
      <circle cx="28" cy="28" r="10"/>
    </g>
    <text x="1155" y="238" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">S[0] gives &apos;s&apos;</text>
  </g>

  
  <g id="chip-2">
    <rect x="1040" y="345" width="500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1070, 385)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 8 H 6 V 48 H 12"/>
      <path d="M 44 8 H 50 V 48 H 44"/>
      <line x1="38" y1="28" x2="18" y2="28"/>
      <polyline points="26 20 18 28 26 36"/>
    </g>
    <text x="1155" y="423" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">S[-1] gives &apos;m&apos;</text>
  </g>

  
  <g id="chip-3">
    <rect x="1040" y="530" width="500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1070, 570)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 8 H 6 V 48 H 12"/>
      <path d="M 44 8 H 50 V 48 H 44"/>
      <circle cx="28" cy="19" r="4" fill="#207448"/>
      <circle cx="28" cy="37" r="4" fill="#207448"/>
    </g>
    <text x="1155" y="608" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">S[:2] gives &apos;sp&apos;</text>
  </g>

  
  <g id="orange-note">
    <rect x="60" y="735" width="1480" height="110" rx="18" fill="#fff7f0" stroke="#db8129" stroke-width="4"/>
    <g transform="translate(95, 762)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <line x1="28" y1="16" x2="28" y2="30"/>
      <circle cx="28" cy="39" r="2.5" fill="#db8129"/>
    </g>
    <text x="180" y="802" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">the stop offset is not included</text>
  </g>
</svg>