<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Shell injection in two examples, and the run() helper that prevents it</title>
  <desc>Visual comparison between shell injection vulnerabilities and secure subprocess execution using the run() helper.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Shell injection in two examples, and the run() helper that prevents it</text>

  

  
  <g>
    <rect x="40" y="90" width="710" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 64 114 v 48 h 36 v -34 l -14 -14 h -22 z M 86 114 v 14 h 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 72 144 h 10 M 86 144 h 10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="122" dy="0">A file called gpu report.csv</tspan>
      <tspan x="122" dy="28">pasted into a command string</tspan>
      <tspan x="122" dy="28">becomes two arguments</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="198" width="710" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="62" y="118" width="40" height="18" rx="4" transform="translate(0, 96)" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="72" cy="223" r="3" fill="#207448"/>
    <rect x="62" y="142" width="40" height="18" rx="4" transform="translate(0, 96)" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="72" cy="247" r="3" fill="#207448"/>
    <path d="M 94 223 v 14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="122" dy="0">a hostname from a spreadsheet arrives</tspan>
      <tspan x="122" dy="28">with a semicolon, so the script runs</tspan>
      <tspan x="122" dy="28">two commands instead of one</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="306" width="710" height="124" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="60" y="338" width="44" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 68 357 l 8 6 l -8 6 M 82 369 h 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="338" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="122" dy="0">shell=True with interpolated text:</tspan>
      <tspan x="122" dy="28">metacharacters ; $() backticks &amp;&amp;</tspan>
      <tspan x="122" dy="28">quotes and globs turn a name</tspan>
      <tspan x="122" dy="28">into command injection</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="440" width="710" height="168" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <path d="M 82 480 l 22 8 v 22 c 0 18 -14 28 -22 32 c -8 -4 -22 -14 -22 -32 v -22 z" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 74 510 l 6 6 l 12 -12" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="466" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="122" dy="0">subprocess.run([kubectl, get, nodes,</tspan>
      <tspan x="122" dy="25">-o, json], capture_output=True,</tspan>
      <tspan x="122" dy="25">text=True, encoding=utf-8,</tspan>
      <tspan x="122" dy="25">errors=replace, check=True,</tspan>
      <tspan x="122" dy="25">timeout=30, env={**os.environ,</tspan>
      <tspan x="122" dy="25">KUBECONFIG: ...}, cwd=/tmp)</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="780" y="90" width="780" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="814" cy="117" r="18" fill="#207448"/>
    <text x="814" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="848" y="125" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">log.info(exec: shlex.join(cmd))</text>
  </g>

  
  <path d="M 1170 144 V 154" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="780" y="154" width="780" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="814" cy="187" r="18" fill="#207448"/>
    <text x="814" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="848" y="180" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="848" dy="0">dry_run?</tspan>
      <tspan x="848" dy="26">return CmdResult(tuple(cmd), 0, "", "")</tspan>
    </text>
  </g>

  
  <path d="M 1170 220 V 230" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="780" y="230" width="780" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="814" cy="257" r="18" fill="#207448"/>
    <text x="814" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="848" y="265" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">subprocess.run(... timeout=timeout)</text>
  </g>

  
  <path d="M 814 284 V 576" stroke="#207448" stroke-width="3" fill="none"/>

  
  <g>
    <path d="M 814 329 H 848" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="848" y="296" width="712" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="882" cy="329" r="18" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 882 319 v 10 h 8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="914" y="322" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="914" dy="0">TimeoutExpired becomes OpsError(</tspan>
      <tspan x="914" dy="26">timeout after Ns: cmd) from exc</tspan>
    </text>
  </g>

  
  <g>
    <path d="M 814 405 H 848" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="848" y="372" width="712" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 868 391 v 36 h 26 v -26 l -10 -10 h -16 z" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 876 407 l 10 10 M 886 407 l -10 10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="914" y="398" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="914" dy="0">FileNotFoundError becomes OpsError(</tspan>
      <tspan x="914" dy="26">command not found: cmd[0]) from exc</tspan>
    </text>
  </g>

  
  <g>
    <path d="M 814 491 H 848" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="848" y="448" width="712" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 882 467 l 18 32 h -36 z" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 882 481 v 8 M 882 493 v 2" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="914" y="474" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="914" dy="0">check and returncode != 0 becomes</tspan>
      <tspan x="914" dy="26">OpsError(cmd exited rc:</tspan>
      <tspan x="914" dy="26">first 500 chars of stderr)</tspan>
    </text>
  </g>

  
  <g>
    <path d="M 814 576 H 848" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="848" y="544" width="712" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="866" y="560" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 873 576 l 6 6 l 12 -12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="914" y="570" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="914" dy="0">CmdResult(cmd, rc, out, err)</tspan>
      <tspan x="914" dy="26">frozen dataclass</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="624" width="1520" height="154" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 86 681 c -6 -6 -14 -8 -22 -8 v 36 c 8 0 16 2 22 8 c 6 -6 14 -8 22 -8 v -36 c -8 0 -16 2 -22 8 z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 86 681 v 36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="126" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">CalledProcessError has returncode, stdout, stderr and cmd; a negative returncode</tspan>
      <tspan x="126" dy="26">means killed by that signal, -9 is SIGKILL; capture_output buffers all output in memory,</tspan>
      <tspan x="126" dy="26">stream when huge; input=data sends stdin; stdin=subprocess.DEVNULL stops prompts hanging;</tspan>
      <tspan x="126" dy="26">text was called universal_newlines; if a shell is needed quote each dynamic part</tspan>
      <tspan x="126" dy="26">with shlex.quote or build pipelines with Popen</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="790" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="64" y="836" width="18" height="38" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="86" y="836" width="18" height="38" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 73 846 h 0.1 M 95 846 h 0.1" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    <text x="126" y="816" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">socket and ipaddress, psutil, os.statvfs and shutil.disk_usage, platform, pwd and grp,</tspan>
      <tspan x="126" dy="26">pyudev, netifaces or pyroute2, docker and kubernetes clients, boto3, paramiko,</tspan>
      <tspan x="126" dy="26">pynvml or nvidia-ml-py instead of nvidia-smi; machine-readable output: -o json,</tspan>
      <tspan x="126" dy="26">ip -j, lsblk -J, nvidia-smi --query-gpu=... --format=csv,noheader,nounits</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="932" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="66" y="984" width="38" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 74 984 v -10 c 0 -6 5 -10 11 -10 c 6 0 11 4 11 10 v 10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="998" r="3" fill="#207448"/>
    <text x="126" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">never run executable names that users control; shutil.which(kubectl); in privileged</tspan>
      <tspan x="126" dy="26">scripts pin absolute paths and scrub PATH; sudo -n for non-interactive; do not pass</tspan>
      <tspan x="126" dy="26">secrets on the command line because ps shows them: use environment variables,</tspan>
      <tspan x="126" dy="26">stdin or 0600 files</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1076" width="1520" height="68" rx="12" fill="#207448"/>
    <text x="800" y="1119" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Give every subprocess a timeout and an argument list, and check its return code</text>
  </g>
</svg>