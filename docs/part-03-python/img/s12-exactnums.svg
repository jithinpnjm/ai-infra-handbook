<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Binary floats versus exact numbers</title>
  <desc>Comparison of numeric accuracy between float binary approximation, exact Decimal digits, and exact Fraction representation.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  <text x="800" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Binary floats versus exact numbers</text>

  
  <rect x="80" y="140" width="1440" height="175" rx="16" fill="#e8f1ea" stroke="#d0e2d4" stroke-width="2"/>
  
  <g transform="translate(112, 199)">
    <rect x="6" y="6" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="16" y="16" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="18" y1="0" x2="18" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="0" x2="38" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="50" x2="18" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="50" x2="38" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="6" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="6" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="38" x2="56" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">float</text>
  <rect x="360" y="185" width="750" height="85" rx="12" fill="#ffffff" stroke="#c0d6c5" stroke-width="2"/>
  <text x="735" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">0.1 + 0.1 + 0.1 == 0.3 is False</text>
  <rect x="1140" y="195" width="340" height="65" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <text x="1310" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">binary approximation</text>

  
  <rect x="80" y="345" width="1440" height="175" rx="16" fill="#e8f1ea" stroke="#d0e2d4" stroke-width="2"/>
  
  <g transform="translate(112, 404)">
    <rect x="6" y="2" width="44" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="14" y="10" width="28" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="18" cy="30" r="3" fill="#207448"/>
    <circle cx="28" cy="30" r="3" fill="#207448"/>
    <circle cx="38" cy="30" r="3" fill="#207448"/>
    <circle cx="18" cy="42" r="3" fill="#207448"/>
    <circle cx="28" cy="42" r="3" fill="#207448"/>
    <circle cx="38" cy="42" r="3" fill="#207448"/>
  </g>
  <text x="190" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Decimal</text>
  <rect x="360" y="390" width="750" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="735" y="443" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">Decimal('0.1') * 3 == Decimal('0.3') is True</text>
  <rect x="1140" y="400" width="340" height="65" rx="12" fill="#e2efe5" stroke="#207448" stroke-width="3"/>
  <text x="1310" y="441" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">exact decimal digits</text>

  
  <rect x="80" y="550" width="1440" height="175" rx="16" fill="#e8f1ea" stroke="#d0e2d4" stroke-width="2"/>
  
  <g transform="translate(112, 609)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="28" x2="28" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="48.8" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="7.2" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Fraction</text>
  <rect x="360" y="595" width="1120" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="920" y="648" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">Fraction(1, 3) stays exact, no rounding</text>

  
  <rect x="80" y="755" width="1440" height="80" rx="16" fill="#207448"/>
  <text x="800" y="805" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">pick the numeric type to match the accuracy you need</text>
</svg>