<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>String toolbox: pick the formatting and replacement tool</title>
  <desc>Visual guide for string formatting, replacement, template, regex, and encoding tools in Python.</desc>

  <rect width="1600" height="1300" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">String toolbox: pick the formatting and replacement tool</text>

  
  
  <g transform="translate(50, 105)">
    <rect width="720" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect width="720" height="12" rx="6" fill="#207448"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="55" font-family="sans-serif" font-weight="bold">f-string (preferred): </tspan>
      <tspan font-family="monospace">f&quot;{name} has {n} GPUs&quot;;</tspan>
      <tspan x="30" y="95" font-family="monospace">mini-language :&gt;10 :^10 :08.3f :, thousands :%</tspan>
      <tspan x="30" y="135" font-family="monospace">!r for repr, {n=}</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 285)">
    <rect width="720" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="52" font-family="sans-serif" font-weight="bold">str.format: </tspan>
      <tspan font-family="monospace">&quot;{} has {} GPUs&quot;.format(...)</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 385)">
    <rect width="720" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="52" font-family="sans-serif" font-weight="bold">printf style: </tspan>
      <tspan font-family="monospace">&quot;%s has %d GPUs&quot; % (...) (legacy)</tspan>
    </text>
  </g>

  
  <g transform="translate(810, 105)">
    <rect width="740" height="365" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect width="740" height="12" rx="6" fill="#207448"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="50" font-family="sans-serif" font-weight="bold">string.Template: </tspan>
      <tspan font-family="monospace">$name</tspan>
      <tspan font-family="sans-serif"> or </tspan>
      <tspan font-family="monospace">${name}</tspan>
      <tspan font-family="sans-serif"> from keyword</tspan>
      <tspan x="30" y="86" font-family="sans-serif">arguments or a dict; no inline expressions, so</tspan>
      <tspan x="30" y="122" font-family="sans-serif">safer for user-supplied or file-loaded templates;</tspan>
      <tspan x="30" y="158" font-family="sans-serif">substitute raises KeyError on a missing key,</tspan>
      <tspan x="30" y="194" font-family="sans-serif">safe_substitute leaves it intact:</tspan>
      <tspan x="30" y="234" font-family="monospace">Template(&quot;$host has ${gpus} GPUs&quot;)</tspan>
      <tspan x="30" y="270" font-family="monospace">.safe_substitute(host=&quot;node1&quot;) gives</tspan>
      <tspan x="30" y="306" font-family="monospace">node1 has ${gpus} GPUs</tspan>
    </text>
  </g>

  
  
  <g transform="translate(50, 490)">
    <rect width="720" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="57" font-family="monospace" font-weight="bold">str.replace(old, new): </tspan>
      <tspan font-family="sans-serif">one substring at a time</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 605)">
    <rect width="720" height="250" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <rect width="720" height="12" rx="6" fill="#db8129"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="52" font-family="monospace" font-weight="bold">str.maketrans(&quot;:-&quot;, &quot;__&quot;, &quot; ()&quot;)</tspan>
      <tspan font-family="sans-serif"> with </tspan>
      <tspan font-family="monospace">translate:</tspan>
      <tspan x="30" y="92" font-family="sans-serif">map : and - to _, delete spaces and</tspan>
      <tspan x="30" y="132" font-family="sans-serif">parens in one pass; </tspan>
      <tspan font-family="monospace">gpu-01: (rack-2)</tspan>
      <tspan font-family="sans-serif"> becomes</tspan>
      <tspan x="30" y="172" font-family="monospace" font-weight="bold" fill="#db8129">gpu_01_rack_2</tspan>
    </text>
  </g>

  
  <g transform="translate(810, 490)">
    <rect width="740" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="46" font-family="sans-serif" font-weight="bold">join: </tspan>
      <tspan font-family="sans-serif">collect parts in a list and </tspan>
      <tspan font-family="monospace">&quot;&quot;.join(parts);</tspan>
      <tspan x="30" y="82" font-family="monospace">+=</tspan>
      <tspan font-family="sans-serif"> in a loop builds a new string each time</tspan>
    </text>
  </g>

  
  <g transform="translate(810, 615)">
    <rect width="740" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="42" font-family="sans-serif" font-weight="bold">str versus repr: </tspan>
      <tspan font-family="sans-serif">str for humans, repr for developers;</tspan>
      <tspan x="30" y="76" font-family="sans-serif">use </tspan>
      <tspan font-family="monospace">!r</tspan>
      <tspan font-family="sans-serif"> in log messages</tspan>
    </text>
  </g>

  
  <g transform="translate(810, 725)">
    <rect width="740" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="30" y="44" font-family="monospace" font-weight="bold">removeprefix, removesuffix, casefold</tspan>
      <tspan x="30" y="78" font-family="sans-serif">for case-insensitive comparison, </tspan>
      <tspan x="30" y="112" font-family="monospace">unicodedata.normalize</tspan>
      <tspan font-family="sans-serif"> for Unicode equivalence</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 880)">
    <rect width="1500" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="35" y="52" font-family="monospace" font-weight="bold">LINE = re.compile(r&quot;(?P&lt;ts&gt;...) (?P&lt;host&gt;...)...&quot;) ; m[&quot;host&quot;], int(m[&quot;pid&quot;]);</tspan>
      <tspan x="35" y="96" font-family="sans-serif">prefer structured outputs (</tspan>
      <tspan font-family="monospace">--json, ip -j, kubectl -o json</tspan>
      <tspan font-family="sans-serif">) over parsing text</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1035)">
    <rect width="1500" height="95" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    
    <g transform="translate(35, 24)" stroke="#db8129" stroke-width="3" fill="none">
      <rect x="6" y="18" width="34" height="26" rx="4"/>
      <path d="M13,18 V12 A10,10 0 0,1 33,12 V18"/>
      <circle cx="23" cy="30" r="3" fill="#db8129"/>
    </g>
    <text x="100" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      never build shell commands or SQL by formatting untrusted input
    </text>
  </g>

  
  <g transform="translate(50, 1155)">
    <rect width="1500" height="110" rx="12" fill="#207448"/>
    <text x="750" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="750" dy="0">Text is encoded to bytes on the way out and decoded on the way in;</tspan>
      <tspan x="750" dy="36">mixing the two raises TypeError</tspan>
    </text>
  </g>
</svg>