<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>String toolbox: pick the formatting and replacement tool</title>
  <desc>Visual guide comparing Python string formatting, replacement, regex, security rules, and byte encoding.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="40" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">String toolbox: pick the formatting and replacement tool</text>

  

  
  <g>
    <rect x="40" y="75" width="740" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 95)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 20 16 C 14 16 14 24 14 28 C 14 32 10 32 10 32 C 10 32 14 32 14 36 C 14 40 14 48 20 48" />
      <path d="M 36 16 C 42 16 42 24 42 28 C 42 32 46 32 46 32 C 46 32 42 32 42 36 C 42 40 42 48 36 48" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>
    
    <text x="135" y="112" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">f-string (preferred): </tspan>
      <tspan x="135" dy="36" font-size="24" font-family="ui-monospace, monospace">f"{name} has {n} GPUs"; </tspan>
      <tspan x="135" dy="32" font-size="24">mini-language :&gt;10 :^10 :08.3f :, </tspan>
      <tspan x="135" dy="32" font-size="24">thousands :% !r for repr, {n=}</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="247" width="740" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 267)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 18 20 C 14 20 14 25 14 28 C 14 31 14 36 18 36" />
      <path d="M 26 20 C 30 20 30 25 30 28 C 30 31 30 36 26 36" />
      <circle cx="38" cy="34" r="2" fill="#207448" />
      <circle cx="44" cy="34" r="2" fill="#207448" />
    </g>
    
    <text x="135" y="284" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">str.format: </tspan>
      <tspan x="135" dy="34" font-size="24" font-family="ui-monospace, monospace">"{} has {} GPUs".format(...)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="354" width="740" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 374)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <line x1="38" y1="18" x2="18" y2="38" />
      <circle cx="21" cy="21" r="3" fill="#207448" />
      <circle cx="35" cy="35" r="3" fill="#207448" />
    </g>
    
    <text x="135" y="391" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">printf style: </tspan>
      <tspan x="135" dy="34" font-size="24" font-family="ui-monospace, monospace">"%s has %d GPUs" % (...) (legacy)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="461" width="740" height="309" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 481)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 8 L 34 8 L 46 20 L 46 48 L 12 48 Z" />
      <path d="M 34 8 L 34 20 L 46 20" />
      <line x1="29" y1="24" x2="29" y2="40" />
      <path d="M 33 28 C 33 26 25 26 25 30 C 25 34 33 34 33 38 C 33 42 25 42 25 40" />
    </g>
    
    <text x="135" y="497" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">string.Template: </tspan>
      <tspan x="135" dy="34" font-size="24">$name or ${name} from keyword </tspan>
      <tspan x="135" dy="30" font-size="24">arguments or a dict; no inline </tspan>
      <tspan x="135" dy="30" font-size="24">expressions, so safer for user-supplied </tspan>
      <tspan x="135" dy="30" font-size="24">or file-loaded templates; substitute </tspan>
      <tspan x="135" dy="30" font-size="24">raises KeyError on a missing key, </tspan>
      <tspan x="135" dy="30" font-size="24">safe_substitute leaves it intact: </tspan>
      <tspan x="135" dy="32" font-size="24" font-family="ui-monospace, monospace">Template("$host has ${gpus} GPUs")</tspan>
      <tspan x="135" dy="30" font-size="24" font-family="ui-monospace, monospace">.safe_substitute(host="node1") gives </tspan>
      <tspan x="135" dy="30" font-size="24" font-family="ui-monospace, monospace">node1 has ${gpus} GPUs</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="820" y="75" width="740" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(840, 95)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 14 22 L 36 22 M 30 16 L 36 22 L 30 28" />
      <path d="M 42 34 L 20 34 M 26 28 L 20 34 L 26 40" />
    </g>
    
    <text x="915" y="112" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">str.replace(old, new): </tspan>
      <tspan x="915" dy="34" font-size="24">one substring at a time</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="182" width="740" height="188" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(840, 202)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <line x1="14" y1="28" x2="42" y2="28" />
      <line x1="28" y1="14" x2="28" y2="42" />
      <circle cx="21" cy="21" r="3" fill="#db8129" />
      <circle cx="35" cy="35" r="3" fill="#db8129" />
    </g>
    
    <text x="915" y="217" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="28" font-weight="bold" fill="#db8129">str.maketrans(":-", "__", " ()") </tspan>
      <tspan x="915" dy="34" font-size="28" font-weight="bold" fill="#db8129">with translate: </tspan>
      <tspan x="915" dy="34" font-size="24">map : and - to _, delete spaces and </tspan>
      <tspan x="915" dy="30" font-size="24">parens in one pass; </tspan>
      <tspan x="915" dy="32" font-size="24" font-family="ui-monospace, monospace">gpu-01: (rack-2) becomes gpu_01_rack_2</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="382" width="740" height="143" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(840, 402)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 14 18 L 24 28 L 14 38" />
      <path d="M 42 18 L 32 28 L 42 38" />
      <line x1="28" y1="18" x2="28" y2="38" stroke-dasharray="3 3" />
    </g>
    
    <text x="915" y="415" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">removeprefix, removesuffix, </tspan>
      <tspan x="915" dy="36" font-size="24">casefold for case-insensitive comparison, </tspan>
      <tspan x="915" dy="32" font-size="24">unicodedata.normalize for Unicode equivalence</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="537" width="740" height="113" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(840, 557)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 16 32 C 12 28 12 20 18 16 C 24 12 30 14 34 18" />
      <path d="M 40 24 C 44 28 44 36 38 40 C 32 44 26 42 22 38" />
      <line x1="24" y1="32" x2="32" y2="24" />
    </g>
    
    <text x="915" y="567" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">join: </tspan>
      <tspan font-size="24">collect parts in a list and </tspan>
      <tspan x="915" dy="34" font-size="24" font-family="ui-monospace, monospace">"".join(parts); </tspan>
      <tspan font-size="24">+= in a loop builds a new </tspan>
      <tspan x="915" dy="30" font-size="24">string each time</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="662" width="740" height="108" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(840, 682)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <circle cx="22" cy="24" r="6" />
      <path d="M 14 42 C 14 34 30 34 30 42" />
      <path d="M 36 22 L 44 28 L 36 34" />
    </g>
    
    <text x="915" y="694" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">str versus repr: </tspan>
      <tspan x="915" dy="34" font-size="24">str for humans, repr for developers; </tspan>
      <tspan x="915" dy="30" font-size="24">use !r in log messages</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="786" width="1520" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 813)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <line x1="0" y1="16" x2="56" y2="16" />
      <circle cx="10" cy="8" r="2" fill="#207448" />
      <circle cx="18" cy="8" r="2" fill="#207448" />
      <path d="M 14 30 L 22 36 L 14 42" />
      <line x1="26" y1="42" x2="38" y2="42" />
    </g>
    
    <text x="135" y="825" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Regex strip</text>
    
    <text x="135" y="858" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-size="24">LINE = re.compile(r"(?P&lt;ts&gt;...) (?P&lt;host&gt;...)...") ; m["host"], int(m["pid"]); </tspan>
      <tspan x="135" dy="30" font-size="24">prefer structured outputs (--json, ip -j, kubectl -o json) over parsing text</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="912" width="1520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 929)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 46 14 L 46 28 C 46 40 28 48 28 50 C 28 48 10 40 10 28 L 10 14 Z" />
      <line x1="28" y1="20" x2="28" y2="30" />
      <circle cx="28" cy="37" r="2" fill="#207448" />
    </g>
    
    <text x="135" y="948" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Security note</text>
    
    <text x="135" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">never build shell commands or SQL by formatting untrusted input</text>
  </g>

  
  <g>
    <rect x="40" y="1018" width="1520" height="70" rx="10" fill="#207448" />
    
    <g transform="translate(60, 1025)" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <path d="M 14 20 L 38 20 M 32 14 L 38 20 L 32 26" />
      <path d="M 42 36 L 18 36 M 24 30 L 18 36 L 24 42" />
    </g>
    
    <text x="135" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Text is encoded to bytes on the way out and decoded on the way in; mixing the two raises TypeError</text>
  </g>
</svg>