<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Keep the GPU fed</title>
  <desc id="svg-desc">Visual comparison between a slow data loader causing GPU idle gaps and an optimized workers and prefetch pipeline keeping the GPU continuously busy.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  <text x="80" y="65" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Keep the GPU fed</text>

  <rect x="60" y="100" width="1480" height="315" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>

  <g transform="translate(95, 115)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="14" rx="22" ry="8"/>
    <path d="M 6 14 V 42 C 6 46.4 15.9 50 28 50 C 40.1 50 50 46.4 50 42 V 14"/>
    <path d="M 6 28 C 6 32.4 15.9 36 28 36 C 40.1 36 50 32.4 50 28"/>
  </g>
  <text x="175" y="155" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="700">Slow loader</text>

  <rect x="100" y="185" width="250" height="205" rx="14" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g transform="translate(197, 205)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <rect x="19" y="19" width="18" height="18" rx="2"/>
    <line x1="18" y1="4" x2="18" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="4" y1="18" x2="10" y2="18"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="4" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="52" y2="18"/>
    <line x1="46" y1="28" x2="52" y2="28"/>
    <line x1="46" y1="38" x2="52" y2="38"/>
  </g>
  <text x="225" y="325" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">GPU busy</text>

  <rect x="370" y="185" width="480" height="205" rx="14" fill="#fff5ec" stroke="#db8129" stroke-width="4"/>
  <g transform="translate(582, 205)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <polyline points="28,14 28,28 38,28"/>
  </g>
  <text x="610" y="325" text-anchor="middle" fill="#db8129" font-family="sans-serif" font-size="26" font-weight="700">GPU idle waiting for data</text>

  <rect x="870" y="185" width="250" height="205" rx="14" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g transform="translate(967, 205)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <rect x="19" y="19" width="18" height="18" rx="2"/>
    <line x1="18" y1="4" x2="18" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="4" y1="18" x2="10" y2="18"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="4" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="52" y2="18"/>
    <line x1="46" y1="28" x2="52" y2="28"/>
    <line x1="46" y1="38" x2="52" y2="38"/>
  </g>
  <text x="995" y="325" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">GPU busy</text>

  <rect x="1140" y="185" width="360" height="205" rx="14" fill="#fff5ec" stroke="#db8129" stroke-width="4"/>
  <g transform="translate(1292, 205)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <polyline points="28,14 28,28 38,28"/>
  </g>
  <text x="1320" y="325" text-anchor="middle" fill="#db8129" font-family="sans-serif" font-size="28" font-weight="700">GPU idle</text>

  <rect x="60" y="455" width="1480" height="285" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>

  <g transform="translate(95, 475)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="10"/>
    <path d="M 22 6 V 12 M 22 32 V 38 M 6 22 H 12 M 32 22 H 38 M 11 11 L 15 15 M 29 29 L 33 33 M 11 33 L 15 29 M 29 15 L 33 11"/>
    <circle cx="40" cy="40" r="7"/>
    <path d="M 40 29 V 33 M 40 47 V 51 M 29 40 H 33 M 47 40 H 51 M 32 32 L 35 35 M 45 45 L 48 48 M 32 48 L 35 45 M 45 35 L 48 32"/>
  </g>
  <text x="175" y="515" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="700">Workers and prefetch</text>

  <rect x="100" y="545" width="1400" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g transform="translate(772, 565)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <rect x="19" y="19" width="18" height="18" rx="2"/>
    <line x1="18" y1="4" x2="18" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="38" y1="4" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="52"/>
    <line x1="28" y1="46" x2="28" y2="52"/>
    <line x1="38" y1="46" x2="38" y2="52"/>
    <line x1="4" y1="18" x2="10" y2="18"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="4" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="52" y2="18"/>
    <line x1="46" y1="28" x2="52" y2="28"/>
    <line x1="46" y1="38" x2="52" y2="38"/>
  </g>
  <text x="800" y="665" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="28" font-weight="700">loading overlaps with GPU compute so the GPU stays busy</text>

  <rect x="60" y="780" width="1480" height="70" rx="14" fill="#207448"/>
  <text x="800" y="824" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">data loading is usually the real bottleneck.</text>
</svg>