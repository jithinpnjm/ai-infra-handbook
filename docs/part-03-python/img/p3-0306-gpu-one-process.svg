<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>One process per GPU, with threads only for I/O</title>
  <desc>Architecture showing one process per GPU rank, with worker processes for data loading and threads strictly for I/O.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-start" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 11 2 L 1 7 L 11 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">One process per GPU, with threads only for I/O</text>

  
  <rect x="120" y="130" width="1360" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(145, 147)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="56" height="56" rx="8" />
    <path d="M 14 20 L 26 28 L 14 36" />
    <line x1="30" y1="36" x2="42" y2="36" stroke-linecap="round" />
  </g>

  
  <text x="800" y="186" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">torchrun, accelerate, DeepSpeed, mpirun or Slurm srun</text>

  
  <path d="M 310 220 L 310 276" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 1290 220 L 1290 276" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="280" width="520" height="700" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(75, 302)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#e8f1ea" />
    <line x1="12" y1="0" x2="12" y2="-6" stroke-linecap="round" />
    <line x1="24" y1="0" x2="24" y2="-6" stroke-linecap="round" />
    <line x1="36" y1="0" x2="36" y2="-6" stroke-linecap="round" />
    <line x1="12" y1="48" x2="12" y2="54" stroke-linecap="round" />
    <line x1="24" y1="48" x2="24" y2="54" stroke-linecap="round" />
    <line x1="36" y1="48" x2="36" y2="54" stroke-linecap="round" />
    <rect x="14" y="14" width="20" height="20" rx="3" fill="#207448" />
  </g>
  <text x="140" y="338" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Process rank 0</text>

  
  <rect x="75" y="380" width="470" height="310" rx="12" fill="#f0f6f2" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(95, 400)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="24" cy="12" rx="20" ry="8" />
    <path d="M 4 12 v 12 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -12" />
    <path d="M 4 24 v 12 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -12" />
  </g>
  <text x="95" y="475" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" dy="0" font-family="monospace" font-weight="bold" fill="#207448">DataLoader(num_workers=N)</tspan>
    <tspan x="95" dy="40">worker processes decode and</tspan>
    <tspan x="95" dy="38">augment data; tune num_workers,</tspan>
    <tspan x="95" dy="38">prefetch_factor, pin_memory,</tspan>
    <tspan x="95" dy="40" font-family="monospace" font-weight="bold">persistent_workers</tspan>
  </text>

  
  <rect x="75" y="715" width="470" height="240" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(95, 735)" stroke="#db8129" stroke-width="3" fill="none">
    <path d="M 6 12 Q 24 0 42 12 T 42 36" />
    <path d="M 12 40 Q 24 52 36 40" />
    <circle cx="6" cy="12" r="3" fill="#db8129" />
    <circle cx="42" cy="36" r="3" fill="#db8129" />
  </g>
  <text x="95" y="825" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="95" dy="0">threads inside a rank are for I/O</tspan>
    <tspan x="95" dy="40">such as prefetching,</tspan>
    <tspan x="95" dy="40">not for compute</tspan>
  </text>

  
  <line x1="570" y1="630" x2="606" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" marker-start="url(#arrow-green-start)" />
  <line x1="994" y1="630" x2="1030" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" marker-start="url(#arrow-green-start)" />

  
  <rect x="610" y="580" width="380" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="800" y="624" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">NCCL handles</text>
  <text x="800" y="658" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">communication (Part 14)</text>

  
  <rect x="1030" y="280" width="520" height="700" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(1055, 302)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#e8f1ea" />
    <line x1="12" y1="0" x2="12" y2="-6" stroke-linecap="round" />
    <line x1="24" y1="0" x2="24" y2="-6" stroke-linecap="round" />
    <line x1="36" y1="0" x2="36" y2="-6" stroke-linecap="round" />
    <line x1="12" y1="48" x2="12" y2="54" stroke-linecap="round" />
    <line x1="24" y1="48" x2="24" y2="54" stroke-linecap="round" />
    <line x1="36" y1="48" x2="36" y2="54" stroke-linecap="round" />
    <rect x="14" y="14" width="20" height="20" rx="3" fill="#207448" />
  </g>
  <text x="1120" y="338" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Process rank 1</text>

  
  <rect x="1055" y="380" width="470" height="310" rx="12" fill="#f0f6f2" stroke="#207448" stroke-width="2" />
  <g transform="translate(1075, 400)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="24" cy="12" rx="20" ry="8" />
    <path d="M 4 12 v 12 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -12" />
    <path d="M 4 24 v 12 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -12" />
  </g>
  <text x="1140" y="432" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">DataLoader workers</text>

  
  <g transform="translate(1075, 475)">
    <rect x="0" y="0" width="430" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="28" cy="26" r="12" fill="#e8f1ea" />
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#207448">1</text>
    <text x="60" y="34" font-family="sans-serif" font-size="24" fill="#303a36">decode &amp; augment batch</text>
  </g>
  <g transform="translate(1075, 545)">
    <rect x="0" y="0" width="430" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="28" cy="26" r="12" fill="#e8f1ea" />
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#207448">2</text>
    <text x="60" y="34" font-family="sans-serif" font-size="24" fill="#303a36">pinned memory transfer</text>
  </g>
  <g transform="translate(1075, 615)">
    <rect x="0" y="0" width="430" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="28" cy="26" r="12" fill="#e8f1ea" />
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#207448">N</text>
    <text x="60" y="34" font-family="sans-serif" font-size="24" fill="#303a36">persistent worker queue</text>
  </g>

  
  <rect x="1055" y="715" width="470" height="240" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="2.5" />
  <g transform="translate(1075, 735)" stroke="#db8129" stroke-width="3" fill="none">
    <path d="M 6 12 Q 24 0 42 12 T 42 36" />
    <path d="M 12 40 Q 24 52 36 40" />
    <circle cx="6" cy="12" r="3" fill="#db8129" />
    <circle cx="42" cy="36" r="3" fill="#db8129" />
  </g>
  <text x="1140" y="768" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">threads for I/O</text>

  
  <g transform="translate(1075, 810)">
    <rect x="0" y="0" width="430" height="54" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <path d="M 20 27 L 44 27 M 36 19 L 44 27 L 36 35" stroke="#db8129" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="35" font-family="sans-serif" font-size="24" fill="#303a36">Async host-to-device prefetch</text>
  </g>
  <g transform="translate(1075, 880)">
    <rect x="0" y="0" width="430" height="54" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <path d="M 20 27 L 44 27 M 36 19 L 44 27 L 36 35" stroke="#db8129" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="35" font-family="sans-serif" font-size="24" fill="#303a36">Non-blocking disk / socket reads</text>
  </g>

  
  <rect x="120" y="1015" width="1360" height="80" rx="12" fill="#fff4e8" stroke="#db8129" stroke-width="2" />
  
  <g transform="translate(150, 1033)" stroke="#db8129" stroke-width="3" fill="none">
    <path d="M 22 4 L 42 40 L 2 40 Z" stroke-linejoin="round" />
    <line x1="22" y1="18" x2="22" y2="28" stroke-linecap="round" />
    <circle cx="22" cy="34" r="1.5" fill="#db8129" />
  </g>
  <text x="800" y="1065" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#9c4e0b">avoid forking after CUDA is initialised; watch for memory duplication</text>

  
  <rect x="120" y="1125" width="1360" height="85" rx="14" fill="#207448" stroke="#165333" stroke-width="2" />
  <text x="800" y="1178" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep one process per GPU, and let threads handle only the I/O</text>
</svg>