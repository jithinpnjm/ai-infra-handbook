<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Bridges between the three models</title>
  <desc>Visual infographic explaining the bridges, offloading patterns, and thread-safe boundaries between asyncio event loop, thread pool, and process pool, production multi-process web servers, background tasks, and distributed scaling beyond a single machine.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Bridges between the three models</text>

  

  
  <g id="node-asyncio-loop">
    <rect x="40" y="110" width="250" height="555" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(137, 145)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="115 35"/>
      <polygon points="48,16 56,28 42,28" fill="#207448"/>
      <circle cx="28" cy="28" r="7" fill="#207448"/>
    </g>
    <text x="165" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="165" dy="0">asyncio</tspan>
      <tspan x="165" dy="38">loop</tspan>
    </text>
  </g>

  
  <g id="node-thread-pool">
    <rect x="870" y="110" width="240" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(962, 135)">
      <path d="M 10 6 Q 28 14 10 24 T 10 42 T 10 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 28 6 Q 46 14 28 24 T 28 42 T 28 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 46 6 Q 64 14 46 24 T 46 42 T 46 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="990" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="990" dy="0">thread</tspan>
      <tspan x="990" dy="38">pool</tspan>
    </text>
  </g>

  
  <g id="node-process-pool">
    <rect x="870" y="410" width="240" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(962, 435)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      
      <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="990" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="990" dy="0">process</tspan>
      <tspan x="990" dy="38">pool</tspan>
    </text>
  </g>

  

  
  <g id="bridge-loop-to-thread">
    <rect x="300" y="125" width="560" height="74" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="580" y="154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">loop to thread: <tspan font-family="monospace, ui-monospace, Menlo, Consolas" font-weight="normal">await asyncio.to_thread(...)</tspan></text>
    <line x1="290" y1="210" x2="870" y2="210" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  <g id="bridge-thread-to-loop">
    <rect x="300" y="234" width="560" height="112" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="580" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">thread to loop:</text>
    <text x="580" y="296" text-anchor="middle" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" fill="#303a36">asyncio.run_coroutine_threadsafe(coro, loop)</text>
    <text x="580" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">and <tspan font-family="monospace, ui-monospace, Menlo, Consolas">loop.call_soon_threadsafe</tspan></text>
    <line x1="870" y1="358" x2="290" y2="358" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  <g id="bridge-loop-to-process-pool">
    <rect x="300" y="455" width="560" height="114" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
    <text x="580" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">loop to process pool:</text>
    <text x="580" y="522" text-anchor="middle" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" fill="#303a36">await loop.run_in_executor(</text>
    <text x="580" y="554" text-anchor="middle" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" fill="#303a36">process_pool, cpu_fn, data)</text>
    <line x1="290" y1="582" x2="870" y2="582" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  

  
  <g id="panel-multiprocess-web-servers">
    <rect x="1140" y="110" width="420" height="315" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1322, 126)">
      <rect x="4" y="6" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="12" cy="12" r="2.5" fill="#207448"/>
      <rect x="4" y="22" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="12" cy="28" r="2.5" fill="#207448"/>
      <rect x="4" y="38" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="12" cy="44" r="2.5" fill="#207448"/>
    </g>
    <text x="1350" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1350" dy="0" font-weight="bold">Multiprocess web servers:</tspan>
      <tspan x="1350" dy="30">gunicorn or uvicorn</tspan>
      <tspan x="1350" dy="28">workers each have their</tspan>
      <tspan x="1350" dy="28">own event loop, so they</tspan>
      <tspan x="1350" dy="28">scale across cores;</tspan>
      <tspan x="1350" dy="28">share state through</tspan>
      <tspan x="1350" dy="28">external stores such as</tspan>
      <tspan x="1350" dy="28">Redis, not through memory</tspan>
    </text>
  </g>

  
  <g id="panel-fastapi-background-tasks">
    <rect x="1140" y="445" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1322, 458)">
      <polygon points="32,4 12,28 26,28 20,52 44,22 30,22" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="1350" y="534" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1350" dy="0" font-weight="bold">FastAPI BackgroundTasks:</tspan>
      <tspan x="1350" dy="32">short fire-and-forget</tspan>
      <tspan x="1350" dy="30">work; for durable work</tspan>
      <tspan x="1350" dy="30">use real queues</tspan>
      <tspan x="1350" dy="30">(chapter 3.7)</tspan>
    </text>
  </g>

  

  <g id="distributed-strip">
    <rect x="40" y="700" width="1520" height="205" rx="16" fill="#fef7f0" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(72, 770)">
      <circle cx="16" cy="18" r="10" fill="none" stroke="#db8129" stroke-width="3"/>
      <circle cx="56" cy="18" r="10" fill="none" stroke="#db8129" stroke-width="3"/>
      <circle cx="36" cy="54" r="10" fill="none" stroke="#db8129" stroke-width="3"/>
      <line x1="24" y1="24" x2="31" y2="46" stroke="#db8129" stroke-width="3"/>
      <line x1="48" y1="24" x2="41" y2="46" stroke="#db8129" stroke-width="3"/>
      <line x1="26" y1="18" x2="46" y2="18" stroke="#db8129" stroke-width="3"/>
    </g>
    <text x="160" y="744" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="160" dy="0"><tspan font-weight="bold" fill="#db8129">beyond one machine:</tspan> Slurm job arrays and srun, Kubernetes Jobs with completions,</tspan>
      <tspan x="160" dy="32">parallelism and indexed jobs, Ray remote functions and actors, Dask, Celery</tspan>
      <tspan x="160" dy="32">and RQ workers; at that scale idempotency, checkpointing and at-least-once</tspan>
      <tspan x="160" dy="32">semantics (a task may run more than once but must never be silently lost)</tspan>
      <tspan x="160" dy="32">matter more than the in-process model</tspan>
    </text>
  </g>

  

  <g id="bottom-bar">
    <rect x="40" y="935" width="1520" height="80" rx="14" fill="#207448"/>
    <text x="800" y="985" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Design for idempotency, checkpointing and at-least-once first, then choose the framework</text>
  </g>
</svg>