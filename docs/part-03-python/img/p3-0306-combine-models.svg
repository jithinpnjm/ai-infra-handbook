<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Bridges between the three models</title>
  <desc>Architecture infographic illustrating bridges between asyncio loop, thread pool, and process pool, along with multiprocess web servers, background tasks, and distributed execution.</desc>

  <defs>
    
    <marker id="arrow-right" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-left" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 11 2 L 1 7 L 11 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1360" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Bridges between the three models</text>

  
  <rect x="40" y="105" width="1520" height="565" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>

  
  <rect x="60" y="140" width="360" height="280" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(240, 215)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 0 -32 L 8 -24 L 0 -16" fill="#207448"/>
    <path d="M 0 32 L -8 24 L 0 16" fill="#207448"/>
    <circle cx="0" cy="0" r="6" fill="#207448"/>
    <path d="M 0 0 L 14 -10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="240" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">asyncio loop</text>

  
  <rect x="1180" y="140" width="360" height="280" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1360, 215)">
    <line x1="-28" y1="-28" x2="-28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="-28" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-28" cy="-8" r="6" fill="#207448"/>
    <circle cx="0" cy="10" r="6" fill="#207448"/>
    <circle cx="28" cy="-14" r="6" fill="#207448"/>
  </g>
  <text x="1360" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">thread pool</text>

  
  <rect x="1180" y="470" width="360" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1360, 525)">
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="-14" y="-14" width="10" height="10" fill="#207448"/>
    <rect x="4" y="-14" width="10" height="10" fill="#207448"/>
    <rect x="-14" y="4" width="10" height="10" fill="#207448"/>
    <rect x="4" y="4" width="10" height="10" fill="#207448"/>
    <line x1="-30" y1="-10" x2="-24" y2="-10" stroke="#207448" stroke-width="3"/>
    <line x1="-30" y1="10" x2="-24" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="-10" x2="30" y2="-10" stroke="#207448" stroke-width="3"/>
    <line x1="24" y1="10" x2="30" y2="10" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1360" y="605" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">process pool</text>

  
  
  <rect x="470" y="130" width="660" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">loop to thread:</text>
  <text x="800" y="196" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">await asyncio.to_thread(...)</text>
  
  <line x1="420" y1="230" x2="1175" y2="230" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  
  <rect x="450" y="260" width="700" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">thread to loop:</text>
  <text x="800" y="332" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">asyncio.run_coroutine_threadsafe(coro, loop)</text>
  <text x="800" y="366" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">and loop.call_soon_threadsafe</text>
  
  <line x1="1180" y1="405" x2="425" y2="405" stroke="#207448" stroke-width="3" marker-end="url(#arrow-left)"/>

  
  
  <rect x="450" y="460" width="700" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">loop to process pool:</text>
  <text x="800" y="530" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">await loop.run_in_executor(</text>
  <text x="800" y="564" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">process_pool, cpu_fn, data)</text>
  
  <path d="M 240 420 L 240 600 L 1175 600" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  <rect x="60" y="690" width="710" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 735)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#207448" stroke-width="3"/>
    <line x1="-10" y1="4" x2="10" y2="4" stroke="#207448" stroke-width="3"/>
    <circle cx="6" cy="-10" r="2" fill="#207448"/>
    <circle cx="6" cy="10" r="2" fill="#207448"/>
  </g>
  <text x="130" y="742" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Multiprocess web servers:</text>
  <text x="90" y="785" font-family="sans-serif" font-size="24" fill="#303a36">gunicorn or uvicorn workers each have their own</text>
  <text x="90" y="825" font-family="sans-serif" font-size="24" fill="#303a36">event loop, so they scale across cores; share state</text>
  <text x="90" y="865" font-family="sans-serif" font-size="24" fill="#303a36">through external stores such as Redis, not through</text>
  <text x="90" y="905" font-family="sans-serif" font-size="24" fill="#303a36">memory</text>

  
  <rect x="830" y="690" width="710" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(870, 735)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M -8 0 L -2 6 L 8 -6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="900" y="742" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">FastAPI BackgroundTasks:</text>
  <text x="860" y="800" font-family="sans-serif" font-size="24" fill="#303a36">short fire-and-forget work; for durable work</text>
  <text x="860" y="845" font-family="sans-serif" font-size="24" fill="#303a36">use real queues (chapter 3.7)</text>

  
  <rect x="60" y="955" width="1480" height="255" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(105, 1000)">
    <circle cx="-16" cy="-10" r="8" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="16" cy="-10" r="8" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="0" cy="14" r="8" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#db8129" stroke-width="2"/>
    <line x1="-12" y1="-3" x2="-4" y2="8" stroke="#db8129" stroke-width="2"/>
    <line x1="12" y1="-3" x2="4" y2="8" stroke="#db8129" stroke-width="2"/>
  </g>
  <text x="140" y="1008" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">beyond one machine:</text>
  <text x="90" y="1052" font-family="sans-serif" font-size="24" fill="#303a36">Slurm job arrays and srun, Kubernetes Jobs with completions, parallelism and indexed jobs,</text>
  <text x="90" y="1092" font-family="sans-serif" font-size="24" fill="#303a36">Ray remote functions and actors, Dask, Celery and RQ workers; at that scale idempotency,</text>
  <text x="90" y="1132" font-family="sans-serif" font-size="24" fill="#303a36">checkpointing and at-least-once semantics (a task may run more than once but must never</text>
  <text x="90" y="1172" font-family="sans-serif" font-size="24" fill="#303a36">be silently lost) matter more than the in-process model</text>

  
  <rect x="60" y="1235" width="1480" height="85" rx="12" fill="#207448"/>
  <text x="800" y="1288" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Design for idempotency, checkpointing and at-least-once first, then choose the framework</text>
</svg>