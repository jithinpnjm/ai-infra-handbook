<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Build, check, publish, install</title>
  <desc>Visual guide for building sdist and wheel packages, checking with twine, uploading to a private index, and installing with pip.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 z" fill="#db8129" />
    </marker>

    
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#143621" flood-opacity="0.07" />
    </filter>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Build, check, publish, install</text>

  
  
  

  
  <path d="M 240 520 L 290 520 L 290 350 L 348 350" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 240 520 L 290 520 L 290 755 L 348 755" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <rect x="75" y="246" width="260" height="54" rx="27" fill="#fff6ee" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />
  <text x="205" y="281" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">python -m build</text>

  
  <path d="M 670 350 L 695 350 L 695 480 L 718 480" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 670 755 L 695 755 L 695 560 L 718 560" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 880 520 L 928 520" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1090 520 L 1138 520" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1340 520 L 1388 520" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  
  
  <g transform="translate(40, 400)">
    <rect width="200" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(72, 36)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 12 L 20 12 L 26 18 L 52 18 A 4 4 0 0 1 56 22 L 56 46 A 4 4 0 0 1 52 50 L 4 50 A 4 4 0 0 1 0 46 L 0 16 A 4 4 0 0 1 4 12 Z" />
      <path d="M 22 30 L 16 35 L 22 40" />
      <path d="M 34 30 L 40 35 L 34 40" />
    </g>
    <text x="100" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">source</text>
    <text x="100" y="185" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(src/myops)</text>
  </g>

  
  
  
  <g transform="translate(350, 160)">
    <rect width="320" height="270" rx="16" fill="#e8f1ea" stroke="#8fa996" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(132, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="44" height="34" rx="3" />
      <path d="M 2 16 L 28 4 L 54 16" />
      <line x1="28" y1="4" x2="28" y2="28" />
      <line x1="20" y1="36" x2="36" y2="36" />
    </g>
    <text x="160" y="132" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">sdist</text>
    <text x="160" y="172" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">myops-0.3.1.tar.gz</text>
    <text x="160" y="214" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#586761">needs compilers,</text>
    <text x="160" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#586761">slower</text>
  </g>

  
  
  
  <g transform="translate(350, 600)">
    
    <rect width="320" height="310" rx="16" fill="#daf0e0" stroke="#207448" stroke-width="4" filter="url(#card-shadow)" />
    
    <g transform="translate(132, 26)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <circle cx="28" cy="28" r="8" fill="#daf0e0" />
      <line x1="28" y1="4" x2="28" y2="20" />
      <line x1="28" y1="36" x2="28" y2="52" />
      <line x1="4" y1="28" x2="20" y2="28" />
      <line x1="36" y1="28" x2="52" y2="28" />
      <line x1="11" y1="11" x2="22" y2="22" />
      <line x1="34" y1="34" x2="45" y2="45" />
      <line x1="11" y1="45" x2="22" y2="34" />
      <line x1="34" y1="22" x2="45" y2="11" />
    </g>
    <text x="160" y="126" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">wheel</text>
    <text x="160" y="164" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">myops-0.3.1-</text>
    <text x="160" y="196" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">py3-none-any.whl</text>
    <text x="160" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">prebuilt zip,</text>
    <text x="160" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">no build step, fast</text>
  </g>

  
  
  
  <g transform="translate(720, 400)">
    <rect width="160" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(52, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 4 14 L 4 28 C 4 42 14 52 28 56 C 42 52 52 42 52 28 L 52 14 Z" />
      <path d="M 18 28 L 25 35 L 38 20" />
    </g>
    <text x="80" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">twine</text>
    <text x="80" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">check</text>
  </g>

  
  
  
  <g transform="translate(930, 400)">
    <rect width="160" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(52, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 42 A 12 12 0 0 1 12 20 A 16 16 0 0 1 42 16 A 12 12 0 0 1 48 42 Z" />
      <polyline points="22 30 28 22 34 30" />
      <line x1="28" y1="22" x2="28" y2="46" />
    </g>
    <text x="80" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">twine</text>
    <text x="80" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">upload</text>
  </g>

  
  
  
  <g transform="translate(1140, 400)">
    <rect width="200" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(72, 34)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      
      <ellipse cx="28" cy="14" rx="24" ry="8" />
      <path d="M 4 14 L 4 28 C 4 32.4 14.7 36 28 36 C 41.3 36 52 32.4 52 28 L 52 14" />
      <path d="M 4 28 L 4 42 C 4 46.4 14.7 50 28 50 C 41.3 50 52 46.4 52 42 L 52 28" />
      
      <rect x="36" y="32" width="18" height="16" rx="3" fill="#e8f1ea" />
      <path d="M 40 32 L 40 26 A 5 5 0 0 1 50 26 L 50 32" />
    </g>
    <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">a private</text>
    <text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">index</text>
  </g>

  
  
  
  <g transform="translate(1390, 400)">
    <rect width="170" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(57, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="44" height="38" rx="4" />
      <polyline points="20 28 28 36 36 28" />
      <line x1="28" y1="12" x2="28" y2="36" />
    </g>
    <text x="85" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pip</text>
    <text x="85" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">install</text>
  </g>

</svg>