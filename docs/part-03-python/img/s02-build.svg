<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Build, check, publish, install</title>
  <desc>Visual explanation of the Python package lifecycle: building source into sdist and wheel artifacts, checking with twine, uploading to a private index, and installing via pip.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Build, check, publish, install</text>

  
  
  <path d="M 205 470 L 295 470" stroke="#207448" stroke-width="4" fill="none" />
  <path d="M 295 470 L 295 300 L 385 300" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M 295 470 L 295 640 L 385 640" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  
  <rect x="208" y="398" width="84" height="60" rx="8" fill="#e8f1ea" />
  <text x="250" y="424" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">python</text>
  <text x="250" y="450" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">-m build</text>

  
  <path d="M 705 300 L 725 300 L 725 470 L 745 470" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M 705 640 L 725 640 L 725 470" stroke="#207448" stroke-width="4" fill="none" />

  
  <path d="M 915 470 L 955 470" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 1125 470 L 1165 470" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  
  <path d="M 1360 470 L 1400 470" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  
  <rect x="35" y="240" width="170" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="120" cy="285" r="24" fill="#207448" />
  <text x="120" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(92, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 14 L 20 14 L 26 22 L 52 22 A 4 4 0 0 1 56 26 L 56 48 A 4 4 0 0 1 52 52 L 4 52 A 4 4 0 0 1 0 48 L 0 18 A 4 4 0 0 1 4 14 Z" />
    <line x1="16" y1="34" x2="40" y2="34" />
    <line x1="16" y1="42" x2="32" y2="42" />
  </g>
  
  <text x="120" y="445" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">source</text>
  
  <rect x="47" y="475" width="146" height="44" rx="8" fill="#e8f1ea" />
  <text x="120" y="505" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">src/myops</text>

  
  <rect x="385" y="150" width="320" height="300" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="430" cy="195" r="24" fill="#207448" />
  <text x="430" y="203" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(545, 167)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28,2 54,16 54,46 28,58 2,46 2,16" />
    <line x1="2" y1="16" x2="28" y2="30" />
    <line x1="54" y1="16" x2="28" y2="30" />
    <line x1="28" y1="30" x2="28" y2="58" />
  </g>
  
  <text x="545" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">sdist</text>
  
  <rect x="401" y="285" width="288" height="42" rx="8" fill="#e8f1ea" />
  <text x="545" y="314" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">myops-0.3.1.tar.gz</text>
  
  <text x="545" y="365" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="545" dy="0">needs compilers,</tspan>
    <tspan x="545" dy="32">slower</tspan>
  </text>

  
  <rect x="385" y="490" width="320" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  
  <circle cx="430" cy="535" r="24" fill="#207448" />
  <text x="430" y="543" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(545, 507)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <circle cx="28" cy="28" r="8" />
    <line x1="28" y1="4" x2="28" y2="20" />
    <line x1="28" y1="36" x2="28" y2="52" />
    <line x1="4" y1="28" x2="20" y2="28" />
    <line x1="36" y1="28" x2="52" y2="28" />
  </g>
  
  <text x="545" y="605" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">wheel</text>
  
  <rect x="401" y="625" width="288" height="66" rx="8" fill="#ffffff" />
  <text x="545" y="652" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="545" dy="0">myops-0.3.1-</tspan>
    <tspan x="545" dy="28">py3-none-any.whl</tspan>
  </text>
  
  <text x="545" y="725" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="545" dy="0">prebuilt zip,</tspan>
    <tspan x="545" dy="32">no build step, fast</tspan>
  </text>

  
  <rect x="745" y="240" width="170" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="830" cy="285" r="24" fill="#207448" />
  <text x="830" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(802, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 4 L 52 14 L 52 30 C 52 44 28 54 28 54 C 28 54 4 44 4 30 L 4 14 Z" />
    <polyline points="18,28 26,36 38,20" />
  </g>
  
  <text x="830" y="445" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="830" dy="0">twine</tspan>
    <tspan x="830" dy="38">check</tspan>
  </text>

  
  <rect x="955" y="240" width="170" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="1040" cy="285" r="24" fill="#207448" />
  <text x="1040" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1012, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 40 A 14 14 0 0 1 18 16 A 18 18 0 0 1 50 22 A 12 12 0 0 1 46 44 L 10 44" />
    <polyline points="20,28 28,20 36,28" />
    <line x1="28" y1="20" x2="28" y2="42" />
  </g>
  
  <text x="1040" y="445" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1040" dy="0">twine</tspan>
    <tspan x="1040" dy="38">upload</tspan>
  </text>

  
  <rect x="1165" y="240" width="195" height="460" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  <circle cx="1262" cy="285" r="24" fill="#db8129" />
  <text x="1262" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(1234, 335)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="12" rx="22" ry="8" />
    <path d="M 6 12 L 6 36 C 6 42 28 46 28 46 C 28 46 50 42 50 36 L 50 12" />
    <path d="M 6 24 C 6 30 28 34 28 34 C 28 34 50 30 50 24" />
    
    <circle cx="28" cy="26" r="3" fill="#db8129" />
  </g>
  
  <text x="1262" y="445" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1262" dy="0">a private</tspan>
    <tspan x="1262" dy="38">index</tspan>
  </text>

  
  <rect x="1400" y="240" width="165" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="1482" cy="285" r="24" fill="#207448" />
  <text x="1482" y="293" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  
  <g transform="translate(1454, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <polyline points="18,24 28,34 38,24" />
    <line x1="28" y1="14" x2="28" y2="34" />
    <line x1="14" y1="42" x2="42" y2="42" />
  </g>
  
  <text x="1482" y="445" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1482" dy="0">pip</tspan>
    <tspan x="1482" dy="38">install</tspan>
  </text>
</svg>