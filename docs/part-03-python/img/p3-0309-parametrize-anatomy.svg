<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" width="1600" height="1030">
  <title>One parametrised test replaces four pasted copies</title>
  <desc>Visual explanation of pytest parameterization replacing repetitive test cases</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1030" fill="#f5f8f5" />

  
  <text x="40" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">One parametrised test replaces four pasted copies</text>

  
  <g id="discovery-strip">
    <rect x="40" y="105" width="1520" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 120)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="30" y1="30" x2="44" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 14 20 L 26 20 M 20 14 L 20 26" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="130" y="142">pytest picks up test_*.py or *_test.py files, test_* functions, and Test* classes with no __init__; </tspan>
      <tspan x="130" dy="32">plain assert statements are rewritten to show a detailed diff</tspan>
    </text>
  </g>

  
  <g id="left-column">
    
    <rect x="40" y="215" width="480" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 230)">
      <rect x="0" y="0" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="0" y1="8" x2="36" y2="8" stroke="#207448" stroke-width="2" />
      <circle cx="6" cy="4" r="1.5" fill="#207448" />
      <circle cx="12" cy="4" r="1.5" fill="#207448" />
      <circle cx="18" cy="4" r="1.5" fill="#207448" />
    </g>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="65" y="290">@pytest.mark.parametrize(</tspan>
      <tspan x="90" dy="34">"temp,bad", [</tspan>
      <tspan x="90" dy="34">(84, False), (85, False), </tspan>
      <tspan x="90" dy="34">(86, True), (None, False)])</tspan>
    </text>

    
    <path d="M 280 410 L 280 460" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="40" y="470" width="480" height="425" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(60, 488)">
      <circle cx="16" cy="16" r="8" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 16 2 L 16 6 M 16 26 L 16 30 M 2 16 L 6 16 M 26 16 L 30 16 M 6 6 L 9 9 M 23 23 L 26 26 M 6 26 L 9 23 M 23 9 L 26 6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="65" y="555">def test_temperature_threshold(</tspan>
      <tspan x="95" dy="36">temp, bad): </tspan>
      <tspan x="95" dy="36">problems = evaluate([</tspan>`
      <tspan x="115" dy="36">gpu(i, temp=temp) </tspan>
      <tspan x="115" dy="36">for i in range(8)]); </tspan>
      <tspan x="95" dy="36">assert bool(problems) is bad</tspan>
    </text>
  </g>

  
  <g id="fan-out-arrows">
    
    <path d="M 520 540 C 535 540 540 275 552 275" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    
    <path d="M 520 565 C 535 565 540 397 552 397" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
    
    <path d="M 520 590 C 535 590 540 520 552 520" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
    
    <path d="M 520 615 C 535 615 540 642 552 642" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="middle-column">
    
    <rect x="560" y="235" width="430" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="585" y="283" font-family="sans-serif" font-size="24" fill="#303a36">temp 84: no problem</text>

    
    <rect x="560" y="340" width="430" height="115" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <rect x="560" y="340" width="10" height="115" rx="4" fill="#db8129" />
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" y="385">temp 85: no problem </tspan>
      <tspan x="585" dy="32">(the threshold is above 85)</tspan>
    </text>

    
    <rect x="560" y="480" width="430" height="80" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <rect x="560" y="480" width="10" height="80" rx="4" fill="#db8129" />
    <text x="585" y="528" font-family="sans-serif" font-size="24" fill="#303a36">temp 86: problem</text>

    
    <rect x="560" y="585" width="430" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" y="630">temp None: no problem </tspan>
      <tspan x="585" dy="32">([N/A] is missing, not hot)</tspan>
    </text>

    
    <rect x="560" y="730" width="430" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    
    <g transform="translate(578, 760)">
      <path d="M 0 12 L 12 0 L 24 0 L 24 12 L 12 24 Z" fill="none" stroke="#207448" stroke-width="2" />
      <circle cx="16" cy="6" r="2" fill="#207448" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="620" y="768" font-family="monospace" font-weight="bold" fill="#207448">ids= </tspan>
      <tspan x="620" dy="32">gives readable case names</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="1030" y="215" width="530" height="680" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1055, 235)">
      <rect x="0" y="0" width="34" height="42" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="8" y1="12" x2="26" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="8" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="8" y1="28" x2="18" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="1110" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Neighbouring tests</text>

    
    <rect x="1055" y="295" width="480" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1075" y="338" font-weight="bold">test_healthy_node: </tspan>
      <tspan x="1075" dy="34">evaluate of 8 healthy </tspan>
      <tspan x="1075" dy="30">GPUs == []</tspan>
    </text>

    
    <rect x="1055" y="435" width="480" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1075" y="475" font-weight="bold">test_missing_gpu_reported: </tspan>
      <tspan x="1075" dy="34">7 GPUs gives </tspan>
      <tspan x="1075" dy="34">[expected 8 GPUs, found 7]</tspan>
    </text>

    
    <rect x="1055" y="600" width="480" height="270" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1075" y="642" font-weight="bold">test_raises_on_bad_input: </tspan>
      <tspan x="1075" dy="34">pytest.raises(ValueError, </tspan>
      <tspan x="1075" dy="34">match=unexpected nvidia-smi </tspan>
      <tspan x="1075" dy="34">columns) for </tspan>
      <tspan x="1075" dy="34">parse_smi_csv(0,H100,60)</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="920" width="1520" height="75" rx="10" fill="#207448" />
    
    <g transform="translate(360, 938)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#ffffff" stroke-width="3" />
      <polyline points="12,20 18,26 28,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="800" y="967" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Each row in the list becomes its own test case</text>
  </g>
</svg>