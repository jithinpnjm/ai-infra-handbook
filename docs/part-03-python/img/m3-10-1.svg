<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Tensors and devices</title>
  <desc>Data flow and memory hierarchy from storage through host memory and GPU HBM to execution step</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="100" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Tensors and devices</text>

  
  <rect x="100" y="110" width="1400" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="150" cy="165" r="24" fill="#207448" />
  <text x="150" y="165" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  
  <g transform="translate(196, 137)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="12" rx="24" ry="8" />
    <path d="M 4 12 v 16 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -16" />
    <path d="M 4 28 v 16 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -16" />
  </g>

  
  <text x="280" y="174" font-family="system-ui, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Storage: <tspan font-family="ui-monospace, monospace" font-size="28px" font-weight="normal">Parquet / WebDataset / np.memmap</tspan></text>

  
  <line x1="260" y1="220" x2="260" y2="368" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="310" y="242" width="700" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="336" y="279" font-family="ui-monospace, monospace" font-size="25px" font-weight="bold" fill="#207448">DataLoader num_workers=8</text>
  <text x="336" y="316" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">(OMP_NUM_THREADS=1)</text>

  
  <rect x="100" y="370" width="1400" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="150" cy="440" r="24" fill="#207448" />
  <text x="150" y="440" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

  
  <g transform="translate(196, 412)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="48" height="34" rx="3" />
    <rect x="10" y="16" width="8" height="12" fill="#207448" />
    <rect x="24" y="16" width="8" height="12" fill="#207448" />
    <rect x="38" y="16" width="8" height="12" fill="#207448" />
    <line x1="10" y1="44" x2="10" y2="50" stroke-width="3" />
    <line x1="18" y1="44" x2="18" y2="50" stroke-width="3" />
    <line x1="26" y1="44" x2="26" y2="50" stroke-width="3" />
    <line x1="38" y1="44" x2="38" y2="50" stroke-width="3" />
    <line x1="46" y1="44" x2="46" y2="50" stroke-width="3" />
  </g>

  
  <text x="280" y="426" font-family="system-ui, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Host DRAM: Pinned Memory</text>
  <text x="280" y="470" font-family="ui-monospace, monospace" font-size="25px" fill="#303a36">(pin_memory=True, /dev/shm)</text>

  
  <line x1="260" y1="510" x2="260" y2="658" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="310" y="532" width="700" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="336" y="569" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#207448">PCIe / NVLink-C2C DMA</text>
  <text x="336" y="606" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">to(dev, non_blocking=True)</text>

  
  <rect x="100" y="660" width="1400" height="156" rx="16" fill="#fef8f0" stroke="#db8129" stroke-width="3" />

  
  <circle cx="150" cy="738" r="24" fill="#db8129" />
  <text x="150" y="738" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>

  
  <g transform="translate(196, 710)" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="52" height="52" rx="4" />
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#fef8f0" />
    <rect x="6" y="6" width="7" height="12" fill="#db8129" />
    <rect x="6" y="38" width="7" height="12" fill="#db8129" />
    <rect x="43" y="6" width="7" height="12" fill="#db8129" />
    <rect x="43" y="38" width="7" height="12" fill="#db8129" />
  </g>

  
  <text x="280" y="722" font-family="system-ui, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">GPU HBM: Weights (2B) + Grads (2B)</text>
  <text x="280" y="770" font-family="ui-monospace, monospace" font-size="25px" font-weight="bold" fill="#db8129">+ FP32 Adam (12B) = 16B/param + Activations</text>

  
  <line x1="260" y1="816" x2="260" y2="964" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="310" y="838" width="700" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="336" y="875" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#207448">Async CUDA Kernels</text>
  <text x="336" y="912" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">(torch.autocast bf16, torch.compile)</text>

  
  <rect x="100" y="966" width="1400" height="114" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="150" cy="1023" r="24" fill="#207448" />
  <text x="150" y="1023" font-family="system-ui, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>

  
  <g transform="translate(196, 995)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="14" />
    <circle cx="28" cy="28" r="6" />
    <path d="M 28 6 v 5 M 28 45 v 5 M 6 28 h 5 M 45 28 h 5 M 12 12 l 4 4 M 40 40 l 4 4 M 12 44 l 4 -4 M 40 12 l 4 4" stroke-width="3.5" />
  </g>

  
  <text x="280" y="1032" font-family="ui-monospace, monospace" font-size="27px" font-weight="bold" fill="#303a36">Forward -&gt; Backward -&gt; clip_grad_norm_ -&gt; opt.step()</text>
</svg>