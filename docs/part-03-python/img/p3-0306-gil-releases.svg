<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What the GIL releases, what it does not, and what it still lets break</title>
  <desc>Visual infographic explaining what operations release Python's Global Interpreter Lock, what operations hold it, and concurrency pitfalls that remain unprotected.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">What the GIL releases, what it does not,</tspan>
    <tspan x="800" dy="56">and what it still lets break</tspan>
  </text>

  
  <g id="col-released">
    
    <rect x="50" y="150" width="480" height="565" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="50" y="150" width="480" height="80" rx="16" fill="#e8f1ea" />
    <rect x="50" y="214" width="480" height="16" fill="#e8f1ea" />

    
    <g transform="translate(75, 162)">
      <rect x="6" y="24" width="44" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 24 V 16 A 12 12 0 0 1 40 16 V 20" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="39" r="3" fill="#207448" />
    </g>
    
    <text x="145" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Released during</text>

    
    <rect x="70" y="245" width="440" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="90" y="278" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">blocking I/O: socket calls,</tspan>
      <tspan x="90" dy="32">file reads, time.sleep,</tspan>
      <tspan x="90" dy="32">subprocess waits</tspan>
    </text>

    
    <rect x="70" y="375" width="440" height="175" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="90" y="410" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">long native computations:</tspan>
      <tspan x="90" dy="30">NumPy, hashlib on large</tspan>
      <tspan x="90" dy="30">buffers, compression, regex</tspan>
      <tspan x="90" dy="30">in some cases, PyTorch ops,</tspan>
      <tspan x="90" dy="30">zlib, bz2</tspan>
    </text>

    
    <line x1="290" y1="550" x2="290" y2="578" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="70" y="580" width="440" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="290" y="632" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="290" dy="0">threads speed up</tspan>
      <tspan x="290" dy="32">I/O-bound and native-heavy code</tspan>
    </text>
  </g>

  
  <g id="col-held">
    
    <rect x="560" y="150" width="480" height="565" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="560" y="150" width="480" height="80" rx="16" fill="#e8f1ea" />
    <rect x="560" y="214" width="480" height="16" fill="#e8f1ea" />

    
    <g transform="translate(585, 162)">
      <rect x="6" y="24" width="44" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 24 V 16 A 12 12 0 0 1 40 16 V 24" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="39" r="3" fill="#207448" />
    </g>
    
    <text x="655" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Held during</text>

    
    <rect x="580" y="245" width="440" height="305" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(772, 320)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="14" y="14" width="28" height="28" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <line x1="14" y1="-8" x2="14" y2="0" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="-8" x2="28" y2="0" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="-8" x2="42" y2="0" stroke="#207448" stroke-width="4" />
      <line x1="14" y1="56" x2="14" y2="64" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="56" x2="28" y2="64" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="56" x2="42" y2="64" stroke="#207448" stroke-width="4" />
      <line x1="-8" y1="14" x2="0" y2="14" stroke="#207448" stroke-width="4" />
      <line x1="-8" y1="28" x2="0" y2="28" stroke="#207448" stroke-width="4" />
      <line x1="-8" y1="42" x2="0" y2="42" stroke="#207448" stroke-width="4" />
      <line x1="56" y1="14" x2="64" y2="14" stroke="#207448" stroke-width="4" />
      <line x1="56" y1="28" x2="64" y2="28" stroke="#207448" stroke-width="4" />
      <line x1="56" y1="42" x2="64" y2="42" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="800" y="445" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">pure-Python CPU work</text>

    
    <line x1="800" y1="550" x2="800" y2="578" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="580" y="580" width="440" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="622" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">threads do not speed it up and</tspan>
      <tspan x="800" dy="30">can slow it down through</tspan>
      <tspan x="800" dy="30">contention and switching</tspan>
    </text>
  </g>

  
  <g id="col-not-protected">
    
    <rect x="1070" y="150" width="480" height="565" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <rect x="1070" y="150" width="480" height="80" rx="16" fill="#fdf3eb" />
    <rect x="1070" y="214" width="480" height="16" fill="#fdf3eb" />

    
    <g transform="translate(1095, 162)">
      <path d="M 28 6 L 50 14 C 50 36 38 48 28 54 C 18 48 6 36 6 14 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="42" r="2.5" fill="#db8129" />
    </g>
    
    <text x="1165" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Not protected</text>

    
    <rect x="1090" y="245" width="440" height="305" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="1.5" />
    <text x="1110" y="320" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1110" dy="0">x += 1 and a check-then-act</tspan>
      <tspan x="1110" dy="34">on a dict can still race</tspan>
      <tspan x="1110" dy="34">because individual bytecodes</tspan>
      <tspan x="1110" dy="34">are atomic-ish but compound</tspan>
      <tspan x="1110" dy="34">operations are not</tspan>
    </text>

    
    <line x1="1310" y1="550" x2="1310" y2="578" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="1090" y="580" width="440" height="120" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="2" />
    <text x="1310" y="632" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="1310" dy="0">the GIL does not remove</tspan>
      <tspan x="1310" dy="32">the need for locks</tspan>
    </text>
  </g>

  
  <g id="strip-why">
    <rect x="50" y="735" width="1500" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(75, 747)">
      <circle cx="18" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="32" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="28" x2="42" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="50" y1="28" x2="50" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="155" y="784" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the GIL keeps reference counting safe and C extensions simpler to write</text>
  </g>

  
  <g id="strip-roadmap">
    <rect x="50" y="830" width="1500" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(75, 872)">
      <line x1="28" y1="52" x2="28" y2="4" stroke="#207448" stroke-width="4" />
      <path d="M 28 32 Q 28 16 10 12" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="10" cy="12" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <path d="M 28 24 Q 28 12 46 8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="46" cy="8" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    </g>
    <text x="155" y="872" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">free-threaded CPython (PEP 703): optional build python3.13t, experimental from 3.13;</tspan>
      <tspan x="155" dy="34">subinterpreters (PEP 684 and PEP 734): own GIL each, concurrent.interpreters arrives in 3.14;</tspan>
      <tspan x="155" dy="34">other routes: processes, Cython, Numba, Rust through PyO3, NumPy, pandas, PyTorch</tspan>
    </text>
  </g>

  
  <g id="strip-production">
    <rect x="50" y="985" width="1500" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(75, 1012)">
      <rect x="4" y="4" width="48" height="14" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="11" r="2" fill="#207448" />
      <circle cx="18" cy="11" r="2" fill="#207448" />
      <rect x="4" y="22" width="48" height="14" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="29" r="2" fill="#207448" />
      <circle cx="18" cy="29" r="2" fill="#207448" />
      <rect x="4" y="40" width="48" height="14" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="47" r="2" fill="#207448" />
      <circle cx="18" cy="47" r="2" fill="#207448" />
    </g>
    <text x="155" y="1034" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">gunicorn, uWSGI or uvicorn preforks one worker per core behind NGINX or Envoy;</tspan>
      <tspan x="155" dy="34">shared state moves to Redis, PostgreSQL, Celery or RabbitMQ</tspan>
    </text>
  </g>

  
  <g id="strip-takeaway">
    <rect x="50" y="1110" width="1500" height="70" rx="10" fill="#207448" />
    <text x="800" y="1154" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Threads help when the thread is waiting or the work is native, not when pure Python computes</text>
  </g>
</svg>