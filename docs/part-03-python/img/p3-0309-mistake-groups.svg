<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Common testing mistakes in five groups</title>
  <desc>Visual table categorizing common testing mistakes and their fixes across five groups: Reaching outside, Mocking, Coverage and flakiness, CI, and Contracts other tools rely on.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Common testing mistakes in five groups</text>

  
  <g id="table-headers">
    <rect x="40" y="95" width="300" height="50" rx="8" fill="#207448" />
    <text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Group</text>

    <rect x="360" y="95" width="680" height="50" rx="8" fill="#207448" />
    <text x="700" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Mistakes</text>

    <rect x="1060" y="95" width="500" height="50" rx="8" fill="#207448" />
    <text x="1310" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Fix</text>
  </g>

  
  <g id="row-1">
    
    <rect x="40" y="160" width="300" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(162, 175)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <ellipse cx="28" cy="28" rx="12" ry="24" />
      <line x1="4" y1="28" x2="52" y2="28" />
      <path d="M42 14 L54 6 M54 6 L44 6 M54 6 L54 16" stroke-width="3" />
    </g>
    <text x="190" y="275" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Reaching outside</text>

    
    <rect x="360" y="160" width="680" height="165" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
    <text x="385" y="215" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">tests that call real networks, clocks or</tspan>
      <tspan x="385" dy="34">hardware; depend on execution order;</tspan>
      <tspan x="385" dy="34">leak global state; <tspan font-family="monospace">sleep(10)</tspan></tspan>
    </text>

    
    <rect x="1060" y="160" width="500" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1085" y="200" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">fakes, injected clock, poll</tspan>
      <tspan x="1085" dy="32">with a timeout; if a test</tspan>
      <tspan x="1085" dy="32">behaves differently on one</tspan>
      <tspan x="1085" dy="32">machine, check this group first</tspan>
    </text>
  </g>

  
  <g id="row-2">
    
    <rect x="40" y="345" width="300" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(162, 357)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8 C12 8 28 4 44 8 C48 24 44 42 28 48 C12 42 8 24 12 8 Z" />
      <circle cx="20" cy="20" r="3" fill="#207448" />
      <circle cx="36" cy="20" r="3" fill="#207448" />
      <path d="M22 34 Q28 40 34 34" />
    </g>
    <text x="190" y="450" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Mocking</text>

    
    <rect x="360" y="345" width="680" height="145" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
    <text x="385" y="392" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">over-mocking asserts on call internals</tspan>
      <tspan x="385" dy="34">so a refactor breaks tests; patching the</tspan>
      <tspan x="385" dy="34">wrong import path; leaving out <tspan font-family="monospace">autospec</tspan></tspan>
    </text>

    
    <rect x="1060" y="345" width="500" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1085" y="410" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">fakes, patch the lookup site,</tspan>
      <tspan x="1085" dy="34" font-family="monospace">autospec</tspan>
    </text>
  </g>

  
  <g id="row-3">
    
    <rect x="40" y="510" width="300" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(162, 520)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <circle cx="28" cy="28" r="14" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <path d="M28 4 L28 10 M28 46 L28 52 M4 28 L10 28 M46 28 L52 28" />
    </g>
    <text x="190" y="618" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="190" dy="0">Coverage and</tspan>
      <tspan x="190" dy="32">flakiness</tspan>
    </text>

    
    <rect x="360" y="510" width="680" height="165" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
    <text x="385" y="550" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">chasing a global percentage while</tspan>
      <tspan x="385" dy="32">asserting nothing; ignoring branch</tspan>
      <tspan x="385" dy="32">coverage and error paths; retrying</tspan>
      <tspan x="385" dy="32">flaky tests blindly; ignoring warnings</tspan>
    </text>

    
    <rect x="1060" y="510" width="500" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1085" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">branch coverage, fix the cause,</tspan>
      <tspan x="1085" dy="34">warnings as signal</tspan>
    </text>
  </g>

  
  <g id="row-4">
    
    <rect x="40" y="695" width="300" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(162, 715)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="28" r="8" />
      <circle cx="42" cy="14" r="8" />
      <circle cx="42" cy="42" r="8" />
      <path d="M21 24 L35 17 M21 32 L35 39" />
    </g>
    <text x="190" y="810" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CI</text>

    
    <rect x="360" y="695" width="680" height="195" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <text x="385" y="734" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">runs only on main; checks not required;</tspan>
      <tspan x="385" dy="31">unpinned actions and dependencies;</tspan>
      <tspan x="385" dy="31">secrets exposed to fork PRs; mixing</tspan>
      <tspan x="385" dy="31"><tspan font-family="monospace">black</tspan> and <tspan font-family="monospace">ruff</tspan> format; type checking</tspan>
      <tspan x="385" dy="31">only in the editor</tspan>
    </text>

    
    <rect x="1060" y="695" width="500" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1085" y="765" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">required checks, pins,</tspan>
      <tspan x="1085" dy="34">no secrets for forks,</tspan>
      <tspan x="1085" dy="34">one formatter, <tspan font-family="monospace">mypy</tspan> in CI</tspan>
    </text>
  </g>

  
  <g id="row-5">
    
    <rect x="40" y="910" width="300" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(162, 920)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 L36 4 L44 12 L44 50 L12 50 Z" />
      <path d="M36 4 L36 12 L44 12" />
      <line x1="20" y1="22" x2="36" y2="22" />
      <line x1="20" y1="30" x2="36" y2="30" />
      <circle cx="34" cy="40" r="5" />
    </g>
    <text x="190" y="1015" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="190" dy="0">Contracts other</tspan>
      <tspan x="190" dy="30">tools rely on</tspan>
    </text>

    
    <rect x="360" y="910" width="680" height="165" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
    <text x="385" y="948" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="385" dy="0">a CLI with no tests for exit codes or</tspan>
      <tspan x="385" dy="32">the <tspan font-family="monospace">stdout</tspan> and <tspan font-family="monospace">stderr</tspan> split; recorded</tspan>
      <tspan x="385" dy="32">fixtures never refreshed so tests pass</tspan>
      <tspan x="385" dy="32">against an API that no longer exists</tspan>
    </text>

    
    <rect x="1060" y="910" width="500" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1085" y="980" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">test exit codes,</tspan>
      <tspan x="1085" dy="34">refresh fixtures</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1095" width="1520" height="65" rx="10" fill="#207448" />
    <text x="800" y="1138" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Read this list before your next pull request</text>
  </g>
</svg>