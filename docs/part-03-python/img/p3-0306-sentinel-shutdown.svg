<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Producer and consumers shut down with sentinels and task_done</title>
  <desc>Visual explanation of Python queue producer-consumer shutdown using sentinels and task_done</desc>

  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M 0 3 L 15 9 L 0 15 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M 0 3 L 15 9 L 0 15 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Producer and consumers shut down with sentinels and task_done</text>

  
  <rect x="40" y="78" width="1520" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(62, 88)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 8 16 L 18 10 L 28 16 L 28 28 C 28 36 18 42 18 42 C 18 42 8 36 8 28 Z"/>
    <circle cx="18" cy="25" r="3" fill="#207448"/>
  </g>
  <text x="110" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#207448">SENTINEL = object(): nothing else can equal it</text>

  
  <rect x="40" y="160" width="450" height="380" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 180)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="16"/>
    <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11"/>
  </g>
  <rect x="60" y="250" width="410" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="75" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="75" dy="0">producer(items):</tspan>
    <tspan x="95" dy="32">for it in items:</tspan>
    <tspan x="115" dy="32">q.put(it)</tspan>
  </text>
  <rect x="60" y="395" width="410" height="125" rx="8" fill="#fdfdfd" stroke="#207448" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="75" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">blocks when the queue holds</tspan>
    <tspan x="75" dy="32">100 items (maxsize=100)</tspan>
    <tspan x="75" dy="32">which is the backpressure</tspan>
  </text>

  
  <line x1="490" y1="350" x2="538" y2="350" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="540" y="160" width="420" height="380" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(722, 180)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="24" ry="10"/>
    <path d="M 4 14 L 4 42 C 4 48 14 54 28 54 C 42 54 52 48 52 42 L 52 14"/>
    <path d="M 4 28 C 4 34 14 40 28 40 C 42 40 52 34 52 28"/>
  </g>
  <rect x="560" y="255" width="380" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="2" stroke-dasharray="3 3">
    <line x1="623" y1="255" x2="623" y2="340"/>
    <line x1="686" y1="255" x2="686" y2="340"/>
    <line x1="750" y1="255" x2="750" y2="340"/>
    <line x1="813" y1="255" x2="813" y2="340"/>
    <line x1="876" y1="255" x2="876" y2="340"/>
  </g>
  <rect x="560" y="375" width="380" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="750" y="419" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="bold" fill="#207448">queue.Queue(maxsize=100)</text>

  
  <line x1="960" y1="350" x2="1008" y2="350" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1030" y="150" width="530" height="380" rx="12" fill="#dce9de" stroke="#207448" stroke-width="1.5"/>
  <rect x="1020" y="155" width="530" height="380" rx="12" fill="#e2ede4" stroke="#207448" stroke-width="1.5"/>
  <rect x="1010" y="160" width="530" height="380" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1035, 180)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="20" r="12"/>
    <path d="M 10 48 C 10 38 18 34 28 34 C 38 34 46 38 46 48"/>
    <path d="M 44 14 A 20 20 0 1 1 12 14" stroke-dasharray="6 4"/>
  </g>
  <rect x="1030" y="250" width="490" height="260" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1050" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1050" dy="0">consumer:</tspan>
    <tspan x="1070" dy="36">while (item := q.get())</tspan>
    <tspan x="1090" dy="36">is not SENTINEL:</tspan>
    <tspan x="1110" dy="36">try handle(item)</tspan>
    <tspan x="1110" dy="36">finally q.task_done()</tspan>
  </text>

  
  <rect x="40" y="560" width="1520" height="175" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <rect x="65" y="580" width="430" height="50" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="80" y="614" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">puts one SENTINEL per consumer</text>
  <rect x="65" y="645" width="590" height="60" rx="8" fill="#fdfdfd" stroke="#207448" stroke-width="1.5"/>
  <text x="80" y="683" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">for _ in range(N_CONSUMERS): q.put(SENTINEL)</text>
  <line x1="670" y1="675" x2="838" y2="675" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="855" y="610" width="675" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="875" y="667" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">so each consumer sees exactly one and exits its loop</text>

  
  <rect x="40" y="755" width="1520" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 777)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="23" cy="23" r="18"/>
    <path d="M 14 23 L 20 29 L 32 17"/>
  </g>
  <text x="125" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">task_done() marks each item finished, so join() can tell when all the work is complete</text>

  
  <rect x="40" y="865" width="1520" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(65, 897)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="8" width="38" height="30" rx="6"/>
    <path d="M 14 23 L 32 23 M 26 17 L 32 23 L 26 29"/>
  </g>
  <text x="125" y="912" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" dy="0">asyncio version: bounded Queue(maxsize), await q.put() waits while full,</tspan>
    <tspan x="125" dy="34">q.join() waits until all queued items are processed</tspan>
  </text>

  
  <rect x="40" y="995" width="1520" height="70" rx="8" fill="#207448"/>
  <text x="800" y="1039" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">One sentinel per consumer tells each of them that no work is left</text>
</svg>