<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>A multi-target exporter: how /probe?target= gets filled in</title>
  <desc>Visual explanation of Prometheus relabeling steps for multi-target exporters like blackbox_exporter and snmp_exporter.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>

    
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">A multi-target exporter: how /probe?target= gets filled in</text>

  

  
  <g filter="url(#shadow)">
    <rect x="50" y="95" width="900" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(80, 132)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="14" />
      <path d="M28 4 v8 M28 44 v8 M4 28 h8 M44 28 h8 M11 11 l6 6 M39 39 l6 6 M11 45 l6-6 M39 17 l6-6" stroke-linecap="round" />
    </g>
    
    <text x="160" y="138" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Prometheus job 'bmc'</text>
    <text x="160" y="178" font-family="monospace" font-size="25" fill="#303a36">metrics_path /probe</text>
    <text x="160" y="212" font-family="monospace" font-size="25" fill="#303a36">and static targets 'bmc01.mgmt, bmc02.mgmt'</text>
  </g>

  
  <path d="M 500 230 L 500 263" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#shadow)">
    <rect x="50" y="265" width="900" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="108" cy="340" r="24" fill="#207448" />
    <text x="108" y="349" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="160" y="308" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">source_labels __address__</text>
    <text x="160" y="344" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">goes to target_label __param_target</text>
    
    <text x="160" y="390" font-family="sans-serif" font-size="24" fill="#55625c">the target becomes the URL query parameter target</text>
  </g>

  
  <path d="M 500 415 L 500 448" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#shadow)">
    <rect x="50" y="450" width="900" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="108" cy="525" r="24" fill="#207448" />
    <text x="108" y="534" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="160" y="493" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">source_labels __param_target</text>
    <text x="160" y="529" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">goes to target_label instance</text>
    
    <text x="160" y="575" font-family="sans-serif" font-size="24" fill="#55625c">keeps the BMC name as the instance label</text>
  </g>

  
  <path d="M 500 600 L 500 633" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#shadow)">
    <rect x="50" y="635" width="900" height="150" rx="14" fill="#fffdfa" stroke="#db8129" stroke-width="3" />
    
    <circle cx="108" cy="710" r="24" fill="#db8129" />
    <text x="108" y="719" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <text x="160" y="678" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129">target_label __address__</text>
    <text x="160" y="714" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129">with replacement bmc-exporter:9102</text>
    
    <text x="160" y="760" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the scrape goes to the exporter</text>
  </g>

  
  <path d="M 500 785 L 500 820" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g filter="url(#shadow)">
    <rect x="50" y="822" width="900" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(80, 856)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <path d="M16 28 h24 M28 20 l8 8 -8 8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="160" y="872" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Result request</text>
    <text x="160" y="915" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">GET bmc-exporter:9102/probe?target=bmc01.mgmt</text>
  </g>

  

  <g filter="url(#shadow)">
    <rect x="990" y="95" width="560" height="852" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(1025, 128)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="24" cy="24" r="20" />
      <path d="M24 22 v14 M24 14 v2" stroke-linecap="round" />
    </g>

    
    <text x="1085" y="162" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">why</text>

    
    <text x="1025" y="225" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1025" dy="0">blackbox_exporter and snmp_exporter</tspan>
      <tspan x="1025" dy="38">work this way; the exporter keeps no</tspan>
      <tspan x="1025" dy="38">host list of its own because Prometheus</tspan>
      <tspan x="1025" dy="38">relabelling (rewriting the target address</tspan>
      <tspan x="1025" dy="38">into the query parameter before it</tspan>
      <tspan x="1025" dy="38">scrapes) supplies the targets from</tspan>
      <tspan x="1025" dy="38">service discovery</tspan>
    </text>

    
    <rect x="1025" y="555" width="490" height="345" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <rect x="1055" y="585" width="135" height="42" rx="8" fill="#e8f1ea" />
    <text x="1122" y="614" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Contrast</text>

    
    <g transform="translate(1055, 655)" stroke="#55625c" stroke-width="3" fill="none">
      <rect x="4" y="6" width="36" height="44" rx="4" />
      <path d="M12 18 h20 M12 28 h20 M12 38 h12" stroke-linecap="round" />
    </g>

    
    <text x="1115" y="688" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1115" dy="0">the FleetCollector keeps</tspan>
      <tspan x="1115" dy="40">its own list of hosts</tspan>
    </text>
  </g>

  

  <g filter="url(#shadow)">
    <rect x="50" y="985" width="1500" height="68" rx="12" fill="#207448" />
    <text x="800" y="1028" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The exporter takes the target as a URL parameter</text>
  </g>
</svg>