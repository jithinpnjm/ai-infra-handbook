<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>import versus exec: where a file's names land</title>
  <desc>Visual comparison showing that import isolates a module's statements and names in a separate namespace object, while exec executes code directly inside the caller's current namespace, risking silent overwrites.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">import versus exec: where a file's names land</text>

  
  <rect x="40" y="95" width="740" height="675" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(65, 112)">
    <rect x="0" y="0" width="46" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="12" x2="46" y2="12" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="6" r="2" fill="#207448" />
    <circle cx="15" cy="6" r="2" fill="#207448" />
    <line x1="10" y1="22" x2="36" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="28" x2="26" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="125" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">import script1 (and importlib.reload)</text>

  
  <rect x="65" y="165" width="690" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="196" font-family="sans-serif" font-size="24" fill="#303a36">finds script1.py, compiles it to bytecode,</text>
  <text x="85" y="226" font-family="sans-serif" font-size="24" fill="#303a36">runs its top-level statements inside a</text>
  <text x="85" y="254" font-family="sans-serif" font-size="24" fill="#303a36">separate module namespace object</text>
  <text x="85" y="280" font-family="sans-serif" font-size="24" fill="#303a36">named script1</text>

  
  <path d="M 410 290 L 410 305" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="305" width="690" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="85" y="318" width="650" height="62" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="110" y="356" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">session namespace</text>
  <text x="600" y="356" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">x = 999</text>

  <rect x="85" y="392" width="650" height="75" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="410" y="424" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">script1.x is the file's x,</text>
  <text x="410" y="454" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">your x stays 999</text>

  
  <rect x="65" y="495" width="690" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="530" font-family="sans-serif" font-size="24" fill="#303a36">runs only once per process because</text>
  <text x="85" y="565" font-family="monospace" font-size="24" fill="#303a36">sys.modules caches the module,</text>
  <text x="85" y="600" font-family="sans-serif" font-size="24" fill="#303a36">so a second import does nothing</text>

  
  <rect x="65" y="630" width="690" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="665" font-family="sans-serif" font-size="24" fill="#303a36">to re-run after editing call</text>
  <text x="85" y="700" font-family="monospace" font-size="24" fill="#207448">from importlib import reload;</text>
  <text x="85" y="735" font-family="monospace" font-size="24" fill="#207448">reload(script1)</text>

  
  <rect x="820" y="95" width="740" height="675" rx="16" fill="#fff9f5" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(845, 112)">
    <rect x="0" y="0" width="46" height="38" rx="5" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 10 12 L 20 19 L 10 26" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="24" y1="26" x2="36" y2="26" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="905" y="142" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">exec(open("script1.py").read())</text>

  
  <rect x="845" y="165" width="690" height="125" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="865" y="215" font-family="sans-serif" font-size="24" fill="#303a36">compiles and runs the string every time</text>
  <text x="865" y="255" font-family="sans-serif" font-size="24" fill="#303a36">it is called</text>

  
  <path d="M 1190 290 L 1190 305" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="845" y="305" width="690" height="175" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="865" y="338" font-family="sans-serif" font-size="24" fill="#303a36">runs in the caller's current namespace as if</text>
  <text x="865" y="370" font-family="sans-serif" font-size="24" fill="#303a36">the lines were pasted at the call site</text>

  <rect x="865" y="392" width="650" height="75" rx="6" fill="#fbf3ec" stroke="#db8129" stroke-width="1.5" />
  <text x="890" y="438" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">session namespace</text>
  <text x="1380" y="438" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">x = 999</text>

  
  <rect x="845" y="495" width="690" height="120" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="865" y="540" font-family="monospace" font-size="24" fill="#303a36">if script1.py assigns x = 'hacked'</text>
  <text x="865" y="582" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">your x is silently overwritten with 'hacked'</text>

  
  <rect x="845" y="630" width="690" height="125" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="865" y="675" font-family="sans-serif" font-size="24" fill="#303a36">prevent by passing explicit namespace</text>
  <text x="865" y="715" font-family="sans-serif" font-size="24" fill="#303a36">dictionaries to exec</text>

  
  <rect x="40" y="810" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(65, 836)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 20 L 28 20 M 20 12 L 20 28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="125" y="850" font-family="monospace" font-size="24" fill="#303a36">__name__ is "__main__" when a file is run and the module name when it is imported;</text>
  <text x="125" y="890" font-family="monospace" font-size="24" fill="#207448">if __name__ == "__main__": raise SystemExit(main()) keeps a file usable as library and script</text>

  
  <rect x="40" y="955" width="1520" height="90" rx="12" fill="#ffffff" stroke="#8fa89b" stroke-width="2" />
  <g transform="translate(65, 977)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 20 10 A 10 10 0 1 1 11 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <polygon points="11,10 11,18 19,16" fill="#207448" />
  </g>
  <text x="125" y="990" font-family="sans-serif" font-size="24" fill="#303a36">Reload quirk: it updates importers that used import, but not those that used from;</text>
  <text x="125" y="1024" font-family="sans-serif" font-size="24" fill="#303a36">for repeatable runs, start a fresh process</text>

  
  <rect x="40" y="1085" width="1520" height="65" rx="8" fill="#207448" />
  <text x="800" y="1127" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Import isolates names, exec pastes them</text>
</svg>