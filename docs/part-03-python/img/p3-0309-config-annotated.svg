<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420" style="background-color: #f5f8f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>The quality configuration in pyproject.toml and pre-commit, line by line</title>
  <desc>Visual breakdown of linting, typing, coverage configurations and pre-commit gate hooks</desc>

  
  <text x="50" y="65" font-size="44" font-weight="bold" fill="#303a36">The quality configuration in pyproject.toml and pre-commit, line by line</text>

  
  <g transform="translate(40, 100)">
    
    <rect x="0" y="0" width="880" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(30, 26)">
      
      <rect x="0" y="0" width="46" height="54" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="16" x2="34" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="26" x2="34" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="36" x2="26" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="38" font-size="32" font-weight="bold" fill="#207448">Annotated config.</text>
    </g>

    
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="820" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="47" r="14" fill="#207448"/>
      <text x="28" y="55" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="58" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[tool.ruff]</text>
      <text x="58" y="74" font-family="monospace" font-size="24" fill="#303a36">line-length = 100, target-version = py311</text>
    </g>

    
    <g transform="translate(30, 205)">
      <rect x="0" y="0" width="820" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="40" r="14" fill="#207448"/>
      <text x="28" y="48" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="58" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">lint select = E, F, I, B, UP, S, C4, SIM, PT, RUF, ASYNC, T20:</text>
      <text x="58" y="86" font-size="24" fill="#303a36">pycodestyle, pyflakes, isort, bugbear,</text>
      <text x="58" y="124" font-size="24" fill="#303a36">upgrade, bandit and more</text>
    </g>

    
    <g transform="translate(30, 375)">
      <rect x="0" y="0" width="820" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="40" r="14" fill="#207448"/>
      <text x="28" y="48" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="58" y="44" font-family="monospace" font-size="24" fill="#303a36">ignore = [S101]: asserts allowed in tests;</text>
      <text x="58" y="86" font-family="monospace" font-size="24" fill="#303a36">per-file-ignores tests/** = [S, T20]</text>
    </g>

    
    <g transform="translate(30, 525)">
      <rect x="0" y="0" width="820" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="40" r="14" fill="#207448"/>
      <text x="28" y="48" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="58" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[tool.mypy]</text>
      <text x="58" y="82" font-family="monospace" font-size="24" fill="#303a36">python_version 3.11, strict = true,</text>
      <text x="58" y="116" font-family="monospace" font-size="24" fill="#303a36">warn_unused_ignores = true, exclude build/</text>
    </g>

    
    <g transform="translate(30, 675)">
      <rect x="0" y="0" width="820" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="47" r="14" fill="#207448"/>
      <text x="28" y="55" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <text x="58" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[tool.coverage.run]</text>
      <text x="58" y="74" font-family="monospace" font-size="24" fill="#303a36">branch = true, source = [fleetctl]</text>
    </g>

    
    <g transform="translate(30, 785)">
      <rect x="0" y="0" width="820" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="28" cy="42" r="14" fill="#db8129"/>
      <text x="28" y="50" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
      <text x="58" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">[tool.coverage.report]</text>
      <text x="350" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">fail_under = 85,</text>
      <text x="58" y="82" font-family="monospace" font-size="24" fill="#303a36">show_missing = true,</text>
      <text x="58" y="122" font-family="monospace" font-size="24" fill="#303a36">exclude_also: if TYPE_CHECKING, raise</text>
      <text x="58" y="152" font-family="monospace" font-size="24" fill="#303a36">NotImplementedError, if __name__ == __main__</text>
    </g>
  </g>

  
  <g transform="translate(950, 100)">
    
    <rect x="0" y="0" width="610" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(30, 26)">
      
      <path d="M 12 12 L 28 12 C 36 12 40 18 40 26 C 40 38 24 40 24 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="24" cy="52" r="3" fill="#207448"/>
      <circle cx="12" cy="12" r="4" fill="#207448"/>
      <text x="58" y="38" font-size="30" font-weight="bold" fill="#207448">Right pre-commit panel:</text>
    </g>

    
    <g transform="translate(25, 95)">
      <rect x="0" y="0" width="560" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <circle cx="36" cy="42" r="16" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="36" cy="42" r="6" fill="#207448"/>
      <text x="66" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ruff-pre-commit rev v0.6.9:</text>
      <text x="66" y="86" font-size="24" fill="#303a36">ruff with --fix, and</text>
      <text x="66" y="122" font-size="24" fill="#303a36">ruff-format</text>
    </g>

    
    <g transform="translate(25, 255)">
      <rect x="0" y="0" width="560" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <rect x="22" y="28" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 28 42 L 34 48 L 44 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="66" y="46" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">mirrors-mypy rev v1.11.2</text>
      <text x="66" y="88" font-size="24" fill="#303a36">with types-PyYAML</text>
    </g>

    
    <g transform="translate(25, 400)">
      <rect x="0" y="0" width="560" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <path d="M 24 28 L 36 22 L 48 28 C 48 42 36 52 36 52 C 36 52 24 42 24 28 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <text x="66" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">pre-commit-hooks rev v4.6.0:</text>
      <text x="66" y="86" font-size="24" fill="#303a36">check-yaml,</text>
      <text x="66" y="122" font-size="24" fill="#303a36">end-of-file-fixer,</text>
      <text x="66" y="158" font-size="24" fill="#303a36">trailing-whitespace,</text>
      <text x="66" y="194" font-size="24" fill="#303a36">detect-private-key</text>
    </g>
  </g>

  
  <g transform="translate(950, 755)">
    <rect x="0" y="0" width="610" height="315" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 30)">
      <circle cx="18" cy="18" r="18" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="16" x2="18" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="9" r="2.5" fill="#207448"/>
      <text x="46" y="27" font-size="28" font-weight="bold" fill="#207448">Notes</text>
    </g>
    <text x="30" y="105" font-size="24" fill="#303a36">the versions are examples;</text>
    <text x="30" y="145" font-size="24" fill="#303a36">pin the versions you have reviewed;</text>
    <text x="30" y="185" font-size="24" fill="#303a36">run the same hooks in CI</text>
    <text x="30" y="225" font-size="24" fill="#303a36">so nobody can bypass them</text>
  </g>

  
  <g transform="translate(40, 1095)">
    <rect x="0" y="0" width="1520" height="205" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 24)">
      <circle cx="16" cy="16" r="12" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="16" x2="40" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="48" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="25" font-size="28" font-weight="bold" fill="#207448">Typing strip</text>
    </g>
    <text x="30" y="85" font-size="24" fill="#303a36">annotate public functions; Protocol for injected collaborators so fakes type-check;</text>
    <text x="30" y="125" font-size="24" fill="#303a36">TypedDict, dataclasses or pydantic for payloads; avoid Any creep;</text>
    <text x="30" y="165" font-size="24" fill="#303a36">type checker is a required CI check, not only an editor feature</text>
  </g>

  
  <g transform="translate(40, 1325)">
    <rect x="0" y="0" width="1520" height="70" rx="10" fill="#207448"/>
    <text x="760" y="44" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Configure the gates once in pyproject.toml and the hooks file</text>
  </g>
</svg>