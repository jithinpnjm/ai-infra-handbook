<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The quality configuration in pyproject.toml and pre-commit, line by line</title>
  <desc>Visual infographic explaining the quality configuration in pyproject.toml and pre-commit configuration hooks, line by line.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">The quality configuration in pyproject.toml </tspan>
    <tspan x="800" dy="55">and pre-commit, line by line</tspan>
  </text>

  
  <rect x="40" y="175" width="880" height="765" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 192)">
    
    <rect x="0" y="0" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="28" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="20" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="120" y="222" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Annotated config.</text>

  
  <rect x="60" y="248" width="840" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 268)">
    
    <path d="M28 6 A14 14 0 0 0 10 24 L2 32 A4 4 0 0 0 8 38 L16 30 A14 14 0 0 0 34 12 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="135" y="284" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">[tool.ruff] </tspan>
    <tspan x="135" dy="32">line-length = 100, target-version = py311</tspan>
  </text>

  
  <rect x="60" y="348" width="840" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 395)">
    
    <path d="M4 8 L36 8 L24 24 L24 38 L16 34 L16 24 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="135" y="380" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">lint select = E, F, I, B, UP, S, C4, SIM, </tspan>
    <tspan x="135" dy="28">PT, RUF, ASYNC, T20: </tspan>
    <tspan x="135" dy="28" font-family="sans-serif">pycodestyle, pyflakes, isort, bugbear, </tspan>
    <tspan x="135" dy="28" font-family="sans-serif">upgrade, bandit and more</tspan>
  </text>

  
  <rect x="60" y="500" width="840" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 520)">
    
    <path d="M20 4 L36 10 L36 24 C36 34 20 42 20 42 C20 42 4 34 4 24 L4 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 24 L18 30 L28 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="135" y="536" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">ignore = [S101]: asserts allowed in tests; </tspan>
    <tspan x="135" dy="32">per-file-ignores tests/** = [S, T20]</tspan>
  </text>

  
  <rect x="60" y="600" width="840" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 620)">
    
    <rect x="4" y="8" width="34" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M12 24 L18 30 L28 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="135" y="636" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">[tool.mypy] python_version 3.11, strict = true, </tspan>
    <tspan x="135" dy="32">warn_unused_ignores = true, exclude build/</tspan>
  </text>

  
  <rect x="60" y="700" width="840" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 718)">
    
    <circle cx="21" cy="21" r="17" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polygon points="17,13 29,21 17,29" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="135" y="734" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">[tool.coverage.run] </tspan>
    <tspan x="135" dy="32">branch = true, source = [fleetctl]</tspan>
  </text>

  
  <rect x="60" y="795" width="840" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(75, 835)">
    
    <circle cx="21" cy="21" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M21 11 L21 21 L29 25" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="135" y="821" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">[tool.coverage.report] </tspan>
    <tspan fill="#db8129" font-weight="bold">fail_under = 85</tspan><tspan fill="#303a36">, show_missing = true, </tspan>
    <tspan x="135" dy="28">exclude_also: if TYPE_CHECKING, </tspan>
    <tspan x="135" dy="28">raise NotImplementedError, </tspan>
    <tspan x="135" dy="28">if __name__ == __main__</tspan>
  </text>

  
  <rect x="940" y="175" width="620" height="765" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="965" y="195" width="570" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(985, 212)">
    
    <path d="M6 8 L22 22 L6 36 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M20 8 L36 22 L20 36 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <text x="1035" y="244" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">ruff-pre-commit rev v0.6.9: </tspan>
    <tspan x="985" dy="48">ruff with --fix, and ruff-format</tspan>
  </text>

  
  <rect x="965" y="348" width="570" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(985, 368)">
    
    <polygon points="21,4 36,22 21,40 6,22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="21" y1="4" x2="21" y2="40" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1035" y="396" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">mirrors-mypy rev v1.11.2 </tspan>
    <tspan x="985" dy="46">with types-PyYAML</tspan>
  </text>

  
  <rect x="965" y="480" width="570" height="185" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(985, 500)">
    
    <path d="M26 6 A10 10 0 0 0 16 16 L16 28 A8 8 0 0 1 8 36" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="26" cy="6" r="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="6" y1="36" x2="10" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1035" y="528" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">pre-commit-hooks rev v4.6.0: </tspan>
    <tspan x="985" dy="38">check-yaml, end-of-file-fixer, </tspan>
    <tspan x="985" dy="38">trailing-whitespace, </tspan>
    <tspan x="985" dy="38">detect-private-key</tspan>
  </text>

  
  <rect x="965" y="682" width="570" height="240" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(985, 702)">
    
    <path d="M14 30 L28 30 M16 36 L26 36 M21 6 A13 13 0 0 0 11 23 C13 26 14 27 14 30 L28 30 C28 27 29 26 31 23 A13 13 0 0 0 21 6 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1035" y="734" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1035" dy="0">the versions are examples; </tspan>
    <tspan x="985" dy="46">pin the versions you have reviewed; </tspan>
    <tspan x="985" dy="46">run the same hooks in CI </tspan>
    <tspan x="985" dy="46">so nobody can bypass them</tspan>
  </text>

  
  <rect x="40" y="960" width="1520" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 995)">
    
    <rect x="0" y="4" width="52" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M16 20 L10 25 L16 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 20 L42 25 L36 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="24" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="140" y="996" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0">annotate public functions; Protocol for injected collaborators so fakes type-check; </tspan>
    <tspan x="140" dy="36">TypedDict, dataclasses or pydantic for payloads; avoid Any creep; </tspan>
    <tspan x="140" dy="36">type checker is a required CI check, not only an editor feature</tspan>
  </text>

  
  <rect x="40" y="1105" width="1520" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1147" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Configure the gates once in pyproject.toml and the hooks file</text>
</svg>