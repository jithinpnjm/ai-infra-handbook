<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Pydantic at the boundary: what happens to a node spec arriving from YAML</title>
  <desc>Visual infographic explaining Pydantic validation of incoming YAML data at system boundary into trusted typed objects.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 7 L 1 12 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 7 L 1 12 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1300" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-size="48" font-weight="bold" font-family="sans-serif" fill="#303a36">
    <tspan x="800" dy="0">Pydantic at the boundary:</tspan>
    <tspan x="800" dy="54">what happens to a node spec arriving from YAML</tspan>
  </text>

  
  <rect x="50" y="160" width="320" height="560" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 195 h 36 l 16 16 v 44 h -52 z" />
    <path d="M 116 195 v 16 h 16" />
    <line x1="92" y1="228" x2="120" y2="228" />
    <line x1="92" y1="242" x2="114" y2="242" />
  </g>

  <text x="80" y="315" font-size="24" font-family="monospace" fill="#303a36">
    <tspan x="80" dy="0">dict from YAML:</tspan>
    <tspan x="80" dy="42">{name: gpu01,</tspan>
    <tspan x="80" dy="42"> ip: 10.0.0.5,</tspan>
    <tspan x="80" dy="42"> gpus: "8"}</tspan>
  </text>

  
  <line x1="370" y1="440" x2="408" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="410" y="160" width="580" height="560" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 445 190 c 16 0 26 -8 26 -8 s 10 8 26 8 c 0 32 -13 52 -26 60 c -13 -8 -26 -28 -26 -60 z" />
    <path d="M 460 218 l 8 8 l 14 -14" />
  </g>
  <text x="515" y="226" font-size="30" font-weight="bold" font-family="sans-serif" fill="#207448">NodeSpec.model_validate(...)</text>

  
  <text x="445" y="280" font-size="24" font-family="sans-serif" fill="#303a36">
    <tspan x="445" dy="0" font-weight="bold">extra: forbid, frozen: True</tspan>

    <tspan x="445" dy="48">name: str with pattern ^[a-z0-9-]+$</tspan>
    <tspan x="445" dy="32">and max_length 63, plus a</tspan>
    <tspan x="445" dy="32">field_validator rejecting localhost</tspan>
    <tspan x="445" dy="32">and admin</tspan>

    <tspan x="445" dy="48" font-family="monospace">ip: IPv4Address</tspan>

    <tspan x="445" dy="48" font-family="monospace">gpus: int, default 8, ge 1, le 16</tspan>

    <tspan x="445" dy="48">role: Literal[compute, login, storage]</tspan>
    <tspan x="445" dy="32">default compute</tspan>
  </text>

  
  <line x1="990" y1="285" x2="1028" y2="285" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1030" y="160" width="520" height="255" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1068" cy="205" r="22" />
    <path d="M 1058 205 l 7 7 l 14 -14" />
  </g>

  <text x="1060" y="270" font-size="24" font-family="sans-serif" fill="#207448">
    <tspan x="1060" dy="0">gpus string 8 is coerced to int 8;</tspan>
    <tspan x="1060" dy="34" font-family="monospace">spec.model_dump(),</tspan>
    <tspan x="1060" dy="34" font-family="monospace">model_dump_json(),</tspan>
    <tspan x="1060" dy="34" font-family="monospace">NodeSpec.model_json_schema()</tspan>
  </text>

  
  <line x1="990" y1="580" x2="1028" y2="580" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="1030" y="440" width="520" height="280" rx="14" fill="#fdf5ed" stroke="#db8129" stroke-width="2.5" />

  
  <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1068" cy="482" r="22" />
    <line x1="1058" y1="472" x2="1078" y2="492" />
    <line x1="1078" y1="472" x2="1058" y2="492" />
  </g>

  <text x="1060" y="538" font-size="24" font-family="sans-serif" fill="#9c5409">
    <tspan x="1060" dy="0">a typo such as timout instead</tspan>
    <tspan x="1060" dy="28">of timeout is rejected at once</tspan>
    <tspan x="1060" dy="28">because extra is forbid;</tspan>
    <tspan x="1060" dy="28">ValidationError with e.errors():</tspan>
    <tspan x="1060" dy="28">a structured list of errors with</tspan>
    <tspan x="1060" dy="28">locations, so you can report exactly</tspan>
    <tspan x="1060" dy="28">which field is wrong; the error arrives</tspan>
    <tspan x="1060" dy="28">at the person who wrote the file</tspan>
  </text>

  
  <rect x="50" y="750" width="1500" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="850" r="22" />
    <circle cx="100" cy="850" r="8" />
    <line x1="100" y1="820" x2="100" y2="828" />
    <line x1="100" y1="872" x2="100" y2="880" />
    <line x1="70" y1="850" x2="78" y2="850" />
    <line x1="122" y1="850" x2="130" y2="850" />
    <line x1="79" y1="829" x2="85" y2="835" />
    <line x1="115" y1="865" x2="121" y2="871" />
    <line x1="79" y1="871" x2="85" y2="865" />
    <line x1="115" y1="835" x2="121" y2="829" />
  </g>

  <text x="155" y="802" font-size="24" font-family="sans-serif" fill="#303a36">
    <tspan x="155" dy="0" font-family="monospace">class Settings(BaseSettings): env_prefix MYOPS_, env_file .env;</tspan>
    <tspan x="155" dy="38">api_url: str, api_token: SecretStr</tspan>
    <tspan x="155" dy="38">(repr shows **********, call .get_secret_value() deliberately),</tspan>
    <tspan x="155" dy="38">timeout: float = 10.0</tspan>
  </text>

  
  <rect x="50" y="975" width="1500" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="100,1022 126,1035 100,1048 74,1035" />
    <path d="M 74 1045 l 26 13 l 26 -13" />
    <path d="M 74 1055 l 26 13 l 26 -13" />
  </g>

  <text x="155" y="1030" font-size="24" font-family="sans-serif" fill="#303a36">
    <tspan x="155" dy="0">v2 uses a Rust core, v1 has a different API;</tspan>
    <tspan x="155" dy="38">nested, generic and discriminated unions Field(discriminator=type), computed fields;</tspan>
    <tspan x="155" dy="38">FastAPI uses them for request and response schemas (chapter 3.7)</tspan>
  </text>

  
  <rect x="50" y="1175" width="1500" height="75" rx="12" fill="#207448" />
  <text x="800" y="1222" text-anchor="middle" font-size="26" font-weight="bold" font-family="sans-serif" fill="#ffffff">
    Validate once at the boundary, then pass trusted typed objects through the rest of the code
  </text>
</svg>