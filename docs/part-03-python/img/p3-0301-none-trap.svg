<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <title>Truthiness: when a valid zero looks like missing</title>
  <desc>Visual explanation of truthiness in Python, illustrating why checking truthiness instead of identity with None can cause valid falsy values like zero to be incorrectly treated as missing.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#db8129" />
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1130" fill="#f5f8f5" />

  
  <text x="800" y="72" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Truthiness: when a valid zero looks like missing</text>

  
  <g id="panel-left">
    <rect x="50" y="115" width="450" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(247, 145)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="50" rx="8" />
      <path d="M14 0 V14 H42 V0" />
      <line x1="20" y1="32" x2="36" y2="32" />
    </g>

    
    <rect x="75" y="225" width="400" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">
      <tspan x="275" y="325">empty containers, 0, 0.0,</tspan>
      <tspan x="275" y="365">empty string, None, False;</tspan>
      <tspan x="275" y="405">everything else is truthy</tspan>
    </text>

    
    <rect x="75" y="520" width="400" height="325" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(251, 550)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="22" />
      <polyline points="14,24 21,31 34,16" />
    </g>
    <text font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">
      <tspan x="275" y="660" font-weight="bold" fill="#207448">if not items:</tspan>
      <tspan x="275" y="705" font-family="sans-serif" font-size="24">instead of</tspan>
      <tspan x="275" y="750">if len(items) == 0:</tspan>
    </text>
  </g>

  
  <g id="panel-middle">
    <rect x="530" y="115" width="540" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(772, 145)" stroke="#207448" stroke-width="3.5" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="26" />
      <polyline points="28,14 28,28 39,28" stroke="#207448" />
    </g>

    
    <rect x="555" y="225" width="490" height="75" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="2.5" />
    <text x="800" y="272" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">if not timeout: timeout = 30</text>

    
    <rect x="700" y="325" width="200" height="50" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="800" y="359" font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">timeout = 0</text>

    
    <line x1="800" y1="375" x2="800" y2="415" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="565" y="423" width="470" height="75" rx="10" fill="#db8129" />
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="800" y="455">treated as missing and</tspan>
      <tspan x="800" y="485">replaced by 30</tspan>
    </text>

    
    <rect x="555" y="535" width="490" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="800" y="582" font-family="monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">if timeout is None: timeout = 30</text>

    
    <rect x="700" y="635" width="200" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="669" font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">timeout = 0</text>

    
    <line x1="800" y1="685" x2="800" y2="725" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="660" y="733" width="280" height="60" rx="10" fill="#207448" />
    <text x="800" y="771" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">kept as 0</text>
  </g>

  
  <g id="panel-right">
    <rect x="1100" y="115" width="450" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1297, 145)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="44" r="8" />
      <circle cx="12" cy="12" r="8" />
      <circle cx="44" cy="12" r="8" />
      <path d="M12 36 V20 M12 28 C26 28 44 24 44 20" />
    </g>

    
    <text x="1325" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">or-defaulting</text>

    
    <rect x="1125" y="260" width="400" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1145" y="310">target = </tspan>
      <tspan x="1145" y="348">  os.environ.get("CLUSTER")</tspan>
      <tspan x="1145" y="386">  or "staging"</tspan>
    </text>

    
    <rect x="1125" y="440" width="400" height="75" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="1.5" />
    <g transform="translate(1142, 461)" stroke="#db8129" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3 L30 28 H2 Z" />
      <line x1="16" y1="13" x2="16" y2="19" />
      <circle cx="16" cy="24" r="1.2" fill="#db8129" />
    </g>
    <text x="1335" y="487" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">beware falsy valid values</text>

    
    <rect x="1125" y="540" width="400" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1145" y="630">and and or short-circuit</tspan>
      <tspan x="1145" y="675">and return one of their</tspan>
      <tspan x="1145" y="720">operands, not necessarily</tspan>
      <tspan x="1145" y="765">a bool</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="50" y="905" width="1500" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="958" font-family="sans-serif" font-size="26" fill="#303a36" text-anchor="middle">None is the single null object, and the default return value of a function without return</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1015" width="1500" height="75" rx="12" fill="#207448" />
    <text x="800" y="1062" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Use is None when 0 or empty are valid values</text>
  </g>
</svg>