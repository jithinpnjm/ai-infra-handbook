<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Which failures to retry: methods, status codes and exceptions</title>
  <desc>Visual guide specifying HTTP retry criteria, non-retryable conditions, tenacity policy parameters, and jitter definitions.</desc>

  <rect width="1600" height="1300" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Which failures to retry: methods, status codes and exceptions
  </text>

  
  <g transform="translate(50, 95)">
    <rect width="1500" height="60" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 40,18 L 40,42 M 30,30 L 50,30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="800" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
      honour Retry-After; cap both attempts and total time
    </text>
  </g>

  
  <g transform="translate(50, 180)">
    
    <rect width="460" height="690" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect width="460" height="75" rx="16" fill="#207448"/>
    <rect y="55" width="460" height="20" fill="#207448"/>
    
    <circle cx="50" cy="38" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 41,38 L 47,44 L 59,32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
      Retry
    </text>

    
    <rect x="20" y="95" width="420" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="40" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">methods: GET, PUT, DELETE, or a</tspan>
      <tspan x="40" dy="36">POST with an idempotency key</tspan>
    </text>

    
    <rect x="20" y="245" width="420" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="40" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      status codes: 429, 502, 503, 504
    </text>

    
    <rect x="20" y="355" width="420" height="310" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="40" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">exceptions: httpx.ConnectError,</tspan>
      <tspan x="40" dy="48" font-family="monospace">ReadTimeout,</tspan>
      <tspan x="40" dy="48" font-family="monospace">ConnectTimeout,</tspan>
      <tspan x="40" dy="48" font-family="monospace">RemoteProtocolError</tspan>
    </text>
  </g>

  
  <g transform="translate(540, 180)">
    
    <rect width="500" height="690" rx="16" fill="#fdf5ec" stroke="#db8129" stroke-width="2.5"/>

    
    <rect width="500" height="75" rx="16" fill="#db8129"/>
    <rect y="55" width="500" height="20" fill="#db8129"/>
    
    <circle cx="50" cy="38" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="37" y1="25" x2="63" y2="51" stroke="#ffffff" stroke-width="3"/>
    <text x="85" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
      Never retry
    </text>

    
    <rect x="20" y="95" width="460" height="270" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="40" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0" fill="#b35a15">status 400, 401, 403, 404, 409:</tspan>
      <tspan x="40" dy="42">the answer will not change</tspan>
      <tspan x="40" dy="38">between attempts,</tspan>
      <tspan x="40" dy="38">retrying is a bug</tspan>
    </text>

    
    <rect x="20" y="385" width="460" height="130" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="40" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      POST without an idempotency key
    </text>
  </g>

  
  <g transform="translate(1070, 180)">
    
    <rect width="480" height="690" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect width="480" height="75" rx="16" fill="#207448"/>
    <rect y="55" width="480" height="20" fill="#207448"/>
    
    <circle cx="50" cy="38" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 50,22 L 50,26 M 50,50 L 50,54 M 34,38 L 38,38 M 62,38 L 66,38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
      Policy
    </text>

    
    <rect x="20" y="95" width="440" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="139" font-family="monospace" font-size="24" fill="#303a36">
      retry_if_exception(transient)
    </text>

    
    <rect x="20" y="180" width="440" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="35" dy="0" font-family="monospace">wait_exponential_jitter(</tspan>
      <tspan x="35" dy="36" font-family="monospace">  initial=0.5, max=20):</tspan>
      <tspan x="35" dy="44">0.5, 1, 2, 4 and so on,</tspan>
      <tspan x="35" dy="36">capped, with jitter</tspan>
    </text>

    
    <rect x="20" y="400" width="440" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="445" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="35" dy="0">stop_after_attempt(6) |</tspan>
      <tspan x="35" dy="38">stop_after_delay(60)</tspan>
    </text>

    
    <rect x="20" y="525" width="440" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="566" font-family="monospace" font-size="24" fill="#303a36">
      before_sleep_log(log, WARNING)
    </text>

    
    <rect x="20" y="605" width="440" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="646" font-family="monospace" font-size="24" fill="#303a36">
      reraise=True
    </text>
  </g>

  
  <g transform="translate(50, 895)">
    
    <rect width="1500" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="40" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">backoff: each retry waits longer than the last; jitter: each client adds randomness</tspan>
      <tspan x="40" dy="38">so many clients that fail together do not retry in lockstep</tspan>
    </text>
  </g>

  <g transform="translate(50, 1035)">
    
    <rect width="1500" height="125" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="40" y="50" font-family="monospace" font-size="24" fill="#303a36">
      delay = min(cap, base * 2**attempt); sleep(random.uniform(0, delay))
    </text>
    <text x="40" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">
      is called full jitter
    </text>
  </g>

  
  <g transform="translate(50, 1180)">
    <rect width="1500" height="75" rx="12" fill="#207448"/>
    <text x="750" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      The only 4xx worth retrying is 429
    </text>
  </g>
</svg>