<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Which failures to retry: methods, status codes and exceptions</title>
  <desc>Visual guide detailing which HTTP methods, status codes, and exceptions to retry, conditions under which retry must never occur, tenacity retry policies, backoff with full jitter, and key operational rules.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which failures to retry: methods, status codes and exceptions</text>

  
  <g id="rule-strip">
    <rect x="50" y="78" width="1500" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">honour Retry-After; cap both attempts and total time</text>
  </g>

  
  <g id="column-retry">
    <rect x="50" y="148" width="480" height="572" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(76, 168)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 44 26 A 18 18 0 1 0 38 40"/>
      <polyline points="44 14 44 26 32 26"/>
    </g>
    <text x="146" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Retry</text>

    
    <rect x="70" y="236" width="440" height="120" rx="8" fill="#e8f1ea"/>
    <text x="90" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0" font-weight="bold">methods:</tspan>
      <tspan font-family="'SFMono-Regular', Consolas, monospace"> GET, PUT, DELETE,</tspan>
      <tspan x="90" dy="34">or a POST with an</tspan>
      <tspan x="90" dy="34">idempotency key</tspan>
    </text>

    
    <rect x="70" y="372" width="440" height="96" rx="8" fill="#e8f1ea"/>
    <text x="90" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0" font-weight="bold">status codes:</tspan>
      <tspan font-family="'SFMono-Regular', Consolas, monospace"> 429, 502,</tspan>
      <tspan x="90" dy="34" font-family="'SFMono-Regular', Consolas, monospace">503, 504</tspan>
    </text>

    
    <rect x="70" y="484" width="440" height="216" rx="8" fill="#e8f1ea"/>
    <text x="90" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0" font-weight="bold">exceptions:</tspan>
      <tspan x="90" dy="34" font-family="'SFMono-Regular', Consolas, monospace">httpx.ConnectError,</tspan>
      <tspan x="90" dy="34" font-family="'SFMono-Regular', Consolas, monospace">ReadTimeout,</tspan>
      <tspan x="90" dy="34" font-family="'SFMono-Regular', Consolas, monospace">ConnectTimeout,</tspan>
      <tspan x="90" dy="34" font-family="'SFMono-Regular', Consolas, monospace">RemoteProtocolError</tspan>
    </text>
  </g>

  
  <g id="column-never-retry">
    <rect x="560" y="148" width="480" height="572" rx="12" fill="#fffdfa" stroke="#db8129" stroke-width="2.5"/>
    
    
    <g transform="translate(586, 168)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="22"/>
      <line x1="10" y1="10" x2="42" y2="42"/>
    </g>
    <text x="656" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#db8129">Never retry</text>

    
    <rect x="580" y="236" width="440" height="260" rx="8" fill="#fdf3e9"/>
    <text x="600" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0" font-family="'SFMono-Regular', Consolas, monospace" font-weight="bold">status 400, 401, 403, 404, 409:</tspan>
      <tspan x="600" dy="36">the answer will not change</tspan>
      <tspan x="600" dy="34">between attempts,</tspan>
      <tspan x="600" dy="34" font-weight="bold" fill="#db8129">retrying is a bug</tspan>
    </text>

    
    <rect x="580" y="512" width="440" height="110" rx="8" fill="#fdf3e9"/>
    <text x="600" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0" font-weight="bold">POST without an</tspan>
      <tspan x="600" dy="34" font-weight="bold">idempotency key</tspan>
    </text>
  </g>

  
  <g id="column-policy">
    <rect x="1070" y="148" width="480" height="572" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(1096, 168)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="10"/>
      <path d="M 26 4 L 26 12 M 26 40 L 26 48 M 4 26 L 12 26 M 40 26 L 48 26 M 10 10 L 16 16 M 36 36 L 42 42 M 10 42 L 16 36 M 36 10 L 42 16"/>
    </g>
    <text x="1166" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Policy</text>
    <text x="1166" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">from the tenacity decorator</text>

    
    <rect x="1090" y="236" width="440" height="54" rx="8" fill="#e8f1ea"/>
    <text x="1108" y="271" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">retry_if_exception(transient)</text>

    
    <rect x="1090" y="302" width="440" height="175" rx="8" fill="#e8f1ea"/>
    <text x="1108" y="334" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1108" dy="0">wait_exponential_jitter(</tspan>
      <tspan x="1108" dy="32">  initial=0.5, max=20):</tspan>
      <tspan x="1108" dy="34" font-family="system-ui, -apple-system, sans-serif">0.5, 1, 2, 4 and so on,</tspan>
      <tspan x="1108" dy="34" font-family="system-ui, -apple-system, sans-serif">capped, with jitter</tspan>
    </text>

    
    <rect x="1090" y="489" width="440" height="80" rx="8" fill="#e8f1ea"/>
    <text x="1108" y="522" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1108" dy="0">stop_after_attempt(6) |</tspan>
      <tspan x="1108" dy="32">stop_after_delay(60)</tspan>
    </text>

    
    <rect x="1090" y="581" width="440" height="54" rx="8" fill="#e8f1ea"/>
    <text x="1108" y="616" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">before_sleep_log(log, WARNING)</text>

    
    <rect x="1090" y="647" width="440" height="54" rx="8" fill="#e8f1ea"/>
    <text x="1108" y="682" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" fill="#303a36">reraise=True</text>
  </g>

  
  <g id="definitions-card">
    <rect x="50" y="738" width="735" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(72, 752)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 36 L 6 10 A 10 10 0 0 1 24 10 L 24 36 A 10 10 0 0 0 6 36 Z"/>
      <path d="M 42 36 L 42 10 A 10 10 0 0 0 24 10 L 24 36 A 10 10 0 0 1 42 36 Z"/>
    </g>
    <text x="128" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Definitions</text>
    <text x="72" y="822" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="72" dy="0"><tspan font-weight="bold">backoff:</tspan> each retry waits longer than the last;</tspan>
      <tspan x="72" dy="34"><tspan font-weight="bold">jitter:</tspan> each client adds randomness so many clients</tspan>
      <tspan x="72" dy="34">that fail together do not retry in lockstep</tspan>
    </text>
  </g>

  
  <g id="without-library-card">
    <rect x="815" y="738" width="735" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(837, 752)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 12 6 24 16 36"/>
      <polyline points="32 12 42 24 32 36"/>
      <line x1="26" y1="8" x2="22" y2="40"/>
    </g>
    <text x="893" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Without a library</text>
    <text x="837" y="822" font-size="24" fill="#303a36">
      <tspan x="837" dy="0" font-family="'SFMono-Regular', Consolas, monospace">delay = min(cap, base * 2**attempt);</tspan>
      <tspan x="837" dy="34" font-family="'SFMono-Regular', Consolas, monospace">sleep(random.uniform(0, delay))</tspan>
      <tspan x="837" dy="34" font-family="system-ui, -apple-system, sans-serif">is called full jitter</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="926" width="1500" height="62" rx="10" fill="#207448"/>
    <text x="800" y="967" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">The only 4xx worth retrying is 429</text>
  </g>
</svg>