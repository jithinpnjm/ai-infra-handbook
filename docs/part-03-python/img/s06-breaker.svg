<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A circuit breaker has three states</title>
  <desc>State diagram of a circuit breaker showing Closed, Open, and Half-open states and transitions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A circuit breaker has three states</text>

  
  
  <path d="M 486 254 Q 800 170 1114 254" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 1350 435 C 1460 540 1460 760 945 859" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 906 714 L 1114 466" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 694 714 L 486 466" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  
  <rect x="660" y="120" width="280" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">too many failures</text>

  
  <rect x="1095" y="656" width="270" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1230" y="688" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">after a cool-down</text>

  
  <rect x="800" y="526" width="190" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="895" y="558" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">trial fails</text>

  
  <rect x="340" y="586" width="230" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="455" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">trial succeeds</text>

  
  
  <g transform="translate(380, 360)">
    <circle cx="0" cy="0" r="150" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    
    <path d="M 0 -92 C 18 -92 26 -87 26 -72 C 26 -52 0 -38 0 -38 C 0 -38 -26 -52 -26 -72 C -26 -87 -18 -92 0 -92 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -12 -67 L -4 -59 L 12 -75" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Closed</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">calls pass</text>
  </g>

  
  <g transform="translate(1220, 360)">
    <circle cx="0" cy="0" r="150" fill="#fef6ed" stroke="#db8129" stroke-width="4"/>
    
    <path d="M 0 -92 L 28 -42 C 30 -38 27 -34 22 -34 L -22 -34 C -27 -34 -30 -38 -28 -42 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 -74 L 0 -56" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-45" r="2.5" fill="#db8129"/>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#db8129">Open</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">calls fail fast</text>
  </g>

  
  <g transform="translate(800, 820)">
    <circle cx="0" cy="0" r="150" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    
    <circle cx="0" cy="-65" r="25" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 0 -81 L 0 -65 L 14 -65" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Half-open</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">one trial call</text>
  </g>
</svg>