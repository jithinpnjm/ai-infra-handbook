<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Instance, class and static methods</title>
  <desc>Visual comparison of Python method types: plain method receives instance, classmethod receives class, staticmethod receives nothing extra, and classmethod usage note.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 15 8 L 1 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="80" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Instance, class and static methods</text>

  
  <g id="row1">
    <rect x="80" y="120" width="1440" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="110" y="172" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="138" cy="200" r="12" fill="#207448" />

    
    <text x="190" y="210" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Plain method</text>

    
    <rect x="490" y="165" width="320" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="650" y="210" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">def m(self):</text>

    
    <line x1="826" y1="200" x2="890" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="910" y="165" width="570" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1195" y="210" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">receives the instance</text>
  </g>

  
  <g id="row2">
    <rect x="80" y="310" width="1440" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="110" y="362" width="56" height="34" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 138 396 L 138 412 M 122 412 L 154 412 M 122 412 L 122 422 M 154 412 L 154 422" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="190" y="400" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">@classmethod</text>

    
    <rect x="490" y="355" width="320" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="650" y="400" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">def c(cls):</text>

    
    <line x1="826" y1="390" x2="890" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="910" y="355" width="570" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1195" y="400" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">receives the class</text>
  </g>

  
  <g id="row3">
    <rect x="80" y="500" width="1440" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="138" cy="580" r="15" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 138 554 L 138 562 M 138 598 L 138 606 M 112 580 L 120 580 M 156 580 L 164 580 M 120 562 L 126 568 M 150 592 L 156 598 M 120 598 L 126 592 M 150 568 L 156 562" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="190" y="590" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">@staticmethod</text>

    
    <rect x="490" y="545" width="320" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="650" y="590" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">def s():</text>

    
    <line x1="826" y1="580" x2="890" y2="580" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="910" y="545" width="570" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1195" y="590" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">receives nothing extra</text>
  </g>

  
  <g id="orange-note">
    <rect x="80" y="700" width="1440" height="130" rx="16" fill="#fdf5ed" stroke="#db8129" stroke-width="3" />
    
    
    <rect x="112" y="738" width="52" height="54" rx="8" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="124" y1="755" x2="152" y2="755" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="124" y1="769" x2="146" y2="769" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

    
    <text x="190" y="774" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">use classmethod for per-class data and alternative constructors</text>
  </g>
</svg>