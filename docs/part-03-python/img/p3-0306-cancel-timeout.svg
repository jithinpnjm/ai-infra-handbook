<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" width="1600" height="1220">
  <title>Cancellation and timeouts: what happens at the await</title>
  <desc>Visual infographic explaining asyncio task cancellation sequence, timeouts, and synchronization primitives.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-warn" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#b33927" />
    </marker>
  </defs>

  
  <rect width="1600" height="1220" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Cancellation and timeouts: what happens at the await
  </text>

  
  
  
  <rect x="50" y="105" width="910" height="655" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(80, 135)">
    
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 10 20 L 30 20 M 20 10 L 20 30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="56" y="30" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      A sequence for task.cancel()
    </text>
  </g>

  
  <g transform="translate(80, 195)">
    <rect width="490" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="44" cy="42" r="22" fill="#207448" />
    <text x="44" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="88" y="50" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">task.cancel() requested</text>
  </g>

  
  <path d="M 325 280 L 325 320" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g transform="translate(80, 325)">
    <rect width="490" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="44" cy="55" r="22" fill="#207448" />
    <text x="44" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="88" y="47" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">asyncio.CancelledError</text>
    <text x="88" y="81" font-family="sans-serif" font-size="24" fill="#303a36">is raised at the task's current await</text>
  </g>

  
  <path d="M 325 435 L 325 475" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g transform="translate(80, 480)">
    <rect width="490" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="44" cy="42" r="22" fill="#207448" />
    <text x="44" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="88" y="50" font-family="sans-serif" font-size="25" fill="#303a36">cleanup in a finally block</text>
  </g>

  
  <path d="M 325 565 L 325 605" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(80, 610)">
    <rect width="490" height="120" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="44" cy="60" r="22" fill="#db8129" />
    <text x="44" y="68" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <text x="88" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">say it again: re-raise CancelledError,</text>
    <text x="88" y="84" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">never swallow it</text>
  </g>

  
  <g transform="translate(605, 195)">
    <rect width="325" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 35 28 L 55 20 L 75 28 C 75 48 55 58 55 58 C 55 58 35 48 35 28 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="90" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Side tool</text>
    <text x="24" y="90" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">asyncio.shield()</tspan> protects
    </text>
    <text x="24" y="122" font-family="sans-serif" font-size="24" fill="#303a36">critical sections</text>
  </g>

  
  <path d="M 570 380 L 605 380" fill="none" stroke="#b33927" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-warn)" />

  <g transform="translate(605, 335)">
    <rect width="325" height="155" rx="12" fill="#fdf3f2" stroke="#b33927" stroke-width="2" stroke-dasharray="6,4" />
    
    <path d="M 32 30 L 48 58 L 16 58 Z" fill="none" stroke="#b33927" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="32" cy="51" r="1.5" fill="#b33927" />
    <line x1="32" y1="39" x2="32" y2="46" stroke="#b33927" stroke-width="2.5" stroke-linecap="round" />
    <text x="60" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b33927">Branch</text>
    <text x="20" y="85" font-family="sans-serif" font-size="24" fill="#303a36">swallowed with a bare</text>
    <text x="20" y="115" font-family="sans-serif" font-size="24" fill="#303a36">except: cannot cancel or</text>
    <text x="20" y="145" font-family="sans-serif" font-size="24" fill="#303a36">shut down</text>
  </g>

  
  
  
  <rect x="990" y="105" width="560" height="655" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(1020, 135)">
    
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="56" y="30" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      Timeout panel
    </text>
  </g>

  
  <g transform="translate(1020, 195)">
    <rect width="500" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="24" y="42" font-family="monospace" font-size="24" fill="#207448">await asyncio.wait_for(coro, timeout)</text>
    <text x="24" y="78" font-family="sans-serif" font-size="24" fill="#303a36">or</text>
    <text x="24" y="114" font-family="monospace" font-size="24" fill="#207448">async with asyncio.timeout(10): (3.11)</text>
  </g>

  
  <g transform="translate(1020, 365)">
    <rect width="500" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">every network await needs a</text>
    <text x="24" y="74" font-family="sans-serif" font-size="24" fill="#303a36">timeout: without one a half-open</text>
    <text x="24" y="106" font-family="sans-serif" font-size="24" fill="#303a36">connection waits forever and</text>
    <text x="24" y="138" font-family="sans-serif" font-size="24" fill="#303a36">you get a silent hang</text>
  </g>

  
  <g transform="translate(1020, 575)">
    <rect width="500" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="44" cy="45" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 44 37 L 44 47 M 40 43 L 44 47 L 48 43" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="76" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Core Mechanism</text>
    <text x="24" y="98" font-family="sans-serif" font-size="24" fill="#303a36">timeouts and TaskGroup</text>
    <text x="24" y="130" font-family="sans-serif" font-size="24" fill="#303a36">both rely on cancellation</text>
  </g>

  
  
  
  <rect x="50" y="785" width="1500" height="275" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(80, 815)">
    
    <rect x="6" y="16" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 12 16 L 12 10 C 12 5.5 28 5.5 28 10 L 28 16" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="20" cy="27" r="2.5" fill="#207448" />
    <text x="56" y="30" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      Primitive panel
    </text>
  </g>

  
  <g transform="translate(80, 870)">
    
    <rect x="0" y="0" width="705" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="24" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">asyncio Lock, Semaphore, Event, Condition, Queue</tspan>
    </text>
    <text x="24" y="82" font-family="sans-serif" font-size="24" fill="#303a36">
      are async versions of the thread primitives;
    </text>
    <text x="24" y="120" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b33927">
      not thread-safe across threads;
    </text>
  </g>

  <g transform="translate(815, 870)">
    
    <rect x="0" y="0" width="705" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="24" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      bounded Queue: <tspan font-family="monospace" font-weight="bold" fill="#207448">await q.put()</tspan> waits while full;
    </text>
    <text x="24" y="96" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">Semaphore(100)</tspan> throttles active HTTP requests
    </text>
  </g>

  
  
  
  <rect x="50" y="1085" width="1500" height="90" rx="16" fill="#207448" />
  <text x="800" y="1142" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
    Cancellation is an exception delivered at an await
  </text>
</svg>