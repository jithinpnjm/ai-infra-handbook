<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <title>A bounded map keeps only a fixed number of futures alive, so memory stays flat</title>
  <desc>Loop diagram showing bounded concurrency with a fixed inflight future pool versus naive unbounded submission.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1130" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A bounded map keeps only a fixed number</tspan>
    <tspan x="800" dy="54">of futures alive, so memory stays flat</tspan>
  </text>
  <text x="800" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#207448">Feed the pool in a bounded way.</text>

  
  <circle cx="570" cy="590" r="325" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />

  
  <path d="M 60 865 L 45 865 A 15 15 0 0 1 30 850 L 30 190 A 15 15 0 0 1 45 175 L 865 175 A 15 15 0 0 1 880 190 L 880 203" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 480 315 L 658 315" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 880 425 L 880 758" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 660 865 L 482 865" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(370, 480)">
    <rect width="400" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(176, 20)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="0" y="0" width="48" height="12" rx="3" />
      <rect x="0" y="16" width="48" height="12" rx="3" />
      <rect x="0" y="32" width="48" height="12" rx="3" />
    </g>
    <text x="200" y="105" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">inflight:</text>
    <text x="200" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">at most</text>
    <text x="200" y="180" text-anchor="middle" font-size="24">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">max_inflight</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> futures</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 205)">
    <rect width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(100, 23)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 4 18 L 4 40 L 40 40 L 40 18" />
      <path d="M 22 4 L 22 28" />
      <path d="M 13 19 L 22 28 L 31 19" />
    </g>
    <text x="210" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25">
      <tspan x="210" dy="0"><tspan font-weight="bold" fill="#207448">Seed: </tspan><tspan fill="#303a36">submit the first</tspan></tspan>
      <tspan x="210" dy="36"><tspan font-family="monospace" font-weight="bold" fill="#207448">max_inflight</tspan><tspan fill="#303a36"> items</tspan></tspan>
      <tspan x="210" dy="36" fill="#303a36">from the iterator</tspan>
    </text>
  </g>

  
  <g transform="translate(660, 205)">
    <rect width="440" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(100, 23)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="22" cy="22" r="18" />
      <path d="M 22 10 L 22 22 L 32 22" />
    </g>
    <text x="220" y="105" text-anchor="middle" font-size="24">
      <tspan x="220" dy="0" font-family="monospace" font-weight="bold" fill="#207448">wait(inflight,</tspan>
      <tspan x="220" dy="32" font-family="monospace" font-weight="bold" fill="#207448">FIRST_COMPLETED):</tspan>
      <tspan x="220" dy="32" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">block until some</tspan>
      <tspan x="220" dy="30" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">futures finish</tspan>
    </text>
  </g>

  
  <g transform="translate(660, 760)">
    <rect width="440" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(100, 23)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="4" y="4" width="36" height="36" rx="4" />
      <path d="M 12 22 L 20 30 L 32 14" />
    </g>
    <text x="220" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#303a36">
      <tspan x="220" dy="0">yield their results</tspan>
      <tspan x="220" dy="40">to the caller</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 760)">
    <rect width="420" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(100, 23)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 10 24 A 14 14 0 0 1 34 14" />
      <path d="M 28 8 L 36 14 L 32 22" />
      <path d="M 34 24 A 14 14 0 0 1 10 34" />
      <path d="M 16 40 L 8 34 L 12 26" />
    </g>
    <text x="210" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25">
      <tspan x="210" dy="0"><tspan font-weight="bold" fill="#207448">Refill: </tspan><tspan fill="#303a36">submit the same</tspan></tspan>
      <tspan x="210" dy="36" fill="#303a36">number of new items</tspan>
      <tspan x="210" dy="36" fill="#303a36">from the iterator</tspan>
    </text>
  </g>

  
  <g transform="translate(1160, 205)">
    <rect width="380" height="765" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(166, 40)" stroke="#db8129" stroke-width="3.5" fill="none">
      <polygon points="24,4 46,42 2,42" />
      <path d="M 24 18 L 24 28" />
      <circle cx="24" cy="35" r="1.5" fill="#db8129" />
    </g>
    <text x="190" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#303a36">
      <tspan x="190" dy="0">Naive submit-all creates</tspan>
      <tspan x="190" dy="42"><tspan font-family="monospace" fill="#db8129">10 million</tspan> futures before</tspan>
      <tspan x="190" dy="42">any work starts, so</tspan>
      <tspan x="190" dy="42" fill="#db8129">memory grows first.</tspan>
    </text>

    
    <g transform="translate(50, 420)">
      
      <path d="M 10 260 L 270 260" stroke="#db8129" stroke-width="2.5" />
      <path d="M 10 260 L 10 20" stroke="#db8129" stroke-width="2.5" />
      
      <path d="M 10 240 Q 90 230 140 120 T 260 30" fill="none" stroke="#db8129" stroke-width="4.5" />
      
      <path d="M 10 240 Q 90 230 140 120 T 260 30 L 260 260 L 10 260 Z" fill="#db8129" opacity="0.12" />
      
      <circle cx="260" cy="30" r="7" fill="#db8129" />
      <path d="M 248 18 L 272 42" stroke="#db8129" stroke-width="3" />
      <path d="M 272 18 L 248 42" stroke="#db8129" stroke-width="3" />
    </g>
  </g>

  
  <g transform="translate(60, 1010)">
    <rect width="1480" height="75" rx="14" fill="#207448" />
    
    <g transform="translate(30, 22)" stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 0 15 L 20 15 L 26 5 L 34 25 L 40 15 L 60 15" />
    </g>
    <text x="740" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Memory stays at <tspan font-family="monospace">O(max_inflight)</tspan>, whatever the input size.
    </text>
  </g>
</svg>