<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The iterator protocol: multiple-pass iterables vs single-pass iterator</title>
  <desc>Visual comparison and flow diagram of the iterator protocol showing how Iterables produce Iterators via iter(obj), and Consumers consume Iterators via next(it).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The iterator protocol:</text>
  <text x="800" y="135" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">multiple-pass iterables vs single-pass iterator</text>

  
  <g>
    
    <rect x="45" y="200" width="370" height="610" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 214 235 A 20 20 0 1 1 246 255" />
      <polyline points="236 258 248 258 248 246" />
      <path d="M 246 255 A 20 20 0 0 1 214 235" />
      <polyline points="224 232 212 232 212 244" />
    </g>

    
    <text x="230" y="325" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Iterable</text>
    <text x="230" y="365" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="230" dy="0">(list, Sentence,</tspan>
      <tspan x="230" dy="32">Countdown)</tspan>
    </text>

    
    <rect x="65" y="435" width="330" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="230" y="525" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">__iter__()</text>
    <text x="230" y="615" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="230" dy="0">returns fresh</tspan>
      <tspan x="230" dy="38">Iterator</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="422" y="437" width="156" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="500" y="468" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">iter(obj)</text>

    
    <line x1="415" y1="510" x2="585" y2="510" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  </g>

  
  <g>
    
    <rect x="585" y="200" width="430" height="610" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />

    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="800" cy="245" r="14" />
      <line x1="800" y1="223" x2="800" y2="229" />
      <line x1="800" y1="261" x2="800" y2="267" />
      <line x1="778" y1="245" x2="784" y2="245" />
      <line x1="816" y1="245" x2="822" y2="245" />
      <line x1="784" y1="229" x2="789" y2="234" />
      <line x1="811" y1="256" x2="816" y2="261" />
      <line x1="784" y1="261" x2="789" y2="256" />
      <line x1="811" y1="234" x2="816" y2="229" />
    </g>

    
    <text x="800" y="325" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Iterator / Generator</text>
    <text x="800" y="370" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(gen, zip, file)</text>

    
    <rect x="605" y="425" width="390" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="485" font-size="24" text-anchor="middle">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">__next__()</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> -&gt; item</tspan>
    </text>
    <text x="800" y="540" font-size="24" text-anchor="middle">
      <tspan font-family="sans-serif" fill="#303a36">or </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">StopIteration</tspan>
    </text>

    
    <rect x="605" y="615" width="390" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="675" font-size="24" text-anchor="middle">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">__iter__()</tspan>
      <tspan font-family="sans-serif" fill="#303a36"> -&gt; self</tspan>
    </text>
    <text x="800" y="730" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(single-pass)</text>
  </g>

  
  <g>
    
    <rect x="1022" y="437" width="156" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1100" y="468" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">next(it)</text>

    
    <line x1="1015" y1="510" x2="1185" y2="510" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  </g>

  
  <g>
    
    <rect x="1185" y="200" width="370" height="610" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1342" y="222" width="56" height="46" rx="6" />
      <line x1="1342" y1="238" x2="1398" y2="238" />
      <circle cx="1353" cy="230" r="2.5" fill="#207448" stroke="none" />
      <circle cx="1363" cy="230" r="2.5" fill="#207448" stroke="none" />
    </g>

    
    <text x="1370" y="325" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Consumer</text>

    
    <rect x="1205" y="435" width="330" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1370" y="535" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1370" dy="0">for loop /</tspan>
      <tspan x="1370" dy="55">unpacking / sum /</tspan>
      <tspan x="1370" dy="55">list / any / all</tspan>
    </text>
  </g>
</svg>