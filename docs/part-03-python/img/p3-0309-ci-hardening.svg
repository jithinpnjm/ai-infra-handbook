<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>CI hardening: least privilege, reproducibility, packaging and nightly runs</title>
  <desc>Technical infographic explaining CI hardening through least privilege permissions, reproducible builds and hashes, wheel smoke tests and signed packaging, and isolated GPU runners with nightly audit tiers.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">CI hardening: least privilege, </tspan>
    <tspan x="800" dy="52">reproducibility, packaging and nightly runs</tspan>
  </text>

  
  <g id="panel-1">
    <rect x="40" y="140" width="740" height="370" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="40" y="140" width="740" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 149)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 8 15 L 8 29 C 8 44 28 54 28 54 C 28 54 48 44 48 29 L 48 15 Z" />
      <circle cx="28" cy="27" r="4.5" />
      <line x1="28" y1="31.5" x2="28" y2="39" />
    </g>
    <text x="135" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Least privilege</text>

    
    <rect x="54" y="322" width="712" height="74" rx="8" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />

    
    <text x="70" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">permissions: set to the minimum; </tspan>
      <tspan x="70" dy="30">pin third-party actions by SHA; </tspan>
      <tspan x="70" dy="30">never echo secrets; </tspan>
      <tspan x="70" dy="38" fill="#db8129" font-weight="bold">pull requests from forks are untrusted </tspan>
      <tspan x="70" dy="30" fill="#db8129" font-weight="bold">and get no secrets; </tspan>
      <tspan x="70" dy="38" font-family="ui-monospace, monospace">pull_request_target only with great care</tspan>
    </text>
  </g>

  
  <g id="panel-2">
    <rect x="820" y="140" width="740" height="370" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="820" y="140" width="740" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(842, 149)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="20" width="36" height="30" rx="6" />
      <path d="M 18 20 L 18 13 A 10 10 0 0 1 38 13 L 38 20" />
      <path d="M 22 35 L 26 39 L 34 31" />
    </g>
    <text x="915" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Reproducible</text>

    
    <text x="845" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">lock files, pinned base images, </tspan>
      <tspan x="845" dy="28"><tspan font-family="ui-monospace, monospace">--require-hashes</tspan>, hermetic builds, </tspan>
      <tspan x="845" dy="28">record tool versions in logs; </tspan>
      <tspan x="845" dy="28">cache dependencies and test data </tspan>
      <tspan x="845" dy="28">keyed on lock file hashes; </tspan>
      <tspan x="845" dy="28">minimum-dependency run: </tspan>
      <tspan x="845" dy="28" font-family="ui-monospace, monospace">uv pip install --resolution lowest-direct </tspan>
      <tspan x="845" dy="28">validates lower bounds</tspan>
    </text>
  </g>

  
  <g id="panel-3">
    <rect x="40" y="550" width="740" height="365" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="40" y="550" width="740" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 559)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 48 18 L 28 28 L 8 18 Z" />
      <path d="M 8 18 L 8 42 L 28 52 L 28 28" />
      <path d="M 48 18 L 48 42 L 28 52" />
      <line x1="18" y1="23" x2="38" y2="33" />
    </g>
    <text x="135" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Packaging and release</text>

    
    <text x="65" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">install the built wheel into a clean venv </tspan>
      <tspan x="65" dy="26">and run a smoke test: catches missing </tspan>
      <tspan x="65" dy="26">package data and wrong entry points; </tspan>
      <tspan x="65" dy="26">tag, changelog from conventional commits; </tspan>
      <tspan x="65" dy="26">version from the git tag with <tspan font-family="ui-monospace, monospace">hatch-vcs</tspan> </tspan>
      <tspan x="65" dy="26">or <tspan font-family="ui-monospace, monospace">setuptools-scm</tspan>; sign artefacts, </tspan>
      <tspan x="65" dy="26">provenance attestations, SBOM; </tspan>
      <tspan x="65" dy="26">protect the environment so publishing </tspan>
      <tspan x="65" dy="26">needs approval</tspan>
    </text>
  </g>

  
  <g id="panel-4">
    <rect x="820" y="550" width="740" height="365" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="820" y="550" width="740" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(842, 559)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="14" width="28" height="28" rx="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea" />
      <line x1="21" y1="8" x2="21" y2="14" />
      <line x1="28" y1="8" x2="28" y2="14" />
      <line x1="35" y1="8" x2="35" y2="14" />
      <line x1="21" y1="42" x2="21" y2="48" />
      <line x1="28" y1="42" x2="28" y2="48" />
      <line x1="35" y1="42" x2="35" y2="48" />
      <line x1="8" y1="21" x2="14" y2="21" />
      <line x1="8" y1="28" x2="14" y2="28" />
      <line x1="8" y1="35" x2="14" y2="35" />
      <line x1="42" y1="21" x2="48" y2="21" />
      <line x1="42" y1="28" x2="48" y2="28" />
      <line x1="42" y1="35" x2="48" y2="35" />
    </g>
    <text x="915" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">GPU and nightly</text>

    
    <text x="845" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">GPU tests on self-hosted runners labelled </tspan>
      <tspan x="845" dy="28"><tspan font-family="ui-monospace, monospace">gpu</tspan>, ephemeral or containerised jobs, limit </tspan>
      <tspan x="845" dy="28">who can trigger, clean state between jobs; </tspan>
      <tspan x="845" dy="28">NVIDIA publishes GPU-enabled container </tspan>
      <tspan x="845" dy="28">images and the container toolkit</tspan>
    </text>

    
    <text x="845" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">nightly: full suite with random seeds, </tspan>
      <tspan x="845" dy="28">dependency audit, slow and integration tiers; </tspan>
      <tspan x="845" dy="28">notify on failure; track flakiness over time</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="40" y="955" width="1520" height="94" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 974)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 8 L 34 8 L 44 18 L 44 48 L 12 48 Z" />
      <polyline points="34,8 34,18 44,18" />
      <line x1="18" y1="26" x2="38" y2="26" />
      <line x1="18" y1="33" x2="38" y2="33" />
      <line x1="18" y1="40" x2="30" y2="40" />
    </g>
    <text x="135" y="997" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">artefacts: coverage files, <tspan font-family="ui-monospace, monospace">JUnit XML</tspan>, failure logs; GitLab CI uses </tspan>
      <tspan x="135" dy="30"><tspan font-family="ui-monospace, monospace">stages, needs, cache, artifacts:reports:junit, rules:</tspan> and runner tags</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1089" width="1520" height="70" rx="10" fill="#207448" />
    <text x="800" y="1131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Order the jobs cheap to expensive, and make the required checks branch-protected</text>
  </g>
</svg>