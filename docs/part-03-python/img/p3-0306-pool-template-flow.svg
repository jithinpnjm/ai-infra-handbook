<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <title>The worker-pool template: who waits for whom, and how shutdown works</title>
  <desc>Visual architecture of an asyncio worker pool showing producer, bounded queue, worker execution, cancellation, and graceful shutdown sequence.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">The worker-pool template:</text>
  <text x="800" y="102" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">who waits for whom, and how shutdown works</text>

  
  <rect x="360" y="125" width="880" height="52" rx="26" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="160" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">run_pool(items, handler, concurrency=50, queue_size=500)</text>

  
  <rect x="50" y="200" width="1500" height="92" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(75, 220)" stroke="#db8129" stroke-width="3.5" fill="none">
    <path d="M 26 6 A 20 20 0 0 0 26 46" />
    <path d="M 20 14 A 12 12 0 0 0 20 38" />
    <circle cx="12" cy="26" r="4" fill="#db8129" />
    <path d="M 34 2 L 44 26 L 36 26 L 42 50" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="145" y="238" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">loop.add_signal_handler(SIGINT and SIGTERM, stop.set);</text>
  <text x="145" y="272" font-family="sans-serif" font-size="24" fill="#303a36">the producer checks stop.is_set() and breaks</text>

  

  
  <rect x="50" y="315" width="360" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(80, 340)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="4" y="4" width="44" height="44" rx="8" />
    <path d="M 16 26 L 36 26 M 28 18 L 36 26 L 28 34" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <rect x="70" y="415" width="320" height="340" rx="8" fill="#ffffff" stroke="#c8d6cd" stroke-width="1.5" />
  <text x="95" y="475" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">for it in items:</tspan>
    <tspan x="95" dy="42">  await q.put(it)</tspan>
  </text>

  
  <line x1="410" y1="545" x2="445" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="450" y="315" width="395" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(480, 340)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="4" y="10" width="44" height="32" rx="4" />
    <line x1="18" y1="10" x2="18" y2="42" />
    <line x1="32" y1="10" x2="32" y2="42" />
  </g>
  
  <rect x="470" y="415" width="355" height="340" rx="8" fill="#ffffff" stroke="#c8d6cd" stroke-width="1.5" />
  <text x="495" y="465" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="495" dy="0">asyncio.Queue(</tspan>
    <tspan x="495" dy="36">  maxsize=</tspan>
    <tspan x="495" dy="36">  queue_size)</tspan>
  </text>
  <text x="495" y="600" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="495" dy="0" font-weight="bold">bounded:</tspan>
    <tspan x="495" dy="38">producer awaits</tspan>
    <tspan x="495" dy="38">when workers lag</tspan>
  </text>

  
  <line x1="845" y1="545" x2="880" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="885" y="315" width="665" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(915, 340)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="16" cy="18" r="8" />
    <path d="M 6 38 C 6 30 11 28 16 28 C 21 28 26 30 26 38" />
    <circle cx="36" cy="18" r="8" />
    <path d="M 26 38 C 26 30 31 28 36 28 C 41 28 46 30 46 38" />
  </g>
  
  <rect x="905" y="405" width="625" height="350" rx="8" fill="#ffffff" stroke="#c8d6cd" stroke-width="1.5" />
  <text x="925" y="438" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">worker(name, q, results, handler):</tspan>
    <tspan x="925" dy="31">  item = await q.get();</tspan>
    <tspan x="925" dy="31">  results.append(</tspan>
    <tspan x="925" dy="31">    await asyncio.wait_for(</tspan>
    <tspan x="925" dy="31">      handler(item), timeout=30));</tspan>
    <tspan x="925" dy="31">  except CancelledError: raise;</tspan>
    <tspan x="925" dy="31">  except Exception:</tspan>
    <tspan x="925" dy="31">    log.warning and</tspan>
    <tspan x="925" dy="31">    results.append(exc);</tspan>
    <tspan x="925" dy="31">  finally q.task_done()</tspan>
  </text>

  

  
  <rect x="50" y="805" width="315" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="85" cy="840" r="22" fill="#207448" />
  <text x="85" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="75" y="895" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">await q.join()</text>
  <text x="75" y="935" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">waits until all</tspan>
    <tspan x="75" dy="34">queued items</tspan>
    <tspan x="75" dy="34">are processed</tspan>
  </text>

  
  <line x1="365" y1="912" x2="405" y2="912" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="410" y="805" width="310" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="445" cy="840" r="22" fill="#207448" />
  <text x="445" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="435" y="900" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="435" dy="0" font-weight="bold">finally:</tspan>
    <tspan x="435" dy="38">for w in workers:</tspan>
    <tspan x="435" dy="38">  w.cancel()</tspan>
  </text>

  
  <line x1="720" y1="912" x2="760" y2="912" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="765" y="805" width="430" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="800" cy="840" r="22" fill="#207448" />
  <text x="800" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="790" y="895" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="790" dy="0">await asyncio.gather(</tspan>
    <tspan x="790" dy="38">  *workers,</tspan>
    <tspan x="790" dy="38">  return_exceptions=True)</tspan>
  </text>

  
  <line x1="1195" y1="912" x2="1235" y2="912" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1240" y="805" width="310" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1275" cy="840" r="22" fill="#207448" />
  <text x="1275" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1270" y="930" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">return results</text>

  
  <rect x="50" y="1045" width="1500" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 1085)" stroke="#207448" stroke-width="3.5" fill="none">
    <path d="M 24 4 L 44 12 C 44 32 24 44 24 44 C 24 44 4 32 4 12 Z" />
    <path d="M 14 22 L 20 28 L 34 16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="145" y="1090" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">bounded memory, bounded concurrency, per-item timeouts, error isolation,</tspan>
    <tspan x="145" dy="34">clean cancellation on signals; tune concurrency and queue_size</tspan>
    <tspan x="145" dy="34">to what your targets can take</tspan>
  </text>

  
  <rect x="50" y="1205" width="1500" height="80" rx="10" fill="#207448" />
  <text x="800" y="1255" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">A fleet loop you can trust</text>
</svg>