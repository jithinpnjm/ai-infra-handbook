<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The worker-pool template: who waits for whom, and how shutdown works</title>
  <desc>Visual explanation of the asyncio worker-pool template covering producer, bounded queue, worker tasks, signal handling, and sequential shutdown steps.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The worker-pool template:</text>
  <text x="60" y="125" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">who waits for whom, and how shutdown works</text>

  
  <rect x="40" y="155" width="1520" height="780" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <text x="70" y="198" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">run_pool(items, handler, concurrency=50, queue_size=500)</text>

  
  
  
  <rect x="60" y="225" width="410" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 245)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="8" width="48" height="40" rx="6" />
    <path d="M 16 28 L 24 20 L 32 28" />
    <path d="M 24 20 L 24 38" />
    <circle cx="12" cy="0" r="3" fill="#207448" />
    <circle cx="24" cy="0" r="3" fill="#207448" />
    <circle cx="36" cy="0" r="3" fill="#207448" />
  </g>
  <text x="85" y="385" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" xml:space="preserve">for it in items:</text>
  <text x="85" y="425" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" xml:space="preserve">  await q.put(it)</text>

  
  <rect x="60" y="555" width="410" height="355" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(85, 575)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 4 L 46 12 L 46 28 C 46 42 24 50 24 50 C 24 50 2 42 2 28 L 2 12 Z" />
    <path d="M 24 16 L 24 30" />
    <circle cx="24" cy="38" r="2.5" fill="#db8129" />
  </g>
  <text x="85" y="675" font-family="monospace" font-size="24" fill="#303a36">loop.add_signal_handler(</text>
  <text x="85" y="715" font-family="monospace" font-size="24" fill="#303a36">  SIGINT and SIGTERM,</text>
  <text x="85" y="755" font-family="monospace" font-size="24" fill="#303a36">  stop.set);</text>
  <text x="85" y="815" font-family="sans-serif" font-size="24" fill="#303a36">the producer checks</text>
  <text x="85" y="855" font-family="sans-serif" font-size="24" fill="#303a36">stop.is_set() and breaks</text>

  

  
  <rect x="510" y="225" width="530" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(535, 245)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="12" rx="20" ry="8" />
    <path d="M 4 12 L 4 38 C 4 44 12 48 24 48 C 36 48 44 44 44 38 L 44 12" />
    <path d="M 4 25 C 4 31 12 35 24 35 C 36 35 44 31 44 25" />
  </g>
  <text x="535" y="360" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">asyncio.Queue(maxsize=queue_size)</text>
  <text x="535" y="415" font-family="sans-serif" font-size="24" fill="#303a36">bounded: producer awaits</text>
  <text x="535" y="455" font-family="sans-serif" font-size="24" fill="#303a36">when workers lag</text>

  
  <rect x="510" y="555" width="530" height="355" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(535, 575)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="10" />
    <path d="M 20 4 L 20 8 M 20 32 L 20 36 M 4 20 L 8 20 M 32 20 L 36 20 M 8 8 L 12 12 M 28 28 L 32 32 M 8 32 L 12 28 M 28 12 L 32 8" />
    <circle cx="36" cy="36" r="6" />
    <path d="M 36 26 L 36 28 M 36 44 L 36 46 M 26 36 L 28 36 M 44 36 L 46 36" />
  </g>
  <text x="535" y="655" font-family="monospace" font-size="24" fill="#303a36">worker(name, q, results, handler):</text>
  <text x="535" y="687" font-family="monospace" font-size="24" fill="#303a36">  item = await q.get();</text>
  <text x="535" y="719" font-family="monospace" font-size="24" fill="#303a36">  results.append(await asyncio.</text>
  <text x="535" y="751" font-family="monospace" font-size="24" fill="#303a36">    wait_for(handler(item), timeout=30));</text>
  <text x="535" y="783" font-family="monospace" font-size="24" fill="#303a36">  except CancelledError: raise;</text>
  <text x="535" y="815" font-family="monospace" font-size="24" fill="#303a36">  except Exception: log.warning</text>
  <text x="535" y="847" font-family="monospace" font-size="24" fill="#303a36">    and results.append(exc);</text>
  <text x="535" y="879" font-family="monospace" font-size="24" fill="#303a36">  finally q.task_done()</text>

  
  
  
  <rect x="1080" y="225" width="460" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="265" r="24" fill="#207448" />
  <text x="1120" y="273" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="1160" y="260" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">await q.join()</text>
  <text x="1160" y="295" font-family="sans-serif" font-size="24" fill="#303a36">waits until all queued</text>
  <text x="1160" y="325" font-family="sans-serif" font-size="24" fill="#303a36">items are processed</text>

  
  <rect x="1080" y="405" width="460" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="445" r="24" fill="#207448" />
  <text x="1120" y="453" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="1160" y="455" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">finally:</text>
  <text x="1160" y="495" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">  for w in workers: w.cancel()</text>

  
  <rect x="1080" y="585" width="460" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="625" r="24" fill="#207448" />
  <text x="1120" y="633" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1160" y="625" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">await asyncio.gather(</text>
  <text x="1160" y="660" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">  *workers,</text>
  <text x="1160" y="695" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">  return_exceptions=True)</text>

  
  <rect x="1080" y="765" width="460" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="805" r="24" fill="#207448" />
  <text x="1120" y="813" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1160" y="840" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">return results</text>

  
  
  
  <path d="M 470 375 L 502 375" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1310 360 L 1310 397" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1310 540 L 1310 577" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1310 720 L 1310 757" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="40" y="955" width="1520" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1002" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">bounded memory, bounded concurrency, per-item timeouts, error isolation,</text>
  <text x="800" y="1042" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">clean cancellation on signals; tune concurrency and queue_size to what your targets can take</text>

  
  <rect x="40" y="1090" width="1520" height="65" rx="10" fill="#207448" />
  <text x="800" y="1133" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A fleet loop you can trust</text>
</svg>