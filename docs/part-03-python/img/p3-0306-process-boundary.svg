<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>What crosses a process boundary: pickle, shared memory and failure</title>
  <desc>Visual guide to Python multiprocessing: pickled data between parent and worker, sharing tools, pool features, failure modes, and IPC optimization.</desc>

  <defs>
    
    <marker id="arrow-green-right" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 16 2 L 2 8 L 16 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1480" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    What crosses a process boundary: pickle, shared memory and failure
  </text>

  
  
  

  
  <g transform="translate(50, 105)">
    <rect width="250" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="97" y="30" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="97" y1="46" x2="153" y2="46" stroke="#207448" stroke-width="3" />
    <circle cx="109" cy="38" r="3" fill="#207448" />
    <circle cx="120" cy="38" r="3" fill="#207448" />
    <text x="125" y="125" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">parent</text>
  </g>

  
  <g transform="translate(1300, 105)">
    <rect width="250" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="125" cy="53" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 125 25 L 125 35 M 125 71 L 125 81 M 97 53 L 107 53 M 143 53 L 153 53 M 105 33 L 112 40 M 138 66 L 145 73 M 105 73 L 112 66 M 138 40 L 145 33" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="125" y="125" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">worker</text>
  </g>

  
  
  <line x1="300" y1="160" x2="1295" y2="160" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-right)" />
  <g transform="translate(800, 160)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">arguments pickled</text>
  </g>

  
  <line x1="1300" y1="225" x2="305" y2="225" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-left)" />
  <g transform="translate(800, 225)">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="0" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">results pickled</text>
  </g>

  
  <g transform="translate(330, 275)">
    <rect width="940" height="170" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <text x="470" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      lambdas, nested functions, open files, sockets, locks
    </text>

    
    <rect x="35" y="68" width="410" height="78" rx="10" fill="#fff6ee" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4" />
    <text x="240" y="116" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
      Can't pickle local object
    </text>

    
    <path d="M 455 107 L 485 107" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-right)" />

    
    <rect x="495" y="68" width="410" height="78" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="700" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      top-level functions and plain data
    </text>
  </g>

  
  <g transform="translate(330, 465)">
    <rect width="940" height="65" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="470" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      are copied, which is slow: pass file paths or indices instead
    </text>
  </g>

  
  
  
  <g transform="translate(50, 560)">
    
    <rect width="1500" height="430" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(35, 25)">
      
      <rect x="0" y="0" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="0" x2="12" y2="46" stroke="#207448" stroke-width="3" />
      <line x1="23" y1="0" x2="23" y2="46" stroke="#207448" stroke-width="3" />
      <line x1="34" y1="0" x2="34" y2="46" stroke="#207448" stroke-width="3" />
      <line x1="0" y1="23" x2="46" y2="23" stroke="#207448" stroke-width="3" />
    </g>

    
    <g transform="translate(105, 30)">
      <rect width="650" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="325" y="41" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
        multiprocessing.Queue, Pipe, Manager
      </text>
    </g>

    <g transform="translate(785, 30)">
      <rect width="675" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="337" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        Value and Array (ctypes, with locks)
      </text>
    </g>

    
    <g transform="translate(35, 115)">
      <rect width="1425" height="74" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="712" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        multiprocessing.shared_memory.SharedMemory: zero-copy buffers, basis for NumPy arrays shared across processes
      </text>
    </g>

    
    <g transform="translate(35, 210)">
      <rect width="1425" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="712" y="41" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
        numpy.memmap memory-mapped files
      </text>
    </g>

    
    <g transform="translate(35, 295)">
      <rect width="1425" height="105" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="8,6" />
      <text x="712" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        under fork, read-only data is shared copy-on-write; reference-count writes can trigger page copies; gc.freeze() helps
      </text>
    </g>
  </g>

  
  
  
  <g transform="translate(50, 1015)">
    <rect width="1500" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(30, 48)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="100" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      Pool: map, imap_unordered, apply_async, starmap; maxtasksperchild recycles leaky workers;
    </text>
    <text x="100" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      initializer sets per-worker state such as opening a model or a database connection; chunksize=16 batches IPC for many small tasks
    </text>
  </g>

  
  
  
  <g transform="translate(50, 1195)">
    <rect width="1500" height="155" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(30, 48)">
      <path d="M 28 6 L 50 16 L 50 34 C 50 46 28 54 28 54 C 28 54 6 46 6 34 L 6 16 Z" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="42" r="2.5" fill="#db8129" />
    </g>
    
    <text x="100" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      an exception in a worker re-raises in the parent with its traceback text;
    </text>
    <text x="100" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      if the kernel's out-of-memory killer stops a worker you get BrokenProcessPool, which you must handle and recover from
    </text>
  </g>

  
  
  
  <g transform="translate(50, 1375)">
    <rect width="1500" height="75" rx="14" fill="#207448" />
    <text x="750" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">
      Send paths and indices, not big objects
    </text>
  </g>

</svg>