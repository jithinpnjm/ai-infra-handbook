<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Why a script works in the shell but fails under cron or systemd</title>
  <desc>Infographic explaining environment activation, PATH differences, and interpreter resolution across interactive shells versus cron, systemd, and CI.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="sans-serif" font-size="46" font-weight="bold" fill="#207448">Why a script works in the shell</text>
  <text x="40" y="125" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">but fails under cron or systemd</text>

  
  <rect x="40" y="145" width="740" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="60" y="160" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 68 171 L 74 177 L 68 183" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78" y1="183" x2="88" y2="183" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="187" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Your shell</text>

  
  <circle cx="85" cy="235" r="20" fill="#207448"/>
  <text x="85" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="115" y="205" width="645" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="135" y="230" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">source .venv/bin/activate puts .venv/bin</tspan>
    <tspan x="135" dy="25">at the front of PATH and sets VIRTUAL_ENV</tspan>
  </text>

  
  <path d="M 437 265 L 437 283" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <circle cx="85" cy="315" r="20" fill="#207448"/>
  <text x="85" y="315" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="115" y="285" width="645" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="135" y="323" font-family="sans-serif" font-size="24" fill="#303a36">python resolves to the venv interpreter</text>

  
  <path d="M 437 345 L 437 363" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <circle cx="85" cy="395" r="20" fill="#207448"/>
  <text x="85" y="395" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="115" y="365" width="645" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="135" y="403" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">import works</text>

  
  <rect x="820" y="145" width="740" height="300" rx="12" fill="#fdf8f3" stroke="#db8129" stroke-width="2"/>

  
  <circle cx="858" cy="177" r="16" fill="none" stroke="#db8129" stroke-width="3"/>
  <path d="M 858 167 L 858 177 L 865 182" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="853" y1="156" x2="863" y2="156" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <text x="895" y="187" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">cron, systemd or CI</text>

  
  <circle cx="865" cy="235" r="20" fill="#db8129"/>
  <text x="865" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="895" y="205" width="645" height="60" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <text x="915" y="243" font-family="sans-serif" font-size="24" fill="#303a36">no activation, a different PATH</text>

  
  <path d="M 1217 265 L 1217 283" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

  
  <circle cx="865" cy="315" r="20" fill="#db8129"/>
  <text x="865" y="315" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="895" y="285" width="645" height="60" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <text x="915" y="310" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="915" dy="0">bare python3 resolves to</tspan>
    <tspan x="915" dy="25">the system interpreter</tspan>
  </text>

  
  <path d="M 1217 345 L 1217 363" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

  
  <circle cx="865" cy="395" r="20" fill="#db8129"/>
  <text x="865" y="395" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="895" y="365" width="645" height="60" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="915" y="403" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">ModuleNotFoundError: No module named x</text>

  
  <rect x="40" y="460" width="1520" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 85 505 C 71 505 63 511 63 523 C 63 543 85 559 85 559 C 85 559 107 543 107 523 C 107 511 99 505 85 505 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 77 527 L 83 533 L 95 519" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  
  <text x="135" y="496" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">call the interpreter by absolute path: /path/to/.venv/bin/python -m pip install requests;</tspan>
    <tspan x="135" dy="30">systemd ExecStart=/opt/myops/.venv/bin/myops with Environment=PYTHONUNBUFFERED=1,</tspan>
    <tspan x="135" dy="30">a dedicated user and ProtectSystem= hardening from chapter 1.15;</tspan>
    <tspan x="135" dy="30">log sys.executable</tspan>
  </text>

  
  <rect x="40" y="625" width="1520" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <circle cx="85" cy="727" r="16" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="97" y1="739" x2="110" y2="752" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

  
  <rect x="135" y="639" width="690" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="155" y="672" font-family="monospace" font-size="24" fill="#303a36">which python</text>

  <rect x="850" y="639" width="690" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="870" y="672" font-family="monospace" font-size="24" fill="#303a36">python -m pip show x</text>

  <rect x="135" y="701" width="690" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="155" y="731" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">python -c "import sys;</tspan>
    <tspan x="155" dy="28">print(sys.prefix, sys.base_prefix)"</tspan>
    <tspan x="155" dy="28">(they differ inside a venv)</tspan>
  </text>

  <rect x="850" y="701" width="690" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="870" y="745" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">python -m site shows sys.path,</tspan>
    <tspan x="870" dy="30">user site and whether a venv is active</tspan>
  </text>

  
  <rect x="40" y="845" width="1520" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <path d="M 68 927 C 76 923 84 923 92 927 C 100 923 108 923 116 927 L 116 967 C 108 963 100 963 92 967 C 84 963 76 963 68 967 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="92" y1="927" x2="92" y2="967" stroke="#207448" stroke-width="3"/>

  
  <text x="135" y="883" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">python -m pip, not bare pip; one environment per project; recreate rather than repair;</tspan>
    <tspan x="135" dy="34">rebuild after upgrading the base Python since a venv borrows its interpreter;</tspan>
    <tspan x="135" dy="34">never sudo pip install: PEP 668 externally-managed-environment,</tspan>
    <tspan x="135" dy="34">use venv, pipx or distribution packages;</tspan>
    <tspan x="135" dy="34">--system-site-packages weakens isolation</tspan>
  </text>

  
  <rect x="40" y="1075" width="1520" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1119" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Activation only changes the shell you are sitting in</text>
</svg>