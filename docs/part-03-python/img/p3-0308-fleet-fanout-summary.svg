<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Fleet fan-out: per-host isolation and the summary line</title>
  <desc>Architecture flow showing bounded concurrency with ThreadPoolExecutor, per-host Redfish checking with exception isolation, result collection into ok and bad dictionaries, and summary exit behavior.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b382b" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <g id="header">
    <text x="80" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Fleet fan-out: per-host isolation and the summary line</text>
    <rect x="80" y="95" width="370" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="100" y="124" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">run(hosts, workers=16)</text>
  </g>

  
  <g id="step1" filter="url(#shadow)">
    <rect x="80" y="165" width="1440" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(110, 195)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="2" y="4" width="52" height="52" rx="8"/>
      <path d="M14 16 L42 16 M14 30 L42 30 M14 44 L42 44"/>
      <circle cx="22" cy="16" r="3" fill="#207448"/>
      <circle cx="34" cy="30" r="3" fill="#207448"/>
      <circle cx="26" cy="44" r="3" fill="#207448"/>
    </g>

    
    <circle cx="205" cy="225" r="22" fill="#207448"/>
    <text x="205" y="233" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    
    <text x="250" y="218" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ThreadPoolExecutor(max_workers=16):</text>
    <text x="250" y="258" font-family="sans-serif" font-size="25" fill="#303a36">bounded concurrency protects the management network</text>
  </g>

  
  <path d="M 800 285 L 800 345" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)"/>

  
  <g id="step2" filter="url(#shadow)">
    <rect x="80" y="350" width="1440" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(110, 375)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M28 6 L8 16 V32 C8 46 28 54 28 54 C28 54 48 46 48 32 V16 Z"/>
      <path d="M28 20 V40 M20 28 H36"/>
    </g>

    
    <circle cx="205" cy="405" r="22" fill="#207448"/>
    <text x="205" y="413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <rect x="245" y="382" width="230" height="42" rx="8" fill="#207448"/>
    <text x="260" y="411" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">isolate per host</text>

    
    <rect x="110" y="445" width="1380" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="135" y="482" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">check(host):</text>
    <text x="320" y="482" font-family="monospace" font-size="24" fill="#303a36">with Redfish(host, USER, PASS) as rf: s = rf.system(); return host,</text>
    <text x="175" y="522" font-family="monospace" font-size="24" fill="#207448">{power: PowerState, health: Status.Health, model: Model},</text>
    <text x="175" y="558" font-family="monospace" font-size="24" fill="#303a36">None</text>

    
    <rect x="110" y="595" width="1380" height="75" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="135" y="642" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">except Exception as e: return host, None, type(e).__name__: e</text>
  </g>

  
  <path d="M 800 690 L 800 750" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)"/>

  
  <g id="step3" filter="url(#shadow)">
    <rect x="80" y="755" width="1440" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(110, 795)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M6 10 L24 32 V50 L32 46 V32 L50 10 Z"/>
    </g>

    
    <circle cx="205" cy="825" r="22" fill="#207448"/>
    <text x="205" y="833" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    
    <text x="250" y="818" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">as_completed(...)</tspan> collects into two dictionaries
    </text>

    
    <rect x="250" y="842" width="120" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="290" y="872" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ok</text>

    <text x="385" y="872" font-family="sans-serif" font-size="24" fill="#303a36">and</text>

    
    <rect x="440" y="842" width="130" height="42" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2.5"/>
    <text x="480" y="872" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">bad</text>
  </g>

  
  <path d="M 800 905 L 800 965" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)"/>

  
  <g id="step4" filter="url(#shadow)">
    <rect x="80" y="970" width="1440" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(110, 990)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="4" y="8" width="48" height="40" rx="6"/>
      <path d="M14 22 L24 28 L14 34 M28 34 H38"/>
    </g>

    
    <circle cx="205" cy="1020" r="22" fill="#207448"/>
    <text x="205" y="1028" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

    <text x="250" y="1029" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">CLI exits non-zero if bad is non-empty</text>
  </g>

  
  <g id="summary-strip">
    <rect x="80" y="1095" width="1440" height="70" rx="10" fill="#2e3834"/>
    <circle cx="120" cy="1130" r="10" fill="#db8129"/>
    <text x="145" y="1139" font-family="monospace" font-size="25" fill="#f5f8f5">412 ok, 3 failed (bmc17: timeout, ...)</text>
  </g>

  
  <g id="habits-strip">
    <rect x="80" y="1185" width="1440" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(105, 1205)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="20"/>
      <path d="M25 15 V25 L32 30"/>
    </g>
    <text x="170" y="1225" font-family="sans-serif" font-size="24" fill="#303a36">
      report progress as you go; write results incrementally so an interrupted run can resume;
    </text>
    <text x="170" y="1257" font-family="sans-serif" font-size="24" fill="#303a36">
      for thousands of hosts move to asyncio with a semaphore (chapter 3.6)
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="1295" width="1440" height="75" rx="10" fill="#207448"/>
    <g transform="translate(110, 1312)" stroke="#ffffff" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="16"/>
      <path d="M12 20 L18 26 L28 14"/>
    </g>
    <text x="165" y="1342" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">One failing BMC lands in bad and does not stop the others</text>
  </g>
</svg>