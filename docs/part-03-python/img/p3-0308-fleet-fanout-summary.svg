<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Fleet fan-out: per-host isolation and the summary line</title>
  <desc>Architecture flow of bounded concurrency execution across hosts, per-host Redfish call exception isolation, aggregation into ok and bad dictionaries, CLI exit status, summary strip, and reliability habits.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Fleet fan-out: per-host isolation and the summary line</text>

  
  <rect x="60" y="85" width="1480" height="770" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="80" y="70" width="340" height="38" rx="8" fill="#207448" />
  <text x="250" y="96" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">run(hosts, workers=16)</text>

  
  <rect x="100" y="125" width="1400" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="150" cy="172" r="24" fill="#207448" />
  <text x="150" y="181" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(195, 144)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="6" />
    <line x1="14" y1="18" x2="42" y2="18" />
    <line x1="14" y1="28" x2="42" y2="28" />
    <line x1="14" y1="38" x2="42" y2="38" />
  </g>
  
  <text x="275" y="162" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">ThreadPoolExecutor(max_workers=16):</text>
  <text x="275" y="196" font-family="sans-serif" font-size="25" fill="#303a36">bounded concurrency protects the management network</text>

  
  <line x1="800" y1="220" x2="800" y2="256" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="100" y="260" width="1400" height="245" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="150" cy="305" r="24" fill="#207448" />
  <text x="150" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(195, 277)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 14 Z" />
  </g>
  <text x="275" y="314" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">isolate per host</text>

  
  <rect x="130" y="345" width="810" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="150" y="380" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">check(host): with Redfish(host, USER, PASS) as rf:</tspan>
    <tspan x="150" dy="34">s = rf.system(); return host, {power: PowerState,</tspan>
    <tspan x="150" dy="34">health: Status.Health, model: Model}, None</tspan>
  </text>

  
  <rect x="965" y="345" width="510" height="142" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="985" y="395" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="985" dy="0">except Exception as e:</tspan>
    <tspan x="985" dy="36">return host, None, type(e).__name__: e</tspan>
  </text>

  
  <line x1="800" y1="505" x2="800" y2="541" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="100" y="545" width="1400" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="150" cy="585" r="24" fill="#207448" />
  <text x="150" y="594" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(195, 557)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="6 8, 50 8, 34 28, 34 46, 22 50, 22 28" />
  </g>
  <text x="275" y="594" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">as_completed(...)</text>
  <text x="600" y="594" font-family="sans-serif" font-size="26" fill="#303a36">collects into two dictionaries</text>

  
  <rect x="275" y="625" width="430" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="490" y="667" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">ok</text>

  
  <rect x="745" y="625" width="430" height="65" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="3" />
  <text x="960" y="667" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">bad</text>

  
  <line x1="800" y1="710" x2="800" y2="746" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="100" y="750" width="1400" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="150" cy="797" r="24" fill="#207448" />
  <text x="150" y="806" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(195, 770)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6" />
    <polyline points="14 18, 24 27, 14 36" />
    <line x1="28" y1="36" x2="42" y2="36" />
  </g>
  <text x="275" y="808" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">CLI exits non-zero if bad is non-empty</text>

  
  <rect x="60" y="880" width="1480" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 890)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="44" height="44" rx="6" />
    <line x1="16" y1="20" x2="40" y2="20" />
    <line x1="16" y1="32" x2="28" y2="32" />
    <polyline points="34 32, 38 36, 46 26" />
  </g>
  <text x="160" y="927" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">412 ok, 3 failed (bmc17: timeout, ...)</text>

  
  <rect x="60" y="975" width="1480" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 1002)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 A 16 16 0 0 1 40 30 L 36 38 L 20 38 L 16 30 A 16 16 0 0 1 28 6 Z" />
    <line x1="22" y1="46" x2="34" y2="46" />
  </g>
  <text x="160" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">report progress as you go; write results incrementally so an interrupted run can resume;</tspan>
    <tspan x="160" dy="36">for thousands of hosts move to asyncio with a semaphore (chapter 3.6)</tspan>
  </text>

  
  <rect x="60" y="1105" width="1480" height="65" rx="8" fill="#207448" />
  <text x="800" y="1147" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">One failing BMC lands in bad and does not stop the others</text>
</svg>