<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Redfish across vendors, and treating BMC credentials as root</title>
  <desc>Technical infographic comparing Redfish implementation differences across server hardware vendors and detailing security controls required when treating BMC credentials as root access.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Redfish across vendors,</tspan>
    <tspan x="800" dy="56">and treating BMC credentials as root</tspan>
  </text>

  
  <rect x="40" y="150" width="740" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(68, 172)">
    <rect x="0" y="0" width="56" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="11" x2="22" y2="11" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="11" r="3" fill="#207448"/>
    <rect x="0" y="28" width="56" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="39" x2="22" y2="39" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="39" r="3" fill="#207448"/>
  </g>

  
  <text x="145" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Vendors differ</text>

  

  
  <rect x="65" y="245" width="690" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="90" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan>the same host appears as </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">/Systems/1</tspan>
    <tspan>,</tspan>
  </text>
  <text x="90" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">/Systems/System.Embedded.1</tspan>
    <tspan> or </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">/Systems/Self</tspan>
  </text>

  
  <rect x="65" y="345" width="690" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="90" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">Thermal</tspan>
    <tspan> and </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">Power</tspan>
    <tspan> are deprecated in favour of </tspan>
  </text>
  <text x="90" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">ThermalSubsystem</tspan>
    <tspan>, </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">PowerSubsystem</tspan>
    <tspan> and </tspan>
  </text>
  <text x="90" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">EnvironmentMetrics</tspan>
    <tspan>, and the code comments that </tspan>
  </text>
  <text x="90" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan>newer schemas use </tspan>
  </text>
  <text x="90" y="506" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">ThermalSubsystem/Sensors</text>

  
  <rect x="65" y="540" width="690" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="90" y="581" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan>OEM extensions sit under </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">Oem</tspan>
  </text>

  
  <rect x="65" y="620" width="690" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="90" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">some BMCs are slow, rate-sensitive or</text>
  <text x="90" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">return 500 under concurrent load</text>

  
  <rect x="65" y="720" width="690" height="310" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <circle cx="86" cy="749" r="5" fill="#207448"/>
  <text x="104" y="754" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">serialise requests to each BMC, retry carefully,</text>
  <text x="104" y="784" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">cap concurrency across the fleet, test against</text>
  <text x="104" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">every platform you run;</text>

  
  <circle cx="86" cy="848" r="5" fill="#207448"/>
  <text x="104" y="854" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DMTF mockup server;</text>

  
  <circle cx="86" cy="889" r="5" fill="#207448"/>
  <text x="104" y="894" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the redfish Python library</text>
  <text x="104" y="924" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">(python-redfish-library)</tspan>
    <tspan> handles sessions</tspan>
  </text>
  <text x="104" y="954" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">and OData;</text>

  
  <circle cx="86" cy="988" r="5" fill="#207448"/>
  <text x="104" y="994" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">nvfwupd</tspan>
    <tspan> on the DGX BMC builds on</tspan>
  </text>
  <text x="104" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the same standard</text>


  
  <rect x="820" y="150" width="740" height="900" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>

  
  <g transform="translate(848, 172)">
    <path d="M28 2 L52 12 L52 32 C52 46 28 54 28 54 C28 54 4 46 4 32 L4 12 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="28" cy="24" r="4" fill="#db8129"/>
    <line x1="28" y1="28" x2="28" y2="38" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <text x="920" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">
    <tspan x="920" dy="0">BMC credentials are</tspan>
    <tspan x="920" dy="36">effectively root over the machine</tspan>
  </text>

  
  <rect x="845" y="260" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="260" x2="845" y2="335" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">keep BMC networks isolated;</text>

  
  <rect x="845" y="357" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="357" x2="845" y2="432" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rotate secrets;</text>

  
  <rect x="845" y="454" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="454" x2="845" y2="529" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">one account per user with a suitable role;</text>

  
  <rect x="845" y="551" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="551" x2="845" y2="626" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="597" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">validate TLS against an internal CA;</text>

  
  <rect x="845" y="648" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="648" x2="845" y2="723" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">audit every action;</text>

  
  <rect x="845" y="745" width="690" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <line x1="845" y1="745" x2="845" y2="820" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="791" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">never log passwords or tokens;</text>

  
  <rect x="845" y="842" width="690" height="180" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <line x1="845" y1="842" x2="845" y2="1022" stroke="#db8129" stroke-width="6"/>
  <text x="875" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">power and boot actions: dry-run first,</text>
  <text x="875" y="926" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">print the target and action without sending</text>
  <text x="875" y="966" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan>anything, require </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">--yes</tspan>
  </text>


  
  <rect x="40" y="1080" width="1520" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1127" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Plan for differences between vendors and guard the keys</text>
</svg>