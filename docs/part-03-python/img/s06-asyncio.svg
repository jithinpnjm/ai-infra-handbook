<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>How the asyncio event loop shares one thread</title>
  <desc>Diagram showing how the asyncio event loop on a single thread shares execution time among Task A, Task B, and Task C via await, with a timeline strip and blocking call warning.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How the asyncio event loop shares one thread</text>

  
  
  <path d="M 420 420 L 455 420 L 455 322 L 520 322" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1180 420 L 1145 420 L 1145 322 L 1080 322" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 800 250 L 800 300" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 800 344 L 800 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="520" y="300" width="560" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="800" y="331" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">await hands control back to the loop</text>

  
  <rect x="80" y="370" width="340" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(222, 395)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="8" r="3" fill="#207448" />
    <circle cx="26" cy="8" r="3" fill="#207448" />
    <line x1="14" y1="32" x2="42" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="250" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Task A</text>

  
  <rect x="630" y="120" width="340" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(772, 136)">
    <rect x="0" y="0" width="56" height="50" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="8" r="3" fill="#207448" />
    <circle cx="26" cy="8" r="3" fill="#207448" />
    <line x1="14" y1="32" x2="42" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="800" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Task B</text>

  
  <rect x="1180" y="370" width="340" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1322, 395)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="8" r="3" fill="#207448" />
    <circle cx="26" cy="8" r="3" fill="#207448" />
    <line x1="14" y1="32" x2="42" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1350" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Task C</text>

  
  <rect x="490" y="390" width="620" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(772, 410)">
    <path d="M 28 6 A 22 22 0 0 1 50 28 A 22 22 0 0 1 34 49" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 28 50 A 22 22 0 0 1 6 28 A 22 22 0 0 1 22 7" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <polyline points="28,1 34,7 28,13" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="28,43 22,49 28,55" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="800" y="512" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">event loop (one thread)</text>

  
  <rect x="80" y="600" width="1440" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <line x1="110" y1="710" x2="1490" y2="710" stroke="#a3c9b1" stroke-width="4" stroke-linecap="round" />

  
  <rect x="104" y="625" width="216" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="212" cy="675" r="24" fill="#207448" />
  <text x="212" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="212" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A runs</text>

  
  <rect x="336" y="625" width="216" height="170" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="444" cy="675" r="24" fill="#207448" />
  <text x="444" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="444" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A awaits</text>

  
  <rect x="568" y="625" width="216" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="676" cy="675" r="24" fill="#207448" />
  <text x="676" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="676" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">B runs</text>

  
  <rect x="800" y="625" width="216" height="170" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="908" cy="675" r="24" fill="#207448" />
  <text x="908" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="908" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">B awaits</text>

  
  <rect x="1032" y="625" width="216" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="1140" cy="675" r="24" fill="#207448" />
  <text x="1140" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="1140" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">C runs</text>

  
  <rect x="1264" y="625" width="216" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="1372" cy="675" r="24" fill="#207448" />
  <text x="1372" y="683" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <text x="1372" y="752" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A resumes</text>

  
  <rect x="80" y="870" width="1440" height="120" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />

  
  <g transform="translate(140, 902)">
    <polygon points="16,0 40,0 56,16 56,40 40,56 16,56 0,40 0,16" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="16" y1="28" x2="40" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="800" y="941" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">a blocking call stops every task</text>
</svg>