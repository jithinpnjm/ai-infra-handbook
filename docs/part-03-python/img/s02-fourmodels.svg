<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Four import models</title>
  <desc>Visual explanation of the four Python import models: Basic module, Regular package, Package-relative, and Namespace package.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="80" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Four import models</text>

  
  <g id="row1">
    
    <rect x="80" y="115" width="1440" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 122,148 L 152,148 L 168,164 L 168,218 L 122,218 Z" />
      <path d="M 152,148 L 152,164 L 168,164" />
      <line x1="134" y1="180" x2="156" y2="180" />
      <line x1="134" y1="192" x2="156" y2="192" />
      <line x1="134" y1="204" x2="148" y2="204" />
    </g>

    
    <text x="195" y="210" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Basic module</text>

    
    <rect x="580" y="160" width="460" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="615" y="207" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">import module</text>
  </g>

  
  <g id="row2">
    
    <rect x="80" y="305" width="1440" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 120,358 L 138,358 L 145,366 L 170,366 L 170,408 L 120,408 Z" />
      <rect x="130" y="378" width="30" height="20" rx="3" />
      <line x1="137" y1="388" x2="153" y2="388" />
    </g>

    
    <text x="195" y="400" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Regular package</text>

    
    <rect x="580" y="350" width="510" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="605" y="397" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">import folder.folder.module</text>

    
    <rect x="1115" y="350" width="375" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1155" y="397" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">has <tspan font-family="monospace" fill="#207448">__init__.py</tspan></text>
  </g>

  
  <g id="row3">
    
    <rect x="80" y="495" width="1440" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="128" cy="578" r="8" fill="#207448" />
      <path d="M 136,578 L 150,578 L 150,556 L 168,556" />
      <path d="M 136,578 L 150,578 L 150,600 L 168,600" />
      <rect x="156" y="548" width="14" height="16" rx="2" />
      <rect x="156" y="592" width="14" height="16" rx="2" />
    </g>

    
    <text x="195" y="590" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Package-relative</text>

    
    <rect x="580" y="540" width="460" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="615" y="587" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">from . import module</text>
  </g>

  
  <g id="row4">
    
    <rect x="80" y="685" width="1440" height="165" rx="16" fill="#fcf5ed" stroke="#db8129" stroke-width="3" />
    
    
    <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <path d="M 120,736 L 134,736 L 140,744 L 156,744 L 156,766 L 120,766 Z" />
      
      <path d="M 136,758 L 150,758 L 156,766 L 172,766 L 172,788 L 136,788 Z" />
      
      <path d="M 130,766 L 130,776 L 136,776" />
    </g>

    
    <text x="195" y="780" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Namespace package</text>

    
    <rect x="580" y="730" width="510" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="605" y="777" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">folders without <tspan font-family="monospace" fill="#db8129">__init__.py</tspan></text>

    
    <rect x="1115" y="730" width="375" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="1155" y="777" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">merged by PEP 420</text>
  </g>
</svg>