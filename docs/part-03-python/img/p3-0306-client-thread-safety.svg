<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which objects you may share between threads</title>
  <desc>Visual reference table showing thread safety of common Python objects, client libraries, and database drivers.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which objects you may share between threads</text>

  
  <rect x="50" y="112" width="1500" height="60" rx="10" fill="#207448"/>
  <text x="80" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Object</text>
  <text x="600" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Safe to share?</text>
  <text x="1040" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Note</text>

  
  <rect x="50" y="182" width="1500" height="72" rx="8" fill="#ffffff" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="196" width="40" height="44" rx="4"/>
    <line x1="74" y1="211" x2="114" y2="211"/>
    <line x1="74" y1="226" x2="114" y2="226"/>
  </g>
  <text x="135" y="227" font-family="monospace" font-size="24" fill="#303a36">queue.Queue</text>
  <rect x="600" y="197" width="90" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="226" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  <text x="1040" y="227" font-family="sans-serif" font-size="24" fill="#303a36">-</text>

  
  <rect x="50" y="262" width="1500" height="72" rx="8" fill="#f0f5f1" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 78 276 L 102 276 L 110 284 L 110 320 L 78 320 Z"/>
    <line x1="86" y1="292" x2="98" y2="292"/>
    <line x1="86" y1="301" x2="102" y2="301"/>
    <line x1="86" y1="310" x2="96" y2="310"/>
  </g>
  <text x="135" y="307" font-family="monospace" font-size="24" fill="#303a36">logging</text>
  <rect x="600" y="277" width="90" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  <text x="1040" y="307" font-family="sans-serif" font-size="24" fill="#303a36">-</text>

  
  <rect x="50" y="342" width="1500" height="104" rx="8" fill="#ffffff" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 84 366 L 76 366 L 76 422 L 84 422"/>
    <path d="M 104 366 L 112 366 L 112 422 L 104 422"/>
    <line x1="88" y1="394" x2="100" y2="394"/>
  </g>
  <text x="135" y="386" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">single list.append and pop;</tspan>
    <tspan x="135" dy="32">single dict operations</tspan>
  </text>
  <rect x="600" y="373" width="90" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="402" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  <text x="1040" y="402" font-family="sans-serif" font-size="24" fill="#303a36">compound operations are not safe</text>

  
  <rect x="50" y="454" width="1500" height="78" rx="8" fill="#f0f5f1" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 76 504 C 70 504 68 498 68 493 C 68 487 72 483 78 483 C 80 475 87 470 95 470 C 103 470 109 475 111 481 C 115 481 120 485 120 491 C 120 497 115 504 108 504 Z"/>
  </g>
  <text x="135" y="502" font-family="sans-serif" font-size="24" fill="#303a36">boto3 low-level client</text>
  <text x="600" y="502" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">documented thread-safe</text>
  <text x="1040" y="502" font-family="sans-serif" font-size="24" fill="#303a36">boto3 sessions and resources are not</text>

  
  <rect x="50" y="540" width="1500" height="96" rx="8" fill="#ffffff" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="94" cy="588" r="20"/>
    <ellipse cx="94" cy="588" rx="9" ry="20"/>
    <line x1="74" y1="588" x2="114" y2="588"/>
  </g>
  <text x="135" y="596" font-family="monospace" font-size="24" fill="#303a36">requests.Session</text>
  <text x="600" y="596" font-family="sans-serif" font-size="24" fill="#303a36">mostly, for simple use</text>
  <text x="1040" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1040" dy="0">documentation makes</tspan>
    <tspan x="1040" dy="32">no strong guarantee</tspan>
  </text>

  
  <rect x="50" y="644" width="1500" height="80" rx="8" fill="#f0f5f1" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="662" width="40" height="42" rx="4"/>
    <path d="M 81 678 L 88 684 L 81 690"/>
    <line x1="91" y1="690" x2="103" y2="690"/>
  </g>
  <text x="135" y="692" font-family="sans-serif" font-size="24" fill="#303a36">paramiko SSHClient</text>
  <rect x="600" y="663" width="75" height="42" rx="8" fill="#e2e7e4" stroke="#505e58" stroke-width="2"/>
  <text x="637" y="692" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no</text>
  
  <rect x="1040" y="660" width="460" height="48" rx="8" fill="#db8129"/>
  <text x="1270" y="692" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">open one connection per worker</text>

  
  <rect x="50" y="732" width="1500" height="96" rx="8" fill="#ffffff" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="94" cy="758" rx="18" ry="7"/>
    <path d="M 76 758 L 76 794 C 76 798 84 802 94 802 C 104 802 112 798 112 794 L 112 758"/>
    <path d="M 76 776 C 76 780 84 784 94 784 C 104 784 112 780 112 776"/>
  </g>
  <text x="135" y="788" font-family="sans-serif" font-size="24" fill="#303a36">sqlite3 connection</text>
  <text x="600" y="772" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">refuses another thread</tspan>
    <tspan x="600" dy="32">by default</tspan>
  </text>
  <text x="1040" y="788" font-family="sans-serif" font-size="24" fill="#303a36">-</text>

  
  <rect x="50" y="836" width="1500" height="132" rx="8" fill="#f0f5f1" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="76" y="880" width="36" height="36" rx="4"/>
    <line x1="84" y1="870" x2="84" y2="880"/>
    <line x1="104" y1="870" x2="104" y2="880"/>
    <line x1="84" y1="916" x2="84" y2="926"/>
    <line x1="104" y1="916" x2="104" y2="926"/>
    <circle cx="94" cy="898" r="6"/>
  </g>
  <text x="135" y="908" font-family="sans-serif" font-size="24" fill="#303a36">Database drivers</text>
  <text x="600" y="890" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">check the DB-API threadsafety</tspan>
    <tspan x="600" dy="32">attribute of the driver module</tspan>
  </text>
  <text x="1040" y="890" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1040" dy="0">tells you whether threads may share</tspan>
    <tspan x="1040" dy="32">the module, a connection or neither</tspan>
  </text>

  
  <rect x="50" y="988" width="1500" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1034" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">when in doubt create one client per thread with threading.local()</text>

  
  <rect x="50" y="1080" width="1500" height="72" rx="10" fill="#207448"/>
  <text x="800" y="1125" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Never assume a client object is safe to share</text>
</svg>