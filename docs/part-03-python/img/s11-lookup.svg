<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Attribute lookup order with descriptors</title>
  <desc>Visual infographic explaining the top-to-bottom four ordered steps of attribute lookup for obj.attr with descriptors.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Attribute lookup order with descriptors</text>

  
  <rect x="620" y="120" width="360" height="76" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="648" y="133" width="48" height="50" rx="8" />
    <line x1="648" y1="147" x2="696" y2="147" stroke-width="3" />
    <circle cx="661" cy="140" r="2.5" fill="#207448" />
    <circle cx="671" cy="140" r="2.5" fill="#207448" />
    <polyline points="662,160 670,167 662,174" stroke-width="3.5" />
    <line x1="676" y1="174" x2="686" y2="174" stroke-width="3.5" />
  </g>
  <text x="724" y="170" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">obj.attr</text>

  
  <line x1="800" y1="196" x2="800" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="240" width="1360" height="150" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
  <circle cx="180" cy="315" r="24" fill="#db8129" />
  <text x="180" y="325" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(228, 287)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="40" rx="8" />
    <line x1="12" y1="22" x2="44" y2="22" />
    <circle cx="34" cy="22" r="6" fill="#db8129" />
    <line x1="12" y1="34" x2="44" y2="34" />
    <circle cx="20" cy="34" r="6" fill="#db8129" />
  </g>
  <text x="316" y="303" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">data descriptor on the class</text>
  <text x="316" y="347" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">(has <tspan font-family="monospace" fill="#db8129">__set__</tspan>)</text>
  <rect x="880" y="277" width="560" height="76" rx="14" fill="#fff2e2" stroke="#db8129" stroke-width="3" />
  <text x="1160" y="324" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">it beats the instance dictionary</text>

  
  <line x1="800" y1="390" x2="800" y2="434" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="434" width="1360" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="180" cy="499" r="24" fill="#207448" />
  <text x="180" y="509" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(228, 471)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="8" />
    <line x1="14" y1="20" x2="24" y2="20" />
    <line x1="32" y1="20" x2="42" y2="20" />
    <line x1="14" y1="34" x2="24" y2="34" />
    <line x1="32" y1="34" x2="42" y2="34" />
    <circle cx="28" cy="20" r="1.5" fill="#207448" />
    <circle cx="28" cy="34" r="1.5" fill="#207448" />
  </g>
  <text x="316" y="509" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">the instance <tspan font-family="monospace" fill="#207448">__dict__</tspan></text>

  
  <line x1="800" y1="564" x2="800" y2="608" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="608" width="1360" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="180" cy="673" r="24" fill="#207448" />
  <text x="180" y="683" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(228, 645)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="8" />
    <path d="M 14 18 L 22 28 L 14 38" />
    <line x1="26" y1="38" x2="42" y2="38" />
    <line x1="26" y1="22" x2="42" y2="22" />
  </g>
  <text x="316" y="683" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">non-data descriptor or plain class attribute</text>

  
  <line x1="800" y1="738" x2="800" y2="782" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="782" width="1360" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="180" cy="847" r="24" fill="#207448" />
  <text x="180" y="857" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(228, 819)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <circle cx="28" cy="28" r="10" />
    <line x1="28" y1="6" x2="28" y2="18" />
    <line x1="28" y1="38" x2="28" y2="50" />
    <line x1="6" y1="28" x2="18" y2="28" />
    <line x1="38" y1="28" x2="50" y2="28" />
  </g>
  <text x="316" y="857" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36"><tspan font-family="monospace" fill="#207448">__getattr__</tspan> as the last resort</text>
</svg>