<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Review checklist: the failures that page someone at night</title>
  <desc>Checklist of nine operational failure modes and their production effects</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Review checklist: the failures that page someone at night</text>

  
  <rect x="40" y="84" width="1520" height="76" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 94)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="2" x2="28" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <rect x="125" y="90" width="880" height="64" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">HTTP call or subprocess with no timeout</text>
  
  <line x1="1005" y1="122" x2="1068" y2="122" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,122 1054,115 1054,129" fill="#207448"/>
  
  <rect x="1070" y="90" width="475" height="64" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">hangs a script in cron or CI</text>

  
  <rect x="40" y="170" width="1520" height="100" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 192)">
    <path d="M48 24 A20 20 0 1 0 46 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="38,24 48,24 48,14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <rect x="125" y="176" width="880" height="88" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">Retrying a non-idempotent call or a permanent error;</tspan>
    <tspan x="145" dy="28">no jitter; unbounded retry loops</tspan>
  </text>
  
  <line x1="1005" y1="220" x2="1068" y2="220" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,220 1054,213 1054,227" fill="#207448"/>
  
  <rect x="1070" y="176" width="475" height="88" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1090" dy="0">repeats the damage,</tspan>
    <tspan x="1090" dy="28">thundering herds, never ends</tspan>
  </text>

  
  <rect x="40" y="280" width="1520" height="76" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 290)">
    <rect x="10" y="22" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M18 22 V14 A10 10 0 0 1 38 14 V22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="34" r="3" fill="#207448"/>
    <line x1="28" y1="37" x2="28" y2="43" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <rect x="125" y="286" width="880" height="64" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Secrets in arguments, logs or exception messages</text>
  
  <line x1="1005" y1="318" x2="1068" y2="318" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,318 1054,311 1054,325" fill="#207448"/>
  
  <rect x="1070" y="286" width="475" height="64" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">leak</text>

  
  <rect x="40" y="366" width="1520" height="100" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 388)">
    <rect x="8" y="10" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="3"/>
    <polyline points="16,30 22,35 16,40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="35" x2="38" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <rect x="125" y="372" width="880" height="88" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Logs and data on the same stream</text>
  
  <line x1="1005" y1="416" x2="1068" y2="416" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,416 1054,409 1054,423" fill="#207448"/>
  
  <rect x="1070" y="372" width="475" height="88" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1090" dy="0">breaks every pipeline</tspan>
    <tspan x="1090" dy="28">that reads the data</tspan>
  </text>

  
  <rect x="40" y="476" width="1520" height="100" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 498)">
    <rect x="14" y="14" width="30" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M10 20 H8 A2 2 0 0 0 6 22 V46 A2 2 0 0 0 8 48 H32 A2 2 0 0 0 34 46 V44" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="24" x2="38" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="32" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <rect x="125" y="482" width="880" height="88" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">Silent pagination truncation,</tspan>
    <tspan x="145" dy="28">offset paging over changing data</tspan>
  </text>
  
  <line x1="1005" y1="526" x2="1068" y2="526" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,526 1054,519 1054,533" fill="#207448"/>
  
  <rect x="1070" y="482" width="475" height="88" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">hides part of the fleet</text>

  
  <rect x="40" y="586" width="1520" height="100" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 608)">
    <rect x="8" y="10" width="40" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="8" y="32" width="40" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="16" cy="17" r="2.5" fill="#207448"/>
    <circle cx="24" cy="17" r="2.5" fill="#207448"/>
    <circle cx="16" cy="39" r="2.5" fill="#207448"/>
    <circle cx="24" cy="39" r="2.5" fill="#207448"/>
  </g>
  
  <rect x="125" y="592" width="880" height="88" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">One host aborts the whole run,</tspan>
    <tspan x="145" dy="28">or swallowing every error and exiting 0</tspan>
  </text>
  
  <line x1="1005" y1="636" x2="1068" y2="636" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,636 1054,629 1054,643" fill="#207448"/>
  
  <rect x="1070" y="592" width="475" height="88" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">both are wrong</text>

  
  <rect x="40" y="696" width="1520" height="128" rx="8" fill="#faefe3" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(54, 732)">
    <path d="M10 40 A20 20 0 1 1 46 40" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="36" x2="38" y2="22" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="36" r="4" fill="#db8129"/>
  </g>
  
  <rect x="125" y="702" width="880" height="116" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="145" y="738" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">Exporter: slow work in the scrape path, no timeouts,</tspan>
    <tspan x="145" dy="28">unbounded label values, stale values forever,</tspan>
    <tspan x="145" dy="28">raising from collect()</tspan>
  </text>
  
  <line x1="1005" y1="760" x2="1068" y2="760" stroke="#db8129" stroke-width="3"/>
  <polygon points="1070,760 1054,753 1054,767" fill="#db8129"/>
  
  <rect x="1070" y="702" width="475" height="116" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="1090" y="768" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">trouble in Prometheus</text>

  
  <rect x="40" y="834" width="1520" height="128" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 870)">
    <rect x="14" y="14" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="6" y1="22" x2="14" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="34" x2="14" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="22" x2="50" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="6" x2="22" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="6" x2="34" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="42" x2="22" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="42" x2="34" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <rect x="125" y="840" width="880" height="116" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">Redfish: leaked BMC sessions, hard-coded paths,</tspan>
    <tspan x="145" dy="28">assuming identical schemas, self-signed TLS ignored</tspan>
    <tspan x="145" dy="28">without a plan (disable verification only in labs)</tspan>
  </text>
  
  <line x1="1005" y1="898" x2="1068" y2="898" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,898 1054,891 1054,905" fill="#207448"/>
  
  <rect x="1070" y="840" width="475" height="116" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="906" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">failures</text>

  
  <rect x="40" y="972" width="1520" height="156" rx="8" fill="#e8f1ea"/>
  
  <g transform="translate(54, 1022)">
    <path d="M28 6 L46 13 V28 C46 39 28 50 28 50 C28 50 10 39 10 28 V13 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="38" r="2.5" fill="#207448"/>
  </g>
  
  <rect x="125" y="978" width="880" height="144" rx="6" fill="#ffffff" stroke="#c2dcd0" stroke-width="1.5"/>
  <text x="145" y="1014" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">Zombie subprocesses and orphaned children after timeouts;</tspan>
    <tspan x="145" dy="28">agent that executes unauthenticated remote commands;</tspan>
    <tspan x="145" dy="28">agent with no memory or CPU limits; shipping scripts by</tspan>
    <tspan x="145" dy="28">copying files with no versioning</tspan>
  </text>
  
  <line x1="1005" y1="1050" x2="1068" y2="1050" stroke="#207448" stroke-width="3"/>
  <polygon points="1070,1050 1054,1043 1054,1057" fill="#207448"/>
  
  <rect x="1070" y="978" width="475" height="144" rx="6" fill="#f2f7f4" stroke="#207448" stroke-width="1.5"/>
  <text x="1090" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1090" dy="0">disturbs training jobs or</tspan>
    <tspan x="1090" dy="28">opens a security hole</tspan>
  </text>

  
  <rect x="40" y="1138" width="1520" height="48" rx="8" fill="#207448"/>
  <text x="800" y="1170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Treat the list as a review checklist before you ship a tool</text>
</svg>