<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The GitHub Actions workflow: five jobs and what each needs</title>
  <desc>A dependency graph of five GitHub Actions workflow jobs: lint, test, integration, build, and publish.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="60" y="48" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The GitHub Actions workflow: five jobs and what each needs</text>

  
  <rect x="60" y="68" width="1480" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="102" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">on: pull_request, and push to main and tags v*; permissions contents: read;</text>
  <text x="800" y="134" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">concurrency group ci-ref with cancel-in-progress true</text>

  
  <rect x="60" y="180" width="1480" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="90" y="206" width="36" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="100" y1="220" x2="116" y2="220" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="100" y1="232" x2="116" y2="232" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="100" y1="244" x2="110" y2="244" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="160" y="222" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">lint</text>
  <text x="160" y="258" font-family="monospace" font-size="24" fill="#303a36">ubuntu, Python 3.12, pip cache: ruff check, ruff format --check, mypy src</text>

  
  <line x1="800" y1="280" x2="800" y2="315" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="60" y="315" width="1480" height="185" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 100 380 L 116 380 M 108 380 L 108 395 L 94 420 A 6 6 0 0 0 99 429 L 117 429 A 6 6 0 0 0 122 420 L 108 395" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="104" cy="415" r="2.5" fill="#207448" />
  <circle cx="112" cy="420" r="3" fill="#207448" />
  <text x="160" y="352" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">test (needs lint)</text>
  <text x="160" y="392" font-family="monospace" font-size="24" fill="#303a36">matrix python 3.10, 3.11, 3.12 times ubuntu-latest and macos-latest, fail-fast false</text>
  <text x="160" y="428" font-family="monospace" font-size="24" fill="#303a36">pytest -m "not integration and not gpu" --cov --cov-report=xml</text>
  <text x="160" y="464" font-family="monospace" font-size="24" fill="#303a36">upload-artifact coverage-os-python with if: always()</text>

  
  <line x1="420" y1="500" x2="420" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1180" y1="500" x2="1180" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="60" y="535" width="720" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="600" r="8" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="123" cy="580" r="8" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="123" cy="620" r="8" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="102" y1="595" x2="116" y2="585" stroke="#207448" stroke-width="4" />
  <line x1="102" y1="605" x2="116" y2="615" stroke="#207448" stroke-width="4" />
  <text x="160" y="582" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">integration (needs test)</text>
  <text x="160" y="630" font-family="monospace" font-size="24" fill="#303a36">pytest -m integration</text>

  
  <rect x="820" y="535" width="720" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 850 595 L 872 581 L 894 595 L 894 621 L 872 635 L 850 621 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <line x1="872" y1="581" x2="872" y2="635" stroke="#207448" stroke-width="4" />
  <line x1="850" y1="595" x2="872" y2="608" stroke="#207448" stroke-width="4" />
  <line x1="894" y1="595" x2="872" y2="608" stroke="#207448" stroke-width="4" />
  <text x="920" y="582" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">build (needs test)</text>
  <text x="920" y="630" font-family="monospace" font-size="24" fill="#303a36">pipx run build; upload artifact dist/</text>

  
  <line x1="420" y1="665" x2="420" y2="700" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1180" y1="665" x2="1180" y2="700" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="60" y="700" width="1480" height="195" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
  
  <path d="M 88 775 L 106 767 L 124 775 L 124 797 C 124 812 106 823 106 823 C 106 823 88 812 88 797 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
  <path d="M 98 795 L 104 801 L 115 788" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="160" y="742" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">publish (needs build and integration)</text>
  <text x="160" y="784" font-family="monospace" font-size="24" fill="#303a36">only if startsWith(github.ref, refs/tags/v); environment: release</text>
  <text x="160" y="822" font-family="monospace" font-size="24" fill="#303a36">permissions id-token: write for trusted publishing, no long-lived tokens</text>
  <text x="160" y="860" font-family="monospace" font-size="24" fill="#303a36">download dist/; pypa/gh-action-pypi-publish</text>

  
  <rect x="60" y="920" width="1480" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="955" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">action versions are examples: pin to reviewed versions or commit SHAs</text>

  
  <rect x="60" y="995" width="1480" height="65" rx="8" fill="#207448" />
  <text x="800" y="1038" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Cheap jobs first, publish only from a tag</text>
</svg>