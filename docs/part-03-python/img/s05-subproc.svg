<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Safe subprocess defaults</title>
  <desc>Visual explanation of safe defaults for subprocess.run in Python</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Safe subprocess defaults</text>

  
  <rect x="60" y="120" width="600" height="820" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="95" y="145" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="107" y="157" width="24" height="24" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <line x1="107" y1="145" x2="107" y2="137" stroke="#207448" stroke-width="3"/>
  <line x1="119" y1="145" x2="119" y2="137" stroke="#207448" stroke-width="3"/>
  <line x1="131" y1="145" x2="131" y2="137" stroke="#207448" stroke-width="3"/>
  <line x1="107" y1="193" x2="107" y2="201" stroke="#207448" stroke-width="3"/>
  <line x1="119" y1="193" x2="119" y2="201" stroke="#207448" stroke-width="3"/>
  <line x1="131" y1="193" x2="131" y2="201" stroke="#207448" stroke-width="3"/>
  <line x1="95" y1="157" x2="87" y2="157" stroke="#207448" stroke-width="3"/>
  <line x1="95" y1="169" x2="87" y2="169" stroke="#207448" stroke-width="3"/>
  <line x1="95" y1="181" x2="87" y2="181" stroke="#207448" stroke-width="3"/>
  <line x1="143" y1="157" x2="151" y2="157" stroke="#207448" stroke-width="3"/>
  <line x1="143" y1="169" x2="151" y2="169" stroke="#207448" stroke-width="3"/>
  <line x1="143" y1="181" x2="151" y2="181" stroke="#207448" stroke-width="3"/>

  
  <rect x="90" y="260" width="540" height="56" rx="10" fill="#e8f1ea"/>
  <rect x="90" y="404" width="540" height="56" rx="10" fill="#e8f1ea"/>
  <rect x="90" y="548" width="540" height="56" rx="10" fill="#e8f1ea"/>
  <rect x="90" y="692" width="540" height="56" rx="10" fill="#e8f1ea"/>
  <rect x="90" y="836" width="540" height="56" rx="10" fill="#e8f1ea"/>

  
  <text x="175" y="180" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="175" y="180">subprocess.run(</tspan>
    <tspan x="120" y="297">["ls", "-l"], </tspan>
    <tspan x="120" y="441">capture_output=True, </tspan>
    <tspan x="120" y="585">text=True, </tspan>
    <tspan x="120" y="729">timeout=30, </tspan>
    <tspan x="120" y="873">check=True)</tspan>
  </text>

  
  
  <rect x="760" y="236" width="780" height="104" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <path d="M 805,264 L 795,264 L 795,312 L 805,312" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 821,264 L 831,264 L 831,312 L 821,312" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="805" y1="274" x2="821" y2="274" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="805" y1="288" x2="821" y2="288" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="805" y1="302" x2="821" y2="302" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="865" y="298" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">argument list not a string</text>

  
  <rect x="760" y="380" width="780" height="104" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <rect x="787" y="408" width="52" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="787" y1="422" x2="839" y2="422" stroke="#207448" stroke-width="2.5"/>
  <path d="M 796,432 L 804,439 L 796,446" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="809" y1="446" x2="821" y2="446" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="865" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="865" y="424">capture_output gets </tspan>
    <tspan x="865" y="460">stdout and stderr</tspan>
  </text>

  
  <rect x="760" y="524" width="780" height="104" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <path d="M 795,548 L 821,548 L 833,560 L 833,604 L 795,604 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 821,548 L 821,560 L 833,560" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="803" y1="570" x2="823" y2="570" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="803" y1="581" x2="823" y2="581" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="803" y1="592" x2="817" y2="592" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="865" y="586" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">text=True decodes to str</text>

  
  <rect x="760" y="668" width="780" height="104" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <circle cx="813" cy="722" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="813" y1="694" x2="813" y2="700" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 813,708 L 813,722 L 825,722" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="865" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">timeout stops hangs</text>

  
  <rect x="760" y="812" width="780" height="104" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <path d="M 791,838 L 813,830 L 835,838 L 835,864 C 835,878 813,888 813,888 C 813,888 791,878 791,864 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 802,858 L 810,866 L 824,850" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="865" y="874" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">check=True raises on failure</text>

  
  
  <line x1="760" y1="288" x2="676" y2="288" stroke="#207448" stroke-width="4"/>
  <polygon points="660,288 676,280 676,296" fill="#207448"/>

  
  <line x1="760" y1="432" x2="676" y2="432" stroke="#207448" stroke-width="4"/>
  <polygon points="660,432 676,424 676,440" fill="#207448"/>

  
  <line x1="760" y1="576" x2="676" y2="576" stroke="#207448" stroke-width="4"/>
  <polygon points="660,576 676,568 676,584" fill="#207448"/>

  
  <line x1="760" y1="720" x2="676" y2="720" stroke="#207448" stroke-width="4"/>
  <polygon points="660,720 676,712 676,728" fill="#207448"/>

  
  <line x1="760" y1="864" x2="676" y2="864" stroke="#207448" stroke-width="4"/>
  <polygon points="660,864 676,856 676,872" fill="#207448"/>

  
  <rect x="60" y="980" width="1480" height="150" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
  <path d="M 123,1022 L 151,1072 C 153,1076 150,1082 145,1082 L 101,1082 C 96,1082 93,1076 95,1072 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
  <line x1="123" y1="1042" x2="123" y2="1058" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  <circle cx="123" cy="1069" r="2.5" fill="#db8129"/>
  <text x="180" y="1067" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">shell=True with user input invites injection</text>
</svg>