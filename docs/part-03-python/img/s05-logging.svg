<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Logger to handler to formatter</title>
  <desc>Visual explanation of logging flow from logger through handler and formatter to destination, with log level thresholds.</desc>

  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Logger to handler to formatter</text>

  
  <rect x="80" y="125" width="560" height="745" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="120" y="155" width="480" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3" fill="none">
    <path d="M 147 173 h 32 l 6 16 c 0 18 -22 28 -22 28 s -22 -10 -22 -28 z"/>
    <line x1="163" y1="183" x2="163" y2="197" stroke-width="3.5"/>
    <circle cx="163" cy="205" r="2.5" fill="#207448"/>
  </g>
  <text x="210" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">CRITICAL</text>

  
  <rect x="120" y="260" width="480" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3" fill="none">
    <circle cx="163" cy="298" r="20"/>
    <line x1="151" y1="286" x2="175" y2="310" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="175" y1="286" x2="151" y2="310" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="210" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ERROR</text>

  
  <rect x="120" y="365" width="480" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3" fill="none">
    <polygon points="163,378 186,420 140,420" stroke-linejoin="round"/>
    <line x1="163" y1="390" x2="163" y2="404" stroke-width="3.5"/>
    <circle cx="163" cy="412" r="2.5" fill="#207448"/>
  </g>
  <text x="210" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">WARNING</text>

  
  <rect x="120" y="470" width="480" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3" fill="none">
    <circle cx="163" cy="508" r="20"/>
    <circle cx="163" cy="498" r="2.5" fill="#207448"/>
    <line x1="163" y1="506" x2="163" y2="520" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="210" y="519" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">INFO</text>

  
  <line x1="105" y1="612" x2="615" y2="612" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="120" y="565" width="480" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="360" y="594" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">records below the level are dropped</text>

  
  <rect x="120" y="675" width="480" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>
  <g stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round">
    <ellipse cx="163" cy="713" rx="12" ry="15"/>
    <line x1="163" y1="698" x2="163" y2="728" stroke-width="2"/>
    <line x1="146" y1="707" x2="180" y2="707"/>
    <line x1="144" y1="715" x2="182" y2="715"/>
    <line x1="146" y1="723" x2="180" y2="723"/>
    <path d="M 158 698 Q 155 690 150 688"/>
    <path d="M 168 698 Q 171 690 176 688"/>
  </g>
  <text x="210" y="724" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">DEBUG</text>

  
  <rect x="700" y="125" width="820" height="745" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="740" y="150" width="740" height="64" rx="12" fill="#db8129"/>
  <text x="1110" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">set the level once at start-up</text>

  
  <rect x="740" y="245" width="740" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <circle cx="785" cy="292" r="22" fill="#207448"/>
  <text x="785" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <rect x="835" y="265" width="44" height="55" rx="5"/>
    <line x1="846" y1="281" x2="868" y2="281"/>
    <line x1="846" y1="293" x2="868" y2="293"/>
    <line x1="846" y1="305" x2="860" y2="305"/>
  </g>
  <text x="915" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">logger</text>

  
  <line x1="1110" y1="340" x2="1110" y2="382" stroke="#207448" stroke-width="4"/>
  <polygon points="1110,400 1101,382 1119,382" fill="#207448"/>

  
  <rect x="740" y="400" width="740" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <circle cx="785" cy="447" r="22" fill="#207448"/>
  <text x="785" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="857" cy="447" r="16"/>
    <circle cx="857" cy="447" r="6" stroke-width="3"/>
    <line x1="857" y1="424" x2="857" y2="431" stroke-width="5" stroke-linecap="round"/>
    <line x1="857" y1="463" x2="857" y2="470" stroke-width="5" stroke-linecap="round"/>
    <line x1="834" y1="447" x2="841" y2="447" stroke-width="5" stroke-linecap="round"/>
    <line x1="873" y1="447" x2="880" y2="447" stroke-width="5" stroke-linecap="round"/>
    <line x1="841" y1="431" x2="846" y2="436" stroke-width="5" stroke-linecap="round"/>
    <line x1="868" y1="458" x2="873" y2="463" stroke-width="5" stroke-linecap="round"/>
    <line x1="841" y1="463" x2="846" y2="458" stroke-width="5" stroke-linecap="round"/>
    <line x1="868" y1="436" x2="873" y2="431" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="915" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">handler</text>

  
  <line x1="1110" y1="495" x2="1110" y2="537" stroke="#207448" stroke-width="4"/>
  <polygon points="1110,555 1101,537 1119,537" fill="#207448"/>

  
  <rect x="740" y="555" width="740" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <circle cx="785" cy="602" r="22" fill="#207448"/>
  <text x="785" y="610" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <rect x="835" y="575" width="44" height="55" rx="5"/>
    <path d="M 846 595 L 850 587 L 854 595 M 847 593 L 853 593" stroke-width="2.5"/>
    <line x1="860" y1="588" x2="870" y2="588"/>
    <line x1="860" y1="594" x2="870" y2="594"/>
    <line x1="846" y1="607" x2="870" y2="607"/>
    <line x1="846" y1="617" x2="864" y2="617"/>
  </g>
  <text x="915" y="613" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">formatter</text>

  
  <line x1="1110" y1="650" x2="1110" y2="692" stroke="#207448" stroke-width="4"/>
  <polygon points="1110,710 1101,692 1119,692" fill="#207448"/>

  
  <rect x="740" y="710" width="740" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <circle cx="785" cy="757" r="22" fill="#207448"/>
  <text x="785" y="765" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <ellipse cx="857" cy="738" rx="20" ry="7"/>
    <path d="M 837 738 v 36 c 0 4 9 7 20 7 s 20 -3 20 -7 v -36"/>
    <path d="M 837 756 c 0 4 9 7 20 7 s 20 -3 20 -7"/>
  </g>
  <text x="915" y="768" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">destination (file, stream)</text>
</svg>