<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Request path through an ASGI service</title>
  <desc>A visual explanation showing the request flow from client to ASGI server (uvicorn), ASGI app (FastAPI), and route handler async def, with comparison chips contrasting synchronous WSGI and asynchronous ASGI worker models.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Request path through an ASGI service</text>

  
  <g id="node-client">
    <rect x="80" y="170" width="300" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="124" cy="214" r="24" fill="#207448" />
    <text x="124" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(202, 230)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="38" rx="4" />
      <line x1="28" y1="38" x2="28" y2="52" />
      <line x1="14" y1="52" x2="42" y2="52" />
      <polyline points="12,18 20,24 12,30" stroke-width="3" />
      <line x1="26" y1="30" x2="38" y2="30" stroke-width="3" />
    </g>
    <text x="230" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#303a36">client</text>
  </g>

  
  <line x1="380" y1="335" x2="456" y2="335" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />

  
  <g id="node-asgi-server">
    <rect x="460" y="170" width="300" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="504" cy="214" r="24" fill="#207448" />
    <text x="504" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(582, 230)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="22" rx="3" />
      <rect x="0" y="28" width="56" height="22" rx="3" />
      <circle cx="12" cy="11" r="2" fill="#207448" />
      <circle cx="20" cy="11" r="2" fill="#207448" />
      <line x1="32" y1="11" x2="46" y2="11" />
      <circle cx="12" cy="39" r="2" fill="#207448" />
      <circle cx="20" cy="39" r="2" fill="#207448" />
      <line x1="32" y1="39" x2="46" y2="39" />
    </g>
    <text x="610" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="610" dy="0">ASGI server</tspan>
      <tspan x="610" dy="44" font-family="ui-monospace, monospace" font-size="26" font-weight="normal">(uvicorn)</tspan>
    </text>
  </g>

  
  <line x1="760" y1="335" x2="836" y2="335" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />

  
  <g id="node-asgi-app">
    <rect x="840" y="170" width="300" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="884" cy="214" r="24" fill="#207448" />
    <text x="884" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(962, 230)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="56" height="50" rx="4" />
      <line x1="0" y1="16" x2="56" y2="16" />
      <circle cx="10" cy="8" r="2" fill="#207448" />
      <circle cx="18" cy="8" r="2" fill="#207448" />
      <circle cx="26" cy="8" r="2" fill="#207448" />
      <line x1="12" y1="28" x2="30" y2="28" stroke-width="3" />
      <line x1="12" y1="38" x2="44" y2="38" stroke-width="3" />
    </g>
    <text x="990" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="990" dy="0">ASGI app</tspan>
      <tspan x="990" dy="44" font-family="ui-monospace, monospace" font-size="26" font-weight="normal">(FastAPI)</tspan>
    </text>
  </g>

  
  <line x1="1140" y1="335" x2="1216" y2="335" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />

  
  <g id="node-route-handler">
    <rect x="1220" y="170" width="300" height="330" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    <circle cx="1264" cy="214" r="24" fill="#db8129" />
    <text x="1264" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(1342, 230)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 16 8 L 4 25 L 16 42" />
      <path d="M 40 8 L 52 25 L 40 42" />
      <line x1="32" y1="8" x2="24" y2="42" />
    </g>
    <text x="1370" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1370" dy="0">route handler</tspan>
      <tspan x="1370" dy="44" font-family="ui-monospace, monospace" font-size="26" font-weight="normal">async def</tspan>
    </text>
  </g>

  
  <g id="chip-wsgi">
    <rect x="80" y="570" width="680" height="230" rx="16" fill="#ffffff" stroke="#a4b8ab" stroke-width="2" />
    
    <g transform="translate(396, 606)" stroke="#607268" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="6" width="30" height="28" rx="4" />
      <line x1="30" y1="20" x2="44" y2="20" />
      <polyline points="38,14 44,20 38,26" />
      <rect x="44" y="0" width="4" height="40" fill="#607268" />
    </g>
    <text x="420" y="692" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="420" dy="0" font-size="28" font-weight="bold">WSGI is synchronous,</tspan>
      <tspan x="420" dy="42" font-size="25" font-weight="normal">one request per worker</tspan>
    </text>
  </g>

  
  <g id="chip-asgi">
    <rect x="840" y="570" width="680" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1156, 606)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 20 A 16 16 0 1 1 24 36" />
      <polyline points="28,26 24,36 14,34" />
      <circle cx="8" cy="20" r="3" fill="#207448" />
      <line x1="38" y1="12" x2="48" y2="12" />
      <line x1="38" y1="22" x2="48" y2="22" />
      <line x1="38" y1="32" x2="48" y2="32" />
    </g>
    <text x="1180" y="692" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#207448">
      <tspan x="1180" dy="0" font-size="28" font-weight="bold">ASGI is asynchronous,</tspan>
      <tspan x="1180" dy="42" font-size="25" font-weight="normal" fill="#303a36">many waiting requests per worker</tspan>
    </text>
  </g>
</svg>