<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Mutable Default Argument State Leak across Function Invocations</title>
  <desc>Comparison diagram showing Python mutable default argument state leak versus safe None idiom.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">
    Mutable Default Argument State Leak across Function Invocations
  </text>

  
  <rect x="40" y="95" width="1520" height="505" rx="16" fill="#faeceb" stroke="#db8129" stroke-width="2"/>

  
  <rect x="70" y="115" width="620" height="46" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="85" y="147" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">
    Buggy: def add_node(ip, nodes=[])
  </text>

  
  <rect x="1140" y="115" width="390" height="46" rx="8" fill="#d9383a"/>
  <text x="1335" y="147" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff">
    State leaked across requests!
  </text>

  
  <g transform="translate(70, 180)">
    <rect width="440" height="395" rx="12" fill="#ffffff" stroke="#d0dad3" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#207448"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">0</text>
    
    <path d="M 100 46 A 14 14 0 1 0 128 46 A 14 14 0 1 0 100 46 M 114 26 L 114 32 M 114 60 L 114 66 M 94 46 L 100 46 M 128 46 L 134 46" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="146" y="54" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Step 0 (Import time)</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">function object &apos;add_node&apos;</tspan>
      <tspan x="24" y="150">is created in memory;</tspan>
      <tspan x="24" y="195">its attribute &apos;__defaults__&apos;</tspan>
      <tspan x="24" y="230">points to a single list</tspan>
      <tspan x="24" y="265">object &apos;[]&apos; in heap memory.</tspan>
    </text>

    
    <rect x="24" y="305" width="392" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="40" y="346" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">__defaults__ → []</text>
  </g>

  
  <g transform="translate(550, 180)">
    <rect width="455" height="395" rx="12" fill="#ffffff" stroke="#d0dad3" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#207448"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 96 46 L 126 46 M 116 36 L 126 46 L 116 56" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="54" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Step 1 (Call 1: add_node(&apos;10.0.0.1&apos;))</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">caller omits nodes argument;</tspan>
      <tspan x="24" y="160">function appends &apos;10.0.0.1&apos;</tspan>
      <tspan x="24" y="195">into the shared default list;</tspan>
      <tspan x="24" y="245">returned value is</tspan>
    </text>

    <rect x="24" y="275" width="405" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="40" y="314" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">[&apos;10.0.0.1&apos;]</text>
  </g>

  
  <g transform="translate(1045, 180)">
    <rect width="485" height="395" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#db8129"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
    
    <path d="M 112 30 L 128 62 L 96 62 Z" stroke="#db8129" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <text x="140" y="54" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Step 2 (Call 2: add_node(&apos;10.0.0.2&apos;))</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">second request omits nodes argument;</tspan>
      <tspan x="24" y="160">function accesses the SAME heap list,</tspan>
      <tspan x="24" y="195">appending &apos;10.0.0.2&apos;;</tspan>
      <tspan x="24" y="245">returned value is</tspan>
    </text>

    <rect x="24" y="275" width="435" height="60" rx="8" fill="#fff3e6" stroke="#db8129" stroke-width="2"/>
    <text x="40" y="314" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">[&apos;10.0.0.1&apos;, &apos;10.0.0.2&apos;]</text>
  </g>

  
  <path d="M 510 377 L 548 377" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M 1005 377 L 1043 377" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" fill="none"/>

  
  <rect x="40" y="630" width="1520" height="505" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="70" y="650" width="670" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="85" y="682" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">
    Safe Idiom: def add_node_safe(ip, nodes=None)
  </text>

  
  <rect x="1100" y="650" width="430" height="46" rx="8" fill="#207448"/>
  <text x="1315" y="682" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff">
    Clean isolation across all calls
  </text>

  
  <g transform="translate(70, 715)">
    <rect width="440" height="395" rx="12" fill="#ffffff" stroke="#d0dad3" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#207448"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">0</text>
    
    <path d="M 114 30 L 128 36 L 128 50 C 128 58 114 65 114 65 C 114 65 100 58 100 50 L 100 36 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <text x="146" y="54" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Step 0 (Import time)</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">&apos;__defaults__&apos; points to</tspan>
      <tspan x="24" y="150">immutable singleton</tspan>
      <tspan x="24" y="195">&apos;None&apos;.</tspan>
    </text>

    <rect x="24" y="275" width="392" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="40" y="316" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">__defaults__ → None</text>
  </g>

  
  <g transform="translate(550, 715)">
    <rect width="455" height="395" rx="12" fill="#ffffff" stroke="#d0dad3" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#207448"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
    
    <rect x="98" y="32" width="28" height="28" rx="4" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M 104 32 L 104 26 M 120 32 L 120 26 M 104 60 L 104 66 M 120 60 L 120 66" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="142" y="54" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Step 1 (Call 1)</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">&apos;if nodes is None&apos;</tspan>
      <tspan x="24" y="155">evaluates to True;</tspan>
      <tspan x="24" y="205">fresh list L1</tspan>
    </text>

    <rect x="24" y="275" width="405" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="40" y="314" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">[&apos;10.0.0.1&apos;]</text>
    <text x="24" y="365" font-family="sans-serif" font-size="24px" fill="#303a36">is allocated.</text>
  </g>

  
  <g transform="translate(1045, 715)">
    <rect width="485" height="395" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#207448"/>
    <text x="46" y="55" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
    
    <rect x="98" y="32" width="28" height="28" rx="4" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M 104 32 L 104 26 M 120 32 L 120 26 M 104 60 L 104 66 M 120 60 L 120 66" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="142" y="54" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Step 2 (Call 2)</text>

    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" y="115">fresh list L2</tspan>
    </text>

    <rect x="24" y="165" width="435" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="40" y="204" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">[&apos;10.0.0.2&apos;]</text>

    <text x="24" y="265" font-family="sans-serif" font-size="24px" fill="#303a36">is allocated.</text>
  </g>

  
  <path d="M 510 912 L 548 912" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M 1005 912 L 1043 912" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
</svg>