<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>What the class statement does</title>
  <desc>A visual explanation of how Python executes a class statement in four sequential steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="95" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">What the class statement does</text>

  
  <line x1="380" y1="360" x2="440" y2="360" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="770" y1="360" x2="830" y2="360" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1160" y1="360" x2="1220" y2="360" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="190" width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="105" cy="245" r="24" fill="#207448"/>
  <text x="105" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">1</text>
  
  <g transform="translate(195, 217)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="8" r="2.5" fill="#207448"/>
    <circle cx="18" cy="8" r="2.5" fill="#207448"/>
    <path d="M 19 28 L 14 34 L 19 40" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 37 28 L 42 34 L 37 40" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <text x="215" y="350" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="215" dy="0">class body runs</tspan>
    <tspan x="215" dy="45">in a fresh</tspan>
    <tspan x="215" dy="45">namespace</tspan>
  </text>

  
  <rect x="440" y="190" width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="495" cy="245" r="24" fill="#207448"/>
  <text x="495" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">2</text>
  
  <g transform="translate(585, 217)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="16" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="40" x2="42" y2="40" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="9" cy="16" r="2" fill="#207448"/>
    <circle cx="9" cy="28" r="2" fill="#207448"/>
    <circle cx="9" cy="40" r="2" fill="#207448"/>
  </g>
  
  <text x="605" y="350" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="605" dy="0">Python collects</tspan>
    <tspan x="605" dy="45">name, bases and</tspan>
    <tspan x="605" dy="45">namespace</tspan>
  </text>

  
  <rect x="830" y="190" width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="885" cy="245" r="24" fill="#207448"/>
  <text x="885" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">3</text>
  
  <g transform="translate(975, 217)">
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11" stroke="#207448" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  
  <text x="995" y="335" text-anchor="middle" fill="#303a36">
    <tspan x="995" dy="0" font-size="26" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">calls</tspan>
    <tspan x="995" dy="40" font-size="24" font-weight="bold" font-family="'SF Mono', 'Cascadia Code', monospace">type(name, bases,</tspan>
    <tspan x="995" dy="38" font-size="24" font-weight="bold" font-family="'SF Mono', 'Cascadia Code', monospace">namespace)</tspan>
    <tspan x="995" dy="44" font-size="24" font-family="system-ui, -apple-system, sans-serif">(or the metaclass)</tspan>
  </text>

  
  <rect x="1220" y="190" width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="1275" cy="245" r="24" fill="#207448"/>
  <text x="1275" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">4</text>
  
  <g transform="translate(1365, 217)">
    <path d="M 28 3 L 51 16 L 51 42 L 28 55 L 5 42 L 5 16 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="28" y1="55" x2="28" y2="29" stroke="#207448" stroke-width="3.5"/>
    <line x1="28" y1="29" x2="51" y2="16" stroke="#207448" stroke-width="3.5"/>
    <line x1="28" y1="29" x2="5" y2="16" stroke="#207448" stroke-width="3.5"/>
  </g>
  
  <text x="1385" y="350" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="1385" dy="0">a class object</tspan>
    <tspan x="1385" dy="45">is created and</tspan>
    <tspan x="1385" dy="45">bound to the name</tspan>
  </text>

  
  <path d="M 1150 610 L 1365 610 L 1385 550 L 1405 610 L 1530 610 A 16 16 0 0 1 1550 626 L 1550 784 A 16 16 0 0 1 1530 800 L 1150 800 A 16 16 0 0 1 1130 784 L 1130 626 A 16 16 0 0 1 1150 610 Z" fill="#fff5eb" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
  
  <text x="1340" y="675" text-anchor="middle" fill="#303a36">
    <tspan x="1340" dy="0" font-size="26" font-weight="bold" font-family="'SF Mono', 'Cascadia Code', monospace">__init_subclass__</tspan>
    <tspan x="1340" dy="44" font-size="25" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">and class decorators</tspan>
    <tspan x="1340" dy="44" font-size="25" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">hook in here</tspan>
  </text>
</svg>