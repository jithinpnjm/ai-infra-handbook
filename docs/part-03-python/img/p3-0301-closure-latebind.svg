<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Closures: remembering n, and the late-binding trap</title>
  <desc>Visual infographic explaining closures, the nonlocal keyword, variable lookup rules, and the late-binding trap in Python.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Closures: remembering n, and the late-binding trap</text>

  
  <g id="panel-make-counter">
    <rect x="40" y="135" width="900" height="560" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="65" y="152" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 85 170 L 77 180 L 85 190 M 101 170 L 109 180 L 101 190 M 96 166 L 90 194" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    
    <text x="135" y="191" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">make_counter</text>

    
    <rect x="65" y="222" width="850" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="90" y="258">n = 0; def inc(): nonlocal n;</tspan>
      <tspan x="90" y="292">n += 1; return n; return inc</tspan>
    </text>

    
    <line x1="95" y1="345" x2="95" y2="445" stroke="#207448" stroke-width="3" stroke-dasharray="6 6"/>

    
    <circle cx="95" cy="345" r="24" fill="#207448"/>
    <text x="95" y="353" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="135" y="353" font-family="monospace" font-size="24" fill="#303a36">c = make_counter() creates n = 0 and inc</text>

    
    <circle cx="95" cy="395" r="24" fill="#207448"/>
    <text x="95" y="403" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="135" y="403" font-family="monospace" font-size="24" fill="#303a36">c() returns 1</text>

    
    <circle cx="95" cy="445" r="24" fill="#207448"/>
    <text x="95" y="453" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="135" y="453" font-family="monospace" font-size="24" fill="#303a36">c() returns 2</text>

    
    <rect x="65" y="485" width="850" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="521">a closure: inc remembers n from the</tspan>
      <tspan x="90" y="555">function that created it</tspan>
    </text>

    
    <rect x="65" y="585" width="850" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" y="621">bump() with global counter rebinding</tspan>
      <tspan x="90" y="655">a module-level name</tspan>
    </text>
  </g>

  
  <g id="panel-late-binding">
    <rect x="980" y="135" width="580" height="560" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5"/>

    
    <circle cx="1038" cy="180" r="26" fill="none" stroke="#db8129" stroke-width="4"/>
    <polyline points="1038,164 1038,180 1052,180" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>

    
    <text x="1085" y="191" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Late binding</text>

    
    <rect x="1005" y="222" width="530" height="150" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="1030" y="275" font-family="monospace" font-weight="bold" fill="#db8129">[lambda: i for i in range(3)]</tspan>
      <tspan x="1030" y="325" font-family="sans-serif">all three see the final i</tspan>
    </text>

    
    <rect x="1005" y="395" width="530" height="282" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-size="24" fill="#303a36">
      <tspan x="1030" y="455" font-family="sans-serif">fix </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">'lambda i=i: i'</tspan>
      <tspan x="1030" y="515" font-family="sans-serif">binds the value at creation, or</tspan>
      <tspan x="1030" y="575" font-family="monospace">use functools.partial</tspan>
    </text>
  </g>

  
  <g id="rule-strip">
    <rect x="40" y="740" width="1520" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" y="778">name lookup order L, E, G, B; assignment inside a function makes a name</tspan>
      <tspan x="70" y="808">local unless declared global or nonlocal; reading a global needs no declaration;</tspan>
      <tspan x="70" y="838">assigning without global creates a local, and reading that local earlier in the</tspan>
      <tspan x="70" y="868">same function raises UnboundLocalError; prefer passing values and returning</tspan>
      <tspan x="70" y="898">results over mutable globals; UPPER_CASE module constants are fine</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="40" y="965" width="1520" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" y="1008">Locals: res, seq1, seq2 and x in intersect exist only while the call runs;</tspan>
      <tspan x="70" y="1042">the returned object lives on, the name goes away</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1105" width="1520" height="55" rx="8" fill="#207448"/>
    <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Use nonlocal for state kept in a closure, and default arguments to freeze a value</text>
  </g>
</svg>