<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1270" width="1600" height="1270">
  <title>One blocking call freezes every task, and how to route work off the loop</title>
  <desc>Visual explanation of how blocking operations stall Python asyncio event loops and how to properly offload them using threads, processes, and async libraries.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1270" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">
    One blocking call freezes every task, and how to route work off the loop
  </text>

  
  <g transform="translate(50, 95)">
    
    <rect x="0" y="0" width="1500" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="45" cy="40" r="20" fill="#207448" />
    <path d="M 37 40 A 8 8 0 1 1 51 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <polygon points="52,40 55,48 47,46" fill="#ffffff" />
    <text x="80" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      a single event loop thread with tasks A, B, C
    </text>

    
    <rect x="35" y="80" width="240" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="155" y="133" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      task A runs
    </text>

    
    <line x1="275" y1="125" x2="345" y2="125" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="355" y="80" width="760" height="90" rx="10" fill="#fff7f0" stroke="#db8129" stroke-width="3" />
    <text x="735" y="118" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="735" dy="0">blocking call</tspan>
      <tspan x="735" dy="32" font-family="monospace" font-size="24" font-weight="normal">(time.sleep, requests.get, subprocess.run, heavy CPU)</tspan>
    </text>

    
    <line x1="1115" y1="125" x2="1185" y2="125" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="1195" y="80" width="270" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1330" y="133" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      every other task waits
    </text>

    
    <rect x="35" y="195" width="1430" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="750" y="226" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      a task is never paused except at an await, so all other tasks stall; timeouts fire everywhere
    </text>
  </g>

  
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="1500" height="515" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(35, 30)">
      <rect x="0" y="0" width="460" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="230" y="51" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
        blocking function
      </text>

      <line x1="460" y1="42" x2="525" y2="42" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

      <rect x="535" y="0" width="895" height="85" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="560" y="34" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="560" dy="0">await asyncio.to_thread(blocking_fn, args) (3.9)</tspan>
        <tspan x="560" dy="32">or loop.run_in_executor(executor, fn, *args)</tspan>
      </text>
    </g>

    
    <g transform="translate(35, 135)">
      <rect x="0" y="0" width="460" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="230" y="46" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
        CPU-bound function
      </text>

      <line x1="460" y1="37" x2="525" y2="37" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

      <rect x="535" y="0" width="895" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="560" y="46" font-family="monospace" font-size="24" fill="#303a36">
        run_in_executor with a ProcessPoolExecutor
      </text>
    </g>

    
    <g transform="translate(35, 230)">
      <rect x="0" y="0" width="460" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="230" y="46" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
        sync libraries requests, paramiko, boto3
      </text>

      <line x1="460" y1="37" x2="525" y2="37" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

      <rect x="535" y="0" width="895" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="560" y="46" font-family="monospace" font-size="24" fill="#303a36">
        wrap with to_thread
      </text>
    </g>

    
    <g transform="translate(35, 325)">
      <rect x="0" y="0" width="1430" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="25" y="38" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">async libraries: aiohttp, httpx, asyncssh, aiofiles (uses threads under the hood), asyncpg,</tspan>
        <tspan x="25" dy="34">redis.asyncio, aiokafka, kubernetes_asyncio, aioboto3, aiobotocore, grpc.aio</tspan>
      </text>
    </g>

    
    <g transform="translate(35, 438)">
      <rect x="0" y="0" width="1430" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <circle cx="30" cy="27" r="14" fill="#207448" />
      <text x="30" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">i</text>
      <text x="60" y="36" font-family="sans-serif" font-size="24" fill="#303a36">
        uvloop: faster drop-in loop on Linux and macOS
      </text>
    </g>
  </g>

  
  <g transform="translate(50, 920)">
    <rect x="0" y="0" width="1500" height="215" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="35" y="28" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 45 44 L 53 51 L 45 58" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="59" y1="58" x2="75" y2="58" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    <text x="110" y="55" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">asyncio.run(main(), debug=True) or PYTHONASYNCIODEBUG=1 logs callbacks longer than 100 ms</tspan>
      <tspan x="110" dy="46">(loop.slow_callback_duration), coroutines never awaited and tasks destroyed while pending;</tspan>
      <tspan x="110" dy="46">asyncio.all_tasks() and task.print_stack() show where tasks are stuck;</tspan>
      <tspan x="110" dy="46">py-spy dump --pid when the loop itself is blocked</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1160)">
    <rect x="0" y="0" width="1500" height="70" rx="12" fill="#207448" />
    <text x="750" y="46" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Keep the loop free
    </text>
  </g>
</svg>