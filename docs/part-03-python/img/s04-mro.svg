<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The method resolution order</title>
  <desc>Visual explanation of the Python method resolution order (MRO) with a diamond inheritance graph and the resulting linearized MRO search order.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The method resolution order</text>

  
  <g id="left-panel">
    
    <rect x="80" y="110" width="720" height="740" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    
    <path d="M 270 365 V 305 H 380 V 247" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <path d="M 610 365 V 305 H 500 V 247" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <path d="M 380 575 V 515 H 270 V 457" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <path d="M 500 575 V 515 H 610 V 457" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="node-class-a">
      <rect x="310" y="155" width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
      
      <g transform="translate(330, 172)">
        <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" />
      </g>
      <text x="400" y="211" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">class A</text>
    </g>

    
    <g id="node-class-b">
      <rect x="140" y="365" width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
      
      <g transform="translate(160, 382)">
        <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" />
      </g>
      <text x="230" y="421" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">class B</text>
    </g>

    
    <g id="node-class-c">
      <rect x="480" y="365" width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
      
      <g transform="translate(500, 382)">
        <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" />
      </g>
      <text x="570" y="421" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">class C</text>
    </g>

    
    <g id="node-class-d">
      <rect x="310" y="575" width="260" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
      
      <g transform="translate(330, 592)">
        <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" />
        <line x1="4" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" />
      </g>
      <text x="400" y="631" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">class D</text>
    </g>

    
    <g id="code-chip">
      <rect x="250" y="715" width="380" height="80" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(270, 727)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
        <path d="M 14 20 L 26 28 L 14 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="30" y1="36" x2="42" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>
      <text x="348" y="765" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">class D(B, C)</text>
    </g>
  </g>

  
  <g id="right-panel">
    
    <rect x="840" y="110" width="680" height="740" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g id="header-mro">
      <rect x="910" y="135" width="540" height="60" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(1125, 147)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round">
        <line x1="6" y1="9" x2="36" y2="9" />
        <line x1="6" y1="18" x2="36" y2="18" />
        <line x1="6" y1="27" x2="36" y2="27" />
      </g>
      <text x="1180" y="177" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">MRO</text>
    </g>

    
    <g id="item-1">
      <rect x="910" y="215" width="540" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="955" cy="250" r="24" fill="#207448" />
      <text x="955" y="259" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      
      <g transform="translate(1000, 228)">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="3" />
      </g>
      <text x="1070" y="261" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">D</text>
    </g>

    
    <g id="item-2">
      <rect x="910" y="300" width="540" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="955" cy="335" r="24" fill="#207448" />
      <text x="955" y="344" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      
      <g transform="translate(1000, 313)">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="3" />
      </g>
      <text x="1070" y="346" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">B</text>
    </g>

    
    <g id="item-3">
      <rect x="910" y="385" width="540" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="955" cy="420" r="24" fill="#207448" />
      <text x="955" y="429" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      
      <g transform="translate(1000, 398)">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="3" />
      </g>
      <text x="1070" y="431" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">C</text>
    </g>

    
    <g id="item-4">
      <rect x="910" y="470" width="540" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="955" cy="505" r="24" fill="#207448" />
      <text x="955" y="514" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      
      <g transform="translate(1000, 483)">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="3" />
      </g>
      <text x="1070" y="516" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">A</text>
    </g>

    
    <g id="item-5">
      <rect x="910" y="555" width="540" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="955" cy="590" r="24" fill="#207448" />
      <text x="955" y="599" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      
      <g transform="translate(1000, 568)">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="3" />
      </g>
      <text x="1070" y="601" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">object</text>
    </g>

    
    <g id="orange-note">
      <rect x="910" y="650" width="540" height="155" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
      
      <g transform="translate(935, 700)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="27" cy="27" r="23" />
        <path d="M 27 15 L 39 27 L 27 39" />
        <line x1="15" y1="27" x2="39" y2="27" />
      </g>
      
      <text x="1010" y="722">
        <tspan font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">super()</tspan><tspan font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129"> calls the</tspan>
        <tspan x="1010" dy="40" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">next class in this order</tspan>
      </text>
    </g>
  </g>
</svg>