<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A Redfish session from login to logout, and why logout matters</title>
  <desc>Visual explanation of the Redfish REST session lifecycle between Client and BMC, why explicit logout prevents lockout, context manager habits, and long-running task polling.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A Redfish session from login to logout,</tspan>
    <tspan x="800" dy="50">and why logout matters</tspan>
  </text>

  
  <line x1="180" y1="185" x2="180" y2="800" stroke="#a8c5b2" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1420" y1="185" x2="1420" y2="800" stroke="#a8c5b2" stroke-width="3" stroke-dasharray="8 6" />

  
  <rect x="70" y="120" width="220" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <rect x="90" y="132" width="36" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="84" y1="160" x2="132" y2="160" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="195" y="163" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client</text>

  
  <rect x="1310" y="120" width="220" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <rect x="1330" y="130" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1338" y1="139" x2="1358" y2="139" stroke="#207448" stroke-width="2.5" />
  <line x1="1338" y1="147" x2="1350" y2="147" stroke="#207448" stroke-width="2.5" />
  <circle cx="1356" cy="147" r="2" fill="#207448" />
  <text x="1435" y="163" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">BMC</text>

  
  <circle cx="225" cy="223" r="22" fill="#207448" />
  <text x="225" y="231" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <rect x="270" y="190" width="1060" height="66" rx="6" fill="#ffffff" stroke="#a8c5b2" stroke-width="1.5" />
  <text x="800" y="217" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">POST /redfish/v1/SessionService/Sessions</tspan>
    <tspan x="800" dy="28">with UserName and Password, once</tspan>
  </text>
  <line x1="180" y1="266" x2="1410" y2="266" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="1375" cy="308" r="22" fill="#207448" />
  <text x="1375" y="316" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <rect x="270" y="275" width="1060" height="66" rx="6" fill="#ffffff" stroke="#a8c5b2" stroke-width="1.5" />
  <text x="800" y="302" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">response gives X-Auth-Token header and Location header</tspan>
    <tspan x="800" dy="28">(the session URI, needed to log out)</tspan>
  </text>
  <line x1="1420" y1="351" x2="190" y2="351" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="225" cy="393" r="22" fill="#207448" />
  <text x="225" y="401" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <rect x="270" y="360" width="1060" height="66" rx="6" fill="#ffffff" stroke="#a8c5b2" stroke-width="1.5" />
  <text x="800" y="387" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">every later call sends X-Auth-Token,</tspan>
    <tspan x="800" dy="28">so the password does not travel with each request</tspan>
  </text>
  <line x1="180" y1="436" x2="1410" y2="436" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="225" cy="478" r="22" fill="#207448" />
  <text x="225" y="486" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <rect x="270" y="445" width="1060" height="66" rx="6" fill="#ffffff" stroke="#a8c5b2" stroke-width="1.5" />
  <text x="800" y="472" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">GET /redfish/v1/Systems then follow Members @odata.id:</tspan>
    <tspan x="800" dy="28">do not hard-code ids</tspan>
  </text>
  <line x1="180" y1="521" x2="1410" y2="521" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="225" cy="585" r="22" fill="#207448" />
  <text x="225" y="593" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <rect x="270" y="530" width="1060" height="116" rx="6" fill="#ffffff" stroke="#a8c5b2" stroke-width="1.5" />
  <text x="800" y="556" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">power(reset_type): read Actions #ComputerSystem.Reset target</tspan>
    <tspan x="800" dy="26">and ResetType@Redfish.AllowableValues; if reset_type not in allowed</tspan>
    <tspan x="800" dy="26">raise ValueError locally, before anything reaches the BMC;</tspan>
    <tspan x="800" dy="26">else POST ResetType</tspan>
  </text>
  <line x1="180" y1="656" x2="1410" y2="656" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="225" cy="688" r="22" fill="#db8129" />
  <text x="225" y="696" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <rect x="270" y="665" width="1060" height="46" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="800" y="696" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">DELETE session_uri on close()</text>
  <line x1="180" y1="721" x2="1410" y2="721" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <rect x="270" y="733" width="1060" height="68" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2" />
  <path d="M 315 745 L 333 777 L 297 777 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
  <line x1="315" y1="755" x2="315" y2="766" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <circle cx="315" cy="772" r="1.5" fill="#db8129" />
  <text x="815" y="759" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="815" dy="0">BMCs allow only a few concurrent sessions;</tspan>
    <tspan x="815" dy="28">a leaked session can lock you out until it times out</tspan>
  </text>

  
  <rect x="60" y="820" width="1480" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <path d="M 105 845 L 125 853 C 125 873 105 885 105 885 C 105 885 85 873 85 853 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 97 863 L 103 869 L 114 858" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="160" y="852" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">wrap in a context manager (with Redfish(host, USER, PASS) as rf) or put cleanup in finally;</tspan>
    <tspan x="160" dy="28">verify=False only in labs, BMC certs are often self-signed,</tspan>
    <tspan x="160" dy="28">pin or manage the CA in production</tspan>
  </text>

  
  <rect x="60" y="945" width="1480" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="1012" r="20" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 105 999 L 105 1012 L 116 1012" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="160" y="976" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">long actions answer 202 Accepted with a Location pointing to a task monitor;</tspan>
    <tspan x="160" dy="27">poll until TaskState is Completed or Exception, with a timeout;</tspan>
    <tspan x="160" dy="27">a firmware update can take many minutes and reboot the BMC,</tspan>
    <tspan x="160" dy="27">so expect connection errors partway through</tspan>
  </text>

  
  <rect x="60" y="1095" width="1480" height="65" rx="10" fill="#207448" />
  <text x="800" y="1138" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Always log out</text>
</svg>