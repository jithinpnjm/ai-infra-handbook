<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>Row storage versus columnar storage</title>
  <desc>Visual comparison showing row storage record-by-record layout versus columnar storage column-by-column layout where a query reads only the temp column.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 1, 9 4.5, 0 8" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Row storage versus columnar storage</text>

  
  <g id="table-node">
    
    <g transform="translate(390, 118)">
      <rect x="0" y="0" width="48" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="0" x2="16" y2="42" stroke="#207448" stroke-width="3"/>
      <line x1="32" y1="0" x2="32" y2="42" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="460" y="98" width="680" height="136" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="460" y1="148" x2="1140" y2="148" stroke="#207448" stroke-width="2"/>
    <line x1="686" y1="98" x2="686" y2="234" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="913" y1="98" x2="913" y2="234" stroke="#c8dcd0" stroke-width="2"/>

    
    <text x="573" y="135" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">host</text>
    <text x="800" y="135" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">gpu</text>
    <text x="1026" y="135" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">temp</text>

    
    <rect x="478" y="158" width="190" height="28" rx="4" fill="#e8f1ea"/>
    <rect x="704" y="158" width="190" height="28" rx="4" fill="#e8f1ea"/>
    <rect x="931" y="158" width="190" height="28" rx="4" fill="#faeee1" stroke="#db8129" stroke-width="1.5"/>

    <rect x="478" y="194" width="190" height="28" rx="4" fill="#e8f1ea"/>
    <rect x="704" y="194" width="190" height="28" rx="4" fill="#e8f1ea"/>
    <rect x="931" y="194" width="190" height="28" rx="4" fill="#faeee1" stroke="#db8129" stroke-width="1.5"/>
  </g>

  
  <g id="left-panel">
    <rect x="60" y="265" width="710" height="505" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(95, 292)">
      <ellipse cx="28" cy="14" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 2 14 v 36 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10 v -36" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 2 26 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 38 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="175" y="326" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Row storage</text>
    <text x="175" y="362" font-family="sans-serif" font-size="24" fill="#303a36">values stored record by record</text>

    
    <rect x="95" y="395" width="640" height="345" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>

    
    <rect x="120" y="420" width="590" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="135" y="433" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="330" y="433" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="525" y="433" width="165" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>

    
    <rect x="120" y="525" width="590" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="135" y="538" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="330" y="538" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="525" y="538" width="165" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>

    
    <rect x="120" y="630" width="590" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="135" y="643" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="330" y="643" width="165" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="525" y="643" width="165" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>
  </g>

  
  <g id="right-panel">
    <rect x="830" y="265" width="710" height="505" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(865, 292)">
      <ellipse cx="28" cy="14" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 2 14 v 36 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10 v -36" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 19 22 v 37" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 37 22 v 37" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="945" y="326" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Columnar (Parquet, Arrow)</text>
    <text x="945" y="362" font-family="sans-serif" font-size="24" fill="#303a36">values stored column by column</text>

    
    <rect x="865" y="395" width="640" height="345" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>

    
    <text x="1310" y="442" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">a query reads only the temp column</text>
    <path d="M 1325 435 H 1380 V 485" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

    
    <rect x="895" y="495" width="165" height="215" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="910" y="510" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="910" y="575" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="910" y="640" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

    
    <rect x="1090" y="495" width="165" height="215" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <rect x="1105" y="510" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="1105" y="575" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="1105" y="640" width="135" height="54" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

    
    <rect x="1285" y="495" width="190" height="215" rx="8" fill="#fff7ef" stroke="#db8129" stroke-width="3"/>
    <rect x="1302" y="510" width="156" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>
    <rect x="1302" y="575" width="156" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>
    <rect x="1302" y="640" width="156" height="54" rx="6" fill="#faeee1" stroke="#db8129" stroke-width="2"/>
  </g>

  
  <g id="bottom-bar">
    <rect x="60" y="805" width="1480" height="80" rx="14" fill="#207448"/>
    <text x="800" y="855" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">columnar files read less data and compress better</text>
  </g>
</svg>