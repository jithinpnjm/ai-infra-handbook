<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Hypothesis finds and shrinks failures</title>
  <desc>A flow of four boxes showing how Hypothesis states a property, generates inputs, finds a failure, and shrinks it to the smallest example, with a takeaway comparing example-based tests to properties.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="82" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Hypothesis finds and shrinks failures</text>

  
  <rect x="60" y="140" width="340" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <circle cx="230" cy="188" r="24" fill="#207448" />
  <text x="230" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  
  <g transform="translate(202, 238)">
    <rect x="6" y="2" width="44" height="52" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="16" x2="34" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="16" y1="26" x2="40" y2="26" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 16 38 L 24 44 L 38 32" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="230" y="360" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="230" dy="0">you state a</tspan>
    <tspan x="230" dy="40">property</tspan>
  </text>
  <text x="230" y="470" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="230" dy="0">(for all inputs,</tspan>
    <tspan x="230" dy="36">the result is valid)</tspan>
  </text>

  
  <line x1="400" y1="380" x2="440" y2="380" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="440" y="140" width="340" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <circle cx="610" cy="188" r="24" fill="#207448" />
  <text x="610" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  
  <g transform="translate(582, 238)">
    <rect x="4" y="4" width="48" height="48" rx="10" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="16" r="3.5" fill="#207448" />
    <circle cx="40" cy="16" r="3.5" fill="#207448" />
    <circle cx="28" cy="28" r="3.5" fill="#207448" />
    <circle cx="16" cy="40" r="3.5" fill="#207448" />
    <circle cx="40" cy="40" r="3.5" fill="#207448" />
  </g>

  
  <text x="610" y="370" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="610" dy="0">Hypothesis</tspan>
    <tspan x="610" dy="40">generates</tspan>
    <tspan x="610" dy="40">many inputs</tspan>
  </text>

  
  <line x1="780" y1="380" x2="820" y2="380" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="820" y="140" width="340" height="480" rx="16" fill="#fdf3e7" stroke="#db8129" stroke-width="3.5" />
  
  
  <circle cx="990" cy="188" r="24" fill="#db8129" />
  <text x="990" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  
  <g transform="translate(962, 238)">
    <path d="M 28 4 L 54 48 L 2 48 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="41" r="2.5" fill="#db8129" />
  </g>

  
  <text x="990" y="380" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="990" dy="0">one input</tspan>
    <tspan x="990" dy="40">fails</tspan>
  </text>

  
  <line x1="1160" y1="380" x2="1200" y2="380" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="1200" y="140" width="340" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <circle cx="1370" cy="188" r="24" fill="#207448" />
  <text x="1370" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  
  <g transform="translate(1342, 238)">
    <rect x="22" y="22" width="12" height="12" rx="2" fill="#207448" />
    
    <path d="M 28 4 L 28 15 M 23 10 L 28 15 L 33 10" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 52 L 28 41 M 23 46 L 28 41 L 33 46" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 4 28 L 15 28 M 10 23 L 15 28 L 10 33" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 28 L 41 28 M 46 23 L 41 28 L 46 33" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="1370" y="360" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1370" dy="0">Hypothesis</tspan>
    <tspan x="1370" dy="40">shrinks it to</tspan>
    <tspan x="1370" dy="40">the smallest</tspan>
    <tspan x="1370" dy="40">failing example</tspan>
  </text>

  
  <rect x="60" y="660" width="1480" height="160" rx="16" fill="#207448" />
  <text x="800" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">example-based tests check the cases you thought of,</tspan>
    <tspan x="800" dy="44">properties check the ones you did not.</tspan>
  </text>
</svg>