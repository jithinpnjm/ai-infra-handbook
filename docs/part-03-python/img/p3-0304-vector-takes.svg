<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The N-dimensional Vector, one capability at a time (Takes 1 to 5)</title>
  <desc>A five step ladder infographic illustrating vector capability development in Python from short representation to custom operators, with worked results and design takeaway.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">The N-dimensional Vector,</text>
  <text x="40" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">one capability at a time (Takes 1 to 5)</text>

  

  
  <g id="step-1">
    <rect x="40" y="140" width="500" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="76" cy="182" r="24" fill="#207448"/>
    <text x="76" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(470, 156)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 0 L 32 0 L 44 12 L 44 48 L 0 48 Z"/>
      <path d="M 32 0 L 32 12 L 44 12"/>
      <line x1="8" y1="22" x2="36" y2="22"/>
      <line x1="8" y1="32" x2="28" y2="32"/>
    </g>
    
    <text x="114" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">short <tspan font-family="ui-monospace, monospace">__repr__</tspan></text>
    <text x="114" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">with <tspan font-family="ui-monospace, monospace">reprlib.repr:</tspan></text>
    
    <text x="64" y="254" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">Vector(range(1000))</tspan>
      <tspan x="64" dy="34" font-family="system-ui, -apple-system, sans-serif">is truncated, like</tspan>
      <tspan x="64" dy="34">Vector([0.0, 1.0, 2.0,</tspan>
      <tspan x="64" dy="34">3.0, 4.0, ...])</tspan>
    </text>
  </g>

  
  <g id="step-2">
    <rect x="580" y="140" width="980" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="616" cy="182" r="24" fill="#207448"/>
    <text x="616" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g transform="translate(1494, 156)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 4 L 4 4 L 4 44 L 12 44"/>
      <path d="M 36 4 L 44 4 L 44 44 L 36 44"/>
      <line x1="16" y1="36" x2="32" y2="12"/>
    </g>
    
    <text x="654" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">slice-aware <tspan font-family="ui-monospace, monospace">__getitem__:</tspan></text>
    
    <text x="604" y="238" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="604" dy="0">if isinstance(key, slice): return type(self)(self._components[key]);</tspan>
      <tspan x="604" dy="31">else operator.index(key), which calls __index__ and raises</tspan>
      <tspan x="604" dy="31">TypeError for floats or tuples; slice.indices(length) normalizes bounds;</tspan>
      <tspan x="604" dy="31">SkipObject returns a new iterator from each __iter__ call so</tspan>
      <tspan x="604" dy="31">[x + y for x in skipper for y in skipper] makes 9 pairs from aa to ee,</tspan>
      <tspan x="604" dy="31">while Squares returns self from __iter__ and scans only once</tspan>
    </text>
  </g>

  

  
  <g id="step-3">
    <rect x="40" y="470" width="580" height="345" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="76" cy="512" r="24" fill="#207448"/>
    <text x="76" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(554, 486)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 44 12 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 12 Z"/>
      <path d="M 24 18 L 24 30"/>
      <circle cx="24" cy="34" r="1" fill="#207448"/>
    </g>
    
    <text x="114" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">dynamic read-only attributes x, y, z, t</text>
    <text x="114" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">through <tspan font-family="ui-monospace, monospace">__match_args__</tspan> and <tspan font-family="ui-monospace, monospace">__getattr__</tspan></text>
    <text x="64" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">reading <tspan font-family="ui-monospace, monospace">self._components[0..3];</tspan></text>

    
    <rect x="56" y="582" width="548" height="92" rx="8" fill="#fff3e6" stroke="#db8129" stroke-width="2"/>
    <text x="66" y="608" font-family="ui-monospace, monospace" font-size="24" fill="#db8129" font-weight="bold">
      <tspan x="66" dy="0">trap: v.x = 10 creates v.__dict__[x],</tspan>
      <tspan x="66" dy="28">which shadows __getattr__ while</tspan>
      <tspan x="66" dy="28">v[0] stays unchanged;</tspan>
    </text>

    
    <text x="64" y="704" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">fix: __setattr__ raises AttributeError</tspan>
      <tspan x="64" dy="28">for single lowercase letters a to z;</tspan>
      <tspan x="64" dy="28">allowed writes use super().__setattr__(attr, val)</tspan>
      <tspan x="64" dy="28">to avoid infinite recursion</tspan>
    </text>
  </g>

  
  <g id="step-4">
    <rect x="660" y="470" width="430" height="345" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="696" cy="512" r="24" fill="#207448"/>
    <text x="696" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(1028, 486)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="6" x2="10" y2="42"/>
      <line x1="32" y1="6" x2="28" y2="42"/>
      <line x1="4" y1="18" x2="40" y2="18"/>
      <line x1="2" y1="32" x2="38" y2="32"/>
    </g>
    
    <text x="734" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">hashing:</text>
    
    <text x="680" y="566" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="680" dy="0">functools.reduce(operator.xor,</tspan>
      <tspan x="680" dy="28">(hash(x) for x in self), 0),</tspan>
      <tspan x="680" dy="28">initializer 0 covers empty</tspan>
      <tspan x="680" dy="28">vectors; streaming equality</tspan>
      <tspan x="680" dy="28">len(self) == len(other) and</tspan>
      <tspan x="680" dy="28">all(a == b for a, b in</tspan>
      <tspan x="680" dy="28">zip(self, other)) in O(1)</tspan>
      <tspan x="680" dy="28">extra memory</tspan>
    </text>
  </g>

  
  <g id="step-5">
    <rect x="1130" y="470" width="430" height="345" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1166" cy="512" r="24" fill="#207448"/>
    <text x="1166" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g transform="translate(1498, 486)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="20"/>
      <line x1="24" y1="12" x2="24" y2="36"/>
      <line x1="12" y1="24" x2="36" y2="24"/>
    </g>
    
    <text x="1204" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">operators:</text>
    
    <text x="1150" y="566" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="1150" dy="0">__neg__, __pos__,</tspan>
      <tspan x="1150" dy="28">__add__, __radd__,</tspan>
      <tspan x="1150" dy="28">__mul__, __rmul__,</tspan>
      <tspan x="1150" dy="28">__matmul__, __rmatmul__,</tspan>
      <tspan x="1150" dy="28">__contains__, __iadd__;</tspan>
      <tspan x="1150" dy="28">format h for</tspan>
      <tspan x="1150" dy="28">hyperspherical</tspan>
      <tspan x="1150" dy="28">coordinates</tspan>
    </text>
  </g>

  
  <g id="worked-results">
    <rect x="40" y="855" width="1520" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1494, 875)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="46" height="38" rx="4"/>
      <path d="M 8 12 L 18 20 L 8 28"/>
      <line x1="22" y1="28" x2="36" y2="28"/>
    </g>
    
    <text x="64" y="896" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">Vector([3, 4, 5]) + (10, 20) and (10, 20) + Vector([3, 4, 5]) both give Vector([13.0, 24.0, 5.0])</tspan>
      <tspan x="64" dy="30">using zip_longest(self, other, fillvalue=0.0) and __radd__ = __add__; adding 1 is rejected cleanly</tspan>
      <tspan x="64" dy="30">by returning NotImplemented in except TypeError; Vector([1, 2, 3]) @ Vector([4, 5, 6]) == 32.0</tspan>
      <tspan x="64" dy="30">after checking isinstance(other, abc.Sized) and Iterable; if __iadd__ is missing, v1 += v2 falls back to</tspan>
      <tspan x="64" dy="30">v1 = v1 + v2 and changes id(v1), while a mutable class returns self</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1080" width="1520" height="80" rx="12" fill="#207448"/>
    
    <g transform="translate(68, 1098)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 24 C 6 20 4 14 6 8 C 8 2 16 0 20 2 C 26 4 28 12 26 18 C 24 21 22 22 22 26 L 10 26 C 10 24 10 23 12 24 Z"/>
      <line x1="12" y1="30" x2="20" y2="30"/>
      <line x1="14" y1="34" x2="18" y2="34"/>
    </g>
    <text x="120" y="1130" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      If an operator has no natural meaning for your type, give the method a name
    </text>
  </g>
</svg>