<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>The ten-minute experiment: the same job run three ways</title>
  <desc>Visual comparison of running eight CPU-bound hash jobs sequentially, across four threads sharing one GIL, and across four processes with independent GILs, plus the sleep variant and time-slice rules.</desc>

  <!-- Background -->
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The ten-minute experiment: the same job run three ways</text>

  <!-- Header Context Banner -->
  <g id="header-context">
    <rect x="40" y="85" width="1520" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="121" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Three lanes for 8 jobs of burn(seed), each chaining 1,000,000 SHA-256 hashes.</text>
  </g>

  <!-- ==================== LANE 1: SEQUENTIAL ==================== -->
  <g id="lane-sequential">
    <rect x="40" y="180" width="480" height="470" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <!-- Icon: Single CPU / interpreter -->
    <g transform="translate(252, 205)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8"/>
      <rect x="16" y="16" width="24" height="24" rx="4" fill="#e8f1ea"/>
      <line x1="28" y1="-4" x2="28" y2="4"/>
      <line x1="28" y1="52" x2="28" y2="60"/>
      <line x1="-4" y1="28" x2="4" y2="28"/>
      <line x1="52" y1="28" x2="60" y2="28"/>
    </g>

    <!-- Lane 1 Title -->
    <text x="280" y="295" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">sequential</text>

    <!-- Visual Art: Single-threaded sequential jobs 0..7 -->
    <g transform="translate(68, 325)">
      <rect x="0" y="0" width="424" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <!-- 8 sequential execution segments -->
      <rect x="8" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="60" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="112" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="164" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="216" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="268" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="320" y="12" width="44" height="36" rx="4" fill="#207448"/>
      <rect x="372" y="12" width="44" height="36" rx="4" fill="#207448"/>
    </g>

    <!-- Lane 1 Body -->
    <text x="280" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">one interpreter runs jobs</tspan>
      <tspan x="280" dy="36">0 to 7 one after another</tspan>
    </text>
  </g>

  <!-- ==================== LANE 2: 4 THREADS (ORANGE) ==================== -->
  <g id="lane-threads">
    <rect x="560" y="180" width="480" height="470" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <!-- Icon: Mutex / GIL Lock with threads -->
    <g transform="translate(772, 202)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="22" width="40" height="32" rx="6" fill="#fffaf5"/>
      <path d="M 16 22 V 14 A 12 12 0 0 1 40 14 V 22"/>
      <circle cx="28" cy="35" r="3" fill="#db8129"/>
      <path d="M 28 38 V 44"/>
    </g>

    <!-- Lane 2 Title -->
    <text x="800" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129"><tspan x="800" dy="0">4 threads: </tspan><tspan x="800" dy="32" font-family="monospace" font-size="24">ThreadPoolExecutor(</tspan><tspan x="800" dy="28" font-family="monospace" font-size="24">max_workers=4)</tspan></text>

    <!-- Visual Art: 4 threads contending under 1 GIL -->
    <g transform="translate(588, 360)">
      <rect x="0" y="0" width="424" height="52" rx="6" fill="#fdf0e2" stroke="#db8129" stroke-width="1.5"/>
      <!-- Alternating turns in slices -->
      <rect x="10" y="8" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="62" y="28" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="114" y="8" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="166" y="28" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="218" y="8" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="270" y="28" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="322" y="8" width="42" height="14" rx="2" fill="#db8129"/>
      <rect x="374" y="28" width="40" height="14" rx="2" fill="#db8129"/>
    </g>

    <!-- Lane 2 Body (with orange callout) -->
    <text x="800" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">four threads share one</tspan>
      <tspan x="800" dy="34">GIL and take turns, so</tspan>
      <tspan x="800" dy="34" fill="#db8129" font-weight="bold">&apos;about as long as</tspan>
      <tspan x="800" dy="34" fill="#db8129" font-weight="bold">sequential, or a little</tspan>
      <tspan x="800" dy="34" fill="#db8129" font-weight="bold">longer&apos;</tspan>
    </text>
  </g>

  <!-- ==================== LANE 3: 4 PROCESSES ==================== -->
  <g id="lane-processes">
    <rect x="1080" y="180" width="480" height="470" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <!-- Icon: 4 Parallel Processors -->
    <g transform="translate(1292, 205)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="20" height="20" rx="3" fill="#e8f1ea"/>
      <rect x="32" y="4" width="20" height="20" rx="3" fill="#e8f1ea"/>
      <rect x="4" y="32" width="20" height="20" rx="3" fill="#e8f1ea"/>
      <rect x="32" y="32" width="20" height="20" rx="3" fill="#e8f1ea"/>
    </g>

    <!-- Lane 3 Title -->
    <text x="1320" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448"><tspan x="1320" dy="0">4 processes: </tspan><tspan x="1320" dy="32" font-family="monospace" font-size="24">ProcessPoolExecutor(</tspan><tspan x="1320" dy="28" font-family="monospace" font-size="24">max_workers=4)</tspan></text>

    <!-- Visual Art: 4 processes running in parallel -->
    <g transform="translate(1108, 360)">
      <rect x="0" y="0" width="424" height="52" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <!-- 4 concurrent process tracks -->
      <rect x="10" y="6" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="210" y="6" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="10" y="18" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="210" y="18" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="10" y="30" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="210" y="30" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="10" y="42" width="190" height="7" rx="2" fill="#207448"/>
      <rect x="210" y="42" width="190" height="7" rx="2" fill="#207448"/>
    </g>

    <!-- Lane 3 Body -->
    <text x="1320" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">four interpreters, each</tspan>
      <tspan x="1320" dy="34">with its own GIL,</tspan>
      <tspan x="1320" dy="34" fill="#207448" font-weight="bold">&apos;clearly faster&apos; on a</tspan>
      <tspan x="1320" dy="34">machine with at least</tspan>
      <tspan x="1320" dy="34">four free cores</tspan>
    </text>
  </g>

  <!-- ==================== SIDE NOTE ==================== -->
  <g id="side-note-panel">
    <rect x="40" y="690" width="1520" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(68, 706)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 36 V 12 A 4 4 0 0 1 12 8 H 28 L 40 20 V 36 A 4 4 0 0 1 36 40 H 12 A 4 4 0 0 1 8 36 Z"/>
      <polyline points="28,8 28,20 40,20"/>
      <line x1="16" y1="28" x2="32" y2="28"/>
    </g>
    <text x="130" y="724" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">change burn to time.sleep(1) and rerun: now threads win</tspan>
      <tspan x="130" dy="30">because the GIL is released while a thread sleeps</tspan>
    </text>
  </g>

  <!-- ==================== STRIP ==================== -->
  <g id="strip-panel">
    <rect x="40" y="805" width="1520" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(68, 821)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18"/>
      <polyline points="24,14 24,24 32,24"/>
      <line x1="24" y1="2" x2="24" y2="6"/>
      <line x1="38" y1="6" x2="34" y2="10"/>
    </g>
    <text x="130" y="839" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">timed() prints label and seconds with perf_counter;</tspan>
      <tspan x="130" dy="30">your timings depend on your hardware, so record your own</tspan>
    </text>
  </g>

  <!-- ==================== FOOTNOTE ==================== -->
  <g id="footnote-panel">
    <rect x="40" y="920" width="1520" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(68, 940)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18"/>
      <line x1="24" y1="20" x2="24" y2="34"/>
      <circle cx="24" cy="14" r="2" fill="#207448"/>
    </g>
    <text x="130" y="956" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">a thread that computes for a long time is paused every 5 ms (sys.getswitchinterval()),</tspan>
      <tspan x="130" dy="32">an asyncio task is never paused that way and runs until an await</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM BAR ==================== -->
  <g id="bottom-bar">
    <rect x="40" y="1045" width="1520" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1092" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">The GIL gives threads turns, processes get their own lock</text>
  </g>
</svg>
