<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1460" width="1600" height="1460">
  <title>The Drainer test run step by step with a fake clock and no sleeping</title>
  <desc>Visual walkthrough of draining a Kubernetes node with injected fake clock and sleep functions for instant test execution.</desc>

  <defs>
    
    <marker id="arrow-down" viewBox="0 0 14 14" refX="7" refY="12" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 7 12 L 13 2 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-down-orange" viewBox="0 0 14 14" refX="7" refY="12" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 7 12 L 13 2 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-right" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 2 1 L 12 7 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1460" fill="#f5f8f5" />

  
  <text x="60" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">The Drainer test run step by step with a fake clock and no sleeping</text>
  <text x="60" y="108" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">A timeline for test_drain_waits_until_empty.</text>

  
  <g id="setup-panel">
    <rect x="50" y="135" width="1500" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(75, 172)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="0" y1="12" x2="48" y2="12" />
      <circle cx="16" cy="12" r="7" fill="#e8f1ea" />
      <line x1="0" y1="36" x2="48" y2="36" />
      <circle cx="34" cy="36" r="7" fill="#e8f1ea" />
      <line x1="0" y1="60" x2="48" y2="60" />
      <circle cx="22" cy="60" r="7" fill="#e8f1ea" />
    </g>

    
    <text x="145" y="180" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">FakeKube([[a, b], [b], []])</text>
    <text x="145" y="215" font-family="monospace" font-size="24" fill="#303a36">clock=lambda: next(t) with t = iter(range(0, 1000, 5))</text>
    <text x="145" y="248" font-family="monospace" font-size="24" fill="#303a36">sleep=lambda s: None</text>
  </g>

  
  <path d="M 525 270 L 525 305" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  

  
  <g id="step-cordon">
    <rect x="50" y="310" width="950" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="95" cy="355" r="24" fill="#207448" />
    <text x="95" y="364" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="140" y="363" font-family="monospace" font-size="25" fill="#303a36">cordon(n1): cordoned = [n1]</text>
  </g>

  <path d="M 525 400 L 525 425" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  
  <g id="step-deadline">
    <rect x="50" y="430" width="950" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="95" cy="480" r="24" fill="#207448" />
    <text x="95" y="489" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(135, 455)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="22" />
      <polyline points="25,12 25,25 35,25" />
    </g>
    <text x="195" y="489" font-family="sans-serif" font-size="24" fill="#303a36">deadline = clock() + 600: clock returns 0, so deadline is 600</text>
  </g>

  <path d="M 525 530 L 525 555" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  
  <g id="step-pass-1">
    <rect x="50" y="560" width="950" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="95" cy="630" r="24" fill="#207448" />
    <text x="95" y="639" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="140" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0" font-weight="bold" fill="#207448">pass 1:</tspan>
      <tspan font-family="monospace" font-size="24"> pods_on(n1) returns [a, b];</tspan>
    </text>
    <text x="140" y="643" font-family="sans-serif" font-size="24" fill="#303a36">clock() returns 5 which is not past 600;</text>
    <text x="140" y="680" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">sleep does nothing</text>
  </g>

  <path d="M 525 700 L 525 725" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  
  <g id="step-pass-2">
    <rect x="50" y="730" width="950" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="95" cy="777" r="24" fill="#207448" />
    <text x="95" y="786" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="140" y="786" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">pass 2:</tspan>
      <tspan font-family="monospace" font-size="24"> pods_on returns [b]; clock returns 10</tspan>
    </text>
  </g>

  <path d="M 525 825 L 525 850" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  
  <g id="step-pass-3">
    <rect x="50" y="855" width="950" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="95" cy="902" r="24" fill="#207448" />
    <text x="95" y="911" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="140" y="911" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">pass 3:</tspan>
      <tspan font-family="monospace" font-size="24"> pods_on returns []: loop ends</tspan>
    </text>
  </g>

  <path d="M 525 950 L 525 975" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-down-orange)" />

  
  <g id="step-result">
    <rect x="50" y="980" width="950" height="100" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(85, 1005)" stroke="#db8129" stroke-width="4" fill="none">
      <circle cx="25" cy="25" r="22" stroke-width="3" />
      <polyline points="14,26 22,34 36,18" />
    </g>
    <text x="145" y="1040" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">drain returns; the test runs instantly, no real sleeping</text>
  </g>

  
  
  <path d="M 1000 480 L 1045 480" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-right)" />

  <g id="timeout-panel">
    <rect x="1055" y="310" width="495" height="770" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(1095, 345)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="22" />
      <line x1="25" y1="12" x2="25" y2="28" stroke-width="4" />
      <circle cx="25" cy="36" r="2" fill="#207448" />
    </g>
    <text x="1160" y="380" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Timeout path</text>

    
    <rect x="1080" y="440" width="445" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1100" y="495" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">if self.clock() &gt; deadline:</tspan>
      <tspan x="1120" dy="48" fill="#c0392b">raise TimeoutError(node)</tspan>
    </text>

    
    <rect x="1080" y="625" width="445" height="425" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <g transform="translate(1105, 655)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="24" />
      <polyline points="28,14 28,28 38,22" />
      <path d="M 40 10 L 48 18 L 40 26" stroke-linecap="round" />
    </g>

    <text x="1100" y="750" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan x="1100" dy="0">a fake clock that jumps</tspan>
      <tspan x="1100" dy="44">past the deadline covers</tspan>
      <tspan x="1100" dy="44">the 600-second timeout loop</tspan>
      <tspan x="1100" dy="44">in about a millisecond</tspan>
    </text>
  </g>

  
  <g id="footer-panel">
    <rect x="50" y="1120" width="1500" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(75, 1165)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="50" height="40" rx="6" />
      <polyline points="15,15 8,20 15,25" />
      <polyline points="35,15 42,20 35,25" />
    </g>

    <text x="145" y="1175" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0" font-family="monospace">Drainer(kube, clock=time.monotonic, sleep=time.sleep)</tspan>
      <tspan> takes its collaborators from the caller;</tspan>
    </text>
    <text x="145" y="1235" font-family="monospace" font-size="24" fill="#303a36">FakeKube.pods_on returns seq.pop(0) if seq else []</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1320" width="1500" height="85" rx="14" fill="#207448" />
    <text x="800" y="1373" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Injecting the clock and sleep makes time-dependent logic testable without waiting</text>
  </g>
</svg>