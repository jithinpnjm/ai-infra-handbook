<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Decode at the input boundary, work in str, and encode at the output boundary</title>
  <desc>Visual pipeline showing decoding bytes to str at the input boundary, operating on Unicode text in program logic, and encoding str to bytes at the output boundary, along with common error points.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#d93025"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Decode at the input boundary, work in str,</text>
  <text x="800" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">and encode at the output boundary</text>

  
  <rect x="40" y="160" width="290" height="370" rx="14" fill="#e9ecef" stroke="#88928c" stroke-width="2"/>
  
  <g transform="translate(160, 185)">
    <path d="M 10 0 L 35 0 L 50 15 L 50 50 L 10 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="35,0 35,15 50,15" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="20" y1="26" x2="40" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="35" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="185" y="295" font-size="30" font-weight="bold">Input boundary:</tspan>
    <tspan x="185" y="340" font-size="24">bytes from a file,</tspan>
    <tspan x="185" y="380" font-size="24">socket or command</tspan>
    <tspan x="185" y="420" font-size="24">output</tspan>
  </text>

  
  <rect x="650" y="150" width="300" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  
  <g transform="translate(775, 175)">
    <rect x="10" y="10" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="2" y1="22" x2="10" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="22" x2="58" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="38" x2="58" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="2" x2="22" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="50" x2="22" y2="58" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="50" x2="38" y2="58" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="7" fill="#db8129"/>
  </g>
  <text x="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="800" y="290" font-size="30" font-weight="bold">Program logic</tspan>
    <tspan x="800" y="335" font-size="30" font-weight="bold">works in str:</tspan>
    <tspan x="800" y="395" font-size="24">Unicode code points</tspan>
  </text>

  
  <rect x="1270" y="160" width="290" height="370" rx="14" fill="#e9ecef" stroke="#88928c" stroke-width="2"/>
  
  <g transform="translate(1385, 185)">
    <rect x="5" y="5" width="50" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="15,20 23,26 15,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="32" x2="42" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="1415" y="295" font-size="30" font-weight="bold">Output boundary:</tspan>
    <tspan x="1415" y="340" font-size="24">bytes to a file,</tspan>
    <tspan x="1415" y="380" font-size="24">socket or stdout</tspan>
  </text>

  
  <rect x="340" y="190" width="300" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="490" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">decode(encoding=utf-8)</text>
  <line x1="330" y1="265" x2="638" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <line x1="490" y1="265" x2="490" y2="332" stroke="#d93025" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="345" y="345" width="290" height="165" rx="10" fill="#fdf2f2" stroke="#d93025" stroke-width="2"/>
  <text x="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="490" y="385" font-size="24" font-weight="bold" fill="#d93025">UnicodeDecodeError:</tspan>
    <tspan x="490" y="425" font-size="24">bytes do not match the</tspan>
    <tspan x="490" y="465" font-size="24">encoding you assumed</tspan>
  </text>

  
  <rect x="960" y="190" width="300" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1110" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">encode(encoding=utf-8)</text>
  <line x1="950" y1="265" x2="1258" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <line x1="1110" y1="265" x2="1110" y2="332" stroke="#d93025" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="965" y="345" width="290" height="165" rx="10" fill="#fdf2f2" stroke="#d93025" stroke-width="2"/>
  <text x="1110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="1110" y="385" font-size="24" font-weight="bold" fill="#d93025">UnicodeEncodeError:</tspan>
    <tspan x="1110" y="425" font-size="24">target encoding cannot</tspan>
    <tspan x="1110" y="465" font-size="24">represent a character</tspan>
  </text>

  
  <rect x="300" y="580" width="1000" height="110" rx="12" fill="#ffffff" stroke="#88928c" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="800" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="800" y="625">Always pass encoding explicitly.</tspan>
    <tspan x="800" y="665">Set PYTHONUTF8=1 in containers.</tspan>
  </text>

  
  <rect x="50" y="740" width="1500" height="85" rx="12" fill="#207448"/>
  <text x="800" y="793" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">bytes are what disks and sockets carry; str is what your code should handle.</text>
</svg>