<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>When decorators run, how they stack, and what a closure keeps</title>
  <desc>Visual explanation of Python decorator execution timing, closure variable storage, variable scope traps, and common decorator forms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">When decorators run, how they stack, and what a closure keeps</text>

  
  <rect x="40" y="120" width="485" height="1140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(64, 145)">
    
    <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="26,14 26,26 36,26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="68" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">import time versus call time</text>
  </g>

  
  <rect x="65" y="230" width="435" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="95" cy="260" r="18" fill="#207448"/>
  <text x="95" y="267" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="130" y="268">import:</tspan>
    <tspan x="95" y="316">def statement executes,</tspan>
    <tspan x="95" y="356">the decorator call happens</tspan>
    <tspan x="95" y="396">and any print inside the</tspan>
    <tspan x="95" y="436">decorator lands here</tspan>
  </text>

  
  <line x1="282" y1="475" x2="282" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="65" y="550" width="435" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="95" cy="580" r="18" fill="#207448"/>
  <text x="95" y="587" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="130" y="588">later:</tspan>
    <tspan x="95" y="636">the decorated function</tspan>
    <tspan x="95" y="676">runs only when you call it</tspan>
  </text>

  
  <rect x="65" y="780" width="435" height="440" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 805)">
    <rect x="0" y="0" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="16" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="32" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" y="905">@alpha above @beta is</tspan>
    <tspan x="95" y="950">alpha(beta(f))</tspan>
  </text>

  
  <rect x="555" y="120" width="490" height="1140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(580, 145)">
    
    <rect x="8" y="18" width="36" height="28" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 18 L 16 12 A 10 10 0 0 1 36 12 L 36 18" fill="none" stroke="#207448" stroke-width="4"/>
    <text x="60" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Closures</text>
  </g>

  
  <rect x="580" y="220" width="440" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="605" y="260">make_averager keeps</tspan>
    <tspan x="605" y="300">series = [] in</tspan>
    <tspan x="605" y="340">avg.__closure__[0]</tspan>
    <tspan x="605" y="380">.cell_contents and</tspan>
    <tspan x="605" y="420">avg.__code__.co_freevars</tspan>
    <tspan x="605" y="455">== (series,)</tspan>
  </text>

  
  <rect x="580" y="490" width="440" height="240" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" y="530">better version keeps count = 0</tspan>
    <tspan x="605" y="568">and total = 0 with nonlocal</tspan>
    <tspan x="605" y="606">count, total: memory stays O(1)</tspan>
    <tspan x="605" y="644">instead of growing with every</tspan>
    <tspan x="605" y="682">value</tspan>
  </text>

  
  <rect x="580" y="750" width="440" height="480" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(605, 768)">
    <polygon points="20,4 36,12 36,28 20,40 4,28 4,12" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="14" x2="20" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="30" r="2" fill="#207448"/>
  </g>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="605" y="850">def f2(a): print(a);</tspan>
    <tspan x="605" y="888">print(b); b = 9 :</tspan>
  </text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" y="934">CPython sees the assignment</tspan>
    <tspan x="605" y="972">to b and treats it as local,</tspan>
    <tspan x="605" y="1010">compiles the read as</tspan>
    <tspan x="605" y="1048">LOAD_FAST instead of</tspan>
    <tspan x="605" y="1086">LOAD_GLOBAL, so print(b)</tspan>
    <tspan x="605" y="1124">raises UnboundLocalError;</tspan>
    <tspan x="605" y="1162">dis.dis shows it</tspan>
  </text>

  
  <rect x="1075" y="120" width="485" height="1140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1100, 145)">
    
    <rect x="4" y="6" width="44" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="4" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="3"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="18" cy="12" r="2" fill="#207448"/>
    <circle cx="24" cy="12" r="2" fill="#207448"/>
    <text x="64" y="36" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Decorator forms</text>
  </g>

  
  <rect x="1100" y="220" width="435" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1120" y="266">functools.wraps(func) keeps</tspan>
    <tspan x="1120" y="306">__name__ and __doc__</tspan>
  </text>

  
  <rect x="1100" y="360" width="435" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" y="400">parameterised @clock(fmt)</tspan>
    <tspan x="1120" y="438">needs three levels: clock(fmt),</tspan>
    <tspan x="1120" y="476">decorate(func), clocked(*_args);</tspan>
    <tspan x="1120" y="514">or a class with __call__</tspan>
  </text>

  
  <rect x="1100" y="590" width="435" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" y="632">@functools.cache and</tspan>
    <tspan x="1120" y="670">@lru_cache(maxsize=128,</tspan>
    <tspan x="1120" y="708">typed=False) turn exponential</tspan>
    <tspan x="1120" y="746">fibonacci(n) calls into O(n)</tspan>
  </text>

  
  <rect x="1100" y="820" width="435" height="410" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" y="860">@singledispatch picks a handler</tspan>
    <tspan x="1120" y="896">by the type of the first argument</tspan>
    <tspan x="1120" y="932">and prefers abstract bases such</tspan>
    <tspan x="1120" y="968">as abc.Sequence or</tspan>
    <tspan x="1120" y="1004">numbers.Integral over list or</tspan>
    <tspan x="1120" y="1040">int: htmlize(obj: object) with</tspan>
    <tspan x="1120" y="1076">registered str, Sequence and</tspan>
    <tspan x="1120" y="1112">Integral handlers</tspan>
  </text>

  
  <rect x="40" y="1290" width="1520" height="80" rx="16" fill="#207448"/>
  <text x="800" y="1342" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The decorator runs at import time, the function runs at call time</text>
</svg>