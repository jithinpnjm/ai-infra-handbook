<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>When decorators run, how they stack, and what a closure keeps</title>
  <desc>Visual explanation of Python decorator execution timing, closure variable storage, scope traps, and standard decorator forms.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">When decorators run, how they stack, and what a closure keeps</text>

  
  <g>
    
    <rect x="40" y="110" width="460" height="980" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 135)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,12 28,28 42,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="140" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="140" dy="0">import time versus</tspan>
      <tspan x="140" dy="36">call time</tspan>
    </text>

    
    <rect x="60" y="215" width="420" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="95" cy="252" r="24" fill="#207448"/>
    <text x="95" y="260" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="135" y="258" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">import: def statement</tspan>
      <tspan x="80" dy="34">executes, the decorator</tspan>
      <tspan x="80" dy="34">call happens and any print</tspan>
      <tspan x="80" dy="34">inside the decorator</tspan>
      <tspan x="80" dy="34">lands here</tspan>
    </text>

    
    <line x1="270" y1="445" x2="270" y2="485" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

    
    <rect x="60" y="495" width="420" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="95" cy="535" r="24" fill="#207448"/>
    <text x="95" y="543" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="135" y="542" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">later: the decorated</tspan>
      <tspan x="80" dy="36">function runs only</tspan>
      <tspan x="80" dy="36">when you call it</tspan>
    </text>

    
    <rect x="60" y="695" width="420" height="375" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 725)">
      <path d="M 0 16 L 24 4 L 48 16 L 24 28 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 0 28 L 24 40 L 48 28" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 0 40 L 24 52 L 48 40" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="150" y="750" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="150" dy="0">@alpha above @beta</tspan>
      <tspan x="150" dy="34">is alpha(beta(f))</tspan>
    </text>

    
    <g transform="translate(85, 840)">
      <rect x="0" y="0" width="370" height="195" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="25" y="30" width="320" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="50" y="60" width="270" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="185" cy="97" r="16" fill="#207448"/>
    </g>
  </g>

  
  <g>
    
    <rect x="530" y="110" width="500" height="980" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(565, 135)">
      <rect x="8" y="20" width="36" height="28" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 16 20 V 12 A 10 10 0 0 1 36 12 V 20" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="26" cy="34" r="3" fill="#207448"/>
    </g>
    <text x="635" y="170" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Closures</text>

    
    <rect x="550" y="215" width="460" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(575, 235)">
      <rect x="0" y="0" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="18" x2="36" y2="18" stroke="#207448" stroke-width="2"/>
      <line x1="18" y1="0" x2="18" y2="36" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="575" y="295" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="575" dy="0">make_averager keeps</tspan>
      <tspan x="575" dy="30">series = [] in</tspan>
      <tspan x="575" dy="30">avg.__closure__[0].</tspan>
      <tspan x="575" dy="30">cell_contents and</tspan>
      <tspan x="575" dy="30">avg.__code__.co_freevars</tspan>
      <tspan x="575" dy="30">== (series,)</tspan>
    </text>

    
    <rect x="550" y="465" width="460" height="225" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(575, 485)">
      <polygon points="18,0 4,20 16,20 10,36 30,14 18,14" fill="#db8129"/>
    </g>
    <text x="575" y="545" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" dy="0" fill="#db8129">better version keeps</tspan>
      <tspan x="575" dy="30">count = 0 and total = 0</tspan>
      <tspan x="575" dy="30">with nonlocal count, total:</tspan>
      <tspan x="575" dy="30">memory stays O(1) instead</tspan>
      <tspan x="575" dy="30">of growing with every value</tspan>
    </text>

    
    <rect x="550" y="710" width="460" height="360" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(575, 725)">
      <polygon points="20,0 0,38 40,38" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <line x1="20" y1="14" x2="20" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="31" r="2" fill="#207448"/>
    </g>
    <text x="575" y="785" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" dy="0" font-family="monospace">def f2(a): print(a);</tspan>
      <tspan x="575" dy="31" font-family="monospace">print(b); b = 9 :</tspan>
      <tspan x="575" dy="31">CPython sees the assignment</tspan>
      <tspan x="575" dy="31">to b and treats it as local,</tspan>
      <tspan x="575" dy="31">compiles the read as</tspan>
      <tspan x="575" dy="31">LOAD_FAST instead of</tspan>
      <tspan x="575" dy="31">LOAD_GLOBAL, so print(b)</tspan>
      <tspan x="575" dy="31">raises UnboundLocalError;</tspan>
      <tspan x="575" dy="31">dis.dis shows it</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="1060" y="110" width="500" height="980" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1095, 135)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 20 18 L 12 28 L 20 38 M 36 18 L 44 28 L 36 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1170" y="170" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Decorator forms</text>

    
    <rect x="1080" y="215" width="460" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1100, 230)">
      <path d="M 16 0 L 32 8 V 24 C 32 36 16 44 16 44 C 16 44 0 36 0 24 V 8 Z" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1100" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0" font-family="monospace">functools.wraps(func)</tspan>
      <tspan x="1100" dy="32">keeps __name__ and __doc__</tspan>
    </text>

    
    <rect x="1080" y="360" width="460" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1100, 375)">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="#207448" stroke-width="2"/>
      <rect x="7" y="7" width="26" height="26" fill="none" stroke="#207448" stroke-width="2"/>
      <rect x="14" y="14" width="12" height="12" fill="none" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="1100" y="440" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">parameterised @clock(fmt) needs</tspan>
      <tspan x="1100" dy="30">three levels: clock(fmt),</tspan>
      <tspan x="1100" dy="30">decorate(func), clocked(*_args);</tspan>
      <tspan x="1100" dy="30">or a class with __call__</tspan>
    </text>

    
    <rect x="1080" y="565" width="460" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1100, 580)">
      <path d="M 0 32 A 20 20 0 1 1 40 32" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="32" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1100" y="645" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">@functools.cache and</tspan>
      <tspan x="1100" dy="30">@lru_cache(maxsize=128,</tspan>
      <tspan x="1100" dy="30">typed=False) turn exponential</tspan>
      <tspan x="1100" dy="30">fibonacci(n) calls into O(n)</tspan>
    </text>

    
    <rect x="1080" y="770" width="460" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1100, 785)">
      <circle cx="6" cy="20" r="5" fill="#207448"/>
      <circle cx="34" cy="8" r="5" fill="#207448"/>
      <circle cx="34" cy="32" r="5" fill="#207448"/>
      <path d="M 11 20 H 22 M 22 8 H 29 M 22 32 H 29 M 22 8 V 32" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1100" y="845" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">@singledispatch picks a handler</tspan>
      <tspan x="1100" dy="30">by the type of the first argument</tspan>
      <tspan x="1100" dy="30">and prefers abstract bases such as</tspan>
      <tspan x="1100" dy="30">abc.Sequence or numbers.Integral</tspan>
      <tspan x="1100" dy="30">over list or int: htmlize(obj:</tspan>
      <tspan x="1100" dy="30">object) with registered str,</tspan>
      <tspan x="1100" dy="30">Sequence and Integral handlers</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1110" width="1520" height="65" rx="12" fill="#207448"/>
    <text x="800" y="1152" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The decorator runs at import time, the function runs at call time</text>
  </g>
</svg>