<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>What a CLI test must pin: exit code, stdout and stderr</title>
  <desc>Infographic explaining how CLI testing validates exit codes, stdout purity, error handling, and automation stability using CliRunner and end-to-end smoke tests.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">What a CLI test must pin: exit code, stdout and stderr</text>

  
  <rect x="50" y="120" width="840" height="770" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="75" y="145" width="790" height="410" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(95, 165)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
    <circle cx="10" cy="7" r="2.5" fill="#207448"/>
    <circle cx="18" cy="7" r="2.5" fill="#207448"/>
    <circle cx="26" cy="7" r="2.5" fill="#207448"/>
    <path d="M 10 24 L 16 29 L 10 34" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="34" x2="32" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  
  <rect x="95" y="230" width="750" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="115" y="262">monkeypatch.setattr(fleetctl.cli.query_host,</tspan>
    <tspan x="140" y="294">lambda h, c: {host: h, gpus: 8, state: ok})</tspan>
  </text>

  
  <rect x="95" y="325" width="750" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="115" y="357">CliRunner().invoke(cli,</tspan>
    <tspan x="140" y="387">[--output, json, status, h1, h2])</tspan>
  </text>

  
  <line x1="230" y1="400" x2="230" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="400" x2="610" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="95" y="445" width="270" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="115" y="498" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">r.exit_code == 0</text>

  
  <rect x="385" y="445" width="460" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="405" y="480">json.loads(r.output)[0][host] == h1</tspan>
  </text>
  <text x="405" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">stdout is pure JSON</text>

  
  <rect x="75" y="580" width="790" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(95, 600)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
    <line x1="20" y1="23" x2="36" y2="37" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="23" x2="20" y2="37" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="95" y="670" width="750" height="85" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="115" y="722" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">CliRunner().invoke(cli, [drain]).exit_code == 2</text>

  
  <rect x="95" y="770" width="750" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="115" y="817" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">usage error, the missing argument</text>

  
  <rect x="920" y="120" width="630" height="770" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(950, 145)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="16" x2="28" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1025" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#303a36">Other ways</text>

  
  <rect x="950" y="230" width="570" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(975, 250)">
    <rect x="0" y="0" width="48" height="38" rx="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="19" r="4" fill="#207448"/>
    <circle cx="34" cy="19" r="4" fill="#207448"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="975" y="325">argparse tools: call main([...])</tspan>
    <tspan x="975" y="360">and use capsys</tspan>
  </text>

  
  <rect x="950" y="415" width="570" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(975, 435)">
    <rect x="0" y="0" width="48" height="38" rx="5" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="12,14 20,20 12,26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="26" x2="34" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="975" y="505">end to end: subprocess.run([sys.executable,</tspan>
    <tspan x="975" y="540">-m, fleetctl, ...])</tspan>
    <tspan x="975" y="575">in a few smoke tests</tspan>
  </text>

  
  <rect x="950" y="625" width="570" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(975, 645)">
    <path d="M 6 4 L 42 4 L 42 40 L 6 40 Z" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="14,22 22,30 36,14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="975" y="718">exit codes 0, 1, 2, 3 and 4,</tspan>
    <tspan x="975" y="753">JSON on stdout pure,</tspan>
    <tspan x="975" y="788">--dry-run does not mutate, and a smoke test</tspan>
    <tspan x="975" y="823">of the installed entry point</tspan>
  </text>

  
  <rect x="50" y="920" width="1500" height="100" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(80, 942)">
    <polygon points="28,4 54,48 2,48" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="42" r="2" fill="#db8129"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" y="962">a CLI with no tests for exit codes, or for the split between stdout and stderr,</tspan>
    <tspan x="160" y="996">can break automation without anyone noticing</tspan>
  </text>

  
  <rect x="50" y="1045" width="1500" height="80" rx="14" fill="#207448"/>
  <text x="800" y="1095" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">CliRunner returns the exit code and the output in one in-process call</text>
</svg>