<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Four ways to format a string</title>
  <desc>Visual comparison showing four ways to format a string in Python—f-string, format method, percent expression, and string.Template—all evaluating to the same result chip node1 is up, with an orange highlight on the f-string row.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Four ways to format a string</text>

  
  <g id="row-f-string">
    <rect x="80" y="130" width="920" height="145" rx="18" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(105, 148)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#db8129" stroke-width="4" />
      <path d="M 19 15 C 14 15 13 18 13 23 C 13 26 10 28 8 28 C 10 28 13 30 13 33 C 13 38 14 41 19 41" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 37 15 C 42 15 43 18 43 23 C 43 26 46 28 48 28 C 46 28 43 30 43 33 C 43 38 42 41 37 41" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="28" cy="28" r="2.5" fill="#db8129" />
    </g>

    
    <text x="185" y="175" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">f-string</text>

    
    <rect x="185" y="202" width="785" height="54" rx="10" fill="#fef5ec" stroke="#db8129" stroke-width="2.5" />
    <text x="205" y="238" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">f"{name} is up"</text>
  </g>

  
  <g id="row-format-method">
    <rect x="80" y="319" width="920" height="145" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(105, 337)">
      <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 6 V 12 M 28 44 V 50 M 6 28 H 12 M 44 28 H 50 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="185" y="364" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">format method</text>

    
    <rect x="185" y="391" width="785" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="205" y="427" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">"{} is up".format(name)</text>
  </g>

  
  <g id="row-percent-expression">
    <rect x="80" y="508" width="920" height="145" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(105, 526)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="18" cy="18" r="5" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="40" y1="14" x2="16" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="38" cy="38" r="5" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>

    
    <text x="185" y="553" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">percent expression</text>

    
    <rect x="185" y="580" width="785" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="205" y="616" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">"%s is up" % name</text>
  </g>

  
  <g id="row-string-template">
    <rect x="80" y="697" width="920" height="145" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(105, 715)">
      <path d="M 10 6 H 36 L 46 16 V 50 H 10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 36 6 V 16 H 46" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="18" y1="27" x2="34" y2="27" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="18" y1="37" x2="38" y2="37" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="185" y="742" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">string.Template</text>

    
    <rect x="185" y="769" width="785" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="205" y="805" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Template("$name is up").substitute(name=name)</text>
  </g>

  
  
  <path d="M 1000 202.5 H 1060 V 410 H 1140" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 1000 391.5 H 1085 V 460 H 1140" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1000 580.5 H 1085 V 512 H 1140" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1000 769.5 H 1060 V 562 H 1140" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="result-chip-container">
    <rect x="1140" y="346" width="380" height="280" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    
    <g transform="translate(1302, 375)">
      <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="42" x2="38" y2="42" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="42" x2="28" y2="50" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="50" x2="40" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 10 15 L 16 21 L 10 27" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="21" y1="27" x2="31" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <rect x="1175" y="465" width="310" height="76" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="1330" y="513" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">node1 is up</text>
  </g>
</svg>