<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Parallel traversal with zip</title>
  <desc>Visual explanation of parallel traversal using Python zip function</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Parallel traversal with zip</text>

  
  <g id="code-chip">
    <rect x="520" y="125" width="560" height="60" rx="30" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="164" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">for n, v in zip(names, nums)</text>
  </g>

  
  <g id="left-panel">
    <rect x="60" y="220" width="540" height="460" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(100, 245)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="16" x2="44" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="100" y="372" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">names</text>
    <rect x="230" y="325" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="272" y="371" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">'a'</text>
    <rect x="335" y="325" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="377" y="371" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">'b'</text>
    <rect x="440" y="325" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="482" y="371" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">'c'</text>

    
    <text x="100" y="497" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">nums</text>
    <rect x="230" y="450" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="272" y="496" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">1</text>
    <rect x="335" y="450" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="377" y="496" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">2</text>
    <rect x="440" y="450" width="85" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="482" y="496" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">3</text>
  </g>

  
  <g id="middle-arrow">
    
    <rect x="640" y="375" width="320" height="56" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="413" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">zip(names, nums)</text>

    
    <line x1="615" y1="465" x2="960" y2="465" stroke="#207448" stroke-width="4"/>
    <polygon points="980,465 960,455 960,475" fill="#207448"/>
  </g>

  
  <g id="right-panel">
    <rect x="980" y="220" width="560" height="460" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(1015, 245)">
      <rect x="0" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="20" y="0" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    </g>

    
    <rect x="1005" y="415" width="165" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1087" y="468" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">('a', 1)</text>

    <rect x="1180" y="415" width="165" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1262" y="468" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">('b', 2)</text>

    <rect x="1355" y="415" width="165" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1437" y="468" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">('c', 3)</text>
  </g>

  
  <g id="orange-note">
    <rect x="470" y="740" width="660" height="76" rx="16" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(505, 758)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <line x1="20" y1="11" x2="20" y2="22" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="20" cy="29" r="2.5" fill="#db8129"/>
    </g>
    <text x="560" y="788" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">zip stops at the shortest input</text>
  </g>
</svg>