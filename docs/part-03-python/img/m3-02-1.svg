<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Four import models, PEP 420 namespace packages (__path__), and the 4-step import algorithm</title>
  <desc>Flowchart visualizing the Python module and package import resolution algorithm according to PEP 420.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>
    <marker id="arrow-err" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#b93829" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#143621" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M 600 185 L 600 230" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 300 L 600 340" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 850 385 L 980 385" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 430 L 600 475" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 850 520 L 980 520" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 565 L 600 610" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 850 660 L 980 660" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 710 L 600 755" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 825 L 600 870" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 1255 715 L 1255 835 L 795 835 L 795 870" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 430 910 L 150 910 L 150 265 L 390 265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 600 950 L 600 995" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 450 1095 L 450 1160" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <path d="M 750 1095 L 750 1135 L 1260 1135 L 1260 1180" stroke="#b93829" stroke-width="4" marker-end="url(#arrow-err)" />
  </g>

  
  
  <g transform="translate(875, 365)">
    <rect width="68" height="38" rx="19" fill="#207448" />
    <text x="34" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Yes</text>
  </g>

  
  <g transform="translate(615, 436)">
    <rect width="60" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="30" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#207448">No</text>
  </g>

  
  <g transform="translate(875, 500)">
    <rect width="68" height="38" rx="19" fill="#207448" />
    <text x="34" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Yes</text>
  </g>

  
  <g transform="translate(615, 571)">
    <rect width="60" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="30" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#207448">No</text>
  </g>

  
  <g transform="translate(875, 640)">
    <rect width="68" height="38" rx="19" fill="#207448" />
    <text x="34" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Yes</text>
  </g>

  
  <g transform="translate(615, 715)">
    <rect width="60" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="30" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#207448">No</text>
  </g>

  
  <g transform="translate(230, 890)">
    <rect width="68" height="38" rx="19" fill="#207448" />
    <text x="34" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Yes</text>
  </g>

  
  <g transform="translate(615, 953)">
    <rect width="60" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="30" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#207448">No</text>
  </g>

  
  <g transform="translate(416, 1108)">
    <rect width="68" height="38" rx="19" fill="#db8129" />
    <text x="34" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Yes</text>
  </g>

  
  <g transform="translate(930, 1115)">
    <rect width="60" height="34" rx="17" fill="#ffffff" stroke="#b93829" stroke-width="2" />
    <text x="30" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#b93829">No</text>
  </g>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Four import models, PEP 420 namespace packages (__path__), and the 4-s
  </text>

  

  
  <g transform="translate(140, 110)" filter="url(#card-shadow)">
    <rect width="920" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 4 8 L 16 8 L 22 14 L 40 14 A 2 2 0 0 1 42 16 L 42 34 A 2 2 0 0 1 40 36 L 4 36 A 2 2 0 0 1 2 34 L 2 10 A 2 2 0 0 1 4 8 Z" />
      <circle cx="30" cy="25" r="8" />
      <line x1="36" y1="31" x2="44" y2="39" />
    </g>
    <text x="84" y="47" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      Import 'name': scan candidate directories on sys.path (or parent.__path__)
    </text>
  </g>

  
  <g transform="translate(400, 230)" filter="url(#card-shadow)">
    <rect width="400" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 34 14 A 14 14 0 1 0 38 24" />
      <polyline points="32,6 36,14 26,16" />
    </g>
    <text x="82" y="45" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
      Next candidate directory d
    </text>
  </g>

  
  <g transform="translate(350, 340)" filter="url(#card-shadow)">
    <rect width="500" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 22)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="36" height="34" rx="3" />
      <line x1="4" y1="18" x2="40" y2="18" />
      <line x1="22" y1="18" x2="22" y2="40" />
    </g>
    <text x="76" y="54" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
      1. Does d/name/__init__.py exist?
    </text>
  </g>

  
  <g transform="translate(980, 340)" filter="url(#card-shadow)">
    <rect width="550" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 20)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="20" />
      <polyline points="14,24 22,32 34,16" />
    </g>
    <text x="82" y="42" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Return Regular Package immediately</text>
    <text x="82" y="70" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(runs __init__.py)</text>
  </g>

  
  <g transform="translate(350, 475)" filter="url(#card-shadow)">
    <rect width="500" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 22)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 6 4 L 26 4 L 38 16 L 38 42 L 6 42 Z" />
      <polyline points="26,4 26,16 38,16" />
    </g>
    <text x="76" y="54" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
      2. Does d/name.{py,pyc,so,...} exist?
    </text>
  </g>

  
  <g transform="translate(980, 475)" filter="url(#card-shadow)">
    <rect width="550" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 20)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="20" />
      <polyline points="14,24 22,32 34,16" />
    </g>
    <text x="82" y="54" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448">Return Simple Module immediately</text>
  </g>

  
  <g transform="translate(350, 610)" filter="url(#card-shadow)">
    <rect width="500" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 26)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 4 8 L 16 8 L 22 14 L 40 14 A 2 2 0 0 1 42 16 L 42 34 A 2 2 0 0 1 40 36 L 4 36 A 2 2 0 0 1 2 34 L 2 10 A 2 2 0 0 1 4 8 Z" />
    </g>
    <text x="76" y="47" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">3. Is d/name a directory</text>
    <text x="76" y="77" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(no __init__.py)?</text>
  </g>

  
  <g transform="translate(980, 610)" filter="url(#card-shadow)">
    <rect width="550" height="105" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="8" y1="12" x2="38" y2="12" />
      <line x1="8" y1="24" x2="38" y2="24" />
      <line x1="8" y1="36" x2="26" y2="36" />
      <circle cx="4" cy="12" r="2" fill="#207448" />
      <circle cx="4" cy="24" r="2" fill="#207448" />
      <circle cx="4" cy="36" r="2" fill="#207448" />
    </g>
    <text x="78" y="46" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Record d/name in candidate list</text>
    <text x="78" y="78" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#207448">and KEEP SCANNING next d</text>
  </g>

  
  <g transform="translate(360, 755)" filter="url(#card-shadow)">
    <rect width="480" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="3" fill="none">
      <polyline points="10,12 24,22 10,32" />
      <line x1="30" y1="12" x2="30" y2="32" />
    </g>
    <text x="76" y="44" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      4. Continue to next candidate d
    </text>
  </g>

  
  <g transform="translate(430, 870)" filter="url(#card-shadow)">
    <rect width="420" height="80" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 18)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="18" cy="18" r="14" />
      <line x1="28" y1="28" x2="38" y2="38" />
    </g>
    <text x="78" y="49" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      More candidate directories?
    </text>
  </g>

  
  <g transform="translate(350, 995)" filter="url(#card-shadow)">
    <rect width="500" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 26)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="6" width="34" height="34" rx="4" />
      <line x1="14" y1="16" x2="32" y2="16" />
      <line x1="14" y1="24" x2="32" y2="24" />
      <circle cx="28" cy="30" r="10" fill="#ffffff" />
      <line x1="35" y1="37" x2="42" y2="44" />
    </g>
    <text x="76" y="47" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Any d/name directories</text>
    <text x="76" y="77" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#207448">recorded in Step 3?</text>
  </g>

  
  <g transform="translate(40, 1160)" filter="url(#card-shadow)">
    <rect width="940" height="150" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(28, 48)" stroke="#db8129" stroke-width="3.5" fill="none">
      <path d="M 6 12 L 18 12 L 24 18 L 44 18 A 2 2 0 0 1 46 20 L 46 42 A 2 2 0 0 1 44 44 L 6 44 A 2 2 0 0 1 4 42 L 4 14 A 2 2 0 0 1 6 12 Z" />
      <path d="M 14 6 L 24 6 L 30 12 L 52 12 A 2 2 0 0 1 54 14 L 54 34" stroke-dasharray="4,2" />
    </g>
    <text x="96" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      Create &amp; return Namespace Package
    </text>
    <text x="96" y="82" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      (__path__ = _NamespacePath of recorded dirs,
    </text>
    <text x="96" y="118" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      no __file__ attribute)
    </text>
  </g>

  
  <g transform="translate(1040, 1180)" filter="url(#card-shadow)">
    <rect width="480" height="110" rx="14" fill="#fdf2f0" stroke="#b93829" stroke-width="3" />
    
    <g transform="translate(26, 32)" stroke="#b93829" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="20" />
      <line x1="16" y1="16" x2="32" y2="32" />
      <line x1="32" y1="16" x2="16" y2="32" />
    </g>
    <text x="84" y="64" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#b93829">
      Raise ModuleNotFoundError
    </text>
  </g>
</svg>