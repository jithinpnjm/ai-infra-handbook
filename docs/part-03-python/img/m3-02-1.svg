<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Four import models, PEP 420 namespace packages (__path__), and the 4-s</title>
  <desc>Visual flowchart of Python import resolution mechanism, package scanning, and PEP 420 namespace package fallback.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#db8129"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#687771"/>
    </marker>
    
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#12261b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 44px; font-weight: bold; fill: #207448; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; font-weight: bold; fill: #303a36; }
    .body-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #303a36; }
    .body-mono { font-family: "SF Mono", "Consolas", "Liberation Mono", Menlo, monospace; font-size: 24px; fill: #303a36; }
    .label-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; }
    .icon-stroke { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .icon-orange { fill: none; stroke: #db8129; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="1480" height="64" rx="12" fill="#e8f1ea"/>
    <text x="740" y="46" text-anchor="middle" class="title-text">Four import models, PEP 420 namespace packages (__path__), and the 4-s</text>
  </g>

  

  
  <path d="M 640 188 L 640 226" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 640 310 L 640 348" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 940 405 L 1026 405" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 640 462 L 640 500" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 940 557 L 1026 557" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 640 614 L 640 652" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 940 715 L 1026 715" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 640 778 L 640 828" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1275 780 L 1275 885 L 944 885" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 770 885 L 816 885" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 880 830 L 880 812 L 60 812 L 60 268 L 396 268" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 880 940 L 880 986" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1025 1060 L 1096 1060" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)"/>

  
  <path d="M 735 1060 L 664 1060" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  
  <rect x="955" y="388" width="56" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="983" y="413" text-anchor="middle" class="label-badge" fill="#207448">Yes</text>

  
  <rect x="652" y="465" width="50" height="32" rx="6" fill="#f5f8f5" stroke="#687771" stroke-width="1.5"/>
  <text x="677" y="489" text-anchor="middle" class="label-badge" fill="#687771">No</text>

  
  <rect x="955" y="540" width="56" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="983" y="565" text-anchor="middle" class="label-badge" fill="#207448">Yes</text>

  
  <rect x="652" y="618" width="50" height="32" rx="6" fill="#f5f8f5" stroke="#687771" stroke-width="1.5"/>
  <text x="677" y="642" text-anchor="middle" class="label-badge" fill="#687771">No</text>

  
  <rect x="955" y="698" width="56" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="983" y="723" text-anchor="middle" class="label-badge" fill="#207448">Yes</text>

  
  <rect x="652" y="784" width="50" height="32" rx="6" fill="#f5f8f5" stroke="#687771" stroke-width="1.5"/>
  <text x="677" y="808" text-anchor="middle" class="label-badge" fill="#687771">No</text>

  
  <rect x="852" y="776" width="56" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="880" y="801" text-anchor="middle" class="label-badge" fill="#207448">Yes</text>

  
  <rect x="892" y="946" width="50" height="32" rx="6" fill="#f5f8f5" stroke="#687771" stroke-width="1.5"/>
  <text x="917" y="970" text-anchor="middle" class="label-badge" fill="#687771">No</text>

  
  <rect x="1036" y="1043" width="56" height="34" rx="6" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
  <text x="1064" y="1068" text-anchor="middle" class="label-badge" fill="#db8129">Yes</text>

  
  <rect x="672" y="1043" width="50" height="32" rx="6" fill="#f5f8f5" stroke="#687771" stroke-width="1.5"/>
  <text x="697" y="1067" text-anchor="middle" class="label-badge" fill="#687771">No</text>


  

  
  <g transform="translate(180, 126)">
    <rect width="920" height="62" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(16, 8)">
      <circle cx="20" cy="20" r="12" class="icon-stroke"/>
      <line x1="29" y1="29" x2="42" y2="42" class="icon-stroke"/>
    </g>
    <text x="76" y="40" class="body-mono">Import 'name': scan candidate directories on sys.path (or parent.__path__)</text>
  </g>

  
  <g transform="translate(410, 226)">
    <rect width="460" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 14)">
      <rect x="4" y="12" width="44" height="32" rx="4" class="icon-stroke"/>
      <path d="M 4 20 L 22 20 L 28 26 L 48 26" class="icon-stroke"/>
    </g>
    <text x="86" y="52" class="heading">Next candidate directory d</text>
  </g>

  
  <g transform="translate(340, 348)">
    <rect width="600" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 29)">
      <rect x="6" y="6" width="38" height="46" rx="4" class="icon-stroke"/>
      <path d="M 28 6 L 28 18 L 44 18" class="icon-stroke"/>
      <circle cx="25" cy="34" r="6" class="icon-stroke"/>
    </g>
    <text x="76" y="66" class="body-mono" font-weight="bold">1. Does d/name/__init__.py exist?</text>
  </g>

  
  <g transform="translate(1040, 350)">
    <rect width="500" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 27)">
      <path d="M 8 16 L 26 6 L 44 16 L 44 42 L 26 52 L 8 42 Z" class="icon-stroke"/>
      <path d="M 26 6 L 26 52 M 8 16 L 26 26 L 44 16" class="icon-stroke"/>
    </g>
    <text x="80" y="48" class="heading">Return Regular Package immediately</text>
    <text x="80" y="86" class="body-mono">(runs __init__.py)</text>
  </g>

  
  <g transform="translate(340, 500)">
    <rect width="600" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 29)">
      <rect x="6" y="6" width="38" height="46" rx="4" class="icon-stroke"/>
      <path d="M 14 22 L 36 22 M 14 32 L 30 32" class="icon-stroke"/>
    </g>
    <text x="76" y="66" class="body-mono" font-weight="bold">2. Does d/name.{py,pyc,so,...} exist?</text>
  </g>

  
  <g transform="translate(1040, 508)">
    <rect width="500" height="98" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 21)">
      <rect x="8" y="6" width="36" height="46" rx="4" class="icon-stroke"/>
      <line x1="16" y1="20" x2="36" y2="20" class="icon-stroke"/>
      <line x1="16" y1="30" x2="30" y2="30" class="icon-stroke"/>
    </g>
    <text x="80" y="58" class="heading">Return Simple Module immediately</text>
  </g>

  
  <g transform="translate(340, 652)">
    <rect width="600" height="126" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 35)">
      <rect x="4" y="14" width="44" height="32" rx="4" class="icon-stroke"/>
      <path d="M 4 22 L 20 22 L 26 28 L 48 28" class="icon-stroke"/>
    </g>
    <text x="78" y="52" class="body-mono" font-weight="bold">3. Is d/name a directory</text>
    <text x="78" y="94" class="body-mono" font-weight="bold">(no __init__.py)?</text>
  </g>

  
  <g transform="translate(1040, 650)">
    <rect width="470" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 37)">
      <rect x="6" y="8" width="40" height="42" rx="4" class="icon-stroke"/>
      <line x1="14" y1="20" x2="22" y2="20" class="icon-stroke"/>
      <line x1="28" y1="20" x2="38" y2="20" class="icon-stroke"/>
      <line x1="14" y1="32" x2="22" y2="32" class="icon-stroke"/>
      <line x1="28" y1="32" x2="38" y2="32" class="icon-stroke"/>
    </g>
    <text x="78" y="52" class="heading">Record d/name in candidate list</text>
    <text x="78" y="94" class="body-sans">and KEEP SCANNING next d</text>
  </g>

  
  <g transform="translate(260, 828)">
    <rect width="510" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 29)">
      <circle cx="26" cy="28" r="22" class="icon-stroke"/>
      <path d="M 20 18 L 32 28 L 20 38" class="icon-stroke"/>
    </g>
    <text x="80" y="66" class="heading">4. Continue to next candidate d</text>
  </g>

  
  <g transform="translate(830, 830)">
    <rect width="100" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(22, 14)">
      <path d="M 12 28 A 16 16 0 1 1 36 38" class="icon-stroke"/>
      <circle cx="28" cy="46" r="3" fill="#207448"/>
    </g>
    <text x="50" y="96" text-anchor="middle" class="heading">More?</text>
  </g>

  
  <g transform="translate(735, 986)">
    <rect width="290" height="148" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(20, 46)">
      <rect x="4" y="12" width="38" height="30" rx="4" class="icon-stroke"/>
      <circle cx="34" cy="34" r="10" class="icon-stroke"/>
      <line x1="42" y1="42" x2="50" y2="50" class="icon-stroke"/>
    </g>
    <text x="72" y="60" class="heading">Any d/name</text>
    <text x="72" y="96" class="heading">directories</text>
    <text x="72" y="130" class="body-sans">recorded in Step 3?</text>
  </g>

  
  <g transform="translate(180, 1005)">
    <rect width="484" height="110" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(24, 27)">
      <path d="M 28 6 L 48 16 L 48 34 C 48 46 28 54 28 54 C 28 54 8 46 8 34 L 8 16 Z" fill="none" stroke="#c0392b" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="34" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="3" fill="#c0392b"/>
    </g>
    <text x="86" y="66" class="heading" fill="#c0392b">Raise ModuleNotFoundError</text>
  </g>

  
  <g transform="translate(1110, 975)">
    <rect width="450" height="170" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="4" filter="url(#shadow)"/>
    
    <g transform="translate(20, 22)">
      <rect x="4" y="8" width="22" height="16" rx="2" class="icon-orange"/>
      <rect x="28" y="8" width="22" height="16" rx="2" class="icon-orange"/>
      <rect x="16" y="32" width="22" height="16" rx="2" class="icon-orange"/>
      <line x1="15" y1="24" x2="27" y2="32" class="icon-orange"/>
      <line x1="39" y1="24" x2="27" y2="32" class="icon-orange"/>
    </g>
    <text x="78" y="44" class="heading" fill="#db8129">Create &amp; return Namespace Package</text>
    <text x="24" y="90" class="body-mono">(__path__ = _NamespacePath of recorded dirs,</text>
    <text x="24" y="128" class="body-mono">no __file__ attribute)</text>
  </g>

</svg>