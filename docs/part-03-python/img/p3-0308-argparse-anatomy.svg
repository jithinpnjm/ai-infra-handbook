<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Reading the gpuctl parser top down</title>
  <desc>Visual infographic explaining the gpuctl parser architecture top-down using argparse and comparing with Click</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading the gpuctl parser top down</text>

  
  <rect x="40" y="90" width="740" height="945" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="60" y="135" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Annotated code of build_parser with callouts</text>

  
  <rect x="60" y="160" width="700" height="95" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="78" y="182" width="40" height="50" rx="4"/>
    <line x1="88" y1="196" x2="108" y2="196" stroke-width="3"/>
    <line x1="88" y1="207" x2="108" y2="207" stroke-width="3"/>
    <line x1="88" y1="218" x2="98" y2="218" stroke-width="3"/>
  </g>
  <text x="145" y="200" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">ArgumentParser(prog=gpuctl,</tspan>
    <tspan x="145" dy="32">description=GPU fleet helper)</tspan>
  </text>

  
  <rect x="60" y="270" width="700" height="95" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="78" y1="297" x2="118" y2="297"/>
    <circle cx="92" cy="297" r="4.5" fill="#207448"/>
    <line x1="78" y1="317" x2="118" y2="317"/>
    <circle cx="106" cy="317" r="4.5" fill="#207448"/>
    <line x1="78" y1="337" x2="118" y2="337"/>
    <circle cx="86" cy="337" r="4.5" fill="#207448"/>
  </g>
  <text x="145" y="310" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">-v, --verbose action=count default=0:</tspan>
    <tspan x="145" dy="32">repeat for more logging</tspan>
  </text>

  
  <rect x="60" y="380" width="700" height="95" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="86" cy="405" r="5" fill="#207448"/>
    <circle cx="112" cy="402" r="5" fill="#207448"/>
    <circle cx="112" cy="448" r="5" fill="#207448"/>
    <path d="M 86 410 v 38 h 21 M 86 410 v -8 h 21"/>
  </g>
  <text x="145" y="420" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">add_subparsers(dest=cmd, required=True):</tspan>
    <tspan x="145" dy="32">creates the two subcommands</tspan>
  </text>

  
  <rect x="60" y="490" width="700" height="135" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="76" y="535" width="44" height="42" rx="4"/>
    <line x1="76" y1="549" x2="120" y2="549" stroke-width="3"/>
    <line x1="98" y1="549" x2="98" y2="577" stroke-width="3"/>
  </g>
  <text x="145" y="522" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">status: hosts nargs=+</tspan>
    <tspan x="145" dy="28">means one or more hosts;</tspan>
    <tspan x="145" dy="28">--output choices table or json,</tspan>
    <tspan x="145" dy="28">default table</tspan>
  </text>

  
  <rect x="60" y="640" width="700" height="110" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M 78 672 l 14 16 v 20 h 12 v -20 l 14 -16 z"/>
  </g>
  <text x="145" y="672" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">drain: host;</tspan>
    <tspan x="145" dy="30">--timeout type=int default=600;</tspan>
    <tspan x="145" dy="30">--dry-run action=store_true</tspan>
  </text>

  
  <rect x="60" y="765" width="700" height="145" rx="10" fill="#fffaf2" stroke="#db8129" stroke-width="3"/>
  <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="76" y="815" width="44" height="44" rx="6"/>
    <path d="M 92 828 l 12 9 l -12 9"/>
    <line x1="105" y1="847" x2="112" y2="847"/>
  </g>
  <text x="145" y="798" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">main(argv=None) -> int:</tspan>
    <tspan x="145" dy="30">parse_args(argv) so tests can call</tspan>
    <tspan x="145" dy="30">main([...]) directly</tspan>
    <tspan x="145" dy="30">without starting a process</tspan>
  </text>

  
  <rect x="60" y="925" width="700" height="90" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 98 948 h -18 v 42 h 18"/>
    <line x1="88" y1="969" x2="116" y2="969"/>
    <path d="M 108 961 l 8 8 l -8 8"/>
  </g>
  <text x="145" y="960" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">if __name__ == __main__:</tspan>
    <tspan x="145" dy="32">sys.exit(main())</tspan>
  </text>

  
  <rect x="820" y="90" width="740" height="945" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="840" y="135" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Click version of the same tool</text>

  
  <rect x="840" y="160" width="700" height="135" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="880" cy="227" r="14"/>
    <path d="M 880 205 v 8 M 880 241 v 8 M 858 227 h 8 M 894 227 h 8 M 865 212 l 6 6 M 889 236 l 6 6 M 865 242 l 6 -6 M 889 218 l 6 -6" stroke-linecap="round"/>
  </g>
  <text x="925" y="198" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">group callback runs first:</tspan>
    <tspan x="925" dy="32">sets up logging to stderr, loads config,</tspan>
    <tspan x="925" dy="32">stores both on ctx.obj</tspan>
  </text>

  
  <rect x="840" y="325" width="700" height="110" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="873" cy="380" r="14"/>
    <circle cx="893" cy="380" r="14"/>
  </g>
  <text x="925" y="362" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">subcommands read shared state</tspan>
    <tspan x="925" dy="32">through @click.pass_obj</tspan>
  </text>

  
  <rect x="840" y="465" width="700" height="135" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M 860 515 h 44 v 28 h -24 l -8 8 v -8 h -12 z"/>
    <circle cx="877" cy="529" r="2.5" fill="#207448"/>
    <circle cx="887" cy="529" r="2.5" fill="#207448"/>
  </g>
  <text x="925" y="502" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">drain asks click.confirm(Drain host?,</tspan>
    <tspan x="925" dy="32">abort=True) unless --yes</tspan>
    <tspan x="925" dy="32">or --dry-run</tspan>
  </text>

  
  <rect x="840" y="630" width="700" height="110" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M 874 667 h 16 m -8 0 v 12 l -14 20 a 4 4 0 0 0 3 6 h 26 a 4 4 0 0 0 3 -6 l -14 -20 v -12"/>
    <line x1="872" y1="693" x2="892" y2="693" stroke-width="2.5"/>
  </g>
  <text x="925" y="668" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">test with</tspan>
    <tspan x="925" dy="32">CliRunner().invoke(cli, [status, h1])</tspan>
  </text>

  
  <rect x="840" y="770" width="700" height="145" rx="10" fill="#ffffff" stroke="#c5dac9" stroke-width="1.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M 882 822 l 18 8 v 16 c 0 12 -18 20 -18 20 c 0 0 -18 -8 -18 -20 v -16 z"/>
    <line x1="875" y1="844" x2="889" y2="844" stroke-linecap="round"/>
  </g>
  <text x="925" y="805" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="925" dy="0">ClickException or UsageError</tspan>
    <tspan x="925" dy="32">for clean exit codes; ctx.exit(code);</tspan>
    <tspan x="925" dy="32">echo(err=True) to stderr</tspan>
  </text>

  
  <rect x="40" y="1055" width="1520" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1096" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Take argv as a parameter and return an int from main</text>
</svg>