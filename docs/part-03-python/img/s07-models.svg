<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Validation in and filtering out</title>
  <desc>Infographic showing the flow from request JSON through Pydantic validation, handler execution, response_model filtering, to response JSON.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Validation in and filtering out</text>

  
  <rect x="55" y="180" width="245" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="177.5" cy="235" r="24" fill="#207448"/>
  <text x="177.5" y="244" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(149.5, 295)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2 L38 2 L50 14 L50 54 L6 54 Z"/>
    <path d="M38 2 L38 14 L50 14"/>
    <path d="M17 28 C21 28 21 33 17 35 C21 37 21 42 17 42"/>
    <path d="M39 28 C35 28 35 33 39 35 C35 37 35 42 39 42"/>
  </g>
  <text x="177.5" y="420" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
    <tspan x="177.5" dy="0">request</tspan>
    <tspan x="177.5" dy="42">JSON</tspan>
  </text>

  
  <line x1="300" y1="440" x2="329" y2="440" stroke="#207448" stroke-width="4"/>
  <polygon points="345,440 327,431 327,449" fill="#207448"/>

  
  <rect x="345" y="180" width="310" height="520" rx="16" fill="#fffdfa" stroke="#db8129" stroke-width="3"/>
  <circle cx="500" cy="235" r="24" fill="#db8129"/>
  <text x="500" y="244" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(472, 295)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 4 L6 13 L6 29 C6 44 28 53 28 53 C28 53 50 44 50 29 L50 13 Z"/>
    <path d="M19 28 L25 34 L37 22"/>
  </g>
  <text x="500" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="500" dy="0">Pydantic</tspan>
    <tspan x="500" dy="38">request model</tspan>
    <tspan x="500" dy="38">validates</tspan>
  </text>
  
  <rect x="365" y="565" width="270" height="64" rx="8" fill="#fef4eb" stroke="#db8129" stroke-width="2"/>
  <text x="500" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">failure gives 422</text>

  
  <line x1="655" y1="440" x2="684" y2="440" stroke="#207448" stroke-width="4"/>
  <polygon points="700,440 682,431 682,449" fill="#207448"/>

  
  <rect x="700" y="180" width="200" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="800" cy="235" r="24" fill="#207448"/>
  <text x="800" y="244" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(772, 295)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="10"/>
    <path d="M28 6 L28 14 M28 42 L28 50 M6 28 L14 28 M42 28 L50 28 M12.5 12.5 L18.1 18.1 M37.9 37.9 L43.5 43.5 M12.5 43.5 L18.1 37.9 M37.9 18.1 L43.5 12.5"/>
  </g>
  <text x="800" y="440" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">handler</text>

  
  <line x1="900" y1="440" x2="929" y2="440" stroke="#207448" stroke-width="4"/>
  <polygon points="945,440 927,431 927,449" fill="#207448"/>

  
  <rect x="945" y="180" width="310" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1100" cy="235" r="24" fill="#207448"/>
  <text x="1100" y="244" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(1072, 295)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="6,6 50,6 33,28 33,48 23,54 23,28"/>
  </g>
  <text x="1100" y="415" text-anchor="middle" fill="#303a36">
    <tspan x="1100" dy="0" font-family="monospace" font-size="26" font-weight="bold">response_model</tspan>
    <tspan x="1100" dy="42" font-family="sans-serif" font-size="24">keeps only the</tspan>
    <tspan x="1100" dy="36" font-family="sans-serif" font-size="24">declared fields</tspan>
  </text>

  
  <line x1="1255" y1="440" x2="1284" y2="440" stroke="#207448" stroke-width="4"/>
  <polygon points="1300,440 1282,431 1282,449" fill="#207448"/>

  
  <rect x="1300" y="180" width="245" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1422.5" cy="235" r="24" fill="#207448"/>
  <text x="1422.5" y="244" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <g transform="translate(1394.5, 295)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2 L38 2 L50 14 L50 54 L6 54 Z"/>
    <path d="M38 2 L38 14 L50 14"/>
    <path d="M18 36 L25 42 L38 28"/>
  </g>
  <text x="1422.5" y="420" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
    <tspan x="1422.5" dy="0">response</tspan>
    <tspan x="1422.5" dy="42">JSON</tspan>
  </text>

  
  <rect x="55" y="760" width="1490" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 776)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="20" width="32" height="24" rx="4"/>
    <path d="M16 20 L16 12 C16 7.6 19.6 4 24 4 C28.4 4 32 7.6 32 12 L32 20"/>
  </g>
  <text x="800" y="810" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">internal fields never leak out</text>
</svg>