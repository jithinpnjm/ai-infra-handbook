<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Layering timeout, retry, breaker and bulkhead</title>
  <desc>Visual explanation of layering timeout, retry, circuit breaker, and bulkhead patterns around a dependency call, with breaker states and recovery.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="54" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Layering timeout, retry, breaker and bulkhead</text>
  
  <g id="box-timeout">
    <rect x="40" y="95" width="760" height="610" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(65, 108)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="20" />
      <polyline points="24,12 24,24 34,24" />
    </g>
    <text x="125" y="142" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">timeout</text>
  </g>
  
  <g id="box-retry">
    <rect x="70" y="165" width="700" height="515" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(95, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 40 20 A 16 16 0 1 0 42 28" />
      <polyline points="32,8 42,20 30,22" />
    </g>
    <text x="155" y="212" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">retry</text>
  </g>
  
  <g id="box-circuit-breaker">
    <rect x="100" y="235" width="640" height="420" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(125, 248)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="36" r="4" fill="#207448" />
      <circle cx="38" cy="36" r="4" fill="#207448" />
      <line x1="10" y1="32" x2="32" y2="14" />
    </g>
    <text x="185" y="282" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">circuit breaker</text>
  </g>
  
  <g id="box-bulkhead">
    <rect x="130" y="305" width="580" height="325" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(155, 318)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 L 24 3 L 42 8 L 42 26 C 42 38 24 45 24 45 C 24 45 6 38 6 26 Z" />
      <line x1="12" y1="18" x2="36" y2="18" />
      <line x1="15" y1="28" x2="33" y2="28" />
    </g>
    <text x="215" y="352" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">bulkhead</text>
  </g>
  
  <g id="box-call">
    <rect x="160" y="380" width="520" height="220" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" />
    <g transform="translate(396, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="12" rx="20" ry="7" />
      <path d="M 4 12 L 4 36 C 4 42 13 46 24 46 C 35 46 44 42 44 36 L 44 12" />
      <path d="M 4 24 C 4 30 13 34 24 34 C 35 34 44 30 44 24" />
    </g>
    <text x="420" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">call to the dependency</text>
  </g>
  
  <g id="card-reason">
    <rect x="840" y="95" width="720" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(865, 127)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 46 44 L 2 44 Z" />
      <line x1="24" y1="18" x2="24" y2="30" />
      <circle cx="24" cy="37" r="1.5" fill="#207448" />
    </g>
    <text x="935" y="142" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">when a dependency is down, retries</tspan>
      <tspan x="935" dy="32">make it worse because every caller</tspan>
      <tspan x="935" dy="32">keeps adding load</tspan>
    </text>
  </g>
  
  <g id="card-bulkhead-desc">
    <rect x="840" y="235" width="720" height="170" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(865, 290)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="46" x2="8" y2="6" />
      <circle cx="8" cy="6" r="3.5" fill="#207448" />
      <line x1="8" y1="16" x2="40" y2="4" />
      <line x1="8" y1="26" x2="36" y2="14" />
    </g>
    <text x="935" y="272" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">limits how many calls run at once</tspan>
      <tspan x="935" dy="28">against one dependency, using a semaphore</tspan>
      <tspan x="935" dy="28">(a counter that caps simultaneous work),</tspan>
      <tspan x="935" dy="28">so one slow service cannot consume</tspan>
      <tspan x="935" dy="28">every thread</tspan>
    </text>
  </g>
  
  <g id="card-message-example">
    <rect x="840" y="425" width="720" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(865, 465)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="42" height="32" rx="6" />
      <polyline points="6,10 25,24 44,10" />
    </g>
    <text x="935" y="462" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="935" dy="0">fleet API unavailable,</tspan>
      <tspan x="935" dy="30">breaker open for 30 s</tspan>
    </text>
    <text x="935" y="530" font-family="sans-serif" font-size="24" fill="#303a36">so the operator knows what happened</text>
  </g>
  
  <g id="card-analogy">
    <rect x="840" y="575" width="290" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(965, 590)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="28" height="16" rx="4" />
      <line x1="2" y1="18" x2="6" y2="18" />
      <line x1="34" y1="18" x2="38" y2="18" />
    </g>
    <text x="985" y="655" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">a fuse in a wall</text>
  </g>
  
  <g id="card-libraries">
    <rect x="1150" y="575" width="410" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(1170, 615)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="34" rx="6" />
      <path d="M 12 18 L 18 23 L 12 28" />
      <line x1="22" y1="28" x2="30" y2="28" />
    </g>
    <text x="1225" y="608" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1225" dy="0">pybreaker,</tspan>
      <tspan x="1225" dy="26">circuitbreaker,</tspan>
      <tspan x="1225" dy="26">or a class of</tspan>
      <tspan x="1225" dy="26">about 30 lines</tspan>
    </text>
  </g>
  
  <g id="breaker-strip">
    <rect x="40" y="725" width="1520" height="360" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <rect x="65" y="745" width="440" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(85, 755)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="18" />
      <polyline points="12,20 18,26 28,14" />
    </g>
    <text x="85" y="825" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0" font-size="28" font-weight="bold" fill="#207448">closed:</tspan>
      <tspan x="85" dy="38">calls pass; counts</tspan>
      <tspan x="85" dy="32">consecutive failures</tspan>
    </text>
    
    <line x1="505" y1="842" x2="575" y2="842" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="575" y="745" width="450" height="195" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <g transform="translate(595, 755)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="18" />
      <line x1="12" y1="12" x2="28" y2="28" />
      <line x1="28" y1="12" x2="12" y2="28" />
    </g>
    <text x="595" y="825" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="595" dy="0" font-size="26" font-weight="bold" fill="#db8129">open after a threshold:</tspan>
      <tspan x="595" dy="38">calls fail fast without</tspan>
      <tspan x="595" dy="32">reaching the dependency</tspan>
    </text>
    
    <line x1="1025" y1="842" x2="1095" y2="842" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="1095" y="745" width="440" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(1115, 755)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="18" />
      <path d="M 20 2 A 18 18 0 0 1 20 38 Z" fill="#207448" />
    </g>
    <text x="1115" y="825" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1115" dy="0" font-size="26" font-weight="bold" fill="#207448">after a cool-down,</tspan>
      <tspan x="1115" dy="34" font-size="26" font-weight="bold" fill="#207448">half-open:</tspan>
      <tspan x="1115" dy="36">one probe call passes</tspan>
    </text>
    
    <rect x="80" y="980" width="460" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="310" y="1021" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">probe succeeds: closed again</text>
    
    <rect x="600" y="980" width="400" height="65" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
    <text x="800" y="1021" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">probe fails: open again</text>
    
    <path d="M 1220 940 L 1220 1012 L 1000 1012" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
    <line x1="800" y1="980" x2="800" y2="940" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
    
    <path d="M 1400 940 L 1400 1058 L 310 1058 L 310 1045" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <line x1="310" y1="980" x2="310" y2="940" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  </g>
  
  <rect x="40" y="1115" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1153" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Fail fast with a clear message while the dependency recovers</text>
</svg>