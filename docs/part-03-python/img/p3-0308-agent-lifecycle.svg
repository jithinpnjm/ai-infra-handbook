<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>A node agent's main loop, signals and failure containment</title>
  <desc>Visual architecture of a node agent main loop, signals handling, failure containment, state reconciliation, and self-description.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A node agent's main loop, signals and failure containment</text>

  
  <g id="loop-panel">
    
    <rect x="40" y="104" width="600" height="952" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(68, 126)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="110 35" />
      <path d="M 44 8 L 52 20 L 36 20 Z" fill="#207448" />
    </g>

    
    <path d="M 570 300 C 610 300, 610 800, 570 800" fill="none" stroke="#a3c4ab" stroke-width="4" stroke-dasharray="8 8" />
    <path d="M 70 800 C 30 800, 30 300, 70 300" fill="none" stroke="#a3c4ab" stroke-width="4" stroke-dasharray="8 8" />

    
    <rect x="70" y="196" width="540" height="210" rx="12" fill="#ffffff" stroke="#c3d9c8" stroke-width="2" />
    <g transform="translate(90, 214)">
      <rect x="0" y="0" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 8 10 L 14 14 L 8 18 M 18 18 L 26 18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="94" y="278" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="94" dy="0">while not stop.is_set(): </tspan>
      <tspan x="130" dy="40">do_cycle(); </tspan>
      <tspan x="130" dy="40">stop.wait(interval + jitter)</tspan>
    </text>

    
    <rect x="70" y="436" width="540" height="210" rx="12" fill="#ffffff" stroke="#c3d9c8" stroke-width="2" />
    <g transform="translate(90, 454)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 16 8 L 16 16 L 23 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 28 6 L 34 2" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="94" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="94" dy="0">measure each cycle, log </tspan>
      <tspan x="94" dy="38">and emit a metric when </tspan>
      <tspan x="94" dy="38">it overruns</tspan>
    </text>

    
    <rect x="70" y="676" width="540" height="220" rx="12" fill="#ffffff" stroke="#c3d9c8" stroke-width="2" />
    <g transform="translate(90, 694)">
      <path d="M 2 16 L 10 6 L 18 24 L 26 10 L 32 16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="94" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="94" dy="0">jitter stops every agent firing </tspan>
      <tspan x="94" dy="38">at the same instant and </tspan>
      <tspan x="94" dy="38">spiking the fleet</tspan>
    </text>
  </g>

  
  <g id="signals-panel">
    <rect x="664" y="104" width="896" height="332" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(688, 120)">
      <path d="M 14 36 L 24 10 L 34 36 M 18 26 L 30 26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="24" cy="8" r="4" fill="#207448" />
      <path d="M 8 16 C 12 10, 36 10, 40 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 2 22 C 8 4, 40 4, 46 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <rect x="746" y="120" width="790" height="68" rx="8" fill="#ffffff" stroke="#c3d9c8" stroke-width="1.5" />
    <text x="764" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="764" dy="0"><tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">SIGTERM: </tspan>finish the current cycle, </tspan>
      <tspan x="764" dy="28">flush state, exit within the grace period</tspan>
    </text>

    
    <rect x="688" y="198" width="418" height="58" rx="8" fill="#ffffff" stroke="#c3d9c8" stroke-width="1.5" />
    <text x="706" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">SIGHUP: </tspan>reload config
    </text>

    
    <rect x="1118" y="198" width="418" height="58" rx="8" fill="#ffffff" stroke="#c3d9c8" stroke-width="1.5" />
    <text x="1136" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      ignore <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">SIGPIPE </tspan>issues
    </text>

    
    <rect x="688" y="266" width="848" height="54" rx="8" fill="#ffffff" stroke="#c3d9c8" stroke-width="1.5" />
    <text x="706" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      fatal error: exit non-zero so systemd restarts it
    </text>

    
    <rect x="688" y="330" width="848" height="90" rx="8" fill="#ffffff" stroke="#c3d9c8" stroke-width="1.5" />
    <text x="706" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="706" dy="0">asyncio: <tspan font-family="ui-monospace, monospace">loop.add_signal_handler; </tspan></tspan>
      <tspan x="706" dy="34">threaded: <tspan font-family="ui-monospace, monospace">a threading.Event the loop checks</tspan></tspan>
    </text>
  </g>

  
  <g id="containment-panel">
    <rect x="664" y="452" width="896" height="194" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />

    
    <g transform="translate(694, 480)">
      <path d="M 28 6 L 48 14 V 28 C 48 42, 28 50, 28 50 C 28 50, 8 42, 8 28 V 14 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <path d="M 28 20 L 28 32 M 28 38 L 28 40" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="768" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="768" dy="0">each check has its own try block and its own </tspan>
      <tspan x="768" dy="36">timeout, so a broken GPU query never stops </tspan>
      <tspan x="768" dy="36">the network checks; export a success metric </tspan>
      <tspan x="768" dy="36">per check</tspan>
    </text>
  </g>

  
  <g id="state-panel">
    <rect x="664" y="666" width="436" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(694, 688)">
      <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 6 14 V 28 C 6 34, 50 34, 50 28 V 14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 6 28 V 42 C 6 48, 50 48, 50 42 V 28" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>

    <text x="694" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="694" dy="0">small state under </tspan>
      <tspan x="694" dy="34"><tspan font-family="ui-monospace, monospace" font-weight="bold">/var/lib/agent </tspan>with </tspan>
      <tspan x="694" dy="34">atomic writes; on </tspan>
      <tspan x="694" dy="34">startup reconcile desired </tspan>
      <tspan x="694" dy="34">state against actual state, </tspan>
      <tspan x="694" dy="34">the broker or hardware is </tspan>
      <tspan x="694" dy="34">the source of truth</tspan>
    </text>
  </g>

  
  <g id="self-description-panel">
    <rect x="1124" y="666" width="436" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1154, 688)">
      <rect x="6" y="8" width="44" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 14 32 L 20 32 L 25 20 L 31 40 L 36 28 L 42 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="1154" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1154" dy="0">expose <tspan font-family="ui-monospace, monospace" font-weight="bold">/metrics </tspan>and </tspan>
      <tspan x="1154" dy="34"><tspan font-family="ui-monospace, monospace" font-weight="bold">/healthz; </tspan>report version, </tspan>
      <tspan x="1154" dy="34">build info, timestamp of </tspan>
      <tspan x="1154" dy="34">the last successful </tspan>
      <tspan x="1154" dy="34">cycle, queue depths; </tspan>
      <tspan x="1154" dy="34">alert when last-success </tspan>
      <tspan x="1154" dy="34">goes stale</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1080" width="1520" height="72" rx="12" fill="#207448" />
    <text x="800" y="1126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">A small mistake in the agent multiplies across the fleet</text>
  </g>
</svg>