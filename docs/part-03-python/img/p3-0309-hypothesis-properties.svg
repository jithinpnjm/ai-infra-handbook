<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Four kinds of property, with the two Hypothesis tests from the chapter</title>
  <desc>Infographic explaining four kinds of property testing and showing two concrete Hypothesis code examples.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <g id="header">
    <text x="80" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
      Four kinds of property, with the two Hypothesis tests from the chapter
    </text>
  </g>

  
  <g id="opening-story">
    <rect x="80" y="105" width="1440" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="120" cy="140" r="18" fill="#207448"/>
    <text x="120" y="148" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
    <text x="155" y="148" font-family="sans-serif" font-size="24" fill="#303a36">
      a parser passes every example in its test file, then someone feeds it an empty field
    </text>
  </g>

  
  <g id="core-definition">
    <rect x="80" y="195" width="1440" height="74" rx="10" fill="#db8129"/>
    
    <path d="M 120 216 L 138 224 L 138 242 Q 138 254 120 260 Q 102 254 102 242 L 102 224 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <text x="155" y="242" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      a property is a rule about behaviour, not one hand-picked example
    </text>
  </g>

  
  

  
  <g id="test-round-trip">
    <rect x="80" y="295" width="710" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="80" y="295" width="710" height="56" rx="12" fill="#e8f1ea"/>
    
    <rect x="105" y="310" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="113,323 119,323 125,323" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="155" y="334" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      Hypothesis Test: Round trip
    </text>

    
    <text x="105" y="386" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="105" dy="0">Round trip: @given(st.lists(st.tuples(</tspan>
      <tspan x="105" dy="38">  st.integers(0, 15),</tspan>
      <tspan x="105" dy="38">  st.integers(0, 120)), max_size=16));</tspan>
      <tspan x="105" dy="38">gpus = [Gpu(i, H100, t, None, None, None, None)</tspan>
      <tspan x="105" dy="38">  for i, t in pairs];</tspan>
      <tspan x="105" dy="38">assert parse_smi_csv(render_csv(gpus))</tspan>
      <tspan x="105" dy="38">  == gpus</tspan>
    </text>
  </g>

  
  <g id="test-exception">
    <rect x="80" y="655" width="710" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="80" y="655" width="710" height="56" rx="12" fill="#e8f1ea"/>
    
    <circle cx="123" cy="683" r="13" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="123" y1="670" x2="123" y2="696" stroke="#207448" stroke-width="2"/>
    <line x1="110" y1="683" x2="136" y2="683" stroke="#207448" stroke-width="2"/>
    <text x="155" y="694" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      Hypothesis Test: Exception handling
    </text>

    
    <text x="105" y="750" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="105" dy="0">Only the documented exception:</tspan>
      <tspan x="105" dy="40">@given(st.text());</tspan>
      <tspan x="105" dy="40">try parse_smi_csv(s)</tspan>
      <tspan x="105" dy="40">except ValueError:</tspan>
      <tspan x="105" dy="40">    pass</tspan>
    </text>
  </g>

  
  

  
  <g id="prop-round-trip">
    <rect x="810" y="295" width="710" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 855 350 A 18 18 0 1 1 855 375" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="855,340 855,352 867,352" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="895" y="375" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      round trip: encode then decode
    </text>
  </g>

  
  <g id="prop-idempotence">
    <rect x="810" y="455" width="710" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="855" cy="525" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="844" y1="520" x2="866" y2="520" stroke="#207448" stroke-width="4"/>
    <line x1="844" y1="530" x2="866" y2="530" stroke="#207448" stroke-width="4"/>
    <text x="895" y="525" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="895" dy="0" font-weight="bold">idempotence:</tspan>
      <tspan x="895" dy="36" font-family="monospace" font-size="24">normalize(normalize(x)) == normalize(x)</tspan>
    </text>
  </g>

  
  <g id="prop-invariants">
    <rect x="810" y="615" width="710" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 843 695 L 867 695 M 855 675 L 855 695 M 840 680 L 870 680" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="895" y="675" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="895" dy="0" font-weight="bold">invariants:</tspan>
      <tspan x="895" dy="36">a preserved sum, an order that does not matter</tspan>
    </text>
  </g>

  
  <g id="prop-compare">
    <rect x="810" y="775" width="710" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="838" y="825" width="30" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="844,845 850,851 862,839" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="895" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="895" dy="0">compare against a slow reference, or</tspan>
      <tspan x="895" dy="34">check that the code never raises</tspan>
      <tspan x="895" dy="34">anything except a specific exception</tspan>
    </text>
  </g>

  
  <g id="strip-shrinking">
    <rect x="80" y="945" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <ellipse cx="125" cy="985" rx="18" ry="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 107 985 L 107 1015 A 18 8 0 0 0 143 1015 L 143 985" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 107 1000 A 18 8 0 0 0 143 1000" fill="none" stroke="#207448" stroke-width="3"/>
    <text x="165" y="990" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="165" dy="0">when Hypothesis finds a counterexample it shrinks the input to a minimal case;</tspan>
      <tspan x="165" dy="36">failing examples go into a database so regressions are replayed on later runs</tspan>
    </text>
  </g>

  
  <g id="good-fit-strip">
    <rect x="80" y="1075" width="1440" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="125" cy="1115" r="16" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="125" cy="1115" r="7" fill="#207448"/>
    <text x="165" y="1124" font-family="sans-serif" font-size="25" fill="#303a36">
      parsers, serialisers, validators, arithmetic on units
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="80" y="1175" width="1440" height="90" rx="12" fill="#207448"/>
    
    <path d="M 125 1205 A 12 12 0 0 1 137 1222 C 134 1227 132 1230 132 1235 L 118 1235 C 118 1230 116 1227 113 1222 A 12 12 0 0 1 125 1205 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="120" y1="1240" x2="130" y2="1240" stroke="#ffffff" stroke-width="3"/>
    <text x="165" y="1231" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      Example tests check the inputs you thought of, properties go looking for the ones you missed
    </text>
  </g>

</svg>