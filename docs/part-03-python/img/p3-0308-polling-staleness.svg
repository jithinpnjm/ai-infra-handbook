<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Background polling versus a scrape-time collector</title>
  <desc>Visual comparison between background polling with Gauge.set versus an on-demand scrape-time FleetCollector registered with REGISTRY.register, followed by collector rules and key takeaway.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Background polling versus a scrape-time collector</text>

  
  <rect x="420" y="76" width="760" height="38" rx="19" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">
    <tspan>Both serve on port 9101 with </tspan>
    <tspan font-family="ui-monospace, monospace" font-weight="bold">start_http_server(9101)</tspan>
  </text>

  
  <g id="top-timeline">
    
    <rect x="40" y="125" width="1520" height="268" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 40 137 A 12 12 0 0 1 52 125 L 1548 125 A 12 12 0 0 1 1560 137 L 1560 172 L 40 172 Z" fill="#e8f1ea" />

    
    <g transform="translate(56, 133)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="13" />
      <polyline points="16 8 16 16 22 16" />
    </g>
    <text x="96" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan font-family="ui-monospace, monospace">poll_forever</tspan>
      <tspan> with </tspan>
      <tspan font-family="ui-monospace, monospace">Gauge.set</tspan>
    </text>

    
    <rect x="58" y="184" width="410" height="194" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(72, 194)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="14" r="10" />
      <path d="M 14 4 L 14 24 M 4 14 L 24 14" />
    </g>
    <text x="72" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="72" dy="0">a polling thread writes</tspan>
      <tspan x="72" dy="30" font-family="ui-monospace, monospace" fill="#207448">TEMP.labels(h, gpu).set(t)</tspan>
      <tspan x="72" dy="30">every interval=15 and</tspan>
      <tspan x="72" dy="30" font-family="ui-monospace, monospace" fill="#207448">ERRORS.labels(h).inc()</tspan>
      <tspan x="72" dy="30">on failure</tspan>
    </text>

    
    <rect x="482" y="184" width="200" height="194" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(496, 194)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="22" height="18" rx="3" />
      <line x1="8" y1="24" x2="22" y2="24" />
    </g>
    <text x="496" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="496" dy="0">Prometheus</tspan>
      <tspan x="496" dy="32">scrapes at</tspan>
      <tspan x="496" dy="32">its own rate</tspan>
    </text>

    
    <text x="765" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="765" dy="0">if polling</tspan>
      <tspan x="765" dy="28">stalls in</tspan>
      <tspan x="765" dy="28">the night</tspan>
    </text>
    <line x1="682" y1="316" x2="844" y2="316" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="846" y="184" width="370" height="194" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <g transform="translate(862, 196)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 4 L 30 28 L 2 28 Z" />
      <line x1="16" y1="13" x2="16" y2="19" />
      <circle cx="16" cy="24" r="1.5" fill="#db8129" />
    </g>
    <text x="862" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="862" dy="0">the metrics keep showing</tspan>
      <tspan x="862" dy="32">the last values, dashboards</tspan>
      <tspan x="862" dy="32">stay calm on hours-old</tspan>
      <tspan x="862" dy="32">numbers</tspan>
    </text>

    
    <rect x="1230" y="184" width="314" height="194" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(1246, 196)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="20" height="20" rx="3" />
      <line x1="11" y1="16" x2="21" y2="16" />
    </g>
    <text x="1246" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1246" dy="0">series for removed</tspan>
      <tspan x="1246" dy="32">hosts linger until</tspan>
      <tspan x="1246" dy="34" font-family="ui-monospace, monospace" fill="#207448">.remove(...)</tspan>
    </text>
  </g>

  
  <g id="bottom-timeline">
    
    <rect x="40" y="408" width="1520" height="476" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 40 420 A 12 12 0 0 1 52 408 L 1548 408 A 12 12 0 0 1 1560 420 L 1560 455 L 40 455 Z" fill="#e8f1ea" />

    
    <g transform="translate(56, 416)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="6" />
      <path d="M 16 3 L 16 7 M 16 25 L 16 29 M 3 16 L 7 16 M 25 16 L 29 16 M 7 7 L 10 10 M 22 22 L 25 25 M 7 25 L 10 22 M 22 10 L 25 7" />
    </g>
    <text x="96" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan font-family="ui-monospace, monospace">FleetCollector</tspan>
      <tspan> registered with </tspan>
      <tspan font-family="ui-monospace, monospace">REGISTRY.register</tspan>
    </text>

    
    <rect x="58" y="472" width="240" height="98" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="82" cy="496" r="14" fill="#207448" />
    <text x="82" y="504" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="108" y="503" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Prometheus</text>
    <text x="74" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">scrapes</text>

    
    <line x1="178" y1="570" x2="178" y2="602" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="58" y="604" width="240" height="98" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="82" cy="628" r="14" fill="#207448" />
    <text x="82" y="636" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="108" y="635" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">collect()</text>
    <text x="74" y="674" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">runs now</text>

    
    <line x1="298" y1="653" x2="340" y2="653" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="342" y="525" width="295" height="156" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="366" cy="551" r="14" fill="#207448" />
    <text x="366" y="559" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="392" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Per Host</text>
    <text x="358" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="358" dy="0">for each host:</tspan>
      <tspan x="358" dy="32" font-family="ui-monospace, monospace" fill="#207448">read_temps(h,</tspan>
      <tspan x="358" dy="30" font-family="ui-monospace, monospace" fill="#207448">timeout=5)</tspan>
    </text>

    
    <path d="M 637 570 L 680 570 L 680 522 L 722 522" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 637 635 L 680 635 L 680 678 L 722 678" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    
    <text x="682" y="708" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-style="italic" fill="#303a36">on failure</text>

    
    <rect x="724" y="468" width="455" height="110" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="748" cy="494" r="14" fill="#207448" />
    <text x="748" y="502" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <text x="774" y="501" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Success Data</text>
    <text x="740" y="538" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
      <tspan x="740" dy="0">temp.add_metric([h, str(gpu)], t);</tspan>
      <tspan x="740" dy="30">up.add_metric([h], 1)</tspan>
    </text>

    
    <rect x="724" y="622" width="455" height="114" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="740" y="658" font-family="ui-monospace, monospace" font-size="24" fill="#207448">up.add_metric([h], 0)</text>
    <text x="740" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="740" dy="0">so failure is data,</tspan>
      <tspan x="740" dy="30">not an exception</tspan>
    </text>

    
    <path d="M 1179 522 L 1210 522 L 1210 575 L 1238 575" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 1179 678 L 1210 678 L 1210 625 L 1238 625" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="1240" y="525" width="304" height="156" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="1264" cy="551" r="14" fill="#207448" />
    <text x="1264" y="559" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <text x="1290" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Yield</text>
    <text x="1254" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1254" dy="0">yield temp, up and</tspan>
      <tspan x="1254" dy="32" font-family="ui-monospace, monospace" fill="#207448">fleet_scrape_</tspan>
      <tspan x="1254" dy="30" font-family="ui-monospace, monospace" fill="#207448">duration_seconds</tspan>
    </text>

    
    <rect x="58" y="810" width="1486" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(76, 822)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 16 12 24 28 8" />
    </g>
    <text x="800" y="848" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">each scrape is a fresh, consistent snapshot, so no stale series survive</text>
  </g>

  
  <g id="rules-strip">
    <rect x="40" y="902" width="1520" height="224" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 40 914 A 12 12 0 0 1 52 902 L 1548 902 A 12 12 0 0 1 1560 914 L 1560 944 L 40 944 Z" fill="#e8f1ea" />

    
    <g transform="translate(56, 910)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 4 L 28 9 L 28 17 C 28 23 16 29 16 29 C 16 29 4 23 4 17 L 4 9 Z" />
    </g>
    <text x="96" y="934" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Rules</text>

    
    <text x="64" y="976" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">• collection must finish well inside the scrape</tspan>
      <tspan x="84" dy="28">timeout; parallelise with a thread pool and a</tspan>
      <tspan x="84" dy="28">per-host timeout, or cache results for a few</tspan>
      <tspan x="84" dy="28">seconds (a TTL cache keeps each result for a</tspan>
      <tspan x="84" dy="28">short lifetime);</tspan>
    </text>

    
    <text x="814" y="976" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="814" dy="0">• never let one failing target raise out of</tspan>
      <tspan x="834" dy="28">collect();</tspan>
      <tspan x="814" dy="28">• do not block on slow hardware, BMC queries</tspan>
      <tspan x="834" dy="28">can take seconds;</tspan>
      <tspan x="814" dy="28">• protect the endpoint: internal interface, TLS</tspan>
      <tspan x="834" dy="28">and basic auth through proxies, or a sidecar</tspan>
    </text>
  </g>

  
  <rect x="40" y="1142" width="1520" height="46" rx="8" fill="#207448" />
  <text x="800" y="1174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Let the scrape drive the collection</text>
</svg>