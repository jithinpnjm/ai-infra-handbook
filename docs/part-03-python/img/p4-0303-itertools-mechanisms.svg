<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Iterator Transformations: The groupby Consecutive Clustering Trap, pairwise Running Deltas, and batched Slices</title>
  <desc>Visual explanation of itertools groupby consecutive grouping trap and fix, pairwise sliding delta computation, and batched fixed-size chunking.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1500" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
      Iterator Transformations: The groupby Consecutive Clustering Trap,
    </text>
    <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
      pairwise Running Deltas, and batched Slices
    </text>
  </g>

  
  <g id="panel-1">
    <rect x="50" y="140" width="1500" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(80, 160)">
      <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="8" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="32" x2="40" y2="32" stroke="#207448" stroke-width="3" />
      <circle cx="14" cy="8" r="2.5" fill="#207448" />
      <circle cx="14" cy="24" r="2.5" fill="#207448" />
      <circle cx="14" cy="40" r="2.5" fill="#207448" />
    </g>

    
    <text x="145" y="188" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">The groupby Consecutive Gotcha</text>
    <text x="145" y="218" font-family="sans-serif" font-size="24" fill="#303a36">Stream of node objects with racks.</text>

    
    <g id="unsorted-path">
      <rect x="75" y="235" width="1450" height="235" rx="8" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5" />
      <text x="100" y="268" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Unsorted Failure</text>

      
      <rect x="100" y="285" width="760" height="44" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
      <text x="115" y="315" font-family="monospace" font-size="24" fill="#303a36">[Node(g1, rack=r2), Node(g2, rack=r1), Node(g3, rack=r2)]</text>

      
      <line x1="870" y1="307" x2="915" y2="307" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      
      <rect x="925" y="285" width="575" height="44" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="945" y="315" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">itertools.groupby(stream, key=rack)</text>

      
      <rect x="100" y="340" width="1400" height="115" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
      <text x="120" y="370" font-family="monospace" font-size="24" fill="#303a36">key 'r2' seen -&gt; yields group ('r2', ['g1'])</text>
      <text x="120" y="405" font-family="monospace" font-size="24" fill="#303a36">key switches to 'r1' -&gt; yields group ('r1', ['g2'])</text>
      <text x="120" y="440" font-family="monospace" font-size="24" fill="#db8129" font-weight="bold">key switches back to 'r2' -&gt; yields duplicate group ('r2', ['g3'])</text>
    </g>

    
    <rect x="75" y="480" width="1450" height="50" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2" />
    <text x="95" y="513" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      Failure: 3 fragmented groups because groupby only clusters adjacent runs like Unix uniq!
    </text>

    
    <g id="sorted-path">
      <rect x="75" y="540" width="1450" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="100" y="573" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Sorted Fix</text>

      <text x="100" y="612" font-family="monospace" font-size="24" fill="#303a36">
        Input sorted first by rack key -&gt; [Node(g2, rack=r1), Node(g1, rack=r2), Node(g3, rack=r2)]
      </text>

      <text x="100" y="662" font-family="sans-serif" font-size="24" fill="#303a36">
        Feeding into 'groupby' emits exactly 2 consolidated groups:
      </text>

      <rect x="780" y="632" width="480" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="800" y="662" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
        ('r1', ['g2']) and ('r2', ['g1', 'g3'])
      </text>
    </g>
  </g>

  
  <g id="panel-2">
    <rect x="50" y="740" width="1500" height="315" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(80, 760)">
      <rect x="0" y="6" width="30" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="18" y="6" width="30" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="2 2" />
      <path d="M 12 24 L 36 24" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    </g>

    
    <text x="145" y="792" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Sliding Deltas with pairwise</text>

    
    <rect x="75" y="815" width="1450" height="220" rx="8" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5" />

    
    <text x="105" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
      Input stream of monotonic counter samples: <tspan font-family="monospace" font-weight="bold" fill="#207448">[1000, 1050, 1120, 1190]</tspan>
    </text>

    
    <text x="105" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
      'pairwise()' sliding bracket shows overlapping pairs emitted:
    </text>
    <rect x="830" y="877" width="560" height="38" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
    <text x="845" y="904" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      (1000, 1050), (1050, 1120), (1120, 1190)
    </text>

    
    <rect x="105" y="935" width="1390" height="80" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
    <text x="125" y="968" font-family="sans-serif" font-size="24" fill="#303a36">
      List comprehension <tspan font-family="monospace" font-weight="bold" fill="#207448">'[b - a for a, b in pairwise(...)]'</tspan> computes rates:
    </text>
    <text x="125" y="1000" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      [50, 70, 70] <tspan font-family="sans-serif" font-weight="normal" fill="#303a36">with zero index bookkeeping and constant memory.</tspan>
    </text>
  </g>

  
  <g id="panel-3">
    <rect x="50" y="1075" width="1500" height="385" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(80, 1095)">
      <rect x="0" y="4" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="26" y="4" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="0" y="26" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="26" y="26" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="145" y="1127" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Stream Batching with batched</text>

    
    <rect x="75" y="1150" width="1450" height="290" rx="8" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5" />

    <text x="105" y="1185" font-family="sans-serif" font-size="24" fill="#303a36">
      Infinite generator stream of instance IDs passing through <tspan font-family="monospace" font-weight="bold" fill="#207448">'itertools.batched(stream, 100)'</tspan>.
    </text>
    <text x="105" y="1220" font-family="sans-serif" font-size="24" fill="#303a36">
      Chunks of up to 100 items are emitted as tuples:
    </text>

    
    <rect x="105" y="1235" width="1390" height="40" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
    <text x="125" y="1263" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      Batch 1 (ids 1..100) -&gt; 'client.bulk_delete(Batch 1)'
    </text>

    
    <rect x="105" y="1285" width="1390" height="40" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
    <text x="125" y="1313" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      Batch 2 (ids 101..200) -&gt; 'client.bulk_delete(Batch 2)'
    </text>

    
    <rect x="105" y="1335" width="1390" height="40" rx="6" fill="#f5f8f5" stroke="#c8d6cb" />
    <text x="125" y="1363" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      Batch 3 (remaining 50 ids) -&gt; 'client.bulk_delete(Batch 3)'
    </text>

    
    <text x="105" y="1415" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      respecting cloud API batch limits in O(1) space.
    </text>
  </g>
</svg>