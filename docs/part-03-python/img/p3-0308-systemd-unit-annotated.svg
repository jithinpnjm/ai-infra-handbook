<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" width="1600" height="1370">
  <title>The node agent systemd unit, line by line</title>
  <desc>Visual breakdown of systemd configuration for a robust node agent alongside Kubernetes alternatives and security best practices.</desc>

  
  <rect width="1600" height="1370" fill="#f5f8f5" />

  
  <text x="50" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">The node agent systemd unit, line by line</text>

  
  <g id="unit-file-panel">
    
    <rect x="40" y="90" width="980" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 110)">
      <circle cx="24" cy="24" r="16" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 24 2 L 24 8 M 24 40 L 24 46 M 2 24 L 8 24 M 40 24 L 46 24 M 8.5 8.5 L 12.7 12.7 M 35.3 35.3 L 39.5 39.5 M 8.5 39.5 L 12.7 35.3 M 35.3 12.7 L 39.5 8.5" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="125" y="144" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Annotated unit file, grouped.</text>

    
    <rect x="65" y="170" width="930" height="75" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="201" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">[Unit] After=network-online.target and Wants=network-online.target:</tspan>
      <tspan x="85" dy="30" font-family="sans-serif">start once the network is up</tspan>
    </text>

    
    <rect x="65" y="255" width="930" height="55" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="291" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">[Service] User=nodeagent:</tspan>
      <tspan font-family="sans-serif"> dedicated unprivileged user</tspan>
    </text>

    
    <rect x="65" y="320" width="930" height="75" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="351" font-family="monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">ExecStart=/opt/nodeagent/venv/bin/nodeagent</tspan>
      <tspan x="85" dy="30">--config /etc/nodeagent.toml</tspan>
    </text>

    
    <rect x="65" y="405" width="930" height="55" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="441" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">Restart=on-failure, RestartSec=5:</tspan>
      <tspan font-family="sans-serif"> restart on non-zero exit</tspan>
    </text>

    
    <rect x="65" y="470" width="930" height="55" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="506" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">TimeoutStopSec=30:</tspan>
      <tspan font-family="sans-serif"> the SIGTERM grace period</tspan>
    </text>

    
    <rect x="65" y="535" width="930" height="110" rx="8" fill="#fdf6ed" stroke="#db8129" stroke-width="3" />
    <text x="85" y="569" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold" fill="#db8129">MemoryMax=300M and CPUQuota=20%:</tspan>
      <tspan x="85" dy="32" font-family="sans-serif">the agent never competes with a training job</tspan>
      <tspan x="85" dy="30" font-family="sans-serif">for memory or CPU</tspan>
    </text>

    
    <rect x="65" y="655" width="930" height="110" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="688" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">NoNewPrivileges=yes, ProtectSystem=strict,</tspan>
      <tspan x="85" dy="30" font-family="monospace, monospace" font-weight="bold">ReadWritePaths=/var/lib/nodeagent:</tspan>
      <tspan x="85" dy="30" font-family="sans-serif">only its state directory is writable</tspan>
    </text>

    
    <rect x="65" y="775" width="930" height="55" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="811" font-size="24" fill="#303a36">
      <tspan font-family="monospace, monospace" font-weight="bold">Environment=PYTHONUNBUFFERED=1:</tspan>
      <tspan font-family="sans-serif"> logs appear immediately</tspan>
    </text>

    
    <rect x="65" y="840" width="930" height="55" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
    <text x="85" y="876" font-family="monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">[Install] WantedBy=multi-user.target</text>
  </g>

  
  <g id="kubernetes-panel">
    <rect x="1050" y="90" width="510" height="540" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1075, 110)">
      <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <polygon points="24,10 36,31 12,31" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    <text x="1075" y="195" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1075" dy="0" font-size="28" font-weight="bold" fill="#207448">Kubernetes instead:</tspan>
      <tspan x="1075" dy="42">DaemonSet (one copy on every node);</tspan>
      <tspan x="1075" dy="38">hostPID or hostNetwork only when</tspan>
      <tspan x="1075" dy="34">truly needed;</tspan>
      <tspan x="1075" dy="38">tolerations for every node including</tspan>
      <tspan x="1075" dy="34">tainted GPU nodes;</tspan>
      <tspan x="1075" dy="38">mount /sys and /dev read-only</tspan>
      <tspan x="1075" dy="34">where possible;</tspan>
      <tspan x="1075" dy="38">Downward API for the node name</tspan>
    </text>
  </g>

  
  <g id="resource-panel">
    <rect x="1050" y="650" width="510" height="360" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1075, 680)">
      <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="26" y1="2" x2="26" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="36" y1="2" x2="36" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="44" x2="16" y2="50" stroke="#207448" stroke-width="3" />
      <line x1="26" y1="44" x2="26" y2="50" stroke="#207448" stroke-width="3" />
      <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="26" x2="8" y2="26" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3" />
      <line x1="44" y1="16" x2="50" y2="16" stroke="#207448" stroke-width="3" />
      <line x1="44" y1="26" x2="50" y2="26" stroke="#207448" stroke-width="3" />
      <line x1="44" y1="36" x2="50" y2="36" stroke="#207448" stroke-width="3" />
    </g>

    <text x="1075" y="775" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1075" dy="0" font-weight="bold">CPUQuota, MemoryMax and Nice;</tspan>
      <tspan x="1075" dy="40">pin or limit threads</tspan>
    </text>
  </g>

  
  <g id="security-strip">
    <rect x="40" y="1030" width="1520" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(65, 1055)">
      <path d="M 24 4 L 44 12 C 44 30 24 44 24 44 C 24 44 4 30 4 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="24" cy="20" r="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 24 24 L 24 32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="135" y="1080" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">dedicated unprivileged user, only needed capabilities, narrow sudo rule or small helper for privileged actions,</tspan>
      <tspan x="135" dy="38">per-node credentials such as mTLS or short-lived tokens, validate every command received:</tspan>
      <tspan x="135" dy="38" font-weight="bold">an agent that runs arbitrary remote commands is a route to fleet-wide compromise</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1250" width="1520" height="75" rx="12" fill="#207448" />
    <text x="800" y="1297" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">If it goes wrong on every host, who notices and how?</text>
  </g>
</svg>