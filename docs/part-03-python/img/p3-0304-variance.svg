<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Invariant, covariant and contravariant generics, with the bin and the dispenser</title>
  <desc>Infographic explaining Python generics variance: invariant, covariant, contravariant, callable variance, and type bounds with dispenser and trash can models.</desc>

  <rect width="1600" height="1360" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Invariant, covariant and contravariant generics, with the bin and the dispenser
  </text>

  

  
  <g id="col-invariant">
    <rect x="50" y="115" width="470" height="520" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4"/>
    <rect x="50" y="115" width="470" height="120" rx="16" fill="#fdf0e2"/>
    <rect x="50" y="215" width="470" height="20" fill="#fdf0e2"/>

    
    <g transform="translate(75, 142)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="20" width="46" height="34" rx="5" fill="#fffaf5"/>
      <path d="M19 20 V12 A10 10 0 0 1 39 12 V20"/>
      <circle cx="29" cy="37" r="4" fill="#db8129"/>
    </g>

    <text x="145" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      Invariant:
    </text>
    <text x="145" y="196" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#303a36">
      T = TypeVar(T)
    </text>

    
    <rect x="70" y="255" width="430" height="110" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="90" y="300" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#db8129">
      list[Dog] cannot be used
    </text>
    <text x="90" y="335" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#db8129">
      as list[Animal]
    </text>

    <rect x="70" y="385" width="430" height="225" rx="10" fill="#ffffff" stroke="#e0d0c0" stroke-width="1.5"/>
    <text x="90" y="425" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">because a caller could append</tspan>
      <tspan x="90" dy="38">a Cat to a mutable</tspan>
      <tspan x="90" dy="38" font-family="'Courier New', Courier, monospace" font-weight="bold">list[Animal]</tspan>
      <tspan x="90" dy="42" fill="#756050" font-size="24">(both reading and writing)</tspan>
    </text>
  </g>

  
  <g id="col-covariant">
    <rect x="565" y="115" width="470" height="520" rx="16" fill="#fbfdfb" stroke="#207448" stroke-width="3"/>
    <rect x="565" y="115" width="470" height="120" rx="16" fill="#e8f1ea"/>
    <rect x="565" y="215" width="470" height="20" fill="#e8f1ea"/>

    
    <g transform="translate(585, 138)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="38" height="42" rx="4" fill="#fbfdfb"/>
      <path d="M16 16 H38 M16 26 H38"/>
      <path d="M27 48 V58 M21 58 H33"/>
      <circle cx="27" cy="65" r="2.5" fill="#207448"/>
    </g>

    <text x="655" y="156" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="bold" fill="#207448">
      Covariant:
    </text>
    <text x="655" y="196" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#303a36">
      T_co = TypeVar(
    </text>
    <text x="655" y="224" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#303a36">
      &#160;&#160;T_co, covariant=True)
    </text>

    
    <rect x="585" y="255" width="430" height="145" rx="10" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="605" y="292" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="605" dy="0" font-weight="bold" fill="#207448">read-only producers:</tspan>
      <tspan x="605" dy="35" font-family="'Courier New', Courier, monospace">Sequence[T_co],</tspan>
      <tspan x="605" dy="33" font-family="'Courier New', Courier, monospace">Iterator[T_co],</tspan>
      <tspan x="605" dy="33" font-family="'Courier New', Courier, monospace">BeverageDispenser[T_co]</tspan>
    </text>

    <rect x="585" y="415" width="430" height="195" rx="10" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="605" y="450" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="605" dy="0" font-weight="bold" fill="#207448">varies in the same direction:</tspan>
      <tspan x="605" dy="36" font-family="'Courier New', Courier, monospace">BeverageDispenser[OrangeJuice]</tspan>
      <tspan x="605" dy="34">is a subtype of</tspan>
      <tspan x="605" dy="36" font-family="'Courier New', Courier, monospace">BeverageDispenser[Juice]</tspan>
    </text>
  </g>

  
  <g id="col-contravariant">
    <rect x="1080" y="115" width="470" height="520" rx="16" fill="#fbfdfb" stroke="#207448" stroke-width="3"/>
    <rect x="1080" y="115" width="470" height="120" rx="16" fill="#e8f1ea"/>
    <rect x="1080" y="215" width="470" height="20" fill="#e8f1ea"/>

    
    <g transform="translate(1098, 140)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 18 H46 M23 18 V11 H35 V18"/>
      <path d="M16 18 L20 54 H38 L42 18" fill="#fbfdfb"/>
      <path d="M25 26 V46 M33 26 V46"/>
    </g>

    <text x="1165" y="156" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="bold" fill="#207448">
      Contravariant:
    </text>
    <text x="1165" y="196" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#303a36">
      T_contra = TypeVar(
    </text>
    <text x="1165" y="224" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="bold" fill="#303a36">
      &#160;&#160;T_contra, contravariant=True)
    </text>

    
    <rect x="1100" y="255" width="430" height="110" rx="10" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="1120" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0" font-weight="bold" fill="#207448">write-only consumers:</tspan>
      <tspan x="1120" dy="38" font-family="'Courier New', Courier, monospace">TrashCan[T_contra]</tspan>
    </text>

    <rect x="1100" y="380" width="430" height="230" rx="10" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="1120" y="415" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0" font-weight="bold" fill="#207448">varies in the opposite direction:</tspan>
      <tspan x="1120" dy="34" font-family="'Courier New', Courier, monospace">TrashCan[Refuse]</tspan>
      <tspan x="1120" dy="30">is a subtype of</tspan>
      <tspan x="1120" dy="34" font-family="'Courier New', Courier, monospace">TrashCan[Biodegradable],</tspan>
      <tspan x="1120" dy="30">because a general refuse bin can</tspan>
      <tspan x="1120" dy="30">safely accept biodegradable trash</tspan>
    </text>
  </g>

  
  <g id="callable-strip">
    <rect x="50" y="660" width="1500" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(75, 685)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="44" height="40" rx="6" fill="#ffffff"/>
      <path d="M18 30 H42 M34 22 L42 30 L34 38"/>
    </g>

    <text x="145" y="718" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      Callable Variance Rules
    </text>

    <rect x="75" y="745" width="1450" height="120" rx="10" fill="#ffffff" stroke="#c0d8c8" stroke-width="1"/>
    
    <text x="95" y="780" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">
        <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">Callable[[int, str], bool]</tspan> is contravariant in its argument types and covariant in its return type;
      </tspan>
      <tspan x="95" dy="36">
        <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">Callable[[float], None]</tspan> is a subtype of <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">Callable[[int], None]</tspan>: a callback that handles any float can safely handle an int;
      </tspan>
      <tspan x="95" dy="36">
        the reverse does not hold; for keyword or variadic arguments define a Protocol with <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">__call__</tspan>
      </tspan>
    </text>
  </g>

  
  <g id="bounds-strip">
    <rect x="50" y="910" width="1500" height="305" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <rect x="70" y="930" width="600" height="265" rx="12" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="90" y="968" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">LT = TypeVar(LT, bound=SupportsLessThan)</tspan>
      <tspan x="90" dy="38">with <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">class SupportsLessThan(Protocol):</tspan></tspan>
      <tspan x="110" dy="38" font-family="'Courier New', Courier, monospace">def __lt__(self, other: Any) -&gt; bool;</tspan>
      <tspan x="90" dy="48" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">top(series: Iterable[LT], length: int)</tspan>
      <tspan x="110" dy="34" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">&#160;&#160;-&gt; list[LT]</tspan>
    </text>

    
    <rect x="690" y="930" width="410" height="265" rx="12" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="710" y="968" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="710" dy="0" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">NumberT = TypeVar(</tspan>
      <tspan x="730" dy="36" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">NumberT,</tspan>
      <tspan x="730" dy="34" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">float, Decimal,</tspan>
      <tspan x="730" dy="34" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">Fraction)</tspan>
      <tspan x="710" dy="46">limits <tspan font-family="'Courier New', Courier, monospace" font-weight="bold">mode()</tspan> to those</tspan>
      <tspan x="710" dy="34">three types</tspan>
    </text>

    
    <rect x="1120" y="930" width="410" height="265" rx="12" fill="#ffffff" stroke="#c0d8c8" stroke-width="1.5"/>
    <text x="1140" y="972" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1140" dy="0" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">LottoBlower[int](</tspan>
      <tspan x="1160" dy="36" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">range(1, 11));</tspan>
      <tspan x="1140" dy="54">Python 3.12 shorter syntax</tspan>
      <tspan x="1140" dy="44" font-family="'Courier New', Courier, monospace" font-weight="bold" fill="#207448">class Stack[T]:</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1240" width="1500" height="70" rx="14" fill="#207448"/>
    <text x="800" y="1285" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Producers vary with T, consumers vary against it
    </text>
  </g>
</svg>