<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How counter += 1 loses an update, and what the lock changes</title>
  <desc>Visual explanation of race conditions during concurrent counter increments without a lock leading to lost updates versus serialized execution using a threading Lock.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <!-- ==================== TITLE & SUBTITLE ==================== -->
  <text x="800" y="46" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">How counter += 1 loses an update, </tspan>
    <tspan x="800" dy="52">and what the lock changes</tspan>
  </text>
  <text x="800" y="132" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Two thread lanes and a shared variable counter</text>

  <!-- ==================== TOP PANEL: WITHOUT LOCK ==================== -->
  <rect x="40" y="152" width="1520" height="312" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  <!-- Without lock Header: Unlocked Icon + Title + Note -->
  <g transform="translate(60, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="18" width="36" height="26" rx="4"/>
    <path d="M 14 18 V 10 A 8 8 0 0 1 30 10 V 14"/>
    <circle cx="22" cy="31" r="3" fill="#207448"/>
  </g>
  <text x="115" y="188" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Without lock</text>
  <text x="330" y="188" font-family="sans-serif" font-size="24" fill="#303a36">the steps of counter += 1 are &apos;load, add, store&apos;</text>

  <!-- Swimlane Headers in Without lock -->
  <!-- Thread A Header -->
  <rect x="140" y="204" width="240" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="260" y="233" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Thread A</text>
  <line x1="260" y1="244" x2="260" y2="408" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- counter Header -->
  <rect x="700" y="204" width="200" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="233" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">counter</text>
  <line x1="800" y1="244" x2="800" y2="408" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Thread B Header -->
  <rect x="1220" y="204" width="240" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1340" y="233" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Thread B</text>
  <line x1="1340" y1="244" x2="1340" y2="408" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Step 1: Thread A loads counter = 5 (counter -> Thread A) -->
  <line x1="785" y1="272" x2="275" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="530" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Thread A loads counter = 5</text>

  <!-- Step 2: thread B loads counter = 5 (counter -> Thread B) -->
  <line x1="815" y1="310" x2="1325" y2="310" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1070" y="302" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">thread B loads counter = 5</text>

  <!-- Step 3: A adds and stores 6 (Thread A -> counter) -->
  <line x1="275" y1="348" x2="785" y2="348" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="530" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">A adds and stores 6</text>

  <!-- Step 4: B adds and stores 6 (Thread B -> counter) -->
  <line x1="1325" y1="386" x2="815" y2="386" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1070" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">B adds and stores 6</text>

  <!-- Result Box & Lost Update Badge -->
  <rect x="140" y="414" width="940" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="610" y="442" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">final counter is 6 where two increments should give 7</text>

  <rect x="1110" y="414" width="350" height="40" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2.5"/>
  <text x="1285" y="442" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">one update lost</text>

  <!-- ==================== BOTTOM PANEL: WITH LOCK ==================== -->
  <rect x="40" y="474" width="1520" height="252" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  <!-- With lock Header: Locked Icon + Title + Note -->
  <g transform="translate(60, 482)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="18" width="36" height="26" rx="4"/>
    <path d="M 12 18 V 10 A 10 10 0 0 1 32 10 V 18"/>
    <circle cx="22" cy="31" r="3" fill="#207448"/>
  </g>
  <text x="115" y="510" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">With lock</text>
  <text x="290" y="510" font-family="sans-serif" font-size="24" fill="#303a36">&apos;with lock:&apos; makes load, add and store one protected unit</text>

  <!-- Swimlane Lifelines in With lock -->
  <line x1="260" y1="528" x2="260" y2="714" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="800" y1="528" x2="800" y2="714" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1340" y1="528" x2="1340" y2="714" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Event 1: A holds the lock, B waits -->
  <rect x="140" y="534" width="1320" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="563" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">A holds the lock, B waits</text>

  <!-- Step 2: A stores 6 (Thread A -> counter) -->
  <line x1="275" y1="616" x2="785" y2="616" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="530" y="606" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">A stores 6</text>

  <!-- Step 3: B then loads 6 and stores 7 (Thread B -> counter) -->
  <line x1="1325" y1="678" x2="815" y2="678" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1070" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">B then loads 6 and stores 7</text>

  <!-- ==================== CODE STRIP ==================== -->
  <rect x="40" y="738" width="1520" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(60, 748)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="14,10 6,18 14,26"/>
    <polyline points="26,10 34,18 26,26"/>
    <line x1="22" y1="6" x2="18" y2="30"/>
  </g>
  <text x="115" y="774" font-family="monospace" font-size="24" fill="#303a36">lock = threading.Lock(); def incr(n): global counter; for _ in range(n): with lock: counter += 1</text>

  <!-- ==================== RELATED BUGS STRIP ==================== -->
  <rect x="40" y="804" width="1520" height="154" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(60, 814)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="20" cy="22" rx="12" ry="15"/>
    <path d="M 12 10 L 4 4 M 28 10 L 36 4 M 8 20 L 0 20 M 32 20 L 40 20 M 10 32 L 2 38 M 30 32 L 38 38"/>
    <line x1="20" y1="12" x2="20" y2="30"/>
  </g>
  <!-- Col 1 bugs (wrapped for generous padding) -->
  <text x="115" y="834" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">data race: loses updates </tspan>
    <tspan x="115" dy="25">or breaks an invariant</tspan>
  </text>
  <text x="115" y="888" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">deadlock: two threads each hold </tspan>
    <tspan x="115" dy="25">a lock the other needs</tspan>
  </text>
  <text x="115" y="942" font-family="sans-serif" font-size="24" fill="#303a36">livelock: keep reacting without progress</text>
  <!-- Col 2 bugs -->
  <text x="820" y="834" font-family="sans-serif" font-size="24" fill="#303a36">starvation: a thread never gets its turn</text>
  <text x="820" y="888" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="820" dy="0">priority inversion: a low-priority task </tspan>
    <tspan x="820" dy="25">holds a lock a high-priority task needs</tspan>
  </text>

  <!-- ==================== HABITS STRIP ==================== -->
  <rect x="40" y="968" width="1520" height="148" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(60, 978)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 12 L 20 6 L 34 12 V 22 C 34 31 20 38 20 38 C 20 38 6 31 6 22 Z"/>
    <polyline points="13,21 18,26 27,17"/>
  </g>
  <!-- Col 1 habits (wrapped for generous padding) -->
  <text x="115" y="1002" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">keep critical sections tiny </tspan>
    <tspan x="115" dy="26">and free of I/O</tspan>
  </text>
  <text x="115" y="1062" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">never call unknown callbacks </tspan>
    <tspan x="115" dy="26">while holding a lock</tspan>
  </text>
  <!-- Col 2 habits -->
  <text x="820" y="1014" font-family="sans-serif" font-size="24" fill="#303a36">prefer queues and immutable messages</text>
  <text x="820" y="1074" font-family="sans-serif" font-size="24" fill="#303a36">test with stress loops</text>

  <!-- ==================== BOTTOM TAKEAWAY BAR ==================== -->
  <rect x="40" y="1126" width="1520" height="52" rx="10" fill="#207448"/>
  <text x="800" y="1161" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Without the lock, the steps interleave</text>
</svg>