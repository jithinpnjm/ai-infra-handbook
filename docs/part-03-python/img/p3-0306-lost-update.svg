<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>How counter += 1 loses an update, and what the lock changes</title>
  <desc>Visual comparison of thread interleaving without a lock leading to a lost update versus synchronized execution with a lock, along with related concurrency bugs and best habits.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#303a36" />
    </marker>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5" />

  
  <g transform="translate(60, 52)">
    <rect x="-10" y="-8" width="6" height="42" fill="#207448" rx="3" />
    <text x="12" y="28" font-family="sans-serif" font-size="40" font-weight="bold" fill="#303a36">
      How counter += 1 loses an update, and what the lock changes
    </text>
  </g>

  
  <g transform="translate(40, 95)">
    
    <rect width="1520" height="425" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5" />

    
    <g transform="translate(30, 20)">
      <rect x="0" y="16" width="40" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 16 V 10 A 10 10 0 0 1 30 10 V 4" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="85" y="40" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Without lock</text>
    <text x="310" y="40" font-family="sans-serif" font-size="24" fill="#303a36">the steps of counter += 1 are 'load, add, store'</text>

    
    
    <rect x="130" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="240" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Thread A</text>

    
    <rect x="650" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="760" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">counter</text>

    
    <rect x="1170" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="1280" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Thread B</text>

    
    <line x1="240" y1="125" x2="240" y2="350" stroke="#a2b9a7" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="760" y1="125" x2="760" y2="350" stroke="#207448" stroke-width="4" />
    <line x1="1280" y1="125" x2="1280" y2="350" stroke="#a2b9a7" stroke-width="3" stroke-dasharray="6,6" />

    
    <path d="M 750 160 L 255 160" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="340" y="138" width="330" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="505" y="165" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Thread A loads counter = 5</text>

    
    <path d="M 770 205 L 1265 205" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="850" y="183" width="330" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1015" y="210" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">thread B loads counter = 5</text>

    
    <path d="M 245 255 L 745 255" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-slate)" />
    <rect x="360" y="233" width="280" height="38" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="1.5" />
    <text x="500" y="260" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">A adds and stores 6</text>

    
    <path d="M 1275 300 L 775 300" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-slate)" />
    <rect x="880" y="278" width="280" height="38" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="1.5" />
    <text x="1020" y="305" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">B adds and stores 6</text>

    
    <rect x="220" y="360" width="760" height="46" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="1.5" />
    <text x="600" y="392" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      final counter is 6 where two increments should give 7
    </text>

    
    <rect x="1010" y="360" width="280" height="46" rx="8" fill="#db8129" />
    <text x="1150" y="392" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      one update lost
    </text>
  </g>

  
  <g transform="translate(40, 540)">
    
    <rect width="1520" height="385" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5" />

    
    <g transform="translate(30, 20)">
      <rect x="0" y="16" width="40" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 16 V 10 A 10 10 0 0 1 30 10 V 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="85" y="40" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">With lock</text>
    <text x="250" y="40" font-family="sans-serif" font-size="24" fill="#303a36">'with lock:' makes load, add and store one protected unit</text>

    
    
    <rect x="130" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="240" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Thread A</text>

    
    <rect x="650" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="760" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">counter</text>

    
    <rect x="1170" y="72" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    <text x="1280" y="103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Thread B</text>

    
    <line x1="240" y1="125" x2="240" y2="350" stroke="#a2b9a7" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="760" y1="125" x2="760" y2="350" stroke="#207448" stroke-width="4" />
    <line x1="1280" y1="125" x2="1280" y2="350" stroke="#a2b9a7" stroke-width="3" stroke-dasharray="6,6" />

    
    <rect x="190" y="145" width="460" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="5,5" />
    
    
    <rect x="675" y="150" width="370" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="860" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">A holds the lock, B waits</text>

    
    <path d="M 245 220 L 745 220" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="360" y="198" width="240" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="480" y="225" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">A stores 6</text>

    
    <rect x="850" y="270" width="460" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 1275 315 L 775 315" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="870" y="295" width="380" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1060" y="323" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">B then loads 6 and stores 7</text>
  </g>

  
  <g transform="translate(40, 945)">
    <rect width="1520" height="74" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
    
    <circle cx="36" cy="37" r="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 33 32 L 39 37 L 33 42" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <text x="65" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      lock = threading.Lock(); def incr(n): global counter; for _ in range(n): with lock: counter += 1
    </text>
  </g>

  
  <g transform="translate(40, 1038)">
    <rect width="1520" height="212" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5" />

    
    <g transform="translate(25, 20)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 20 6 V 0 M 20 40 V 34 M 6 20 H 0 M 40 20 H 34 M 10 10 L 5 5 M 35 35 L 30 30 M 10 30 L 5 35 M 35 10 L 30 15" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="75" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Related bugs</text>

    
    <rect x="25" y="70" width="725" height="40" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="45" y="98" font-family="sans-serif" font-size="24" fill="#303a36">
      data race: loses updates or breaks an invariant
    </text>

    
    <rect x="770" y="70" width="725" height="40" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="790" y="98" font-family="sans-serif" font-size="24" fill="#303a36">
      deadlock: two threads each hold a lock the other needs
    </text>

    
    <rect x="25" y="118" width="725" height="40" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="45" y="146" font-family="sans-serif" font-size="24" fill="#303a36">
      livelock: keep reacting without progress
    </text>

    
    <rect x="770" y="118" width="725" height="40" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="790" y="146" font-family="sans-serif" font-size="24" fill="#303a36">
      starvation: a thread never gets its turn
    </text>

    
    <rect x="25" y="165" width="1470" height="38" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="45" y="192" font-family="sans-serif" font-size="24" fill="#303a36">
      priority inversion: a low-priority task holds a lock a high-priority task needs
    </text>
  </g>

  
  <g transform="translate(40, 1265)">
    <rect width="1520" height="142" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5" />

    
    <g transform="translate(25, 16)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="75" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Habits</text>

    
    <rect x="25" y="56" width="725" height="38" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="45" y="83" font-family="sans-serif" font-size="24" fill="#303a36">
      keep critical sections tiny and free of I/O
    </text>

    <rect x="770" y="56" width="725" height="38" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="790" y="83" font-family="sans-serif" font-size="24" fill="#303a36">
      never call unknown callbacks while holding a lock
    </text>

    
    <rect x="25" y="98" width="725" height="36" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="45" y="124" font-family="sans-serif" font-size="24" fill="#303a36">
      prefer queues and immutable messages
    </text>

    <rect x="770" y="98" width="725" height="36" rx="8" fill="#ffffff" stroke="#ccd9cf" stroke-width="1" />
    <text x="790" y="124" font-family="sans-serif" font-size="24" fill="#303a36">
      test with stress loops
    </text>
  </g>

  
  <g transform="translate(40, 1422)">
    <rect width="1520" height="58" rx="10" fill="#207448" />
    <text x="760" y="38" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Without the lock, the steps interleave
    </text>
  </g>

</svg>