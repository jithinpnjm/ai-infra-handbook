<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From a dict record to a Person class: what each step adds</title>
  <desc>A four-step staircase illustrating the progression from a Python dictionary record to a complete Person class with constructor and methods, alongside an under-the-hood panel on namespace dictionaries.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">From a dict record to a Person class: what each step adds</text>

  
  <path d="M 70 165 L 70 890" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
  <path d="M 70 635 L 70 890" fill="none" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>

  
  
  <circle cx="70" cy="165" r="24" fill="#207448"/>
  <text x="70" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <rect x="115" y="115" width="775" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="140" y="132" width="46" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <path d="M 158 143 c -3 0 -5 2 -5 5 c 0 3 -2 5 -5 5 c 3 0 5 2 5 5 c 0 3 2 5 5 5" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 168 143 c 3 0 5 2 5 5 c 0 3 2 5 5 5 c -3 0 -5 2 -5 5 c 0 3 -2 5 -5 5" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="202" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">dict record:</text>
  
  <text x="140" y="215" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec = {}; rec[name] = Pat; rec[age] = 40.5;</text>
  <text x="140" y="250" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec[jobs] = [dev, mgr];</text>
  <text x="140" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">holds data, no room for logic</text>

  
  
  <circle cx="70" cy="405" r="24" fill="#207448"/>
  <text x="70" y="413" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <rect x="115" y="355" width="775" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="140" y="372" width="46" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <line x1="140" y1="386" x2="186" y2="386" stroke="#207448" stroke-width="2.5"/>
  <circle cx="149" cy="379" r="2" fill="#207448"/>
  <circle cx="156" cy="379" r="2" fill="#207448"/>
  <rect x="149" y="394" width="28" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2"/>
  
  <text x="202" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">class as namespace:</text>
  
  <text x="140" y="458" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">class rec: pass; rec.name = Pat;</text>
  <text x="140" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">less syntax, but a new class for every distinct record</text>

  
  
  <circle cx="70" cy="635" r="24" fill="#207448"/>
  <text x="70" y="643" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <rect x="115" y="585" width="775" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="140" y="602" width="28" height="34" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
  <rect x="154" y="612" width="28" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <circle cx="168" cy="623" r="3.5" fill="none" stroke="#207448" stroke-width="2"/>
  
  <text x="202" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">instances of an empty class:</text>
  
  <text x="140" y="682" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">pers1 = rec(); pers1.name = Bob;</text>
  <text x="140" y="718" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">pers2 = rec(); pers2.name = Sue;</text>
  <text x="140" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the two records do not need the same names,</text>
  <text x="140" y="794" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">only pers1 has an age</text>

  
  
  <circle cx="70" cy="890" r="24" fill="#db8129"/>
  <text x="70" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <rect x="115" y="840" width="775" height="255" rx="12" fill="#fffcf9" stroke="#db8129" stroke-width="3"/>
  
  <circle cx="163" cy="873" r="14" fill="none" stroke="#db8129" stroke-width="3"/>
  <circle cx="163" cy="873" r="6" fill="none" stroke="#db8129" stroke-width="2.5"/>
  <path d="M 163 854 v 5 M 163 887 v 5 M 144 873 h 5 M 177 873 h 5 M 150 860 l 3.5 3.5 M 172.5 882.5 l 3.5 3.5 M 150 886 l 3.5 -3.5 M 172.5 863.5 l 3.5 -3.5" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  
  <text x="202" y="885" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">class with constructor and methods:</text>
  
  <text x="140" y="930" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Person.__init__(self, name, jobs, age=None);</text>
  <text x="140" y="965" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">info() returns (self.name, self.jobs);</text>
  <text x="140" y="1000" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec1 = Person(Bob, [dev, mgr], 40.5);</text>
  <text x="140" y="1035" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec2 = Person(Sue, [dev, cto]);</text>
  <text x="140" y="1075" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">every record consistent, with processing logic</text>

  
  <rect x="920" y="115" width="640" height="980" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="945" y="140" width="48" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <circle cx="965" cy="160" r="10" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="973" y1="168" x2="983" y2="178" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <text x="1008" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Under the hood:</text>
  <text x="1008" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">namespaces are dictionaries</text>

  
  <rect x="940" y="220" width="600" height="135" rx="10" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="960" y="258" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec.__dict__ holds name and age (class);</text>
  <text x="960" y="293" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">x.__dict__ is {name: Sue};</text>
  <text x="960" y="328" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">y.__dict__ is []</text>

  
  <rect x="940" y="375" width="600" height="205" rx="10" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="960" y="412" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">x.age finds 40 by inheritance, but</text>
  <text x="960" y="447" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">x.__dict__[age] raises KeyError:</text>
  <text x="960" y="487" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">indexing sees only what the object</text>
  <text x="960" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">holds directly, dot notation runs</text>
  <text x="960" y="557" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the inheritance search</text>

  
  <rect x="940" y="600" width="600" height="100" rx="10" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="960" y="642" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">dir(x) collects inherited names too:</text>
  <text x="960" y="677" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">[age, name]</text>

  
  <rect x="940" y="720" width="600" height="100" rx="10" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="960" y="760" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">x.__class__ is the class rec,</text>
  <text x="960" y="795" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec.__bases__ is (object,)</text>

  
  <rect x="940" y="840" width="600" height="175" rx="10" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="960" y="880" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec.method = uppername makes a plain</text>
  <text x="960" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">function a method: </text>
  <text x="1190" y="918" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">x.method() and</text>
  <text x="960" y="955" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">rec.method(x) both return SUE</text>

  
  <rect x="40" y="1115" width="1520" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1157" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">When an attribute surprises you, ask which namespace holds it</text>
</svg>