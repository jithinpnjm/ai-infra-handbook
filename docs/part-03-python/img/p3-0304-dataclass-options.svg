<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GpuNode as a frozen dataclass: options and the three quiet pitfalls</title>
  <desc>Visual infographic explaining Python dataclass configuration options, field typing, validation rules, mutable defaults, and quiet pitfalls.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">GpuNode as a frozen dataclass:</text>
  <text x="40" y="116" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">options and the three quiet pitfalls</text>

  
  <g id="decorator-section">
    <rect x="40" y="125" width="1520" height="225" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="76" cy="155" r="12" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M76 137 v5 M76 168 v5 M58 155 h5 M89 155 h5 M63 142 l4 4 M85 164 l4 4 M63 168 l4-4 M85 146 l4-4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <text x="115" y="163" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">@dataclass(order=True, frozen=True, slots=True, kw_only=True)</text>

    
    <rect x="56" y="186" width="440" height="60" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="76" y="224" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">slots=True (3.10+)</text>

    <rect x="512" y="186" width="1032" height="60" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="532" y="224" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">order=True: </tspan>sorted([n2, n]) compares by field order
    </text>

    
    <rect x="56" y="254" width="440" height="84" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="76" y="280" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="76" dy="0" font-weight="bold">kw_only=True: </tspan><tspan>helps when</tspan>
      <tspan x="76" dy="26">a non-default field would</tspan>
      <tspan x="76" dy="26">follow a default one</tspan>
    </text>

    <rect x="512" y="254" width="1032" height="84" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="532" y="288" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="532" dy="0"><tspan font-weight="bold">frozen=True: </tspan>instances immutable and hashable together with eq;</tspan>
      <tspan x="532" dy="30">use replace(n, gpus=4) for a modified copy</tspan>
    </text>
  </g>

  
  <g id="fields-and-validation-section">
    
    <rect x="40" y="365" width="1520" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="62" y="389" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="69" y="396" width="14" height="14" fill="#207448" opacity="0.25"/>
    <path d="M68 383 v6 M76 383 v6 M84 383 v6 M68 417 v6 M76 417 v6 M84 417 v6 M56 395 h6 M56 403 h6 M56 411 h6 M90 395 h6 M90 403 h6 M90 411 h6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="115" y="399" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">name: str, rack: str, gpus: int = 8, tags: tuple[str, ...] = (),</text>
    <text x="115" y="429" font-family="sans-serif" font-size="24" fill="#303a36">MAX_GPUS: ClassVar[int] = 16 (class variable, not a field)</text>

    
    <rect x="40" y="455" width="670" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M76 480 l16 6 v14 c0 12 -16 20 -16 20 c0 0 -16 -8 -16 -20 v-14 z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M70 500 l5 5 l9 -9" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="495" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0" font-weight="bold" fill="#207448">__post_init__ validation:</tspan>
      <tspan x="115" dy="32">0 &lt; gpus &lt;= MAX_GPUS else</tspan>
      <tspan x="115" dy="32">ValueError(gpus out of range)</tspan>
    </text>

    
    <rect x="730" y="455" width="830" height="145" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    
    <path d="M775 480 l20 34 h-40 z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="775" y1="493" x2="775" y2="503" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="775" cy="509" r="2" fill="#db8129"/>
    
    <text x="815" y="488" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="815" dy="0" font-weight="bold">Cluster: nodes: list[GpuNode] = field(default_factory=list),</tspan>
      <tspan x="815" dy="28">meta: dict = field(default_factory=dict);</tspan>
      <tspan x="815" dy="28" font-weight="bold" fill="#db8129">NEVER default=[] because dataclasses</tspan>
      <tspan x="815" dy="28" font-weight="bold" fill="#db8129">reject mutable defaults</tspan>
    </text>
  </g>

  
  <g id="extras-and-classvar-section">
    
    <rect x="40" y="615" width="1520" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M66 645 h8 a4 4 0 0 1 8 0 h8 v8 a4 4 0 0 1 0 8 v8 h-24 z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <text x="115" y="648" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="115" dy="0" fill="#207448">field(default_factory, repr=False, compare=False, init=False, metadata={...}),</tspan>
      <tspan x="115" dy="28">InitVar for init-only parameters, dataclasses.fields(obj), asdict(n) recursive for JSON</tspan>
    </text>

    
    <rect x="40" y="710" width="1520" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="62" y="744" width="28" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="76" cy="755" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M68 770 c0 -4 4 -6 8 -6 s8 2 8 6" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="115" y="742" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0" font-weight="bold">HackerClubMember: all_handles: ClassVar[set[str]] = set() is not turned into an instance field;</tspan>
      <tspan x="115" dy="30">__post_init__ fills self.handle = self.name.split()[0] when empty</tspan>
      <tspan x="115" dy="28">and raises ValueError if the handle is already in cls.all_handles</tspan>
    </text>
  </g>

  
  <g id="pitfalls-section">
    <rect x="40" y="830" width="1520" height="280" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="56" y="842" width="1488" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <path d="M88 864 l14 26 h-28 z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="88" y1="874" x2="88" y2="880" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="88" cy="885" r="1.5" fill="#207448"/>
    <text x="125" y="873" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0" font-weight="bold">annotations are not enforced: </tspan><tspan>GpuNode(name=5) succeeds,</tspan>
      <tspan x="125" dy="28">validate in __post_init__ or use pydantic at the boundaries</tspan>
    </text>

    
    <rect x="56" y="928" width="1488" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="76" y="961" width="24" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M81 961 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="88" cy="970" r="2" fill="#207448"/>
    <text x="125" y="959" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0" font-weight="bold">a frozen dataclass is only shallowly immutable: </tspan><tspan>a list inside can still change,</tspan>
      <tspan x="125" dy="28">use tuples or frozensets</tspan>
    </text>

    
    <rect x="56" y="1014" width="1488" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <line x1="88" y1="1034" x2="88" y2="1058" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="1040" x2="102" y2="1040" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 1040 l-4 8 h8 z M102 1040 l-4 8 h8 z" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="80" y1="1058" x2="96" y2="1058" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="125" y="1045" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0" font-weight="bold">equality compares every field by default; </tspan>
      <tspan x="125" dy="28">use compare=False for fields that change often</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="55" rx="8" fill="#207448"/>
    <text x="800" y="1160" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      A Data Class with no behaviour can be a code smell when its logic is scattered across callers
    </text>
  </g>
</svg>