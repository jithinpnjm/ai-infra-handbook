<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Floor Division versus Truncation on Positive and Negative Quotients</title>
  <desc>Visual comparison showing that floor division and truncation agree on positive quotients but differ by 1 on negative quotients, illustrated on a horizontal number line.</desc>

  <defs>
    
    <marker id="arrow-green-left" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 12 2 L 2 7 L 12 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-blue-left" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 12 2 L 2 7 L 12 12 Z" fill="#1e5f8a" />
    </marker>
    <marker id="arrow-blue-right" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#1e5f8a" />
    </marker>
    <marker id="axis-arrow-left" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M 10 2 L 2 6 L 10 10 Z" fill="#303a36" />
    </marker>
    <marker id="axis-arrow-right" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Floor Division versus Truncation on Positive and Negative Quotients</text>

  
  
  

  
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="720" height="340" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(40, 36)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 28 L 25 35 L 39 19" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    
    <text x="116" y="74" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Scenario 1 (Positive)</text>
    
    
    <rect x="40" y="120" width="640" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">For positive numbers,</text>
    <text x="360" y="245" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">floor and truncation agree</text>
  </g>

  
  
  <line x1="1393" y1="215" x2="1393" y2="495" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  
  <line x1="1296" y1="215" x2="1296" y2="540" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  
  <g transform="translate(840, 120)">
    <rect x="0" y="0" width="680" height="96" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="340" y="42" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#207448">5 // 2, math.floor(2.5) -&gt; 2</text>
    <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(rounds down toward -inf)</text>
  </g>
  
  <line x1="1393" y1="235" x2="1302" y2="235" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green-left)" />

  
  <g transform="translate(840, 275)">
    <rect x="0" y="0" width="680" height="96" rx="16" fill="#eaf2f8" stroke="#1e5f8a" stroke-width="2" />
    <text x="340" y="42" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#1e5f8a">math.trunc(2.5), int(2.5) -&gt; 2</text>
    <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(truncates toward 0)</text>
  </g>
  
  <line x1="1393" y1="390" x2="1302" y2="390" stroke="#1e5f8a" stroke-width="5" marker-end="url(#arrow-blue-left)" />

  
  <g transform="translate(1208, 470)">
    <rect x="0" y="0" width="370" height="52" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="185" y="35" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#207448">true quotient 5 / 2 = 2.5</text>
  </g>


  
  
  

  
  <line x1="80" y1="565" x2="1520" y2="565" stroke="#303a36" stroke-width="5" marker-start="url(#axis-arrow-left)" marker-end="url(#axis-arrow-right)" />

  
  <line x1="130" y1="545" x2="130" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="130" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">-4</text>

  
  <line x1="324" y1="545" x2="324" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="324" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">-3</text>

  
  <line x1="518" y1="545" x2="518" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="518" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">-2</text>

  
  <line x1="713" y1="545" x2="713" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="713" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">-1</text>

  
  <line x1="907" y1="545" x2="907" y2="585" stroke="#303a36" stroke-width="5" />
  <text x="907" y="622" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">0</text>

  
  <line x1="1101" y1="545" x2="1101" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="1101" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">1</text>

  
  <line x1="1296" y1="545" x2="1296" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="1296" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">2</text>

  
  <line x1="1490" y1="545" x2="1490" y2="585" stroke="#303a36" stroke-width="4" />
  <text x="1490" y="622" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">3</text>

  
  <polygon points="1393,547 1411,565 1393,583 1375,565" fill="#207448" stroke="#ffffff" stroke-width="3" />

  
  <polygon points="421,547 439,565 421,583 403,565" fill="#db8129" stroke="#ffffff" stroke-width="3" />


  
  
  

  
  <g transform="translate(228, 642)">
    <rect x="0" y="0" width="386" height="52" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="193" y="35" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#db8129">true quotient 5 / -2 = -2.5</text>
  </g>

  
  <line x1="324" y1="585" x2="324" y2="745" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <line x1="421" y1="694" x2="421" y2="905" stroke="#db8129" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <line x1="518" y1="585" x2="518" y2="905" stroke="#1e5f8a" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  
  <line x1="421" y1="735" x2="330" y2="735" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green-left)" />

  
  <g transform="translate(80, 760)">
    <rect x="0" y="0" width="680" height="96" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="340" y="42" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#207448">5 // -2, math.floor(-2.5) -&gt; -3</text>
    <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(rounds down toward -inf)</text>
  </g>

  
  <line x1="421" y1="895" x2="512" y2="895" stroke="#1e5f8a" stroke-width="5" marker-end="url(#arrow-blue-right)" />

  
  <g transform="translate(80, 920)">
    <rect x="0" y="0" width="680" height="96" rx="16" fill="#eaf2f8" stroke="#1e5f8a" stroke-width="2" />
    <text x="340" y="42" text-anchor="middle" font-family="monospace, sans-serif" font-size="24" font-weight="bold" fill="#1e5f8a">math.trunc(-2.5), int(-2.5) -&gt; -2</text>
    <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(truncates toward 0)</text>
  </g>

  
  <g transform="translate(800, 680)">
    <rect x="0" y="0" width="720" height="340" rx="20" fill="#fcf6ee" stroke="#db8129" stroke-width="2" />
    
    
    <g transform="translate(40, 36)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="28" y1="16" x2="28" y2="30" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="39" r="3" fill="#db8129" />
    </g>
    
    
    <text x="116" y="74" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Scenario 2 (Negative)</text>
    
    
    <rect x="40" y="120" width="640" height="180" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="360" y="185" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">For negative results,</text>
    <text x="360" y="225" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">floor division and truncation</text>
    <text x="360" y="265" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">differ by 1</text>
  </g>
</svg>