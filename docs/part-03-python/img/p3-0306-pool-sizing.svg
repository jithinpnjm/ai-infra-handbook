<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Size each pool by what limits it</title>
  <desc>Infographic explaining pool sizing rules for threads, processes, and asyncio based on limiting resources, concurrency bounds, and semaphore usage.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title { font-family: sans-serif; font-size: 48px; font-weight: bold; fill: #207448; }
      .th { font-family: sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; }
      .row-title { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #303a36; }
      .row-sub { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .code-text { font-family: monospace; font-size: 24px; fill: #303a36; }
      .orange-code { font-family: monospace; font-size: 24px; font-weight: bold; fill: #db8129; }
      .side-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .side-text { font-family: sans-serif; font-size: 24px; fill: #303a36; line-height: 1.4; }
      .strip-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .bottom-text { font-family: sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; }
      .icon-stroke { stroke: #207448; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  
  <rect width="1600" height="1200" class="bg" />

  
  <text x="50" y="75" class="title">Size each pool by what limits it</text>

  
  
  <rect x="50" y="115" width="250" height="56" rx="8" fill="#207448" />
  <text x="70" y="153" class="th">Model</text>

  
  <rect x="320" y="115" width="320" height="56" rx="8" fill="#207448" />
  <text x="340" y="153" class="th">What limits it</text>

  
  <rect x="660" y="115" width="530" height="56" rx="8" fill="#207448" />
  <text x="680" y="153" class="th">Pool size rule</text>

  
  
  
  <rect x="50" y="185" width="250" height="230" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(70, 205)">
    <ellipse cx="25" cy="14" rx="22" ry="9" class="icon-stroke" />
    <path d="M 3,14 v 22 c 0,5 10,9 22,9 c 12,0 22,-4 22,-9 v -22" class="icon-stroke" />
    <path d="M 3,25 c 0,5 10,9 22,9 c 12,0 22,-4 22,-9" class="icon-stroke" />
  </g>
  <text x="70" y="300" class="row-title">Threads doing I/O</text>

  
  <rect x="320" y="185" width="320" height="230" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text x="340" y="275" class="row-sub">what the remote</text>
  <text x="340" y="315" class="row-sub">system can tolerate</text>

  
  <rect x="660" y="185" width="530" height="230" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text x="685" y="228" class="row-sub">match the concurrency the remote</text>
  <text x="685" y="266" class="row-sub">tolerates, not the largest number you</text>
  <text x="685" y="304" class="row-sub">can start; 10 to 200 for blocking</text>
  <text x="685" y="342" class="row-sub">libraries (requests, paramiko, boto3)</text>

  
  
  
  <rect x="50" y="430" width="250" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(70, 448)">
    <rect x="8" y="8" width="34" height="34" rx="4" class="icon-stroke" />
    <rect x="17" y="17" width="16" height="16" fill="#207448" />
    <path d="M 15,2 v 6 M 25,2 v 6 M 35,2 v 6" class="icon-stroke" />
    <path d="M 15,42 v 6 M 25,42 v 6 M 35,42 v 6" class="icon-stroke" />
    <path d="M 2,15 h 6 M 2,25 h 6 M 2,35 h 6" class="icon-stroke" />
    <path d="M 42,15 h 6 M 42,25 h 6 M 42,35 h 6" class="icon-stroke" />
  </g>
  <text x="70" y="535" class="row-title">Processes doing</text>
  <text x="70" y="570" class="row-title">CPU work</text>

  
  <rect x="320" y="430" width="320" height="210" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text x="340" y="540" class="row-sub">cores</text>

  
  <rect x="660" y="430" width="530" height="210" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <text x="685" y="485" class="orange-code">os.cpu_count() or</text>
  <text x="685" y="525" class="orange-code">len(os.sched_getaffinity(0)), or</text>
  <text x="685" y="565" class="orange-code">the cgroup CPU limit in a</text>
  <text x="685" y="605" class="orange-code">container</text>

  
  
  
  <rect x="50" y="655" width="250" height="175" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(70, 672)">
    <circle cx="25" cy="25" r="20" class="icon-stroke" />
    <polygon points="35,12 45,25 25,25" fill="#207448" />
  </g>
  <text x="70" y="765" class="row-title">asyncio</text>

  
  <rect x="320" y="655" width="320" height="175" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text x="340" y="745" class="row-sub">target and sockets</text>

  
  <rect x="660" y="655" width="530" height="175" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text x="685" y="725" class="row-sub">cap with a semaphore, for example</text>
  <text x="685" y="768" class="code-text">Semaphore(100)</text>

  
  <rect x="1220" y="115" width="330" height="715" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1245, 140)">
    <path d="M 25,4 L 46,12 V 28 C 46,42 25,52 25,52 C 25,52 4,42 4,28 V 12 Z" class="icon-stroke" />
    <path d="M 25,16 V 38 M 16,27 H 34" class="icon-stroke" />
  </g>
  <text x="1245" y="240" class="side-title">Bounded</text>
  <text x="1245" y="278" class="side-title">concurrency first</text>

  <text x="1245" y="340" class="side-text">unbounded fan-out</text>
  <text x="1245" y="375" class="side-text">overwhelms targets</text>
  <text x="1245" y="410" class="side-text">(thundering herd on a</text>
  <text x="1245" y="445" class="side-text">BMC network or an</text>
  <text x="1245" y="480" class="side-text">API, every client arrives</text>
  <text x="1245" y="515" class="side-text">at once), exhausts file</text>
  <text x="1245" y="550" class="side-text">descriptors and</text>
  <text x="1245" y="585" class="side-text">memory; set the limit</text>
  <text x="1245" y="620" class="side-text">before you write the loop</text>

  
  <rect x="50" y="850" width="1500" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 868)">
    <rect x="6" y="22" width="36" height="26" rx="4" class="icon-stroke" />
    <path d="M 14,22 V 14 C 14,8 34,8 34,14 V 22" class="icon-stroke" />
  </g>
  <text x="140" y="905" class="row-sub">semaphore: a counter that lets at most that many tasks hold it at once</text>

  
  <rect x="50" y="960" width="1500" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 980)">
    <circle cx="10" cy="26" r="6" fill="#207448" />
    <path d="M 16,26 H 26 C 34,26 34,14 42,14 H 48" class="icon-stroke" />
    <path d="M 16,26 H 26 C 34,26 34,38 42,38 H 48" class="icon-stroke" />
  </g>
  <text x="140" y="1017" class="strip-text">async server plus blocking or CPU work: asyncio with to_thread or a process pool keeps the loop free</text>

  
  <rect x="50" y="1075" width="1500" height="75" rx="10" fill="#207448" />
  <text x="800" y="1122" class="bottom-text" text-anchor="middle">The limit is what keeps the fan-out safe</text>
</svg>