<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Size each pool by what limits it</title>
  <desc>Infographic explaining sizing rules for concurrency pools: threads doing I/O, processes doing CPU work, and asyncio, with bounded concurrency principles.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Size each pool by what limits it</text>

  
  
  <rect x="40" y="115" width="210" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="265" y="115" width="280" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="560" y="115" width="500" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="145" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Model</text>
  <text x="405" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">What limits it</text>
  <text x="810" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Pool size rule</text>

  
  <g>
    
    <rect x="40" y="190" width="210" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>
    <rect x="265" y="190" width="280" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>
    <rect x="560" y="190" width="500" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>

    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="145" cy="222" rx="22" ry="8"/>
      <path d="M 123 222 v 16 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -16"/>
      <path d="M 123 238 v 16 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -16"/>
    </g>

    
    <text x="145" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="145" dy="0">Threads</tspan>
      <tspan x="145" dy="36">doing I/O</tspan>
    </text>

    
    <text x="285" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">what the remote</tspan>
      <tspan x="285" dy="34">system can</tspan>
      <tspan x="285" dy="34">tolerate</tspan>
    </text>

    
    <text x="585" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">match the concurrency the</tspan>
      <tspan x="585" dy="32">remote tolerates, not the</tspan>
      <tspan x="585" dy="32">largest number you can start;</tspan>
      <tspan x="585" dy="32">10 to 200 for blocking</tspan>
      <tspan x="585" dy="32">libraries (requests,</tspan>
      <tspan x="585" dy="32">paramiko, boto3)</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="410" width="210" height="205" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <rect x="265" y="410" width="280" height="205" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <rect x="560" y="410" width="500" height="205" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>

    
    <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="127" y="432" width="36" height="36" rx="4"/>
      
      <line x1="135" y1="424" x2="135" y2="432"/>
      <line x1="145" y1="424" x2="145" y2="432"/>
      <line x1="155" y1="424" x2="155" y2="432"/>
      
      <line x1="135" y1="468" x2="135" y2="476"/>
      <line x1="145" y1="468" x2="145" y2="476"/>
      <line x1="155" y1="468" x2="155" y2="476"/>
      
      <line x1="119" y1="440" x2="127" y2="440"/>
      <line x1="119" y1="450" x2="127" y2="450"/>
      <line x1="119" y1="460" x2="127" y2="460"/>
      
      <line x1="163" y1="440" x2="171" y2="440"/>
      <line x1="163" y1="450" x2="171" y2="450"/>
      <line x1="163" y1="460" x2="171" y2="460"/>
      
      <rect x="137" y="442" width="16" height="16" rx="2"/>
    </g>

    
    <text x="145" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="145" dy="0">Processes</tspan>
      <tspan x="145" dy="36">doing</tspan>
      <tspan x="145" dy="36">CPU work</tspan>
    </text>

    
    <text x="405" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">cores</text>

    
    <text x="585" y="475" font-family="monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">os.cpu_count() or</tspan>
      <tspan x="585" dy="34">len(os.sched_getaffinity(0)),</tspan>
      <tspan x="585" dy="34" font-family="system-ui, -apple-system, sans-serif">or the cgroup CPU limit</tspan>
      <tspan x="585" dy="34" font-family="system-ui, -apple-system, sans-serif">in a container</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="630" width="210" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>
    <rect x="265" y="630" width="280" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>
    <rect x="560" y="630" width="500" height="205" rx="8" fill="#ffffff" stroke="#c8decb" stroke-width="2"/>

    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="145" cy="672" r="22"/>
      <polyline points="145,660 145,672 155,678"/>
      
      <path d="M 120 655 A 28 28 0 0 1 170 655"/>
      <polyline points="166,647 172,655 164,661"/>
    </g>

    
    <text x="145" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">asyncio</text>

    
    <text x="285" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="285" dy="0">target and</tspan>
      <tspan x="285" dy="34">sockets</tspan>
    </text>

    
    <text x="585" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">cap with a semaphore,</tspan>
      <tspan x="585" dy="36">for example <tspan font-family="monospace, monospace">Semaphore(100)</tspan></tspan>
    </text>
  </g>

  
  
  <rect x="1100" y="115" width="460" height="455" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1155 142 l 24 9 v 18 c 0 18 -12 32 -24 38 c -12 -6 -24 -20 -24 -38 v -18 z"/>
    <line x1="1143" y1="172" x2="1167" y2="172"/>
  </g>

  
  <text x="1200" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1200" dy="0">Bounded</tspan>
    <tspan x="1200" dy="36">concurrency first</tspan>
  </text>

  
  <text x="1130" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1130" dy="0">unbounded fan-out</tspan>
    <tspan x="1130" dy="32">overwhelms targets</tspan>
    <tspan x="1130" dy="32">(thundering herd on a</tspan>
    <tspan x="1130" dy="32">BMC network or an API,</tspan>
    <tspan x="1130" dy="32">every client arrives</tspan>
    <tspan x="1130" dy="32">at once), exhausts file</tspan>
    <tspan x="1130" dy="32">descriptors and memory;</tspan>
    <tspan x="1130" dy="32">set the limit before</tspan>
    <tspan x="1130" dy="32">you write the loop</tspan>
  </text>

  
  <rect x="1100" y="590" width="460" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1155" cy="635" r="22"/>
    <line x1="1147" y1="626" x2="1147" y2="644"/>
    <line x1="1155" y1="622" x2="1155" y2="648"/>
    <line x1="1163" y1="626" x2="1163" y2="644"/>
  </g>

  
  <text x="1130" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1130" dy="0" font-weight="bold" fill="#207448">semaphore:</tspan>
    <tspan font-weight="normal" fill="#303a36"> a counter that</tspan>
    <tspan x="1130" dy="36">lets at most that many</tspan>
    <tspan x="1130" dy="36">tasks hold it at once</tspan>
  </text>

  
  <rect x="40" y="865" width="1520" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="95" cy="940" r="18"/>
    <path d="M 95 914 v 8"/>
    <path d="M 95 958 v 8"/>
    <path d="M 69 940 h 8"/>
    <path d="M 113 940 h 8"/>
    <circle cx="95" cy="940" r="6"/>
  </g>

  
  <text x="145" y="928" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="145" dy="0">async server plus blocking or CPU work:</tspan>
  </text>
  <text x="145" y="972" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">asyncio with <tspan font-family="monospace, monospace">to_thread</tspan> or a process pool keeps the loop free</tspan>
  </text>

  
  <rect x="40" y="1045" width="1520" height="100" rx="12" fill="#207448"/>
  <text x="800" y="1107" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">The limit is what keeps the fan-out safe</text>
</svg>