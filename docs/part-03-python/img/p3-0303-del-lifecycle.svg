<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>del removes a name, not the object: a weakref.finalize timeline</title>
  <desc>Visual timeline showing that del removes references rather than destroying objects directly, and how weakref.finalize acts when the final reference is rebound.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">del removes a name, not the object: a weakref.finalize timeline</text>

  
  
  <rect x="40" y="115" width="910" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(65, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 15 C 6 8 50 8 50 15 C 50 22 6 22 6 15 Z" />
    <path d="M 6 15 L 6 41 C 6 48 50 48 50 41 L 50 15" />
    <path d="M 6 28 C 6 35 50 35 50 28" />
  </g>
  <text x="145" y="180" font-family="ui-monospace, monospace" font-size="36" font-weight="bold" fill="#207448">{1, 2, 3}</text>

  
  <line x1="85" y1="220" x2="85" y2="246" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="250" width="910" height="235" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" />
  <circle cx="85" cy="295" r="24" fill="#207448" />
  <text x="85" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(130, 267)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <line x1="4" y1="18" x2="52" y2="18" />
    <line x1="14" y1="30" x2="24" y2="30" />
    <line x1="14" y1="38" x2="34" y2="38" />
  </g>
  
  <text x="210" y="303" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#303a36">s1 = s2 = {1, 2, 3}</text>
  <text x="210" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">two names on one object</text>
  
  <rect x="210" y="380" width="670" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="235" y="418" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">ender = weakref.finalize(s1, bye)</text>
  <rect x="235" y="428" width="145" height="30" rx="6" fill="#207448" />
  <text x="307" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">registered</text>

  
  <line x1="85" y1="485" x2="85" y2="511" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="515" width="910" height="215" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" />
  <circle cx="85" cy="560" r="24" fill="#207448" />
  <text x="85" y="569" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(130, 532)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="38" r="8" />
    <circle cx="40" cy="38" r="8" />
    <line x1="22" y1="32" x2="38" y2="12" />
    <line x1="34" y1="32" x2="18" y2="12" />
  </g>

  <text x="210" y="568" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#303a36">del s1</text>
  <text x="210" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">removes only the name s1</text>
  
  <rect x="210" y="645" width="670" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="235" y="683" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">ender.alive is still True</text>

  
  <line x1="85" y1="730" x2="85" y2="756" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="760" width="910" height="295" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" />
  <circle cx="85" cy="805" r="24" fill="#207448" />
  <text x="85" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(130, 777)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46 22 A 18 18 0 0 0 16 18" />
    <polyline points="10 12 16 18 10 24" />
    <path d="M 10 34 A 18 18 0 0 0 40 38" />
    <polyline points="46 44 40 38 46 32" />
  </g>

  <text x="210" y="813" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#303a36">s2 = &quot;spam&quot;</text>
  <text x="210" y="858" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rebinds the last reference</text>
  <text x="210" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the object is reclaimed</text>

  <rect x="210" y="930" width="200" height="56" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2.5" />
  <text x="310" y="966" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">bye() runs</text>

  <rect x="430" y="930" width="450" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="655" y="966" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">ender.alive becomes False</text>

  
  <rect x="980" y="115" width="580" height="940" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1005, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 10 L 46 18 L 32 32 L 24 24 Z" />
    <circle cx="18" cy="38" r="8" />
    <path d="M 28 6 C 24 6 22 10 22 14 L 38 30 C 42 30 46 28 46 24" />
  </g>
  <text x="1075" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Cleanup tools</text>

  
  <rect x="1005" y="220" width="530" height="95" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
  <text x="1025" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">do not rely on __del__,</tspan>
    <tspan x="1025" dy="32">it is unreliable</tspan>
  </text>

  
  <rect x="1005" y="330" width="530" height="95" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
  <text x="1025" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">use a context manager, a try/finally</tspan>
    <tspan x="1025" dy="32">block or weakref.finalize</tspan>
  </text>

  
  <rect x="1005" y="440" width="530" height="200" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
  <text x="1025" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">weak references keep a cache</tspan>
    <tspan x="1025" dy="32">or registry without keeping</tspan>
    <tspan x="1025" dy="32">objects alive: weakref.ref(obj),</tspan>
    <tspan x="1025" dy="32">WeakValueDictionary,</tspan>
    <tspan x="1025" dy="32">WeakKeyDictionary, WeakSet</tspan>
  </text>

  
  <rect x="1005" y="655" width="530" height="95" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
  <text x="1025" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">gc.collect() and gc.get_stats() show</tspan>
    <tspan x="1025" dy="32">what the collector is doing</tspan>
  </text>

  
  <rect x="1005" y="765" width="530" height="200" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
  <text x="1025" y="800" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">gc.freeze() before forking workers</tspan>
    <tspan x="1025" dy="32">reduces copy-on-write memory</tspan>
    <tspan x="1025" dy="32">growth in preforking servers,</tspan>
    <tspan x="1025" dy="32">which matters for inference</tspan>
    <tspan x="1025" dy="32">and data-loader workers</tspan>
  </text>

  
  <rect x="40" y="1085" width="1520" height="65" rx="10" fill="#207448" />
  <text x="800" y="1126" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">The object is garbage-collected only after its last reference goes away</text>
</svg>