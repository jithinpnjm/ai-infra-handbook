<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Streaming a child, building a pipeline, and killing the whole tree</title>
  <desc>Visual infographic explaining process streaming with deadlines, shell-free pipelines, process group termination, and child process lifecycle management in Python.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5" />

  
  <text text-anchor="middle" fill="#303a36">
    <tspan x="800" y="52" font-family="sans-serif" font-size="46" font-weight="bold">Streaming a child, building a pipeline,</tspan>
    <tspan x="800" y="104" font-family="sans-serif" font-size="46" font-weight="bold">and killing the whole tree</tspan>
  </text>

  
  <rect x="40" y="125" width="1520" height="265" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 137)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="120" y="166" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Stream with a deadline</text>

  
  <rect x="65" y="185" width="380" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="85" y="222" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">Popen([ping, -c, 5,</tspan>
    <tspan x="85" dy="28">      10.0.0.1],</tspan>
    <tspan x="85" dy="28">      stdout=PIPE,</tspan>
    <tspan x="85" dy="28">      stderr=STDOUT,</tspan>
    <tspan x="85" dy="28">      text=True, bufsize=1)</tspan>
  </text>

  
  <line x1="445" y1="277" x2="487" y2="277" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="495" y="185" width="590" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="515" y="222" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="515" dy="0">deadline = time.monotonic() + 30;</tspan>
    <tspan x="515" dy="28">for line in p.stdout:</tspan>
    <tspan x="515" dy="28">    handle(line);</tspan>
    <tspan x="515" dy="28">    if past the deadline:</tspan>
    <tspan x="515" dy="28">        p.kill(); break</tspan>
  </text>

  
  <line x1="1085" y1="277" x2="1127" y2="277" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1135" y="185" width="400" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1175" y="285" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">rc = p.wait()</text>


  
  <rect x="40" y="410" width="1520" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 422)">
    <circle cx="10" cy="20" r="7" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="17" y1="20" x2="23" y2="20" stroke="#207448" stroke-width="3" />
    <circle cx="30" cy="20" r="7" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="120" y="450" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pipeline without a shell: dmesg | grep -i error | tail -20</text>

  
  <rect x="65" y="470" width="275" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="85" y="505" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">p1</text>
  <text x="85" y="550" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">Popen([dmesg],</tspan>
    <tspan x="85" dy="32">      stdout=PIPE)</tspan>
  </text>

  
  <line x1="340" y1="570" x2="357" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="365" y="470" width="370" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="385" y="505" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">p2</text>
  <text x="385" y="545" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="385" dy="0">Popen([grep, -i,</tspan>
    <tspan x="385" dy="30">       error],</tspan>
    <tspan x="385" dy="30">      stdin=p1.stdout,</tspan>
    <tspan x="385" dy="30">      stdout=PIPE)</tspan>
  </text>

  
  <line x1="735" y1="570" x2="752" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="760" y="470" width="345" height="200" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
  <text x="778" y="525" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="778" dy="0">p1.stdout.close()</tspan>
  </text>
  <text x="778" y="575" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="778" dy="0">so p1 can receive</tspan>
    <tspan x="778" dy="32">SIGPIPE if p2 exits</tspan>
  </text>

  
  <line x1="1105" y1="570" x2="1122" y2="570" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="1130" y="470" width="405" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1150" y="505" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">p3</text>
  <text x="1150" y="545" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1150" dy="0">run([tail, -20],</tspan>
    <tspan x="1150" dy="30">    stdin=p2.stdout,</tspan>
    <tspan x="1150" dy="30">    capture_output=True,</tspan>
    <tspan x="1150" dy="30">    text=True)</tspan>
  </text>


  
  <rect x="40" y="710" width="1520" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 722)">
    <circle cx="20" cy="8" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="14" x2="10" y2="26" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="14" x2="30" y2="26" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="32" r="5" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="30" cy="32" r="5" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="120" y="750" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kill the whole tree on timeout</text>

  
  <rect x="65" y="770" width="640" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="95" y="828" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">p = Popen(cmd,</tspan>
    <tspan x="95" dy="36">          start_new_session=True)</tspan>
  </text>

  
  <line x1="705" y1="840" x2="767" y2="840" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="712" y="824" width="48" height="30" rx="6" fill="#e8f1ea" />
  <text x="736" y="845" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">then</text>

  
  <rect x="775" y="770" width="760" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="805" y="828" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="805" dy="0">os.killpg(os.getpgid(p.pid),</tspan>
    <tspan x="805" dy="36">          signal.SIGTERM)</tspan>
  </text>


  
  
  <rect x="65" y="950" width="480" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 970)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 16 8 L 16 18 M 16 22 L 16 24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="125" y="995" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">deadlock avoidance:</text>
  <text x="85" y="1045" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">communicate(),</tspan>
    <tspan x="85" dy="35">capture_output=True,</tspan>
    <tspan x="85" dy="35">merge stderr=STDOUT,</tspan>
    <tspan x="85" dy="35">threads, or</tspan>
    <tspan x="85" dy="35">asyncio.</tspan>
    <tspan x="85" dy="35">  create_subprocess_exec</tspan>
  </text>
  <text x="85" y="1325" font-family="sans-serif" font-size="24" fill="#55605a">(chapter 3.6)</text>

  
  <rect x="565" y="950" width="510" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(585, 970)">
    <rect x="4" y="4" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="10" y1="12" x2="22" y2="12" stroke="#207448" stroke-width="3" />
    <line x1="16" y1="12" x2="16" y2="24" stroke="#207448" stroke-width="3" />
  </g>
  <text x="590" y="1035" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="590" dy="0">a zombie is a finished child</tspan>
    <tspan x="590" dy="38">whose exit status nobody</tspan>
    <tspan x="590" dy="38">collected; wait() and</tspan>
    <tspan x="590" dy="38">communicate() reap children;</tspan>
    <tspan x="590" dy="48">unreaped children linger as</tspan>
    <tspan x="590" dy="42" font-family="monospace" font-weight="bold" fill="#303a36">defunct</tspan>
  </text>

  
  <rect x="1095" y="950" width="440" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1115, 970)">
    <circle cx="16" cy="16" r="10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 16 2 L 16 6 M 16 26 L 16 30 M 2 16 L 6 16 M 26 16 L 30 16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1155" y="995" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">services and daemons:</text>
  <text x="1115" y="1065" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1115" dy="0">use </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">Popen</tspan>
    <tspan> and manage</tspan>
    <tspan x="1115" dy="42">the lifecycle yourself</tspan>
  </text>


  
  <rect x="65" y="1405" width="1470" height="75" rx="12" fill="#207448" />
  <text x="800" y="1452" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Reap every child, and kill the process group, not just the parent
  </text>
</svg>