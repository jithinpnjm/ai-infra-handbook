<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>What @decorator really does</title>
  <desc>Visual breakdown of Python decorator syntax and runtime execution flow showing wrapper creation and invocation.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="80" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What @decorator really does</text>

  
  
  <rect x="80" y="130" width="560" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="120" y="155" width="150" height="48" rx="8" fill="#207448" />
  <text x="195" y="188" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">@deco</text>

  
  <text x="120" y="250" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">def f(): ...</text>

  
  <g transform="translate(540, 182)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="8" />
    <path d="M 14 20 L 26 28 L 14 36" />
    <line x1="30" y1="36" x2="42" y2="36" />
  </g>

  
  <text x="690" y="230" font-family="sans-serif" font-size="64" font-weight="bold" fill="#207448" text-anchor="middle">=</text>

  
  <rect x="740" y="130" width="780" height="160" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  <text x="800" y="225" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">f = deco(f)</text>

  
  <g transform="translate(1420, 182)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 18 L 38 18 C 46 18 48 24 48 30 C 48 38 42 42 34 42 L 12 42" />
    <polyline points="20 10 12 18 20 26" />
    <polyline points="20 34 12 42 20 50" />
  </g>

  
  <rect x="80" y="325" width="1440" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(120, 352)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="16" width="48" height="34" rx="4" />
    <polyline points="4 24 28 34 52 24" />
    <line x1="28" y1="6" x2="28" y2="16" />
    <circle cx="28" cy="6" r="3" fill="#207448" />
  </g>

  <text x="210" y="393" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">deco(f) returns wrapper</text>

  
  
  <rect x="80" y="475" width="245" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="202" cy="515" r="24" fill="#207448" />
  <text x="202" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(174, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <line x1="4" y1="18" x2="52" y2="18" />
    <circle cx="12" cy="12" r="2" fill="#207448" />
    <circle cx="20" cy="12" r="2" fill="#207448" />
    <polyline points="16 28 24 34 16 40" />
    <line x1="28" y1="40" x2="40" y2="40" />
  </g>
  <text x="202" y="675" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">f()</text>

  
  <line x1="327" y1="625" x2="373" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <rect x="375" y="475" width="245" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="497" cy="515" r="24" fill="#207448" />
  <text x="497" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(469, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="8" />
    <rect x="14" y="14" width="28" height="28" rx="4" />
  </g>
  <text x="497" y="675" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">wrapper</text>

  
  <line x1="622" y1="625" x2="668" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <rect x="670" y="475" width="245" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="792" cy="515" r="24" fill="#207448" />
  <text x="792" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(764, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="30 4 14 28 28 28 24 52 44 24 30 24" />
  </g>
  <text x="792" y="660" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="792" dy="0">does</tspan>
    <tspan x="792" dy="34">extra work</tspan>
  </text>

  
  <line x1="917" y1="625" x2="963" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <rect x="965" y="475" width="245" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1087" cy="515" r="24" fill="#207448" />
  <text x="1087" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(1059, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <circle cx="28" cy="28" r="12" />
    <circle cx="28" cy="28" r="3" fill="#207448" />
  </g>
  <text x="1087" y="660" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1087" dy="0">calls the</tspan>
    <tspan x="1087" dy="34">original f</tspan>
  </text>

  
  <line x1="1212" y1="625" x2="1258" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <rect x="1260" y="475" width="245" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1382" cy="515" r="24" fill="#207448" />
  <text x="1382" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <g transform="translate(1354, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="40" height="44" rx="4" />
    <polyline points="18 28 26 36 38 18" />
  </g>
  <text x="1382" y="660" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1382" dy="0">returns its</tspan>
    <tspan x="1382" dy="34">result</tspan>
  </text>

  
  <rect x="80" y="820" width="1440" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(120, 847)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 6 L 44 6 C 46 6 48 8 48 10 L 48 50 L 28 38 L 8 50 L 8 10 C 8 8 10 6 12 6 Z" />
    <line x1="18" y1="18" x2="38" y2="18" />
    <line x1="18" y1="26" x2="30" y2="26" />
  </g>

  <text x="210" y="888" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">functools.wraps keeps the name and docstring</text>
</svg>