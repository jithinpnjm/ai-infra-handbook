<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" width="1600" height="1030">
  <title>The retry helper: delay range per attempt with real numbers</title>
  <desc>Visual infographic explaining retry delay range per attempt with real numbers, idempotency rules, libraries, and jitter behavior.</desc>

  
  <rect width="1600" height="1030" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The retry helper: delay range per attempt with real numbers</text>

  
  <rect x="40" y="85" width="1520" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(68, 107)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 A 22 22 0 1 1 10 36"/>
    <path d="M 28 0 L 28 12 L 38 6 Z" fill="#207448" stroke-width="1"/>
    <path d="M 28 28 L 28 16 M 28 28 L 38 28"/>
    <circle cx="28" cy="28" r="3" fill="#207448"/>
  </g>

  
  <text x="146" y="132" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">retry(fn, attempts=5, base=0.5, cap=20.0)</text>
  <text x="146" y="165" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">delay = random.uniform(0, min(cap, base * 2 ** i))</text>

  
  <rect x="65" y="188" width="1470" height="52" rx="10" fill="#ffffff" stroke="#c5d9cb" stroke-width="1.5"/>
  <text x="85" y="222" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">attempt i=0: ceiling min(20, 0.5 * 1) = 0.5 s, delay between 0 and 0.5</text>
  <rect x="1150" y="204" width="360" height="20" rx="10" fill="#e8f1ea"/>
  <rect x="1150" y="204" width="45" height="20" rx="10" fill="#207448"/>

  
  <rect x="65" y="248" width="1470" height="52" rx="10" fill="#ffffff" stroke="#c5d9cb" stroke-width="1.5"/>
  <text x="85" y="282" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">i=1: ceiling 1.0 s</text>
  <rect x="1150" y="264" width="360" height="20" rx="10" fill="#e8f1ea"/>
  <rect x="1150" y="264" width="90" height="20" rx="10" fill="#207448"/>

  
  <rect x="65" y="308" width="1470" height="52" rx="10" fill="#ffffff" stroke="#c5d9cb" stroke-width="1.5"/>
  <text x="85" y="342" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">i=2: ceiling 2.0 s</text>
  <rect x="1150" y="324" width="360" height="20" rx="10" fill="#e8f1ea"/>
  <rect x="1150" y="324" width="180" height="20" rx="10" fill="#207448"/>

  
  <rect x="65" y="368" width="1470" height="52" rx="10" fill="#ffffff" stroke="#c5d9cb" stroke-width="1.5"/>
  <text x="85" y="402" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">i=3: ceiling 4.0 s</text>
  <rect x="1150" y="384" width="360" height="20" rx="10" fill="#e8f1ea"/>
  <rect x="1150" y="384" width="360" height="20" rx="10" fill="#207448"/>

  
  <rect x="65" y="428" width="1470" height="52" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="85" y="462" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">i=4: the last attempt, no sleep, the error is re-raised</text>
  <rect x="1150" y="444" width="360" height="20" rx="10" fill="#fdf2e7"/>
  <circle cx="1160" cy="454" r="7" fill="#db8129"/>

  
  <rect x="40" y="550" width="1520" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(68, 575)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z"/>
    <path d="M 18 26 L 25 33 L 38 19"/>
  </g>

  
  <text x="146" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="146" dy="0">retry only idempotent operations (safe to repeat: twice leaves the same result as once) and</tspan>
    <tspan x="146" dy="42">transient errors: timeouts, connection resets, 429 or 503; cap the total time;</tspan>
    <tspan x="146" dy="42">honour Retry-After; log each attempt</tspan>
  </text>

  
  <rect x="40" y="780" width="1520" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(68, 797)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28 8, 48 18, 28 28, 8 18"/>
    <polygon points="8 18, 28 28, 28 48, 8 38"/>
    <polygon points="48 18, 28 28, 28 48, 48 38"/>
    <line x1="28" y1="28" x2="28" y2="48"/>
  </g>

  
  <text x="146" y="836" font-family="ui-monospace, monospace" font-size="25" fill="#303a36">tenacity, backoff, urllib3.util.Retry with requests.adapters.HTTPAdapter</text>

  
  <rect x="40" y="910" width="1520" height="75" rx="14" fill="#207448"/>
  <text x="800" y="957" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Full jitter keeps many clients from retrying together</text>
</svg>