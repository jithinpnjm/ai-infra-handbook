<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Shallow reload versus transitive dependency tree reload</title>
  <desc>A side-by-side comparison of shallow versus deep transitive reloading across an import graph ra -&gt; rb -&gt; rc.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Shallow reload versus transitive dependency tree reload</text>

  
  <text x="800" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">A side-by-side comparison of shallow versus deep transitive reloading across an import graph ra -&gt; rb -&gt; rc.</text>

  
  <g id="left-column">
    
    <rect x="50" y="140" width="690" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(80, 165)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="4" />
      <circle cx="12" cy="9" r="3.5" fill="#207448" />
      <circle cx="22" cy="9" r="3.5" fill="#207448" />
      <circle cx="32" cy="9" r="3.5" fill="#207448" />
    </g>

    
    <text x="155" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="155" dy="0">Left column</tspan>
      <tspan x="155" dy="34">(Standard <tspan font-family="monospace">importlib.reload(ra)</tspan>):</tspan>
    </text>

    
    
    <rect x="90" y="255" width="610" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(120, 273)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="85 20" />
      <polygon points="36,12 42,21 31,21" fill="#207448" />
      <path d="M14 20 L18 24 L27 15" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <rect x="180" y="282" width="220" height="20" rx="4" fill="#e8f1ea" />
    <rect x="420" y="282" width="100" height="20" rx="4" fill="#207448" opacity="0.15" />

    
    <line x1="395" y1="330" x2="395" y2="360" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="90" y="362" width="610" height="75" rx="10" fill="#ffffff" stroke="#9aa8a1" stroke-width="2" />
    
    <g transform="translate(120, 380)">
      <polygon points="20,4 38,34 2,34" fill="none" stroke="#9aa8a1" stroke-width="3" stroke-linejoin="round" />
      <line x1="20" y1="15" x2="20" y2="24" stroke="#9aa8a1" stroke-width="3" stroke-linecap="round" />
      <circle cx="20" cy="29" r="2" fill="#9aa8a1" />
    </g>
    <rect x="180" y="389" width="180" height="20" rx="4" fill="#e8f1ea" />
    <rect x="380" y="389" width="160" height="20" rx="4" fill="#9aa8a1" opacity="0.2" />

    
    <line x1="395" y1="437" x2="395" y2="467" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="90" y="469" width="610" height="75" rx="10" fill="#ffffff" stroke="#9aa8a1" stroke-width="2" />
    
    <g transform="translate(120, 487)">
      <polygon points="20,4 38,34 2,34" fill="none" stroke="#9aa8a1" stroke-width="3" stroke-linejoin="round" />
      <line x1="20" y1="15" x2="20" y2="24" stroke="#9aa8a1" stroke-width="3" stroke-linecap="round" />
      <circle cx="20" cy="29" r="2" fill="#9aa8a1" />
    </g>
    <rect x="180" y="496" width="140" height="20" rx="4" fill="#e8f1ea" />
    <rect x="340" y="496" width="200" height="20" rx="4" fill="#9aa8a1" opacity="0.2" />

    
    <rect x="90" y="570" width="610" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="116" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" dy="0">ra is reloaded; its internal <tspan font-family="monospace">'import rb'</tspan> statement</tspan>
      <tspan x="116" dy="38">evaluates against <tspan font-family="monospace">sys.modules</tspan> where rb already</tspan>
      <tspan x="116" dy="38">exists, so rb and rc remain unchanged with</tspan>
      <tspan x="116" dy="38">stale flags on <tspan font-family="monospace">ra.rb.Y</tspan> and <tspan font-family="monospace">ra.rb.rc.Z</tspan>.</tspan>
    </text>
  </g>

  
  <g id="right-column">
    
    <rect x="760" y="140" width="790" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(790, 165)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M28,4 L28,10 M28,46 L28,52 M4,28 L10,28 M46,28 L52,28 M11,11 L16,16 M40,40 L45,45 M11,45 L16,40 M40,16 L45,11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="865" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="865" dy="0">Right column</tspan>
      <tspan x="865" dy="34">(transitive <tspan font-family="monospace">reloadall.py</tspan> walker):</tspan>
    </text>

    
    <text x="865" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">flow diagram showing <tspan font-family="monospace">reloadall(ra)</tspan>.</text>

    
    <rect x="790" y="295" width="730" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="816" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="816" dy="0" font-weight="bold" fill="#207448">Step 1: </tspan>
      <tspan>inspect <tspan font-family="monospace">ra.__dict__.values()</tspan>, filtering for</tspan>
      <tspan x="816" dy="34"><tspan font-family="monospace">types.ModuleType</tspan> to discover rb.</tspan>
    </text>

    
    <line x1="1155" y1="393" x2="1155" y2="423" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="790" y="425" width="730" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="816" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="816" dy="0" font-weight="bold" fill="#207448">Step 2: </tspan>
      <tspan>check <tspan font-family="monospace">'if rb not in visited: visited.add(rb)'</tspan></tspan>
      <tspan x="816" dy="34">to prevent circular loops.</tspan>
    </text>

    
    <line x1="1155" y1="523" x2="1155" y2="553" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="790" y="555" width="730" height="135" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="816" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="816" dy="0" font-weight="bold" fill="#db8129">Step 3: </tspan>
      <tspan>call <tspan font-family="monospace">tryreload(rb)</tspan> inside a defensive</tspan>
      <tspan x="816" dy="34"><tspan font-family="monospace">try/except</tspan> block that guards unreloadable</tspan>
      <tspan x="816" dy="34">modules such as <tspan font-family="monospace">sys.monitoring</tspan>.</tspan>
    </text>

    
    <line x1="1155" y1="690" x2="1155" y2="720" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="790" y="722" width="730" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="816" y="763" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="816" dy="0" font-weight="bold" fill="#207448">Step 4: </tspan>
      <tspan>recurse into rb, discover rc,</tspan>
      <tspan x="816" dy="34">reload rc.</tspan>
    </text>
  </g>

  
  <g id="bottom-box">
    
    <rect x="50" y="880" width="1500" height="175" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(85, 935)">
      <ellipse cx="28" cy="14" rx="24" ry="9" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M4,14 L4,42 C4,47 15,51 28,51 C41,51 52,47 52,42 L52,14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M4,28 C4,33 15,37 28,37 C41,37 52,33 52,28" fill="none" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="165" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
      <tspan x="165" dy="0">Bottom box contrasts the recursive <tspan font-family="monospace">reloadall2</tspan> (visited set) with <tspan font-family="monospace">reloadall3</tspan></tspan>
      <tspan x="165" dy="44">explicit stack implementation using <tspan font-family="monospace">objects.pop()</tspan> and <tspan font-family="monospace">objects.extend()</tspan>.</tspan>
    </text>
  </g>
</svg>