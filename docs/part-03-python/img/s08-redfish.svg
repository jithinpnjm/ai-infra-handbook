<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>The Redfish resource tree</title>
  <desc>Visual tree structure of the Redfish resource model starting from the /redfish/v1/ service root branching to Systems, Chassis, Managers, and UpdateService collections, with navigation and action guidelines.</desc>

  <defs>
    <marker id="branch-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The Redfish resource tree</text>

  
  <g id="root-node">
    <rect x="570" y="105" width="460" height="115" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(595, 130)">
      <rect x="0" y="0" width="56" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="12" cy="17" r="3.5" fill="#207448" />
      <line x1="24" y1="17" x2="46" y2="17" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="34" x2="28" y2="52" stroke="#207448" stroke-width="3.5" />
      <line x1="10" y1="52" x2="46" y2="52" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="10" cy="58" r="3" fill="#207448" />
      <circle cx="28" cy="58" r="3" fill="#207448" />
      <circle cx="46" cy="58" r="3" fill="#207448" />
    </g>

    
    <text x="675" y="152" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">/redfish/v1/</text>
    <text x="675" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">service root</text>
  </g>

  
  <g id="branches">
    
    <path d="M 800 220 L 800 270" fill="none" stroke="#207448" stroke-width="3.5" />
    
    <path d="M 230 270 L 1370 270" fill="none" stroke="#207448" stroke-width="3.5" />
    
    <path d="M 230 270 L 230 325" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#branch-arrow)" />
    <path d="M 610 270 L 610 325" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#branch-arrow)" />
    <path d="M 990 270 L 990 325" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#branch-arrow)" />
    <path d="M 1370 270 L 1370 325" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#branch-arrow)" />
  </g>

  
  <g id="box-systems" transform="translate(60, 330)">
    <rect x="0" y="0" width="340" height="365" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 0 16 Q 0 0 16 0 L 324 0 Q 340 0 340 16 L 340 120 L 0 120 Z" fill="#e8f1ea" />
    
    
    <g transform="translate(142, 16)">
      <rect x="7" y="7" width="42" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="18" y="18" width="20" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      <line x1="16" y1="0" x2="16" y2="7" stroke="#207448" stroke-width="2.5" />
      <line x1="28" y1="0" x2="28" y2="7" stroke="#207448" stroke-width="2.5" />
      <line x1="40" y1="0" x2="40" y2="7" stroke="#207448" stroke-width="2.5" />
      <line x1="16" y1="49" x2="16" y2="56" stroke="#207448" stroke-width="2.5" />
      <line x1="28" y1="49" x2="28" y2="56" stroke="#207448" stroke-width="2.5" />
      <line x1="40" y1="49" x2="40" y2="56" stroke="#207448" stroke-width="2.5" />
      <line x1="0" y1="16" x2="7" y2="16" stroke="#207448" stroke-width="2.5" />
      <line x1="0" y1="28" x2="7" y2="28" stroke="#207448" stroke-width="2.5" />
      <line x1="0" y1="40" x2="7" y2="40" stroke="#207448" stroke-width="2.5" />
      <line x1="49" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="2.5" />
      <line x1="49" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="2.5" />
      <line x1="49" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="2.5" />
    </g>

    <text x="170" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Systems</text>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#207448" stroke-width="2" />

    
    <circle cx="36" cy="163" r="5" fill="#207448" />
    <text x="54" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">power state</text>

    <circle cx="36" cy="215" r="5" fill="#207448" />
    <text x="54" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">BIOS</text>

    <circle cx="36" cy="267" r="5" fill="#207448" />
    <text x="54" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">processors</text>

    <circle cx="36" cy="319" r="5" fill="#207448" />
    <text x="54" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">memory</text>
  </g>

  
  <g id="box-chassis" transform="translate(440, 330)">
    <rect x="0" y="0" width="340" height="365" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 0 16 Q 0 0 16 0 L 324 0 Q 340 0 340 16 L 340 120 L 0 120 Z" fill="#e8f1ea" />

    
    <g transform="translate(142, 16)">
      <rect x="4" y="4" width="48" height="48" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="12" x2="4" y2="12" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="44" x2="4" y2="44" stroke="#207448" stroke-width="3.5" />
      <line x1="52" y1="12" x2="56" y2="12" stroke="#207448" stroke-width="3.5" />
      <line x1="52" y1="44" x2="56" y2="44" stroke="#207448" stroke-width="3.5" />
      <rect x="11" y="11" width="34" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      <rect x="11" y="24" width="34" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      <rect x="11" y="37" width="34" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    </g>

    <text x="170" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Chassis</text>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#207448" stroke-width="2" />

    
    <circle cx="36" cy="151" r="5" fill="#207448" />
    <text x="54" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">enclosure</text>

    <circle cx="36" cy="193" r="5" fill="#207448" />
    <text x="54" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">thermal</text>

    <circle cx="36" cy="235" r="5" fill="#207448" />
    <text x="54" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">power</text>

    <circle cx="36" cy="277" r="5" fill="#207448" />
    <text x="54" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">sensors</text>

    <circle cx="36" cy="319" r="5" fill="#207448" />
    <text x="54" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">GPUs</text>
  </g>

  
  <g id="box-managers" transform="translate(820, 330)">
    <rect x="0" y="0" width="340" height="365" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 0 16 Q 0 0 16 0 L 324 0 Q 340 0 340 16 L 340 120 L 0 120 Z" fill="#e8f1ea" />

    
    <g transform="translate(142, 16)">
      <path d="M 28 4 L 50 14 L 50 34 C 50 46 28 54 28 54 C 28 54 6 46 6 34 L 6 14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 18 28 L 25 35 L 38 21" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="170" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Managers</text>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#207448" stroke-width="2" />

    
    <circle cx="36" cy="175" r="5" fill="#207448" />
    <text x="54" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the BMC itself</text>

    <circle cx="36" cy="235" r="5" fill="#207448" />
    <text x="54" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">network</text>

    <circle cx="36" cy="295" r="5" fill="#207448" />
    <text x="54" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">logs</text>
  </g>

  
  <g id="box-updateservice" transform="translate(1200, 330)">
    <rect x="0" y="0" width="340" height="365" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 0 16 Q 0 0 16 0 L 324 0 Q 340 0 340 16 L 340 120 L 0 120 Z" fill="#e8f1ea" />

    
    <g transform="translate(142, 16)">
      <path d="M 28 6 A 22 22 0 1 1 8 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 6 10 L 8 22 L 20 20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 28 42 L 28 22 M 20 29 L 28 22 L 36 29" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="170" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">UpdateService</text>
    <line x1="0" y1="120" x2="340" y2="120" stroke="#207448" stroke-width="2" />

    
    <circle cx="36" cy="235" r="5" fill="#207448" />
    <text x="54" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">firmware inventory</text>
  </g>

  
  <g id="note-green" transform="translate(60, 735)">
    <rect x="0" y="0" width="1480" height="74" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(30, 18)">
      <path d="M 17 21 L 11 27 C 7 31 1 31 -3 27 C -7 23 -7 17 -3 13 L 3 7" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 13 15 L 19 9 C 23 5 29 5 33 9 C 37 13 37 19 33 23 L 27 29" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="7" y1="21" x2="23" y2="15" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <text x="95" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">follow <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">@odata.id</tspan> links, do not hard-code vendor paths</text>
  </g>

  
  <g id="note-orange" transform="translate(60, 830)">
    <rect x="0" y="0" width="1480" height="74" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="2.5" />
    
    
    <g transform="translate(32, 17)">
      <path d="M 18 0 L 2 22 L 14 22 L 10 40 L 28 16 L 16 16 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    <text x="95" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">actions are <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#db8129">POST</tspan> requests to <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#db8129">Actions/...</tspan> targets</text>
  </g>
</svg>