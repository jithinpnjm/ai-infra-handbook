<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Mechanics</title>
  <desc>Flowchart illustrating Python try, except, else, and finally execution mechanics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="70" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Mechanics</text>

  
  
  <path d="M 300 260 L 300 300" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 300 440 L 300 500" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />
  <rect x="315" y="454" width="48" height="32" rx="6" fill="#f5f8f5" />
  <text x="325" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  <path d="M 530 370 L 590 370" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />
  <rect x="536" y="328" width="54" height="32" rx="6" fill="#f5f8f5" />
  <text x="542" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <path d="M 850 440 L 850 500" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />
  <rect x="865" y="454" width="54" height="32" rx="6" fill="#f5f8f5" />
  <text x="872" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <path d="M 1110 370 L 1335 370 Q 1355 370 1355 390 L 1355 500" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />
  <rect x="1135" y="328" width="48" height="32" rx="6" fill="#f5f8f5" />
  <text x="1144" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  <path d="M 300 680 L 300 730 Q 300 750 320 750 L 420 750 Q 440 750 440 765 L 440 780" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 850 710 L 850 730 Q 850 750 830 750 L 720 750 Q 700 750 700 765 L 700 780" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow-green)" />

  

  
  <g id="node-try">
    <rect x="70" y="120" width="460" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="272" y="136" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="272" y1="148" x2="328" y2="148" stroke="#207448" stroke-width="2.5" />
    <path d="M 282 161 L 289 166 L 282 171" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="294" y1="171" x2="304" y2="171" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="300" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Execute try: block</text>
  </g>

  
  <g id="node-check">
    <rect x="70" y="300" width="460" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <polygon points="300,314 326,340 300,366 274,340" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <text x="300" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">?</text>
    
    <text x="300" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Exception raised?</text>
  </g>

  
  <g id="node-else">
    <rect x="70" y="500" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 300 514 Q 324 514 324 532 Q 324 554 300 564 Q 276 554 276 532 Q 276 514 300 514 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 289 537 L 297 544 L 312 529" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="300" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Run else: block</text>
    <text x="300" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(only if try succeeded)</text>
  </g>

  
  <g id="node-match">
    <rect x="590" y="300" width="520" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="828" cy="342" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="872" cy="326" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="872" cy="358" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 834 342 L 850 342 Q 858 342 862 334 L 866 328" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 850 342 Q 858 342 862 350 L 866 356" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="850" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Matches except Exc as var?</text>
  </g>

  
  <g id="node-handler">
    <rect x="565" y="500" width="570" height="210" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <circle cx="850" cy="542" r="16" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="850" y1="520" x2="850" y2="524" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="850" y1="560" x2="850" y2="564" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="828" y1="542" x2="832" y2="542" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="868" y1="542" x2="872" y2="542" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="834" y1="526" x2="837" y2="529" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="863" y1="555" x2="866" y2="558" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="834" y1="558" x2="837" y2="555" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="863" y1="529" x2="866" y2="526" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    
    <text x="850" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Run except block</text>
    <text x="850" y="640" font-family="ui-monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">(sys.exception() / var.__cause__)</text>
    <text x="850" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">then auto-run: del var</text>
  </g>

  
  <g id="node-finally-unwind">
    <rect x="1170" y="500" width="370" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1355" cy="542" r="24" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 1355 556 L 1355 528" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 1344 538 L 1355 526 L 1366 538" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="1355" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Run finally: block</text>
    <text x="1355" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">and propagate exception</text>
    <text x="1355" y="678" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">upward</text>
  </g>

  
  <g id="node-finally-ok">
    <rect x="280" y="780" width="580" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="570" cy="818" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 563 806 L 579 818 L 563 830 Z" fill="#207448" stroke="#207448" stroke-width="2" stroke-linejoin="round" />
    
    <text x="570" y="878" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Run finally: block</text>
    <text x="570" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">and continue after try</text>
  </g>
</svg>