<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Inheritance versus delegation</title>
  <desc>Visual comparison of inheritance (is-a), where class Manager points up to superclass class Person, versus delegation (like-a), where class Wrapper holds an attribute pointing at a wrapped object and forwards calls to it through __getattr__, with the takeaway: inherit to specialise, delegate to wrap.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f8f5" />

  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Inheritance versus delegation</text>

  <g id="left-panel">
    <rect x="60" y="105" width="710" height="675" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <rect x="100" y="130" width="630" height="60" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="415" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">Inheritance (is-a)</text>

    <g id="box-person">
      <rect x="150" y="230" width="530" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <g transform="translate(185, 272)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="18" r="12" />
        <path d="M 10 48 C 10 36 18 34 28 34 C 38 34 46 36 46 48" />
      </g>
      <text x="270" y="312" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">class Person</text>
    </g>

    <path d="M 415 570 L 415 382" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />

    <g id="box-manager">
      <rect x="150" y="570" width="530" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <g transform="translate(185, 612)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="18" r="12" />
        <path d="M 10 48 C 10 36 18 34 28 34 C 38 34 46 36 46 48" />
        <line x1="28" y1="34" x2="28" y2="44" />
        <polygon points="26,44 30,44 32,52 28,54 24,52" fill="#207448" />
      </g>
      <text x="270" y="652" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">class Manager</text>
    </g>
  </g>

  <g id="right-panel">
    <rect x="830" y="105" width="710" height="675" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <rect x="870" y="130" width="630" height="60" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1185" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">Delegation (like-a)</text>

    <g id="box-wrapper">
      <rect x="920" y="230" width="530" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <g transform="translate(955, 272)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="48" height="48" rx="8" />
        <rect x="16" y="16" width="24" height="24" rx="4" stroke-dasharray="4 4" />
      </g>
      <text x="1040" y="312" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">class Wrapper</text>
    </g>

    <path d="M 975 370 L 975 558" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <path d="M 1395 370 L 1395 558" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    <g id="note-attribute">
      <line x1="975" y1="425" x2="1025" y2="425" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
      <rect x="1025" y="396" width="320" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1185" y="433" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">holds an attribute</text>
    </g>

    <g id="note-forward">
      <line x1="1345" y1="515" x2="1395" y2="515" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4" />
      <rect x="1015" y="476" width="330" height="78" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="2" />
      <text x="1180" y="508" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">forwards calls to it</text>
      <text x="1180" y="538" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">through <tspan font-family="monospace" font-weight="bold" fill="#207448">__getattr__</tspan></text>
    </g>

    <g id="box-wrapped">
      <rect x="920" y="570" width="530" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <g transform="translate(955, 612)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 50 18 L 28 30 L 6 18 Z" />
        <path d="M 6 18 L 6 42 L 28 54 L 28 30" />
        <path d="M 50 18 L 50 42 L 28 54" />
      </g>
      <text x="1040" y="652" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">wrapped object</text>
    </g>
  </g>

  <g id="bottom-bar">
    <rect x="60" y="805" width="1480" height="65" rx="12" fill="#207448" />
    <text x="800" y="847" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">inherit to specialise, delegate to wrap</text>
  </g>
</svg>