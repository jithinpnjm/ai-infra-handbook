<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Fixtures: how pytest hands setup to a test, and how long it lives</title>
  <desc>Infographic explaining how pytest matches fixtures to test parameters by name, fixture scopes from function to session, built-in fixtures, conftest.py, and state leak prevention.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <polygon points="0 2, 14 7, 0 12" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Fixtures: how pytest hands setup to a test, and how long it lives</text>

  

  
  <rect x="40" y="115" width="550" height="565" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(65, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="14" width="48" height="34" rx="6"/>
    <path d="M18 14 V8 a4 4 0 0 1 4 -4 h12 a4 4 0 0 1 4 4 v6"/>
    <line x1="28" y1="26" x2="28" y2="34"/>
  </g>
  <text x="135" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Example fixtures</text>

  
  <rect x="60" y="190" width="510" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="80" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" fill="#207448">env: monkeypatch.setenv(</tspan>
    <tspan x="100" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FLEET_TOKEN, test-token) and</tspan>
    <tspan x="100" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">delenv(FLEET_CONFIG,</tspan>
    <tspan x="100" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">raising=False): </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif">undone</tspan>
    <tspan x="80" y="336" font-family="system-ui, -apple-system, sans-serif">automatically after the test</tspan>
  </text>

  
  <rect x="60" y="365" width="510" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="80" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" fill="#207448">workdir: monkeypatch.</tspan>
    <tspan x="80" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">chdir(tmp_path) and</tspan>
    <tspan x="80" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">return tmp_path</tspan>
  </text>

  
  <rect x="60" y="485" width="510" height="175" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <text font-size="24" fill="#303a36">
    <tspan x="80" y="520" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" fill="#db8129">kind_cluster, scope=session:</tspan>
    <tspan x="80" y="550" font-family="system-ui, -apple-system, sans-serif">create_kind_cluster() is expensive</tspan>
    <tspan x="80" y="580" font-family="system-ui, -apple-system, sans-serif">and shared; yield name;</tspan>
    <tspan x="80" y="610" font-family="system-ui, -apple-system, sans-serif">delete_kind_cluster(name) teardown</tspan>
    <tspan x="80" y="640" font-family="system-ui, -apple-system, sans-serif">always runs, even when the test fails</tspan>
  </text>

  
  <rect x="1120" y="115" width="440" height="185" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1145, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="40" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <line x1="14" y1="12" x2="16" y2="12"/>
    <line x1="22" y1="12" x2="24" y2="12"/>
    <path d="M18 30 l-4 4 4 4"/>
    <path d="M38 30 l4 4 -4 4"/>
  </g>
  <text x="1215" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1215" y="190">test function with a</tspan>
    <tspan x="1215" y="230">parameter named env</tspan>
  </text>

  
  <g>
    
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="855" y="145">pytest matches a fixture to a test</tspan>
      <tspan x="855" y="173">by parameter name:</tspan>
      <tspan x="855" y="201">an argument named env</tspan>
      <tspan x="855" y="229">gets the fixture called env</tspan>
    </text>
    
    <line x1="590" y1="248" x2="1116" y2="248" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>
  </g>

  

  
  <rect x="610" y="320" width="490" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(635, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="12" y1="6" x2="12" y2="48"/>
    <line x1="38" y1="6" x2="38" y2="48"/>
    <line x1="12" y1="16" x2="38" y2="16"/>
    <line x1="12" y1="27" x2="38" y2="27"/>
    <line x1="12" y1="38" x2="38" y2="38"/>
  </g>
  <text x="695" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="695" y="358">Scope ladder</tspan>
    <tspan x="695" y="390">from narrow to wide</tspan>
  </text>

  
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">
    
    <rect x="635" y="410" width="440" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="855" y="435" text-anchor="middle" fill="#207448">session</text>

    
    <rect x="655" y="450" width="400" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="855" y="475" text-anchor="middle" fill="#207448">module</text>

    
    <rect x="675" y="490" width="360" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="855" y="515" text-anchor="middle" fill="#207448">class</text>

    
    <rect x="695" y="530" width="320" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="855" y="556" text-anchor="middle" fill="#207448">function (default)</text>
  </g>

  
  <rect x="635" y="585" width="440" height="75" rx="10" fill="#207448"/>
  <text x="855" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="855" y="618">use the narrowest scope</tspan>
    <tspan x="855" y="646">you can afford</tspan>
  </text>

  
  <rect x="1120" y="320" width="440" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="1140" y="340" width="400" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="1160" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" fill="#207448">built-in fixtures:</tspan>
    <tspan x="1160" y="407" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tmp_path, monkeypatch,</tspan>
    <tspan x="1160" y="439" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">capsys, capfd, caplog,</tspan>
    <tspan x="1160" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">request, tmp_path_factory</tspan>
  </text>

  
  <rect x="1140" y="530" width="400" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text font-size="24" fill="#303a36">
    <tspan x="1160" y="568" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" fill="#207448">conftest.py shares fixtures</tspan>
    <tspan x="1160" y="602" font-family="system-ui, -apple-system, sans-serif">across a directory</tspan>
    <tspan x="1160" y="634" font-family="system-ui, -apple-system, sans-serif">without imports</tspan>
  </text>

  

  <rect x="40" y="700" width="1520" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 715)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 6 L48 14 v16 c0 14 -20 22 -20 22 s-20 -8 -20 -22 V14 Z"/>
    <line x1="28" y1="20" x2="28" y2="34"/>
    <circle cx="28" cy="42" r="2" fill="#207448"/>
  </g>
  <text x="135" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Leak story strip</text>

  
  <rect x="65" y="775" width="460" height="255" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <circle cx="105" cy="815" r="22" fill="#db8129"/>
  <text x="105" y="823" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" y="822" font-weight="bold" fill="#db8129">the classic leak:</tspan>
    <tspan x="85" y="860">a test mutates a module-level</tspan>
    <tspan x="85" y="894">dict or a default argument, and</tspan>
    <tspan x="85" y="928">a later test fails for an</tspan>
    <tspan x="85" y="962">unrelated-looking reason;</tspan>
  </text>

  
  <rect x="555" y="775" width="490" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="595" cy="815" r="22" fill="#207448"/>
  <text x="595" y="823" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="630" y="822" font-weight="bold" fill="#207448">fix with fixtures that build</tspan>
    <tspan x="575" y="860">fresh objects and monkeypatch</tspan>
    <tspan x="575" y="894">instead of assigning globals;</tspan>
    <tspan x="575" y="940" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" fill="#207448">run pytest-randomly in CI;</tspan>
  </text>

  
  <rect x="1075" y="775" width="465" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1115" cy="815" r="22" fill="#207448"/>
  <text x="1115" y="823" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1150" y="822" font-weight="bold" fill="#207448">never share mutable</tspan>
    <tspan x="1095" y="860">state through a session</tspan>
    <tspan x="1095" y="894">fixture unless it is reset</tspan>
    <tspan x="1095" y="928">for each test</tspan>
  </text>

  

  <rect x="40" y="1075" width="1520" height="75" rx="12" fill="#207448"/>
  
  
  <g transform="translate(70, 1088)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 24 A14 14 0 1 1 28 38"/>
    <polyline points="4 24 12 24 12 16"/>
  </g>
  <text x="800" y="1123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Each fixture undoes its own changes</text>

</svg>