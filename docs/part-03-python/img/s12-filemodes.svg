<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>File open modes</title>
  <desc>Visual infographic explaining file open mode letters and their meanings alongside an annotated open function call example.</desc>

  <defs>
