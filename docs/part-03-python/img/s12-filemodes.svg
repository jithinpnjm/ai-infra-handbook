  </g>
  <text x="250" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">read (the default)</text>

  
  <rect x="60" y="275" width="700" height="95" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <rect x="80" y="287.5" width="70" height="70" rx="14" fill="#db8129"/>
  <text x="115" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">w</text>
