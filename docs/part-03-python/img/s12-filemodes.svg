  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">File open modes</text>

  
  <rect x="40" y="110" width="1520" height="425" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  

  
