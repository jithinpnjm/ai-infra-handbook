<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>nonlocal rebinds an enclosing variable</title>
  <desc>Visual infographic explaining how nonlocal rebinds an enclosing variable compared to without nonlocal.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">nonlocal rebinds an enclosing variable</text>

  
  <rect x="60" y="130" width="710" height="680" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="415" y="195" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Without nonlocal</text>

  
  <rect x="90" y="240" width="650" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(120, 275)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3"/>
    <circle cx="12" cy="9" r="3" fill="#207448"/>
    <circle cx="22" cy="9" r="3" fill="#207448"/>
    <polyline points="18,32 26,40 18,48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="205" y="327" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">outer() with count = 0</text>

  
  <rect x="90" y="420" width="650" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(120, 455)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="6" x2="28" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="42" x2="28" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="28" x2="14" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="42" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="205" y="507" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">inner() doing count += 1</text>

  
  <rect x="90" y="600" width="650" height="180" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(120, 642)">
    <polygon points="28,6 52,50 4,50" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="22" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="43" r="2.5" fill="#db8129"/>
  </g>
  <text x="205" y="648" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="205" dy="0">which creates a local name</tspan>
    <tspan x="205" dy="40">so it fails with</tspan>
    <tspan font-family="monospace" font-size="28" font-weight="bold" fill="#db8129"> UnboundLocalError</tspan>
  </text>

  
  <rect x="830" y="130" width="710" height="680" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1185" y="195" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">With nonlocal count</text>

  
  <rect x="860" y="240" width="650" height="540" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1157, 390)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 12 28 L 24 40 L 44 16" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1185" y="520" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#303a36">
    <tspan x="1185" dy="0">inner() rebinds the count</tspan>
    <tspan x="1185" dy="54">of outer(), </tspan>
    <tspan font-weight="bold" fill="#207448">so it works</tspan>
  </text>

  
  <rect x="60" y="855" width="1480" height="75" rx="14" fill="#207448"/>
  <text x="800" y="902" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">nonlocal names an enclosing function variable, global names a module variable.</text>
</svg>