<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Watching the test suite itself: five things to track</title>
  <desc>A dashboard infographic highlighting five key test suite metrics to track along with artifact retention and a bottom takeaway.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="60" y="88" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Watching the test suite itself: five things to track</text>

  
  <g id="tile-duration">
    <rect x="60" y="140" width="470" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="28" r="22" />
      <polyline points="26,14 26,28 36,28" />
      <line x1="26" y1="6" x2="26" y2="1" />
      <line x1="21" y1="1" x2="31" y2="1" />
    </g>
    
    <text x="155" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Duration over time:</text>
    
    <text x="85" y="252" font-family="sans-serif" font-size="24" fill="#303a36">fail slow tests loudly</text>
    <text x="85" y="288" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">with </tspan>
      <tspan font-family="monospace">--durations</tspan>
      <tspan font-family="sans-serif">;</tspan>
    </text>
    <text x="85" y="324" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">parallelise with </tspan>
      <tspan font-family="monospace">xdist</tspan>
    </text>
    <text x="85" y="360" font-family="sans-serif" font-size="24" fill="#303a36">when isolation allows</text>
  </g>

  
  <g id="tile-flake">
    <rect x="570" y="140" width="470" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(595, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="46" height="46" rx="8" />
      <circle cx="16" cy="16" r="3" fill="#207448" />
      <circle cx="36" cy="16" r="3" fill="#207448" />
      <circle cx="26" cy="26" r="3" fill="#207448" />
      <circle cx="16" cy="36" r="3" fill="#207448" />
      <circle cx="36" cy="36" r="3" fill="#207448" />
    </g>
    
    <text x="665" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Flake rate:</text>
    
    <text x="595" y="260" font-family="sans-serif" font-size="24" fill="#303a36">how often tests flake</text>
  </g>

  
  <g id="tile-diff-coverage">
    <rect x="60" y="430" width="470" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 455)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26,3 L46,11 L46,26 C46,38 26,49 26,49 C26,49 6,38 6,26 L6,11 Z" />
      <line x1="26" y1="14" x2="26" y2="38" />
      <line x1="14" y1="26" x2="38" y2="26" />
    </g>
    
    <text x="155" y="492" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Diff coverage:</text>
    
    <text x="85" y="545" font-family="sans-serif" font-size="24" fill="#303a36">how much of the changed</text>
    <text x="85" y="583" font-family="sans-serif" font-size="24" fill="#303a36">code the tests cover, using</text>
    <text x="85" y="621" font-family="monospace" font-size="24" fill="#303a36">diff-cover</text>
  </g>

  
  <g id="tile-time-to-green">
    <rect x="570" y="430" width="470" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(595, 455)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="22" />
      <polyline points="15,27 23,35 37,17" />
    </g>
    
    <text x="665" y="492" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Time-to-green</text>
    
    <g transform="translate(595, 550)">
      <line x1="15" y1="35" x2="400" y2="35" stroke="#207448" stroke-width="6" stroke-linecap="round" />
      <circle cx="30" cy="35" r="14" fill="#207448" />
      <circle cx="160" cy="35" r="14" fill="#207448" />
      <circle cx="290" cy="35" r="14" fill="#207448" />
      <circle cx="395" cy="35" r="18" fill="#207448" />
      <polyline points="388,35 393,40 403,30" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  
  <g id="tile-pipeline-length">
    <rect x="60" y="720" width="980" height="190" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(85, 745)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="16" width="12" height="20" rx="3" />
      <line x1="14" y1="26" x2="20" y2="26" />
      <rect x="20" y="16" width="12" height="20" rx="3" />
      <line x1="32" y1="26" x2="38" y2="26" />
      <rect x="38" y="16" width="12" height="20" rx="3" />
    </g>
    
    <text x="155" y="780" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Pipeline length:</text>
    
    <text x="85" y="830" font-family="sans-serif" font-size="24" fill="#303a36">keep under about ten minutes for PR feedback,</text>
    <text x="85" y="868" font-family="sans-serif" font-size="24" fill="#303a36">or split and shard</text>
  </g>

  
  <g id="side-strip">
    <rect x="1080" y="140" width="460" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1115, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10,48 L10,6 L34,6 L46,18 L46,48 Z" />
      <polyline points="34,6 34,18 46,18" />
      <line x1="18" y1="28" x2="38" y2="28" />
      <line x1="18" y1="36" x2="32" y2="36" />
    </g>
    
    <text x="1115" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">keep logs and JUnit</text>
    <text x="1115" y="312" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">reports as artefacts;</text>
    <text x="1115" y="375" font-family="sans-serif" font-size="24" fill="#303a36">print reproduction commands</text>
    <text x="1115" y="415" font-family="sans-serif" font-size="24" fill="#303a36">for failing tests,</text>
    <text x="1115" y="455" font-family="sans-serif" font-size="24" fill="#303a36">including seed values</text>
    <text x="1115" y="495" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">and </tspan>
      <tspan font-family="monospace">pytest -k hints</tspan>
    </text>
    
    <g transform="translate(1115, 545)">
      <rect x="0" y="0" width="390" height="320" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="25" y="25" width="340" height="40" rx="6" fill="#e8f1ea" />
      <circle cx="50" cy="45" r="8" fill="#207448" />
      <line x1="75" y1="45" x2="220" y2="45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <rect x="25" y="85" width="340" height="210" rx="6" fill="#f5f8f5" stroke="#d0e2d4" stroke-width="1.5" />
      <line x1="45" y1="120" x2="320" y2="120" stroke="#207448" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="45" y1="155" x2="260" y2="155" stroke="#207448" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="45" y1="190" x2="300" y2="190" stroke="#207448" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="45" y1="225" x2="210" y2="225" stroke="#207448" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="45" y1="260" x2="280" y2="260" stroke="#207448" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="60" y="945" width="1480" height="70" rx="10" fill="#207448" />
    <text x="800" y="989" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">A suite that nobody watches creeps</text>
  </g>
</svg>