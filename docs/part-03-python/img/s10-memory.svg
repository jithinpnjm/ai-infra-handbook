<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Where training memory goes</title>
  <desc>Visual infographic explaining model training memory per parameter and worked example for a 7B model.</desc>

  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Where training memory goes</text>

  
  <g id="left-panel">
    <rect x="40" y="110" width="740" height="735" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(65, 132)">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="20" y1="2" x2="20" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="2" x2="36" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="48" x2="20" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="48" x2="36" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="20" x2="54" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="36" x2="54" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="135" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">per parameter</text>

    
    <rect x="65" y="210" width="16" height="610" rx="8" fill="#c3dbc8"/>
    <rect x="65" y="210" width="16" height="135" rx="8" fill="#207448"/>
    <rect x="65" y="360" width="16" height="110" rx="8" fill="#2d965e"/>
    <rect x="65" y="485" width="16" height="135" rx="8" fill="#38b273"/>
    <rect x="65" y="635" width="16" height="185" rx="8" fill="#134e2f"/>

    
    <g id="segment-weights">
      <rect x="95" y="210" width="660" height="135" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(115, 250)">
        <rect x="6" y="14" width="20" height="28" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
        <rect x="30" y="6" width="20" height="36" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="16" y1="24" x2="16" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="40" y1="18" x2="40" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="190" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">weights 2 bytes in bf16</text>
      <text x="190" y="305" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">plus a 4-byte fp32 master copy</text>
    </g>

    
    <g id="segment-gradients">
      <rect x="95" y="360" width="660" height="110" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(115, 387)">
        <line x1="8" y1="46" x2="48" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="8" y1="46" x2="46" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <polyline points="30,10 46,10 46,26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="190" y="427" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">gradients 2 to 4 bytes</text>
    </g>

    
    <g id="segment-optimiser-states">
      <rect x="95" y="485" width="660" height="135" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(115, 525)">
        <circle cx="28" cy="28" r="10" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="6" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="44" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="12" x2="17" y2="17" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="39" y1="39" x2="44" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="44" x2="17" y2="39" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="39" y1="17" x2="44" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="190" y="540" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">optimiser states 8 bytes</text>
      <text x="190" y="580" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">(two fp32 moments)</text>
    </g>

    
    <g id="segment-total">
      <rect x="95" y="635" width="660" height="185" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      <g transform="translate(115, 700)">
        <path d="M 44,10 L 12,10 L 28,28 L 12,46 L 44,46" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="190" y="710" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">total about 16 bytes</text>
      <text x="190" y="755" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">per parameter before activations</text>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="820" y="110" width="740" height="735" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(845, 132)">
      <rect x="8" y="6" width="40" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="18" y1="18" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="32" r="2.5" fill="#207448"/>
      <circle cx="36" cy="32" r="2.5" fill="#207448"/>
      <circle cx="20" cy="42" r="2.5" fill="#207448"/>
      <circle cx="36" cy="42" r="2.5" fill="#207448"/>
    </g>
    <text x="915" y="172" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">worked example</text>

    
    <g id="calc-node">
      <rect x="850" y="210" width="680" height="235" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(875, 300)">
        <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="18" y1="18" x2="38" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="38" y1="18" x2="18" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="955" y="310" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">7 billion parameters</text>
      <text x="955" y="365" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">x 16 B = 112 GB</text>
    </g>

    
    <g id="gpu-highlight-node">
      <rect x="850" y="485" width="680" height="335" rx="12" ry="12" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
      
      
      <g transform="translate(875, 625)">
        <rect x="6" y="10" width="44" height="36" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
        <circle cx="21" cy="28" r="6" fill="none" stroke="#db8129" stroke-width="3"/>
        <circle cx="35" cy="28" r="6" fill="none" stroke="#db8129" stroke-width="3"/>
        <line x1="14" y1="46" x2="14" y2="52" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="22" y1="46" x2="22" y2="52" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="46" x2="30" y2="52" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="38" y1="46" x2="38" y2="52" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="6" y1="18" x2="2" y2="18" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="6" y1="38" x2="2" y2="38" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <text x="955" y="660" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">more than one 80 GB GPU</text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="875" width="1520" height="85" rx="12" ry="12" fill="#207448"/>
    
    <g transform="translate(70, 890)">
      <circle cx="20" cy="22" r="14" fill="none" stroke="#ffffff" stroke-width="4"/>
      <line x1="30" y1="32" x2="48" y2="50" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="44" x2="48" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="800" y="928" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Note: this is why FSDP and ZeRO shard</text>
  </g>
</svg>