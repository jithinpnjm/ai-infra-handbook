<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Numeric types and the quiet traps they hide</title>
  <desc>Visual guide to Python numeric types, operator quirks, worked examples, and defensive arithmetic practices.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Numeric types and the quiet traps they hide</text>

  
  <rect x="40" y="98" width="940" height="618" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="55" y="112" width="910" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="88" y1="126" x2="84" y2="178"/>
    <line x1="108" y1="126" x2="104" y2="178"/>
    <line x1="76" y1="142" x2="120" y2="142"/>
    <line x1="74" y1="160" x2="118" y2="160"/>
  </g>
  <text x="145" y="145" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">int: </tspan>arbitrary precision, no overflow;
    <tspan x="145" dy="28" font-family="monospace">0x1f, 0o17, 0b101, 1_000_000</tspan>
  </text>

  
  <rect x="55" y="202" width="910" height="124" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 74 250 Q 86 230, 98 250 T 122 250"/>
    <circle cx="98" cy="282" r="5" fill="#207448"/>
    <line x1="74" y1="282" x2="86" y2="282"/>
    <line x1="110" y1="282" x2="122" y2="282"/>
  </g>
  <text x="145" y="230" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">float: </tspan>IEEE 754 double, about 15 to 17 significant digits;
    <tspan x="145" dy="28" font-family="monospace">0.1 + 0.2 != 0.3, use math.isclose;</tspan>
    <tspan x="145" dy="28" font-family="monospace">float(&quot;inf&quot;), nan never equals itself</tspan>
  </text>

  
  <rect x="55" y="336" width="910" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="74" y1="388" x2="122" y2="388"/>
    <line x1="84" y1="394" x2="84" y2="346"/>
    <line x1="84" y1="388" x2="114" y2="356"/>
    <circle cx="114" cy="356" r="4" fill="#207448"/>
  </g>
  <text x="145" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">complex: </tspan>3 + 4j, rarely used in infra
  </text>

  
  <rect x="55" y="418" width="910" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="440" width="48" height="28" rx="14"/>
    <circle cx="108" cy="454" r="8" fill="#207448"/>
  </g>
  <text x="145" y="462" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">bool: </tspan>subclass of int, True == 1, True + True == 2
  </text>

  
  <rect x="55" y="500" width="910" height="114" rx="8" fill="#fdf5eb" stroke="#db8129" stroke-width="2.5"/>
  
  <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="98" cy="557" r="22"/>
    <line x1="98" y1="543" x2="98" y2="571"/>
    <path d="M 104 548 C 94 545 92 555 98 557 C 104 559 102 569 92 566"/>
  </g>
  <text x="145" y="546" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#db8129">decimal.Decimal: </tspan>exact decimal arithmetic for money and billing;
    <tspan x="145" dy="30">construct from strings</tspan>
  </text>

  
  <rect x="55" y="624" width="910" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="98" cy="642" r="5" fill="#207448"/>
    <line x1="80" y1="660" x2="116" y2="660"/>
    <circle cx="98" cy="678" r="5" fill="#207448"/>
  </g>
  <text x="145" y="668" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">fractions.Fraction: </tspan>exact rational numbers
  </text>

  
  <rect x="1010" y="98" width="550" height="618" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1034" y="116" width="52" height="52" rx="8"/>
    <line x1="1046" y1="132" x2="1058" y2="132"/>
    <line x1="1052" y1="126" x2="1052" y2="138"/>
    <line x1="1066" y1="132" x2="1076" y2="132"/>
    <line x1="1066" y1="152" x2="1076" y2="152"/>
    <line x1="1066" y1="158" x2="1076" y2="158"/>
  </g>
  <text x="1104" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Operators</text>

  
  <rect x="1026" y="180" width="518" height="46" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="211" font-family="sans-serif" font-size="24" fill="#303a36">/ is always true division (float)</text>

  
  <rect x="1026" y="234" width="518" height="66" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="261" font-family="sans-serif" font-size="24" fill="#303a36">
    // floors toward negative infinity:
    <tspan x="1040" dy="27" font-family="monospace">-7 // 2 == -4</tspan>
  </text>

  
  <rect x="1026" y="308" width="518" height="46" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="339" font-family="sans-serif" font-size="24" fill="#303a36">% takes the sign of the divisor</text>

  
  <rect x="1026" y="362" width="518" height="46" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="393" font-family="monospace" font-size="24" fill="#303a36">divmod(a, b)</text>

  
  <rect x="1026" y="416" width="518" height="66" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="443" font-family="sans-serif" font-size="24" fill="#303a36">
    round() rounds half to even:
    <tspan x="1040" dy="27" font-family="monospace">round(2.5) == 2</tspan>
  </text>

  
  <rect x="1026" y="490" width="518" height="46" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="521" font-family="sans-serif" font-size="24" fill="#303a36">chained comparison 1 &lt;= x &lt; 10</text>

  
  <rect x="1026" y="544" width="518" height="66" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="571" font-family="sans-serif" font-size="24" fill="#303a36">
    bitwise &amp; | ^ ~ &lt;&lt; &gt;&gt; for IP
    <tspan x="1040" dy="27">and mask: 0xFF &amp; addr</tspan>
  </text>

  
  <rect x="1026" y="618" width="518" height="66" rx="6" fill="#ffffff" stroke="#cbdcd0" stroke-width="1"/>
  <text x="1040" y="645" font-family="sans-serif" font-size="24" fill="#303a36">
    random is not for security,
    <tspan x="1040" dy="27">use secrets</tspan>
  </text>

  
  
  <rect x="40" y="740" width="745" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="88" cy="785" rx="22" ry="9"/>
    <line x1="66" y1="785" x2="66" y2="825"/>
    <line x1="110" y1="785" x2="110" y2="825"/>
    <path d="M 66 825 A 22 9 0 0 0 110 825"/>
    <path d="M 66 805 A 22 9 0 0 0 110 805" stroke-width="3"/>
  </g>
  <text x="135" y="798" font-family="sans-serif" font-size="24" fill="#303a36">
    disk_bytes / gib with gib = 1024 ** 3 gives
    <tspan x="135" dy="32">3577.0 GiB for 3_840_755_982_336 bytes</tspan>
  </text>

  
  <rect x="815" y="740" width="745" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 843 822 A 22 22 0 1 1 887 822"/>
    <line x1="865" y1="822" x2="879" y2="798"/>
    <circle cx="865" cy="822" r="4" fill="#207448"/>
  </g>
  <text x="910" y="798" font-family="sans-serif" font-size="24" fill="#303a36">
    free_pct = 100 * free / total if total
    <tspan x="910" dy="32">else 0.0 guards divide by zero</tspan>
  </text>

  
  <rect x="40" y="895" width="745" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="88" cy="962" r="22"/>
    <polyline points="88,948 88,962 98,962"/>
  </g>
  <text x="135" y="970" font-family="monospace" font-size="24" fill="#303a36">timeout = base * 2 ** attempt</text>

  
  <rect x="815" y="895" width="745" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="855" y="942" width="28" height="36" rx="4"/>
    <rect x="847" y="950" width="28" height="36" rx="4" fill="#ffffff"/>
    <line x1="853" y1="960" x2="867" y2="960" stroke-width="2"/>
    <line x1="853" y1="968" x2="867" y2="968" stroke-width="2"/>
    <line x1="853" y1="976" x2="863" y2="976" stroke-width="2"/>
  </g>
  <text x="910" y="970" font-family="monospace" font-size="24" fill="#303a36">pages, rem = divmod(total_items, 100)</text>

  
  <rect x="40" y="1055" width="1520" height="105" rx="10" fill="#207448"/>
  <text x="800" y="1098" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    Compare floats with tolerance, use // versus / on purpose,
    <tspan x="800" dy="34">remember bool is an int, and use the ipaddress module instead of string IP arithmetic</tspan>
  </text>
</svg>