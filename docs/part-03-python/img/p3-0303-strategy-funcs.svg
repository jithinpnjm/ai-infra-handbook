<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Strategy pattern: from three classes to three functions and a registry</title>
  <desc>Visual comparison showing how first-class functions and decorators simplify the classic Gang of Four Strategy pattern from multiple boilerplate classes into plain functions, meta-strategies, and a decorator registry.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .panel-classic { fill: #e8f1ea; stroke: #207448; stroke-width: 2; rx: 12; }
      .panel-func { fill: #e8f1ea; stroke: #db8129; stroke-width: 3; rx: 12; }
      .card-white { fill: #ffffff; stroke: #207448; stroke-width: 1.5; rx: 8; }
      .card-critique { fill: #ffffff; stroke: #207448; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 8; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; }
      .header-classic { font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: bold; fill: #303a36; }
      .header-func { font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: bold; fill: #db8129; }
      .text-section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: bold; fill: #207448; }
      .t-sans { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; fill: #303a36; }
      .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; fill: #303a36; }
      .icon-classic { stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .icon-func { stroke: #db8129; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  
  <rect width="100%" height="100%" class="bg" />

  
  <text x="800" y="48" text-anchor="middle" class="text-title">
    <tspan x="800" dy="0">Strategy pattern: from three classes</tspan>
    <tspan x="800" dy="52">to three functions and a registry</tspan>
  </text>

  
  <g id="classic-version-panel">
    <rect x="40" y="135" width="740" height="495" class="panel-classic" />

    
    <g transform="translate(62, 148)">
      <rect x="0" y="0" width="46" height="32" rx="4" class="icon-classic" />
      <line x1="0" y1="11" x2="46" y2="11" class="icon-classic" stroke-width="2.5" />
      <line x1="23" y1="32" x2="23" y2="44" class="icon-classic" stroke-width="2.5" />
      <line x1="8" y1="44" x2="38" y2="44" class="icon-classic" stroke-width="2.5" />
    </g>

    
    <text x="122" y="182" class="header-classic">Classic version</text>

    
    <rect x="60" y="204" width="700" height="102" class="card-white" />
    <text x="80" y="232" class="t-mono">
      <tspan x="80" dy="0">abstract base class Promotion(ABC) with</tspan>
      <tspan x="80" dy="30">@abstractmethod discount(self, order)</tspan>
      <tspan x="80" dy="30">returning Decimal</tspan>
    </text>

    
    <rect x="60" y="318" width="700" height="194" class="card-white" />
    <text x="80" y="344" class="text-section-title">subclasses</text>
    <text x="80" y="372" class="t-mono">
      <tspan x="80" dy="0">FidelityPromo: 5% when</tspan>
      <tspan x="80" dy="26">order.customer.fidelity &gt;= 1000</tspan>
      <tspan x="80" dy="32">BulkItemPromo: 10% on each LineItem</tspan>
      <tspan x="80" dy="26">with item.quantity &gt;= 20</tspan>
      <tspan x="80" dy="32">LargeOrderPromo: 7% when len({item.product</tspan>
      <tspan x="80" dy="26">for item in order.cart}) &gt;= 10</tspan>
    </text>

    
    <rect x="60" y="524" width="700" height="92" class="card-critique" />
    <text x="80" y="550" class="t-sans">
      <tspan x="80" dy="0">no instance state, self is never used;</tspan>
      <tspan x="80" dy="28">usage Order(ann, cart, FidelityPromo())</tspan>
      <tspan x="80" dy="26">is ceremony</tspan>
    </text>
  </g>

  
  <g id="function-version-panel">
    <rect x="820" y="135" width="740" height="495" class="panel-func" />

    
    <g transform="translate(842, 148)">
      <path d="M 12 6 C 24 6, 24 40, 38 40" class="icon-func" />
      <line x1="8" y1="23" x2="28" y2="23" class="icon-func" stroke-width="3" />
      <circle cx="38" cy="14" r="4" class="icon-func" fill="#db8129" />
      <circle cx="38" cy="32" r="4" class="icon-func" fill="#db8129" />
    </g>

    
    <text x="898" y="182" class="header-func">Function version</text>

    
    <rect x="840" y="204" width="700" height="102" class="card-white" />
    <text x="860" y="232" class="t-mono">
      <tspan x="860" dy="0">fidelity_promo, bulk_item_promo,</tspan>
      <tspan x="860" dy="30">large_order_promo as plain functions;</tspan>
      <tspan x="860" dy="30">Order(ann, cart, fidelity_promo)</tspan>
    </text>

    
    <rect x="840" y="318" width="700" height="102" class="card-white" />
    <text x="860" y="346" class="t-mono">
      <tspan x="860" dy="0">meta-strategy best_promo(order) returns</tspan>
      <tspan x="860" dy="30">max(promo(order) for promo in promos)</tspan>
      <tspan x="860" dy="30">used as Order(ann, cart, best_promo)</tspan>
    </text>

    
    <rect x="840" y="432" width="700" height="184" class="card-white" />
    <text x="860" y="458" class="text-section-title">Building the list:</text>
    <text x="860" y="486" class="t-mono">
      <tspan x="860" dy="0">scan globals() or inspect.getmembers:</tspan>
      <tspan x="860" dy="26">both fragile;</tspan>
      <tspan x="860" dy="30">better: @promotion decorator registers</tspan>
      <tspan x="860" dy="26">each strategy as soon as the module imports:</tspan>
      <tspan x="860" dy="26">promos.append(promo); return promo</tspan>
    </text>
  </g>

  
  <g id="lower-strip">
    <rect x="40" y="670" width="1520" height="265" class="panel-classic" />

    
    <g transform="translate(62, 686)">
      <rect x="0" y="4" width="38" height="30" rx="4" class="icon-classic" />
      <line x1="8" y1="19" x2="30" y2="19" class="icon-classic" stroke-width="2.5" />
      <path d="M 42 10 L 50 19 L 42 28" class="icon-classic" stroke-width="2.5" />
    </g>

    
    <text x="126" y="716" class="header-classic">Other patterns shrink too:</text>

    
    <text x="65" y="752" class="t-mono">
      <tspan x="65" dy="0">Command is a plain function, closure or</tspan>
      <tspan x="65" dy="26">functools.partial(deploy, app=api, env=prod);</tspan>
      <tspan x="65" dy="32">MacroCommand __call__ runs each cmd();</tspan>
      <tspan x="65" dy="32">Strategy as sort(key=...) or retry(fn) or</tspan>
      <tspan x="65" dy="26">ACTIONS = {start: start, stop: stop};</tspan>
    </text>

    
    <text x="830" y="752" class="t-mono">
      <tspan x="830" dy="0">registry HANDLERS[event_type] = fn</tspan>
      <tspan x="830" dy="26">through a handler(event_type) decorator,</tspan>
      <tspan x="830" dy="26">dispatch HANDLERS[ev[type]](ev);</tspan>
      <tspan x="830" dy="32">callbacks and hooks such as signal handlers</tspan>
      <tspan x="830" dy="26">and atexit.register;</tspan>
      <tspan x="830" dy="32">__call__ class holds state</tspan>
      <tspan x="830" dy="26">such as a rate limiter</tspan>
    </text>
  </g>

  
  <g id="quote-card">
    <rect x="40" y="975" width="1520" height="75" class="card-white" style="fill: #ffffff; stroke: #207448; stroke-width: 2;" />

    
    <g transform="translate(68, 1014)">
      <path d="M 0 0 C 0 -10, 7 -16, 14 -18 L 14 -12 C 10 -10, 7 -7, 7 0 L 14 0 L 14 12 L 0 12 Z M 19 0 C 19 -10, 26 -16, 33 -18 L 33 -12 C 29 -10, 26 -7, 26 0 L 33 0 L 33 12 L 19 12 Z" fill="#207448" />
    </g>

    <text x="120" y="1008" class="t-sans" font-style="italic">
      <tspan x="120" dy="0">Peter Norvig, 1996: 16 of the 23 Gang-of-Four patterns</tspan>
      <tspan x="120" dy="28">become invisible or simpler with first-class functions</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1090" width="1520" height="65" rx="8" fill="#207448" />
    <text x="800" y="1132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Pass a plain function when there is no state to keep
    </text>
  </g>
</svg>