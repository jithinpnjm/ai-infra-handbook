<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1440" width="1600" height="1440">
  <title>Strategy pattern: from three classes to three functions and a registry</title>
  <desc>Visual comparison of classic Strategy pattern class hierarchy versus first-class functions and decorator registry in Python.</desc>

  <rect width="1600" height="1440" fill="#f5f8f5"/>

  
  <text x="800" y="54" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#207448">Strategy pattern: from three classes</text>
  <text x="800" y="106" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#207448">to three functions and a registry</text>

  
  <g id="classic-panel">
    <rect x="50" y="160" width="720" height="690" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(75, 178)">
      <rect x="0" y="0" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="2"/>
      <line x1="0" y1="26" x2="48" y2="26" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="140" y="208" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Classic version</text>

    
    <rect x="75" y="230" width="670" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="95" y="265" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">Promotion(ABC)</text>
    <text x="95" y="300" font-family="monospace" font-size="24" fill="#303a36">@abstractmethod discount(self, order)</text>
    <text x="95" y="332" font-family="monospace" font-size="24" fill="#303a36">returning Decimal</text>

    
    <rect x="75" y="375" width="670" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="95" y="410" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">FidelityPromo: <tspan font-weight="normal">5% when</tspan></text>
    <text x="95" y="440" font-family="monospace" font-size="24" fill="#207448">order.customer.fidelity &gt;= 1000</text>
    
    <text x="95" y="482" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">BulkItemPromo: <tspan font-weight="normal">10% on each LineItem</tspan></text>
    <text x="95" y="512" font-family="monospace" font-size="24" fill="#207448">with item.quantity &gt;= 20</text>
    
    <text x="95" y="554" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">LargeOrderPromo: <tspan font-weight="normal">7% when</tspan></text>
    <text x="95" y="586" font-family="monospace" font-size="24" fill="#207448">len({item.product for item in order.cart}) &gt;= 10</text>

    
    <rect x="75" y="650" width="670" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="95" y="698" font-family="sans-serif" font-size="24" fill="#303a36">no instance state, self is never used</text>

    
    <rect x="75" y="745" width="670" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="95" y="780" font-family="monospace" font-size="24" fill="#207448">Order(ann, cart, FidelityPromo())</text>
    <text x="95" y="812" font-family="sans-serif" font-size="24" fill="#303a36">is ceremony</text>
  </g>

  
  <g id="function-panel">
    <rect x="830" y="160" width="720" height="690" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(855, 178)">
      <circle cx="24" cy="20" r="18" fill="none" stroke="#db8129" stroke-width="3"/>
      <path d="M16 26 C16 14, 32 26, 32 14" fill="none" stroke="#db8129" stroke-width="3"/>
    </g>
    <text x="920" y="208" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Function version</text>

    
    <rect x="855" y="230" width="670" height="130" rx="10" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5"/>
    <text x="875" y="265" font-family="sans-serif" font-size="24" fill="#303a36">fidelity_promo, bulk_item_promo,</text>
    <text x="875" y="295" font-family="sans-serif" font-size="24" fill="#303a36">large_order_promo as plain functions</text>
    <text x="875" y="335" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">Order(ann, cart, fidelity_promo)</text>

    
    <rect x="855" y="375" width="670" height="150" rx="10" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5"/>
    <text x="875" y="410" font-family="monospace" font-size="24" fill="#303a36">best_promo(order) returns</text>
    <text x="875" y="442" font-family="monospace" font-size="24" fill="#303a36">max(promo(order) for promo in promos)</text>
    <text x="875" y="492" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">Order(ann, cart, best_promo)</text>

    
    <rect x="855" y="540" width="670" height="290" rx="10" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5"/>
    <text x="875" y="575" font-family="sans-serif" font-size="24" fill="#303a36">scan globals() or inspect.getmembers: both fragile</text>
    
    <line x1="875" y1="605" x2="1505" y2="605" stroke="#db8129" stroke-dasharray="6,6" stroke-width="1.5"/>
    
    <text x="875" y="645" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">better: @promotion decorator registers each strategy</text>
    <text x="875" y="680" font-family="sans-serif" font-size="24" fill="#303a36">as soon as the module imports:</text>
    <text x="875" y="725" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">promos.append(promo); return promo</text>
  </g>

  
  <g id="lower-strip">
    <rect x="50" y="870" width="1500" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="910" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Other patterns shrink too:</text>

    
    <g transform="translate(80, 930)">
      <circle cx="10" cy="18" r="5" fill="#207448"/>
      <text x="30" y="24" font-family="sans-serif" font-size="24" fill="#303a36">Command is a plain function, closure or</text>
      <text x="30" y="56" font-family="monospace" font-size="24" fill="#207448">functools.partial(deploy, app=api, env=prod);</text>

      <circle cx="10" cy="105" r="5" fill="#207448"/>
      <text x="30" y="112" font-family="sans-serif" font-size="24" fill="#303a36">MacroCommand <tspan font-family="monospace">__call__</tspan> runs each cmd();</text>

      <circle cx="10" cy="165" r="5" fill="#207448"/>
      <text x="30" y="172" font-family="sans-serif" font-size="24" fill="#303a36">Strategy as sort(key=...) or retry(fn) or</text>
      <text x="30" y="204" font-family="monospace" font-size="24" fill="#207448">ACTIONS = {start: start, stop: stop};</text>
    </g>

    
    <g transform="translate(800, 930)">
      <circle cx="10" cy="18" r="5" fill="#207448"/>
      <text x="30" y="24" font-family="sans-serif" font-size="24" fill="#303a36">registry HANDLERS[event_type] = fn through a</text>
      <text x="30" y="56" font-family="sans-serif" font-size="24" fill="#303a36">handler(event_type) decorator,</text>
      <text x="30" y="88" font-family="monospace" font-size="24" fill="#207448">dispatch HANDLERS[ev[type]](ev);</text>

      <circle cx="10" cy="138" r="5" fill="#207448"/>
      <text x="30" y="145" font-family="sans-serif" font-size="24" fill="#303a36">callbacks and hooks such as signal handlers and atexit.register;</text>

      <circle cx="10" cy="195" r="5" fill="#207448"/>
      <text x="30" y="202" font-family="sans-serif" font-size="24" fill="#303a36">__call__ class holds state such as a rate limiter</text>
    </g>
  </g>

  
  <g id="quote-box">
    <rect x="50" y="1240" width="1500" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="1292" font-family="sans-serif" font-size="25" font-style="italic" fill="#303a36">Peter Norvig, 1996: 16 of the 23 Gang-of-Four patterns become invisible or simpler with first-class functions</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1345" width="1500" height="65" rx="12" fill="#207448"/>
    <text x="800" y="1388" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Pass a plain function when there is no state to keep</text>
  </g>
</svg>