<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Logging rules: who configures, which level, which destination</title>
  <desc>Visual infographic detailing logging best practices, handler destinations, and structured logging.</desc>

  <rect width="1600" height="1500" fill="#f5f8f5"/>

  
  <g id="header">
    <text x="50" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Logging rules: who configures, which level, which destination</text>
    
    
    <rect x="50" y="80" width="1500" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="70" y="113" font-family="sans-serif" font-size="24" fill="#303a36" font-style="italic">
      the useful line scrolled away and the next run overwrote the file
    </text>
    <text x="890" y="113" font-family="monospace" font-size="24" fill="#207448">
      %(asctime)s %(levelname)-8s %(name)s: %(message)s
    </text>
  </g>

  
  <g id="rules-column">
    
    <rect x="50" y="150" width="730" height="1100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="50" y="150" width="730" height="56" rx="12" fill="#e8f1ea"/>
    <rect x="50" y="194" width="730" height="12" fill="#e8f1ea"/>
    
    
    <text x="110" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Rules</text>
    <circle cx="80" cy="178" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M74 178 L78 183 L87 172" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <g transform="translate(70, 225)">
      <rect width="690" height="95" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">print for program output, logging for diagnostics</tspan>
        <tspan x="24" dy="32">with levels, destinations and structure</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 335)">
      <rect width="690" height="185" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">levels DEBUG, INFO, WARNING, ERROR, CRITICAL,</tspan>
        <tspan x="24" dy="32">set through configuration or environment variables,</tspan>
        <tspan x="24" dy="32">not by editing code; setup_logging(verbosity):</tspan>
        <tspan x="24" dy="32">0 gives WARNING, 1 gives INFO, anything higher DEBUG</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 535)">
      <rect width="690" height="125" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="2.5"/>
      <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">use %s placeholders, not f-strings: arguments</tspan>
        <tspan x="24" dy="32">are formatted only when the record</tspan>
        <tspan x="24" dy="32">is emitted</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 675)">
      <rect width="690" height="95" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">one logger per module:</tspan>
        <tspan x="24" dy="32" font-family="monospace">log = logging.getLogger(__name__)</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 785)">
      <rect width="690" height="125" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">libraries get a logger and add logging.NullHandler();</tspan>
        <tspan x="24" dy="32">applications configure handlers once at startup</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 925)">
      <rect width="690" height="125" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">log.error(..., exc_info=True) attaches the current</tspan>
        <tspan x="24" dy="32">traceback; log.exception() inside except does the</tspan>
        <tspan x="24" dy="32">same at ERROR level</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 1065)">
      <rect width="690" height="145" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">do not log inside tight loops at INFO:</tspan>
        <tspan x="24" dy="32">log summaries and sampled details,</tspan>
        <tspan x="24" dy="32">include units</tspan>
      </text>
    </g>
  </g>

  
  <g id="destinations-column">
    
    <rect x="820" y="150" width="730" height="1100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="820" y="150" width="730" height="56" rx="12" fill="#e8f1ea"/>
    <rect x="820" y="194" width="730" height="12" fill="#e8f1ea"/>

    
    <text x="880" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Destinations</text>
    <rect x="848" y="166" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M854 177 L864 177 M861 172 L866 177 L861 182" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

    
    <g transform="translate(840, 225)">
      <rect width="690" height="160" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">stderr is a good default, stdout stays clean</tspan>
        <tspan x="24" dy="32">for data; containers and systemd capture it</tspan>
        <tspan x="24" dy="32">into the journal</tspan>
      </text>
    </g>

    
    <g transform="translate(840, 410)">
      <rect width="690" height="180" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">RotatingFileHandler, TimedRotatingFileHandler,</tspan>
        <tspan x="24" dy="32">SysLogHandler, SocketHandler, QueueHandler</tspan>
        <tspan x="24" dy="32">for non-blocking logging</tspan>
      </text>
    </g>

    
    <g transform="translate(840, 615)">
      <rect width="690" height="120" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">logging.config.dictConfig for declarative</tspan>
        <tspan x="24" dy="32">setups</tspan>
      </text>
    </g>

    
    <g transform="translate(840, 760)">
      <rect width="690" height="140" rx="8" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2"/>
      <text x="24" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">in containers log to stdout and stderr</tspan>
        <tspan x="24" dy="32">and let the platform ship them</tspan>
      </text>
    </g>

    
    <g transform="translate(840, 930)">
      <rect width="690" height="280" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
      
      
      <rect x="50" y="50" width="160" height="170" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <rect x="65" y="70" width="130" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <rect x="65" y="115" width="130" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <rect x="65" y="160" width="130" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="130" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">App</text>

      
      <path d="M225 135 L335 135" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polygon points="345,135 330,127 330,143" fill="#207448"/>

      
      <rect x="360" y="50" width="280" height="170" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <circle cx="410" cy="90" r="16" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="440" y1="90" x2="600" y2="90" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="410" cy="140" r="16" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="440" y1="140" x2="580" y2="140" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="410" cy="190" r="16" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="440" y1="190" x2="610" y2="190" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="500" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Platform Journal</text>
    </g>
  </g>

  
  <g transform="translate(50, 1270)">
    <rect width="1500" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect width="1500" height="42" rx="12" fill="#e8f1ea"/>
    <rect y="30" width="1500" height="12" fill="#e8f1ea"/>
    
    <text x="30" y="32" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Structured logging</text>
    
    <text x="30" y="78" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">JSON lines with fields such as host, job_id and duration_ms; structlog, python-json-logger or a custom Formatter;</tspan>
      <tspan x="30" dy="32">include a correlation or request id; redact secrets and personal data</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1425)">
    <rect width="1500" height="55" rx="8" fill="#207448"/>
    <text x="750" y="37" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Applications configure handlers once, libraries never do
    </text>
  </g>
</svg>