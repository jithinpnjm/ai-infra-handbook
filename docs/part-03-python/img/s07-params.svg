<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Where request data comes from</title>
  <desc>Visual infographic explaining how FastAPI extracts request data into path parameters, query parameters, headers, cookies, and body based on type hints.</desc>

  <defs>
    <marker id="arrowhead-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Where request data comes from</text>

  
  <rect x="60" y="105" width="1480" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <rect x="90" y="125" width="670" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(425, 175)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="12" ry="24" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#207448" stroke-width="3" />
  </g>
  <text x="425" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">GET /nodes/gpu-07?limit=10</text>

  
  <rect x="790" y="125" width="340" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(960, 175)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="-24" y1="-10" x2="24" y2="-10" stroke="#207448" stroke-width="3" />
    <line x1="-14" y1="4" x2="14" y2="4" stroke="#207448" stroke-width="3" />
    <line x1="-14" y1="14" x2="6" y2="14" stroke="#207448" stroke-width="3" />
  </g>
  <text x="960" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">a header</text>

  
  <rect x="1160" y="125" width="350" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1335, 175)">
    <path d="M -8 -22 C -18 -22 -18 -12 -18 -4 C -18 2 -24 4 -24 4 C -24 4 -18 6 -18 12 C -18 20 -18 22 -8 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 8 -22 C 18 -22 18 -12 18 -4 C 18 2 24 4 24 4 C 24 4 18 6 18 12 C 18 20 18 22 8 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1335" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">a JSON body</text>

  
  
  <path d="M 280 330 C 280 405, 192 395, 192 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead-green)" />

  
  <path d="M 520 330 C 520 405, 496 395, 496 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead-green)" />

  
  <path d="M 880 330 C 880 405, 800 395, 800 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead-green)" />

  
  <path d="M 1040 330 C 1040 405, 1104 395, 1104 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead-green)" />

  
  <path d="M 1335 330 C 1335 405, 1408 395, 1408 470" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrowhead-orange)" />

  
  
  <rect x="60" y="470" width="264" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(192, 526)">
    <circle cx="-16" cy="14" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="-14" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="14" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M -10 14 L 10 14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 0 14 C 0 -4, 4 -14, 10 -14" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="192" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="192" dy="0">path</tspan>
    <tspan x="192" dy="38">parameter</tspan>
    <tspan x="192" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">node_id</tspan>
  </text>

  
  <rect x="364" y="470" width="264" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(496, 526)">
    <polygon points="-22,-18 22,-18 8,4 8,20 -8,14 -8,4" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="496" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="496" dy="0">query</tspan>
    <tspan x="496" dy="38">parameter</tspan>
    <tspan x="496" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">limit</tspan>
  </text>

  
  <rect x="668" y="470" width="264" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(800, 526)">
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="-16" y="-16" width="32" height="10" rx="2" fill="#207448" />
    <line x1="-16" y1="4" x2="16" y2="4" stroke="#207448" stroke-width="3" />
    <line x1="-16" y1="12" x2="6" y2="12" stroke="#207448" stroke-width="3" />
  </g>
  <text x="800" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">header</text>

  
  <rect x="972" y="470" width="264" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1104, 526)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="-7" cy="-7" r="3" fill="#207448" />
    <circle cx="8" cy="-5" r="3" fill="#207448" />
    <circle cx="-5" cy="8" r="3" fill="#207448" />
    <circle cx="7" cy="7" r="3" fill="#207448" />
  </g>
  <text x="1104" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">cookie</text>

  
  <rect x="1276" y="470" width="264" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1408, 526)">
    <path d="M 0 -22 L 20 -10 L 20 14 L 0 26 L -20 14 L -20 -10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="0" y1="2" x2="0" y2="26" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="2" x2="20" y2="-10" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="2" x2="-20" y2="-10" stroke="#207448" stroke-width="3" />
  </g>
  <text x="1408" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">body</text>

  
  <rect x="60" y="780" width="1480" height="70" rx="12" fill="#207448" />
  <text x="800" y="824" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">type hints tell FastAPI where and how to read each value.</text>
</svg>