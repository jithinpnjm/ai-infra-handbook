<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Name mangling: two __X attributes that survive side by side</title>
  <desc>Diamond-free multiple inheritance diagram illustrating how Python name mangling rewrites __X to _ClassName__X so that attributes from C1 and C2 survive side by side in the instance dictionary.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Name mangling: two __X attributes</tspan>
    <tspan x="800" dy="56">that survive side by side</tspan>
  </text>

  
  
  <g id="node-class-c1">
    <rect x="40" y="180" width="720" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(65, 212)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="8"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <line x1="12" y1="30" x2="32" y2="30"/>
      <line x1="12" y1="42" x2="44" y2="42"/>
    </g>
    <text x="145" y="224" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Class C1</text>
    <rect x="145" y="244" width="585" height="56" rx="8" fill="#e8f1ea"/>
    <text x="170" y="281" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">self.__X = 88 in meth1</text>
  </g>

  
  <g id="node-class-c2">
    <rect x="840" y="180" width="720" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(865, 212)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="8"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <line x1="12" y1="30" x2="32" y2="30"/>
      <line x1="12" y1="42" x2="44" y2="42"/>
    </g>
    <text x="945" y="224" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Class C2</text>
    <rect x="945" y="244" width="585" height="56" rx="8" fill="#e8f1ea"/>
    <text x="970" y="281" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">self.__X = 99 in metha</text>
  </g>

  
  <line x1="400" y1="320" x2="400" y2="360" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="1200" y1="320" x2="1200" y2="360" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>

  
  <g id="panel-compile-step">
    <rect x="40" y="360" width="1520" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 376)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="16" y2="16"/>
      <line x1="40" y1="40" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="16" y2="40"/>
      <line x1="40" y1="16" x2="45" y2="11"/>
    </g>
    <text x="800" y="405" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">inside a class body the compiler rewrites __X to _ClassName__X</text>
    
    <rect x="65" y="435" width="695" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="412" y="477" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">C1 stores _C1__X</text>
    
    <rect x="840" y="435" width="695" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1187" y="477" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">C2 stores _C2__X</text>
  </g>

  
  <line x1="400" y1="520" x2="400" y2="560" stroke="#207448" stroke-width="3"/>
  <line x1="1200" y1="520" x2="1200" y2="560" stroke="#207448" stroke-width="3"/>

  
  
  <g id="node-class-c3">
    <rect x="40" y="560" width="720" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(65, 612)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="2" width="20" height="16" rx="3"/>
      <line x1="28" y1="18" x2="28" y2="32"/>
      <line x1="12" y1="32" x2="44" y2="32"/>
      <line x1="12" y1="32" x2="12" y2="40"/>
      <line x1="44" y1="32" x2="44" y2="40"/>
      <rect x="4" y="40" width="16" height="14" rx="2"/>
      <rect x="36" y="40" width="16" height="14" rx="2"/>
    </g>
    <text x="420" y="652" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">C3(C1, C2): pass</text>
  </g>

  
  <line x1="760" y1="640" x2="840" y2="640" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>

  
  <g id="box-instance-dict">
    <rect x="840" y="560" width="720" height="160" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(865, 612)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <line x1="28" y1="4" x2="28" y2="52"/>
      <circle cx="16" cy="16" r="4"/>
      <circle cx="40" cy="16" r="4"/>
      <circle cx="16" cy="40" r="4"/>
      <circle cx="40" cy="40" r="4"/>
    </g>
    <text x="1220" y="615" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">{'_C1__X': 88, '_C2__X': 99}</text>
    <text x="1220" y="668" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1220" dy="0">both values survive because</tspan>
      <tspan x="1220" dy="30">the names differ</tspan>
    </text>
  </g>

  
  
  <g id="panel-access-note">
    <rect x="40" y="760" width="720" height="270" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(65, 785)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="22" width="40" height="30" rx="6"/>
      <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22"/>
      <circle cx="28" cy="36" r="3" fill="#207448"/>
      <line x1="28" y1="39" x2="28" y2="45"/>
    </g>
    <text x="145" y="802" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">I._C1__X is still readable: mangling</tspan>
      <tspan x="145" dy="32">prevents collisions in deep hierarchies,</tspan>
      <tspan x="145" dy="32">it does not prevent deliberate access,</tspan>
      <tspan x="145" dy="32">much as Java private fields can be read</tspan>
      <tspan x="145" dy="32">through setAccessible(True) reflection</tspan>
    </text>
  </g>

  
  <g id="panel-convention">
    <rect x="840" y="760" width="720" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(865, 785)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 6 L 36 6 L 46 16 L 46 50 L 10 50 Z"/>
      <path d="M 36 6 L 36 16 L 46 16"/>
      <line x1="18" y1="26" x2="38" y2="26"/>
      <line x1="18" y1="34" x2="38" y2="34"/>
      <line x1="18" y1="42" x2="30" y2="42"/>
    </g>
    <text x="945" y="802" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="945" dy="0">single leading underscore _name: only a</tspan>
      <tspan x="945" dy="32">convention for internal; double leading</tspan>
      <tspan x="945" dy="32">underscore __X: mangled; Python trusts</tspan>
      <tspan x="945" dy="32">programmers, document the public API and</tspan>
      <tspan x="945" dy="32">leave the rest to convention</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1070" width="1520" height="70" rx="12" fill="#207448"/>
    <text x="800" y="1114" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Mangling avoids accidental collisions between subclasses</text>
  </g>
</svg>