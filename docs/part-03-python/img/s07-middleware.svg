<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Layers around a handler</title>
  <desc>Visual infographic showing concentric layers around a handler: middleware on the outside, validation in the middle, and the green handler at the centre, with incoming request and outgoing response arrows, an orange note on 422 errors, and a grey note on exception handlers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
    <clipPath id="clip-orange-card">
      <rect x="100" y="740" width="670" height="150" rx="16" />
    </clipPath>
    <clipPath id="clip-grey-card">
      <rect x="830" y="740" width="670" height="150" rx="16" />
    </clipPath>
  </defs>

  <rect width="1600" height="960" fill="#f5f8f5" />

  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Layers around a handler</text>

  <rect x="320" y="125" width="960" height="565" rx="24" fill="#ffffff" stroke="#207448" stroke-width="3" />

  <g transform="translate(666, 145)">
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 16 L 28 26 L 6 16 Z" />
      <path d="M 6 28 L 28 38 L 50 28" />
      <path d="M 6 40 L 28 50 L 50 40" />
    </g>
    <text x="70" y="38" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">middleware</text>
  </g>

  <rect x="430" y="225" width="740" height="435" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  <g transform="translate(666, 245)">
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 10 L 44 10 C 44 10 46 32 28 48 C 10 32 12 10 12 10 Z" />
      <path d="M 20 28 L 26 34 L 36 22" />
    </g>
    <text x="64" y="38" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">validation</text>
  </g>

  <rect x="550" y="335" width="500" height="295" rx="16" fill="#207448" stroke="#185736" stroke-width="3" />

  <g transform="translate(685, 455)">
    <circle cx="28" cy="28" r="32" fill="#ffffff" />
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10" />
      <path d="M 28 8 V 14 M 28 42 V 48 M 8 28 H 14 M 42 28 H 48 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 18 L 42 14" />
    </g>
    <text x="78" y="39" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff">handler</text>
  </g>

  <line x1="60" y1="482" x2="318" y2="482" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="189" y="460" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">request</text>

  <line x1="1280" y1="482" x2="1538" y2="482" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="1409" y="460" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">response</text>

  <rect x="100" y="740" width="670" height="150" rx="16" fill="#fdf6ee" stroke="#db8129" stroke-width="3" />
  <rect x="100" y="740" width="14" height="150" fill="#db8129" clip-path="url(#clip-orange-card)" />
  <text x="445" y="802" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="445" dy="0">invalid input returns 422</tspan>
    <tspan x="445" dy="38">before the handler runs</tspan>
  </text>

  <rect x="830" y="740" width="670" height="150" rx="16" fill="#f3f4f3" stroke="#7a8882" stroke-width="3" />
  <rect x="830" y="740" width="14" height="150" fill="#7a8882" clip-path="url(#clip-grey-card)" />
  <text x="1175" y="802" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1175" dy="0">exception handlers turn</tspan>
    <tspan x="1175" dy="38">errors into responses</tspan>
  </text>
</svg>