<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Async Testing Anatomy and Cancellation Safety</title>
  <desc>Infographic showing pytest-asyncio test harness anatomy, collaborator and clock injection, and task cancellation error handling.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129" />
    </marker>
    
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#203025" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    Async Testing Anatomy and Cancellation Safety
  </text>

  
  
  
  <rect x="50" y="85" width="1500" height="315" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="80" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    Panel 1 (Test Harness)
  </text>

  
  <g transform="translate(80, 145)">
    <rect width="390" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(320, 20)">
      <path d="M 0 0 L 36 0 L 36 44 L 18 30 L 0 44 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="18" cy="14" r="4" fill="#207448" />
    </g>
    
    <text x="30" y="115" font-family="monospace" font-size="24" fill="#303a36">@pytest.mark.asyncio</text>
    <text x="30" y="155" font-family="sans-serif" font-size="24" fill="#303a36">decorator</text>
  </g>

  
  <line x1="470" y1="260" x2="520" y2="260" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(535, 145)">
    <rect width="430" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(355, 20)">
      <rect x="0" y="0" width="48" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 21 L 20 13 M 12 21 L 20 29" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 36 21 L 28 13 M 36 21 L 28 29" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="24" y="115" font-family="monospace" font-size="24" fill="#303a36">async def</text>
    <text x="24" y="155" font-family="monospace" font-size="24" fill="#303a36">test_worker_timeout()</text>
  </g>

  
  <line x1="965" y1="260" x2="1015" y2="260" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1030, 145)">
    <rect width="490" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(415, 20)">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 24 10 L 24 24 L 34 24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="24" y="98" font-family="sans-serif" font-size="24" fill="#303a36">wraps coroutine with</text>
    <text x="24" y="134" font-family="monospace" font-size="24" fill="#207448">asyncio.wait_for(coro,</text>
    <text x="24" y="168" font-family="monospace" font-size="24" fill="#207448"> timeout=2.0)</text>
    <text x="24" y="206" font-family="sans-serif" font-size="24" fill="#303a36">to guarantee test termination.</text>
  </g>

  
  
  
  <rect x="50" y="425" width="1500" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="80" y="465" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    Panel 2 (Collaborators &amp; Injected Clock)
  </text>

  
  <g transform="translate(80, 485)">
    <rect width="420" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(345, 20)">
      <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 24 0 L 24 8 M 24 40 L 24 48 M 0 24 L 8 24 M 40 24 L 48 24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="24" y="105" font-family="sans-serif" font-size="24" fill="#303a36">Async client injected with</text>
    <text x="24" y="148" font-family="monospace" font-size="24" fill="#207448">AsyncMock(</text>
    <text x="24" y="184" font-family="monospace" font-size="24" fill="#207448"> spec=ClusterClient)</text>
  </g>

  
  <line x1="500" y1="615" x2="540" y2="615" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(555, 485)">
    <rect width="455" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(385, 20)">
      <rect x="0" y="4" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="0" y="24" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="8" cy="11" r="2" fill="#207448" />
      <circle cx="8" cy="31" r="2" fill="#207448" />
    </g>
    
    <text x="24" y="105" font-family="monospace" font-size="24" fill="#303a36">mock.fetch_node_status =</text>
    <text x="24" y="142" font-family="monospace" font-size="24" fill="#303a36">AsyncMock(return_value=</text>
    <text x="24" y="180" font-family="monospace" font-size="24" fill="#207448"> {"status": "ready"})</text>
  </g>

  
  <line x1="1010" y1="615" x2="1050" y2="615" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1065, 485)">
    <rect width="455" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(385, 20)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 24 12 L 20 26 L 28 26 L 22 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="20" y="96" font-family="sans-serif" font-size="24" fill="#303a36">clock/sleep injected via fake</text>
    <text x="20" y="128" font-family="sans-serif" font-size="24" fill="#303a36">event loop or</text>
    <text x="20" y="160" font-family="monospace" font-size="24" fill="#207448">'asyncio.sleep'</text>
    <text x="20" y="192" font-family="sans-serif" font-size="24" fill="#303a36">no-op replacement, completing</text>
    <text x="20" y="224" font-family="sans-serif" font-size="24" fill="#303a36">simulated 60-second backoff in 0 ms.</text>
  </g>

  
  
  
  <rect x="50" y="795" width="1500" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="80" y="835" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    Panel 3 (Cancellation &amp; Error Branches)
  </text>
  <text x="680" y="835" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    Task cancellation flow:
  </text>

  
  <g transform="translate(80, 855)">
    <rect width="320" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(250, 20)">
      <rect x="0" y="12" width="44" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 0 L 12 12 M 32 0 L 32 12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 10 28 L 34 28" stroke="#207448" stroke-width="3" />
    </g>
    
    <text x="20" y="120" font-family="monospace" font-size="24" fill="#303a36">task =</text>
    <text x="20" y="160" font-family="monospace" font-size="24" fill="#207448">asyncio.</text>
    <text x="20" y="196" font-family="monospace" font-size="24" fill="#207448">create_task(coro)</text>
  </g>

  
  <line x1="400" y1="985" x2="435" y2="985" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(450, 855)">
    <rect width="250" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(180, 20)">
      <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 14 L 30 30 M 30 14 L 14 30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="20" y="150" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">task.cancel()</text>
  </g>

  
  <line x1="700" y1="985" x2="735" y2="985" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  
  <g transform="translate(750, 855)">
    <rect width="395" height="265" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#db8129" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(325, 20)">
      <path d="M 22 2 L 40 10 L 40 24 C 40 36 22 46 22 46 C 22 46 4 36 4 24 L 4 10 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <path d="M 22 14 L 22 26 M 22 32 L 22 34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="20" y="100" font-family="sans-serif" font-size="24" fill="#303a36">triggers</text>
    <text x="20" y="136" font-family="monospace" font-size="24" fill="#303a36">try:</text>
    <text x="44" y="168" font-family="monospace" font-size="24" fill="#303a36">await task</text>
    <text x="20" y="202" font-family="monospace" font-size="24" fill="#303a36">except</text>
    <text x="20" y="234" font-family="monospace" font-size="24" fill="#db8129">asyncio.CancelledError:</text>
  </g>

  
  <line x1="1145" y1="985" x2="1180" y2="985" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1195, 855)">
    <rect width="335" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="44" cy="44" r="22" fill="#207448" />
    <text x="44" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(265, 20)">
      <rect x="0" y="14" width="40" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 14 L 10 8 C 10 4 30 4 30 8 L 30 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 28 L 18 34 L 30 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="18" y="98" font-family="sans-serif" font-size="24" fill="#303a36">asserts cleanup logic</text>
    <text x="18" y="132" font-family="sans-serif" font-size="24" fill="#207448">(draining queues,</text>
    <text x="18" y="166" font-family="sans-serif" font-size="24" fill="#207448">releasing semaphores)</text>
    <text x="18" y="200" font-family="sans-serif" font-size="24" fill="#303a36">runs before test exits.</text>
  </g>

</svg>