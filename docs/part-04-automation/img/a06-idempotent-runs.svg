<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>A second run must report changed=0</title>
  <desc>Visual comparison demonstrating that an idempotent Ansible task reports changed=0 on its second run, whereas a template containing a timestamp reports changed=1 and triggers handlers repeatedly.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A second run must report changed=0</text>

  
  <g id="row-1">
    
    <rect x="60" y="115" width="1480" height="390" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(100, 138)">
      
      <rect x="0" y="0" width="46" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4" />
      
      <circle cx="23" cy="8" r="2.5" fill="#207448" />
      <circle cx="23" cy="48" r="2.5" fill="#207448" />
      
      <path d="M 16 32 L 23 18 L 30 32 Z" fill="#207448" stroke="#207448" stroke-width="2" stroke-linejoin="round" />
    </g>

    
    <text x="165" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Idempotent task</text>

    
    <rect x="100" y="215" width="500" height="130" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="145" cy="280" r="24" fill="#207448" />
    <text x="145" y="289" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="195" y="266">
      <tspan x="195" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">changed=2 </tspan>
      <tspan x="195" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(the work is done)</tspan>
    </text>

    
    <text x="690" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">run again</text>
    <line x1="600" y1="280" x2="766" y2="280" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="780" y="215" width="500" height="130" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="825" cy="280" r="24" fill="#207448" />
    <text x="825" y="289" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="875" y="266">
      <tspan x="875" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">changed=0 </tspan>
      <tspan x="875" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(already correct)</tspan>
    </text>

    
    <circle cx="1370" cy="280" r="36" fill="#207448" />
    <path d="M 1352 280 L 1365 293 L 1392 264" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    
    <text x="100" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">A second run that changes things again means something is not idempotent.</text>
  </g>

  
  <g id="row-2">
    
    <rect x="60" y="530" width="1480" height="390" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(100, 553)">
      <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <path d="M 28 28 L 28 12 M 28 28 L 42 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>

    
    <text x="165" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Timestamp in the template</text>

    
    <rect x="100" y="630" width="500" height="130" rx="12" ry="12" fill="#f4f1ea" stroke="#a69f94" stroke-width="3" />
    <circle cx="145" cy="695" r="24" fill="#8a8275" />
    <text x="145" y="704" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="195" y="681">
      <tspan x="195" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#6e6252">changed=1 </tspan>
      <tspan x="195" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(new timestamp written)</tspan>
    </text>

    
    <text x="690" y="667" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">run again</text>
    <line x1="600" y1="695" x2="766" y2="695" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-grey)" />

    
    <rect x="780" y="630" width="650" height="130" rx="12" ry="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <circle cx="825" cy="695" r="24" fill="#db8129" />
    <text x="825" y="704" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="870" y="681">
      <tspan x="870" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#db8129">changed=1 again, </tspan>
      <tspan x="870" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">and the handler restarts the service</tspan>
    </text>

    
    <text x="100" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">The rendered file differs on every run.</text>
  </g>

  
  <g id="bottom-caption">
    <rect x="60" y="945" width="1480" height="70" rx="12" ry="12" fill="#207448" />
    <text x="800" y="989" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Run the playbook twice and read the second recap.</text>
  </g>
</svg>