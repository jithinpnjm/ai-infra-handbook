<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>A filter chain is a conveyor belt: each filter changes the value once</title>
  <desc>Visual infographic explaining how a Jinja2 filter chain processes node records step by step like a conveyor belt, selecting nodes, extracting names, and joining them.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="950" fill="#f5f8f5" />
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A filter chain is a conveyor belt: </tspan>
    <tspan x="800" dy="56">each filter changes the value once</tspan>
  </text>
  
  <g id="conveyor-belt">
    <rect x="40" y="565" width="1520" height="40" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="80" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="80" cy="615" r="4" fill="#207448" />
    <circle cx="175" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="175" cy="615" r="4" fill="#207448" />
    <circle cx="270" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="270" cy="615" r="4" fill="#207448" />
    <circle cx="365" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="365" cy="615" r="4" fill="#207448" />
    <circle cx="460" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="460" cy="615" r="4" fill="#207448" />
    <circle cx="555" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="555" cy="615" r="4" fill="#207448" />
    <circle cx="650" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="650" cy="615" r="4" fill="#207448" />
    <circle cx="745" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="745" cy="615" r="4" fill="#207448" />
    <circle cx="840" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="840" cy="615" r="4" fill="#207448" />
    <circle cx="935" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="935" cy="615" r="4" fill="#207448" />
    <circle cx="1030" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1030" cy="615" r="4" fill="#207448" />
    <circle cx="1125" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1125" cy="615" r="4" fill="#207448" />
    <circle cx="1220" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1220" cy="615" r="4" fill="#207448" />
    <circle cx="1315" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1315" cy="615" r="4" fill="#207448" />
    <circle cx="1410" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1410" cy="615" r="4" fill="#207448" />
    <circle cx="1505" cy="615" r="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1505" cy="615" r="4" fill="#207448" />
    <circle cx="55" cy="585" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="55" cy="585" r="7" fill="#207448" />
    <circle cx="1545" cy="585" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1545" cy="585" r="7" fill="#207448" />
  </g>
  
  <g id="station-1">
    <rect x="330" y="165" width="295" height="290" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(449, 185)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4,4 52,4 34,28 34,50 22,50 22,28" />
      <line x1="12" y1="12" x2="44" y2="12" />
    </g>
    <text x="477" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="477" dy="0" font-family="monospace">selectattr(</tspan><tspan x="477" dy="32" font-family="monospace">gpus, ge, 8): </tspan><tspan x="477" dy="34">keep nodes with </tspan><tspan x="477" dy="32">8 or more GPUs</tspan></text>
    <line x1="477" y1="455" x2="477" y2="495" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="station-2">
    <rect x="670" y="165" width="295" height="290" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(789, 185)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 24 L 24 6 L 48 6 L 48 30 L 30 48 Z" />
      <circle cx="38" cy="16" r="4" fill="#207448" />
    </g>
    <text x="817" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="817" dy="0" font-family="monospace">map(</tspan><tspan x="817" dy="32" font-family="monospace">attribute=name): </tspan><tspan x="817" dy="34">pull out the name </tspan><tspan x="817" dy="32">of each node</tspan></text>
    <line x1="817" y1="455" x2="817" y2="495" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="station-3">
    <rect x="1010" y="165" width="295" height="290" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <g transform="translate(1129, 185)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 28 A 12 12 0 0 1 30 16 L 38 16 A 12 12 0 0 1 50 28 A 12 12 0 0 1 38 40 L 30 40" />
      <path d="M 38 28 A 12 12 0 0 1 26 40 L 18 40 A 12 12 0 0 1 6 28 A 12 12 0 0 1 18 16 L 26 16" />
    </g>
    <text x="1157" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="1157" dy="0" font-family="monospace">join(,): </tspan><tspan x="1157" dy="36">glue the names </tspan><tspan x="1157" dy="34">with commas</tspan></text>
    <line x1="1157" y1="455" x2="1157" y2="495" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="input-box">
    <rect x="40" y="440" width="245" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="162" y="475" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">gpu01 gpus 8</text>
    <text x="162" y="512" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">gpu02 gpus 8</text>
    <text x="162" y="549" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">login01 gpus 0</text>
    <line x1="285" y1="530" x2="352" y2="530" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="output-station-1">
    <rect x="352" y="495" width="250" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="477" y="539" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">gpu01, gpu02</text>
    <line x1="602" y1="530" x2="692" y2="530" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="output-station-2">
    <rect x="692" y="495" width="250" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="817" y="539" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">gpu01, gpu02</text>
    <line x1="942" y1="530" x2="1032" y2="530" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="output-station-3">
    <rect x="1032" y="495" width="250" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1157" y="539" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">gpu01,gpu02</text>
    <line x1="1282" y1="530" x2="1350" y2="530" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  </g>
  
  <g id="output-box-far-right">
    <rect x="1350" y="475" width="210" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="1455" y="530" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">gpu01,gpu02</text>
  </g>
  
  <g id="grey-note">
    <rect x="100" y="685" width="1400" height="90" rx="12" fill="#ffffff" stroke="#9aa8a0" stroke-width="2" />
    <g transform="translate(130, 708)" stroke="#7a8c82" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="20" />
      <line x1="22" y1="20" x2="22" y2="31" />
      <circle cx="22" cy="13" r="1.5" fill="#7a8c82" />
    </g>
    <text x="190" y="727" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="190" dy="0">If the first filter keeps nothing, later filters receive an empty list </tspan>
      <tspan x="190" dy="32">and the output is an empty string.</tspan>
    </text>
  </g>
  
  <g id="takeaway-bar">
    <rect x="40" y="835" width="1520" height="70" rx="12" fill="#207448" />
    <text x="800" y="879" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Read a filter chain left to right, one change at a time.</text>
  </g>
</svg>