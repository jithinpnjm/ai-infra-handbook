<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <title>What a module is</title>
  <desc>Architecture flowchart showing a Terraform root module configuring and interconnecting network, storage, cluster, and gpu_pool modules.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#303a36">What a module is</text>

  

  
  <path d="M 360 255 L 360 370" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1240 255 L 1240 370" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 720 255 L 720 648 L 540 648 L 540 730" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 880 255 L 880 648 L 1060 648 L 1060 730" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 160 565 L 160 730" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(180, 628)">
    <rect width="335" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="167" y="29" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">network_id, subnet_ids</text>
  </g>

  
  <path d="M 1440 565 L 1440 730" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(1225, 628)">
    <rect width="195" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="97" y="29" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">bucket_names</text>
  </g>

  
  <path d="M 640 825 L 960 825" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(705, 765)">
    <rect width="190" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="95" y="29" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">cluster_name</text>
  </g>

  

  
  <g id="node-root">
    <rect x="220" y="105" width="1160" height="150" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(252, 152)">
      <path d="M 4 10 L 20 10 L 26 16 L 48 16 A 4 4 0 0 1 52 20 L 52 44 A 4 4 0 0 1 48 48 L 4 48 A 4 4 0 0 1 0 44 L 0 14 A 4 4 0 0 1 4 10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="26" cy="32" r="5" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="26" y1="21" x2="26" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="39" x2="26" y2="43" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="15" y1="32" x2="19" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="33" y1="32" x2="37" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="330" y="165" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Root module (environment): <tspan font-family="monospace">envs/prod/main.tf</tspan></text>
    <text x="330" y="215" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">wires modules together, holds backend + provider config</text>
  </g>

  
  <g id="node-network">
    <rect x="80" y="370" width="560" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(334, 388)">
      <circle cx="26" cy="10" r="7" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="8" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="44" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="22" y1="16" x2="12" y2="34" stroke="#207448" stroke-width="3" />
      <line x1="30" y1="16" x2="40" y2="34" stroke="#207448" stroke-width="3" />
      <line x1="15" y1="40" x2="37" y2="40" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="360" y="480" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">module.network</text>
    <text x="360" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">VPC, subnets, firewall, NAT</text>
  </g>

  
  <g id="node-storage">
    <rect x="960" y="370" width="560" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(1214, 388)">
      <ellipse cx="26" cy="12" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 12 L 6 26 A 20 7 0 0 0 46 26 L 46 12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 26 L 6 40 A 20 7 0 0 0 46 40 L 46 26" fill="none" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="1240" y="480" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">module.storage</text>
    <text x="1240" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">buckets, KMS, lifecycle</text>
  </g>

  
  <g id="node-cluster">
    <rect x="80" y="730" width="560" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(334, 748)">
      <circle cx="26" cy="26" r="16" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="26" cy="26" r="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="2" x2="26" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="26" y1="42" x2="26" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="26" x2="10" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="26" x2="50" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="9" y1="9" x2="15" y2="15" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="37" y1="37" x2="43" y2="43" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="9" y1="43" x2="15" y2="37" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="37" y1="15" x2="43" y2="9" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="360" y="840" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">module.cluster</text>
    <text x="360" y="885" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">cluster + system pool</text>
  </g>

  
  <g id="node-gpu-pool">
    <rect x="960" y="730" width="560" height="195" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(1214, 748)">
      <rect x="10" y="10" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="16" height="16" fill="none" stroke="#207448" stroke-width="2.5" />
      
      <line x1="16" y1="3" x2="16" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="3" x2="26" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="36" y1="3" x2="36" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="42" x2="16" y2="49" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="42" x2="26" y2="49" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="36" y1="42" x2="36" y2="49" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="3" y1="16" x2="10" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="3" y1="26" x2="10" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="3" y1="36" x2="10" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="16" x2="49" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="26" x2="49" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="36" x2="49" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="1240" y="840" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">module.gpu_pool (for_each)</text>
    <text x="1240" y="885" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">GPU node pools</text>
  </g>
</svg>