<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Modules that gather, steer and debug rather than change the machine</title>
  <desc>Ansible modules that inspect, control execution flow, and debug without altering managed node state, along with guidance on platform collections and built-in modules.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">Modules that gather, steer and debug</tspan>
    <tspan x="40" dy="54">rather than change the machine</tspan>
  </text>

  
  <rect x="40" y="145" width="1520" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 153)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 34 A 18 18 0 1 1 36 34"/>
    <line x1="21" y1="21" x2="30" y2="12"/>
    <circle cx="21" cy="21" r="3" fill="#207448"/>
    <line x1="10" y1="24" x2="13" y2="22"/>
    <line x1="21" y1="7" x2="21" y2="11"/>
    <line x1="32" y1="24" x2="29" y2="22"/>
  </g>
  <text x="112" y="183" font-family="sans-serif" font-size="26" font-style="italic" fill="#207448">the instruments on a dashboard, not the controls</text>

  
  <rect x="40" y="222" width="1520" height="498" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <path d="M 40 230 Q 40 222 48 222 L 1552 222 Q 1560 222 1560 230 L 1560 272 L 40 272 Z" fill="#207448"/>
  <text x="70" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Job</text>
  <text x="600" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Modules</text>

  
  <line x1="570" y1="222" x2="570" y2="720" stroke="#c0d4c6" stroke-width="2"/>

  
  <line x1="40" y1="342" x2="1560" y2="342" stroke="#e0ece2" stroke-width="2"/>
  <line x1="40" y1="414" x2="1560" y2="414" stroke="#e0ece2" stroke-width="2"/>
  <line x1="40" y1="492" x2="1560" y2="492" stroke="#e0ece2" stroke-width="2"/>
  <line x1="40" y1="570" x2="1560" y2="570" stroke="#e0ece2" stroke-width="2"/>
  <line x1="40" y1="650" x2="1560" y2="650" stroke="#e0ece2" stroke-width="2"/>

  
  
  <g transform="translate(56, 284)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="11"/>
    <line x1="26" y1="26" x2="38" y2="38"/>
    <line x1="13" y1="18" x2="23" y2="18"/>
  </g>
  <text x="116" y="316" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Collect facts</text>
  <text x="600" y="315" font-family="monospace" font-size="24" fill="#207448">setup, gather_facts</text>

  
  
  <g transform="translate(56, 356)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="36" height="32" rx="4"/>
    <polyline points="12,22 18,28 32,14"/>
  </g>
  <text x="116" y="394" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Handle values and checks</text>
  <text x="600" y="393" font-family="monospace" font-size="24" fill="#207448">set_fact, debug, assert, fail, pause</text>

  
  
  <g transform="translate(56, 431)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="17"/>
    <polygon points="22,10 26,22 22,20 18,22" fill="#207448"/>
    <polygon points="22,34 26,22 22,24 18,22"/>
  </g>
  <text x="116" y="468" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Steer the run</text>
  <text x="600" y="449" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="600" dy="0">meta: flush_handlers, end_play, end_host,</tspan>
    <tspan x="600" dy="32">refresh_inventory, clear_facts</tspan>
  </text>

  
  
  <g transform="translate(56, 509)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 16 A 14 14 0 0 1 34 16 L 34 22"/>
    <polyline points="29,19 34,24 39,19"/>
    <path d="M 36 28 A 14 14 0 0 1 10 28 L 10 22"/>
    <polyline points="15,25 10,20 5,25"/>
  </g>
  <text x="116" y="546" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Reuse tasks</text>
  <text x="600" y="527" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="600" dy="0">include_tasks, import_tasks, include_role,</tspan>
    <tspan x="600" dy="32">import_role, include_vars</tspan>
  </text>

  
  
  <g transform="translate(56, 587)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="36" height="30" rx="4"/>
    <polyline points="11,16 18,21 11,26"/>
    <line x1="22" y1="26" x2="31" y2="26"/>
  </g>
  <text x="116" y="608" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="116" dy="0">Change the inventory</tspan>
    <tspan x="116" dy="34">or run commands</tspan>
  </text>
  <text x="600" y="606" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="600" dy="0">add_host, group_by, command, shell,</tspan>
    <tspan x="600" dy="32">raw, script, expect</tspan>
  </text>

  
  
  <g transform="translate(56, 663)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="17"/>
    <polyline points="21,11 21,21 29,21"/>
  </g>
  <text x="116" y="696" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Wait</text>
  <text x="600" y="694" font-family="monospace" font-size="24" fill="#207448">wait_for, async_status</text>

  
  <rect x="40" y="744" width="940" height="344" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 768)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="24,6 44,16 24,26 4,16"/>
    <polygon points="4,16 24,26 24,44 4,34"/>
    <polygon points="44,16 24,26 24,44 44,34"/>
    <line x1="14" y1="11" x2="34" y2="21"/>
  </g>
  <text x="124" y="784" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="124" dy="0">a collection is a package of modules, roles and plugins</tspan>
    <tspan x="124" dy="32">that Ansible installs separately from its core:</tspan>
    <tspan x="124" dy="32">kubernetes.core (k8s and Helm),</tspan>
    <tspan x="124" dy="32">community.docker (containers),</tspan>
    <tspan x="124" dy="32">community.general (system and tool modules),</tspan>
    <tspan x="124" dy="32">community.crypto (certificates), amazon.aws,</tspan>
    <tspan x="124" dy="32">google.cloud, azure.azcollection,</tspan>
    <tspan x="124" dy="32">community.general.redfish_* for BMC power, boot,</tspan>
    <tspan x="124" dy="32">firmware and inventory (Part 7);</tspan>
    <tspan x="124" dy="32">network modules in 4.16; NVIDIA roles in 4.17</tspan>
  </text>

  
  <rect x="1010" y="744" width="550" height="344" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(1036, 768)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 4 L 40 10 L 40 24 C 40 34 22 42 22 42 C 22 42 4 34 4 24 L 4 10 Z"/>
    <line x1="22" y1="14" x2="22" y2="26"/>
    <circle cx="22" cy="32" r="1.5" fill="#db8129"/>
  </g>
  <text x="1092" y="794" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1092" dy="0">look for a built-in module</tspan>
    <tspan x="1092" dy="35">first and add a collection only</tspan>
    <tspan x="1092" dy="35">when you cannot do the job</tspan>
    <tspan x="1092" dy="35">with the built-in set: every</tspan>
    <tspan x="1092" dy="35">extra collection is one more</tspan>
    <tspan x="1092" dy="35">version to pin and upgrade</tspan>
    <tspan x="1092" dy="35">on the control node</tspan>
  </text>

  
  <rect x="40" y="1112" width="1520" height="64" rx="8" fill="#207448"/>
  <text x="800" y="1153" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Fewer moving parts means fewer surprises during a change window</text>
</svg>