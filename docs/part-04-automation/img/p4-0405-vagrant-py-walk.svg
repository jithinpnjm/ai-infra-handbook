<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>The vagrant.py script: the two calls every inventory script must answer</title>
  <desc>Visual explanation of the vagrant.py inventory script showing the two essential calls: --list and --host</desc>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  <text x="800" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The vagrant.py script:</tspan>
    <tspan x="800" dy="58">the two calls every inventory script must answer</tspan>
  </text>

  <rect x="40" y="160" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(68, 182)">
    <rect x="4" y="2" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M0 42 L56 42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <rect x="14" y="10" width="28" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  <text x="148" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="148" dy="0">it turns a laptop's running VMs into an inventory; a good model for any script</tspan>
    <tspan x="148" dy="34">because it shows the two calls every script must answer: --list and --host &lt;name&gt;</tspan>
  </text>

  <rect x="40" y="285" width="735" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="85" cy="330" r="24" fill="#207448"/>
  <text x="85" y="339" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(125, 302)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="30" x2="44" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="42" x2="36" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="200" y="340" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">--list</text>

  <rect x="65" y="380" width="685" height="120" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="90" y="415" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">list_running_hosts() runs vagrant status</tspan>
    <tspan x="90" dy="34">--machine-readable through</tspan>
    <tspan x="90" dy="34">subprocess.check_output</tspan>
  </text>

  <rect x="65" y="520" width="685" height="120" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="90" y="555" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">each line is a comma-separated record:</tspan>
    <tspan x="90" dy="34">(timestamp, host, key, value) =</tspan>
    <tspan x="90" dy="34">line.split(,)[:4]</tspan>
  </text>

  <rect x="65" y="660" width="685" height="90" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="90" y="698" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">keep every host where key == state and</tspan>
    <tspan x="90" dy="34">value == running</tspan>
  </text>

  <rect x="65" y="770" width="685" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="90" y="828" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="90" dy="0">{"vagrant": ["vagrant1", "vagrant2",</tspan>
    <tspan x="90" dy="36"> "vagrant3"]}</tspan>
  </text>

  <rect x="825" y="285" width="735" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="870" cy="330" r="24" fill="#207448"/>
  <text x="870" y="339" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(910, 302)">
    <rect x="0" y="0" width="56" height="34" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="14" cy="17" r="3" fill="#207448"/>
    <circle cx="26" cy="17" r="3" fill="#207448"/>
    <path d="M28 34 L28 48 M10 48 L46 48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="982" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">--host (connection details)</text>

  <rect x="850" y="380" width="685" height="120" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="875" y="415" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="875" dy="0">get_host_details(host) runs vagrant</tspan>
    <tspan x="875" dy="34">ssh-config host and parses the OpenSSH</tspan>
    <tspan x="875" dy="34">block with paramiko.SSHConfig()</tspan>
  </text>

  <rect x="850" y="520" width="685" height="75" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="875" y="566" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">c[hostname] to ansible_host</text>

  <rect x="850" y="615" width="685" height="75" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="875" y="661" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">int(c[port]) to ansible_port</text>

  <rect x="850" y="710" width="685" height="75" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="2"/>
  <text x="875" y="756" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">c[user] to ansible_user</text>

  <rect x="850" y="805" width="685" height="105" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
  <text x="875" y="847" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="875" dy="0">c[identityfile][0] to</tspan>
    <tspan x="875" dy="35">ansible_private_key_file</tspan>
  </text>

  <rect x="40" y="970" width="1520" height="70" rx="10" fill="#207448"/>
  <text x="800" y="1014" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">List the machines, then give each its address card</text>

  <text x="800" y="1088" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Ansible: Up and Running chapter 4; code/part04/ansible_inventory_model_lab.py tests this logic</text>
</svg>