<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <title>--limit only narrows, and how to rerun just the failures</title>
  <desc>Visual guide to Ansible play narrowing with --limit, retrying failed hosts, and play execution ordering.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 15 9 L 1 16 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1130" fill="#f5f8f5"/>

  
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">--limit only narrows, and how to rerun just the failures</text>

  
  
  <rect x="60" y="110" width="400" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(232, 126)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="14" rx="3"/>
    <rect x="4" y="21" width="48" height="14" rx="3"/>
    <rect x="4" y="38" width="48" height="14" rx="3"/>
    <circle cx="12" cy="11" r="2" fill="#207448"/>
    <circle cx="12" cy="28" r="2" fill="#207448"/>
    <circle cx="12" cy="45" r="2" fill="#207448"/>
    <line x1="20" y1="11" x2="44" y2="11"/>
    <line x1="20" y1="28" x2="44" y2="28"/>
    <line x1="20" y1="45" x2="44" y2="45"/>
  </g>
  <text x="260" y="235" text-anchor="middle" fill="#303a36">
    <tspan x="260" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold">play says <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hosts: gpu</tspan></tspan>
    <tspan x="260" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="24">(the widest scope)</tspan>
  </text>

  
  <line x1="460" y1="230" x2="518" y2="230" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="530" y="110" width="500" height="240" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3.5"/>
  
  <g transform="translate(752, 122)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="6,6 50,6 34,26 34,46 22,50 22,26"/>
    <line x1="14" y1="14" x2="42" y2="14"/>
  </g>
  <text x="780" y="206" text-anchor="middle" fill="#303a36">
    <tspan x="780" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold">--limit gpu_h100 <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal">(or </tspan>-l<tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal">)</tspan></tspan>
    <tspan x="780" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">adds one more pattern on top:</tspan>
    <tspan x="780" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">narrows to one hardware family</tspan>
    <tspan x="780" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">for a first pass</tspan>
  </text>

  
  <rect x="1060" y="110" width="480" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1272, 122)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28,6 L48,14 L48,30 C48,42 38,50 28,54 C18,50 8,42 8,30 L8,14 Z"/>
    <line x1="18" y1="30" x2="38" y2="30"/>
  </g>
  <text x="1300" y="206" text-anchor="middle" fill="#303a36">
    <tspan x="1300" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">it never widens the play:</tspan>
    <tspan x="1300" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">a host outside the play's</tspan>
    <tspan x="1300" dy="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">hosts:<tspan font-family="system-ui, -apple-system, sans-serif"> line stays out of the run</tspan></tspan>
    <tspan x="1300" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">even when <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--limit</tspan> names it</tspan>
  </text>

  
  
  <rect x="60" y="380" width="320" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(192, 424)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <line x1="28" y1="16" x2="28" y2="29"/>
    <circle cx="28" cy="38" r="2.5" fill="#207448"/>
  </g>
  <text x="220" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">partial failure</text>

  
  <line x1="380" y1="515" x2="438" y2="515" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="450" y="380" width="530" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(687, 405)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="40" rx="4"/>
    <polyline points="14,24 22,30 14,36"/>
    <line x1="26" y1="36" x2="38" y2="36"/>
  </g>
  <text x="715" y="492" text-anchor="middle" fill="#303a36">
    <tspan x="715" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold">ansible-playbook</tspan>
    <tspan x="715" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold">--limit @failed_hosts.txt</tspan>
    <tspan x="715" dy="44" font-family="system-ui, -apple-system, sans-serif" font-size="24">reruns only the failed hosts</tspan>
  </text>

  
  <line x1="980" y1="515" x2="1010" y2="515" stroke="#207448" stroke-width="3" stroke-dasharray="6,6"/>

  
  <rect x="1010" y="380" width="530" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1247, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="42" rx="3"/>
    <path d="M20,6 L36,6 L36,12 L20,12 Z"/>
    <line x1="18" y1="22" x2="38" y2="22"/>
    <line x1="18" y1="30" x2="38" y2="30"/>
    <line x1="18" y1="38" x2="38" y2="38"/>
  </g>
  <text x="1275" y="482" text-anchor="middle" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="1275" dy="0">works only if you enabled retry files</tspan>
    <tspan x="1275" dy="32">or captured the failures; like the</tspan>
    <tspan x="1275" dy="32">sign-in sheet for a workshop, if you</tspan>
    <tspan x="1275" dy="32">did not collect it the rerun starts</tspan>
    <tspan x="1275" dy="32">from the full roster</tspan>
  </text>

  
  
  <rect x="60" y="680" width="1480" height="300" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(90, 700)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="14" x2="30" y2="14"/>
    <line x1="8" y1="28" x2="24" y2="28"/>
    <line x1="8" y1="42" x2="18" y2="42"/>
    <polyline points="40,22 48,14 56,22"/>
    <line x1="48" y1="14" x2="48" y2="44"/>
  </g>
  <text x="165" y="738" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">order key on a play</text>

  
  <rect x="85" y="765" width="400" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(269, 780)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="24" x2="10" y2="24"/>
    <line x1="14" y1="18" x2="20" y2="18"/>
    <line x1="24" y1="12" x2="30" y2="12"/>
  </g>
  <text x="285" y="846" text-anchor="middle" fill="#303a36">
    <tspan x="285" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold">sorted:<tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal"> same sequence</tspan></tspan>
    <tspan x="285" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">every time, easy to compare</tspan>
    <tspan x="285" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">a log with the last run</tspan>
  </text>

  
  <rect x="510" y="765" width="270" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(629, 795)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="12" x2="10" y2="12"/>
    <line x1="14" y1="18" x2="20" y2="18"/>
    <line x1="24" y1="24" x2="30" y2="24"/>
  </g>
  <text x="645" y="885" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">reverse_sorted</text>

  
  <rect x="805" y="765" width="270" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(924, 795)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="24" height="22" rx="2"/>
    <polyline points="10,18 16,12 22,18"/>
  </g>
  <text x="940" y="885" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">reverse_inventory</text>

  
  <rect x="1100" y="765" width="415" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(1291, 780)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,22 C12,22 18,10 26,10 L30,10"/>
    <path d="M4,10 C12,10 18,22 26,22 L30,22"/>
    <polyline points="26,6 30,10 26,14"/>
    <polyline points="26,18 30,22 26,26"/>
  </g>
  <text x="1307" y="846" text-anchor="middle" fill="#303a36">
    <tspan x="1307" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold">shuffle:<tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal"> spreads risk and</tspan></tspan>
    <tspan x="1307" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">load, one bad rack does</tspan>
    <tspan x="1307" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">not always come first</tspan>
  </text>

  
  <rect x="60" y="1010" width="1480" height="80" rx="12" fill="#207448"/>
  <text x="800" y="1060" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Before a rolling change, decide the order and capture failures</text>
</svg>