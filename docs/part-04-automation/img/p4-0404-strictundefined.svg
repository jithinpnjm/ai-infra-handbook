<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>StrictUndefined: a renamed variable stops the render instead of emptying the line</title>
  <desc>Visual comparison between default Environment and StrictUndefined when template variables are renamed, including Ansible undefined variable handling tools.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">StrictUndefined: a renamed variable stops the render</text>
  <text x="800" y="112" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">instead of emptying the line</text>

  
  <rect x="60" y="145" width="1480" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(85, 157)">
    <rect x="0" y="0" width="42" height="54" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="8" y1="14" x2="34" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="26" x2="26" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="150" y="195" font-family="monospace" font-size="24" fill="#303a36">data renamed gpus to gpu_count, template still says Gres=gpu:{{ n.gpus }}</text>

  
  <line x1="420" y1="225" x2="420" y2="280" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="1180" y1="225" x2="1180" y2="280" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="280" width="720" height="300" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(85, 298)">
    <rect x="0" y="0" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="0" y1="12" x2="48" y2="12" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="6" r="2.5" fill="#207448" />
    <circle cx="16" cy="6" r="2.5" fill="#207448" />
  </g>
  <text x="148" y="328" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">default Environment</text>

  
  <rect x="85" y="360" width="670" height="72" rx="8" fill="#e8f1ea" />
  <text x="105" y="405" font-family="monospace" font-size="24" fill="#303a36">NodeName=gpu01 Gres=gpu: State=UNKNOWN</text>

  
  <rect x="85" y="452" width="670" height="98" rx="8" fill="#fff7ef" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(105, 475)">
    <path d="M 22 2 L 42 38 L 2 38 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="22" y1="15" x2="22" y2="25" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="22" cy="32" r="2.5" fill="#db8129" />
  </g>
  <text x="165" y="511" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">with nothing after the colon and no warning</text>

  
  <rect x="820" y="280" width="720" height="300" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(845, 298)">
    <path d="M 24 2 L 44 10 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  </g>
  <text x="905" y="328" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">undefined=StrictUndefined</text>

  
  <rect x="845" y="360" width="670" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1180" y="401" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">the single most useful safety setting</text>

  
  <rect x="845" y="452" width="670" height="98" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 477)">
    <polygon points="12,2 28,2 38,12 38,28 28,38 12,38 2,28 2,12" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="12" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="920" y="511" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the render stops and names the missing variable</text>

  
  <rect x="60" y="605" width="1480" height="375" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

  
  <rect x="80" y="625" width="1440" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(100, 638)">
    <circle cx="21" cy="21" r="16" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="21" cy="21" r="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 21 2 L 21 7 M 21 35 L 21 40 M 2 21 L 7 21 M 35 21 L 40 21" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="160" y="668" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Ansible's default also errors on undefined variables unless you provide a default</text>

  
  <rect x="80" y="712" width="705" height="118" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(98, 728)">
    <circle cx="12" cy="12" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="36" cy="30" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 18 12 L 28 12 C 32 12 36 16 36 24" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="150" y="748" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0" font-family="monospace" font-weight="bold">var | default(x)</tspan>
    <tspan x="150" dy="34">when a sensible fallback exists</tspan>
  </text>

  
  <rect x="815" y="712" width="705" height="118" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(833, 728)">
    <circle cx="21" cy="21" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="21" y1="11" x2="21" y2="23" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="21" cy="29" r="2" fill="#207448" />
  </g>
  <text x="885" y="748" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="885" dy="0" font-family="monospace" font-weight="bold">var | mandatory</tspan>
    <tspan x="885" dy="34">when the run should stop with a clear message</tspan>
  </text>

  
  <rect x="80" y="846" width="705" height="118" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(98, 862)">
    <rect x="4" y="6" width="34" height="30" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="21" x2="30" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="150" y="878" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0" font-family="monospace" font-weight="bold">default(omit)</tspan>
    <tspan x="150" dy="30">when the module should use its own built-in</tspan>
    <tspan x="150" dy="28">value for a parameter you did not set</tspan>
  </text>

  
  <rect x="815" y="846" width="705" height="118" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(833, 862)">
    <polygon points="21,4 38,21 21,38 4,21" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <polyline points="14,21 19,26 28,16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="885" y="886" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="885" dy="0" font-weight="bold">is defined check</tspan>
    <tspan dy="0"> lets a task decide what to</tspan>
    <tspan x="885" dy="32">do when a variable is missing</tspan>
  </text>

  
  <rect x="60" y="1005" width="1480" height="74" rx="10" fill="#207448" />
  
  <g transform="translate(85, 1018)">
    <path d="M 24 2 L 44 10 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 10 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <polyline points="15,24 21,30 33,18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="800" y="1052" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Fail on a missing variable rather than emit an empty value</text>
</svg>