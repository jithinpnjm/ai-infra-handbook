<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three loop patterns: list of dicts, dict, nested subelements</title>
  <desc>Visual infographic explaining three Ansible loop patterns, filters, polling behavior, list passing efficiency, and loop concept analogy.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Three loop patterns: list of dicts, dict, nested subelements</text>

  
  <rect x="40" y="98" width="1520" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(62, 107)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="10" width="32" height="36" rx="4" fill="#ffffff"/>
    <path d="M16 10 V6 C16 4.5 17.5 3 20 3 H28 C30.5 3 32 4.5 32 6 V10 Z" fill="#e8f1ea"/>
    <line x1="15" y1="20" x2="33" y2="20"/>
    <line x1="15" y1="28" x2="33" y2="28"/>
    <line x1="15" y1="36" x2="26" y2="36"/>
    <polyline points="13,20 16,23 21,17" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="125" y="141" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">a checklist printed once and ticked off for each item</text>

  

  
  <rect x="40" y="184" width="1000" height="290" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 204)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="18" r="10"/>
    <path d="M10 48 C10 37 18 33 28 33 C38 33 46 37 46 48"/>
    <path d="M38 12 C41 12 45 15 45 19 C45 23 41 26 38 26"/>
    <path d="M46 33 C51 34 55 37 55 44"/>
  </g>
  
  <rect x="140" y="198" width="880" height="142" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="160" y="232">list of dicts: user module name {{ item.name }},</tspan>
    <tspan x="160" y="264">uid {{ item.uid }},</tspan>
    <tspan x="160" y="296">groups {{ item.groups | default([]) }};</tspan>
    <tspan x="160" y="328">loop slurm uid 990 groups [] and munge uid 991</tspan>
  </text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" y="378">each item is one account;</tspan>
    <tspan x="160" y="412">loop_control label {{ item.name }} shows slurm</tspan>
    <tspan x="160" y="446">instead of the whole record, pause 0, index_var idx</tspan>
  </text>

  
  <rect x="40" y="494" width="1000" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 514)" stroke="#207448" stroke-width="4" fill="none">
    <line x1="8" y1="16" x2="48" y2="16"/>
    <circle cx="20" cy="16" r="6" fill="#ffffff"/>
    <line x1="8" y1="32" x2="48" y2="32"/>
    <circle cx="36" cy="32" r="6" fill="#ffffff"/>
    <line x1="8" y1="46" x2="48" y2="46"/>
    <circle cx="26" cy="46" r="6" fill="#ffffff"/>
  </g>
  
  <rect x="140" y="508" width="880" height="134" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="160" y="546">dict: sysctl name {{ item.key }},</tspan>
    <tspan x="160" y="580">value {{ item.value }};</tspan>
    <tspan x="160" y="614">loop: {{ sysctl_settings | dict2items }}</tspan>
  </text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" y="688">dict2items turns each key and value into a pair</tspan>
  </text>

  
  <rect x="40" y="784" width="1000" height="320" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 804)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="14" r="6" fill="#ffffff"/>
    <line x1="28" y1="20" x2="28" y2="32"/>
    <line x1="14" y1="32" x2="42" y2="32"/>
    <line x1="14" y1="32" x2="14" y2="42"/>
    <line x1="42" y1="32" x2="42" y2="42"/>
    <circle cx="14" cy="46" r="5" fill="#ffffff"/>
    <circle cx="42" cy="46" r="5" fill="#ffffff"/>
  </g>
  
  <rect x="140" y="798" width="880" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="160" y="840">nested: debug msg {{ item.0.name }} -&gt; {{ item.1 }};</tspan>
    <tspan x="160" y="876">loop: {{ users | subelements(keys) }}</tspan>
  </text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" y="942">each user holds a list of keys; the loop produces</tspan>
    <tspan x="160" y="976">one pair per key; item.0.name is the user and</tspan>
    <tspan x="160" y="1010">item.1 one of that user's keys;</tspan>
    <tspan x="160" y="1044">runs once for every key of every user</tspan>
  </text>

  

  
  <rect x="1070" y="184" width="490" height="290" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(1095, 204)" stroke="#db8129" stroke-width="4" fill="none">
    <polygon points="6,8 50,8 32,28 32,46 24,52 24,28" stroke-linejoin="round"/>
    <line x1="16" y1="16" x2="40" y2="16"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" y="298">prefer loop with filters</tspan>
    <tspan x="1095" y="336">dict2items, subelements,</tspan>
    <tspan x="1095" y="374">product, zip, flatten, batch</tspan>
    <tspan x="1095" y="412">over hand-written logic</tspan>
  </text>

  
  <rect x="1070" y="494" width="490" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1095, 510)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="26" cy="28" r="20"/>
    <polyline points="26,16 26,28 34,28"/>
    <line x1="22" y1="4" x2="30" y2="4"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" y="582">until and retries for</tspan>
    <tspan x="1095" y="614">polling: keep checking until</tspan>
    <tspan x="1095" y="646">the answer is right and give</tspan>
    <tspan x="1095" y="678">up after a set number of</tspan>
    <tspan x="1095" y="710">tries, suits a service that</tspan>
    <tspan x="1095" y="742">takes a minute to start</tspan>
  </text>

  
  <rect x="1070" y="784" width="490" height="320" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1095, 804)" stroke="#207448" stroke-width="4" fill="none">
    <polygon points="28,6 52,18 52,42 28,54 4,42 4,18"/>
    <line x1="28" y1="54" x2="28" y2="28"/>
    <line x1="4" y1="18" x2="28" y2="28"/>
    <line x1="52" y1="18" x2="28" y2="28"/>
    <line x1="16" y1="12" x2="40" y2="24"/>
  </g>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" y="890">if a module accepts a list,</tspan>
    <tspan x="1095" y="924">pass the whole list:</tspan>
    <tspan x="1095" y="958">package name [a, b, c]</tspan>
    <tspan x="1095" y="992">runs as one transaction,</tspan>
    <tspan x="1095" y="1026">much faster than a loop</tspan>
    <tspan x="1095" y="1060">of three calls</tspan>
  </text>

  
  <rect x="40" y="1124" width="1520" height="56" rx="8" fill="#207448"/>
  <text x="800" y="1161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The steps stay the same, only the item in the box changes</text>
</svg>