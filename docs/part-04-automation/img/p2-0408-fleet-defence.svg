<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A fleet change has layers of defence, and each layer catches what the one before missed</title>
  <desc>Infographic illustrating the five layers of defence in fleet changes: assert input validation, serial canary, health checks, max_fail_percentage limits, and rescue rollback with alerting, plus a note on clean meta exits.</desc>

  <defs>
    <marker id="arrow-down" viewBox="0 0 16 16" refX="8" refY="12" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 2 4 L 8 13 L 14 4 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A fleet change has layers of defence, and each layer</text>
  <text x="800" y="132" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">catches what the one before missed</text>

  
  <rect x="50" y="180" width="1040" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="245" r="24" fill="#207448" />
  <text x="95" y="253" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(145, 217)">
    <path d="M 28 4 C 46 4, 50 12, 50 24 C 50 40, 28 50, 28 50 C 28 50, 6 40, 6 24 C 6 12, 10 4, 28 4 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 18 25 L 25 32 L 38 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="225" y="232" font-family="sans-serif">
    <tspan font-family="monospace" font-weight="bold" font-size="30" fill="#207448">assert:</tspan>
    <tspan font-family="sans-serif" font-weight="bold" font-size="30" fill="#303a36"> validate inputs,</tspan>
  </text>
  <text x="225" y="272" font-family="sans-serif" font-size="25" fill="#303a36">so a missing value stops the run before anything is touched</text>

  
  <line x1="570" y1="310" x2="570" y2="361" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)" />

  
  <rect x="50" y="365" width="1040" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="430" r="24" fill="#207448" />
  <text x="95" y="438" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(145, 402)">
    <rect x="6" y="10" width="44" height="38" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="6" y1="23" x2="50" y2="23" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="35" x2="50" y2="35" stroke="#207448" stroke-width="3" />
    <circle cx="14" cy="17" r="2.5" fill="#207448" />
    <circle cx="14" cy="29" r="2.5" fill="#207448" />
    <circle cx="14" cy="41" r="2.5" fill="#207448" />
    <line x1="24" y1="17" x2="42" y2="17" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="29" x2="42" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="41" x2="42" y2="41" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="10" x2="28" y2="3" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="28" cy="2" r="2" fill="#207448" />
  </g>
  
  <text x="225" y="417" font-family="sans-serif" font-weight="bold" font-size="30" fill="#303a36">serial canary:</text>
  <text x="225" y="457" font-family="sans-serif" font-size="25" fill="#303a36">one host goes first and proves the change works</text>

  
  <line x1="570" y1="495" x2="570" y2="546" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)" />

  
  <rect x="50" y="550" width="1040" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="615" r="24" fill="#207448" />
  <text x="95" y="623" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(145, 587)">
    <rect x="4" y="6" width="48" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 4 25 L 14 25 L 19 15 L 26 35 L 32 20 L 37 28 L 52 25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="44" x2="36" y2="44" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="3" />
  </g>
  
  <text x="225" y="602" font-family="sans-serif" font-weight="bold" font-size="30" fill="#303a36">health check after the change:</text>
  <text x="225" y="642" font-family="sans-serif" font-size="25" fill="#303a36">a clean install can still leave a service broken</text>

  
  <line x1="570" y1="680" x2="570" y2="731" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)" />

  
  <rect x="50" y="735" width="1040" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="800" r="24" fill="#207448" />
  <text x="95" y="808" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(145, 772)">
    <polygon points="16,5 40,5 50,15 50,39 40,49 16,49 6,39 6,15" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="15" y1="27" x2="41" y2="27" stroke="#207448" stroke-width="4.5" stroke-linecap="round" />
  </g>
  
  <text x="225" y="787">
    <tspan font-family="monospace" font-weight="bold" font-size="28" fill="#207448">max_fail_percentage</tspan>
    <tspan font-family="sans-serif" font-weight="bold" font-size="28" fill="#303a36"> or </tspan>
    <tspan font-family="monospace" font-weight="bold" font-size="28" fill="#207448">any_errors_fatal:</tspan>
  </text>
  <text x="225" y="827" font-family="sans-serif" font-size="25" fill="#303a36">stop the spread of a bad change</text>

  
  <line x1="570" y1="865" x2="570" y2="916" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)" />

  
  <rect x="50" y="920" width="1040" height="130" rx="16" fill="#fdf7f0" stroke="#db8129" stroke-width="4" />
  
  <circle cx="95" cy="985" r="24" fill="#207448" />
  <text x="95" y="993" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  
  <g transform="translate(145, 957)">
    <path d="M 28 10 A 18 18 0 1 0 46 28" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 23 4 L 30 10 L 23 16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="29" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="28" cy="36" r="2" fill="#207448" />
  </g>
  
  <text x="225" y="972">
    <tspan font-family="monospace" font-weight="bold" font-size="30" fill="#db8129">rescue</tspan>
    <tspan font-family="sans-serif" font-weight="bold" font-size="30" fill="#303a36"> rolls back,</tspan>
  </text>
  <text x="225" y="1012" font-family="sans-serif" font-size="25" fill="#303a36">then a person is alerted</text>

  
  <rect x="1120" y="475" width="430" height="280" rx="16" fill="#f0f4f1" stroke="#7a8c83" stroke-width="2.5" stroke-dasharray="8 6" />
  
  <text x="1155" y="545" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">meta: </tspan>
    <tspan font-family="monospace">end_host</tspan>
    <tspan font-family="sans-serif"> and</tspan>
  </text>
  <text x="1155" y="590" font-size="24" fill="#303a36">
    <tspan font-family="monospace">end_play</tspan>
    <tspan font-family="sans-serif"> exit cleanly,</tspan>
  </text>
  <text x="1155" y="635" font-family="sans-serif" font-size="24" fill="#303a36">which is a planned exit</text>
  <text x="1155" y="680" font-family="sans-serif" font-size="24" fill="#303a36">and not an error</text>

  
  <rect x="50" y="1095" width="1500" height="70" rx="14" fill="#207448" />
  <text x="800" y="1139" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Each layer catches the slip that got past the one above it.</text>
</svg>