<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>command, shell, script, raw: shell features and safe use</title>
  <desc>Comparison table of Ansible command execution modules, rules for safe operation, and operational risk scenario.</desc>

  
  <rect width="1600" height="1190" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">command, shell, script, raw: shell features and safe use</text>

  
  
  <rect x="40" y="105" width="1520" height="52" rx="8" fill="#207448"/>
  <line x1="280" y1="105" x2="280" y2="157" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="710" y1="105" x2="710" y2="157" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <text x="60" y="142" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Module</text>
  <text x="300" y="142" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Shell features</text>
  <text x="730" y="142" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Use</text>

  
  <rect x="40" y="165" width="1520" height="112" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="2"/>
  
  <rect x="58" y="196" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 68 214 L 76 214" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <path d="M 66 207 L 72 211 L 66 215" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="222" font-family="monospace" font-size="30px" font-weight="bold" fill="#207448">command</text>
  <text x="300" y="210" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="300" dy="0">no (no pipes, redirects,</tspan>
    <tspan x="300" dy="32"><tspan font-family="monospace">$VAR</tspan>, globs)</tspan>
  </text>
  <text x="730" y="200" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="730" dy="0">default for running an executable; arguments are</tspan>
    <tspan x="730" dy="30">split safely, a list of arguments keeps spaces and</tspan>
    <tspan x="730" dy="30">special characters intact</tspan>
  </text>

  
  <rect x="40" y="285" width="1520" height="78" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="2"/>
  
  <rect x="58" y="304" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 68 316 L 75 322 L 68 328" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78" y1="328" x2="88" y2="328" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="116" y="335" font-family="monospace" font-size="30px" font-weight="bold" fill="#207448">shell</text>
  <text x="300" y="333" font-family="sans-serif" font-size="24px" fill="#303a36">yes (<tspan font-family="monospace">/bin/sh -c</tspan>)</text>
  <text x="730" y="333" font-family="sans-serif" font-size="24px" fill="#303a36">pipes, redirects, loops; quote variables with <tspan font-family="monospace">| quote</tspan></text>

  
  <rect x="40" y="371" width="1520" height="84" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="2"/>
  
  <path d="M 64 387 L 88 387 L 98 397 L 98 427 L 64 427 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 88 387 L 88 397 L 98 397" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="72" y1="407" x2="88" y2="407" stroke="#207448" stroke-width="2"/>
  <line x1="72" y1="415" x2="84" y2="415" stroke="#207448" stroke-width="2"/>
  <text x="116" y="424" font-family="monospace" font-size="30px" font-weight="bold" fill="#207448">script</text>
  <text x="300" y="407" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="300" dy="0">runs a local script</tspan>
    <tspan x="300" dy="28">remotely</tspan>
  </text>
  <text x="730" y="407" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="730" dy="0">bigger logic hard in modules; make</tspan>
    <tspan x="730" dy="28">idempotent with <tspan font-family="monospace">creates</tspan></tspan>
  </text>

  
  <rect x="40" y="463" width="1520" height="76" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="2"/>
  
  <rect x="58" y="481" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="71" cy="499" r="3" fill="#207448"/>
  <circle cx="81" cy="499" r="3" fill="#207448"/>
  <circle cx="91" cy="499" r="3" fill="#207448"/>
  <text x="116" y="512" font-family="monospace" font-size="30px" font-weight="bold" fill="#207448">raw</text>
  <text x="300" y="510" font-family="sans-serif" font-size="24px" fill="#303a36">raw SSH, no Python needed</text>
  <text x="730" y="510" font-family="sans-serif" font-size="24px" fill="#303a36">bootstrap Python; network gear</text>

  
  
  <rect x="40" y="565" width="890" height="485" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(62, 580)">
    <path d="M 18 4 L 34 11 L 34 26 C 34 38 18 46 18 46 C 18 46 2 38 2 26 L 2 11 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 10 24 L 16 30 L 26 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <rect x="115" y="580" width="790" height="56" rx="8" fill="#ffffff" stroke="#b2cfba" stroke-width="1.5"/>
  <circle cx="140" cy="608" r="8" fill="#207448"/>
  <text x="162" y="616" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">when a module exists, use it</text>

  
  <rect x="62" y="648" width="843" height="150" rx="8" fill="#ffffff" stroke="#b2cfba" stroke-width="1.5"/>
  <text x="86" y="680" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="86" dy="0">when you must run a command make the task describe</tspan>
    <tspan x="86" dy="30">its effect on state: guard it with <tspan font-family="monospace">creates</tspan>, <tspan font-family="monospace">removes</tspan> or <tspan font-family="monospace">when</tspan>,</tspan>
    <tspan x="86" dy="30">and set <tspan font-family="monospace">changed_when</tspan> and <tspan font-family="monospace">failed_when</tspan> from the</tspan>
    <tspan x="86" dy="30">command's actual output or exit code</tspan>
  </text>

  
  <rect x="62" y="810" width="843" height="58" rx="8" fill="#ffffff" stroke="#b2cfba" stroke-width="1.5"/>
  <text x="86" y="847" font-family="sans-serif" font-size="24px" fill="#303a36">never rely on <tspan font-family="monospace">stdout</tspan> parsing without checking <tspan font-family="monospace">rc</tspan></text>

  
  <rect x="62" y="880" width="843" height="145" rx="8" fill="#fdf7f0" stroke="#db8129" stroke-width="3"/>
  <rect x="62" y="880" width="12" height="145" rx="4" fill="#db8129"/>
  <g transform="translate(90, 895)">
    <path d="M 18 2 L 34 32 L 2 32 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="18" y1="13" x2="18" y2="21" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="27" r="2" fill="#db8129"/>
  </g>
  <text x="140" y="930" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
    <tspan x="140" dy="0">unquoted input can become an injection risk, so pass</tspan>
    <tspan x="140" dy="38">each value through &quot;<tspan font-family="monospace" fill="#db8129">{{ var | quote }}</tspan>&quot;</tspan>
  </text>

  
  <rect x="970" y="565" width="590" height="485" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1237, 582)">
    <rect x="6" y="4" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="11" r="2" fill="#207448"/>
    <line x1="38" y1="11" x2="44" y2="11" stroke="#207448" stroke-width="2.5"/>
    <rect x="6" y="22" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="29" r="2" fill="#207448"/>
    <line x1="38" y1="29" x2="44" y2="29" stroke="#207448" stroke-width="2.5"/>
    <rect x="6" y="40" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="47" r="2" fill="#207448"/>
    <line x1="38" y1="47" x2="44" y2="47" stroke="#207448" stroke-width="2.5"/>
  </g>

  
  <rect x="995" y="650" width="540" height="375" rx="8" fill="#ffffff" stroke="#b2cfba" stroke-width="1.5"/>
  <text x="1022" y="694" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="1022" dy="0">a vendor tool has no Ansible</tspan>
    <tspan x="1022" dy="42">module and must run once on each</tspan>
    <tspan x="1022" dy="42">of forty nodes: the quick fix is a</tspan>
    <tspan x="1022" dy="42">command task, and the risk is that</tspan>
    <tspan x="1022" dy="42">it runs again on every future run;</tspan>
    <tspan x="1022" dy="42">on its own it cannot tell Ansible</tspan>
    <tspan x="1022" dy="42">whether anything changed</tspan>
  </text>

  
  <rect x="40" y="1075" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="1122" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">A command task with no guard tells the reviewer nothing about rerunning</text>
</svg>