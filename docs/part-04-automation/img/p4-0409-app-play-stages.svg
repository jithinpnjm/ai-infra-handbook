    </g>
    <text x="525" y="1149" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">prune old releases</text>
  </g>

  
  <path d="M 840 1141 H 1215 V 990 H 1243" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="posttask-1">
    <rect x="1245" y="940" width="295" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(1374, 950)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="36" x2="8" y2="8" />
      <path d="M 8 8 L 30 14 L 8 20 Z" />
      <line x1="26" y1="26" x2="36" y2="36" />
      <line x1="36" y1="26" x2="26" y2="36" />
    </g>
    <text x="1392" y="1018" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">remove drain flag</text>
  </g>

  <line x1="1392" y1="1040" x2="1392" y2="1058" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="posttask-2">
    <rect x="1245" y="1062" width="295" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
