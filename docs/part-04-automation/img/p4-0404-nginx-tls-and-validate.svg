<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The NGINX TLS playbook, and validate saving a sudoers file</title>
  <desc>Ansible NGINX TLS configuration playbook structure alongside sudoers template validation safety</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The NGINX TLS playbook, and validate saving a sudoers file</text>
  <text x="50" y="108" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Ansible: Up and Running chapter 3</text>

  
  <rect x="50" y="135" width="730" height="950" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 50 151 A 16 16 0 0 1 66 135 L 764 135 A 16 16 0 0 1 780 151 L 780 215 L 50 215 Z" fill="#e8f1ea"/>
  
  
  <g transform="translate(70, 147)">
    <rect x="6" y="4" width="38" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="14" y1="16" x2="36" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="36" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="36" x2="26" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="135" y="185" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">webservers-tls.yml</text>

  
  <rect x="75" y="235" width="680" height="260" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(95, 247)">
    <circle cx="16" cy="18" r="4" fill="#207448"/>
    <path d="M 6 18 L 18 6 L 38 6 L 38 26 L 26 38 L 6 18 Z" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="150" y="274" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">vars</text>

  <g font-family="monospace" font-size="24" fill="#303a36">
    <text x="95" y="318">tls_dir: /etc/nginx/ssl/</text>
    <text x="95" y="356">key_file: nginx.key</text>
    <text x="95" y="394">cert_file: nginx.crt</text>
    <text x="95" y="432">conf_file: /etc/nginx/sites-available/default</text>
    <text x="95" y="470">server_name: localhost</text>
  </g>

  
  <rect x="75" y="515" width="680" height="550" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(95, 527)">
    <circle cx="20" cy="20" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 20 6 L 20 10 M 20 30 L 20 34 M 6 20 L 10 20 M 30 20 L 34 20 M 10 10 L 13 13 M 27 27 L 30 30 M 10 30 L 13 27 M 27 13 L 30 10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="150" y="554" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Tasks</text>

  
  <rect x="95" y="575" width="640" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1"/>
  <text x="115" y="608" fill="#303a36">
    <tspan x="115" dy="0" font-family="monospace" font-size="24">template: src=nginx.conf.j2</tspan>
    <tspan x="115" dy="34" font-family="monospace" font-size="24">dest={{ conf_file }} mode=0644</tspan>
    <tspan x="115" dy="34" font-family="sans-serif" font-size="24">fills {{ server_name }} and</tspan>
    <tspan x="115" dy="34" font-family="sans-serif" font-size="24">{{ tls_dir }}{{ cert_file }} into the server block</tspan>
  </text>

  
  <rect x="95" y="750" width="640" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1"/>
  <text x="115" y="785" fill="#303a36">
    <tspan x="115" dy="0" font-family="monospace" font-size="24">template: src=index.html.j2</tspan>
    <tspan x="115" dy="34" font-family="monospace" font-size="24">dest=/usr/share/nginx/html/index.html</tspan>
    <tspan x="115" dy="34" font-family="sans-serif" font-size="24">uses {{ inventory_hostname }}</tspan>
  </text>

  
  <rect x="95" y="905" width="640" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1"/>
  <text x="115" y="942" fill="#303a36">
    <tspan x="115" dy="0" font-family="sans-serif" font-size="24">whenever the rendered file changes</tspan>
    <tspan x="115" dy="34" font-family="monospace" font-size="24">notify: Restart nginx</tspan>
    <tspan x="115" dy="34" font-family="sans-serif" font-size="24">restarts the service</tspan>
  </text>


  
  <rect x="820" y="135" width="730" height="950" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 820 151 A 16 16 0 0 1 836 135 L 1534 135 A 16 16 0 0 1 1550 151 L 1550 235 L 820 235 Z" fill="#e8f1ea"/>
  
  
  <g transform="translate(840, 155)">
    <path d="M 28 6 L 48 14 L 48 28 C 48 44 28 54 28 54 C 28 54 8 44 8 28 L 8 14 Z" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="910" y="180" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="910" dy="0">/etc/sudoers replaced by a template</tspan>
    <tspan x="910" dy="34">with one mistyped character</tspan>
  </text>

  
  <rect x="845" y="255" width="330" height="75" rx="10" fill="#fdf0ed" stroke="#db8129" stroke-width="2"/>
  <text x="1010" y="302" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">without validate</text>

  <rect x="845" y="350" width="330" height="390" rx="10" fill="#fdf0ed" stroke="#db8129" stroke-width="2"/>
  
  
  <g transform="translate(982, 380)">
    <path d="M 28 8 L 52 48 L 4 48 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="22" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
  </g>

  <text x="865" y="490" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="865" dy="0">broken file lands,</tspan>
    <tspan x="865" dy="38">next sudo command</tspan>
    <tspan x="865" dy="38">fails for every</tspan>
    <tspan x="865" dy="38">administrator</tspan>
  </text>

  
  <rect x="1195" y="255" width="330" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1360" y="286" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="1360" dy="0">validate:</tspan>
    <tspan x="1360" dy="28">"visudo -cf %s"</tspan>
  </text>

  <rect x="1195" y="350" width="330" height="390" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1332, 380)">
    <path d="M 28 8 L 48 16 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 16 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 18 28 L 25 35 L 38 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1215" y="490" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1215" dy="0">check runs first,</tspan>
    <tspan x="1215" dy="38">the bad file is</tspan>
    <tspan x="1215" dy="38">rejected and the old</tspan>
    <tspan x="1215" dy="38">one stays in place</tspan>
  </text>

  
  <rect x="845" y="765" width="680" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(870, 785)">
    <rect x="10" y="20" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 18 20 L 18 14 C 18 8 38 8 38 14 L 38 20" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="32" r="3" fill="#207448"/>
    <line x1="28" y1="35" x2="28" y2="40" stroke="#207448" stroke-width="3"/>
  </g>

  <text x="940" y="822" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="870" dy="50">for any file a broken config could lock</tspan>
    <tspan x="870" dy="38">you out of, such as sudoers or sshd,</tspan>
    <tspan x="870" dy="38">set validate before you trust the</tspan>
    <tspan x="870" dy="38">template</tspan>
  </text>


  
  <rect x="50" y="1110" width="1500" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Validate before install</text>
</svg>