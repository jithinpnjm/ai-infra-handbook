<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Locked-down sudo rules fail because Ansible's temporary script path changes every task</title>
  <desc>Visual infographic explaining why locked-down sudo rules fail when Ansible executes modules via dynamically generated temporary file paths, and how to properly configure sudoers privileges.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Locked-down sudo rules fail because</text>
  <text x="800" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ansible's temporary script path changes every task</text>

  

  
  <g transform="translate(480, 175)">
    <rect width="580" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(262, 20)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="20" cy="20" r="14" />
      <path d="M 30 30 L 52 52 M 42 42 L 48 36 M 47 47 L 53 41" />
    </g>
    
    <text x="290" y="105" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="24" font-weight="bold" fill="#207448">%ansible ALL=(ALL) NOPASSWD: ALL</text>
    <text x="290" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">in <tspan font-family="'SF Mono', Monaco, Consolas, monospace">/etc/sudoers.d/ansible</tspan>,</text>
    <text x="290" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">then <tspan font-family="'SF Mono', Monaco, Consolas, monospace">visudo -cf</tspan></text>
  </g>

  
  <g transform="translate(1100, 175)">
    <rect width="440" height="235" rx="12" fill="#e8f1ea" stroke="#8ca394" stroke-width="2.5" />
    
    <g transform="translate(192, 20)" stroke="#303a36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="22" width="36" height="28" rx="6" />
      <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22" />
      <circle cx="28" cy="35" r="3" fill="#303a36" />
    </g>
    
    <text x="220" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">allow only fixed binaries</text>
    <text x="220" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">such as <tspan font-family="'SF Mono', Monaco, Consolas, monospace">/usr/bin/apt-get</tspan></text>
  </g>

  

  
  <g transform="translate(60, 460)">
    <rect width="440" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="56" cy="56" r="24" fill="#207448" />
    <text x="56" y="56" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(250, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 6 46 H 46 V 16 L 34 4 H 6 Z" />
      <path d="M 34 4 V 16 H 46" />
      <path d="M 26 36 V 22 M 19 28 L 26 21 L 33 28" />
    </g>
    
    <text x="220" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Ansible uploads</text>
    <text x="220" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36"><tspan font-family="'SF Mono', Monaco, Consolas, monospace">AnsiballZ_package.py</tspan> to</text>
    <text x="220" y="210" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="24" fill="#303a36">~/.ansible/tmp/</text>
    <text x="220" y="255" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="24" fill="#303a36">ansible-tmp-&lt;random&gt;/</text>
  </g>

  
  <line x1="500" y1="607" x2="576" y2="607" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(580, 460)">
    <rect width="440" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="56" cy="56" r="24" fill="#207448" />
    <text x="56" y="56" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(250, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="48" height="38" rx="6" />
      <path d="M 14 20 L 22 25 L 14 30" />
      <line x1="26" y1="32" x2="36" y2="32" />
    </g>
    
    <text x="220" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Runs <tspan font-family="'SF Mono', Monaco, Consolas, monospace">python</tspan> on that path</text>
    <text x="220" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">through <tspan font-family="'SF Mono', Monaco, Consolas, monospace">sudo</tspan></text>
  </g>

  
  <line x1="1020" y1="607" x2="1096" y2="607" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(1100, 460)">
    <rect width="440" height="295" rx="12" fill="#ffffff" stroke="#c93b2b" stroke-width="3.5" />
    
    <circle cx="56" cy="56" r="24" fill="#c93b2b" />
    <text x="56" y="56" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(250, 26)" stroke="#c93b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 V 28 C 48 40 38 48 28 52 C 18 48 8 40 8 28 V 14 Z" />
      <path d="M 20 22 L 36 36 M 36 22 L 20 36" />
    </g>
    
    <text x="220" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">A sudoers rule for</text>
    <text x="220" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">one fixed binary cannot</text>
    <text x="220" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">match the random path,</text>
    <text x="220" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#c93b2b">so the run fails</text>
  </g>

  
  <g transform="translate(60, 795)">
    <rect width="1480" height="110" rx="10" fill="#fbf5ee" stroke="#db8129" stroke-width="2" />
    
    <g transform="translate(45, 29)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 26 4 L 50 46 H 2 Z" />
      <line x1="26" y1="18" x2="26" y2="30" />
      <circle cx="26" cy="38" r="1.5" fill="#db8129" stroke="none" />
    </g>
    
    <text x="130" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Granting the automation account full sudo is a privileged decision:</text>
    <text x="130" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">keep the account dedicated, key-only and audited.</text>
  </g>

  
  <g transform="translate(60, 935)">
    <rect width="1480" height="75" rx="10" fill="#207448" />
    <text x="740" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Scope become to the tasks that need root.</text>
  </g>
</svg>