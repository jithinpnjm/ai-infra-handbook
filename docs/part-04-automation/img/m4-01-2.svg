<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The three areas</title>
  <desc>Infographic showing Git's three areas: Working tree, Index / staging area, and Repository, with transitions git add, git commit, git restore --staged, and git restore / checkout.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The three areas</text>

  
  <rect x="40" y="170" width="330" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(205, 232)">
    <path d="M -23 -27 L 9 -27 L 23 -13 L 23 27 L -23 27 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="9,-27 9,-13 23,-13" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="-13" y1="-4" x2="1" y2="-4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-13" y1="7" x2="13" y2="7" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-13" y1="17" x2="9" y2="17" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="205" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Working tree</text>
  <text x="205" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635e">(files you edit)</text>

  
  <rect x="590" y="170" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(800, 232)">
    <rect x="-25" y="-20" width="50" height="47" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M -12 -20 L -12 -26 C -12 -29 -10 -31 -7 -31 L 7 -31 C 10 -31 12 -29 12 -26 L 12 -20 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -15 0 L -10 5 L 0 -5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="7" y1="0" x2="17" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M -15 15 L -10 20 L 0 10" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="7" y1="15" x2="17" y2="15" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="800" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Index / staging area</text>
  <text x="800" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635e">
    <tspan x="800" dy="0">(what the next commit</tspan>
    <tspan x="800" dy="32">will contain)</tspan>
  </text>

  
  <rect x="1230" y="170" width="330" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1395, 232)">
    <ellipse cx="0" cy="-18" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M -26 2 C -26 8, 26 8, 26 2" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M -26 -18 L -26 22 C -26 28, 26 28, 26 22 L 26 -18" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="1395" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Repository</text>
  <text x="1395" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635e">(history)</text>

  
  <rect x="410" y="205" width="140" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="480" y="234" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">git add</text>
  <line x1="370" y1="270" x2="590" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1030" y="205" width="180" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="1120" y="234" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">git commit</text>
  <line x1="1010" y1="270" x2="1230" y2="270" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="325" y="538" width="320" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="485" y="567" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">git restore --staged</text>
  <path d="M 700 470 L 700 594 Q 700 610 684 610 L 286 610 Q 270 610 270 594 L 270 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="585" y="698" width="350" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="760" y="727" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">git restore / checkout</text>
  <path d="M 1395 470 L 1395 754 Q 1395 770 1379 770 L 156 770 Q 140 770 140 754 L 140 470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
</svg>