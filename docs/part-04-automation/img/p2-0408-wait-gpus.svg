<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>After a reboot, wait for the GPUs to answer, not just for the host to respond</title>
  <desc>A horizontal timeline showing reboot sequence, delay for driver loading, GPU readiness polling with nvidia-smi, and success or timeout exits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#7a8b84" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">After a reboot, wait for the GPUs to answer, not just for the host to respond</text>

  
  <line x1="80" y1="280" x2="1520" y2="280" stroke="#d2dfd6" stroke-width="6" stroke-dasharray="10 8" />

  
  <g transform="translate(60, 160)">
    
    <rect x="0" y="0" width="300" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="24" fill="#207448" />
    <text x="36" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(140, 30)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="100 30" />
      <line x1="28" y1="6" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="150" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">Reboot starts,</tspan>
      <tspan x="150" dy="42">SSH goes down</tspan>
    </text>
  </g>

  
  <line x1="360" y1="280" x2="415" y2="280" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(425, 160)">
    
    <rect x="0" y="0" width="370" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="24" fill="#207448" />
    <text x="36" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(180, 24)">
      <rect x="4" y="6" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="40" x2="28" y2="52" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="52" x2="40" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="14,24 22,24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="28,24 38,24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="185" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="185" dy="0">Operating system answers</tspan>
      <tspan x="185" dy="36">on the network, login</tspan>
      <tspan x="185" dy="36">prompt appears</tspan>
    </text>
  </g>

  
  <line x1="795" y1="280" x2="840" y2="280" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(850, 160)">
    <rect x="0" y="0" width="310" height="240" rx="16" fill="#e9ecea" stroke="#7a8b84" stroke-width="3" stroke-dasharray="8 6" />
    
    <g transform="translate(127, 28)">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#7a8b84" stroke-width="4" />
      <line x1="20" y1="2" x2="20" y2="8" stroke="#7a8b84" stroke-width="4" />
      <line x1="36" y1="2" x2="36" y2="8" stroke="#7a8b84" stroke-width="4" />
      <line x1="20" y1="48" x2="20" y2="54" stroke="#7a8b84" stroke-width="4" />
      <line x1="36" y1="48" x2="36" y2="54" stroke="#7a8b84" stroke-width="4" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#7a8b84" stroke-width="4" stroke-dasharray="14 10" />
    </g>
    
    <text x="155" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#46544f">
      <tspan x="155" dy="0">NVIDIA modules may</tspan>
      <tspan x="155" dy="38">still be loading</tspan>
    </text>
  </g>

  
  <g transform="translate(850, 420)">
    
    <path d="M 10 10 L 10 30 L 145 30 L 155 45 L 165 30 L 300 30 L 300 10" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="155" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">post_reboot_delay: 30 s,</tspan>
      <tspan x="155" dy="32">pause before the first test</tspan>
    </text>
  </g>

  
  <line x1="1160" y1="280" x2="1205" y2="280" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1215, 160)">
    
    <rect x="0" y="0" width="335" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="24" fill="#207448" />
    <text x="36" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(155, 26)">
      <rect x="4" y="6" width="48" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 18 L 22 25 L 14 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="32" x2="40" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="167" y="135" text-anchor="middle" fill="#303a36">
      <tspan x="167" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold">test_command runs:</tspan>
      <tspan x="167" dy="44" font-family="ui-monospace, monospace" font-size="28" font-weight="bold">nvidia-smi -L</tspan>
    </text>
  </g>

  
  <g>
    
    <path d="M 1420 160 C 1460 90, 1340 50, 1280 90 C 1255 107, 1255 130, 1255 150" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="1275" y="42" width="235" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1392" y="71" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">repeat until it passes</text>
  </g>

  

  
  
  <path d="M 1460 400 L 1460 560 L 1460 610" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <g transform="translate(1080, 620)">
    
    <rect x="0" y="0" width="470" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(40, 36)">
      <path d="M 28 6 L 50 14 L 50 32 C 50 46 28 54 28 54 C 28 54 6 46 6 32 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 28 L 25 35 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="250" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="250" dy="0">GPUs answer:</tspan>
      <tspan x="250" dy="44">return the node</tspan>
      <tspan x="250" dy="44">to service</tspan>
    </text>
  </g>

  
  
  <path d="M 1300 400 L 1300 530 L 760 530 L 760 610" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  <g transform="translate(520, 620)">
    
    <rect x="0" y="0" width="480" height="220" rx="16" fill="#fcf8f2" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(40, 36)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4" />
      <polyline points="28,14 28,28 40,28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="46" x2="54" y2="54" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="260" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="260" dy="0">reboot_timeout: 1800 s</tspan>
      <tspan x="260" dy="44">runs out: the task fails</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 930)">
    <rect x="0" y="0" width="1480" height="90" rx="16" fill="#207448" />
    <text x="740" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">The host answered is not the same as the GPUs answered.</text>
  </g>
</svg>