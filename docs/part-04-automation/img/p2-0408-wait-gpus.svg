<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>After a reboot, wait for the GPUs to answer</title>
  <desc>Horizontal sequence diagram showing the host reboot timeline, driver load delay, GPU polling test loop, and outcome branches.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="50" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">After a reboot, wait for the GPUs to answer</text>

  
  <g id="event-1">
    <rect x="50" y="270" width="240" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="85" cy="305" r="20" fill="#207448" />
    <text x="85" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(145, 295)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="50" height="34" rx="4" />
      <line x1="10" y1="17" x2="20" y2="17" />
      <circle cx="38" cy="17" r="3" fill="#207448" />
      <path d="M 16 42 A 12 12 0 1 1 34 42" />
      <line x1="25" y1="36" x2="25" y2="44" />
    </g>

    
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="170" y="420">Reboot starts,</tspan>
      <tspan x="170" y="458">SSH goes down</tspan>
    </text>
  </g>

  
  <line x1="290" y1="395" x2="338" y2="395" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="event-2">
    <rect x="340" y="270" width="280" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="375" cy="305" r="20" fill="#207448" />
    <text x="375" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(455, 292)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="50" height="36" rx="4" />
      <line x1="15" y1="36" x2="35" y2="36" />
      <path d="M 10 12 L 18 18 L 10 24" />
      <line x1="22" y1="24" x2="34" y2="24" />
    </g>

    
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="480" y="380">Operating system</tspan>
      <tspan x="480" y="414">answers on the</tspan>
      <tspan x="480" y="448">network, login</tspan>
      <tspan x="480" y="482">prompt appears</tspan>
    </text>
  </g>

  
  
  <line x1="620" y1="395" x2="1008" y2="395" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="grey-band">
    <rect x="655" y="245" width="320" height="115" rx="12" fill="#e2e8e5" stroke="#78909c" stroke-width="2" stroke-dasharray="6 4" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#37474f">
      <tspan x="815" y="295">NVIDIA modules may</tspan>
      <tspan x="815" y="332">still be loading</tspan>
    </text>
  </g>

  
  <g id="delay-bracket">
    <path d="M 645,435 L 645,447 L 815,447 L 815,460 L 815,447 L 985,447 L 985,435" stroke="#207448" stroke-width="2.5" fill="none" />
    <text text-anchor="middle" fill="#303a36">
      <tspan x="815" y="492" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">post_reboot_delay: 30 s,</tspan>
      <tspan x="815" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24">pause before the first test</tspan>
    </text>
  </g>

  
  <g id="event-3">
    <rect x="1010" y="270" width="280" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="1045" cy="305" r="20" fill="#207448" />
    <text x="1045" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(1125, 292)" stroke="#207448" stroke-width="2.5" fill="none">
      <rect x="0" y="0" width="46" height="40" rx="4" />
      <rect x="11" y="9" width="24" height="22" rx="2" fill="#207448" />
      <line x1="8" y1="-5" x2="8" y2="0" stroke-width="2" />
      <line x1="23" y1="-5" x2="23" y2="0" stroke-width="2" />
      <line x1="38" y1="-5" x2="38" y2="0" stroke-width="2" />
      <line x1="8" y1="40" x2="8" y2="45" stroke-width="2" />
      <line x1="23" y1="40" x2="23" y2="45" stroke-width="2" />
      <line x1="38" y1="40" x2="38" y2="45" stroke-width="2" />
    </g>

    
    <text text-anchor="middle">
      <tspan x="1150" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">test_command runs:</tspan>
      <tspan x="1150" y="430" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">nvidia-smi -L</tspan>
    </text>
  </g>

  
  <g id="loop">
    <path d="M 1220,270 C 1220,150 1080,150 1080,260" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
    
    <rect x="1000" y="126" width="300" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1150" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">repeat until it passes</text>
  </g>

  
  <line x1="1290" y1="395" x2="1328" y2="395" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="exit-success">
    <rect x="1330" y="270" width="230" height="250" rx="16" fill="#207448" />

    
    <circle cx="1445" cy="325" r="22" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 1435 325 L 1442 333 L 1457 317" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="1445" y="385">GPUs answer:</tspan>
      <tspan x="1445" y="420">return the node</tspan>
      <tspan x="1445" y="455">to service</tspan>
    </text>
  </g>

  
  <path d="M 1150,520 L 1150,710 L 1158,710" stroke="#db8129" stroke-width="3" fill="none" marker-end="url(#arrow-orange)" />

  
  <g id="exit-timeout">
    <rect x="1160" y="620" width="400" height="180" rx="16" fill="#fff9f5" stroke="#db8129" stroke-width="3" />

    
    <g transform="translate(1340, 642)" stroke="#db8129" stroke-width="2.5" fill="none">
      <circle cx="20" cy="20" r="18" />
      <polyline points="20,10 20,20 28,24" />
    </g>

    
    <text text-anchor="middle" fill="#303a36">
      <tspan x="1360" y="718" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#db8129">reboot_timeout: 1800 s</tspan>
      <tspan x="1360" y="754" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">runs out: the task fails</tspan>
    </text>
  </g>

  
  <g id="takeaway">
    <rect x="50" y="870" width="1510" height="80" rx="12" fill="#207448" />
    <text x="805" y="920" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The host answered is not the same as the GPUs answered.</text>
  </g>
</svg>