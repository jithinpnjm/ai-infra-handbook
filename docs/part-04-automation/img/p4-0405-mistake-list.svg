<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Inventory mistakes are quiet: a shortlist to check against your own repo</title>
  <desc>An infographic listing critical inventory and configuration habits and errors to check in repositories.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Inventory mistakes are quiet:</tspan>
    <tspan x="800" dy="54">a shortlist to check against your own repo</tspan>
  </text>

  
  <rect x="40" y="145" width="1520" height="125" rx="10" fill="#fdf6ee" stroke="#db8129" stroke-width="3" />
  
  
  <g transform="translate(68, 178)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="46" height="58" rx="4" />
    <line x1="8" y1="12" x2="38" y2="12" />
    <circle cx="14" cy="12" r="1.5" fill="#db8129" />
    <line x1="8" y1="24" x2="38" y2="24" />
    <circle cx="14" cy="24" r="1.5" fill="#db8129" />
    <line x1="8" y1="36" x2="38" y2="36" stroke-dasharray="3 3" />
    <line x1="8" y1="48" x2="38" y2="48" />
    <circle cx="14" cy="48" r="1.5" fill="#db8129" />
  </g>

  
  <text x="142" y="184" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="142" dy="0">a green dashboard after a rollout and one rack never received the new driver:</tspan>
    <tspan x="142" dy="32">nothing failed because nothing was asked to run there;</tspan>
    <tspan x="142" dy="32">count the hosts a run targets before you start it</tspan>
  </text>

  
  <rect x="40" y="295" width="740" height="805" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="342" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Habits</text>

  
  <g transform="translate(56, 365)">
    <rect x="0" y="0" width="708" height="127" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="8" width="30" height="42" rx="3" />
      <path d="M8 8 V0 H38 V34 H30" />
      <line x1="6" y1="20" x2="24" y2="20" />
      <line x1="6" y1="28" x2="24" y2="28" />
      <line x1="6" y1="36" x2="18" y2="36" />
    </g>
    <text x="82" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">a giant flat inventory repeats the same</tspan>
      <tspan x="82" dy="28">variables on every host, so</tspan>
      <tspan x="82" dy="28">host_vars sprawls</tspan>
    </text>
  </g>

  
  <g transform="translate(56, 508)">
    <rect x="0" y="0" width="708" height="127" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="20" width="36" height="28" rx="4" />
      <path d="M12 20 V12 C12 6 32 6 32 12 V20" />
      <circle cx="22" cy="32" r="3" fill="#207448" />
      <line x1="22" y1="35" x2="22" y2="40" />
    </g>
    <text x="82" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">variables in role vars/ are hard to</tspan>
      <tspan x="82" dy="28">override, so people reach for -e</tspan>
      <tspan x="82" dy="28">to patch precedence problems</tspan>
    </text>
  </g>

  
  <g transform="translate(56, 651)">
    <rect x="0" y="0" width="708" height="127" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="18" r="10" />
      <path d="M24 24 L42 42" />
      <line x1="34" y1="34" x2="38" y2="30" />
      <line x1="39" y1="39" x2="43" y2="35" />
      <line x1="8" y1="38" x2="16" y2="46" stroke-dasharray="2 3" />
    </g>
    <text x="82" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">plaintext secrets in inventory files, or</tspan>
      <tspan x="82" dy="28">ansible_password in vars, leak to</tspan>
      <tspan x="82" dy="28">everyone who can read the repository</tspan>
    </text>
  </g>

  
  <g transform="translate(56, 794)">
    <rect x="0" y="0" width="708" height="127" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="10" y1="6" x2="10" y2="46" />
      <circle cx="10" cy="10" r="4" fill="#207448" />
      <circle cx="10" cy="42" r="4" fill="#207448" />
      <path d="M10 24 C26 24 36 18 36 10" />
      <circle cx="36" cy="10" r="4" fill="#207448" />
    </g>
    <text x="82" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">a branch per environment instead of an</tspan>
      <tspan x="82" dy="28">inventory directory per environment</tspan>
      <tspan x="82" dy="28">lets environments drift apart</tspan>
    </text>
  </g>

  
  <g transform="translate(56, 937)">
    <rect x="0" y="0" width="708" height="127" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 38)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="22" cy="12" rx="16" ry="6" />
      <path d="M6 12 V38 C6 44 38 44 38 38 V12" />
      <path d="M6 25 C6 31 38 31 38 25" />
      <line x1="30" y1="2" x2="44" y2="16" stroke-width="4" />
    </g>
    <text x="82" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">static inventories nobody updates after</tspan>
      <tspan x="82" dy="28">RMAs and expansions go stale; a dynamic</tspan>
      <tspan x="82" dy="28">inventory with no cache hammers the API</tspan>
    </text>
  </g>

  
  <rect x="820" y="295" width="740" height="805" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="850" y="342" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Smaller errors</text>

  
  <g transform="translate(836, 375)">
    <rect x="0" y="0" width="708" height="152" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6 L42 42 H2 Z" />
      <line x1="22" y1="20" x2="22" y2="28" />
      <circle cx="22" cy="35" r="1.5" fill="#207448" />
    </g>
    <text x="82" y="52" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">group names with hyphens or spaces, or</tspan>
      <tspan x="82" dy="32">names that collide with variables,</tspan>
      <tspan x="82" dy="32">cause warnings</tspan>
    </text>
  </g>

  
  <g transform="translate(836, 553)">
    <rect x="0" y="0" width="708" height="152" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="26" rx="3" />
      <line x1="14" y1="32" x2="30" y2="32" />
      <line x1="22" y1="32" x2="22" y2="40" />
      <line x1="12" y1="40" x2="32" y2="40" />
      <line x1="12" y1="18" x2="20" y2="18" />
    </g>
    <text x="82" y="68" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">expecting localhost to be part of all:</tspan>
      <tspan x="82" dy="34">it is implicit and is not</tspan>
    </text>
  </g>

  
  <g transform="translate(836, 731)">
    <rect x="0" y="0" width="708" height="152" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="14" width="26" height="26" rx="3" stroke-dasharray="3 3" />
      <rect x="14" y="6" width="28" height="28" rx="3" fill="#ffffff" />
      <line x1="20" y1="16" x2="34" y2="16" />
      <line x1="20" y1="24" x2="30" y2="24" />
    </g>
    <text x="82" y="52" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">dictionaries replace rather than merge</tspan>
      <tspan x="82" dy="32">across layers, which surprises</tspan>
      <tspan x="82" dy="32">almost everyone once</tspan>
    </text>
  </g>

  
  <g transform="translate(836, 909)">
    <rect x="0" y="0" width="708" height="152" rx="8" fill="#ffffff" stroke="#c2d8c8" stroke-width="1.5" />
    
    <g transform="translate(18, 50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="32" height="38" rx="4" />
      <line x1="14" y1="4" x2="30" y2="4" stroke-width="4" />
      <path d="M12 20 L16 24 L24 16" />
      <line x1="14" y1="32" x2="22" y2="40" />
      <line x1="22" y1="32" x2="14" y2="40" />
    </g>
    <text x="82" y="52" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="82" dy="0">no validation of required host data,</tspan>
      <tspan x="82" dy="32">so a playbook fails halfway across</tspan>
      <tspan x="82" dy="32">the fleet</tspan>
    </text>
  </g>

  
  <rect x="40" y="1120" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="1158" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Read the list with one question: which host did this miss?</text>
</svg>