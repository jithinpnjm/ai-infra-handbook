<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>The GCP inventory plugin config, line by line</title>
  <desc>Visual explanation and line-by-line breakdown of the GCP dynamic inventory plugin configuration with AWS comparison.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">The GCP inventory plugin config, line by line</text>

  
  <rect x="40" y="120" width="1020" height="1080" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(70, 145)">
    
    <rect x="0" y="5" width="46" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="20" x2="34" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="34" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="44" x2="26" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="65" y="30" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">Annotated config 'inventories/gcp/gcp.gcp_compute.yml'</text>
    <text x="65" y="60" font-family="sans-serif" font-size="24" fill="#303a36">(the file name must end with the plugin's required suffix).</text>
  </g>

  
  <rect x="70" y="235" width="960" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="287" font-family="monospace" font-size="24" fill="#303a36">'plugin: google.cloud.gcp_compute'</text>

  
  <rect x="70" y="335" width="960" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="387" font-family="monospace" font-size="24" fill="#303a36">'projects: [my-ai-project], zones: [us-central1-a, us-central1-b]'</text>

  
  <rect x="70" y="435" width="960" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="475" font-family="monospace" font-size="24" fill="#303a36">'auth_kind: application: use ADC or workload identity,</text>
  <text x="100" y="509" font-family="sans-serif" font-size="24" fill="#303a36">not key files'</text>

  
  <rect x="70" y="545" width="960" height="110" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="4"/>
  <path d="M 88 565 L 102 585 L 102 610 L 108 610 L 108 585 L 122 565 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
  <text x="135" y="588" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">'filters: labels.env = prod, status = RUNNING:</text>
  <text x="135" y="626" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">narrows the query on the server side'</text>

  
  <rect x="70" y="670" width="960" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="722" font-family="monospace" font-size="24" fill="#303a36">'hostnames: [name]'</text>

  
  <rect x="70" y="770" width="960" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="812" font-family="monospace" font-size="24" fill="#303a36">'compose: ansible_host: networkInterfaces[0].networkIP:</text>
  <text x="100" y="850" font-family="sans-serif" font-size="24" fill="#303a36">sets ansible_host from the network interface'</text>

  
  <rect x="70" y="895" width="960" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="938" font-family="monospace" font-size="24" fill="#303a36">'keyed_groups: key labels.role prefix role gives role_gpu,</text>
  <text x="100" y="976" font-family="sans-serif" font-size="24" fill="#303a36">role_login; key zone prefix zone'</text>

  
  <rect x="70" y="1030" width="960" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="1070" font-family="monospace" font-size="24" fill="#303a36">'groups: gpu_a3: "machineType.endswith(a3-highgpu-8g)":</text>
  <text x="100" y="1110" font-family="sans-serif" font-size="24" fill="#303a36">a group from a Jinja condition'</text>

  
  <rect x="1090" y="120" width="470" height="1080" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1120, 150)">
    
    <path d="M 12 36 A 16 16 0 0 1 36 20 A 22 22 0 0 1 70 24 A 16 16 0 0 1 78 48 L 16 48 A 12 12 0 0 1 12 36 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <text x="96" y="38" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">AWS comparison</text>
  </g>

  
  <rect x="1115" y="235" width="420" height="940" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  <text x="1140" y="285" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1140" dy="0">'aws_ec2.yml:</tspan>
    <tspan x="1140" dy="48">plugin amazon.aws.aws_ec2,</tspan>
    <tspan x="1140" dy="58">regions [us-east-1],</tspan>
    <tspan x="1140" dy="58">filters instance-state-name</tspan>
    <tspan x="1140" dy="42">running and tag:Env prod,</tspan>
    <tspan x="1140" dy="58">keyed_groups tags.Role</tspan>
    <tspan x="1140" dy="42">prefix role and</tspan>
    <tspan x="1140" dy="42">instance_type prefix type,</tspan>
    <tspan x="1140" dy="58">compose ansible_host:</tspan>
    <tspan x="1140" dy="42">private_ip_address'</tspan>
  </text>

  
  <rect x="40" y="1230" width="1520" height="80" rx="12" fill="#207448"/>
  <g transform="translate(70, 1246)">
    
    <path d="M 24 6 L 42 14 L 42 28 C 42 40 24 48 24 48 C 24 48 6 40 6 28 L 6 14 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="5" fill="#ffffff"/>
  </g>
  <text x="140" y="1280" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The plugin asks the cloud, so keep secrets out of the config</text>
</svg>