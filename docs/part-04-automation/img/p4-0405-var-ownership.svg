<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1290" width="1600" height="1290">
  <title>Who owns this variable: placement rules and naming</title>
  <desc>Infographic explaining Ansible variable placement rules, naming collision avoidance, and secret handling.</desc>

  
  <rect width="1600" height="1290" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Who owns this variable: placement rules and naming</text>

  
  <g transform="translate(40, 95)">
    <rect width="1520" height="105" rx="8" fill="#db8129"/>
    
    <g stroke="#ffffff" stroke-width="3" fill="none" transform="translate(30, 24)">
      <rect x="0" y="0" width="44" height="16" rx="2"/>
      <circle cx="8" cy="8" r="2" fill="#ffffff"/>
      <rect x="0" y="24" width="44" height="16" rx="2"/>
      <circle cx="8" cy="32" r="2" fill="#ffffff"/>
      <path d="M52 20 h22 M66 12 l8 8 -8 8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="125" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      <tspan x="125" dy="0">would the value still be true if the host were moved to a different rack? if no, it belongs</tspan>
      <tspan x="125" dy="34">on a rack group or a host, not on a hardware group</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 225)">
    <rect width="1520" height="435" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <path d="M 0 8 Q 0 0 8 0 L 1512 0 Q 1520 0 1520 8 L 1520 55 L 0 55 Z" fill="#207448"/>
    <text x="30" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Kind of value</text>
    <text x="420" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Where it lives</text>

    
    <line x1="390" y1="0" x2="390" y2="435" stroke="#207448" stroke-width="2"/>

    
    <rect x="0" y="55" width="1520" height="60" fill="#f5f8f5"/>
    <line x1="0" y1="115" x2="1520" y2="115" stroke="#e8f1ea" stroke-width="2"/>
    <text x="30" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Hardware traits</text>
    <text x="420" y="94" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#207448">hardware groups</text>

    
    <rect x="0" y="115" width="1520" height="60" fill="#ffffff"/>
    <line x1="0" y1="175" x2="1520" y2="175" stroke="#e8f1ea" stroke-width="2"/>
    <text x="30" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Role settings</text>
    <text x="420" y="154" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#207448">role groups</text>

    
    <rect x="0" y="175" width="1520" height="60" fill="#f5f8f5"/>
    <line x1="0" y1="235" x2="1520" y2="235" stroke="#e8f1ea" stroke-width="2"/>
    <text x="30" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Cluster-wide settings</text>
    <text x="420" y="214" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#207448">all</text>

    
    <rect x="0" y="235" width="1520" height="80" fill="#ffffff"/>
    <line x1="0" y1="315" x2="1520" y2="315" stroke="#e8f1ea" stroke-width="2"/>
    <text x="30" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">True exceptions only</text>
    <text x="420" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="Courier New, monospace" font-weight="bold" fill="#207448">host_vars: </tspan>every entry makes the host a snowflake,
      <tspan x="420" dy="32">a one-off nobody else shares</tspan>
    </text>

    
    <rect x="0" y="315" width="1520" height="60" fill="#f5f8f5"/>
    <line x1="0" y1="375" x2="1520" y2="375" stroke="#e8f1ea" stroke-width="2"/>
    <text x="30" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Defaults</text>
    <text x="420" y="354" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#207448">role defaults/</text>

    
    <rect x="0" y="375" width="1520" height="60" fill="#ffffff"/>
    <text x="30" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Per-run overrides</text>
    <text x="420" y="414" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#207448">-e</text>
  </g>

  
  <g transform="translate(40, 685)">
    <rect width="1520" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(35, 48)">
      <path d="M 12 3 L 36 3 L 52 19 L 28 43 L 4 19 L 4 11 Z"/>
      <circle cx="16" cy="15" r="3" fill="#207448"/>
    </g>
    <text x="125" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0">prefix each variable with its role: nvidia_driver_branch, slurm_cluster_name; a generic name like version</tspan>
      <tspan x="125" dy="34">that a Slurm role and a driver role both set means one value silently wins and the other role breaks</tspan>
      <tspan x="125" dy="34">without a clear message; the prefix makes the collision visible and precedence easier to debug</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 865)">
    <rect width="1520" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(38, 55)">
      <rect x="4" y="24" width="44" height="34" rx="4"/>
      <path d="M 14 24 V 14 A 12 12 0 0 1 38 14 V 24"/>
      <circle cx="26" cy="40" r="3" fill="#207448"/>
    </g>
    <text x="125" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0">keep secrets in encrypted files or an external store (4.12); refer by name:</tspan>
      <tspan x="125" dy="34" font-family="Courier New, monospace" font-weight="bold" fill="#207448">slurm_db_password: "{{ vault_slurm_db_password }}";</tspan>
      <tspan x="125" dy="34">the plain file holds only a pointer; a grep shows where each secret is used,</tspan>
      <tspan x="125" dy="34">so rotation is a search instead of a guess</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1070)">
    <rect width="1520" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(35, 25)">
      <rect x="0" y="0" width="56" height="44" rx="4"/>
      <path d="M 12 14 L 22 22 L 12 30 M 28 30 L 44 30"/>
    </g>
    <text x="125" y="40" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">ansible-inventory --host <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal">from the workstation before a run;</tspan></tspan>
      <tspan x="125" dy="34">debug: var=hostvars[inventory_hostname] <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal">inside a play</tspan></tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1190)">
    <rect width="1520" height="70" rx="8" fill="#207448"/>
    <text x="760" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep each variable close to the group that owns it</text>
  </g>
</svg>