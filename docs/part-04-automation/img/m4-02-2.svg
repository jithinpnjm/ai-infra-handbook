<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Golden images as pipeline artefacts</title>
  <desc>A visual pipeline showing golden image creation from Git Packer templates through Ansible provisioning, security hardening, GPU boot testing, immutable artifact publishing, and Terraform consumption.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Golden images as pipeline artefacts</text>

  

  
  <g id="node-1">
    <rect x="50" y="120" width="460" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="94" cy="164" r="24" fill="#207448" />
    <text x="94" y="173" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(424, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="12" x2="14" y2="44" />
      <path d="M 14 36 C 24 36 38 32 38 22" />
      <circle cx="14" cy="12" r="6" fill="#e8f1ea" />
      <circle cx="14" cy="44" r="6" fill="#e8f1ea" />
      <circle cx="38" cy="18" r="6" fill="#e8f1ea" />
    </g>
    
    <text x="280" y="246" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Git: Ansible roles +</tspan>
      <tspan x="280" dy="40">Packer template</tspan>
    </text>
  </g>

  
  <line x1="510" y1="245" x2="568" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-2">
    <rect x="570" y="120" width="460" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="614" cy="164" r="24" fill="#207448" />
    <text x="614" y="173" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(944, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M 6 14 v 24 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -24" />
      <path d="M 6 26 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8" />
    </g>
    
    <text x="800" y="260" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Build base image</text>
  </g>

  
  <line x1="1030" y1="245" x2="1088" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-3">
    <rect x="1090" y="120" width="460" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1134" cy="164" r="24" fill="#207448" />
    <text x="1134" y="173" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(1464, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10" />
      <path d="M 28 6 v 6 M 28 44 v 6 M 6 28 h 6 M 44 28 h 6 M 12.5 12.5 l 4.2 4.2 M 39.3 39.3 l 4.2 4.2 M 12.5 43.5 l 4.2 -4.2 M 39.3 16.7 l 4.2 -4.2" />
    </g>
    
    <text x="1320" y="235" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Provision with Ansible</text>
    <text x="1320" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">(drivers, CUDA,</tspan>
      <tspan x="1320" dy="34">agents, tuning)</tspan>
    </text>
  </g>

  
  <line x1="1320" y1="370" x2="1320" y2="448" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <g id="node-4">
    <rect x="840" y="450" width="710" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="884" cy="494" r="24" fill="#207448" />
    <text x="884" y="503" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(1464, 466)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 v 16 c 0 14 -9 22 -20 26 c -11 -4 -20 -12 -20 -26 V 14 Z" />
      <path d="M 18 28 l 7 7 l 14 -14" />
    </g>
    
    <text x="1195" y="600" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Scan + CIS hardening checks</text>
  </g>

  
  <line x1="840" y1="580" x2="762" y2="580" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-5">
    <rect x="50" y="450" width="710" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="94" cy="494" r="24" fill="#207448" />
    <text x="94" y="503" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(674, 466)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <path d="M 20 6 v 6 M 28 6 v 6 M 36 6 v 6 M 20 44 v 6 M 28 44 v 6 M 36 44 v 6 M 6 20 h 6 M 6 28 h 6 M 6 36 h 6 M 44 20 h 6 M 44 28 h 6 M 44 36 h 6" />
      <path d="M 18 28 h 5 l 3 -6 l 4 12 l 3 -6 h 5" stroke-width="3" />
    </g>
    
    <text x="405" y="565" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Boot test on GPU instance</text>
    <text x="405" y="625" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">nvidia-smi, DCGM diag, NCCL test</text>
  </g>

  
  <line x1="405" y1="710" x2="405" y2="788" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <g id="node-6">
    <rect x="50" y="790" width="710" height="260" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="94" cy="834" r="24" fill="#db8129" />
    <text x="94" y="843" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <g transform="translate(674, 806)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 16 v 24 L 28 50 L 8 40 V 16 Z" />
      <path d="M 28 26 L 48 16 M 28 26 L 8 16 M 28 26 v 24" />
      <circle cx="28" cy="26" r="4" fill="#db8129" />
    </g>
    
    <text x="405" y="905" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Publish immutable image</text>
    <text x="405" y="965" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">ID + manifest + SBOM</text>
  </g>

  
  <line x1="760" y1="920" x2="838" y2="920" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-7">
    <rect x="840" y="790" width="710" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="884" cy="834" r="24" fill="#207448" />
    <text x="884" y="843" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    
    <g transform="translate(1464, 806)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="16" rx="3" />
      <circle cx="16" cy="16" r="2" fill="#207448" />
      <circle cx="24" cy="16" r="2" fill="#207448" />
      <rect x="8" y="30" width="40" height="16" rx="3" />
      <circle cx="16" cy="38" r="2" fill="#207448" />
      <circle cx="24" cy="38" r="2" fill="#207448" />
    </g>
    
    <text x="1195" y="905" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1195" dy="0">Terraform / node pools</tspan>
      <tspan x="1195" dy="40">reference image ID</tspan>
    </text>
  </g>

</svg>