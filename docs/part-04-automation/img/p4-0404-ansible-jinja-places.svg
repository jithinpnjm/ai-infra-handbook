<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Where Jinja appears in a playbook, and the quoting rule for each place</title>
  <desc>An SVG infographic detailing the locations of Jinja expressions in Ansible playbooks, quoting rules, evaluation location, and troubleshooting missing variables.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Where Jinja appears in a playbook,</tspan>
    <tspan x="800" dy="54">and the quoting rule for each place</tspan>
  </text>

  
  <rect x="50" y="155" width="1500" height="425" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <path d="M 50,167 A 12,12 0 0,1 62,155 L 1538,155 A 12,12 0 0,1 1550,167 L 1550,210 L 50,210 Z" fill="#207448"/>

  
  <line x1="490" y1="155" x2="490" y2="580" stroke="#d0dfd4" stroke-width="2"/>

  
  <line x1="50" y1="305" x2="1550" y2="305" stroke="#d0dfd4" stroke-width="2"/>
  <line x1="50" y1="410" x2="1550" y2="410" stroke="#d0dfd4" stroke-width="2"/>
  <line x1="50" y1="495" x2="1550" y2="495" stroke="#d0dfd4" stroke-width="2"/>

  
  <text x="85" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Place</text>
  <text x="520" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Rule</text>

  
  
  <g transform="translate(75, 230)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25" cy="25" r="14"/>
    <circle cx="25" cy="25" r="6"/>
    <path d="M 25,5 L 25,11 M 25,39 L 25,45 M 5,25 L 11,25 M 39,25 L 45,25 M 11,11 L 15,15 M 35,35 L 39,39 M 11,39 L 15,35 M 35,15 L 39,11"/>
  </g>
  <text x="145" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">task arguments, vars, loop</text>
  <text x="520" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="520" dy="0">a YAML value that starts with {{ must be quoted: <tspan font-family="ui-monospace, monospace" font-weight="bold">msg: "{{ var }}"</tspan>;</tspan>
    <tspan x="520" dy="36">mixing is fine: <tspan font-family="ui-monospace, monospace" font-weight="bold">path: "/data/{{ project }}/{{ env }}"</tspan></tspan>
  </text>

  
  <rect x="52" y="306" width="1496" height="103" fill="#fffaf5"/>
  <rect x="50" y="305" width="8" height="105" fill="#db8129"/>

  
  <g transform="translate(75, 332)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 25,5 L 45,25 L 25,45 L 5,25 Z"/>
    <path d="M 25,17 L 25,27 M 25,33 L 25.01,33"/>
  </g>
  <text x="145" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">
    <tspan x="145" dy="0">when, failed_when,</tspan>
    <tspan x="145" dy="34">changed_when</tspan>
  </text>
  <text x="520" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="520" dy="0">already a Jinja expression:</tspan>
    <tspan x="520" dy="36">write <tspan font-family="ui-monospace, monospace" font-weight="bold">when: ansible_distribution == Ubuntu</tspan>, not <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#db8129">when: "{{ ... }}"</tspan></tspan>
  </text>

  
  
  <g transform="translate(75, 427)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8,5 L 30,5 L 42,17 L 42,45 L 8,45 Z"/>
    <path d="M 30,5 L 30,17 L 42,17"/>
    <path d="M 16,25 L 34,25 M 16,33 L 28,33"/>
  </g>
  <text x="145" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">template module files</text>
  <text x="520" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, monospace" font-weight="bold">src: nccl.conf.j2</tspan> rendered on the control node
  </text>

  
  
  <g transform="translate(75, 513)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="38" height="38" rx="6"/>
    <path d="M 14,16 L 36,16 M 14,25 L 36,25 M 14,34 L 26,34"/>
  </g>
  <text x="145" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">inventory variables</text>

  
  <rect x="50" y="610" width="1500" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="70" y="670" width="695" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(95, 710)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="40" height="28" rx="3"/>
    <path d="M 2,38 L 54,38"/>
    <path d="M 18,17 L 24,20 L 18,23"/>
    <line x1="28" y1="23" x2="36" y2="23"/>
  </g>

  
  <rect x="835" y="670" width="695" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(860, 710)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="5" width="44" height="16" rx="3"/>
    <rect x="6" y="27" width="44" height="16" rx="3"/>
    <circle cx="14" cy="13" r="1.5" fill="#207448"/>
    <circle cx="14" cy="35" r="1.5" fill="#207448"/>
    <line x1="24" y1="13" x2="42" y2="13"/>
    <line x1="24" y1="35" x2="42" y2="35"/>
  </g>

  
  <text font-family="system-ui, -apple-system, sans-serif">
    <tspan x="800" y="646" text-anchor="middle" font-size="28" font-weight="bold" fill="#207448">Ansible evaluates templates on the control node, not on the servers:</tspan>
    <tspan x="180" y="728" font-size="24" fill="#303a36">a template task fills its blanks</tspan>
    <tspan x="180" y="764" font-size="24" fill="#303a36">on your laptop or CI runner</tspan>
    <tspan x="945" y="728" font-size="24" fill="#303a36">then copies finished text to the target;</tspan>
    <tspan x="945" y="764" font-size="24" fill="#303a36">a shell task runs on the target</tspan>
  </text>

  
  <rect x="50" y="855" width="1500" height="145" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(80, 897)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28,4 L 48,12 L 48,28 C 48,42 28,52 28,52 C 28,52 8,42 8,28 L 8,12 Z"/>
    <line x1="28" y1="18" x2="28" y2="32"/>
    <circle cx="28" cy="39" r="1.5" fill="#db8129"/>
  </g>

  
  <text x="165" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold" font-family="ui-monospace, monospace" fill="#db8129">AnsibleUndefinedVariable</tspan><tspan font-weight="bold"> on one host while the same playbook works on others:</tspan>
    <tspan x="165" dy="38">the variable is defined only in a different inventory group,</tspan>
    <tspan x="165" dy="34">or in a file the play never loads</tspan>
  </text>

  
  <rect x="50" y="1030" width="1500" height="65" rx="10" fill="#207448"/>
  
  <g transform="translate(75, 1038)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16,28 C 10,24 8,18 8,13 C 8,6 13,2 20,2 C 27,2 32,6 32,13 C 32,18 30,24 24,28 Z"/>
    <path d="M 16,35 L 24,35 M 18,41 L 22,41"/>
  </g>
  <text x="820" y="1072" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Know where Ansible evaluates the template to know where to look first</text>
</svg>