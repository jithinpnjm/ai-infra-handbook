<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1330" width="1600" height="1330">
  <title>Where Jinja appears in a playbook, and the quoting rule for each place</title>
  <desc>Infographic explaining playbook locations where Jinja expressions occur, quoting rules, control node evaluation, and inventory variable pitfalls.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1330" fill="#f5f8f5" />

  
  <g id="title-block">
    <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Where Jinja appears in a playbook,</tspan>
      <tspan x="800" dy="48">and the quoting rule for each place</tspan>
    </text>
  </g>

  
  
  <g id="table-headers">
    <rect x="80" y="145" width="460" height="55" rx="8" fill="#207448" />
    <text x="310" y="182" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Place</text>

    <rect x="560" y="145" width="960" height="55" rx="8" fill="#207448" />
    <text x="1040" y="182" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Rule</text>
  </g>

  
  <g id="row-1">
    <rect x="80" y="215" width="460" height="135" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 115 260 C 105 260 100 268 100 275 C 100 282 95 285 90 285 C 95 285 100 288 100 295 C 100 302 105 310 115 310" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 135 260 C 145 260 150 268 150 275 C 150 282 155 285 160 285 C 155 285 150 288 150 295 C 150 302 145 310 135 310" fill="none" stroke="#207448" stroke-width="3" />
    <text x="330" y="272" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="330" dy="0">task arguments,</tspan>
      <tspan x="330" dy="32">vars, loop</tspan>
    </text>

    <rect x="560" y="215" width="960" height="135" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
    <text x="590" y="255" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="590" dy="0">a YAML value that starts with </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">{{</tspan>
      <tspan> must be quoted: </tspan>
      <tspan font-family="monospace" fill="#207448">msg: &quot;{{ var }}&quot;;</tspan>
      <tspan x="590" dy="38">mixing is fine: </tspan>
      <tspan font-family="monospace" fill="#207448">path: &quot;/data/{{ project }}/{{ env }}&quot;</tspan>
    </text>
  </g>

  
  <g id="row-2">
    <rect x="80" y="365" width="460" height="145" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
    
    <path d="M 105 415 L 125 435 L 145 415" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 435 L 125 465" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="125" cy="470" r="4" fill="#db8129" />
    <text x="330" y="425" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      <tspan x="330" dy="0">when, failed_when,</tspan>
      <tspan x="330" dy="32">changed_when</tspan>
    </text>

    <rect x="560" y="365" width="960" height="145" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2" />
    <text x="590" y="408" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="590" dy="0">already a Jinja expression: write</tspan>
      <tspan x="590" dy="36" font-family="monospace" font-weight="bold" fill="#db8129">when: ansible_distribution == Ubuntu,</tspan>
      <tspan x="590" dy="36" font-family="monospace" fill="#303a36">not when: &quot;{{ ... }}&quot;</tspan>
    </text>
  </g>

  
  <g id="row-3">
    <rect x="80" y="525" width="460" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 115 548 L 138 548 L 148 558 L 148 595 L 115 595 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M 138 548 L 138 558 L 148 558" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="330" y="582" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">template module files</text>

    <rect x="560" y="525" width="960" height="95" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
    <text x="590" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">src: nccl.conf.j2</tspan>
      <tspan> rendered on the control node</tspan>
    </text>
  </g>

  
  <g id="row-4">
    <rect x="80" y="635" width="460" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="112" y="655" width="36" height="12" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <rect x="112" y="673" width="36" height="12" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="661" r="2" fill="#207448" />
    <circle cx="140" cy="679" r="2" fill="#207448" />
    <text x="330" y="688" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">inventory variables</text>

    
    <rect x="560" y="635" width="960" height="85" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
    
    <rect x="600" y="652" width="160" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="620" cy="677" r="5" fill="#207448" />
    <line x1="635" y1="677" x2="745" y2="677" stroke="#207448" stroke-width="3" stroke-linecap="round" />

    <line x1="760" y1="677" x2="840" y2="677" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />

    <rect x="850" y="652" width="160" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="870" cy="677" r="5" fill="#207448" />
    <line x1="885" y1="677" x2="995" y2="677" stroke="#207448" stroke-width="3" stroke-linecap="round" />

    <line x1="1010" y1="677" x2="1090" y2="677" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />

    <rect x="1100" y="652" width="160" height="50" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="1.5" />
    <circle cx="1120" cy="677" r="5" fill="#db8129" />
    <line x1="1135" y1="677" x2="1245" y2="677" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <g id="core-split-panel">
    <rect x="80" y="745" width="1440" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <text x="115" y="788" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      Ansible evaluates templates on the control node, not on the servers:
    </text>

    
    <rect x="110" y="810" width="620" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="135" y="840" width="48" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="125" y1="875" x2="195" y2="875" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="210" y="865" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="210" dy="0">a template task fills its blanks on</tspan>
      <tspan x="210" dy="36">your laptop or CI runner</tspan>
    </text>

    
    <path d="M 740 882 L 850 882" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="870" y="810" width="620" height="145" rx="8" fill="#f0f5f1" stroke="#207448" stroke-width="1.5" />
    
    <rect x="895" y="835" width="46" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="930" cy="845" r="3" fill="#207448" />
    <rect x="895" y="862" width="46" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="930" cy="872" r="3" fill="#207448" />
    <text x="965" y="865" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">then copies finished text to the target;</tspan>
      <tspan x="965" dy="36">a shell task runs on the target</tspan>
    </text>
  </g>

  
  <g id="failure-story-strip">
    <rect x="80" y="1005" width="1440" height="175" rx="12" fill="#fff5eb" stroke="#db8129" stroke-width="2.5" />
    
    
    <g transform="translate(115, 1045)">
      <polygon points="28,2 54,48 2,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="40" r="2.5" fill="#db8129" />
    </g>

    
    <text x="195" y="1052" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="195" dy="0" font-weight="bold" fill="#db8129">AnsibleUndefinedVariable on one host while the same playbook works on others:</tspan>
      <tspan x="195" dy="40">the variable is defined only in a different inventory group,</tspan>
      <tspan x="195" dy="38">or in a file the play never loads</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="80" y="1205" width="1440" height="80" rx="10" fill="#207448" />
    <text x="800" y="1255" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Know where Ansible evaluates the template to know where to look first
    </text>
  </g>
</svg>