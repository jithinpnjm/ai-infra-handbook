<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Host patterns: union, intersection and exclusion</title>
  <desc>Visual infographic explaining host patterns with a Venn diagram of gpu, login, and rack_r01 groups, highlighting intersection, union, and exclusion syntax.</desc>

  <defs>
    
    <clipPath id="clip-gpu">
      <circle cx="650" cy="370" r="250"/>
    </clipPath>
    
    <clipPath id="clip-rack">
      <circle cx="780" cy="530" r="205"/>
    </clipPath>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Host patterns: union, intersection and exclusion</text>

  
  
  <circle cx="650" cy="370" r="250" fill="#207448" fill-opacity="0.08"/>

  
  <circle cx="970" cy="350" r="180" fill="#207448" fill-opacity="0.08"/>

  
  <circle cx="780" cy="530" r="205" fill="#207448" fill-opacity="0.08"/>

  
  <g clip-path="url(#clip-gpu)">
    <circle cx="780" cy="530" r="205" fill="#db8129" fill-opacity="0.30"/>
  </g>

  
  
  <circle cx="650" cy="370" r="250" fill="none" stroke="#207448" stroke-width="3.5"/>

  
  <circle cx="970" cy="350" r="180" fill="none" stroke="#207448" stroke-width="3.5"/>

  
  <circle cx="780" cy="530" r="205" fill="none" stroke="#207448" stroke-width="3.5"/>

  
  <g clip-path="url(#clip-gpu)">
    <circle cx="780" cy="530" r="205" fill="none" stroke="#db8129" stroke-width="4"/>
  </g>
  <g clip-path="url(#clip-rack)">
    <circle cx="650" cy="370" r="250" fill="none" stroke="#db8129" stroke-width="4"/>
  </g>

  
  <g id="overlap-label">
    <rect x="585" y="468" width="240" height="48" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <text x="705" y="501" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129">gpu:&amp;rack_r01</text>
  </g>

  
  
  <g id="gpu-group">
    
    <g transform="translate(460, 246)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="50" height="38" rx="4"/>
      <line x1="2" y1="25" x2="52" y2="25"/>
      <line x1="10" y1="15" x2="26" y2="15"/>
      <line x1="10" y1="34" x2="26" y2="34"/>
      <circle cx="38" cy="15" r="2" fill="#207448"/>
      <circle cx="44" cy="15" r="2" fill="#207448"/>
      <circle cx="38" cy="34" r="2" fill="#207448"/>
      <circle cx="44" cy="34" r="2" fill="#207448"/>
    </g>
    <text x="526" y="282" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">gpu</text>
  </g>

  
  <g id="login-group">
    
    <g transform="translate(976, 256)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="48" height="34" rx="4"/>
      <path d="M 27 38 L 27 46 M 17 46 L 37 46"/>
      <circle cx="27" cy="17" r="4.5"/>
      <path d="M 18 30 C 18 24 36 24 36 30"/>
    </g>
    <text x="1042" y="292" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">login</text>
  </g>

  
  <g id="rack-group">
    
    <g transform="translate(686, 636)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2" width="40" height="48" rx="3"/>
      <line x1="6" y1="14" x2="46" y2="14"/>
      <line x1="6" y1="26" x2="46" y2="26"/>
      <line x1="6" y1="38" x2="46" y2="38"/>
      <circle cx="13" cy="8" r="1.5" fill="#207448"/>
      <line x1="20" y1="8" x2="39" y2="8" stroke-width="2"/>
      <circle cx="13" cy="20" r="1.5" fill="#207448"/>
      <line x1="20" y1="20" x2="39" y2="20" stroke-width="2"/>
      <circle cx="13" cy="32" r="1.5" fill="#207448"/>
      <line x1="20" y1="32" x2="39" y2="32" stroke-width="2"/>
      <circle cx="13" cy="43" r="1.5" fill="#207448"/>
      <line x1="20" y1="43" x2="39" y2="43" stroke-width="2"/>
    </g>
    <text x="746" y="672" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">rack_r01</text>
  </g>

  
  
  <g id="example-union">
    <rect x="45" y="775" width="470" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="75" y="795" width="410" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="280" y="831" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">gpu:login</text>
    <text x="280" y="895" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Union: either group</text>
  </g>

  
  <g id="example-intersection">
    <rect x="565" y="775" width="470" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="595" y="795" width="410" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="800" y="831" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">gpu:&amp;rack_r01</text>
    <text x="800" y="895" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Intersection: both groups</text>
  </g>

  
  <g id="example-exclusion">
    <rect x="1085" y="775" width="470" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="1115" y="795" width="410" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1320" y="831" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">gpu:!gpu_a100</text>
    <text x="1320" y="882" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">Exclusion: the group </tspan>
      <tspan x="1320" dy="30">without that one</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="45" y="980" width="1510" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1027" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A host pattern is a filter on the inventory.</text>
  </g>
</svg>