<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Untrusted strings and secrets in rendered files</title>
  <desc>Visual infographic explaining server-side template injection and practices for securing secrets in rendered files.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Untrusted strings and secrets in rendered files</text>

  
  <rect x="60" y="110" width="710" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(86, 142)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="16" x2="24" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="16" r="3" fill="#207448"/>
  </g>
  <text x="158" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Server-side template injection</text>

  <line x1="84" y1="245" x2="746" y2="245" stroke="#c8dcd0" stroke-width="2"/>

  
  <rect x="84" y="265" width="662" height="230" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(108, 285)">
    
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="8" r="2.5" fill="#207448"/>
    <circle cx="18" cy="8" r="2.5" fill="#207448"/>
    <rect x="10" y="26" width="36" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="35" x2="26" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="188" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="188" dy="0">a notification feature takes free</tspan>
    <tspan x="188" dy="32">text from a web form and runs it</tspan>
    <tspan x="188" dy="32">through a template engine on the</tspan>
    <tspan x="188" dy="32">server; a user types a template</tspan>
    <tspan x="188" dy="32">expression and the engine evaluates</tspan>
    <tspan x="188" dy="32">it with the server's privileges</tspan>
  </text>

  
  <rect x="84" y="515" width="662" height="230" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(108, 535)">
    
    <path d="M28 4 L50 14 C50 34 28 52 28 52 C28 52 6 34 6 14 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="40" r="2.5" fill="#db8129"/>
  </g>
  <text x="188" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="188" dy="0">never render a user-provided string</tspan>
    <tspan x="188" dy="32">as a template: feed the engine your</tspan>
    <tspan x="188" dy="32">own recipe and it does what you</tspan>
    <tspan x="188" dy="32">intend, feed it a stranger's recipe</tspan>
    <tspan x="188" dy="32">and the stranger decides</tspan>
  </text>

  
  <rect x="84" y="765" width="662" height="230" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(108, 785)">
    
    <path d="M8 8 L32 8 L50 26 L26 50 L8 32 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="20" cy="20" r="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M30 30 L30 25 C30 22 34 22 34 25 L34 30" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="28" y="30" width="8" height="8" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="188" y="802" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="188" dy="0">Ansible marks values from facts as</tspan>
    <tspan x="188" dy="32">unsafe, which stops them from being</tspan>
    <tspan x="188" dy="32">templated again: do not remove that</tspan>
    <tspan x="188" dy="32">!unsafe marking and avoid eval-like</tspan>
    <tspan x="188" dy="32">constructs</tspan>
  </text>

  
  <rect x="830" y="110" width="710" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(856, 142)">
    
    <path d="M6 4 L34 4 L48 18 L48 52 L6 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M34 4 L34 18 L48 18" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="22" cy="36" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="27" y1="36" x2="38" y2="36" stroke="#207448" stroke-width="3"/>
    <line x1="34" y1="36" x2="34" y2="41" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="926" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="926" dy="0">Secrets in rendered files:</tspan>
    <tspan x="926" dy="36">a rendered file is a copy of</tspan>
    <tspan x="926" dy="36">the secret on disk</tspan>
  </text>

  <line x1="854" y1="245" x2="1516" y2="245" stroke="#c8dcd0" stroke-width="2"/>

  
  <rect x="854" y="265" width="662" height="165" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(878, 320)">
    
    <rect x="10" y="22" width="36" height="28" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M18 22 L18 14 C18 8 38 8 38 14 L38 22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="34" r="3" fill="#207448"/>
    <line x1="28" y1="37" x2="28" y2="43" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="956" y="335" fill="#303a36">
    <tspan x="956" dy="0" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24">mode: "0600", owner, no_log: true</tspan>
    <tspan x="956" dy="40" font-family="system-ui, -apple-system, sans-serif" font-size="24">on any task that renders a secret</tspan>
  </text>

  
  <rect x="854" y="450" width="662" height="165" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(878, 505)">
    
    <path d="M6 28 Q 28 12 50 28 Q 28 44 6 28 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="48" x2="48" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="956" y="520" fill="#303a36">
    <tspan x="956" dy="0"><tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24">diff: false</tspan><tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> so the secret stays</tspan></tspan>
    <tspan x="956" dy="40"><tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">out of </tspan><tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24">--diff</tspan><tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> output</tspan></tspan>
  </text>

  
  <rect x="854" y="635" width="662" height="165" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(878, 690)">
    
    <rect x="2" y="4" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M12 18 L20 26 L12 34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="34" x2="40" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="956" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="956" dy="0">quote values templated into shell</tspan>
    <tspan x="956" dy="40">commands with the <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace">| quote</tspan> filter</tspan>
  </text>

  
  <rect x="854" y="820" width="662" height="165" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <g transform="translate(878, 875)">
    
    <rect x="6" y="6" width="44" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M16 24 L22 30 L36 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="16" y1="38" x2="36" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="956" y="890" fill="#303a36">
    <tspan x="956" dy="0"><tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24">yaml.safe_load</tspan><tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> for parsing;</tspan></tspan>
    <tspan x="956" dy="40" font-family="system-ui, -apple-system, sans-serif" font-size="24">pin and review your parsers</tspan>
  </text>

  
  <rect x="60" y="1045" width="1480" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1086" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Limit who can read the file and keep the value out of logs</text>
</svg>