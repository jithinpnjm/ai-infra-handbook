<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>One Slurm NodeName line, field by field, and where each value comes from</title>
  <desc>Infographic mapping each Slurm NodeName configuration parameter to its source and fallback values.</desc>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="bold" fill="#207448" letter-spacing="-0.5px">One Slurm NodeName line, field by field, and where each value comes from</text>

  
  <g id="header-lines">
    <rect x="40" y="100" width="1520" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(56, 114)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="16" />
      <circle cx="28" cy="28" r="7" />
      <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11" stroke-linecap="round" />
    </g>
    <text x="135" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">ClusterName={{ slurm_cluster_name }}</text>
    <text x="135" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">SlurmctldHost={{ groups[slurm_controller][0] }}</text>
  </g>

  
  <g id="table-block">
    
    <rect x="40" y="200" width="1520" height="606" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <path d="M 40 208 Q 40 200 48 200 L 1552 200 Q 1560 200 1560 208 L 1560 252 L 40 252 Z" fill="#e8f1ea" />
    <line x1="40" y1="252" x2="1560" y2="252" stroke="#207448" stroke-width="2" />

    
    <line x1="770" y1="200" x2="770" y2="806" stroke="#cfe0d4" stroke-width="1.5" />
    <line x1="1060" y1="200" x2="1060" y2="806" stroke="#cfe0d4" stroke-width="1.5" />

    
    
    <g transform="translate(56, 205)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="8" y="8" width="26" height="26" rx="4" />
      <path d="M 14 2 L 14 8 M 21 2 L 21 8 M 28 2 L 28 8 M 14 34 L 14 40 M 21 34 L 21 40 M 28 34 L 28 40 M 2 14 L 8 14 M 2 21 L 8 21 M 2 28 L 8 28 M 34 14 L 40 14 M 34 21 L 40 21 M 34 28 L 40 28" />
    </g>
    <text x="110" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Field in the line</text>
    <text x="790" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Source</text>
    <text x="1080" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Fallback</text>

    
    <rect x="41" y="253" width="1518" height="55" fill="#ffffff" />
    <text x="60" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">NodeName={{ h }}</text>
    <text x="790" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="790" dy="0">the host name from</tspan>
      <tspan x="790" dy="25">groups[gpu] | sort</tspan>
    </text>
    <text x="1080" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">-</text>
    <line x1="40" y1="308" x2="1560" y2="308" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="309" width="1518" height="45" fill="#f5f8f5" />
    <text x="60" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">NodeAddr={{ v.ansible_host }}</text>
    <text x="790" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">hostvars</text>
    <text x="1080" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">-</text>
    <line x1="40" y1="354" x2="1560" y2="354" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="355" width="1518" height="45" fill="#ffffff" />
    <text x="60" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">CPUs={{ v.ansible_facts.processor_vcpus }}</text>
    <text x="790" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">gathered fact</text>
    <text x="1080" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">-</text>
    <line x1="40" y1="400" x2="1560" y2="400" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="401" width="1518" height="41" fill="#f5f8f5" />
    <text x="60" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Boards=1</text>
    <line x1="40" y1="442" x2="1560" y2="442" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="443" width="1518" height="45" fill="#ffffff" />
    <text x="60" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">SocketsPerBoard={{ v.sockets | default(2) }}</text>
    <text x="790" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">host variable</text>
    <text x="1080" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">2</text>
    <line x1="40" y1="488" x2="1560" y2="488" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="489" width="1518" height="54" fill="#f5f8f5" />
    <text x="60" y="513" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="60" dy="0">CoresPerSocket=</tspan>
      <tspan x="60" dy="25">{{ v.cores_per_socket | default(48) }}</tspan>
    </text>
    <text x="790" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">host variable</text>
    <text x="1080" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">48</text>
    <line x1="40" y1="543" x2="1560" y2="543" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="544" width="1518" height="41" fill="#ffffff" />
    <text x="60" y="573" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">ThreadsPerCore=1</text>
    <line x1="40" y1="585" x2="1560" y2="585" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="586" width="1518" height="124" fill="#fdf5ec" />
    <line x1="41" y1="586" x2="41" y2="710" stroke="#db8129" stroke-width="8" />
    <text x="60" y="632" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="60" dy="0">RealMemory={{ (v.ansible_facts.</tspan>
      <tspan x="60" dy="28">memtotal_mb * 0.95) | int }}</tspan>
    </text>
    <text x="790" y="652" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">gathered fact</text>
    <text x="1080" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">leave memory unused: the operating</tspan>
      <tspan x="1080" dy="26">system and the Slurm daemon need room</tspan>
      <tspan x="1080" dy="26">too, so the scheduler never promises</tspan>
      <tspan x="1080" dy="26">every last byte to a job</tspan>
    </text>
    <line x1="40" y1="710" x2="1560" y2="710" stroke="#db8129" stroke-width="2" />

    
    <rect x="41" y="711" width="1518" height="54" fill="#f5f8f5" />
    <text x="60" y="734" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="60" dy="0">Gres=gpu:{{ v.gpu_model | default(h100) }}:</tspan>
      <tspan x="60" dy="25">{{ v.gpu_count | default(8) }}</tspan>
    </text>
    <text x="790" y="745" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">host variables</text>
    <text x="1080" y="745" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">h100 and 8</text>
    <line x1="40" y1="765" x2="1560" y2="765" stroke="#cfe0d4" stroke-width="1" />

    
    <rect x="41" y="766" width="1518" height="39" fill="#ffffff" />
    <text x="60" y="793" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">State=UNKNOWN</text>
  </g>

  
  <g id="footer-line">
    <rect x="40" y="820" width="1520" height="96" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(56, 840)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M 6 16 L 28 6 L 50 16 L 28 26 Z" stroke-linejoin="round" />
      <path d="M 6 28 L 28 38 L 50 28" stroke-linejoin="round" />
      <path d="M 6 40 L 28 50 L 50 40" stroke-linejoin="round" />
    </g>
    <text x="135" y="856" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">PartitionName=gpu Nodes={{ groups[gpu] | sort | join(,) }} Default=YES MaxTime=INFINITE State=UP</text>
    <text x="135" y="893" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a partition is Slurm's name for a pool of nodes that a user submits jobs to</text>
  </g>

  
  <g id="tip-strip">
    <rect x="40" y="930" width="1520" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <g transform="translate(56, 950)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M 16 26 C 16 16 22 10 28 10 C 34 10 40 16 40 26 C 40 33 35 37 34 42 L 22 42 C 21 37 16 33 16 26 Z" stroke-linejoin="round" />
      <path d="M 22 47 L 34 47 M 25 52 L 31 52" stroke-linecap="round" />
    </g>
    <text x="135" y="968" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">set v = hostvars[h] gives the long path a short name; for large clusters compress the node list into</tspan>
      <tspan x="135" dy="30">Slurm hostlist syntax such as gpu[001-032] with a custom filter or a precomputed variable</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1042" width="1520" height="72" rx="8" fill="#207448" />
    
    <g transform="translate(60, 1056)" stroke="#ffffff" stroke-width="3.5" fill="none">
      <path d="M 21 6 L 36 12 L 36 24 C 36 34 21 42 21 42 C 21 42 6 34 6 24 L 6 12 Z" stroke-linejoin="round" />
      <path d="M 15 22 L 19 26 L 27 18" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="800" y="1087" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Defaults fill the gaps where data is missing</text>
  </g>
</svg>