<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Target architecture</title>
  <desc>Architecture diagram showing Clients reaching nginx, reverse proxying to app01 and app02, connecting to PostgreSQL, and app01 exposing metrics to Prometheus.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Target architecture</text>

  
  <rect x="40" y="380" width="160" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(92, 400)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="18" r="14"/>
    <path d="M 6 52 C 6 38, 50 38, 50 52"/>
  </g>
  <text x="120" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Clients</text>

  
  <line x1="200" y1="475" x2="380" y2="475" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="222" y="446" width="136" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="290" y="475" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">HTTPS 443</text>

  
  <rect x="380" y="330" width="320" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(512, 348)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 50 16 C 50 38, 28 54, 28 54 C 28 54, 6 38, 6 16 Z"/>
    <line x1="18" y1="30" x2="38" y2="30"/>
    <line x1="28" y1="20" x2="28" y2="40"/>
  </g>
  <text x="540" y="438" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="540" dy="0">nginx</tspan>
    <tspan x="540" dy="40" font-size="24" font-weight="normal">(web group)</tspan>
    <tspan x="540" dy="40" font-size="24" font-weight="normal">TLS, rate limits,</tspan>
    <tspan x="540" dy="34" font-size="24" font-weight="normal">upstream</tspan>
  </text>

  
  <path d="M 540 330 L 540 250 L 900 250" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  <rect x="562" y="216" width="316" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="720" y="244" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="720" dy="0">HTTP 127.0.0.1:8000/</tspan>
    <tspan x="720" dy="28" font-family="sans-serif">private net</tspan>
  </text>

  
  <rect x="900" y="145" width="280" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1012, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="40" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="20" cy="12" r="2" fill="#207448"/>
  </g>
  <text x="1040" y="255" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1040" dy="0">app01</tspan>
    <tspan x="1040" dy="42" font-size="24" font-weight="normal">uvicorn + FastAPI</tspan>
  </text>

  
  <path d="M 700 520 L 800 520 L 800 702 L 900 702" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="900" y="605" width="280" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1012, 625)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="40" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="20" cy="12" r="2" fill="#207448"/>
  </g>
  <text x="1040" y="725" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">app02</text>

  
  <line x1="1180" y1="240" x2="1340" y2="240" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>
  <rect x="1195" y="218" width="130" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1260" y="248" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">/metrics</text>

  
  <rect x="1340" y="145" width="220" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1422, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <polyline points="16,30 24,18 32,36 40,24"/>
  </g>
  <text x="1450" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Prometheus</text>

  
  <path d="M 1180 310 L 1260 310 L 1260 635 L 1340 635" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="725" x2="1340" y2="725" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="1340" y="550" width="220" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1422, 570)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="12" rx="24" ry="8"/>
    <path d="M 4 12 L 4 44 C 4 52, 52 52, 52 44 L 52 12"/>
    <path d="M 4 28 C 4 36, 52 36, 52 28"/>
  </g>
  <text x="1450" y="670" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1450" dy="0">PostgreSQL</tspan>
    <tspan x="1450" dy="44" font-size="24" font-weight="normal">(db group)</tspan>
  </text>
</svg>