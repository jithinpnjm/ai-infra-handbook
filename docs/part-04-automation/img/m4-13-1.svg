<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Test pyramid for Ansible</title>
  <desc>Five testing tiers for Ansible from static analysis at the base to hardware in the loop at the apex</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#303a36">Test pyramid for Ansible</text>

  
  <g id="node-e">
    <rect x="300" y="135" width="1000" height="124" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(330, 169)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" />
      <rect x="18" y="18" width="20" height="20" rx="3" />
      <line x1="18" y1="2" x2="18" y2="8" />
      <line x1="28" y1="2" x2="28" y2="8" />
      <line x1="38" y1="2" x2="38" y2="8" />
      <line x1="18" y1="48" x2="18" y2="54" />
      <line x1="28" y1="48" x2="28" y2="54" />
      <line x1="38" y1="48" x2="38" y2="54" />
      <line x1="2" y1="18" x2="8" y2="18" />
      <line x1="2" y1="28" x2="8" y2="28" />
      <line x1="2" y1="38" x2="8" y2="38" />
      <line x1="48" y1="18" x2="54" y2="18" />
      <line x1="48" y1="28" x2="54" y2="28" />
      <line x1="48" y1="38" x2="54" y2="38" />
    </g>
    <text x="412" y="187" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36">Hardware-in-the-loop (real GPU nodes, reboots)</text>
    <text x="412" y="227" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">few, slow, scheduled</text>
  </g>

  
  <line x1="800" y1="307" x2="800" y2="259" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-v">
    <rect x="240" y="307" width="1120" height="124" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(270, 341)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <circle cx="12" cy="12" r="2" fill="#207448" />
      <circle cx="18" cy="12" r="2" fill="#207448" />
      <path d="M 14 26 L 22 32 L 14 38" />
      <line x1="26" y1="38" x2="38" y2="38" />
    </g>
    <text x="352" y="359" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36">VM scenarios (systemd, kernel, networking, reboot)</text>
    <text x="352" y="399" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">medium</text>
  </g>

  
  <line x1="800" y1="479" x2="800" y2="431" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-c">
    <rect x="180" y="479" width="1240" height="124" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(210, 513)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="36" rx="4" />
      <line x1="17" y1="10" x2="17" y2="46" />
      <line x1="28" y1="10" x2="28" y2="46" />
      <line x1="39" y1="10" x2="39" y2="46" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <text x="292" y="531" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36">Container scenarios (Molecule + Docker/Podman)</text>
    <text x="292" y="571" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">many, fast</text>
  </g>

  
  <line x1="800" y1="651" x2="800" y2="603" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-d">
    <rect x="120" y="651" width="1360" height="124" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(150, 685)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 6 L 34 6 L 46 18 L 46 50 L 10 50 Z" />
      <polyline points="34,6 34,18 46,18" />
      <polyline points="18,32 25,39 38,24" />
    </g>
    <text x="232" y="723" fill="#303a36">
      <tspan font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Syntax check, </tspan>
      <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700">--check --diff</tspan>
      <tspan font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">, template render tests</tspan>
    </text>
  </g>

  
  <line x1="800" y1="823" x2="800" y2="775" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-l">
    <rect x="60" y="823" width="1480" height="124" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(90, 857)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 38 46 28 50 C 18 46 8 34 8 14 Z" />
      <circle cx="28" cy="24" r="6" />
      <path d="M 28 30 L 28 38" />
    </g>
    <text x="172" y="895" fill="#303a36">
      <tspan font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Static analysis: </tspan>
      <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700">yamllint</tspan>
      <tspan font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">, </tspan>
      <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700">ansible-lint</tspan>
      <tspan font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">, secrets scan</tspan>
    </text>
  </g>
</svg>