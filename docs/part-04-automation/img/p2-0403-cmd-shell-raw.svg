<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Pick the execution module by what the command needs: a pipe needs a shell</title>
  <desc>Visual comparison of Ansible modules command, shell, raw, and script showing pipe support, execution mechanism, and idempotency recommendation.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#c53030" />
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="#f5f8f5" />
  <text x="800" y="76" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Pick the execution module</tspan>
    <tspan x="800" dy="56">by what the command needs: a pipe needs a shell</tspan>
  </text>
  <rect id="col-1-bg" x="40" y="175" width="350" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect id="col-2-bg" x="430" y="175" width="350" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect id="col-3-bg" x="820" y="175" width="350" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect id="col-4-bg" x="1210" y="175" width="350" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g id="icon-command" transform="translate(187, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6" fill="#f5f8f5" />
    <line x1="4" y1="18" x2="52" y2="18" />
    <circle cx="12" cy="12" r="2" fill="#207448" stroke="none" />
    <circle cx="18" cy="12" r="2" fill="#207448" stroke="none" />
    <polyline points="14,28 22,34 14,40" />
    <line x1="28" y1="40" x2="40" y2="40" />
  </g>
  <text x="215" y="274" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">command</text>
  <rect id="box-cmd-desc" x="60" y="295" width="310" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="215" y="347" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="215" dy="0">runs the binary</tspan>
    <tspan x="215" dy="34">directly, no shell</tspan>
  </text>
  <rect id="box-cmd-cross" x="60" y="435" width="310" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(72, 500)">
    <circle cx="18" cy="18" r="16" fill="#fdf2f2" stroke="#c53030" stroke-width="3" />
    <line x1="11" y1="11" x2="25" y2="25" stroke="#c53030" stroke-width="3.5" stroke-linecap="round" />
    <line x1="25" y1="11" x2="11" y2="25" stroke="#c53030" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="242" y="488" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="242" dy="0">pipes and</tspan>
    <tspan x="242" dy="32">redirects do</tspan>
    <tspan x="242" dy="32">not work</tspan>
  </text>
  <g id="icon-shell" transform="translate(577, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6" fill="#f5f8f5" />
    <line x1="4" y1="18" x2="52" y2="18" />
    <circle cx="12" cy="12" r="2" fill="#207448" stroke="none" />
    <circle cx="18" cy="12" r="2" fill="#207448" stroke="none" />
    <path d="M 14 28 L 22 34 L 14 40" />
    <line x1="27" y1="26" x2="27" y2="42" stroke-width="3" />
    <line x1="33" y1="40" x2="43" y2="40" />
  </g>
  <text x="605" y="274" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">shell</text>
  <rect id="box-shell-desc" x="450" y="295" width="310" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="605" y="338" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" dy="0">runs through</tspan>
    <tspan x="605" dy="32" font-family="monospace">/bin/sh -c</tspan>
  </text>
  <rect id="box-shell-tick" x="450" y="415" width="310" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(464, 454)">
    <circle cx="18" cy="18" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <polyline points="10,18 16,24 26,13" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="630" y="446" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="630" dy="0">pipes,</tspan>
    <tspan x="630" dy="30">redirects and</tspan>
    <tspan x="630" dy="30">globs work</tspan>
  </text>
  <rect id="box-shell-note" x="450" y="550" width="310" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="605" y="584" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" dy="0">quote variables</tspan>
    <tspan x="605" dy="32">to avoid injection</tspan>
  </text>
  <g id="icon-raw" transform="translate(967, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="22" r="12" fill="#f5f8f5" />
    <line x1="28" y1="30" x2="46" y2="48" />
    <line x1="38" y1="40" x2="44" y2="34" />
    <line x1="42" y1="44" x2="48" y2="38" />
  </g>
  <text x="995" y="274" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">raw</text>
  <rect id="box-raw-desc" x="840" y="295" width="310" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="995" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="995" dy="0">plain SSH command,</tspan>
    <tspan x="995" dy="32">no module,</tspan>
    <tspan x="995" dy="32">no Python on</tspan>
    <tspan x="995" dy="32">the target</tspan>
  </text>
  <rect id="box-raw-note" x="840" y="490" width="310" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="995" y="546" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="995" dy="0">bootstraps Python</tspan>
    <tspan x="995" dy="34">on minimal systems</tspan>
  </text>
  <g id="icon-script" transform="translate(1357, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 6 L 34 6 L 46 18 L 46 50 L 12 50 Z" fill="#f5f8f5" />
    <path d="M 34 6 L 34 18 L 46 18" />
    <line x1="20" y1="26" x2="36" y2="26" />
    <line x1="20" y1="34" x2="36" y2="34" />
    <line x1="20" y1="42" x2="28" y2="42" />
  </g>
  <text x="1385" y="274" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">script</text>
  <rect id="box-script-desc" x="1230" y="295" width="310" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1385" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1385" dy="0">copies a local</tspan>
    <tspan x="1385" dy="32">script to the</tspan>
    <tspan x="1385" dy="32">target and</tspan>
    <tspan x="1385" dy="32">runs it</tspan>
  </text>
  <rect id="box-script-note" x="1230" y="490" width="310" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1385" y="546" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1385" dy="0">runs the file</tspan>
    <tspan x="1385" dy="34">you wrote</tspan>
  </text>
  <rect id="box-example" x="160" y="695" width="1280" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="800" y="745" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">dmesg | grep -i xid | tail -5</text>
  <line x1="605" y1="695" x2="605" y2="647" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <g transform="translate(620, 655)">
    <circle cx="12" cy="12" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <polyline points="7,12 11,16 18,8" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <line x1="215" y1="695" x2="215" y2="647" stroke="#c53030" stroke-width="4" marker-end="url(#arrow-red)" />
  <g transform="translate(230, 655)">
    <circle cx="12" cy="12" r="11" fill="#fdf2f2" stroke="#c53030" stroke-width="2.5" />
    <line x1="7" y1="7" x2="17" y2="17" stroke="#c53030" stroke-width="2.5" stroke-linecap="round" />
    <line x1="17" y1="7" x2="7" y2="17" stroke="#c53030" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <rect id="box-bottom-note" x="40" y="825" width="1520" height="110" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="800" y="872" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Prefer purpose-built modules such as package, service and file,</tspan>
    <tspan x="800" dy="36">because they are idempotent.</tspan>
  </text>
  <g id="takeaway-bar">
    <rect id="bar-caption" x="40" y="975" width="1520" height="70" rx="14" fill="#207448" />
    <text x="800" y="1019" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The pipe decides the module.</text>
  </g>
</svg>