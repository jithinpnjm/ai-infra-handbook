<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>What --check previews and what it skips</title>
  <desc>Comparison of Ansible declarative modules simulated under check mode versus command-based modules skipped under check mode.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <g transform="translate(50, 48)">
    <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="42" y1="42" x2="58" y2="58" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20 20 A 10 10 0 0 1 30 16" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="130" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">What --check previews and what it skips</text>

  
  <rect x="50" y="125" width="730" height="635" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="85" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Simulated by declarative modules</text>

  
  <rect x="85" y="205" width="660" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="233" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 112 233 L 118 239 L 129 226" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">package</text>

  
  <rect x="85" y="275" width="660" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="303" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 112 303 L 118 309 L 129 296" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">file</text>

  
  <rect x="85" y="345" width="660" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="373" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 112 373 L 118 379 L 129 366" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">template</text>

  
  <rect x="85" y="415" width="660" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="443" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 112 443 L 118 449 L 129 436" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">service</text>

  
  <rect x="85" y="485" width="660" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="513" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 112 513 L 118 519 L 129 506" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">sysctl</text>

  
  <rect x="85" y="565" width="660" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="415" y="632" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="415" dy="0">--check reports what would change,</tspan>
    <tspan x="415" dy="36">and --diff shows the content change.</tspan>
  </text>

  
  <rect x="820" y="125" width="730" height="635" rx="12" fill="#f0f3f1" stroke="#8e9e96" stroke-width="2"/>
  <text x="855" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#55605a">Skipped under --check</text>

  
  <rect x="855" y="230" width="660" height="56" rx="8" fill="#ffffff" stroke="#7a8a82" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="890" cy="258" r="16" fill="#f0f3f1" stroke="#7a8a82" stroke-width="2"/>
  <path d="M 882 252 L 888 258 L 882 264 Z" fill="#7a8a82"/>
  <path d="M 888 252 L 894 258 L 888 264 Z" fill="#7a8a82"/>
  <line x1="897" y1="251" x2="897" y2="265" stroke="#7a8a82" stroke-width="2.5" stroke-linecap="round"/>
  <text x="925" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#55605a">command</text>

  
  <rect x="855" y="330" width="660" height="56" rx="8" fill="#ffffff" stroke="#7a8a82" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="890" cy="358" r="16" fill="#f0f3f1" stroke="#7a8a82" stroke-width="2"/>
  <path d="M 882 352 L 888 358 L 882 364 Z" fill="#7a8a82"/>
  <path d="M 888 352 L 894 358 L 888 364 Z" fill="#7a8a82"/>
  <line x1="897" y1="351" x2="897" y2="365" stroke="#7a8a82" stroke-width="2.5" stroke-linecap="round"/>
  <text x="925" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#55605a">shell</text>

  
  <rect x="855" y="430" width="660" height="56" rx="8" fill="#ffffff" stroke="#7a8a82" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="890" cy="458" r="16" fill="#f0f3f1" stroke="#7a8a82" stroke-width="2"/>
  <path d="M 882 452 L 888 458 L 882 464 Z" fill="#7a8a82"/>
  <path d="M 888 452 L 894 458 L 888 464 Z" fill="#7a8a82"/>
  <line x1="897" y1="451" x2="897" y2="465" stroke="#7a8a82" stroke-width="2.5" stroke-linecap="round"/>
  <text x="925" y="467" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#55605a">raw</text>

  
  <rect x="855" y="565" width="660" height="150" rx="8" fill="#ffffff" stroke="#7a8a82" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="1185" y="632" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1185" dy="0">Runs only with creates or removes,</tspan>
    <tspan x="1185" dy="36">or with check_mode: false.</tspan>
  </text>

  
  <rect x="50" y="785" width="1500" height="90" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(80, 811)">
    <path d="M 18 2 L 35 34 L 1 34 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="18" y1="13" x2="18" y2="22" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="28" r="1.8" fill="#db8129"/>
  </g>
  <text x="815" y="841" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">A later task that needs an earlier change judges a change that never happened.</text>

  
  <rect x="50" y="895" width="1500" height="65" rx="8" fill="#207448"/>
  <text x="800" y="937" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A clean check run is not proof that the change is safe.</text>
</svg>