      <line x1="199" y1="744" x2="205" y2="744" />
      <line x1="199" y1="758" x2="205" y2="758" />
    </g>
    <text x="235" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Nodes</text>

    
