      <line x1="661" y1="716" x2="661" y2="722" />
      <line x1="633" y1="766" x2="633" y2="772" />
      <line x1="647" y1="766" x2="647" y2="772" />
      <line x1="661" y1="766" x2="661" y2="772" />
      <line x1="619" y1="730" x2="625" y2="730" />
