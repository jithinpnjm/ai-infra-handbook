  <g id="pull-subgraph">
    <rect x="1030" y="110" width="530" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1065" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Pull at scale</text>

    
    <rect x="1105" y="185" width="380" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="1165" y1="217" x2="1165" y2="267" />
      <path d="M 1165 245 C 1165 233 1185 233 1185 227" />
      <circle cx="1165" cy="221" r="5" fill="#e8f1ea" />
      <circle cx="1165" cy="263" r="5" fill="#e8f1ea" />
      <circle cx="1185" cy="223" r="5" fill="#e8f1ea" />
    </g>
    <text x="1225" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Git repo</text>

    
    <rect x="1070" y="420" width="450" height="230" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <g stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
