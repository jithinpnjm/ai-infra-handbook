    <text x="1295" y="524" text-anchor="middle">
      <tspan x="1295" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">ansible-pull</tspan>
      <tspan x="1295" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">on each node</tspan>
      <tspan x="1295" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(cron/systemd timer)</tspan>
    </text>

    
    <path d="M 1295 305 V 420" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
