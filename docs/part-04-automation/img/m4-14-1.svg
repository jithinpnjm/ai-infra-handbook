    <text x="424" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Git + CI/AAP</text>

    
    <rect x="75" y="390" width="410" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="257" y="408" width="46" height="38" rx="4" />
      <line x1="257" y1="421" x2="303" y2="421" />
      <line x1="257" y1="433" x2="303" y2="433" />
