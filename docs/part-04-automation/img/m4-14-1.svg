      <tspan x="280" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">execution node A</tspan>
      <tspan x="280" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(rack group 1-20)</tspan>
    </text>

    
    <rect x="545" y="390" width="410" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
