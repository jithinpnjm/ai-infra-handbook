      <line x1="669" y1="758" x2="675" y2="758" />
    </g>
    <text x="705" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Nodes</text>

    
    <path d="M 450 305 V 340 Q 450 350 440 350 H 290 Q 280 350 280 360 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <path d="M 580 305 V 340 Q 580 350 590 350 H 740 Q 750 350 750 360 V 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <path d="M 280 600 V 680" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <path d="M 750 600 V 680" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
