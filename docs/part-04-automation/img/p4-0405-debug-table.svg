<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Inventory and variable symptoms, likely cause and check</title>
  <desc>Infographic table mapping Ansible inventory and variable symptoms to likely causes and verification checks.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; }
      .header-bg { fill: #207448; }
      .header-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: bold; fill: #ffffff; }
      .cell-bg { fill: #ffffff; stroke: #c8dcd0; stroke-width: 1.5; }
      .cell-bg-orange { fill: #fffaf5; stroke: #db8129; stroke-width: 2.5; }
      .symptom-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #303a36; }
      .symptom-orange { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #db8129; }
      .cause-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; fill: #303a36; }
      .check-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; fill: #303a36; }
      .mono { font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Monaco, Consolas, monospace; }
      .footer-bg { fill: #e8f1ea; stroke: #207448; stroke-width: 2; }
      .footer-text { font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Monaco, Consolas, monospace; font-size: 24px; font-weight: bold; fill: #303a36; text-anchor: middle; }
      .bar-bg { fill: #207448; }
      .bar-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .icon-green { fill: none; stroke: #207448; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { fill: none; stroke: #db8129; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .header-icon { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  
  <rect width="1600" height="1200" class="bg" />

  
  <text x="40" y="70" class="title-text">Inventory and variable symptoms, likely cause and check</text>

  
  <g id="headers">
    
    <rect x="40" y="98" width="360" height="52" rx="8" class="header-bg" />
    <g transform="translate(56, 108)">
      <circle cx="16" cy="16" r="11" class="header-icon" />
      <line x1="24" y1="24" x2="31" y2="31" class="header-icon" />
      <line x1="16" y1="10" x2="16" y2="16" class="header-icon" />
      <circle cx="16" cy="20" r="1" fill="#ffffff" />
    </g>
    <text x="104" y="135" class="header-text">Symptom</text>

    
    <rect x="415" y="98" width="640" height="52" rx="8" class="header-bg" />
    <g transform="translate(433, 108)">
      <circle cx="16" cy="16" r="13" class="header-icon" />
      <circle cx="16" cy="16" r="5" class="header-icon" />
      <line x1="16" y1="1" x2="16" y2="6" class="header-icon" />
      <line x1="16" y1="26" x2="16" y2="31" class="header-icon" />
      <line x1="1" y1="16" x2="6" y2="16" class="header-icon" />
      <line x1="26" y1="16" x2="31" y2="16" class="header-icon" />
    </g>
    <text x="480" y="135" class="header-text">Likely cause</text>

    
    <rect x="1070" y="98" width="490" height="52" rx="8" class="header-bg" />
    <g transform="translate(1088, 108)">
      <rect x="2" y="4" width="28" height="24" rx="4" class="header-icon" />
      <polyline points="7,12 12,16 7,20" class="header-icon" />
      <line x1="15" y1="20" x2="23" y2="20" class="header-icon" />
    </g>
    <text x="1136" y="135" class="header-text">Check</text>
  </g>

  
  
  <g id="row1">
    <rect x="40" y="158" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 190)">
      <rect x="2" y="4" width="40" height="36" rx="5" class="icon-green" />
      <line x1="10" y1="16" x2="34" y2="16" class="icon-green" />
      <circle cx="10" cy="28" r="2.5" fill="#207448" />
      <line x1="18" y1="24" x2="26" y2="32" class="icon-green" />
      <line x1="26" y1="24" x2="18" y2="32" class="icon-green" />
    </g>
    <text x="118" y="220" class="symptom-text">no hosts matched</text>

    <rect x="415" y="158" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="192" class="cause-text">
      <tspan x="437" dy="0">pattern typo, empty group,</tspan>
      <tspan x="437" dy="27">wrong inventory path,</tspan>
      <tspan x="437" dy="27" class="mono">--limit too narrow</tspan>
    </text>

    <rect x="1070" y="158" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="206" class="check-text mono">
      <tspan x="1090" dy="0">--list-hosts,</tspan>
      <tspan x="1090" dy="28">ansible-inventory --graph</tspan>
    </text>
  </g>

  
  <g id="row2">
    <rect x="40" y="271" width="360" height="108" rx="8" class="cell-bg-orange" />
    <g transform="translate(56, 303)">
      <path d="M4 10 L24 4 L40 10 L40 34 L24 40 L4 34 Z" class="icon-orange" />
      <line x1="22" y1="14" x2="22" y2="23" class="icon-orange" />
      <circle cx="22" cy="29" r="2" fill="#db8129" />
    </g>
    <text x="118" y="319" class="symptom-orange">
      <tspan x="118" dy="0">Variable has the</tspan>
      <tspan x="118" dy="28">wrong value</tspan>
    </text>

    <rect x="415" y="271" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="319" class="cause-text">
      <tspan x="437" dy="0">precedence: role vars/ or -e overrides;</tspan>
      <tspan x="437" dy="28">sibling groups conflict</tspan>
    </text>

    <rect x="1070" y="271" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="305" class="check-text mono">
      <tspan x="1090" dy="0">ansible-inventory --host,</tspan>
      <tspan x="1090" dy="27">debug: var=..., -vvv;</tspan>
      <tspan x="1090" dy="27">search all layers with grep -r</tspan>
    </text>
  </g>

  
  <g id="row3">
    <rect x="40" y="384" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 416)">
      <rect x="4" y="6" width="36" height="32" rx="4" class="icon-green" />
      <line x1="12" y1="16" x2="22" y2="16" class="icon-green" />
      <line x1="12" y1="26" x2="28" y2="26" class="icon-green" />
      <line x1="30" y1="12" x2="30" y2="18" class="icon-green" stroke-dasharray="2 2" />
    </g>
    <text x="118" y="432" class="symptom-text">
      <tspan x="118" dy="0">Variable undefined</tspan>
      <tspan x="118" dy="28">for some hosts</tspan>
    </text>

    <rect x="415" y="384" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="418" class="cause-text">
      <tspan x="437" dy="0">defined on a group the host is not in, or</tspan>
      <tspan x="437" dy="27">loaded from the adjacent dir</tspan>
      <tspan x="437" dy="27">of the wrong inventory</tspan>
    </text>

    <rect x="1070" y="384" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="418" class="check-text">
      <tspan x="1090" dy="0" class="mono">--graph --vars;</tspan>
      <tspan x="1090" dy="27">check group_vars placement</tspan>
      <tspan x="1090" dy="27">beside the inventory in use</tspan>
    </text>
  </g>

  
  <g id="row4">
    <rect x="40" y="497" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 529)">
      <path d="M4 10 L16 10 L22 16 L40 16 L40 36 L4 36 Z" class="icon-green" />
      <line x1="14" y1="26" x2="30" y2="26" class="icon-green" />
    </g>
    <text x="118" y="559" class="symptom-text">group_vars ignored</text>

    <rect x="415" y="497" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="531" class="cause-text">
      <tspan x="437" dy="0">file not next to inventory or playbook;</tspan>
      <tspan x="437" dy="27">wrong name (gpu.yaml vs group gpu-nodes);</tspan>
      <tspan x="437" dy="27">invalid group name characters</tspan>
    </text>

    <rect x="1070" y="497" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="545" class="check-text">
      <tspan x="1090" dy="0">name must match</tspan>
      <tspan x="1090" dy="28">group exactly</tspan>
    </text>
  </g>

  
  <g id="row5">
    <rect x="40" y="610" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 642)">
      <path d="M14 6 C8 6, 8 16, 4 18 C8 20, 8 30, 14 30" class="icon-green" />
      <path d="M30 6 C36 6, 36 16, 40 18 C36 20, 36 30, 30 30" class="icon-green" />
      <line x1="18" y1="18" x2="26" y2="18" class="icon-green" />
    </g>
    <text x="118" y="658" class="symptom-text">
      <tspan x="118" dy="0">Dict overrides</tspan>
      <tspan x="118" dy="28">lose keys</tspan>
    </text>

    <rect x="415" y="610" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="672" class="cause-text">dicts replaced not merged</text>

    <rect x="1070" y="610" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="672" class="check-text mono">combine(recursive=True)</text>
  </g>

  
  <g id="row6">
    <rect x="40" y="723" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 755)">
      <path d="M6 34 A18 18 0 1 1 38 34" class="icon-green" />
      <line x1="22" y1="24" x2="32" y2="16" class="icon-green" />
      <circle cx="22" cy="24" r="3" fill="#207448" />
    </g>
    <text x="118" y="771" class="symptom-text">
      <tspan x="118" dy="0">Dynamic inventory</tspan>
      <tspan x="118" dy="28">slow</tspan>
    </text>

    <rect x="415" y="723" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="771" class="cause-text">
      <tspan x="437" dy="0">no _meta, no cache,</tspan>
      <tspan x="437" dy="28">large unfiltered queries</tspan>
    </text>

    <rect x="1070" y="723" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="785" class="check-text">add cache, filters, _meta</text>
  </g>

  
  <g id="row7">
    <rect x="40" y="836" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 868)">
      <rect x="12" y="16" width="20" height="18" rx="3" class="icon-green" />
      <line x1="17" y1="6" x2="17" y2="16" class="icon-green" />
      <line x1="27" y1="6" x2="27" y2="16" class="icon-green" />
      <line x1="22" y1="34" x2="22" y2="40" class="icon-green" />
    </g>
    <text x="118" y="898" class="symptom-text">Plugin not used</text>

    <rect x="415" y="836" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="870" class="cause-text">
      <tspan x="437" dy="0">config filename does not end with</tspan>
      <tspan x="437" dy="27">the required suffix; plugin not enabled</tspan>
      <tspan x="437" dy="27">in ansible.cfg (enable_plugins)</tspan>
    </text>

    <rect x="1070" y="836" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="884" class="check-text mono">
      <tspan x="1090" dy="0">ansible-inventory -vvv,</tspan>
      <tspan x="1090" dy="28">ansible-doc -t inventory name</tspan>
    </text>
  </g>

  
  <g id="row8">
    <rect x="40" y="949" width="360" height="108" rx="8" class="cell-bg" />
    <g transform="translate(56, 981)">
      <circle cx="10" cy="22" r="6" class="icon-green" />
      <circle cx="34" cy="22" r="6" class="icon-green" />
      <line x1="16" y1="22" x2="21" y2="22" class="icon-green" />
      <line x1="27" y1="22" x2="28" y2="22" class="icon-green" />
      <line x1="21" y1="16" x2="27" y2="28" class="icon-green" />
      <line x1="27" y1="16" x2="21" y2="28" class="icon-green" />
    </g>
    <text x="118" y="997" class="symptom-text">
      <tspan x="118" dy="0">Wrong host</tspan>
      <tspan x="118" dy="28">connection</tspan>
    </text>

    <rect x="415" y="949" width="640" height="108" rx="8" class="cell-bg" />
    <text x="437" y="997" class="cause-text">
      <tspan x="437" dy="0">ansible_host missing or incorrect;</tspan>
      <tspan x="437" dy="28">bastion args</tspan>
    </text>

    <rect x="1070" y="949" width="490" height="108" rx="8" class="cell-bg" />
    <text x="1090" y="997" class="check-text mono">
      <tspan x="1090" dy="0">ansible -m debug</tspan>
      <tspan x="1090" dy="28">-a var=ansible_host, -vvvv</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1072" width="1520" height="52" rx="8" class="footer-bg" />
    <text x="800" y="1107" class="footer-text">start with ansible-inventory, it shows the same merged view that Ansible uses</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1134" width="1520" height="50" rx="8" class="bar-bg" />
    <text x="800" y="1169" class="bar-text">Start from what you observe</text>
  </g>
</svg>