<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A driver change goes out in batches: one canary host first, then growing batches, with a stop rule</title>
  <desc>Visual infographic explaining a progressive Ansible driver rollout: check run, canary batch with pre-task, sysctl, template, handler, and post-task validation, a stop rule on failure, followed by 10 percent and 100 percent batches and Slurm node resumption.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 1 3 L 16 9 L 1 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 1 3 L 16 9 L 1 15 Z" fill="#d93829" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A driver change goes out in batches:</tspan>
    <tspan x="800" dy="54">one canary host first, then growing batches,</tspan>
    <tspan x="800" dy="54">with a stop rule</tspan>
  </text>

  
  
  <g id="stage-1">
    <rect x="40" y="215" width="245" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="76" cy="251" r="24" fill="#207448" />
    <text x="76" y="260" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(217, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="54" height="42" rx="6" />
      <path d="M 12 16 L 20 22 L 12 28" />
      <line x1="26" y1="28" x2="42" y2="28" />
    </g>
    
    <text x="162.5" y="330" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="162.5" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Check run:</tspan>
      <tspan x="162.5" dy="38" font-family="monospace" font-size="24">--check --diff</tspan>
      <tspan x="162.5" dy="34" font-family="monospace" font-size="24">--limit gpu001</tspan>
    </text>
  </g>

  
  <path d="M 285 337.5 L 323 337.5" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  
  <g id="stage-2">
    <rect x="325" y="215" width="340" height="245" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="361" cy="251" r="24" fill="#207448" />
    <text x="361" y="260" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(597, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="54" height="42" rx="6" />
      <circle cx="14" cy="21" r="4" fill="#207448" />
      <line x1="28" y1="14" x2="44" y2="14" />
      <line x1="28" y1="28" x2="44" y2="28" />
    </g>
    
    <text x="495.0" y="313" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="495.0" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Canary batch</tspan>
      <tspan x="495.0" dy="30" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">of 1 host:</tspan>
      <tspan x="495.0" dy="28" font-family="sans-serif" font-size="24">pre-task checks the</tspan>
      <tspan x="495.0" dy="26" font-family="sans-serif" font-size="24">Slurm node shows</tspan>
      <tspan x="495.0" dy="26" font-family="sans-serif" font-size="24" font-weight="bold">DRAIN</tspan>
    </text>
  </g>

  
  <path d="M 665 337.5 L 703 337.5" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 495.0 460 L 495.0 483" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="task-1">
    <rect x="325" y="485" width="340" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="495.0" y="530" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="495.0" dy="0" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">sysctl: persist</tspan>
      <tspan x="495.0" dy="32" font-family="monospace" font-size="24">vm.swappiness</tspan>
    </text>
  </g>

  
  <path d="M 495.0 585 L 495.0 603" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="task-2">
    <rect x="325" y="605" width="340" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="495.0" y="650" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="495.0" dy="0" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">template:</tspan>
      <tspan x="495.0" dy="32" font-family="monospace" font-size="24">override.conf</tspan>
    </text>
  </g>

  
  <path d="M 495.0 705 L 495.0 723" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="task-3">
    <rect x="325" y="725" width="340" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="495.0" y="770" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="495.0" dy="0" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">handler: restart</tspan>
      <tspan x="495.0" dy="32" font-family="monospace" font-size="24">nvidia-persistenced</tspan>
      <tspan x="495.0" dy="30" font-family="sans-serif" font-size="24">if changed</tspan>
    </text>
  </g>

  
  <path d="M 495.0 860 L 495.0 878" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="task-4">
    <rect x="325" y="880" width="340" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="495.0" y="922" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="495.0" dy="0" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">post-task:</tspan>
      <tspan x="495.0" dy="30" font-family="monospace" font-size="24">nvidia-smi</tspan>
      <tspan x="495.0" dy="30" font-family="sans-serif" font-size="24">GPU count equals</tspan>
      <tspan x="495.0" dy="30" font-family="monospace" font-size="24">expected_gpus</tspan>
    </text>
  </g>

  
  <path d="M 665 960.0 L 683.0 960.0" fill="none" stroke="#d93829" stroke-width="3.5" marker-end="url(#arrow-red)" />

  
  
  <g id="red-diamond">
    <polygon points="940,835.0 1195.0,960.0 940,1085.0 685.0,960.0" fill="#fff5f5" stroke="#d93829" stroke-width="3.5" stroke-linejoin="round" />
    
    <g transform="translate(914, 850.0)" stroke="#d93829" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="26,3 49,15 49,37 26,49 3,37 3,15" fill="#d93829" />
      <line x1="16" y1="16" x2="36" y2="36" stroke="#ffffff" stroke-width="4" />
      <line x1="36" y1="16" x2="16" y2="36" stroke="#ffffff" stroke-width="4" />
    </g>
    
    <text x="940" y="950.0" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="940" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#d93829">validation fails:</tspan>
      <tspan x="940" dy="36" font-family="sans-serif" font-size="24">the play stops before</tspan>
      <tspan x="940" dy="32" font-family="sans-serif" font-size="24">the 10% batch</tspan>
    </text>
  </g>

  
  
  <g id="stage-3">
    <rect x="705" y="215" width="325" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="741" cy="251" r="24" fill="#207448" />
    <text x="741" y="260" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(962, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <path d="M 28 4 L 28 28 L 50 16 Z" fill="#207448" fill-opacity="0.35" />
    </g>
    
    <text x="867.5" y="330" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="867.5" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">10% batch,</tspan>
      <tspan x="867.5" dy="38" font-family="monospace" font-size="24">max_fail_percentage</tspan>
      <tspan x="867.5" dy="34" font-family="monospace" font-size="24">5</tspan>
    </text>
  </g>

  
  <path d="M 1030 337.5 L 1068 337.5" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  
  <g id="stage-4">
    <rect x="1070" y="215" width="215" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1106" cy="251" r="24" fill="#207448" />
    <text x="1106" y="260" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(1217, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <path d="M 28 4 A 24 24 0 1 1 27.9 4" fill="#207448" fill-opacity="0.35" />
    </g>
    
    <text x="1177.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="1177.5" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">remaining</tspan>
      <tspan x="1177.5" dy="38" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">100% batch</tspan>
    </text>
  </g>

  
  <path d="M 1285 337.5 L 1323 337.5" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  
  <g id="stage-5">
    <rect x="1325" y="215" width="235" height="245" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <circle cx="1361" cy="251" r="24" fill="#207448" />
    <text x="1361" y="260" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(1492, 227)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="18,28 26,36 40,18" />
    </g>
    
    <text x="1442.5" y="313" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#303a36">
      <tspan x="1442.5" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resume</tspan>
      <tspan x="1442.5" dy="30" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Slurm nodes</tspan>
      <tspan x="1442.5" dy="28" font-family="sans-serif" font-size="24">in a</tspan>
      <tspan x="1442.5" dy="26" font-family="sans-serif" font-size="24">separate,</tspan>
      <tspan x="1442.5" dy="26" font-family="sans-serif" font-size="24">explicit play</tspan>
    </text>
  </g>

  
  <rect x="40" y="1110" width="1520" height="65" rx="12" fill="#207448" />
  <text x="800" y="1152" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Each stage catches a different kind of mistake.</text>
</svg>