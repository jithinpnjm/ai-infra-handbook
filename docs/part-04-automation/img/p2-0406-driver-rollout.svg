<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>A driver change goes out in batches: one canary host first, then growing batches, with a stop rule</title>
  <desc>Visual infographic explaining staged canary deployment for GPU driver updates with automated stop rule validation before batch expansion.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#c5221f" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold" fill="#303a36">A driver change goes out in batches: one canary host first,</text>
  <text x="50" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold" fill="#303a36">then growing batches, with a stop rule</text>

  
  
  <circle cx="100" cy="150" r="22" fill="#207448"/>
  <text x="100" y="158" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(190, 130)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="34" rx="4"/>
    <path d="M8 12 L16 18 L8 24"/>
    <line x1="20" y1="24" x2="30" y2="24"/>
  </g>
  
  <rect x="50" y="190" width="250" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="240" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Check run:</text>
  <text x="175" y="285" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">--check --diff</text>
  <text x="175" y="325" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">--limit gpu001</text>

  
  <line x1="300" y1="280" x2="328" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <circle cx="380" cy="150" r="22" fill="#207448"/>
  <text x="380" y="158" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(520, 128)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="38" height="38" rx="6"/>
    <circle cx="19" cy="19" r="6"/>
    <line x1="19" y1="4" x2="19" y2="9"/>
    <line x1="19" y1="29" x2="19" y2="34"/>
  </g>
  
  <rect x="330" y="190" width="290" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="475" y="235" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Canary batch of 1 host:</text>
  <text x="475" y="275" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">pre-task checks the</text>
  <text x="475" y="315" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Slurm node shows DRAIN</text>

  
  <line x1="475" y1="370" x2="475" y2="415" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>

  
  <rect x="180" y="420" width="530" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6"/>
  
  <rect x="205" y="435" width="295" height="36" rx="6" fill="#207448"/>
  <text x="352" y="461" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">inside the canary batch</text>

  
  <rect x="205" y="485" width="480" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="528" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">sysctl: persist vm.swappiness</text>

  
  <line x1="445" y1="555" x2="445" y2="578" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <rect x="205" y="585" width="480" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="628" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">template: override.conf</text>

  
  <line x1="445" y1="655" x2="445" y2="678" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <rect x="205" y="685" width="480" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="445" y="723" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">handler: restart</text>
  <text x="445" y="757" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">nvidia-persistenced if changed</text>

  
  <line x1="445" y1="780" x2="445" y2="803" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <rect x="205" y="810" width="480" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="852" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">post-task: nvidia-smi GPU</text>
  <text x="445" y="888" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">count equals expected_gpus</text>

  
  
  <path d="M 685 845 H 775 V 405 H 805 V 372" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="740" y="580" width="70" height="34" rx="6" fill="#207448"/>
  <text x="775" y="604" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">pass</text>

  
  <line x1="685" y1="885" x2="840" y2="885" stroke="#c5221f" stroke-width="3.5" marker-end="url(#arrow-red)"/>
  <rect x="720" y="865" width="60" height="34" rx="6" fill="#c5221f"/>
  <text x="750" y="889" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">fail</text>

  
  <polygon points="1130,760 1420,885 1130,1010 840,885" fill="#fdf2f2" stroke="#c5221f" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="1130" y="850" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#c5221f" text-anchor="middle">validation fails:</text>
  <text x="1130" y="888" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">the play stops before</text>
  <text x="1130" y="924" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">the 10% batch</text>

  
  
  <circle cx="720" cy="150" r="22" fill="#207448"/>
  <text x="720" y="158" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(860, 128)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="30" height="38" rx="4"/>
    <rect x="12" y="8" width="28" height="30" rx="4"/>
  </g>
  
  <rect x="650" y="190" width="310" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="240" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">10% batch,</text>
  <text x="805" y="285" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">max_fail_percentage</text>
  <text x="805" y="325" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">5</text>

  
  <line x1="960" y1="280" x2="988" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <circle cx="1040" cy="150" r="22" fill="#207448"/>
  <text x="1040" y="158" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1180, 128)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="38" height="10" rx="2"/>
    <rect x="0" y="14" width="38" height="10" rx="2"/>
    <rect x="0" y="28" width="38" height="10" rx="2"/>
  </g>
  
  <rect x="990" y="190" width="260" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="265" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">remaining</text>
  <text x="1120" y="305" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">100% batch</text>

  
  <line x1="1250" y1="280" x2="1278" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <circle cx="1330" cy="150" r="22" fill="#207448"/>
  <text x="1330" y="158" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(1480, 128)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="19" cy="19" r="18"/>
    <polygon points="15,11 28,19 15,27" fill="#207448"/>
  </g>
  
  <rect x="1280" y="190" width="280" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" filter="url(#shadow)"/>
  <text x="1420" y="235" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Resume Slurm</text>
  <text x="1420" y="270" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">nodes in a</text>
  <text x="1420" y="305" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">separate, explicit</text>
  <text x="1420" y="340" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">play</text>

  
  <rect x="50" y="1030" width="1500" height="52" rx="10" fill="#207448"/>
  <text x="800" y="1065" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Each stage catches a different kind of mistake.</text>
</svg>