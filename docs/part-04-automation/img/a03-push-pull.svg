<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" width="1600" height="1030" style="background:#f5f8f5; font-family:sans-serif;">
  <title>Push sends work out, pull lets each machine ask for it</title>
  <desc>Infographic comparing push-based architecture like Ansible with pull-based architecture like Puppet, Chef, and Salt.</desc>

  
  <text x="800" y="60" text-anchor="middle" font-size="40" font-weight="bold" fill="#303a36">Push sends work out, pull lets each machine ask for it</text>

  
  <rect x="60" y="115" width="710" height="770" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="415" y="168" text-anchor="middle" font-size="32" font-weight="bold" fill="#207448">Push (Ansible)</text>

  
  <rect x="165" y="210" width="500" height="95" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  
  <g transform="translate(205, 233)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="12"/>
    <path d="M24,4 L24,10 M24,38 L24,44 M4,24 L10,24 M38,24 L44,24 M10,10 L14,14 M34,34 L38,38 M10,38 L14,34 M34,14 L38,10"/>
  </g>
  <text x="400" y="268" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">Control node</text>

  
  <line x1="190" y1="305" x2="190" y2="554" stroke="#207448" stroke-width="4"/>
  <polygon points="190,570 182,554 198,554" fill="#207448"/>

  <line x1="415" y1="305" x2="415" y2="554" stroke="#207448" stroke-width="4"/>
  <polygon points="415,570 407,554 423,554" fill="#207448"/>

  <line x1="640" y1="305" x2="640" y2="554" stroke="#207448" stroke-width="4"/>
  <polygon points="640,570 632,554 648,554" fill="#207448"/>

  
  <rect x="270" y="412" width="290" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="415" y="445" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">SSH: sends the task</text>

  
  <rect x="95" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="190" y="630" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web1</text>

  <rect x="320" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="415" y="630" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web2</text>

  <rect x="545" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="640" y="630" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web3</text>

  
  <rect x="95" y="715" width="640" height="135" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="1.5"/>
  <text x="415" y="760" text-anchor="middle" font-size="24" fill="#303a36">No agent is installed on the targets.</text>
  <text x="415" y="805" text-anchor="middle" font-size="24" fill="#303a36">The control node decides when work happens.</text>


  
  <rect x="830" y="115" width="710" height="770" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="168" text-anchor="middle" font-size="32" font-weight="bold" fill="#207448">Pull (agent-based)</text>

  
  <rect x="935" y="210" width="500" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(975, 233)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="40" height="14" rx="3"/>
    <rect x="4" y="26" width="40" height="14" rx="3"/>
    <circle cx="36" cy="13" r="2" fill="#207448"/>
    <circle cx="36" cy="33" r="2" fill="#207448"/>
  </g>
  <text x="1195" y="268" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">Central server</text>

  
  <line x1="960" y1="570" x2="960" y2="321" stroke="#207448" stroke-width="4"/>
  <polygon points="960,305 952,321 968,321" fill="#207448"/>

  <line x1="1185" y1="570" x2="1185" y2="321" stroke="#207448" stroke-width="4"/>
  <polygon points="1185,305 1177,321 1193,321" fill="#207448"/>

  <line x1="1410" y1="570" x2="1410" y2="321" stroke="#207448" stroke-width="4"/>
  <polygon points="1410,305 1402,321 1418,321" fill="#207448"/>

  
  <rect x="1075" y="412" width="220" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="445" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">asks for work</text>

  
  
  <rect x="865" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="960" y="612" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web1</text>
  <rect x="915" y="626" width="90" height="32" rx="6" fill="#207448"/>
  <text x="960" y="649" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

  
  <rect x="1090" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="612" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web2</text>
  <rect x="1140" y="626" width="90" height="32" rx="6" fill="#207448"/>
  <text x="1185" y="649" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

  
  <rect x="1315" y="570" width="190" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1410" y="612" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">web3</text>
  <rect x="1365" y="626" width="90" height="32" rx="6" fill="#207448"/>
  <text x="1410" y="649" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">agent</text>

  
  <rect x="865" y="715" width="640" height="135" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="1.5"/>
  <text x="1185" y="760" text-anchor="middle" font-size="24" fill="#303a36">Each machine decides when to ask.</text>
  <text x="1185" y="805" text-anchor="middle" font-size="24" fill="#303a36">An agent runs on every machine.</text>


  
  <rect x="60" y="920" width="1480" height="65" rx="10" fill="#207448"/>
  <text x="800" y="961" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Puppet, Chef and Salt pull. Ansible pushes.</text>
</svg>