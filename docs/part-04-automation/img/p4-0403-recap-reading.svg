<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading the PLAY RECAP: which counters matter</title>
  <desc>Visual guide to Ansible play recap counters, highlighting error counters and target state</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Reading the PLAY RECAP: which counters matter</text>

  
  <g id="recap-panel">
    <rect x="80" y="115" width="1440" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="110" y="145" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="110" y1="160" x2="166" y2="160" stroke="#207448" stroke-width="3"/>
    <polyline points="120,174 126,180 120,186" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="132" y1="186" x2="144" y2="186" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="195" y="174" font-family="monospace" font-size="24" fill="#303a36">gpu01 : ok=4 changed=2 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0</text>
    <text x="195" y="224" font-family="monospace" font-size="24" fill="#303a36">gpu02 : ok=4 changed=2 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0</text>
  </g>

  
  
  <g id="callout-ok">
    <rect x="80" y="300" width="435" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="138" cy="358" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="126,358 134,366 150,350" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="105" y="425" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">ok: </tspan><tspan font-size="24">tasks that ran,</tspan>
      <tspan x="105" dy="36" font-size="24">including those</tspan>
      <tspan x="105" dy="32" font-size="24">already correct</tspan>
    </text>
  </g>

  
  <g id="callout-changed">
    <rect x="540" y="300" width="435" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="598" cy="358" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 598 336 L 598 344 M 598 372 L 598 380 M 576 358 L 584 358 M 612 358 L 620 358 M 582 342 L 588 348 M 608 368 L 614 374 M 582 374 L 588 368 M 608 348 L 614 342" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="565" y="425" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">changed: </tspan><tspan font-size="24">how much</tspan>
      <tspan x="565" dy="36" font-size="24">work the run</tspan>
      <tspan x="565" dy="32" font-size="24">actually did</tspan>
    </text>
  </g>

  
  <g id="callout-unreachable-failed">
    <rect x="1000" y="300" width="520" height="215" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <polygon points="1060,335 1032,381 1088,381" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="1060" y1="350" x2="1060" y2="365" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1060" cy="373" r="2.5" fill="#db8129"/>
    
    <text x="1025" y="425" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#303a36">unreachable and failed: </tspan>
      <tspan x="1025" dy="36" font-size="24" fill="#303a36">start from the right side,</tspan>
      <tspan x="1025" dy="32" font-size="24" fill="#303a36">zero is what you want</tspan>
    </text>
  </g>

  
  
  <g id="callout-skipped">
    <rect x="80" y="540" width="435" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="138" cy="587" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="130,577 142,587 130,597" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="597" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">skipped</text>
  </g>

  
  <g id="callout-rescued">
    <rect x="540" y="540" width="435" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="598" cy="587" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="598" y1="575" x2="598" y2="599" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="586" y1="587" x2="610" y2="587" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="645" y="597" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">rescued</text>
  </g>

  
  <g id="callout-ignored">
    <rect x="1000" y="540" width="520" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1060" cy="587" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1043" y1="570" x2="1077" y2="604" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="1110" y="597" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ignored</text>
  </g>

  
  <g id="explanation-box">
    <rect x="80" y="660" width="1440" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="110" y="682" width="44" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="122" y1="696" x2="142" y2="696" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="122" y1="708" x2="142" y2="708" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="122" y1="720" x2="134" y2="720" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="190" y="718" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="190" dy="0">first run changed two things on each host, probably the package install and</tspan>
      <tspan x="190" dy="36">the service start; the debug task stayed ok because it only prints</tspan>
    </text>
  </g>

  
  <g id="second-run-box">
    <rect x="80" y="820" width="1440" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="138" cy="872" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="138" cy="872" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="138" cy="872" r="4" fill="#207448"/>
    
    <text x="190" y="882" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">rerun showing changed=0 means you have reached the target</text>
  </g>

  
  <g id="bottom-strip">
    <rect x="80" y="950" width="1440" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 116 970 Q 138 962 160 970 L 160 1005 Q 138 997 116 1005 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="138" y1="964" x2="138" y2="1000" stroke="#207448" stroke-width="3"/>
    
    <text x="190" y="990" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="190" dy="0">full playbook mechanics (variables, handlers, loops, blocks,</tspan>
      <tspan x="190" dy="32">error handling, roles) follow in 4.6 to 4.11</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="80" y="1070" width="1440" height="65" rx="8" fill="#207448"/>
    <text x="800" y="1112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Read the recap from the right side</text>
  </g>
</svg>