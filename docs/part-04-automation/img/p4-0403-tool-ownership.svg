<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110">
  <title>Which tool owns which change</title>
  <desc>A table showing which DevOps and infrastructure tool owns which change, their roles, and relationships to Ansible.</desc>

  <rect width="1600" height="1110" fill="#f5f8f5" />

  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which tool owns which change</text>

  
  <rect x="40" y="105" width="1520" height="54" rx="8" fill="#207448" />
  <text x="120" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Tool</text>
  <text x="470" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Role</text>
  <text x="900" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Relationship to Ansible</text>

  
  <rect x="40" y="165" width="1520" height="88" rx="6" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
  <g stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 213 a 10 10 0 0 1 18 -5 a 12 12 0 0 1 18 8 a 8 8 0 0 1 -2 16 h -30 a 9 9 0 0 1 -4 -19 z" />
    <line x1="68" y1="238" x2="94" y2="238" />
  </g>
  <text x="120" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Terraform or<tspan x="120" dy="34">OpenTofu</tspan></text>
  <text x="470" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">create cloud and network<tspan x="470" dy="32">resources, keeps state</tspan></text>
  <text x="900" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">provision machines; Ansible configures<tspan x="900" dy="32">what runs on them (4.17, 4.27)</tspan></text>

  
  <rect x="40" y="259" width="1520" height="88" rx="6" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="72" cy="297" r="10" />
    <path d="M 79 304 l 19 19 m -7 -7 l 5 -5 m 4 4 l 5 -5" />
  </g>
  <text x="120" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">cloud-init</text>
  <text x="470" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">first-boot bootstrap</text>
  <text x="900" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">seeds SSH keys and users; Ansible<tspan x="900" dy="32">does the real configuration</tspan></text>

  
  <rect x="40" y="353" width="1520" height="88" rx="6" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 375 l 20 11 v 22 l -20 11 l -20 -11 v -22 z" />
    <path d="M 80 375 v 22 l 20 11 m -20 -11 l -20 11" />
  </g>
  <text x="120" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Packer</text>
  <text x="470" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">build images</text>
  <text x="900" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">uses Ansible as provisioner (4.2)</text>

  
  <rect x="40" y="447" width="1520" height="88" rx="6" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 491 a 16 16 0 0 1 27 -11 l 4 4 m 0 -8 v 8 h -8" />
    <path d="M 96 491 a 16 16 0 0 1 -27 11 l -4 -4 m 0 8 v -8 h 8" />
  </g>
  <text x="120" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Puppet, Chef,<tspan x="120" dy="34">Salt</tspan></text>
  <text x="470" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">agent-based continuous<tspan x="470" dy="32">convergence</tspan></text>
  <text x="900" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">alternatives; stronger for constant<tspan x="900" dy="32">enforcement, heavier to operate</tspan></text>

  
  <rect x="40" y="541" width="1520" height="88" rx="6" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="565" width="40" height="34" rx="4" />
    <path d="M 68 578 l 6 5 l -6 5" />
    <line x1="79" y1="588" x2="89" y2="588" />
  </g>
  <text x="120" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shell scripts</text>
  <text x="470" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">glue</text>
  <text x="900" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">not idempotent, hard to reuse;<tspan x="900" dy="32">Ansible modules replace most</tspan></text>

  
  <rect x="40" y="635" width="1520" height="88" rx="6" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="80" cy="664" r="7" />
    <circle cx="67" cy="688" r="7" />
    <circle cx="93" cy="688" r="7" />
    <line x1="76" y1="670" x2="71" y2="682" />
    <line x1="84" y1="670" x2="89" y2="682" />
    <line x1="74" y1="688" x2="86" y2="688" />
  </g>
  <text x="120" y="672" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Kubernetes,<tspan x="120" dy="34">Helm, Argo</tspan></text>
  <text x="470" y="689" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">workloads on clusters</text>
  <text x="900" y="672" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Ansible installs clusters (Kubespray) and<tspan x="900" dy="32">nodes, not the application layer</tspan></text>

  
  <rect x="40" y="729" width="1520" height="88" rx="6" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="1.5" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="80" cy="773" r="18" />
    <polyline points="80,762 80,773 90,773" />
  </g>
  <text x="120" y="783" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Slurm</text>
  <text x="470" y="783" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">job scheduling</text>
  <text x="900" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Ansible installs and configures Slurm<tspan x="900" dy="32">and its nodes (Part 6)</tspan></text>

  
  <rect x="40" y="842" width="1520" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a common day: Terraform builds a new pool of GPU VMs with network and disks;</text>
  <text x="70" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">cloud-init handles first boot with a user and an SSH key; Ansible installs</text>
  <text x="70" y="954" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the driver, sets kernel parameters and starts the monitoring agent</text>

  
  <rect x="40" y="1002" width="1520" height="70" rx="8" fill="#207448" />
  <text x="800" y="1046" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Each tool does one part of the job, and none tries to do all of it</text>
</svg>