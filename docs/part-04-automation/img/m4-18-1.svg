<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Declarative versus imperative</title>
  <desc>Visual comparison showing how Terraform reconciles desired configuration, recorded state, and real infrastructure through terraform plan to produce an execution plan, which terraform apply executes to update both state and real infrastructure.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1,2 L 10,6 L 1,10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1,2 L 10,6 L 1,10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Declarative versus imperative</text>

  
  
  <path d="M 380,565 L 420,565" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 780,565 L 830,565" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <path d="M 1190,565 L 1230,565" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1395,450 L 1395,235 Q 1395,220 1375,220 L 1080,220" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  
  <path d="M 520,220 L 485,220 Q 470,220 470,235 L 470,450" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  
  <path d="M 1395,680 L 1395,845 Q 1395,860 1375,860 L 1080,860" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  
  <path d="M 520,860 L 485,860 Q 470,860 470,845 L 470,680" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  
  <g id="node-state">
    <rect x="520" y="140" width="560" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <ellipse cx="580" cy="200" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 558,200 L 558,236 A 22 8 0 0 0 602,236 L 602,200" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 558,218 A 22 8 0 0 0 602,218" fill="none" stroke="#207448" stroke-width="4"/>
    
    <text x="630" y="208" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">State</text>
    <text x="630" y="252" font-family="sans-serif" font-size="24" fill="#303a36">what Terraform believes exists</text>
  </g>

  
  <g id="node-config">
    <rect x="40" y="450" width="340" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 194,476 L 216,476 L 226,486 L 226,522 L 194,522 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 216,476 L 216,486 L 226,486" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="202" y1="496" x2="218" y2="496" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="202" y1="505" x2="214" y2="505" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="202" y1="514" x2="210" y2="514" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="210" y="562" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">Configuration </tspan>
      <tspan font-family="monospace">(*.tf)</tspan>
    </text>
    <text x="210" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">desired state</text>
  </g>

  
  <g id="node-plan">
    <rect x="420" y="450" width="360" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="585" y="476" width="30" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 594,476 L 594,472 L 606,472 L 606,476" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 591,491 L 595,495 L 602,487" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 591,507 L 595,511 L 602,503" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="600" y="562" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">terraform plan</text>
    <text x="600" y="604" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">config vs state</tspan>
      <tspan x="600" dy="32">vs real world</tspan>
    </text>
  </g>

  
  <g id="node-diff">
    <rect x="830" y="450" width="360" height="230" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <rect x="994" y="476" width="32" height="44" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="1002" y1="492" x2="1010" y2="492" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1006" y1="488" x2="1006" y2="496" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1015" y1="492" x2="1022" y2="492" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1002" y1="508" x2="1010" y2="508" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1015" y1="508" x2="1022" y2="508" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    
    <text x="1010" y="562" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Execution plan</text>
    <text x="1010" y="604" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1010" dy="0">add / change /</tspan>
      <tspan x="1010" dy="32">destroy / replace</tspan>
    </text>
  </g>

  
  <g id="node-apply">
    <rect x="1230" y="450" width="330" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1395" cy="498" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="1395" cy="498" r="5" fill="#207448"/>
    <line x1="1395" y1="478" x2="1395" y2="483" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1395" y1="513" x2="1395" y2="518" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1375" y1="498" x2="1380" y2="498" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1410" y1="498" x2="1415" y2="498" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1381" y1="484" x2="1385" y2="488" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1405" y1="508" x2="1409" y2="512" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1381" y1="512" x2="1385" y2="508" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1405" y1="488" x2="1409" y2="484" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="1395" y="562" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">terraform apply</text>
    <text x="1395" y="604" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1395" dy="0">call provider APIs</tspan>
      <tspan x="1395" dy="32">in dependency order</tspan>
    </text>
  </g>

  
  <g id="node-real">
    <rect x="520" y="780" width="560" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 564,868 A 12 12 0 0 1 575,850 A 16 16 0 0 1 601,850 A 12 12 0 0 1 608,868 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="566" y1="876" x2="604" y2="876" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="566" y1="884" x2="604" y2="884" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="572" cy="876" r="1.5" fill="#207448"/>
    <circle cx="572" cy="884" r="1.5" fill="#207448"/>
    
    <text x="630" y="848" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Real infrastructure</text>
    <text x="630" y="892" font-family="sans-serif" font-size="24" fill="#303a36">(refresh via provider APIs)</text>
  </g>
</svg>