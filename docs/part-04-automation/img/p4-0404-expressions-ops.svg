<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Expressions: reading values out of the context</title>
  <desc>Visual infographic explaining Jinja2 expressions, filing cabinet analogy for context access, list indexing, literals, operators, and string concatenation.</desc>

  
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Expressions: reading values out of the context</text>

  
  <g id="panel-context-access">
    <rect x="40" y="95" width="740" height="440" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <rect x="64" y="112" width="692" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(78, 141)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="44" height="48" rx="5"/>
      <line x1="4" y1="20" x2="48" y2="20"/>
      <line x1="4" y1="36" x2="48" y2="36"/>
      <rect x="20" y="10" width="12" height="4" rx="1.5" fill="#207448"/>
      <rect x="20" y="26" width="12" height="4" rx="1.5" fill="#207448"/>
      <rect x="20" y="42" width="12" height="4" rx="1.5" fill="#207448"/>
    </g>

    
    <rect x="148" y="136" width="226" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.8"/>
    <text x="261" y="177" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">cluster.name</text>
    
    
    <text x="400" y="154" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="400" dy="0">opens the drawer </tspan>
      <tspan x="400" dy="26">cluster and takes </tspan>
      <tspan x="400" dy="26">the name folder</tspan>
    </text>

    
    <rect x="64" y="238" width="692" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="84" y="260" width="270" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.8"/>
    <text x="219" y="301" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">cluster[&quot;name&quot;]</text>
    <text x="545" y="302" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">item form</text>

    
    <rect x="64" y="358" width="692" height="157" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="94" y="404" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">lists</text>
    <rect x="84" y="426" width="205" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.8"/>
    <text x="186" y="469" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">list[0]</text>
    <rect x="308" y="426" width="205" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.8"/>
    <text x="410" y="469" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">list[-1]</text>
    <rect x="532" y="426" width="205" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.8"/>
    <text x="634" y="469" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">list[1:3]</text>
  </g>

  
  <g id="panel-literals">
    <rect x="820" y="95" width="740" height="440" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(846, 115)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 6 L 34 6 L 48 20 L 26 42 L 12 28 Z"/>
      <circle cx="22" cy="16" r="3.5" fill="#207448"/>
      <path d="M 30 38 L 44 48 L 48 44"/>
    </g>

    <text x="920" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Literals</text>

    
    <rect x="846" y="188" width="688" height="324" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    <text x="1190" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#303a36">
      <tspan x="1190" dy="0">strings, numbers, true and false </tspan>
      <tspan x="1190" dy="48">(Python True and False also work), </tspan>
      <tspan x="1190" dy="48">none, lists [1, 2], </tspan>
      <tspan x="1190" dy="48">dicts {a: 1}, tuples</tspan>
    </text>
  </g>

  
  <g id="operators-table">
    <rect x="40" y="575" width="1520" height="310" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(64, 595)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <line x1="16" y1="20" x2="26" y2="20"/>
      <line x1="21" y1="15" x2="21" y2="25"/>
      <line x1="30" y1="20" x2="40" y2="20"/>
      <line x1="16" y1="36" x2="26" y2="36"/>
      <line x1="30" y1="33" x2="40" y2="33"/>
      <line x1="30" y1="39" x2="40" y2="39"/>
    </g>

    
    <rect x="64" y="656" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="418" y="698" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">arithmetic + - * / // % **</text>
    
    <rect x="828" y="656" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="1182" y="698" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">comparison == != &lt; &gt; &lt;= &gt;=</text>
    
    <rect x="64" y="730" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="418" y="772" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">logic and or not</text>
    
    <rect x="828" y="730" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="1182" y="772" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">membership in</text>
    
    <rect x="64" y="804" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="418" y="846" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">conditional: {{ a if cond else b }}</text>
    
    <rect x="828" y="804" width="708" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8"/>
    <text x="1182" y="846" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">is applies a test</text>
  </g>

  
  <g id="callout-tilde">
    <rect x="40" y="915" width="1520" height="135" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(68, 955)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <path d="M 16 28 C 18 20, 24 20, 28 28 C 32 36, 38 36, 40 28"/>
    </g>

    <text x="144" y="958" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">join strings with ~, not +: ~ always treats its operands as text </tspan>
      <tspan x="144" dy="30">so a node number of 1 joins cleanly as gpu ~ 1; </tspan>
      <tspan x="144" dy="30">+ tries arithmetic first and mixing text with a number fails</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1075" width="1520" height="70" rx="12" fill="#207448"/>
    <g transform="translate(68, 1092)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="16"/>
      <polyline points="10,18 16,24 26,12"/>
    </g>
    <text x="800" y="1120" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Use ~ to join text</text>
  </g>
</svg>