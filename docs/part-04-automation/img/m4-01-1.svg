<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The Git object model</title>
  <desc>Visual diagram of the Git object model showing HEAD, references, commits, trees, and blobs inside the git objects database.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The Git object model</text>

  
  <g id="Repo">
    <rect x="420" y="130" width="1130" height="820" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="10 8" />
    
    <rect x="420" y="130" width="1130" height="60" rx="16" fill="#e8f1ea" />
    <rect x="420" y="174" width="1130" height="16" fill="#e8f1ea" />
    <line x1="420" y1="190" x2="1550" y2="190" stroke="#207448" stroke-width="2" />
    <text x="450" y="172" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">.git/objects <tspan font-family="sans-serif" font-weight="bold">(content-addressed database)</tspan></text>
  </g>

  
  
  <path d="M 215 330 L 215 430" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 380 510 C 420 510, 420 410, 460 410" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 790 275 L 840 275" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1150 275 L 1200 275" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 575 490 L 575 570" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 790 630 L 840 630" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 790 690 C 815 690, 815 840, 840 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1150 840 L 1200 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="node-HEAD">
    <rect x="50" y="190" width="330" height="140" rx="14" fill="#fef8f0" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(85, 238)">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#db8129" stroke-width="3.5" />
      <polygon points="24,8 31,24 24,20 17,24" fill="#db8129" />
      <polygon points="24,40 31,24 24,28 17,24" fill="none" stroke="#db8129" stroke-width="2" />
    </g>
    <text x="160" y="272" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">HEAD</text>
  </g>

  
  <g id="node-REF">
    <rect x="50" y="430" width="330" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(193, 452)">
      <circle cx="10" cy="38" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="38" cy="10" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="10" cy="10" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="10" y1="16" x2="10" y2="32" stroke="#207448" stroke-width="3.5" />
      <path d="M 10 32 C 10 22, 38 24, 38 16" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="215" y="545" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">refs/heads/main</text>
  </g>

  
  <g id="node-C3">
    <rect x="460" y="230" width="330" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(485, 252)">
      <circle cx="22" cy="22" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="22" x2="8" y2="22" stroke="#207448" stroke-width="3.5" />
      <line x1="36" y1="22" x2="44" y2="22" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="545" y="282" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">commit C3</text>
    <text x="485" y="345" font-family="monospace" font-size="25" fill="#303a36">parent: C2</text>
    <text x="485" y="385" font-family="monospace" font-size="25" fill="#303a36">tree: T3</text>
    <text x="485" y="425" font-family="sans-serif" font-size="24" fill="#303a36">author, message</text>
  </g>

  
  <g id="node-C2">
    <rect x="840" y="230" width="310" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(865, 252)">
      <circle cx="22" cy="22" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="22" x2="8" y2="22" stroke="#207448" stroke-width="3.5" />
      <line x1="36" y1="22" x2="44" y2="22" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="925" y="282" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">commit C2</text>
    <text x="865" y="345" font-family="monospace" font-size="25" fill="#303a36">parent: C1</text>
    <text x="865" y="385" font-family="monospace" font-size="25" fill="#303a36">tree: T2</text>
  </g>

  
  <g id="node-C1">
    <rect x="1200" y="230" width="300" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(1225, 252)">
      <circle cx="22" cy="22" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="22" x2="8" y2="22" stroke="#207448" stroke-width="3.5" />
      <line x1="36" y1="22" x2="44" y2="22" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="1285" y="282" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">commit C1</text>
    <text x="1225" y="345" font-family="monospace" font-size="25" fill="#303a36">tree: T1</text>
  </g>

  
  <g id="node-T3">
    <rect x="460" y="570" width="330" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(485, 592)">
      <path d="M 4 8 L 18 8 L 24 14 L 44 14 A 4 4 0 0 1 48 18 L 48 38 A 4 4 0 0 1 44 42 L 4 42 A 4 4 0 0 1 0 38 L 0 12 A 4 4 0 0 1 4 8 Z" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="545" y="622" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">tree T3</text>
    <text x="485" y="685" font-family="sans-serif" font-size="25" fill="#303a36">(directory)</text>
  </g>

  
  <g id="node-B1">
    <rect x="840" y="550" width="310" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(865, 572)">
      <path d="M 6 0 L 26 0 L 38 12 L 38 42 A 4 4 0 0 1 34 46 L 6 46 A 4 4 0 0 1 2 42 L 2 4 A 4 4 0 0 1 6 0 Z" fill="none" stroke="#207448" stroke-width="3.5" />
      <polyline points="26,0 26,12 38,12" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="915" y="602" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">blob</text>
    <text x="865" y="665" font-family="monospace" font-size="25" fill="#303a36">main.tf</text>
  </g>

  
  <g id="node-T4">
    <rect x="840" y="760" width="310" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(865, 782)">
      <path d="M 4 8 L 18 8 L 24 14 L 44 14 A 4 4 0 0 1 48 18 L 48 38 A 4 4 0 0 1 44 42 L 4 42 A 4 4 0 0 1 0 38 L 0 12 A 4 4 0 0 1 4 8 Z" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="925" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">tree</text>
    <text x="865" y="875" font-family="monospace" font-size="25" fill="#303a36">roles/</text>
  </g>

  
  <g id="node-B2">
    <rect x="1200" y="760" width="310" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    
    <g transform="translate(1225, 782)">
      <path d="M 6 0 L 26 0 L 38 12 L 38 42 A 4 4 0 0 1 34 46 L 6 46 A 4 4 0 0 1 2 42 L 2 4 A 4 4 0 0 1 6 0 Z" fill="none" stroke="#207448" stroke-width="3.5" />
      <polyline points="26,0 26,12 38,12" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="1275" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">blob</text>
    <text x="1225" y="875" font-family="monospace" font-size="25" fill="#303a36">tasks/main.yml</text>
  </g>
</svg>