<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Template and YAML error messages, and what each usually means</title>
  <desc>Visual reference table comparing common Ansible and YAML template error messages, their root causes, and where to inspect first.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Template and YAML error messages, and what each usually means</text>

  
  
  <rect x="45" y="78" width="450" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="242" y="90" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="242" y1="104" x2="298" y2="104" stroke="#207448" stroke-width="3"/>
  <polyline points="252,115 258,121 252,127" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="264" y1="127" x2="274" y2="127" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Message</text>

  
  <rect x="510" y="78" width="430" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 713 124 C 707 117 707 104 717 95 C 727 86 739 89 743 100 C 746 109 741 118 736 124 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="717" y1="128" x2="732" y2="128" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="720" y1="133" x2="729" y2="133" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="725" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">What it usually means</text>

  
  <rect x="955" y="78" width="600" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1245" cy="110" r="16" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="1257" y1="122" x2="1271" y2="136" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1245" cy="110" r="3" fill="#207448"/>
  <text x="1255" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">First look</text>

  
  <g>
    
    <rect x="45" y="210" width="450" height="180" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
    <rect x="45" y="210" width="8" height="180" rx="4" fill="#db8129"/>
    <text x="70" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="70" dy="0">AnsibleUndefinedVariable:</tspan>
      <tspan x="70" dy="34">x is undefined</tspan>
    </text>

    
    <rect x="510" y="210" width="430" height="180" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="535" dy="0">a variable is missing</tspan>
      <tspan x="535" dy="34">from the context</tspan>
    </text>

    
    <rect x="955" y="210" width="600" height="180" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="980" dy="0">the exact variable name and the</tspan>
      <tspan x="980" dy="29">precedence layer (4.7); print the data</tspan>
      <tspan x="980" dy="29">with to_nice_json in a debug task,</tspan>
      <tspan x="980" dy="29" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ansible-playbook -vvv, or</tspan>
      <tspan x="980" dy="29" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">ansible-inventory --host name</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="45" y="402" width="450" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="70" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">template error while</tspan>
      <tspan x="70" dy="30">templating string:</tspan>
      <tspan x="70" dy="30">unexpected }</tspan>
    </text>

    
    <rect x="510" y="402" width="430" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="535" dy="0">unbalanced braces, or</tspan>
      <tspan x="535" dy="30">confusion with a</tspan>
      <tspan x="535" dy="30">YAML flow mapping</tspan>
    </text>

    
    <rect x="955" y="402" width="600" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the braces and the quotes</text>
  </g>

  
  <g>
    
    <rect x="45" y="530" width="450" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="70" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">mapping values are</tspan>
      <tspan x="70" dy="32">not allowed here</tspan>
    </text>

    
    <rect x="510" y="530" width="430" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="535" dy="0">an unquoted string</tspan>
      <tspan x="535" dy="32">contains a YAML colon</tspan>
    </text>

    
    <rect x="955" y="530" width="600" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="586" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">quote the value</text>
  </g>

  
  <g>
    
    <rect x="45" y="638" width="450" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="70" y="678" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">found character \t that</tspan>
      <tspan x="70" dy="32">cannot start any token</tspan>
    </text>

    
    <rect x="510" y="638" width="430" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a tab character in the file</text>

    
    <rect x="955" y="638" width="600" height="96" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">replace the tab with spaces</text>
  </g>

  
  <g>
    
    <rect x="45" y="746" width="450" height="82" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="70" y="796" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">did not find expected key</text>

    
    <rect x="510" y="746" width="430" height="82" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">indentation is wrong</text>

    
    <rect x="955" y="746" width="600" height="82" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the line number and indentation</text>
  </g>

  
  <g>
    
    <rect x="45" y="840" width="450" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="70" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">The task includes an</tspan>
      <tspan x="70" dy="30">option with an</tspan>
      <tspan x="70" dy="30">undefined variable</tspan>
    </text>

    
    <rect x="510" y="840" width="430" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="535" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="535" dy="0">an option refers to a</tspan>
      <tspan x="535" dy="30">variable that</tspan>
      <tspan x="535" dy="30">does not exist</tspan>
    </text>

    
    <rect x="955" y="840" width="600" height="116" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="980" y="906" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the option's variable</text>
  </g>

  
  <g>
    <rect x="45" y="974" width="1510" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="95" cy="1022" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="95" cy="1010" r="3.5" fill="#207448"/>
    <line x1="95" y1="1018" x2="95" y2="1036" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="145" y="1017" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">most rows point at a single character, such as a tab, a colon or a brace, so read the line number</tspan>
      <tspan x="145" dy="32">in the error and look there first</tspan>
    </text>
  </g>

  
  <g>
    <rect x="45" y="1088" width="1510" height="82" rx="10" fill="#207448"/>
    
    <rect x="75" y="1108" width="46" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <polyline points="84,1121 91,1127 84,1133" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="97" y1="1133" x2="110" y2="1133" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <text x="145" y="1140" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">When something goes wrong, print the data</text>
  </g>
</svg>