<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Anatomy of a role</title>
  <desc>Visual infographic explaining the components and execution flow of an Ansible role within a collection and playbook.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Anatomy of a role</text>

  
  <g>
    <rect x="120" y="95" width="1360" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="114" width="76" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 183 128 L 206 141 L 206 167 L 183 180 L 160 167 L 160 141 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 183 154 L 183 180 M 183 154 L 160 141 M 183 154 L 206 141" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    
    <text x="245" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Collection <tspan font-family="ui-monospace, monospace" font-size="30">(ansible_collections/acme/gpu/)</tspan></text>
    <text x="245" y="185" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">galaxy.yml + meta/runtime.yml + roles/ + plugins/</text>
  </g>

  
  <line x1="800" y1="210" x2="800" y2="300" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />
  <text x="830" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Packaged &amp; versioned via</text>
  <text x="830" y="278" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">ansible-galaxy collection build</text>

  
  <g>
    <rect x="120" y="300" width="1360" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="319" width="76" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="165" y="333" width="36" height="48" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="173" y1="345" x2="193" y2="345" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="173" y1="355" x2="193" y2="355" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="173" y1="365" x2="187" y2="365" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="245" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Playbook <tspan font-family="ui-monospace, monospace" font-size="30">(playbooks/gpu_nodes.yml)</tspan></text>
    <text x="245" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Thin wiring: hosts, pre_tasks, roles, post_tasks</text>
  </g>

  
  <line x1="800" y1="415" x2="800" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="120" y="480" width="1360" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="499" width="76" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 163 514 L 183 506 L 203 514 C 203 531 183 546 183 546 C 183 546 163 531 163 514 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 173 525 L 180 532 L 193 519" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="245" y="530" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">meta/argument_specs.yml</text>
    <text x="245" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Validates role inputs at runtime</text>
  </g>

  
  <line x1="800" y1="595" x2="800" y2="660" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="120" y="660" width="1360" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="679" width="76" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <line x1="163" y1="697" x2="203" y2="697" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="174" cy="697" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="163" y1="717" x2="203" y2="717" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="192" cy="717" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="163" y1="737" x2="203" y2="737" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="180" cy="737" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <text x="245" y="710" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">defaults/main.yml <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold">(Lowest Precedence)</tspan></text>
    <text x="245" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Public role API overridden by group_vars</text>
  </g>

  
  <line x1="800" y1="775" x2="800" y2="840" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="120" y="840" width="1360" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="859" width="76" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="165" y="879" width="36" height="36" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="160" y1="889" x2="165" y2="889" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="905" x2="165" y2="905" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="201" y1="889" x2="206" y2="889" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="201" y1="905" x2="206" y2="905" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="176" cy="891" r="2.5" fill="#207448" />
    <circle cx="190" cy="891" r="2.5" fill="#207448" />
    <circle cx="183" cy="903" r="2.5" fill="#207448" />
    <line x1="176" y1="891" x2="183" y2="903" stroke="#207448" stroke-width="2" />
    <line x1="190" y1="891" x2="183" y2="903" stroke="#207448" stroke-width="2" />
    
    <text x="245" y="890" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">vars/&lt;os_family&gt;.yml <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold">(High Precedence)</tspan></text>
    <text x="245" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Internal OS package/path mappings via first_found</text>
  </g>

  
  <line x1="800" y1="955" x2="800" y2="1020" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="120" y="1020" width="1360" height="125" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <rect x="145" y="1044" width="76" height="76" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    
    <circle cx="183" cy="1082" r="13" fill="none" stroke="#db8129" stroke-width="3.5" />
    <circle cx="183" cy="1082" r="4.5" fill="#db8129" />
    <path d="M 183 1061 L 183 1066 M 183 1098 L 183 1103 M 162 1082 L 167 1082 M 199 1082 L 204 1082 M 168 1067 L 172 1071 M 194 1093 L 198 1097 M 168 1097 L 172 1093 M 194 1071 L 198 1067" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    
    <text x="245" y="1070" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">tasks/main.yml <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold">-&gt; prerequisites / install / configure / validate</tspan></text>
    <text x="245" y="1112" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">+ handlers/main.yml <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">(namespaced 'role | action')</tspan></text>
  </g>
</svg>