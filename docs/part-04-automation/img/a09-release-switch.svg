<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Release directories and the atomic current symlink switch</title>
  <desc>Visual infographic explaining release directory structure, shared configuration, atomic current symlink switching, and instant rollback mechanism.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Release directories and the atomic</text>
  <text x="800" y="114" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">current symlink switch</text>

  
  <g id="left-panel">
    <rect x="60" y="145" width="560" height="815" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <path d="M 85 168 L 105 168 L 115 178 L 140 178 L 140 206 L 85 206 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="155" y="196" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">/opt/fleetapp/</text>

    
    <rect x="85" y="220" width="510" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 105 238 L 120 238 L 128 246 L 145 246 L 145 266 L 105 266 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <text x="155" y="258" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">releases/</text>

    
    <rect x="105" y="275" width="470" height="105" rx="8" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="2" />
    <path d="M 120 288 L 132 288 L 138 294 L 152 294 L 152 310 L 120 310 Z" fill="none" stroke="#303a36" stroke-width="2" stroke-linejoin="round" />
    <text x="160" y="306" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">v1.4.1</text>
    <rect x="255" y="286" width="115" height="28" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="312" y="307" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">previous</text>

    
    <rect x="120" y="325" width="210" height="45" rx="6" fill="#ffffff" stroke="#b0c4b8" stroke-width="1.5" />
    <path d="M 132 338 L 142 338 L 147 343 L 158 343 L 158 357 L 132 357 Z" fill="none" stroke="#303a36" stroke-width="1.5" stroke-linejoin="round" />
    <text x="168" y="356" font-family="monospace" font-size="24" fill="#303a36">src/</text>

    <rect x="345" y="325" width="215" height="45" rx="6" fill="#ffffff" stroke="#b0c4b8" stroke-width="1.5" />
    <path d="M 357 338 L 367 338 L 372 343 L 383 343 L 383 357 L 357 357 Z" fill="none" stroke="#303a36" stroke-width="1.5" stroke-linejoin="round" />
    <text x="393" y="356" font-family="monospace" font-size="24" fill="#303a36">venv/</text>

    
    <rect x="105" y="390" width="470" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 120 415 L 135 415 L 142 422 L 160 422 L 160 442 L 120 442 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <text x="170" y="443" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">v1.4.2</text>
    <rect x="290" y="417" width="80" height="32" rx="6" fill="#207448" />
    <text x="330" y="441" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">new</text>

    
    <rect x="85" y="505" width="510" height="150" rx="12" fill="#fffdfa" stroke="#db8129" stroke-width="4" />
    
    <path d="M 112 550 L 126 536 C 132 530 142 530 148 536 L 154 542 C 160 548 160 558 154 564 L 140 578 M 128 562 L 138 552 M 122 568 L 116 574 C 110 580 100 580 94 574 L 88 568 C 82 562 82 552 88 546 L 94 540" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <text x="175" y="558" font-family="monospace" font-size="34" font-weight="bold" fill="#db8129">current</text>
    <text x="110" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">the one pointer</tspan>
      <tspan x="110" dy="30">the service reads</tspan>
    </text>

    
    <rect x="85" y="675" width="510" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 105 695 L 120 695 L 128 703 L 145 703 L 145 723 L 105 723 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <text x="155" y="718" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">shared/</text>
    <text x="105" y="764" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0">persistent data and config</tspan>
      <tspan x="105" dy="32">shared across releases</tspan>
    </text>

    
    <rect x="85" y="845" width="510" height="95" rx="10" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="1.5" />
    <text x="105" y="882" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">app_keep_releases: 5</text>
    <text x="105" y="918" font-family="sans-serif" font-size="24" fill="#303a36">keeps the newest five releases</text>
  </g>

  
  <path d="M 340 505 L 340 480" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 575 430 L 860 430 L 860 550 L 607 550" fill="none" stroke="#207448" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <text x="715" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="715" dy="0">switch current</tspan>
    <tspan x="715" dy="30">in one step</tspan>
  </text>

  
  <g id="right-panel">
    <rect x="1040" y="145" width="500" height="815" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <rect x="1070" y="220" width="440" height="420" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <path d="M 1120 265 A 24 24 0 1 0 1144 285" fill="none" stroke="#207448" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 1110 265 L 1125 250 L 1125 280 Z" fill="#207448" />

    
    <rect x="1090" y="325" width="400" height="275" rx="10" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="2" />
    
    
    <circle cx="1115" cy="350" r="6" fill="#b0c4b8" />
    <circle cx="1135" cy="350" r="6" fill="#b0c4b8" />
    <circle cx="1155" cy="350" r="6" fill="#b0c4b8" />

    <text x="1110" y="415" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ansible-playbook</text>
    <text x="1110" y="470" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">  playbooks/app.yml</text>
    <text x="1110" y="525" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">  -e</text>
    <text x="1110" y="565" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">  app_version=v1.4.1</text>
  </g>

  
  <path d="M 1070 625 L 607 625" fill="none" stroke="#207448" stroke-width="4.5" marker-end="url(#arrow-green)" />
  <text x="835" y="675" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="835" dy="0">point it back to releases/v1.4.1,</tspan>
    <tspan x="835" dy="32">then restart the service</tspan>
  </text>

  
  <rect x="60" y="990" width="1480" height="70" rx="12" fill="#207448" />
  <text x="800" y="1034" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Rolling back is the same flip in reverse, and the old folder is still there to go back to.</text>
</svg>