<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Why become breaks SSH agent forwarding for git</title>
  <desc>Visual infographic explaining why become: true breaks SSH agent forwarding for git tasks on a target host while become: false works, due to sudo dropping SSH_AUTH_SOCK in a clean environment.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 17 9 L 1 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why become breaks SSH agent forwarding for git</text>

  
  <g id="laptop-box">
    
    <rect x="40" y="115" width="235" height="755" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(129.5, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="28" rx="3"/>
      <path d="M 2 40 L 54 40"/>
      <line x1="22" y1="44" x2="34" y2="44" stroke-width="3"/>
    </g>

    
    <text x="157" y="240" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="157" dy="0">Your login</tspan>
      <tspan x="157" dy="38">session</tspan>
    </text>

    
    <g transform="translate(55, 330)">
      <rect x="0" y="0" width="205" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(74.5, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="12"/>
        <line x1="28" y1="28" x2="48" y2="48"/>
        <line x1="42" y1="42" x2="48" y2="36"/>
        <line x1="36" y1="36" x2="42" y2="30"/>
      </g>
      
      <text x="102.5" y="148" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ssh-add -L</text>
    </g>

    
    <g transform="translate(55, 560)">
      <rect x="0" y="0" width="205" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(74.5, 24)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="10" width="44" height="36" rx="8"/>
        <line x1="18" y1="22" x2="18" y2="34"/>
        <line x1="38" y1="22" x2="38" y2="34"/>
        <circle cx="28" cy="28" r="4" fill="#207448"/>
      </g>
      
      <text x="102.5" y="148" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SSH_AUTH_SOCK</text>
    </g>
  </g>

  
  <g id="forward-agent-arrow">
    
    <text x="417" y="455" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ForwardAgent=yes</text>

    
    <line x1="275" y1="485" x2="550" y2="485" stroke="#207448" stroke-width="4"/>

    
    <path d="M 550 485 V 265 H 585" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <path d="M 550 485 V 665 H 585" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>

  
  <g id="top-row">
    
    <rect x="560" y="115" width="1000" height="300" rx="16" fill="#ffffff" stroke="#ccd9d0" stroke-width="2"/>

    
    <g id="top-target-box" transform="translate(585, 145)">
      <rect x="0" y="0" width="390" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(35, 20)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="48" height="44" rx="4"/>
        <line x1="4" y1="20" x2="52" y2="20" stroke-width="3"/>
        <line x1="4" y1="36" x2="52" y2="36" stroke-width="3"/>
        <circle cx="12" cy="13" r="2.5" fill="#207448"/>
        <circle cx="12" cy="28" r="2.5" fill="#207448"/>
        <circle cx="12" cy="44" r="2.5" fill="#207448"/>
      </g>

      
      <text x="110" y="58" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Target</text>

      
      <g transform="translate(35, 95)">
        <rect x="0" y="0" width="320" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="160" y="68" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">become: false</text>
      </g>
    </g>

    
    <line x1="975" y1="265" x2="1150" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <g id="top-result-box" transform="translate(1150, 145)">
      <rect x="0" y="0" width="390" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(167, 35)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24"/>
        <polyline points="16,28 24,36 40,20"/>
      </g>

      
      <text x="195" y="168" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">the clone works</text>
    </g>
  </g>

  
  <g id="bottom-row">
    
    <rect x="560" y="465" width="1000" height="425" rx="16" fill="#ffffff" stroke="#ccd9d0" stroke-width="2"/>

    
    <g id="bottom-target-box" transform="translate(585, 495)">
      <rect x="0" y="0" width="140" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(42, 35)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="48" height="44" rx="4"/>
        <line x1="4" y1="20" x2="52" y2="20" stroke-width="3"/>
        <line x1="4" y1="36" x2="52" y2="36" stroke-width="3"/>
        <circle cx="12" cy="13" r="2.5" fill="#207448"/>
        <circle cx="12" cy="28" r="2.5" fill="#207448"/>
        <circle cx="12" cy="44" r="2.5" fill="#207448"/>
      </g>

      
      <g transform="translate(12, 135)">
        <rect x="0" y="0" width="116" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="58" y="65" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
          <tspan x="58" dy="0">become:</tspan>
          <tspan x="58" dy="38">true</tspan>
        </text>
      </g>
    </g>

    
    <line x1="725" y1="665" x2="765" y2="665" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <g id="sudo-box" transform="translate(765, 495)">
      <rect x="0" y="0" width="345" height="325" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3.5"/>

      
      <g transform="translate(144.5, 20)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 50 14 V 28 C 50 42 28 50 28 50 C 28 50 6 42 6 28 V 14 Z"/>
        <line x1="18" y1="28" x2="38" y2="28"/>
        <line x1="28" y1="18" x2="28" y2="38"/>
      </g>

      
      <text x="172.5" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="172.5" dy="0">sudo starts a</tspan>
        <tspan x="172.5" dy="38">clean environment</tspan>
      </text>

      
      <g transform="translate(15, 175)">
        <rect x="0" y="0" width="315" height="125" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
        <text x="157.5" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
          <tspan x="157.5" dy="0" font-family="monospace" font-weight="bold" fill="#db8129">SSH_AUTH_SOCK</tspan>
          <tspan x="157.5" dy="36" font-family="sans-serif">is dropped unless</tspan>
          <tspan x="33" dy="36" text-anchor="start" font-family="monospace" font-weight="bold" fill="#207448">env_keep</tspan>
          <tspan font-family="sans-serif"> keeps it</tspan>
        </text>
      </g>
    </g>

    
    <line x1="1110" y1="665" x2="1150" y2="665" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <g id="no-agent-box" transform="translate(1150, 495)">
      <rect x="0" y="0" width="155" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(49.5, 35)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24"/>
        <path d="M 20 20 C 20 12 36 12 36 22 C 36 28 28 28 28 35"/>
        <circle cx="28" cy="43" r="2.5" fill="#207448"/>
      </g>

      
      <g transform="translate(12, 135)">
        <rect x="0" y="0" width="131" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="65.5" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
          <tspan x="65.5" dy="0">git has</tspan>
          <tspan x="65.5" dy="34">no agent</tspan>
          <tspan x="65.5" dy="34">to ask</tspan>
        </text>
      </g>
    </g>

    
    <line x1="1305" y1="665" x2="1345" y2="665" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <g id="permission-denied-box" transform="translate(1345, 495)">
      <rect x="0" y="0" width="195" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(69.5, 35)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="22" width="40" height="28" rx="5"/>
        <path d="M 16 22 V 14 C 16 7 40 7 40 14 V 22"/>
        <circle cx="28" cy="33" r="3" fill="#207448"/>
        <line x1="28" y1="36" x2="28" y2="43" stroke-width="3"/>
      </g>

      
      <g transform="translate(12, 135)">
        <rect x="0" y="0" width="171" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="85.5" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
          <tspan x="85.5" dy="0">Permission</tspan>
          <tspan x="85.5" dy="34">denied</tspan>
          <tspan x="85.5" dy="34">(publickey)</tspan>
        </text>
      </g>
    </g>

    
    <text x="1060" y="862" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the key was fine, the environment was not</text>
  </g>

  
  <g id="takeaway-bar" transform="translate(40, 920)">
    <rect width="1520" height="115" rx="16" fill="#207448"/>
    
    <g transform="translate(45, 29.5)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <path d="M 18 28 L 25 35 L 38 21"/>
    </g>
    <text x="815" y="50" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#ffffff">
      <tspan x="815" dy="0">Check 3 is about privilege, and it is the one that catches most people,</tspan>
      <tspan x="815" dy="38">so make sure the git task does not set <tspan font-family="monospace" font-weight="bold">become: true</tspan>.</tspan>
    </text>
  </g>
</svg>