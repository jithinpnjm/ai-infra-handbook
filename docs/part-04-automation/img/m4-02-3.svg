<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Rolling out to physical and large fleets</title>
  <desc>Flowchart visualizing the progressive rollout process to physical and large fleets, from canary through soak batches to fleet completion, with stop-the-line remediation gates.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Rolling out to physical and large fleets</text>

  

  
  <g id="node-A">
    <rect x="50" y="140" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="94" cy="184" r="22" fill="#207448" />
    <text x="94" y="192" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(136, 156)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="10" x2="14" y2="46" />
      <circle cx="14" cy="12" r="5" fill="#e8f1ea" />
      <circle cx="14" cy="44" r="5" fill="#e8f1ea" />
      <path d="M 14 36 C 24 36, 38 28, 38 18" />
      <circle cx="38" cy="18" r="5" fill="#e8f1ea" />
    </g>
    
    <text x="74" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Merge approved change</text>
  </g>

  
  <line x1="510" y1="230" x2="570" y2="230" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-B">
    <rect x="570" y="140" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="614" cy="184" r="22" fill="#207448" />
    <text x="614" y="192" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(656, 156)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="20" rx="4" fill="#e8f1ea" />
      <line x1="14" y1="18" x2="26" y2="18" />
      <circle cx="42" cy="18" r="3" fill="#207448" />
      <path d="M 28 28 L 28 44" />
      <path d="M 16 44 L 40 44" />
    </g>
    
    <text x="594" y="254" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Canary: 1-2 nodes</text>
    <text x="594" y="294" font-family="sans-serif" font-size="24" fill="#303a36">(drain from scheduler first)</text>
  </g>

  
  <line x1="800" y1="320" x2="800" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  

  
  <g id="node-C">
    <rect x="570" y="380" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="614" cy="424" r="22" fill="#207448" />
    <text x="614" y="432" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(656, 396)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="34" rx="4" fill="#e8f1ea" />
      <path d="M 12 26 L 20 26 L 25 16 L 31 34 L 36 26 L 44 26" />
    </g>
    
    <text x="594" y="494" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Validation passes?</text>
    <text x="594" y="534" font-family="sans-serif" font-size="24" fill="#303a36">health, DCGM, NCCL, SLO</text>
  </g>

  
  <line x1="570" y1="470" x2="510" y2="470" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="540" y="454" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">yes</text>

  
  <line x1="1030" y1="470" x2="1090" y2="470" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="1060" y="454" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">no</text>

  
  <g id="node-D">
    <rect x="50" y="380" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="94" cy="424" r="22" fill="#207448" />
    <text x="94" y="432" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(136, 396)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 44 14 L 44 28 C 44 38, 36 46, 28 50 C 20 46, 12 38, 12 28 L 12 14 Z" fill="#e8f1ea" />
      <circle cx="28" cy="26" r="4" fill="#207448" />
      <line x1="28" y1="30" x2="28" y2="38" />
    </g>
    
    <text x="74" y="494" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Manual approval gate</text>
    <text x="74" y="534" font-family="sans-serif" font-size="24" fill="#303a36">(optional)</text>
  </g>

  
  <line x1="280" y1="560" x2="280" y2="620" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  

  
  <g id="node-E">
    <rect x="50" y="620" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="94" cy="664" r="22" fill="#207448" />
    <text x="94" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(136, 636)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="14" rx="3" fill="#e8f1ea" />
      <rect x="8" y="28" width="40" height="14" rx="3" fill="#e8f1ea" />
      <circle cx="16" cy="17" r="2" fill="#207448" />
      <circle cx="16" cy="35" r="2" fill="#207448" />
      <line x1="26" y1="17" x2="40" y2="17" />
      <line x1="26" y1="35" x2="40" y2="35" />
    </g>
    
    <text x="74" y="734" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Batch 1:</text>
    <text x="74" y="774" font-family="sans-serif" font-size="24" fill="#303a36">e.g. 5% of nodes</text>
  </g>

  
  <line x1="510" y1="710" x2="570" y2="710" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-F">
    <rect x="570" y="620" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="614" cy="664" r="22" fill="#207448" />
    <text x="614" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g transform="translate(656, 636)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="18" fill="#e8f1ea" />
      <polyline points="28,18 28,28 36,28" />
      <line x1="24" y1="6" x2="32" y2="6" />
    </g>
    
    <text x="594" y="750" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Healthy after soak?</text>
  </g>

  
  <line x1="1030" y1="710" x2="1090" y2="710" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="1060" y="694" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">no</text>

  
  <line x1="800" y1="800" x2="800" y2="860" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="828" y="836" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="start">yes</text>

  

  
  <g id="node-G">
    <rect x="570" y="860" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="614" cy="904" r="22" fill="#207448" />
    <text x="614" y="912" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    
    <g transform="translate(656, 876)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="22" height="16" rx="3" fill="#e8f1ea" />
      <rect x="18" y="16" width="22" height="16" rx="3" fill="#e8f1ea" />
      <rect x="30" y="24" width="22" height="16" rx="3" fill="#e8f1ea" />
    </g>
    
    <text x="594" y="966" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Batches of N</text>
    <text x="594" y="1004" font-family="sans-serif" font-size="24" fill="#303a36">with serial and <tspan font-family="monospace">max_fail_percentage</tspan></text>
  </g>

  
  <line x1="570" y1="950" x2="510" y2="950" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-H">
    <rect x="50" y="860" width="460" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="94" cy="904" r="22" fill="#207448" />
    <text x="94" y="912" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
    
    <g transform="translate(136, 876)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="48" x2="12" y2="8" />
      <path d="M 12 12 L 42 22 L 12 32 Z" fill="#e8f1ea" />
      <line x1="8" y1="48" x2="24" y2="48" />
    </g>
    
    <text x="74" y="966" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fleet complete;</text>
    <text x="74" y="1006" font-family="sans-serif" font-size="24" fill="#303a36">update inventory/version pin</text>
  </g>

  

  
  <g id="node-X">
    <rect x="1090" y="380" width="460" height="420" rx="20" fill="#fdf5ec" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(1292, 420)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="18,4 38,4 52,18 52,38 38,52 18,52 4,38 4,18" fill="#fdf5ec" />
      <line x1="28" y1="18" x2="28" y2="30" />
      <circle cx="28" cy="38" r="2.5" fill="#db8129" />
    </g>
    
    <text x="1320" y="530" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">Stop the line:</text>
    <text x="1320" y="590" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">halt, restore canary,</text>
    <text x="1320" y="630" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">open incident</text>
  </g>

</svg>