<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Venv deployment versus container deployment</title>
  <desc>Visual comparison infographic illustrating Ansible-built venv deployment on the left versus container deployment on the right, with Kubernetes and Ansible orchestration takeaway footer.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Venv deployment versus container deployment</text>

  
  
  <rect x="40" y="95" width="740" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="40" y="95" width="740" height="70" rx="16" fill="#207448"/>
  <rect x="40" y="145" width="740" height="20" fill="#207448"/>
  <text x="410" y="143" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Ansible-built venv</text>

  
  <rect x="70" y="195" width="680" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(96, 242)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="18" cy="14" r="8"/>
    <circle cx="18" cy="42" r="8"/>
    <line x1="18" y1="22" x2="18" y2="34"/>
    <path d="M 18 22 C 18 30 38 28 38 34"/>
    <circle cx="38" cy="42" r="8"/>
    <line x1="38" y1="16" x2="50" y2="16"/>
    <line x1="50" y1="11" x2="50" y2="21"/>
  </g>
  <text x="180" y="278" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace" font-weight="bold">git</tspan> pinned to tag or commit <tspan font-family="monospace" font-weight="bold">SHA</tspan></text>

  
  <rect x="70" y="380" width="680" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(96, 434)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 6 16 L 22 16 L 28 22 L 50 22 C 52 22 54 24 54 26 L 54 48 C 54 50 52 52 50 52 L 6 52 C 4 52 2 50 2 48 L 2 20 C 2 18 4 16 6 16 Z"/>
    <path d="M 23 34 V 28 C 23 25 25 23 28 23 C 31 23 33 25 33 28 V 34"/>
    <rect x="20" y="34" width="16" height="12" rx="2" fill="#e8f1ea"/>
  </g>
  <text x="180" y="450" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0"><tspan font-family="monospace" font-weight="bold">venv</tspan> from <tspan font-family="monospace" font-weight="bold">requirements.lock</tspan></tspan>
    <tspan x="180" dy="36">inside the release directory</tspan>
  </text>

  
  <rect x="70" y="580" width="680" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(96, 627)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="10"/>
    <circle cx="28" cy="28" r="18"/>
    <line x1="28" y1="6" x2="28" y2="10"/>
    <line x1="28" y1="46" x2="28" y2="50"/>
    <line x1="6" y1="28" x2="10" y2="28"/>
    <line x1="46" y1="28" x2="50" y2="28"/>
    <line x1="12" y1="12" x2="16" y2="16"/>
    <line x1="40" y1="40" x2="44" y2="44"/>
    <line x1="12" y1="44" x2="16" y2="40"/>
    <line x1="40" y1="16" x2="44" y2="12"/>
  </g>
  <text x="180" y="663" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace" font-weight="bold">systemd</tspan> unit</text>

  
  <rect x="70" y="765" width="680" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(96, 819)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 28 8 A 20 20 0 1 0 48 28"/>
    <polyline points="38,4 28,8 34,18"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
    <line x1="28" y1="28" x2="38" y2="24"/>
  </g>
  <text x="180" y="835" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0">rollback by <tspan font-family="monospace" font-weight="bold">app_version</tspan></tspan>
    <tspan x="180" dy="36">or repointing <tspan font-family="monospace" font-weight="bold">current</tspan></tspan>
  </text>

  
  
  <rect x="820" y="95" width="740" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="820" y="95" width="740" height="70" rx="16" fill="#207448"/>
  <rect x="820" y="145" width="740" height="20" fill="#207448"/>
  <text x="1190" y="143" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">container</text>

  
  <rect x="850" y="195" width="680" height="110" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(876, 222)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="28,6 50,17 28,28 6,17"/>
    <polygon points="6,17 6,39 28,50 28,28"/>
    <polygon points="28,28 28,50 50,39 50,17"/>
    <line x1="39" y1="23" x2="39" y2="44"/>
  </g>
  <text x="960" y="246" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="960" dy="0"><tspan font-family="monospace" font-weight="bold">docker_container</tspan> pinned</tspan>
    <tspan x="960" dy="34">by digest <tspan font-family="monospace" font-weight="bold">sha256</tspan></tspan>
  </text>

  
  <rect x="850" y="322" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 337)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 12 28 A 18 18 0 0 1 44 20"/>
    <polyline points="36,12 46,18 42,28"/>
    <path d="M 44 28 A 18 18 0 0 1 12 36"/>
    <polyline points="20,44 10,38 14,28"/>
  </g>
  <text x="960" y="374" font-family="monospace" font-size="24" fill="#303a36">restart_policy unless-stopped</text>

  
  <rect x="850" y="425" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 440)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="8" width="44" height="40" rx="6"/>
    <path d="M 10 28 L 18 28 L 23 18 L 29 38 L 35 24 L 40 28 L 46 28"/>
  </g>
  <text x="960" y="477" font-family="monospace" font-size="24" fill="#303a36">healthcheck</text>

  
  <rect x="850" y="528" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 543)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 18 24 V 16 C 18 10 22 6 28 6 C 34 6 38 10 38 16 V 24"/>
    <rect x="12" y="24" width="32" height="24" rx="4"/>
    <circle cx="28" cy="34" r="3" fill="#207448"/>
    <line x1="28" y1="37" x2="28" y2="42"/>
  </g>
  <text x="960" y="580" font-family="monospace" font-size="24" fill="#303a36">read_only true</text>

  
  <rect x="850" y="631" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 646)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 10 10 L 28 4 L 46 10 C 46 26 38 42 28 50 C 18 42 10 26 10 10 Z"/>
    <line x1="20" y1="26" x2="36" y2="26"/>
  </g>
  <text x="960" y="683" font-family="monospace" font-size="24" fill="#303a36">cap_drop ALL</text>

  
  <rect x="850" y="734" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 749)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 28 42 V 16 M 18 26 L 28 16 L 38 26"/>
    <circle cx="28" cy="28" r="22"/>
    <line x1="12" y1="12" x2="44" y2="44"/>
  </g>
  <text x="960" y="786" font-family="monospace" font-size="24" fill="#303a36">no-new-privileges</text>

  
  <rect x="850" y="837" width="680" height="86" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(876, 852)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="14" width="44" height="28" rx="3"/>
    <line x1="14" y1="36" x2="14" y2="42"/>
    <line x1="20" y1="36" x2="20" y2="42"/>
    <line x1="26" y1="36" x2="26" y2="42"/>
    <line x1="32" y1="36" x2="32" y2="42"/>
    <line x1="38" y1="36" x2="38" y2="42"/>
    <rect x="12" y="18" width="6" height="12" fill="#207448"/>
    <rect x="25" y="18" width="6" height="12" fill="#207448"/>
    <rect x="38" y="18" width="6" height="12" fill="#207448"/>
  </g>
  <text x="960" y="889" font-family="monospace" font-size="24" fill="#303a36">memory 1g</text>

  
  <rect x="40" y="1030" width="1520" height="66" rx="14" fill="#207448"/>
  <text x="800" y="1071" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">at a fleet of containers Kubernetes takes over, Ansible keeps the node layer</text>
</svg>