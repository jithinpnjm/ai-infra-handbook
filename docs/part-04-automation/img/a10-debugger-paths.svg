<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Two ways to change a failed task in the debugger</title>
  <desc>Visual guide comparing direct argument modification versus variable modification with update_task during playbook debugging.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b382b" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#207448">Two ways to change a failed task in the debugger</text>

  
  <g filter="url(#shadow)">
    <rect x="360" y="105" width="880" height="115" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="420" cy="162" r="26" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 420 148 L 420 166 M 420 174 L 420 178" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="470" y="152" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">A task fails, and the (debug) prompt opens</text>
    <text x="470" y="188" font-family="sans-serif" font-size="24px" fill="#4f6159">the task stays in memory</text>
  </g>

  
  <path d="M 800 220 L 800 262" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g filter="url(#shadow)">
    <rect x="250" y="270" width="1100" height="88" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="290" y="325" font-family="monospace" font-size="30px" font-weight="bold" fill="#207448">&gt;</text>
    <rect x="340" y="286" width="230" height="56" rx="8" fill="#ffffff" stroke="#9bbda7" stroke-width="1.5" />
    <text x="455" y="322" text-anchor="middle" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">p task.args</text>

    <rect x="630" y="286" width="240" height="56" rx="8" fill="#ffffff" stroke="#9bbda7" stroke-width="1.5" />
    <text x="750" y="322" text-anchor="middle" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">p task_vars</text>

    <rect x="930" y="286" width="370" height="56" rx="8" fill="#ffffff" stroke="#9bbda7" stroke-width="1.5" />
    <text x="1115" y="322" text-anchor="middle" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">p result._result</text>
  </g>

  
  <path d="M 520 358 L 520 422" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <path d="M 1080 358 L 1080 422" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g>
    
    <rect x="120" y="430" width="640" height="490" rx="16" fill="#f0f6f2" stroke="#bdd6c5" stroke-width="2" />
    
    
    <text x="440" y="475" text-anchor="middle" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Change the argument</text>

    
    <rect x="160" y="505" width="560" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="440" y="558" text-anchor="middle" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">task.args['name'] = 'fixed'</text>

    
    <path d="M 440 590 L 440 648" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <rect x="160" y="656" width="560" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="215" cy="723" r="26" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 226 713 A 14 14 0 1 0 227 731" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 226 710 L 230 717 L 222 718 Z" fill="#207448" />
    <text x="265" y="714" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">r (redo)</text>
    <text x="265" y="750" font-family="sans-serif" font-size="24px" fill="#4f6159">re-runs the task with the change</text>
  </g>

  
  <g>
    
    <rect x="840" y="430" width="640" height="490" rx="16" fill="#f0f6f2" stroke="#bdd6c5" stroke-width="2" />

    
    <text x="1160" y="475" text-anchor="middle" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Change the variable</text>

    
    <rect x="880" y="505" width="560" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="1160" y="552" text-anchor="middle" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">task_vars['x'] = 1</text>

    
    <path d="M 1160 580 L 1160 622" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

    
    <rect x="870" y="630" width="580" height="135" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="925" cy="697" r="26" fill="#fbe9d5" stroke="#db8129" stroke-width="2.5" />
    <path d="M 925 683 L 925 711 M 911 697 L 939 697 M 915 687 L 935 707 M 915 707 L 935 687" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="925" cy="697" r="7" fill="#fff8f0" stroke="#db8129" stroke-width="2.5" />
    <text x="972" y="688" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#db8129">u (update_task)</text>
    <text x="972" y="722" font-family="sans-serif" font-size="24px" fill="#594433">re-templates task.args from the</text>
    <text x="972" y="750" font-family="sans-serif" font-size="24px" fill="#594433">original expression</text>

    
    <path d="M 1160 765 L 1160 798" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <rect x="880" y="806" width="560" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="935" cy="848" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 945 840 A 12 12 0 1 0 946 854" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 945 837 L 948 843 L 942 844 Z" fill="#207448" />
    <text x="980" y="857" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">r (redo)</text>
  </g>

  
  <path d="M 440 791 L 440 965 L 710 965" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 1160 891 L 1160 965 L 890 965" fill="none" stroke="#207448" stroke-width="3.5" />
  
  <path d="M 800 965 L 800 1000" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g filter="url(#shadow)">
    <rect x="480" y="1008" width="640" height="92" rx="16" fill="#207448" stroke="#175534" stroke-width="3" />
    
    <circle cx="540" cy="1054" r="26" fill="#ffffff" />
    <path d="M 533 1042 L 553 1054 L 533 1066 Z" fill="#207448" />
    <text x="590" y="1064" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#ffffff">Task runs again</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="360" y="1135" width="880" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
    
    <rect x="390" y="1150" width="22" height="22" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="430" y="1170" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">c (continue) keeps the task failed</text>

    
    <rect x="390" y="1200" width="22" height="22" rx="4" fill="#fbe9e7" stroke="#b73a2a" stroke-width="2" />
    <text x="430" y="1220" font-family="monospace" font-size="24px" font-weight="bold" fill="#b73a2a">q (quit) aborts</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="80" y="1285" width="1440" height="85" rx="14" fill="#207448" />
    <text x="800" y="1338" text-anchor="middle" font-family="sans-serif" font-size="27px" font-weight="bold" fill="#ffffff">Use the debugger to experiment on one failing host, then write the fix into the playbook.</text>
  </g>
</svg>