<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Two ways to change a failed task in the debugger</title>
  <desc>Infographic illustrating how to change task arguments versus task variables during an Ansible debugger session, highlighting the update_task step.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two ways to change a failed task in the debugger</text>

  
  <g id="start-box">
    <rect x="80" y="115" width="920" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="110" y="152" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="110" y1="170" x2="166" y2="170" stroke="#207448" stroke-width="2"/>
    <circle cx="122" cy="161" r="3" fill="#207448"/>
    <circle cx="132" cy="161" r="3" fill="#207448"/>
    <path d="M 126 195 L 138 185 L 126 175" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="144" y1="195" x2="154" y2="195" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="190" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A task fails, and the (debug) prompt opens</text>
    <text x="190" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">the task stays in memory</text>
  </g>

  
  <g id="side-notes">
    <rect x="1030" y="115" width="490" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
    
    <circle cx="1075" cy="170" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1089" y1="184" x2="1104" y2="199" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="1135" y="152" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#303a36">p task.args</text>
    <text x="1135" y="187" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#303a36">p task_vars</text>
    <text x="1135" y="222" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#303a36">p result._result</text>
  </g>

  
  <path d="M 540 245 L 540 275 L 425 275 L 425 308" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 540 275 L 1175 275 L 1175 308" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="left-branch">
    <rect x="80" y="310" width="690" height="500" rx="16" fill="#e8f1ea" fill-opacity="0.45" stroke="#207448" stroke-width="2"/>
    
    <path d="M 125 336 L 125 366 M 140 336 L 140 366 M 155 336 L 155 366" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="125" cy="346" r="4" fill="#207448"/>
    <circle cx="140" cy="358" r="4" fill="#207448"/>
    <circle cx="155" cy="342" r="4" fill="#207448"/>
    
    <text x="180" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Change the argument</text>

    
    <rect x="120" y="390" width="610" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="145" y="437" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="26" font-weight="bold" fill="#207448">&gt;_</text>
    <text x="195" y="437" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="25" fill="#303a36">task.args['name'] = 'fixed'</text>

    
    <line x1="425" y1="465" x2="425" y2="673" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="120" y="675" width="610" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 173 720 A 18 18 0 1 0 183 738" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="173,710 173,724 187,724" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">r (redo)</text>
    <text x="215" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">re-runs the task with the change</text>
  </g>

  
  <g id="right-branch">
    <rect x="830" y="310" width="690" height="500" rx="16" fill="#e8f1ea" fill-opacity="0.45" stroke="#207448" stroke-width="2"/>
    
    <text x="865" y="360" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="30" font-weight="bold" fill="#207448">{ x }</text>
    
    <text x="940" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Change the variable</text>

    
    <rect x="870" y="390" width="610" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="895" y="437" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="26" font-weight="bold" fill="#207448">&gt;_</text>
    <text x="945" y="437" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="25" fill="#303a36">task_vars['x'] = 1</text>

    
    <line x1="1175" y1="465" x2="1175" y2="498" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="870" y="500" width="610" height="135" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3.5"/>
    
    <circle cx="925" cy="568" r="16" fill="none" stroke="#db8129" stroke-width="3"/>
    <path d="M 925 545 L 925 551 M 925 585 L 925 591 M 902 568 L 908 568 M 942 568 L 948 568" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <text x="965" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">u (update_task)</text>
    <text x="965" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">re-templates task.args</text>
    <text x="965" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">from the original expression</text>

    
    <line x1="1175" y1="635" x2="1175" y2="673" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="870" y="675" width="610" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 923 720 A 18 18 0 1 0 933 738" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="923,710 923,724 937,724" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="965" y="738" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">r (redo)</text>
  </g>

  
  <path d="M 425 785 L 425 825 L 680 825 L 680 853" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 1175 785 L 1175 825 L 920 825 L 920 853" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="bottom-box">
    <rect x="480" y="855" width="640" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="530" cy="895" r="22" fill="#207448"/>
    <path d="M 520 895 L 527 902 L 542 887" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="575" y="905" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Task runs again</text>
  </g>

  
  <g id="exit-commands">
    <rect x="180" y="965" width="1240" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <line x1="800" y1="965" x2="800" y2="1045" stroke="#e8f1ea" stroke-width="2"/>
    
    <text x="230" y="1015" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="26" font-weight="bold" fill="#303a36">c (continue)</text>
    <text x="440" y="1015" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">keeps the task failed</text>
    
    <text x="860" y="1015" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="26" font-weight="bold" fill="#303a36">q (quit)</text>
    <text x="1010" y="1015" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">aborts</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="1070" width="1440" height="70" rx="10" fill="#207448"/>
    
    <circle cx="125" cy="1102" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 120 1114 L 130 1114 M 122 1118 L 128 1118" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="165" y="1114" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Use the debugger to experiment on one failing host, then write the fix into the playbook.</text>
  </g>
</svg>