<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1570" width="1600" height="1570">
  <title>Module families for a GPU node: where to look for each job</title>
  <desc>Visual reference table showing Ansible module families, modules, and practical operational notes for GPU nodes.</desc>

  <rect width="1600" height="1570" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">
    Module families for a GPU node: where to look for each job
  </text>

  
  <g id="finder-strip">
    <rect x="50" y="85" width="1500" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="121" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
      ansible-doc -l | grep -i topic, or the examples at the end of ansible-doc ansible.builtin.copy
    </text>
  </g>

  
  <g id="table-header">
    <rect x="50" y="165" width="1500" height="55" rx="6" fill="#207448" />
    <text x="180" y="202" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Family</text>
    <text x="720" y="202" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Modules</text>
    <text x="1340" y="202" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Note</text>
  </g>

  
  <g id="row-packages">
    <rect x="50" y="235" width="1500" height="315" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <rect x="50" y="235" width="260" height="315" rx="8" fill="#fff7f0" />
    
    <line x1="310" y1="235" x2="310" y2="550" stroke="#db8129" stroke-width="2" />
    <line x1="1130" y1="235" x2="1130" y2="550" stroke="#e0e8e2" stroke-width="2" />

    
    
    <path d="M 180 270 L 215 288 L 180 306 L 145 288 Z M 145 292 L 145 322 L 180 340 L 180 310 Z M 215 292 L 215 322 L 180 340 L 180 310 Z"
          fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <rect x="100" y="360" width="160" height="42" rx="21" fill="#db8129" />
    <text x="180" y="390" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Packages</text>

    
    <text x="335" y="272" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="335" dy="0">ansible.builtin.package generic; apt, dnf or</tspan>
      <tspan x="335" dy="34">yum, zypper backend-specific (update_cache,</tspan>
      <tspan x="335" dy="34">cache_valid_time, autoremove, install_recommends,</tspan>
      <tspan x="335" dy="34">lock_timeout, allow_downgrade); apt_repository,</tspan>
      <tspan x="335" dy="34">deb822_repository, yum_repository, apt_key</tspan>
      <tspan x="335" dy="34">(deprecated, use keyrings with get_url); pip</tspan>
      <tspan x="335" dy="34">with virtualenv and pinned versions;</tspan>
      <tspan x="335" dy="34">dpkg_selections, package_facts</tspan>
    </text>

    
    <text x="1155" y="306" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1155" dy="0">package names often differ</tspan>
      <tspan x="1155" dy="34">between distros: use when or</tspan>
      <tspan x="1155" dy="34">vars per OS family; add NVIDIA</tspan>
      <tspan x="1155" dy="34">CUDA, Docker, Kubernetes</tspan>
      <tspan x="1155" dy="34">repositories with signed-by</tspan>
      <tspan x="1155" dy="34">keyrings</tspan>
    </text>
  </g>

  
  <g id="row-files">
    <rect x="50" y="565" width="1500" height="315" rx="8" fill="#ffffff" stroke="#e0e8e2" stroke-width="2" />
    <rect x="50" y="565" width="260" height="315" rx="8" fill="#e8f1ea" />
    
    <line x1="310" y1="565" x2="310" y2="880" stroke="#e0e8e2" stroke-width="2" />
    <line x1="1130" y1="565" x2="1130" y2="880" stroke="#e0e8e2" stroke-width="2" />

    
    
    <path d="M 155 605 L 175 605 L 185 617 L 205 617 C 210 617 213 620 213 625 L 213 655 C 213 660 210 663 205 663 L 155 663 C 150 663 147 660 147 655 L 147 613 C 147 608 150 605 155 605 Z"
          fill="none" stroke="#207448" stroke-width="3" />
    <text x="180" y="700" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Files</text>

    
    <text x="335" y="602" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="335" dy="0">file (file, directory, link, absent, touch;</tspan>
      <tspan x="335" dy="34">owner, group, mode, recurse), copy (backup,</tspan>
      <tspan x="335" dy="34">validate, force, remote_src), template,</tspan>
      <tspan x="335" dy="34">lineinfile (regexp, backrefs: a regex can</tspan>
      <tspan x="335" dy="34">match several lines or none), blockinfile,</tspan>
      <tspan x="335" dy="34">replace, stat, find, fetch, synchronize</tspan>
      <tspan x="335" dy="34">(rsync), unarchive, get_url (checksum),</tspan>
      <tspan x="335" dy="34">uri, assemble (conf.d fragments), ini_file,</tspan>
      <tspan x="335" dy="34">slurp, tempfile</tspan>
    </text>

    
    <text x="1340" y="725" font-family="sans-serif" font-size="28" fill="#889690" text-anchor="middle">-</text>
  </g>

  
  <g id="row-users">
    <rect x="50" y="895" width="1500" height="175" rx="8" fill="#ffffff" stroke="#e0e8e2" stroke-width="2" />
    <rect x="50" y="895" width="260" height="175" rx="8" fill="#e8f1ea" />
    
    <line x1="310" y1="895" x2="310" y2="1070" stroke="#e0e8e2" stroke-width="2" />
    <line x1="1130" y1="895" x2="1130" y2="1070" stroke="#e0e8e2" stroke-width="2" />

    
    
    <circle cx="180" cy="940" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 156 978 C 156 962 166 958 180 958 C 194 958 204 962 204 978"
          fill="none" stroke="#207448" stroke-width="3" />
    <text x="180" y="1018" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Users</text>

    
    <text x="335" y="938" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="335" dy="0">user, group, authorized_key (ansible.posix),</tspan>
      <tspan x="335" dy="34">known_hosts; sudo via drop-in file in</tspan>
      <tspan x="335" dy="34">/etc/sudoers.d/ better than lineinfile with</tspan>
      <tspan x="335" dy="34">validate visudo -cf</tspan>
    </text>

    
    <text x="1155" y="968" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1155" dy="0">loop over a data structure</tspan>
      <tspan x="1155" dy="34">instead of one task per user</tspan>
    </text>
  </g>

  
  <g id="row-services">
    <rect x="50" y="1085" width="1500" height="175" rx="8" fill="#ffffff" stroke="#e0e8e2" stroke-width="2" />
    <rect x="50" y="1085" width="260" height="175" rx="8" fill="#e8f1ea" />
    
    <line x1="310" y1="1085" x2="310" y2="1260" stroke="#e0e8e2" stroke-width="2" />
    <line x1="1130" y1="1085" x2="1130" y2="1260" stroke="#e0e8e2" stroke-width="2" />

    
    
    <g transform="translate(180, 1130)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M -3 -19 L 3 -19 L 4 -13 L 9 -11 L 14 -15 L 18 -11 L 14 -6 L 16 -1 L 22 0 L 22 6 L 16 7 L 14 12 L 18 17 L 14 21 L 9 17 L 4 19 L 3 25 L -3 25 L -4 19 L -9 17 L -14 21 L -18 17 L -14 12 L -16 7 L -22 6 L -22 0 L -16 -1 L -14 -6 L -18 -11 L -14 -15 L -9 -11 L -4 -13 Z"
            fill="none" stroke="#207448" stroke-width="2" />
    </g>
    <text x="180" y="1195" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="180" dy="0">Services and</tspan>
      <tspan x="180" dy="28">boot</tspan>
    </text>

    
    <text x="335" y="1135" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="335" dy="0">service, systemd_service (daemon_reload,</tspan>
      <tspan x="335" dy="34">masked, enabled, state), reboot</tspan>
      <tspan x="335" dy="34">(reboot_timeout, test_command),</tspan>
      <tspan x="335" dy="34">wait_for, wait_for_connection</tspan>
    </text>

    
    <text x="1340" y="1180" font-family="sans-serif" font-size="28" fill="#889690" text-anchor="middle">-</text>
  </g>

  
  <g id="row-kernel">
    <rect x="50" y="1275" width="1500" height="190" rx="8" fill="#ffffff" stroke="#e0e8e2" stroke-width="2" />
    <rect x="50" y="1275" width="260" height="190" rx="8" fill="#e8f1ea" />
    
    <line x1="310" y1="1275" x2="310" y2="1465" stroke="#e0e8e2" stroke-width="2" />
    <line x1="1130" y1="1275" x2="1130" y2="1465" stroke="#e0e8e2" stroke-width="2" />

    
    
    <g transform="translate(180, 1320)">
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-10" y1="-24" x2="-10" y2="-18" stroke="#207448" stroke-width="2" />
      <line x1="0" y1="-24" x2="0" y2="-18" stroke="#207448" stroke-width="2" />
      <line x1="10" y1="-24" x2="10" y2="-18" stroke="#207448" stroke-width="2" />
      <line x1="-10" y1="18" x2="-10" y2="24" stroke="#207448" stroke-width="2" />
      <line x1="0" y1="18" x2="0" y2="24" stroke="#207448" stroke-width="2" />
      <line x1="10" y1="18" x2="10" y2="24" stroke="#207448" stroke-width="2" />
      <line x1="-24" y1="-10" x2="-18" y2="-10" stroke="#207448" stroke-width="2" />
      <line x1="-24" y1="0" x2="-18" y2="0" stroke="#207448" stroke-width="2" />
      <line x1="-24" y1="10" x2="-18" y2="10" stroke="#207448" stroke-width="2" />
      <line x1="18" y1="-10" x2="24" y2="-10" stroke="#207448" stroke-width="2" />
      <line x1="18" y1="0" x2="24" y2="0" stroke="#207448" stroke-width="2" />
      <line x1="18" y1="10" x2="24" y2="10" stroke="#207448" stroke-width="2" />
    </g>
    <text x="180" y="1385" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="180" dy="0">Kernel and</tspan>
      <tspan x="180" dy="28">system</tspan>
    </text>

    
    <text x="335" y="1312" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="335" dy="0">ansible.posix.sysctl, ansible.posix.mount,</tspan>
      <tspan x="335" dy="32">community.general.modprobe, kernel_blacklist,</tspan>
      <tspan x="335" dy="32">timezone, hostname, cron, ansible.posix.at,</tspan>
      <tspan x="335" dy="32">alternatives, firewalld, ufw, seboolean,</tspan>
      <tspan x="335" dy="32">selinux</tspan>
    </text>

    
    <text x="1340" y="1375" font-family="sans-serif" font-size="28" fill="#889690" text-anchor="middle">-</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1485" width="1500" height="58" rx="8" fill="#207448" />
    <text x="800" y="1523" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Know which drawer to open, not every tool in it
    </text>
  </g>
</svg>