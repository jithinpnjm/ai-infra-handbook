<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three silent YAML hazards: duplicate keys, multiple documents, unsafe load</title>
  <desc>Infographic explaining duplicate keys, multiple documents in one file, and unsafe yaml.load hazards.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Three silent YAML hazards:</tspan>
    <tspan x="800" dy="58">duplicate keys, multiple documents, unsafe load</tspan>
  </text>

  
  <g id="panel-duplicate-keys">
    
    <rect x="40" y="155" width="480" height="905" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(252, 175)">
      <rect x="4" y="2" width="34" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="18" y="12" width="34" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
      <line x1="25" y1="24" x2="45" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="34" x2="45" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="44" x2="38" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="280" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Duplicate keys</text>

    
    <rect x="60" y="330" width="440" height="245" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="280" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">a vars file where someone</tspan>
      <tspan x="280" dy="32">copies a block and the</tspan>
      <tspan x="280" dy="32">copy keeps the old mode</tspan>
      <tspan x="280" dy="32">line below the new one</tspan>
    </text>

    
    <rect x="60" y="595" width="440" height="195" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="280" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">most parsers silently</tspan>
      <tspan x="280" dy="28">keep the last one, so a</tspan>
      <tspan x="280" dy="28">value was thrown away</tspan>
      <tspan x="280" dy="28">and nothing on screen</tspan>
      <tspan x="280" dy="28">says so</tspan>
    </text>

    
    <rect x="60" y="810" width="440" height="230" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="280" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">yamllint flags them with</tspan>
      <tspan x="280" dy="34">the key-duplicates rule</tspan>
    </text>
  </g>

  
  <g id="panel-several-documents">
    
    <rect x="560" y="155" width="480" height="905" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(772, 175)">
      <rect x="6" y="2" width="44" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="14" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3"/>
      <line x1="14" y1="42" x2="42" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="800" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="800" dy="0">Several documents</tspan>
      <tspan x="800" dy="32">in one file</tspan>
    </text>

    
    <rect x="580" y="330" width="440" height="245" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="800" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">separate with ---</text>

    
    <rect x="580" y="595" width="440" height="195" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="800" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">each section is a</tspan>
      <tspan x="800" dy="28">complete, independent</tspan>
      <tspan x="800" dy="28">document, such as a</tspan>
      <tspan x="800" dy="28">Kubernetes file with</tspan>
      <tspan x="800" dy="28">three deployments</tspan>
    </text>

    
    <rect x="580" y="810" width="440" height="230" rx="10" fill="#ffffff" stroke="#c2d8c8" stroke-width="2"/>
    <text x="800" y="855" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">a single parse call</tspan>
      <tspan x="800" dy="28">reads only the first,</tspan>
      <tspan x="800" dy="28">unless you call</tspan>
      <tspan x="800" dy="28">yaml.safe_load_all which</tspan>
      <tspan x="800" dy="28">returns every document</tspan>
      <tspan x="800" dy="28">in order</tspan>
    </text>
  </g>

  
  <g id="panel-unsafe-load">
    
    <rect x="1080" y="155" width="480" height="905" rx="16" fill="#fef6ed" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(1292, 175)">
      <path d="M 28 2 L 52 12 C 52 34 42 50 28 54 C 14 50 4 34 4 12 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="16" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="43" r="3" fill="#db8129"/>
    </g>

    
    <text x="1320" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="1320" dy="0">yaml.load on</tspan>
      <tspan x="1320" dy="32">untrusted input</tspan>
    </text>

    
    <rect x="1100" y="330" width="440" height="245" rx="10" fill="#ffffff" stroke="#f2ccab" stroke-width="2"/>
    <text x="1320" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">a YAML tag can ask the</tspan>
      <tspan x="1320" dy="28">loader to build an object</tspan>
      <tspan x="1320" dy="28">of any class it can</tspan>
      <tspan x="1320" dy="28">import, and the object</tspan>
      <tspan x="1320" dy="28">runs code when created,</tspan>
      <tspan x="1320" dy="28">so reading the file</tspan>
      <tspan x="1320" dy="28">becomes running it</tspan>
    </text>

    
    <rect x="1100" y="595" width="440" height="195" rx="10" fill="#ffffff" stroke="#f2ccab" stroke-width="2"/>
    <text x="1320" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">use yaml.safe_load which</tspan>
      <tspan x="1320" dy="30">builds only plain</tspan>
      <tspan x="1320" dy="30">dictionaries, lists,</tspan>
      <tspan x="1320" dy="30">strings and numbers</tspan>
    </text>

    
    <rect x="1100" y="810" width="440" height="230" rx="10" fill="#ffffff" stroke="#f2ccab" stroke-width="2"/>
    <text x="1320" y="895" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">anchors can be abused for</tspan>
      <tspan x="1320" dy="32">billion laughs expansion</tspan>
      <tspan x="1320" dy="32">in untrusted documents</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1085" width="1520" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1132" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Parse with safe_load, lint for duplicates, and expect several documents</text>
  </g>
</svg>