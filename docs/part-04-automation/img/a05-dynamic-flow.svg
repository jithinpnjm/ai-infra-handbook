<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A plugin asks the cloud for the current hosts at run time</title>
  <desc>Infographic illustrating dynamic inventory plugin execution flow from config file to cloud API query, parsing attributes, and outputting fresh inventory hosts.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <filter id="pillShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#207448" flood-opacity="0.12" />
    </filter>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A plugin asks the cloud for the current hosts at run time</text>

  
  
  <line x1="285" y1="490" x2="445" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  
  <g filter="url(#pillShadow)">
    <rect x="301" y="395" width="128" height="70" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  <text x="365" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="365" dy="0">query at</tspan>
    <tspan x="365" dy="28">run time</tspan>
  </text>

  
  <line x1="690" y1="490" x2="860" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  
  <g filter="url(#pillShadow)">
    <rect x="701" y="395" width="148" height="70" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  <text x="775" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="775" dy="0">returned</tspan>
    <tspan x="775" dy="28">attributes</tspan>
  </text>

  
  <line x1="1170" y1="490" x2="1330" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  
  <g filter="url(#pillShadow)">
    <rect x="1178" y="395" width="144" height="70" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  <text x="1250" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1250" dy="0">groups and</tspan>
    <tspan x="1250" dy="28">hosts</tspan>
  </text>

  
  <g id="box1">
    <rect x="40" y="160" width="245" height="550" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <circle cx="78" cy="200" r="22" fill="#207448" />
    <text x="78" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(210, 178)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 0 L 26 0 L 38 12 L 38 46 L 6 46 Z" fill="#ffffff" />
      <path d="M 26 0 L 26 12 L 38 12" />
      <line x1="12" y1="20" x2="30" y2="20" />
      <line x1="12" y1="28" x2="30" y2="28" />
      <line x1="12" y1="36" x2="24" y2="36" />
    </g>

    
    <text x="60" y="265" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="60" dy="0">Plugin config</tspan>
      <tspan x="60" dy="36">file</tspan>
    </text>

    
    <rect x="55" y="350" width="215" height="155" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5" />
    <text x="68" y="388" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">plugin:</text>
    <text x="68" y="428" font-family="monospace" font-size="24" fill="#303a36">google.cloud.</text>
    <text x="68" y="468" font-family="monospace" font-size="24" fill="#303a36">gcp_compute</text>

    
    <text x="60" y="555" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="60" dy="0">File name ends</tspan>
      <tspan x="60" dy="34">with the</tspan>
      <tspan x="60" dy="34">required suffix</tspan>
    </text>
  </g>

  
  <g id="box2">
    <rect x="445" y="160" width="245" height="550" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="483" cy="200" r="22" fill="#207448" />
    <text x="483" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(615, 180)" stroke="#207448" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 32 A 10 10 0 0 1 12 14 A 14 14 0 0 1 36 12 A 12 12 0 0 1 48 24 A 9 9 0 0 1 42 36 L 10 36 Z" />
    </g>

    
    <text x="465" y="285" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud API</text>

    
    <rect x="460" y="350" width="215" height="330" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5" />
    <text x="475" y="388" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">filters:</text>
    <text x="475" y="428" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">labels.env = prod</tspan>
      <tspan x="475" dy="38">and status =</tspan>
      <tspan x="475" dy="38" font-weight="bold" fill="#207448">RUNNING,</tspan>
      <tspan x="475" dy="38">so only</tspan>
      <tspan x="475" dy="38">matching</tspan>
      <tspan x="475" dy="38">instances</tspan>
      <tspan x="475" dy="38">come back</tspan>
    </text>

    
    <line x1="567" y1="710" x2="567" y2="750" stroke="#88928c" stroke-width="2.5" stroke-dasharray="6 4" />

    
    <rect x="445" y="750" width="245" height="160" rx="12" fill="#ebeeed" stroke="#88928c" stroke-width="2" />
    <text x="465" y="800" font-family="system-ui, sans-serif" font-size="24" fill="#434e48">
      <tspan x="465" dy="0" font-family="monospace" font-weight="bold">cache: true</tspan>
      <tspan x="465" dy="36">keeps responses</tspan>
      <tspan x="465" dy="36">on disk.</tspan>
    </text>
  </g>

  
  <g id="box3">
    <rect x="860" y="160" width="310" height="550" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="898" cy="200" r="22" fill="#207448" />
    <text x="898" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(1105, 178)" stroke="#207448" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="8" fill="#e8f1ea" />
      <path d="M 17 2 L 23 2 L 24 7 L 29 9 L 33 5 L 37 9 L 33 14 L 35 19 L 40 20 L 40 26 L 35 27 L 33 32 L 37 36 L 33 40 L 29 36 L 24 38 L 23 43 L 17 43 L 16 38 L 11 36 L 7 40 L 3 36 L 7 32 L 5 27 L 0 26 L 0 20 L 5 19 L 7 14 L 3 9 L 7 5 L 11 9 L 16 7 Z" />
    </g>

    
    <text x="880" y="265" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="880" dy="0">Build the groups</tspan>
      <tspan x="880" dy="36">and variables</tspan>
    </text>

    
    <rect x="875" y="350" width="280" height="330" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5" />

    <text x="892" y="392" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">keyed_groups:</text>
    <text x="892" y="430" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="892" dy="0">role_gpu,</tspan>
      <tspan x="892" dy="32">role_login</tspan>
    </text>

    <line x1="892" y1="495" x2="1135" y2="495" stroke="#e0e8e2" stroke-width="2" />

    <text x="892" y="535" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">compose:</text>
    <text x="892" y="573" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">ansible_host from</text>
    <text x="892" y="612" font-family="monospace" font-size="24" fill="#303a36">networkInterfaces</text>
  </g>

  
  <g id="box4">
    <rect x="1330" y="160" width="230" height="550" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="1368" cy="200" r="22" fill="#207448" />
    <text x="1368" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(1495, 178)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="6" cy="10" r="2.5" fill="#207448" />
      <line x1="16" y1="10" x2="38" y2="10" />
      <circle cx="6" cy="23" r="2.5" fill="#207448" />
      <line x1="16" y1="23" x2="38" y2="23" />
      <circle cx="6" cy="36" r="2.5" fill="#207448" />
      <line x1="16" y1="36" x2="38" y2="36" />
    </g>

    
    <text x="1350" y="285" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Inventory</text>

    
    <rect x="1345" y="350" width="200" height="210" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5" />
    <text x="1360" y="398" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1360" dy="0" font-weight="bold" fill="#207448">Current hosts,</tspan>
      <tspan x="1360" dy="38">every time the</tspan>
      <tspan x="1360" dy="38">command</tspan>
      <tspan x="1360" dy="38">runs</tspan>
    </text>

    
    <line x1="1445" y1="710" x2="1445" y2="750" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6 4" />

    
    <rect x="1330" y="750" width="230" height="200" rx="12" fill="#fff7ef" stroke="#db8129" stroke-width="2.5" />
    <text x="1346" y="796" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1346" dy="0" font-weight="bold" fill="#db8129">Static files go</tspan>
      <tspan x="1346" dy="36" font-weight="bold" fill="#db8129">stale.</tspan>
      <tspan x="1346" dy="36">This list is read</tspan>
      <tspan x="1346" dy="36">fresh on each</tspan>
      <tspan x="1346" dy="36">run.</tspan>
    </text>
  </g>
</svg>