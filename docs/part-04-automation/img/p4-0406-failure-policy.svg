<svg width="1600" height="1140" viewBox="0 0 1600 1140" xmlns="http://www.w3.org/2000/svg">
  <title>Failure policy knobs: which question each one answers</title>
  <desc>A visual comparison table of failure policy knobs and the questions each answers, including defaults and recap details.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="80" y="78" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Failure policy knobs: which question each one answers</text>

  
  <g id="table-headers">
    <rect x="80" y="120" width="430" height="52" rx="6" fill="#207448"/>
    <text x="110" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Knob</text>

    <rect x="520" y="120" width="1000" height="52" rx="6" fill="#207448"/>
    <text x="550" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Question it answers</text>
  </g>

  
  <g id="row-any-errors-fatal">
    <rect x="80" y="180" width="430" height="84" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    
    <g transform="translate(108, 198)">
      <polygon points="14,0 34,0 48,14 48,34 34,48 14,48 0,34 0,14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="24" y1="12" x2="24" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="24" cy="36" r="2.5" fill="#207448"/>
    </g>
    <text x="175" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">any_errors_fatal</text>

    <rect x="520" y="180" width="1000" height="84" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    <text x="550" y="232" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">should the whole play stop when one host fails?</text>
  </g>

  
  <g id="row-max-fail-percentage">
    <rect x="80" y="272" width="430" height="84" rx="6" fill="#ffffff" stroke="#cfe0d4" stroke-width="1.5"/>
    
    <g transform="translate(108, 290)">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="13" y1="35" x2="35" y2="13" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="15" cy="17" r="3" fill="#207448"/>
      <circle cx="33" cy="31" r="3" fill="#207448"/>
    </g>
    <text x="175" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">max_fail_percentage</text>

    <rect x="520" y="272" width="1000" height="84" rx="6" fill="#ffffff" stroke="#cfe0d4" stroke-width="1.5"/>
    <text x="550" y="324" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">should a batch stop once too many hosts fail?</text>
  </g>

  
  <g id="row-ignore-errors">
    <rect x="80" y="364" width="430" height="146" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    
    <g transform="translate(108, 413)">
      <path d="M 2 24 Q 24 6 46 24 Q 24 42 2 24 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="24" cy="24" r="7" fill="#207448"/>
      <line x1="4" y1="44" x2="44" y2="4" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="175" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">ignore_errors</text>

    <rect x="520" y="364" width="1000" height="146" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    <text x="550" y="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">should one failed task be ignored?</text>
    <text x="550" y="458" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#506058">
      <tspan x="550" dy="0">taping over a smoke alarm:</tspan>
      <tspan x="550" dy="32">the recap looks green while the problem grows</tspan>
    </text>
  </g>

  
  <g id="row-ignore-unreachable">
    <rect x="80" y="518" width="430" height="84" rx="6" fill="#ffffff" stroke="#cfe0d4" stroke-width="1.5"/>
    
    <g transform="translate(108, 536)">
      <rect x="4" y="4" width="40" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="24" y1="30" x2="24" y2="40" stroke="#207448" stroke-width="3.5"/>
      <line x1="14" y1="40" x2="34" y2="40" stroke="#207448" stroke-width="3.5"/>
      <line x1="6" y1="6" x2="42" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="175" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">ignore_unreachable</text>

    <rect x="520" y="518" width="1000" height="84" rx="6" fill="#ffffff" stroke="#cfe0d4" stroke-width="1.5"/>
    <text x="550" y="570" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">should unreachable hosts be tolerated?</text>
  </g>

  
  <g id="row-force-handlers">
    <rect x="80" y="610" width="430" height="84" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    
    <g transform="translate(108, 628)">
      <circle cx="20" cy="24" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="20" cy="24" r="4" fill="#207448"/>
      <line x1="20" y1="5" x2="20" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="20" y1="38" x2="20" y2="43" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="1" y1="24" x2="6" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="34" y1="24" x2="39" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="36" cy="34" r="8" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="36" cy="34" r="2.5" fill="#207448"/>
    </g>
    <text x="175" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">force_handlers</text>

    <rect x="520" y="610" width="1000" height="84" rx="6" fill="#e8f1ea" stroke="#cfe0d4" stroke-width="1.5"/>
    <text x="550" y="662" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">should handlers still run on a host that failed?</text>
  </g>

  
  <g id="defaults-box">
    <rect x="80" y="718" width="1440" height="152" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    <rect x="80" y="718" width="10" height="152" rx="4" fill="#db8129"/>

    
    <g transform="translate(112, 768)">
      <path d="M 28 0 L 52 10 L 52 32 C 52 48 28 56 28 56 C 28 56 4 48 4 32 L 4 10 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="28" y1="18" x2="28" y2="34" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

    <text x="195" y="784" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#303a36">
      <tspan x="195" dy="0">by default a failed host is removed from the rest of the play, and</tspan>
      <tspan x="195" dy="38">handlers do not run for failed hosts unless force_handlers: true</tspan>
    </text>
  </g>

  
  <g id="cross-reference-box">
    <rect x="80" y="890" width="1440" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>

    
    <g transform="translate(116, 910)">
      <rect x="6" y="8" width="34" height="42" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 16 8 V 2 H 30 V 8" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <line x1="14" y1="20" x2="32" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="30" x2="32" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="40" x2="24" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="185" y="945" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#207448">rescued and ignored counters in the recap</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="80" y="998" width="1440" height="84" rx="8" fill="#207448"/>
    <text x="800" y="1050" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Learn the defaults before an incident, because they are not always the ones you would choose</text>
  </g>
</svg>