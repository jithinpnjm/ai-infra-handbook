<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>A dictionary becomes environment lines, in a stable order</title>
  <desc>Visual flow demonstrating how an Ansible dictionary is rendered into environment lines in stable order using dictsort and upper filters.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A dictionary becomes environment lines, in a stable order</text>

  
  <g>
    <rect x="80" y="95" width="1440" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="130" cy="145" r="24" fill="#207448"/>
    <text x="130" y="154" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <path d="M 188 122 C 178 122 174 127 174 135 C 174 141 169 143 164 145 C 169 147 174 149 174 155 C 174 163 178 168 188 168" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 212 122 C 222 122 226 127 226 135 C 226 141 231 143 236 145 C 231 147 226 149 226 155 C 226 163 222 168 212 168" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

    
    <text x="250" y="153" font-family="monospace" font-size="24" fill="#303a36">nccl_env: { debug: WARN, ib_hca: "mlx5_0,mlx5_1", socket_ifname: eth0 }</text>
  </g>

  
  <line x1="800" y1="195" x2="800" y2="233" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="80" y="235" width="1440" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="130" cy="305" r="24" fill="#207448"/>
    <text x="130" y="314" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <path d="M 195 281 L 205 281 L 207 287 L 213 289 L 218 285 L 225 292 L 221 297 L 223 303 L 229 305 L 229 315 L 223 317 L 221 323 L 225 328 L 218 335 L 213 331 L 207 333 L 205 339 L 195 339 L 193 333 L 187 331 L 182 335 L 175 328 L 179 323 L 177 317 L 171 315 L 171 305 L 177 303 L 179 297 L 175 292 L 182 285 L 187 289 L 193 287 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="200" cy="310" r="9" fill="none" stroke="#207448" stroke-width="3.5"/>

    
    <text x="250" y="291" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="250" dy="0"># {{ ansible_managed }}; </tspan>
      <tspan x="250" dy="36">for k, v in (nccl_env | default({})) | dictsort; NCCL_{{ k | upper }}={{ v }}; endfor</tspan>
    </text>
  </g>

  
  <line x1="800" y1="375" x2="800" y2="413" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="80" y="415" width="1440" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="130" cy="510" r="24" fill="#207448"/>
    <text x="130" y="519" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <rect x="175" y="482" width="50" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="187" y1="498" x2="213" y2="498" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="187" y1="510" x2="213" y2="510" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="187" y1="522" x2="205" y2="522" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

    
    <rect x="250" y="430" width="1230" height="160" rx="10" fill="#ffffff" stroke="#b2d2bc" stroke-width="1.5"/>
    <text x="280" y="472" font-family="monospace" font-size="24" fill="#303a36">NCCL_DEBUG=WARN</text>
    <text x="280" y="515" font-family="monospace" font-size="24" fill="#303a36">NCCL_IB_HCA=mlx5_0,mlx5_1</text>
    <text x="280" y="558" font-family="monospace" font-size="24" fill="#303a36">NCCL_SOCKET_IFNAME=eth0</text>
  </g>

  
  <g>
    
    <rect x="80" y="635" width="430" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="105" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0">default({}) guard: a host </tspan>
      <tspan x="105" dy="36">without NCCL settings still </tspan>
      <tspan x="105" dy="36">renders a valid, empty file</tspan>
    </text>

    
    <rect x="540" y="635" width="560" height="220" rx="16" fill="#fef6ed" stroke="#db8129" stroke-width="3"/>
    <text x="565" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="565" dy="0">dictsort puts keys in a stable order, </tspan>
      <tspan x="565" dy="36">so the file is identical on every render </tspan>
      <tspan x="565" dy="36">and a diff shows only real changes</tspan>
    </text>

    
    <rect x="1130" y="635" width="390" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1155" y="718" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1155" dy="0">k | upper turns </tspan>
      <tspan x="1155" dy="36">debug into DEBUG</tspan>
    </text>
  </g>

  
  <rect x="80" y="885" width="1440" height="80" rx="12" fill="#207448"/>
  <text x="800" y="935" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Stable ordering makes diffs show only real changes</text>
</svg>