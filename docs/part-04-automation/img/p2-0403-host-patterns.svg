<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Host patterns select machines by union, intersection, exclusion and regex</title>
  <desc>Visual infographic explaining Ansible host pattern syntax: union of groups, intersection of groups, exclusion of a single host, and regular expressions on host names, with host list verification advice.</desc>

