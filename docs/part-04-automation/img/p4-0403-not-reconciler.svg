<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>What Ansible is not: a cleaning crew, not a thermostat, and no state file</title>
  <desc>A visual comparison explaining Ansible's execution model versus continuous agent reconciliation loops and state-file engines, covering push vs pull, procedural execution, and best-practice rules.</desc>

  <defs>
    <marker id="m-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448" />
    </marker>
    <marker id="m-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129" />
    </marker>
    <marker id="m-slate" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#303a36" />
    </marker>
    <filter id="shadow" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5" />

  
  <text x="800" y="74" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    What Ansible is not: a cleaning crew, not a thermostat, and no state file
  </text>

  
  
  

  
  <rect x="50" y="130" width="470" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  
  <g transform="translate(235, 160)">
    
    <circle cx="50" cy="45" r="34" fill="none" stroke="#207448" stroke-width="5" stroke-dasharray="160 40" />
    <path d="M 85 45 L 85 35 L 97 45 L 85 55 Z" fill="#207448" />
    
    <circle cx="50" cy="45" r="22" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="50" y1="45" x2="62" y2="33" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="50" cy="45" r="4" fill="#207448" />
  </g>

  
  <text x="285" y="295" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="285" dy="0">Thermostat: a continuous</tspan>
    <tspan x="285" dy="36">reconciliation loop keeps checking</tspan>
    <tspan x="285" dy="36">and correcting on its own</tspan>
  </text>

  
  <line x1="85" y1="420" x2="485" y2="420" stroke="#cbdcd0" stroke-width="2" />

  
  <rect x="75" y="450" width="420" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="285" y="498" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="285" dy="0">Puppet, Chef, Salt</tspan>
    <tspan x="285" dy="36">(agent pulls from a server)</tspan>
  </text>


  
  <rect x="565" y="130" width="470" height="490" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4" filter="url(#shadow)" />

  
  <g transform="translate(750, 155)">
    
    <rect x="-35" y="0" width="170" height="78" rx="12" fill="#fff1e3" stroke="#db8129" stroke-width="2" />
    
    <path d="M 0 52 L 20 22 L 35 22 L 35 60 L 0 60 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <path d="M 20 22 L 15 12 L 30 12" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    
    <path d="M 45 42 L 85 42" stroke="#db8129" stroke-width="4" marker-end="url(#m-orange)" />
  </g>

  
  <text x="800" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
    Ansible: acts when you run it
  </text>

  
  <line x1="600" y1="360" x2="1000" y2="360" stroke="#f6cead" stroke-width="2" />

  
  <rect x="585" y="390" width="430" height="205" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="800" y="440" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="800" dy="0">like a cleaning crew that</tspan>
    <tspan x="800" dy="38">arrives when called; triggers:</tspan>
    <tspan x="800" dy="38">you, a scheduler,</tspan>
    <tspan x="800" dy="38">ansible-pull or AAP</tspan>
  </text>


  
  <rect x="1080" y="130" width="470" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)" />

  
  <g transform="translate(1265, 160)">
    <rect x="15" y="6" width="60" height="74" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="28" x2="62" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="42" x2="62" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="56" x2="48" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="1315" y="295" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="1315" dy="0">Terraform: provisioning</tspan>
    <tspan x="1315" dy="36">engine with a state file</tspan>
  </text>

  
  <line x1="1115" y1="390" x2="1515" y2="390" stroke="#cbdcd0" stroke-width="2" />

  
  <rect x="1105" y="420" width="420" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1315" y="465" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="1315" dy="0">Ansible has no state file and</tspan>
    <tspan x="1315" dy="38">learns the state of a host by</tspan>
    <tspan x="1315" dy="38">inspecting it on every run</tspan>
  </text>


  
  
  
  <g transform="translate(50, 660)" filter="url(#shadow)">
    <rect x="0" y="0" width="1500" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(35, 30)">
      <circle cx="35" cy="70" r="30" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M 22 70 L 48 70 M 38 60 L 48 70 L 38 80" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="125" y="58" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="125" dy="0">push: the control node decides when work happens, easier to reason about during</tspan>
      <tspan x="125" dy="38">an incident because you know exactly when the change was sent; pull: each machine</tspan>
      <tspan x="125" dy="38">decides when to ask, better at keeping thousands of machines converging without a keyboard</tspan>
    </text>
  </g>


  
  
  
  <g transform="translate(50, 890)" filter="url(#shadow)">
    <rect x="0" y="0" width="1500" height="180" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(35, 25)">
      <rect x="10" y="15" width="48" height="96" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <line x1="22" y1="38" x2="46" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="22" y1="62" x2="46" y2="62" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="22" y1="86" x2="46" y2="86" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="125" y="68" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="125" dy="0">playbook is procedural: tasks top to bottom like a recipe card;</tspan>
      <tspan x="125" dy="44">Terraform is closer to a parts list with arrows, order from dependencies</tspan>
    </text>
  </g>


  
  
  

  
  <g transform="translate(50, 1100)" filter="url(#shadow)">
    <rect x="0" y="0" width="790" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(30, 30)">
      <circle cx="28" cy="28" r="22" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="100" y="66" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="100" dy="0">keep complex programming logic out of</tspan>
      <tspan x="100" dy="42">playbooks and push it into modules;</tspan>
      <tspan x="100" dy="42">a playbook should read like a list</tspan>
      <tspan x="100" dy="42">of desired facts</tspan>
    </text>
  </g>

  
  <g transform="translate(870, 1100)" filter="url(#shadow)">
    <rect x="0" y="0" width="680" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(30, 30)">
      <rect x="6" y="8" width="46" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <path d="M 20 28 L 38 28 M 30 20 L 30 38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 29 52 L 29 78 L 48 78" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#m-green)" />
    </g>

    
    <text x="105" y="76" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="105" dy="0">ansible-pull pulls and runs</tspan>
      <tspan x="105" dy="44">playbooks from a Git repository</tspan>
      <tspan x="105" dy="44">on each node</tspan>
    </text>
  </g>


  
  
  
  <g transform="translate(50, 1360)" filter="url(#shadow)">
    <rect x="0" y="0" width="1500" height="80" rx="14" fill="#207448" />
    <text x="750" y="50" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
      Ansible acts when called
    </text>
  </g>

</svg>