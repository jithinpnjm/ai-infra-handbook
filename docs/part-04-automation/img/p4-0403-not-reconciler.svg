<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What Ansible is not: a cleaning crew, not a thermostat, and no state file</title>
  <desc>Visual comparison showing Ansible's on-demand execution model against continuous reconciliation loops and state file provisioning engines.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">What Ansible is not: a cleaning crew,</tspan>
    <tspan x="800" dy="56">not a thermostat, and no state file</tspan>
  </text>

  

  
  <g id="tool-thermostat">
    <rect x="40" y="150" width="486" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(283, 205)">
      
      <path d="M -35,-15 A 42 42 0 0 1 35,-15" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
      <path d="M 35,15 A 42 42 0 0 1 -35,15" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
      
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="-17" stroke="#207448" stroke-width="2.5"/>
      <line x1="17" y1="-17" x2="12" y2="-12" stroke="#207448" stroke-width="2.5"/>
      <line x1="24" y1="0" x2="17" y2="0" stroke="#207448" stroke-width="2.5"/>
      <line x1="-24" y1="0" x2="-17" y2="0" stroke="#207448" stroke-width="2.5"/>
      <line x1="-17" y1="-17" x2="-12" y2="-12" stroke="#207448" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="4" fill="#207448"/>
      <line x1="0" y1="0" x2="10" y2="-10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="64" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="64" dy="0">Thermostat: a continuous</tspan>
      <tspan x="64" dy="36">reconciliation loop keeps</tspan>
      <tspan x="64" dy="36">checking and correcting</tspan>
      <tspan x="64" dy="36">on its own</tspan>
    </text>

    
    <rect x="64" y="420" width="438" height="86" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">Puppet, Chef, Salt</tspan>
      <tspan x="80" dy="32">(agent pulls from a server)</tspan>
    </text>
  </g>

  
  <g id="tool-ansible">
    <rect x="556" y="150" width="488" height="380" rx="16" fill="#fdf8f3" stroke="#db8129" stroke-width="3.5"/>
    
    
    <g transform="translate(800, 205)">
      
      <line x1="-65" y1="0" x2="-40" y2="0" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
      
      <path d="M -25,-25 A 38 38 0 1 1 25,-25" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <path d="M 25,-25 L 35,-15" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
      
      <circle cx="0" cy="5" r="22" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      <path d="M -8,14 L 8,14 L 5,3 L -5,3 Z" fill="none" stroke="#db8129" stroke-width="2.5"/>
      <line x1="0" y1="3" x2="0" y2="-9" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="-12" y1="-2" x2="-18" y2="-8" stroke="#db8129" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="-2" x2="18" y2="-8" stroke="#db8129" stroke-width="2" stroke-linecap="round"/>
    </g>

    
    <text x="580" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      <tspan x="580" dy="0">Ansible: acts when you</tspan>
      <tspan x="580" dy="36">run it</tspan>
    </text>

    
    <rect x="580" y="360" width="440" height="146" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="596" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="596" dy="0">like a cleaning crew that</tspan>
      <tspan x="596" dy="32">arrives when called;</tspan>
      <tspan x="596" dy="32">triggers: you, a scheduler,</tspan>
      <tspan x="596" dy="32"><tspan font-family="ui-monospace, monospace">ansible-pull</tspan> or AAP</tspan>
    </text>
  </g>

  
  <g id="tool-terraform">
    <rect x="1074" y="150" width="486" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1317, 205)">
      
      <path d="M -36,-15 A 42 42 0 0 1 36,-15" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
      <path d="M 36,15 A 42 42 0 0 1 -36,15" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
      
      <rect x="-16" y="-20" width="32" height="40" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#207448" stroke-width="2"/>
      <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#207448" stroke-width="2"/>
      <line x1="-10" y1="6" x2="6" y2="6" stroke="#207448" stroke-width="2"/>
      <line x1="-10" y1="14" x2="2" y2="14" stroke="#207448" stroke-width="2"/>
    </g>

    
    <text x="1098" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1098" dy="0">Terraform: provisioning</tspan>
      <tspan x="1098" dy="36">engine with a state file</tspan>
    </text>

    
    <rect x="1098" y="375" width="438" height="131" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1114" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1114" dy="0">Ansible has no state file and</tspan>
      <tspan x="1114" dy="34">learns the state of a host by</tspan>
      <tspan x="1114" dy="34">inspecting it on every run</tspan>
    </text>
  </g>

  
  <g id="strip-push-versus-pull">
    <rect x="40" y="560" width="1520" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(95, 642)">
      <circle cx="-16" cy="0" r="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <circle cx="24" cy="-22" r="9" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <circle cx="24" cy="22" r="9" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <path d="M 0,-6 L 14,-16" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
      
      <path d="M 14,16 L 0,6" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    </g>

    
    <text x="160" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="160" dy="0">push: the control node decides when work happens, easier to reason about during an incident</tspan>
      <tspan x="160" dy="34">because you know exactly when the change was sent;</tspan>
      <tspan x="160" dy="34">pull: each machine decides when to ask, better at keeping thousands of machines</tspan>
      <tspan x="160" dy="34">converging without a keyboard</tspan>
    </text>
  </g>

  
  <g id="strip-ordering">
    <rect x="40" y="755" width="1520" height="115" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(95, 812)">
      <rect x="-20" y="-24" width="40" height="48" rx="5" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="-12" y1="-14" x2="12" y2="-14" stroke="#207448" stroke-width="2"/>
      <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#207448" stroke-width="2"/>
      <line x1="-12" y1="6" x2="4" y2="6" stroke="#207448" stroke-width="2"/>
      <line x1="-12" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="2"/>
    </g>

    
    <text x="160" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="160" dy="0">playbook is procedural: tasks top to bottom like a recipe card;</tspan>
      <tspan x="160" dy="35">Terraform is closer to a parts list with arrows, order from dependencies</tspan>
    </text>
  </g>

  
  
  
  <g id="container-rule">
    <rect x="40" y="900" width="880" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(95, 977)">
      <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <path d="M -14,-4 L -6,-12 L -6,4 Z" fill="#207448"/>
      <path d="M 14,-4 L 6,-12 L 6,4 Z" fill="#207448"/>
      <line x1="-10" y1="12" x2="10" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    
    <text x="160" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="160" dy="0">keep complex programming logic out of playbooks</tspan>
      <tspan x="160" dy="35">and push it into modules; a playbook should read</tspan>
      <tspan x="160" dy="35">like a list of desired facts</tspan>
    </text>
  </g>

  
  <g id="container-pull-option">
    <rect x="950" y="900" width="610" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1005, 977)">
      <circle cx="-14" cy="14" r="7" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <circle cx="-14" cy="-14" r="7" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <circle cx="16" cy="-4" r="7" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="-14" y1="-7" x2="-14" y2="7" stroke="#207448" stroke-width="3"/>
      <path d="M -14,7 C -14,-4 4,-4 9,-4" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    </g>

    
    <text x="1070" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1070" dy="0"><tspan font-family="ui-monospace, monospace">ansible-pull</tspan> pulls and runs</tspan>
      <tspan x="1070" dy="35">playbooks from a Git repository</tspan>
      <tspan x="1070" dy="35">on each node</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1085" width="1520" height="70" rx="12" fill="#207448"/>
    <text x="800" y="1131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Ansible acts when called</text>
  </g>
</svg>