<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>JSON, YAML and other formats</title>
  <desc>Architecture flow showing Structured Data Source and Template File (.j2) processed by Template Engine into Rendered Config Artifact validated by Target Validator.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#303a36">JSON, YAML and other formats</text>

  
  <g id="node-data">
    <rect x="70" y="130" width="450" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(295, 175)">
      <ellipse cx="0" cy="-14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M -22,-14 v 28 c 0,4.5 10,8 22,8 s 22,-3.5 22,-8 v -28" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M -22,0 c 0,4.5 10,8 22,8 s 22,-3.5 22,-8" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    
    <text x="295" y="240" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Structured Data Source</text>
    <line x1="120" y1="262" x2="470" y2="262" stroke="#c8decb" stroke-width="1.5" />
    
    <text x="295" y="302" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">(YAML / JSON /</text>
    <text x="295" y="336" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Inventory / YANG Model)</text>
    <text x="295" y="396" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">Validated by yamllint &amp;</text>
    <text x="295" y="430" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">JSON Schema</text>
  </g>

  
  <g id="node-tpl">
    <rect x="70" y="550" width="450" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(295, 595)">
      <path d="M -16,-22 h 20 l 12,12 v 32 h -32 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 4,-22 v 12 h 12" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M -8,2 c -3,0 -4,2 -4,4 c 0,2 -2,3 -4,3 c 2,0 4,1 4,3 c 0,2 1,4 4,4" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 8,2 c 3,0 4,2 4,4 c 0,2 2,3 4,3 c -2,0 -4,1 -4,3 c 0,2 -1,4 -4,4" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="295" y="660" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Template File (.j2)</text>
    <line x1="120" y1="682" x2="470" y2="682" stroke="#c8decb" stroke-width="1.5" />
    
    <text x="295" y="722" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">({{ expr }}, {% for/if %},</text>
    <text x="295" y="756" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">{# comment #},</text>
    <text x="295" y="816" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">trim_blocks &amp;</text>
    <text x="295" y="850" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">lstrip_blocks)</text>
  </g>

  
  <g id="node-engine">
    <rect x="575" y="310" width="450" height="430" rx="14" fill="#fffaf3" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(800, 365)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#db8129" stroke-width="3.5" />
      <path d="M -3,-22 h 6 v 6 h -6 z M -3,16 h 6 v 6 h -6 z M -22,-3 h 6 v 6 h -6 z M 16,-3 h 6 v 6 h -6 z M -16,-16 l 4.5,4.5 l -4.2,4.2 l -4.5,-4.5 z M 11.5,11.5 l 4.5,4.5 l -4.2,4.2 l -4.5,-4.5 z M -16,11.5 l 4.5,-4.5 l 4.2,4.2 l -4.5,4.5 z M 11.5,-16 l 4.5,-4.5 l 4.2,4.2 l -4.5,4.5 z" fill="#db8129" />
      <circle cx="0" cy="0" r="17" fill="none" stroke="#db8129" stroke-width="3.5" />
    </g>
    
    <text x="800" y="440" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Template Engine</text>
    <line x1="625" y1="462" x2="975" y2="462" stroke="#f0cfab" stroke-width="1.5" />
    
    <text x="800" y="504" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">(Jinja2 Environment,</text>
    <text x="800" y="540" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">StrictUndefined,</text>
    <text x="800" y="600" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">Custom Filters,</text>
    <text x="800" y="638" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">Ansible template module)</text>
  </g>

  
  <g id="node-out">
    <rect x="1080" y="130" width="450" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1305, 175)">
      <rect x="-22" y="-20" width="44" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M -14,-7 l 6,5 l -6,5 M -2,3 h 14 M -14,12 h 26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="1305" y="235" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rendered Config</text>
    <text x="1305" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Artifact</text>
    <line x1="1130" y1="292" x2="1480" y2="292" stroke="#c8decb" stroke-width="1.5" />
    
    <text x="1305" y="345" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">(nginx.conf, slurm.conf,</text>
    <text x="1305" y="385" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">switchport CLI)</text>
  </g>

  
  <g id="node-val">
    <rect x="1080" y="550" width="450" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1305, 595)">
      <path d="M 0,-22 c 14,0 20,4 20,4 v 16 c 0,15 -10,24 -20,28 c -10,-4 -20,-13 -20,-28 v -16 c 0,0 6,-4 20,-4 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M -9,0 l 6,6 l 13,-13" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="1305" y="665" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Target Validator</text>
    <line x1="1130" y1="688" x2="1480" y2="688" stroke="#c8decb" stroke-width="1.5" />
    
    <text x="1305" y="745" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">(nginx -t, visudo -cf %s,</text>
    <text x="1305" y="785" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">scontrol)</text>
  </g>

  
   Engine -->
  <path d="M 520,350 C 548,350 548,430 575,430" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

   Engine -->
  <path d="M 520,700 C 548,700 548,630 575,630" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

   Out -->
  <path d="M 1025,430 C 1052,430 1052,350 1080,350" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

   Val -->
  <path d="M 1305,500 L 1305,550" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

</svg>