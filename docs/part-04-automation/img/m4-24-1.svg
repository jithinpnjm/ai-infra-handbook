<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Designing the landing zone (GCP)</title>
  <desc>Visual architecture of a Google Cloud landing zone for AI workloads, depicting organizational folders, projects, networking, compute clusters, storage, IAM, artifact registry, and monitoring.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">Designing the landing zone (GCP)</text>

  
  
  <path d="M 800 165 L 800 216" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 300 350 L 300 416" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 300 585 L 300 631" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 70 502 L 35 502 L 35 945 L 66 945" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 810 350 L 810 416" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1320 350 L 1320 416" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 555 350 L 555 820 L 576 820" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1065 350 L 1065 830 L 1086 830" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />

  

  
  <g filter="url(#shadow)">
    <rect x="540" y="85" width="520" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 570 108 L 594 108 L 604 118 L 626 118 A 3 3 0 0 1 629 121 L 629 143 A 3 3 0 0 1 626 146 L 570 146 A 3 3 0 0 1 567 143 L 567 111 A 3 3 0 0 1 570 108 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="567" y1="122" x2="629" y2="122" stroke="#207448" stroke-width="3" />
    <text x="648" y="136" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Organisation / folders</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="80" y="220" width="1440" height="130" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <rect x="80" y="220" width="18" height="130" rx="4" fill="#db8129" />
    
    <g transform="translate(130, 252)">
      <rect x="0" y="0" width="56" height="42" rx="4" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
      <path d="M 8 10 L 48 10 M 8 20 L 48 20 M 8 30 L 32 30" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <rect x="12" y="14" width="52" height="46" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
      <path d="M 22 26 L 54 26 M 22 36 L 54 36 M 22 46 L 40 46" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="235" y="270" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Projects: ai-shared, ai-dev, ai-prod</text>
    <text x="235" y="312" font-family="sans-serif" font-size="24px" fill="#303a36">(billing, quotas, IAM boundary)</text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="70" y="420" width="460" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(276, 432)">
      <circle cx="24" cy="8" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="8" cy="34" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="40" cy="34" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="20" y1="14" x2="12" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="14" x2="36" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="15" y1="34" x2="33" y2="34" stroke="#207448" stroke-width="3" stroke-dasharray="3,3" />
    </g>
    <text x="300" y="500" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">VPC: custom subnets</text>
    <text x="300" y="534" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="300" dy="0">private Google access,</tspan>
      <tspan x="300" dy="30">Cloud NAT, firewall</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="70" y="635" width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(276, 646)">
      <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="24" cy="24" r="6" fill="#207448" />
      <line x1="24" y1="6" x2="24" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="24" y1="42" x2="24" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="15" x2="3" y2="12" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="33" x2="45" y2="36" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="8" y1="33" x2="3" y2="36" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="15" x2="45" y2="12" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="300" y="718" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="300" dy="0">GKE cluster</tspan>
      <tspan x="300" dy="34">(private nodes)</tspan>
    </text>
    <text x="300" y="788" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">system pool + GPU pools</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="70" y="855" width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(276, 866)">
      <rect x="4" y="4" width="40" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="12" r="2.5" fill="#207448" />
      <circle cx="20" cy="12" r="2.5" fill="#207448" />
      <line x1="30" y1="12" x2="38" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <rect x="4" y="26" width="40" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="34" r="2.5" fill="#207448" />
      <circle cx="20" cy="34" r="2.5" fill="#207448" />
      <line x1="30" y1="34" x2="38" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="300" y="938" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="300" dy="0">GPU VMs /</tspan>
      <tspan x="300" dy="34">Slurm cluster</tspan>
    </text>
    <text x="300" y="1008" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="300" dy="0">(compact placement,</tspan>
      <tspan x="300" dy="28">multi-NIC)</tspan>
    </text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="580" y="420" width="460" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(786, 432)">
      <ellipse cx="24" cy="10" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 4 10 L 4 24 C 4 28 13 31 24 31 C 35 31 44 28 44 24 L 44 10" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 4 24 L 4 38 C 4 42 13 45 24 45 C 35 45 44 42 44 38 L 44 24" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="810" y="504" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="810" dy="0">GCS buckets:</tspan>
      <tspan x="810" dy="34">datasets, checkpoints</tspan>
    </text>
    <text x="810" y="582" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="810" dy="0">CMEK, versioning,</tspan>
      <tspan x="810" dy="30">uniform access</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="580" y="740" width="460" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(786, 754)">
      <path d="M 24 4 L 44 14 L 44 36 L 24 46 L 4 36 L 4 14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="24" y1="46" x2="24" y2="25" stroke="#207448" stroke-width="3.5" />
      <line x1="44" y1="14" x2="24" y2="25" stroke="#207448" stroke-width="3.5" />
      <line x1="4" y1="14" x2="24" y2="25" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="810" y="836" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="810" dy="0">Artifact Registry</tspan>
      <tspan x="810" dy="34">(images)</tspan>
    </text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="1090" y="420" width="460" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1296, 432)">
      <path d="M 24 4 L 42 10 L 42 24 C 42 36 24 45 24 45 C 24 45 6 36 6 24 L 6 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="24" cy="21" r="5" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="26" x2="24" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="30" x2="28" y2="30" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="1320" y="504" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">Service accounts +</tspan>
      <tspan x="1320" dy="34">Workload Identity</tspan>
    </text>
    <text x="1320" y="595" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">no JSON keys</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1090" y="740" width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1296, 754)">
      <rect x="4" y="6" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 10 32 L 18 22 L 26 28 L 36 14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="36" cy="14" r="3" fill="#207448" />
    </g>
    <text x="1320" y="828" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">Cloud Monitoring/</tspan>
      <tspan x="1320" dy="34">Logging,</tspan>
    </text>
    <text x="1320" y="902" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">budgets &amp; alerts</text>
  </g>

</svg>