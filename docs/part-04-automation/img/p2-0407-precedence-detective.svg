<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Find an unexpected variable value with four questions, in a fixed order</title>
  <desc>A four-step diagnostic workflow for Ansible variable precedence with common failure modes and resolution note.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Find an unexpected variable value with four questions, in a fixed order</text>

  
  <text x="800" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#526059">The first answer that shows the wrong value points to the layer to inspect.</text>

  
  <rect x="170" y="155" width="700" height="60" rx="12" fill="#edf2f7" stroke="#cbd5e1" stroke-width="2" />
  <text x="520" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#4a5568">Variable has an unexpected value on gpu001</text>

  
  <line x1="520" y1="215" x2="520" y2="251" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="255" width="940" height="125" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="92" cy="317.5" r="24" fill="#207448" />
  <text x="92" y="326.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(136, 290)">
    <ellipse cx="24" cy="10" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 4 10 L 4 45 A 20 7 0 0 0 44 45 L 44 10" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 4 27 A 20 7 0 0 0 44 27" fill="none" stroke="#207448" stroke-width="3.5" />
  </g>
  
  <text x="210" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">What does the inventory believe?</text>
  <text x="210" y="345" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#303a36">ansible-inventory --host gpu001 --yaml</text>

  
  <line x1="520" y1="380" x2="520" y2="411" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="415" width="940" height="125" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="92" cy="477.5" r="24" fill="#207448" />
  <text x="92" y="486.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(136, 452)">
    <rect x="2" y="2" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 10 14 L 16 19 L 10 24 M 22 24 L 32 24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="25" y1="36" x2="25" y2="46" stroke="#207448" stroke-width="3.5" />
    <line x1="14" y1="46" x2="36" y2="46" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  
  <text x="210" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">What does the live host see?</text>
  <text x="210" y="505" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#303a36">ansible gpu001 -m debug, var=nvidia_driver_branch</text>

  
  <line x1="520" y1="540" x2="520" y2="571" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="575" width="940" height="125" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="92" cy="637.5" r="24" fill="#207448" />
  <text x="92" y="646.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(136, 612)">
    <path d="M 12 4 L 38 4 L 46 12 L 46 44 L 12 44 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 38 4 L 38 12 L 46 12" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="19" y1="22" x2="33" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="19" y1="30" x2="37" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="19" y1="37" x2="29" y2="37" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="210" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Which files loaded?</text>
  <text x="210" y="665" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#303a36">ansible-playbook with -vvv and --list-tasks</text>

  
  <line x1="520" y1="700" x2="520" y2="731" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="735" width="940" height="155" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4" />
  
  <circle cx="92" cy="812.5" r="24" fill="#db8129" />
  <text x="92" y="821.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(136, 786)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="32" y1="32" x2="46" y2="46" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />
    <line x1="12" y1="20" x2="28" y2="20" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="210" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Where is it defined?</text>
  <text x="210" y="822" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#303a36">
    <tspan x="210" dy="0">grep -rn for the variable name</tspan>
    <tspan x="210" dy="34">across inventories, roles and playbooks</tspan>
  </text>

  
  <rect x="1010" y="255" width="540" height="635" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />

  
  <rect x="1035" y="279" width="490" height="98" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="1280" y="337" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">role vars overriding inventory</text>

  
  <rect x="1035" y="401" width="490" height="98" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="1280" y="459" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">-e overriding everything</text>

  
  <rect x="1035" y="523" width="490" height="98" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="1280" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1280" dy="0">set_fact persisting</tspan>
    <tspan x="1280" dy="32">into later plays</tspan>
  </text>

  
  <rect x="1035" y="645" width="490" height="98" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="1280" y="687" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1280" dy="0">a dictionary replaced</tspan>
    <tspan x="1280" dy="32">instead of merged</tspan>
  </text>

  
  <rect x="1035" y="767" width="490" height="98" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="1280" y="809" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1280" dy="0">two sibling groups defining</tspan>
    <tspan x="1280" dy="32">the same name</tspan>
  </text>

  
  <rect x="50" y="925" width="1500" height="75" rx="16" fill="#207448" />
  <text x="800" y="972" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Use combine with recursive=True to merge dictionaries, instead of replacing them.</text>
</svg>