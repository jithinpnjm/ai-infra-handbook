<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Naming and reading variables: reserved words, prefixes and bracket access</title>
  <desc>Visual infographic explaining variable naming rules, role prefixes, types, reading values, dot versus bracket notation, and the dictionary method collision trap.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="40" dy="0">Naming and reading variables:</tspan>
    <tspan x="40" dy="54">reserved words, prefixes and bracket access</tspan>
  </text>

  
  <text x="1560" y="65" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#607067">Ansible: Up and Running chapter 5</text>

  

  
  <g>
    <rect x="40" y="145" width="740" height="115" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <rect x="62" y="175" width="54" height="54" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 76 215 L 89 187 L 102 215 M 80 207 L 98 207" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" dy="0">letters, digits and underscores;</tspan>
      <tspan x="136" dy="34">cannot start with a digit</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="280" width="740" height="135" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <path d="M 89 317 L 111 326 L 111 348 C 111 361 89 370 89 370 C 89 370 67 361 67 348 L 67 326 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="75" y1="332" x2="103" y2="356" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" dy="0">avoid Python keywords and reserved names:</tspan>
      <tspan x="136" dy="34">environment, name, hosts, tasks,</tspan>
      <tspan x="136" dy="34">connection, port</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="435" width="740" height="205" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <rect x="65" y="505" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="91" y="535" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 77 529 L 77 547 L 91 547" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" dy="0">variable names are not scoped by role,</tspan>
      <tspan x="136" dy="34">so start each name with the owner,</tspan>
      <tspan x="136" dy="34">such as slurm_ or nvidia_:</tspan>
      <tspan x="136" dy="34">the prefix keeps two roles from overwriting</tspan>
      <tspan x="136" dy="34">each other's port or version</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="660" width="740" height="185" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <circle cx="89" cy="752" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 80 746 C 80 738 85 738 85 744 C 85 752 79 758 79 758 M 95 746 C 95 738 100 738 100 744 C 100 752 94 758 94 758" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" dy="0">nvidia_driver_branch: 550 is an int;</tspan>
      <tspan x="136" dy="34">"550.90.07" must be quoted to stay a string:</tspan>
      <tspan x="136" dy="34">a version with two dots is not a number;</tspan>
      <tspan x="136" dy="34">quoting decides the type; when unsure, quote</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="820" y="145" width="740" height="210" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <circle cx="866" cy="182" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="878" y1="194" x2="894" y2="210" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="916" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Reading a value</text>
    
    
    <rect x="844" y="215" width="330" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="860" y="250" font-family="monospace" font-size="24" fill="#303a36">{{ nccl_env.debug }}</text>
    
    
    <rect x="1190" y="215" width="350" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1206" y="250" font-family="monospace" font-size="24" fill="#303a36">{{ nccl_env[ib_hca] }}</text>
    
    
    <rect x="844" y="282" width="220" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="860" y="317" font-family="monospace" font-size="24" fill="#303a36">{{ list[0] }}</text>
  </g>

  
  <g>
    <rect x="820" y="375" width="740" height="140" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <rect x="844" y="420" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="872" y="420" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="844" y="448" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="872" y="448" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <text x="916" y="416" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="916" dy="0">result[stat][mode], result[stat].mode,</tspan>
      <tspan x="916" dy="34">result.stat[mode], result.stat.mode:</tspan>
      <tspan x="916" dy="34" font-family="system-ui, -apple-system, sans-serif">pick one form per playbook</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="535" width="740" height="145" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <path d="M 846 605 C 854 595 862 595 870 605 C 878 615 886 615 894 605" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="916" y="576" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="916" dy="0">join strings inside one expression:</tspan>
      <tspan x="916" dy="34" font-family="monospace">msg: {{ The URL is https://  ~</tspan>
      <tspan x="916" dy="34" font-family="monospace">server_name ~ /index.html }}</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="700" width="740" height="145" rx="10" fill="#e8f1ea" stroke="#b4d1c4" stroke-width="2"/>
    
    <path d="M 856 747 L 844 747 L 844 797 L 856 797" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 882 747 L 894 747 L 894 797 L 882 797" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="916" y="741" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="916" dy="0">when a key contains hyphens, spaces or dots,</tspan>
      <tspan x="916" dy="34">or collides with items, keys, values, copy,</tspan>
      <tspan x="916" dy="34">get, update</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="870" width="1520" height="180" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    
    <polygon points="90,925 119,980 61,980" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="90" y1="943" x2="90" y2="959" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="969" r="3" fill="#db8129"/>
    <text x="146" y="922" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="146" dy="0">my_dict has a key named values: my_dict.values returns Python's bound method</tspan>
      <tspan x="146" dy="34">&lt;built-in method values of dict object&gt;, while my_dict[values] looks up the key;</tspan>
      <tspan x="146" dy="34">a key named items gives a method under dot notation; a key named eth0.100 is a syntax</tspan>
      <tspan x="146" dy="34">error under dot notation; brackets handle both</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1075" width="1520" height="70" rx="10" fill="#207448"/>
    <text x="800" y="1119" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Brackets always look up the key</text>
  </g>
</svg>