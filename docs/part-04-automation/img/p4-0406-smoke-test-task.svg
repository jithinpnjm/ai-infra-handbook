<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>The embedded smoke test, line by line</title>
  <desc>Visual walkthrough of an Ansible embedded smoke test task, detailing each line and its role in verifying live service health.</desc>

  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <text x="80" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The embedded smoke test, line by line</text>

  
  <g id="task-container">
    <rect x="80" y="105" width="1440" height="1085" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(112, 130)">
      <rect x="0" y="0" width="56" height="46" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M12 23 L24 33 L44 13" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Test it! https://localhost:8443/index.html</text>
    </g>

    
    <g transform="translate(112, 195)">
      <rect x="0" y="0" width="1376" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="36" r="16" fill="#207448"/>
      <path d="M26 36 L42 36 M36 30 L42 36 L36 42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="42" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">delegate_to: localhost:</text>
      <text x="390" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the request leaves from the control node, not from the server under test,</text>
      <text x="68" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">so the check sees the same network path a user would use</text>
    </g>

    
    <g transform="translate(112, 316)">
      <rect x="0" y="0" width="1376" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="35" r="16" fill="#207448"/>
      <path d="M26 42 L26 35 C26 30.5 29.5 27 34 27 C38.5 27 42 30.5 42 35 L42 42" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <text x="68" y="43" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">become: false</text>
    </g>

    
    <g transform="translate(112, 402)">
      <rect x="0" y="0" width="1376" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="35" r="16" fill="#207448"/>
      <path d="M26 35 C26 29 34 24 42 30 M42 35 C42 41 34 46 26 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="68" y="43" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">uri: url https://localhost:8443/index.html</text>
    </g>

    
    <g transform="translate(112, 488)">
      <rect x="0" y="0" width="1376" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="38" r="16" fill="#207448"/>
      <path d="M27 38 L32 43 L41 32" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="46" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">validate_certs: false:</text>
      <text x="390" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">accepts the self-signed certificate created earlier</text>
    </g>

    
    <g transform="translate(112, 580)">
      <rect x="0" y="0" width="1376" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="38" r="16" fill="#207448"/>
      <rect x="27" y="29" width="14" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <text x="68" y="46" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">return_content: true:</text>
      <text x="380" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">copies the page body into this.content</text>
    </g>

    
    <g transform="translate(112, 672)">
      <rect x="0" y="0" width="1376" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="35" r="16" fill="#207448"/>
      <path d="M27 28 H41 M27 35 H41 M27 42 H36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="68" y="43" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">register: this</text>
    </g>

    
    <g transform="translate(112, 758)">
      <rect x="0" y="0" width="1376" height="175" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
      
      
      <g transform="translate(24, 26)">
        <polygon points="20,4 38,36 2,36" fill="#db8129"/>
        <line x1="20" y1="16" x2="20" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="31" r="2" fill="#ffffff"/>
      </g>
      
      <text x="76" y="52" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#db8129">failed_when: "Running on  not in this.content"</text>
      
      
      <rect x="76" y="80" width="1260" height="72" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
      <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">fails the task when the page does not contain the words Running on</text>
    </g>

    
    <g transform="translate(112, 949)">
      <rect x="0" y="0" width="1376" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="34" cy="38" r="16" fill="#207448"/>
      <path d="M26 31 L34 25 L42 33 L34 41 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="68" y="46" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">tags: test:</text>
      <text x="235" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">run this check on its own</text>
    </g>

    
    <g transform="translate(775, 1038)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polygon points="-8,33 0,47 8,33" fill="#207448"/>
    </g>
  </g>

  
  <g transform="translate(80, 1215)">
    <rect x="0" y="0" width="1440" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(30, 28)">
      <circle cx="27" cy="27" r="27" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <path d="M16 27 L24 35 L38 19" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <text x="105" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a page that returns a success code with an error message still fails,</text>
    <text x="105" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">because the expected words are missing: short, but a real test</text>
  </g>

  
  <g transform="translate(80, 1350)">
    <rect x="0" y="0" width="1440" height="85" rx="10" fill="#207448"/>
    <text x="720" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Verify the content, not only the status code</text>
  </g>
</svg>