<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>The embedded smoke test, line by line</title>
  <desc>An infographic explaining the Ansible embedded smoke test line by line, verifying content rather than only the status code.</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="60" y="52" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The embedded smoke test, line by line</text>

  
  <rect x="60" y="85" width="1480" height="785" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="80" y="100" width="1440" height="54" rx="8" fill="#207448"/>
  
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="111" width="34" height="32" rx="4"/>
    <polyline points="104,122 111,127 104,132"/>
    <line x1="114" y1="133" x2="123" y2="133"/>
  </g>
  <text x="145" y="137" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Test it! https://localhost:8443/index.html</text>

  
  
  <rect x="80" y="194" width="700" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 225)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="42" r="8"/>
    <circle cx="44" cy="14" r="8"/>
    <path d="M 14 34 V 24 A 14 14 0 0 1 28 10 H 36"/>
    <polyline points="30,4 38,10 30,16"/>
  </g>
  <text x="180" y="228" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0" font-family="monospace" font-weight="bold">delegate_to: localhost: </tspan>
    <tspan x="180" dy="28">the request leaves from the control </tspan>
    <tspan x="180" dy="28">node, not from the server under test, </tspan>
    <tspan x="180" dy="28">so the check sees the same network </tspan>
    <tspan x="180" dy="28">path a user would use</tspan>
  </text>

  
  <rect x="820" y="194" width="700" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(840, 245)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="18" r="12"/>
    <path d="M 8 50 C 8 36 18 34 28 34 C 38 34 48 36 48 50"/>
  </g>
  <text x="920" y="285" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">become: false</text>

  
  
  <rect x="80" y="399" width="700" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 428)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="42" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="20" cy="12" r="2" fill="#207448"/>
    <path d="M 16 32 H 40"/>
  </g>
  <text x="180" y="465" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">uri: url https://localhost:8443/index.html</text>

  
  <rect x="820" y="399" width="700" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(840, 428)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z"/>
    <path d="M 22 28 V 22 A 6 6 0 0 1 34 22"/>
    <rect x="20" y="28" width="16" height="12" rx="2" fill="#207448"/>
  </g>
  <text x="920" y="443" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="920" dy="0" font-family="monospace" font-weight="bold">validate_certs: false: </tspan>
    <tspan x="920" dy="28">accepts the self-signed certificate </tspan>
    <tspan x="920" dy="28">created earlier</tspan>
  </text>

  
  
  <rect x="80" y="554" width="700" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(100, 583)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 6 H 34 L 46 18 V 50 H 10 Z"/>
    <polyline points="34,6 34,18 46,18"/>
    <line x1="18" y1="28" x2="38" y2="28"/>
    <line x1="18" y1="38" x2="32" y2="38"/>
  </g>
  <text x="180" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0" font-family="monospace" font-weight="bold">return_content: true: </tspan>
    <tspan x="180" dy="28">copies the page body into this.content</tspan>
  </text>

  
  <rect x="820" y="554" width="700" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(840, 583)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="14" width="40" height="34" rx="4"/>
    <line x1="8" y1="26" x2="48" y2="26"/>
    <line x1="28" y1="6" x2="28" y2="18"/>
    <polyline points="22,12 28,18 34,12"/>
  </g>
  <text x="920" y="620" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">register: this</text>

  
  
  <rect x="80" y="709" width="700" height="145" rx="10" fill="#fdf8f3" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(100, 750)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28,6 50,48 6,48"/>
    <line x1="28" y1="22" x2="28" y2="34"/>
    <circle cx="28" cy="41" r="2" fill="#db8129"/>
  </g>
  <text x="180" y="742" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0" font-family="monospace" font-weight="bold">failed_when: </tspan>
    <tspan x="180" dy="28" font-family="monospace" font-weight="bold">"Running on  not in this.content": </tspan>
    <tspan x="180" dy="28">fails the task when the page does not </tspan>
    <tspan x="180" dy="28">contain the words Running on</tspan>
  </text>

  
  <rect x="820" y="709" width="700" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(840, 753)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 28 L 26 10 H 46 V 30 L 28 48 Z"/>
    <circle cx="38" cy="18" r="3" fill="#207448"/>
  </g>
  <text x="920" y="770" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="920" dy="0" font-family="monospace" font-weight="bold">tags: test: </tspan>
    <tspan x="920" dy="30">run this check on its own</tspan>
  </text>

  
  <rect x="60" y="910" width="1480" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 930)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <line x1="28" y1="16" x2="28" y2="30"/>
    <circle cx="28" cy="38" r="2" fill="#207448"/>
  </g>
  <text x="170" y="948" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="170" dy="0">a page that returns a success code with an error message still fails, because </tspan>
    <tspan x="170" dy="30">the expected words are missing: short, but a real test</tspan>
  </text>

  
  <rect x="60" y="1045" width="1480" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1087" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Verify the content, not only the status code</text>
</svg>