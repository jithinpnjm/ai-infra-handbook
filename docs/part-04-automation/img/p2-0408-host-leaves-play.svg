<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>By default a failed host leaves the play, and the other hosts keep going</title>
  <desc>Infographic demonstrating Ansible fleet execution where a failed host is removed from the rest of the play while surviving hosts continue.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">By default a failed host leaves the play,</text>
  <text x="50" y="122" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">and the other hosts keep going</text>

  
  <g text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <text x="310" y="215">Task 1</text>
    <text x="510" y="215">Task 2</text>
    <text x="710" y="215">Task 3</text>
  </g>

  
  <g transform="translate(0, 245)">
    
    <rect x="50" y="5" width="150" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(125, 32)">
      <rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="-12" cy="0" r="2.5" fill="#207448"/>
      <circle cx="-4" cy="0" r="2.5" fill="#207448"/>
      <line x1="4" y1="-5" x2="14" y2="-5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="125" y="78" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">gpu01</text>

    
    <rect x="220" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 294 52 L 304 62 L 326 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="420" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 494 52 L 504 62 L 526 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="620" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 694 52 L 704 62 L 726 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <line x1="800" y1="50" x2="920" y2="50" stroke="#207448" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  
  <g transform="translate(0, 375)">
    
    <rect x="50" y="5" width="150" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(125, 32)">
      <rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="-12" cy="0" r="2.5" fill="#207448"/>
      <circle cx="-4" cy="0" r="2.5" fill="#207448"/>
      <line x1="4" y1="-5" x2="14" y2="-5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="125" y="78" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">gpu02</text>

    
    <rect x="220" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 294 52 L 304 62 L 326 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="420" y="5" width="180" height="90" rx="10" fill="#fdf2f2" stroke="#d32f2f" stroke-width="3"/>
    <g transform="translate(510, 32)">
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="510" y="76" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#d32f2f">failed</text>

    
    <rect x="620" y="5" width="280" height="90" rx="10" fill="#e4ebe6" stroke="#8e9c95" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="760" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#586560">
      <tspan x="760" dy="0">removed from the</tspan>
      <tspan x="760" dy="30">rest of the play</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 505)">
    
    <rect x="50" y="5" width="150" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(125, 32)">
      <rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="-12" cy="0" r="2.5" fill="#207448"/>
      <circle cx="-4" cy="0" r="2.5" fill="#207448"/>
      <line x1="4" y1="-5" x2="14" y2="-5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="125" y="78" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">gpu03</text>

    
    <rect x="220" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 294 52 L 304 62 L 326 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="420" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 494 52 L 504 62 L 526 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="620" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 694 52 L 704 62 L 726 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <line x1="800" y1="50" x2="920" y2="50" stroke="#207448" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  
  <g transform="translate(0, 635)">
    
    <rect x="50" y="5" width="150" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(125, 32)">
      <rect x="-22" y="-14" width="44" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="-12" cy="0" r="2.5" fill="#207448"/>
      <circle cx="-4" cy="0" r="2.5" fill="#207448"/>
      <line x1="4" y1="-5" x2="14" y2="-5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="125" y="78" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">gpu04</text>

    
    <rect x="220" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 294 52 L 304 62 L 326 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="420" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 494 52 L 504 62 L 526 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="620" y="5" width="180" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 694 52 L 704 62 L 726 40" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <line x1="800" y1="50" x2="920" y2="50" stroke="#207448" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  
  
  <path d="M 920 295 L 940 295 L 940 685 L 920 685 M 920 555 L 940 555" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  
  <line x1="940" y1="490" x2="1115" y2="490" stroke="#db8129" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <text x="1025" y="465" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">keep going</text>

  
  <g transform="translate(1150, 250)">
    <rect x="0" y="0" width="400" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(200, 100)">
      <rect x="-36" y="-28" width="72" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="-18" cy="-4" r="4" fill="#207448"/>
      <line x1="-2" y1="-4" x2="22" y2="-4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M -22 34 L 22 34 M 0 20 L 0 34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="-36" x2="-32" y2="42" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    
    <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="200" dy="0">unreachable is counted</tspan>
      <tspan x="200" dy="38">separately in the recap,</tspan>
      <tspan x="200" dy="38" font-family="monospace" font-weight="bold">exit code 3</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 770)">
    <rect x="0" y="0" width="1500" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(35, 33)">
      <rect x="0" y="0" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 8 10 L 17 17 L 8 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="22" y1="24" x2="36" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="115" y="45" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0">Exit code 2 when any host failed. any_errors_fatal or</tspan>
      <tspan x="115" dy="32">max_fail_percentage can stop the play sooner.</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 895)">
    <rect x="0" y="0" width="1500" height="85" rx="12" fill="#207448"/>
    <text x="750" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">One failed host leaves the play, while the rest of the fleet carries on.</text>
  </g>
</svg>