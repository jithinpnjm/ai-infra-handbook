<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" width="1600" height="990">
  <title>By default a failed host leaves the play, and the other hosts keep going</title>
  <desc>Infographic illustrating how a failed Ansible host is dropped from subsequent tasks while surviving hosts continue execution.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="990" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">By default a failed host leaves the play,</text>
  <text x="800" y="112" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">and the other hosts keep going</text>

  
  <rect x="60" y="145" width="1480" height="535" rx="16" fill="#ffffff" stroke="#cfe0d3" stroke-width="2" />

  
  <g transform="translate(420, 192)">
    <rect x="-100" y="-32" width="200" height="46" rx="8" fill="#e8f1ea" />
    <text text-anchor="middle" y="2" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Task 1</text>
  </g>
  <g transform="translate(670, 192)">
    <rect x="-100" y="-32" width="200" height="46" rx="8" fill="#e8f1ea" />
    <text text-anchor="middle" y="2" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Task 2</text>
  </g>
  <g transform="translate(920, 192)">
    <rect x="-100" y="-32" width="200" height="46" rx="8" fill="#e8f1ea" />
    <text text-anchor="middle" y="2" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Task 3</text>
  </g>

  
  <g transform="translate(90, 230)">
    
    <rect x="0" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="100" y="47" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">gpu01</text>

    
    <rect x="230" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 305 37 L 322 53 L 355 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="480" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 555 37 L 572 53 L 605 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="730" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 805 37 L 822 53 L 855 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <line x1="945" y1="37" x2="1420" y2="37" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <rect x="1100" y="15" width="180" height="44" rx="22" fill="#207448" />
    <text x="1190" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">keep going</text>
  </g>

  
  <g transform="translate(90, 335)">
    
    <rect x="0" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="100" y="47" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">gpu02</text>

    
    <rect x="230" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 305 37 L 322 53 L 355 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="480" y="0" width="200" height="74" rx="10" fill="#fdf2f2" stroke="#db4437" stroke-width="3" />
    <text x="580" y="47" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db4437">failed</text>

    
    <rect x="730" y="0" width="690" height="74" rx="10" fill="#ecefec" stroke="#a2aba5" stroke-width="2" stroke-dasharray="8 6" />
    <text x="1075" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#73827a">removed from the rest of the play</text>
  </g>

  
  <g transform="translate(90, 440)">
    
    <rect x="0" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="100" y="47" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">gpu03</text>

    
    <rect x="230" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 305 37 L 322 53 L 355 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="480" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 555 37 L 572 53 L 605 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="730" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 805 37 L 822 53 L 855 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <line x1="945" y1="37" x2="1420" y2="37" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(90, 545)">
    
    <rect x="0" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="100" y="47" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">gpu04</text>

    
    <rect x="230" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 305 37 L 322 53 L 355 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="480" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 555 37 L 572 53 L 605 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <rect x="730" y="0" width="200" height="74" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 805 37 L 822 53 L 855 21" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    
    <line x1="945" y1="37" x2="1420" y2="37" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  

  
  <g transform="translate(60, 705)">
    <rect x="0" y="0" width="840" height="150" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="50" cy="75" r="24" fill="#fdf3e8" stroke="#db8129" stroke-width="3" />
    <line x1="50" y1="62" x2="50" y2="78" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="50" cy="89" r="2.5" fill="#db8129" />
    
    <text x="96" y="55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Exit code 2 when any host failed.</text>
    <text x="96" y="92" font-family="monospace" font-size="24" fill="#303a36">any_errors_fatal or max_fail_percentage</text>
    <text x="96" y="125" font-family="sans-serif" font-size="24" fill="#303a36">can stop the play sooner.</text>
  </g>

  
  <g transform="translate(930, 705)">
    <rect x="0" y="0" width="610" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="52" cy="75" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 40 85 L 64 65 M 40 65 L 64 85" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="96" y="68" font-family="sans-serif" font-size="24" fill="#303a36">unreachable is counted separately</text>
    <text x="96" y="106" font-family="sans-serif" font-size="24" fill="#303a36">in the recap, exit code 3</text>
  </g>

  
  <g transform="translate(60, 880)">
    <rect x="0" y="0" width="1480" height="74" rx="12" fill="#207448" />
    <text x="740" y="47" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">One failed host leaves the play, while the rest of the fleet carries on.</text>
  </g>
</svg>