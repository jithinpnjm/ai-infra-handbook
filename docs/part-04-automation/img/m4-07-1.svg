<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Magic variables</title>
  <desc>Data flow from variable and fact sources through the control-node Jinja2 and filter pipeline to generated target configurations.</desc>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 48px;
      font-weight: bold;
      fill: #303a36;
      text-anchor: middle;
    }
    .node-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 30px;
      font-weight: bold;
      fill: #303a36;
      text-anchor: middle;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 24px;
      fill: #303a36;
      text-anchor: middle;
    }
    .step-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text class="title-text" x="800" y="95">Magic variables</text>

  
  <rect x="55" y="160" width="430" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <circle cx="270" cy="210" r="24" fill="#207448" />
  <text class="step-text" x="270" y="210">1</text>

  
  <g id="sources-icon">
    <ellipse cx="270" cy="270" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 244 285 C 244 296 296 296 296 285" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 244 300 C 244 311 296 311 296 300" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="244" y1="270" x2="244" y2="300" stroke="#207448" stroke-width="4" />
    <line x1="296" y1="270" x2="296" y2="300" stroke="#207448" stroke-width="4" />
  </g>

  
  <text class="node-title" x="270" y="375">
    <tspan x="270" dy="0">Variable &amp;</tspan>
    <tspan x="270" dy="38">Fact Sources</tspan>
  </text>

  
  <rect x="75" y="470" width="390" height="315" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text class="code-text" x="270" y="535">
    <tspan x="270" dy="0">(group_vars, host_vars,</tspan>
    <tspan x="270" dy="65">setup facts,</tspan>
    <tspan x="270" dy="65">facts.d/*.fact,</tspan>
    <tspan x="270" dy="65">register, set_fact, -e)</tspan>
  </text>

  
  <line x1="485" y1="485" x2="583" y2="485" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="585" y="160" width="430" height="650" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

  
  <circle cx="800" cy="210" r="24" fill="#db8129" />
  <text class="step-text" x="800" y="210">2</text>

  
  <g id="engine-icon" transform="translate(800, 285)">
    <circle r="14" fill="none" stroke="#db8129" stroke-width="4" />
    <circle r="22" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M -6 -27 L 6 -27 L 4 -22 L -4 -22 Z" fill="#db8129" />
    <path d="M -6 27 L 6 27 L 4 22 L -4 22 Z" fill="#db8129" />
    <path d="M -27 -6 L -27 6 L -22 4 L -22 -4 Z" fill="#db8129" />
    <path d="M 27 -6 L 27 6 L 22 4 L 22 -4 Z" fill="#db8129" />
    <path d="M -20 -20 L -11 -25 L -10 -19 L -17 -16 Z" fill="#db8129" />
    <path d="M 20 20 L 11 25 L 10 19 L 17 16 Z" fill="#db8129" />
    <path d="M -20 20 L -25 11 L -19 10 L -16 17 Z" fill="#db8129" />
    <path d="M 20 -20 L 25 -11 L 19 -10 L 16 -17 Z" fill="#db8129" />
  </g>

  
  <text class="node-title" x="800" y="375">
    <tspan x="800" dy="0">Control-Node Jinja2</tspan>
    <tspan x="800" dy="38">&amp; Filter Pipeline</tspan>
  </text>

  
  <rect x="605" y="470" width="390" height="315" rx="12" fill="#ffffff" stroke="#f0cbb0" stroke-width="2" />
  <text class="code-text" x="800" y="535">
    <tspan x="800" dy="0">(hostvars, groups,</tspan>
    <tspan x="800" dy="65">map(&apos;extract&apos;, ...),</tspan>
    <tspan x="800" dy="65">dict2items,</tspan>
    <tspan x="800" dy="65">combine(recursive=True))</tspan>
  </text>

  
  <line x1="1015" y1="485" x2="1113" y2="485" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1115" y="160" width="430" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="1330" cy="210" r="24" fill="#207448" />
  <text class="step-text" x="1330" y="210">3</text>

  
  <g id="targets-icon" transform="translate(1330, 285)">
    <path d="M -20 -28 L 8 -28 L 20 -16 L 20 28 L -20 28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 8 -28 L 8 -16 L 20 -16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-12" y1="6" x2="12" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-12" y1="16" x2="4" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text class="node-title" x="1330" y="375">
    <tspan x="1330" dy="0">Generated Target</tspan>
    <tspan x="1330" dy="38">Configs</tspan>
  </text>

  
  <rect x="1135" y="470" width="390" height="315" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" />
  <text class="code-text" x="1330" y="560">
    <tspan x="1330" dy="0">(/etc/hosts, slurm.conf,</tspan>
    <tspan x="1330" dy="70">haproxy.cfg,</tspan>
    <tspan x="1330" dy="70">Prometheus file_sd JSON)</tspan>
  </text>
</svg>