<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Holding the driver and kernel so a routine upgrade cannot move them</title>
  <desc>Infographic explaining how dpkg_selections holds the NVIDIA driver and kernel packages together on Debian-family hosts to prevent routine upgrades from breaking compatibility, comparing pinning options.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="66" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0" font-size="48">Holding the driver and kernel </tspan>
    <tspan x="800" dy="56" font-size="48">so a routine upgrade cannot move them</tspan>
  </text>

  
  <g id="story-card">
    <rect x="40" y="160" width="1520" height="110" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(65, 187)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 52,48 4,48" />
      <line x1="28" y1="20" x2="28" y2="34" />
      <circle cx="28" cy="41" r="2" fill="#db8129" />
    </g>
    
    <text x="145" y="206" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0" font-size="26">a Tuesday morning when the package manager upgrades the kernel </tspan>
      <tspan x="145" dy="38" font-size="26">on half the nodes and the NVIDIA driver no longer matches the new kernel</tspan>
    </text>
  </g>

  
  <g id="fix-task-panel">
    <rect x="40" y="310" width="1520" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="65" y="335" width="1470" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 385)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="22" width="36" height="28" rx="5" />
      <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
      <line x1="28" y1="37" x2="28" y2="43" />
    </g>
    
    <text x="165" y="382" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="165" dy="0" font-size="24">dpkg_selections: name {{ item }}, selection hold, </tspan>
      <tspan x="165" dy="36" font-size="24">loop [nvidia-driver-550, linux-image-generic], </tspan>
      <tspan x="165" dy="36" font-size="24">when ansible_facts[os_family] == Debian</tspan>
    </text>

    
    <rect x="65" y="510" width="920" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(85, 537)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 V 14 Z" />
      <polyline points="20,26 26,32 36,20" />
    </g>
    
    <text x="165" y="556" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="165" dy="0" font-size="24">when keeps the task away from RedHat-family hosts, </tspan>
      <tspan x="165" dy="34" font-size="24">which need a different tool for the same job</tspan>
    </text>

    
    <rect x="1025" y="510" width="510" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(1045, 537)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="14" />
      <line x1="34" y1="34" x2="48" y2="48" />
      <line x1="16" y1="24" x2="32" y2="24" />
      <line x1="24" y1="16" x2="24" y2="32" />
    </g>
    
    <text x="1125" y="556" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0" font-size="24">package_facts inspects </tspan>
      <tspan x="1125" dy="34" font-size="24">installed packages</tspan>
    </text>
  </g>

  
  <g id="pinning-options-table">
    <rect x="40" y="680" width="1520" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="65" y="700" width="1470" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(85, 707)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="18" r="8" />
      <line x1="28" y1="26" x2="28" y2="48" />
      <line x1="16" y1="36" x2="40" y2="36" />
    </g>
    <text x="165" y="743" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448" font-size="25">selection: hold:</tspan> package cannot be moved by a routine upgrade
    </text>

    
    <rect x="65" y="780" width="1470" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(85, 787)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 12 L 28 12 L 44 28 L 28 44 L 12 28 Z" />
      <circle cx="20" cy="20" r="3" fill="#207448" />
    </g>
    <text x="165" y="823" font-family="sans-serif" font-size="25" fill="#303a36">
      pinned version with state present: <tspan font-family="monospace" font-weight="bold" fill="#207448" font-size="25">name nvidia-driver-550=550.90.07-1</tspan>
    </text>

    
    <rect x="65" y="860" width="1470" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(85, 867)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 12 A 16 16 0 1 1 14 28" />
      <polyline points="28,4 28,12 36,12" />
      <line x1="28" y1="28" x2="28" y2="38" />
      <polyline points="22,32 28,26 34,32" />
    </g>
    <text x="165" y="903" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448" font-size="25">state: latest</tspan> allows the upgrade
    </text>
  </g>

  
  <rect x="40" y="990" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1028" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Hold the packages that must move together</text>
</svg>