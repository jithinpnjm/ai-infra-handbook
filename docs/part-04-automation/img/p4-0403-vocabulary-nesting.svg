<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Host, inventory, task, play, playbook: how the words nest</title>
  <desc>A nesting diagram showing how playbook, play, task, host, and inventory relate in automation architecture, along with task execution states and declarative state management.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Host, inventory, task, play, playbook: how the words nest</text>

  
  
  <rect x="40" y="125" width="460" height="865" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
