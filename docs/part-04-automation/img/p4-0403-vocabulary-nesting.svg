  <text x="695" y="425" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">task</tspan>
    <tspan font-size="24">: </tspan>
    <tspan font-size="24">a call to a module</tspan>
  </text>

  
  <rect x="635" y="455" width="834" height="315" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>

  
  <text x="660" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">package chrony is installed;</text>
  <text x="660" y="555" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">service chronyd is enabled and running;</text>
  <text x="660" y="610" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">file /etc/chrony.conf has this content;</text>
  <text x="660" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="660" dy="0">the module checks the current state and</tspan>
    <tspan x="660" dy="36">changes only what differs</tspan>
  </text>

  
  
  <rect x="650" y="815" width="350" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="825" y="851" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">ok (already correct)</text>

  <rect x="1030" y="815" width="220" height="54" rx="8" fill="#fff3e6" stroke="#db8129" stroke-width="3"/>
  <text x="1140" y="851" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">changed</text>

  
  <rect x="650" y="888" width="170" height="54" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.8"/>
  <text x="735" y="924" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">failed</text>

  <rect x="850" y="888" width="180" height="54" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.8"/>
  <text x="940" y="924" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">skipped</text>

  <rect x="1060" y="888" width="230" height="54" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.8"/>
  <text x="1175" y="924" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">unreachable</text>

  
  <rect x="40" y="1025" width="1520" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1067" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Describe the state, and let the module decide whether anything needs to move</text>
</svg>