    <tspan x="136" dy="32" font-size="24">the list of machines</tspan>
    <tspan x="136" dy="30" font-size="24">with their groups</tspan>
  </text>

  
  <rect x="64" y="275" width="412" height="690" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(84, 292)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
