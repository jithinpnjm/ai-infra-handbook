    <path d="M 24 6 L 24 10 M 24 38 L 24 42 M 6 24 L 10 24 M 38 24 L 42 24 M 11.3 11.3 L 14.1 14.1 M 33.9 33.9 L 36.7 36.7 M 11.3 36.7 L 14.1 33.9 M 33.9 14.1 L 36.7 11.3"/>
