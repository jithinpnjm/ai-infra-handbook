  <rect x="560" y="125" width="1000" height="865" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <g transform="translate(585, 142)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 40 L 6 10 C 6 6 10 4 14 4 L 46 4 L 46 46 L 14 46 C 10 46 6 44 6 40 Z"/>
    <line x1="14" y1="4" x2="14" y2="46"/>
    <polygon points="24,18 36,25 24,32" fill="#207448"/>
  </g>
  <text x="655" y="180" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">playbook: </tspan>
    <tspan font-size="26">a file that holds one or more plays</tspan>
  </text>

  
  <rect x="585" y="215" width="950" height="750" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(610, 230)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="18"/>
    <circle cx="24" cy="24" r="8"/>
    <line x1="24" y1="2" x2="24" y2="10"/>
    <line x1="24" y1="38" x2="24" y2="46"/>
    <line x1="2" y1="24" x2="10" y2="24"/>
    <line x1="38" y1="24" x2="46" y2="24"/>
  </g>
  <text x="670" y="262" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">play: </tspan>
    <tspan font-size="25">one block that targets a set of hosts</tspan>
  </text>

  
  <rect x="610" y="295" width="180" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="700" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">hosts: gpu</text>

  
  <path d="M 610 319 L 486 319" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  
  <rect x="626" y="365" width="884" height="415" rx="12" fill="#f0f5f1" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <rect x="618" y="371" width="884" height="415" rx="12" fill="#f7faf8" stroke="#207448" stroke-width="1.8"/>
  
