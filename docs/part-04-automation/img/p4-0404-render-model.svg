<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Rendering: a template plus a context gives text, and nothing is installed yet</title>
  <desc>Visual infographic explaining Jinja2 template rendering: combining a template and context variables to produce plain text before anything is applied to a server.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Rendering: a template plus a context</text>
  <text x="40" y="136" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">gives text, and nothing is installed yet</text>

  

  
  <rect x="40" y="175" width="440" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(65, 205)">
    <path d="M 0 0 L 26 0 L 38 12 L 38 50 L 0 50 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 26 0 L 26 12 L 38 12" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="8" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="30" x2="28" y2="30" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="40" x2="20" y2="40" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="125" y="228" font-family="sans-serif" fill="#303a36">
    <tspan x="125" dy="0" font-size="30" font-weight="bold">template</tspan>
    <tspan x="125" dy="34" font-size="24">(the form letter)</tspan>
  </text>

  
  <rect x="40" y="325" width="440" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(65, 355)">
    <rect x="0" y="0" width="38" height="50" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="0" y1="16" x2="38" y2="16" stroke="#207448" stroke-width="2.5" />
    <circle cx="9" cy="27" r="3" fill="#207448" />
    <line x1="17" y1="27" x2="30" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="9" cy="39" r="3" fill="#207448" />
    <line x1="17" y1="39" x2="30" y2="39" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="125" y="366" font-family="sans-serif" fill="#303a36">
    <tspan x="125" dy="0" font-size="30" font-weight="bold">context</tspan>
    <tspan x="125" dy="34" font-size="24">(the mail-merge list:</tspan>
    <tspan x="125" dy="28" font-size="24">variables)</tspan>
  </text>

  
  <path d="M 480 235 L 530 235 L 530 295" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 480 385 L 530 385 L 530 325" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />

  
  <circle cx="530" cy="310" r="15" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <path d="M 523 310 L 537 310 M 530 303 L 530 317" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <line x1="545" y1="310" x2="585" y2="310" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="595" y="175" width="370" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(780, 260)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#207448" stroke-width="5" stroke-dasharray="12 8" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="-24" r="18" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" />
    <circle cx="28" cy="-24" r="8" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="780" y="375" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Jinja2 engine</text>

  
  <line x1="965" y1="310" x2="1025" y2="310" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="1035" y="175" width="525" height="270" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(1065, 205)">
    <path d="M 0 0 L 26 0 L 38 12 L 38 50 L 0 50 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 26 0 L 26 12 L 38 12" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="8" y1="20" x2="30" y2="20" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="30" x2="30" y2="30" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="40" x2="22" y2="40" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="1125" y="242" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">rendered text</text>

  
  <rect x="1055" y="280" width="485" height="145" rx="8" fill="#fdf2e7" stroke="#db8129" stroke-width="1.5" />
  <text x="1075" y="325" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">you only get text,</tspan>
    <tspan x="1075" dy="32">which you can read before</tspan>
    <tspan x="1075" dy="32">anything touches a server</tspan>
  </text>

  
  <rect x="40" y="475" width="1520" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <rect x="58" y="490" width="1484" height="54" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="80" y="526" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">{{ expression }}</tspan>
    <tspan font-family="sans-serif">: output the value of an expression</tspan>
  </text>

  
  <rect x="58" y="553" width="1484" height="54" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="80" y="589" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">{% statement %}</tspan>
    <tspan font-family="sans-serif">: control flow: if, for, set, macro, include, block</tspan>
  </text>

  
  <rect x="58" y="616" width="1484" height="54" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="80" y="652" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">{# comment #}</tspan>
    <tspan font-family="sans-serif">: not rendered</tspan>
  </text>

  
  <rect x="40" y="705" width="1520" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

  
  <rect x="58" y="720" width="1484" height="125" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="80" y="754" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">Environment(undefined=StrictUndefined, trim_blocks=True, lstrip_blocks=True,</tspan>
    <tspan x="80" dy="32">keep_trailing_newline=True);</tspan>
    <tspan x="80" dy="32">for n in nodes: NodeName={{ n.name }} Gres=gpu:{{ n.gpus }} State=UNKNOWN</tspan>
  </text>

  
  <rect x="58" y="855" width="1484" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="887" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="80" dy="0">NodeName=gpu01 Gres=gpu:8 State=UNKNOWN</tspan>
    <tspan x="80" dy="30">NodeName=gpu02 Gres=gpu:8 State=UNKNOWN</tspan>
  </text>

  
  <rect x="40" y="965" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(68, 985)">
    <polygon points="22,0 44,11 22,22 0,11" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <polygon points="22,14 44,25 22,36 0,25" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <polygon points="22,28 44,39 22,50 0,39" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  </g>
  <text x="135" y="1006" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">Ansible, Salt, Flask, dbt, Superset, Cookiecutter, network-automation tools;</tspan>
    <tspan x="135" dy="34">not Helm (Go templates) nor Terraform (HCL)</tspan>
  </text>

  
  <rect x="40" y="1085" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1132" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The template stays the same, each row of data fills the blanks</text>
</svg>