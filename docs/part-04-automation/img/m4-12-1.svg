<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Comparison</title>
  <desc>Architecture comparison showing secret sources Git Repo and External Secret Manager delivering credentials to the Ansible Control Node and securely configuring the Target Host.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="60" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Comparison</text>

  
  <g id="node-git">
    <rect x="60" y="140" width="540" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(90, 165)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="16" y1="12" x2="16" y2="44" />
      <path d="M 16 28 C 32 28 40 20 40 12" />
      <circle cx="16" cy="12" r="6" fill="#e8f1ea" />
      <circle cx="16" cy="44" r="6" fill="#e8f1ea" />
      <circle cx="40" cy="12" r="6" fill="#e8f1ea" />
    </g>
    
    <text x="165" y="195" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="165" dy="0">Git Repo: vars.yml +</tspan>
      <tspan x="165" dy="38">encrypted vault.yml</tspan>
    </text>
    
    <text x="90" y="305" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">($ANSIBLE_VAULT;1.2;AES256;prod)</tspan>
      <tspan x="90" dy="34">or SOPS</tspan>
    </text>
  </g>

  
  <g id="node-vault">
    <rect x="60" y="560" width="540" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(90, 585)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 10 L 28 4 L 48 10 C 48 30 28 48 28 48 C 28 48 8 30 8 10 Z" />
      <circle cx="28" cy="22" r="5" />
      <line x1="28" y1="27" x2="28" y2="35" />
    </g>
    
    <text x="165" y="622" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">External Secret Manager</text>
    
    <text x="90" y="695" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">(HashiCorp Vault /</tspan>
      <tspan x="90" dy="34">Cloud Secret Manager)</tspan>
      <tspan x="90" dy="50">Dynamic Leases, SSH CA,</tspan>
      <tspan x="90" dy="34">BMC Passwords</tspan>
    </text>
  </g>

  
  <g id="node-controller">
    <rect x="1000" y="140" width="540" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1030, 165)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <polyline points="14,28 22,34 14,40" />
      <line x1="26" y1="40" x2="38" y2="40" />
    </g>
    
    <text x="1105" y="195" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1105" dy="0">Ansible Control Node /</tspan>
      <tspan x="1105" dy="38">CI Runner</tspan>
    </text>
    
    <text x="1030" y="305" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1030" dy="0">(--vault-id prod@vault-client.py</tspan>
      <tspan x="1030" dy="34">or OIDC)</tspan>
    </text>
  </g>

  
  <g id="node-target">
    <rect x="1000" y="680" width="540" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1030, 705)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="12" rx="22" ry="8" />
      <path d="M 6 12 V 42 C 6 50 50 50 50 42 V 12" />
      <path d="M 6 27 C 6 35 50 35 50 27" />
    </g>
    
    <text x="1105" y="742" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Target GPU / DB Host</text>
  </g>

  
  <path d="M 600 270 H 982" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 600 750 H 680 V 350 H 982" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  
  <rect x="705" y="520" width="270" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="840" y="558" text-anchor="middle">
    <tspan x="840" dy="0" font-family="monospace" font-size="24" fill="#303a36">lookup hashi_vault</tspan>
    <tspan x="840" dy="34" font-family="sans-serif" font-size="24" fill="#303a36">on control node</tspan>
  </text>

  
  <path d="M 1060 400 V 662" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <rect x="1090" y="500" width="430" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1305" y="542" text-anchor="middle">
    <tspan x="1305" dy="0" font-family="monospace" font-size="24" fill="#303a36">no_log: true, diff: false</tspan>
    <tspan x="1305" dy="36" font-family="monospace" font-size="24" fill="#303a36">EnvironmentFile mode 0600</tspan>
  </text>
</svg>