<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Three hosts on one address collapse into one entry</title>
  <desc>Comparison showing three hosts on one IP collapsing into a single entry without aliases versus remaining three distinct hosts with aliases.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three hosts on one address collapse into one entry</text>

  
  <rect x="50" y="95" width="730" height="835" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="415" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Without aliases</text>

  
  
  <g id="left-input-1">
    <rect x="215" y="195" width="400" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="415" y="231" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">127.0.0.1:2222</text>
  </g>

  
  <g id="left-input-2">
    <rect x="215" y="265" width="400" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="415" y="301" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">127.0.0.1:2200</text>
  </g>

  
  <g id="left-input-3">
    <rect x="215" y="335" width="400" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="415" y="371" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">127.0.0.1:2201</text>
  </g>

  
  
  <path d="M 215 222 H 175 V 470" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <path d="M 615 292 H 645 V 470" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <line x1="415" y1="389" x2="415" y2="470" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g id="left-target">
    <rect x="150" y="470" width="530" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(205, 490)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="4"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <line x1="24" y1="18" x2="42" y2="18"/>
      <circle cx="14" cy="38" r="2" fill="#207448"/>
      <line x1="24" y1="38" x2="42" y2="38"/>
    </g>
    <text x="450" y="530" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">127.0.0.1</text>
  </g>

  
  <text x="415" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Each line overwrites the same entry.</text>

  
  <g id="left-result">
    <rect x="140" y="650" width="550" height="150" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    
    <rect x="180" y="692" width="100" height="66" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <g transform="translate(202, 697)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="4"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <line x1="24" y1="18" x2="42" y2="18"/>
      <circle cx="14" cy="38" r="2" fill="#207448"/>
      <line x1="24" y1="38" x2="42" y2="38"/>
    </g>
    <text x="475" y="736" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">one entry left</text>
  </g>

  
  <rect x="820" y="95" width="730" height="835" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">With aliases</text>

  
  
  <g id="right-input-1">
    <rect x="910" y="195" width="550" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="231" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">vagrant1 ansible_port=2222</text>
  </g>

  
  <g id="right-input-2">
    <rect x="910" y="265" width="550" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="301" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">vagrant2 ansible_port=2200</text>
  </g>

  
  <g id="right-input-3">
    <rect x="910" y="335" width="550" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="371" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">vagrant3 ansible_port=2201</text>
  </g>

  
  
  <path d="M 910 222 H 875 V 470" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <path d="M 1460 292 H 1495 V 470" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <line x1="1185" y1="389" x2="1185" y2="470" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g id="right-target">
    <rect x="845" y="470" width="680" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(900, 490)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 8 H 12 V 24 H 4 V 24 H 12 V 48 H 22"/>
      <path d="M 34 8 H 44 V 24 H 52 V 24 H 44 V 48 H 34"/>
    </g>
    
    <text x="1205" y="508" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">[vagrant:vars]</text>
    
    <text x="1205" y="546" text-anchor="middle" font-family="'SF Mono', 'Courier New', Courier, Consolas, monospace" font-size="24" fill="#303a36">ansible_host=127.0.0.1</text>
  </g>

  
  <g id="right-result">
    <rect x="845" y="650" width="680" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(1062, 668)">
      <circle cx="16" cy="16" r="15" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
      <polyline points="9,16 14,21 23,11" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1208" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">three hosts</text>

    
    
    <rect x="885" y="722" width="180" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(947, 723)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="4"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <line x1="24" y1="18" x2="42" y2="18"/>
      <circle cx="14" cy="38" r="2" fill="#207448"/>
      <line x1="24" y1="38" x2="42" y2="38"/>
    </g>

    
    <rect x="1095" y="722" width="180" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1157, 723)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="4"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <line x1="24" y1="18" x2="42" y2="18"/>
      <circle cx="14" cy="38" r="2" fill="#207448"/>
      <line x1="24" y1="38" x2="42" y2="38"/>
    </g>

    
    <rect x="1305" y="722" width="180" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1367, 723)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="4"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="14" cy="18" r="2" fill="#207448"/>
      <line x1="24" y1="18" x2="42" y2="18"/>
      <circle cx="14" cy="38" r="2" fill="#207448"/>
      <line x1="24" y1="38" x2="42" y2="38"/>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="955" width="1500" height="60" rx="10" fill="#207448"/>
    <text x="800" y="993" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Give each machine its own logical name.</text>
  </g>
</svg>