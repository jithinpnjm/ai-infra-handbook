<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Targeting flags: choose hosts, choose tasks, inspect before running</title>
  <desc>Infographic showing Ansible targeting flags, tagging rules, safety precautions, and execution dimmer controls.</desc>

  
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Targeting flags: choose hosts, choose tasks,</tspan>
    <tspan x="800" dy="48">inspect before running</tspan>
  </text>

  
  <g transform="translate(50, 140)">
    
    <rect x="0" y="0" width="940" height="570" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <path d="M 0 10 Q 0 0 10 0 L 930 0 Q 940 0 940 10 L 940 54 L 0 54 Z" fill="#207448"/>
    <text x="70" y="38" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Command</text>
    <text x="610" y="38" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Effect</text>
    <line x1="580" y1="0" x2="580" y2="570" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <rect x="0" y="54" width="940" height="64" fill="#ffffff"/>
    <text x="24" y="80" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">ansible-playbook site.yml</tspan>
      <tspan x="24" dy="26">  --limit "gpu_h100:&amp;rack_r01"</tspan>
    </text>
    <text x="610" y="93" font-family="sans-serif" font-size="24" fill="#303a36">slice of the fleet</text>
    <line x1="0" y1="118" x2="940" y2="118" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="118" width="940" height="52" fill="#e8f1ea"/>
    <text x="24" y="152" font-family="monospace" font-size="24" fill="#303a36">--tags packages,monitoring</text>
    <text x="610" y="152" font-family="sans-serif" font-size="24" fill="#303a36">only tagged tasks</text>
    <line x1="0" y1="170" x2="940" y2="170" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="170" width="940" height="50" fill="#ffffff"/>
    <text x="24" y="203" font-family="monospace" font-size="24" fill="#303a36">--skip-tags slow</text>
    <line x1="0" y1="220" x2="940" y2="220" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="220" width="940" height="64" fill="#e8f1ea"/>
    <text x="24" y="246" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">--start-at-task</tspan>
      <tspan x="24" dy="26">  "Install baseline packages"</tspan>
    </text>
    <line x1="0" y1="284" x2="940" y2="284" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="284" width="940" height="52" fill="#ffffff"/>
    <text x="24" y="318" font-family="monospace" font-size="24" fill="#303a36">--step</text>
    <text x="610" y="318" font-family="sans-serif" font-size="24" fill="#303a36">confirm each task interactively</text>
    <line x1="0" y1="336" x2="940" y2="336" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="336" width="940" height="64" fill="#e8f1ea"/>
    <text x="24" y="362" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">--list-tasks --list-tags</tspan>
      <tspan x="24" dy="26">  --list-hosts</tspan>
    </text>
    <text x="610" y="375" font-family="sans-serif" font-size="24" fill="#303a36">show what a run would touch</text>
    <line x1="0" y1="400" x2="940" y2="400" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="400" width="940" height="64" fill="#ffffff"/>
    <text x="24" y="426" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">-e "nvidia_driver_branch=555"</tspan>
      <tspan x="24" dy="26">  -e @extra.yml</tspan>
    </text>
    <text x="610" y="439" font-family="sans-serif" font-size="24" fill="#303a36">extra variables</text>
    <line x1="0" y1="464" x2="940" y2="464" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="464" width="940" height="50" fill="#e8f1ea"/>
    <text x="24" y="497" font-family="monospace" font-size="24" fill="#303a36">--syntax-check</text>
    <line x1="0" y1="514" x2="940" y2="514" stroke="#207448" stroke-width="1" stroke-opacity="0.2"/>

    
    <rect x="0" y="514" width="940" height="56" rx="10" fill="#ffffff"/>
    <text x="24" y="550" font-family="monospace" font-size="24" fill="#303a36">-f 50 -vv</text>
    <text x="610" y="550" font-family="sans-serif" font-size="24" fill="#303a36">forks and verbosity</text>
  </g>

  
  <g transform="translate(1020, 140)">
    <rect x="0" y="0" width="530" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 20)">
      <rect x="0" y="6" width="56" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="27" x2="44" y2="27" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="34" cy="27" r="9" fill="#207448"/>
      <circle cx="34" cy="27" r="4" fill="#ffffff"/>
    </g>
    <text x="100" y="56" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      controls on a dimmer switch
    </text>
  </g>

  
  <g transform="translate(1020, 255)">
    <rect x="0" y="0" width="530" height="455" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="490" height="88" rx="8" fill="#e8f1ea"/>
      
      <g transform="translate(18, 22)">
        <path d="M 0 18 L 18 0 L 36 0 L 36 18 L 18 36 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="26" cy="10" r="3" fill="#207448"/>
      </g>
      <text x="74" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="74" dy="0">tags: on tasks, blocks,</tspan>
        <tspan x="74" dy="28">plays, roles and imports</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="490" height="88" rx="8" fill="#e8f1ea"/>
      
      <g transform="translate(18, 22)">
        <circle cx="18" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
        <polyline points="18,10 18,20 26,20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="74" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="74" dy="0">always runs unless you pass</tspan>
        <tspan x="74" dy="28">--skip-tags always</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="490" height="88" rx="8" fill="#e8f1ea"/>
      
      <g transform="translate(18, 22)">
        <path d="M 18 2 L 34 8 L 34 22 C 34 32 18 38 18 38 C 18 38 2 32 2 22 L 2 8 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      </g>
      <text x="74" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="74" dy="0">never runs only when</tspan>
        <tspan x="74" dy="28">you request it</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 322)">
      <rect x="0" y="0" width="490" height="116" rx="8" fill="#e8f1ea"/>
      
      <g transform="translate(18, 30)">
        <line x1="2" y1="6" x2="34" y2="6" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="2" y1="18" x2="34" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="2" y1="30" x2="22" y2="30" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="74" y="34" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="74" dy="0">small, consistent vocabulary:</tspan>
        <tspan x="74" dy="28">packages, config, services,</tspan>
        <tspan x="74" dy="28">firewall, monitoring</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(50, 735)">
    <rect x="0" y="0" width="1500" height="260" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(36, 100)">
      <path d="M 28 4 L 54 48 L 2 48 Z" fill="none" stroke="#db8129" stroke-width="4.5" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="33" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="28" cy="41" r="2.5" fill="#db8129"/>
    </g>

    
    <text x="120" y="54" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">tags are a convenience, not a safety mechanism: a tagged partial run skips dependencies;</tspan>
      <tspan x="120" dy="42">a --tags config run that rewrites a Slurm config on a node whose packages were never updated</tspan>
      <tspan x="120" dy="42">leaves a correct file the node cannot read; use tags to save time on a run you already understand,</tspan>
      <tspan x="120" dy="42">not to skip steps you have not checked</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1025)">
    <rect x="0" y="0" width="1500" height="74" rx="10" fill="#207448"/>
    <text x="750" y="47" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Turn the change down to one host before you turn it up
    </text>
  </g>
</svg>