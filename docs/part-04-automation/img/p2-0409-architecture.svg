<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Split the service into tiers, so each part can change on its own</title>
  <desc>Architecture diagram showing decoupled tiers: web group with nginx, app group with FastAPI instances, db group with PostgreSQL, and Prometheus monitoring.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Split the service into tiers, so each part can change on its own</text>

  
  <rect x="990" y="125" width="310" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1035" cy="170" r="24" />
    <path d="M 1022 170 L 1029 170 L 1033 158 L 1037 182 L 1042 165 L 1045 170 L 1048 170" />
  </g>
  <text x="1075" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Prometheus</text>

  
  
  <line x1="1145" y1="410" x2="1145" y2="225" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-dashed)" />

  
  <rect x="1075" y="252" width="140" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1145" y="281" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#207448">/metrics</text>

  

  
  <rect x="360" y="330" width="280" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" />
  <rect x="380" y="348" width="165" height="42" rx="8" fill="#207448" />
  <text x="462" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">web group</text>

  
  <rect x="970" y="330" width="350" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" />
  <rect x="990" y="348" width="165" height="42" rx="8" fill="#207448" />
  <text x="1072" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">app group</text>

  
  <rect x="1360" y="330" width="200" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,6" />
  <rect x="1380" y="348" width="150" height="42" rx="8" fill="#207448" />
  <text x="1455" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">db group</text>


  
  <rect x="45" y="490" width="145" height="150" rx="12" fill="#e4e8e5" stroke="#707e78" stroke-width="2.5" />
  
  <g stroke="#303a36" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="117" cy="540" r="18" />
    <path d="M 87 590 C 87 566, 147 566, 147 590" />
  </g>
  <text x="117" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Clients</text>


  
  <line x1="190" y1="565" x2="378" y2="565" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  
  <rect x="205" y="542" width="150" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="280" y="573" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448">HTTPS 443</text>


  
  <rect x="380" y="420" width="240" height="290" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g stroke="#207448" stroke-width="3" fill="none">
    <circle cx="500" cy="475" r="24" />
    <circle cx="500" cy="475" r="10" />
    <path d="M 500 445 L 500 451 M 500 499 L 500 505 M 470 475 L 476 475 M 524 475 L 530 475 M 479 454 L 483 458 M 517 492 L 521 496 M 479 496 L 483 492 M 517 458 L 521 454" stroke-linecap="round" />
  </g>
  <text x="500" y="535" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">nginx on web01:</text>
  <text x="500" y="585" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">TLS, rate limits,</text>
  <text x="500" y="625" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">upstream</text>


  
  
  <path d="M 620 565 L 700 565 L 700 470 L 988 470" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <path d="M 620 565 L 700 565 L 700 660 L 988 660" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <rect x="655" y="520" width="300" height="90" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="805" y="555" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#db8129">HTTP 127.0.0.1:8000</text>
  <text x="805" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">over the private network</text>


  
  
  <rect x="990" y="410" width="310" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g stroke="#207448" stroke-width="3" fill="none">
    <rect x="1010" y="445" width="40" height="40" rx="6" />
    <line x1="1010" y1="457" x2="1050" y2="457" />
    <circle cx="1018" cy="451" r="2" fill="#207448" />
    <circle cx="1026" cy="451" r="2" fill="#207448" />
  </g>
  <text x="1065" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">app01:</text>
  <text x="1065" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">uvicorn and FastAPI</text>

  
  <rect x="990" y="605" width="310" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g stroke="#207448" stroke-width="3" fill="none">
    <rect x="1010" y="640" width="40" height="40" rx="6" />
    <line x1="1010" y1="652" x2="1050" y2="652" />
    <circle cx="1018" cy="646" r="2" fill="#207448" />
    <circle cx="1026" cy="646" r="2" fill="#207448" />
  </g>
  <text x="1065" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">app02</text>

  
  <rect x="990" y="745" width="310" height="125" rx="10" fill="#207448" />
  <g fill="#ffffff">
    <circle cx="1015" cy="775" r="5" />
    <text x="1145" y="785" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold">add a host:</text>
    <text x="1145" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px">one line in the inventory</text>
  </g>


  
  <path d="M 1300 470 L 1340 470 L 1340 550 L 1378 550" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <path d="M 1300 660 L 1340 660 L 1340 580 L 1378 580" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />


  
  <rect x="1380" y="430" width="160" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

  
  <g stroke="#207448" stroke-width="3" fill="#e8f1ea">
    <ellipse cx="1460" cy="485" rx="30" ry="12" />
    <path d="M 1430 485 L 1430 535 A 30 12 0 0 0 1490 535 L 1490 485" />
    <ellipse cx="1460" cy="510" rx="30" ry="12" fill="none" />
  </g>

  <text x="1460" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">PostgreSQL</text>
  <text x="1460" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">on db01</text>


  
  <rect x="45" y="960" width="1515" height="90" rx="14" fill="#207448" />
  <text x="802" y="1016" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">Each group changes on its own, so a database upgrade does not take the website down.</text>
</svg>