<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Split the service into tiers, so each part can change on its own</title>
  <desc>Architecture diagram showing tier separation across web group, app group, and db group</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Split the service into tiers,</tspan>
    <tspan x="800" dy="54">so each part can change on its own</tspan>
  </text>

  
  <rect x="975" y="150" width="250" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 1018 222 C 1004 208, 1004 186, 1018 174 C 1024 188, 1034 188, 1034 176 C 1042 192, 1040 214, 1018 222 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <text x="1135" y="215" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Prometheus</text>

  
  <path d="M 1100 405 L 1100 260" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-green)" />
  <text x="1115" y="335" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/metrics</text>

  
  <rect x="40" y="470" width="170" height="180" rx="12" fill="#e6eae8" stroke="#8c9c94" stroke-width="2" />
  
  <circle cx="125" cy="520" r="18" fill="none" stroke="#5a6862" stroke-width="4" />
  <path d="M 95 565 C 95 545, 155 545, 155 565" fill="none" stroke="#5a6862" stroke-width="4" />
  <text x="125" y="612" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Clients</text>

  
  <path d="M 210 560 L 290 560" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="250" y="538" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">HTTPS 443</text>

  
  <rect x="270" y="340" width="340" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="300" y="385" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">web group</text>

  
  <rect x="290" y="420" width="300" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="440" cy="475" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 440 449 L 440 455 M 440 495 L 440 501 M 414 475 L 420 475 M 460 475 L 466 475 M 422 457 L 426 461 M 454 489 L 458 493 M 422 493 L 426 489 M 454 461 L 458 457" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="440" y="555" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="440" dy="0" font-size="30" font-weight="bold">nginx on web01:</tspan>
    <tspan x="440" dy="38" font-size="24">TLS, rate limits,</tspan>
    <tspan x="440" dy="32" font-size="24">upstream</tspan>
  </text>

  
  <path d="M 590 500 L 660 500 L 660 450 L 935 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 590 650 L 660 650 L 660 720 L 935 720" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <text x="795" y="560" text-anchor="middle" fill="#303a36">
    <tspan x="795" dy="0" font-family="monospace" font-size="24" font-weight="bold">HTTP 127.0.0.1:8000</tspan>
    <tspan x="795" dy="34" font-family="sans-serif" font-size="24">over the</tspan>
    <tspan x="795" dy="32" font-family="sans-serif" font-size="24">private network</tspan>
  </text>

  
  <rect x="915" y="340" width="370" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="945" y="385" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">app group</text>

  
  <rect x="935" y="405" width="330" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1075" y="420" width="50" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1075" y1="432" x2="1125" y2="432" stroke="#207448" stroke-width="3" />
  <circle cx="1084" cy="426" r="2" fill="#207448" />
  <circle cx="1092" cy="426" r="2" fill="#207448" />
  <text x="1100" y="500" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1100" dy="0" font-size="30" font-weight="bold">app01:</tspan>
    <tspan x="1100" dy="38" font-size="24">uvicorn and FastAPI</tspan>
  </text>

  
  <rect x="935" y="630" width="330" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1075" y="650" width="50" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1075" y1="662" x2="1125" y2="662" stroke="#207448" stroke-width="3" />
  <circle cx="1084" cy="656" r="2" fill="#207448" />
  <circle cx="1092" cy="656" r="2" fill="#207448" />
  <text x="1100" y="742" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">app02</text>

  
  <rect x="935" y="815" width="330" height="75" rx="8" fill="#207448" />
  <text x="1100" y="846" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="1100" dy="0">add a host: one line</tspan>
    <tspan x="1100" dy="30">in the inventory</tspan>
  </text>

  
  <rect x="1335" y="340" width="225" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1447" y="385" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">db group</text>

  
  <rect x="1350" y="445" width="195" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="1447" cy="485" rx="28" ry="12" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 1419 485 L 1419 530 A 28 12 0 0 0 1475 530 L 1475 485" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1447" y="585" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1447" dy="0" font-size="30" font-weight="bold">PostgreSQL</tspan>
    <tspan x="1447" dy="38" font-size="26">on db01</tspan>
  </text>

  
  <path d="M 1265 492 L 1350 545" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 1265 712 L 1350 605" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="40" y="960" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="998" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    Each group changes on its own, so a database upgrade does not take the website down.
  </text>
</svg>