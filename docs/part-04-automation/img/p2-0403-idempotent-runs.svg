<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The first run changes the host, and the second run finds nothing to change</title>
  <desc>Infographic explaining idempotence: Run 1 installs chrony resulting in CHANGED status, while Run 2 finds chrony present and reports SUCCESS with changed: false.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The first run changes the host,</tspan>
    <tspan x="800" dy="56">and the second run finds nothing to change</tspan>
  </text>

  
  <path d="M 415 175 L 1185 175" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="70" y="205" width="690" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(105, 230)">
      <rect x="4" y="8" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 4 20 L 52 20 M 28 8 L 28 48" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="175" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Run 1</text>

    
    <rect x="95" y="295" width="640" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <text x="125" y="348" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">package: chrony, state present</text>

    
    <rect x="125" y="375" width="220" height="52" rx="26" fill="#fef5ec" stroke="#db8129" stroke-width="3"/>
    <text x="235" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">CHANGED</text>

    
    <text x="125" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">the module installs chrony</text>
  </g>

  
  <g>
    <rect x="840" y="205" width="690" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(875, 230)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 18 28 L 25 35 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="945" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Run 2</text>

    
    <rect x="865" y="295" width="640" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    
    <rect x="895" y="340" width="410" height="52" rx="26" fill="#e8f5e9" stroke="#207448" stroke-width="3"/>
    <text x="1100" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">SUCCESS, changed: false</text>

    
    <text x="895" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="895" dy="0">the module finds chrony already</tspan>
      <tspan x="895" dy="38">present and does nothing</tspan>
    </text>
  </g>

  
  <g>
    <rect x="70" y="610" width="710" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(98, 655)">
      <path d="M 4 28 C 14 14 36 14 46 28 C 36 42 14 42 4 28 Z" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="25" cy="28" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="175" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">--check:</tspan> simulates the run,
      <tspan x="175" dy="38">reports what would change</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="610" width="710" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(848, 655)">
      <rect x="6" y="8" width="16" height="38" rx="2" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="28" y="8" width="16" height="38" rx="2" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="925" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">--diff:</tspan> shows content changes
      <tspan x="925" dy="38">like a Git diff</tspan>
    </text>
  </g>

  
  <g>
    <rect x="70" y="785" width="1460" height="135" rx="12" fill="#eeefee" stroke="#8a948e" stroke-width="2"/>
    <g transform="translate(102, 825)">
      <path d="M 26 4 L 48 46 L 4 46 Z" fill="none" stroke="#8a948e" stroke-width="4" stroke-linejoin="round"/>
      <line x1="26" y1="20" x2="26" y2="30" stroke="#8a948e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="26" cy="39" r="2.5" fill="#8a948e"/>
    </g>
    <text x="180" y="840" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="180" dy="0">Check mode can lie when a task needs an earlier change,</tspan>
      <tspan x="180" dy="38">such as a package that does not exist yet.</tspan>
    </text>
  </g>

  
  <g>
    <rect x="70" y="950" width="1460" height="80" rx="12" fill="#207448"/>
    <g transform="translate(105, 968)">
      <circle cx="22" cy="22" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M 14 22 L 20 28 L 30 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="175" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Idempotent means the second run reports no change.</text>
  </g>
</svg>