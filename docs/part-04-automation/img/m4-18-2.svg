<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Architecture</title>
  <desc>Terraform architecture diagram showing Terraform CLI, Provider plugins, Backend, Registry, lockfile, and target APIs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Architecture</text>

  
   Backend -->
  <path d="M 1020 220 L 1098 220" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

   Provider plugins -->
  <path d="M 850 320 L 850 428" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 480 540 L 678 540" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="8,8" marker-end="url(#arrow)" />
  <text x="580" y="488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="580" dy="0">download</tspan>
    <tspan x="580" dy="28">on init</tspan>
  </text>

  
  <path d="M 1120 540 L 1190 540" fill="none" stroke="#207448" stroke-width="3.5" />

   Cloud APIs -->
  <path d="M 730 650 L 730 715 Q 730 725 720 725 L 300 725 Q 290 725 290 735 L 290 778" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

   Kubernetes / Helm -->
  <path d="M 800 650 L 800 778" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

   Vault / GitHub / ... -->
  <path d="M 1070 650 L 1070 715 Q 1070 725 1080 725 L 1300 725 Q 1310 725 1310 735 L 1310 778" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  
  <g id="node-cli">
    <rect x="380" y="120" width="640" height="200" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <rect x="672" y="140" width="56" height="42" rx="6" fill="none" stroke="#db8129" stroke-width="3.5" />
    <line x1="672" y1="152" x2="728" y2="152" stroke="#db8129" stroke-width="2" />
    <polyline points="682,162 690,168 682,174" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="696" y1="174" x2="708" y2="174" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    
    <text x="700" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Terraform CLI (core)</text>
    <text x="700" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="700" dy="0">parse config, build graph,</tspan>
      <tspan x="700" dy="30">diff, orchestrate</tspan>
    </text>
  </g>

  
  <g id="node-backend">
    <rect x="1100" y="120" width="440" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <ellipse cx="1320" cy="150" rx="24" ry="9" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 1296 150 v 26 c 0 5 10.7 9 24 9 s 24 -4 24 -9 v -26" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 1296 163 c 0 5 10.7 9 24 9 s 24 -4 24 -9" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="1320" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Backend</text>
    <text x="1320" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">state storage + locking</text>
  </g>

  
  
  <g id="node-registry">
    <rect x="60" y="430" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 270 455 L 295 468 L 270 481 L 245 468 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 245 468 v 24 L 270 505 v -24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 295 468 v 24 L 270 505" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="270" y1="481" x2="270" y2="505" stroke="#207448" stroke-width="3.5" />
    
    <text x="270" y="528" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Registry</text>
    <text x="270" y="572" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="270" dy="0">(registry.terraform.io /</tspan>
      <tspan x="270" dy="30">opentofu.org / private)</tspan>
    </text>
  </g>

  
  <g id="node-plugins">
    <rect x="680" y="430" width="440" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="874" y="458" width="52" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="886" y1="446" x2="886" y2="458" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="914" y1="446" x2="914" y2="458" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="900" cy="477" r="7" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="900" y="534" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Provider plugins</text>
    <text x="900" y="582" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(separate binaries, gRPC)</text>
  </g>

  
  <g id="node-lock">
    <rect x="1190" y="430" width="350" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1345" y="470" width="40" height="32" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 1353 470 v -12 c 0 -7 5.4 -12 12 -12 s 12 5 12 12 v 12" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="1365" cy="484" r="3.5" fill="#207448" />
    <line x1="1365" y1="487" x2="1365" y2="494" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="1365" y="534" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">.terraform.lock.hcl</text>
    <text x="1365" y="582" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(version + hashes)</text>
  </g>

  
  
  <g id="node-api1">
    <rect x="60" y="780" width="460" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 270 838 a 13 13 0 0 1 -3 -25 a 21 21 0 0 1 39 -5 a 17 17 0 0 1 15 16 a 14 14 0 0 1 -9 14 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    
    <text x="290" y="890" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud APIs:</text>
    <text x="290" y="940" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">AWS / GCP / Azure / Nebius</text>
  </g>

  
  <g id="node-api2">
    <rect x="570" y="780" width="460" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="800" cy="825" r="16" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="800" cy="825" r="5" fill="#207448" />
    <line x1="800" y1="803" x2="800" y2="847" stroke="#207448" stroke-width="3" />
    <line x1="778" y1="825" x2="822" y2="825" stroke="#207448" stroke-width="3" />
    <line x1="785" y1="810" x2="815" y2="840" stroke="#207448" stroke-width="3" />
    <line x1="785" y1="840" x2="815" y2="810" stroke="#207448" stroke-width="3" />
    
    <text x="800" y="920" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Kubernetes / Helm</text>
  </g>

  
  <g id="node-api3">
    <rect x="1080" y="780" width="460" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 1310 806 l 18 7 v 14 c 0 12 -9 20 -18 24 c -9 -4 -18 -12 -18 -24 v -14 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="1310" cy="824" r="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="1310" y1="828" x2="1310" y2="838" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="1310" y="895" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Vault / GitHub / DNS /</text>
    <text x="1310" y="940" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Datadog / ...</text>
  </g>
</svg>