<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>GitOps principles and architecture</title>
  <desc>Architecture infographic illustrating GitOps principles: Engineer and CI pipelines pushing desired state to a Git configuration repository, and an in-cluster GitOps controller reconciling desired state with the Kubernetes API while reporting status to dashboards and alerts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">GitOps principles and architecture</text>

  

  
  <g id="node-dev">
    <rect x="70" y="120" width="360" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="250" cy="155" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 230 190 A 20 20 0 0 1 270 190" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="250" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Engineer</text>
  </g>

  
  <g id="node-ci">
    <rect x="70" y="290" width="360" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="238" cy="334" r="12" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 238 317 L 238 322 M 238 346 L 238 351 M 221 334 L 226 334 M 250 334 L 255 334" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="262" cy="346" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 262 335 L 262 338 M 262 354 L 262 357 M 251 346 L 254 346 M 270 346 L 273 346" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <text x="250" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">CI</text>
    <text x="250" y="426" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(build, test, scan)</text>
  </g>

  
  <g id="node-config">
    <rect x="1040" y="140" width="480" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="1260" cy="180" r="7" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="1300" cy="180" r="7" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="1260" cy="214" r="7" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1260 187 L 1260 207" stroke="#207448" stroke-width="4" />
    <path d="M 1260 207 C 1260 195 1300 195 1300 187" fill="none" stroke="#207448" stroke-width="4" />
    <text x="1280" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Git: config repo</text>
    <text x="1280" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">(desired state)</text>
  </g>

  
  <g id="node-ctl">
    <rect x="70" y="600" width="460" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 280 635 A 20 20 0 0 1 320 635" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 314 628 L 322 635 L 314 642" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 320 665 A 20 20 0 0 1 280 665" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 286 658 L 278 665 L 286 672" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="300" y="720" font-size="30" font-weight="bold">GitOps controller</tspan>
      <tspan x="300" y="756" font-size="30" font-weight="bold">in cluster</tspan>
      <tspan x="300" y="805" font-size="26">(Argo CD / Flux)</tspan>
    </text>
  </g>

  
  <g id="node-api">
    <rect x="1100" y="600" width="420" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="1310" cy="655" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="1310" cy="655" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1310 626 L 1310 684 M 1282 655 L 1338 655 M 1290 635 L 1330 675 M 1290 675 L 1330 635" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="1310" y="745" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Kubernetes API</text>
  </g>

  
  <g id="node-obs">
    <rect x="840" y="950" width="620" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 890 1022 C 890 1008 893 996 905 996 C 917 996 920 1008 920 1022 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 885 1022 L 925 1022" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="905" cy="1027" r="3" fill="#207448" />
    <text x="1200" y="1020" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Dashboards / Slack / alerts</text>
  </g>

  

  
  <g id="arrow-dev-config">
    <line x1="430" y1="190" x2="1038" y2="190" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="735" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">PR + review</text>
  </g>

  
  <g id="arrow-ci-config">
    <path d="M 430 370 L 900 370 L 900 290 L 1038 290" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="665" y="328" font-size="24" font-weight="bold">build image, push registry</tspan>
      <tspan x="665" y="356" font-size="24" font-weight="bold">open PR bumping tag/digest</tspan>
    </text>
  </g>

  
  <g id="arrow-config-ctl">
    <path d="M 1280 340 L 1280 500 L 300 500 L 300 598" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="790" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">poll / webhook</text>
  </g>

  
  <g id="arrow-ctl-api-compare">
    <line x1="530" y1="660" x2="1098" y2="660" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="815" y="624" font-size="24" font-weight="bold">render (Helm/Kustomize/plain)</tspan>
      <tspan x="815" y="650" font-size="24">compare to live</tspan>
    </text>
  </g>

  
  <g id="arrow-api-ctl-actual">
    <line x1="1100" y1="730" x2="532" y2="730" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="815" y="718" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">actual state</text>
  </g>

  
  <g id="arrow-ctl-api-reconcile">
    <line x1="530" y1="800" x2="1098" y2="800" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    <text x="815" y="788" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">apply / prune / self-heal</text>
  </g>

  
  <g id="arrow-ctl-obs">
    <path d="M 300 860 L 300 1010 L 838 1010" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="570" y="998" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">status, events, notifications</text>
  </g>

</svg>