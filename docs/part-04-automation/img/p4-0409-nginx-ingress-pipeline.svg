<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>NGINX Edge Pipeline: TLS Termination, Rate Limiting, and Upstream Balancing</title>
  <desc>Top-to-bottom and left-to-right request flow pipeline covering Port 80 redirect, Port 443 TLS termination, location routing, rate limiting, proxy header injection, and upstream server dispatch.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">NGINX Edge Pipeline: TLS Termination, Rate Limiting, and Upstream Balancing</text>

  
  
  
  <rect x="50" y="80" width="1500" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="85" cy="115" r="22" fill="#207448"/>
  <text x="85" y="123" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="124" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Edge Entry Points</text>

  
  <rect x="80" y="145" width="640" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(100, 155)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <ellipse cx="24" cy="24" rx="10" ry="20" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="4" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="160" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Port 80 (HTTP)</text>

  
  <rect x="100" y="210" width="600" height="72" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="400" y="238" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="400" dy="0">hits 'listen 80;</tspan>
    <tspan x="400" dy="28">server_name fleet.lab.example.com'</tspan>
  </text>

  
  <line x1="400" y1="282" x2="400" y2="304" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="100" y="312" width="600" height="72" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="400" dy="0">return 301</tspan>
    <tspan x="400" dy="28">https://$host$request_uri</tspan>
  </text>

  
  <rect x="760" y="145" width="760" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(780, 155)">
    <rect x="10" y="18" width="28" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 16 18 V 12 A 8 8 0 0 1 32 12 V 18" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="24" cy="30" r="3" fill="#207448"/>
  </g>
  <text x="835" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Port 443 (HTTPS)</text>

  
  <rect x="780" y="210" width="720" height="50" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1140" y="243" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">hits 'listen 443 ssl http2'</text>

  
  <rect x="780" y="270" width="720" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1140" y="306" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">fullchain.pem   privkey.pem</text>

  
  <rect x="780" y="333" width="720" height="55" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1140" y="369" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">TLSv1.2/TLSv1.3   Strict-Transport-Security</text>


  
  
  
  <line x1="1140" y1="400" x2="1140" y2="442" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>


  
  
  
  <rect x="50" y="445" width="1500" height="320" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="85" cy="480" r="22" fill="#207448"/>
  <text x="85" y="488" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="489" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Routing and Inspection Layer</text>

  
  <rect x="80" y="510" width="460" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(100, 520)">
    <rect x="4" y="6" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 8 26 L 16 26 L 20 14 L 28 34 L 32 26 L 40 26" fill="none" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="155" y="550" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">location = /healthz</text>

  
  <rect x="100" y="575" width="420" height="75" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="310" y="608" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="310" dy="0">access_log off;</tspan>
    <tspan x="310" dy="28">return 200 ok</tspan>
  </text>

  
  <rect x="100" y="665" width="420" height="60" rx="6" fill="#e8f1ea"/>
  <text x="310" y="702" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Health Probe Exit</text>

  
  <rect x="560" y="510" width="960" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <text x="585" y="545" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">location /</text>

  
  <rect x="585" y="560" width="910" height="90" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
  <text x="605" y="595" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">limit_req zone=api burst=40 nodelay</text>
  <text x="605" y="632" font-family="monospace" font-size="24" fill="#303a36">$binary_remote_addr zone=api:10m rate=20r/s</text>

  
  <rect x="585" y="665" width="360" height="65" rx="6" fill="#f5f8f5" stroke="#db8129" stroke-width="2"/>
  <text x="765" y="705" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">HTTP 503</text>

  
  <rect x="970" y="665" width="525" height="65" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1232" y="705" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Forward to Proxy Module</text>


  
  
  
  <line x1="1232" y1="730" x2="1232" y2="780" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>


  
  
  
  <rect x="50" y="785" width="1500" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="85" cy="820" r="22" fill="#207448"/>
  <text x="85" y="828" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="829" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Proxy Header Injection</text>

  
  <rect x="80" y="845" width="860" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <text x="105" y="882" font-family="monospace" font-size="24" fill="#303a36">Host: $host</text>
  <text x="490" y="882" font-family="monospace" font-size="24" fill="#303a36">Connection: empty string</text>

  <text x="105" y="930" font-family="monospace" font-size="24" fill="#303a36">X-Forwarded-For: $proxy_add_x_forwarded_for</text>
  <text x="105" y="978" font-family="monospace" font-size="24" fill="#303a36">X-Forwarded-Proto: $scheme</text>

  
  <rect x="960" y="845" width="560" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(980, 860)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1035" y="890" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">proxy_buffering off</text>
  
  <text x="1035" y="955" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">proxy_read_timeout 300s</text>


  
  
  
  <line x1="800" y1="1020" x2="800" y2="1058" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>


  
  
  
  <rect x="50" y="1065" width="1500" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="85" cy="1100" r="22" fill="#207448"/>
  <text x="85" y="1108" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="120" y="1109" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Upstream Dispatch ('upstream fleetapp')</text>

  
  <rect x="980" y="1080" width="540" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1250" y="1112" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">keepalive 32</text>

  
  <rect x="80" y="1145" width="690" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(100, 1160)">
    <rect x="2" y="4" width="44" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="10" cy="16" r="3" fill="#207448"/>
    <circle cx="18" cy="16" r="3" fill="#207448"/>
    <line x1="28" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="2"/>
    <rect x="2" y="34" width="44" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="10" cy="46" r="3" fill="#207448"/>
    <circle cx="18" cy="46" r="3" fill="#207448"/>
    <line x1="28" y1="46" x2="40" y2="46" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="165" y="1200" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">app01:8000 max_fails=2 fail_timeout=10s</text>

  
  <rect x="830" y="1145" width="690" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(850, 1160)">
    <rect x="2" y="4" width="44" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="10" cy="16" r="3" fill="#207448"/>
    <circle cx="18" cy="16" r="3" fill="#207448"/>
    <line x1="28" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="2"/>
    <rect x="2" y="34" width="44" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="10" cy="46" r="3" fill="#207448"/>
    <circle cx="18" cy="46" r="3" fill="#207448"/>
    <line x1="28" y1="46" x2="40" y2="46" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="915" y="1200" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">app02:8000 max_fails=2 fail_timeout=10s</text>

</svg>