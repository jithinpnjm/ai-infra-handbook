<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>YANG as a data model, and why Ansible arguments should be pure YAML</title>
  <desc>Visual infographic comparing YANG data modeling and wire serialization with Ansible pure YAML dictionary arguments versus legacy key-value strings.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">YANG as a data model,</tspan>
    <tspan x="800" dy="56">and why Ansible arguments should be pure YAML</tspan>
  </text>

  
  <rect x="40" y="150" width="740" height="935" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="170" width="690" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 205)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 4 L 34 4 L 48 18 L 48 52 L 6 52 Z" />
    <path d="M 34 4 L 34 18 L 48 18" />
    <line x1="14" y1="26" x2="32" y2="26" />
    <line x1="14" y1="34" x2="40" y2="34" />
    <line x1="14" y1="42" x2="36" y2="42" />
  </g>
  <text x="160" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="160" dy="0">YANG is a data-modeling</tspan>
    <tspan x="160" dy="36">language, not a wire format</tspan>
    <tspan x="160" dy="36">(RFC 6020 and RFC 7950)</tspan>
  </text>

  
  <rect x="65" y="315" width="690" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 327)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="46" height="42" rx="4" />
    <path d="M 16 22 L 10 27 L 16 32" />
    <path d="M 38 22 L 44 27 L 38 32" />
    <line x1="29" y1="18" x2="25" y2="36" />
  </g>
  <text x="160" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">YANG module defines the model</text>

  
  <line x1="410" y1="395" x2="410" y2="433" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="65" y="435" width="690" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 467)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="28" r="6" />
    <circle cx="42" cy="28" r="6" />
    <path d="M 18 28 L 36 28" />
    <path d="M 12 14 C 12 14 27 6 42 14" stroke-dasharray="3 3" />
    <path d="M 12 42 C 12 42 27 50 42 42" stroke-dasharray="3 3" />
  </g>
  <text x="160" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="160" dy="0">NETCONF and RESTCONF serialize</tspan>
    <tspan x="160" dy="34">modeled data as XML or JSON</tspan>
    <tspan x="160" dy="34">on the wire</tspan>
  </text>

  
  <rect x="65" y="575" width="690" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 592)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="42" height="38" rx="4" />
    <path d="M 6 18 L 48 18" />
    <circle cx="14" cy="13" r="2" fill="#207448" />
    <circle cx="22" cy="13" r="2" fill="#207448" />
  </g>
  <text x="155" y="612" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">module acme-switch declares namespace,</tspan>
    <tspan x="155" dy="30">prefix and import ietf-inet-types</tspan>
  </text>

  
  <rect x="65" y="675" width="690" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 692)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 12 L 46 12" />
    <path d="M 8 42 L 46 42" />
    <line x1="14" y1="8" x2="14" y2="46" />
    <line x1="40" y1="8" x2="40" y2="46" />
    <circle cx="27" cy="27" r="5" />
  </g>
  <text x="155" y="712" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">typedef vlan-id { type uint16 {</tspan>
    <tspan x="155" dy="30">range "1..4094"; } } reusable type</tspan>
  </text>

  
  <rect x="65" y="775" width="690" height="190" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 842)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5" />
    <circle cx="42" cy="22" r="5" />
    <circle cx="42" cy="42" r="5" />
    <path d="M 12 17 L 12 32 L 37 32 L 37 27" />
    <path d="M 12 32 L 12 42 L 37 42" />
  </g>
  <text x="155" y="808" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">leaf: single value;</tspan>
    <tspan x="155" dy="30">leaf-list name-server: scalar list;</tspan>
    <tspan x="155" dy="30">container vlans { list vlan {</tspan>
    <tspan x="155" dy="30">key "id"; unique "name"; ... }</tspan>
    <tspan x="155" dy="30">} keyed hierarchy</tspan>
  </text>

  
  <rect x="65" y="980" width="690" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 997)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="27" cy="27" r="20" />
    <ellipse cx="27" cy="27" rx="10" ry="20" />
    <line x1="7" y1="27" x2="47" y2="27" />
  </g>
  <text x="155" y="1017" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="155" dy="0">OpenConfig and IETF models use these</tspan>
    <tspan x="155" dy="30">ideas to standardise data across vendors</tspan>
  </text>


  
  <rect x="820" y="150" width="740" height="935" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="845" y="170" width="690" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 205)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 10 C 16 6 27 8 27 46 C 20 44 10 44 6 46 Z" />
    <path d="M 48 10 C 38 6 27 8 27 46 C 34 44 44 44 48 46 Z" />
  </g>
  <text x="940" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="940" dy="0">Ansible module arguments</tspan>
    <tspan x="940" dy="38">(Ansible: Up and Running chapter 3)</tspan>
  </text>

  
  <rect x="845" y="315" width="690" height="95" rx="8" fill="#ffffff" stroke="#889988" stroke-width="2" />
  <g transform="translate(865, 336)" stroke="#889988" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="42" height="36" rx="4" />
    <path d="M 14 20 L 22 26 L 14 32" />
    <line x1="26" y1="32" x2="36" y2="32" />
  </g>
  <text x="940" y="372" font-family="ui-monospace, monospace" font-size="25" fill="#303a36">package: name=nginx update_cache=yes</text>

  
  <rect x="845" y="430" width="690" height="235" rx="8" fill="#fffcf7" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(865, 520)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="16" height="14" rx="2" />
    <rect x="28" y="20" width="18" height="12" rx="2" />
    <rect x="28" y="38" width="18" height="12" rx="2" />
    <path d="M 12 20 L 12 44 L 28 44" />
    <path d="M 12 26 L 28 26" />
  </g>
  <text x="945" y="505" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="945" dy="0">package:</tspan>
    <tspan x="945" dy="46">  name: nginx</tspan>
    <tspan x="945" dy="46">  update_cache: true</tspan>
  </text>

  
  <rect x="845" y="685" width="690" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 760)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 27 6 L 46 14 L 46 28 C 46 40 27 48 27 48 C 27 48 8 40 8 28 L 8 14 Z" />
    <path d="M 18 26 L 24 32 L 36 20" />
  </g>
  <text x="940" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="940" dy="0">highlights properly in editors,</tspan>
    <tspan x="940" dy="36">avoids multi-line backslash escaping,</tspan>
    <tspan x="940" dy="36">converts numeric and</tspan>
    <tspan x="940" dy="36">boolean types cleanly</tspan>
  </text>


  
  <rect x="40" y="1110" width="1520" height="70" rx="10" fill="#207448" />
  <text x="800" y="1154" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Describe data once in a model, and pass arguments as dictionaries</text>
</svg>