<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>site.yml play 1, keyword by keyword</title>
  <desc>Infographic explaining Ansible site.yml play 1 structure, keywords, execution order, and multi-play concepts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">site.yml play 1, keyword by keyword</text>

  
  <rect x="40" y="75" width="810" height="1010" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="55" y="90" width="780" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(68, 100)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 2h26l14 14v32H4z"/>
    <path d="M30 2v14h14"/>
    <line x1="12" y1="24" x2="28" y2="24"/>
    <line x1="12" y1="32" x2="36" y2="32"/>
    <line x1="12" y1="40" x2="26" y2="40"/>
  </g>
  <text x="132" y="122" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">name: Baseline configuration for all</text>
  <text x="132" y="150" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cluster nodes (play 1)</text>

  
  <rect x="70" y="162" width="245" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="80" y="186" font-family="monospace" font-size="24" fill="#303a36">hosts: cluster</text>

  <rect x="330" y="162" width="220" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="340" y="186" font-family="monospace" font-size="24" fill="#303a36">become: true</text>

  
  <rect x="70" y="202" width="305" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="80" y="226" font-family="monospace" font-size="24" fill="#303a36">gather_facts: true</text>

  <rect x="390" y="202" width="290" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="400" y="226" font-family="monospace" font-size="24" fill="#303a36">vars: ntp_servers</text>

  
  <rect x="70" y="242" width="375" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="80" y="266" font-family="monospace" font-size="24" fill="#303a36">max_fail_percentage: 10</text>

  <rect x="455" y="242" width="370" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="465" y="266" font-family="monospace" font-size="24" fill="#303a36">any_errors_fatal: false</text>

  
  <rect x="70" y="282" width="575" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="80" y="306" font-family="monospace" font-size="24" fill="#303a36">serial: 20%: batch rolling execution</text>

  
  <rect x="55" y="330" width="780" height="170" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="2.5"/>
  
  <g transform="translate(68, 345)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 4L6 10v14c0 12 16 20 16 20s16-8 16-20V10L22 4z"/>
    <path d="M16 22l4 4 8-8"/>
  </g>
  
  <circle cx="138" cy="368" r="24" fill="#db8129"/>
  <text x="138" y="376" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="175" y="376" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">pre_tasks: assert supported OS:</text>
  <text x="75" y="414" font-family="monospace" font-size="24" fill="#303a36">ansible_facts[os_family] in [Debian, RedHat]</text>
  <text x="75" y="446" font-family="sans-serif" font-size="24" fill="#303a36">with fail_msg, stops the play on an</text>
  <text x="75" y="478" font-family="sans-serif" font-size="24" fill="#303a36">unsupported system before anything is installed</text>

  
  <line x1="445" y1="500" x2="445" y2="518" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="55" y="518" width="780" height="94" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(68, 532)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 14l16-8 16 8-16 8z"/>
    <path d="M6 24l16 8 16-8"/>
    <path d="M6 34l16 8 16-8"/>
  </g>
  
  <circle cx="138" cy="556" r="24" fill="#207448"/>
  <text x="138" y="564" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="175" y="564" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">roles: role common</text>
  <text x="175" y="596" font-family="sans-serif" font-size="24" fill="#303a36">(runs after pre_tasks, 4.11)</text>

  
  <line x1="445" y1="612" x2="445" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="55" y="630" width="780" height="128" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(68, 642)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 14l16-8 16 8v20l-16 8-16-8z"/>
    <line x1="22" y1="22" x2="22" y2="42"/>
    <polyline points="14,10 30,18"/>
  </g>
  
  <circle cx="138" cy="664" r="24" fill="#207448"/>
  <text x="138" y="672" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="175" y="672" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">tasks: Install baseline packages</text>
  <text x="75" y="708" font-family="monospace" font-size="24" fill="#303a36">(package, name [chrony, rsync, htop, tmux],</text>
  <text x="75" y="738" font-family="monospace" font-size="24" fill="#303a36">state present, tags [packages])</text>

  
  <line x1="445" y1="758" x2="445" y2="776" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="55" y="776" width="780" height="188" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(68, 786)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="32" height="34" rx="3"/>
    <path d="M14 4h16v6H14z"/>
    <line x1="12" y1="20" x2="26" y2="20"/>
    <line x1="12" y1="28" x2="30" y2="28"/>
    <line x1="12" y1="34" x2="24" y2="34"/>
  </g>
  
  <circle cx="138" cy="807" r="24" fill="#207448"/>
  <text x="138" y="815" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="175" y="815" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">post_tasks: Record run</text>
  <text x="75" y="850" font-family="monospace" font-size="24" fill="#303a36">(copy content configured</text>
  <text x="75" y="880" font-family="monospace" font-size="24" fill="#303a36">{{ ansible_date_time.iso8601 }}</text>
  <text x="75" y="910" font-family="monospace" font-size="24" fill="#303a36">by {{ lookup(env, USER) }} to</text>
  <text x="75" y="940" font-family="monospace" font-size="24" fill="#303a36">/etc/ansible-last-run mode 0644)</text>

  
  <line x1="445" y1="964" x2="445" y2="982" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="55" y="982" width="780" height="94" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(68, 994)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="10"/>
    <path d="M22 6v4M22 34v4M6 22h4M34 22h4M10 10l3 3M31 31l3 3M10 34l3-3M31 13l3-3"/>
  </g>
  
  <circle cx="138" cy="1010" r="24" fill="#207448"/>
  <text x="138" y="1018" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="175" y="1018" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">handlers: Restart chrony</text>
  <text x="175" y="1052" font-family="monospace" font-size="24" fill="#303a36">(service chronyd restarted)</text>

  

  
  <rect x="880" y="75" width="680" height="245" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(905, 145)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="40" height="36" rx="4"/>
    <line x1="4" y1="24" x2="44" y2="24"/>
    <circle cx="24" cy="15" r="4"/>
    <path d="M16 34v8M32 34v8"/>
  </g>
  <text x="975" y="114" font-family="sans-serif" font-size="24" fill="#303a36">separate plays when different host</text>
  <text x="975" y="148" font-family="sans-serif" font-size="24" fill="#303a36">groups need different steps; a play</text>
  <text x="975" y="182" font-family="sans-serif" font-size="24" fill="#303a36">can act as a gate that checks the</text>
  <text x="975" y="216" font-family="sans-serif" font-size="24" fill="#303a36">state of the world before the</text>
  <text x="975" y="250" font-family="sans-serif" font-size="24" fill="#303a36">destructive play runs, like the</text>
  <text x="975" y="284" font-family="sans-serif" font-size="24" fill="#303a36">security check at an airport</text>

  
  <rect x="880" y="345" width="680" height="175" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(905, 395)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="10" rx="18" ry="6"/>
    <path d="M6 10v14c0 3.3 8 6 18 6s18-2.7 18-6V10"/>
    <path d="M6 24v14c0 3.3 8 6 18 6s18-2.7 18-6V24"/>
  </g>
  <text x="975" y="395" font-family="sans-serif" font-size="24" fill="#303a36">plays run in file order and each</text>
  <text x="975" y="435" font-family="sans-serif" font-size="24" fill="#303a36">covers all of its hosts; a later play</text>
  <text x="975" y="475" font-family="sans-serif" font-size="24" fill="#303a36">can use facts an earlier play gathered</text>

  
  <rect x="880" y="545" width="680" height="255" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(905, 635)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="18"/>
    <polyline points="24,14 24,24 32,28"/>
    <path d="M6 24h-4M42 24h4"/>
  </g>
  <text x="975" y="590" font-family="sans-serif" font-size="24" fill="#303a36">a handler restarting a service</text>
  <text x="975" y="628" font-family="sans-serif" font-size="24" fill="#303a36">should run only after the file that</text>
  <text x="975" y="666" font-family="sans-serif" font-size="24" fill="#303a36">configures it is in place: it runs</text>
  <text x="975" y="704" font-family="sans-serif" font-size="24" fill="#303a36">at a flush point, not in the</text>
  <text x="975" y="742" font-family="sans-serif" font-size="24" fill="#303a36">middle of a task</text>

  
  <rect x="880" y="825" width="680" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(905, 865)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="40" height="16" rx="3"/>
    <rect x="4" y="26" width="40" height="16" rx="3"/>
    <circle cx="12" cy="14" r="2" fill="#207448"/>
    <circle cx="12" cy="34" r="2" fill="#207448"/>
    <line x1="30" y1="14" x2="38" y2="14"/>
    <line x1="30" y1="34" x2="38" y2="34"/>
  </g>
  <text x="975" y="880" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">play 2: hosts slurm_controller,</text>
  <text x="975" y="925" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">become true, tasks</text>

  
  <rect x="40" y="1100" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="1147" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">The file is the whole book, each play is one chapter for one group of machines</text>
</svg>