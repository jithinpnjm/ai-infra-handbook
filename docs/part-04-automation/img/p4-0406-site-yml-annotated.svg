<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1460" width="1600" height="1460">
  <title>site.yml play 1, keyword by keyword</title>
  <desc>Visual explanation of Ansible site.yml play 1 structure, execution order, keywords, and architectural patterns.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#5a7065" />
    </marker>
  </defs>

  
  <rect width="1600" height="1460" fill="#f5f8f5" />

  
  <text x="60" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">site.yml play 1, keyword by keyword</text>

  
  <g id="header-section">
    <rect x="60" y="70" width="1480" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <text x="90" y="108" font-family="ui-monospace, monospace, sans-serif" font-size="26" font-weight="bold" fill="#207448">name: Baseline configuration for all cluster nodes (play 1)</text>

    
    <g transform="translate(90, 126)">
      
      <rect x="0" y="0" width="185" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="14" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">hosts: cluster</text>

      
      <rect x="200" y="0" width="180" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="214" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">become: true</text>

      
      <rect x="395" y="0" width="250" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="409" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">gather_facts: true</text>

      
      <rect x="660" y="0" width="245" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="674" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">vars: ntp_servers</text>
    </g>

    
    <g transform="translate(90, 186)">
      
      <rect x="0" y="0" width="480" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="14" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">serial: 20%: batch rolling execution</text>

      
      <rect x="495" y="0" width="335" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="509" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">max_fail_percentage: 10</text>

      
      <rect x="845" y="0" width="305" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="859" y="31" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">any_errors_fatal: false</text>
    </g>
  </g>

  
  <line x1="800" y1="255" x2="800" y2="273" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  

  
  <g id="block-pre-tasks">
    <rect x="60" y="275" width="1480" height="110" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
    
    <circle cx="106" cy="330" r="22" fill="#db8129" />
    <text x="106" y="338" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(142, 308)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 20 2 L 36 8 L 36 22 C 36 32 20 40 20 40 C 20 40 4 32 4 22 L 4 8 Z" />
      <path d="M 12 20 L 18 26 L 28 14" />
    </g>
    
    <text x="195" y="322" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">pre_tasks: assert supported OS: ansible_facts[os_family] in [Debian, RedHat] with fail_msg,</tspan>
      <tspan x="195" dy="35">stops the play on an unsupported system before anything is installed</tspan>
    </text>
  </g>

  
  <line x1="800" y1="385" x2="800" y2="403" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="block-roles">
    <rect x="60" y="405" width="1480" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="106" cy="445" r="22" fill="#207448" />
    <text x="106" y="453" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(142, 423)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="32" height="32" rx="4" />
      <path d="M 4 16 L 36 16 M 16 16 L 16 38" />
    </g>
    
    <text x="195" y="453" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">roles: role common (runs after pre_tasks, 4.11)</text>
  </g>

  
  <line x1="800" y1="485" x2="800" y2="503" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="block-tasks">
    <rect x="60" y="505" width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="106" cy="560" r="22" fill="#207448" />
    <text x="106" y="568" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(142, 538)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 20 4 L 36 12 L 20 20 L 4 12 Z" />
      <path d="M 4 12 L 4 30 L 20 38 L 20 20" />
      <path d="M 36 12 L 36 30 L 20 38" />
    </g>
    
    <text x="195" y="552" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">tasks: Install baseline packages (package, name [chrony, rsync, htop, tmux],</tspan>
      <tspan x="195" dy="35">state present, tags [packages])</tspan>
    </text>
  </g>

  
  <line x1="800" y1="615" x2="800" y2="633" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="block-post-tasks">
    <rect x="60" y="635" width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="106" cy="690" r="22" fill="#207448" />
    <text x="106" y="698" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(142, 668)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 8 4 L 26 4 L 34 12 L 34 38 L 8 38 Z" />
      <path d="M 26 4 L 26 12 L 34 12" />
      <line x1="14" y1="20" x2="28" y2="20" />
      <line x1="14" y1="28" x2="24" y2="28" />
    </g>
    
    <text x="195" y="682" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">post_tasks: Record run (copy content configured {{ ansible_date_time.iso8601 }}</tspan>
      <tspan x="195" dy="35">by {{ lookup(env, USER) }} to /etc/ansible-last-run mode 0644)</tspan>
    </text>
  </g>

  
  <line x1="800" y1="745" x2="800" y2="763" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="block-handlers">
    <rect x="60" y="765" width="1480" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="106" cy="805" r="22" fill="#207448" />
    <text x="106" y="813" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(142, 785)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="8" />
      <path d="M 20 4 L 20 8 M 20 32 L 20 36 M 4 20 L 8 20 M 32 20 L 36 20 M 9 9 L 12 12 M 28 28 L 31 31 M 9 31 L 12 28 M 28 12 L 31 9" />
    </g>
    
    <text x="195" y="813" font-family="ui-monospace, monospace, sans-serif" font-size="24" fill="#303a36">handlers: Restart chrony (service chronyd restarted)</text>
  </g>

  
  <line x1="800" y1="845" x2="800" y2="863" stroke="#5a7065" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" />

  
  <g id="play-2-strip">
    <rect x="60" y="865" width="1480" height="70" rx="12" fill="#f0f4f1" stroke="#5a7065" stroke-width="2" stroke-dasharray="8,6" />
    
    <g transform="translate(90, 880)" stroke="#5a7065" stroke-width="3" fill="none">
      <rect x="4" y="6" width="32" height="12" rx="2" />
      <rect x="4" y="22" width="32" height="12" rx="2" />
      <circle cx="10" cy="12" r="1.5" fill="#5a7065" />
      <circle cx="10" cy="28" r="1.5" fill="#5a7065" />
    </g>
    
    <text x="145" y="909" font-family="ui-monospace, monospace, sans-serif" font-size="24" font-weight="bold" fill="#303a36">play 2: hosts slurm_controller, become true, tasks</text>
  </g>

  

  
  <g id="strip-gate-analogy">
    <rect x="60" y="955" width="1480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 988)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 6 40 L 6 12 L 18 4 L 30 12 L 30 40" />
      <line x1="6" y1="22" x2="30" y2="22" />
      <line x1="6" y1="32" x2="30" y2="32" />
      <circle cx="18" cy="14" r="3" />
    </g>
    <text x="140" y="1002" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">separate plays when different host groups need different steps; a play can act as a gate that</tspan>
      <tspan x="140" dy="35">checks the state of the world before the destructive play runs, like the security check at an airport</tspan>
    </text>
  </g>

  
  <g id="strip-facts">
    <rect x="60" y="1085" width="1480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 1118)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="18" cy="8" rx="14" ry="5" />
      <path d="M 4 8 L 4 20 C 4 23 10 25 18 25 C 26 25 32 23 32 20 L 32 8" />
      <path d="M 4 20 L 4 32 C 4 35 10 37 18 37 C 26 37 32 35 32 32 L 32 20" />
    </g>
    <text x="140" y="1132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">plays run in file order and each covers all of its hosts; a later play can use facts</tspan>
      <tspan x="140" dy="35">an earlier play gathered</tspan>
    </text>
  </g>

  
  <g id="strip-handlers">
    <rect x="60" y="1215" width="1480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 1248)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="18" cy="20" r="14" />
      <polyline points="18,12 18,20 24,24" />
      <path d="M 32 8 L 36 4 M 36 8 L 32 4" />
    </g>
    <text x="140" y="1262" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">a handler restarting a service should run only after the file that configures it is in place:</tspan>
      <tspan x="140" dy="35">it runs at a flush point, not in the middle of a task</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="60" y="1345" width="1480" height="75" rx="12" fill="#207448" />
    
    <g transform="translate(90, 1362)" stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 4 8 C 12 4 20 6 20 6 C 20 6 28 4 36 8 L 36 34 C 28 30 20 32 20 32 C 20 32 12 30 4 34 Z" />
      <line x1="20" y1="6" x2="20" y2="32" />
    </g>
    
    <text x="800" y="1392" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">The file is the whole book, each play is one chapter for one group of machines</text>
  </g>
</svg>