<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Checking which variable value is used</title>
  <desc>Checklist flow for identifying which variable value wins in Ansible, inspecting variable types, rendering templates offline, and debugging when conditions.</desc>
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Checking which variable value is used</text>

  
  <g id="box-1">
    <rect x="40" y="110" width="740" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="78" cy="148" r="24" fill="#207448"/>
    <text x="78" y="157" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(708, 120)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 14 L 28 4 L 50 14 L 28 24 Z"/>
      <path d="M 6 26 L 28 36 L 50 26"/>
      <path d="M 6 38 L 28 48 L 50 38"/>
    </g>
    
    <text x="120" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">which value is used</text>

    
    <rect x="60" y="194" width="410" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="265" y="229" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">ansible-inventory --host</text>
    <rect x="486" y="194" width="274" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="623" y="229" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">debug var</text>

    
    <rect x="60" y="258" width="338" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="229" y="293" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">-vvv</text>
    <rect x="414" y="258" width="346" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="587" y="293" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">grep</text>

    
    <rect x="60" y="322" width="700" height="126" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="410" y="358" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="410" dy="0">extra vars with -e sit at </tspan>
      <tspan x="410" dy="34">the top of the stack and </tspan>
      <tspan x="410" dy="34">role vars/ also beats inventory</tspan>
    </text>
  </g>

  
  <g id="box-2">
    <rect x="820" y="110" width="740" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="858" cy="148" r="24" fill="#207448"/>
    <text x="858" y="157" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(1488, 120)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 8 C 12 8 8 14 8 20 C 8 26 4 28 2 28 C 4 28 8 30 8 36 C 8 42 12 48 18 48"/>
      <path d="M 38 8 C 44 8 48 14 48 20 C 48 26 52 28 54 28 C 52 28 48 30 48 36 C 48 42 44 48 38 48"/>
      <circle cx="28" cy="28" r="3" fill="#207448"/>
    </g>
    
    <text x="900" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">type</text>

    
    <rect x="840" y="210" width="700" height="238" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1190" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0" font-family="monospace">var | type_debug </tspan>
      <tspan x="1190" dy="48">shows str, int, bool, list, dict</tspan>
    </text>
  </g>

  
  <g id="box-3">
    <rect x="40" y="510" width="740" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="78" cy="548" r="24" fill="#207448"/>
    <text x="78" y="557" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(708, 520)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 6 L 36 6 L 48 18 L 48 50 L 8 50 Z"/>
      <polyline points="36,6 36,18 48,18"/>
      <line x1="16" y1="26" x2="32" y2="26"/>
      <line x1="16" y1="34" x2="40" y2="34"/>
      <line x1="16" y1="42" x2="28" y2="42"/>
    </g>
    
    <text x="120" y="558" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">render template</text>

    
    <rect x="60" y="596" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="410" y="646" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="410" dy="0">ansible localhost -m template </tspan>
      <tspan x="410" dy="40">with -e @vars.yml</tspan>
    </text>

    
    <rect x="60" y="736" width="700" height="108" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="410" y="798" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">inspect /tmp/out</text>
  </g>

  
  <g id="box-4">
    <rect x="820" y="510" width="740" height="360" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="858" cy="548" r="24" fill="#207448"/>
    <text x="858" y="557" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(1488, 520)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 28 L 28 50 L 6 28 Z"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
    </g>
    
    <text x="900" y="558" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">condition</text>

    
    <rect x="840" y="596" width="700" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1190" y="666" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">debug msg of the when expression</text>

    
    <rect x="840" y="736" width="700" height="108" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1190" y="798" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">-vv false_condition</text>
  </g>

  
  <g id="example-strip">
    <rect x="40" y="910" width="1520" height="120" rx="14" fill="#fff9f5" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(68, 942)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 46 L 6 46 Z"/>
      <line x1="28" y1="20" x2="28" y2="32"/>
      <circle cx="28" cy="40" r="2" fill="#207448"/>
    </g>
    <text x="840" y="966" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="840" dy="0">gpu_count 8 from -e is a number, </tspan>
      <tspan x="840" dy="36">from a CSV it is the text 8 and the when comparison fails</tspan>
    </text>
  </g>
</svg>