<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Rendering Slurm node lines from inventory, one host at a time</title>
  <desc>Infographic illustrating the rendering of Slurm configuration node lines from an Ansible inventory template with fallback defaults and per-host variable overrides.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Rendering Slurm node lines from inventory, one host at a time</text>

  
  <g id="left-template">
    <rect x="60" y="110" width="840" height="760" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(90, 135)">
      <rect x="0" y="0" width="46" height="56" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="16" x2="36" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="10" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="10" y1="40" x2="24" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <rect x="90" y="215" width="780" height="54" rx="8" fill="#e8f1ea" />
    <text x="110" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#207448"># {{ ansible_managed }}</text>

    
    <rect x="90" y="285" width="780" height="54" rx="8" fill="#e8f1ea" />
    <text x="110" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">for host in groups[gpu] | sort</text>

    
    <rect x="120" y="355" width="750" height="54" rx="8" fill="#e8f1ea" />
    <text x="140" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">set h = hostvars[host]</text>

    
    <rect x="120" y="425" width="750" height="235" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="140" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">NodeName={{ host }} NodeAddr={{ h.ansible_host }}<tspan x="140" dy="48">CPUs={{ h.ansible_processor_vcpus }}</tspan><tspan x="140" dy="48">RealMemory={{ (h.ansible_memtotal_mb * 0.95) | int }}</tspan><tspan x="140" dy="48">Gres=gpu:{{ h.gpu_count | default(8) }} State=UNKNOWN</tspan></text>

    
    <rect x="90" y="675" width="780" height="54" rx="8" fill="#e8f1ea" />
    <text x="110" y="710" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">endfor</text>

    
    <rect x="90" y="745" width="780" height="105" rx="8" fill="#e8f1ea" />
    <text x="110" y="785" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">PartitionName=gpu Nodes={{ groups[gpu] | join(,) }}<tspan x="110" dy="44">Default=YES MaxTime=INFINITE State=UP</tspan></text>
  </g>

  
  <g id="left-callouts">
    <rect x="60" y="900" width="840" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(90, 930)">
      <circle cx="26" cy="26" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="22" x2="26" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="26" cy="14" r="2.5" fill="#207448" />
    </g>

    
    <text x="90" y="1035" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">loop runs once per name in groups[gpu], sorted alphabetically;<tspan x="90" dy="70">set h gives a short handle on that host's variables;</tspan><tspan x="90" dy="70">RealMemory takes 95 percent of the memory total as an integer</tspan></text>
  </g>

  
  <g id="walk-a">
    <rect x="940" y="110" width="600" height="340" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(975, 140)">
      <rect x="0" y="0" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="14" y="14" width="24" height="24" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <line x1="10" y1="0" x2="10" y2="-8" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="0" x2="26" y2="-8" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="0" x2="42" y2="-8" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="52" x2="10" y2="60" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="52" x2="26" y2="60" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="52" x2="42" y2="60" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="975" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">host without a gpu_count variable:<tspan x="975" dy="50">default(8) fills the gap,</tspan><tspan x="975" dy="50">the line reads Gres=gpu:8</tspan></text>
  </g>

  
  <g id="walk-b">
    <rect x="940" y="480" width="600" height="340" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(975, 510)">
      <rect x="0" y="0" width="52" height="52" rx="8" fill="none" stroke="#db8129" stroke-width="4" />
      <rect x="14" y="14" width="24" height="24" fill="#fff5ed" stroke="#db8129" stroke-width="3" />
      <line x1="10" y1="0" x2="10" y2="-8" stroke="#db8129" stroke-width="4" />
      <line x1="26" y1="0" x2="26" y2="-8" stroke="#db8129" stroke-width="4" />
      <line x1="42" y1="0" x2="42" y2="-8" stroke="#db8129" stroke-width="4" />
      <line x1="10" y1="52" x2="10" y2="60" stroke="#db8129" stroke-width="4" />
      <line x1="26" y1="52" x2="26" y2="60" stroke="#db8129" stroke-width="4" />
      <line x1="42" y1="52" x2="42" y2="60" stroke="#db8129" stroke-width="4" />
    </g>

    
    <text x="975" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">host sets gpu_count to 4:<tspan x="975" dy="54" fill="#db8129" font-weight="bold">the line reads Gres=gpu:4</tspan></text>
  </g>

  
  <g id="note-box">
    <rect x="940" y="850" width="600" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(975, 885)">
      <circle cx="26" cy="26" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 26 L 22 34 L 38 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="975" y="1035" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">the rest of the line stays the same either way</text>
  </g>

  
  
  <path d="M 870 575 L 905 575 L 905 280 L 938 280" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 870 595 L 905 595 L 905 650 L 938 650" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <g id="bottom-bar">
    <rect x="60" y="1310" width="1480" height="70" rx="12" fill="#207448" />
    <text x="800" y="1354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">One loop over the inventory builds the whole node list</text>
  </g>
</svg>