<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Walking the serial play: canary, then 10%, then 25%, with the failure gate</title>
  <desc>Visual explanation of Ansible serial rolling updates, canary staging, and failure thresholds.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Walking the serial play: canary, then 10%,</tspan>
    <tspan x="800" dy="54">then 25%, with the failure gate</tspan>
  </text>

  
  <g id="play-settings">
    <rect x="40" y="140" width="1520" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 157)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8"/>
      <line x1="0" y1="18" x2="56" y2="18"/>
      <circle cx="10" cy="9" r="2.5" fill="#207448"/>
      <circle cx="18" cy="9" r="2.5" fill="#207448"/>
      <circle cx="26" cy="9" r="2.5" fill="#207448"/>
      <path d="M 12 32 L 20 38 L 12 44 M 24 44 L 40 44" stroke-linecap="round"/>
    </g>
    
    <text x="145" y="177" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">hosts: gpu, serial [1, 10%, 25%], max_fail_percentage 5,</tspan>
      <tspan x="145" dy="32">any_errors_fatal true, strategy linear, order shuffle</tspan>
    </text>
  </g>

  

  
  <g id="timeline-step-1">
    <rect x="40" y="250" width="730" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="85" cy="315" r="24" fill="#207448"/>
    <text x="85" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(125, 287)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="8" width="48" height="40" rx="6"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <circle cx="16" cy="18" r="3" fill="#207448"/>
      <circle cx="16" cy="38" r="3" fill="#207448"/>
      <path d="M 28 8 L 28 2 M 28 2 L 36 2" stroke-linecap="round"/>
    </g>
    <text x="205" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">batch 1: one host, the canary,</tspan>
      <tspan x="205" dy="32">runs the whole play alone</tspan>
    </text>
  </g>

  
  <line x1="405" y1="380" x2="405" y2="411" stroke="#207448" stroke-width="4"/>
  <polygon points="397,411 413,411 405,425" fill="#207448"/>

  
  <g id="timeline-step-2">
    <rect x="40" y="425" width="730" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="85" cy="480" r="24" fill="#207448"/>
    <text x="85" y="489" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(125, 452)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 28 4 L 50 14 C 50 36 28 52 28 52 C 28 52 6 36 6 14 Z"/>
      <path d="M 18 28 L 25 35 L 38 21" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="205" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">gate: if it passes</tspan>
    </text>
  </g>

  
  <line x1="405" y1="535" x2="405" y2="566" stroke="#207448" stroke-width="4"/>
  <polygon points="397,566 413,566 405,580" fill="#207448"/>

  
  <g id="timeline-step-3">
    <rect x="40" y="580" width="730" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="85" cy="635" r="24" fill="#207448"/>
    <text x="85" y="644" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(125, 607)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="48" height="18" rx="4"/>
      <rect x="4" y="32" width="48" height="18" rx="4"/>
      <circle cx="14" cy="15" r="2.5" fill="#207448"/>
      <circle cx="14" cy="41" r="2.5" fill="#207448"/>
      <line x1="28" y1="15" x2="44" y2="15"/>
      <line x1="28" y1="41" x2="44" y2="41"/>
    </g>
    <text x="205" y="643" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">batch 2: 10% of the group</tspan>
    </text>
  </g>

  
  <line x1="405" y1="690" x2="405" y2="721" stroke="#207448" stroke-width="4"/>
  <polygon points="397,721 413,721 405,735" fill="#207448"/>

  
  <g id="timeline-step-4">
    <rect x="40" y="735" width="730" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="85" cy="805" r="24" fill="#207448"/>
    <text x="85" y="814" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(125, 777)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <line x1="28" y1="6" x2="28" y2="50"/>
      <circle cx="17" cy="17" r="3" fill="#207448"/>
      <circle cx="39" cy="39" r="3" fill="#207448"/>
    </g>
    <text x="205" y="793" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">gate: max_fail_percentage decides</tspan>
      <tspan x="205" dy="32">whether the play continues</tspan>
    </text>
  </g>

  
  <line x1="405" y1="875" x2="405" y2="906" stroke="#207448" stroke-width="4"/>
  <polygon points="397,906 413,906 405,920" fill="#207448"/>

  
  <g id="timeline-step-5">
    <rect x="40" y="920" width="730" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="85" cy="987" r="24" fill="#207448"/>
    <text x="85" y="996" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(125, 959)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="4" width="44" height="48" rx="4"/>
      <line x1="6" y1="16" x2="50" y2="16"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <line x1="6" y1="40" x2="50" y2="40"/>
      <circle cx="14" cy="10" r="2" fill="#207448"/>
      <circle cx="14" cy="22" r="2" fill="#207448"/>
      <circle cx="14" cy="34" r="2" fill="#207448"/>
      <circle cx="14" cy="46" r="2" fill="#207448"/>
    </g>
    <text x="205" y="975" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">batch 3: 25% until the rest</tspan>
      <tspan x="205" dy="32">of the fleet is covered</tspan>
    </text>
  </g>

  

  
  <g id="setting-serial">
    <rect x="810" y="250" width="750" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(835, 299)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="4" y1="14" x2="52" y2="14"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
      <line x1="4" y1="42" x2="52" y2="42"/>
      <circle cx="18" cy="14" r="5" fill="#e8f1ea"/>
      <circle cx="34" cy="28" r="5" fill="#e8f1ea"/>
      <circle cx="44" cy="42" r="5" fill="#e8f1ea"/>
    </g>
    <text x="910" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">serial limits how many hosts are in play</tspan>
      <tspan x="910" dy="30">at once; accepts integers, percentages</tspan>
      <tspan x="910" dy="30">or a growing list; foundation of rolling</tspan>
      <tspan x="910" dy="30">upgrades and canaries</tspan>
    </text>
  </g>

  
  <g id="setting-max-fail">
    <rect x="810" y="423" width="750" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(835, 447)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 8 44 A 22 22 0 1 1 48 44"/>
      <line x1="28" y1="28" x2="38" y2="18" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="3" fill="#207448"/>
    </g>
    <text x="910" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">max_fail_percentage 5: abort the play</tspan>
      <tspan x="910" dy="32">if more than 5 percent of a batch fails</tspan>
    </text>
  </g>

  
  <g id="setting-any-errors-fatal">
    <rect x="810" y="546" width="750" height="105" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(835, 570)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 16 4 L 40 4 L 52 16 L 52 40 L 40 52 L 16 52 L 4 40 L 4 16 Z"/>
      <line x1="28" y1="16" x2="28" y2="34" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>
    <text x="910" y="591" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">any_errors_fatal true: one failure stops</tspan>
      <tspan x="910" dy="32">all hosts, use for dangerous steps</tspan>
    </text>
  </g>

  
  <g id="setting-strategy-linear">
    <rect x="810" y="669" width="750" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(835, 693)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="10" width="12" height="36" rx="2"/>
      <rect x="22" y="10" width="12" height="36" rx="2"/>
      <rect x="40" y="10" width="12" height="36" rx="2"/>
      <line x1="10" y1="28" x2="46" y2="28" stroke-dasharray="2 3"/>
    </g>
    <text x="910" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">strategy linear: each task completes on all</tspan>
      <tspan x="910" dy="32">batch hosts before the next, default</tspan>
    </text>
  </g>

  
  <g id="setting-order-shuffle">
    <rect x="810" y="792" width="750" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(835, 806)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 6 16 L 22 16 L 34 40 L 48 40" stroke-linecap="round"/>
      <path d="M 6 40 L 22 40 L 34 16 L 48 16" stroke-linecap="round"/>
      <polyline points="42,10 50,16 42,22"/>
      <polyline points="42,34 50,40 42,46"/>
    </g>
    <text x="910" y="844" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">order shuffle</tspan>
    </text>
  </g>

  
  <g id="analogy">
    <rect x="810" y="895" width="750" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(835, 939)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 28 6 L 34 20 L 52 28 L 34 32 L 32 46 L 24 50 L 26 40 L 14 36 L 4 40 L 8 28 L 22 24 Z" stroke-linejoin="round"/>
    </g>
    <text x="910" y="943" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="910" dy="0">a small test flight: if a bad change</tspan>
      <tspan x="910" dy="32">reaches two nodes out of forty, stop there</tspan>
      <tspan x="910" dy="32">and the other thirty-eight are healthy</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1120" width="1520" height="60" rx="10" fill="#207448"/>
    <text x="800" y="1158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">The cost is time, the benefit is that a mistake stays small</tspan>
    </text>
  </g>
</svg>