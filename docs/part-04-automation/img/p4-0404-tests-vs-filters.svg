<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <title>A test answers yes or no, a filter returns a new value</title>
  <desc>Visual comparison showing that a Jinja2 or Ansible test evaluates a yes or no question inside an if, while a filter transforms input into a new value.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A test answers yes or no, a filter returns a new value</text>

  

  
  <g id="col-test">
    <rect x="40" y="100" width="900" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(65, 115)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 52 28 L 28 52 L 4 28 Z"/>
      <path d="M 20 28 L 26 34 L 38 20"/>
    </g>

    
    <text x="140" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Test (after is, usually inside an if)</text>

    
    <rect x="65" y="190" width="850" height="160" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="85" y="240" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">defined, undefined, none, string, number, integer,</tspan>
      <tspan x="85" dy="36">mapping, iterable, sequence, even, odd,</tspan>
      <tspan x="85" dy="36">divisibleby(3), equalto, in, lower, upper, callable</tspan>
    </text>

    
    <rect x="65" y="370" width="850" height="160" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="85" y="420" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">success, failed, changed, skipped, match, search,</tspan>
      <tspan x="85" dy="36">version(2.0, &gt;=), subset, superset, contains, file,</tspan>
      <tspan x="85" dy="36">directory, exists</tspan>
    </text>
  </g>

  
  <g id="col-filter">
    <rect x="980" y="100" width="580" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(1005, 115)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 L 50 8 L 34 28 L 34 46 L 22 52 L 22 28 Z"/>
    </g>

    
    <text x="1080" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Filter (after the pipe)</text>

    
    <rect x="1005" y="190" width="530" height="340" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="1270" y="260" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">returns a new value</text>

    
    <g transform="translate(1035, 310)">
      
      <rect x="10" y="40" width="110" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <line x1="25" y1="65" x2="105" y2="65" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="80" x2="85" y2="80" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="95" x2="95" y2="95" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

      
      <rect x="155" y="20" width="10" height="120" rx="5" fill="#207448"/>

      
      <rect x="195" y="35" width="110" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
      <path d="M 220 55 L 280 55 L 258 75 L 258 95 L 242 100 L 242 75 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      
      <line x1="330" y1="80" x2="350" y2="80" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

      
      <rect x="365" y="35" width="95" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <circle cx="412" cy="80" r="22" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <path d="M 412 66 L 416 76 L 426 80 L 416 84 L 412 94 L 408 84 L 398 80 L 408 76 Z" fill="#207448"/>
    </g>
  </g>

  
  <g id="examples-strip">
    <rect x="40" y="610" width="1520" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(65, 640)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <circle cx="12" cy="12" r="1.5" fill="#207448"/>
      <circle cx="18" cy="12" r="1.5" fill="#207448"/>
      <path d="M 18 28 L 24 34 L 18 40"/>
      <path d="M 38 28 L 32 34 L 38 40"/>
    </g>

    
    <rect x="150" y="627" width="446" height="115" rx="8" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="175" y="672" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="175" dy="0">if gpu_driver_version</tspan>
      <tspan x="175" dy="34">is version(550, &gt;=)</tspan>
    </text>

    
    <rect x="621" y="627" width="446" height="115" rx="8" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="646" y="672" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="646" dy="0">if item is defined</tspan>
      <tspan x="646" dy="34">and item is not none</tspan>
    </text>

    
    <rect x="1092" y="627" width="448" height="115" rx="8" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
    <text x="1316" y="691" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">result is failed</text>
  </g>

  
  <g id="orange-callout">
    <rect x="40" y="800" width="1520" height="165" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(65, 835)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#fff9f2" stroke-width="2"/>
      
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
    </g>

    
    <text x="150" y="852" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" dy="0">use is version when a version number matters, such as a GPU driver check: plain &gt;=</tspan>
      <tspan x="150" dy="34">on version text compares character by character, so one version string can sort after</tspan>
      <tspan x="150" dy="34">a newer one; the version test compares the parts as versions</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1005" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="800" y="1051" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Test for yes or no, filter for a new value</text>
  </g>
</svg>