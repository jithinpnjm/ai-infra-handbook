  <text x="130" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(modules + live/lab)</text>

  
  <rect x="110" y="555" width="350" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
