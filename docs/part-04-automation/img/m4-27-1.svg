<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Architecture</title>
  <desc>Architecture diagram showing Git repo with CI, Terraform, and Ansible managing Infrastructure and Nodes with validation, inventory generation, and nightly drift job.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="3.5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Architecture</text>

  
  <rect x="40" y="110" width="450" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
  <text x="75" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Git repo</text>

  
