  <text x="595" y="888" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">login01, ctl01, gpu01-gpu03</text>

  
  <rect x="570" y="975" width="450" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(595, 995)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6 L42 12 C42 28 32 40 24 44 C16 40 6 28 6 12 Z" />
