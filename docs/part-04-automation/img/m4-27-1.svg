  <text x="665" y="1030" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Validation:</text>
  <text x="595" y="1076" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">nvidia-smi (stub), DCGM,</text>
  <text x="595" y="1114" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Slurm sinfo, NCCL stub</text>

  

  
  <rect x="1070" y="550" width="490" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1095, 570)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="18" />
    <polyline points="24 14, 24 24, 32 24" />
    <path d="M40 10 A22 22 0 0 1 46 24" />
    <polyline points="42 26, 46 24, 48 29" />
  </g>
  <text x="1165" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Nightly drift job</text>
  <text x="1095" y="668" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">terraform plan -detailed-exitcode</text>
  <text x="1095" y="718" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">ansible --check --diff</text>

  

