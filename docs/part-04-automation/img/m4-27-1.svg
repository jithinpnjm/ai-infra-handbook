  <text x="595" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(Docker or cloud)</text>

  
  <rect x="570" y="595" width="450" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
