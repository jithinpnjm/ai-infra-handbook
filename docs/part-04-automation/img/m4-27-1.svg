  <rect x="570" y="780" width="450" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(595, 800)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
