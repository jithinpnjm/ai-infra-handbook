      <path d="M 14 36 L 2 40" />
      <path d="M 42 24 L 54 20" />
      <path d="M 42 30 L 54 30" />
      <path d="M 42 36 L 54 40" />
      <path d="M 20 18 L 14 10" />
      <path d="M 36 18 L 42 10" />
    </g>
    <text x="144" y="957" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">TF_LOG=DEBUG logs</text>
  </g>

  

  
  <g id="node-st">
    <rect x="630" y="330" width="280" height="210" rx="14" fill="#fdf2e9" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(742, 350)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="24" width="40" height="30" rx="6" fill="#fdf2e9" />
      <path d="M 16 24 L 16 14 A 12 12 0 0 1 40 14 L 40 6" />
      <circle cx="28" cy="36" r="3" fill="#db8129" />
      <line x1="28" y1="39" x2="28" y2="45" />
    </g>
    <text x="770" y="450" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">State file</text>
    <text x="770" y="490" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(plaintext)</text>
  </g>

  

  
  <g id="node-h">
    <rect x="980" y="95" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1004, 124)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="5" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <path d="M 12 28 L 20 34 L 12 40" />
      <line x1="26" y1="40" x2="38" y2="40" />
    </g>
    <text x="1080" y="145" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1080" dy="0">Shell history, CI logs,</tspan>
      <tspan x="1080" dy="36">process list</tspan>
    </text>
  </g>

  
  <g id="node-p">
    <rect x="980" y="235" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1004, 264)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="46" rx="4" />
      <path d="M 32 6 L 48 22 L 32 22 Z" />
      <line x1="16" y1="28" x2="28" y2="28" />
