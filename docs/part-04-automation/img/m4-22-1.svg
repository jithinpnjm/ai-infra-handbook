      <tspan x="1080" dy="0">Backend storage</tspan>
      <tspan x="1080" dy="36">&amp; backups</tspan>
    </text>
  </g>

  
  <g id="node-l">
    <rect x="980" y="525" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1004, 554)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
      <circle cx="16" cy="28" r="8" />
      <circle cx="44" cy="16" r="6" />
      <circle cx="44" cy="40" r="6" />
