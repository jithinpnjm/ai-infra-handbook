<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Where secrets leak</title>
  <desc>Infographic illustrating secret leakage paths in Terraform configurations, state files, plan files, backend storage, remote state, outputs, shell history, and logs.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where secrets leak</text>

  

  
  <path d="M 560 185 L 595 185 L 595 370 L 630 370" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 560 435 L 630 435" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 560 500 L 630 500" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 910 370 L 945 370 L 945 292.5 L 980 292.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 910 437.5 L 980 437.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 910 505 L 945 505 L 945 582.5 L 980 582.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 560 152.5 L 980 152.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 560 802.5 L 980 802.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 560 947.5 L 980 947.5" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  

  
  <g id="node-s1">
    <rect x="40" y="95" width="520" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(64, 124)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
      <line x1="4" y1="12" x2="52" y2="12" />
      <circle cx="20" cy="12" r="5" fill="#e8f1ea" />
      <line x1="4" y1="28" x2="52" y2="28" />
      <circle cx="38" cy="28" r="5" fill="#e8f1ea" />
      <line x1="4" y1="44" x2="52" y2="44" />
      <circle cx="16" cy="44" r="5" fill="#e8f1ea" />
    </g>
    <text x="144" y="135" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Variables</text>
    <text x="144" y="167" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">(tfvars, TF_VAR_*,</tspan>
      <tspan x="144" dy="28">CLI -var)</tspan>
    </text>
  </g>

  
  <g id="node-s2">
    <rect x="40" y="235" width="520" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(64, 255)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="14" />
      <line x1="32" y1="32" x2="52" y2="52" />
      <line x1="44" y1="44" x2="50" y2="38" />
      <line x1="49" y1="49" x2="55" y2="43" />
    </g>
    <text x="144" y="272" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="144" dy="0">Resources that</tspan>
      <tspan x="144" dy="34">generate secrets</tspan>
    </text>
    <text x="144" y="342" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">(random_password,</tspan>
      <tspan x="144" dy="28">tls_private_key,</tspan>
      <tspan x="144" dy="28">aws_iam_access_key,</tspan>
      <tspan x="144" dy="28">db passwords)</tspan>
    </text>
  </g>

  
  <g id="node-s3">
    <rect x="40" y="470" width="520" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(64, 490)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
