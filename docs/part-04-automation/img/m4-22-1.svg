    </g>
    <text x="144" y="507" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="144" dy="0">Data sources</tspan>
      <tspan x="144" dy="34">reading secrets</tspan>
    </text>
    <text x="144" y="582" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="144" dy="0">(vault_kv_secret,</tspan>
      <tspan x="144" dy="30">aws_secretsmanager_</tspan>
      <tspan x="144" dy="30">secret_version)</tspan>
    </text>
  </g>

  
  <g id="node-o">
    <rect x="40" y="745" width="520" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(64, 774)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
