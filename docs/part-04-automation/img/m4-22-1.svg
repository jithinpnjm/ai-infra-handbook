      <path d="M 42 20 L 50 28 L 42 36" />
    </g>
    <text x="144" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Outputs</text>
  </g>

  
  <g id="node-v">
    <rect x="40" y="890" width="520" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(64, 919)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
