      <tspan x="1080" dy="36">CI artefacts</tspan>
    </text>
  </g>

  
  <g id="node-b">
    <rect x="980" y="380" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
