      <line x1="24" y1="32" x2="38" y2="38" />
    </g>
    <text x="1080" y="573" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">terraform_remote_state</text>
    <text x="1080" y="609" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">readers</text>
  </g>

  
  <g id="node-l2">
    <rect x="980" y="745" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1004, 774)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
      <rect x="6" y="8" width="30" height="40" rx="3" />
      <line x1="14" y1="18" x2="28" y2="18" />
      <line x1="14" y1="26" x2="28" y2="26" />
      <line x1="14" y1="34" x2="24" y2="34" />
      <circle cx="44" cy="22" r="6" />
      <path d="M 38 40 A 8 8 0 0 1 50 40" />
    </g>
    <text x="1080" y="795" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1080" dy="0">Logs, remote state</tspan>
      <tspan x="1080" dy="36">consumers</tspan>
    </text>
  </g>

  
  <g id="node-logs">
    <rect x="980" y="890" width="580" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1004, 919)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
