<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Testing strategy</title>
  <desc>Testing strategy pipeline showing static analysis, policy tests, unit tests, integration tests in sandbox, and production canary and smoke checks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Testing strategy</text>

  
  <g id="stage-static">
    <rect x="120" y="120" width="1360" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="180" cy="180" r="24" fill="#207448" />
    <text x="180" y="180" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 236 156 h 24 l 12 12 v 36 h -36 z" />
      <path d="M 260 156 v 12 h 12" />
      <line x1="244" y1="176" x2="256" y2="176" />
      <line x1="244" y1="186" x2="258" y2="186" />
      <line x1="244" y1="196" x2="252" y2="196" />
      <circle cx="270" cy="192" r="9" />
      <line x1="277" y1="199" x2="285" y2="207" />
    </g>
    
    <line x1="312" y1="140" x2="312" y2="220" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    
    <text x="340" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Static:</text>
    <text x="340" y="208" font-family="monospace" font-size="24" fill="#303a36">fmt, validate, tflint, checkov/trivy, terraform-docs, secret scan</text>
  </g>

  
  <line x1="800" y1="240" x2="800" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="stage-policy">
    <rect x="120" y="320" width="1360" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="180" cy="380" r="24" fill="#207448" />
    <text x="180" y="380" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 260 354 c 14 0 24 5 24 5 v 22 c 0 16 -12 24 -24 27 c -12 -3 -24 -11 -24 -27 v -22 s 10 -5 24 -5 z" />
      <path d="M 250 379 l 7 7 l 15 -15" />
    </g>
    
    <line x1="312" y1="340" x2="312" y2="420" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    
    <text x="340" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Policy tests:</text>
    <text x="340" y="408" font-family="monospace" font-size="24" fill="#303a36">Conftest/OPA/Sentinel on plan.json</text>
  </g>

  
  <line x1="800" y1="440" x2="800" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="stage-unit">
    <rect x="120" y="520" width="1360" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="180" cy="580" r="24" fill="#207448" />
    <text x="180" y="580" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="254" y1="554" x2="266" y2="554" />
      <path d="M 257 554 v 14 l -17 32 a 4 4 0 0 0 3.5 6 h 33 a 4 4 0 0 0 3.5 -6 l -17 -32 v -14" />
      <line x1="247" y1="588" x2="273" y2="588" />
      <circle cx="260" cy="596" r="2.5" fill="#207448" />
    </g>
    
    <line x1="312" y1="540" x2="312" y2="620" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    
    <text x="340" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Unit tests:</text>
    <text x="340" y="608" font-family="monospace" font-size="24" fill="#303a36">terraform test (plan, mocks), validation tests</text>
  </g>

  
  <line x1="800" y1="640" x2="800" y2="720" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="stage-integration">
    <rect x="120" y="720" width="1360" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="180" cy="780" r="24" fill="#207448" />
    <text x="180" y="780" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="236" y="756" width="22" height="20" rx="4" />
      <rect x="262" y="784" width="22" height="20" rx="4" />
      <path d="M 247 776 v 18 h 15" />
      <circle cx="247" cy="766" r="3" fill="#207448" />
      <circle cx="273" cy="794" r="3" fill="#207448" />
    </g>
    
    <line x1="312" y1="740" x2="312" y2="820" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25" />
    
    <text x="340" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Integration tests in sandbox</text>
    <text x="340" y="808" font-family="sans-serif" font-size="24" fill="#303a36">(apply, assert, destroy; nightly/release)</text>
  </g>

  
  <line x1="800" y1="840" x2="800" y2="920" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="stage-production">
    <rect x="120" y="920" width="1360" height="120" rx="16" ry="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="180" cy="980" r="24" fill="#db8129" />
    <text x="180" y="980" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="242" y="962" width="36" height="36" rx="5" />
      
      <line x1="251" y1="954" x2="251" y2="962" />
      <line x1="260" y1="954" x2="260" y2="962" />
      <line x1="269" y1="954" x2="269" y2="962" />
      <line x1="251" y1="998" x2="251" y2="1006" />
      <line x1="260" y1="998" x2="260" y2="1006" />
      <line x1="269" y1="998" x2="269" y2="1006" />
      <line x1="234" y1="971" x2="242" y2="971" />
      <line x1="234" y1="980" x2="242" y2="980" />
      <line x1="234" y1="989" x2="242" y2="989" />
      <line x1="278" y1="971" x2="286" y2="971" />
      <line x1="278" y1="980" x2="286" y2="980" />
      <line x1="278" y1="989" x2="286" y2="989" />
      
      <path d="M 247 980 h 4 l 3 -7 l 5 14 l 4 -7 h 7" />
    </g>
    
    <line x1="312" y1="940" x2="312" y2="1020" stroke="#db8129" stroke-width="1.5" stroke-opacity="0.35" />
    
    <text x="340" y="966" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Production canary &amp; smoke checks</text>
    <text x="340" y="1008" font-family="sans-serif" font-size="24" fill="#303a36">(health of deployed GPU capacity)</text>
  </g>
</svg>