<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Development versus Production Stack Architecture</title>
  <desc>A side-by-side comparison diagram contrasting a local development setup on a laptop with a multi-tier production architecture.</desc>

  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Development versus Production Stack Architecture</text>

  
  <g id="panel-development">
    
    <rect x="60" y="110" width="710" height="1325" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 60 122 A 12 12 0 0 1 72 110 L 758 110 A 12 12 0 0 1 770 122 L 770 180 L 60 180 Z" fill="#207448"/>
    <text x="415" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Developer Laptop (runserver)</text>

    
    <rect x="85" y="200" width="660" height="135" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(110, 220)">
      <circle cx="16" cy="16" r="14"/>
      <line x1="2" y1="16" x2="30" y2="16"/>
      <ellipse cx="16" cy="16" rx="7" ry="14"/>
    </g>
    <text x="155" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Inbound</text>
    <text x="110" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Browser on localhost:8000</text>
    <text x="110" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(Plain HTTP, no TLS, no rate limit).</text>

    
    <rect x="85" y="355" width="660" height="265" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(110, 375)">
      <rect x="2" y="4" width="28" height="24" rx="3"/>
      <line x1="2" y1="11" x2="30" y2="11"/>
      <path d="M 7 17 L 12 21 L 7 25"/>
      <line x1="15" y1="25" x2="22" y2="25"/>
    </g>
    <text x="155" y="399" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Web &amp; App Layer</text>
    <text x="110" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Single foreground process</text>
    <text x="110" y="474" font-family="monospace" font-size="24" fill="#303a36">'python manage.py runserver 0.0.0.0:8000'</text>
    <text x="110" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(single-threaded, terminates on</text>
    <text x="110" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">terminal exit, no supervisor,</text>
    <text x="110" y="576" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">no concurrency).</text>

    
    <rect x="85" y="640" width="660" height="195" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(110, 660)">
      <ellipse cx="16" cy="8" rx="14" ry="5"/>
      <path d="M 2 8 L 2 24 A 14 5 0 0 0 30 24 L 30 8"/>
      <path d="M 2 16 A 14 5 0 0 0 30 16"/>
    </g>
    <text x="155" y="684" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Storage Layer</text>
    <text x="110" y="726" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Local file <tspan font-family="monospace">'db.sqlite3'</tspan></text>
    <text x="110" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(file lock concurrency bottleneck,</text>
    <text x="110" y="794" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">no network isolation).</text>

    
    <rect x="85" y="855" width="660" height="120" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(110, 875)">
      <rect x="4" y="6" width="24" height="20" rx="2"/>
      <line x1="9" y1="2" x2="9" y2="6"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="23" y1="2" x2="23" y2="6"/>
      <line x1="9" y1="26" x2="9" y2="30"/>
      <line x1="16" y1="26" x2="16" y2="30"/>
      <line x1="23" y1="26" x2="23" y2="30"/>
      <line x1="6" y1="24" x2="26" y2="8" stroke="#889890" stroke-width="2"/>
    </g>
    <text x="155" y="899" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Caching</text>
    <text x="110" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">None.</text>

    
    <rect x="85" y="995" width="660" height="135" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(110, 1015)">
      <circle cx="10" cy="16" r="7"/>
      <line x1="17" y1="16" x2="30" y2="16"/>
      <line x1="25" y1="16" x2="25" y2="22"/>
      <line x1="29" y1="16" x2="29" y2="20"/>
    </g>
    <text x="155" y="1039" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Secrets</text>
    <text x="110" y="1082" font-family="monospace" font-size="24" fill="#303a36">Plaintext in settings.py.</text>
  </g>

  
  <g id="panel-production">
    
    <rect x="830" y="110" width="710" height="1325" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 830 122 A 12 12 0 0 1 842 110 L 1528 110 A 12 12 0 0 1 1540 122 L 1540 180 L 830 180 Z" fill="#207448"/>
    <text x="1185" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Production Architecture (fleetapp / mezzanine)</text>

    
    <rect x="855" y="195" width="660" height="130" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 212)">
      <circle cx="16" cy="16" r="14"/>
      <path d="M 2 16 Q 16 6 30 16 Q 16 26 2 16"/>
      <line x1="16" y1="2" x2="16" y2="30"/>
    </g>
    <text x="925" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Inbound Edge</text>
    <text x="880" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Client requests over port 80 and port 443</text>
    <text x="880" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">with wildcard DNS (192.168.33.10.nip.io).</text>

    
    <rect x="855" y="337" width="660" height="205" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 355)">
      <path d="M 16 2 L 4 7 L 4 17 Q 16 29 16 29 Q 28 17 28 7 Z"/>
      <path d="M 11 15 L 15 19 L 22 11"/>
    </g>
    <text x="925" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Reverse Proxy (NGINX)</text>
    <text x="880" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Terminates HTTPS on port 443, redirects</text>
    <text x="880" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">HTTP on 80 (301), serves /static/ directly,</text>
    <text x="880" y="484" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">enforces rate limiting (limit_req zone=api</text>
    <text x="880" y="516" font-family="monospace" font-size="24" fill="#303a36">rate=20r/s burst=40 nodelay).</text>

    
    <rect x="855" y="554" width="660" height="162" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 572)">
      <rect x="4" y="10" width="16" height="14" rx="2"/>
      <line x1="8" y1="24" x2="8" y2="30"/>
      <line x1="16" y1="24" x2="16" y2="30"/>
      <line x1="20" y1="14" x2="28" y2="14"/>
      <line x1="20" y1="20" x2="28" y2="20"/>
    </g>
    <text x="925" y="596" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">IPC Boundary</text>
    <text x="880" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Connects via Unix domain socket</text>
    <text x="880" y="668" font-family="monospace" font-size="24" fill="#303a36">(unix:{{ proj_path }}/gunicorn.sock)</text>
    <text x="880" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">or HTTP upstream.</text>

    
    <rect x="855" y="728" width="660" height="236" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    
    <g stroke="#db8129" stroke-width="3" fill="none" transform="translate(880, 746)">
      <rect x="5" y="5" width="22" height="22" rx="3"/>
      <rect x="10" y="10" width="12" height="12" fill="#db8129" fill-opacity="0.2"/>
      <line x1="11" y1="1" x2="11" y2="5"/>
      <line x1="21" y1="1" x2="21" y2="5"/>
      <line x1="11" y1="27" x2="11" y2="31"/>
      <line x1="21" y1="27" x2="21" y2="31"/>
      <line x1="1" y1="11" x2="5" y2="11"/>
      <line x1="1" y1="21" x2="5" y2="21"/>
      <line x1="27" y1="11" x2="31" y2="11"/>
      <line x1="27" y1="21" x2="31" y2="21"/>
    </g>
    <text x="925" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">App Server Tier</text>
    <text x="880" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Process manager (systemd / Supervisor)</text>
    <text x="880" y="842" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">managing Gunicorn/Uvicorn master and multiple</text>
    <text x="880" y="874" font-family="monospace" font-size="24" fill="#303a36">workers ('workers = cpu_count() * 2').</text>
    <text x="880" y="906" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Auto-restart on failure</text>
    <text x="880" y="938" font-family="monospace" font-size="24" fill="#303a36">('Restart=on-failure').</text>

    
    <rect x="855" y="976" width="660" height="102" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 992)">
      <polygon points="17,2 7,16 16,16 13,30 25,14 17,14" fill="#207448" fill-opacity="0.15"/>
    </g>
    <text x="925" y="1015" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Cache Tier</text>
    <text x="880" y="1053" font-family="monospace" font-size="24" fill="#303a36">Memcached on 127.0.0.1:11211.</text>

    
    <rect x="855" y="1090" width="660" height="170" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 1108)">
      <ellipse cx="16" cy="7" rx="13" ry="5"/>
      <path d="M 3 7 L 3 23 A 13 5 0 0 0 29 23 L 29 7"/>
      <path d="M 3 15 A 13 5 0 0 0 29 15"/>
    </g>
    <text x="925" y="1132" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Database Tier</text>
    <text x="880" y="1172" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Dedicated PostgreSQL instance, UTF8 encoding</text>
    <text x="880" y="1204" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">with template0 locale, SCRAM-SHA-256</text>
    <text x="880" y="1236" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">authentication restricted to app host IPs.</text>

    
    <rect x="855" y="1272" width="660" height="135" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(880, 1290)">
      <rect x="4" y="12" width="24" height="16" rx="2"/>
      <path d="M 9 12 L 9 8 A 7 7 0 0 1 23 8 L 23 12"/>
      <circle cx="16" cy="20" r="2" fill="#207448"/>
    </g>
    <text x="925" y="1314" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Secrets</text>
    <text x="880" y="1354" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Ansible Vault encrypted file (vault.yml)</text>
    <text x="880" y="1386" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rendered with mode 0600.</text>
  </g>
</svg>