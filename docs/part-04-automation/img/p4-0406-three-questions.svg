<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three questions to ask of any playbook the night before a change</title>
  <desc>Visual infographic outlining the three essential playbook validation questions, operational shift from runbook to playbook, antipattern contrast, practical use cases, and chapter summary.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <g id="title-group">
    <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Three questions to ask of any playbook the night before a change</text>
    <line x1="120" y1="108" x2="1480" y2="108" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  
  <g id="card-1">
    <rect x="70" y="140" width="460" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="300" cy="190" r="26" fill="#207448"/>
    <text x="300" y="199" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="300" y="258" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">What does it change?</text>
    <line x1="140" y1="285" x2="460" y2="285" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <text x="300" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0">the layout of the playbook,</tspan>
      <tspan x="300" dy="38">then the modules that do</tspan>
      <tspan x="300" dy="38">the work</tspan>
    </text>
  </g>

  
  <g id="card-2">
    <rect x="570" y="140" width="460" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="800" cy="190" r="26" fill="#207448"/>
    <text x="800" y="199" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="800" y="258" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is it safe to run again?</text>
    <line x1="640" y1="285" x2="960" y2="285" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <text x="800" y="350" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">idempotency:</tspan>
      <tspan x="800" dy="42">changed=0 on the second run</tspan>
    </text>
  </g>

  
  <g id="card-3">
    <rect x="1070" y="140" width="460" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1300" cy="190" r="26" fill="#207448"/>
    <text x="1300" y="199" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <text x="1300" y="248" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="1300" dy="0">How do I stop it</tspan>
      <tspan x="1300" dy="34">if the first batch looks wrong?</tspan>
    </text>
    <line x1="1140" y1="300" x2="1460" y2="300" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <text x="1300" y="350" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1300" dy="0">check mode, diff, tags,</tspan>
      <tspan x="1300" dy="38">limits and serial</tspan>
    </text>
  </g>

  
  <g id="before-after-strip">
    
    <rect x="70" y="520" width="715" height="150" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="2"/>
    <text x="427" y="582" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="427" dy="0">runbook in one person's head:</tspan>
      <tspan x="427" dy="38">when that person is on leave the change waits</tspan>
    </text>

    
    <path d="M 788 595 L 812 595" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <polygon points="812,589 824,595 812,601" fill="#207448"/>

    
    <rect x="815" y="520" width="715" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1172" y="582" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1172" dy="0">playbook: steps and their order written</tspan>
      <tspan x="1172" dy="38">down and reviewed like any other code</tspan>
    </text>
  </g>

  
  <g id="contrast-strip">
    <rect x="70" y="700" width="1460" height="160" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="2.5"/>
    <text x="800" y="768" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">a well-written playbook reads like a runbook; a badly written one is a shell script in YAML:</tspan>
      <tspan x="800" dy="44">it always reports changed, cannot be dry-run and breaks differently on every host</tspan>
    </text>
  </g>

  
  <g id="use-cases-strip">
    <rect x="70" y="890" width="1460" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="800" y="952" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">install a driver, set kernel parameters, deploy a Slurm configuration,</tspan>
      <tspan x="800" dy="40">rotate a certificate, drain and patch a node</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="70" y="1060" width="1460" height="90" rx="12" fill="#207448"/>
    <text x="800" y="1116" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The rest of the chapter answers these three questions in order</text>
  </g>
</svg>