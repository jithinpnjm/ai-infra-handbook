<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A handler lost after a failure, and why Run 2 does not restart</title>
  <desc>Visual explanation of an Ansible handler lost due to a task failure and why subsequent runs skip restarting the service</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A handler lost after a failure, and why Run 2 does not restart</text>

  
  <g id="lane-run-1">
    
    <rect x="40" y="110" width="1520" height="340" rx="16" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />

    
    <rect x="55" y="125" width="110" height="310" rx="10" fill="#e8f1ea" />
    <text x="110" y="290" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Run 1</text>

    
    <g id="box-1">
      <rect x="185" y="135" width="400" height="290" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />
      
      
      <circle cx="225" cy="175" r="22" fill="#207448" />
      <text x="225" y="183" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

      
      <g transform="translate(265, 149)">
        <rect x="0" y="0" width="40" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="10" y1="16" x2="30" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="10" y1="28" x2="30" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="10" y1="40" x2="22" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>

      
      <text x="210" y="240" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="210" dy="0">template:</tspan>
        <tspan x="210" dy="30">dest=/etc/default/</tspan>
        <tspan x="210" dy="30">dcgm-exporter</tspan>
      </text>

      
      <text x="210" y="348" font-family="sans-serif" font-size="24" fill="#4a5852">
        <tspan x="210" dy="0">the file changes</tspan>
        <tspan x="210" dy="28">and the task reports</tspan>
        <tspan x="210" dy="28">changed</tspan>
      </text>
    </g>

    
    <g id="arrow-notify">
      <text x="630" y="266" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">notify</text>
      <line x1="585" y1="280" x2="665" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    </g>

    
    <g id="box-2">
      <rect x="675" y="135" width="380" height="290" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />

      
      <circle cx="715" cy="175" r="22" fill="#207448" />
      <text x="715" y="183" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

      
      <g transform="translate(755, 149)">
        <circle cx="26" cy="26" r="16" fill="none" stroke="#207448" stroke-width="4" />
        <circle cx="26" cy="26" r="6" fill="#207448" />
        <line x1="26" y1="4" x2="26" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="26" y1="42" x2="26" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="4" y1="26" x2="10" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="42" y1="26" x2="48" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>

      
      <text x="700" y="246" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="700" dy="0">queued handler</tspan>
        <tspan x="700" dy="36">Restart</tspan>
        <tspan x="700" dy="36">dcgm-exporter</tspan>
      </text>

      
      <text x="700" y="380" font-family="sans-serif" font-size="24" fill="#4a5852">not yet run</text>
    </g>

    
    <g id="arrow-task-2">
      <text x="1100" y="266" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Task 2</text>
      <line x1="1055" y1="280" x2="1135" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    </g>

    
    <g id="box-3">
      <rect x="1145" y="135" width="400" height="290" rx="12" fill="#fff9f5" stroke="#db8129" stroke-width="4" />

      
      <circle cx="1185" cy="175" r="22" fill="#207448" />
      <text x="1185" y="183" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

      
      <g transform="translate(1225, 149)">
        <polygon points="26,6 50,46 2,46" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
        <line x1="26" y1="18" x2="26" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
        <circle cx="26" cy="40" r="2" fill="#db8129" />
      </g>

      
      <text x="1170" y="246" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
        <tspan x="1170" dy="0">Task 2 fails</tspan>
        <tspan x="1170" dy="36">on gpu01</tspan>
      </text>

      
      <text x="1170" y="334" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1170" dy="0">the handler is skipped</tspan>
        <tspan x="1170" dy="28">and dcgm-exporter</tspan>
        <tspan x="1170" dy="28">keeps the old config</tspan>
        <tspan x="1170" dy="28">in memory</tspan>
      </text>
    </g>
  </g>

  
  <g id="lane-run-2">
    
    <rect x="40" y="480" width="1520" height="340" rx="16" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />

    
    <rect x="55" y="495" width="110" height="310" rx="10" fill="#e8f1ea" />
    <text x="110" y="660" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Run 2</text>

    
    <g id="box-a">
      <rect x="185" y="505" width="400" height="290" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />

      
      <g transform="translate(210, 519)">
        <rect x="0" y="0" width="40" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="10" y1="16" x2="30" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="10" y1="28" x2="30" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="10" y1="40" x2="22" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>

      
      <text x="210" y="610" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="210" dy="0">template:</tspan>
        <tspan x="210" dy="30">dest=/etc/default/</tspan>
        <tspan x="210" dy="30">dcgm-exporter</tspan>
      </text>

      
      <text x="210" y="718" font-family="sans-serif" font-size="24" fill="#4a5852">
        <tspan x="210" dy="0">the file on disk</tspan>
        <tspan x="210" dy="28">already matches,</tspan>
        <tspan x="210" dy="28">so the task reports ok</tspan>
      </text>
    </g>

    
    <g id="arrow-no-notify">
      <text x="660" y="636" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">no notify</text>
      <line x1="585" y1="650" x2="725" y2="650" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    </g>

    
    <g id="box-b">
      <rect x="735" y="505" width="400" height="290" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2" />

      
      <g transform="translate(765, 525)">
        <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="10" y1="10" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>

      
      <text x="765" y="660" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">no restart</text>
    </g>
  </g>

  
  <g id="panel-three-fixes">
    
    <rect x="40" y="850" width="1520" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="70" y="895" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Three fixes</text>

    
    <g id="fix-item-1">
      <rect x="70" y="920" width="1460" height="64" rx="8" fill="#ffffff" stroke="#cadbd0" stroke-width="1.5" />
      <circle cx="102" cy="952" r="14" fill="#207448" />
      <path d="M 96 952 L 100 956 L 108 948" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="130" y="961" font-family="sans-serif" font-size="26" fill="#303a36"><tspan font-family="monospace" font-weight="bold" fill="#207448">force_handlers: true</tspan> on the play</text>
    </g>

    
    <g id="fix-item-2">
      <rect x="70" y="998" width="1460" height="64" rx="8" fill="#ffffff" stroke="#cadbd0" stroke-width="1.5" />
      <circle cx="102" cy="1030" r="14" fill="#207448" />
      <path d="M 96 1030 L 100 1034 L 108 1026" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="130" y="1039" font-family="sans-serif" font-size="26" fill="#303a36"><tspan font-family="monospace" font-weight="bold" fill="#207448">meta: flush_handlers</tspan> right after the critical config tasks</text>
    </g>

    
    <g id="fix-item-3">
      <rect x="70" y="1076" width="1460" height="64" rx="8" fill="#ffffff" stroke="#cadbd0" stroke-width="1.5" />
      <circle cx="102" cy="1108" r="14" fill="#207448" />
      <path d="M 96 1108 L 100 1112 L 108 1104" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="130" y="1117" font-family="sans-serif" font-size="26" fill="#303a36">an idempotent task that checks the service uptime against the config file mtime</text>
    </g>
  </g>
</svg>