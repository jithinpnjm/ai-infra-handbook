<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Terraform builds the machines, Ansible configures them</title>
  <desc>Infographic showing a three-stage provisioning chain: Terraform builds GPU VMs, cloud-init performs the initial boot setup, and Ansible applies final configurations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="80" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">Terraform builds the machines, Ansible configures them</text>

  
  <rect x="475" y="135" width="650" height="54" rx="10" fill="#e6ece8" stroke="#b0bcc0" stroke-width="2"/>
  <text x="800" y="170" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">Each tool does one part of the job.</text>

  
  
  <text x="512" y="380" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">
    <tspan x="512" dy="0">machines</tspan>
    <tspan x="512" dy="30">exist</tspan>
  </text>
  <line x1="400" y1="440" x2="625" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <text x="1087" y="350" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">
    <tspan x="1087" dy="0">machines can</tspan>
    <tspan x="1087" dy="30">be reached</tspan>
    <tspan x="1087" dy="30">over SSH</tspan>
  </text>
  <line x1="975" y1="440" x2="1200" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="240" width="350" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="95" cy="285" r="24" fill="#207448"/>
  <text x="95" y="285" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">1</text>
  
  <path d="M 205 310 H 245 A 14 14 0 0 0 245 282 A 20 20 0 0 0 209 276 A 14 14 0 0 0 195 300 A 10 10 0 0 0 205 310 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="225" y="355" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">Terraform</text>
  <text x="225" y="415" font-size="24" fill="#303a36" text-anchor="middle" font-family="sans-serif">
    <tspan x="225" dy="0">Builds a new pool</tspan>
    <tspan x="225" dy="34">of GPU VMs with</tspan>
    <tspan x="225" dy="34">the right network</tspan>
    <tspan x="225" dy="34">and disks</tspan>
  </text>

  
  <rect x="625" y="240" width="350" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="670" cy="285" r="24" fill="#207448"/>
  <text x="670" y="285" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">2</text>
  
  <path d="M 800 266 V 290" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 814 276 A 20 20 0 1 1 786 276" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="800" y="355" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">cloud-init</text>
  <text x="800" y="430" font-size="24" fill="#303a36" text-anchor="middle" font-family="sans-serif">
    <tspan x="800" dy="0">Handles the first</tspan>
    <tspan x="800" dy="34">boot, with a user</tspan>
    <tspan x="800" dy="34">and an SSH key</tspan>
  </text>

  
  <rect x="1200" y="240" width="350" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1245" cy="285" r="24" fill="#207448"/>
  <text x="1245" y="285" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">3</text>
  
  <g transform="translate(1375, 290)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="10"/>
    <path d="M -4 -22 h 8 v 5 a 18 18 0 0 1 8 3 l 4 -4 l 6 6 l -4 4 a 18 18 0 0 1 3 8 h 5 v 8 h -5 a 18 18 0 0 1 -3 8 l 4 4 l -6 6 l -4 -4 a 18 18 0 0 1 -8 3 v 5 h -8 v -5 a 18 18 0 0 1 -8 -3 l -4 4 l -6 -6 l 4 -4 a 18 18 0 0 1 -3 -8 h -5 v -8 h 5 a 18 18 0 0 1 3 -8 l -4 -4 l 6 -6 l 4 4 a 18 18 0 0 1 8 -3 z"/>
  </g>
  <text x="1375" y="355" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">Ansible</text>
  <text x="1375" y="405" font-size="24" fill="#303a36" text-anchor="middle" font-family="sans-serif">
    <tspan x="1375" dy="0">Installs the driver,</tspan>
    <tspan x="1375" dy="34">sets the kernel</tspan>
    <tspan x="1375" dy="34">parameters and</tspan>
    <tspan x="1375" dy="34">starts the</tspan>
    <tspan x="1375" dy="34">monitoring agent</tspan>
  </text>

  
  <rect x="1200" y="660" width="350" height="120" rx="16" fill="#fdf5ec" stroke="#db8129" stroke-width="3"/>
  <text x="1375" y="712" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">
    <tspan x="1375" dy="0">Ansible decides what</tspan>
    <tspan x="1375" dy="34">runs on the machines.</tspan>
  </text>
</svg>