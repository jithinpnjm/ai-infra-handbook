<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Lookups run on the control node, module results come from the target</title>
  <desc>SVG infographic explaining that Ansible lookups execute locally on the control node during template rendering, while module results come from the target host via register.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Lookups run on the control node,</tspan>
    <tspan x="800" dy="58">module results come from the target</tspan>
  </text>

  
  <g id="control-node-zone">
    
    <rect x="40" y="160" width="600" height="720" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

    
    <g transform="translate(340, 215)">
      <rect x="-28" y="-24" width="56" height="38" rx="4" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="0" y1="14" x2="0" y2="24" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="-14" y1="24" x2="14" y2="24" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <path d="M -18 -8 L -10 -3 L -18 2" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-5" y1="2" x2="6" y2="2" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="340" y="275" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Control node</text>
    <text x="340" y="312" text-anchor="middle" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">where you type </tspan>
      <tspan font-family="monospace">ansible-playbook</tspan>
    </text>

    
    
    <rect x="58" y="350" width="564" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="340" y="386" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">lookup('file')</text>

    
    <rect x="58" y="414" width="564" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="340" y="450" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">lookup('url')</text>

    
    <rect x="58" y="478" width="564" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="340" y="514" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">lookup('env')</text>

    
    <rect x="58" y="542" width="564" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="340" y="578" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">community.hashi_vault.hashi_vault</text>

    
    <rect x="58" y="616" width="564" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    <text x="340" y="648" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="340" dy="0">lookups run here,</tspan>
      <tspan x="340" dy="30">when the template is rendered</tspan>
    </text>

    
    <rect x="58" y="712" width="564" height="64" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
    <text x="340" y="752" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">lookups never run on the targets</text>
  </g>

  
  <line x1="640" y1="520" x2="734" y2="520" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <g id="center-task-zone">
    <rect x="750" y="410" width="240" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

    
    <g transform="translate(870, 465)">
      <rect x="-24" y="-22" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M -10 -22 L -10 -28 C -10 -31 10 -31 10 -28 L 10 -22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-13" y1="-8" x2="13" y2="-8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-13" y1="3" x2="13" y2="3" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-13" y1="14" x2="5" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="870" y="550" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="870" dy="0">Task uses</tspan>
      <tspan x="870" dy="38">the value</tspan>
    </text>
  </g>

  
  <line x1="1140" y1="520" x2="1006" y2="520" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />
  <text x="1065" y="498" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">register</text>

  
  <g id="target-host-zone">
    
    <rect x="1140" y="160" width="420" height="720" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

    
    <g transform="translate(1350, 215)">
      <rect x="-28" y="-26" width="56" height="52" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#207448" stroke-width="3" />
      <circle cx="-16" cy="-13" r="3" fill="#207448" />
      <line x1="-4" y1="-13" x2="16" y2="-13" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="-16" cy="13" r="3" fill="#207448" />
      <line x1="-4" y1="13" x2="16" y2="13" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="1350" y="275" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Target host</text>
    <text x="1350" y="312" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1350" dy="0">the machine</tspan>
      <tspan x="1350" dy="30">being configured</tspan>
    </text>

    
    <rect x="1160" y="400" width="380" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(1350, 465)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#207448" stroke-width="8" stroke-linecap="round" />
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#207448" stroke-width="8" stroke-linecap="round" />
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#207448" stroke-width="8" stroke-linecap="round" />
      <line x1="-18" y1="18" x2="18" y2="-18" stroke="#207448" stroke-width="8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <circle cx="0" cy="0" r="5" fill="#207448" />
    </g>

    
    <text x="1350" y="555" text-anchor="middle" fill="#303a36">
      <tspan x="1350" dy="0" font-family="sans-serif" font-size="24" font-weight="bold">Module such as</tspan>
      <tspan x="1350" dy="38" font-family="monospace" font-size="24" font-weight="bold">ansible.builtin.setup</tspan>
    </text>
  </g>

  
  <rect x="40" y="920" width="1520" height="90" rx="12" fill="#207448" />
  <text x="800" y="956" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">For data from a target, use a module and register instead,</tspan>
    <tspan x="800" dy="32">because a module runs on the host it describes.</tspan>
  </text>
</svg>