<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>a &amp;&amp; b || c is not an if/else</title>
  <desc>Flowchart comparison showing why the shell idiom a and and b or or c fails when command b returns non-zero, contrasting with a true if-then-else construct.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-size="44" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">a &amp;&amp; b || c is not an if/else</text>

  
  <rect x="60" y="90" width="710" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="90" y="110" width="650" height="56" rx="10" fill="#207448"/>
  <text x="415" y="147" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="monospace">if a; then b; else c; fi</text>

  
  <rect x="335" y="205" width="160" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="415" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">start</text>

  
  <line x1="415" y1="255" x2="415" y2="295" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <polygon points="415,295 550,350 415,405 280,350" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="415" y="358" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">a succeeds?</text>

  
  <polyline points="280,350 220,350 220,465" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="195" y="390" width="50" height="30" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="220" y="412" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448" font-family="system-ui, sans-serif">yes</text>

  
  <rect x="150" y="465" width="140" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="220" y="505" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36" font-family="monospace">b</text>

  
  <polyline points="550,350 610,350 610,465" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="588" y="390" width="44" height="30" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="610" y="412" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448" font-family="system-ui, sans-serif">no</text>

  
  <rect x="540" y="465" width="140" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="610" y="505" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36" font-family="monospace">c</text>

  
  <polyline points="220,525 220,565 415,565" fill="none" stroke="#207448" stroke-width="2.5"/>
  <polyline points="610,525 610,565 415,565" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="415" y1="565" x2="415" y2="605" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <rect x="335" y="605" width="160" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="415" y="638" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">end</text>

  
  <rect x="830" y="90" width="710" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="860" y="110" width="650" height="56" rx="10" fill="#207448"/>
  <text x="1185" y="147" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="monospace">a &amp;&amp; b || c</text>

  
  <rect x="905" y="205" width="160" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="985" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">start</text>

  
  <line x1="985" y1="255" x2="985" y2="290" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <polygon points="985,290 1100,335 985,380 870,335" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="985" y="343" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">a succeeds?</text>

  
  <line x1="985" y1="380" x2="985" y2="425" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="920" y="388" width="46" height="28" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="943" y="408" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448" font-family="system-ui, sans-serif">yes</text>

  
  <rect x="915" y="425" width="140" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="985" y="460" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36" font-family="monospace">b</text>

  
  <line x1="985" y1="475" x2="985" y2="505" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  
  <polygon points="985,505 1110,550 985,595 860,550" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="985" y="558" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">b succeeded?</text>

  
  <line x1="985" y1="595" x2="985" y2="635" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="920" y="601" width="46" height="28" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="943" y="621" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448" font-family="system-ui, sans-serif">yes</text>

  
  <rect x="905" y="635" width="160" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="985" y="668" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">end</text>

  
  <rect x="1170" y="390" width="340" height="120" rx="12" fill="#fff9f5" stroke="#db8129" stroke-width="3"/>
  <text x="1340" y="425" text-anchor="middle" font-size="28" font-weight="bold" fill="#db8129" font-family="monospace">c</text>
  <text x="1340" y="462" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, sans-serif">
    <tspan x="1340" dy="0">c runs even though</tspan>
    <tspan x="1340" dy="28">a succeeded</tspan>
  </text>

  
  <line x1="1100" y1="335" x2="1160" y2="335" stroke="#db8129" stroke-width="2.5"/>
  <polyline points="1280,335 1340,335 1340,390" fill="none" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="1160" y="320" width="120" height="30" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5"/>
  <text x="1220" y="342" text-anchor="middle" font-size="24" font-weight="bold" fill="#db8129" font-family="system-ui, sans-serif">a failed</text>

  
  <line x1="1110" y1="550" x2="1165" y2="550" stroke="#db8129" stroke-width="2.5"/>
  <polyline points="1285,550 1340,550 1340,510" fill="none" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="1165" y="535" width="120" height="30" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5"/>
  <text x="1225" y="557" text-anchor="middle" font-size="24" font-weight="bold" fill="#db8129" font-family="system-ui, sans-serif">b failed</text>

  
  <rect x="60" y="745" width="1480" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="90" y="765" width="1420" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="130" y="801" font-size="25" font-family="monospace" fill="#303a36">[ -d "$d" ] || mkdir -p "$d"</text>

  
  <rect x="90" y="833" width="1420" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="130" y="869" font-size="25" font-family="monospace" fill="#303a36">command -v nvidia-smi &gt;/dev/null || exit 0</text>

  
  <rect x="90" y="901" width="1420" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="130" y="937" font-size="25" font-family="monospace" fill="#303a36">cd "$dir" || exit 1</text>

  
  <rect x="90" y="969" width="1420" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="130" y="1005" font-size="25" font-family="monospace" fill="#303a36">[ -z "$x" ] &amp;&amp; { echo "empty" &gt;&amp;2; exit 1; }</text>

  
  <rect x="60" y="1070" width="1480" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1114" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">&amp;&amp; runs the next command only if the last one succeeded; || only if it failed</text>
</svg>