<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>The stack: KVM, QEMU, libvirt</title>
  <desc>Admin / orchestrator, libvirt, QEMU process per VM, KVM kernel module, CPU VT-x/AMD-V · IOMMU · NIC/GPU/NVMe, and vhost-net / vhost-user / VFIO / SPDK.</desc>
