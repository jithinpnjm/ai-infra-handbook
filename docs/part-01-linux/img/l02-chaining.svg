<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Combining commands</title>
  <desc>A reference table showing shell command combining operators, their forms, and execution conditions.</desc>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Combining commands</text>

  
  
  <rect x="120" y="140" width="380" height="70" rx="10" fill="#207448"/>
  <text x="310" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Form</text>

  
  <rect x="520" y="140" width="960" height="70" rx="10" fill="#207448"/>
  <text x="1000" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Runs the second command when</text>

  
  <g id="row1">
    <rect x="120" y="225" width="380" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="310" y="273" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">a ; b</text>

    <rect x="520" y="225" width="960" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="560" y="273" text-anchor="start" font-family="sans-serif" font-size="26" fill="#303a36">always, after a ends</text>
  </g>

  
  <g id="row2">
    <rect x="120" y="315" width="380" height="76" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
    <text x="310" y="363" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">a &amp;&amp; b</text>

    <rect x="520" y="315" width="960" height="76" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
    <text x="560" y="363" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">a succeeded (status 0)</text>
  </g>

  
  <g id="row3">
    <rect x="120" y="405" width="380" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="310" y="453" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">a || b</text>

    <rect x="520" y="405" width="960" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="560" y="453" text-anchor="start" font-family="sans-serif" font-size="26" fill="#303a36">a failed (status non-zero)</text>
  </g>

  
  <g id="row4">
    <rect x="120" y="495" width="380" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="310" y="543" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">a &amp; b</text>

    <rect x="520" y="495" width="960" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="560" y="543" text-anchor="start" font-family="sans-serif" font-size="26" fill="#303a36">a started in background, b runs immediately</text>
  </g>

  
  <g id="row5">
    <rect x="120" y="585" width="380" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="310" y="633" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">(a; b)</text>

    <rect x="520" y="585" width="960" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="560" y="633" text-anchor="start" font-family="sans-serif" font-size="26" fill="#303a36">in a subshell</text>
  </g>

  
  <g id="row6">
    <rect x="120" y="675" width="380" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="310" y="723" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">{ a; b; }</text>

    <rect x="520" y="675" width="960" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="560" y="723" text-anchor="start" font-family="sans-serif" font-size="26" fill="#303a36">as a group in the current shell</text>
  </g>

  
  <rect x="120" y="800" width="1360" height="96" rx="16" fill="#207448"/>
  <text x="800" y="858" text-anchor="middle" fill="#ffffff">
    <tspan font-family="monospace" font-size="26">mkdir -p build &amp;&amp; cd build &amp;&amp; cmake ..</tspan>
    <tspan font-family="sans-serif" font-size="26"> stops at the first failure.</tspan>
  </text>
</svg>