<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Combining commands</title>
  <desc>A visual reference table of shell command combination operators and when the second command runs.</desc>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="60" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Combining commands</text>

  
  <g id="header-row">
    <rect x="60" y="115" width="1480" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="440" y1="115" x2="440" y2="170" stroke="#207448" stroke-width="2"/>
    <text x="90" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Form</text>
    <text x="470" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Runs the second command when</text>
  </g>

  
  <g id="row-1">
    <rect x="60" y="210" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="440" y1="210" x2="440" y2="296" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 253)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="0,-14 0,0 11,0" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="175" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">a ; b</text>
    <text x="470" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">always, after a ends</text>
  </g>

  
  <g id="row-2">
    <rect x="60" y="336" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <line x1="440" y1="336" x2="440" y2="422" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 379)">
      <path d="M 0,-22 L 20,-14 C 20,6 11,18 0,22 C -11,18 -20,6 -20,-14 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="-9,-1 -3,5 9,-7" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="175" y="389" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">a &amp;&amp; b</text>
    <text x="470" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">a succeeded (status 0)</text>
  </g>

  
  <g id="row-3">
    <rect x="60" y="462" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="440" y1="462" x2="440" y2="548" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 505)">
      <path d="M 0,-22 L 20,-14 C 20,6 11,18 0,22 C -11,18 -20,6 -20,-14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="175" y="515" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">a || b</text>
    <text x="470" y="514" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">a failed (status non-zero)</text>
  </g>

  
  <g id="row-4">
    <rect x="60" y="588" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="440" y1="588" x2="440" y2="674" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 631)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 0,-20 L 0,-14 M 0,14 L 0,20 M -20,0 L -14,0 M 14,0 L 20,0 M -14,-14 L -10,-10 M 10,10 L 14,14 M -14,14 L -10,10 M 10,-10 L 14,-14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="175" y="641" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">a &amp; b</text>
    <text x="470" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">a started in background, b runs immediately</text>
  </g>

  
  <g id="row-5">
    <rect x="60" y="714" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="440" y1="714" x2="440" y2="800" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 757)">
      <rect x="-22" y="-19" width="44" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="-22" y1="-9" x2="22" y2="-9" stroke="#207448" stroke-width="2"/>
      <path d="M -15,-1 L -8,4 L -15,9 M -4,9 L 4,9" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="175" y="767" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">(a; b)</text>
    <text x="470" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">in a subshell</text>
  </g>

  
  <g id="row-6">
    <rect x="60" y="840" width="1480" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="440" y1="840" x2="440" y2="926" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <g transform="translate(113, 883)">
      <path d="M -9,-18 C -15,-18 -16,-13 -16,-7 C -16,-3 -19,0 -23,0 C -19,0 -16,3 -16,7 C -16,13 -15,18 -9,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 9,-18 C 15,-18 16,-13 16,-7 C 16,-3 19,0 23,0 C 19,0 16,3 16,7 C 16,13 15,18 9,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="175" y="893" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">{ a; b; }</text>
    <text x="470" y="892" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">as a group in the current shell</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="966" width="1480" height="84" rx="12" fill="#207448"/>
    
    <g transform="translate(113, 1008)">
      <rect x="-21" y="-19" width="42" height="38" rx="6" fill="none" stroke="#ffffff" stroke-width="3"/>
      <line x1="-21" y1="-9" x2="21" y2="-9" stroke="#ffffff" stroke-width="2"/>
      <path d="M -14,-1 L -8,4 L -14,9 M -4,9 L 4,9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="160" y="1018" fill="#ffffff" font-size="26">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">mkdir -p build &amp;&amp; cd build &amp;&amp; cmake ..</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal"> stops at the first failure</tspan>
    </text>
  </g>
</svg>