<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Trace of getopts Parsing Flags, Advancing OPTIND, and Shifting Positional Arguments</title>
  <desc>A step-by-step trace diagram illustrating how while getopts processes command-line arguments, advances OPTIND, terminates on non-options, and shifts positional parameters.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Trace of getopts Parsing Flags, Advancing OPTIND,</text>
  <text x="800" y="105" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">and Shifting Positional Arguments</text>

  
  <rect x="530" y="125" width="540" height="46" rx="23" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="157" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">while getopts &quot;:hn:t:&quot; opt</text>

  
  <rect x="50" y="190" width="1500" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="80" y="210" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="92" y1="210" x2="92" y2="236" stroke="#207448" stroke-width="3"/>
  <line x1="104" y1="210" x2="104" y2="236" stroke="#207448" stroke-width="3"/>

  <text x="130" y="231" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Input argument array</text>
  <text x="430" y="231" font-family="sans-serif" font-size="24" fill="#303a36">positional parameters</text>

  
  <rect x="85" y="252" width="220" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="195" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">1: &quot;-n&quot;</text>

  <rect x="325" y="252" width="220" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="435" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">2: &quot;4&quot;</text>

  <rect x="565" y="252" width="220" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="675" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">3: &quot;-t&quot;</text>

  <rect x="805" y="252" width="220" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="915" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">4: &quot;/data&quot;</text>

  <rect x="1045" y="252" width="220" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1155" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">5: &quot;train.py&quot;</text>

  <rect x="1285" y="252" width="230" height="68" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1400" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">6: &quot;run42&quot;</text>

  
  <line x1="800" y1="340" x2="800" y2="376" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="380" width="1500" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="420" r="24" fill="#207448"/>
  <text x="105" y="428" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="145" y="428" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1 (Parsing -n)</text>

  
  <circle cx="1450" cy="420" r="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="1462" y1="432" x2="1476" y2="446" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="80" y="455" width="640" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="105" y="490" font-family="sans-serif" font-size="24" fill="#303a36">getopts inspects index 1 (&quot;-n&quot;)</text>
  <text x="105" y="528" font-family="sans-serif" font-size="24" fill="#303a36">matches &apos;n:&apos; which expects an argument</text>
  <text x="105" y="566" font-family="sans-serif" font-size="24" fill="#303a36">consumes index 2 (&quot;4&quot;)</text>

  
  <rect x="745" y="455" width="775" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="770" y="488" font-family="sans-serif" font-size="24" fill="#303a36">variable opt is assigned &quot;n&quot;</text>
  <text x="770" y="522" font-family="sans-serif" font-size="24" fill="#303a36">variable OPTARG is assigned &quot;4&quot;</text>
  <text x="770" y="556" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="770" dy="0">internal pointer OPTIND advances from 1 to 3</tspan>
    <tspan x="770" dy="26">(pointing to index 3)</tspan>
  </text>

  
  <line x1="800" y1="605" x2="800" y2="641" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="645" width="1500" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="685" r="24" fill="#207448"/>
  <text x="105" y="693" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="145" y="693" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2 (Parsing -t)</text>

  
  <circle cx="1450" cy="685" r="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="1462" y1="697" x2="1476" y2="711" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="80" y="720" width="640" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="105" y="755" font-family="sans-serif" font-size="24" fill="#303a36">getopts inspects index 3 (&quot;-t&quot;)</text>
  <text x="105" y="793" font-family="sans-serif" font-size="24" fill="#303a36">matches &apos;t:&apos; which expects an argument</text>
  <text x="105" y="831" font-family="sans-serif" font-size="24" fill="#303a36">consumes index 4 (&quot;/data&quot;)</text>

  
  <rect x="745" y="720" width="775" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="770" y="753" font-family="sans-serif" font-size="24" fill="#303a36">opt is assigned &quot;t&quot;</text>
  <text x="770" y="787" font-family="sans-serif" font-size="24" fill="#303a36">OPTARG is assigned &quot;/data&quot;</text>
  <text x="770" y="821" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="770" dy="0">internal pointer OPTIND advances from 3 to 5</tspan>
    <tspan x="770" dy="26">(pointing to index 5)</tspan>
  </text>

  
  <line x1="800" y1="870" x2="800" y2="906" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="910" width="1500" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="950" r="24" fill="#207448"/>
  <text x="105" y="958" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="145" y="958" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3 (Non-option terminator)</text>

  
  <circle cx="1450" cy="950" r="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="1440" y1="950" x2="1460" y2="950" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="80" y="985" width="640" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="105" y="1035" font-family="sans-serif" font-size="24" fill="#303a36">getopts inspects index 5 (&quot;train.py&quot;)</text>
  <text x="105" y="1075" font-family="sans-serif" font-size="24" fill="#303a36">encounters no leading hyphen</text>

  
  <rect x="745" y="985" width="775" height="135" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="770" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">getopts returns exit code 1</text>
  <text x="770" y="1056" font-family="sans-serif" font-size="24" fill="#303a36">while loop terminates</text>
  <text x="770" y="1090" font-family="sans-serif" font-size="24" fill="#303a36">OPTIND remains 5</text>

  
  <line x1="800" y1="1135" x2="800" y2="1171" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="1175" width="1500" height="295" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(85, 1195)">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="10" cy="30" r="8" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="16" y1="14" x2="42" y2="34" stroke="#db8129" stroke-width="3"/>
    <line x1="16" y1="26" x2="42" y2="6" stroke="#db8129" stroke-width="3"/>
    <circle cx="23" cy="20" r="2.5" fill="#db8129"/>
  </g>

  <text x="145" y="1225" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">The shift operation</text>

  
  <rect x="80" y="1245" width="640" height="78" rx="10" fill="#fbf0e4" stroke="#db8129" stroke-width="2"/>
  <text x="105" y="1279" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">shift $((OPTIND - 1))</text>
  <text x="105" y="1309" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">evaluated as shift 4</text>

  
  <rect x="745" y="1245" width="775" height="78" rx="10" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="1.5"/>
  <text x="770" y="1279" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="770" dy="0">removes arguments 1 through 4 (&quot;-n&quot;, &quot;4&quot;, &quot;-t&quot;, &quot;/data&quot;)</tspan>
  </text>

  
  <rect x="80" y="1335" width="1440" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="105" y="1368" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">remaining positional arguments array</text>

  
  <rect x="105" y="1382" width="370" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="290" y="1420" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">$1 becomes &quot;train.py&quot;</text>

  
  <rect x="495" y="1382" width="330" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="660" y="1420" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">$2 becomes &quot;run42&quot;</text>

  
  <rect x="845" y="1382" width="650" height="60" rx="8" fill="#207448"/>
  <text x="1170" y="1420" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">ready to be consumed via &quot;$@&quot;</text>

</svg>