<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Readline keyboard shortcuts and line-editing buffer motions</title>
  <desc>Visual guide to GNU Readline command-line navigation, text deletion, yank buffer motions, and history traversal shortcuts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Readline keyboard shortcuts and line-editing buffer motions</text>

  
  <rect x="50" y="105" width="1040" height="945" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

  
  <rect x="1120" y="105" width="430" height="945" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

  
  
  <g transform="translate(1145, 130)">
    <rect width="380" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="190" cy="55" r="28" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 190 70 V 42 M 178 54 L 190 42 L 202 54" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Ctrl-P (previous history)</text>
  </g>

  
  <g transform="translate(1145, 365)">
    <rect width="380" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="190" cy="55" r="28" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 190 42 V 70 M 178 58 L 190 70 L 202 58" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Ctrl-N (next history)</text>
  </g>

  
  <g transform="translate(1145, 600)">
    <rect width="380" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="182" cy="52" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="197" y1="67" x2="216" y2="86" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="190" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
      <tspan x="190" dy="0">Ctrl-R</tspan>
      <tspan x="190" dy="34">(incremental history search)</tspan>
    </text>
  </g>

  
  <g transform="translate(1145, 835)">
    <rect width="380" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="162" y="30" width="56" height="42" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="172" y1="44" x2="208" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="172" y1="54" x2="196" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
      <tspan x="190" dy="0">Ctrl-L</tspan>
      <tspan x="190" dy="34">(clear screen, keep line)</tspan>
    </text>
  </g>

  
  
  <path d="M 720 452 V 160 H 139 V 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="290" y="139" width="300" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="440" y="169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-A (start of line)</text>

  
  <path d="M 744 452 V 220 H 970 V 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="715" y="199" width="280" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="855" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-E (end of line)</text>

  
  <path d="M 718 452 C 718 290, 467 290, 467 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="445" y="270" width="290" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="590" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Alt-B (back one word)</text>

  
  <path d="M 746 452 C 746 300, 785 300, 785 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="750" y="270" width="310" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="905" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Alt-F (forward one word)</text>

  
  <line x1="718" y1="422" x2="696" y2="422" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="415" y="401" width="270" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="550" y="431" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-B (left 1 char)</text>

  <line x1="746" y1="422" x2="768" y2="422" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="401" width="280" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="920" y="431" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-F (right 1 char)</text>

  
  <path d="M 800 830 H 1040 V 355 H 732 V 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="735" y="334" width="290" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="880" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-Y (yank / paste)</text>

  
  <g transform="translate(80, 460)">
    <rect width="980" height="84" rx="10" fill="#1e2621"/>
    
    <rect x="641" y="16" width="22" height="52" rx="3" fill="#db8129"/>
    
    <text x="50" y="52" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="3px">python3 train.py --batch-size 64 --lr 0.001</text>
  </g>

  
  
  <path d="M 467 552 V 576 H 721 V 552" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="464" y="565" width="260" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="594" y="595" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-W (erase word)</text>
  <line x1="594" y1="607" x2="594" y2="768" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 135 552 V 650 H 715 V 552" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="275" y="639" width="300" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="425" y="669" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-U (erase to start)</text>
  <line x1="425" y1="681" x2="425" y2="768" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 745 552 V 650 H 975 V 552" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="725" y="639" width="270" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="860" y="669" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Ctrl-K (erase to end)</text>
  <path d="M 860 681 V 720 H 730 V 768" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(320, 770)">
    <rect width="480" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <rect x="30" y="34" width="42" height="52" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 43 34 V 24 H 59 V 34" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="41" y1="48" x2="61" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="41" y1="60" x2="61" y2="60" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="41" y1="72" x2="55" y2="72" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="275" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Kill Ring (Yank Buffer)</text>
  </g>
</svg>