<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Four workers sharing one dataset: RSS overcounts, PSS adds up</title>
  <desc>Infographic illustrating how Linux memory accounting works with multiple workers sharing a memory-mapped dataset, comparing USS, PSS, and RSS.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Four workers sharing one dataset:</text>
  <text x="40" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">RSS overcounts, PSS adds up</text>

  
  <rect x="40" y="145" width="920" height="690" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(56, 165)">
    <rect width="210" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="85" y="16" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="85" y1="26" x2="125" y2="26" stroke="#207448" stroke-width="2" />
    <circle cx="93" cy="21" r="2" fill="#207448" />
    <circle cx="101" cy="21" r="2" fill="#207448" />
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">worker 1</text>
    
    
    <rect x="8" y="98" width="194" height="196" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 KiB</text>
    <text x="105" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">private</text>
    <text x="105" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">anonymous</text>
  </g>

  
  <g transform="translate(282, 165)">
    <rect width="210" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="85" y="16" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="85" y1="26" x2="125" y2="26" stroke="#207448" stroke-width="2" />
    <circle cx="93" cy="21" r="2" fill="#207448" />
    <circle cx="101" cy="21" r="2" fill="#207448" />
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">worker 2</text>
    
    
    <rect x="8" y="98" width="194" height="196" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 KiB</text>
    <text x="105" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">private</text>
    <text x="105" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">anonymous</text>
  </g>

  
  <g transform="translate(508, 165)">
    <rect width="210" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="85" y="16" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="85" y1="26" x2="125" y2="26" stroke="#207448" stroke-width="2" />
    <circle cx="93" cy="21" r="2" fill="#207448" />
    <circle cx="101" cy="21" r="2" fill="#207448" />
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">worker 3</text>
    
    
    <rect x="8" y="98" width="194" height="196" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 KiB</text>
    <text x="105" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">private</text>
    <text x="105" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">anonymous</text>
  </g>

  
  <g transform="translate(734, 165)">
    <rect width="210" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="85" y="16" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="85" y1="26" x2="125" y2="26" stroke="#207448" stroke-width="2" />
    <circle cx="93" cy="21" r="2" fill="#207448" />
    <circle cx="101" cy="21" r="2" fill="#207448" />
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">worker 4</text>
    
    
    <rect x="8" y="98" width="194" height="196" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="105" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 KiB</text>
    <text x="105" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">private</text>
    <text x="105" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">anonymous</text>
  </g>

  
  <line x1="161" y1="475" x2="161" y2="569" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="387" y1="475" x2="387" y2="569" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="613" y1="475" x2="613" y2="569" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="839" y1="475" x2="839" y2="569" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(56, 575)">
    <rect width="888" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(35, 38)" fill="none" stroke="#207448" stroke-width="3.5">
      <ellipse cx="28" cy="14" rx="28" ry="12" />
      <path d="M 0 14 L 0 46 A 28 12 0 0 0 56 46 L 56 14" />
      <path d="M 0 30 A 28 12 0 0 0 56 30" />
    </g>
    <text x="125" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">400,000 KiB memory-mapped dataset</text>
  </g>

  
  <rect x="1000" y="145" width="560" height="690" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1018, 160)">
    <rect width="524" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    
    <path d="M 30 20 L 46 26 L 46 44 C 46 54 30 62 30 62 C 30 62 14 54 14 44 L 14 26 Z" fill="none" stroke="#207448" stroke-width="3" />
    <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">USS (unique set size):</text>
    <text x="64" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">only private memory</text>
    <rect x="20" y="82" width="484" height="42" rx="6" fill="#e8f1ea" />
    <text x="36" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 KiB per worker</text>
  </g>

  
  <g transform="translate(1018, 308)">
    <rect width="524" height="258" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(16, 16)" fill="none" stroke="#207448" stroke-width="3">
      <line x1="24" y1="8" x2="24" y2="44" />
      <line x1="8" y1="18" x2="40" y2="18" />
      <polygon points="8,18 2,32 14,32" />
      <polygon points="40,18 34,32 46,32" />
    </g>
    <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">PSS (proportional set size):</text>
    <text x="64" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">shared pages divided among</text>
    <text x="64" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">their users</text>
    
    <rect x="20" y="112" width="484" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" />
    <text x="36" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">100,000 + 400,000 / 4 =</text>
    <text x="36" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">200,000 KiB per worker</text>
    
    
    <rect x="20" y="194" width="484" height="52" rx="8" fill="#207448" />
    <text x="36" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">total 800,000 KiB</text>
    <text x="270" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#e8f1ea">adds up correctly</text>
  </g>

  
  <g transform="translate(1018, 578)">
    <rect width="524" height="245" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    
    <g transform="translate(16, 16)" fill="none" stroke="#db8129" stroke-width="3">
      <rect x="6" y="6" width="26" height="26" rx="3" />
      <rect x="16" y="16" width="26" height="26" rx="3" />
    </g>
    <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">RSS (resident set size):</text>
    <text x="64" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">shared pages counted in every</text>
    <text x="64" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">process that maps them</text>
    
    <rect x="20" y="110" width="484" height="70" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="1" />
    <text x="36" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">100,000 + 400,000 =</text>
    <text x="36" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">500,000 KiB per worker</text>
    
    
    <rect x="20" y="186" width="484" height="50" rx="8" fill="#db8129" />
    <text x="36" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">total 2,000,000 KiB</text>
    <text x="280" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">overstates real use</text>
  </g>

  
  <g transform="translate(40, 855)">
    <rect width="1520" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="32" cy="29" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="32" y="37" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#207448">i</text>
    <text x="60" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">VSZ or VIRT counts everything allocated, RSS only the part in RAM</text>
  </g>

  
  <g transform="translate(40, 930)">
    <rect width="1520" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 18)" fill="none" stroke="#207448" stroke-width="3">
      <rect x="0" y="0" width="36" height="28" rx="4" />
      <path d="M 8 9 L 16 14 L 8 19" />
      <line x1="18" y1="20" x2="26" y2="20" />
    </g>
    <text x="75" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Where to read them:</text>
    
    
    <rect x="24" y="58" width="410" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">/proc/PID/smaps_rollup</text>
    
    
    <rect x="454" y="58" width="190" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="470" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">smem -rk</text>
    
    
    <rect x="664" y="58" width="180" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="680" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">pmap -X</text>
    
    
    <rect x="864" y="58" width="330" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="880" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">ps -eo pid,rss,vsz</text>
  </g>

  
  <g transform="translate(40, 1070)">
    <rect width="1520" height="65" rx="10" fill="#207448" />
    
    <circle cx="36" cy="32" r="16" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 27 32 L 33 38 L 46 25" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Summing RSS over processes overstates real use; sum PSS instead</text>
  </g>
</svg>