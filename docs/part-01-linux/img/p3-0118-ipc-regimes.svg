<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Busy is not efficient: IPC tells you whether the CPU is stalled or executing</title>
  <desc>An infographic explaining how Instructions Per Cycle (IPC) distinguishes memory-stalled CPU cycles from active instruction execution.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="40" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">Busy is not efficient: IPC tells you</tspan>
    <tspan x="40" dy="56">whether the CPU is stalled or executing</tspan>
  </text>

  
  <g id="ipc-scale-panel">
    <rect x="40" y="145" width="1520" height="305" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(60, 165)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="40" height="40" rx="6"/>
      <line x1="18" y1="16" x2="18" y2="32"/>
      <line x1="30" y1="16" x2="30" y2="32"/>
      <line x1="12" y1="0" x2="12" y2="4"/>
      <line x1="24" y1="0" x2="24" y2="4"/>
      <line x1="36" y1="0" x2="36" y2="4"/>
      <line x1="12" y1="44" x2="12" y2="48"/>
      <line x1="24" y1="44" x2="24" y2="48"/>
      <line x1="36" y1="44" x2="36" y2="48"/>
    </g>

    
    <text x="125" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">mostly stalled, usually on memory</tspan>
      <tspan x="125" dy="32">(below about 0.2 to 0.5)</tspan>
    </text>

    
    <g transform="translate(1120, 165)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="40" height="40" rx="6"/>
      <path d="M26 14 L18 26 L28 26 L22 36"/>
      <line x1="12" y1="0" x2="12" y2="4"/>
      <line x1="24" y1="0" x2="24" y2="4"/>
      <line x1="36" y1="0" x2="36" y2="4"/>
      <line x1="12" y1="44" x2="12" y2="48"/>
      <line x1="24" y1="44" x2="24" y2="48"/>
      <line x1="36" y1="44" x2="36" y2="48"/>
    </g>

    
    <text x="1185" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1185" dy="0">busy executing</tspan>
      <tspan x="1185" dy="32">(above about 1 to 2)</tspan>
    </text>

    
    
    <rect x="140" y="278" width="330" height="14" rx="7" fill="#f5d5ba"/>
    
    <rect x="470" y="278" width="330" height="14" fill="#d2e3d6"/>
    
    <rect x="800" y="278" width="660" height="14" rx="7" fill="#a4cfb1"/>

    
    <line x1="140" y1="285" x2="1460" y2="285" stroke="#207448" stroke-width="4"/>

    
    <line x1="140" y1="265" x2="140" y2="305" stroke="#207448" stroke-width="4"/>
    <text x="140" y="336" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">0</text>

    <line x1="1460" y1="265" x2="1460" y2="305" stroke="#207448" stroke-width="4"/>
    <text x="1460" y="336" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">2</text>

    
    <line x1="338" y1="260" x2="338" y2="310" stroke="#207448" stroke-width="4"/>
    <circle cx="338" cy="285" r="9" fill="#207448"/>
    <text x="338" y="248" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">IPC 0.30</text>

    
    <line x1="741" y1="260" x2="741" y2="310" stroke="#207448" stroke-width="4"/>
    <circle cx="741" cy="285" r="9" fill="#207448"/>
    <text x="741" y="248" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">IPC 0.91</text>

    
    <text x="741" y="350" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="741" dy="0">(the pmcarch sample: 87,166,313 instructions over</tspan>
      <tspan x="741" dy="34">96,163,187 cycles, BMR% 3.44, LLC% 73.45)</tspan>
    </text>

    
    <line x1="1328" y1="260" x2="1328" y2="310" stroke="#207448" stroke-width="4"/>
    <circle cx="1328" cy="285" r="9" fill="#207448"/>
    <text x="1328" y="248" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">IPC 1.80</text>
  </g>

  
  <g id="advice-box-030">
    <rect x="40" y="475" width="465" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 495)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="44" height="26" rx="4"/>
      <line x1="12" y1="34" x2="12" y2="40"/>
      <line x1="20" y1="34" x2="20" y2="40"/>
      <line x1="28" y1="34" x2="28" y2="40"/>
      <line x1="36" y1="34" x2="36" y2="40"/>
      <circle cx="16" cy="21" r="3" fill="#207448"/>
      <circle cx="26" cy="21" r="3" fill="#207448"/>
      <circle cx="36" cy="21" r="3" fill="#207448"/>
    </g>
    <text x="130" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">Faster memory, better locality,</tspan>
      <tspan x="65" dy="35">fewer memory accesses; check</tspan>
      <tspan x="65" dy="35">NUMA, cache misses, TLB;</tspan>
      <tspan x="65" dy="35">consider huge pages, binding,</tspan>
      <tspan x="65" dy="35">data layout</tspan>
    </text>
  </g>

  
  <g id="advice-box-180">
    <rect x="530" y="475" width="465" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(555, 495)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="12"/>
      <path d="M26 6 L26 14 M26 38 L26 46 M6 26 L14 26 M38 26 L46 26 M12 12 L18 18 M34 34 L40 40 M12 40 L18 34 M34 18 L40 12"/>
    </g>
    <text x="620" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="620" dy="0">Run fewer instructions:</tspan>
      <tspan x="555" dy="38">a better algorithm,</tspan>
      <tspan x="555" dy="38">vectorisation,</tspan>
      <tspan x="555" dy="38">compiler options</tspan>
    </text>
  </g>

  
  <g id="callout-utilisation">
    <rect x="40" y="725" width="955" height="150" rx="16" fill="#fdf5ec" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(65, 755)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 6 L48 44 L4 44 Z"/>
      <line x1="26" y1="20" x2="26" y2="30"/>
      <circle cx="26" cy="38" r="1.5" fill="#db8129"/>
    </g>
    <text x="135" y="770" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">Utilisation counts every cycle that is not idle, including</tspan>
      <tspan x="135" dy="35">cycles spent waiting on memory, so a CPU at 100% busy</tspan>
      <tspan x="135" dy="35">is not necessarily 100% efficient</tspan>
    </text>
  </g>

  
  <g id="right-strip-measure">
    <rect x="1020" y="475" width="540" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1045, 498)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="44" height="36" rx="6"/>
      <path d="M14 18 L22 24 L14 30"/>
      <line x1="26" y1="30" x2="38" y2="30"/>
    </g>
    
    <text x="1105" y="532" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">How to measure</text>

    
    <rect x="1045" y="560" width="490" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1065" y="595" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1065" dy="0">perf stat -e cycles,</tspan>
      <tspan x="1065" dy="32">instructions,cache-misses,</tspan>
      <tspan x="1065" dy="32">context-switches,</tspan>
      <tspan x="1065" dy="32">cpu-migrations ./prog</tspan>
    </text>

    
    <rect x="1045" y="718" width="490" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1065" y="753" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1065" dy="0">pmcarch prints K_CYCLES,</tspan>
      <tspan x="1065" dy="32">K_INSTR, IPC, BR_RETIRED,</tspan>
      <tspan x="1065" dy="32">BR_MISPRED, BMR%,</tspan>
      <tspan x="1065" dy="32">LLCREF, LLCMISS, LLC%</tspan>
    </text>
  </g>

  
  <g id="footer-section">
    <rect x="40" y="898" width="1520" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(65, 922)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="42" height="14" rx="3"/>
      <rect x="4" y="26" width="42" height="14" rx="3"/>
      <circle cx="12" cy="13" r="1.5" fill="#207448"/>
      <circle cx="12" cy="33" r="1.5" fill="#207448"/>
      <line x1="34" y1="13" x2="40" y2="13"/>
      <line x1="34" y1="33" x2="40" y2="33"/>
    </g>
    <text x="135" y="940" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">A training job whose host threads show high CPU use</tspan>
      <tspan x="135" dy="34">and low IPC is memory-bound on the host</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1018" width="1520" height="78" rx="12" fill="#207448"/>
    <text x="800" y="1068" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Keep utilisation and efficiency apart</text>
  </g>
</svg>