<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>Latency scaled to human time</title>
  <desc>A ladder table comparing typical computer operation latencies scaled proportionally to human time.</desc>

  <rect width="1600" height="1280" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Latency scaled to human time</text>

  
  <rect x="80" y="120" width="1440" height="64" rx="10" fill="#207448"/>
  <text x="140" y="162" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Event</text>
  <text x="700" y="162" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Typical latency</text>
  <text x="1140" y="162" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Scaled</text>

  
  <rect x="80" y="200" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="237" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="246" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">CPU cycle</text>
  <text x="700" y="246" font-family="monospace" font-size="24" fill="#207448">0.3 ns</text>
  <text x="1140" y="246" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">1 s</text>

  
  <rect x="80" y="286" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="323" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="332" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">L1 cache</text>
  <text x="700" y="332" font-family="monospace" font-size="24" fill="#207448">1 ns</text>
  <text x="1140" y="332" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">3 s</text>

  
  <rect x="80" y="372" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="409" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="418" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">L2 cache</text>
  <text x="700" y="418" font-family="monospace" font-size="24" fill="#207448">3 ns</text>
  <text x="1140" y="418" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">10 s</text>

  
  <rect x="80" y="458" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="495" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">L3 cache</text>
  <text x="700" y="504" font-family="monospace" font-size="24" fill="#207448">10 ns</text>
  <text x="1140" y="504" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">33 s</text>

  
  <rect x="80" y="544" width="1440" height="74" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <circle cx="112" cy="581" r="14" fill="#db8129"/>
  <text x="146" y="590" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">DRAM</text>
  <text x="700" y="590" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">100 ns</text>
  <text x="1140" y="590" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">6 minutes</text>

  
  <rect x="80" y="630" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="667" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="676" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NVMe / flash I/O</text>
  <text x="700" y="676" font-family="monospace" font-size="24" fill="#207448">10 to 100 µs</text>
  <text x="1140" y="676" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">9 to 90 hours</text>

  
  <rect x="80" y="716" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="753" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="762" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Rotational disk I/O</text>
  <text x="700" y="762" font-family="monospace" font-size="24" fill="#207448">1 to 10 ms</text>
  <text x="1140" y="762" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">1 to 12 months</text>

  
  <rect x="80" y="802" width="1440" height="74" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <circle cx="112" cy="839" r="14" fill="#db8129"/>
  <text x="146" y="848" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Cross-continent network (SF to NY)</text>
  <text x="700" y="848" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">40 ms</text>
  <text x="1140" y="848" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">4 years</text>

  
  <rect x="80" y="888" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="925" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="934" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TCP retransmit timeout</text>
  <text x="700" y="934" font-family="monospace" font-size="24" fill="#207448">1 to 3 s</text>
  <text x="1140" y="934" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">centuries</text>

  
  <rect x="80" y="974" width="1440" height="74" rx="10" fill="#ffffff" stroke="#d5e3d8" stroke-width="2"/>
  <circle cx="112" cy="1011" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="146" y="1020" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Physical server reboot</text>
  <text x="700" y="1020" font-family="monospace" font-size="24" fill="#207448">minutes</text>
  <text x="1140" y="1020" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">tens of millennia</text>

  
  <rect x="80" y="1100" width="1440" height="96" rx="12" fill="#207448"/>
  <text x="800" y="1158" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Takeaway: a 10 µs disk read is really a cache hit, not a disk.</text>
</svg>