<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Reading an OOM report: which part points at which consumer</title>
  <desc>Visual guide to diagnosing Linux out-of-memory killer reports and identifying memory consumers</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
    <linearGradient id="scale-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#207448" />
      <stop offset="45%" stop-color="#4ea375" />
      <stop offset="65%" stop-color="#d4b45d" />
      <stop offset="100%" stop-color="#db8129" />
    </linearGradient>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Reading an OOM report: which part points at which consumer</text>

  

  
  <rect x="50" y="120" width="730" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="96" cy="187" r="24" fill="#207448" />
  <text x="96" y="195" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="145" y="162" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">invoked oom-killer line:</tspan>
    <tspan x="145" dy="34">who requested memory,</tspan>
    <tspan x="145" dy="34">with gfp_mask and order</tspan>
  </text>

  
  <rect x="50" y="275" width="730" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="96" cy="347" r="24" fill="#207448" />
  <text x="96" y="355" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="145" y="320" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Mem-Info summary:</tspan>
    <tspan x="145" dy="34">active_anon, inactive_file,</tspan>
    <tspan x="145" dy="34">slab_reclaimable, free, shmem</tspan>
  </text>

  
  <rect x="50" y="440" width="730" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="96" cy="497" r="24" fill="#207448" />
  <text x="96" y="505" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="145" y="485" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Per-zone free counts</tspan>
    <tspan x="145" dy="34">(Node 0 DMA32 free ...)</tspan>
  </text>

  
  <rect x="50" y="575" width="730" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="96" cy="647" r="24" fill="#207448" />
  <text x="96" y="655" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="145" y="620" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Task table:</tspan>
    <tspan x="145" dy="34">pid, uid, total_vm, rss,</tspan>
    <tspan x="145" dy="34">oom_score_adj, name</tspan>
  </text>

  
  <rect x="50" y="740" width="730" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="96" cy="827" r="24" fill="#207448" />
  <text x="96" y="835" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="145" y="785" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold">Killed process line:</tspan>
    <tspan x="145" dy="34">Out of memory: Killed process 1234</tspan>
    <tspan x="145" dy="34">(python) total-vm:... anon-rss:...</tspan>
  </text>

  

  
  <rect x="850" y="120" width="700" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="1200" y="164" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Which grew?</text>

  
  <path d="M 880 186 V 684" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 880 244 H 912" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 880 479 H 912" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 880 684 H 912" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="920" y="220" width="350" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1095" y="252" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">shmem or tmpfs is huge</text>
  
  <path d="M 1095 268 V 292" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <rect x="900" y="300" width="650" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1475, 335)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="25" cy="12" rx="22" ry="9" />
    <path d="M 3 12 v 22 c 0 5 10 9 22 9 s 22 -4 22 -9 v -22" />
    <path d="M 3 23 c 0 5 10 9 22 9 s 22 -4 22 -9" />
  </g>
  <text x="930" y="342" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="930" dy="0" font-weight="bold">An in-memory filesystem is the consumer:</tspan>
    <tspan x="930" dy="34">/dev/shm, /tmp on tmpfs, or</tspan>
    <tspan x="930" dy="34">an emptyDir with the Memory medium</tspan>
  </text>

  
  
  <rect x="920" y="455" width="370" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1105" y="487" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">slab_unreclaimable is huge</text>
  
  <path d="M 1105 503 V 527" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <rect x="900" y="535" width="650" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1475, 555)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 25 5 L 45 14 v 16 c 0 16 -20 25 -20 25 S 5 46 5 30 V 14 z" />
  </g>
  <text x="930" y="592" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Suspect a kernel or driver leak</text>

  
  
  <rect x="920" y="660" width="450" height="48" rx="24" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="1145" y="692" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">anon_rss of one process dominates</text>
  
  <path d="M 1145 708 V 732" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  
  <rect x="900" y="740" width="650" height="95" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(1475, 760)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="5" y="8" width="40" height="34" rx="4" />
    <line x1="5" y1="18" x2="45" y2="18" />
    <circle cx="12" cy="13" r="2" fill="#db8129" />
    <circle cx="18" cy="13" r="2" fill="#db8129" />
  </g>
  <text x="930" y="797" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">The application is the consumer</text>

  
  <rect x="50" y="945" width="1500" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="80" y="975" width="1440" height="28" rx="6" fill="url(#scale-grad)" />

  
  <line x1="80" y1="970" x2="80" y2="1008" stroke="#207448" stroke-width="3" />
  <line x1="152" y1="970" x2="152" y2="1008" stroke="#207448" stroke-width="3" />
  <line x1="800" y1="970" x2="800" y2="1008" stroke="#303a36" stroke-width="3" />
  <line x1="1160" y1="970" x2="1160" y2="1008" stroke="#db8129" stroke-width="3" />
  <line x1="1520" y1="970" x2="1520" y2="1008" stroke="#db8129" stroke-width="3" />

  
  <text x="80" y="1045" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0" font-weight="bold">oom_score_adj from -1000 (immune) through -900 (OOMScoreAdjust for sshd and kubelet)</tspan>
    <tspan x="80" dy="38" font-weight="bold">and 0 to +500 (batch workers) to +1000 (first choice);</tspan>
    <tspan x="80" dy="38">oom_score 0 to 1000 tracks share of RAM and swap used</tspan>
  </text>

  
  <rect x="50" y="1205" width="1500" height="80" rx="10" fill="#207448" />
  <text x="800" y="1255" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Before you raise a memory limit, find which of the three grew</text>
</svg>