<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A unit file has three sections, and each one answers a different question</title>
  <desc>Visual explanation of the three sections in a systemd service file: Unit, Service, and Install, showing their specific directives and the question each section answers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A unit file has three sections,</tspan>
    <tspan x="800" dy="54">and each one answers a different question</tspan>
  </text>

  
  <g transform="translate(70, 140)">
    
    <rect x="0" y="0" width="860" height="740" rx="12" fill="#ffffff" stroke="#b8c7bc" stroke-width="2" />

    
    <path d="M 0 12 Q 0 0 12 0 L 848 0 Q 860 0 860 12 L 860 56 L 0 56 Z" fill="#e8f1ea" stroke="#b8c7bc" stroke-width="2" />
    
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="2.5" fill="none">
      <path d="M 0 0 L 16 0 L 24 8 L 24 26 L 0 26 Z" />
      <path d="M 16 0 L 16 8 L 24 8" />
      <line x1="6" y1="12" x2="18" y2="12" />
      <line x1="6" y1="17" x2="18" y2="17" />
      <line x1="6" y1="22" x2="14" y2="22" />
    </g>

    
    <text x="64" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">/etc/systemd/system/gpu-exporter.service</text>

    
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="820" height="216" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="3.5" fill="none">
        <circle cx="20" cy="20" r="18" />
        <polyline points="20,10 20,20 28,24" />
      </g>

      
      <text x="72" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">[Unit]</text>
      <text x="210" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Identity and relationships</text>

      
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
        <text x="24" y="82">Description=GPU metrics exporter</text>
        <text x="24" y="118">After=network-online.target nvidia-persistenced.service</text>
        <text x="24" y="154">Wants=network-online.target</text>
        <text x="24" y="190">Requires=nvidia-persistenced.service</text>
      </g>
    </g>

    
    <g transform="translate(20, 304)">
      
      <rect x="0" y="0" width="820" height="216" rx="8" fill="#fdfcfb" stroke="#db8129" stroke-width="3.5" />
      
      
      <g transform="translate(20, 16)" stroke="#db8129" stroke-width="3" fill="none">
        <circle cx="20" cy="20" r="8" />
        <path d="M 20 6 L 20 10 M 20 30 L 20 34 M 6 20 L 10 20 M 30 20 L 34 20 M 10 10 L 13 13 M 27 27 L 30 30 M 10 30 L 13 27 M 27 13 L 30 10" />
      </g>

      
      <text x="72" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">[Service]</text>
      <text x="250" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">How the unit behaves</text>

      
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
        <text x="24" y="82">Type=simple</text>
        <text x="24" y="118">ExecStart=/usr/local/bin/gpu-exporter</text>
        <text x="24" y="154">Restart=on-failure</text>
        <text x="24" y="190">RestartSec=5s</text>
      </g>
    </g>

    
    <g transform="translate(20, 536)">
      <rect x="0" y="0" width="820" height="176" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="20" cy="20" r="18" />
        <circle cx="20" cy="20" r="10" />
        <circle cx="20" cy="20" r="3" fill="#207448" />
      </g>

      
      <text x="72" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">[Install]</text>
      <text x="235" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Enablement, read by systemctl enable</text>

      
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
        <text x="24" y="96">WantedBy=multi-user.target</text>
      </g>
    </g>
  </g>

  

  
  <line x1="930" y1="320" x2="1050" y2="320" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <g transform="translate(1050, 276)">
    <rect x="0" y="0" width="480" height="88" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="240" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">when to start</text>
  </g>

  
  <line x1="930" y1="528" x2="1050" y2="528" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <g transform="translate(1050, 484)">
    <rect x="0" y="0" width="480" height="88" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <text x="240" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">how to run</text>
  </g>

  
  <g transform="translate(1050, 596)">
    <rect x="0" y="0" width="480" height="136" rx="10" fill="#f0f2f0" stroke="#8c9a91" stroke-width="2" stroke-dasharray="7 5" />
    
    <g transform="translate(20, 24)" stroke="#55635c" stroke-width="2.5" fill="none">
      <circle cx="14" cy="14" r="13" />
      <line x1="14" y1="8" x2="14" y2="15" />
      <circle cx="14" cy="20" r="1.5" fill="#55635c" />
    </g>
    
    <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">Exec lines run without a shell:</tspan>
      <tspan x="64" dy="36">pipes, redirects and &amp;&amp;</tspan>
      <tspan x="64" dy="36">do not work.</tspan>
    </text>
  </g>

  
  <line x1="930" y1="764" x2="1050" y2="764" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <g transform="translate(1050, 720)">
    <rect x="0" y="0" width="480" height="88" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="240" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">which target wants it</text>
  </g>

  
  <text x="800" y="945" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Three sections, three conversations with systemd.</text>
</svg>