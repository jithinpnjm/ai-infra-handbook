<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>How systemd knows a service is started</title>
  <desc>Visual comparison table of systemd service startup types, readiness criteria, and use cases.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="80" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How systemd knows a service is started</text>

  
  <rect x="60" y="125" width="1480" height="65" rx="12" fill="#207448" />
  <text x="180" y="168" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Type=</text>
  <text x="440" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Considered started when</text>
  <text x="1140" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Use</text>

  
  <g transform="translate(60, 205)">
    <rect width="1480" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 39)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14" />
      <path d="M28 4 v6 M28 46 v6 M4 28 h6 M46 28 h6 M11 11 l4.2 4.2 M41 41 l4.2 4.2 M11 45 l4.2 -4.2 M41 15 l4.2 -4.2" />
    </g>
    <text x="105" y="78" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">simple (default)</text>
    <text x="440" y="78" font-family="sans-serif" font-size="24" fill="#303a36">right after fork, process stays in foreground</text>
    <text x="1140" y="78" font-family="sans-serif" font-size="24" fill="#303a36">modern foreground daemons</text>
  </g>

  
  <g transform="translate(60, 355)">
    <rect width="1480" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 39)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6" />
      <path d="M14 24 l8 6 l-8 6 M28 36 h14" />
    </g>
    <text x="105" y="78" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">exec</text>
    <text x="440" y="78" font-family="sans-serif" font-size="24" fill="#303a36">after exec() succeeds</text>
    <text x="1140" y="78" font-family="sans-serif" font-size="24" fill="#303a36">catches missing binaries</text>
  </g>

  
  <g transform="translate(60, 505)">
    <rect width="1480" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 39)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="14" r="6" />
      <circle cx="42" cy="14" r="6" />
      <circle cx="28" cy="42" r="6" />
      <path d="M28 36 v-8 M14 20 v4 c0 6 14 6 14 12 M42 20 v4 c0 6 -14 6 -14 12" />
    </g>
    <text x="105" y="78" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">forking</text>
    <text x="440" y="78" font-family="sans-serif" font-size="24" fill="#303a36">parent exits, systemd tracks the child</text>
    <text x="1140" y="78" font-family="sans-serif" font-size="24" fill="#303a36">traditional daemons</text>
  </g>

  
  <g transform="translate(60, 655)">
    <rect width="1480" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 39)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M16 28 l8 8 l16 -16" />
    </g>
    <text x="105" y="78" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">oneshot</text>
    <text x="440" y="60" font-family="sans-serif" font-size="24" fill="#303a36">process runs to completion,</text>
    <text x="440" y="96" font-family="sans-serif" font-size="24" fill="#303a36">often with <tspan font-family="monospace">RemainAfterExit=yes</tspan></text>
    <text x="1140" y="78" font-family="sans-serif" font-size="24" fill="#303a36">setup tasks</text>
  </g>

  
  <g transform="translate(60, 805)">
    <rect width="1480" height="135" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(30, 39)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8 a14 14 0 0 0 -14 14 c0 12 -6 16 -6 16 h40 c0 0 -6 -4 -6 -16 a14 14 0 0 0 -14 -14" />
      <path d="M22 42 a6 6 0 0 0 12 0" />
    </g>
    <text x="105" y="78" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">notify</text>
    <text x="440" y="78" font-family="sans-serif" font-size="24" fill="#303a36">service calls <tspan font-family="monospace">sd_notify("READY=1")</tspan></text>
    <text x="1140" y="78" font-family="sans-serif" font-size="24" fill="#303a36">daemons with explicit readiness</text>
  </g>

  
  <g transform="translate(60, 970)">
    <rect width="1480" height="80" rx="16" fill="#207448" />
    <text x="740" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">systemd tracks all processes with cgroups.</text>
  </g>
</svg>