<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Tracing overhead rules</title>
  <desc>Visual infographic explaining tracing overhead rules, including an event rate scale bar, a probe preference ladder, and bottom rules for keeping overhead low.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Tracing overhead rules</text>

  <g id="left-panel">
    <rect x="50" y="105" width="725" height="665" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g transform="translate(75, 122)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 6 42 A 24 24 0 1 1 50 42"/>
      <line x1="28" y1="28" x2="38" y2="16"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
    </g>
    <text x="145" y="160" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">scale bar for event rate</text>

    <g id="card-rate-low">
      <rect x="75" y="195" width="675" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(98, 234)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 28 6 L 48 14 V 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 V 14 Z"/>
        <polyline points="18 28 25 35 38 20"/>
      </g>
      <text x="175" y="252" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="175" dy="0">under about 10k events</tspan>
        <tspan x="175" dy="36">per second is negligible</tspan>
      </text>
    </g>

    <g id="card-rate-med">
      <rect x="75" y="350" width="675" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(98, 389)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 28 8 L 50 46 H 6 Z"/>
        <line x1="28" y1="22" x2="28" y2="32"/>
        <circle cx="28" cy="40" r="2" fill="#207448"/>
      </g>
      <text x="175" y="407" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="175" dy="0">above about 100k per second</tspan>
        <tspan x="175" dy="36">needs care</tspan>
      </text>
    </g>

    <g id="card-rate-high">
      <rect x="75" y="505" width="675" height="240" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="3.5"/>
      <g transform="translate(98, 597)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 30 6 C 30 6 38 18 38 28 C 38 42 26 50 16 42 C 26 38 28 26 28 26 C 28 26 14 34 14 44 C 14 47 16 50 18 52 C 10 48 6 38 6 28 C 6 16 18 8 30 6 Z"/>
        <circle cx="28" cy="30" r="2" fill="#db8129"/>
      </g>
      <text x="175" y="562" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="175" dy="0">scheduler, memory allocation,</tspan>
        <tspan x="175" dy="38">network packet and syscall events</tspan>
        <tspan x="175" dy="38" fill="#db8129">can exceed 1M per second</tspan>
      </text>
    </g>
  </g>

  <g id="right-panel">
    <rect x="825" y="105" width="725" height="665" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g transform="translate(850, 122)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="12" y1="8" x2="12" y2="48"/>
      <line x1="44" y1="8" x2="44" y2="48"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <line x1="12" y1="28" x2="44" y2="28"/>
      <line x1="12" y1="38" x2="44" y2="38"/>
    </g>
    <text x="920" y="160" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">preference ladder</text>

    <g id="step-tracepoints">
      <rect x="850" y="195" width="675" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(875, 227)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="22"/>
        <circle cx="28" cy="28" r="12"/>
        <circle cx="28" cy="28" r="3" fill="#207448"/>
      </g>
      <text x="955" y="267" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">tracepoints</text>
    </g>

    <g id="step-kprobes">
      <rect x="850" y="335" width="675" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(875, 367)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="10"/>
        <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12"/>
      </g>
      <text x="955" y="407" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">then kprobes</text>
    </g>

    <g id="step-uprobes">
      <rect x="850" y="475" width="675" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(875, 502)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="6" y="8" width="44" height="36" rx="4"/>
        <line x1="6" y1="18" x2="50" y2="18"/>
        <circle cx="12" cy="13" r="2" fill="#207448"/>
        <circle cx="18" cy="13" r="2" fill="#207448"/>
      </g>
      <text x="955" y="540" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">then uprobes</text>
      <text x="875" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="875" dy="0">(every uprobe hit traps into the kernel;</tspan>
        <tspan x="875" dy="36">avoid on <tspan font-family="monospace" font-weight="bold" fill="#207448">malloc</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#207448">memcpy</tspan>,</tspan>
        <tspan x="875" dy="36">CUDA launch paths)</tspan>
      </text>
    </g>
  </g>

  <g id="bottom-panel">
    <rect x="50" y="795" width="1500" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g transform="translate(75, 812)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 V 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 V 14 Z"/>
      <line x1="20" y1="22" x2="36" y2="22"/>
      <line x1="20" y1="30" x2="36" y2="30"/>
    </g>
    <text x="145" y="850" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Bottom rules</text>

    <g id="rule-count-first">
      <rect x="75" y="880" width="685" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(98, 912)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="30" r="20"/>
        <line x1="28" y1="10" x2="28" y2="6"/>
        <polyline points="28 20 28 30 36 30"/>
      </g>
      <text x="175" y="928" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="175" dy="0">count first with</tspan>
        <tspan x="175" dy="34" font-family="monospace" font-size="24" fill="#207448">perf stat -e event -a sleep 1</tspan>
      </text>
    </g>

    <g id="rule-aggregate">
      <rect x="790" y="880" width="735" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(815, 912)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="8" y1="48" x2="48" y2="48"/>
        <rect x="12" y="28" width="8" height="20" fill="#e8f1ea"/>
        <rect x="24" y="14" width="8" height="34" fill="#e8f1ea"/>
        <rect x="36" y="22" width="8" height="26" fill="#e8f1ea"/>
      </g>
      <text x="890" y="930" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="890" dy="0">aggregate in kernel</tspan>
        <tspan x="890" dy="34">with maps and histograms</tspan>
      </text>
    </g>

    <g id="rule-filter">
      <rect x="75" y="1020" width="685" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(98, 1052)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polygon points="6 10, 50 10, 34 28, 34 46, 22 46, 22 28"/>
      </g>
      <text x="175" y="1090" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">filter on PID, cgroup, comm</text>
    </g>

    <g id="rule-durations">
      <rect x="790" y="1020" width="735" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(815, 1052)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="22"/>
        <polyline points="28 14 28 28 38 28"/>
        <path d="M 44 10 L 50 4 M 44 46 L 50 52"/>
      </g>
      <text x="890" y="1090" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">keep durations short</text>
    </g>
  </g>
</svg>