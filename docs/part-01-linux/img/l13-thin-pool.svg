<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Thin provisioning</title>
  <desc>Visual infographic explaining LVM thin provisioning: virtual volumes over-provisioned against a shared thin pool, copy-on-write thin snapshots, and monitoring pool capacity to prevent corruption.</desc>

  <rect width="1600" height="1040" fill="#f5f8f5" />

  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Thin provisioning</text>

  
  <g id="virtual-volumes-layer">
    <rect x="50" y="110" width="1500" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="108" cy="148" rx="22" ry="8" />
      <path d="M 86 148 v 12 c 0 4.5 9.8 8 22 8 s 22 -3.5 22 -8 v -12" />
      <path d="M 86 160 v 12 c 0 4.5 9.8 8 22 8 s 22 -3.5 22 -8 v -12" />
    </g>

    <text x="155" y="168" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">three virtual volumes</text>
    <text x="560" y="168" font-family="sans-serif" font-size="25" fill="#303a36">whose total size is larger than the pool (over-provisioning)</text>

    
    <g id="card-vol1">
      <rect x="80" y="200" width="470" height="205" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="135" cy="242" rx="20" ry="7" />
        <path d="M 115 242 v 18 c 0 4 9 7 20 7 s 20 -3 20 -7 v -18" />
      </g>
      <text x="180" y="254" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">vol1 200G</text>

      <rect x="100" y="290" width="430" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="120" y="332" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="120" dy="0">lvcreate -V 200G --thin</tspan>
        <tspan x="120" dy="32">-n vol1 myvg/tp</tspan>
      </text>
    </g>

    
    <g id="card-two-more">
      <rect x="580" y="200" width="320" height="205" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="620" cy="238" rx="18" ry="6" />
        <path d="M 602 238 v 12 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6 v -12" />
        <ellipse cx="648" cy="250" rx="18" ry="6" />
        <path d="M 630 250 v 12 c 0 3.5 8 6 18 6 s 18 -2.5 18 -6 v -12" />
      </g>
      <text x="690" y="254" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">two more</text>
    </g>

    
    <g id="card-vol1snap">
      <rect x="930" y="200" width="590" height="205" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="965" y="235" width="48" height="36" rx="6" />
        <circle cx="989" cy="253" r="8" />
        <path d="M 977 235 L 981 227 L 997 227 L 1001 235" />
      </g>
      <text x="1035" y="254" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="1035" dy="0">A cheap thin snapshot</tspan>
        <tspan x="1035" dy="34">vol1snap, needs no size.</tspan>
      </text>
    </g>
  </g>

  
  <g id="thin-pool-layer">
    <rect x="50" y="470" width="1500" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="85" y="496" width="56" height="50" rx="8" />
      <line x1="85" y1="513" x2="141" y2="513" />
      <line x1="85" y1="529" x2="141" y2="529" />
      <circle cx="127" cy="505" r="2.5" fill="#207448" />
      <circle cx="127" cy="521" r="2.5" fill="#207448" />
      <circle cx="127" cy="537" r="2.5" fill="#207448" />
    </g>

    <text x="160" y="534" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">thin pool tp (500G)</text>

    
    <rect x="80" y="575" width="650" height="95" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="110" y="632" font-family="monospace" font-size="24" fill="#303a36">lvcreate -L 500G --thinpool tp myvg</text>

    
    <rect x="760" y="575" width="760" height="95" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="795" y="602" width="40" height="40" rx="6" />
      <line x1="805" y1="622" x2="825" y2="622" />
      <line x1="815" y1="612" x2="815" y2="632" />
    </g>
    <text x="860" y="632" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Space used only as data is written.</text>
  </g>

  
  <g id="warning-layer">
    <rect x="50" y="740" width="1500" height="250" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />

    
    <g stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="113,766 85,818 141,818" />
      <line x1="113" y1="784" x2="113" y2="800" />
      <circle cx="113" cy="809" r="2" fill="#db8129" />
    </g>

    <text x="165" y="790" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      <tspan x="165" dy="0">a thin pool that reaches 100% data or metadata</tspan>
      <tspan x="165" dy="36">corrupts or blocks the volumes in it, watch Data% and Meta%.</tspan>
    </text>

    <rect x="85" y="885" width="1430" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="120" y="932" font-family="monospace" font-size="24" fill="#303a36">lvs -a -o +data_percent,metadata_percent</text>
  </g>
</svg>