<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Rotation and open log files</title>
  <desc>Visual explanation of log file rotation, open file descriptors, inode tracking, and rotation fix strategies.</desc>

  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Rotation and open log files</text>

  
  <g>
    <rect x="50" y="110" width="460" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="98" cy="158" r="24" fill="#207448" />
    <text x="98" y="167" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(420, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M6 14v16c0 4.4 9.8 8 22 8s22-3.6 22-8V14" />
      <path d="M6 30v16c0 4.4 9.8 8 22 8s22-3.6 22-8V30" />
    </g>

    <text x="140" y="167" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Initial State</text>

    
    <text x="76" y="240" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">daemon writes to</tspan>
      <tspan font-family="monospace"> app.log</tspan>
      <tspan> (</tspan><tspan font-family="monospace">inode A</tspan><tspan>).</tspan>
    </text>

    
    <rect x="80" y="300" width="400" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="104" y="342" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Process</text>
    <text x="104" y="376" font-family="monospace" font-size="24" fill="#303a36">daemon (PID)</text>

    
    <path d="M 280 400 L 280 452" stroke="#207448" stroke-width="3" fill="none" />
    <polygon points="280,466 273,448 287,448" fill="#207448" />

    <rect x="80" y="470" width="400" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="104" y="512" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">File &amp; Storage</text>
    <text x="104" y="552" font-family="monospace" font-size="24" fill="#303a36">name: app.log</text>
    <text x="104" y="590" font-family="monospace" font-size="24" fill="#303a36">target: inode A</text>
  </g>

  
  <g>
    <rect x="570" y="110" width="460" height="570" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <circle cx="618" cy="158" r="24" fill="#207448" />
    <text x="618" y="167" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(940, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="6" width="36" height="46" rx="4" />
      <path d="M22 20h12" />
      <path d="M22 30h12" />
      <path d="M22 40h8" />
    </g>

    <text x="660" y="167" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Renamed</text>

    
    <rect x="590" y="210" width="420" height="200" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="606" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="606" dy="0"><tspan font-family="monospace">logrotate</tspan> renames</tspan>
      <tspan x="606" dy="36"><tspan font-family="monospace">app.log</tspan> to <tspan font-family="monospace">app.log.1</tspan>;</tspan>
      <tspan x="606" dy="38" fill="#db8129" font-weight="bold">the daemon still writes to</tspan>
      <tspan x="606" dy="34" fill="#db8129" font-weight="bold">the same inode, now under</tspan>
      <tspan x="606" dy="34" fill="#db8129" font-weight="bold">the new name</tspan>
    </text>

    
    <rect x="590" y="430" width="420" height="190" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="610" y="472" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Open File Descriptor</text>
    <text x="610" y="514" font-family="monospace" font-size="24" fill="#303a36">FD points to: inode A</text>
    <text x="610" y="556" font-family="monospace" font-size="24" fill="#303a36">old name: app.log</text>
    <text x="610" y="594" font-family="monospace" font-size="24" fill="#db8129">new name: app.log.1</text>
  </g>

  
  <g>
    <rect x="1090" y="110" width="460" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1138" cy="158" r="24" fill="#207448" />
    <text x="1138" y="167" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(1460, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8L10 16v14c0 14 18 22 18 22s18-8 18-22V16L28 8z" />
      <path d="M20 28l6 6 12-12" />
    </g>

    <text x="1180" y="167" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Solutions</text>

    
    <rect x="1110" y="210" width="420" height="440" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <text x="1126" y="252" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1126" dy="0" font-weight="bold" fill="#207448">Fix: tell the daemon to reopen</tspan>
      <tspan x="1126" dy="36">with <tspan font-family="monospace">SIGHUP</tspan> (postrotate:</tspan>
      <tspan x="1126" dy="36" font-family="monospace">systemctl kill -s HUP ...</tspan><tspan>),</tspan>
      <tspan x="1126" dy="48">or use <tspan font-family="monospace">copytruncate</tspan>, which</tspan>
      <tspan x="1126" dy="36">copies then truncates in</tspan>
      <tspan x="1126" dy="36">place and may lose lines in</tspan>
      <tspan x="1126" dy="36">the copy window.</tspan>
    </text>

    
    <rect x="1126" y="475" width="388" height="72" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="1142" y="518" font-family="monospace" font-size="24" fill="#207448">postrotate + SIGHUP</text>

    <rect x="1126" y="560" width="388" height="72" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="1142" y="603" font-family="monospace" font-size="24" fill="#303a36">copytruncate</text>
  </g>

  
  
  <path d="M 510 395 L 560 395" stroke="#207448" stroke-width="4" fill="none" />
  <polygon points="568,395 550,387 550,403" fill="#207448" />

  
  <path d="M 1030 395 L 1080 395" stroke="#207448" stroke-width="4" fill="none" />
  <polygon points="1088,395 1070,387 1070,403" fill="#207448" />

  
  <g transform="translate(0, 715)">
    <rect x="50" y="0" width="1500" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(80, 20)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10" />
      <path d="M28 6v6M28 44v6M6 28h6M44 28h6M12 12l5 5M39 39l5 5M12 44l5-5M39 17l5-5" />
    </g>

    <text x="156" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Config Directives</text>

    
    <g transform="translate(80, 80)">
      
      <rect x="0" y="0" width="160" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="80" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">daily</text>

      
      <rect x="180" y="0" width="200" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="280" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">rotate 14</text>

      
      <rect x="400" y="0" width="190" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="495" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">compress</text>

      
      <rect x="610" y="0" width="260" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="740" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">delaycompress</text>

      
      <rect x="890" y="0" width="200" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="990" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">missingok</text>

      
      <rect x="1110" y="0" width="220" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1220" y="34" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">notifempty</text>
    </g>
  </g>

  
  <g transform="translate(0, 895)">
    <rect x="50" y="0" width="1500" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(80, 20)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="38" rx="6" />
      <path d="M16 22l6 5-6 5" />
      <path d="M26 32h12" />
    </g>

    <text x="156" y="58" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Test with </tspan>
      <tspan font-family="monospace" fill="#303a36">sudo logrotate -d /etc/logrotate.d/slurm.</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 1015)">
    <rect x="50" y="0" width="1500" height="85" rx="16" fill="#207448" />
    
    
    <g transform="translate(80, 15)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <line x1="28" y1="26" x2="28" y2="38" />
      <circle cx="28" cy="18" r="2" fill="#ffffff" stroke="none" />
    </g>

    <text x="156" y="52" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Linux tracks the open file, not its name.
    </text>
  </g>
</svg>