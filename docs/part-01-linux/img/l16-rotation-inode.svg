<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Rotation and open log files</title>
  <desc>Infographic explaining Linux log rotation, open file descriptors, inode tracking, and rotation remedies.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Rotation and open log files</text>

  
  <g id="config-chips">
    <rect x="40" y="98" width="120" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="100" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">daily</text>

    <rect x="175" y="98" width="160" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="255" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">rotate 14</text>

    <rect x="350" y="98" width="150" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="425" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">compress</text>

    <rect x="515" y="98" width="220" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="625" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">delaycompress</text>

    <rect x="750" y="98" width="170" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="835" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">missingok</text>

    <rect x="935" y="98" width="180" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1025" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">notifempty</text>
  </g>

  
  <g id="step-1">
    <rect x="40" y="170" width="440" height="700" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="75" cy="212" r="22" fill="#207448"/>
    <text x="75" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="110" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Initial State</text>

    
    <g transform="translate(420, 192)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="14"/>
      <line x1="20" y1="2" x2="20" y2="8"/>
      <line x1="20" y1="32" x2="20" y2="38"/>
      <line x1="2" y1="20" x2="8" y2="20"/>
      <line x1="32" y1="20" x2="38" y2="20"/>
    </g>

    
    <text x="65" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">daemon writes to</tspan>
      <tspan x="65" dy="36">app.log (inode A)</tspan>
    </text>

    
    <g transform="translate(65, 380)">
      <rect x="0" y="0" width="390" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="25" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Process: Daemon</text>
      <text x="25" y="84" font-family="monospace" font-size="24" fill="#303a36">Open fd → inode A</text>

      <line x1="195" y1="120" x2="195" y2="185" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

      <rect x="0" y="195" width="390" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="25" y="245" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">app.log</text>
      <text x="25" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Filesystem entry pointing to:</text>
      <text x="25" y="320" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">[ inode A ] on disk</text>
    </g>
  </g>

  
  <g id="step-2">
    <rect x="510" y="170" width="480" height="700" rx="14" fill="#fffcf7" stroke="#db8129" stroke-width="3"/>

    
    <circle cx="550" cy="212" r="22" fill="#db8129"/>
    <text x="550" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="585" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">Rename Problem</text>

    
    <g transform="translate(930, 192)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 6 34 L 20 10 L 34 34 Z"/>
      <line x1="20" y1="19" x2="20" y2="25"/>
      <circle cx="20" cy="29" r="1.5" fill="#db8129"/>
    </g>

    
    <text x="535" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="535" dy="0">logrotate renames app.log</tspan>
      <tspan x="535" dy="34">to app.log.1; the daemon</tspan>
      <tspan x="535" dy="34">still writes to the same inode,</tspan>
      <tspan x="535" dy="34" fill="#db8129">now under the new name</tspan>
    </text>

    
    <g transform="translate(535, 430)">
      <rect x="0" y="0" width="430" height="100" rx="8" fill="#fff4e8" stroke="#db8129" stroke-width="2"/>
      <text x="25" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">Rename Action</text>
      <text x="25" y="78" font-family="monospace" font-size="24" fill="#303a36">app.log  →  app.log.1</text>

      <line x1="215" y1="110" x2="215" y2="155" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

      <rect x="0" y="165" width="430" height="135" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
      <text x="25" y="205" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">app.log.1 (inode A)</text>
      <text x="25" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Daemon still writes to inode A!</text>
      <text x="25" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Writes go to rotated file.</text>
    </g>
  </g>

  
  <g id="step-3">
    <rect x="1020" y="170" width="540" height="700" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="1060" cy="212" r="22" fill="#207448"/>
    <text x="1060" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1095" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Solutions</text>

    
    <g transform="translate(1500, 192)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 8 20 A 12 12 0 1 1 20 32"/>
      <polyline points="20 24 20 32 28 32"/>
    </g>

    
    <g transform="translate(1045, 260)">
      <rect x="0" y="0" width="490" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="25" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="25" dy="0">Fix: tell the daemon to reopen</tspan>
        <tspan x="25" dy="36">with SIGHUP</tspan>
      </text>

      <rect x="20" y="125" width="450" height="110" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="35" y="165" font-family="monospace" font-size="24" fill="#207448">
        <tspan x="35" dy="0">(postrotate:</tspan>
        <tspan x="35" dy="38"> systemctl kill -s HUP ...),</tspan>
      </text>
    </g>

    
    <g transform="translate(1045, 545)">
      <rect x="0" y="0" width="490" height="295" rx="10" fill="#fffcf7" stroke="#db8129" stroke-width="2"/>
      <text x="25" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0" font-weight="bold">or use copytruncate,</tspan>
        <tspan x="25" dy="38">which copies then truncates</tspan>
        <tspan x="25" dy="38">in place and may lose lines</tspan>
        <tspan x="25" dy="38" font-weight="bold" fill="#db8129">in the copy window.</tspan>
      </text>
    </g>
  </g>

  
  <g id="footer-takeaway">
    <rect x="40" y="895" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="800" y="943" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Linux tracks the open file, not its name.</text>
  </g>

  
  <g id="footer-test-cmd">
    <rect x="40" y="990" width="1520" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1038" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Test with sudo logrotate -d /etc/logrotate.d/slurm.</text>
  </g>
</svg>