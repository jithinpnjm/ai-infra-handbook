<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Syslog severity levels</title>
  <desc>Visual infographic explaining the eight syslog severity levels from 0 emerg to 7 debug, with urgency directions and journal priority mapping.</desc>

  <defs>
    
    <marker id="arrow-up" markerWidth="14" markerHeight="14" refX="7" refY="3" orient="auto">
      <path d="M 7,1 L 13,11 L 1,11 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-down" markerWidth="14" markerHeight="14" refX="7" refY="11" orient="auto">
      <path d="M 7,13 L 1,3 L 13,3 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Syslog severity levels</text>

  
  
  <line x1="120" y1="520" x2="120" y2="152" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-up)" />
  
  <line x1="120" y1="966" x2="120" y2="600" stroke="#db8129" stroke-width="5" />
  
  
  <rect x="25" y="534" width="190" height="52" rx="26" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="120" y="569" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">more urgent</text>

  
  
  <g id="row-0">
    <rect x="230" y="150" width="730" height="88" rx="14" fill="#db8129" />
    <circle cx="280" cy="194" r="24" fill="#ffffff" />
    <text x="280" y="203" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129" text-anchor="middle">0</text>
    <text x="340" y="203" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">emerg</text>
    <text x="500" y="202" font-family="sans-serif" font-size="26" fill="#ffffff">system unusable</text>
  </g>

  
  <g id="row-1">
    <rect x="230" y="254" width="730" height="88" rx="14" fill="#e2923e" />
    <circle cx="280" cy="298" r="24" fill="#ffffff" />
    <text x="280" y="307" font-family="sans-serif" font-size="28" font-weight="bold" fill="#e2923e" text-anchor="middle">1</text>
    <text x="340" y="307" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">alert</text>
    <text x="500" y="306" font-family="sans-serif" font-size="26" fill="#ffffff">act immediately</text>
  </g>

  
  <g id="row-2">
    <rect x="230" y="358" width="730" height="88" rx="14" fill="#e8a658" />
    <circle cx="280" cy="402" r="24" fill="#303a36" />
    <text x="280" y="411" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="340" y="411" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">crit</text>
    <text x="500" y="410" font-family="sans-serif" font-size="26" fill="#303a36">critical condition</text>
  </g>

  
  <g id="row-3">
    <rect x="230" y="462" width="730" height="88" rx="14" fill="#dfb878" />
    <circle cx="280" cy="506" r="24" fill="#303a36" />
    <text x="280" y="515" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="340" y="515" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">err</text>
    <text x="500" y="514" font-family="sans-serif" font-size="26" fill="#303a36">error</text>
  </g>

  
  <g id="row-4">
    <rect x="230" y="566" width="730" height="88" rx="14" fill="#c9c78d" />
    <circle cx="280" cy="610" r="24" fill="#303a36" />
    <text x="280" y="619" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="340" y="619" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">warning</text>
    <text x="500" y="618" font-family="sans-serif" font-size="26" fill="#303a36">warning</text>
  </g>

  
  <g id="row-5">
    <rect x="230" y="670" width="730" height="88" rx="14" fill="#a9caa0" />
    <circle cx="280" cy="714" r="24" fill="#303a36" />
    <text x="280" y="723" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="340" y="723" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">notice</text>
    <text x="500" y="722" font-family="sans-serif" font-size="26" fill="#303a36">normal but significant</text>
  </g>

  
  <g id="row-6">
    <rect x="230" y="774" width="730" height="88" rx="14" fill="#83c6a4" />
    <circle cx="280" cy="818" r="24" fill="#303a36" />
    <text x="280" y="827" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="340" y="827" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">info</text>
    <text x="500" y="826" font-family="sans-serif" font-size="26" fill="#303a36">informational</text>
  </g>

  
  <g id="row-7">
    <rect x="230" y="878" width="730" height="88" rx="14" fill="#bfe5cc" stroke="#207448" stroke-width="2" />
    <circle cx="280" cy="922" r="24" fill="#207448" />
    <text x="280" y="931" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="340" y="931" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">debug</text>
    <text x="500" y="930" font-family="sans-serif" font-size="26" fill="#207448">debug detail</text>
  </g>

  
  
  <line x1="1025" y1="150" x2="1025" y2="520" stroke="#207448" stroke-width="5" />
  
  <line x1="1025" y1="600" x2="1025" y2="964" stroke="#207448" stroke-width="5" marker-end="url(#arrow-down)" />

  
  <rect x="935" y="534" width="180" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1025" y="569" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">less urgent</text>

  
  <g id="side-note">
    
    <rect x="1150" y="240" width="410" height="630" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(1325, 275)">
      <rect x="0" y="0" width="56" height="68" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="32" x2="44" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="46" x2="32" y2="46" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="1355" y="385" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">in the journal severity</text>
    <text x="1355" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">is called priority</text>

    
    <line x1="1185" y1="455" x2="1525" y2="455" stroke="#b4cdb8" stroke-width="2" />

    
    <text x="1185" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">field</text>

    
    <rect x="1185" y="515" width="340" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1210" y="557" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">PRIORITY=</text>

    
    <text x="1185" y="650" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">filter</text>

    
    <rect x="1185" y="665" width="340" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1210" y="707" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">journalctl -p</text>
  </g>
</svg>