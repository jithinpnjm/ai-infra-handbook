<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Tuning order: host first</title>
  <desc>Visual ladder showing virtualization performance tuning order from host to guest with tuning parameters and key takeaway.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Tuning order: host first</text>

  
  <g id="step-6">
    <rect x="120" y="130" width="1360" height="108" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="184" r="24" fill="#207448"/>
    <text x="175" y="184" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <rect x="226" y="165" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="226" y1="176" x2="274" y2="176" stroke="#207448" stroke-width="3"/>
    <circle cx="234" cy="171" r="2" fill="#207448"/>
    <circle cx="241" cy="171" r="2" fill="#207448"/>
    <polyline points="234,184 240,188 234,192" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="244" y1="192" x2="252" y2="192" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="300" y="194" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Guest</text>
    
    <line x1="450" y1="146" x2="450" y2="222" stroke="#cbdcd0" stroke-width="2"/>
    
    <rect x="480" y="160" width="230" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="595" y="184" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">virtio drivers</text>

    <rect x="730" y="160" width="280" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="870" y="184" text-anchor="middle" dominant-baseline="central" font-family="monospace, Courier New" font-size="24" fill="#303a36">qemu-guest-agent</text>

    <rect x="1030" y="160" width="180" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1120" y="184" text-anchor="middle" dominant-baseline="central" font-family="monospace, Courier New" font-size="24" fill="#303a36">tuned-adm</text>
  </g>

  
  <g id="step-5">
    <rect x="120" y="278" width="1360" height="108" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="332" r="24" fill="#207448"/>
    <text x="175" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <circle cx="250" cy="316" r="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="234" cy="346" r="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="266" cy="346" r="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="246" y1="322" x2="238" y2="340" stroke="#207448" stroke-width="3"/>
    <line x1="254" y1="322" x2="262" y2="340" stroke="#207448" stroke-width="3"/>
    <line x1="240" y1="346" x2="260" y2="346" stroke="#207448" stroke-width="3"/>
    
    <text x="300" y="342" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Network</text>
    
    <line x1="450" y1="294" x2="450" y2="370" stroke="#cbdcd0" stroke-width="2"/>
    
    <rect x="480" y="308" width="510" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="735" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">virtio-net with vhost and multiqueue</text>

    <rect x="1014" y="308" width="200" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1114" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">correct MTU</text>
  </g>

  
  <g id="step-4">
    <rect x="120" y="426" width="1360" height="108" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="480" r="24" fill="#207448"/>
    <text x="175" y="480" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <ellipse cx="250" cy="465" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 228 465 v 15 c 0 3.9 9.8 7 22 7 s 22 -3.1 22 -7 v -15" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 228 480 v 15 c 0 3.9 9.8 7 22 7 s 22 -3.1 22 -7 v -15" fill="none" stroke="#207448" stroke-width="4"/>
    
    <text x="300" y="490" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Disk</text>
    
    <line x1="450" y1="442" x2="450" y2="518" stroke="#cbdcd0" stroke-width="2"/>
    
    <rect x="480" y="456" width="330" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="645" y="480" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">virtio with iothreads</text>

    <rect x="834" y="456" width="200" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="934" y="480" text-anchor="middle" dominant-baseline="central" font-family="monospace, Courier New" font-size="24" fill="#303a36">cache=none</text>
  </g>

  
  <g id="step-3">
    <rect x="120" y="574" width="1360" height="108" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="628" r="24" fill="#207448"/>
    <text x="175" y="628" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="226" y="612" width="48" height="26" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="233" y="618" width="7" height="10" rx="1" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="246" y="618" width="7" height="10" rx="1" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="259" y="618" width="7" height="10" rx="1" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="230" y1="638" x2="246" y2="638" stroke="#207448" stroke-width="3"/>
    <line x1="252" y1="638" x2="270" y2="638" stroke="#207448" stroke-width="3"/>
    
    <text x="300" y="638" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Memory</text>
    
    <line x1="450" y1="590" x2="450" y2="666" stroke="#cbdcd0" stroke-width="2"/>
    
    <rect x="480" y="604" width="170" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="565" y="628" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">hugepages</text>

    <rect x="670" y="604" width="140" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="740" y="628" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">locked</text>

    <rect x="830" y="604" width="250" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="955" y="628" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">numatune strict</text>
  </g>

  
  <g id="step-2">
    <rect x="120" y="722" width="1360" height="108" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="776" r="24" fill="#207448"/>
    <text x="175" y="776" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <rect x="232" y="758" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="241" y1="750" x2="241" y2="758" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="259" y1="750" x2="259" y2="758" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="241" y1="794" x2="241" y2="802" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="259" y1="794" x2="259" y2="802" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="224" y1="767" x2="232" y2="767" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="224" y1="785" x2="232" y2="785" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="268" y1="767" x2="276" y2="767" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="268" y1="785" x2="276" y2="785" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="242" y="768" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
    
    <text x="300" y="786" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">CPU</text>
    
    <line x1="450" y1="738" x2="450" y2="814" stroke="#cbdcd0" stroke-width="2"/>
    
    <rect x="480" y="752" width="280" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="620" y="776" text-anchor="middle" dominant-baseline="central" font-family="monospace, Courier New" font-size="24" fill="#303a36">host-passthrough</text>

    <rect x="784" y="752" width="360" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="964" y="776" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">vcpupin on one NUMA node</text>
  </g>

  
  <g id="step-1">
    <rect x="120" y="870" width="1360" height="108" rx="16" fill="#fef6ed" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="175" cy="924" r="24" fill="#db8129"/>
    <text x="175" y="924" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <rect x="226" y="905" width="48" height="38" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="234" y1="916" x2="254" y2="916" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="234" y1="926" x2="254" y2="926" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="264" cy="924" r="3" fill="#db8129"/>
    
    <text x="300" y="934" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Host</text>
    
    <line x1="450" y1="886" x2="450" y2="962" stroke="#f6cfa9" stroke-width="2"/>
    
    <rect x="475" y="900" width="280" height="48" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="615" y="924" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">BIOS VT-x and VT-d</text>

    <rect x="770" y="900" width="375" height="48" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="957" y="924" text-anchor="middle" dominant-baseline="central" font-family="monospace, Courier New" font-size="24" fill="#303a36">intel_iommu=on iommu=pt</text>

    <rect x="1160" y="900" width="300" height="48" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
    <text x="1310" y="924" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" fill="#303a36">performance governor</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="120" y="1018" width="1360" height="80" rx="16" fill="#207448"/>
    <text x="800" y="1058" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">start with the host, because guest settings depend on what the host exposes.</text>
  </g>
</svg>