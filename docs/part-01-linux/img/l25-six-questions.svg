<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Six questions for every result</title>
  <desc>Infographic presenting six critical evaluation questions to validate systems performance and benchmark results.</desc>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Six questions for every result</text>

  
  <g id="box-1">
    <rect x="55" y="120" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="103" cy="168" r="24" fill="#207448"/>
    <text x="103" y="168" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    
    <path d="M 263 196 A 22 22 0 1 1 307 196" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="285" y1="184" x2="300" y2="169" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="285" cy="184" r="4" fill="#207448"/>

    <text x="285" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Why not double?</text>
    <text x="285" y="300" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">What is the limiter</text>
  </g>

  
  <g id="box-2">
    <rect x="570" y="120" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="618" cy="168" r="24" fill="#207448"/>
    <text x="618" y="168" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    
    <line x1="772" y1="158" x2="828" y2="158" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
    <rect x="778" y="178" width="12" height="28" fill="none" stroke="#207448" stroke-width="3" rx="2"/>
    <rect x="794" y="168" width="12" height="38" fill="none" stroke="#207448" stroke-width="3" rx="2"/>
    <rect x="810" y="158" width="12" height="48" fill="#207448" stroke="#207448" stroke-width="3" rx="2"/>

    <text x="800" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Did it break limits?</text>
    <text x="800" y="300" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">check against known maxima</text>
  </g>

  
  <g id="box-3">
    <rect x="1085" y="120" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="1133" cy="168" r="24" fill="#207448"/>
    <text x="1133" y="168" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    
    <path d="M 1315 156 L 1339 198 L 1291 198 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="1315" y1="171" x2="1315" y2="183" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1315" cy="191" r="2.5" fill="#207448"/>

    <text x="1315" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Did it error?</text>
    <text x="1315" y="300" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">errors skew results</text>
  </g>

  
  <g id="box-4">
    <rect x="55" y="480" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="103" cy="528" r="24" fill="#207448"/>
    <text x="103" y="528" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    
    <path d="M 271 526 A 16 16 0 0 1 301 534" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="295 522 303 534 291 538" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 299 554 A 16 16 0 0 1 269 546" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="275 558 267 546 279 542" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="285" y="608" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Does it reproduce?</text>
    <text x="285" y="665" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">repeat, look at variation,</text>
    <text x="285" y="705" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">test other instances</text>
  </g>

  
  <g id="box-5">
    <rect x="570" y="480" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="618" cy="528" r="24" fill="#207448"/>
    <text x="618" y="528" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    
    <circle cx="800" cy="540" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="800" cy="540" r="10" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="800" cy="540" r="3" fill="#207448"/>
    <line x1="800" y1="514" x2="800" y2="520" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="800" y1="560" x2="800" y2="566" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="774" y1="540" x2="780" y2="540" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="820" y1="540" x2="826" y2="540" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

    <text x="800" y="608" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Does it matter?</text>
    <text x="800" y="665" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">is the workload relevant</text>
    <text x="800" y="705" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">to production</text>
  </g>

  
  <g id="box-6">
    <rect x="1085" y="480" width="460" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <circle cx="1133" cy="528" r="24" fill="#db8129"/>
    <text x="1133" y="528" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    
    
    <circle cx="1310" cy="535" r="16" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="1322" y1="547" x2="1334" y2="559" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="1304" y1="535" x2="1316" y2="535" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="1310" y1="529" x2="1310" y2="541" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

    <text x="1315" y="608" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Did it even happen?</text>
    <text x="1315" y="655" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">was the operation performed</text>
    <text x="1315" y="692" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">rather than blocked, cached</text>
    <text x="1315" y="729" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">or optimised away</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="55" y="840" width="1490" height="80" rx="12" ry="12" fill="#207448"/>
    <text x="800" y="890" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">a number you cannot answer these questions about is a hypothesis, not a result.</text>
  </g>
</svg>