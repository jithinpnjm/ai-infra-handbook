  </g>
  <text x="1136" y="675" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#db8129">sudo mount -a</text>
  <text x="1136" y="717" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(errors appear now,</text>
  <text x="1136" y="753" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">not at 3 a.m.)</text>

  
  <line x1="1260" y1="790" x2="1260" y2="842" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <rect x="980" y="854" width="560" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1024" cy="909" r="24" fill="#207448" />
  <text x="1024" y="917" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(1064, 881)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 44 24 A 18 18 0 1 0 40 38" />
