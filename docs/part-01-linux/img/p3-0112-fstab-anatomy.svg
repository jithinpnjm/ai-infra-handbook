    <circle cx="26" cy="26" r="6" />
  </g>
  <text x="1136" y="897" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#303a36">sudo systemctl</text>
  <text x="1136" y="935" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" fill="#303a36">daemon-reload</text>

  
  <rect x="40" y="1046" width="1520" height="64" rx="12" fill="#207448" />
  <text x="800" y="1087" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A bad fstab can stop a machine from booting, so verify before you reboot</text>
</svg>