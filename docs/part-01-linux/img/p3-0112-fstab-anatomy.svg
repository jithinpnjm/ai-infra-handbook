  <text x="150" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <path d="M 270 190 v 10 h 50 v 10 v -10 h 50 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
  <circle cx="320" cy="232" r="17" fill="#207448" />
  <text x="320" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  
  <path d="M 408 190 v 10 h 20 v 10 v -10 h 20 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
  <circle cx="428" cy="232" r="17" fill="#207448" />
  <text x="428" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <path d="M 488 190 v 10 h 155 v 10 v -10 h 155 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
  <circle cx="643" cy="232" r="17" fill="#207448" />
  <text x="643" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  
  <path d="M 830 190 v 10 h 12 v 10 v -10 h 12 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
  <circle cx="842" cy="232" r="17" fill="#207448" />
  <text x="842" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  
  <path d="M 878 190 v 10 h 12 v 10 v -10 h 12 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
  <circle cx="890" cy="232" r="17" fill="#207448" />
  <text x="890" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  
  <rect x="58" y="266" width="854" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="314" r="24" fill="#207448" />
  <text x="100" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(142, 286)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <ellipse cx="28" cy="14" rx="24" ry="8" />
    <path d="M 4 14 v 16 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -16" />
    <path d="M 4 30 v 14 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -14" />
  </g>
  <text x="216" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Source: <tspan font-size="24" font-weight="normal">UUID, LABEL=, PARTUUID=,</tspan></text>
  <text x="216" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">/dev/mapper name or server:/path</text>

  
  <rect x="58" y="374" width="854" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="412" r="24" fill="#207448" />
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(142, 384)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 12 L 20 12 L 26 18 L 50 18 A 4 4 0 0 1 54 22 L 54 44 A 4 4 0 0 1 50 48 L 6 48 A 4 4 0 0 1 2 44 L 2 16 A 4 4 0 0 1 6 12 Z" />
    <line x1="2" y1="24" x2="54" y2="24" />
  </g>
  <text x="216" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Mount point</text>

  
  <rect x="58" y="462" width="854" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="500" r="24" fill="#207448" />
  <text x="100" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(142, 472)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 28 L 26 8 L 48 8 L 48 30 L 28 50 Z" />
    <circle cx="38" cy="18" r="4" fill="#207448" />
  </g>
  <text x="216" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Type (swap for swap)</text>

  
  <rect x="58" y="550" width="854" height="198" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="649" r="24" fill="#207448" />
  <text x="100" y="657" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(142, 621)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="6" y1="14" x2="50" y2="14" />
    <circle cx="20" cy="14" r="5" fill="#ffffff" />
    <line x1="6" y1="28" x2="50" y2="28" />
    <circle cx="36" cy="28" r="5" fill="#ffffff" />
    <line x1="6" y1="42" x2="50" y2="42" />
    <circle cx="16" cy="42" r="5" fill="#ffffff" />
  </g>
  <text x="216" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Options: <tspan font-family="ui-monospace, monospace" font-size="24" font-weight="normal">defaults = rw,suid,dev,exec,</tspan></text>
  <text x="216" y="626" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">auto,nouser,async;</text>
  <text x="216" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, monospace">nofail</tspan> = do not drop to emergency mode if absent;</text>
  <text x="216" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, monospace">_netdev</tspan> = wait for the network</text>

  
  <rect x="58" y="760" width="854" height="88" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="804" r="24" fill="#207448" />
  <text x="100" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(142, 776)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="48" height="34" rx="4" />
    <circle cx="18" cy="27" r="7" />
    <circle cx="38" cy="27" r="7" />
    <line x1="18" y1="34" x2="38" y2="34" />
  </g>
  <text x="216" y="798" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">dump flag: <tspan font-size="24" font-weight="normal">obsolete backup tool, always 0</tspan></text>

  
  <rect x="58" y="860" width="854" height="142" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="100" cy="931" r="24" fill="#207448" />
  <text x="100" y="939" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  
  <g transform="translate(142, 903)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 8 14 V 28 C 8 40 28 50 28 50 C 28 50 48 40 48 28 V 14 Z" />
    <path d="M 18 27 L 25 34 L 38 20" />
  </g>
  <text x="216" y="902" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">fsck pass: <tspan font-size="24" font-weight="normal">1 root, 2 other local filesystems,</tspan></text>
  <text x="216" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">0 skip (network, swap, XFS)</text>

  
  <rect x="960" y="100" width="600" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-opacity="0.3" />

  
  <rect x="980" y="122" width="560" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1024" cy="177" r="24" fill="#207448" />
  <text x="1024" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(1064, 149)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="16" width="30" height="34" rx="3" />
    <path d="M 10 38 H 6 A 2 2 0 0 1 4 36 V 8 A 2 2 0 0 1 6 6 H 32 A 2 2 0 0 1 34 8 V 12" />
  </g>
  <text x="1136" y="165" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#303a36">sudo cp</text>
  <text x="1136" y="203" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" fill="#303a36">/etc/fstab /etc/fstab.bak</text>

  
  <line x1="1260" y1="232" x2="1260" y2="282" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <rect x="980" y="294" width="560" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1024" cy="342" r="24" fill="#207448" />
  <text x="1024" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(1064, 314)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 46 L 44 46" />
    <path d="M 32 10 L 42 20 L 18 44 L 8 44 L 8 34 Z" />
  </g>
  <text x="1136" y="351" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#303a36">sudoedit /etc/fstab</text>

  
  <line x1="1260" y1="390" x2="1260" y2="442" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <rect x="980" y="454" width="560" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1024" cy="509" r="24" fill="#207448" />
  <text x="1024" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1064, 481)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="16" />
    <line x1="36" y1="36" x2="48" y2="48" />
    <path d="M 16 24 L 22 30 L 32 18" />
  </g>
  <text x="1136" y="497" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#303a36">sudo findmnt</text>
  <text x="1136" y="535" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" fill="#303a36">--verify --verbose</text>

  
  <line x1="1260" y1="564" x2="1260" y2="616" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <rect x="980" y="628" width="560" height="162" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
  <circle cx="1024" cy="709" r="24" fill="#db8129" />
  <text x="1024" y="717" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1064, 681)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="34" rx="4" />
