<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Anatomy of an fstab line, and the safe edit routine</title>
  <desc>Visual explanation of the six fields in an /etc/fstab entry and the five-step safe editing workflow.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Anatomy of an fstab line, and the safe edit routine</text>

  
  <rect x="40" y="100" width="890" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-opacity="0.3" />

  
  <rect x="58" y="118" width="854" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="74" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">UUID=3f2a...  /scratch  xfs  defaults,noatime,nofail  0  2</text>

  
  
