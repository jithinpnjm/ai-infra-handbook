<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading nvidia-smi topo -m</title>
  <desc>Distance ladder from closest to farthest in nvidia-smi topo -m</desc>
  <style>
    .title { font-family: sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; }
    .mono { font-family: monospace; font-size: 24px; font-weight: bold; fill: #207448; }
    .container-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
    .box-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #303a36; }
    .box-desc { font-family: sans-serif; font-size: 24px; fill: #303a36; }
    .note-green { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #207448; }
    .note-orange { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #db8129; }
    .takeaway-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="80" class="title">Reading nvidia-smi topo -m</text>

  
  <rect x="1200" y="40" width="360" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1380" y="75" class="mono" text-anchor="middle">nvidia-smi topo -m</text>

  
  <rect x="40" y="138" width="1520" height="926" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="70" y="177" class="container-title">Distance ladder from closest to farthest</text>

  
  <rect x="70" y="190" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(90, 206)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="18"/>
    <circle cx="28" cy="28" r="6"/>
  </g>
  <text x="180" y="243" class="box-title">X</text>
  <text x="280" y="241" class="box-desc">self</text>

  
  <rect x="70" y="318" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(90, 334)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="12" y1="10" x2="12" y2="46"/>
    <line x1="44" y1="10" x2="44" y2="46"/>
    <line x1="12" y1="18" x2="44" y2="18"/>
    <line x1="12" y1="28" x2="44" y2="28"/>
    <line x1="12" y1="38" x2="44" y2="38"/>
  </g>
  <text x="180" y="371" class="box-title">NV#</text>
  <text x="280" y="369" class="box-desc">NVLink with # links</text>

  
  <rect x="70" y="446" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(90, 462)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="28" y1="8" x2="28" y2="18"/>
    <rect x="16" y="18" width="24" height="20" rx="4"/>
    <line x1="22" y1="38" x2="22" y2="48"/>
    <line x1="34" y1="38" x2="34" y2="48"/>
  </g>
  <text x="180" y="499" class="box-title">PIX</text>
  <text x="280" y="480" class="box-desc">path crosses at most one PCIe bridge</text>
  <text x="280" y="512" class="note-green">best for GPUDirect RDMA with PXB</text>

  
  <rect x="70" y="574" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(90, 590)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="18" width="16" height="20" rx="3"/>
    <rect x="32" y="18" width="16" height="20" rx="3"/>
    <line x1="24" y1="28" x2="32" y2="28"/>
    <line x1="16" y1="8" x2="16" y2="18"/>
    <line x1="40" y1="38" x2="40" y2="48"/>
  </g>
  <text x="180" y="627" class="box-title">PXB</text>
  <text x="280" y="625" class="box-desc">crosses multiple PCIe bridges</text>

  
  <rect x="70" y="702" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(90, 718)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="14" y="14" width="28" height="28" rx="4"/>
    <rect x="22" y="22" width="12" height="12"/>
    <line x1="20" y1="6" x2="20" y2="14"/>
    <line x1="28" y1="6" x2="28" y2="14"/>
    <line x1="36" y1="6" x2="36" y2="14"/>
    <line x1="20" y1="42" x2="20" y2="50"/>
    <line x1="28" y1="42" x2="28" y2="50"/>
    <line x1="36" y1="42" x2="36" y2="50"/>
  </g>
  <text x="180" y="755" class="box-title">PHB</text>
  <text x="280" y="753" class="box-desc">goes through a PCIe host bridge, the CPU root complex</text>

  
  <rect x="70" y="830" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(90, 846)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="10" width="40" height="36" rx="6"/>
    <rect x="14" y="18" width="10" height="14" rx="2"/>
    <rect x="32" y="18" width="10" height="14" rx="2"/>
    <line x1="24" y1="25" x2="32" y2="25"/>
  </g>
  <text x="180" y="883" class="box-title">NODE</text>
  <text x="280" y="881" class="box-desc">crosses PCIe host bridges within one NUMA node</text>

  
  <rect x="70" y="958" width="1460" height="88" rx="8" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(90, 974)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="16" width="16" height="24" rx="3"/>
    <rect x="34" y="16" width="16" height="24" rx="3"/>
    <line x1="22" y1="28" x2="34" y2="28"/>
  </g>
  <text x="180" y="1011" class="box-title">SYS</text>
  <text x="280" y="992" class="box-desc">crosses NUMA nodes through the inter-socket link</text>
  <text x="280" y="1024" class="note-orange">avoid between a worker's CPU, GPU and NIC</text>

  
  <rect x="40" y="1104" width="1520" height="56" rx="8" fill="#207448"/>
  <text x="800" y="1138" class="takeaway-text">aim for GPU and NIC pairs at PIX or PXB</text>
</svg>