<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Host Key versus User Key: Trust Direction and File Locations</title>
  <desc>Architecture diagram comparing Host Key and User Key authentication in SSH, illustrating trust directions, file locations, permissions, and StrictModes requirements.</desc>

  <defs>
    
    <marker id="arrow-left" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 14 2 L 2 8 L 14 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129" />
    </marker>
    
    
    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#143623" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="800" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Host Key versus User Key: Trust Direction and File Locations</text>

  
  
  
  <rect x="50" y="95" width="1500" height="515" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  
  <rect x="75" y="115" width="530" height="46" rx="10" fill="#207448" />
  <text x="340" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Server Authentication / Host Key</text>

  
  <rect x="980" y="115" width="545" height="46" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1252" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Protects against Man-in-the-Middle attacks</text>

  
  <g filter="url(#card-shadow)">
    <rect x="75" y="180" width="460" height="405" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  
  <rect x="105" y="206" width="44" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="97" y1="234" x2="157" y2="234" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="165" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client (Laptop)</text>

  
  <rect x="95" y="260" width="420" height="150" rx="10" fill="#f5f8f5" stroke="#9bbba7" stroke-width="1.5" />
  <text x="115" y="302" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">~/.ssh/known_hosts</text>
  <text x="115" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(mode 0644)</text>

  
  <rect x="95" y="430" width="420" height="135" rx="10" fill="#f5f8f5" stroke="#207448" stroke-dasharray="4 4" stroke-width="2" />
  <text x="115" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Client verifies against</text>
  <text x="115" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">'known_hosts' fingerprint</text>

  
  <g filter="url(#card-shadow)">
    <rect x="1065" y="180" width="460" height="405" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  
  <rect x="1095" y="204" width="44" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1103" y1="214" x2="1121" y2="214" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1103" y1="226" x2="1121" y2="226" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="1130" cy="214" r="2.5" fill="#207448" />
  <circle cx="1130" cy="226" r="2.5" fill="#207448" />
  <text x="1155" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server (gpu01)</text>

  
  <rect x="1085" y="260" width="420" height="135" rx="10" fill="#f5f8f5" stroke="#9bbba7" stroke-width="1.5" />
  <text x="1105" y="300" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/etc/ssh/ssh_host_ed25519_key</text>
  <text x="1105" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(private, mode 0600)</text>

  
  <rect x="1085" y="415" width="420" height="150" rx="10" fill="#f5f8f5" stroke="#9bbba7" stroke-width="1.5" />
  <text x="1105" y="460" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ssh_host_ed25519_key.pub</text>
  <text x="1105" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(public, mode 0644)</text>

  
  <line x1="1065" y1="365" x2="549" y2="365" stroke="#207448" stroke-width="5" marker-end="url(#arrow-left)" />
  
  
  <g filter="url(#card-shadow)">
    <rect x="555" y="305" width="490" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  </g>
  <text x="800" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Server proves identity with Host Key</text>
  <text x="800" y="388" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">signature on key exchange</text>


  
  
  
  <rect x="50" y="635" width="1500" height="585" rx="18" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5" />

  
  <rect x="75" y="655" width="490" height="46" rx="10" fill="#db8129" />
  <text x="320" y="687" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">User Authentication / User Key</text>

  
  <rect x="990" y="655" width="535" height="46" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="1257" y="686" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">StrictModes permission callout box</text>

  
  <g filter="url(#card-shadow)">
    <rect x="75" y="720" width="460" height="475" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  </g>
  
  <rect x="105" y="744" width="44" height="28" rx="3" fill="none" stroke="#db8129" stroke-width="3" />
  <line x1="97" y1="772" x2="157" y2="772" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <text x="165" y="771" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client (Laptop)</text>

  
  <rect x="95" y="798" width="420" height="175" rx="10" fill="#f5f8f5" stroke="#9bbba7" stroke-width="1.5" />
  <text x="115" y="840" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">~/.ssh/id_ed25519</text>
  <text x="115" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(private key, mode 0600,</text>
  <text x="115" y="922" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">passphrase protected)</text>

  
  <rect x="95" y="995" width="420" height="175" rx="10" fill="#f5f8f5" stroke="#9bbba7" stroke-width="1.5" />
  <text x="115" y="1050" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">~/.ssh/id_ed25519.pub</text>
  <text x="115" y="1105" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(public key, mode 0644)</text>

  
  <g filter="url(#card-shadow)">
    <rect x="1065" y="720" width="460" height="475" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  </g>
  
  <rect x="1095" y="744" width="44" height="32" rx="4" fill="none" stroke="#db8129" stroke-width="3" />
  <line x1="1103" y1="754" x2="1121" y2="754" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <line x1="1103" y1="766" x2="1121" y2="766" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <circle cx="1130" cy="754" r="2.5" fill="#db8129" />
  <circle cx="1130" cy="766" r="2.5" fill="#db8129" />
  <text x="1155" y="771" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server (gpu01)</text>

  
  <rect x="1085" y="798" width="420" height="375" rx="12" fill="#f5f8f5" stroke="#db8129" stroke-width="1.5" />
  
  
  <text x="1105" y="836" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">within '~/'</text>
  <text x="1105" y="872" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(mode 0750/0755,</text>
  <text x="1105" y="908" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">non-writable by group/others)</text>

  
  <rect x="1100" y="928" width="390" height="230" rx="8" fill="#ffffff" stroke="#9bbba7" stroke-width="1.5" />
  <text x="1118" y="964" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">inside '~/.ssh' (mode 0700)</text>

  
  <rect x="1115" y="988" width="360" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1130" y="1030" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">~/.ssh/authorized_keys</text>
  <text x="1130" y="1070" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(mode 0600)</text>
  <text x="1130" y="1115" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Server verifies signature</text>

  
  <line x1="535" y1="920" x2="1051" y2="920" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-right)" />

  
  <g filter="url(#card-shadow)">
    <rect x="555" y="845" width="490" height="150" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  </g>
  <text x="800" y="888" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">Client proves identity by signing</text>
  <text x="800" y="928" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">server challenge with user private key</text>
  <text x="800" y="968" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">against public key in 'authorized_keys'</text>

</svg>