<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
  <title>Response time climbs steeply as utilisation rises, so queues need headroom</title>
  <desc>Infographic explaining M/D/1 queue response time explosion as utilisation approaches 100 percent, highlighting the target operating zone for latency-critical services.</desc>

  
  <rect width="1600" height="1130" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Response time climbs steeply as utilisation rises,</text>
  <text x="80" y="125" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">so queues need headroom</text>

  
  <rect x="736" y="150" width="620" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  
  
  <circle cx="780" cy="198" r="24" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="780" cy="198" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="780" cy="198" r="4" fill="#207448" />

  
  <text x="825" y="188" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="825" dy="0">Target zone for latency services:</tspan>
    <tspan x="825" dy="32">about 60 to 70%</tspan>
  </text>

  
  <rect x="984" y="246" width="124" height="614" fill="#207448" fill-opacity="0.08" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />

  
  
  <line x1="240" y1="760" x2="1480" y2="760" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="240" y1="660" x2="1480" y2="660" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="240" y1="560" x2="1480" y2="560" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="240" y1="460" x2="1480" y2="460" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="240" y1="360" x2="1480" y2="360" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="240" y1="260" x2="1480" y2="260" stroke="#e0e8e2" stroke-width="1.5" />

  
  <line x1="488" y1="260" x2="488" y2="860" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="736" y1="260" x2="736" y2="860" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="984" y1="260" x2="984" y2="860" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="1232" y1="260" x2="1232" y2="860" stroke="#e0e8e2" stroke-width="1.5" />
  <line x1="1480" y1="260" x2="1480" y2="860" stroke="#e0e8e2" stroke-width="1.5" />

  
  
  <line x1="240" y1="860" x2="1480" y2="860" stroke="#303a36" stroke-width="3" />
  
  <line x1="240" y1="260" x2="240" y2="860" stroke="#303a36" stroke-width="3" />

  
  <text x="215" y="868" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">0</text>
  <text x="215" y="768" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">1</text>
  <text x="215" y="668" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">2</text>
  <text x="215" y="568" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">3</text>
  <text x="215" y="468" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">4</text>
  <text x="215" y="368" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">5</text>
  <text x="215" y="268" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">6</text>

  
  <text transform="rotate(-90)" x="-560" y="110" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Response time (multiple of service time s)</text>

  
  <text x="240" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0%</text>
  <text x="488" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">20%</text>
  <text x="736" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">40%</text>
  <text x="984" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">60%</text>
  <text x="1232" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">80%</text>
  <text x="1480" y="898" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">100%</text>

  
  <text x="860" y="945" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Utilisation (rho)</text>

  
  <rect x="255" y="290" width="710" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="295" cy="336" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="295,322 295,336 307,336" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="335" y="344" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">r = s(2 - rho) / (2(1 - rho))</text>
  <text x="275" y="392" font-family="sans-serif" font-size="24" fill="#303a36">M/D/1 queue, random arrivals, fixed service time</text>

  
  <path d="M 240 760 C 500 760, 750 735, 984 685 C 1080 660, 1170 620, 1232 560 C 1280 500, 1320 420, 1356 310 C 1365 285, 1370 270, 1375 260 L 1375 860 L 240 860 Z" fill="#207448" fill-opacity="0.04" />

  
  <path d="M 240 760 C 500 760, 750 735, 984 685 C 1080 660, 1170 620, 1232 560 C 1280 500, 1320 420, 1356 310 C 1365 285, 1370 270, 1375 260" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  
  <path d="M 1375 260 C 1380 248, 1383 235, 1385 220" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />

  
  
  <circle cx="240" cy="760" r="8" fill="#207448" />
  <text x="265" y="750" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">0%: r = s</text>

  
  <circle cx="984" cy="685" r="9" fill="#207448" />
  <text x="965" y="670" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">60%: 1.75 s</text>

  
  <circle cx="1232" cy="560" r="8" fill="#207448" />
  <text x="1212" y="545" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">80%: 3 s</text>

  
  <circle cx="1356" cy="310" r="10" fill="#f5f8f5" stroke="#db8129" stroke-width="4" />
  <text x="1380" y="318" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">90%: 5.5 s</text>

  
  <text x="860" y="990" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">The curve diverges as utilisation nears 100%.</text>

  
  <rect x="40" y="1030" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="1068" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Throughput jobs can run hot. Latency services cannot.</text>
</svg>