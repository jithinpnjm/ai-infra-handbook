<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
  <title>set -e aborts on a bare failure but is silently ignored in these contexts</title>
  <desc>Visual comparison showing when set -e aborts a script on failure versus syntax contexts where set -e is silently ignored.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">set -e aborts on a bare failure</tspan>
    <tspan x="800" dy="56">but is silently ignored in these contexts</tspan>
  </text>

  
  <rect x="50" y="152" width="720" height="652" rx="14" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="1.5"/>

  
  <rect x="60" y="164" width="700" height="64" rx="10" fill="#207448"/>
  <text x="410" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">set -e aborts the script</text>

  
  <rect x="70" y="250" width="680" height="166" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <polygon points="114,307 136,307 151,322 151,344 136,359 114,359 99,344 99,322" fill="#d32f2f"/>
  <polygon points="115,310 135,310 148,323 148,343 135,356 115,356 102,343 102,323" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STOP</text>
  
  <text x="175" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#1c2420">false</text>
  <text x="175" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635c">(bare command, script stops)</text>

  
  <rect x="70" y="438" width="680" height="166" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <polygon points="114,495 136,495 151,510 151,532 136,547 114,547 99,532 99,510" fill="#d32f2f"/>
  <polygon points="115,498 135,498 148,511 148,531 135,544 115,544 102,531 102,511" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STOP</text>
  
  <text x="175" y="485" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#1c2420">grep -q pattern file</text>
  <text x="175" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635c">
    <tspan x="175" dy="0">with no match</tspan>
    <tspan x="175" dy="32">(bare command, script stops)</tspan>
  </text>

  
  <rect x="70" y="626" width="680" height="166" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <polygon points="114,683 136,683 151,698 151,720 136,735 114,735 99,720 99,698" fill="#d32f2f"/>
  <polygon points="115,686 135,686 148,699 148,719 135,732 115,732 102,719 102,699" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STOP</text>
  
  <text x="175" y="692" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#1c2420">cmd | head -1</text>
  <text x="175" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#55635c">with pipefail set (pipeline fails)</text>

  
  <rect x="830" y="152" width="720" height="652" rx="14" fill="#f8faf8" stroke="#d5ded8" stroke-width="1.5"/>

  
  <rect x="840" y="164" width="700" height="64" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="1190" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">set -e is silently ignored</text>

  
  <rect x="850" y="250" width="680" height="96" rx="10" fill="#ffffff" stroke="#8a9890" stroke-width="2.5" stroke-dasharray="8,6"/>
  
  <polygon points="895,274 919,298 895,322 871,298" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 891 292 Q 895 287 899 292 Q 897 298 895 301 L 895 305" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="895" cy="310" r="1.5" fill="#207448"/>
  
  <text x="945" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">if or while condition</text>

  
  <rect x="850" y="364" width="680" height="96" rx="10" fill="#ffffff" stroke="#8a9890" stroke-width="2.5" stroke-dasharray="8,6"/>
  
  <path d="M 875 412 L 890 412 M 890 412 L 915 397 M 890 412 L 915 427" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="875" cy="412" r="3.5" fill="#207448"/>
  <circle cx="915" cy="397" r="3.5" fill="#207448"/>
  <circle cx="915" cy="427" r="3.5" fill="#207448"/>
  
  <text x="945" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">left side of &amp;&amp; or ||</text>

  
  <rect x="850" y="478" width="680" height="96" rx="10" fill="#ffffff" stroke="#8a9890" stroke-width="2.5" stroke-dasharray="8,6"/>
  
  <circle cx="895" cy="526" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="895" y1="514" x2="895" y2="528" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="895" cy="537" r="2" fill="#207448"/>
  
  <text x="945" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">command negated with !</text>

  
  <rect x="850" y="592" width="680" height="106" rx="10" fill="#ffffff" stroke="#8a9890" stroke-width="2.5" stroke-dasharray="8,6"/>
  
  <path d="M 885 627 C 880 627 878 632 878 637 C 878 642 874 645 870 645 C 874 645 878 648 878 653 C 878 658 880 663 885 663" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 905 627 C 910 627 912 632 912 637 C 912 642 916 645 920 645 C 916 645 912 648 912 653 C 912 658 910 663 905 663" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="945" y="638" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="945" dy="0">function called from</tspan>
    <tspan x="945" dy="36">one of these contexts</tspan>
  </text>

  
  <rect x="850" y="716" width="680" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1190" y="762" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">set -e; if false; then :; fi; echo reached</text>

  
  <rect x="60" y="816" width="1480" height="74" rx="10" fill="#ffffff" stroke="#b8cbbf" stroke-width="1.5"/>
  <text x="800" y="862" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="600" fill="#303a36">set -euo pipefail is a safety net, not a design. Check the commands that matter.</text>

  
  <rect x="60" y="910" width="1480" height="64" rx="10" fill="#207448"/>
  <text x="800" y="952" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Handle expected failures explicitly.</text>
</svg>