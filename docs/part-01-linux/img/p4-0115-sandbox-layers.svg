<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>systemd Sandboxing Layers and GPU DeviceAllow Pitfall</title>
  <desc>Concentric defense-in-depth isolation layers showing systemd sandboxing directives and GPU device delegation pitfalls.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">systemd Sandboxing Layers and GPU DeviceAllow Pitfall</text>

  
  <rect x="40" y="80" width="1520" height="1090" rx="16" fill="#edf4ee" stroke="#a2bfa8" stroke-width="3"/>
  
  
  <g transform="translate(60, 95)">
    
    <rect x="0" y="4" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="16" x2="16" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="16" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="16" r="3" fill="#207448"/>
    <circle cx="36" cy="28" r="3" fill="#207448"/>
  </g>
  <text x="125" y="127" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Host Environment (root filesystem, /home, /dev, network namespace)</text>

  
  <rect x="70" y="155" width="1460" height="995" rx="14" fill="#e1ede3" stroke="#7ea886" stroke-width="3"/>
  
  
  <g transform="translate(95, 170)">
    
    <ellipse cx="24" cy="10" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M4,10 v22 c0,4 9,7 20,7 c11,0 20,-3 20,-7 v-22" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M4,21 c0,4 9,7 20,7 c11,0 20,-3 20,-7" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="160" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Mount Namespace</text>

  
  
  <rect x="95" y="225" width="630" height="95" rx="8" fill="#ffffff" stroke="#a2bfa8" stroke-width="2"/>
  <text x="410" y="258" text-anchor="middle" fill="#303a36">
    <tspan x="410" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ProtectSystem=strict</tspan>
    <tspan x="410" dy="32" font-family="sans-serif" font-size="24">(entire filesystem read-only except ReadWritePaths)</tspan>
  </text>

  
  <rect x="745" y="225" width="345" height="95" rx="8" fill="#ffffff" stroke="#a2bfa8" stroke-width="2"/>
  <text x="917" y="258" text-anchor="middle" fill="#303a36">
    <tspan x="917" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ProtectHome=yes</tspan>
    <tspan x="917" dy="32" font-family="sans-serif" font-size="24">(hides /home and /root)</tspan>
  </text>

  
  <rect x="1110" y="225" width="395" height="95" rx="8" fill="#ffffff" stroke="#a2bfa8" stroke-width="2"/>
  <text x="1307" y="258" text-anchor="middle" fill="#303a36">
    <tspan x="1307" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">PrivateTmp=yes</tspan>
    <tspan x="1307" dy="32" font-family="sans-serif" font-size="24">(allocates isolated tmpfs for /tmp)</tspan>
  </text>

  
  <rect x="100" y="340" width="1400" height="790" rx="12" fill="#d3e4d6" stroke="#488b5d" stroke-width="3"/>
  
  
  <g transform="translate(125, 355)">
    
    <circle cx="20" cy="14" r="10" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M4,38 c0,-8 7,-14 16,-14 c9,0 16,6 16,14" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="36" cy="18" r="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M39,21 l8,8 m-3,-2 l2,2" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="190" y="387" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Identity and Capabilities</text>

  
  
  <rect x="125" y="410" width="365" height="100" rx="8" fill="#ffffff" stroke="#7ea886" stroke-width="2"/>
  <text x="307" y="445" text-anchor="middle" fill="#303a36">
    <tspan x="307" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">DynamicUser=yes</tspan>
    <tspan x="307" dy="32" font-family="sans-serif" font-size="24">(transient unprivileged UID)</tspan>
  </text>

  
  <rect x="510" y="410" width="365" height="100" rx="8" fill="#ffffff" stroke="#7ea886" stroke-width="2"/>
  <text x="692" y="445" text-anchor="middle" fill="#303a36">
    <tspan x="692" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">NoNewPrivileges=yes</tspan>
    <tspan x="692" dy="32" font-family="sans-serif" font-size="24">(blocks setuid escalation)</tspan>
  </text>

  
  <rect x="895" y="410" width="580" height="100" rx="8" fill="#ffffff" stroke="#7ea886" stroke-width="2"/>
  <text x="1185" y="438" text-anchor="middle" fill="#303a36">
    <tspan x="1185" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">CapabilityBoundingSet</tspan>
    <tspan x="1185" dy="28" font-family="sans-serif" font-size="24">(drops raw capabilities,</tspan>
    <tspan x="1185" dy="28" font-family="sans-serif" font-size="24">retaining e.g. CAP_NET_BIND_SERVICE)</tspan>
  </text>

  
  <rect x="130" y="530" width="1340" height="580" rx="10" fill="#c4dac8" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(155, 545)">
    
    <path d="M24,4 L44,12 v14 c0,14 -10,22 -20,26 c-10,-4 -20,-12 -20,-26 v-14 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="24" cy="24" r="5" fill="#207448"/>
    <path d="M24,29 v7" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="220" y="577" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Devices and Syscalls</text>

  
  <rect x="155" y="605" width="550" height="260" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(180, 625)">
    
    <path d="M4,6 h40 l-16,18 v16 l-8,-4 v-12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="240" y="655" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Seccomp</text>

  
  <rect x="180" y="695" width="500" height="140" rx="6" fill="#e8f1ea" stroke="#a2bfa8" stroke-width="1.5"/>
  <text x="430" y="775" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SystemCallFilter=@system-service</text>

  
  <rect x="735" y="605" width="710" height="260" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
  <g transform="translate(760, 625)">
    
    <rect x="6" y="8" width="36" height="32" rx="4" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="14" y1="2" x2="14" y2="8" stroke="#db8129" stroke-width="3"/>
    <line x1="24" y1="2" x2="24" y2="8" stroke="#db8129" stroke-width="3"/>
    <line x1="34" y1="2" x2="34" y2="8" stroke="#db8129" stroke-width="3"/>
    <line x1="14" y1="40" x2="14" y2="46" stroke="#db8129" stroke-width="3"/>
    <line x1="24" y1="40" x2="24" y2="46" stroke="#db8129" stroke-width="3"/>
    <line x1="34" y1="40" x2="34" y2="46" stroke="#db8129" stroke-width="3"/>
  </g>
  <text x="820" y="655" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Device Cgroup</text>

  
  <rect x="755" y="675" width="670" height="85" rx="6" fill="#fdf3eb" stroke="#db8129" stroke-width="2"/>
  
  <circle cx="788" cy="717" r="16" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="780" y1="709" x2="796" y2="725" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="796" y1="709" x2="780" y2="725" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  
  <text x="820" y="707" fill="#303a36">
    <tspan x="820" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#c0392b">PrivateDevices=yes</tspan>
    <tspan x="820" dy="28" font-family="sans-serif" font-size="24">(breaks GPU daemons by masking /dev/nvidia*)</tspan>
  </text>

  
  <rect x="755" y="768" width="670" height="85" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="788" cy="810" r="16" fill="#d4efdf" stroke="#207448" stroke-width="2.5"/>
  <polyline points="779,810 785,817 797,803" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="820" y="800" fill="#303a36">
    <tspan x="820" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">DeviceAllow=/dev/nvidia0 rw</tspan>
    <tspan x="820" dy="28" font-family="sans-serif" font-size="24">and </tspan>
    <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">/dev/nvidiactl rw</tspan>
  </text>

  
  <rect x="155" y="885" width="1290" height="205" rx="10" fill="#207448" stroke="#164f31" stroke-width="3"/>

  
  <g transform="translate(776, 905)">
    
    <circle cx="24" cy="24" r="12" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M24,4 v6 M24,38 v6 M4,24 h6 M38,24 h6 M10,10 l5,5 M33,33 l5,5 M10,38 l5,-5 M33,15 l5,-5" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="800" y="1005" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Service Process running securely with restricted host exposure</text>

</svg>