    <g>
      <rect x="382" y="256" width="56" height="48" rx="4"/>
      <path d="M382 272 H438 M382 288 H438"/>
    </g>

    <g>
      <path d="M668 268 V258 H690 L698 266 H742 V302 H668 Z"/>
      <path d="M668 272 H742"/>
    </g>

