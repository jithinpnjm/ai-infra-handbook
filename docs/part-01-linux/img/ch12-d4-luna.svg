<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140">
  <title>Write-back caching and durability</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="18" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="18" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  <text x="80" y="88" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Write-back caching and durability</text>

  <g fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)">
    <path d="M1017 240 V195 H150 V240" stroke-dasharray="12 10"/>
  </g>
  <text x="583" y="173" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">write() returns here: FAST, NOT durable</text>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)">
    <path d="M230 317 H285"/>
    <path d="M535 317 H590"/>
    <path d="M820 317 H875"/>
    <path d="M925 395 V510 H430 V570"/>
    <path d="M1080 395 V530 H1490 V570"/>
