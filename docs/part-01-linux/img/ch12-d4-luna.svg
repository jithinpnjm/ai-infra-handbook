      <rect x="96" y="899" width="58" height="38" rx="3"/>
      <rect x="108" y="911" width="58" height="38" rx="3"/>
      <rect x="120" y="923" width="58" height="38" rx="3"/>
    </g>

    <g>
      <rect x="672" y="909" width="56" height="48" rx="5"/>
