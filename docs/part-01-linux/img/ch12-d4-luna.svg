    </g>
  </g>

  <g fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="150" y="351">write()</text>
    <text x="410" y="342">
      <tspan x="410" dy="0">libc buffer</tspan>
      <tspan x="410" dy="36">(user space)</tspan>
    </text>
    <text x="705" y="342">
      <tspan x="705" dy="0">VFS and</tspan>
      <tspan x="705" dy="36">filesystem</tspan>
    </text>
    <text x="1017" y="342">
      <tspan x="1017" dy="0">Page cache</tspan>
      <tspan x="1017" dy="36">(dirty page)</tspan>
    </text>
  </g>

  <g fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <text x="340" y="639">
      <tspan x="340" dy="0">Synchronous</tspan>
      <tspan x="340" dy="38">flush</tspan>
    </text>
    <text x="1160" y="639">
      <tspan x="1160" dy="0">Asynchronous</tspan>
      <tspan x="1160" dy="38">write-back</tspan>
    </text>

    <text x="190" y="925">
      <tspan x="190" dy="0">Block layer:</tspan>
      <tspan x="190" dy="40">merge + scheduler</tspan>
    </text>
    <text x="750" y="925">
      <tspan x="750" dy="0">Driver, then</tspan>
      <tspan x="750" dy="40">device cache</tspan>
    </text>
    <text x="1200" y="903">
      <tspan x="1200" dy="0">Persistent media</tspan>
      <tspan x="1200" dy="32">(durable only</tspan>
      <tspan x="1200" dy="32">after the device</tspan>
      <tspan x="1200" dy="32">flushes its own</tspan>
      <tspan x="1200" dy="32">cache)</tspan>
    </text>
  </g>
</svg>