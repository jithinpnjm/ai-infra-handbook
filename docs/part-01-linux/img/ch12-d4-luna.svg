    <path d="M1270 730 V805 H430 V850"/>
    <path d="M530 945 H650"/>
    <path d="M1010 945 H1120"/>
  </g>

  <text x="678" y="484" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">fsync/fdatasync: caller blocks</text>
  <text x="1290" y="456" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1290" dy="0">kernel flusher threads</tspan>
    <tspan x="1290" dy="30">(age, dirty thresholds)</tspan>
  </text>

  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="70" y="240" width="160" height="155" rx="16"/>
    <rect x="285" y="240" width="250" height="155" rx="16"/>
    <rect x="590" y="240" width="230" height="155" rx="16"/>
    <rect x="875" y="240" width="285" height="155" rx="16"/>

    <rect x="240" y="570" width="380" height="160" rx="16"/>
    <rect x="1050" y="570" width="440" height="160" rx="16"/>

    <rect x="70" y="850" width="460" height="230" rx="16"/>
    <rect x="650" y="850" width="360" height="230" rx="16"/>
    <rect x="1120" y="850" width="420" height="230" rx="16"/>
  </g>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
