<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1310" width="1600" height="1310" style="background-color: #f5f8f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Known-knowns, known-unknowns and unknown-unknowns: why a checklist beats intuition</title>
  <desc>Infographic illustrating known-knowns, known-unknowns, and unknown-unknowns in performance analysis, how the USE checklist reveals them, and ROI criteria for depth of investigation.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <text x="800" y="65" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">Known-knowns, known-unknowns and unknown-unknowns:</text>
  <text x="800" y="118" text-anchor="middle" font-size="44" font-weight="bold" fill="#207448">why a checklist beats intuition</text>

  

  
  <line x1="65" y1="630" x2="65" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="95" y="325" width="320" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="255" y="375" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">as you learn more,</text>
  <text x="255" y="415" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">unknown-unknowns turn</text>
  <text x="255" y="455" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">into known-unknowns</text>

  

  
  <rect x="445" y="160" width="590" height="145" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(470, 195)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="#e8f1ea" />
    <rect x="18" y="18" width="20" height="20" rx="2" fill="#207448" />
    <line x1="20" y1="2" x2="20" y2="8" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="8" stroke-linecap="round" />
    <line x1="36" y1="2" x2="36" y2="8" stroke-linecap="round" />
    <line x1="20" y1="48" x2="20" y2="54" stroke-linecap="round" />
    <line x1="28" y1="48" x2="28" y2="54" stroke-linecap="round" />
    <line x1="36" y1="48" x2="36" y2="54" stroke-linecap="round" />
    <line x1="2" y1="20" x2="8" y2="20" stroke-linecap="round" />
    <line x1="2" y1="28" x2="8" y2="28" stroke-linecap="round" />
    <line x1="2" y1="36" x2="8" y2="36" stroke-linecap="round" />
    <line x1="48" y1="20" x2="54" y2="20" stroke-linecap="round" />
    <line x1="48" y1="28" x2="54" y2="28" stroke-linecap="round" />
    <line x1="48" y1="36" x2="54" y2="36" stroke-linecap="round" />
  </g>
  <text x="555" y="215" font-size="28" font-weight="bold" fill="#207448">Known-known:</text>
  <text x="555" y="258" font-size="24" fill="#303a36">you know the CPU is 10% busy</text>

  
  <rect x="445" y="325" width="590" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(470, 365)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" fill="#e8f1ea" />
    <path d="M 22 22 C 22 18 34 18 34 24 C 34 28 28 29 28 34" stroke-linecap="round" />
    <circle cx="28" cy="40" r="1.5" fill="#207448" stroke="none" />
  </g>
  <text x="555" y="375" font-size="28" font-weight="bold" fill="#207448">Known-unknown:</text>
  <text x="555" y="415" font-size="24" fill="#303a36">you know you have not looked at</text>
  <text x="555" y="450" font-size="24" fill="#303a36">interrupt load</text>

  
  <rect x="445" y="495" width="590" height="150" rx="14" fill="#fff9f4" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(470, 535)" stroke="#db8129" stroke-width="3" fill="none">
    <path d="M 28 6 L 52 48 L 4 48 Z" fill="#faeee4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="34" stroke-linecap="round" />
    <circle cx="28" cy="41" r="2" fill="#db8129" stroke="none" />
  </g>
  <text x="555" y="545" font-size="28" font-weight="bold" fill="#db8129">Unknown-unknown:</text>
  <text x="555" y="585" font-size="24" fill="#303a36">you do not know that interrupts</text>
  <text x="555" y="620" font-size="24" fill="#303a36">consume cores</text>

  
  <rect x="1065" y="160" width="485" height="485" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1100, 195)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="10" width="40" height="48" rx="4" fill="#ffffff" />
    <path d="M 20 10 L 20 6 C 20 4 22 2 25 2 L 35 2 C 38 2 40 4 40 6 L 40 10" stroke-linejoin="round" />
    <path d="M 18 24 L 24 30 L 34 18" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="38" x2="42" y2="38" stroke-linecap="round" />
    <line x1="20" y1="46" x2="38" y2="46" stroke-linecap="round" />
  </g>
  <text x="1100" y="295" font-size="24" fill="#303a36">A checklist that goes resource</text>
  <text x="1100" y="335" font-size="24" fill="#303a36">by resource, the USE method,</text>
  <text x="1100" y="375" font-size="24" fill="#303a36">is built to expose them: any</text>
  <text x="1100" y="415" font-size="24" fill="#303a36">question you cannot answer is</text>
  <text x="1100" y="455" font-size="24" fill="#303a36">a known unknown, and writing</text>
  <text x="1100" y="495" font-size="24" fill="#303a36">it down is part of the work</text>

  
  <rect x="50" y="675" width="1500" height="475" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <text x="80" y="728" font-size="32" font-weight="bold" fill="#207448">Depth depends on return on investment: when to stop</text>

  
  <rect x="75" y="760" width="460" height="360" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(105, 785)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" />
    <path d="M 28 6 A 22 22 0 0 1 48 38 L 28 28 Z" fill="#db8129" stroke="#db8129" />
  </g>
  <text x="105" y="875" font-size="24" fill="#303a36">Stop when you have explained the</text>
  <text x="105" y="913" font-size="24" fill="#303a36">bulk of the problem; a 3x CPU</text>
  <text x="105" y="951" font-size="24" fill="#303a36">rise where the cause you found</text>
  <text x="105" y="989" font-size="24" fill="#303a36">accounts for 12% of the CPU</text>
  <text x="105" y="1027" font-size="24" fill="#303a36">is not explained</text>

  
  <rect x="565" y="760" width="460" height="360" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(595, 785)" stroke="#207448" stroke-width="3" fill="none">
    <line x1="28" y1="8" x2="28" y2="48" stroke-linecap="round" />
    <line x1="10" y1="18" x2="46" y2="18" stroke-linecap="round" />
    <path d="M 10 18 L 4 36 L 16 36 Z" fill="#e8f1ea" stroke-linejoin="round" />
    <path d="M 46 18 L 40 36 L 52 36 Z" fill="#e8f1ea" stroke-linejoin="round" />
    <line x1="18" y1="48" x2="38" y2="48" stroke-linecap="round" />
  </g>
  <text x="595" y="875" font-size="24" fill="#303a36">Stop when the potential</text>
  <text x="595" y="913" font-size="24" fill="#303a36">gain is smaller than the</text>
  <text x="595" y="951" font-size="24" fill="#303a36">cost of the analysis</text>

  
  <rect x="1055" y="760" width="460" height="360" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1085, 785)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="6" y="8" width="44" height="12" rx="2" fill="#e8f1ea" />
    <rect x="6" y="24" width="44" height="12" rx="2" fill="#e8f1ea" />
    <rect x="6" y="40" width="44" height="12" rx="2" fill="#e8f1ea" />
    <circle cx="14" cy="14" r="1.5" fill="#207448" stroke="none" />
    <circle cx="14" cy="30" r="1.5" fill="#207448" stroke="none" />
    <circle cx="14" cy="46" r="1.5" fill="#207448" stroke="none" />
  </g>
  <text x="1085" y="875" font-size="24" fill="#303a36">At GPU-cluster scale one</text>
  <text x="1085" y="913" font-size="24" fill="#303a36">percent of goodput is worth</text>
  <text x="1085" y="951" font-size="24" fill="#303a36">real money, so deeper</text>
  <text x="1085" y="989" font-size="24" fill="#303a36">analysis can be justified</text>

  
  <rect x="50" y="1180" width="1500" height="85" rx="12" fill="#207448" />
  <text x="800" y="1233" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">Explaining 12% of a 3x rise is not an explanation</text>

</svg>