<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Known-knowns, known-unknowns and unknown-unknowns: why a checklist beats intuition</title>
  <desc>Visual explanation of known-knowns, known-unknowns, and unknown-unknowns using CPU and interrupt analysis, contrasted with a USE method checklist and ROI-based analysis depth stopping criteria.</desc>

  <defs>
    <marker id="arrow-up" viewBox="0 0 12 12" refX="6" refY="2" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,10 L6,2 L11,10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Known-knowns, known-unknowns and unknown-unknowns:</text>
  <text x="800" y="114" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">why a checklist beats intuition</text>

  

  
  
  <line x1="85" y1="560" x2="85" y2="195" stroke="#207448" stroke-width="5" marker-end="url(#arrow-up)" />

  
  <text x="110" y="345" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="110" dy="0">as you learn more,</tspan>
    <tspan x="110" dy="32">unknown-unknowns</tspan>
    <tspan x="110" dy="32">turn into</tspan>
    <tspan x="110" dy="32">known-unknowns</tspan>
  </text>

  
  <rect x="300" y="170" width="670" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(325, 199)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="#ffffff" />
    <path d="M18,20 L38,20 M18,28 L38,28 M18,36 L38,36" stroke-width="3" />
    <line x1="20" y1="2" x2="20" y2="10" />
    <line x1="28" y1="2" x2="28" y2="10" />
    <line x1="36" y1="2" x2="36" y2="10" />
    <line x1="20" y1="46" x2="20" y2="54" />
    <line x1="28" y1="46" x2="28" y2="54" />
    <line x1="36" y1="46" x2="36" y2="54" />
    <line x1="2" y1="20" x2="10" y2="20" />
    <line x1="2" y1="28" x2="10" y2="28" />
    <line x1="2" y1="36" x2="10" y2="36" />
    <line x1="46" y1="20" x2="54" y2="20" />
    <line x1="46" y1="28" x2="54" y2="28" />
    <line x1="46" y1="36" x2="54" y2="36" />
  </g>
  <text x="405" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Known-known:</text>
  <text x="405" y="254" font-family="sans-serif" font-size="24" fill="#303a36">you know the CPU is 10% busy</text>

  
  <rect x="300" y="315" width="670" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(325, 347)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" fill="#ffffff" />
    <path d="M22,22 C22,17 34,17 34,23 C34,28 28,29 28,34" />
    <circle cx="28" cy="42" r="2.5" fill="#207448" stroke="none" />
  </g>
  <text x="405" y="363" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Known-unknown:</text>
  <text x="405" y="401" font-family="sans-serif" font-size="24" fill="#303a36">you know you have not looked at interrupt load</text>

  
  <rect x="300" y="465" width="670" height="125" rx="14" fill="#fdf3e7" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(325, 500)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28,6 L48,15 L48,31 C48,43 28,52 28,52 C28,52 8,43 8,31 L8,15 Z" fill="#ffffff" />
    <line x1="28" y1="20" x2="28" y2="33" />
    <circle cx="28" cy="41" r="2.5" fill="#db8129" stroke="none" />
  </g>
  <text x="405" y="513" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Unknown-unknown:</text>
  <text x="405" y="552" font-family="sans-serif" font-size="24" fill="#303a36">you do not know that interrupts consume cores</text>

  
  <rect x="1010" y="170" width="550" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1045, 202)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="40" height="46" rx="4" fill="#ffffff" />
    <path d="M16,20 L22,26 L36,14" />
    <line x1="16" y1="34" x2="38" y2="34" stroke-width="3" />
    <line x1="16" y1="42" x2="30" y2="42" stroke-width="3" />
  </g>
  <text x="1120" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Checklist &amp; USE Method</text>
  <text x="1045" y="305" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="1045" dy="0">A checklist that goes resource by</tspan>
    <tspan x="1045" dy="38">resource, the USE method, is built</tspan>
    <tspan x="1045" dy="38">to expose them: any question you</tspan>
    <tspan x="1045" dy="38">cannot answer is a known unknown,</tspan>
    <tspan x="1045" dy="38">and writing it down is part of</tspan>
    <tspan x="1045" dy="38">the work</tspan>
  </text>

  
  <rect x="40" y="630" width="1520" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(75, 660)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="30" r="22" fill="#ffffff" />
    <line x1="28" y1="30" x2="40" y2="18" stroke="#db8129" stroke-width="4" />
    <circle cx="28" cy="30" r="4" fill="#207448" stroke="none" />
    <path d="M14,30 A14,14 0 0,1 42,30" stroke-width="3" stroke-dasharray="3,3" />
  </g>
  <text x="145" y="700" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Depth depends on return on investment: when to stop</text>

  
  <circle cx="95" cy="762" r="8" fill="#207448" />
  <text x="125" y="770" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" dy="0">Stop when you have explained the bulk of the problem; a 3x CPU rise where the cause</tspan>
    <tspan x="125" dy="34">you found accounts for 12% of the CPU is not explained</tspan>
  </text>

  
  <circle cx="95" cy="860" r="8" fill="#207448" />
  <text x="125" y="868" font-family="sans-serif" font-size="24" fill="#303a36">Stop when the potential gain is smaller than the cost of the analysis</text>

  
  <circle cx="95" cy="942" r="8" fill="#207448" />
  <text x="125" y="950" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" dy="0">At GPU-cluster scale one percent of goodput is worth real money, so deeper analysis</tspan>
    <tspan x="125" dy="34">can be justified</tspan>
  </text>

  
  <rect x="40" y="1080" width="1520" height="85" rx="14" fill="#207448" />
  <text x="800" y="1133" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Explaining 12% of a 3x rise is not an explanation</text>
</svg>