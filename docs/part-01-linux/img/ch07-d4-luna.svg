<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img">
  <title>From source to executable</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L16 9 L2 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L16 9 L2 16 Z" fill="#db8129"/>
    </marker>
    <style>
      .bg { fill:#f5f8f5; }
      .card { fill:#e8f1ea; stroke:#207448; stroke-width:3; }
      .ink { fill:#303a36; }
      .arrow { fill:none; stroke:#207448; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-green); }
      .dashed { stroke-dasharray:10 9; }
      .orange-arrow { fill:none; stroke:#db8129; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-orange); }
      .icon { fill:none; stroke:#207448; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .label-bg { fill:#f5f8f5; }
      .title { font:700 48px sans-serif; fill:#303a36; }
      .node-title { font:700 30px sans-serif; fill:#303a36; }
      .node-mono { font:700 30px monospace; fill:#303a36; }
      .node-secondary { font:24px sans-serif; fill:#303a36; }
      .node-mono-secondary { font:24px monospace; fill:#303a36; }
      .edge-label { font:24px sans-serif; fill:#303a36; }
      .edge-mono { font:24px monospace; fill:#303a36; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1260"/>
  <text class="title" x="800" y="76" text-anchor="middle">From source to executable</text>

  <!-- Connections -->
  <path class="orange-arrow" d="M310 330 H660"/>
  <path class="arrow" d="M980 330 H1200"/>
  <path class="arrow" d="M310 590 H620"/>
  <path class="arrow" d="M1350 430 V620 H1100 V700"/>
  <path class="arrow" d="M770 660 V760 H850"/>
  <path class="arrow" d="M370 940 H700 V840 H850"/>
  <path class="arrow dashed" d="M710 1030 V970 H980 V900"/>
  <path class="arrow" d="M1150 790 H1240"/>
  <path class="arrow" d="M1390 880 V1060"/>
  <path class="arrow dashed" d="M920 1140 H1240"/>

  <!-- Arrow labels -->
  <rect class="label-bg" x="330" y="112" width="560" height="112" rx="12"/>
  <text class="edge-label" x="610" y="145" text-anchor="middle">
    <tspan x="610" dy="0">preprocessor (cpp)</tspan>
    <tspan x="610" dy="30">expands #include, #define, #ifdef</tspan>
  </text>
  <rect class="label-bg" x="990" y="174" width="230" height="48" rx="10"/>
  <text class="edge-mono" x="1105" y="207" text-anchor="middle">compiler (cc -c)</text>
  <rect class="label-bg" x="1405" y="910" width="185" height="106" rx="12"/>
  <text class="edge-mono" x="1415" y="940">
    <tspan x="1415" dy="0">at run time:</tspan>
    <tspan x="1415" dy="30">ld.so finds</tspan>
    <tspan x="1415" dy="30">libbar.so</tspan>
  </text>

  <!-- main.c -->
  <g>
    <rect class="card" x="60" y="250" width="250" height="160" rx="18"/>
    <path class="icon" d="M83 292 V276 H119 L139 296 V355 H83 Z M119 276 V297 H139 M96 321 H126 M96 336 H126"/>
    <text class="node-mono" x="155" y="337">main.c</text>
  </g>

  <!-- expanded source -->
  <g>
    <rect class="card" x="660" y="250" width="320" height="160" rx="18"/>
    <path class="icon" d="M684 292 V276 H720 L740 296 V355 H684 Z M720 276 V297 H740 M697 321 H727 M697 336 H727"/>
    <text class="node-title" x="756" y="316">
      <tspan x="756" dy="0">expanded</tspan>
      <tspan x="756" dy="34">source</tspan>
    </text>
  </g>

  <!-- main.o -->
  <g>
    <rect class="card" x="1200" y="250" width="300" height="180" rx="18"/>
    <path class="icon" d="M1222 292 V276 H1258 L1278 296 V355 H1222 Z M1258 276 V297 H1278 M1235 321 H1265 M1235 336 H1265"/>
    <text class="node-mono" x="1294" y="313">
      <tspan x="1294" dy="0">main.o</tspan>
      <tspan class="node-secondary" x="1294" dy="34">object file</tspan>
    </text>
  </g>

  <!-- aux.c -->
  <g>
    <rect class="card" x="60" y="510" width="250" height="160" rx="18"/>
    <path class="icon" d="M83 552 V536 H119 L139 556 V615 H83 Z M119 536 V557 H139 M96 581 H126 M96 596 H126"/>
    <text class="node-mono" x="155" y="597">aux.c</text>
  </g>

  <!-- aux.o -->
  <g>
    <rect class="card" x="620" y="500" width="300" height="160" rx="18"/>
    <path class="icon" d="M642 542 V526 H678 L698 546 V605 H642 Z M678 526 V547 H698 M655 571 H685 M655 586 H685"/>
    <text class="node-mono" x="714" y="563">
      <tspan x="714" dy="0">aux.o</tspan>
      <tspan class="node-secondary" x="714" dy="34">object file</tspan>
    </text>
  </g>

  <!-- linker -->
  <g>
    <rect class="card" x="850" y="700" width="300" height="200" rx="18"/>
    <path class="icon" d="M900 747 L908 733 L920 739 L931 731 L943 739 L955 733 L963 747 L977 751 L975 765 L984 775 L975 787 L977 801 L963 805 L955 819 L943 813 L931 821 L920 813 L908 819 L900 805 L886 801 L888 787 L879 775 L888 765 L886 751 Z M931 760 A15 15 0 1 0 931 790 A15 15 0 1 0 931 760"/>
    <text class="node-title" x="997" y="774">linker (ld)</text>
    <text class="node-secondary" x="997" y="811">resolves symbols</text>
  </g>

  <!-- executable -->
  <g>
    <rect class="card" x="1240" y="700" width="300" height="180" rx="18"/>
    <rect class="icon" x="1265" y="738" width="58" height="48" rx="4"/>
    <path class="icon" d="M1265 751 H1323 M1277 744 H1279 M1288 744 H1290 M1278 771 L1289 760 L1300 771 L1311 760"/>
    <text class="node-title" x="1340" y="758">
      <tspan x="1340" dy="0">executable</tspan>
      <tspan class="node-mono-secondary" x="1340" dy="34">myprog (ELF)</tspan>
    </text>
  </g>

  <!-- running process -->
  <g>
    <rect class="card" x="1240" y="1060" width="300" height="160" rx="18"/>
    <rect class="icon" x="1265" y="1105" width="58" height="48" rx="4"/>
    <path class="icon" d="M1265 1118 H1323 M1277 1111 H1279 M1288 1111 H1290 M1283 1130 L1305 1141 L1283 1152 Z"/>
    <text class="node-title" x="1340" y="1130">
      <tspan x="1340" dy="0">running</tspan>
      <tspan x="1340" dy="34">process</tspan>
    </text>
  </g>

  <!-- static library -->
  <g>
    <rect class="card" x="60" y="850" width="310" height="180" rx="18"/>
    <path class="icon" d="M83 881 C83 870 101 864 119 864 C137 864 155 870 155 881 C155 892 137 898 119 898 C101 898 83 892 83 881 Z M83 881 V921 C83 932 101 938 119 938 C137 938 155 932 155 921 V881 M83 901 C83 912 101 918 119 918 C137 918 155 912 155 901"/>
    <text class="node-title" x="172" y="885">
      <tspan x="172" dy="0">static library</tspan>
      <tspan class="node-mono-secondary" x="172" dy="32">libfoo.a</tspan>
      <tspan class="node-secondary" x="172" dy="30">(code copied in)</tspan>
    </text>
  </g>

  <!-- shared library -->
  <g>
    <rect class="card" x="500" y="1030" width="420" height="200" rx="18"/>
    <path class="icon" d="M523 1062 C523 1051 541 1045 559 1045 C577 1045 595 1051 595 1062 C595 1073 577 1079 559 1079 C541 1079 523 1073 523 1062 Z M523 1062 V1102 C523 1113 541 1119 559 1119 C577 1119 595 1113 595 1102 V1062 M523 1082 C523 1093 541 1099 559 1099 C577 1099 595 1093 595 1082"/>
    <text class="node-title" x="612" y="1068">
      <tspan x="612" dy="0">shared library</tspan>
      <tspan class="node-mono-secondary" x="612" dy="32">libbar.so</tspan>
      <tspan class="node-secondary" x="612" dy="30">(only a reference is</tspan>
      <tspan class="node-secondary" x="612" dy="28">recorded)</tspan>
    </text>
  </g>
</svg>