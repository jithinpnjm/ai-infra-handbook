<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>From source to executable</title>
  <desc>Toolchain pipeline from C source files through preprocessor, compiler, linker, and runtime dynamic loader.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#f5f8f5"/>
  <text x="800" y="76" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">From source to executable</text>

  <!-- Row 1: main.c -> expanded source -> main.o -->
  <rect x="40" y="180" width="240" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <path d="M72 220h28l10 10v36H72z M100 220v10h10 M82 242h20 M82 254h20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="132" y="254" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">main.c</text>

  <!-- Edge 1: preprocessor -->
  <path d="M280 245 H616" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="448" y="160" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="448" dy="0">preprocessor (cpp)</tspan>
    <tspan x="448" dy="30">expands #include,</tspan>
    <tspan x="448" dy="30">#define, #ifdef</tspan>
  </text>

  <rect x="620" y="180" width="290" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <path d="M650 220h28l10 10v36h-38z M678 220v10h10 M660 242h20 M660 254h20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="710" y="236" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">
    <tspan x="710" dy="0">expanded</tspan>
    <tspan x="710" dy="34">source</tspan>
  </text>

  <!-- Edge 2: compiler -->
  <path d="M910 245 H1226" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1068" y="220" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24">compiler (cc -c)</text>

  <rect x="1230" y="180" width="320" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <path d="M1262 220h28l10 10v36h-38z M1290 220v10h10 M1272 242h20 M1272 254h20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="1324" y="238" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">main.o</text>
  <text x="1324" y="274" fill="#303a36" font-family="sans-serif" font-size="24">object file</text>

  <!-- Row 2: aux.c -> aux.o -->
  <rect x="40" y="380" width="240" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <path d="M72 420h28l10 10v36H72z M100 420v10h10 M82 442h20 M82 454h20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="132" y="454" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">aux.c</text>

  <path d="M280 445 H616" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="620" y="380" width="290" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <path d="M650 420h28l10 10v36h-38z M678 420v10h10 M660 442h20 M660 454h20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="710" y="438" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">aux.o</text>
  <text x="710" y="474" fill="#303a36" font-family="sans-serif" font-size="24">object file</text>

  <!-- Row 3: static library -->
  <rect x="40" y="575" width="350" height="165" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <ellipse cx="94" cy="635" rx="26" ry="10"/>
    <path d="M68 635v38c0 6 12 10 26 10s26-4 26-10v-38 M68 654c0 6 12 10 26 10s26-4 26-10"/>
  </g>
  <text x="142" y="622" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">static library</text>
  <text x="142" y="658" fill="#303a36" font-family="monospace" font-size="24">libfoo.a</text>
  <text x="142" y="694" fill="#303a36" font-family="sans-serif" font-size="24">(code copied in)</text>

  <!-- Linker (ld) -->
  <rect x="740" y="570" width="380" height="175" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round">
    <circle cx="806" cy="656" r="22"/>
    <circle cx="806" cy="656" r="9"/>
    <path d="M806 626v8 M806 678v8 M776 656h8 M828 656h8 M785 635l6 6 M821 671l6 6 M785 677l6-6 M821 641l6-6"/>
  </g>
  <text x="860" y="646" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">linker (ld)</text>
  <text x="860" y="688" fill="#303a36" font-family="sans-serif" font-size="25">resolves symbols</text>

  <!-- Arrows into linker -->
  <path d="M1390 310 V520 H980 V566" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M765 510 V540 H860 V566" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M390 658 H736" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Executable -->
  <rect x="1220" y="585" width="330" height="145" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round">
    <rect x="1250" y="630" width="46" height="36" rx="5"/>
    <path d="M1250 642h46 M1260 654l7-5 7 5 9-6"/>
  </g>
  <text x="1318" y="646" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">executable</text>
  <text x="1318" y="684" fill="#303a36" font-family="monospace" font-size="24">myprog (ELF)</text>

  <path d="M1120 658 H1216" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Row 4: shared library + running process -->
  <rect x="440" y="820" width="440" height="190" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <ellipse cx="496" cy="885" rx="26" ry="10"/>
    <path d="M470 885v38c0 6 12 10 26 10s26-4 26-10v-38 M470 904c0 6 12 10 26 10s26-4 26-10"/>
  </g>
  <text x="546" y="870" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">shared library</text>
  <text x="546" y="906" fill="#303a36" font-family="monospace" font-size="24">libbar.so</text>
  <text x="546" y="942" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="546" dy="0">(only a reference is</tspan>
    <tspan x="546" dy="30">recorded)</tspan>
  </text>

  <!-- dashed shared lib -> linker -->
  <path d="M660 820 V785 H930 V749" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <!-- running process -->
  <rect x="1220" y="850" width="330" height="145" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round">
    <rect x="1250" y="896" width="46" height="36" rx="5"/>
    <path d="M1250 908h46 M1268 914l10 6-10 6z"/>
  </g>
  <text x="1318" y="914" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">
    <tspan x="1318" dy="0">running</tspan>
    <tspan x="1318" dy="34">process</tspan>
  </text>

  <!-- executable -> running process -->
  <path d="M1385 730 V846" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1405" y="778" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1405" dy="0">at run time:</tspan>
    <tspan x="1405" dy="28" font-family="monospace">ld.so finds</tspan>
    <tspan x="1405" dy="28" font-family="monospace">libbar.so</tspan>
  </text>

  <!-- dashed shared lib -> running process -->
  <path d="M880 922 H1216" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
</svg>
