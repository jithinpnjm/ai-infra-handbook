<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>BRE versus ERE</title>
  <desc>Visual comparison between Basic Regular Expressions and Extended Regular Expressions showing operator behavior, tool flags, and recommendations.</desc>

  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">BRE versus ERE</text>

  
  <g id="bre-column">
    <rect x="60" y="130" width="720" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="392" y="165" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="392" y1="181" x2="448" y2="181" stroke="#207448" stroke-width="4"/>
    <circle cx="404" cy="173" r="3" fill="#207448"/>
    <circle cx="415" cy="173" r="3" fill="#207448"/>
    <path d="M 404 197 L 412 203 L 404 209" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="416" y1="209" x2="426" y2="209" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <text x="420" y="265" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">BRE (default in <tspan font-family="monospace">grep</tspan> and <tspan font-family="monospace">sed</tspan>)</text>

    
    <text x="420" y="340" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan x="420" dy="0"><tspan font-family="monospace">+ ? | () { }</tspan> are literal text</tspan>
      <tspan x="420" dy="44">unless preceded by a backslash.</tspan>
    </text>
  </g>

  
  <g id="ere-column">
    <rect x="820" y="130" width="720" height="390" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <rect x="1152" y="165" width="56" height="48" rx="6" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="1152" y1="181" x2="1208" y2="181" stroke="#db8129" stroke-width="4"/>
    <circle cx="1164" cy="173" r="3" fill="#db8129"/>
    <circle cx="1175" cy="173" r="3" fill="#db8129"/>
    <path d="M 1164 197 L 1172 203 L 1164 209" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1176" y1="209" x2="1186" y2="209" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

    
    <text x="1180" y="265" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">ERE (<tspan font-family="monospace">grep -E</tspan>, <tspan font-family="monospace">sed -E</tspan>, <tspan font-family="monospace">awk</tspan>)</text>

    
    <text x="1180" y="330" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan x="1180" dy="0">the same characters are operators</tspan>
      <tspan x="1180" dy="42">straight away, a literal plus</tspan>
      <tspan x="1180" dy="42">needs a backslash.</tspan>
    </text>
  </g>

  
  <g id="bottom-tools-row">
    <rect x="60" y="560" width="1480" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(100, 612)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="180" y="650" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36"><tspan font-family="monospace">GNU grep -P</tspan> enables Perl-compatible expressions, not on <tspan font-family="monospace">macOS grep</tspan>.</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="760" width="1480" height="100" rx="16" fill="#207448"/>
    <text x="800" y="822" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">use -E unless you have a reason not to.</text>
  </g>
</svg>