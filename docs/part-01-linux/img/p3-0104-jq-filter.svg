<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>How a jq filter walks through JSON</title>
  <desc>Visual breakdown of a jq pipeline iterating an array, filtering by memory threshold, and extracting an ID field.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">How a jq filter walks through JSON</text>

  
  <g id="top-input-box">
    <rect x="250" y="90" width="1100" height="65" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 275 102 L 298 102 L 310 114 L 310 142 L 275 142 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 298 102 L 298 114 L 310 114" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <text x="815" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">{"gpu":[{"id":0,"mem":1200},{"id":1,"mem":81000}]}</text>
  </g>

  
  <path d="M 290 155 L 290 225" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="stage-1">
    <rect x="60" y="225" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="105" cy="265" r="24" fill="#207448"/>
    <text x="105" y="265" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 158 243 L 146 243 L 146 287 L 158 287" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 182 243 L 194 243 L 194 287 L 182 287" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="163" cy="265" r="3" fill="#207448"/>
    <circle cx="170" cy="265" r="3" fill="#207448"/>
    <circle cx="177" cy="265" r="3" fill="#207448"/>
    
    <text x="215" y="275" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">.gpu[]</text>
    
    <text x="290" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">iterate the array</text>
    
    <rect x="95" y="355" width="390" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="290" y="401" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">{id 0, mem 1200}</text>
    
    <rect x="95" y="450" width="390" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="290" y="496" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">{id 1, mem 81000}</text>
  </g>

  
  <path d="M 520 395 L 570 395" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="stage-2">
    <rect x="570" y="225" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="615" cy="265" r="24" fill="#207448"/>
    <text x="615" y="265" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <path d="M 660 245 L 704 245 L 688 267 L 688 285 L 676 289 L 676 267 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <text x="800" y="325" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">select(.mem>80000)</text>
    
    <text x="800" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">keeps the second card</tspan>
      <tspan x="800" dy="30">and drops the first</tspan>
    </text>
    
    <rect x="620" y="440" width="160" height="85" rx="8" fill="#dbe3de" stroke="#8d9a92" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 685 468 L 715 498 M 715 468 L 685 498" stroke="#8d9a92" stroke-width="4.5" stroke-linecap="round"/>
    
    <rect x="820" y="440" width="160" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <path d="M 875 482 L 892 499 L 925 462" fill="none" stroke="#207448" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <path d="M 1030 395 L 1080 395" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g id="stage-3">
    <rect x="1080" y="225" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1125" cy="265" r="24" fill="#207448"/>
    <text x="1125" y="265" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <path d="M 1172 260 L 1188 245 L 1210 245 L 1210 267 L 1194 282 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1200" cy="255" r="3" fill="#207448"/>
    
    <text x="1235" y="275" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">.id</text>
    
    <path d="M 1310 315 L 1310 360" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    
    <rect x="1170" y="365" width="280" height="145" rx="12" fill="#d4ecd9" stroke="#207448" stroke-width="3"/>
    <text x="1310" y="456" text-anchor="middle" font-family="ui-monospace, monospace" font-size="64" font-weight="bold" fill="#207448">1</text>
  </g>

  
  <g id="legend-panel">
    <rect x="60" y="615" width="1480" height="250" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="90" y="635" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="115" y="673" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">.field</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> reads a field</tspan>
    </text>
    
    <rect x="820" y="635" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="845" y="673" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">map(...)</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> transforms each one</tspan>
    </text>
    
    <rect x="90" y="710" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="115" y="748" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">.[]</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> iterates an array</tspan>
    </text>
    
    <rect x="820" y="710" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="845" y="748" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">-r</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> prints raw strings without quotes</tspan>
    </text>
    
    <rect x="90" y="785" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="115" y="823" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">select(condition)</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> keeps matching items</tspan>
    </text>
    
    <rect x="820" y="785" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="845" y="823" font-size="24">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">@tsv or @csv</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> produce tables</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="60" y="910" width="1480" height="75" rx="10" fill="#207448"/>
    <text x="800" y="956" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Regex does not understand nesting or escaping, so use jq or yq</text>
  </g>
</svg>