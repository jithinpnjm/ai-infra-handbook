<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>Same task, two families</title>
  <desc>Comparison of package management tasks between Debian and Red Hat Linux families</desc>

  
  <rect width="1600" height="940" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Same task, two families</text>

  

  
  <g id="header-task">
    <rect x="70" y="115" width="420" height="65" rx="10" fill="#264838"/>
    
    <g transform="translate(95, 126)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="26" height="30" rx="3"/>
      <path d="M16 10 V6 a2 2 0 0 1 2 -2 h6 a2 2 0 0 1 2 2 v4"/>
      <line x1="14" y1="18" x2="28" y2="18"/>
      <line x1="14" y1="25" x2="28" y2="25"/>
      <line x1="14" y1="32" x2="22" y2="32"/>
    </g>
    <text x="160" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Task</text>
  </g>

  
  <g id="header-debian">
    <rect x="510" y="115" width="500" height="65" rx="10" fill="#207448"/>
    
    <g transform="translate(535, 126)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 4 L37 12 L21 20 L5 12 Z"/>
      <path d="M5 12 V30 L21 38 V20"/>
      <path d="M37 12 V30 L21 38"/>
      <line x1="13" y1="16" x2="29" y2="24"/>
    </g>
    <text x="595" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Debian family</text>
  </g>

  
  <g id="header-redhat">
    <rect x="1030" y="115" width="500" height="65" rx="10" fill="#1d664c"/>
    
    <g transform="translate(1055, 126)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 4 L37 12 L21 20 L5 12 Z"/>
      <path d="M5 12 V30 L21 38 V20"/>
      <path d="M37 12 V30 L21 38"/>
      <circle cx="21" cy="20" r="3" fill="#ffffff"/>
    </g>
    <text x="1115" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Red Hat family</text>
  </g>

  
  <g id="row-refresh-metadata">
    
    <rect x="70" y="195" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 215)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 24 A18 18 0 1 1 35 12"/>
      <polyline points="36 4 36 14 26 14"/>
    </g>
    <text x="160" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">refresh metadata</text>

    
    <rect x="510" y="195" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="248" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">sudo apt update</text>

    
    <rect x="1030" y="195" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="248" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">sudo dnf makecache</text>
  </g>

  
  <g id="row-install">
    
    <rect x="70" y="295" width="420" height="88" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(95, 315)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 26 V40 H40 V26"/>
      <line x1="24" y1="8" x2="24" y2="30"/>
      <polyline points="15 21 24 30 33 21"/>
    </g>
    <text x="160" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">install</text>

    
    <rect x="510" y="295" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="348" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">sudo apt install pkg1 pkg2</text>

    
    <rect x="1030" y="295" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="348" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">sudo dnf install pkg1 pkg2</text>
  </g>

  
  <g id="row-remove">
    
    <rect x="70" y="395" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 415)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="12" x2="42" y2="12"/>
      <line x1="16" y1="12" x2="16" y2="6"/>
      <line x1="32" y1="12" x2="32" y2="6"/>
      <path d="M10 12 L14 42 H34 L38 12"/>
      <line x1="20" y1="20" x2="20" y2="34"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
    </g>
    <text x="160" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">remove</text>

    
    <rect x="510" y="395" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="448" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">sudo apt remove pkg</text>

    
    <rect x="1030" y="395" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="448" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">sudo dnf remove pkg</text>
  </g>

  
  <g id="row-upgrade">
    
    <rect x="70" y="495" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 515)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="40" x2="40" y2="40"/>
      <line x1="24" y1="34" x2="24" y2="8"/>
      <polyline points="12 18 24 6 36 18"/>
    </g>
    <text x="160" y="549" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">upgrade</text>

    
    <rect x="510" y="495" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="548" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">sudo apt upgrade</text>

    
    <rect x="1030" y="495" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="548" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">sudo dnf upgrade</text>
  </g>

  
  <g id="row-search">
    
    <rect x="70" y="595" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 615)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="14"/>
      <line x1="30" y1="30" x2="42" y2="42"/>
    </g>
    <text x="160" y="649" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">search</text>

    
    <rect x="510" y="595" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="648" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">apt search word</text>

    
    <rect x="1030" y="595" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="648" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">dnf search word</text>
  </g>

  
  <g id="row-show-details">
    
    <rect x="70" y="695" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 715)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6 H28 L38 16 V42 H10 Z"/>
      <polyline points="28 6 28 16 38 16"/>
      <line x1="18" y1="24" x2="30" y2="24"/>
      <line x1="18" y1="32" x2="26" y2="32"/>
    </g>
    <text x="160" y="749" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">show details</text>

    
    <rect x="510" y="695" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="748" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">apt show pkg</text>

    
    <rect x="1030" y="695" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="748" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">dnf info pkg</text>
  </g>

  
  <g id="row-which-version">
    
    <rect x="70" y="795" width="420" height="88" rx="10" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    
    <g transform="translate(95, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 24 L24 8 H40 V24 L24 40 Z"/>
      <circle cx="32" cy="16" r="3" fill="#207448"/>
    </g>
    <text x="160" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="160" dy="0">which version</tspan>
      <tspan x="160" dy="28">would be used</tspan>
    </text>

    
    <rect x="510" y="795" width="500" height="88" rx="10" fill="#e8f1ea" stroke="#c5dcce" stroke-width="2"/>
    <text x="760" y="848" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1b5a38">apt policy pkg</text>

    
    <rect x="1030" y="795" width="500" height="88" rx="10" fill="#ddede2" stroke="#bedac8" stroke-width="2"/>
    <text x="1280" y="848" text-anchor="middle" font-family="'SF Mono', 'Segoe UI Mono', monospace" font-size="24" fill="#1d664c">dnf list --showduplicates pkg</text>
  </g>
</svg>