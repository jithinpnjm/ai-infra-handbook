<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
  <title>Configuration as code and fleet operations</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="60" y="85" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Configuration as code and fleet operations</text>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 240 H940" marker-end="url(#arrow-green)"/>
    <path d="M1240 350 V390" marker-end="url(#arrow-green)"/>
    <path d="M940 520 H900 V660 H360 V700" marker-end="url(#arrow-orange)"/>
    <path d="M1240 610 V700" marker-end="url(#arrow-green)"/>
    <path d="M360 900 V950" marker-end="url(#arrow-green)"/>
    <path d="M660 1055 H940" marker-end="url(#arrow-green)"/>
  </g>

  <text x="630" y="648" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle">pass</text>
  <text x="1260" y="665" fill="#303a36" font-family="sans-serif" font-size="24">fail</text>
  <text x="800" y="1040" fill="#303a36" font-family="sans-serif" font-size="24" text-anchor="middle">drift or fault</text>

  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="60" y="130" width="600" height="220" rx="18"/>
    <rect x="940" y="130" width="600" height="220" rx="18"/>
    <rect x="940" y="390" width="600" height="220" rx="18"/>
    <rect x="60" y="700" width="600" height="200" rx="18"/>
    <rect x="940" y="700" width="600" height="200" rx="18"/>
    <rect x="60" y="950" width="600" height="210" rx="18"/>
    <rect x="940" y="950" width="600" height="210" rx="18"/>
  </g>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M88 163 H119 L132 176 V211 H88 Z"/>
    <path d="M119 163 V176 H132 M98 185 H122 M98 194 H122 M98 203 H116"/>
    
    <path d="M968 178 L996 162 L1024 178 L996 194 Z"/>
    <path d="M968 178 V208 L996 224 L1024 208 V178 M996 194 V224"/>
    <path d="M982 170 L1010 186"/>
    
    <rect x="968" y="438" width="48" height="48" rx="5"/>
    <rect x="980" y="450" width="24" height="24" rx="3"/>
    <path d="M978 430 V438 M990 430 V438 M1002 430 V438 M1014 430 V438 M978 486 V494 M990 486 V494 M1002 486 V494 M1014 486 V494 M960 448 H968 M960 460 H968 M960 472 H968 M960 484 H968 M1016 448 H1024 M1016 460 H1024 M1016 472 H1024 M1016 484 H1024"/>
    
    <rect x="88" y="750" width="48" height="14" rx="3"/>
    <rect x="88" y="773" width="48" height="14" rx="3"/>
    <rect x="88" y="796" width="48" height="14" rx="3"/>
    <path d="M98 757 H100 M98 780 H100 M98 803 H100 M108 757 H128 M108 780 H128 M108 803 H128"/>
    
    <path d="M968 748 L992 740 L1016 748 V772 C1016 790 1006 803 992 812 C978 803 968 790 968 772 Z"/>
    <path d="M982 762 L1002 782 M1002 762 L982 782"/>
    
    <circle cx="112" cy="1055" r="20"/>
    <path d="M127 1070 L142 1085 M102 1055 L109 1062 L122 1046"/>
    
    <path d="M1006 965 A19 19 0 0 0 981 989 L968 1002 L984 1018 L997 1005 A19 19 0 0 0 1021 980 L1009 992 L998 981 Z"/>
  </g>

  <g fill="#303a36" font-family="sans-serif">
    <text x="160" y="192" font-size="30" font-weight="700">Git:</text>
    <text x="160" y="235" font-size="24">
      <tspan x="160" dy="0">kickstart/autoinstall, Ansible</tspan>
      <tspan x="160" dy="30">roles, tuned profiles, sysctl,</tspan>
      <tspan x="160" dy="30">systemd units, GRUB args,</tspan>
      <tspan x="160" dy="30">node audit, baseline</tspan>
    </text>

    <text x="1040" y="192" font-size="30" font-weight="700">Image build</text>
    <text x="1040" y="235" font-size="24">
      <tspan x="1040" dy="0">(Packer/BCM image/Ansible)</tspan>
      <tspan x="1040" dy="30">kernel + driver + MOFED +</tspan>
      <tspan x="1040" dy="30">toolkit + agents</tspan>
    </text>

    <text x="1040" y="452" font-size="30" font-weight="700">Canary node(s):</text>
    <text x="1040" y="495" font-size="24">
      <tspan x="1040" dy="0">boot, audit, dcgmi diag,</tspan>
      <tspan x="1040" dy="30">nccl-tests, reference step</tspan>
    </text>

    <text x="160" y="762" font-size="30" font-weight="700">Rollout waves</text>
    <text x="160" y="805" font-size="24">
      <tspan x="160" dy="0">(drain → reimage/update →</tspan>
      <tspan x="160" dy="30">audit → uncordon)</tspan>
    </text>

    <text x="1040" y="762" font-size="30" font-weight="700">Reject image / fix</text>

    <text x="160" y="1005" font-size="30" font-weight="700">
      <tspan x="160" dy="0">Continuous health &amp;</tspan>
      <tspan x="160" dy="36">drift checks</tspan>
    </text>
    <text x="160" y="1090" font-size="24">
      <tspan x="160" dy="0">(prolog/epilog, node-health,</tspan>
      <tspan x="160" dy="30">DCGM, audit cron)</tspan>
    </text>

    <text x="1040" y="1005" font-size="30" font-weight="700">
      <tspan x="1040" dy="0">Drain, diagnose,</tspan>
      <tspan x="1040" dy="36">repair or RMA</tspan>
    </text>
  </g>
</svg>