<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>CPU basics</title>
  <desc>Diagram of the CPU basics.</desc>

  <defs>
    <marker id="orange-arrow" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f8f5"/>

  <text x="800" y="100" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">CPU basics</text>

  <!-- Socket 0 container -->
  <rect x="60" y="160" width="1080" height="780" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>

  <!-- Socket icon -->
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="100" y="184" width="48" height="48" rx="6"/>
    <path d="M112 184v-10 M124 184v-10 M136 184v-10 M112 232v10 M124 232v10 M136 232v10 M100 196h-10 M100 208h-10 M100 220h-10 M148 196h10 M148 208h10 M148 220h10"/>
    <path d="M114 198h20v20h-20z"/>
  </g>
  <text x="174" y="221" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Socket 0 (NUMA node 0)</text>

  <!-- Grouping relation: Local DRAM --- Socket 0 -->
  <path d="M1140 260 H1260" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  <!-- Local DRAM node -->
  <rect x="1260" y="170" width="290" height="180" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1312" cy="226" rx="28" ry="10"/>
    <path d="M1284 226v38c0 6 13 11 28 11s28-5 28-11v-38 M1284 245c0 6 13 11 28 11s28-5 28-11"/>
  </g>
  <text x="1355" y="257" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Local DRAM</text>

  <!-- Core 0 container -->
  <rect x="100" y="300" width="610" height="420" rx="20" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="126" y="316" width="48" height="48" rx="6"/>
    <path d="M138 316v-10 M150 316v-10 M162 316v-10 M138 364v10 M150 364v10 M162 364v10 M126 328h-10 M126 340h-10 M126 352h-10 M174 328h10 M174 340h10 M174 352h10"/>
    <path d="M140 330h20v20h-20z"/>
  </g>
  <text x="194" y="352" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Core 0</text>

  <!-- HW thread 0 node -->
  <rect x="115" y="400" width="170" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="426" width="48" height="48" rx="6"/>
    <path d="M188 426v-10 M200 426v-10 M212 426v-10 M188 474v10 M200 474v10 M212 474v10 M176 438h-10 M176 450h-10 M176 462h-10 M224 438h10 M224 450h10 M224 462h10"/>
    <path d="M190 440h20v20h-20z"/>
  </g>
  <text x="200" y="535" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="200" dy="0">HW</tspan>
    <tspan x="200" dy="38">thread 0</tspan>
    <tspan x="200" dy="38">(CPU 0)</tspan>
  </text>

  <!-- HW thread 1 node -->
  <rect x="320" y="400" width="170" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="381" y="426" width="48" height="48" rx="6"/>
    <path d="M393 426v-10 M405 426v-10 M417 426v-10 M393 474v10 M405 474v10 M417 474v10 M381 438h-10 M381 450h-10 M381 462h-10 M429 438h10 M429 450h10 M429 462h10"/>
    <path d="M395 440h20v20h-20z"/>
  </g>
  <text x="405" y="535" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="405" dy="0">HW</tspan>
    <tspan x="405" dy="38">thread 1</tspan>
    <tspan x="405" dy="38">(CPU 64)</tspan>
  </text>

  <!-- L1i/L1d + L2 node -->
  <rect x="525" y="400" width="170" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="586" y="426" width="48" height="48" rx="6"/>
    <path d="M598 426v-10 M610 426v-10 M622 426v-10 M598 474v10 M610 474v10 M622 474v10 M586 438h-10 M586 450h-10 M586 462h-10 M634 438h10 M634 450h10 M634 462h10"/>
    <path d="M600 440h20v20h-20z"/>
  </g>
  <text x="610" y="535" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="610" dy="0">L1i/L1d</tspan>
    <tspan x="610" dy="38">+ L2</tspan>
  </text>

  <!-- Core 1 container -->
  <rect x="750" y="300" width="340" height="430" rx="20" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="780" y="316" width="48" height="48" rx="6"/>
    <path d="M792 316v-10 M804 316v-10 M816 316v-10 M792 364v10 M804 364v10 M816 364v10 M780 328h-10 M780 340h-10 M780 352h-10 M828 328h10 M828 340h10 M828 352h10"/>
    <path d="M794 330h20v20h-20z"/>
  </g>
  <text x="848" y="352" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Core 1</text>

  <!-- CPU 1 node -->
  <rect x="815" y="400" width="210" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="896" y="410" width="48" height="48" rx="6"/>
    <path d="M908 410v-8 M920 410v-8 M932 410v-8 M908 458v8 M920 458v8 M932 458v8 M896 422h-8 M896 434h-8 M896 446h-8 M944 422h8 M944 434h8 M944 446h8"/>
    <path d="M910 424h20v20h-20z"/>
  </g>
  <text x="920" y="510" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">CPU 1</text>

  <!-- CPU 1 --- CPU 65 grouping relation -->
  <path d="M920 545 V575" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  <!-- CPU 65 node -->
  <rect x="815" y="575" width="210" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="896" y="582" width="48" height="48" rx="6"/>
    <path d="M908 582v-8 M920 582v-8 M932 582v-8 M908 630v8 M920 630v8 M932 630v8 M896 594h-8 M896 606h-8 M896 618h-8 M944 594h8 M944 606h8 M944 618h8"/>
    <path d="M910 596h20v20h-20z"/>
  </g>
  <text x="920" y="680" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">CPU 65</text>

  <!-- Shared L3 node -->
  <rect x="350" y="770" width="500" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="390" y="811" width="48" height="48" rx="6"/>
    <path d="M402 811v-10 M414 811v-10 M426 811v-10 M402 859v10 M414 859v10 M426 859v10 M390 823h-10 M390 835h-10 M390 847h-10 M438 823h10 M438 835h10 M438 847h10"/>
    <path d="M404 825h20v20h-20z"/>
  </g>
  <text x="470" y="852" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Shared L3</text>

  <!-- Socket 0 <--> Socket 1 -->
  <path d="M1140 650 H1260" fill="none" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-start="url(#orange-arrow)" marker-end="url(#orange-arrow)"/>

  <!-- Socket 1 container -->
  <rect x="1260" y="520" width="290" height="260" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1381" y="552" width="48" height="48" rx="6"/>
    <path d="M1393 552v-10 M1405 552v-10 M1417 552v-10 M1393 600v10 M1405 600v10 M1417 600v10 M1381 564h-10 M1381 576h-10 M1381 588h-10 M1429 564h10 M1429 576h10 M1429 588h10"/>
    <path d="M1395 566h20v20h-20z"/>
  </g>
  <text x="1405" y="657" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="1405" dy="0">Socket 1</tspan>
    <tspan x="1405" dy="40">(NUMA node 1)</tspan>
  </text>
</svg>