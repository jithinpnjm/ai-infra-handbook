<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <title>Troubleshooting flow: "the node has no GPUs"</title>
  <desc>Decision tree diagnosing missing GPUs from lspci and lsmod through modprobe errors and nvidia-smi failures.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1320" fill="#f5f8f5"/>
  <text x="800" y="70" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Troubleshooting flow: "the node has no GPUs"</text>

  <!-- Row 1: Start -> lspci -> Hardware/firmware -->
  <rect x="40" y="110" width="380" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="64" y="152" width="44" height="44" rx="5"/>
    <rect x="76" y="164" width="20" height="20"/>
    <path d="M76 152v-7 M86 152v-7 M96 152v-7 M76 196v7 M86 196v7 M96 196v7"/>
  </g>
  <text x="126" y="165" fill="#303a36" font-family="sans-serif" font-size="27" font-weight="700">
    <tspan x="126" dy="0">nvidia-smi fails /</tspan>
    <tspan x="126" dy="34">GPUs missing</tspan>
  </text>

  <path d="M420 175 H496" fill="none" stroke="#db8129" stroke-width="4.5" marker-end="url(#orange-arrow)"/>

  <rect x="500" y="110" width="460" height="130" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <circle cx="542" cy="170" r="18"/><path d="M555 183l12 12 M542 162v16 M534 170h16"/>
  </g>
  <text x="584" y="162" fill="#303a36" font-family="monospace" font-size="25" font-weight="700">lspci | grep -i nvidia</text>
  <text x="584" y="198" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">shows the devices?</text>

  <!-- Q1 no -> Hardware/firmware -->
  <path d="M960 175 H1066" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1013" y="160" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">no</text>

  <rect x="1070" y="105" width="490" height="145" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <rect x="1094" y="156" width="44" height="34" rx="4"/><path d="M1094 168h44"/>
  </g>
  <text x="1156" y="144" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">
    <tspan x="1156" dy="0">Hardware/firmware:</tspan>
    <tspan x="1156" dy="31" font-weight="400">PCIe link, riser, BMC logs,</tspan>
    <tspan x="1156" dy="31" font-weight="400">Xid 79 'fallen off the bus',</tspan>
    <tspan x="1156" dy="31" font-weight="400">BIOS</tspan>
  </text>

  <!-- Q1 yes -> Q2 lsmod -->
  <path d="M730 240 V296" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="762" y="276" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">yes</text>

  <rect x="520" y="300" width="420" height="120" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <circle cx="562" cy="360" r="16"/><circle cx="562" cy="360" r="6"/>
    <path d="M562 336v8 M562 376v8 M538 360h8 M578 360h8"/>
  </g>
  <text x="598" y="352" fill="#303a36" font-family="monospace" font-size="25" font-weight="700">lsmod | grep nvidia</text>
  <text x="598" y="388" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">loaded?</text>

  <!-- Left branch: Q2 no -> Q3 modprobe (Left column) -->
  <path d="M520 360 H320 V436" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="346" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">no</text>

  <rect x="60" y="440" width="520" height="110" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <circle cx="104" cy="495" r="18"/><path d="M104 483v12l8 6"/>
  </g>
  <text x="142" y="486" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">modprobe nvidia:</text>
  <text x="142" y="520" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">what error?</text>

  <!-- Left column 5 modprobe branches (clean horizontal forks from left spine at x=75) -->
  <path d="M75 550 V1205" fill="none" stroke="#207448" stroke-width="3.5"/>
  <!-- 5 horizontal arrows to 5 error rows -->
  <path d="M75 645 H126" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M75 785 H126" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M75 925 H126" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M75 1065 H126" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M75 1205 H126" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- M1 -->
  <rect x="130" y="585" width="660" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="622" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"Module not found"</text>
  <text x="155" y="658" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="155" dy="0">No module for this kernel: dkms status /</tspan>
    <tspan x="155" dy="30">package for uname -r; depmod -a</tspan>
  </text>

  <!-- M2 -->
  <rect x="130" y="725" width="660" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="762" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"Invalid module format"</text>
  <text x="155" y="798" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="155" dy="0">vermagic/ABI mismatch: rebuilt for</tspan>
    <tspan x="155" dy="30">another kernel</tspan>
  </text>

  <!-- M3 -->
  <rect x="130" y="865" width="660" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="902" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"Key was rejected / Required key"</text>
  <text x="155" y="942" fill="#303a36" font-family="sans-serif" font-size="24">Secure Boot: sign module, enrol MOK</text>

  <!-- M4 -->
  <rect x="130" y="1005" width="660" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="1042" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"No such device / nouveau bound"</text>
  <text x="155" y="1082" fill="#303a36" font-family="sans-serif" font-size="24">Blacklist nouveau, rebuild initramfs, reboot</text>

  <!-- M5 -->
  <rect x="130" y="1145" width="660" height="125" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="1182" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"Unknown symbol"</text>
  <text x="155" y="1218" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="155" dy="0">Dependency missing (ib_core for peermem)</tspan>
    <tspan x="155" dy="30">or kernel/driver mismatch</tspan>
  </text>

  <!-- Right branch: Q2 yes -> Q4 nvidia-smi error text? -->
  <path d="M940 360 H1190 V436" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1065" y="346" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">yes</text>

  <rect x="920" y="440" width="560" height="110" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <circle cx="964" cy="495" r="18"/><path d="M964 483v12l8 6"/>
  </g>
  <text x="1004" y="505" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">nvidia-smi error text?</text>

  <!-- Right column 3 nvidia-smi branches (clean spine at x=935) -->
  <path d="M935 550 V1060" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M935 665 H986" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M935 865 H986" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M935 1060 H986" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- V -->
  <rect x="990" y="590" width="570" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1015" y="630" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"Driver/library version mismatch"</text>
  <text x="1015" y="668" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1015" dy="0">Old module loaded vs new libs:</tspan>
    <tspan x="1015" dy="32">reload modules or reboot</tspan>
  </text>

  <!-- D -->
  <rect x="990" y="790" width="570" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1015" y="830" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"no devices found / Xid in dmesg"</text>
  <text x="1015" y="868" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="1015" dy="0">journalctl -k | grep NVRM;</tspan>
    <tspan x="1015" dy="32" font-family="sans-serif">firmware; power; Xid decode</tspan>
  </text>

  <!-- F -->
  <rect x="990" y="990" width="570" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1015" y="1030" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">"works, but multi-GPU job fails"</text>
  <text x="1015" y="1068" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1015" dy="0">Fabric Manager version/state;</tspan>
    <tspan x="1015" dy="32" font-family="monospace">nvidia-smi topo -m; nvlink status</tspan>
  </text>
</svg>
