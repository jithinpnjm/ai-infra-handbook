<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Ramping load and the knee</title>
  <desc>Chart illustrating ramping load and the saturation knee, showing throughput flattening while latency percentiles bend upward.</desc>

  <rect width="1600" height="1050" fill="#f5f8f5" />

  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ramping load and the knee</text>

  <g id="recommendation-banner">
    <rect x="80" y="110" width="1440" height="94" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(112, 129)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 V 30 C 50 44 28 52 28 52 C 28 52 6 44 6 30 V 14 Z" />
      <polyline points="18,28 25,36 38,20" />
    </g>
    <text x="820" y="150" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="820" dy="0">report the highest load with acceptable latency,</tspan>
      <tspan x="820" dy="34">not the highest throughput</tspan>
    </text>
  </g>

  <g id="chart-container">
    <rect x="80" y="230" width="1440" height="660" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    <g transform="translate(115, 255)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4,50 4,4 52,4" />
      <polyline points="4,40 18,28 32,34 50,12" />
    </g>

    <g stroke="#207448" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6,6">
      <line x1="220" y1="350" x2="1440" y2="350" />
      <line x1="220" y1="460" x2="1440" y2="460" />
      <line x1="220" y1="570" x2="1440" y2="570" />
      <line x1="220" y1="680" x2="1440" y2="680" />
    </g>

    <line x1="220" y1="760" x2="1440" y2="760" stroke="#303a36" stroke-width="3" stroke-linecap="round" />
    <line x1="220" y1="280" x2="220" y2="760" stroke="#303a36" stroke-width="3" stroke-linecap="round" />

    <g stroke="#303a36" stroke-width="2.5">
      <line x1="320" y1="752" x2="320" y2="768" />
      <line x1="455" y1="752" x2="455" y2="768" />
      <line x1="590" y1="752" x2="590" y2="768" />
      <line x1="725" y1="752" x2="725" y2="768" />
      <line x1="860" y1="752" x2="860" y2="768" stroke="#db8129" stroke-width="3.5" />
      <line x1="995" y1="752" x2="995" y2="768" />
      <line x1="1130" y1="752" x2="1130" y2="768" />
      <line x1="1265" y1="752" x2="1265" y2="768" />
      <line x1="1400" y1="752" x2="1400" y2="768" />
    </g>

    <line x1="860" y1="280" x2="860" y2="760" stroke="#db8129" stroke-width="3" stroke-dasharray="8,6" />

    <path d="M 220 710 C 380 630 650 430 860 410 L 1440 410" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 220 705 L 720 700 C 780 700 830 690 860 660 C 920 650 1020 480 1120 280" fill="none" stroke="#303a36" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="860" cy="410" r="10" fill="#db8129" stroke="#ffffff" stroke-width="3" />
    <circle cx="860" cy="660" r="10" fill="#db8129" stroke="#ffffff" stroke-width="3" />

    <g id="knee-callout">
      <rect x="700" y="270" width="320" height="84" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
      <text x="860" y="304" text-anchor="middle" font-family="sans-serif">
        <tspan x="860" dy="0" font-size="28" font-weight="bold" fill="#db8129">the knee</tspan>
        <tspan x="860" dy="32" font-size="24" font-weight="bold" fill="#db8129">where the curve bends</tspan>
      </text>
    </g>

    <g id="throughput-label-panel">
      <rect x="250" y="330" width="390" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="445" y="363" text-anchor="middle" font-family="sans-serif">
        <tspan x="445" dy="0" font-size="28" font-weight="bold" fill="#207448">throughput</tspan>
        <tspan x="445" dy="32" font-size="24" font-weight="bold" fill="#207448">rising then flattening</tspan>
      </text>
    </g>

    <g id="latency-label-panel">
      <rect x="1030" y="520" width="390" height="80" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2" />
      <text x="1225" y="553" text-anchor="middle" font-family="sans-serif">
        <tspan x="1225" dy="0" font-size="28" font-weight="bold" fill="#303a36">latency percentiles</tspan>
        <tspan x="1225" dy="32" font-size="24" font-weight="bold" fill="#303a36">flat then bending upward</tspan>
      </text>
    </g>

    <text x="830" y="825" text-anchor="middle" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#303a36">load</tspan>
      <tspan font-size="24" font-weight="normal" fill="#303a36"> (clients, threads or QPS added in steps)</tspan>
    </text>
  </g>

  <g id="takeaway-bar">
    <rect x="80" y="925" width="1440" height="72" rx="12" fill="#207448" />
    <g transform="translate(112, 937)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <polyline points="24,12 24,24 33,24" />
    </g>
    <text x="820" y="970" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Note: hold each level long enough to settle.</text>
  </g>
</svg>