<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>One wrong clock, many strange failures</title>
  <desc>Visual infographic explaining how node clock skew exceeding tolerance causes widespread cascading failures across Slurm, Kerberos, TLS, Kubernetes, logging, and NTP, along with underlying virtualization and makestep causes.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#db8129" />
    </marker>

    
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">One wrong clock, many strange failures</text>

  
  
  <path d="M 540 300 C 520 300, 520 230, 500 230" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <path d="M 540 400 C 520 400, 520 460, 500 460" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 540 480 C 520 480, 520 650, 500 650" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 300 C 1080 300, 1080 195, 1100 195" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 400 C 1080 400, 1080 425, 1100 425" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 480 C 1080 480, 1080 650, 1100 650" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g filter="url(#card-shadow)">
    <rect x="540" y="225" width="520" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    
    <g transform="translate(772, 245)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,12 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>

    
    <text x="800" y="340" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Node clock off by</tspan>
      <tspan x="800" dy="38">more than the tolerance</tspan>
    </text>

    
    <line x1="600" y1="396" x2="1000" y2="396" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    
    <text x="800" y="425" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="800" dy="0">Munge credential lifetime</tspan>
      <tspan x="800" dy="30">defaults to 5 minutes;</tspan>
      <tspan x="800" dy="30">Kerberos tolerates</tspan>
      <tspan x="800" dy="30">5 minutes of skew</tspan>
    </text>
  </g>

  

  
  <g filter="url(#card-shadow)">
    <rect x="40" y="95" width="460" height="270" rx="10" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(65, 110)">
      <circle cx="18" cy="18" r="14" fill="none" stroke="#db8129" stroke-width="4" />
      <path d="M 28 28 L 50 50 L 44 56 M 42 42 L 48 48" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <circle cx="465" cy="130" r="22" fill="#db8129" />
    <text x="465" y="138" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>

    
    <text x="65" y="196" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">Slurm daemons report</tspan>
      <tspan x="65" dy="38">Invalid credential or</tspan>
      <tspan x="65" dy="38">Credential expired</tspan>
    </text>

    
    <text x="65" y="320" font-family="sans-serif" font-size="24px" fill="#db8129" font-weight="bold">
      <tspan x="65" dy="0">looks like a network</tspan>
      <tspan x="65" dy="30">or key problem</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="40" y="385" width="460" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(65, 398)">
      <path d="M 28 6 L 48 14 C 48 34, 28 48, 28 48 C 28 48, 8 34, 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="18" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <circle cx="465" cy="418" r="22" fill="#207448" />
    <text x="465" y="426" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>

    
    <text x="65" y="482" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">Kerberos</tspan>
      <tspan x="65" dy="38">authentication fails</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="40" y="555" width="460" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(65, 570)">
      <rect x="10" y="6" width="36" height="44" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="16" x2="38" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="26" x2="32" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="36" cy="38" r="6" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    
    <circle cx="465" cy="588" r="22" fill="#207448" />
    <text x="465" y="596" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">3</text>

    
    <text x="65" y="650" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">TLS certificates</tspan>
      <tspan x="65" dy="38">show as not yet</tspan>
      <tspan x="65" dy="38">valid or expired</tspan>
    </text>
  </g>

  

  
  <g filter="url(#card-shadow)">
    <rect x="1100" y="95" width="460" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1125, 110)">
      <circle cx="16" cy="16" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="40" cy="16" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="40" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="22" y1="20" x2="34" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="19" y1="23" x2="25" y2="33" stroke="#207448" stroke-width="3" />
      <line x1="37" y1="23" x2="31" y2="33" stroke="#207448" stroke-width="3" />
    </g>

    
    <circle cx="1525" cy="130" r="22" fill="#207448" />
    <text x="1525" y="138" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">4</text>

    
    <text x="1125" y="190" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="1125" dy="0">kubeadm joins, etcd</tspan>
      <tspan x="1125" dy="38">and leases fail once</tspan>
      <tspan x="1125" dy="38">the skew grows large</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1100" y="310" width="460" height="230" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1125, 325)">
      <rect x="8" y="8" width="40" height="40" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="18" x2="34" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="22" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="16" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <circle cx="1525" cy="345" r="22" fill="#207448" />
    <text x="1525" y="353" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">5</text>

    
    <text x="1125" y="405" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="1125" dy="0">Logs from 64 nodes</tspan>
      <tspan x="1125" dy="38">cannot be lined up</tspan>
      <tspan x="1125" dy="38">when clocks differ</tspan>
      <tspan x="1125" dy="38">by seconds</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1100" y="560" width="460" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1125, 575)">
      <rect x="6" y="8" width="44" height="40" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="6" y1="22" x2="50" y2="22" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="8" x2="24" y2="22" stroke="#207448" stroke-width="3" />
      <line x1="36" y1="22" x2="36" y2="34" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="34" x2="18" y2="48" stroke="#207448" stroke-width="3" />
    </g>

    
    <circle cx="1525" cy="595" r="22" fill="#207448" />
    <text x="1525" y="603" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">6</text>

    
    <text x="1125" y="650" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="1125" dy="0"><tspan font-family="monospace">chronyc sources</tspan> shows</tspan>
      <tspan x="1125" dy="38">Reach 0: a firewall</tspan>
      <tspan x="1125" dy="38">blocks <tspan font-family="monospace">UDP 123</tspan></tspan>
    </text>
  </g>

  

  
  <g filter="url(#card-shadow)">
    <rect x="40" y="780" width="740" height="275" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(65, 802)">
      <rect x="6" y="8" width="44" height="26" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 34 L 10 46 L 46 46 L 40 34" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="24" y1="21" x2="32" y2="21" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="65" y="880" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">VM guest clock can jump after</tspan>
      <tspan x="65" dy="38">live migration, suspend and resume</tspan>
      <tspan x="65" dy="38">or a paused instance:</tspan>
    </text>
    <text x="65" y="1000" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="65" dy="0">chrony makestep plus kvm-clock or ptp_kvm;</tspan>
      <tspan x="65" dy="32">check /sys/devices/system/clocksource/</tspan>
      <tspan x="65" dy="30">clocksource0/current_clocksource</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="820" y="780" width="740" height="275" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(845, 802)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 4" />
      <polyline points="28,14 28,28 36,36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 40 10 L 48 10 L 48 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="845" y="880" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      <tspan x="845" dy="0">Running makestep during a job</tspan>
      <tspan x="845" dy="38">steps time under running software:</tspan>
    </text>
    <text x="845" y="980" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="845" dy="0">use <tspan font-family="monospace" font-weight="bold">makestep 1.0 3</tspan></tspan>
      <tspan x="845" dy="32">so only early updates step</tspan>
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="40" y="1080" width="1520" height="90" rx="10" fill="#207448" />
    <text x="800" y="1118" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">Before you debug a Slurm or authentication failure,</tspan>
      <tspan x="800" dy="34">check the clock on both ends: <tspan font-family="monospace">date</tspan> and <tspan font-family="monospace">chronyc tracking</tspan></tspan>
    </text>
  </g>
</svg>