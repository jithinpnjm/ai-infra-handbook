<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" width="1600" height="1450">
  <title>One wrong clock, many strange failures</title>
  <desc>Infographic illustrating how node clock skew exceeding tolerance creates cascading misleading failures across distributed services, HPC, and authentication systems.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1450" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">One wrong clock, many strange failures</text>

  
  <rect x="540" y="210" width="520" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

  
  <g transform="translate(768, 240)">
    <circle cx="32" cy="32" r="28" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="32,16 32,32 44,40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 6,32 A 26,26 0 0,1 58,32" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="4,4" />
  </g>

  
  <text x="800" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Node clock off by</text>
  <text x="800" y="385" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">more than the tolerance</text>

  <line x1="600" y1="425" x2="1000" y2="425" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  
  <text x="800" y="475" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Munge credential lifetime</text>
  <text x="800" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">defaults to 5 minutes;</text>
  <text x="800" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Kerberos tolerates</text>
  <text x="800" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">5 minutes of skew</text>


  
  <rect x="40" y="95" width="430" height="240" rx="14" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(65, 115)">
    <path d="M 22,4 L 40,12 L 40,26 C 40,38 22,46 22,46 C 22,46 4,38 4,26 L 4,12 Z" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="22" y1="16" x2="22" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="35" r="2" fill="#db8129" />
  </g>
  
  <circle cx="430" cy="135" r="20" fill="#db8129" />
  <text x="430" y="142" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <text x="65" y="185" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Slurm daemons report</text>
  <text x="65" y="215" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Invalid credential or</text>
  <text x="65" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Credential expired</text>
  <text x="65" y="285" font-family="sans-serif" font-size="24" fill="#303a36">looks like a network</text>
  <text x="65" y="315" font-family="sans-serif" font-size="24" fill="#303a36">or key problem</text>


  
  <rect x="40" y="360" width="430" height="210" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 380)">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 26,24 L 44,42 L 38,48 M 38,36 L 44,42" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <circle cx="430" cy="395" r="20" fill="#207448" />
  <text x="430" y="402" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="65" y="465" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Kerberos</text>
  <text x="65" y="505" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">authentication fails</text>


  
  <rect x="40" y="595" width="430" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 615)">
    <rect x="6" y="8" width="34" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="18" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="14" y1="26" x2="26" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="28" cy="36" r="5" fill="none" stroke="#207448" stroke-width="2" />
  </g>
  <circle cx="430" cy="630" r="20" fill="#207448" />
  <text x="430" y="637" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="65" y="695" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">TLS certificates show</text>
  <text x="65" y="735" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">as not yet valid</text>
  <text x="65" y="775" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">or expired</text>


  
  <rect x="1130" y="95" width="430" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1155, 115)">
    <rect x="4" y="6" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="28" y="6" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="16" y="30" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="20" x2="24" y2="30" stroke="#207448" stroke-width="2" />
    <line x1="36" y1="20" x2="24" y2="30" stroke="#207448" stroke-width="2" />
  </g>
  <circle cx="1520" cy="135" r="20" fill="#207448" />
  <text x="1520" y="142" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1155" y="195" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">kubeadm joins, etcd</text>
  <text x="1155" y="235" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">and leases fail once</text>
  <text x="1155" y="275" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">the skew grows large</text>


  
  <rect x="1130" y="360" width="430" height="210" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1155, 380)">
    <rect x="6" y="4" width="34" height="42" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="14" x2="28" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="24" x2="34" y2="24" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="34" x2="30" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <circle cx="1520" cy="395" r="20" fill="#207448" />
  <text x="1520" y="402" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="1155" y="450" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Logs from 64 nodes</text>
  <text x="1155" y="485" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">cannot be lined up when</text>
  <text x="1155" y="520" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">clocks differ by seconds</text>


  
  <rect x="1130" y="595" width="430" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1155, 615)">
    <rect x="4" y="6" width="38" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="4" y1="18" x2="42" y2="18" stroke="#207448" stroke-width="2" />
    <line x1="4" y1="32" x2="42" y2="32" stroke="#207448" stroke-width="2" />
    <line x1="16" y1="6" x2="16" y2="18" stroke="#207448" stroke-width="2" />
    <line x1="30" y1="6" x2="30" y2="18" stroke="#207448" stroke-width="2" />
    <line x1="22" y1="18" x2="22" y2="32" stroke="#207448" stroke-width="2" />
    <line x1="14" y1="32" x2="14" y2="44" stroke="#207448" stroke-width="2" />
    <line x1="32" y1="32" x2="32" y2="44" stroke="#207448" stroke-width="2" />
  </g>
  <circle cx="1520" cy="630" r="20" fill="#207448" />
  <text x="1520" y="637" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  
  <text x="1155" y="695" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">chronyc sources</text>
  <text x="1155" y="735" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">shows Reach 0:</text>
  <text x="1155" y="780" font-family="sans-serif" font-size="24" fill="#303a36">a firewall blocks UDP 123</text>


  
  
  <path d="M 540 290 H 505 V 215 H 474" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <path d="M 540 465 H 474" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 540 640 H 505 V 712 H 474" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 290 H 1095 V 215 H 1126" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 465 H 1126" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1060 640 H 1095 V 712 H 1126" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />


  
  
  <rect x="40" y="875" width="740" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 900)">
    <rect x="6" y="6" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="24" cy="24" r="11" fill="none" stroke="#207448" stroke-width="2" />
    <polyline points="24,18 24,24 28,26" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="2" x2="14" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="2" x2="24" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="2" x2="34" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="42" x2="14" y2="46" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="42" x2="24" y2="46" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="42" x2="34" y2="46" stroke="#207448" stroke-width="3" />
  </g>
  <text x="68" y="980" font-family="sans-serif" font-size="24" fill="#303a36">VM guest clock can jump after live migration,</text>
  <text x="68" y="1020" font-family="sans-serif" font-size="24" fill="#303a36">suspend and resume or a paused instance:</text>
  
  <text x="68" y="1070" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">chrony makestep plus kvm-clock or ptp_kvm;</text>
  <text x="68" y="1120" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">check /sys/devices/system/clocksource/</text>
  <text x="68" y="1160" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">clocksource0/current_clocksource</text>

  
  <rect x="820" y="875" width="740" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(850, 900)">
    <circle cx="24" cy="24" r="8" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 24,6 L 24,12 M 24,36 L 24,42 M 6,24 L 12,24 M 36,24 L 42,24 M 11,11 L 16,16 M 32,32 L 37,37 M 11,37 L 16,32 M 32,16 L 37,11" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="850" y="980" font-family="sans-serif" font-size="24" fill="#303a36">Running makestep during a job steps time</text>
  <text x="850" y="1020" font-family="sans-serif" font-size="24" fill="#303a36">under running software:</text>
  <text x="850" y="1070" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">use makestep 1.0 3 so only early updates step</text>


  
  <rect x="40" y="1285" width="1520" height="120" rx="16" fill="#207448" />
  
  <g transform="translate(70, 1320)">
    <rect x="4" y="6" width="40" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
    <polyline points="12,18 20,25 12,32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="24" y1="32" x2="36" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="140" y="1338" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Before you debug a Slurm or authentication failure,</text>
  <text x="140" y="1378" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">check the clock on both ends: date and chronyc tracking</text>

</svg>