<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>When averages look fine but users complain: trace individual events</title>
  <desc>Visual infographic explaining why averages hide latency outliers, head-of-line blocking, and tools to trace individual events.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">When averages look fine but users complain:</text>
  <text x="50" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">trace individual events</text>

  
  <rect x="50" y="195" width="670" height="315" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 218)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="14" y1="42" x2="14" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="42" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="42" x2="42" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="150" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">the average hides the outlier</text>

  
  <line x1="85" y1="450" x2="685" y2="450" stroke="#303a36" stroke-width="3" stroke-linecap="round" />

  
  <line x1="85" y1="412" x2="685" y2="412" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />

  
  <rect x="95" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="153" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="211" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="269" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="327" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="385" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="443" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="501" y="415" width="34" height="35" rx="4" fill="#207448" />
  <rect x="559" y="415" width="34" height="35" rx="4" fill="#207448" />

  
  <rect x="617" y="275" width="34" height="175" rx="4" fill="#207448" />

  
  <rect x="50" y="535" width="670" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 558)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <rect x="75" y="635" width="620" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="100" y="647" width="75" height="50" rx="6" fill="#a3c9b1" stroke="#207448" stroke-width="3" />
  <rect x="195" y="647" width="75" height="50" rx="6" fill="#a3c9b1" stroke="#207448" stroke-width="3" />
  <rect x="290" y="647" width="280" height="50" rx="6" fill="#207448" />

  
  <line x1="590" y1="672" x2="670" y2="672" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <text x="75" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">A latency outlier can be caused by previous</tspan>
    <tspan x="75" dy="38">events, through head-of-line blocking, rather</tspan>
    <tspan x="75" dy="38">than by its own properties: only the event</tspan>
    <tspan x="75" dy="38">sequence reveals that</tspan>
  </text>

  
  <rect x="750" y="195" width="800" height="485" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(775, 215)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 18 L 26 28 L 12 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="38" x2="44" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="780" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Packets</text>
  <line x1="1100" y1="310" x2="1160" y2="310" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1185" y="318" font-family="ui-monospace, monospace" font-size="24" fill="#207448">tcpdump -ttt</text>

  
  <text x="780" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Block I/O</text>
  <line x1="1100" y1="380" x2="1160" y2="380" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1185" y="388" font-family="ui-monospace, monospace" font-size="24" fill="#207448">biosnoop</text>

  
  <text x="780" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">System calls</text>
  <line x1="1100" y1="450" x2="1160" y2="450" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1185" y="458" font-family="ui-monospace, monospace" font-size="24" fill="#207448">strace -T or perf trace</text>

  
  <text x="780" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">GPU kernels and copies</text>
  <line x1="1100" y1="520" x2="1160" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1185" y="528" font-family="ui-monospace, monospace" font-size="24" fill="#207448">Nsight Systems timeline</text>

  
  <text x="780" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="780" dy="0">Scheduler wake-ups and</tspan>
    <tspan x="780" dy="32">NCCL operations</tspan>
  </text>
  <line x1="1100" y1="610" x2="1160" y2="610" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1185" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">also traceable</text>

  
  <rect x="750" y="705" width="800" height="270" rx="16" fill="#fdfbf7" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(1122, 728)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="28" y1="20" x2="28" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="28" x2="34" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="1150" y="835" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="1150" dy="0">input attributes, start and end times</tspan>
    <tspan x="1150" dy="42">so you get latency, and the result</tspan>
  </text>

  
  <rect x="50" y="1000" width="1500" height="65" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(75, 1005)">
    <circle cx="27" cy="27" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 17 33 A 14 14 0 0 1 37 33" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="27" y1="27" x2="33" y2="17" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="800" y="1042" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Tracing costs overhead: use short windows in production</text>

  
  <rect x="50" y="1085" width="1500" height="75" rx="12" fill="#207448" />
  <text x="800" y="1133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Summaries hide outliers, and outliers are what users feel</text>
</svg>