<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Cron day-of-month and day-of-week: when both are set, either one fires</title>
  <desc>Visual infographic explaining cron scheduling rules, the five time fields, syntax options, worked trap when day-of-month and day-of-week are both restricted, and key examples.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Cron day-of-month and day-of-week:</text>
  <text x="50" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">when both are set, either one fires</text>

  
  
  <rect x="50" y="165" width="220" height="185" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="160" cy="205" r="20" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="160,193 160,205 172,205" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="160" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">minute</text>
  <text x="160" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">0-59</text>

  
  <rect x="290" y="165" width="200" height="185" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="390" cy="205" r="20" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="390,195 390,205 380,205" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="390" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">hour</text>
  <text x="390" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">0-23</text>

  
  <rect x="510" y="165" width="280" height="185" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="630" y="187" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="638" y1="181" x2="638" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="662" y1="181" x2="662" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="630" y1="199" x2="670" y2="199" stroke="#207448" stroke-width="2" />
  <text x="650" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">day of month</text>
  <text x="650" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">1-31</text>

  
  <rect x="810" y="165" width="280" height="185" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="930" y="187" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="938" y1="181" x2="938" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="962" y1="181" x2="962" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="930" y1="199" x2="970" y2="199" stroke="#207448" stroke-width="2" />
  <text x="950" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">month</text>
  <text x="950" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">1-12 or jan..dec</text>

  
  <rect x="1110" y="165" width="440" height="185" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="1310" y="187" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1318" y1="181" x2="1318" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="1342" y1="181" x2="1342" y2="189" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="1310" y1="199" x2="1350" y2="199" stroke="#207448" stroke-width="2" />
  <text x="1330" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">day of week</text>
  <text x="1330" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1330" dy="0">0-7 (0 and 7 are Sunday,</tspan>
    <tspan x="1330" dy="32">or sun..sat)</tspan>
  </text>

  
  <rect x="50" y="375" width="200" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="150" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">* every value</text>

  <rect x="268" y="375" width="160" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="348" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">5,14 list</text>

  <rect x="446" y="375" width="160" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="526" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">1-5 range</text>

  <rect x="624" y="375" width="160" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="704" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">*/15 step</text>

  <rect x="802" y="375" width="748" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1176" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" text-anchor="middle">@reboot @hourly @daily @weekly @monthly @yearly</text>

  
  
  <rect x="50" y="460" width="730" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(80, 485)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="155" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Only one of the two restricted:</text>
  <text x="155" y="575" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">30 2 1 * *</text>
  <text x="155" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">runs at 02:30 on the first of each month</text>

  
  <rect x="820" y="460" width="730" height="230" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(848, 485)">
    <polygon points="28,4 54,50 2,50" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="2" fill="#db8129" stroke="#db8129" stroke-width="2" />
  </g>
  <text x="925" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Both restricted (neither is *):</text>
  <text x="850" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the job runs when EITHER field matches,</text>
  <text x="850" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a logical OR,</text>
  <text x="850" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">so it fires more often than people expect</text>

  
  <rect x="50" y="720" width="1500" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="52" y="722" width="1496" height="58" rx="10" fill="#f5f8f5" />
  <rect x="52" y="838" width="1496" height="58" fill="#f5f8f5" />

  
  <text x="85" y="760" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">*/10 * * * *  every ten minutes</text>

  
  <text x="85" y="818" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">0 3 * * 1-5  at 03:00 on weekdays</text>

  
  <text x="85" y="876" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">30 2 1 * *  at 02:30 on the first of each month</text>

  
  <text x="85" y="934" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">@reboot /usr/local/bin/start-agent  at boot</text>

  
  <text x="50" y="1005" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Daylight-saving changes can make cron jobs run twice or not at all in some regions: run servers in UTC</text>

  
  <rect x="50" y="1045" width="1500" height="65" rx="8" fill="#207448" />
  <text x="800" y="1088" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Restrict only one of day-of-month and day-of-week</text>
</svg>