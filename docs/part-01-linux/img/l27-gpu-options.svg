<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where to run a GPU workload</title>
  <desc></desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Where to run a GPU workload</text>

  
  <g id="table-header">
    <rect x="50" y="105" width="1500" height="55" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="80" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Option</text>
    <text x="510" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pro</text>
    <text x="1050" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Con</text>
  </g>

  
  <g id="row-1">
    <rect x="50" y="185" width="1500" height="145" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="52" y="187" width="428" height="141" rx="14" fill="#e8f1ea" />
    <line x1="480" y1="185" x2="480" y2="330" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="1020" y1="185" x2="1020" y2="330" stroke="#b8cec0" stroke-width="1.5" />

    
    <g transform="translate(75, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="38" rx="6" />
      <line x1="28" y1="40" x2="28" y2="52" />
      <line x1="16" y1="52" x2="40" y2="52" />
      <rect x="16" y="11" width="24" height="20" rx="3" stroke-width="3" />
      <line x1="28" y1="11" x2="28" y2="31" stroke-width="2" />
    </g>

    <text x="150" y="246" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">GPU VM with</tspan>
      <tspan x="150" dy="36">passthrough</tspan>
    </text>

    <text x="510" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="510" dy="0">provisioning API, snapshots,</tspan>
      <tspan x="510" dy="32">tenant isolation,</tspan>
      <tspan x="510" dy="32">near-native GPU</tspan>
    </text>

    <text x="1050" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1050" dy="0">hypervisor overhead on I/O</tspan>
      <tspan x="1050" dy="34">unless offloaded</tspan>
    </text>
  </g>

  
  <g id="row-2">
    <rect x="50" y="355" width="1500" height="145" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="52" y="357" width="428" height="141" rx="14" fill="#e8f1ea" />
    <line x1="480" y1="355" x2="480" y2="500" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="1020" y1="355" x2="1020" y2="500" stroke="#b8cec0" stroke-width="1.5" />

    
    <g transform="translate(75, 400)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="52" height="48" rx="5" />
      <line x1="2" y1="20" x2="54" y2="20" stroke-width="3" />
      <line x1="2" y1="36" x2="54" y2="36" stroke-width="3" />
      <circle cx="10" cy="12" r="2" fill="#207448" stroke="none" />
      <circle cx="17" cy="12" r="2" fill="#207448" stroke="none" />
      <line x1="26" y1="12" x2="44" y2="12" stroke-width="3" />
      <circle cx="10" cy="28" r="2" fill="#207448" stroke="none" />
      <circle cx="17" cy="28" r="2" fill="#207448" stroke="none" />
      <line x1="26" y1="28" x2="44" y2="28" stroke-width="3" />
      <circle cx="10" cy="44" r="2" fill="#207448" stroke="none" />
      <circle cx="17" cy="44" r="2" fill="#207448" stroke="none" />
      <line x1="26" y1="44" x2="44" y2="44" stroke-width="3" />
    </g>

    <text x="150" y="416" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">Bare-metal</tspan>
      <tspan x="150" dy="36">instances</tspan>
    </text>

    <text x="510" y="402" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="510" dy="0">full topology and</tspan>
      <tspan x="510" dy="32">NIC/GPU control, no hypervisor,</tspan>
      <tspan x="510" dy="32">InfiniBand</tspan>
    </text>

    <text x="1050" y="420" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1050" dy="0">longer provisioning, you own</tspan>
      <tspan x="1050" dy="34">more of the stack</tspan>
    </text>
  </g>

  
  <g id="row-3">
    <rect x="50" y="525" width="1500" height="220" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <rect x="52" y="527" width="428" height="141" rx="14" fill="#e8f1ea" />
    <line x1="480" y1="525" x2="480" y2="668" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="1020" y1="525" x2="1020" y2="668" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="50" y1="668" x2="1550" y2="668" stroke="#db8129" stroke-width="2" stroke-opacity="0.3" />

    
    <g transform="translate(75, 570)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 52 16 L 28 28 L 4 16 Z" />
      <path d="M 4 16 L 28 28 L 28 52 L 4 40 Z" />
      <path d="M 28 28 L 52 16 L 52 40 L 28 52 Z" />
      <line x1="12" y1="24" x2="12" y2="44" stroke-width="2.5" />
      <line x1="20" y1="28" x2="20" y2="48" stroke-width="2.5" />
      <line x1="36" y1="28" x2="36" y2="48" stroke-width="2.5" />
      <line x1="44" y1="24" x2="44" y2="44" stroke-width="2.5" />
    </g>

    <text x="150" y="586" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">Containers on VMs</tspan>
      <tspan x="150" dy="36">or bare metal</tspan>
    </text>

    <text x="510" y="604" font-family="sans-serif" font-size="24" fill="#303a36">fast start, reproducibility</text>

    <text x="1050" y="590" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1050" dy="0">shared kernel,</tspan>
      <tspan x="1050" dy="34">visibility limits</tspan>
    </text>

    
    <rect x="70" y="678" width="1460" height="52" rx="10" fill="#db8129" />
    <text x="800" y="712" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">almost all AI workloads run on top of one of the others</text>
  </g>

  
  <g id="row-4">
    <rect x="50" y="770" width="1500" height="145" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="52" y="772" width="428" height="141" rx="14" fill="#e8f1ea" />
    <line x1="480" y1="770" x2="480" y2="915" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="1020" y1="770" x2="1020" y2="915" stroke="#b8cec0" stroke-width="1.5" />

    
    <g transform="translate(75, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="4" />
      <line x1="16" y1="2" x2="16" y2="8" stroke-width="3" />
      <line x1="28" y1="2" x2="28" y2="8" stroke-width="3" />
      <line x1="40" y1="2" x2="40" y2="8" stroke-width="3" />
      <line x1="16" y1="48" x2="16" y2="54" stroke-width="3" />
      <line x1="28" y1="48" x2="28" y2="54" stroke-width="3" />
      <line x1="40" y1="48" x2="40" y2="54" stroke-width="3" />
      <line x1="8" y1="21" x2="48" y2="21" stroke-width="2.5" stroke-dasharray="3 3" />
      <line x1="8" y1="35" x2="48" y2="35" stroke-width="2.5" stroke-dasharray="3 3" />
      <line x1="28" y1="8" x2="28" y2="48" stroke-width="2.5" />
    </g>

    <text x="150" y="831" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">MIG / vGPU</tspan>
      <tspan x="150" dy="36">slices</tspan>
    </text>

    <text x="510" y="849" font-family="sans-serif" font-size="24" fill="#303a36">many small tenants on one GPU</text>

    <text x="1050" y="849" font-family="sans-serif" font-size="24" fill="#303a36">no NCCL across MIG instances</text>
  </g>

  
  <g id="row-5">
    <rect x="50" y="940" width="1500" height="145" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="52" y="942" width="428" height="141" rx="14" fill="#e8f1ea" />
    <line x1="480" y1="940" x2="480" y2="1085" stroke="#b8cec0" stroke-width="1.5" />
    <line x1="1020" y1="940" x2="1020" y2="1085" stroke="#b8cec0" stroke-width="1.5" />

    
    <g transform="translate(75, 985)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 48 12 V 28 C 48 42 28 52 28 52 C 28 52 8 42 8 28 V 12 Z" />
      <rect x="18" y="18" width="20" height="16" rx="3" stroke-width="2.5" />
      <polyline points="22,23 25,26 22,29" stroke-width="2" />
      <line x1="28" y1="29" x2="34" y2="29" stroke-width="2" />
    </g>

    <text x="150" y="1024" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">MicroVMs/Kata</text>

    <text x="510" y="1019" font-family="sans-serif" font-size="24" fill="#303a36">strong isolation</text>

    <text x="1050" y="1019" font-family="sans-serif" font-size="24" fill="#303a36">GPU support complexity</text>
  </g>
</svg>