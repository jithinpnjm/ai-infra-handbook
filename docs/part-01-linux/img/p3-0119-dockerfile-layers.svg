<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A three line Dockerfile and the layers it builds</title>
  <desc>Visual explanation of a three-line Dockerfile, the build context, generated image layers, runtime overlay mount, habits, and storage takeaway.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A three line Dockerfile and the layers it builds</text>

  
  <rect x="40" y="110" width="530" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(60, 125)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="42" rx="4" />
    <polyline points="10,14 20,21 10,28" />
    <line x1="26" y1="28" x2="42" y2="28" />
  </g>
  <text x="130" y="152" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">docker build -t hlw_test .</text>
  <text x="60" y="195" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">sends a 2.048kB build context</tspan>
    <tspan x="60" dy="28">to the Docker daemon</tspan>
  </text>

  
  
  <rect x="40" y="245" width="530" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="80" cy="305" r="24" fill="#207448" />
  <text x="80" y="313" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="125" y="313" font-family="monospace" font-size="24" fill="#303a36">CMD ["/bin/bash"]</text>

  
  <rect x="40" y="385" width="530" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="80" cy="445" r="24" fill="#207448" />
  <text x="80" y="453" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="125" y="453" font-family="monospace" font-size="24" fill="#303a36">RUN apk update &amp;&amp; apk add bash</text>

  
  <rect x="40" y="525" width="530" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="80" cy="585" r="24" fill="#207448" />
  <text x="80" y="593" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="125" y="593" font-family="monospace" font-size="24" fill="#303a36">FROM alpine:latest</text>

  
  <line x1="570" y1="305" x2="628" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="570" y1="445" x2="628" y2="445" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="570" y1="585" x2="628" y2="585" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="630" y="245" width="540" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(650, 277)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="24" ry="10" />
    <path d="M 4,14 v 24 c 0,5.5 10.7,10 24,10 c 13.3,0 24,-4.5 24,-10 v -24" />
  </g>
  <text x="720" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="720" dy="0">committed image hlw_test:latest,</tspan>
    <tspan x="720" dy="32">1b64f94e5a54, 9.19MB</tspan>
  </text>

  
  <rect x="630" y="385" width="540" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(650, 417)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="24" ry="10" />
    <path d="M 4,14 v 24 c 0,5.5 10.7,10 24,10 c 13.3,0 24,-4.5 24,-10 v -24" />
  </g>
  <text x="720" y="423" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="720" dy="0">RUN apk update &amp;&amp; apk add bash,</tspan>
    <tspan x="720" dy="30">run in an intermediate container</tspan>
    <tspan x="720" dy="30">fb082e6a0728</tspan>
  </text>

  
  <rect x="630" y="525" width="540" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(650, 557)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="24" ry="10" />
    <path d="M 4,14 v 24 c 0,5.5 10.7,10 24,10 c 13.3,0 24,-4.5 24,-10 v -24" />
  </g>
  <text x="720" y="575" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="720" dy="0">alpine:latest, image f70734b6a266,</tspan>
    <tspan x="720" dy="32">5.61MB (pulled)</tspan>
  </text>

  
  <rect x="1200" y="110" width="360" height="535" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1215" y="125" width="330" height="105" rx="6" fill="#e8f1ea" />
  <text x="1230" y="165" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1230" dy="0">Combine steps and</tspan>
    <tspan x="1230" dy="32">use multi-stage builds</tspan>
  </text>

  <rect x="1215" y="240" width="330" height="115" rx="6" fill="#e8f1ea" />
  <text x="1230" y="272" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1230" dy="0">Pin base image tags</tspan>
    <tspan x="1230" dy="30">or digests, latest is</tspan>
    <tspan x="1230" dy="30">not reproducible</tspan>
  </text>

  <rect x="1215" y="365" width="330" height="115" rx="6" fill="#e8f1ea" />
  <text x="1230" y="397" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1230" dy="0">ENTRYPOINT and CMD</tspan>
    <tspan x="1230" dy="30">define PID 1: use</tspan>
    <tspan x="1230" dy="30">the exec form</tspan>
  </text>

  <rect x="1215" y="490" width="330" height="145" rx="6" fill="#e8f1ea" />
  <text x="1230" y="516" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1230" dy="0">docker ps -a,</tspan>
    <tspan x="1230" dy="26">docker images,</tspan>
    <tspan x="1230" dy="26">docker system df,</tspan>
    <tspan x="1230" dy="26">docker system prune</tspan>
    <tspan x="1230" dy="26" font-family="sans-serif">with care</tspan>
  </text>

  
  
  <rect x="40" y="675" width="450" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="70" cy="710" r="18" fill="#207448" />
  <text x="70" y="717" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="100" y="718" font-family="monospace" font-size="24" fill="#303a36">docker run -it hlw_test</text>
  <circle cx="70" cy="755" r="18" fill="#207448" />
  <text x="70" y="762" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="100" y="763" font-family="monospace" font-size="24" fill="#303a36">mount</text>

  
  <rect x="510" y="675" width="1050" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="535" y="720" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="535" dy="0">overlay on / type overlay (rw,relatime,lowerdir=.../overlay2/l/...,</tspan>
    <tspan x="535" dy="38">upperdir=.../overlay2/.../diff, workdir=.../overlay2/.../work)</tspan>
  </text>

  
  
  <rect x="40" y="810" width="480" height="255" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(65, 835)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="24" width="36" height="28" rx="4" />
    <path d="M 18,24 v -10 c 0,-5.5 4.5,-10 10,-10 c 5.5,0 10,4.5 10,10 v 10" />
    <circle cx="28" cy="38" r="3" fill="#207448" />
  </g>
  <text x="65" y="940" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">lowerdir:</tspan>
    <tspan x="65" dy="40">colon-separated</tspan>
    <tspan x="65" dy="34">read-only layers</tspan>
  </text>

  
  <rect x="560" y="810" width="480" height="255" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
  <g transform="translate(585, 835)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10,46 l 8,-28 l 24,-14 l 6,6 l -14,24 z" />
    <line x1="36" y1="10" x2="42" y2="16" />
    <line x1="8" y1="52" x2="48" y2="52" />
  </g>
  <text x="585" y="940" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="585" dy="0" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">upperdir:</tspan>
    <tspan x="585" dy="40">every change the container</tspan>
    <tspan x="585" dy="34">makes lands here</tspan>
  </text>

  
  <rect x="1080" y="810" width="480" height="255" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1105, 835)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6,10 L 22,10 L 28,18 L 50,18 A 4,4 0 0 1 54,22 L 54,46 A 4,4 0 0 1 50,50 L 6,50 A 4,4 0 0 1 2,46 L 2,14 A 4,4 0 0 1 6,10 Z" />
    <line x1="16" y1="34" x2="40" y2="34" />
  </g>
  <text x="1105" y="940" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1105" dy="0" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">workdir:</tspan>
    <tspan x="1105" dy="40">scratch space, must be</tspan>
    <tspan x="1105" dy="34">empty when mounted</tspan>
  </text>

  
  <rect x="40" y="1095" width="1520" height="65" rx="6" fill="#207448" />
  <text x="800" y="1136" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Each RUN or COPY step adds a layer, and the container writes only to the upper one</text>
</svg>