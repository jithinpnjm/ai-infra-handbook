<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Huge pages: explicit versus transparent</title>
  <desc>Visual comparison between Explicit hugetlb and Transparent THP, illustrating pool reservation, configuration paths, swap behavior, and workload recommendations.</desc>

  <defs>
    <style>
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 42px; font-weight: 800; fill: #303a36; }
      .header-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 30px; font-weight: 700; fill: #207448; }
      .body-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 500; fill: #303a36; }
      .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; font-weight: 600; fill: #207448; }
      .banner-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 25px; font-weight: 600; fill: #207448; }
      .orange-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; font-weight: 700; fill: #db8129; }
      .orange-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 600; fill: #303a36; }
    </style>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" class="title-text">Huge pages: explicit versus transparent</text>

  
  <g id="top-note">
    <rect x="60" y="95" width="1480" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 108)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="46" height="46" rx="6"/>
      <path d="M12 12h22M12 23h22M12 34h14"/>
      <circle cx="34" cy="34" r="3" fill="#207448"/>
    </g>
    <text x="160" y="141" class="banner-text">huge pages shrink the page table and raise TLB reach</text>
  </g>

  
  <g id="left-column">
    
    <rect x="60" y="195" width="710" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(85, 210)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="52" height="52" rx="8"/>
      <rect x="8" y="8" width="14" height="14" rx="2" fill="#207448" fill-opacity="0.3"/>
      <rect x="30" y="8" width="14" height="14" rx="2" fill="#207448" fill-opacity="0.3"/>
      <rect x="8" y="30" width="14" height="14" rx="2" fill="#207448" fill-opacity="0.3"/>
      <rect x="30" y="30" width="14" height="14" rx="2" fill="#207448" fill-opacity="0.3"/>
    </g>
    <text x="160" y="249" class="header-text">Explicit hugetlb</text>

    
    <rect x="60" y="305" width="710" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="347" class="body-text">reserved in a dedicated pool</text>
    <rect x="85" y="375" width="660" height="92" rx="8" fill="#e8f1ea"/>
    <text x="105" y="412" class="mono-text">(echo 1024 | sudo tee</text>
    <text x="105" y="448" class="mono-text">/proc/sys/vm/nr_hugepages is 2 GiB)</text>

    
    <rect x="60" y="515" width="710" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="562" class="body-text">not swappable</text>
    <text x="90" y="614" class="body-text">only apps that ask use it</text>

    
    <rect x="60" y="675" width="710" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="739" class="body-text">1 GiB pages need boot parameters</text>

    
    <rect x="60" y="810" width="710" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(90, 835)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="48" height="38" rx="6"/>
      <path d="M0 12h48M10 6h.01M18 6h.01"/>
    </g>
    <text x="90" y="915" class="body-text">for VM guests, DPDK, RDMA,</text>
    <text x="90" y="955" class="body-text">large in-memory databases</text>
  </g>

  
  <g id="right-column">
    
    <rect x="830" y="195" width="710" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(855, 210)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="26" cy="26" r="14"/>
      <path d="M26 4v6M26 42v6M4 26h6M42 26h6M10 10l5 5M37 37l5 5M10 42l5-5M37 11l5-5"/>
    </g>
    <text x="930" y="249" class="header-text">Transparent THP</text>

    
    <rect x="830" y="305" width="710" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="860" y="357" class="body-text">kernel backs large aligned anonymous</text>
    <text x="860" y="402" class="body-text">regions with 2 MiB pages by itself</text>

    
    <rect x="830" y="480" width="710" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="855" y="505" width="660" height="120" rx="8" fill="#e8f1ea"/>
    <text x="875" y="546" class="mono-text">/sys/kernel/mm/transparent_hugepage/enabled</text>
    <text x="875" y="594" class="mono-text">has values always, madvise, never</text>

    
    <rect x="830" y="675" width="710" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="860" y="739" class="body-text">training nodes always or madvise</text>

    
    <rect x="830" y="810" width="710" height="175" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(860, 835)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="18"/>
      <path d="M20 10v10l7 4"/>
    </g>
    <text x="860" y="915" class="orange-text">latency-critical inference, databases, Redis</text>
    <text x="860" y="955" class="orange-mono">madvise or never with defrag=defer</text>
  </g>
</svg>