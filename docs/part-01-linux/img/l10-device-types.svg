<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Reading a device listing</title>
  <desc>Visual breakdown of a Linux device listing showing file type characters, major and minor numbers, and device driver mappings.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <g transform="translate(40, 42)">
    
    <rect x="0" y="2" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 20 L 26 28 L 14 36 M 30 36 L 42 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="76" y="44" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading a device listing</text>
  </g>

  
  <rect x="40" y="120" width="1520" height="310" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  
  <text x="85" y="178" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">brw-rw---- 1 root disk 8, 1 ... /dev/sda1</text>
  
  <text x="85" y="228" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">crw-rw-rw- 1 root root 1, 3 ... /dev/null</text>
  
  <text x="85" y="278" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">crw-rw-rw- 1 root root 195, 0 ... /dev/nvidia0</text>
  
  <text x="85" y="328" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">prw-r--r-- ... /run/fifo</text>
  
  <text x="85" y="378" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">srw-rw-rw- ... /dev/log</text>

  
  
  <rect x="76" y="150" width="34" height="240" rx="6" fill="#207448" fill-opacity="0.08" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

  
  <rect x="424" y="152" width="76" height="34" rx="6" fill="#db8129" fill-opacity="0.15" stroke="#db8129" stroke-width="3" />

  
  
  <path d="M 93 390 L 93 470" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 462 152 L 462 138 L 1190 138 L 1190 470" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="740" height="440" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="20" y="20" width="700" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(40, 38)">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 8 14 L 8 42 A 20 8 0 0 0 48 42 L 48 14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 8 28 A 20 8 0 0 0 48 28" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    
    <rect x="115" y="44" width="44" height="44" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="137" y="76" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">b</text>
    
    <text x="180" y="75" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">block device (disks, partitions)</text>

    
    <rect x="20" y="122" width="700" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(40, 140)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <rect x="115" y="146" width="44" height="44" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="137" y="178" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">c</text>
    
    <text x="180" y="178" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">character device (stream of bytes: /dev/null, GPUs)</text>

    
    <rect x="20" y="224" width="700" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(40, 242)">
      <path d="M 6 18 L 24 18 C 34 18 42 26 42 36 L 42 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 6 30 L 18 30 C 24 30 30 36 30 42 L 30 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="14" x2="4" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="26" y1="52" x2="46" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <rect x="115" y="248" width="44" height="44" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="137" y="280" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">p</text>
    
    <text x="180" y="280" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">named pipe</text>

    
    <rect x="20" y="326" width="700" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(40, 344)">
      <rect x="8" y="14" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="36" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="36" y1="34" x2="48" y2="34" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 8 28 L 2 28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    
    <rect x="115" y="350" width="44" height="44" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="137" y="382" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">s</text>
    
    <text x="180" y="382" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Unix domain socket</text>
  </g>

  
  <g transform="translate(820, 470)">
    <rect x="0" y="0" width="740" height="440" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="20" y="30" width="700" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(45, 78)">
      <rect x="6" y="10" width="44" height="58" rx="2" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="24" x2="24" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="32" y1="24" x2="38" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="18" y1="38" x2="24" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="32" y1="38" x2="38" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <rect x="22" y="50" width="12" height="18" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    
    <text x="125" y="105" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">major number selects the driver</tspan>
      <tspan x="125" dy="42">(the building)</tspan>
    </text>

    
    <rect x="20" y="235" width="700" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(45, 283)">
      <rect x="6" y="8" width="44" height="60" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 68 L 16 22 L 38 14 L 38 68" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="33" cy="42" r="2.5" fill="#207448" />
    </g>
    
    <text x="125" y="310" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">minor number selects the instance</tspan>
      <tspan x="125" dy="42">(the room)</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 940)">
    <rect x="0" y="0" width="1520" height="70" rx="10" fill="#207448" />
    
    <g transform="translate(30, 15)">
      <path d="M 8 6 L 28 6 L 38 16 L 38 36 L 8 36 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      <path d="M 28 6 L 28 16 L 38 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      <line x1="16" y1="22" x2="26" y2="22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="28" x2="30" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="88" y="44" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff">/proc/devices lists drivers and major numbers.</text>
  </g>
</svg>