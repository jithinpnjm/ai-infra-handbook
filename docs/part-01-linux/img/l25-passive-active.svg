<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Passive versus active benchmarking</title>
  <desc>Comparison between passive benchmarking (anti-method) and active benchmarking (core method) with system observability.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#143020" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Passive versus active benchmarking</text>

  
  <g id="panel-passive">
    
    <rect x="40" y="110" width="740" height="920" rx="16" fill="#e8f1ea" stroke="#b8d1bf" stroke-width="2" />

    
    <g transform="translate(70, 140)">
      
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

      
      <text x="74" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#303a36">Passive</text>

      
      <rect x="220" y="8" width="180" height="42" rx="21" fill="#db8129" />
      <text x="310" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">anti-method</text>
    </g>

    
    <g id="passive-step-1">
      <rect x="70" y="215" width="680" height="110" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="115" cy="270" r="24" fill="#207448" />
      <text x="115" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      
      <g transform="translate(160, 242)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
        <polyline points="12,28 20,36 12,44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="26" y1="44" x2="42" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <text x="240" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="240" dy="0">run the tool with</tspan>
        <tspan x="240" dy="34">various options</tspan>
      </text>
    </g>

    
    <line x1="410" y1="325" x2="410" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="passive-step-2">
      <rect x="70" y="365" width="680" height="110" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="115" cy="420" r="24" fill="#207448" />
      <text x="115" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      
      <g transform="translate(160, 392)">
        <rect x="2" y="2" width="52" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="28" y1="42" x2="28" y2="54" stroke="#207448" stroke-width="4" />
        <line x1="16" y1="54" x2="40" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="12" y1="28" x2="22" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="22" y1="18" x2="32" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="32" y1="24" x2="44" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <text x="240" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">make slides</text>
    </g>

    
    <line x1="410" y1="475" x2="410" y2="515" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="passive-step-3">
      <rect x="70" y="515" width="680" height="110" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="115" cy="570" r="24" fill="#207448" />
      <text x="115" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      
      <g transform="translate(160, 542)">
        <path d="M 6,36 C 16,36 22,28 32,28 L 48,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <polyline points="40,20 48,28 40,36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <rect x="8" y="10" width="22" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3" />
      </g>
      
      <text x="240" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">hand over</text>
    </g>

    
    <line x1="410" y1="625" x2="410" y2="665" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="passive-result">
      <rect x="70" y="665" width="680" height="330" rx="12" fill="#ffffff" stroke="#b2ceb9" stroke-width="2" filter="url(#card-shadow)" />
      
      <g transform="translate(105, 785)">
        <polygon points="28,4 54,50 2,50" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
        <line x1="28" y1="20" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="42" r="2.5" fill="#207448" />
      </g>
      
      <text x="190" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="190" dy="0">results may be buggy or</tspan>
        <tspan x="190" dy="42">limited by the tool or an</tspan>
        <tspan x="190" dy="42">unrelated component such as</tspan>
        <tspan x="190" dy="42">a congested network</tspan>
        <tspan x="190" dy="42">or a single thread</tspan>
      </text>
    </g>
  </g>

  
  <g id="panel-active">
    
    <rect x="820" y="110" width="740" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(850, 140)">
      
      <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28,4 L 28,12 M 28,44 L 28,52 M 4,28 L 12,28 M 44,28 L 52,28 M 11,11 L 17,17 M 39,39 L 45,45 M 11,45 L 17,39 M 39,17 L 45,11" stroke="#207448" stroke-width="4" stroke-linecap="round" />

      
      <text x="74" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#303a36">Active</text>

      
      <rect x="200" y="8" width="190" height="42" rx="21" fill="#207448" />
      <text x="295" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">core method</text>
    </g>

    
    <g id="active-core-method">
      <rect x="850" y="215" width="680" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <g transform="translate(885, 315)">
        <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="37" y1="37" x2="52" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <polyline points="14,26 20,20 28,24 34,16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <text x="965" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="965" dy="0">analyse the system with</tspan>
        <tspan x="965" dy="42">observability tools while the</tspan>
        <tspan x="965" dy="42">benchmark runs, to confirm</tspan>
        <tspan x="965" dy="42">what is tested and what limits it</tspan>
      </text>
    </g>

    
    <line x1="1190" y1="485" x2="1190" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="active-example">
      <rect x="850" y="535" width="680" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />

      
      <g transform="translate(885, 565)">
        <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <rect x="18" y="18" width="20" height="20" rx="2" fill="#207448" opacity="0.15" />
        
        <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" />
        <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" />
        <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" />
        <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" />
        <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" />
        <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" />
        <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" />
        <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" />
        <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
        <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" />
      </g>

      
      <text x="960" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Example</text>

      
      <text x="885" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="885" dy="0">throughput plateaus at 700 samples/s</tspan>
        <tspan x="885" dy="42">while server resources are idle,</tspan>
        <tspan x="885" dy="42">so check the load generator,</tspan>
        <tspan x="885" dy="42">which was single-threaded</tspan>
      </text>

      
      <g transform="translate(885, 840)">
        
        <rect x="0" y="0" width="290" height="125" rx="8" fill="#f5f8f5" stroke="#c0d4c5" stroke-width="1.5" />
        
        <line x1="25" y1="100" x2="270" y2="100" stroke="#607268" stroke-width="2" />
        <line x1="25" y1="100" x2="25" y2="20" stroke="#607268" stroke-width="2" />
        
        <path d="M 25,95 Q 85,75 130,42 L 265,42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="25" y1="42" x2="265" y2="42" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

        
        <rect x="320" y="0" width="290" height="125" rx="8" fill="#f5f8f5" stroke="#c0d4c5" stroke-width="1.5" />
        
        <rect x="340" y="24" width="250" height="26" rx="4" fill="#e8f1ea" stroke="#b2ceb9" stroke-width="1.5" />
        <rect x="340" y="24" width="35" height="26" rx="4" fill="#207448" />
        
        <rect x="340" y="70" width="250" height="26" rx="4" fill="#e8f1ea" stroke="#b2ceb9" stroke-width="1.5" />
        <rect x="340" y="70" width="250" height="26" rx="4" fill="#207448" />
      </g>
    </g>
  </g>
</svg>