  <text x="980" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="980" dy="0">single-threaded app</tspan>
    <tspan x="980" dy="32">saturating one core</tspan>
    <tspan x="980" dy="32">while 63 cores sit idle</tspan>
  </text>

  
  <g transform="translate(840, 455)">
    
    <g transform="translate(45, 10)">
      <path d="M 10 20 L 10 10 A 10 10 0 0 1 30 10 L 30 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <rect x="0" y="18" width="40" height="32" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="20" cy="30" r="3" fill="#207448" />
      <line x1="20" y1="33" x2="20" y2="40" stroke="#207448" stroke-width="3" />
    </g>

    
    <line x1="5" y1="35" x2="40" y2="35" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="15" y1="5" x2="45" y2="22" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="15" y1="65" x2="45" y2="48" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
