    <text x="140" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">threads contending for one lock</text>
  </g>

  
  <rect x="840" y="595" width="700" height="65" rx="6" fill="#db8129" />
  <text x="1190" y="623" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="1190" dy="0">steady request rate with rising duration</tspan>
    <tspan x="1190" dy="28">points at architecture or resources</tspan>
  </text>

  
  <rect x="40" y="700" width="740" height="260" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(60, 715)">
    <line x1="5" y1="5" x2="5" y2="45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="5" y1="45" x2="45" y2="45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 5 45 Q 25 15 45 25" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="120" y="749" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scalability shape</text>

  
  <g transform="translate(80, 770)">
    
    <line x1="20" y1="10" x2="20" y2="70" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="70" x2="600" y2="70" stroke="#207448" stroke-width="3" />

    
    <path d="M 25 65 L 180 25 Q 250 15 320 22 Q 420 30 520 60" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" />
    
    <circle cx="250" cy="17" r="5" fill="#207448" />
  </g>

  
  <text x="70" y="875" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">linear at first, then a knee</tspan>
    <tspan x="70" dy="30">where contention begins, then possibly</tspan>
    <tspan x="70" dy="30">a decline from coherence overheads</tspan>
  </text>

  
  <rect x="820" y="700" width="740" height="260" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="840" y="715" width="700" height="110" rx="6" fill="#ffffff" stroke="#b2cdb8" stroke-width="1.5" />
  
  <g transform="translate(855, 730)">
    <ellipse cx="20" cy="12" rx="16" ry="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 12 L 4 38 A 16 7 0 0 0 36 38 L 36 12" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 25 A 16 7 0 0 0 36 25" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="905" y="748" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="905" dy="0">Some resources degrade fast, such as</tspan>
    <tspan x="905" dy="28">memory when paging starts, and disks;</tspan>
    <tspan x="905" dy="28">others slowly, such as CPU</tspan>
  </text>

  
  <rect x="840" y="835" width="700" height="110" rx="6" fill="#ffffff" stroke="#b2cdb8" stroke-width="1.5" />
  
  <g transform="translate(855, 850)">
    <circle cx="20" cy="20" r="10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 20 4 L 20 8 M 20 32 L 20 36 M 4 20 L 8 20 M 32 20 L 36 20 M 9 9 L 12 12 M 28 28 L 31 31 M 9 31 L 12 28 M 28 12 L 31 9" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="905" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="905" dy="0">Services that return errors instead of</tspan>
    <tspan x="905" dy="28">queueing, such as a 503, keep response</tspan>
    <tspan x="905" dy="28">times flat but fail requests</tspan>
  </text>

  
  <rect x="40" y="980" width="1520" height="95" rx="8" fill="#ffffff" stroke="#b2cdb8" stroke-width="1.5" />
  
  <g transform="translate(60, 1000)">
    <path d="M 6 36 A 18 18 0 1 1 36 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="21" y1="26" x2="30" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="21" cy="26" r="3" fill="#207448" />
  </g>
  <text x="115" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">Metrics are not free: collecting them costs CPU (the observer effect), and they can be stale</tspan>
    <tspan x="115" dy="32">or defined differently between versions; verify a surprising number with a second source</tspan>
  </text>

  
  <rect x="40" y="1095" width="1520" height="65" rx="8" fill="#207448" />
  <text x="800" y="1137" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Ask which one it is before you tune</text>
</svg>