<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Slow because of load, or slow because of architecture</title>
  <desc>Infographic distinguishing load-induced performance degradation from architectural bottlenecks</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Slow because of load,</tspan>
    <tspan x="800" dy="54">or slow because of architecture</tspan>
  </text>

  
  <rect x="40" y="150" width="1520" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Use the request-rate trend to tell them apart</text>

  
