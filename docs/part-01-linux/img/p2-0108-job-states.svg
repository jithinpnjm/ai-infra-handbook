<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Ctrl-Z stops a job, and bg and fg move it between the background and the foreground</title>
  <desc>Infographic showing job control states in Unix: Foreground, Stopped, and Background, along with Ctrl-Z, bg, and fg transitions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Ctrl-Z stops a job, and bg and fg move it</text>
  <text x="800" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">between the background and the foreground</text>

  
  <path d="M 260 260 V 205 Q 260 185 285 185 H 775 Q 800 185 800 205 V 252" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="375" y="152" width="310" height="38" rx="6" fill="#f5f8f5"/>
  <text x="530" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Ctrl-Z (sends SIGTSTP)</text>

  
  <path d="M 990 390 H 1140" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1025" y="342" width="90" height="36" rx="6" fill="#f5f8f5"/>
  <text x="1070" y="368" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">bg %1</text>

  
  <path d="M 1150 460 H 1085 Q 1065 460 1065 480 V 580 Q 1065 600 1045 600 H 280 Q 260 600 260 580 V 528" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="625" y="580" width="90" height="38" rx="6" fill="#f5f8f5"/>
  <text x="670" y="607" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">fg %1</text>

  
  <g>
    <rect x="70" y="260" width="380" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="100" y="290" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 112 305 L 122 311 L 112 317" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="128" y1="317" x2="142" y2="317" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="175" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Foreground</text>
    
    <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" dy="0">Holds the keyboard:</tspan>
      <tspan x="100" dy="36">Ctrl-C and Ctrl-Z reach it</tspan>
    </text>
  </g>

  
  <g>
    <rect x="610" y="260" width="380" height="260" rx="12" fill="#fffbf5" stroke="#db8129" stroke-width="4"/>
    
    <circle cx="638" cy="311" r="22" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="632" y1="301" x2="632" y2="321" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="644" y1="301" x2="644" y2="321" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    
    <text x="680" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Stopped</text>
    
    <text x="640" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="640" dy="0">Suspended, waiting for</tspan>
      <tspan x="640" dy="36">a signal to continue</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1150" y="260" width="380" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(1180, 283)">
      <circle cx="28" cy="28" r="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="1255" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Background</text>
    
    <text x="1180" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1180" dy="0">Runs while the prompt</tspan>
      <tspan x="1180" dy="36">returns</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1150" y="560" width="380" height="175" rx="8" fill="#eef2f0" stroke="#b0bcb5" stroke-width="2"/>
    <text x="1175" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4a5551">
      <tspan x="1175" dy="0">A background job that</tspan>
      <tspan x="1175" dy="32">reads the terminal gets</tspan>
      <tspan x="1175" dy="32">SIGTTIN and shows</tspan>
      <tspan x="1175" dy="32">Stopped (tty input).</tspan>
    </text>
  </g>

  
  <g>
    <rect x="470" y="795" width="660" height="66" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="2"/>
    <rect x="485" y="806" width="115" height="44" rx="6" fill="#e8f1ea"/>
    <text x="542" y="837" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">jobs -l</text>
    <text x="625" y="837" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">List suspended and background jobs</text>
  </g>
</svg>