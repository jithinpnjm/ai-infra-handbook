<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Minor and major page faults: map a page, or read it from disk</title>
  <desc>Minor and major page faults: map a page, or read it from disk</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f5f8f5" />

  <!-- Title -->
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Minor and major page faults: map a page, or read it from disk</text>

  <!-- Box 1: Program touches address -->
  <g id="box1">
    <rect x="40" y="305" width="210" height="440" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <!-- Chip Icon -->
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="122" y="357" width="46" height="46" rx="6" fill="#f5f8f5" />
      <rect x="132" y="367" width="26" height="26" rx="2" fill="#207448" fill-opacity="0.15" />
      <line x1="131" y1="357" x2="131" y2="349" />
      <line x1="145" y1="357" x2="145" y2="349" />
      <line x1="159" y1="357" x2="159" y2="349" />
      <line x1="131" y1="403" x2="131" y2="411" />
      <line x1="145" y1="403" x2="145" y2="411" />
      <line x1="159" y1="403" x2="159" y2="411" />
      <line x1="122" y1="366" x2="114" y2="366" />
      <line x1="122" y1="380" x2="114" y2="380" />
      <line x1="122" y1="394" x2="114" y2="394" />
      <line x1="168" y1="366" x2="176" y2="366" />
      <line x1="168" y1="380" x2="176" y2="380" />
      <line x1="168" y1="394" x2="176" y2="394" />
    </g>
    <text x="145" y="475" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="145" dy="0">Program</tspan>
      <tspan x="145" dy="36">touches an</tspan>
      <tspan x="145" dy="36">address that</tspan>
      <tspan x="145" dy="36">is not</tspan>
      <tspan x="145" dy="36">mapped yet</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2: Direct horizontal flow -->
  <line x1="250" y1="525" x2="290" y2="525" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Box 2: CPU raises page fault -->
  <g id="box2">
    <rect x="290" y="305" width="215" height="440" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <!-- CPU MMU Interrupt Icon -->
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="374" y="357" width="46" height="46" rx="6" fill="#f5f8f5" />
      <path d="M 386 380 L 397 368 L 408 380 L 397 392 Z" fill="#207448" fill-opacity="0.15" />
      <line x1="397" y1="375" x2="397" y2="381" />
      <circle cx="397" cy="386" r="1.5" fill="#207448" />
      <line x1="383" y1="357" x2="383" y2="349" />
      <line x1="397" y1="357" x2="397" y2="349" />
      <line x1="411" y1="357" x2="411" y2="349" />
      <line x1="383" y1="403" x2="383" y2="411" />
      <line x1="397" y1="403" x2="397" y2="411" />
      <line x1="411" y1="403" x2="411" y2="411" />
    </g>
    <text x="397" y="475" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="397" dy="0">CPU raises a</tspan>
      <tspan x="397" dy="36">page fault;</tspan>
      <tspan x="397" dy="36">MMU asked,</tspan>
      <tspan x="397" dy="36">kernel takes</tspan>
      <tspan x="397" dy="36">over</tspan>
    </text>
  </g>

  <!-- Split Branch Arrows from Box 2 to Lanes -->
  <!-- Upper Branch (Green) to Minor page fault -->
  <path d="M 505 525 C 545 525, 530 312, 570 312" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <!-- Lower Branch (Orange) to Major page fault -->
  <path d="M 505 525 C 545 525, 530 738, 570 738" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  <!-- Upper Lane: Minor page fault -->
  <g id="minor-lane">
    <rect x="570" y="115" width="370" height="395" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <!-- RAM module icon -->
    <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="590" y="137" width="54" height="28" rx="4" fill="#e8f1ea" />
      <rect x="597" y="143" width="9" height="11" rx="1" fill="#207448" />
      <rect x="612" y="143" width="9" height="11" rx="1" fill="#207448" />
      <rect x="627" y="143" width="9" height="11" rx="1" fill="#207448" />
      <line x1="595" y1="165" x2="595" y2="168" />
      <line x1="602" y1="165" x2="602" y2="168" />
      <line x1="609" y1="165" x2="609" y2="168" />
      <line x1="616" y1="165" x2="616" y2="168" />
      <line x1="623" y1="165" x2="623" y2="168" />
      <line x1="630" y1="165" x2="630" y2="168" />
      <line x1="637" y1="165" x2="637" y2="168" />
    </g>
    <text x="658" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Minor page fault</text>

    <!-- Detail 1: RAM resident -->
    <rect x="586" y="180" width="338" height="150" rx="10" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="1.5" />
    <text x="602" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="602" dy="0">the page is already</tspan>
      <tspan x="602" dy="28">in RAM (shared library</tspan>
      <tspan x="602" dy="28">code another process</tspan>
      <tspan x="602" dy="28">loaded, or a newly</tspan>
      <tspan x="602" dy="28">allocated page)</tspan>
    </text>

    <!-- Detail 2: Kernel updates -->
    <rect x="586" y="342" width="338" height="64" rx="8" fill="#e8f1ea" />
    <text x="602" y="370" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="602" dy="0">kernel only updates</tspan>
      <tspan x="602" dy="26">the mapping</tspan>
    </text>

    <!-- Badge: cheap -->
    <rect x="586" y="418" width="105" height="36" rx="8" fill="#207448" />
    <text x="638" y="444" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">cheap</text>

    <!-- Detail 3: Rate -->
    <text x="586" y="478" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="586" dy="0">thousands per second</tspan>
      <tspan x="586" dy="26">are normal</tspan>
    </text>
  </g>

  <!-- Lower Lane: Major page fault -->
  <g id="major-lane">
    <rect x="570" y="540" width="370" height="395" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <!-- Disk Cylinder Icon -->
    <g stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="616" cy="564" rx="20" ry="7" fill="#fdf6ee" />
      <path d="M 596 564 V 582 C 596 586, 636 586, 636 582 V 564" />
      <path d="M 596 582 V 600 C 596 604, 636 604, 636 600 V 582" />
    </g>
    <text x="654" y="587" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Major page fault</text>

    <!-- Detail 1: Disk read -->
    <rect x="586" y="612" width="338" height="150" rx="10" fill="#fdf6ee" stroke="#f5d5b5" stroke-width="1.5" />
    <text x="602" y="642" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="602" dy="0">page must be read</tspan>
      <tspan x="602" dy="28">from disk (program code</tspan>
      <tspan x="602" dy="28">on first execution, or</tspan>
      <tspan x="602" dy="28">memory that was</tspan>
      <tspan x="602" dy="28">swapped out)</tspan>
    </text>

    <!-- Badge: slow -->
    <rect x="586" y="774" width="95" height="36" rx="8" fill="#db8129" />
    <text x="633" y="800" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">slow</text>

    <!-- Detail 2: Pressure note -->
    <rect x="586" y="820" width="338" height="102" rx="8" fill="#fdf6ee" />
    <text x="602" y="844" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="602" dy="0">a burst at first run</tspan>
      <tspan x="602" dy="25">is normal; a continuous</tspan>
      <tspan x="602" dy="25">stream means memory</tspan>
      <tspan x="602" dy="25">pressure and thrashing</tspan>
    </text>
  </g>

  <!-- Merge Arrows from Lanes to Program Continues -->
  <path d="M 940 312 C 965 312, 960 485, 985 485" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 940 738 C 965 738, 960 565, 985 565" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- Merge Box: Program continues -->
  <g id="rejoin">
    <rect x="985" y="305" width="175" height="440" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <!-- Process Play / Continue Icon -->
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1050" y="357" width="46" height="46" rx="8" fill="#f5f8f5" />
      <polygon points="1066,370 1066,390 1083,380" fill="#207448" />
    </g>
    <text x="1072" y="515" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="1072" dy="0">Program</tspan>
      <tspan x="1072" dy="40">continues</tspan>
    </text>
  </g>

  <!-- Right Panel: How to see it -->
  <g id="right-panel">
    <rect x="1190" y="115" width="370" height="820" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <!-- Terminal Icon -->
    <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1212" y="138" width="50" height="34" rx="6" fill="#e8f1ea" />
      <path d="M 1222 150 L 1230 155 L 1222 160" />
      <line x1="1234" y1="160" x2="1248" y2="160" />
    </g>
    <text x="1276" y="163" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">How to see it</text>

    <!-- Command 1: ps -->
    <rect x="1206" y="195" width="338" height="180" rx="10" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2" />
    <text x="1222" y="250" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1222" dy="0">ps -o pid,min_flt,</tspan>
      <tspan x="1222" dy="34">maj_flt,rss,comm</tspan>
      <tspan x="1222" dy="34">-p 1234</tspan>
    </text>

    <!-- Command 2: /usr/bin/time -->
    <rect x="1206" y="395" width="338" height="230" rx="10" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2" />
    <text x="1222" y="445" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1222" dy="0">/usr/bin/time cal</tspan>
      <tspan x="1222" dy="34">&gt; /dev/null prints</tspan>
      <tspan x="1222" dy="34">(2major+254minor)</tspan>
      <tspan x="1222" dy="34">pagefaults 0swaps</tspan>
    </text>

    <!-- Command 3: free -h & vmstat -->
    <rect x="1206" y="645" width="338" height="270" rx="10" fill="#f5f8f5" stroke="#e8f1ea" stroke-width="2" />
    <text x="1222" y="715" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1222" dy="0">free -h: read</tspan>
      <tspan x="1222" dy="44">available, not free;</tspan>
      <tspan x="1222" dy="44">sustained vmstat so</tspan>
      <tspan x="1222" dy="44">means thrashing</tspan>
    </text>
  </g>
</svg>