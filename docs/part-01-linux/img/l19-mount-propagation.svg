<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Mount propagation</title>
  <desc>Visual infographic explaining Linux mount propagation types between host and namespace mounts.</desc>

  <defs>
    
    <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M 11 1 L 1 6 L 11 11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="80" y="90" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Mount propagation</text>

  
  <g id="host-mount-container">
    <rect x="80" y="150" width="240" height="585" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(172, 185)" stroke="#207448" stroke-width="4" fill="none">
      <ellipse cx="28" cy="14" rx="26" ry="12" />
      <path d="M 2 14 v 24 c 0 7 12 12 26 12 s 26 -5 26 -12 v -24" />
      <path d="M 2 26 c 0 7 12 12 26 12 s 26 -5 26 -12" />
    </g>
    <text x="200" y="280" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">host mount</text>
  </g>

  
  <g id="namespace-mount-container">
    <rect x="1280" y="150" width="240" height="585" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(172, 185)">
      <g transform="translate(1200, 0)" stroke="#207448" stroke-width="4" fill="none">
        <rect x="2" y="4" width="52" height="46" rx="6" />
        <line x1="2" y1="18" x2="54" y2="18" />
        <circle cx="12" cy="11" r="2" fill="#207448" />
        <circle cx="20" cy="11" r="2" fill="#207448" />
      </g>
    </g>
    <text x="1400" y="280" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">namespace mount</text>
  </g>

  

  
  <line x1="335" y1="210" x2="465" y2="210" stroke="#207448" stroke-width="5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <line x1="1135" y1="210" x2="1265" y2="210" stroke="#207448" stroke-width="5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <g id="card-shared">
    <rect x="480" y="150" width="640" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="800" y="200" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">shared</text>
    <text x="800" y="244" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">sends and receives events</text>
  </g>

  
  <line x1="330" y1="365" x2="465" y2="365" stroke="#207448" stroke-width="5" marker-end="url(#arrow-end)" />
  <line x1="1130" y1="365" x2="1265" y2="365" stroke="#207448" stroke-width="5" marker-end="url(#arrow-end)" />
  <g id="card-slave">
    <rect x="480" y="305" width="640" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="800" y="355" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">slave</text>
    <text x="800" y="399" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">only receives</text>
  </g>

  
  <line x1="330" y1="520" x2="470" y2="520" stroke="#7a8d84" stroke-width="4" stroke-dasharray="10 8" />
  <line x1="1130" y1="520" x2="1270" y2="520" stroke="#7a8d84" stroke-width="4" stroke-dasharray="10 8" />
  <g id="card-private">
    <rect x="480" y="460" width="640" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="800" y="510" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">private</text>
    <text x="800" y="554" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">neither</text>
  </g>

  
  <line x1="330" y1="675" x2="470" y2="675" stroke="#7a8d84" stroke-width="4" stroke-dasharray="10 8" />
  <line x1="1130" y1="675" x2="1270" y2="675" stroke="#7a8d84" stroke-width="4" stroke-dasharray="10 8" />
  <g id="card-unbindable">
    <rect x="480" y="615" width="640" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="800" y="665" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">unbindable</text>
    <text x="800" y="709" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">private and cannot be bind-mounted</text>
  </g>

  
  <g id="warning-panel">
    <rect x="80" y="785" width="1440" height="165" rx="16" fill="#fdf8f3" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(115, 835)" stroke="#db8129" stroke-width="4" fill="none">
      <path d="M 30 6 L 56 52 L 4 52 Z" stroke-linejoin="round" />
      <line x1="30" y1="22" x2="30" y2="36" stroke-linecap="round" />
      <circle cx="30" cy="44" r="2" fill="#db8129" stroke="none" />
    </g>
    <text x="195" y="852" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="195" dy="0">systemd makes / shared by default, so a naive new mount namespace can leak mounts</tspan>
      <tspan x="195" dy="38">back to the host; runtimes remount root as rslave or rprivate first.</tspan>
    </text>
  </g>

  
  <g id="command-chip">
    <rect x="460" y="990" width="680" height="80" rx="40" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="800" y="1041" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448" text-anchor="middle">findmnt -o TARGET,PROPAGATION</text>
  </g>
</svg>