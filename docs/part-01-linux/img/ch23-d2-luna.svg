  <g font-family="sans-serif" fill="#303a36">
    <text x="660" y="190" font-size="30" font-weight="700">Choose a resource</text>

    <text x="660" y="345" font-size="30" font-weight="700">Errors?</text>
    <text x="660" y="385" font-size="24">(objective, quick)</text>

    <text x="660" y="535" font-size="30" font-weight="700">Saturation?</text>
    <text x="660" y="575" font-size="24">(any queueing)</text>

    <text x="660" y="722" font-size="30" font-weight="700">Utilisation high?</text>
    <text x="660" y="762" font-size="24">(>~60-70% sustained,</text>
