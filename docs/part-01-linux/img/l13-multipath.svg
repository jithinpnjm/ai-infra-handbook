<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Multipath: one LUN, several paths</title>
  <desc>Infographic explaining multipath storage with one SAN LUN, four component paths sdb, sdc, sdd, sde, and one multipath device with LVM and filesystem on top.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="70" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Multipath: one LUN, several paths</text>

  
  
  <rect x="70" y="140" width="420" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(115, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="28" cy="14" rx="26" ry="10" />
    <path d="M 2 14 v 24 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10 v -24" />
    <path d="M 2 38 v 24 c 0 5.5 11.6 10 26 10 s 26 -4.5 26 -10 v -24" />
  </g>
  <text x="315" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">a SAN LUN</text>

  
  <path d="M 280 290 L 280 326" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="330" width="420" height="360" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(252, 360)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="8" width="56" height="40" rx="6" />
    <line x1="14" y1="28" x2="42" y2="28" />
    <line x1="28" y1="18" x2="28" y2="38" />
    <circle cx="14" cy="28" r="3" fill="#207448" />
    <circle cx="42" cy="28" r="3" fill="#207448" />
    <circle cx="28" cy="18" r="3" fill="#207448" />
    <circle cx="28" cy="38" r="3" fill="#207448" />
  </g>

  <text x="280" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="280" dy="0">Two HBAs and two switches</tspan>
    <tspan x="280" dy="36">giving four paths</tspan>
  </text>

  
  <circle cx="490" cy="345" r="5" fill="#207448" />
  <circle cx="490" cy="435" r="5" fill="#207448" />
  <circle cx="490" cy="525" r="5" fill="#207448" />
  <circle cx="490" cy="615" r="5" fill="#207448" />

  
  
  <rect x="550" y="140" width="460" height="550" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(585, 168)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="38" rx="6" />
    <line x1="10" y1="12" x2="20" y2="12" />
    <line x1="10" y1="22" x2="16" y2="22" />
    <circle cx="38" cy="12" r="2.5" fill="#207448" />
    <circle cx="38" cy="22" r="2.5" fill="#207448" />
  </g>

  <text x="790" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="790" dy="0">OS sees four</tspan>
    <tspan x="790" dy="36">block devices</tspan>
  </text>

  
  <text x="780" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#64748b">component paths</text>

  
  <rect x="590" y="315" width="380" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <g transform="translate(615, 328)" stroke="#94a3b8" stroke-width="3" fill="none">
    <ellipse cx="14" cy="9" rx="12" ry="5" />
    <path d="M 2 9 v 16 c 0 3 5.4 5 12 5 s 12 -2 12 -5 v -16" />
  </g>
  <text x="780" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">sdb</text>

  
  <rect x="590" y="405" width="380" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <g transform="translate(615, 418)" stroke="#94a3b8" stroke-width="3" fill="none">
    <ellipse cx="14" cy="9" rx="12" ry="5" />
    <path d="M 2 9 v 16 c 0 3 5.4 5 12 5 s 12 -2 12 -5 v -16" />
  </g>
  <text x="780" y="446" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">sdc</text>

  
  <rect x="590" y="495" width="380" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <g transform="translate(615, 508)" stroke="#94a3b8" stroke-width="3" fill="none">
    <ellipse cx="14" cy="9" rx="12" ry="5" />
    <path d="M 2 9 v 16 c 0 3 5.4 5 12 5 s 12 -2 12 -5 v -16" />
  </g>
  <text x="780" y="536" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">sdd</text>

  
  <rect x="590" y="585" width="380" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <g transform="translate(615, 598)" stroke="#94a3b8" stroke-width="3" fill="none">
    <ellipse cx="14" cy="9" rx="12" ry="5" />
    <path d="M 2 9 v 16 c 0 3 5.4 5 12 5 s 12 -2 12 -5 v -16" />
  </g>
  <text x="780" y="626" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">sde</text>

  
  <path d="M 490 345 L 586 345" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 490 435 L 586 435" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 490 525 L 586 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 490 615 L 586 615" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="1070" y="140" width="460" height="105" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1115, 168)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 8 L 20 8 L 26 16 L 48 16 A 4 4 0 0 1 52 20 L 52 42 A 4 4 0 0 1 48 46 L 4 46 A 4 4 0 0 1 0 42 L 0 12 A 4 4 0 0 1 4 8 Z" />
  </g>
  <text x="1330" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">filesystem</text>

  
  <rect x="1070" y="285" width="460" height="105" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1115, 312)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="48" height="12" rx="3" />
    <rect x="2" y="22" width="48" height="12" rx="3" />
    <rect x="2" y="38" width="48" height="12" rx="3" />
  </g>
  <text x="1330" y="347" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">LVM</text>

  
  <rect x="1070" y="430" width="460" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  
  
  <g transform="translate(1272, 455)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 50 14 L 50 32 C 50 44 28 54 28 54 C 28 54 6 44 6 32 L 6 14 Z" />
    <line x1="28" y1="18" x2="28" y2="40" />
    <line x1="17" y1="29" x2="39" y2="29" />
  </g>

  <text x="1300" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="1300" dy="0">one device</tspan>
    <tspan x="1300" dy="38">built by multipathd</tspan>
  </text>

  
  <path d="M 1300 430 L 1300 395" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 1300 285 L 1300 250" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <path d="M 970 345 L 1025 345" fill="none" stroke="#94a3b8" stroke-width="3" />
  <path d="M 970 435 L 1025 435" fill="none" stroke="#94a3b8" stroke-width="3" />
  <path d="M 970 525 L 1025 525" fill="none" stroke="#94a3b8" stroke-width="3" />
  <path d="M 970 615 L 1025 615" fill="none" stroke="#94a3b8" stroke-width="3" />

  
  <path d="M 1025 345 L 1025 615" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

  
  <path d="M 1025 560 L 1064 560" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  
  <rect x="70" y="730" width="420" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(254, 765)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="52" height="40" rx="6" />
    <path d="M 12 14 L 22 20 L 12 26" />
    <line x1="26" y1="26" x2="38" y2="26" />
  </g>

  
  <rect x="105" y="855" width="350" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="280" y="899" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">multipath -ll</text>

  
  <rect x="520" y="730" width="1010" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <circle cx="560" cy="778" r="7" fill="#207448" />
  <text x="585" y="785" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="585" dy="0">build filesystems and LVM on the multipath device,</tspan>
    <tspan x="585" dy="32">never on a component path</tspan>
  </text>

  
  <circle cx="560" cy="876" r="7" fill="#207448" />
  <text x="585" y="883" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">exclude paths in the LVM filter</text>

  
  <circle cx="560" cy="948" r="7" fill="#207448" />
  <text x="585" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">blacklist local disks and virtio disks</text>
</svg>