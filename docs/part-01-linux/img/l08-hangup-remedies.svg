<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Keeping a job alive after disconnect</title>
  <desc>Visual guide explaining process termination on SSH disconnect and five remedies to keep jobs alive.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Keeping a job alive after disconnect</text>

  
  <rect x="50" y="110" width="1500" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="80" y="135" width="400" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="125" cy="175" r="22" fill="#207448"/>
  <text x="125" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(170, 150)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="6" width="44" height="34" rx="4"/>
    <line x1="14" y1="40" x2="38" y2="40"/>
    <line x1="26" y1="40" x2="26" y2="48"/>
    <line x1="14" y1="18" x2="38" y2="28"/>
    <line x1="38" y1="18" x2="14" y2="28"/>
  </g>
  <text x="280" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">SSH session drops</text>

  
  <line x1="480" y1="205" x2="538" y2="205" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="540" y="135" width="520" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="585" cy="175" r="22" fill="#207448"/>
  <text x="585" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(630, 150)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 8 12 L 20 24 L 8 36"/>
    <line x1="24" y1="36" x2="40" y2="36"/>
    <path d="M 38 12 A 12 12 0 0 1 38 28"/>
    <path d="M 44 6 A 20 20 0 0 1 44 34"/>
  </g>
  <text x="800" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">shell gets SIGHUP</tspan>
    <tspan x="800" dy="28">and forwards it to its jobs</tspan>
  </text>

  
  <line x1="1060" y1="205" x2="1118" y2="205" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="1120" y="135" width="400" height="140" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <circle cx="1165" cy="175" r="22" fill="#db8129"/>
  <text x="1165" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(1210, 150)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="17,6 35,6 46,17 46,35 35,46 17,46 6,35 6,17"/>
    <line x1="18" y1="18" x2="34" y2="34"/>
    <line x1="34" y1="18" x2="18" y2="34"/>
  </g>
  <text x="1320" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">job terminates</text>

  
  <g transform="translate(50, 335)">
    <rect width="730" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(36, 62)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <line x1="4" y1="26" x2="52" y2="26"/>
      <line x1="28" y1="26" x2="28" y2="52"/>
    </g>
    <text x="116" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">tmux or screen</text>
    <rect x="116" y="98" width="280" height="48" rx="8" fill="#207448"/>
    <text x="256" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">best for interactive</text>
  </g>

  
  <g transform="translate(820, 335)">
    <rect width="730" height="240" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(36, 45)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="18" height="18" rx="3"/>
      <rect x="32" y="6" width="18" height="18" rx="3"/>
      <rect x="19" y="32" width="18" height="18" rx="3"/>
      <path d="M 15 24 L 24 32"/>
      <path d="M 41 24 L 32 32"/>
    </g>
    <text x="116" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">submit to the scheduler</text>
    <text x="116" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">(sbatch, a Kubernetes Job)</text>
    <rect x="116" y="145" width="550" height="52" rx="8" fill="#207448"/>
    <text x="391" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">right answer for anything that matters</text>
  </g>

  
  <g transform="translate(50, 545)">
    <rect width="730" height="145" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(36, 45)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 6 L 34 6 L 46 18 L 46 48 L 8 48 Z"/>
      <polyline points="34,6 34,18 46,18"/>
      <path d="M 18 32 L 32 32 M 26 26 L 32 32 L 26 38"/>
    </g>
    <text x="116" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">nohup ./run.sh &gt; run.log 2&gt;&amp;1 &amp;</text>
  </g>

  
  <g transform="translate(50, 720)">
    <rect width="730" height="145" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(36, 45)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 28 A 12 12 0 0 1 28 12 L 36 12"/>
      <path d="M 44 28 A 12 12 0 0 1 28 44 L 20 44"/>
      <line x1="8" y1="8" x2="48" y2="48"/>
    </g>
    <text x="116" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">disown -h after Ctrl-Z and bg</text>
  </g>

  
  <g transform="translate(820, 605)">
    <rect width="730" height="260" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(42, 102)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      
      <circle cx="20" cy="20" r="10"/>
      <path d="M 20 4 L 20 8 M 20 32 L 20 36 M 4 20 L 8 20 M 32 20 L 36 20 M 9 9 L 12 12 M 28 28 L 31 31 M 9 31 L 12 28 M 28 12 L 31 9"/>
      
      <circle cx="40" cy="38" r="14"/>
      <polyline points="40,28 40,38 46,38"/>
    </g>
    <text x="126" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">a systemd service or timer</text>
  </g>

  
  <rect x="50" y="905" width="1500" height="90" rx="14" fill="#207448"/>
  <text x="800" y="960" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">pick the remedy before you start the job, not after the connection drops.</text>
</svg>