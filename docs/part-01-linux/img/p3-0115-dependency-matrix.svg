<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Requirement directives compared: what happens when B fails or stops</title>
  <desc>Comparison of systemd requirement directives Wants, Requires, Requisite, BindsTo, PartOf, Conflicts, and ordering directives After and Before.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Requirement directives compared: what happens when B fails or stops</text>

  
  <g>
    <rect x="50" y="95" width="1500" height="65" rx="8" fill="#207448"/>
    <text x="180" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Directive in A</text>
    <text x="515" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Does it start B?</text>
    <text x="1050" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">If B fails to start or is stopped later</text>
    <text x="1470" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="1470" y="122">Orders</tspan>
      <tspan x="1470" y="148">A and B?</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="168" width="1500" height="116" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <line x1="315" y1="172" x2="315" y2="280" stroke="#f0cfb3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="172" x2="715" y2="280" stroke="#f0cfb3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="172" x2="1385" y2="280" stroke="#f0cfb3" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <text x="180" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Wants=B</text>
    <text x="515" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">starts B</text>
    <text x="1050" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1050" y="210">A ignores the failure</tspan>
      <tspan x="1050" y="238">(soft, the recommended default,</tspan>
      <tspan x="1050" y="266">failures do not cascade)</tspan>
    </text>
    <rect x="1425" y="205" width="90" height="42" rx="6" fill="#e8f1ea" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="292" width="1500" height="72" rx="8" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="296" x2="315" y2="360" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="296" x2="715" y2="360" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="296" x2="1385" y2="360" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Requires=B</text>
    <text x="515" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">starts B</text>
    <text x="1050" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">A is stopped too (hard)</text>
    <rect x="1425" y="307" width="90" height="42" rx="6" fill="#ffffff" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="372" width="1500" height="88" rx="8" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="376" x2="315" y2="456" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="376" x2="715" y2="456" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="376" x2="1385" y2="456" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Requisite=B</text>
    <text x="515" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="515" y="410">does not start B,</tspan>
      <tspan x="515" y="438">B must already be active</tspan>
    </text>
    <text x="1050" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">A fails immediately</text>
    <rect x="1425" y="395" width="90" height="42" rx="6" fill="#e8f1ea" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="468" width="1500" height="116" rx="8" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="472" x2="315" y2="580" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="472" x2="715" y2="580" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="472" x2="1385" y2="580" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="532" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">BindsTo=B</text>
    <text x="515" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">like Requires</text>
    <text x="1050" y="510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1050" y="510">A also stops when B goes inactive</tspan>
      <tspan x="1050" y="538">for any reason, even a clean exit</tspan>
      <tspan x="1050" y="566">(used for devices and mounts)</tspan>
    </text>
    <rect x="1425" y="505" width="90" height="42" rx="6" fill="#ffffff" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="534" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="592" width="1500" height="88" rx="8" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="596" x2="315" y2="676" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="596" x2="715" y2="676" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="596" x2="1385" y2="676" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">PartOf=B</text>
    <text x="515" y="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="515" y="630">B start does not</tspan>
      <tspan x="515" y="658">start A</tspan>
    </text>
    <text x="1050" y="644" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">stop or restart of B propagates to A</text>
    <rect x="1425" y="615" width="90" height="42" rx="6" fill="#e8f1ea" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="644" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="688" width="1500" height="72" rx="8" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="692" x2="315" y2="756" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="692" x2="715" y2="756" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="692" x2="1385" y2="756" stroke="#c0d2c6" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="732" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Conflicts=B</text>
    <text x="515" y="732" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">starting A stops B</text>
    <text x="1050" y="732" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">both cannot be active together</text>
    <rect x="1425" y="703" width="90" height="42" rx="6" fill="#ffffff" stroke="#c4d8c9" stroke-width="1.5"/>
    <text x="1470" y="732" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#52635b" text-anchor="middle">No</text>
  </g>

  
  <g>
    <rect x="50" y="768" width="1500" height="92" rx="8" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5"/>
    <line x1="315" y1="772" x2="315" y2="856" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="715" y1="772" x2="715" y2="856" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1385" y1="772" x2="1385" y2="856" stroke="#d0ded3" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="180" y="806" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="180" y="806">After=B</tspan>
      <tspan x="180" y="834">or Before=B</tspan>
    </text>
    <text x="515" y="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">No, ordering only</text>
    <text x="1050" y="806" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1050" y="806">only has effect if both are</tspan>
      <tspan x="1050" y="834">in the same transaction</tspan>
    </text>
    <rect x="1415" y="786" width="110" height="56" rx="8" fill="#207448"/>
    <text x="1470" y="822" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Yes</text>
  </g>

  
  <g>
    <rect x="50" y="880" width="1500" height="94" rx="12" fill="#e8f1ea" stroke="#b9d5c1" stroke-width="1.5"/>
    
    <rect x="75" y="891" width="410" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="280" y="936" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Wants=B (or Requires=B)</text>
    
    <text x="525" y="941" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">+</text>
    
    <rect x="565" y="891" width="280" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="705" y="936" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">After=B</text>
    
    <text x="885" y="941" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">=</text>
    
    <rect x="925" y="891" width="600" height="72" rx="8" fill="#207448" stroke="#185937" stroke-width="2"/>
    <text x="1225" y="936" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">pull B in AND start A after B</text>
  </g>

  
  <g>
    <rect x="50" y="998" width="1500" height="70" rx="10" fill="#207448"/>
    <text x="800" y="1042" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#ffffff" text-anchor="middle">Requirement and ordering are separate settings, so use both together</text>
  </g>
</svg>