<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Reading one ls -l line</title>
  <desc>Visual breakdown of the components in a standard ls -l directory listing output line.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading one ls -l line</text>

  
  <rect x="50" y="135" width="1500" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <circle cx="85" cy="165" r="7" fill="#207448" opacity="0.3"/>
  <circle cx="107" cy="165" r="7" fill="#207448" opacity="0.3"/>
  <circle cx="129" cy="165" r="7" fill="#207448" opacity="0.3"/>

  
  <rect x="90" y="180" width="230" height="64" rx="10" fill="#db8129" fill-opacity="0.18" stroke="#db8129" stroke-width="3"/>

  
  <text y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="205" text-anchor="middle">-rw-r--r--</tspan>
    <tspan x="410" text-anchor="middle">1</tspan>
    <tspan x="600" text-anchor="middle">juser</tspan>
    <tspan x="790" text-anchor="middle">users</tspan>
    <tspan x="990" text-anchor="middle">3804</tspan>
    <tspan x="1190" text-anchor="middle">May 28 10:40</tspan>
    <tspan x="1390" text-anchor="middle">abusive.c</tspan>
  </text>

  
  <line x1="205" y1="265" x2="205" y2="420" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <line x1="410" y1="265" x2="410" y2="730" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="265" x2="600" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="790" y1="265" x2="790" y2="730" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="990" y1="265" x2="990" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1190" y1="265" x2="1190" y2="730" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1390" y1="265" x2="1390" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  

  
  <g transform="translate(50, 420)">
    <rect width="310" height="230" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5"/>
    
    <g transform="translate(127, 24)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="22" width="40" height="30" rx="6"/>
      <path d="M 16 22 V 14 A 12 12 0 0 1 40 14 V 22"/>
      <circle cx="28" cy="34" r="3" fill="#db8129"/>
      <line x1="28" y1="37" x2="28" y2="44"/>
    </g>
    <text x="155" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="155" dy="0">file type and</tspan>
      <tspan x="155" dy="38">permissions</tspan>
    </text>
  </g>

  
  <g transform="translate(460, 420)">
    <rect width="280" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(112, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="18" r="11"/>
      <path d="M 8 49 C 8 38 17 34 28 34 C 39 34 48 38 48 49"/>
    </g>
    <text x="140" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="140" dy="0">owner</tspan>
      <tspan x="140" dy="38">(juser)</tspan>
    </text>
  </g>

  
  <g transform="translate(840, 420)">
    <rect width="300" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(122, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="7"/>
      <path d="M 6 14 V 27 C 6 31 16 34 28 34 C 40 34 50 31 50 27 V 14"/>
      <path d="M 6 27 V 40 C 6 44 16 47 28 47 C 40 47 50 44 50 40 V 27"/>
    </g>
    <text x="150" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">size in bytes</tspan>
      <tspan x="150" dy="38">(3804)</tspan>
    </text>
  </g>

  
  <g transform="translate(1240, 420)">
    <rect width="300" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(122, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 7 H 32 L 44 19 V 49 H 12 Z"/>
      <path d="M 32 7 V 19 H 44"/>
      <line x1="20" y1="28" x2="36" y2="28"/>
      <line x1="20" y1="37" x2="30" y2="37"/>
    </g>
    <text x="150" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">file name</text>
  </g>

  

  
  <g transform="translate(260, 730)">
    <rect width="300" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(122, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 22 34 L 17 39 A 9 9 0 0 1 4 26 L 16 14 A 9 9 0 0 1 29 27 L 25 31"/>
      <path d="M 34 22 L 39 17 A 9 9 0 0 1 52 30 L 40 42 A 9 9 0 0 1 27 29 L 31 25"/>
    </g>
    <text x="150" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">hard link</tspan>
      <tspan x="150" dy="38">count (1)</tspan>
    </text>
  </g>

  
  <g transform="translate(650, 730)">
    <rect width="280" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(112, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="22" cy="19" r="9"/>
      <path d="M 6 49 C 6 39 14 36 22 36 C 30 36 38 39 38 49"/>
      <path d="M 33 13 A 8 8 0 0 1 41 24"/>
      <path d="M 37 32 C 43 34 48 38 48 48"/>
    </g>
    <text x="140" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="140" dy="0">group</tspan>
      <tspan x="140" dy="38">(users)</tspan>
    </text>
  </g>

  
  <g transform="translate(1030, 730)">
    <rect width="320" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(132, 24)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="21"/>
      <path d="M 28 14 V 28 L 38 28"/>
    </g>
    <text x="160" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="160" dy="0">modification</tspan>
      <tspan x="160" dy="38">date and time</tspan>
    </text>
  </g>

  
  <g transform="translate(300, 1025)">
    <rect width="1000" height="85" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(200, 15)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <path d="M 18 20 L 26 28 L 18 36"/>
      <line x1="30" y1="36" x2="38" y2="36"/>
    </g>
    <text x="530" y="52" text-anchor="middle" font-size="26" fill="#303a36">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">ls -F</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> appends a mark to each name.</tspan>
    </text>
  </g>
</svg>