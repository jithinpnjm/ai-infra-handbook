<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The same #!/bin/sh line runs different shells on different distributions</title>
  <desc>Visual infographic explaining how the same shebang line #!/bin/sh executes dash on Debian and Ubuntu causing bashisms to fail, while executing bash in POSIX mode on RHEL where bash extensions still work.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="86" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The same <tspan font-family="monospace">#!/bin/sh</tspan> line runs different shells</tspan>
    <tspan x="800" dy="58">on different distributions</tspan>
  </text>

  
  <g id="panel-debian-ubuntu">
    <rect x="60" y="200" width="710" height="520" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="415" y="248" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Debian and Ubuntu</text>

    
    <rect x="90" y="278" width="650" height="84" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(116, 292)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 4 L 32 4 L 46 18 L 46 52 L 6 52 Z"/>
      <path d="M 32 4 L 32 18 L 46 18"/>
      <line x1="14" y1="28" x2="38" y2="28"/>
      <line x1="14" y1="38" x2="30" y2="38"/>
    </g>
    <text x="188" y="331" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">Script starts with </tspan><tspan font-family="monospace">#!/bin/sh</tspan>
    </text>

    
    <line x1="415" y1="362" x2="415" y2="406" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="90" y="408" width="650" height="84" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(116, 422)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6"/>
      <polyline points="14,22 24,27 14,32"/>
      <line x1="28" y1="32" x2="40" y2="32"/>
    </g>
    <text x="188" y="461" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">/bin/sh</tspan><tspan font-family="sans-serif"> is </tspan><tspan font-family="monospace">dash</tspan>
    </text>

    
    <line x1="415" y1="492" x2="415" y2="538" stroke="#207448" stroke-width="3" stroke-dasharray="6 6"/>

    
    <rect x="90" y="538" width="650" height="158" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="116" y="574" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="116" dy="0">Small POSIX shell: no <tspan font-family="monospace">[[ ]]</tspan>, arrays,</tspan>
      <tspan x="116" dy="32"><tspan font-family="monospace">${var//x/y}</tspan> or process substitution</tspan>
    </text>
    
    <rect x="116" y="632" width="260" height="46" rx="8" fill="#fdf2f2" stroke="#d32f2f" stroke-width="2"/>
    <g transform="translate(126, 641)" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round">
      <circle cx="14" cy="14" r="12" fill="#ffffff"/>
      <line x1="9" y1="9" x2="19" y2="19"/>
      <line x1="19" y1="9" x2="9" y2="19"/>
    </g>
    <text x="164" y="664" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d32f2f">bashisms fail</text>
  </g>

  
  <g id="panel-rhel">
    <rect x="830" y="200" width="710" height="520" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="248" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">RHEL family</text>

    
    <rect x="860" y="278" width="650" height="84" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(886, 292)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 4 L 32 4 L 46 18 L 46 52 L 6 52 Z"/>
      <path d="M 32 4 L 32 18 L 46 18"/>
      <line x1="14" y1="28" x2="38" y2="28"/>
      <line x1="14" y1="38" x2="30" y2="38"/>
    </g>
    <text x="958" y="331" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">Script starts with </tspan><tspan font-family="monospace">#!/bin/sh</tspan>
    </text>

    
    <line x1="1185" y1="362" x2="1185" y2="406" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="860" y="408" width="650" height="84" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(886, 422)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6"/>
      <polyline points="14,22 24,27 14,32"/>
      <line x1="28" y1="32" x2="40" y2="32"/>
    </g>
    <text x="958" y="461" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">/bin/sh</tspan><tspan font-family="sans-serif"> is </tspan><tspan font-family="monospace">bash</tspan><tspan font-family="sans-serif"> in POSIX mode</tspan>
    </text>

    
    <line x1="1185" y1="492" x2="1185" y2="538" stroke="#207448" stroke-width="3" stroke-dasharray="6 6"/>

    
    <rect x="860" y="538" width="650" height="158" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(900, 592)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="22" fill="#e8f1ea"/>
      <polyline points="14,24 21,31 34,17" stroke-width="4"/>
    </g>
    <text x="970" y="626" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">bash extensions still work</text>
  </g>

  
  <g id="rule-box">
    <rect x="60" y="765" width="1480" height="84" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="800" y="818" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">Rule: if you use any bash feature, write </tspan><tspan font-family="monospace">#!/usr/bin/env bash</tspan><tspan font-family="sans-serif"> or </tspan><tspan font-family="monospace">#!/bin/bash</tspan><tspan font-family="sans-serif">.</tspan>
    </text>
  </g>

  
  <text x="800" y="904" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="sans-serif">If you write </tspan><tspan font-family="monospace">#!/bin/sh</tspan><tspan font-family="sans-serif">, keep to POSIX and test with </tspan><tspan font-family="monospace">dash</tspan><tspan font-family="sans-serif">.</tspan>
  </text>

  
  <g id="caption-bar">
    <rect x="60" y="955" width="1480" height="64" rx="12" fill="#207448"/>
    <text x="800" y="996" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Same shebang, different shell, so the script fails on one family only.</text>
  </g>
</svg>