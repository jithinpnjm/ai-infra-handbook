<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Performance mantras</title>
  <desc>Seven performance mantras arranged as a descending staircase from most effective to least effective, with an effectiveness arrow at the side.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Performance mantras</text>

  
  <line x1="55" y1="160" x2="85" y2="160" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="160" x2="70" y2="1080" stroke="#207448" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="95" y="590" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="95" dy="0">order of</tspan>
    <tspan x="95" dy="34">effectiveness</tspan>
    <tspan x="95" dy="34">for fixes</tspan>
  </text>

  
  <g id="step-1">
    <rect x="240" y="140" width="820" height="105" rx="12" fill="#fef6ed" stroke="#db8129" stroke-width="4"/>
    <circle cx="290" cy="192.5" r="24" fill="#db8129"/>
    <text x="290" y="193" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    <g transform="translate(335, 164.5)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <line x1="12" y1="12" x2="44" y2="44"/>
    </g>
    <text x="415" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Don't do it.</text>
  </g>

  
  <g id="step-2">
    <rect x="320" y="285" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="370" cy="337.5" r="24" fill="#207448"/>
    <text x="370" y="338" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    <g transform="translate(415, 309.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="15" rx="18" ry="6"/>
      <path d="M 10 15 v 24 c 0 4 8 6 18 6 s 18 -2 18 -6 v -24"/>
      <path d="M 10 27 c 0 4 8 6 18 6 s 18 -2 18 -6"/>
    </g>
    <text x="495" y="347" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it, but don't do it again.</text>
  </g>

  
  <g id="step-3">
    <rect x="400" y="430" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="450" cy="482.5" r="24" fill="#207448"/>
    <text x="450" y="483" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    <g transform="translate(495, 454.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="8,10 48,10 32,30 32,46 24,46 24,30"/>
    </g>
    <text x="575" y="492" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it less.</text>
  </g>

  
  <g id="step-4">
    <rect x="480" y="575" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="530" cy="627.5" r="24" fill="#207448"/>
    <text x="530" y="628" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    <g transform="translate(575, 599.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28,14 28,28 38,28"/>
    </g>
    <text x="655" y="637" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it later.</text>
  </g>

  
  <g id="step-5">
    <rect x="560" y="720" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="610" cy="772.5" r="24" fill="#207448"/>
    <text x="610" y="773" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <g transform="translate(655, 744.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 28 Q 28 12 50 28 Q 28 44 6 28 Z"/>
      <circle cx="28" cy="28" r="6"/>
      <line x1="10" y1="10" x2="46" y2="46"/>
    </g>
    <text x="735" y="782" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it when they're not looking.</text>
  </g>

  
  <g id="step-6">
    <rect x="640" y="865" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="690" cy="917.5" r="24" fill="#207448"/>
    <text x="690" y="918" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    <g transform="translate(735, 889.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="40" y2="16"/>
      <polyline points="32,10 40,16 32,22"/>
      <line x1="8" y1="28" x2="40" y2="28"/>
      <polyline points="32,22 40,28 32,34"/>
      <line x1="8" y1="40" x2="40" y2="40"/>
      <polyline points="32,34 40,40 32,46"/>
    </g>
    <text x="815" y="927" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it concurrently.</text>
  </g>

  
  <g id="step-7">
    <rect x="720" y="1010" width="820" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="770" cy="1062.5" r="24" fill="#207448"/>
    <text x="770" y="1063" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    <g transform="translate(815, 1034.5)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 26 L 26 10 L 46 10 L 46 30 L 30 46 L 10 26 Z"/>
      <circle cx="38" cy="18" r="3" fill="#207448"/>
    </g>
    <text x="895" y="1072" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do it more cheaply.</text>
  </g>
</svg>