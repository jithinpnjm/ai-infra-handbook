<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Performance mantras</title>
  <desc>Seven steps as a descending staircase from most effective to least effective fixes</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Performance mantras</text>

  
  <g>
    
    <line x1="126" y1="140" x2="154" y2="140" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="140" y1="140" x2="140" y2="1035" stroke="#207448" stroke-width="5"/>
    
    <polygon points="126,1035 140,1057 154,1035" fill="#207448"/>
    
    <text x="75" y="600" transform="rotate(-90 75 600)" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">order of effectiveness for fixes</text>
  </g>

  
  <g>
    <rect x="240" y="140" width="860" height="95" rx="12" fill="#faebe0" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="290" cy="187.5" r="24" fill="#db8129"/>
    <text x="290" y="188.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <circle cx="370" cy="187.5" r="22" stroke="#db8129" stroke-width="4" fill="none"/>
    <line x1="355" y1="172.5" x2="385" y2="202.5" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    
    <text x="420" y="187.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Don't do it.</text>
  </g>

  
  <g>
    <rect x="300" y="277" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="350" cy="324.5" r="24" fill="#207448"/>
    <text x="350" y="325.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <ellipse cx="430" cy="310.5" rx="18" ry="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 412 324.5 A 18 6 0 0 0 448 324.5" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 412 338.5 A 18 6 0 0 0 448 338.5" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="412" y1="310.5" x2="412" y2="338.5" stroke="#207448" stroke-width="3.5"/>
    <line x1="448" y1="310.5" x2="448" y2="338.5" stroke="#207448" stroke-width="3.5"/>
    
    <text x="480" y="324.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it, but don't do it again.</text>
  </g>

  
  <g>
    <rect x="360" y="414" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="410" cy="461.5" r="24" fill="#207448"/>
    <text x="410" y="462.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <path d="M 468 443.5 L 512 443.5 L 496 463.5 L 496 479.5 L 484 479.5 L 484 463.5 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <line x1="476" y1="450.5" x2="504" y2="450.5" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="540" y="461.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it less.</text>
  </g>

  
  <g>
    <rect x="420" y="551" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="470" cy="598.5" r="24" fill="#207448"/>
    <text x="470" y="599.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <circle cx="550" cy="598.5" r="22" stroke="#207448" stroke-width="3.5" fill="none"/>
    <polyline points="550,584.5 550,598.5 562,598.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="550" cy="598.5" r="3" fill="#207448"/>
    
    <text x="600" y="598.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it later.</text>
  </g>

  
  <g>
    <rect x="480" y="688" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="530" cy="735.5" r="24" fill="#207448"/>
    <text x="530" y="736.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <path d="M 588 735.5 Q 610 719.5 632 735.5 Q 610 751.5 588 735.5 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <circle cx="610" cy="735.5" r="6" stroke="#207448" stroke-width="3" fill="none"/>
    <line x1="592" y1="751.5" x2="628" y2="719.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="660" y="735.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it when they're not looking.</text>
  </g>

  
  <g>
    <rect x="540" y="825" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="590" cy="872.5" r="24" fill="#207448"/>
    <text x="590" y="873.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    
    <line x1="648" y1="858.5" x2="684" y2="858.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="678,853.5 686,858.5 678,863.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="648" y1="872.5" x2="684" y2="872.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="678,867.5 686,872.5 678,877.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="648" y1="886.5" x2="684" y2="886.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="678,881.5 686,886.5 678,891.5" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="720" y="872.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it concurrently.</text>
  </g>

  
  <g>
    <rect x="600" y="962" width="860" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="650" cy="1009.5" r="24" fill="#207448"/>
    <text x="650" y="1010.5" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    
    <path d="M 712 1005.5 L 724 993.5 L 748 993.5 L 748 1017.5 L 736 1029.5 L 712 1017.5 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <circle cx="740" cy="1001.5" r="3.5" fill="#207448"/>
    <line x1="728" y1="1007.5" x2="728" y2="1019.5" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="724,1015.5 728,1019.5 732,1015.5" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="780" y="1009.5" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" dominant-baseline="central">Do it more cheaply.</text>
  </g>
</svg>