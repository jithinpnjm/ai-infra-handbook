<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Who creates the cgroup: systemd directive, Docker flag or Slurm setting to cgroup file</title>
  <desc>Visual comparison mapping systemd directives, Docker container flags, and Slurm settings to Linux cgroup files.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Who creates the cgroup: systemd directive,</tspan>
    <tspan x="800" dy="54">Docker flag or Slurm setting to cgroup file</tspan>
  </text>

  
  <g id="band-systemd">
    
    <rect x="40" y="135" width="1520" height="315" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(65, 150)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="10"/>
      <path d="M26 6 L26 12 M26 40 L26 46 M6 26 L12 26 M40 26 L46 26 M12 12 L16 16 M36 36 L40 40 M12 40 L16 36 M36 12 L40 16"/>
    </g>

    
    <text x="130" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="130" dy="0">systemd (owns the tree through slices: -.slice,</tspan>
      <tspan x="130" dy="34">system.slice, user.slice, machine.slice)</tspan>
    </text>

    
    <rect x="65" y="222" width="460" height="52" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="85" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">CPUWeight= to cpu.weight</text>

    <rect x="545" y="222" width="460" height="52" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="565" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">CPUQuota=200% to cpu.max</text>

    <rect x="1025" y="222" width="510" height="52" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="1045" y="256" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">AllowedCPUs= to cpuset.cpus</text>

    
    <rect x="65" y="286" width="350" height="66" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="85" y="327" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">TasksMax= to pids.max</text>

    <rect x="435" y="286" width="530" height="66" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="455" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="455" dy="0">MemoryMax=, MemoryHigh=,</tspan>
      <tspan x="455" dy="28">MemoryLow= to the memory files</tspan>
    </text>

    <rect x="985" y="286" width="550" height="66" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="1005" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1005" dy="0">IOWeight=, IOReadBandwidthMax=</tspan>
      <tspan x="1005" dy="28">to the I/O files</tspan>
    </text>

    
    <rect x="65" y="364" width="1470" height="54" rx="8" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="90" y="399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">systemd-run --scope -p CPUQuota=100% -p MemoryMax=2G command</text>
  </g>

  
  <g id="band-docker">
    
    <rect x="40" y="465" width="1520" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 480)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="40" height="36" rx="4"/>
      <path d="M6 20 L46 20 M16 8 L16 20 M26 8 L26 20 M36 8 L36 20"/>
      <circle cx="16" cy="32" r="3" fill="#207448"/>
      <circle cx="26" cy="32" r="3" fill="#207448"/>
      <circle cx="36" cy="32" r="3" fill="#207448"/>
    </g>

    
    <text x="130" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="130" dy="0">Docker and containerd</tspan>
      <tspan x="130" dy="34">(runc creates the cgroup, writes the limits, moves the init process in)</tspan>
    </text>

    
    <rect x="65" y="550" width="1470" height="80" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="90" y="582" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">docker run --cpus 2 --cpu-shares 512 --cpuset-cpus 0-3 --memory 8g</tspan>
      <tspan x="90" dy="32">--memory-swap 8g --pids-limit 512 --device /dev/nvidia0 --gpus all</tspan>
    </text>

    
    <rect x="65" y="642" width="1470" height="72" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="90" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">with the systemd driver the cgroup is a transient scope named docker-&lt;id&gt;.scope;</tspan>
      <tspan x="90" dy="28">--cpus sets the quota</tspan>
    </text>

    
    <rect x="65" y="724" width="1470" height="50" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="90" y="757" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">inside the container /proc/self/cgroup shows 0::/ (the cgroup namespace view)</text>
  </g>

  
  <g id="band-slurm">
    
    <rect x="40" y="805" width="1520" height="305" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 820)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="40" height="14" rx="3"/>
      <rect x="6" y="24" width="40" height="14" rx="3"/>
      <circle cx="14" cy="13" r="2" fill="#207448"/>
      <circle cx="22" cy="13" r="2" fill="#207448"/>
      <circle cx="14" cy="31" r="2" fill="#207448"/>
      <circle cx="22" cy="31" r="2" fill="#207448"/>
    </g>

    
    <text x="130" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Slurm (Part 6)</text>

    
    <rect x="65" y="872" width="715" height="50" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="85" y="905" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">ProctrackType=proctrack/cgroup</text>

    <rect x="800" y="872" width="735" height="50" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="820" y="905" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">TaskPlugin=task/cgroup,task/affinity</text>

    
    <rect x="65" y="934" width="580" height="70" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="85" y="977" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">CgroupPlugin=autodetect or cgroup/v2</text>

    <rect x="665" y="934" width="870" height="70" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="685" y="962" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="685" dy="0">cgroup.conf: ConstrainCores=yes, ConstrainRAMSpace=yes,</tspan>
      <tspan x="685" dy="28">ConstrainDevices=yes, ConstrainSwapSpace=yes</tspan>
    </text>

    
    <rect x="65" y="1016" width="1470" height="74" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5"/>
    <text x="90" y="1045" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">each job gets a cgroup under the slurmstepd tree; memory overshoot is an OOM kill reported</tspan>
      <tspan x="90" dy="28">as OUT_OF_MEMORY; Slurm must match the cgroup version the node mounts</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1122" width="1520" height="56" rx="10" fill="#207448"/>
    <text x="800" y="1158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Before you blame a limit, look at the cgroup tree from inside the container and from the host</text>
  </g>
</svg>