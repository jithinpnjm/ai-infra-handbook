<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The disk looks full: three checks before you delete anything</title>
  <desc>A vertical troubleshooting ladder for disk space issues showing three checks: df -h versus df -i for inodes, du versus df for deleted but open files, and quota or container writable layers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.05" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">The disk looks full: three checks before you delete anything</text>

  
  <g filter="url(#shadow)">
    <rect x="60" y="105" width="1480" height="92" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 105 125 L 129 135 L 129 157 C 129 171 117 180 105 184 C 93 180 81 171 81 157 L 81 135 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="105" y1="142" x2="105" y2="159" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="105" cy="169" r="2.5" fill="#207448" />
    
    <text x="155" y="162" font-family="monospace" font-size="30px" font-weight="bold" fill="#303a36">Symptom: writes fail with No space left on device (ENOSPC)</text>
  </g>

  
  <line x1="310" y1="197" x2="310" y2="242" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#shadow)">
    <rect x="60" y="244" width="500" height="236" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="106" cy="288" r="24" fill="#207448" />
    <text x="106" y="297" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">1</text>
    
    <ellipse cx="170" cy="274" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 150 274 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 150 288 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="188" cy="296" r="7" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="193" y1="301" x2="201" y2="309" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="90" y="372" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">
      <tspan x="90" dy="0">df -h and df -i</tspan>
      <tspan x="90" dy="42">on the path</tspan>
    </text>
  </g>

  
  <line x1="560" y1="362" x2="940" y2="362" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <rect x="580" y="258" width="340" height="84" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="750" y="292" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">
    <tspan x="750" dy="0">df -h shows free space</tspan>
    <tspan x="750" dy="32">but df -i shows 100% IUse%</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="940" y="244" width="600" height="236" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <rect x="976" y="266" width="22" height="18" rx="3" fill="none" stroke="#db8129" stroke-width="3.5" />
    <rect x="1010" y="256" width="18" height="11" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="1010" y="271" width="18" height="11" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="1010" y="286" width="18" height="11" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 998 275 h 6 v -14 h 6 M 1004 275 h 6 M 1004 275 v 16 h 6" fill="none" stroke="#db8129" stroke-width="2.5" />
    
    <text x="1046" y="290" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#db8129">Out of inodes: millions of tiny files</text>
    
    <circle cx="985" cy="340" r="4" fill="#db8129" />
    <text x="1005" y="347" font-family="sans-serif" font-size="24px" fill="#303a36">delete or pack the small files</text>
    <circle cx="985" cy="384" r="4" fill="#db8129" />
    <text x="1005" y="391" font-family="monospace" font-size="24px" fill="#303a36">mkfs.ext4 -N for more inodes, or use XFS</text>
    <circle cx="985" cy="428" r="4" fill="#db8129" />
    <text x="1005" y="435" font-family="sans-serif" font-size="24px" fill="#303a36">shard your datasets</text>
  </g>

  
  <line x1="200" y1="480" x2="200" y2="568" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="220" y="504" width="310" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="375" y="533" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">df -h shows 95% used</text>

  
  <g filter="url(#shadow)">
    <rect x="60" y="570" width="500" height="236" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="106" cy="614" r="24" fill="#207448" />
    <text x="106" y="623" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">2</text>
    
    <ellipse cx="170" cy="600" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 150 600 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 150 614 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="198" y1="596" x2="198" y2="628" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="194" y1="604" x2="198" y2="604" stroke="#207448" stroke-width="2.5" />
    <line x1="194" y1="612" x2="198" y2="612" stroke="#207448" stroke-width="2.5" />
    <line x1="194" y1="620" x2="198" y2="620" stroke="#207448" stroke-width="2.5" />
    
    <text x="90" y="696" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">
      <tspan x="90" dy="0">du -sh /* totals</tspan>
      <tspan x="90" dy="42">much less than df?</tspan>
    </text>
  </g>

  
  <line x1="560" y1="688" x2="940" y2="688" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="710" y="664" width="80" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="750" y="696" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">yes</text>

  
  <g filter="url(#shadow)">
    <rect x="940" y="570" width="600" height="236" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <ellipse cx="985" cy="600" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 965 600 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 965 614 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="975" y1="634" x2="995" y2="634" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="1025" y="616" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Deleted but still open file</text>
    
    <text x="975" y="662" font-family="monospace" font-size="24px" fill="#303a36">sudo lsof +L1</text>
    <text x="975" y="700" font-family="monospace" font-size="24px" fill="#303a36">ls -l /proc/&lt;pid&gt;/fd | grep deleted</text>
    <text x="975" y="746" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="975" dy="0">restart or signal the process, or</tspan>
      <tspan x="975" dy="32">: &gt; /proc/&lt;pid&gt;/fd/&lt;n&gt;</tspan>
    </text>
  </g>

  
  <line x1="200" y1="806" x2="200" y2="876" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="220" y="820" width="70" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="255" y="850" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">no</text>

  
  <g filter="url(#shadow)">
    <rect x="60" y="878" width="500" height="194" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="106" cy="922" r="24" fill="#207448" />
    <text x="106" y="931" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="150" y="907" width="40" height="11" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="150" y="922" width="40" height="11" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="150" y="937" width="40" height="11" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="90" y="990" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">quota -s</text>
    <text x="90" y="1034" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">container writable layer full?</text>
  </g>

  
  <line x1="560" y1="975" x2="940" y2="975" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#shadow)">
    <rect x="940" y="878" width="600" height="194" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <ellipse cx="985" cy="922" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 965 922 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 965 936 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="965" y1="943" x2="1005" y2="943" stroke="#207448" stroke-width="3" stroke-dasharray="3 3" />
    
    <text x="1030" y="948" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      <tspan x="1030" dy="0">Quota reached or</tspan>
      <tspan x="1030" dy="40">container layer full</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="60" y="1100" width="1480" height="64" rx="10" fill="#207448" />
    <text x="800" y="1141" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">When a disk looks full, check inodes and deleted-but-open files before you delete anything</text>
  </g>
</svg>