<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>The disk looks full: three checks before you delete anything</title>
  <desc>Visual troubleshooting ladder for Linux disk space exhaustion covering inode depletion, deleted open files, and container or quota limits.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    The disk looks full: three checks before you delete anything
  </text>

  
  <g transform="translate(250, 95)">
    <rect width="1100" height="74" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="50" cy="37" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 50 25 L 50 39 M 50 45 L 50 49" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <text x="95" y="46" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      Symptom: writes fail with No space left on device (ENOSPC)
    </text>
  </g>

  
  <line x1="800" y1="169" x2="800" y2="208" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(340, 210)">
    <rect width="920" height="88" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="58" cy="44" r="26" fill="#207448" />
    <text x="58" y="53" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="110" y="52" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
      df -h and df -i on the path
    </text>
  </g>

  
  
  <path d="M 550 298 L 550 405 L 360 405 L 360 448" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <g transform="translate(200, 388)">
    <rect width="320" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="160" y="25" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      df -h shows 95% used
    </text>
  </g>

  
  <path d="M 1050 298 L 1050 405 L 1220 405 L 1220 448" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  
  <g transform="translate(930, 388)">
    <rect width="580" height="36" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="290" y="25" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      df -h shows free space but df -i shows 100% IUse%
    </text>
  </g>

  
  <g transform="translate(870, 450)">
    
    <rect width="690" height="470" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(36, 32)">
      <rect width="48" height="48" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
      <line x1="8" y1="20" x2="40" y2="20" stroke="#db8129" stroke-width="2.5" />
      <line x1="8" y1="32" x2="40" y2="32" stroke="#db8129" stroke-width="2.5" />
      <line x1="22" y1="8" x2="22" y2="40" stroke="#db8129" stroke-width="2.5" />
    </g>

    
    <text x="104" y="66" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      Out of inodes: millions of tiny files
    </text>

    
    <rect x="30" y="110" width="630" height="330" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="1.5" />
    
    
    
    <circle cx="56" cy="165" r="7" fill="#db8129" />
    <text x="76" y="173" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      delete or pack the small files
    </text>

    
    <circle cx="56" cy="245" r="7" fill="#db8129" />
    <text x="76" y="253" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      mkfs.ext4 -N for more inodes, or use XFS
    </text>

    
    <circle cx="56" cy="325" r="7" fill="#db8129" />
    <text x="76" y="333" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      shard your datasets
    </text>
  </g>

  
  <g transform="translate(40, 450)">
    <rect width="640" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="54" cy="50" r="26" fill="#207448" />
    <text x="54" y="59" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="100" y="58" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">
      du -sh /* totals much less than df?
    </text>
  </g>

  
  
  <path d="M 220 550 L 220 638" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(180, 574)">
    <rect width="80" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  </g>

  
  <path d="M 520 550 L 520 958" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(485, 740)">
    <rect width="70" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="35" y="25" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>
  </g>

  
  <g transform="translate(40, 640)">
    <rect width="400" height="280" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(24, 20)">
      <ellipse cx="22" cy="10" rx="20" ry="7" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <path d="M 2 10 L 2 34 A 20 7 0 0 0 42 34 L 42 10" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 2 22 A 20 7 0 0 0 42 22" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>

    
    <text x="80" y="48" font-family="sans-serif" font-size="27" font-weight="bold" fill="#207448">
      Deleted but still open file
    </text>

    
    <rect x="18" y="76" width="364" height="186" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.2" />

    <text x="30" y="106" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">diagnose</text>
    <text x="30" y="136" font-family="monospace" font-size="24" fill="#207448">sudo lsof +L1</text>
    <text x="30" y="166" font-family="sans-serif" font-size="24" fill="#303a36">or</text>
    <text x="65" y="166" font-family="monospace" font-size="24" fill="#207448">ls -l /proc/&lt;pid&gt;/fd | grep deleted</text>

    <text x="30" y="208" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fix</text>
    <text x="30" y="238" font-family="monospace" font-size="24" fill="#207448">restart or signal the process, or : &gt; /proc/&lt;pid&gt;/fd/&lt;n&gt;</text>
  </g>

  
  <g transform="translate(40, 960)">
    
    <rect width="1520" height="260" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(24, 24)">
      <rect width="700" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      
      <circle cx="40" cy="33" r="22" fill="#207448" />
      <text x="40" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      
      <text x="78" y="42" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">quota -s</text>
      <text x="216" y="42" font-family="sans-serif" font-size="25" fill="#303a36"> and </text>
      <text x="272" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">container writable layer full?</text>
    </g>

    
    <path d="M 724 57 L 820 57" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g transform="translate(830, 24)">
      <rect width="666" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(20, 14)">
        <ellipse cx="18" cy="8" rx="16" ry="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <path d="M 2 8 L 2 28 A 16 6 0 0 0 34 28 L 34 8" fill="none" stroke="#207448" stroke-width="2" />
      </g>
      <text x="70" y="43" font-family="sans-serif" font-size="27" font-weight="bold" fill="#207448">
        Quota reached or container layer full
      </text>
    </g>

    
    <rect x="24" y="112" width="1472" height="124" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.2" />
    <text x="50" y="156" font-family="sans-serif" font-size="24" fill="#303a36">
      Check non-filesystem restrictions: user or group disk quotas silently block allocations even when raw storage remains.
    </text>
    <text x="50" y="200" font-family="sans-serif" font-size="24" fill="#303a36">
      Inside containers, overlayfs storage driver limits or exhaustion of the thin container writable layer report as host ENOSPC.
    </text>
  </g>

  
  <g transform="translate(40, 1260)">
    <rect width="1520" height="74" rx="12" fill="#207448" />
    <text x="760" y="47" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      When a disk looks full, check inodes and deleted-but-open files before you delete anything
    </text>
  </g>
</svg>