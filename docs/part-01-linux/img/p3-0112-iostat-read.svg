<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading iostat on NVMe: percent util alone misleads</title>
  <desc>Decision tree explaining why percent util misleads on NVMe and how to diagnose storage limits using aqu-sz, await, and bandwidth.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading iostat on NVMe: percent util alone misleads</text>

  
  <rect x="40" y="95" width="1520" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="60" y="112" width="1480" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(80, 125)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="48" height="38" rx="6" />
    <path d="M 10 14 L 18 20 L 10 26" />
    <line x1="22" y1="26" x2="34" y2="26" />
  </g>
  <text x="150" y="146" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">Device r/s w/s rkB/s wkB/s await aqu-sz %util</text>
  <text x="150" y="177" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">nvme0n1 42.0 980.0 5376.0 62720 8.20 4.10 97.5</text>

  
  
  <rect x="60" y="208" width="530" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="248" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0" font-weight="bold" fill="#207448">await</tspan><tspan fill="#303a36"> = queue time plus service time,</tspan>
    <tspan x="80" dy="34">the latency you care about</tspan>
  </text>

  
  <rect x="610" y="208" width="400" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="630" y="268" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">aqu-sz</tspan><tspan fill="#303a36"> = average queue length</tspan>
  </text>

  
  <rect x="1030" y="208" width="510" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1050" y="248" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1050" dy="0" font-weight="bold" fill="#207448">%util</tspan><tspan fill="#303a36"> = share of time with at least</tspan>
    <tspan x="1050" dy="34">one request outstanding</tspan>
  </text>

  
  <rect x="1040" y="360" width="520" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8,6" />
  
  <g transform="translate(1065, 385)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="26" />
    <circle cx="28" cy="28" r="8" />
    <line x1="28" y1="2" x2="28" y2="12" />
    <line x1="48" y1="48" x2="28" y2="28" />
  </g>
  <text x="1140" y="402" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1140" dy="0">On a single rotational disk,</tspan>
    <tspan x="1140" dy="32">100% means saturated; on NVMe</tspan>
    <tspan x="1140" dy="32">and arrays running many requests</tspan>
    <tspan x="1140" dy="32">in parallel it does not</tspan>
  </text>

  
  <polygon points="500,355 790,440 500,525 210,440" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(472, 380)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 36 A 24 24 0 1 1 50 36" />
    <line x1="28" y1="28" x2="44" y2="16" />
    <circle cx="28" cy="28" r="4" fill="#207448" />
  </g>
  <text x="500" y="468" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Is %util near 100%?</text>

  
  <polygon points="500,575 890,690 500,805 110,690" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(472, 600)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="10" width="14" height="20" rx="3" />
    <rect x="20" y="10" width="14" height="20" rx="3" />
    <rect x="40" y="10" width="14" height="20" rx="3" />
    <path d="M 5 0 L 28 0 L 50 0" />
    <path d="M 5 40 L 28 40 L 50 40" />
  </g>
  <text x="500" y="675" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="500" dy="0">Is aqu-sz below about 4</tspan>
    <tspan x="500" dy="36">and bandwidth far</tspan>
    <tspan x="500" dy="36">below spec?</tspan>
  </text>

  
  <line x1="500" y1="525" x2="500" y2="573" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 790 440 L 950 440 L 950 580 L 1400 580 L 1400 648" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <rect x="965" y="558" width="410" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1170" y="588" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">High await with moderate util</text>

  
  <line x1="270" y1="737" x2="270" y2="858" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  
  <rect x="235" y="775" width="70" height="44" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="270" y="805" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Yes</text>

  
  <line x1="770" y1="725" x2="770" y2="858" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <rect x="735" y="775" width="70" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="770" y="805" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">No</text>

  
  <rect x="40" y="860" width="460" height="220" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(65, 885)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="52" rx="6" />
    <line x1="0" y1="14" x2="56" y2="14" />
    <circle cx="8" cy="7" r="1.5" fill="#db8129" />
    <circle cx="16" cy="7" r="1.5" fill="#db8129" />
    <path d="M 28 22 L 28 42 M 20 34 L 28 42 L 36 34" />
  </g>
  <text x="140" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0" font-weight="bold" fill="#db8129">The application I/O pattern</tspan>
    <tspan x="140" dy="32" font-weight="bold" fill="#db8129">is the limit: synchronous</tspan>
    <tspan x="140" dy="32">single-threaded I/O. Fix:</tspan>
    <tspan x="140" dy="32" font-weight="bold">more threads or io_uring</tspan>
  </text>

  
  <rect x="540" y="860" width="460" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(742, 885)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="10" rx="26" ry="8" />
    <path d="M 2 10 L 2 26 A 26 8 0 0 0 54 26 L 54 10" />
    <path d="M 2 26 L 2 42 A 26 8 0 0 0 54 42 L 54 26" />
  </g>
  <text x="770" y="985" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="770" dy="0">Drive is genuinely busy;</tspan>
    <tspan x="770" dy="36">check await and bandwidth</tspan>
  </text>

  
  <rect x="1040" y="650" width="520" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1272, 700)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="32" rx="5" />
    <circle cx="10" cy="16" r="3" fill="#207448" />
    <circle cx="20" cy="16" r="3" fill="#207448" />
    <path d="M 28 32 L 28 46 M 10 46 L 46 46 M 10 46 L 10 56 M 46 46 L 46 56" />
  </g>
  <text x="1300" y="830" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1300" dy="0" fill="#207448">Queueing or backend latency:</tspan>
    <tspan x="1300" dy="42" font-weight="normal">noisy neighbour on a</tspan>
    <tspan x="1300" dy="40" font-weight="normal">shared disk or congested</tspan>
    <tspan x="1300" dy="40" font-weight="normal">network storage path</tspan>
  </text>

  
  <rect x="40" y="1105" width="1520" height="65" rx="12" fill="#207448" />
  
  <g transform="translate(65, 1120)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="14" />
    <path d="M 12 18 L 16 22 L 24 14" />
  </g>
  <text x="800" y="1147" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Pair %util with aqu-sz, bandwidth and IOPS</text>
</svg>