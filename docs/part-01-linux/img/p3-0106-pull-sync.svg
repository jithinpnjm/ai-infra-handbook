<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Keeping UIDs identical across nodes: pull at boot, stagger the trigger</title>
  <desc>Architecture diagram illustrating cluster UID synchronization using node-initiated boot pull and master-staggered trigger loops.</desc>

  <defs>
    <marker id="arrow-left" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 14 2 L 2 8 L 14 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Keeping UIDs identical across nodes:</text>
  <text x="800" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">pull at boot, stagger the trigger</text>

  
  <g id="trigger-1">
    <rect x="50" y="145" width="570" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="95" cy="227" r="24" fill="#207448" />
    <text x="95" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="145" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">At OS startup: a rebooted or</tspan>
      <tspan x="145" dy="35">replaced node repairs its own</tspan>
      <tspan x="145" dy="35">user table before accepting jobs</tspan>
    </text>
  </g>

  
  <g id="trigger-2">
    <rect x="650" y="145" width="900" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="695" cy="227" r="24" fill="#207448" />
    <text x="695" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="745" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="745" dy="0">After a batch of account changes:</tspan>
      <tspan x="745" dy="32">master runs the trigger loop,</tspan>
      <tspan x="745" dy="33" font-family="ui-monospace, monospace">ssh -o connecttimeout=3 node /usr/sbin/master-sync,</tspan>
      <tspan x="745" dy="32" font-family="ui-monospace, monospace">sleep 0.1 between nodes</tspan>
    </text>
  </g>

  
  <g id="master-node">
    <rect x="50" y="340" width="540" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g transform="translate(75, 362)">
      
      <ellipse cx="28" cy="12" rx="24" ry="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      
      <path d="M 4 12 L 4 28 A 24 8 0 0 0 52 28 L 52 12" fill="#ffffff" stroke="#207448" stroke-width="3" />
      
      <path d="M 4 28 L 4 44 A 24 8 0 0 0 52 44 L 52 28" fill="#ffffff" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="145" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Master node (head)</text>

    
    <rect x="75" y="435" width="490" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(95, 460)">
      <path d="M 0 0 L 18 0 L 26 8 L 26 32 L 0 32 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <path d="M 18 0 L 18 8 L 26 8" fill="none" stroke="#207448" stroke-width="2" />
      <text x="40" y="24" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/passwd</text>
    </g>

    
    <g transform="translate(95, 540)">
      <path d="M 0 0 L 18 0 L 26 8 L 26 32 L 0 32 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <path d="M 18 0 L 18 8 L 26 8" fill="none" stroke="#207448" stroke-width="2" />
      <text x="40" y="24" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/shadow</text>
    </g>

    
    <g transform="translate(95, 620)">
      <path d="M 0 0 L 18 0 L 26 8 L 26 32 L 0 32 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <path d="M 18 0 L 18 8 L 26 8" fill="none" stroke="#207448" stroke-width="2" />
      <text x="40" y="24" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/group</text>
    </g>
  </g>

  
  <g id="timeline-strip">
    <rect x="50" y="740" width="540" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(75, 760)">
      <circle cx="28" cy="28" r="24" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <circle cx="103" cy="855" r="8" fill="#207448" />
    <line x1="103" y1="863" x2="103" y2="945" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    <text x="125" y="845" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">sleep 0.1 per node =</tspan>
      <tspan x="125" dy="32">10 seconds for 100 nodes</tspan>
    </text>

    
    <circle cx="103" cy="955" r="8" fill="#207448" />
    <text x="125" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="125" dy="0" font-weight="bold">watchdog</tspan>
      <tspan x="125" dy="32" font-family="ui-monospace, monospace">(sleep 600 &amp;&amp; kill -ALRM $$)</tspan>
      <tspan x="125" dy="32">ends the script after at most</tspan>
      <tspan x="125" dy="32">600 seconds</tspan>
    </text>
  </g>

  
  <g id="compute-nodes">
    
    <g id="node-gpu01">
      <rect x="1110" y="340" width="440" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1135, 355)">
        <rect x="8" y="8" width="28" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <line x1="14" y1="2" x2="14" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="2" x2="22" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="2" x2="30" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="14" y1="36" x2="14" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="36" x2="22" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="36" x2="30" y2="42" stroke="#207448" stroke-width="2" />
      </g>
      <text x="1195" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">gpu01</text>
      
      <rect x="1130" y="415" width="400" height="72" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1145, 433)">
        <circle cx="18" cy="18" r="14" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="18" cy="18" r="6" fill="#207448" />
      </g>
      <text x="1190" y="460" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
    </g>

    
    <g id="node-gpu02">
      <rect x="1110" y="540" width="440" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1135, 555)">
        <rect x="8" y="8" width="28" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <line x1="14" y1="2" x2="14" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="2" x2="22" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="2" x2="30" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="14" y1="36" x2="14" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="36" x2="22" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="36" x2="30" y2="42" stroke="#207448" stroke-width="2" />
      </g>
      <text x="1195" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">gpu02</text>
      
      <rect x="1130" y="615" width="400" height="72" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1145, 633)">
        <circle cx="18" cy="18" r="14" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="18" cy="18" r="6" fill="#207448" />
      </g>
      <text x="1190" y="660" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
    </g>

    
    <g id="node-gpu05">
      <rect x="1110" y="740" width="440" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1135, 755)">
        <rect x="8" y="8" width="28" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <line x1="14" y1="2" x2="14" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="2" x2="22" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="2" x2="30" y2="8" stroke="#207448" stroke-width="2" />
        <line x1="14" y1="36" x2="14" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="22" y1="36" x2="22" y2="42" stroke="#207448" stroke-width="2" />
        <line x1="30" y1="36" x2="30" y2="42" stroke="#207448" stroke-width="2" />
      </g>
      <text x="1195" y="785" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">gpu05</text>
      
      <rect x="1130" y="815" width="400" height="72" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(1145, 833)">
        <circle cx="18" cy="18" r="14" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="18" cy="18" r="6" fill="#207448" />
      </g>
      <text x="1190" y="860" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
    </g>
  </g>

  
  <g id="pull-connections">
    
    <line x1="1110" y1="425" x2="1050" y2="425" stroke="#207448" stroke-width="3" />
    <line x1="1110" y1="625" x2="1050" y2="625" stroke="#207448" stroke-width="3" />
    <line x1="1110" y1="825" x2="1050" y2="825" stroke="#207448" stroke-width="3" />

    
    <path d="M 1050 425 
             Q 1025 425 1025 455 
             L 1025 605 
             Q 1025 625 1005 625 
             Q 1025 625 1025 645 
             L 1025 795 
             Q 1025 825 1050 825" 
          fill="none" stroke="#207448" stroke-width="3" />

    
    <line x1="1005" y1="625" x2="594" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrow-left)" />

    
    <text x="800" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">rsync over SSH with a</tspan>
      <tspan x="800" dy="32">dedicated key: pull,</tspan>
      <tspan x="800" dy="32">initiated by the node</tspan>
    </text>
  </g>

  
  <g id="failure-callout">
    <rect x="610" y="935" width="940" height="165" rx="12" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(635, 988)">
      <polygon points="26,4 50,48 2,48" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="26" y1="18" x2="26" y2="34" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="26" cy="41" r="2.5" fill="#db8129" />
    </g>

    
    <text x="705" y="1005" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="705" dy="0" font-weight="bold">alice is UID 1042 on login node but 1043 on gpu05:</tspan>
      <tspan x="705" dy="38">job cannot read her files, munge rejects the job steps</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1125" width="1500" height="55" rx="8" fill="#207448" />
    <text x="800" y="1161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Pull, not push: no network shock and no stale node</text>
  </g>
</svg>