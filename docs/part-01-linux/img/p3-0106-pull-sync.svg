<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>Keeping UIDs identical across nodes: pull at boot, stagger the trigger</title>
  <desc>Visual infographic explaining UID synchronization across HPC cluster compute nodes using boot-time pull and staggered master triggers.</desc>

  <defs>
    <marker id="arrow-pull" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 12 1 L 1 6 L 12 11 z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Keeping UIDs identical across nodes: pull at boot, stagger the trigger</text>

  
  
  <g filter="url(#shadow)">
    <rect x="70" y="115" width="710" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="125" cy="197" r="26" fill="#207448"/>
    <text x="125" y="206" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="175" y="170" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="175" dy="0">At OS startup: a rebooted or replaced</tspan>
      <tspan x="175" dy="34">node repairs its own user table</tspan>
      <tspan x="175" dy="34">before accepting jobs</tspan>
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="820" y="115" width="710" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="875" cy="197" r="26" fill="#207448"/>
    <text x="875" y="206" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="925" y="165" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="925" dy="0">After a batch of account changes: master runs</tspan>
      <tspan x="925" dy="32" font-family="monospace">the trigger loop, ssh -o connecttimeout=3 node</tspan>
      <tspan x="925" dy="32" font-family="monospace">/usr/sbin/master-sync, sleep 0.1 between nodes</tspan>
    </text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="70" y="315" width="450" height="425" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(100, 345)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="26" cy="14" rx="26" ry="10" fill="#ffffff"/>
      <path d="M 0 14 v 30 c 0 6 12 10 26 10 s 26 -4 26 -10 v -30"/>
      <path d="M 0 29 c 0 6 12 10 26 10 s 26 -4 26 -10"/>
      <path d="M 0 44 c 0 6 12 10 26 10 s 26 -4 26 -10"/>
    </g>

    
    <text x="175" y="385" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Master node (head)</text>

    
    <rect x="95" y="425" width="400" height="285" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <text x="145" y="495" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/passwd</text>
    <line x1="120" y1="525" x2="470" y2="525" stroke="#e8f1ea" stroke-width="2"/>
    
    <text x="145" y="580" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/shadow</text>
    <line x1="120" y1="610" x2="470" y2="610" stroke="#e8f1ea" stroke-width="2"/>
    
    <text x="145" y="665" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/group</text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="1100" y="315" width="430" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="1125" y="380" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">gpu01</text>
    
    
    <rect x="1235" y="338" width="275" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1247, 357)" stroke="#207448" stroke-width="2.5" fill="none">
      <circle cx="16" cy="16" r="6"/>
      <path d="M16 2 v4 M16 26 v4 M2 16 h4 M26 16 h4 M6 6 l3 3 M23 23 l3 3 M6 26 l3 -3 M23 9 l3 -3"/>
    </g>
    <text x="1288" y="381" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1100" y="470" width="430" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="1125" y="535" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">gpu02</text>
    
    
    <rect x="1235" y="493" width="275" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1247, 512)" stroke="#207448" stroke-width="2.5" fill="none">
      <circle cx="16" cy="16" r="6"/>
      <path d="M16 2 v4 M16 26 v4 M2 16 h4 M26 16 h4 M6 6 l3 3 M23 23 l3 3 M6 26 l3 -3 M23 9 l3 -3"/>
    </g>
    <text x="1288" y="536" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="1100" y="625" width="430" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="1125" y="690" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">gpu05</text>
    
    
    <rect x="1235" y="648" width="275" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1247, 667)" stroke="#207448" stroke-width="2.5" fill="none">
      <circle cx="16" cy="16" r="6"/>
      <path d="M16 2 v4 M16 26 v4 M2 16 h4 M26 16 h4 M6 6 l3 3 M23 23 l3 3 M6 26 l3 -3 M23 9 l3 -3"/>
    </g>
    <text x="1288" y="691" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/usr/sbin/master-sync</text>
  </g>

  
  
  <path d="M 1100 372 L 980 372 L 980 528" fill="none" stroke="#207448" stroke-width="4"/>
  
  <path d="M 1100 528 L 980 528" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 1100 682 L 980 682 L 980 528" fill="none" stroke="#207448" stroke-width="4"/>

  
  <circle cx="980" cy="528" r="7" fill="#207448"/>

  
  <line x1="980" y1="528" x2="528" y2="528" stroke="#207448" stroke-width="4" marker-end="url(#arrow-pull)"/>

  
  <g filter="url(#shadow)">
    <rect x="545" y="440" width="410" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="750" y="468" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">rsync over SSH with a dedicated key:</text>
    <text x="750" y="494" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">pull, initiated by the node</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="70" y="765" width="1460" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(95, 798)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="22"/>
      <polyline points="24,12 24,24 35,24"/>
    </g>

    
    <rect x="165" y="783" width="580" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="185" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">sleep 0.1</tspan> per node = 10 seconds for 100 nodes
    </text>

    
    <rect x="765" y="783" width="745" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="785" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
      watchdog (<tspan font-family="monospace">sleep 600 &amp;&amp; kill -ALRM $$</tspan>) ends the script after at most 600 seconds
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="70" y="905" width="1460" height="135" rx="12" fill="#fff5ea" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(100, 942)" stroke="#db8129" stroke-width="3" fill="none">
      <polygon points="28,4 54,50 2,50" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="34" stroke-linecap="round"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129"/>
    </g>

    
    <text x="175" y="958" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      alice is UID 1042 on login node but 1043 on gpu05:
    </text>
    <text x="175" y="1000" font-family="sans-serif" font-size="25" fill="#303a36">
      job cannot read her files, munge rejects the job steps
    </text>
  </g>

  
  <rect x="70" y="1065" width="1460" height="80" rx="10" fill="#207448"/>
  <text x="800" y="1115" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Pull, not push: no network shock and no stale node
  </text>
</svg>