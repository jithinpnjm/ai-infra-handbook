<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Minor and major page faults</title>
  <desc>Visual explanation of minor versus major page faults and memory size metrics including VSZ, RSS, PSS, and USS.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Minor and major page faults</text>

  
  <rect x="60" y="140" width="520" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(292, 175)">
    <rect x="-28" y="-24" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="-28" y1="-10" x2="28" y2="-10" stroke="#207448" stroke-width="3" />
    <circle cx="-18" cy="-17" r="2.5" fill="#207448" />
    <circle cx="-10" cy="-17" r="2.5" fill="#207448" />
    <circle cx="-2" cy="-17" r="2.5" fill="#207448" />
  </g>

  
  <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">process with virtual memory</text>

  
  <rect x="90" y="300" width="460" height="315" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="320" y="370" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">malloc(1&lt;&lt;30)</text>
  <text x="320" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">consumes almost no RAM until</text>
  <text x="320" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">pages are touched</text>
  <text x="320" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(demand paging)</text>

  
  <text x="660" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Two outcomes</text>
  <text x="660" y="414" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">from a touch:</text>

  
  <path d="M 580 340 L 745 340 L 745 250 L 932 250" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 580 450 L 745 450 L 745 530 L 932 530" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="940" y="140" width="600" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(976, 172)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1050" y="212" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">minor fault</text>
  <text x="976" y="268" font-family="sans-serif" font-size="24" fill="#303a36">no I/O, new zero page or</text>
  <text x="976" y="302" font-family="sans-serif" font-size="24" fill="#303a36">already-cached file page,</text>
  <text x="976" y="336" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">cheap and frequent</text>

  
  <rect x="940" y="410" width="600" height="240" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

  
  <g transform="translate(976, 442)">
    <ellipse cx="28" cy="14" rx="26" ry="10" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 2 14 L 2 42 A 26 10 0 0 0 54 42 L 54 14" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 2 28 A 26 10 0 0 0 54 28" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="4 2" />
  </g>
  <text x="1050" y="482" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">major fault</text>
  <text x="976" y="534" font-family="sans-serif" font-size="24" fill="#303a36">kernel must read from storage,</text>
  <text x="976" y="568" font-family="sans-serif" font-size="24" fill="#303a36">first touch of uncached file page or</text>
  <text x="976" y="602" font-family="sans-serif" font-size="24" fill="#303a36">swapping an anonymous page back in,</text>
  <text x="976" y="636" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">slow</text>

  
  <rect x="60" y="690" width="1480" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="90" y="734" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">size terms</text>

  
  <rect x="88" y="755" width="340" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(230, 775)">
    <rect x="0" y="0" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 3" />
    <polyline points="14,14 42,34" stroke="#207448" stroke-width="3" />
    <polyline points="42,14 14,34" stroke="#207448" stroke-width="3" />
  </g>
  <text x="258" y="865" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">VSZ or VIRT</text>
  <text x="258" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">counts everything</text>
  <text x="258" y="946" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">allocated</text>

  
  <rect x="452" y="755" width="340" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(594, 775)">
    <rect x="0" y="8" width="56" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="40" x2="12" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="22" y1="40" x2="22" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="40" x2="34" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="44" y1="40" x2="44" y2="48" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="24" r="6" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="622" y="865" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">RSS</text>
  <text x="622" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">only the part</text>
  <text x="622" y="946" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">in RAM</text>

  
  <rect x="816" y="755" width="340" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(958, 775)">
    <circle cx="28" cy="24" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="28" y1="2" x2="28" y2="46" stroke="#207448" stroke-width="3" />
    <line x1="28" y1="24" x2="48" y2="34" stroke="#207448" stroke-width="3" />
  </g>
  <text x="986" y="865" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">PSS</text>
  <text x="986" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">divides shared pages</text>
  <text x="986" y="946" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">among users</text>

  
  <rect x="1180" y="755" width="340" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1322, 775)">
    <rect x="8" y="16" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 18 16 L 18 10 A 10 10 0 0 1 38 10 L 38 16" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="31" r="3" fill="#207448" />
  </g>
  <text x="1350" y="865" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">USS</text>
  <text x="1350" y="928" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">unique set size</text>
</svg>