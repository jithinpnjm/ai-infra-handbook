<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>Minor and major page faults</title>
  <desc>Visual explanation of minor versus major page faults and memory size metrics.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 1 L 18 9 L 0 17 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 1 L 18 9 L 0 17 z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-neutral" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 1 L 18 9 L 0 17 z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="60" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Minor and major page faults</text>

  
  <g id="process-container">
    <rect x="60" y="130" width="490" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(90, 160)">
      <rect x="0" y="0" width="56" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3" />
      <circle cx="10" cy="7" r="3" fill="#207448" />
      <circle cx="20" cy="7" r="3" fill="#207448" />
      <circle cx="30" cy="7" r="3" fill="#207448" />
    </g>

    
    <text x="165" y="195" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">process with virtual memory</text>

    
    <rect x="90" y="240" width="430" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="115" y="293" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">malloc(1&lt;&lt;30)</text>

    
    <rect x="90" y="355" width="430" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,6" />
    <text x="115" y="415" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="115" dy="0">consumes almost no RAM</tspan>
      <tspan x="115" dy="45">until pages are touched</tspan>
      <tspan x="115" dy="45">(demand paging).</tspan>
    </text>

    
    <rect x="90" y="590" width="430" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="125" cy="632" r="14" fill="#207448" />
    <text x="120" y="639" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">!</text>
    <text x="155" y="641" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Touch triggers page fault</text>
  </g>

  
  
  <path d="M 550 420 L 590 420" fill="none" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-neutral)" />

  
  <g id="touch-outcome-pill">
    <rect x="605" y="375" width="220" height="90" rx="14" fill="#ffffff" stroke="#303a36" stroke-width="3" />
    <text x="715" y="415" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="715" dy="0">Two outcomes</tspan>
      <tspan x="715" dy="32">from a touch:</tspan>
    </text>
  </g>

  
  <path d="M 825 400 L 895 400 L 895 270 L 935 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 825 440 L 895 440 L 895 570 L 935 570" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  
  <g id="minor-fault-panel">
    <rect x="950" y="130" width="590" height="275" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(980, 155)">
      <rect x="0" y="0" width="56" height="42" rx="4" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <line x1="14" y1="0" x2="14" y2="42" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="0" x2="28" y2="42" stroke="#207448" stroke-width="3" />
      <line x1="42" y1="0" x2="42" y2="42" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="42" x2="6" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="42" x2="20" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="34" y1="42" x2="34" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="48" y1="42" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="1055" y="195" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">minor fault</text>

    
    <rect x="980" y="225" width="530" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1005" y="275" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1005" dy="0">no I/O, new zero page or</tspan>
      <tspan x="1005" dy="38">already-cached file page,</tspan>
      <tspan x="1005" dy="38">cheap and frequent</tspan>
    </text>
  </g>

  
  <g id="major-fault-panel">
    <rect x="950" y="435" width="590" height="275" rx="16" fill="#fff8f2" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(980, 460)">
      <ellipse cx="28" cy="12" rx="26" ry="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
      <path d="M 2 12 L 2 36 A 26 10 0 0 0 54 36 L 54 12" fill="none" stroke="#db8129" stroke-width="4" />
      <path d="M 2 24 A 26 10 0 0 0 54 24" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="4,4" />
    </g>

    <text x="1055" y="500" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">major fault</text>

    
    <rect x="980" y="530" width="530" height="155" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="1005" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1005" dy="0">kernel must read from storage,</tspan>
      <tspan x="1005" dy="33">first touch of uncached file page</tspan>
      <tspan x="1005" dy="33">or swapping an anonymous page</tspan>
      <tspan x="1005" dy="33">back in, slow</tspan>
    </text>
  </g>

  
  <g id="size-terms-panel">
    
    <rect x="60" y="750" width="1480" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <text x="90" y="795" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">size terms</text>

    
    <g transform="translate(90, 815)">
      <rect x="0" y="0" width="335" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="25" y="50" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">VSZ or VIRT</text>
      <text x="25" y="105" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">counts everything</tspan>
        <tspan x="25" dy="36">allocated</tspan>
      </text>
    </g>

    
    <g transform="translate(455, 815)">
      <rect x="0" y="0" width="335" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="25" y="50" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">RSS</text>
      <text x="25" y="105" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">only the part</tspan>
        <tspan x="25" dy="36">in RAM</tspan>
      </text>
    </g>

    
    <g transform="translate(820, 815)">
      <rect x="0" y="0" width="335" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="25" y="50" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">PSS</text>
      <text x="25" y="105" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">divides shared</tspan>
        <tspan x="25" dy="36">pages among users</tspan>
      </text>
    </g>

    
    <g transform="translate(1185, 815)">
      <rect x="0" y="0" width="335" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="25" y="50" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">USS</text>
      <text x="25" y="105" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">unique set size</tspan>
      </text>
    </g>
  </g>

</svg>