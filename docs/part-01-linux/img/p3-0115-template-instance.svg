<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>One template file, eight instances: what %i and %I become</title>
  <desc>Visual infographic explaining systemd template unit files, instantiation with %i and %I specifiers, escaping behavior, and other specifiers.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 1, 8 4.5, 0 8" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">One template file, eight instances: what %i and %I become</text>

  
  <rect x="50" y="105" width="1500" height="175" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 75 125 h 32 l 14 14 v 38 h -46 z"/>
    <polyline points="107 125, 107 139, 121 139"/>
    <line x1="87" y1="151" x2="109" y2="151"/>
    <line x1="87" y1="163" x2="109" y2="163"/>
  </g>

  <text x="145" y="147" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">gpu-job@.service</text>
  <text x="145" y="187" font-family="monospace" font-size="24" fill="#303a36">Description=Job runner bound to GPU %i</text>
  <text x="145" y="221" font-family="monospace" font-size="24" fill="#303a36">Environment=CUDA_VISIBLE_DEVICES=%i</text>
  <text x="145" y="255" font-family="monospace" font-size="24" fill="#303a36">ExecStart=/usr/local/bin/runner --gpu %i</text>

  
  <rect x="50" y="295" width="1500" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="75" y="320" width="50" height="45" rx="6"/>
    <polyline points="85 336, 95 342, 85 348"/>
    <line x1="101" y1="348" x2="113" y2="348"/>
  </g>

  <text x="145" y="335" font-family="monospace" font-size="24" fill="#303a36">systemctl enable --now gpu-job@0.service gpu-job@1.service</text>
  <text x="145" y="369" font-family="monospace" font-size="24" fill="#303a36">systemctl start gpu-job@{0..7}.service</text>

  
  <path d="M 450 390 C 450 430, 285 425, 285 465" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 800 390 L 800 465" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 1150 390 C 1150 430, 1315 425, 1315 465" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>

  
  <rect x="50" y="475" width="470" height="165" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="72" y="495" width="44" height="44" rx="4"/>
    <line x1="84" y1="487" x2="84" y2="495"/>
    <line x1="104" y1="487" x2="104" y2="495"/>
    <line x1="84" y1="539" x2="84" y2="547"/>
    <line x1="104" y1="539" x2="104" y2="547"/>
    <line x1="64" y1="507" x2="72" y2="507"/>
    <line x1="64" y1="527" x2="72" y2="527"/>
    <line x1="116" y1="507" x2="124" y2="507"/>
    <line x1="116" y1="527" x2="124" y2="527"/>
  </g>
  <text x="130" y="525" font-family="monospace" font-size="24" fill="#303a36">
    <tspan font-weight="bold">gpu-job@0.service:</tspan>
    <tspan x="72" y="575">CUDA_VISIBLE_DEVICES=0,</tspan>
    <tspan x="72" y="612">runner --gpu 0</tspan>
  </text>

  
  <rect x="565" y="475" width="470" height="165" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="587" y="495" width="44" height="44" rx="4"/>
    <line x1="599" y1="487" x2="599" y2="495"/>
    <line x1="619" y1="487" x2="619" y2="495"/>
    <line x1="599" y1="539" x2="599" y2="547"/>
    <line x1="619" y1="539" x2="619" y2="547"/>
    <line x1="579" y1="507" x2="587" y2="507"/>
    <line x1="579" y1="527" x2="587" y2="527"/>
    <line x1="631" y1="507" x2="639" y2="507"/>
    <line x1="631" y1="527" x2="639" y2="527"/>
  </g>
  <text x="645" y="525" font-family="monospace" font-size="24" fill="#303a36">
    <tspan font-weight="bold">gpu-job@1.service:</tspan>
    <tspan x="587" y="575">CUDA_VISIBLE_DEVICES=1,</tspan>
    <tspan x="587" y="612">runner --gpu 1</tspan>
  </text>

  
  <rect x="1080" y="475" width="470" height="165" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1102" y="495" width="44" height="44" rx="4"/>
    <line x1="1114" y1="487" x2="1114" y2="495"/>
    <line x1="1134" y1="487" x2="1134" y2="495"/>
    <line x1="1114" y1="539" x2="1114" y2="547"/>
    <line x1="1134" y1="539" x2="1134" y2="547"/>
    <line x1="1094" y1="507" x2="1102" y2="507"/>
    <line x1="1094" y1="527" x2="1102" y2="527"/>
    <line x1="1146" y1="507" x2="1154" y2="507"/>
    <line x1="1146" y1="527" x2="1154" y2="527"/>
  </g>
  <text x="1160" y="525" font-family="monospace" font-size="24" fill="#303a36">
    <tspan font-weight="bold">gpu-job@3.service:</tspan>
    <tspan x="1102" y="575">CUDA_VISIBLE_DEVICES=3,</tspan>
    <tspan x="1102" y="612">runner --gpu 3</tspan>
  </text>

  
  <rect x="50" y="660" width="1020" height="325" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="75" y="682" width="50" height="50" rx="8"/>
    <path d="M 87 707 h 26 M 105 699 l 8 8 l -8 8"/>
  </g>

  <text x="145" y="718" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Escaping: %i versus %I</text>
  
  <text x="75" y="765" font-family="sans-serif" font-size="24" fill="#303a36">device path '/dev/ttyUSB0' instantiated as 'getty@-dev-ttyUSB0.service'</text>

  
  <rect x="75" y="785" width="970" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="95" y="816" font-family="monospace" font-size="24" fill="#303a36">%i = -dev-ttyUSB0 (escaped, use for file names)</text>

  
  <rect x="75" y="842" width="970" height="44" rx="6" fill="#fef6ed" stroke="#db8129" stroke-width="2.5"/>
  <text x="95" y="873" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">%I = /dev/ttyUSB0 (unescaped, use for arguments)</text>

  
  <rect x="75" y="899" width="970" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="95" y="930" font-family="monospace" font-size="24" fill="#303a36">systemd-escape --path /dev/ttyUSB0 computes the escaped name</text>

  
  <rect x="1100" y="660" width="450" height="325" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1125" y="682" width="50" height="50" rx="8"/>
    <circle cx="1140" cy="698" r="2" fill="#207448"/>
    <line x1="1149" y1="698" x2="1163" y2="698"/>
    <circle cx="1140" cy="707" r="2" fill="#207448"/>
    <line x1="1149" y1="707" x2="1163" y2="707"/>
    <circle cx="1140" cy="716" r="2" fill="#207448"/>
    <line x1="1149" y1="716" x2="1163" y2="716"/>
  </g>

  <text x="1125" y="765" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="28">Other specifiers:</tspan>
    <tspan x="1125" y="810" font-family="monospace">%n full unit name,</tspan>
    <tspan x="1125" y="848" font-family="monospace">%N unescaped name,</tspan>
    <tspan x="1125" y="886" font-family="monospace">%p prefix,</tspan>
    <tspan x="1125" y="924" font-family="monospace">%H hostname,</tspan>
    <tspan x="1125" y="962" font-family="monospace">%u user</tspan>
  </text>

  
  <rect x="50" y="1005" width="1500" height="65" rx="8" fill="#207448"/>
  <text x="800" y="1046" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">When you need one unit per device, write one template rather than many copies</text>
</svg>