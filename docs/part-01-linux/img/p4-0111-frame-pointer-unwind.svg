<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" width="1600" height="1450">
  <title>Call Stack Unwinding via Frame Pointers versus Truncated Stacks</title>
  <desc>Visual comparison of stack memory layouts during CPU profiling with perf record -g, contrasting an intact frame pointer chain with a broken stack omitted frame pointer.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1450" fill="#f5f8f5"/>

  
  <g id="header-group">
    <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Call Stack Unwinding via Frame Pointers versus Truncated Stacks</text>
    
    
    <rect x="630" y="85" width="340" height="46" rx="23" fill="#207448" filter="url(#shadow)"/>
    <text x="800" y="116" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">perf record -g</text>
  </g>

  
  <g id="left-column">
    
    <rect x="50" y="150" width="720" height="1000" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    
    <rect x="70" y="170" width="680" height="74" rx="10" fill="#207448"/>
    <text x="410" y="216" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Intact Frame Pointer Chain (-fno-omit-frame-pointer)</text>

    
    <g id="left-frame-0">
      <rect x="230" y="270" width="460" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="230" y="270" width="460" height="42" rx="10" fill="#207448"/>
      <rect x="230" y="302" width="460" height="10" fill="#207448"/>
      <text x="460" y="300" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 0 (main)</text>
      
      
      <rect x="250" y="322" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="460" y="347" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="250" y="362" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="460" y="387" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>

      <rect id="left-saved-rbp-0" x="250" y="402" width="420" height="34" rx="6" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2"/>
      <text x="460" y="427" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Saved RBP</text>
    </g>

    
    <g id="left-frame-1">
      <rect x="230" y="475" width="460" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="230" y="475" width="460" height="42" rx="10" fill="#207448"/>
      <rect x="230" y="507" width="460" height="10" fill="#207448"/>
      <text x="460" y="505" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 1 (work)</text>
      
      
      <rect x="250" y="527" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="460" y="552" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="250" y="567" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="460" y="592" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>

      <rect id="left-saved-rbp-1" x="250" y="607" width="420" height="34" rx="6" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2"/>
      <text x="460" y="632" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Saved RBP</text>
    </g>

    
    <g id="left-frame-2">
      <rect x="230" y="680" width="460" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="230" y="680" width="460" height="42" rx="10" fill="#207448"/>
      <rect x="230" y="712" width="460" height="10" fill="#207448"/>
      <text x="460" y="710" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 2 (sqrt)</text>
      
      
      <rect x="250" y="732" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="460" y="757" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="250" y="772" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="460" y="797" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>

      <rect id="left-saved-rbp-2" x="250" y="812" width="420" height="34" rx="6" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2"/>
      <text x="460" y="837" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Saved RBP</text>
    </g>

    
    <rect x="75" y="802" width="130" height="54" rx="8" fill="#207448" stroke="#165233" stroke-width="2"/>
    <text x="140" y="837" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">RBP</text>

    
    
    <path d="M 205 829 L 244 829" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    
    <path d="M 250 829 C 175 829, 175 624, 244 624" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <path d="M 250 624 C 175 624, 175 419, 244 419" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="70" y="990" width="680" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="410" y="1030" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">Unwinder Walks Chain to Generate Flame Graph</text>
    <rect x="150" y="1052" width="520" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="410" y="1086" font-family="monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">main -&gt; work -&gt; sqrt</text>
  </g>

  
  <g id="right-column">
    
    <rect x="830" y="150" width="720" height="1000" rx="16" fill="#fbf6f0" stroke="#db8129" stroke-width="2" filter="url(#shadow)"/>
    
    
    <rect x="850" y="170" width="680" height="74" rx="10" fill="#db8129"/>
    <text x="1190" y="216" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Broken Stack (-fomit-frame-pointer)</text>

    
    <g id="right-frame-0">
      <rect x="1010" y="270" width="460" height="140" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
      <rect x="1010" y="270" width="460" height="42" rx="10" fill="#db8129"/>
      <rect x="1010" y="302" width="460" height="10" fill="#db8129"/>
      <text x="1240" y="300" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 0 (main)</text>
      
      
      <rect x="1030" y="322" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="1240" y="347" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="1030" y="362" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#db8129" stroke-width="1.5"/>
      <text x="1240" y="387" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>
    </g>

    
    <g id="right-frame-1">
      <rect x="1010" y="440" width="460" height="140" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
      <rect x="1010" y="440" width="460" height="42" rx="10" fill="#db8129"/>
      <rect x="1010" y="472" width="460" height="10" fill="#db8129"/>
      <text x="1240" y="470" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 1 (work)</text>
      
      
      <rect x="1030" y="492" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="1240" y="517" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="1030" y="532" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#db8129" stroke-width="1.5"/>
      <text x="1240" y="557" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>
    </g>

    
    <g id="right-frame-2">
      <rect x="1010" y="610" width="460" height="140" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
      <rect x="1010" y="610" width="460" height="42" rx="10" fill="#db8129"/>
      <rect x="1010" y="642" width="460" height="10" fill="#db8129"/>
      <text x="1240" y="640" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Frame 2 (sqrt)</text>
      
      
      <rect x="1030" y="662" width="420" height="34" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="1240" y="687" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">local variables</text>

      <rect x="1030" y="702" width="420" height="34" rx="6" fill="#e8f1ea" stroke="#db8129" stroke-width="1.5"/>
      <text x="1240" y="727" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Saved RIP</text>
    </g>

    
    <rect x="850" y="785" width="220" height="120" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <rect x="850" y="785" width="220" height="36" rx="10" fill="#db8129"/>
    <rect x="850" y="811" width="220" height="10" fill="#db8129"/>
    <text x="960" y="811" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">RBP Register</text>
    <text x="960" y="852" font-family="sans-serif" font-size="24" fill="#713f12" text-anchor="middle">holds calculation:</text>
    <text x="960" y="888" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">counter integer 42</text>

    
    <path d="M 1070 845 L 1150 845" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
    
    
    <rect x="1160" y="790" width="350" height="110" rx="10" fill="#ffedd5" stroke="#db8129" stroke-width="2"/>
    <text x="1335" y="828" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9a3412" text-anchor="middle">Invalid Dereference</text>
    <text x="1335" y="858" font-family="sans-serif" font-size="24" fill="#9a3412" text-anchor="middle">Treats 42 as address:</text>
    <text x="1335" y="888" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Unwinder halts at Frame 2</text>

    
    <rect x="850" y="990" width="680" height="135" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="1190" y="1030" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">Truncated Stack (Caller Hierarchy Hidden)</text>
    <rect x="990" y="1052" width="400" height="50" rx="8" fill="#ffedd5" stroke="#db8129" stroke-width="2"/>
    <text x="1190" y="1086" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">sqrt  (or  [unknown])</text>
  </g>

  
  <g id="remedies-group">
    <rect x="50" y="1185" width="1500" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    
    <text x="100" y="1235" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Remedies to Enable Full Profiling Stacks</text>
    
    
    <g id="remedy-1">
      <rect x="80" y="1260" width="445" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <rect x="100" y="1275" width="28" height="28" rx="14" fill="#207448"/>
      <text x="114" y="1296" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="140" y="1297" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">C / C++ Flag</text>
      <rect x="100" y="1318" width="405" height="44" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1"/>
      <text x="302" y="1348" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">-fno-omit-frame-pointer</text>
    </g>

    
    <g id="remedy-2">
      <rect x="555" y="1260" width="490" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <rect x="575" y="1275" width="28" height="28" rx="14" fill="#207448"/>
      <text x="589" y="1296" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="615" y="1297" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Java Runtime Flag</text>
      <rect x="575" y="1318" width="450" height="44" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1"/>
      <text x="800" y="1348" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">JVM -XX:+PreserveFramePointer</text>
    </g>

    
    <g id="remedy-3">
      <rect x="1075" y="1260" width="455" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <rect x="1095" y="1275" width="28" height="28" rx="14" fill="#207448"/>
      <text x="1109" y="1296" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="1135" y="1297" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DWARF Unwinding</text>
      <rect x="1095" y="1318" width="415" height="44" rx="6" fill="#f5f8f5" stroke="#cbd5e1" stroke-width="1"/>
      <text x="1302" y="1348" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">perf --call-graph dwarf</text>
    </g>
  </g>
</svg>