<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The kernel compares numbers</title>
  <desc>Visual comparison showing how the kernel evaluates process UID and GID against file permission bits to allow or deny access, with root bypassing checks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The kernel compares numbers</text>

  
  <g transform="translate(80, 140)">
    <rect width="390" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(167, 24)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="44" rx="6" />
      <line x1="0" y1="14" x2="56" y2="14" />
      <circle cx="10" cy="7" r="2" fill="#207448" />
      <circle cx="18" cy="7" r="2" fill="#207448" />
      <path d="M 12 28 L 20 33 L 12 38" />
      <line x1="26" y1="38" x2="38" y2="38" />
    </g>
    <text x="195" y="116" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">a process</text>
    <text x="195" y="156" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">runs as UID and GID</text>
  </g>

  
  <g transform="translate(530, 140)">
    <rect width="540" height="190" rx="16" fill="#207448" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(242, 22)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="6" x2="28" y2="46" />
      <line x1="14" y1="46" x2="42" y2="46" />
      <line x1="8" y1="16" x2="48" y2="16" />
      
      <path d="M 8 16 L 2 30 L 14 30 Z" />
      
      <path d="M 48 16 L 42 30 L 54 30 Z" />
    </g>
    <text x="270" y="128" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">kernel compares the numbers</text>
  </g>

  
  <g transform="translate(1130, 140)">
    <rect width="390" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(167, 24)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 0 L 36 0 L 48 14 L 48 50 L 8 50 Z" />
      <polyline points="36,0 36,14 48,14" />
      <line x1="16" y1="24" x2="38" y2="24" />
      <line x1="16" y1="34" x2="38" y2="34" />
    </g>
    <text x="195" y="112" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">a file</text>
    <text x="195" y="148" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">owner, group and</tspan>
      <tspan x="195" dy="28">permission bits</tspan>
    </text>
  </g>

  
  <line x1="470" y1="235" x2="520" y2="235" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="1130" y1="235" x2="1080" y2="235" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="800" y1="330" x2="800" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(600, 390)">
    <rect width="400" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(172, 16)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="20" width="36" height="26" rx="4" />
      <path d="M 18 20 L 18 12 A 10 10 0 0 1 38 12 L 38 20" />
      <circle cx="28" cy="33" r="2" fill="#207448" />
    </g>
    <text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">allow or deny</text>
  </g>

  
  <g transform="translate(250, 570)">
    <rect width="1100" height="96" rx="48" fill="#db8129" stroke="#b86214" stroke-width="2" />
    
    <g transform="translate(48, 24)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="32" height="32" rx="4" />
      <line x1="16" y1="2" x2="16" y2="8" />
      <line x1="32" y1="2" x2="32" y2="8" />
      <line x1="16" y1="40" x2="16" y2="46" />
      <line x1="32" y1="40" x2="32" y2="46" />
      <line x1="2" y1="16" x2="8" y2="16" />
      <line x1="2" y1="32" x2="8" y2="32" />
      <line x1="40" y1="16" x2="46" y2="16" />
      <line x1="40" y1="32" x2="46" y2="32" />
    </g>
    <text x="575" y="58" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">root has UID 0 and bypasses most permission checks</text>
  </g>

  
  <g transform="translate(80, 740)">
    <rect width="1440" height="84" rx="16" fill="#207448" />
    <text x="720" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">the kernel enforces access on numbers, not names</text>
  </g>
</svg>