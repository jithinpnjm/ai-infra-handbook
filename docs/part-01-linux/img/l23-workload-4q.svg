<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" style="background-color: #f5f8f5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Characterise the load first</title>
  <desc>Visual infographic explaining how to characterise the load first across who is causing it, why it is issued, its characteristics, and how it changes over time, surrounding the load as input not performance.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="68" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Characterise the load first</text>

  
  <g id="box-who">
    <rect x="50" y="120" width="480" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(262, 142)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="18" r="12" />
      <path d="M 8 48 C 8 36, 16 32, 28 32 C 40 32, 48 36, 48 48" />
    </g>
    
    <text x="290" y="240" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Who is causing the load</text>
    
    <text x="290" y="302" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="290" dy="0">user, job, tenant,</tspan>
      <tspan x="290" dy="36">client IP, process</tspan>
    </text>
  </g>

  
  <g id="box-why">
    <rect x="50" y="480" width="480" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(262, 502)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="18,16 8,28 18,40" />
      <polyline points="38,16 48,28 38,40" />
      <line x1="32" y1="12" x2="24" y2="44" />
    </g>
    
    <text x="290" y="600" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Why is it issued</text>
    
    <text x="290" y="662" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="290" dy="0">code path, stack trace,</tspan>
      <tspan x="290" dy="36">API, dataset</tspan>
    </text>
  </g>

  
  <g id="box-central">
    <rect x="570" y="350" width="460" height="220" rx="20" fill="#ffffff" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(772, 372)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="6,10 50,10 34,30 34,46 22,46 22,30" />
      <line x1="28" y1="4" x2="28" y2="10" />
    </g>
    
    <text x="800" y="475" font-size="34" font-weight="bold" fill="#207448" text-anchor="middle">the load</text>
    <text x="800" y="525" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">(input, not performance)</text>
  </g>

  
  <g id="box-what">
    <rect x="1070" y="120" width="480" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1282, 138)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="8" y1="16" x2="48" y2="16" />
      <circle cx="20" cy="16" r="5" fill="#e8f1ea" />
      <line x1="8" y1="28" x2="48" y2="28" />
      <circle cx="36" cy="28" r="5" fill="#e8f1ea" />
      <line x1="8" y1="40" x2="48" y2="40" />
      <circle cx="24" cy="40" r="5" fill="#e8f1ea" />
    </g>
    
    <text x="1310" y="224" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="1310" dy="0">What are its</tspan>
      <tspan x="1310" dy="36">characteristics</tspan>
    </text>
    
    <text x="1310" y="302" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1310" dy="0">IOPS, bytes, read/write mix,</tspan>
      <tspan x="1310" dy="34">request size, batch size,</tspan>
      <tspan x="1310" dy="34">include variance</tspan>
    </text>
  </g>

  
  <g id="box-how">
    <rect x="1070" y="480" width="480" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1282, 500)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="20" />
      <polyline points="28,16 28,28 36,28" />
    </g>
    
    <text x="1310" y="584" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="1310" dy="0">How does it change</tspan>
      <tspan x="1310" dy="36">over time</tspan>
    </text>
    
    <text x="1310" y="668" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1310" dy="0">daily pattern, ramp,</tspan>
      <tspan x="1310" dy="36">bursts, per epoch</tspan>
    </text>
  </g>

  
  <g id="orange-note">
    <rect x="120" y="840" width="1360" height="150" rx="16" fill="#fdf3e7" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(160, 887)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 8 L 48 46 L 8 46 Z" />
      <line x1="28" y1="22" x2="28" y2="32" />
      <circle cx="28" cy="39" r="1.5" fill="#db8129" />
    </g>
    
    <text x="245" y="908" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="245" dy="0">an unexpected client may be an attack,</tspan>
      <tspan x="245" dy="38">a mis-deployed cron job or a runaway retry loop</tspan>
    </text>
  </g>
</svg>