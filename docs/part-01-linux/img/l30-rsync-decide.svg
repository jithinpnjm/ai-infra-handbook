<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>How rsync decides what to send</title>
  <desc>Visual explanation of the rsync quick check algorithm, match and difference branches, safeguards table, and dry-run testing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">How rsync decides what to send</text>

  

  
  <rect x="50" y="110" width="900" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  <text x="80" y="155" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Decision flow</text>

  
  <rect x="90" y="180" width="820" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="130" cy="225" r="24" fill="#207448" />
  <text x="130" y="234" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">1</text>

  
  <g transform="translate(180, 197)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <circle cx="28" cy="28" r="24" />
    <polyline points="28,14 28,28 38,34" />
  </g>

  
  <text x="260" y="235" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
    <tspan x="260" dy="0">source and destination compared by quick check:</tspan>
    <tspan x="260" dy="44" fill="#207448">size and modification time</tspan>
  </text>
  <text x="130" y="335" font-family="sans-serif" font-size="24px" fill="#303a36">Fast default: inspects metadata only without reading full file content</text>

  
  
  <path d="M 300 370 L 300 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <path d="M 700 370 L 700 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="90" y="470" width="390" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(120, 495)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <polyline points="18,28 25,35 38,20" />
  </g>
  <text x="190" y="534" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Match then skip</text>
  <text x="120" y="605" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="120" dy="0">Files match in both size</tspan>
    <tspan x="120" dy="38">and mtime.</tspan>
    <tspan x="120" dy="46" font-weight="bold" fill="#207448">Zero transfer overhead.</tspan>
  </text>

  
  <rect x="520" y="470" width="390" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(550, 495)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="18" height="18" />
    <rect x="30" y="8" width="18" height="18" fill="#e8f1ea" />
    <rect x="6" y="32" width="18" height="18" />
    <rect x="30" y="32" width="18" height="18" />
  </g>
  <text x="620" y="534" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">different</text>
  <text x="550" y="605" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="550" dy="0">then send only</tspan>
    <tspan x="550" dy="38">the changed blocks</tspan>
    <tspan x="550" dy="46" font-weight="bold" fill="#207448">Rolling-checksum delta.</tspan>
  </text>

  

  
  <rect x="990" y="110" width="560" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  
  <g transform="translate(1020, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 10 14 L 10 30 C 10 44 28 54 28 54 C 28 54 46 44 46 30 L 46 14 Z" />
  </g>
  <text x="1090" y="168" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Safeguards</text>

  
  
  <g transform="translate(1020, 205)">
    <rect width="500" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="42" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">-c</text>
    <text x="75" y="42" font-family="monospace" font-size="24px" fill="#303a36">checksum (slower, thorough)</text>
    <text x="20" y="78" font-family="sans-serif" font-size="24px" fill="#303a36">Bypasses quick check; reads all bytes</text>
  </g>

  
  <g transform="translate(1020, 317)">
    <rect width="500" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="48" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">--ignore-existing</text>
  </g>

  
  <g transform="translate(1020, 409)">
    <rect width="500" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="48" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">-b backup</text>
  </g>

  
  <g transform="translate(1020, 501)">
    <rect width="500" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="42" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">-u</text>
    <text x="65" y="42" font-family="monospace" font-size="24px" fill="#303a36">skip files newer at destination</text>
    <text x="20" y="72" font-family="sans-serif" font-size="24px" fill="#303a36">Protects target changes</text>
  </g>

  
  <g transform="translate(1020, 605)">
    <rect width="500" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="48" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">-P partial plus progress</text>
  </g>

  

  
  <rect x="50" y="800" width="1500" height="150" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" filter="url(#shadow)" />
  
  
  <g transform="translate(85, 845)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 52 48 L 4 48 Z" />
    <line x1="28" y1="22" x2="28" y2="34" />
    <circle cx="28" cy="42" r="2" fill="#db8129" />
  </g>

  
  <text x="165" y="860" font-family="sans-serif" font-size="26px" fill="#303a36">
    <tspan x="165" dy="0">a second rsync -av should list nothing, but the quick check trusts two numbers,</tspan>
    <tspan x="165" dy="42">so use </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#db8129">-c</tspan>
    <tspan> for data you cannot rebuild.</tspan>
  </text>

  
  <rect x="50" y="980" width="1500" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(85, 1002)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="48" height="38" rx="6" />
    <polyline points="14,24 22,30 14,36" />
    <line x1="26" y1="36" x2="38" y2="36" />
  </g>

  <text x="165" y="1042" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
    <tspan fill="#207448">Dry run:</tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#303a36"> rsync -nva dir host:dest_dir</tspan>
  </text>

</svg>