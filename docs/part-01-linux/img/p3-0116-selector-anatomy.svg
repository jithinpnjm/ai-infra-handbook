<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading an rsyslog rule: selector on the left, action on the right</title>
  <desc>Visual infographic explaining rsyslog rule syntax with selector on the left and action on the right, covering grammar, action marks, facilities, severities, and validation commands.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Reading an rsyslog rule:</tspan>
    <tspan x="800" dy="55">selector on the left, action on the right</tspan>
  </text>

  
  <rect x="40" y="140" width="1520" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 40 152 Q 40 140 52 140 L 1548 140 Q 1560 140 1560 152 L 1560 188 L 40 188 Z" fill="#e8f1ea"/>
  <line x1="40" y1="188" x2="1560" y2="188" stroke="#207448" stroke-width="2"/>
  
  
  <line x1="780" y1="140" x2="780" y2="440" stroke="#207448" stroke-width="2"/>

  
  <text x="410" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">selector</text>
  <text x="1170" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">action</text>

  
  <rect x="41" y="230" width="1518" height="42" fill="#f5f8f5"/>
  <rect x="41" y="314" width="1518" height="42" fill="#f5f8f5"/>
  <rect x="41" y="398" width="1518" height="41" rx="0 0 11 11" fill="#f5f8f5"/>

  
  <line x1="40" y1="230" x2="1560" y2="230" stroke="#d5dfd7" stroke-width="1"/>
  <line x1="40" y1="272" x2="1560" y2="272" stroke="#d5dfd7" stroke-width="1"/>
  <line x1="40" y1="314" x2="1560" y2="314" stroke="#d5dfd7" stroke-width="1"/>
  <line x1="40" y1="356" x2="1560" y2="356" stroke="#d5dfd7" stroke-width="1"/>
  <line x1="40" y1="398" x2="1560" y2="398" stroke="#d5dfd7" stroke-width="1"/>

  
  <text x="70" y="218" font-family="monospace" font-size="24" fill="#303a36">auth,authpriv.*</text>
  <text x="810" y="218" font-family="monospace" font-size="24" fill="#303a36">/var/log/auth.log</text>

  
  <text x="70" y="260" font-family="monospace" font-size="24" fill="#303a36">*.*;auth,authpriv.none</text>
  <text x="810" y="260" font-family="monospace" font-size="24" fill="#303a36">-/var/log/syslog</text>

  
  <text x="70" y="302" font-family="monospace" font-size="24" fill="#303a36">mail.err</text>
  <text x="810" y="302" font-family="monospace" font-size="24" fill="#303a36">/var/log/mail.err</text>

  
  <text x="70" y="344" font-family="monospace" font-size="24" fill="#303a36">local3.*</text>
  <text x="810" y="344" font-family="monospace" font-size="24" fill="#303a36">/var/log/gpu-health.log</text>

  
  <text x="70" y="386" font-family="monospace" font-size="24" fill="#303a36">*.emerg</text>
  <text x="810" y="386" font-family="monospace" font-size="24" fill="#303a36">:omusrmsg:*</text>

  
  <text x="70" y="428" font-family="monospace" font-size="24" fill="#303a36">*.warning</text>
  <text x="810" y="428" font-family="monospace" font-size="24" fill="#303a36">@@logs.example.com:514</text>

  
  <rect x="40" y="465" width="480" height="490" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 64 485 L 112 485 L 94 513 L 94 537 L 82 531 L 82 513 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <text x="126" y="514" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Selector grammar</text>

  
  <rect x="60" y="550" width="440" height="42" rx="8" fill="#ffffff"/>
  <text x="80" y="579" font-family="sans-serif" font-size="24" fill="#303a36">* matches any value</text>

  <rect x="60" y="602" width="440" height="42" rx="8" fill="#ffffff"/>
  <text x="80" y="631" font-family="sans-serif" font-size="24" fill="#303a36">.none excludes</text>

  <rect x="60" y="654" width="440" height="42" rx="8" fill="#ffffff"/>
  <text x="80" y="683" font-family="sans-serif" font-size="24" fill="#303a36">= selects exactly one severity</text>

  <rect x="60" y="706" width="440" height="42" rx="8" fill="#ffffff"/>
  <text x="80" y="735" font-family="sans-serif" font-size="24" fill="#303a36">! negates</text>

  
  <rect x="60" y="760" width="440" height="175" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="80" y="796" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">A severity includes</tspan>
    <tspan x="80" dy="32">every more severe level:</tspan>
    <tspan x="80" dy="32">mail.err covers err,</tspan>
    <tspan x="80" dy="32">crit, alert and emerg</tspan>
  </text>

  
  <rect x="550" y="465" width="430" height="490" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="574" y="485" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 584 505 L 594 513 L 584 521" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="598" y1="521" x2="612" y2="521" stroke="#207448" stroke-width="3"/>
  <text x="638" y="514" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Action marks</text>

  
  <rect x="570" y="550" width="390" height="85" rx="8" fill="#ffffff"/>
  <text x="590" y="584" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="590" dy="0">leading - =</tspan>
    <tspan x="590" dy="32">do not fsync each line</tspan>
  </text>

  <rect x="570" y="650" width="390" height="85" rx="8" fill="#ffffff"/>
  <text x="590" y="684" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="590" dy="0">:omusrmsg:* = broadcast</tspan>
    <tspan x="590" dy="32">to logged-in users</tspan>
  </text>

  <rect x="570" y="750" width="390" height="85" rx="8" fill="#ffffff"/>
  <text x="590" y="800" font-family="sans-serif" font-size="24" fill="#303a36">@ = forward over UDP</text>

  <rect x="570" y="850" width="390" height="85" rx="8" fill="#ffffff"/>
  <text x="590" y="900" font-family="sans-serif" font-size="24" fill="#303a36">@@ = forward over TCP</text>

  
  <rect x="1010" y="465" width="550" height="490" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 1032 490 L 1056 482 L 1080 490 C 1080 514 1056 532 1056 532 C 1056 532 1032 514 1032 490 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <text x="1094" y="514" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Facility and severity</text>

  
  <rect x="1030" y="550" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="578" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">0 emerg</text>

  <rect x="1030" y="598" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="626" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1 alert</text>

  <rect x="1030" y="646" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="674" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">2 crit</text>

  <rect x="1030" y="694" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="722" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">3 err</text>

  <rect x="1030" y="742" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="770" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">4 warning</text>

  <rect x="1030" y="790" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="818" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">5 notice</text>

  <rect x="1030" y="838" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="866" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">6 info</text>

  <rect x="1030" y="886" width="160" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1110" y="914" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">7 debug</text>

  
  <line x1="1208" y1="906" x2="1208" y2="556" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  
  <text x="1224" y="566" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1224" dy="0">0 is the</tspan>
    <tspan x="1224" dy="28">most urgent</tspan>
  </text>

  
  <rect x="1224" y="626" width="316" height="300" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1242" y="658" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1242" dy="0">facilities: kern,</tspan>
    <tspan x="1242" dy="32">user, mail, daemon,</tspan>
    <tspan x="1242" dy="32">auth/authpriv,</tspan>
    <tspan x="1242" dy="32">syslog, lpr, news,</tspan>
    <tspan x="1242" dy="32">uucp, cron, ftp,</tspan>
    <tspan x="1242" dy="32">plus local0 to</tspan>
    <tspan x="1242" dy="32">local7 for your</tspan>
    <tspan x="1242" dy="32">own applications</tspan>
  </text>

  
  <rect x="40" y="975" width="1520" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="60" y="995" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 70 1010 L 78 1015 L 70 1020" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="1020" x2="94" y2="1020" stroke="#207448" stroke-width="2.5"/>

  
  <text x="126" y="1022" font-family="monospace" font-size="24" fill="#303a36">logger -p local3.warning -t gpu-health "XID 79 on GPU 3"</text>
  <text x="126" y="1068" font-family="monospace" font-size="24" fill="#303a36">rsyslogd -N1</text>
  <text x="440" y="1068" font-family="monospace" font-size="24" fill="#303a36">sudo systemctl restart rsyslog</text>

  
  <rect x="40" y="1115" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1155" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Test a rule with logger before you trust it</text>
</svg>