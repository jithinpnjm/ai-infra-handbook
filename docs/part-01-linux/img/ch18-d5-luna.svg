<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270">
  <title>Troubleshooting</title>
  <desc>A flowchart tracing troubleshooting steps from a latency symptom through CPU, cgroup, and clock checks to possible causes.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#db8129"/>
    </marker>
    <style>
      .bg { fill: #f5f8f5; }
      .card { fill: #e8f1ea; stroke: #207448; stroke-width: 3; }
      .title { fill: #303a36; font: 700 48px sans-serif; }
      .body { fill: #303a36; font: 24px sans-serif; }
      .strong { fill: #303a36; font: 700 30px sans-serif; }
      .mono { fill: #303a36; font: 24px monospace; }
      .edge-label { fill: #303a36; font: 24px sans-serif; }
      .connector { fill: none; stroke: #207448; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-green); }
      .main-connector { fill: none; stroke: #db8129; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-orange); }
      .icon { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1270"/>
  <text class="title" x="800" y="64" text-anchor="middle">Troubleshooting</text>

  
  <rect class="card" x="560" y="100" width="480" height="130" rx="18"/>
  <rect class="card" x="560" y="285" width="480" height="165" rx="18"/>
  <rect class="card" x="40" y="500" width="480" height="220" rx="18"/>
  <rect class="card" x="560" y="500" width="480" height="190" rx="18"/>
  <rect class="card" x="1080" y="500" width="480" height="180" rx="18"/>
  <rect class="card" x="40" y="760" width="480" height="180" rx="18"/>
  <rect class="card" x="560" y="760" width="480" height="180" rx="18"/>
  <rect class="card" x="40" y="990" width="480" height="230" rx="18"/>
  <rect class="card" x="560" y="990" width="480" height="230" rx="18"/>
  <rect class="card" x="1080" y="990" width="480" height="230" rx="18"/>

  
  <path class="main-connector" d="M800 230 V285"/>
  <path class="connector" d="M650 450 V478 H280 V500"/>
  <path class="connector" d="M800 450 V500"/>
  <path class="connector" d="M950 450 V478 H1320 V500"/>
  <path class="connector" d="M1140 680 V730 H280 V760"/>
  <path class="connector" d="M1480 680 V744 H800 V760"/>
  <path class="connector" d="M620 940 V960 H280 V990"/>
  <path class="connector" d="M800 940 V990"/>
  <path class="connector" d="M980 940 V960 H1320 V990"/>

  
  <g class="icon" transform="translate(580 137)">
    <path d="M28 3 L53 48 H3 Z"/>
    <path d="M28 17 V32 M28 40 V41"/>
  </g>
  <g class="icon" transform="translate(580 328)">
    <rect x="10" y="10" width="38" height="38" rx="5"/>
    <path d="M18 18 H40 V40 H18 Z M20 2 V10 M30 2 V10 M40 2 V10 M20 48 V56 M30 48 V56 M40 48 V56 M2 20 H10 M2 30 H10 M2 40 H10 M48 20 H56 M48 30 H56 M48 40 H56"/>
  </g>
  <g class="icon" transform="translate(60 535)">
    <path d="M28 4 L50 13 V29 C50 42 41 51 28 56 C15 51 6 42 6 29 V13 Z"/>
    <path d="M18 29 L25 36 L39 21"/>
  </g>
  <g class="icon" transform="translate(580 548)">
    <rect x="4" y="4" width="52" height="44" rx="4"/>
    <path d="M4 15 H56 M12 38 L22 29 L31 34 L45 21"/>
    <circle cx="13" cy="10" r="1.5" fill="#207448"/>
    <circle cx="20" cy="10" r="1.5" fill="#207448"/>
  </g>
  <g class="icon" transform="translate(1100 553)">
    <rect x="7" y="20" width="46" height="34" rx="4"/>
    <path d="M18 20 V12 A12 12 0 0 1 42 12 V20 M30 32 V43"/>
    <circle cx="30" cy="31" r="3"/>
  </g>
  <g class="icon" transform="translate(60 819)">
    <circle cx="30" cy="28" r="24"/>
    <path d="M30 12 V28 L42 35 M30 4 V8"/>
  </g>
  <g class="icon" transform="translate(580 818)">
    <circle cx="30" cy="29" r="24"/>
    <path d="M30 14 V29 L41 35 M30 5 V9 M30 49 V53 M6 29 H10 M50 29 H54"/>
  </g>
  <g class="icon" transform="translate(60 1048)">
    <rect x="5" y="6" width="50" height="18" rx="3"/>
    <rect x="5" y="34" width="50" height="18" rx="3"/>
    <path d="M14 15 H15 M14 43 H15 M24 15 H46 M24 43 H46"/>
  </g>
  <g class="icon" transform="translate(580 1048)">
    <path d="M30 4 V19 M30 37 V54 M4 29 H19 M41 29 H56 M12 11 L22 21 M38 37 L48 47 M48 11 L38 21 M22 37 L12 47"/>
    <circle cx="30" cy="29" r="12"/>
    <path d="M30 21 V29 L36 33"/>
  </g>
  <g class="icon" transform="translate(1100 1048)">
    <rect x="4" y="5" width="22" height="22" rx="3"/>
    <rect x="34" y="5" width="22" height="22" rx="3"/>
    <rect x="19" y="34" width="22" height="22" rx="3"/>
    <path d="M26 16 H34 M15 27 L25 36 M45 27 L35 36"/>
  </g>

  
  <text class="body" x="660" y="151">
    <tspan x="660" dy="0">Symptom: slow / latency</tspan>
    <tspan x="660" dy="32">spikes / jitter</tspan>
  </text>

  
  <text x="660" y="337">
    <tspan class="strong" x="660" dy="0">CPU saturated?</tspan>
    <tspan class="mono" x="660" dy="34">mpstat, runqlat,</tspan>
    <tspan class="mono" x="660" dy="30">PSI cpu</tspan>
  </text>

  
  <text x="140" y="538">
    <tspan class="body" x="140" dy="0">Single-thread</tspan>
    <tspan class="body" x="140" dy="29">bottleneck or IRQs:</tspan>
    <tspan class="mono" x="140" dy="31">per-thread top -H,</tspan>
    <tspan class="mono" x="140" dy="29">/proc/interrupts,</tspan>
    <tspan class="mono" x="140" dy="29">RPS/RSS, pin IRQs</tspan>
  </text>

  
  <text class="body" x="660" y="542">
    <tspan x="660" dy="0">Profile (perf, flame</tspan>
    <tspan x="660" dy="30">graph); is IPC low</tspan>
    <tspan x="660" dy="30">(memory-bound) or high?</tspan>
  </text>

  
  <text x="1180" y="542">
    <tspan class="strong" x="1180" dy="0">In a cgroup with</tspan>
    <tspan class="strong" x="1180" dy="34">cpu.max?</tspan>
    <tspan class="mono" x="1180" dy="32">cat cpu.stat</tspan>
  </text>

  
  <text class="body" x="140" y="805">
    <tspan x="140" dy="0">Quota throttling:</tspan>
    <tspan x="140" dy="30">raise/remove limit,</tspan>
    <tspan x="140" dy="30">fewer threads,</tspan>
    <tspan class="mono" x="140" dy="30">GOMAXPROCS/OMP</tspan>
  </text>

  
  <text x="660" y="797">
    <tspan class="strong" x="660" dy="0">Steal time or</tspan>
    <tspan class="strong" x="660" dy="34">low clocks?</tspan>
    <tspan class="mono" x="660" dy="32">%steal, turbostat,</tspan>
    <tspan class="mono" x="660" dy="29">dmesg thermal</tspan>
  </text>

  
  <text class="body" x="140" y="1030">
    <tspan x="140" dy="0">Noisy neighbour /</tspan>
    <tspan x="140" dy="30">over-committed host:</tspan>
    <tspan x="140" dy="30">move or resize</tspan>
  </text>

  
  <text class="body" x="660" y="1030">
    <tspan x="660" dy="0">Governor, power cap,</tspan>
    <tspan x="660" dy="30">thermal throttling,</tspan>
    <tspan x="660" dy="30">C-states</tspan>
  </text>

  
  <text x="1180" y="1021">
    <tspan class="body" x="1180" dy="0">Migration/NUMA:</tspan>
    <tspan class="mono" x="1180" dy="29">perf stat</tspan>
    <tspan class="mono" x="1180" dy="28">cpu-migrations,</tspan>
    <tspan class="mono" x="1180" dy="28">numastat; bind with</tspan>
    <tspan class="mono" x="1180" dy="28">numactl/cpuset;</tspan>
    <tspan class="body" x="1180" dy="28">memory or I/O cgroup</tspan>
    <tspan class="body" x="1180" dy="28">pressure?</tspan>
  </text>

  
  <rect x="350" y="448" width="250" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="475" y="471" text-anchor="middle">yes, some CPUs hot</text>
  <rect x="815" y="448" width="175" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="902" y="471" text-anchor="middle">yes, all busy</text>
  <rect x="1140" y="448" width="60" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="1170" y="471" text-anchor="middle">no</text>
  <rect x="570" y="696" width="270" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="705" y="719" text-anchor="middle">nr_throttled rising</text>
  <rect x="1200" y="708" width="60" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="1230" y="731" text-anchor="middle">no</text>
  <rect x="365" y="926" width="86" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="408" y="949" text-anchor="middle">steal</text>
  <rect x="818" y="946" width="125" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="880" y="969" text-anchor="middle">low MHz</text>
  <rect x="1090" y="926" width="66" height="30" rx="8" fill="#f5f8f5"/>
  <text class="edge-label" x="1123" y="949" text-anchor="middle">no</text>
</svg>