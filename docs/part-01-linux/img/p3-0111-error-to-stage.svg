<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Which startup stage produced this error message</title>
  <desc>Visual infographic mapping Linux startup pipeline stages to their respective error messages and diagnostic commands.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Which startup stage produced this error message</text>

  
  
  <line x1="160" y1="175" x2="1440" y2="175" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" />

  
  <g id="stage1">
    <rect x="40" y="85" width="225" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="70" cy="118" r="22" fill="#207448" />
    <text x="70" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <rect x="195" y="100" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 203 112 L 211 117 L 203 122 M 215 124 L 227 124" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="55" y="174" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">shell fork and</text>
    <text x="55" y="206" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">execve</text>
  </g>

  
  <line x1="265" y1="175" x2="295" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="stage2">
    <rect x="300" y="85" width="225" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="330" cy="118" r="22" fill="#207448" />
    <text x="330" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <circle cx="485" cy="117" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 485 97 L 485 103 M 485 131 L 485 137 M 465 117 L 471 117 M 499 117 L 505 117 M 471 103 L 475 107 M 495 127 L 499 131 M 471 131 L 475 127 M 495 107 L 499 103" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="315" y="162" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">kernel checks the</text>
    <text x="315" y="192" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">file and picks a</text>
    <text x="315" y="222" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">format handler</text>
  </g>

  
  <line x1="525" y1="175" x2="555" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="stage3">
    <rect x="560" y="85" width="225" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="590" cy="118" r="22" fill="#207448" />
    <text x="590" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <path d="M 720 106 L 744 114 L 720 122 L 696 114 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M 696 120 L 720 128 L 744 120" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M 696 126 L 720 134 L 744 126" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="575" y="162" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ELF loader maps</text>
    <text x="575" y="192" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">LOAD segments,</text>
    <text x="575" y="222" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">builds the stack</text>
  </g>

  
  <line x1="785" y1="175" x2="815" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="stage4">
    <rect x="820" y="85" width="225" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="850" cy="118" r="22" fill="#207448" />
    <text x="850" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <path d="M 978 126 A 9 9 0 0 1 978 110 L 988 102 A 9 9 0 0 1 1002 116 L 996 122" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 984 116 L 968 128 A 9 9 0 0 0 982 142 L 992 134" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="835" y="156" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">PT_INTERP: kernel</text>
    <text x="835" y="184" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">maps ld.so,</text>
    <text x="835" y="212" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">execution starts</text>
    <text x="835" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">in dynamic linker</text>
  </g>

  
  <line x1="1045" y1="175" x2="1075" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="stage5">
    <rect x="1080" y="85" width="235" height="175" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3.5" />
    <circle cx="1110" cy="118" r="22" fill="#db8129" />
    <text x="1110" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <rect x="1245" y="100" width="12" height="32" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="1261" y="96" width="12" height="36" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="1277" y="104" width="12" height="28" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <text x="1095" y="156" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ld.so loads</text>
    <text x="1095" y="184" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DT_NEEDED libraries,</text>
    <text x="1095" y="212" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">relocates, runs</text>
    <text x="1095" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">constructors</text>
  </g>

  
  <line x1="1315" y1="175" x2="1345" y2="175" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="stage6">
    <rect x="1350" y="85" width="210" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1380" cy="118" r="22" fill="#207448" />
    <text x="1380" y="126" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <rect x="1496" y="100" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <polygon points="1512,110 1528,117 1512,124" fill="#207448" />
    <text x="1365" y="166" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">_start,</text>
    <text x="1365" y="196" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">__libc_start_main,</text>
    <text x="1365" y="226" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">main</text>
  </g>

  
  
  <path d="M 282 260 L 282 300 L 222 300 L 222 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 932 260 L 932 300 L 610 300 L 610 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1197 260 L 1197 300 L 1000 300 L 1000 330" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <path d="M 1455 260 L 1455 300 L 1385 300 L 1385 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  

  
  <g id="col-stage12">
    
    <rect x="40" y="340" width="365" height="920" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="40" y="340" width="365" height="60" rx="12" fill="#207448" />
    <rect x="40" y="380" width="365" height="20" fill="#207448" />
    <text x="222" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 1/2</text>

    
    <g transform="translate(56, 420)">
      <rect x="0" y="0" width="333" height="290" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Exec format error</text>
      <text x="18" y="70" font-family="sans-serif" font-size="24" fill="#303a36">(wrong CPU</text>
      <text x="18" y="102" font-family="sans-serif" font-size="24" fill="#303a36">architecture such as</text>
      <text x="18" y="134" font-family="monospace" font-size="24" fill="#207448">x86-64</text>
      <text x="108" y="134" font-family="sans-serif" font-size="24" fill="#303a36">on</text>
      <text x="146" y="134" font-family="monospace" font-size="24" fill="#207448">aarch64</text>
      <text x="246" y="134" font-family="sans-serif" font-size="24" fill="#303a36">,</text>
      <text x="18" y="166" font-family="sans-serif" font-size="24" fill="#303a36">or a script without</text>
      <text x="18" y="198" font-family="sans-serif" font-size="24" fill="#303a36">shebang)</text>
    </g>

    
    <g transform="translate(56, 730)">
      <rect x="0" y="0" width="333" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">exit 126</text>
      <text x="18" y="78" font-family="sans-serif" font-size="24" fill="#303a36">found but not executable</text>
    </g>

    
    <g transform="translate(56, 860)">
      <rect x="0" y="0" width="333" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="44" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">exit 127</text>
      <text x="18" y="76" font-family="sans-serif" font-size="24" fill="#303a36">not found</text>
    </g>

    
    <g transform="translate(56, 1100)">
      <rect x="0" y="0" width="333" height="135" rx="8" fill="#207448" />
      <text x="166" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">First check:</text>
      <text x="166" y="90" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">file and readelf -h</text>
    </g>
  </g>

  
  <g id="col-stage4">
    
    <rect x="425" y="340" width="370" height="920" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="425" y="340" width="370" height="60" rx="12" fill="#207448" />
    <rect x="425" y="380" width="370" height="20" fill="#207448" />
    <text x="610" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 4</text>

    
    <g transform="translate(441, 420)">
      <rect x="0" y="0" width="338" height="540" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">bad ELF interpreter /</text>
      <text x="18" y="74" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">not found for a file</text>
      <text x="18" y="108" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">that exists</text>
      <text x="18" y="152" font-family="sans-serif" font-size="24" fill="#303a36">(glibc binary on Alpine</text>
      <text x="18" y="186" font-family="sans-serif" font-size="24" fill="#303a36">musl:</text>
      <text x="18" y="226" font-family="monospace" font-size="24" fill="#207448">/lib64/ld-linux-</text>
      <text x="18" y="258" font-family="monospace" font-size="24" fill="#207448">x86-64.so.2</text>
      <text x="18" y="296" font-family="sans-serif" font-size="24" fill="#303a36">missing)</text>
    </g>

    
    <g transform="translate(441, 1100)">
      <rect x="0" y="0" width="338" height="135" rx="8" fill="#207448" />
      <text x="169" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">First check:</text>
      <text x="169" y="80" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">readelf -l |</text>
      <text x="169" y="112" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">grep interpreter</text>
    </g>
  </g>

  
  <g id="col-stage5">
    
    <rect x="815" y="340" width="370" height="920" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    
    <rect x="815" y="340" width="370" height="60" rx="12" fill="#db8129" />
    <rect x="815" y="380" width="370" height="20" fill="#db8129" />
    <text x="1000" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 5</text>

    
    <g transform="translate(831, 420)">
      <rect x="0" y="0" width="338" height="125" rx="8" fill="#fff0e2" stroke="#db8129" stroke-width="1.5" />
      <text x="18" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">libcuda.so.1:</text>
      <text x="18" y="70" font-family="sans-serif" font-size="24" fill="#303a36">cannot open shared</text>
      <text x="18" y="102" font-family="sans-serif" font-size="24" fill="#303a36">object file</text>
    </g>

    
    <g transform="translate(831, 560)">
      <rect x="0" y="0" width="338" height="145" rx="8" fill="#fff0e2" stroke="#db8129" stroke-width="1.5" />
      <text x="18" y="38" font-family="sans-serif" font-size="24" fill="#303a36">error while loading</text>
      <text x="18" y="70" font-family="sans-serif" font-size="24" fill="#303a36">shared libraries:</text>
      <text x="18" y="108" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">libnccl.so.2</text>
    </g>

    
    <g transform="translate(831, 720)">
      <rect x="0" y="0" width="338" height="125" rx="8" fill="#fff0e2" stroke="#db8129" stroke-width="1.5" />
      <text x="18" y="38" font-family="sans-serif" font-size="24" fill="#303a36">version</text>
      <text x="18" y="72" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">GLIBC_2.34</text>
      <text x="18" y="104" font-family="sans-serif" font-size="24" fill="#303a36">not found</text>
    </g>

    
    <g transform="translate(831, 860)">
      <rect x="0" y="0" width="338" height="125" rx="8" fill="#fff0e2" stroke="#db8129" stroke-width="1.5" />
      <text x="18" y="38" font-family="sans-serif" font-size="24" fill="#303a36">version</text>
      <text x="18" y="72" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">GLIBCXX_3.4.30</text>
      <text x="18" y="104" font-family="sans-serif" font-size="24" fill="#303a36">not found</text>
    </g>

    
    <g transform="translate(831, 1070)">
      <rect x="0" y="0" width="338" height="165" rx="8" fill="#db8129" />
      <text x="169" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">First check:</text>
      <text x="169" y="74" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">ldd,</text>
      <text x="169" y="106" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">ldconfig -p,</text>
      <text x="169" y="138" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">LD_DEBUG=libs</text>
    </g>
  </g>

  
  <g id="col-stage6">
    
    <rect x="1205" y="340" width="360" height="920" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="1205" y="340" width="360" height="60" rx="12" fill="#207448" />
    <rect x="1205" y="380" width="360" height="20" fill="#207448" />
    <text x="1385" y="382" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 6 and after</text>

    
    <g transform="translate(1220, 420)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">CUDA error: no kernel</text>
      <text x="18" y="70" font-family="sans-serif" font-size="24" fill="#303a36">image is available</text>
      <text x="18" y="102" font-family="sans-serif" font-size="24" fill="#303a36">for execution on</text>
      <text x="18" y="134" font-family="sans-serif" font-size="24" fill="#303a36">the device</text>
    </g>

    
    <g transform="translate(1220, 675)">
      <rect x="0" y="0" width="330" height="155" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Illegal instruction</text>
      <text x="18" y="76" font-family="sans-serif" font-size="24" fill="#303a36">(SIGILL, exit 132)</text>
    </g>

    
    <g transform="translate(1220, 850)">
      <rect x="0" y="0" width="330" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="18" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">segfault exit 139</text>
    </g>

    
    <g transform="translate(1220, 1100)">
      <rect x="0" y="0" width="330" height="135" rx="8" fill="#207448" />
      <text x="165" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">First check:</text>
      <text x="165" y="80" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">strace -f for the</text>
      <text x="165" y="112" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle">last failed call</text>
    </g>
  </g>

</svg>