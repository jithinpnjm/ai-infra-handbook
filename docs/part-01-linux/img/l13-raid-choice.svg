<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Which RAID for what</title>
  <desc>Visual infographic table comparing RAID configurations by use case, typical choice, and reasoning.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which RAID for what</text>

  
  <rect x="60" y="110" width="460" height="55" rx="10" fill="#207448"/>
  <text x="290" y="147" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Purpose</text>

  <rect x="540" y="110" width="460" height="55" rx="10" fill="#207448"/>
  <text x="770" y="147" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Typical choice</text>

  <rect x="1020" y="110" width="520" height="55" rx="10" fill="#207448"/>
  <text x="1280" y="147" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Reason</text>

  
  <rect x="60" y="185" width="460" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="205" width="56" height="56" rx="8" stroke="#207448" stroke-width="4" fill="none"/>
  <line x1="85" y1="221" x2="141" y2="221" stroke="#207448" stroke-width="3"/>
  <circle cx="97" cy="213" r="3" fill="#207448"/>
  <circle cx="106" cy="213" r="3" fill="#207448"/>
  <circle cx="115" cy="213" r="3" fill="#207448"/>
  <path d="M 98 233 L 108 241 L 98 249" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="114" y1="249" x2="126" y2="249" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="298" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Operating system</text>

  <rect x="540" y="185" width="460" height="155" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="570" y="252" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="570" dy="0">RAID 1 across</tspan>
    <tspan x="570" dy="36">two small drives</tspan>
  </text>

  <rect x="1020" y="185" width="520" height="155" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="1050" y="270" font-family="sans-serif" font-size="26" fill="#303a36">survive one drive failure</text>

  
  <rect x="60" y="360" width="460" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <ellipse cx="113" cy="376" rx="24" ry="9" stroke="#207448" stroke-width="4" fill="none"/>
  <path d="M 89 376 v 24 c 0 5 10.7 9 24 9 s 24 -4 24 -9 v -24" stroke="#207448" stroke-width="4" fill="none"/>
  <path d="M 89 388 c 0 5 10.7 9 24 9 s 24 -4 24 -9" stroke="#207448" stroke-width="3" fill="none"/>
  <path d="M 120 372 L 109 387 L 117 387 L 107 404 L 124 385 L 116 385 Z" fill="#207448"/>
  <text x="85" y="470" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="85" dy="0">Local scratch,</tspan>
    <tspan x="85" dy="32">dataset cache,</tspan>
    <tspan x="85" dy="32">image store,</tspan>
    <tspan x="85" dy="32">fast checkpoint staging</tspan>
  </text>

  <rect x="540" y="360" width="460" height="240" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="570" y="475" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="570" dy="0">RAID 0 across NVMe</tspan>
    <tspan x="570" dy="38">or no RAID</tspan>
  </text>

  <rect x="1020" y="360" width="520" height="240" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="1050" y="425" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="1050" dy="0">maximum throughput,</tspan>
    <tspan x="1050" dy="34">data is reproducible</tspan>
  </text>
  
  <rect x="1050" y="495" width="450" height="76" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="1070" y="527" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1070" dy="0">losing one drive</tspan>
    <tspan x="1070" dy="28">loses the array</tspan>
  </text>

  
  <rect x="60" y="620" width="460" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="638" width="56" height="50" rx="6" stroke="#207448" stroke-width="4" fill="none"/>
  <line x1="85" y1="655" x2="141" y2="655" stroke="#207448" stroke-width="3"/>
  <line x1="85" y1="671" x2="141" y2="671" stroke="#207448" stroke-width="3"/>
  <circle cx="95" cy="647" r="3" fill="#207448"/>
  <circle cx="95" cy="663" r="3" fill="#207448"/>
  <circle cx="95" cy="679" r="3" fill="#207448"/>
  <line x1="106" y1="647" x2="131" y2="647" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="663" x2="131" y2="663" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="679" x2="131" y2="679" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="730" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="85" dy="0">Valuable local data</tspan>
    <tspan x="85" dy="34">on a storage server</tspan>
  </text>

  <rect x="540" y="620" width="460" height="180" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="570" y="688" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="570" dy="0">RAID 6 or 10,</tspan>
    <tspan x="570" dy="34">or erasure coding</tspan>
    <tspan x="570" dy="34">in Lustre, Ceph, GPFS</tspan>
  </text>

  <rect x="1020" y="620" width="520" height="180" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="1050" y="688" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="1050" dy="0">fault tolerance without a</tspan>
    <tspan x="1050" dy="34">single controller as a</tspan>
    <tspan x="1050" dy="34">point of failure</tspan>
  </text>

  
  <rect x="60" y="820" width="460" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 94 872 a 12 12 0 0 1 -2 -23 a 17 17 0 0 1 31 -4 a 13 13 0 0 1 11 15 a 12 12 0 0 1 -7 12 z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <text x="85" y="930" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Cloud</text>

  <rect x="540" y="820" width="460" height="155" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="570" y="885" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="570" dy="0">none, or RAID 0</tspan>
    <tspan x="570" dy="36">of local SSDs</tspan>
  </text>

  <rect x="1020" y="820" width="520" height="155" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="1050" y="885" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="1050" dy="0">provider replicates the disk,</tspan>
    <tspan x="1050" dy="36">local SSD is ephemeral</tspan>
  </text>

  
  <rect x="60" y="1000" width="1480" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1047" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">for anything you cannot lose, choose a redundant level and keep a separate backup.</text>
</svg>