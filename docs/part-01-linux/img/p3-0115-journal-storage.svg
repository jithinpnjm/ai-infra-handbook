<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where the journal lives: Storage=auto can lose it at reboot</title>
  <desc>Decision flow and configuration guide showing how systemd-journald handles log persistence depending on whether /var/log/journal exists, the memory loss risk, the configuration fix, and retention limits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">Where the journal lives:</text>
  <text x="800" y="112" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">Storage=auto can lose it at reboot</text>

  
  
  

  
  <g>
    <rect x="40" y="150" width="460" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(242, 166)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="270" y="254" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="270" dy="0">journald starts with</tspan>
      <tspan x="270" dy="30">Storage=auto (the default)</tspan>
    </text>
  </g>

  
  <path d="M 270 300 L 270 354" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g>
    <polygon points="270,360 490,450 270,540 50,450" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="270" y="442" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="270" dy="0">Does /var/log/journal</tspan>
      <tspan x="270" dy="32">exist?</tspan>
    </text>
  </g>

  
  <path d="M 270 540 L 270 616" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="286" y="562" width="48" height="34" rx="6" fill="#f5f8f5"/>
  <text x="310" y="587" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129" text-anchor="middle">No</text>

  
  <g>
    <rect x="40" y="626" width="460" height="444" rx="16" fill="#fff5ec" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(242, 646)">
      <rect x="8" y="14" width="40" height="28" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
      <path d="M 16 14 L 16 6 M 24 14 L 24 6 M 32 14 L 32 6 M 40 14 L 40 6 M 16 42 L 16 50 M 24 42 L 24 50 M 32 42 L 32 50 M 40 42 L 40 50" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="4" fill="#db8129"/>
    </g>
    <text x="270" y="736" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="270" dy="0" font-weight="bold">Written to</tspan>
      <tspan x="270" dy="36" font-family="monospace">/run/log/journal,</tspan>
      <tspan x="270" dy="48">which is in memory:</tspan>
      <tspan x="270" dy="42" font-weight="bold" fill="#db8129">lost at reboot;</tspan>
      <tspan x="270" dy="54" font-family="monospace">journalctl -b -1 fails</tspan>
      <tspan x="270" dy="36">after a crash</tspan>
    </text>
  </g>

  
  
  

  
  <path d="M 490 450 L 526 450" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="492" y="404" width="56" height="34" rx="6" fill="#f5f8f5"/>
  <text x="520" y="429" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>

  
  <g>
    <rect x="536" y="320" width="514" height="276" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(765, 336)">
      <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 6 14 L 6 36 C 6 42 16 46 28 46 C 40 46 50 42 50 36 L 50 14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 6 25 C 6 31 16 35 28 35 C 40 35 50 31 50 25" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="793" y="422" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="793" dy="0" font-weight="bold">Written to /var/log/journal</tspan>
      <tspan x="793" dy="38">on disk: survives reboot;</tspan>
      <tspan x="793" dy="46" font-family="monospace">journalctl -b -1 works</tspan>
      <tspan x="793" dy="36">after a crash</tspan>
    </text>
  </g>

  
  <g>
    <rect x="536" y="626" width="514" height="444" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(765, 646)">
      <path d="M 38 10 C 33 5 25 5 20 10 L 26 16 L 22 20 L 16 14 C 11 19 11 27 16 32 C 18 34 20 35 22 36 L 38 52 C 40 54 44 54 46 52 C 48 50 48 46 46 44 L 30 28 C 31 26 32 24 34 22 C 39 17 39 9 38 10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="793" y="736" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      <tspan x="793" dy="0" font-weight="bold">Set Storage=persistent in</tspan>
      <tspan x="793" dy="38" font-family="monospace">/etc/systemd/journald.conf.d/</tspan>
      <tspan x="793" dy="34" font-family="monospace">50-persistent.conf,</tspan>
      <tspan x="793" dy="44">create the directory with</tspan>
      <tspan x="793" dy="38" font-family="monospace">sudo systemd-tmpfiles --create</tspan>
      <tspan x="793" dy="34" font-family="monospace">--prefix /var/log/journal,</tspan>
      <tspan x="793" dy="44">then sudo systemctl</tspan>
      <tspan x="793" dy="34" font-family="monospace">restart systemd-journald</tspan>
    </text>
  </g>

  
  
  

  <g>
    <rect x="1080" y="150" width="480" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(1106, 172)">
      <line x1="8" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="16" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="36" x2="48" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    </g>
    
    
    <text x="1176" y="206" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Limits in that file</text>

    
    <g>
      <rect x="1106" y="236" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="265" font-family="monospace" font-size="24px" fill="#303a36">SystemMaxUse=10G</text>

      <rect x="1106" y="286" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="315" font-family="monospace" font-size="24px" fill="#303a36">SystemKeepFree=2G</text>

      <rect x="1106" y="336" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="365" font-family="monospace" font-size="24px" fill="#303a36">SystemMaxFileSize=500M</text>

      <rect x="1106" y="386" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="415" font-family="monospace" font-size="24px" fill="#303a36">MaxRetentionSec=1month</text>

      <rect x="1106" y="436" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="465" font-family="monospace" font-size="24px" fill="#303a36">RateLimitIntervalSec=30s</text>

      <rect x="1106" y="486" width="428" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="515" font-family="monospace" font-size="24px" fill="#303a36">RateLimitBurst=10000</text>
    </g>

    
    <g>
      <rect x="1106" y="546" width="428" height="344" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="582" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="1124" dy="0">Rate limiting drops messages</tspan>
        <tspan x="1124" dy="34">from a chatty service and</tspan>
        <tspan x="1124" dy="34">reports Suppressed N</tspan>
        <tspan x="1124" dy="34">messages from X, which can</tspan>
        <tspan x="1124" dy="34">hide the error you need; raise</tspan>
        <tspan x="1124" dy="34">it per unit with</tspan>
        <tspan x="1124" dy="36" font-family="monospace">LogRateLimitIntervalSec=</tspan>
        <tspan x="1124" dy="34" font-family="monospace">and LogRateLimitBurst=</tspan>
      </text>
    </g>

    
    <g>
      <rect x="1106" y="908" width="428" height="142" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <text x="1124" y="948" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="1124" dy="0">Treat the on-node journal as</tspan>
        <tspan x="1124" dy="36">a short buffer: ship logs</tspan>
        <tspan x="1124" dy="36">off the node</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g>
    <rect x="40" y="1104" width="1520" height="66" rx="12" fill="#207448"/>
    <text x="800" y="1146" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">Before you rely on a node's logs after a reboot, confirm Storage is persistent</text>
  </g>
</svg>