<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>Reading an error message: program, attempt and errno text</title>
  <desc>Visual breakdown of a Linux error message into program name, attempt, and errno text, showing the system flow from open syscall to strerror and a lookup grid of common errno codes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5"/>

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading an error message: program, attempt and errno text</text>

  
  <rect x="50" y="105" width="1500" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="75" y="125" width="1450" height="64" rx="8" fill="#ffffff" stroke="#ccdcd0" stroke-width="2"/>

  
  <text y="167" font-family="monospace" font-size="30" font-weight="bold">
    <tspan x="195" fill="#207448">ls</tspan><tspan fill="#303a36">: </tspan><tspan fill="#207448">cannot access '/data/missing'</tspan><tspan fill="#303a36">: </tspan><tspan fill="#207448">No such file or directory</tspan>
  </text>

  
  
  <path d="M 195 200 v 8 h 20 v 12 v -12 h 20 v -8" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="215" y="246" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">program name</text>

  
  <path d="M 270 200 v 8 h 260 v 12 v -12 h 260 v -8" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="530" y="246" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">what the program tried</text>

  
  <path d="M 825 200 v 8 h 290 v 12 v -12 h 290 v -8" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="1115" y="246" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">the system's description of the error code</text>

  
  
  <rect x="50" y="315" width="345" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="92" cy="355" r="22" fill="#207448"/>
  <text x="92" y="363" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(320, 335)">
    <rect x="0" y="0" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="12" x2="48" y2="12" stroke="#207448" stroke-width="3"/>
    <circle cx="8" cy="6" r="2.5" fill="#207448"/>
    <circle cx="16" cy="6" r="2.5" fill="#207448"/>
  </g>
  <text x="222" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="222" dy="0">Program calls</tspan>
    <tspan x="222" dy="38">open()</tspan>
  </text>

  
  <line x1="395" y1="412" x2="433" y2="412" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="435" y="315" width="345" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="477" cy="355" r="22" fill="#207448"/>
  <text x="477" y="363" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(705, 335)">
    <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="32" y1="0" x2="32" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="40" x2="16" y2="48" stroke="#207448" stroke-width="3"/>
    <line x1="32" y1="40" x2="32" y2="48" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="32" x2="8" y2="32" stroke="#207448" stroke-width="3"/>
    <line x1="40" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="40" y1="32" x2="48" y2="32" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="607" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="607" dy="0">Kernel returns</tspan>
    <tspan x="607" dy="38">an errno code</tspan>
  </text>

  
  <line x1="780" y1="412" x2="818" y2="412" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="820" y="315" width="345" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="862" cy="355" r="22" fill="#207448"/>
  <text x="862" y="363" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1090, 335)">
    <circle cx="24" cy="24" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 24 2 v 6 M 24 40 v 6 M 2 24 h 6 M 40 24 h 6 M 8 8 l 5 5 M 35 35 l 5 5 M 8 40 l 5 -5 M 35 13 l 5 -5" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="992" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="992" dy="0">strerror turns</tspan>
    <tspan x="992" dy="38">it into text</tspan>
  </text>

  
  <line x1="1165" y1="412" x2="1203" y2="412" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1205" y="315" width="345" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1247" cy="355" r="22" fill="#207448"/>
  <text x="1247" y="363" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1475, 335)">
    <path d="M 2 24 Q 24 6 46 24 Q 24 42 2 24 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="24" cy="24" r="7" fill="#207448"/>
  </g>
  <text x="1377" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1377" dy="0">You read</tspan>
    <tspan x="1377" dy="38">the message</tspan>
  </text>

  

  
  <rect x="50" y="535" width="480" height="255" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  
  <rect x="74" y="555" width="140" height="44" rx="6" fill="#db8129"/>
  <text x="144" y="586" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">ENOENT</text>
  
  <g transform="translate(466, 555)">
    <path d="M 4 2 L 24 2 L 36 14 L 36 42 L 4 42 Z" fill="none" stroke="#db8129" stroke-width="3"/>
    <path d="M 24 2 L 24 14 L 36 14" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="14" y1="24" x2="26" y2="34" stroke="#db8129" stroke-width="3"/>
    <line x1="26" y1="24" x2="14" y2="34" stroke="#db8129" stroke-width="3"/>
  </g>
  
  <text x="74" y="640" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">No such file or directory</text>
  
  <rect x="74" y="670" width="432" height="95" rx="6" fill="#fdf7f2" stroke="#f4d1b0" stroke-width="1.5"/>
  <text x="290" y="708" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="290" dy="0">ls -ld each component,</tspan>
    <tspan x="290" dy="32">CRLF in the shebang line</tspan>
  </text>

  
  <rect x="560" y="535" width="480" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="584" y="555" width="140" height="44" rx="6" fill="#e8f1ea"/>
  <text x="654" y="586" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">EACCES</text>
  
  <g transform="translate(976, 555)">
    <rect x="6" y="16" width="28" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 12 16 V 10 A 8 8 0 0 1 28 10 V 16" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  
  <text x="584" y="640" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Permission denied</text>
  
  <rect x="584" y="670" width="432" height="95" rx="6" fill="#f5f8f5" stroke="#ccdcd0" stroke-width="1.5"/>
  <text x="800" y="725" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">ls -l, id, namei -l path</text>

  
  <rect x="1070" y="535" width="480" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="1094" y="555" width="140" height="44" rx="6" fill="#e8f1ea"/>
  <text x="1164" y="586" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">EPERM</text>
  
  <g transform="translate(1486, 555)">
    <path d="M 6 4 L 20 2 L 34 4 C 34 22 20 36 20 40 C 20 36 6 22 6 4 Z" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  
  <text x="1094" y="640" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Operation not permitted</text>
  
  <rect x="1094" y="670" width="432" height="95" rx="6" fill="#f5f8f5" stroke="#ccdcd0" stroke-width="1.5"/>
  <text x="1310" y="725" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">need root or a capability</text>

  
  <rect x="50" y="815" width="480" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="74" y="835" width="140" height="44" rx="6" fill="#e8f1ea"/>
  <text x="144" y="866" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">ENOTDIR</text>
  
  <g transform="translate(466, 835)">
    <path d="M 4 8 L 16 8 L 22 14 L 38 14 L 38 38 L 4 38 Z" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="26" x2="30" y2="26" stroke="#207448" stroke-width="3"/>
  </g>
  
  <text x="74" y="920" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Not a directory</text>
  
  <rect x="74" y="950" width="432" height="95" rx="6" fill="#f5f8f5" stroke="#ccdcd0" stroke-width="1.5"/>
  <text x="290" y="1005" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">file path</text>

  
  <rect x="560" y="815" width="480" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="584" y="835" width="140" height="44" rx="6" fill="#e8f1ea"/>
  <text x="654" y="866" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">ENOSPC</text>
  
  <g transform="translate(976, 835)">
    <ellipse cx="20" cy="10" rx="16" ry="6" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 4 10 V 22 C 4 25.3 11.2 28 20 28 C 28.8 28 36 25.3 36 22 V 10" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 4 22 V 34 C 4 37.3 11.2 40 20 40 C 28.8 40 36 37.3 36 34 V 22" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  
  <text x="584" y="920" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">No space left on device</text>
  
  <rect x="584" y="950" width="432" height="95" rx="6" fill="#f5f8f5" stroke="#ccdcd0" stroke-width="1.5"/>
  <text x="800" y="1005" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">df -h and df -i</text>

  
  <rect x="1070" y="815" width="480" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="1094" y="835" width="140" height="44" rx="6" fill="#e8f1ea"/>
  <text x="1164" y="866" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">E2BIG</text>
  
  <g transform="translate(1486, 835)">
    <rect x="6" y="4" width="30" height="36" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="28" x2="24" y2="28" stroke="#207448" stroke-width="3"/>
  </g>
  
  <text x="1094" y="920" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Argument list too long</text>
  
  <rect x="1094" y="950" width="432" height="95" rx="6" fill="#f5f8f5" stroke="#ccdcd0" stroke-width="1.5"/>
  <text x="1310" y="1005" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">find ... -exec, xargs</text>

  
  <rect x="50" y="1095" width="1500" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1137" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Read the first error first; later messages are often noise</text>
</svg>