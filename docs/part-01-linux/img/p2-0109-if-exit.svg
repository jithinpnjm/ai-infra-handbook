<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>An if statement runs a command and branches on its exit code</title>
  <desc>Flowchart showing how Bash if and elif statements branch on command exit codes rather than testing boolean expressions.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1280" fill="#f5f8f5" />

  
  <g opacity="0.25" stroke="#207448" stroke-width="1" stroke-dasharray="4 8">
    <line x1="80" y1="120" x2="1520" y2="120" />
    <line x1="80" y1="1200" x2="1520" y2="1200" />
  </g>

  
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
      An if statement runs a command and branches on its exit code
    </text>
  </g>

  

  
  <path d="M 570 230 L 570 300" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <path d="M 370 400 L 250 400 L 250 780" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <path d="M 570 500 L 570 580" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  
  <path d="M 570 740 L 570 780" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <path d="M 750 660 L 1140 660 L 1140 780" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <path d="M 250 930 L 250 1040 L 570 1040" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 570 930 L 570 1040" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 1140 930 L 1140 1040 L 570 1040" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 570 1040 L 570 1090" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />


  

  
  <g transform="translate(570, 180)" filter="url(#card-shadow)">
    <rect x="-310" y="-50" width="620" height="100" rx="50" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(-275, -24)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="48" rx="8" />
      <path d="M 12 18 L 22 24 L 12 30" />
      <path d="M 26 32 L 36 32" />
    </g>
    <text x="30" y="10" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
      if grep -q daemon: /etc/passwd
    </text>
  </g>


  
  <g transform="translate(570, 400)" filter="url(#card-shadow)">
    
    <polygon points="0,-100 200,0 0,100 -200,0" fill="#ffffff" stroke="#db8129" stroke-width="5" />
    
    
    <g transform="translate(-24, -68)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="11" />
      <path d="M24 3 v6 M24 39 v6 M3 24 h6 M39 24 h6 M9.2 9.2 l4.2 4.2 M34.6 34.6 l4.2 4.2 M9.2 38.8 l4.2 -4.2 M34.6 13.4 l4.2 -4.2" />
    </g>

    
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">
      Exit code 0?
    </text>
  </g>


  
  <g transform="translate(570, 660)" filter="url(#card-shadow)">
    
    <polygon points="0,-80 180,0 0,80 -180,0" fill="#ffffff" stroke="#207448" stroke-width="4" />
    
    
    <g transform="translate(-22, -58)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 4 h 18 l 10 10 v 26 h -28 z" />
      <path d="M 26 4 v 10 h 10" />
      <circle cx="20" cy="28" r="5" />
      <path d="M 24 32 l 5 5" />
    </g>

    <text x="0" y="20" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
      elif -e /etc/passwd ?
    </text>
  </g>


  

  
  <g transform="translate(250, 855)" filter="url(#card-shadow)">
    <rect x="-170" y="-75" width="340" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(-142, -50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="20" />
      <path d="M 12 22 L 18 28 L 32 14" />
    </g>
    <text x="14" y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">
      then:
    </text>
    <text x="14" y="32" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      echo found
    </text>
  </g>


  
  <g transform="translate(570, 855)" filter="url(#card-shadow)">
    <rect x="-190" y="-75" width="380" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(-165, -50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="36" height="42" rx="6" />
      <line x1="12" y1="12" x2="32" y2="12" />
      <line x1="12" y1="20" x2="26" y2="20" />
      <circle cx="22" cy="32" r="2" fill="#207448" />
    </g>
    <text x="15" y="-12" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      echo file exists
    </text>
    <text x="15" y="22" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      but no daemon user
    </text>
  </g>


  
  <g transform="translate(1140, 855)" filter="url(#card-shadow)">
    <rect x="-240" y="-75" width="480" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(-215, -50)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 4 L 40 38 L 4 38 Z" />
      <line x1="22" y1="16" x2="22" y2="26" />
      <circle cx="22" cy="32" r="2" fill="#207448" />
    </g>
    <text x="18" y="-18" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">
      else:
    </text>
    <text x="18" y="16" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      echo no passwd file
    </text>
    <text x="18" y="48" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      at all to stderr
    </text>
  </g>


  
  <g transform="translate(570, 1140)" filter="url(#card-shadow)">
    <rect x="-140" y="-45" width="280" height="90" rx="45" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(-105, -22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="44" height="44" rx="8" />
      <rect x="14" y="14" width="16" height="16" fill="#207448" />
    </g>
    <text x="20" y="11" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#303a36" text-anchor="middle">
      fi
    </text>
  </g>


  

  
  <g transform="translate(250, 400)">
    <rect x="-70" y="-22" width="140" height="44" rx="22" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      yes, true
    </text>
  </g>

  
  <g transform="translate(570, 538)">
    <rect x="-68" y="-22" width="136" height="44" rx="22" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
      no, false
    </text>
  </g>

  
  <g transform="translate(570, 755)">
    <rect x="-42" y="-20" width="84" height="40" rx="20" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      yes
    </text>
  </g>

  
  <g transform="translate(930, 660)">
    <rect x="-40" y="-20" width="80" height="40" rx="20" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      no
    </text>
  </g>


  

  
  <g transform="translate(860, 310)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="660" height="150" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <path d="M 0 50 L -20 65 L 0 80 Z" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <line x1="0" y1="52" x2="0" y2="78" stroke="#ffffff" stroke-width="5" />
    
    
    <g transform="translate(30, 48)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 28 A 16 16 0 1 1 32 28 C 30 34 26 36 26 42 L 18 42 C 18 36 14 34 12 28 Z" />
      <line x1="18" y1="48" x2="26" y2="48" />
    </g>

    <text x="90" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      if does not test an expression.
    </text>
    <text x="90" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
      It runs a command and reads the exit code.
    </text>
  </g>


  
  <g transform="translate(860, 490)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="660" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(30, 30)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 4 L 38 12 V 26 C 38 38 22 48 22 48 C 22 48 6 38 6 26 V 12 Z" />
      <path d="M 16 26 L 22 32 L 30 18" />
    </g>

    <text x="90" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
      Zero means true. Anything non-zero means false.
    </text>
  </g>

</svg>