<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Drop-ins add to list keys, so clear ExecStart before you replace it</title>
  <desc>Visual infographic explaining systemd drop-in configuration behavior for list-valued keys such as ExecStart.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Drop-ins add to list keys,</tspan>
    <tspan x="800" dy="56">so clear ExecStart before you replace it</tspan>
  </text>

  
  <g id="left-vendor-unit">
    
    <rect x="40" y="145" width="490" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 172)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="14" />
      <path d="M28 4 L28 10 M28 46 L28 52 M4 28 L10 28 M46 28 L52 28 M11 11 L15 15 M41 41 L45 45 M11 45 L15 41 M41 11 L45 15" />
    </g>

    
    <text x="135" y="196" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="135" dy="0">/usr/lib/systemd/system/</tspan>
      <tspan x="135" dy="32">containerd.service</tspan>
    </text>

    
    <rect x="60" y="265" width="450" height="580" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <text x="85" y="325" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">
      [Service]
    </text>

    
    <rect x="75" y="360" width="420" height="60" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="1.5" />
    <text x="85" y="400" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      ExecStart=/usr/bin/containerd
    </text>
  </g>

  
  <g id="middle-drop-in-directory">
    
    <rect x="560" y="145" width="630" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(585, 172)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M6 14 L22 14 L28 20 L50 20 A4 4 0 0 1 54 24 L54 44 A4 4 0 0 1 50 48 L6 48 A4 4 0 0 1 2 44 L2 18 A4 4 0 0 1 6 14 Z" />
    </g>

    
    <text x="655" y="196" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="655" dy="0">/etc/systemd/system/</tspan>
      <tspan x="655" dy="32">containerd.service.d/</tspan>
    </text>

    
    <g id="card-wrong">
      <rect x="580" y="250" width="590" height="280" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

      
      <text x="605" y="286" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
        <tspan x="605" dy="0">Wrong: override.conf with only</tspan>
        <tspan x="605" dy="32">ExecStart=/usr/bin/containerd</tspan>
        <tspan x="605" dy="32">--config /etc/containerd/gpu-config.toml</tspan>
      </text>

      
      <rect x="600" y="375" width="550" height="135" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
      
      <rect x="620" y="392" width="240" height="10" rx="5" fill="#db8129" fill-opacity="0.3" />
      <rect x="620" y="410" width="460" height="10" rx="5" fill="#db8129" fill-opacity="0.3" />
      
      <text x="620" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="620" dy="0">list-valued key: the assignment ADDS,</tspan>
        <tspan x="620" dy="32">so systemd sees two commands</tspan>
      </text>
    </g>

    
    <g id="card-right">
      <rect x="580" y="550" width="590" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <text x="605" y="584" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
        <tspan x="605" dy="0">Right: override.conf with an empty line</tspan>
        <tspan x="605" dy="32">ExecStart= first, then</tspan>
        <tspan x="605" dy="32">ExecStart=/usr/bin/containerd</tspan>
        <tspan x="605" dy="32">--config /etc/containerd/gpu-config.toml</tspan>
      </text>

      
      <rect x="600" y="705" width="550" height="125" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
      
      <rect x="620" y="725" width="460" height="10" rx="5" fill="#207448" fill-opacity="0.3" />
      
      <text x="620" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
        an empty assignment resets the list
      </text>
    </g>
  </g>

  
  <g id="right-side-notes">
    
    <rect x="1220" y="145" width="340" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1362, 172)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 6 L34 6 L44 16 L44 50 A4 4 0 0 1 40 54 L12 54 A4 4 0 0 1 8 50 L8 10 A4 4 0 0 1 12 6 Z" />
      <path d="M34 6 L34 16 L44 16" />
      <line x1="16" y1="28" x2="36" y2="28" />
      <line x1="16" y1="38" x2="36" y2="38" />
    </g>

    
    <rect x="1240" y="250" width="300" height="260" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="1260" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1260" dy="0">Files are applied</tspan>
      <tspan x="1260" dy="34">in lexical order:</tspan>
      <tspan x="1260" dy="38" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">10-limits.conf,</tspan>
      <tspan x="1260" dy="34" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">then 50-gpu.conf</tspan>
    </text>

    
    <rect x="1240" y="535" width="300" height="320" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="1260" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1260" dy="0">List-valued keys</tspan>
      <tspan x="1260" dy="34">that add:</tspan>
      <tspan x="1260" dy="38" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">ExecStartPre=,</tspan>
      <tspan x="1260" dy="34" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">Environment=,</tspan>
      <tspan x="1260" dy="34" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">After=</tspan>
    </text>
  </g>

  
  <g id="bottom-strip-commands">
    <rect x="40" y="905" width="1520" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 952)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="22" cy="22" r="14" />
      <line x1="32" y1="32" x2="48" y2="48" />
    </g>

    
    <rect x="140" y="930" width="320" height="100" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="160" y="990" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      systemctl cat NAME
    </text>

    
    <rect x="480" y="930" width="460" height="100" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="500" y="972" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="500" dy="0">systemctl show NAME</tspan>
      <tspan x="500" dy="34">-p ExecStart</tspan>
    </text>

    
    <rect x="960" y="930" width="580" height="100" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="980" y="972" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="980" dy="0">systemd-analyze verify</tspan>
      <tspan x="980" dy="34">/etc/systemd/system/NAME.service</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="40" y="1080" width="1520" height="75" rx="12" fill="#207448" />
    <text x="800" y="1127" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Before you touch a vendor unit, check whether a drop-in can make the same change
    </text>
  </g>
</svg>