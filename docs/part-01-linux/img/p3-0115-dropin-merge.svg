<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Drop-ins add to list keys, so clear ExecStart before you replace it</title>
  <desc>Visual explanation of systemd drop-in behavior for list-valued keys such as ExecStart, comparing incorrect and correct override configurations.</desc>

  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="40" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">Drop-ins add to list keys,</tspan>
    <tspan x="625" dy="0">so clear ExecStart before you replace it</tspan>
  </text>

  
  <g id="vendor-unit-card">
    <rect x="40" y="130" width="410" height="645" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(65, 155)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="12"/>
      <path d="M28,6 L28,12 M28,44 L28,50 M6,28 L12,28 M44,28 L50,28 M12.5,12.5 L16.7,16.7 M39.3,39.3 L43.5,43.5 M12.5,43.5 L16.7,39.3 M39.3,16.7 L43.5,12.5"/>
    </g>

    
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" y="250">/usr/lib/systemd/system/</tspan>
      <tspan x="65" y="284">containerd.service</tspan>
    </text>

    
    <rect x="65" y="325" width="360" height="420" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="85" y="385">[Service]</tspan>
      <tspan x="85" y="445">ExecStart=</tspan>
      <tspan x="85" y="480">/usr/bin/containerd</tspan>
    </text>
  </g>

  
  <g id="drop-in-directory-container">
    <rect x="475" y="130" width="720" height="645" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(500, 155)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M6,14 L22,14 L28,22 L50,22 L50,48 L6,48 Z"/>
    </g>

    
    <text font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="570" y="180">/etc/systemd/system/</tspan>
      <tspan x="570" y="212">containerd.service.d/</tspan>
    </text>

    
    <g id="wrong-override-card">
      <rect x="495" y="235" width="680" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <text font-size="24" fill="#303a36">
        <tspan x="515" y="272" font-family="sans-serif" font-weight="bold">Wrong: override.conf with only</tspan>
        <tspan x="515" y="306" font-family="monospace">ExecStart=/usr/bin/containerd</tspan>
        <tspan x="515" y="340" font-family="monospace">--config /etc/containerd/gpu-config.toml</tspan>
      </text>

      
      <rect x="515" y="365" width="640" height="102" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
      
      
      <line x1="535" y1="388" x2="635" y2="388" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>
      <line x1="645" y1="388" x2="745" y2="388" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>

      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="535" y="424">list-valued key: the assignment ADDS,</tspan>
        <tspan x="535" y="454">so systemd sees two commands</tspan>
      </text>
    </g>

    
    <g id="right-override-card">
      <rect x="495" y="505" width="680" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <text font-size="24" fill="#303a36">
        <tspan x="515" y="540" font-family="sans-serif" font-weight="bold">Right: override.conf with an empty line</tspan>
        <tspan x="515" y="574" font-family="monospace">ExecStart= first, then</tspan>
        <tspan x="515" y="608" font-family="monospace">ExecStart=/usr/bin/containerd</tspan>
        <tspan x="515" y="642" font-family="monospace">--config /etc/containerd/gpu-config.toml</tspan>
      </text>

      
      <rect x="515" y="665" width="640" height="74" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      
      
      <line x1="535" y1="685" x2="635" y2="685" stroke="#207448" stroke-width="6" stroke-linecap="round"/>

      <text x="535" y="718" font-family="sans-serif" font-size="24" fill="#303a36">
        an empty assignment resets the list
      </text>
    </g>
  </g>

  
  <g id="side-notes-panel">
    <rect x="1215" y="130" width="345" height="645" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1240, 155)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M10,6 L36,6 L46,16 L46,50 L10,50 Z"/>
      <path d="M36,6 L36,16 L46,16"/>
      <line x1="18" y1="28" x2="38" y2="28"/>
      <line x1="18" y1="38" x2="38" y2="38"/>
    </g>

    
    <rect x="1235" y="235" width="305" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="1255" y="275" font-family="sans-serif">Files are applied in</tspan>
      <tspan x="1255" y="309" font-family="sans-serif">lexical order:</tspan>
      <tspan x="1255" y="350" font-family="monospace">10-limits.conf,</tspan>
      <tspan x="1255" y="384" font-family="monospace">then 50-gpu.conf</tspan>
    </text>

    
    <rect x="1235" y="490" width="305" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-size="24" fill="#303a36">
      <tspan x="1255" y="530" font-family="sans-serif">List-valued keys</tspan>
      <tspan x="1255" y="564" font-family="sans-serif">that add:</tspan>
      <tspan x="1255" y="605" font-family="monospace">ExecStartPre=,</tspan>
      <tspan x="1255" y="642" font-family="monospace">Environment=,</tspan>
      <tspan x="1255" y="679" font-family="monospace">After=</tspan>
    </text>
  </g>

  
  <g id="check-commands-strip">
    
    <g transform="translate(40, 792)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="32" height="24" rx="4"/>
      <path d="M6,7 L12,12 L6,17 M16,17 L24,17"/>
    </g>

    
    <rect x="40" y="825" width="360" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="65" y="880" font-family="monospace" font-size="24" fill="#303a36">
      systemctl cat NAME
    </text>

    
    <rect x="425" y="825" width="525" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="445" y="880" font-family="monospace" font-size="24" fill="#303a36">
      systemctl show NAME -p ExecStart
    </text>

    
    <rect x="975" y="825" width="585" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="995" y="863">systemd-analyze verify</tspan>
      <tspan x="995" y="897">/etc/systemd/system/NAME.service</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="945" width="1520" height="75" rx="12" fill="#207448"/>
    <text x="800" y="992" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Before you touch a vendor unit, check whether a drop-in can make the same change
    </text>
  </g>
</svg>