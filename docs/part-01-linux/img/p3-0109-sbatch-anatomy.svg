<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Anatomy of a Slurm batch script: comments for Slurm, shell for the node</title>
  <desc>Visual explanation of a Slurm batch script showing how comments specify resource allocation while the shell executes runtime commands on allocated nodes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Anatomy of a Slurm batch script</text>
  <text x="800" y="115" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">comments for Slurm, shell for the node</text>

  
  <rect x="50" y="150" width="730" height="980" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="170" width="690" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="223" font-family="monospace" font-size="24" fill="#303a36">#!/bin/bash</text>

  
  <rect x="70" y="280" width="690" height="230" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="95" y="325" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">#SBATCH --job-name=train --nodes=2 </tspan>
    <tspan x="95" dy="36">--ntasks-per-node=8 --gres=gpu:8 </tspan>
    <tspan x="95" dy="36">--time=04:00:00</tspan>
  </text>
  <text x="95" y="465" font-family="monospace" font-size="24" fill="#303a36">#SBATCH --output=%x-%j.out</text>

  
  <rect x="70" y="530" width="690" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="583" font-family="monospace" font-size="24" fill="#303a36">set -euo pipefail</text>

  
  <rect x="70" y="640" width="690" height="130" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="692" font-family="monospace" font-size="24" fill="#303a36">module purge &amp;&amp; module load cuda/12.4 nccl</text>
  <text x="95" y="736" font-family="monospace" font-size="24" fill="#303a36">export NCCL_DEBUG=INFO</text>

  
  <rect x="70" y="790" width="690" height="130" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="842" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">head_node=$(scontrol show hostnames </tspan>
    <tspan x="95" dy="36">"$SLURM_JOB_NODELIST" | head -n1)</tspan>
  </text>

  
  <rect x="70" y="940" width="690" height="170" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="990" font-family="monospace" font-size="24" fill="#303a36">srun --export=ALL bash -c ...</text>
  <text x="95" y="1042" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">srun python train.py </tspan>
    <tspan x="95" dy="36">--master-addr "$head_node" "$@"</tspan>
  </text>

  
  <line x1="780" y1="215" x2="856" y2="215" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="780" y1="395" x2="856" y2="395" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="780" y1="575" x2="856" y2="575" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="780" y1="705" x2="856" y2="705" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="780" y1="855" x2="856" y2="855" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="780" y1="1025" x2="856" y2="1025" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  

  
  <rect x="860" y="170" width="690" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="215" r="22" fill="#207448" />
  <text x="900" y="223" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="940" y="207" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">Shebang: bash, because the script</tspan>
    <tspan x="940" dy="32">uses bash features</tspan>
  </text>
  
  <g transform="translate(1480, 187)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="2" y="4" width="52" height="44" rx="6" />
    <path d="M 12 20 L 22 26 L 12 32" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="32" x2="42" y2="32" stroke-linecap="round" />
  </g>

  
  <rect x="860" y="280" width="690" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="395" r="22" fill="#207448" />
  <text x="900" y="403" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="940" y="340" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">#SBATCH lines look like comments to the</tspan>
    <tspan x="940" dy="32">shell but Slurm reads them as resource</tspan>
    <tspan x="940" dy="32">requests: 2 nodes, 8 tasks per node,</tspan>
    <tspan x="940" dy="32">8 GPUs per node, 4 hours</tspan>
  </text>
  
  <g transform="translate(1480, 367)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="28" cy="28" r="24" />
    <polyline points="28,14 28,28 38,28" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <rect x="860" y="530" width="690" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="575" r="22" fill="#207448" />
  <text x="900" y="583" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="940" y="567" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">strict mode: a failing step shows</tspan>
    <tspan x="940" dy="32">in the job exit code</tspan>
  </text>
  
  <g transform="translate(1480, 547)" stroke="#207448" stroke-width="3.5" fill="none">
    <path d="M 28 6 L 10 14 L 10 28 C 10 40 28 48 28 48 C 28 48 46 40 46 28 L 46 14 Z" stroke-linejoin="round" />
    <polyline points="20,26 26,32 36,20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <rect x="860" y="640" width="690" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="705" r="22" fill="#207448" />
  <text x="900" y="713" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <text x="940" y="692" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">environment modules set the CUDA</tspan>
    <tspan x="940" dy="32">and NCCL environment</tspan>
  </text>
  
  <g transform="translate(1480, 677)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M 28 6 L 50 16 L 28 26 L 6 16 Z" />
    <path d="M 6 26 L 28 36 L 50 26" />
    <path d="M 6 36 L 28 46 L 50 36" />
  </g>

  
  <rect x="860" y="790" width="690" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="855" r="22" fill="#207448" />
  <text x="900" y="863" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  <text x="940" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">scontrol show hostnames expands</tspan>
    <tspan x="940" dy="32">the node list; head -n1 picks</tspan>
    <tspan x="940" dy="32">the first node as the head node</tspan>
  </text>
  
  <g transform="translate(1480, 827)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="18" y="4" width="20" height="14" rx="3" />
    <rect x="6" y="36" width="18" height="14" rx="3" />
    <rect x="32" y="36" width="18" height="14" rx="3" />
    <line x1="28" y1="18" x2="28" y2="28" />
    <line x1="15" y1="28" x2="41" y2="28" />
    <line x1="15" y1="28" x2="15" y2="36" />
    <line x1="41" y1="28" x2="41" y2="36" />
  </g>

  
  <rect x="860" y="940" width="690" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="900" cy="1025" r="22" fill="#207448" />
  <text x="900" y="1033" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  <text x="940" y="1013" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">srun launches one task per rank</tspan>
    <tspan x="940" dy="32">on the allocated nodes</tspan>
  </text>
  
  <g transform="translate(1480, 997)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="10" y="10" width="36" height="36" rx="4" />
    <circle cx="21" cy="21" r="3" fill="#207448" />
    <circle cx="35" cy="21" r="3" fill="#207448" />
    <circle cx="21" cy="35" r="3" fill="#207448" />
    <circle cx="35" cy="35" r="3" fill="#207448" />
    <line x1="18" y1="3" x2="18" y2="10" />
    <line x1="38" y1="3" x2="38" y2="10" />
    <line x1="18" y1="46" x2="18" y2="53" />
    <line x1="38" y1="46" x2="38" y2="53" />
  </g>

  
  <rect x="50" y="1170" width="1500" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="1208" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">The flags and variable names are illustrative; check the documentation for your versions</text>
</svg>