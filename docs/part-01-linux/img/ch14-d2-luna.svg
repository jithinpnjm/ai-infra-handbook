    </g>
    <g transform="translate(420 154)">
      <rect x="-21" y="-21" width="42" height="42" rx="5"/>
      <path d="M-11 -29 V-21 M0 -29 V-21 M11 -29 V-21 M-11 21 V29 M0 21 V29 M11 21 V29 M-29 -11 H-21 M-29 0 H-21 M-29 11 H-21 M21 -11 H29 M21 0 H29 M21 11 H29"/>
      <path d="M-10 -8 L0 -13 L10 -8 V3 L0 13 L-10 3 Z"/>
    </g>
    <g transform="translate(673.33 154)">
      <rect x="-25" y="-20" width="50" height="40" rx="4"/>
      <path d="M-25 -8 H25 M-15 -14 H-10 M-5 -14 H0 M5 -14 H10"/>
      <path d="M-12 0 H12 M-12 8 H8"/>
    </g>
    <g transform="translate(926.67 154)">
      <circle r="13"/>
      <path d="M-3 -29 H3 L5 -20 L12 -17 L20 -22 L25 -17 L20 -9 L23 -2 L32 0 L32 6 L23 8 L20 15 L25 23 L20 27 L12 22 L5 25 L3 34 H-3 L-5 25 L-12 22 L-20 27 L-25 23 L-20 15 L-23 8 L-32 6 V0 L-23 -2 L-20 -9 L-25 -17 L-20 -22 L-12 -17 L-5 -20 Z" transform="scale(.78)"/>
    </g>
    <g transform="translate(1180 154)">
      <ellipse cx="0" cy="-17" rx="25" ry="9"/>
      <path d="M-25 -17 V17 C-25 22 -14 26 0 26 C14 26 25 22 25 17 V-17"/>
      <path d="M-25 0 C-25 5 -14 9 0 9 C14 9 25 5 25 0"/>
    </g>
    <g transform="translate(1433.33 154)">
      <circle r="13"/>
      <path d="M-3 -29 H3 L5 -20 L12 -17 L20 -22 L25 -17 L20 -9 L23 -2 L32 0 L32 6 L23 8 L20 15 L25 23 L20 27 L12 22 L5 25 L3 34 H-3 L-5 25 L-12 22 L-20 27 L-25 23 L-20 15 L-23 8 L-32 6 V0 L-23 -2 L-20 -9 L-25 -17 L-20 -22 L-12 -17 L-5 -20 Z" transform="scale(.78)"/>
    </g>
  </g>

  <g fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="166.67" y="239">Boot loader</text>
    <text x="420" y="239">Kernel</text>
    <text x="673.33" y="224"><tspan x="673.33">initramfs</tspan><tspan x="673.33" dy="30">/init</tspan></text>
    <text x="926.67" y="224"><tspan x="926.67">udev</tspan><tspan x="926.67" dy="30">(in initramfs)</tspan></text>
    <text x="1180" y="239">Real root fs</text>
    <text x="1433.33" y="224"><tspan x="1433.33">systemd</tspan><tspan x="1433.33" dy="30">(PID 1)</tspan></text>
  </g>

  <g stroke="#afc4b4" stroke-width="2" stroke-dasharray="7 9">
    <path d="M166.67 275 V1395 M420 275 V1395 M673.33 275 V1395 M926.67 275 V1395 M1180 275 V1395 M1433.33 275 V1395"/>
  </g>

  <g fill="#e8f1ea" opacity=".6">
    <rect x="40" y="286" width="1520" height="110" rx="10"/>
    <rect x="40" y="566" width="1520" height="110" rx="10"/>
    <rect x="40" y="846" width="1520" height="110" rx="10"/>
    <rect x="40" y="1126" width="1520" height="110" rx="10"/>
  </g>

  <g fill="#f5f8f5">
    <rect x="96" y="298" width="710" height="40" rx="4"/>
    <rect x="96" y="438" width="570" height="40" rx="4"/>
    <rect x="96" y="578" width="1240" height="40" rx="4"/>
    <rect x="96" y="718" width="1100" height="40" rx="4"/>
    <rect x="96" y="858" width="650" height="40" rx="4"/>
    <rect x="96" y="998" width="430" height="40" rx="4"/>
    <rect x="96" y="1138" width="720" height="40" rx="4"/>
    <rect x="96" y="1278" width="650" height="40" rx="4"/>
  </g>

  <g font-family="sans-serif" font-size="24" fill="#303a36">
    <text x="102" y="328">load vmlinuz + initrd.img, pass cmdline (root=UUID=...)</text>
    <text x="102" y="468">unpack initramfs to RAM, run /init as PID 1</text>
    <text x="102" y="608">start udev, load modules for detected hardware (nvme, mpt3sas, mlx5, dm-crypt, md, lvm)</text>
    <text x="102" y="748">assemble md/LVM, unlock LUKS, configure network if needed, apply rd.* options</text>
    <text x="102" y="888">wait for root=UUID device, mount it read-only</text>
    <text x="102" y="1028">switch_root to the real root</text>
    <text x="102" y="1168">exec /sbin/init (systemd) as PID 1 on the real root</text>
    <text x="102" y="1308">remount rw, mount fstab filesystems, start units</text>
  </g>

  <g font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <g fill="#207448">
      <circle cx="68" cy="386" r="24"/><circle cx="68" cy="526" r="24"/>
      <circle cx="68" cy="666" r="24"/><circle cx="68" cy="806" r="24"/>
      <circle cx="68" cy="946" r="24"/><circle cx="68" cy="1086" r="24"/>
      <circle cx="68" cy="1226" r="24"/><circle cx="68" cy="1366" r="24"/>
    </g>
    <g fill="#ffffff">
      <text x="68" y="394">1</text><text x="68" y="534">2</text>
      <text x="68" y="674">3</text><text x="68" y="814">4</text>
      <text x="68" y="954">5</text><text x="68" y="1094">6</text>
      <text x="68" y="1234">7</text><text x="68" y="1374">8</text>
    </g>
  </g>

