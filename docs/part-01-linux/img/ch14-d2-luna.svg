    <path d="M673.33 666 H926.67" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M673.33 806 H727.33 V824 H673.33" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M673.33 946 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M673.33 1086 H420" stroke="#db8129" marker-end="url(#arrow-orange)"/>
    <path d="M420 1226 H1433.33" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M1433.33 1366 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
