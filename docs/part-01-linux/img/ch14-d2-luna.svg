<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
  <title>The initial RAM filesystem (initramfs)</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1440" fill="#f5f8f5"/>
  <text x="56" y="74" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">The initial RAM filesystem (initramfs)</text>

  <rect x="40" y="110" width="1520" height="165" rx="18" fill="#e8f1ea"/>
  <path d="M293.33 110 V275 M546.67 110 V275 M800 110 V275 M1053.33 110 V275 M1306.67 110 V275" stroke="#c6d8ca" stroke-width="2"/>

