<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Reading time output: where did the wall-clock time go?</title>
  <desc>Visual breakdown of real, user, and sys execution time with worked examples of waiting, multi-core CPU bound, and page fault costs.</desc>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading time output: where did the wall-clock time go?</text>

  
  <g id="top-box">
    <rect x="40" y="100" width="1520" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(60, 162)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="4" x2="28" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="0" x2="34" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="145" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">real: elapsed wall-clock time</text>
    <text x="140" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">user: CPU time in the program's own code</text>
    <text x="140" y="245" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">sys: CPU time the kernel spent on its behalf</text>
  </g>

  
  <g id="rule-box">
    <rect x="40" y="310" width="1520" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(60, 352)">
      <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M28,6 L28,12 M28,44 L28,50 M6,28 L12,28 M44,28 L50,28 M12,12 L17,17 M39,39 L44,44 M12,44 L17,39 M39,17 L44,12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="360" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">real minus (user + sys) = time NOT on a CPU (disk, network, locks, scheduler)</text>
    <text x="140" y="415" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">user + sys larger than real = several cores used</text>
  </g>

  
  <g id="card-a">
    <rect x="40" y="490" width="440" height="500" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="40" y="490" width="440" height="80" rx="12" fill="#e8f1ea"/>
    
    <g transform="translate(400, 502)">
      <path d="M8,8 L40,8 L24,28 L40,48 L8,48 L24,28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="6" y1="8" x2="42" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="48" x2="42" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="260" y="615" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="260" dy="0">real 0.442 s, </tspan>
      <tspan x="260" dy="32">user 0.052 s, sys 0.091 s</tspan>
    </text>

    
    <g transform="translate(60, 715)">
      
      <rect x="0" y="0" width="25" height="60" fill="#207448" rx="4"/>
      
      <rect x="27" y="0" width="40" height="60" fill="#74a882" rx="4"/>
      
      <rect x="69" y="0" width="331" height="60" fill="#d0dcd2" stroke="#99a89c" stroke-width="1.5" rx="4"/>
      <text x="234" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">about 0.3 s waiting</text>
    </g>

    
    <rect x="60" y="860" width="400" height="100" rx="10" fill="#fff3e6" stroke="#db8129" stroke-width="3"/>
    <text x="260" y="902" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="260" dy="0">The job is waiting, </tspan>
      <tspan x="260" dy="32">not computing</tspan>
    </text>
  </g>

  
  <g id="card-b">
    <rect x="520" y="490" width="440" height="500" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="520" y="490" width="440" height="80" rx="12" fill="#e8f1ea"/>
    
    <g transform="translate(880, 502)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="16" y="16" width="9" height="9" fill="#207448"/>
      <rect x="31" y="16" width="9" height="9" fill="#207448"/>
      <rect x="16" y="31" width="9" height="9" fill="#207448"/>
      <rect x="31" y="31" width="9" height="9" fill="#207448"/>
      <line x1="18" y1="2" x2="18" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="2" x2="38" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="48" x2="18" y2="54" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="48" x2="38" y2="54" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="740" y="615" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="740" dy="0">real 10.0 s, </tspan>
      <tspan x="740" dy="32">user 75.0 s, sys 3.0 s</tspan>
    </text>

    
    <g transform="translate(540, 710)">
      
      <rect x="0" y="0" width="50" height="24" fill="#99a89c" rx="4"/>
      
      <rect x="0" y="36" width="375" height="36" fill="#207448" rx="4"/>
      <rect x="377" y="36" width="18" height="36" fill="#74a882" rx="4"/>
    </g>

    
    <rect x="540" y="860" width="400" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="740" y="902" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="740" dy="0">Multi-core CPU-bound: </tspan>
      <tspan x="740" dy="32">about 7.8 cores busy</tspan>
    </text>
  </g>

  
  <g id="card-c">
    <rect x="1000" y="490" width="560" height="500" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="1000" y="490" width="560" height="80" rx="12" fill="#e8f1ea"/>
    
    <g transform="translate(1480, 502)">
      <ellipse cx="28" cy="14" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M6,14 L6,42 A22,7 0 0,0 50,42 L50,14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M6,28 A22,7 0 0,0 50,28" fill="none" stroke="#207448" stroke-width="4"/>
    </g>

    
    <rect x="1020" y="585" width="520" height="115" rx="8" fill="#f5f8f5" stroke="#c8d6cb" stroke-width="1.5"/>
    <text x="1280" y="618" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1280" dy="0">/usr/bin/time cal &gt; /dev/null: </tspan>
      <tspan x="1280" dy="32">(2major+254minor)pagefaults </tspan>
      <tspan x="1280" dy="32">0swaps</tspan>
    </text>

    
    
    <rect x="1020" y="715" width="520" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1280" y="751" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 major: read from disk</text>

    
    <rect x="1020" y="780" width="520" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1280" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1280" dy="0">254 minor: page already in RAM, </tspan>
      <tspan x="1280" dy="32">no disk I/O</tspan>
    </text>

    
    <rect x="1020" y="870" width="520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1280" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Cheap start-up faults</text>
  </g>
</svg>