<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Reading time output: where did the wall-clock time go?</title>
  <desc>Visual infographic explaining time output real, user, and sys, waiting time, multi-core scaling, and page faults.</desc>
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading time output: where did the wall-clock time go?</text>

  
  <rect x="40" y="125" width="1520" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(65, 185)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <polyline points="28,14 28,28 38,28"/>
    <line x1="28" y1="4" x2="28" y2="0"/>
  </g>
  <text x="150" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36"><tspan font-weight="bold">real:</tspan> elapsed wall-clock time</text>
  <text x="150" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36"><tspan font-weight="bold">user:</tspan> CPU time in the program&apos;s own code</text>
  <text x="150" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36"><tspan font-weight="bold">sys:</tspan> CPU time the kernel spent on its behalf</text>

  
  <rect x="40" y="325" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(65, 365)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="32" height="32" rx="4"/>
    <rect x="20" y="20" width="16" height="16" rx="2"/>
    <line x1="20" y1="6" x2="20" y2="12"/>
    <line x1="36" y1="6" x2="36" y2="12"/>
    <line x1="20" y1="44" x2="20" y2="50"/>
    <line x1="36" y1="44" x2="36" y2="50"/>
    <line x1="6" y1="20" x2="12" y2="20"/>
    <line x1="6" y1="36" x2="12" y2="36"/>
    <line x1="44" y1="20" x2="50" y2="20"/>
    <line x1="44" y1="36" x2="50" y2="36"/>
  </g>
  <text x="150" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">real minus (user + sys) = time NOT on a CPU (disk, network, locks, scheduler)</text>
  <text x="150" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">user + sys larger than real = several cores used</text>

  
  <rect x="40" y="485" width="480" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(440, 505)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="6" x2="50" y2="6"/>
    <line x1="6" y1="50" x2="50" y2="50"/>
    <path d="M 12 6 C 12 28 32 28 32 28 C 32 28 52 28 52 6 M 12 50 C 12 28 32 28 32 28 C 32 28 52 28 52 50"/>
  </g>
  <text x="65" y="538" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36"><tspan x="65" dy="0">real 0.442 s, </tspan><tspan x="65" dy="32">user 0.052 s, sys 0.091 s</tspan></text>
  
  <rect x="65" y="625" width="430" height="64" rx="8" fill="#cbd5e1"/>
  <path d="M 73 625 L 115 625 L 115 689 L 73 689 A 8 8 0 0 1 65 681 L 65 633 A 8 8 0 0 1 73 625 Z" fill="#207448"/>
  <rect x="117" y="625" width="80" height="64" fill="#438e64"/>
  <text x="345" y="666" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">about 0.3 s waiting</text>
  
  <rect x="65" y="775" width="430" height="145" rx="10" fill="#db8129"/>
  <text x="280" y="836" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff"><tspan x="280" dy="0">The job is waiting, </tspan><tspan x="280" dy="38">not computing</tspan></text>

  
  <rect x="560" y="485" width="480" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(960, 505)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="44" height="44" rx="6"/>
    <rect x="12" y="12" width="13" height="13" rx="2"/>
    <rect x="31" y="12" width="13" height="13" rx="2"/>
    <rect x="12" y="31" width="13" height="13" rx="2"/>
    <rect x="31" y="31" width="13" height="13" rx="2"/>
  </g>
  <text x="585" y="538" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36"><tspan x="585" dy="0">real 10.0 s, </tspan><tspan x="585" dy="32">user 75.0 s, sys 3.0 s</tspan></text>
  
  <rect x="585" y="615" width="55" height="30" rx="6" fill="#94a3b8"/>
  <rect x="585" y="655" width="414" height="44" rx="6" fill="#207448"/>
  <rect x="1001" y="655" width="14" height="44" rx="4" fill="#438e64"/>
  
  <rect x="585" y="775" width="430" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="800" y="836" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448"><tspan x="800" dy="0">Multi-core CPU-bound: </tspan><tspan x="800" dy="38">about 7.8 cores busy</tspan></text>

  
  <rect x="1080" y="485" width="480" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1480, 505)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="28" cy="14" rx="20" ry="7"/>
    <path d="M 8 14 v 28 c 0 4 9 7 20 7 s 20 -3 20 -7 v -28"/>
    <path d="M 8 28 c 0 4 9 7 20 7 s 20 -3 20 -7"/>
  </g>
  <text x="1105" y="534" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36"><tspan x="1105" dy="0">/usr/bin/time cal &gt; /dev/null: </tspan><tspan x="1105" dy="30">(2major+254minor)pagefaults </tspan><tspan x="1105" dy="30">0swaps</tspan></text>
  
  <rect x="1105" y="625" width="8" height="22" rx="3" fill="#94a3b8"/>
  <rect x="1115" y="625" width="420" height="22" rx="3" fill="#207448"/>
  
  <rect x="1105" y="660" width="430" height="46" rx="8" fill="#f5f8f5" stroke="#b0bec5" stroke-width="2"/>
  <text x="1320" y="692" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 major: read from disk</text>
  <rect x="1105" y="718" width="430" height="70" rx="8" fill="#f5f8f5" stroke="#b0bec5" stroke-width="2"/>
  <text x="1320" y="748" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan x="1320" dy="0">254 minor: page already </tspan><tspan x="1320" dy="28">in RAM, no disk I/O</tspan></text>
  
  <rect x="1105" y="805" width="430" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1320" y="872" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Cheap start-up faults</text>
</svg>