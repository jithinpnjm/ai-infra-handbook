<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>PAM stack evaluation order</title>
  <desc>Worked trace of a PAM auth stack showing how sufficient, requisite, and required control flags evaluate step by step.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">PAM stack evaluation (/etc/pam.d/chsh example)</text>

  <!-- Left: Stack steps 1..4 -->
  <!-- Step 1 -->
  <rect x="60" y="130" width="840" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <circle cx="106" cy="202" r="22" fill="#207448"/><text x="106" y="211" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">1</text>
  <text x="150" y="182" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">auth  sufficient  pam_rootok.so</text>
  <text x="150" y="222" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="150" dy="0">sufficient: if UID is 0 (and no prior required failed),</tspan>
    <tspan x="150" dy="30">stop immediately and SUCCEED; on fail, continue.</tspan>
  </text>

  <path d="M480 275 V316" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="505" y="303" fill="#303a36" font-family="sans-serif" font-size="24">fail</text>

  <!-- Step 2 -->
  <rect x="60" y="320" width="840" height="145" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <circle cx="106" cy="392" r="22" fill="#db8129"/><text x="106" y="401" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">2</text>
  <text x="150" y="372" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">auth  requisite   pam_shells.so</text>
  <text x="150" y="412" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="150" dy="0">requisite: shell must be in /etc/shells.</tspan>
    <tspan x="150" dy="30">On fail, STOP IMMEDIATELY and FAIL (no password prompt).</tspan>
  </text>

  <path d="M480 465 V506" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="505" y="493" fill="#303a36" font-family="sans-serif" font-size="24">pass</text>

  <!-- Step 3 -->
  <rect x="60" y="510" width="840" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <circle cx="106" cy="582" r="22" fill="#207448"/><text x="106" y="591" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">3</text>
  <text x="150" y="562" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">auth  sufficient  pam_unix.so</text>
  <text x="150" y="602" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="150" dy="0">Checks /etc/shadow password.</tspan>
    <tspan x="150" dy="30">On pass (with no prior required failure), SUCCEED.</tspan>
  </text>

  <path d="M480 655 V696" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="505" y="683" fill="#303a36" font-family="sans-serif" font-size="24">fail</text>

  <!-- Step 4 -->
  <rect x="60" y="700" width="840" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <circle cx="106" cy="772" r="22" fill="#207448"/><text x="106" y="781" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">4</text>
  <text x="150" y="752" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">auth  required    pam_deny.so</text>
  <text x="150" y="792" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="150" dy="0">required: default-deny fallback. Continues stack</tspan>
    <tspan x="150" dy="30">so timing does not leak, but final result is FAIL.</tspan>
  </text>

  <!-- Right side: Outcomes & 4 PAM types -->
  <path d="M900 202 H1096" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="998" y="188" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="24" font-weight="700">pass</text>

  <path d="M900 582 H960 V242 H1096" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="930" y="566" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="24" font-weight="700">pass</text>

  <rect x="1100" y="130" width="460" height="150" rx="16" fill="#207448"/>
  <text x="1330" y="196" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="32" font-weight="700">ALLOW</text>
  <text x="1330" y="242" text-anchor="middle" fill="#e8f1ea" font-family="sans-serif" font-size="24">Proceed to account &amp; session</text>

  <path d="M900 392 H1096" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="1028" y="378" text-anchor="middle" fill="#db8129" font-family="sans-serif" font-size="24" font-weight="700">fail</text>

  <path d="M900 772 H1030 V425 H1096" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)"/>

  <rect x="1100" y="325" width="460" height="150" rx="16" fill="#db8129"/>
  <text x="1330" y="391" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="32" font-weight="700">DENY</text>
  <text x="1330" y="437" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24">Reject authentication</text>

  <!-- 4 PAM types box -->
  <rect x="1070" y="510" width="490" height="335" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="1100" y="558" fill="#207448" font-family="sans-serif" font-size="28" font-weight="700">Four PAM module types</text>
  <text x="1100" y="606" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1100" dy="0" font-family="monospace" font-weight="700">auth</tspan><tspan x="1220">Who are you? (password, MFA)</tspan>
    <tspan x="1100" dy="50" font-family="monospace" font-weight="700">account</tspan><tspan x="1220">Allowed now? (expiry, nologin)</tspan>
    <tspan x="1100" dy="50" font-family="monospace" font-weight="700">session</tspan><tspan x="1220">Setup/teardown (limits, slurm)</tspan>
    <tspan x="1100" dy="50" font-family="monospace" font-weight="700">password</tspan><tspan x="1220">Update credentials</tspan>
  </text>

  <!-- Takeaway bar -->
  <rect x="60" y="875" width="1500" height="72" rx="14" fill="#207448"/>
  <text x="810" y="921" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="25" font-weight="700">Applications (sshd, sudo, login) call libpam; /etc/pam.d/other is the deny-all fallback.</text>
</svg>
