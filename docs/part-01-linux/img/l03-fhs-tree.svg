<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>The standard layout</title>
  <desc>Visual explanation of the standard Linux filesystem hierarchy tree rooted at slash with its primary subdirectories, purposes, and symbolic links.</desc>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The standard layout</text>

  
  <rect x="710" y="85" width="180" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(745, 120)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="0" cy="-12" rx="18" ry="7"/>
    <path d="M -18 -12 v 24 a 18 7 0 0 0 36 0 v -24"/>
    <path d="M -18 0 a 18 7 0 0 0 36 0"/>
  </g>
  <text x="815" y="132" font-family="monospace" font-size="38" font-weight="bold" fill="#207448" text-anchor="middle">/</text>

  
  <path d="M 800 155 L 800 865" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  
  <path d="M 800 265 L 755 265" stroke="#207448" stroke-width="4"/>
  <polygon points="755,265 771,257 771,273" fill="#207448"/>
  <path d="M 800 265 L 845 265" stroke="#207448" stroke-width="4"/>
  <polygon points="845,265 829,257 829,273" fill="#207448"/>

  
  <path d="M 800 415 L 755 415" stroke="#207448" stroke-width="4"/>
  <polygon points="755,415 771,257 771,273" transform="translate(0, 150)" fill="#207448"/>
  <path d="M 800 415 L 845 415" stroke="#207448" stroke-width="4"/>
  <polygon points="845,415 829,257 829,273" transform="translate(0, 150)" fill="#207448"/>

  
  <path d="M 800 565 L 755 565" stroke="#207448" stroke-width="4"/>
  <polygon points="755,565 771,257 771,273" transform="translate(0, 300)" fill="#207448"/>
  <path d="M 800 565 L 845 565" stroke="#207448" stroke-width="4"/>
  <polygon points="845,565 829,257 829,273" transform="translate(0, 300)" fill="#207448"/>

  
  <path d="M 800 715 L 755 715" stroke="#db8129" stroke-width="4"/>
  <polygon points="755,715 771,707 771,723" fill="#db8129"/>
  <path d="M 800 715 L 845 715" stroke="#207448" stroke-width="4"/>
  <polygon points="845,715 829,257 829,273" transform="translate(0, 450)" fill="#207448"/>

  
  <path d="M 800 865 L 755 865" stroke="#207448" stroke-width="4"/>
  <polygon points="755,865 771,257 771,273" transform="translate(0, 600)" fill="#207448"/>
  <path d="M 800 865 L 845 865" stroke="#207448" stroke-width="4"/>
  <polygon points="845,865 829,257 829,273" transform="translate(0, 600)" fill="#207448"/>

  

  
  <g transform="translate(45, 198)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-18" y="-18" width="36" height="36" rx="4"/>
      <path d="M -8 -8 L 8 8 M 8 -8 L -8 8"/>
      <path d="M -10 -24 v 6 M 0 -24 v 6 M 10 -24 v 6"/>
      <path d="M -10 18 v 6 M 0 18 v 6 M 10 18 v 6"/>
      <path d="M -24 -10 h 6 M -24 0 h 6 M -24 10 h 6"/>
      <path d="M 18 -10 h 6 M 18 0 h 6 M 18 10 h 6"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/boot</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">kernel image and initramfs</text>
  </g>

  
  <g transform="translate(45, 348)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="-20" y1="-14" x2="20" y2="-14"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="-20" y1="14" x2="20" y2="14"/>
      <circle cx="-8" cy="-14" r="5" fill="#e8f1ea"/>
      <circle cx="8" cy="0" r="5" fill="#e8f1ea"/>
      <circle cx="-4" cy="14" r="5" fill="#e8f1ea"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/etc</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">system-wide configuration (plain text)</text>
  </g>

  
  <g transform="translate(45, 498)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-14" y="-12" width="28" height="26" rx="3"/>
      <line x1="-7" y1="-12" x2="-7" y2="-22"/>
      <line x1="7" y1="-12" x2="7" y2="-22"/>
      <path d="M 0 14 v 12"/>
      <circle cx="0" cy="0" r="4" fill="#207448"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/dev</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">device files</text>
  </g>

  
  <g transform="translate(45, 648)">
    <rect width="710" height="134" rx="12" fill="#fcf3eb" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="10"/>
      <path d="M 0 -20 v 6 M 0 14 v 6 M -20 0 h 6 M 14 0 h 6"/>
      <path d="M -14 -14 l 4 4 M 10 10 l 4 4 M -14 14 l 4 -4 M 10 -10 l 4 -4"/>
    </g>
    <text x="116" y="52" fill="#db8129">
      <tspan font-family="monospace" font-size="32" font-weight="bold">/proc</tspan>
      <tspan font-family="sans-serif" font-size="30" font-weight="bold"> and </tspan>
      <tspan font-family="monospace" font-size="32" font-weight="bold">/sys</tspan>
    </text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">virtual, generated by the kernel</text>
  </g>

  
  <g transform="translate(45, 798)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="3" r="18"/>
      <line x1="0" y1="3" x2="8" y2="-3"/>
      <line x1="0" y1="-15" x2="0" y2="-21"/>
      <line x1="-5" y1="-21" x2="5" y2="-21"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/run</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">runtime data since boot</text>
  </g>

  

  
  <g transform="translate(845, 198)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -18 -8 L 0 -18 L 18 -8 L 0 2 Z"/>
      <path d="M -18 -8 v 16 L 0 18 v -16"/>
      <path d="M 18 -8 v 16 L 0 18"/>
    </g>
    <text x="116" y="44" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/usr</text>
    <text x="116" y="78" font-family="sans-serif" font-size="24" fill="#303a36">bulk of installed software</text>
    <text x="116" y="112" fill="#303a36">
      <tspan font-family="sans-serif" font-size="24">(</tspan><tspan font-family="monospace" font-size="24">/usr/bin</tspan><tspan font-family="sans-serif" font-size="24">, </tspan><tspan font-family="monospace" font-size="24">/usr/lib</tspan><tspan font-family="sans-serif" font-size="24">, </tspan><tspan font-family="monospace" font-size="24">/usr/local</tspan><tspan font-family="sans-serif" font-size="24">)</tspan>
    </text>
  </g>

  
  <g transform="translate(845, 348)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="0" cy="-14" rx="18" ry="6"/>
      <path d="M -18 -14 v 12 a 18 6 0 0 0 36 0 v -12"/>
      <path d="M -18 -2 v 12 a 18 6 0 0 0 36 0 v -12"/>
      <path d="M -18 10 v 12 a 18 6 0 0 0 36 0 v -12"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/var</text>
    <text x="116" y="98" fill="#303a36">
      <tspan font-family="sans-serif" font-size="24">variable data </tspan><tspan font-family="sans-serif" font-size="24">(</tspan><tspan font-family="monospace" font-size="24">/var/log</tspan><tspan font-family="sans-serif" font-size="24">, </tspan><tspan font-family="monospace" font-size="24">/var/lib</tspan><tspan font-family="sans-serif" font-size="24">)</tspan>
    </text>
  </g>

  
  <g transform="translate(845, 498)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-18" y="-18" width="36" height="36" rx="4"/>
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-10" y1="0" x2="10" y2="0"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/opt</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">third-party software</text>
  </g>

  
  <g transform="translate(845, 648)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -20 -2 L 0 -18 L 20 -2"/>
      <path d="M -15 0 v 18 h 30 v -18"/>
      <path d="M -4 18 v -10 h 8 v 10"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/home</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">users' personal files</text>
  </g>

  
  <g transform="translate(845, 798)">
    <rect width="710" height="134" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 67)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="-16" y1="-18" x2="16" y2="-18"/>
      <line x1="-16" y1="18" x2="16" y2="18"/>
      <path d="M -14 -18 L 14 18"/>
      <path d="M 14 -18 L -14 18"/>
    </g>
    <text x="116" y="52" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">/tmp</text>
    <text x="116" y="98" font-family="sans-serif" font-size="24" fill="#303a36">temporary files</text>
  </g>

  
  <g transform="translate(45, 975)">
    <rect width="1510" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(58, 55)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -4 4 L 4 -4"/>
      <path d="M -1 -7 L 5 -13 a 8 8 0 0 1 12 12 L 11 15 a 8 8 0 0 1 -12 -2"/>
      <path d="M 1 7 L -5 13 a 8 8 0 0 1 -12 -12 L -11 -15 a 8 8 0 0 1 12 2"/>
    </g>
    <text x="116" y="64">
      <tspan font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Side note: </tspan>
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/bin</tspan>
      <tspan font-family="sans-serif" font-size="26" fill="#303a36">, </tspan>
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/sbin</tspan>
      <tspan font-family="sans-serif" font-size="26" fill="#303a36">, </tspan>
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/lib</tspan>
      <tspan font-family="sans-serif" font-size="26" fill="#303a36"> are symbolic links into </tspan>
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#207448">/usr</tspan>
    </text>
  </g>
</svg>