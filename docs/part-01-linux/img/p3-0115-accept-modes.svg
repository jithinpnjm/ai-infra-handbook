<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Socket activation: Accept=true versus Accept=false</title>
  <desc>Visual comparison of systemd socket activation modes: Accept=true where systemd accepts each connection and spawns per-connection template service instances, versus Accept=false where systemd passes the listening socket to a single daemon via sd_listen_fds.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>

    
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Socket activation: Accept=true versus Accept=false</text>

  
  <g id="top-client">
    
    <rect x="40" y="80" width="450" height="88" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(58, 96)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="32" rx="4" />
      <line x1="20" y1="46" x2="36" y2="46" />
      <line x1="28" y1="38" x2="28" y2="46" />
      <polyline points="14,18 20,22 14,26" />
      <line x1="24" y1="26" x2="34" y2="26" />
    </g>
    <text x="132" y="122" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">Client connects to</tspan>
      <tspan x="132" dy="30">port 22222</tspan>
    </text>
  </g>

  
  <line x1="490" y1="124" x2="538" y2="124" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <g id="top-socket">
    
    <rect x="548" y="80" width="1012" height="88" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(568, 96)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <circle cx="28" cy="28" r="8" fill="#e8f1ea" />
      <line x1="28" y1="6" x2="28" y2="14" />
      <line x1="28" y1="42" x2="28" y2="50" />
      <line x1="6" y1="28" x2="14" y2="28" />
      <line x1="42" y1="28" x2="50" y2="28" />
    </g>
    <text x="644" y="121" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="644" dy="0" font-family="monospace" font-weight="bold">echo.socket: ListenStream=22222</tspan>
      <tspan x="644" dy="30" font-family="sans-serif">(systemd holds the listening socket)</tspan>
    </text>
  </g>

  
  
  <path d="M 800 168 L 800 186 L 407 186 L 407 194" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <path d="M 1250 168 L 1250 186 L 1192 186 L 1192 194" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="lane-accept-true">
    
    <rect x="40" y="194" width="735" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g id="l1-header">
      <rect x="60" y="206" width="695" height="62" rx="10" fill="#207448" />
      <text x="407" y="252" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Accept=true</text>
    </g>

    
    <g id="l1-node-1">
      <rect x="60" y="280" width="695" height="88" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="96" cy="324" r="24" fill="#207448" />
      <text x="96" y="332" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(132, 296)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="14" />
        <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28" />
        <polyline points="22,28 27,33 36,23" />
      </g>
      
      <text x="204" y="321" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="204" dy="0">systemd itself calls accept()</tspan>
        <tspan x="204" dy="28">for each connection</tspan>
      </text>
    </g>

    
    <line x1="407" y1="368" x2="407" y2="382" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l1-node-2">
      <rect x="60" y="382" width="695" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="96" cy="439" r="24" fill="#207448" />
      <text x="96" y="447" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      
      
      <g id="three-stacked-instances" transform="translate(132, 412)" stroke="#207448" stroke-width="2.5" fill="#e8f1ea">
        <rect x="14" y="0" width="38" height="26" rx="4" />
        <rect x="7" y="10" width="38" height="26" rx="4" />
        <rect x="0" y="20" width="38" height="26" rx="4" fill="#ffffff" />
        <line x1="6" y1="28" x2="22" y2="28" stroke-width="2" />
        <line x1="6" y1="36" x2="30" y2="36" stroke-width="2" />
      </g>

      
      <text x="200" y="423" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="200" dy="0" font-weight="bold">it starts a NEW instance</tspan>
        <tspan x="200" dy="28">per connection named </tspan>
        <tspan x="200" dy="28" font-family="monospace" font-weight="bold">'echo@&lt;n&gt;-&lt;local&gt;-&lt;peer&gt;.service'</tspan>
      </text>
    </g>

    
    <line x1="407" y1="496" x2="407" y2="510" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l1-node-3">
      <rect x="60" y="510" width="695" height="138" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="96" cy="579" r="24" fill="#207448" />
      <text x="96" y="587" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(132, 551)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 6 L 36 6 L 48 18 L 48 50 L 8 50 Z" />
        <polyline points="36,6 36,18 48,18" />
        <line x1="16" y1="28" x2="36" y2="28" />
        <line x1="16" y1="38" x2="30" y2="38" />
      </g>
      
      <text x="202" y="550" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="202" dy="0">the service file is a template </tspan>
        <tspan x="202" dy="27" font-family="monospace" font-weight="bold">'echo@.service'</tspan>
        <tspan x="202" dy="27">with </tspan>
        <tspan font-family="monospace" font-weight="bold">'StandardInput=socket'</tspan>
        <tspan x="202" dy="27">and </tspan>
        <tspan font-family="monospace" font-weight="bold">'ExecStart=/bin/cat'</tspan>
      </text>
    </g>

    
    <line x1="407" y1="648" x2="407" y2="662" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l1-node-4">
      <rect x="60" y="662" width="695" height="138" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="96" cy="731" r="24" fill="#207448" />
      <text x="96" y="739" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(132, 703)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="48" height="38" rx="4" />
        <polyline points="12,22 18,27 12,32" />
        <line x1="22" y1="32" x2="32" y2="32" />
        <line x1="38" y1="22" x2="44" y2="27" />
        <line x1="44" y1="27" x2="38" y2="32" />
      </g>
      
      <text x="202" y="702" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="202" dy="0">the connection is the service's </tspan>
        <tspan x="202" dy="27">standard input and output </tspan>
        <tspan x="202" dy="27">so it does not need to know </tspan>
        <tspan x="202" dy="27">it is a network</tspan>
      </text>
    </g>

    
    <g id="l1-note">
      <rect x="60" y="824" width="695" height="58" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
      <text x="407" y="865" text-anchor="middle" font-family="sans-serif" font-size="25" font-style="italic" fill="#303a36">suits only simple services</text>
    </g>
  </g>

  
  <g id="lane-accept-false">
    
    <rect x="825" y="194" width="735" height="710" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />

    
    <g id="l2-header">
      <rect x="845" y="206" width="695" height="62" rx="10" fill="#db8129" />
      <text x="1192" y="252" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#ffffff">Accept=false (default)</text>
    </g>

    
    <g id="l2-node-1">
      <rect x="845" y="280" width="695" height="124" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="881" cy="342" r="24" fill="#207448" />
      <text x="881" y="350" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(917, 314)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="28" r="12" />
        <rect x="34" y="16" width="18" height="24" rx="3" />
        <line x1="28" y1="28" x2="34" y2="28" />
        <polyline points="28,24 32,28 28,32" />
      </g>
      
      <text x="985" y="322" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="985" dy="0" font-weight="bold">systemd passes the LISTENING </tspan>
        <tspan x="985" dy="28">socket to one service </tspan>
        <tspan font-family="monospace" font-weight="bold">'echo.service' </tspan>
        <tspan x="985" dy="28">(not a template)</tspan>
      </text>
    </g>

    
    <line x1="1192" y1="404" x2="1192" y2="424" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l2-node-2">
      <rect x="845" y="424" width="695" height="124" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="881" cy="486" r="24" fill="#207448" />
      <text x="881" y="494" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      
      <g transform="translate(917, 458)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="18" stroke-dasharray="24 6" />
        <polyline points="26,10 32,10 32,16" />
        <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea" />
      </g>
      
      <text x="985" y="466" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="985" dy="0">the service calls accept() </tspan>
        <tspan x="985" dy="28">itself and keeps control </tspan>
        <tspan x="985" dy="28">until it exits</tspan>
      </text>
    </g>

    
    <line x1="1192" y1="548" x2="1192" y2="568" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l2-node-3">
      <rect x="845" y="568" width="695" height="138" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
      
      <circle cx="881" cy="637" r="24" fill="#207448" />
      <text x="881" y="645" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(917, 609)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="44" height="44" rx="4" />
        <line x1="6" y1="20" x2="50" y2="20" />
        <line x1="22" y1="20" x2="22" y2="50" />
        <path d="M 12 28 Q 16 28 16 33 Q 16 38 12 38 M 16 33 Q 16 31 13 31" />
        <line x1="28" y1="35" x2="44" y2="35" />
      </g>
      
      <text x="985" y="609" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="985" dy="0">it receives the descriptor in </tspan>
        <tspan font-family="monospace" font-weight="bold">$LISTEN_FDS</tspan>
        <tspan x="985" dy="28">starting at descriptor 3 through </tspan>
        <tspan x="985" dy="28" font-family="monospace" font-weight="bold">sd_listen_fds()</tspan>
      </text>
    </g>

    
    <line x1="1192" y1="706" x2="1192" y2="732" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="l2-note">
      <rect x="845" y="732" width="695" height="138" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" filter="url(#card-shadow)" />
      
      <g transform="translate(865, 773)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="14" rx="3" />
        <circle cx="14" cy="15" r="2" fill="#db8129" />
        <rect x="6" y="28" width="44" height="14" rx="3" />
        <circle cx="14" cy="35" r="2" fill="#db8129" />
      </g>
      
      <text x="940" y="790" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="940" dy="0">real servers that understand </tspan>
        <tspan x="940" dy="34">socket activation use this form</tspan>
      </text>
    </g>
  </g>

  
  <g id="footer-test-strip">
    
    <rect x="40" y="924" width="1520" height="152" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    
    <g id="cmd-1">
      <rect x="60" y="940" width="715" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(76, 954)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="115" y="980" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo systemctl start echo.socket</text>
    </g>

    
    <g id="cmd-2">
      <rect x="825" y="940" width="715" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(841, 954)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="880" y="980" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ss -ltn | grep 22222</text>
    </g>

    
    
    <g id="cmd-3">
      <rect x="60" y="1004" width="715" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(76, 1018)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="115" y="1044" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">echo hi | nc localhost 22222</text>
    </g>

    
    <g id="cmd-4">
      <rect x="825" y="1004" width="715" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.8" />
      <g transform="translate(841, 1018)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="4,4 10,12 4,20" />
        <line x1="14" y1="20" x2="22" y2="20" />
      </g>
      <text x="880" y="1044" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">systemctl list-sockets</text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1098" width="1520" height="62" rx="10" fill="#207448" />
    <text x="800" y="1143" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">With Accept=false the service must support the handoff</text>
  </g>
</svg>