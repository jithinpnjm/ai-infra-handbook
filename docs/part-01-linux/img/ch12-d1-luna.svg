<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>The storage stack in one picture</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L18 9L0 18Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L18 9L0 18Z" fill="#db8129"/>
    </marker>
    <style>
      .bg { fill: #f5f8f5; }
      .card { fill: #e8f1ea; stroke: #b8cec0; stroke-width: 2; }
      .text { fill: #303a36; font-family: sans-serif; }
      .title { font-size: 48px; font-weight: 700; }
      .node-title { font-size: 30px; font-weight: 700; }
      .detail { font-size: 24px; font-weight: 400; }
      .icon { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .bypass { fill: none; stroke: #db8129; stroke-width: 4; stroke-dasharray: 4 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .direct { fill: none; stroke: #207448; stroke-width: 4; stroke-dasharray: 4 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .edge-label { fill: #f5f8f5; stroke: #b8cec0; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>
  <text class="text title" x="800" y="76" text-anchor="middle">The storage stack in one picture</text>

  <g aria-label="Application / language runtime">
    <rect class="card" x="100" y="120" width="1040" height="76" rx="18"/>
    <g class="icon" transform="translate(132 130)">
      <rect x="2" y="5" width="52" height="44" rx="5"/>
      <path d="M2 17h52M12 11h1M20 11h1M18 28l7 6-7 6M31 40h10"/>
    </g>
    <text class="text node-title" x="220" y="151">Application / language runtime</text>
    <text class="text detail" x="220" y="181">(libc buffers, mmap, O_DIRECT, io_uring)</text>
  </g>

  <g aria-label="System call interface">
    <rect class="card" x="100" y="222" width="1040" height="76" rx="18"/>
    <g class="icon" transform="translate(132 232)">
      <rect x="2" y="5" width="52" height="44" rx="5"/>
      <path d="M2 17h52M14 29l7 6-7 6M28 41h15"/>
    </g>
    <text class="text node-title" x="220" y="253">System call interface</text>
    <text class="text detail" x="220" y="283">read write open fsync mmap</text>
  </g>

  <g aria-label="VFS: common interface; dentry cache, inode cache">
    <rect class="card" x="100" y="324" width="1040" height="76" rx="18"/>
    <g class="icon" transform="translate(132 334)">
      <path d="M4 14h20l6 7h22v27H4z"/>
      <path d="M17 28v12M37 28v12M17 34h20M17 40h1M36 40h1"/>
      <circle cx="17" cy="27" r="2"/><circle cx="37" cy="27" r="2"/>
    </g>
    <text class="text node-title" x="220" y="352">VFS: common interface;</text>
    <text class="text detail" x="220" y="382">dentry cache, inode cache</text>
  </g>

  <g aria-label="Filesystem driver">
    <rect class="card" x="100" y="426" width="1040" height="94" rx="18"/>
    <g class="icon" transform="translate(132 445)">
      <path d="M4 17h20l6 7h22v25H4z"/>
      <path d="M4 24h48"/>
      <path d="M14 32h29M14 40h22"/>
    </g>
    <text class="text node-title" x="220" y="454">Filesystem driver</text>
    <text class="text detail" x="220" y="482">ext4 / XFS / btrfs / NFS client /</text>
    <text class="text detail" x="220" y="508">Lustre client / overlayfs / tmpfs</text>
  </g>

  <g aria-label="Page cache (buffered I/O): read-ahead, write-back, dirty pages">
    <rect class="card" x="100" y="546" width="1040" height="76" rx="18"/>
    <g class="icon" transform="translate(132 556)">
      <path d="M8 6h34l10 10v32H8z"/>
      <path d="M42 6v11h10M16 25h26M16 33h26M16 41h18"/>
    </g>
    <text class="text node-title" x="220" y="574">Page cache (buffered I/O):</text>
    <text class="text detail" x="220" y="604">read-ahead, write-back, dirty pages</text>
  </g>

  <g aria-label="Block layer: I/O merging, I/O scheduler (none, mq-deadline, bfq, kyber), cgroup I/O control">
    <rect class="card" x="100" y="648" width="1040" height="128" rx="18"/>
    <g class="icon" transform="translate(132 680)">
      <path d="M28 3l5 4 7-1 3 6 7 3-1 7 4 6-4 6 1 7-7 3-3 6-7-1-5 4-5-4-7 1-3-6-7-3 1-7-4-6 4-6-1-7 7-3 3-6 7 1z"/>
      <circle cx="28" cy="30" r="10"/>
      <path d="M28 16v5M28 39v5M14 30h5M37 30h5"/>
    </g>
    <text class="text node-title" x="220" y="675">Block layer:</text>
    <text class="text detail" x="220" y="703">I/O merging, I/O scheduler</text>
    <text class="text detail" x="220" y="731">(none, mq-deadline, bfq, kyber),</text>
    <text class="text detail" x="220" y="757">cgroup I/O control</text>
  </g>

  <g aria-label="Device mapper / LVM / md RAID / dm-crypt (virtual block devices)">
    <rect class="card" x="100" y="802" width="1040" height="88" rx="18"/>
    <g class="icon" transform="translate(132 818)">
      <path d="M6 8h39l7 7-7 7H6zM6 23h39l7 7-7 7H6zM6 38h39l7 7-7 7H6z"/>
      <path d="M15 15h22M15 30h22M15 45h22"/>
    </g>
    <text class="text node-title" x="220" y="834">Device mapper / LVM / md RAID /</text>
    <text class="text detail" x="220" y="864">dm-crypt (virtual block devices)</text>
  </g>

  <g aria-label="Device drivers: SCSI (sd) / NVMe / virtio-blk / libata">
    <rect class="card" x="100" y="916" width="1040" height="100" rx="18"/>
    <g class="icon" transform="translate(132 932)">
      <path d="M18 7v17M38 7v17M18 24h20v10a10 10 0 0 1-10 10h0a10 10 0 0 1-10-10z"/>
      <path d="M28 44v9M20 53h16"/>
      <path d="M13 7h10M33 7h10"/>
    </g>
    <text class="text node-title" x="220" y="948">Device drivers:</text>
    <text class="text detail" x="220" y="976">SCSI (sd) / NVMe / virtio-blk /</text>
    <text class="text detail" x="220" y="1000">libata</text>
  </g>

  <g aria-label="Device: HDD / SSD / NVMe (own cache and queue) / SAN LUN / cloud disk">
    <rect class="card" x="100" y="1042" width="1040" height="100" rx="18"/>
    <g class="icon" transform="translate(132 1058)">
      <path d="M4 13c0-6 48-6 48 0v28c0 6-48 6-48 0z"/>
      <path d="M4 13c0 6 48 6 48 0M4 27c0 6 48 6 48 0"/>
      <path d="M42 35h1"/>
    </g>
    <text class="text node-title" x="220" y="1074">Device: HDD / SSD / NVMe</text>
    <text class="text detail" x="220" y="1102">(own cache and queue) / SAN LUN /</text>
    <text class="text detail" x="220" y="1126">cloud disk</text>
  </g>

  <path class="flow" d="M620 196V222"/>
  <path class="flow" d="M620 298V324"/>
  <path class="flow" d="M620 400V426"/>
  <path class="flow" d="M620 520V546"/>
  <path class="flow" d="M620 622V648"/>
  <path class="flow" d="M620 776V802"/>
  <path class="flow" d="M620 890V916"/>
  <path class="flow" d="M620 1016V1042"/>

  <path class="bypass" d="M1140 473H1170V680H1140"/>
  <path class="direct" d="M1140 158H1570V708H1140"/>

  <g>
    <rect class="edge-label" x="1192" y="316" width="348" height="76" rx="14"/>
    <text class="text detail" x="1208" y="346">raw block device I/O</text>
    <text class="text detail" x="1208" y="376">(rare)</text>
  </g>
  <g>
    <rect class="edge-label" x="1192" y="562" width="348" height="76" rx="14"/>
    <text class="text detail" x="1208" y="592">O_DIRECT bypasses</text>
    <text class="text detail" x="1208" y="622">page cache</text>
  </g>
</svg>