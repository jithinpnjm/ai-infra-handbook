<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>TLB reach: entries times page size, and why huge pages help</title>
  <desc>Visual comparison of TLB reach across page sizes, illustrating the page walk bottleneck on 256 GiB datasets with 4 KiB pages and how huge pages resolve it.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">TLB reach: entries times page size,</tspan>
    <tspan x="800" dy="54">and why huge pages help</tspan>
  </text>

  
  <rect x="40" y="140" width="1520" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 162)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="48" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <text x="146" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">TLB reach = number of entries x page size</text>
  <text x="146" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a data TLB with 64 entries for 4 KiB pages</text>

  
  <rect x="40" y="280" width="740" height="580" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 308)">
    <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="12" y1="16" x2="24" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="68" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">4 KiB pages: 64 x 4 KiB = 256 KiB reach</text>
  <rect x="68" y="434" width="684" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <rect x="68" y="434" width="24" height="42" rx="6" fill="#db8129" />

  
  <text x="68" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 MiB huge pages: 64 x 2 MiB = 128 MiB reach</text>
  <rect x="68" y="580" width="684" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <rect x="68" y="580" width="342" height="42" rx="8" fill="#207448" />

  
  <text x="68" y="708" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">1 GiB huge pages: 64 x 1 GiB = 64 GiB reach</text>
  <rect x="68" y="726" width="684" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <rect x="68" y="726" width="684" height="42" rx="8" fill="#207448" />

  
  <rect x="820" y="280" width="740" height="580" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(848, 308)">
    <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M6 14 v28 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8 v-28" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M6 28 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="920" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">The 256 GiB dataset problem</text>

  
  <text x="848" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="848" dy="0">256 GiB mapped with 4 KiB pages needs</tspan>
    <tspan x="848" dy="34">67 million page-table entries; the TLB</tspan>
    <tspan x="848" dy="34">caches only a few dozen, so most accesses</tspan>
    <tspan x="848" dy="34">pay a page walk</tspan>
  </text>

  
  
  <rect x="848" y="556" width="684" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(864, 570)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M12 20 l6 6 l12 -12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="918" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">TLB hit: almost nothing</text>

  
  <rect x="848" y="642" width="684" height="196" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(864, 660)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="20 10 20 20 28 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="918" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="918" dy="0" font-weight="bold">TLB miss: hardware page-table walk,</tspan>
    <tspan x="918" dy="34">tens to hundreds of cycles; if the table</tspan>
    <tspan x="918" dy="34">entries miss the CPU caches,</tspan>
    <tspan x="918" dy="34">about a hundred nanoseconds</tspan>
  </text>

  
  <rect x="40" y="900" width="1520" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 922)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M18 34 l10 -12 l6 6 l10 -10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="36 18 44 18 44 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="146" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="146" dy="0" font-weight="bold">Huge pages shrink the page table, shorten the walk and raise TLB reach by 512x or more;</tspan>
    <tspan x="146" dy="36">typical gain 3% to 10%, larger on memory-heavy workloads</tspan>
  </text>

  
  <rect x="40" y="1040" width="1520" height="90" rx="14" fill="#207448" />
  <text x="800" y="1096" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A multi-gigabyte working set on 4 KiB pages misses the TLB constantly</text>
</svg>