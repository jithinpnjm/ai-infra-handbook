<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Shutdown order and where a 90 second reboot delay comes from</title>
  <desc>Visual infographic explaining the systemd shutdown sequence, the origin of 90-second reboot delays, shutdown commands, diagnostic procedures, and rescue boot options.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Shutdown order and where a 90 second reboot delay comes from</text>

  

  
  <rect x="40" y="110" width="880" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="78" cy="151" r="24" fill="#207448"/>
  <text x="78" y="159" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <polygon points="144,141 130,151 144,161" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="158,141 144,151 158,161" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  
  <text x="180" y="143" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">shutdown.target reached:</tspan>
    <tspan x="180" dy="32">boot sequence played backwards</tspan>
  </text>

  
  <line x1="480" y1="192" x2="480" y2="216" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="40" y="216" width="880" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="78" cy="257" r="24" fill="#207448"/>
  <text x="78" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <circle cx="144" cy="257" r="9" stroke="#207448" stroke-width="3.5" fill="none"/>
  <path d="M144,242 v4 M144,268 v4 M129,257 h4 M155,257 h4 M134,247 l3,3 M151,264 l3,3 M134,267 l3,-3 M151,250 l3,-3" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="180" y="249" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">systemd stops units in the</tspan>
    <tspan x="180" dy="32">reverse order of their start</tspan>
  </text>

  
  <line x1="480" y1="298" x2="480" y2="322" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="40" y="322" width="880" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="78" cy="363" r="24" fill="#207448"/>
  <text x="78" y="371" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <rect x="126" y="348" width="36" height="30" rx="4" stroke="#207448" stroke-width="3.5" fill="none"/>
  <path d="M134,363 h5 l3,-7 l4,14 l3,-7 h5" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="180" y="355" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Sends SIGTERM to the</tspan>
    <tspan x="180" dy="32">remaining processes</tspan>
  </text>

  
  <line x1="480" y1="404" x2="480" y2="428" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="40" y="428" width="880" height="82" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
  <circle cx="78" cy="469" r="24" fill="#db8129"/>
  <text x="78" y="477" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <circle cx="144" cy="469" r="17" stroke="#db8129" stroke-width="3.5" fill="none"/>
  <polyline points="144,458 144,469 153,469" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="180" y="461" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Waits DefaultTimeoutStopSec,</tspan>
    <tspan x="180" dy="32">typically 90 s</tspan>
  </text>

  
  <line x1="480" y1="510" x2="480" y2="534" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="40" y="534" width="880" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="78" cy="575" r="24" fill="#207448"/>
  <text x="78" y="583" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <ellipse cx="144" cy="565" rx="16" ry="6" stroke="#207448" stroke-width="3.5" fill="none"/>
  <path d="M128,565 v10 c0,3.5 7,6 16,6 s16,-2.5 16,-6 v-10" stroke="#207448" stroke-width="3.5" fill="none"/>
  <path d="M128,575 v10 c0,3.5 7,6 16,6 s16,-2.5 16,-6 v-10" stroke="#207448" stroke-width="3.5" fill="none"/>
  
  <text x="180" y="567" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Sends SIGKILL, unmounts filesystems,</tspan>
    <tspan x="180" dy="32">remounts root read-only</tspan>
  </text>

  
  <line x1="480" y1="616" x2="480" y2="640" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="40" y="640" width="880" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="78" cy="681" r="24" fill="#207448"/>
  <text x="78" y="689" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  
  <path d="M156,674 A 14 14 0 1 0 144,695" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <polyline points="156,666 156,675 147,675" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="180" y="691" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Calls reboot(2)</text>

  
  <rect x="40" y="746" width="880" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M78,774 L98,784 V804 C98,816 78,825 78,825 C78,825 58,816 58,804 V784 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  <line x1="78" y1="791" x2="78" y2="803" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="78" cy="811" r="2" fill="#207448"/>

  
  <text x="120" y="784" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">A unit that delays shutdown by 90 seconds each time</tspan>
    <tspan x="120" dy="32">usually has a TimeoutStopSec, mount or</tspan>
    <tspan x="120" dy="32">signal-handling problem</tspan>
  </text>

  
  <rect x="68" y="876" width="824" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="96" y="923" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">&gt;_</text>
  <text x="156" y="924" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">journalctl -b -1 -e</text>

  
  <rect x="950" y="110" width="610" height="866" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="994" cy="154" r="15" stroke="#207448" stroke-width="3.5" fill="none"/>
  <line x1="994" y1="142" x2="994" y2="154" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="1026" y="163" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">How to shut down</text>

  
  <rect x="975" y="196" width="560" height="84" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
  <text x="1005" y="247" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">&gt;</text>
  <text x="1035" y="247" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">shutdown -h now</text>

  
  <rect x="975" y="296" width="560" height="84" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
  <text x="1005" y="347" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">&gt;</text>
  <text x="1035" y="347" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">systemctl poweroff</text>

  
  <rect x="975" y="396" width="560" height="152" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
  <text x="1005" y="442" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">&gt;</text>
  <text x="1035" y="442" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">shutdown -r +10</text>
  <text x="1035" y="480" font-family="sans-serif" font-size="24" fill="#303a36">schedules a reboot and creates</text>
  <text x="1035" y="518" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">/etc/nologin</tspan>
    <tspan font-family="sans-serif"> shortly before</tspan>
  </text>

  
  <rect x="975" y="564" width="560" height="84" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
  <text x="1005" y="615" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">&gt;</text>
  <text x="1035" y="615" font-size="26" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">shutdown -c</tspan>
    <tspan font-family="sans-serif"> cancels</tspan>
  </text>

  
  <rect x="975" y="664" width="560" height="286" rx="8" fill="#ffffff" stroke="#c2d9c8" stroke-width="1.5"/>
  <text x="1005" y="714" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">&gt;</text>
  <text x="1035" y="714" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">systemctl reboot --force</tspan>
    <tspan font-family="sans-serif"> and </tspan>
    <tspan font-family="monospace" font-weight="bold">-ff</tspan>
  </text>
  <text x="1035" y="756" font-family="sans-serif" font-size="24" fill="#303a36">skip the unit stop:</text>
  <text x="1035" y="798" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">unclean last resort</text>

  
  <rect x="40" y="1000" width="1520" height="74" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="78" cy="1037" r="16" stroke="#207448" stroke-width="3" fill="none"/>
  <circle cx="78" cy="1037" r="7" stroke="#207448" stroke-width="2.5" fill="none"/>
  <line x1="67" y1="1026" x2="72" y2="1031" stroke="#207448" stroke-width="2.5"/>
  <line x1="89" y1="1026" x2="84" y2="1031" stroke="#207448" stroke-width="2.5"/>
  <line x1="67" y1="1048" x2="72" y2="1043" stroke="#207448" stroke-width="2.5"/>
  <line x1="89" y1="1048" x2="84" y2="1043" stroke="#207448" stroke-width="2.5"/>
  
  <text x="120" y="1046" font-size="26" fill="#303a36">
    <tspan font-family="sans-serif">boot with </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">systemd.unit=rescue.target</tspan>
    <tspan font-family="sans-serif"> or </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">emergency.target</tspan>
  </text>

  
  <rect x="40" y="1094" width="1520" height="66" rx="8" fill="#207448"/>
  <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">If a reboot waits, you have found the slow unit</text>
</svg>