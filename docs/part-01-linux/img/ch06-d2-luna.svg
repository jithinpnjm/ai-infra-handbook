<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <title>Which file is read when (bash)</title>
  <desc>Decision flow showing which bash startup files are read for non-interactive, login, and interactive non-login shells.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1020" fill="#f5f8f5"/>
  <text x="800" y="76" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Which file is read when (bash)</text>

  <!-- bash starts -->
  <rect x="570" y="120" width="460" height="96" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="608" y="144" width="52" height="44" rx="6"/>
    <path d="M620 158l10 8-10 8 M636 174h12"/>
  </g>
  <text x="684" y="178" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="700">bash starts</text>

  <path d="M800 216 V272" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- interactive? -->
  <rect x="570" y="276" width="460" height="100" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="608" y="304" width="52" height="44" rx="6"/>
    <path d="M608 318h52"/>
  </g>
  <text x="684" y="336" fill="#303a36" font-family="sans-serif" font-size="32" font-weight="700">interactive?</text>

  <!-- Left branch: no (script, cron, ssh host cmd) -->
  <path d="M570 326 H310 V496" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="145" y="365" width="330" height="82" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
  <text x="310" y="400" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="310" dy="0">no (script, cron,</tspan>
    <tspan x="310" dy="30">ssh host cmd)</tspan>
  </text>

  <rect x="60" y="500" width="500" height="164" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 544h30l12 12v38H96z M126 544v12h12 M106 568h22 M106 580h22"/>
  </g>
  <text x="164" y="562" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="164" dy="0">reads nothing by default</tspan>
  </text>
  <text x="164" y="618" fill="#303a36" font-family="sans-serif" font-size="24">(BASH_ENV if set)</text>

  <!-- Right branch: yes -> login shell? -->
  <path d="M1030 326 H1190 V466" fill="none" stroke="#db8129" stroke-width="4.5" marker-end="url(#orange-arrow)"/>
  <rect x="1142" y="370" width="96" height="46" rx="12" fill="#f5f8f5" stroke="#db8129" stroke-width="2.5"/>
  <text x="1190" y="402" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">yes</text>

  <!-- login shell? -->
  <rect x="860" y="470" width="660" height="176" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="896" y="502" width="52" height="44" rx="6"/>
    <path d="M896 516h52"/>
  </g>
  <text x="970" y="528" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">login shell?</text>
  <text x="970" y="568" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="970" dy="0">(first char of $0 is '-', or bash -l,</tspan>
    <tspan x="970" dy="32">SSH or console login)</tspan>
  </text>

  <!-- login shell yes -> /etc/profile -->
  <path d="M900 646 V702 H400 V756" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="612" y="680" width="96" height="44" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
  <text x="660" y="710" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">yes</text>

  <!-- login shell no -> /etc/bash.bashrc -->
  <path d="M1260 646 V756" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="970" y="662" width="560" height="74" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
  <text x="1250" y="694" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1250" dy="0">no (new terminal window,</tspan>
    <tspan x="1250" dy="29">bash typed in a session)</tspan>
  </text>

  <!-- Bottom left box -->
  <rect x="60" y="760" width="690" height="210" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 806h30l12 12v38H96z M126 806v12h12 M106 830h22 M106 842h22"/>
  </g>
  <text x="164" y="818" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="164" dy="0">/etc/profile, then the FIRST FOUND of</tspan>
    <tspan x="164" dy="36">~/.bash_profile, ~/.bash_login,</tspan>
    <tspan x="164" dy="36">~/.profile</tspan>
  </text>

  <!-- Bottom right box -->
  <rect x="830" y="760" width="710" height="210" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M866 806h30l12 12v38h-42z M896 806v12h12 M876 830h22 M876 842h22"/>
  </g>
  <text x="934" y="828" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="934" dy="0">/etc/bash.bashrc (Debian family),</tspan>
    <tspan x="934" dy="38">then ~/.bashrc</tspan>
  </text>
</svg>
