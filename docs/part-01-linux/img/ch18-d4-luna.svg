  </g>
  <g>
    <use href="#folder" x="1802" y="612" width="56" height="56"/>
    <text x="1830" y="697" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24">
      <tspan x="1830">kubepods-</tspan>
      <tspan x="1830" dy="30">besteffort.slice</tspan>
