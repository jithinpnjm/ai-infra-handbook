<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1280" viewBox="0 0 2340 1280">
  <title>Systemd, Docker, Slurm and the cgroup tree</title>
  <desc>Hierarchy of cgroup slices and scopes.</desc>
  <defs>
