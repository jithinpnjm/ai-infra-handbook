<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>What a kernel module is</title>
  <desc>Architecture showing user-space CUDA apps and modprobe loading kernel modules and talking to GPUs and ConnectX NICs.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">What a kernel module is</text>

  <!-- Container 1: User space (x=35..345) -->
  <rect x="35" y="110" width="310" height="900" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="190" y="158" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">User space</text>

  <!-- 210px gutter (x=345..555) for cross-boundary syscall labels -->

  <!-- Container 2: Kernel space (x=555..1245) -->
  <rect x="555" y="110" width="690" height="900" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="900" y="158" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">Kernel space</text>

  <!-- Container 3: Hardware (x=1285..1565) -->
  <rect x="1285" y="110" width="280" height="900" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="1425" y="158" text-anchor="middle" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">Hardware</text>

  <!-- User space nodes -->
  <rect x="55" y="345" width="270" height="185" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <rect x="74" y="376" width="40" height="30" rx="4"/><path d="M74 386h40"/>
  </g>
  <text x="128" y="388" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">
    <tspan x="128" dy="0">CUDA app /</tspan>
    <tspan x="128" dy="31">nvidia-smi</tspan>
  </text>
  <text x="128" y="458" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="128" dy="0">(libcuda,</tspan>
    <tspan x="128" dy="30">libnvidia-ml)</tspan>
  </text>

  <rect x="55" y="730" width="270" height="195" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <circle cx="94" cy="828" r="16"/><circle cx="94" cy="828" r="6"/>
    <path d="M94 805v7 M94 844v7 M71 828h7 M110 828h7"/>
  </g>
  <text x="128" y="782" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="128" dy="0">modprobe /</tspan>
    <tspan x="128" dy="32">udev /</tspan>
    <tspan x="128" dy="32">systemd-</tspan>
    <tspan x="128" dy="32">modules-load</tspan>
  </text>

  <!-- Kernel space nodes -->
  <rect x="580" y="190" width="315" height="150" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="600" y="216" width="40" height="40" rx="5"/>
    <path d="M610 216v-7 M620 216v-7 M630 216v-7 M610 256v7 M620 256v7 M630 256v7"/>
  </g>
  <text x="656" y="232" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">Core kernel</text>
  <text x="656" y="266" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="656" dy="0">(vmlinuz)</tspan>
    <tspan x="656" dy="29">exports symbols</tspan>
    <tspan x="656" dy="29" font-family="monospace">(EXPORT_SYMBOL)</tspan>
  </text>

  <rect x="920" y="190" width="305" height="150" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="940" y="216" width="40" height="40" rx="5"/>
    <path d="M950 216v-7 M960 216v-7 M970 216v-7 M950 256v7 M960 256v7 M970 256v7"/>
  </g>
  <text x="996" y="238" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">nvidia-uvm.ko</text>
  <text x="996" y="284" fill="#303a36" font-family="sans-serif" font-size="24">(unified memory)</text>

  <!-- Core kernel to nvidia.ko -->
  <path d="M740 340 V385" fill="none" stroke="#207448" stroke-width="3.5"/>

  <rect x="680" y="385" width="330" height="130" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="702" y="416" width="42" height="42" rx="5"/><circle cx="723" cy="437" r="8"/>
  </g>
  <text x="762" y="438" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">nvidia.ko</text>
  <text x="762" y="476" fill="#303a36" font-family="sans-serif" font-size="24">(GPU core)</text>

  <path d="M960 385 V344" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="580" y="595" width="315" height="120" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <circle cx="614" cy="645" r="15"/><circle cx="614" cy="645" r="5"/>
  </g>
  <text x="646" y="644" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">
    <tspan x="646" dy="0">nvidia-modeset.</tspan>
    <tspan x="646" dy="32">ko</tspan>
  </text>

  <rect x="580" y="795" width="315" height="120" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <rect x="598" y="838" width="40" height="30" rx="4"/><path d="M598 848h40"/>
  </g>
  <text x="654" y="864" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">nvidia-drm.ko</text>

  <rect x="920" y="575" width="305" height="160" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <circle cx="956" cy="622" r="8"/><circle cx="976" cy="638" r="8"/><circle cx="950" cy="652" r="8"/>
    <path d="M962 627l8 6 M954 630l-2 13"/>
  </g>
  <text x="996" y="618" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">
    <tspan x="996" dy="0">nvidia-peer</tspan>
    <tspan x="996" dy="30">mem.ko</tspan>
  </text>
  <text x="942" y="694" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="942" dy="0">(GPUDirect RDMA</tspan>
    <tspan x="942" dy="28">↔ ib_core)</tspan>
  </text>

  <rect x="920" y="795" width="305" height="145" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <circle cx="950" cy="866" r="7"/><circle cx="978" cy="852" r="7"/><circle cx="978" cy="880" r="7"/>
    <path d="M956 863l16-8 M956 869l16 8"/>
  </g>
  <text x="998" y="838" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">ib_core /</text>
  <text x="998" y="870" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="998" dy="0">mlx5_core /</tspan>
    <tspan x="998" dy="28">mlx5_ib</tspan>
    <tspan x="998" dy="28" font-family="sans-serif">(RDMA stack)</tspan>
  </text>

  <!-- Internal kernel arrows -->
  <path d="M740 515 V591" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M735 715 V791" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M945 515 V545 H1072 V571" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M1072 795 V739" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Hardware nodes -->
  <rect x="1305" y="385" width="240" height="130" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="1403" y="405" width="44" height="44" rx="5"/><rect x="1415" y="417" width="20" height="20"/>
    <path d="M1415 405v-7 M1425 405v-7 M1435 405v-7 M1415 449v7 M1425 449v7 M1435 449v7"/>
  </g>
  <text x="1425" y="492" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="27" font-weight="700">GPU (PCIe)</text>

  <rect x="1305" y="802" width="240" height="130" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3.5">
    <rect x="1400" y="820" width="50" height="36" rx="4"/>
    <path d="M1410 856v10 M1420 856v10 M1430 856v10 M1440 856v10"/>
  </g>
  <text x="1425" y="904" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">ConnectX NIC</text>

  <!-- Cross-boundary arrows cleanly inside the 210px gutter -->
  <path d="M325 450 H676" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="345" y="362" width="210" height="72" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="450" y="394" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="450" dy="0">/dev/nvidia*,</tspan>
    <tspan x="450" dy="30">ioctl</tspan>
  </text>

  <path d="M325 828 H551" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="342" y="762" width="216" height="48" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="450" y="794" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24">finit_module()</text>

  <!-- nvidia.ko -> GPU -->
  <path d="M1010 450 H1301" fill="none" stroke="#db8129" stroke-width="4.5" marker-end="url(#orange-arrow)"/>

  <!-- ib_core -> ConnectX NIC -->
  <path d="M1225 867 H1301" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
