<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Process states</title>
  <desc>Process states</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 2 L16 9 L1 16 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 2 L16 9 L1 16 Z" fill="#db8129"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #303a36; }
      .state { font-size: 30px; font-weight: 700; }
      .edge-label { font-size: 24px; }
      .card { fill: #e8f1ea; stroke: #207448; stroke-width: 3; }
      .icon { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .edge { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .important { fill: none; stroke: #db8129; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#orange-arrow); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="64" y="82" font-size="48" font-weight="700">Process states</text>

  <!-- Connections -->
  <path class="edge" d="M122 395 H280"/>
  <path class="edge" d="M600 395 H700"/>
  <path class="important" d="M860 320 V260 H440 V320"/>
  <path class="edge" d="M1020 395 H1120"/>
  <path class="edge" d="M980 470 V800"/>
  <path class="edge" d="M700 430 H660 V880 H600"/>
  <path class="edge" d="M1120 350 V185 H240 V360 H280"/>
  <path class="edge" d="M750 950 V1040 H230 V420 H280"/>
  <path class="edge" d="M440 800 V610 H560 V470"/>
  <path class="edge" d="M1020 420 H1070 V750 H1290 V800"/>
  <path class="edge" d="M1290 950 V1060"/>

  <!-- State cards -->
  <g>
    <rect class="card" x="280" y="320" width="320" height="150" rx="18"/>
    <circle class="icon" cx="330" cy="395" r="27"/>
    <path class="icon" d="M317 395 L327 405 L346 383"/>
    <text class="state" x="380" y="406">Ready</text>
  </g>
  <g>
    <rect class="card" x="700" y="320" width="320" height="150" rx="18"/>
    <path class="icon" d="M740 375 H780 V415 H740 Z M750 365 V375 M770 365 V375 M750 415 V425 M770 415 V425 M730 385 H740 M730 405 H740 M780 385 H790 M780 405 H790"/>
    <text class="state" x="800" y="406">Running</text>
  </g>
  <g>
    <rect class="card" x="1120" y="320" width="320" height="150" rx="18"/>
    <path class="icon" d="M1170 369 A27 27 0 1 0 1194 415 A22 22 0 0 1 1170 369 Z"/>
    <text class="state" x="1220" y="406">Sleeping</text>
  </g>
  <g>
    <rect class="card" x="280" y="800" width="320" height="150" rx="18"/>
    <path class="icon" d="M320 845 H360 V885 H320 Z M329 865 H351"/>
    <text class="state" x="380" y="886">Stopped</text>
  </g>
  <g>
    <rect class="card" x="700" y="800" width="340" height="150" rx="18"/>
    <path class="icon" d="M770 830 C754 830 750 840 750 848 V900 C750 908 754 918 770 918 M830 830 C846 830 850 840 850 848 V900 C850 908 846 918 830 918 M770 830 H830 M770 918 H830 M750 848 H850 M750 900 H850"/>
    <text class="state" x="865" y="886">DiskWait</text>
  </g>
  <g>
    <rect class="card" x="1120" y="800" width="320" height="150" rx="18"/>
    <path class="icon" d="M1163 851 L1175 839 L1187 851 L1199 839 L1211 851 V879 C1211 894 1199 906 1187 906 C1175 906 1163 894 1163 879 Z M1177 871 H1178 M1196 871 H1197 M1178 887 Q1187 893 1196 887"/>
    <text class="state" x="1220" y="886">Zombie</text>
  </g>

  <!-- Initial and final states -->
  <circle cx="110" cy="395" r="12" fill="#207448"/>
  <text x="80" y="445" font-size="24">[*]</text>
  <circle cx="1290" cy="1080" r="20" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="1290" cy="1080" r="8" fill="#207448"/>
  <text x="1260" y="1130" font-size="24">[*]</text>

  <!-- Transition labels -->
  <text class="edge-label" x="150" y="445">fork()</text>
  <text class="edge-label" x="330" y="540">scheduler picks it (on-CPU)</text>
  <text class="edge-label" x="480" y="230">time slice ends / preempted</text>
  <text class="edge-label" x="1100" y="510">blocks on I/O, lock, timer (S)</text>
  <text class="edge-label" x="680" y="700">blocked in kernel I/O (D)</text>
  <text class="edge-label" x="300" y="700">SIGSTOP / SIGTSTP (T)</text>
  <text class="edge-label" x="500" y="155">event or signal arrives</text>
  <text class="edge-label" x="500" y="1010">I/O completes</text>
  <text class="edge-label" x="520" y="650">SIGCONT</text>
  <text class="edge-label" x="1085" y="700">exit() (Z)</text>
  <text class="edge-label" x="1000" y="1010">parent calls wait()</text>
</svg>