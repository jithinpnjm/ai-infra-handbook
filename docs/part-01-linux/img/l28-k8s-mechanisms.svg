<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Kubernetes knobs for a tuned node</title>
  <desc>Table showing Kubernetes node tuning concerns and their corresponding mechanisms</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="60" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#207448">Kubernetes knobs for a tuned node</text>

  
  <rect x="60" y="125" width="400" height="55" rx="8" fill="#207448"/>
  <text x="80" y="163" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Concern</text>

  <rect x="480" y="125" width="1060" height="55" rx="8" fill="#207448"/>
  <text x="512" y="163" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Mechanism</text>

  
  <rect x="60" y="200" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 224)">
    <rect x="6" y="14" width="44" height="28" rx="4" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M14 42v6 M22 42v6 M30 42v6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="21" cy="28" r="6" stroke="#207448" stroke-width="3" fill="none"/>
    <circle cx="35" cy="28" r="6" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M6 20h-4v16h4" stroke="#207448" stroke-width="4" fill="none"/>
  </g>
  <text x="156" y="262" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPU allocation</text>

  <rect x="480" y="200" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="261" font-size="25" fill="#303a36"><tspan font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">NVIDIA device plugin (</tspan><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">nvidia.com/gpu</tspan><tspan font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">), GPU Operator</tspan></text>

  
  <rect x="60" y="320" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 344)">
    <rect x="14" y="14" width="28" height="28" rx="4" stroke="#207448" stroke-width="4" fill="none"/>
    <rect x="22" y="22" width="12" height="12" rx="2" stroke="#207448" stroke-width="2.5" fill="none"/>
    <path d="M20 6v8 M28 6v8 M36 6v8 M20 42v8 M28 42v8 M36 42v8 M6 20h8 M6 28h8 M6 36h8 M42 20h8 M42 28h8 M42 36h8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="156" y="382" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU pinning</text>

  <rect x="480" y="320" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="363" font-size="25" fill="#303a36">
    <tspan x="512" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">cpuManagerPolicy: static,</tspan>
    <tspan x="512" dy="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Guaranteed pods with integer CPU requests</tspan>
  </text>

  
  <rect x="60" y="440" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 464)">
    <rect x="6" y="16" width="18" height="24" rx="3" stroke="#207448" stroke-width="3.5" fill="none"/>
    <rect x="32" y="16" width="18" height="24" rx="3" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M24 23h8 M24 33h8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="15" cy="28" r="3" fill="#207448"/>
    <circle cx="41" cy="28" r="3" fill="#207448"/>
  </g>
  <text x="156" y="502" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">NUMA alignment</text>

  <rect x="480" y="440" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="501" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="25" fill="#303a36">topologyManagerPolicy: single-numa-node</text>

  
  <rect x="60" y="560" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 584)">
    <path d="M28 8 L46 16 v14 c0 12 -18 20 -18 20 s-18 -8 -18 -20 V16 Z" stroke="#207448" stroke-width="3.5" fill="none"/>
    <rect x="22" y="20" width="12" height="12" rx="2" stroke="#207448" stroke-width="2.5" fill="none"/>
  </g>
  <text x="156" y="622" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Reserved cores</text>

  <rect x="480" y="560" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="621" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="25" fill="#303a36">reservedSystemCPUs, kubeReserved, systemReserved</text>

  
  <rect x="60" y="680" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 704)">
    <rect x="8" y="16" width="40" height="24" rx="2" stroke="#207448" stroke-width="3.5" fill="none"/>
    <rect x="13" y="22" width="7" height="9" stroke="#207448" stroke-width="2" fill="none"/>
    <rect x="24" y="22" width="8" height="9" stroke="#207448" stroke-width="2" fill="none"/>
    <rect x="36" y="22" width="7" height="9" stroke="#207448" stroke-width="2" fill="none"/>
    <path d="M12 40v5 M18 40v5 M24 40v5 M32 40v5 M38 40v5 M44 40v5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="156" y="742" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Memory</text>

  <rect x="480" y="680" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="741" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#303a36">Guaranteed QoS, requests equal limits</text>

  
  <rect x="60" y="800" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 824)">
    <circle cx="28" cy="14" r="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <circle cx="14" cy="40" r="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <circle cx="42" cy="40" r="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M28 20v8 M14 34v-6h28v6" stroke="#207448" stroke-width="3.5" fill="none"/>
  </g>
  <text x="156" y="862" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Network</text>

  <rect x="480" y="800" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="861" font-size="25" fill="#303a36"><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">hostNetwork</tspan><tspan font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"> or Multus plus </tspan><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">SR-IOV/RDMA</tspan><tspan font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"> device plugin</tspan></text>

  
  <rect x="60" y="920" width="400" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <g transform="translate(80, 944)">
    <ellipse cx="28" cy="16" rx="16" ry="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M12 16v20 c0 4 7 6 16 6 s16 -2 16 -6 V16" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M12 26 c0 4 7 6 16 6 s16 -2 16 -6" stroke="#207448" stroke-width="2.5" fill="none"/>
    <path d="M4 12v32 M52 12v32" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="156" y="982" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">I/O isolation</text>

  <rect x="480" y="920" width="1060" height="104" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="512" y="981" font-size="25" fill="#303a36"><tspan font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">not native, use node-level </tspan><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">cgroup v2 io.max</tspan></text>

  
  <rect x="60" y="1040" width="400" height="104" rx="10" fill="#fef5ee" stroke="#db8129" stroke-width="2.5"/>
  <g transform="translate(80, 1064)">
    <path d="M6 28 h8 l4 -16 l6 32 l6 -24 l4 14 l4 -6 h14" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 8 h24 M16 48 h24" stroke="#db8129" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  </g>
  <text x="156" y="1102" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Jitter</text>

  <rect x="480" y="1040" width="1060" height="104" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <text x="512" y="1101" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#303a36">homogeneous workloads per node, dedicate whole nodes</text>
</svg>