<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Memory at a glance</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L16 9 L2 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L16 9 L2 16 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="82" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Memory at a glance</text>

  
  <rect x="50" y="230" width="500" height="290" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="75" y="278" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Each process</text>

  
  <rect x="80" y="295" width="440" height="200" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="100" y="366" width="56" height="48" rx="5"/>
    <path d="M100 380 H156 M110 373 H112 M120 373 H122 M108 391 H126 M108 401 H146"/>
  </g>
  <text x="174" y="350" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="174" dy="0">Virtual address</tspan>
    <tspan x="174" dy="36">space (private,</tspan>
    <tspan x="174" dy="36">huge, mostly</tspan>
    <tspan x="174" dy="36">unmapped)</tspan>
  </text>

  
  <rect x="1120" y="150" width="430" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1160" cy="205" rx="26" ry="9"/>
    <path d="M1134 205 V235 C1134 240 1146 244 1160 244 C1174 244 1186 240 1186 235 V205"/>
    <path d="M1134 220 C1134 225 1146 229 1160 229 C1174 229 1186 225 1186 220"/>
  </g>
  <text x="1202" y="228" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Swap (disk/zram)</text>

  
  <rect x="1120" y="340" width="430" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1135 377 H1154 L1162 386 H1185 V440 H1135 Z"/>
    <path d="M1146 400 H1175 M1146 412 H1175 M1146 424 H1168"/>
  </g>
  <text x="1202" y="418" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Filesystem / disk</text>

  
  <rect x="650" y="300" width="400" height="180" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="670" y="361" width="56" height="56" rx="5"/>
    <rect x="682" y="373" width="32" height="32" rx="3"/>
    <path d="M678 353 V361 M690 353 V361 M702 353 V361 M714 353 V361 M678 417 V425 M690 417 V425 M702 417 V425 M714 417 V425 M662 369 H670 M662 381 H670 M662 393 H670 M662 405 H670 M726 369 H734 M726 381 H734 M726 393 H734 M726 405 H734"/>
  </g>
  <text x="746" y="346" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="746" dy="0">Physical</tspan>
    <tspan x="746" dy="34">memory (RAM,</tspan>
    <tspan x="746" dy="34">DRAM, NUMA</tspan>
    <tspan x="746" dy="34">nodes)</tspan>
  </text>

  
  <rect x="560" y="140" width="520" height="60" rx="12" fill="#e8f1ea"/>
  <text x="580" y="166" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="580" dy="0">anonymous pages paged out</tspan>
    <tspan x="580" dy="28">(swapping)</tspan>
  </text>

  <rect x="560" y="215" width="520" height="78" rx="12" fill="#e8f1ea"/>
  <text x="580" y="243" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="580" dy="0">file-backed pages (mmap, page</tspan>
    <tspan x="580" dy="28">cache) paged from</tspan>
  </text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 295 V130 H1090 V220 H1120" marker-end="url(#arrow-green)"/>
    <path d="M480 295 V205 H1080 V410 H1120" marker-end="url(#arrow-green)"/>
  </g>

  
  <path d="M520 395 H650" fill="none" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="55" y="550" width="350" height="130" rx="14" fill="#e8f1ea"/>
  <text x="75" y="579" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">MMU + page</tspan>
    <tspan x="75" dy="28">tables + TLB</tspan>
    <tspan x="75" dy="28">(per-page</tspan>
    <tspan x="75" dy="28">translation)</tspan>
  </text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 480 C600 620 390 700 230 860" marker-end="url(#arrow-green)"/>
    <path d="M790 480 C750 620 680 720 610 860" marker-end="url(#arrow-green)"/>
    <path d="M910 480 C930 620 970 720 990 860" marker-end="url(#arrow-green)"/>
    <path d="M1010 480 C1120 620 1280 720 1370 860" marker-end="url(#arrow-green)"/>
  </g>

  
  <rect x="55" y="860" width="350" height="280" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <rect x="435" y="860" width="350" height="280" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <rect x="815" y="860" width="350" height="280" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <rect x="1195" y="860" width="350" height="280" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <circle cx="102" cy="994" r="17"/>
    <circle cx="102" cy="994" r="6"/>
    <path d="M102 966 V974 M102 1014 V1022 M74 994 H82 M122 994 H130 M82 974 L88 980 M116 1008 L122 1014 M122 974 L116 980 M88 1008 L82 1014"/>
    <path d="M102 966 L96 961 M102 966 L108 961 M102 1022 L96 1027 M102 1022 L108 1027 M74 994 L69 988 M74 994 L69 1000 M130 994 L135 988 M130 994 L135 1000"/>

    
    <rect x="465" y="970" width="48" height="48" rx="4"/>
    <path d="M475 982 H503 M475 994 H503 M475 1006 H497"/>
    <path d="M459 964 H507"/>

    
    <rect x="847" y="972" width="48" height="46" rx="4"/>
    <path d="M858 984 H884 M858 996 H884 M858 1008 H878"/>
    <path d="M841 966 H889"/>

    
    <path d="M1228 991 V981 C1228 969 1237 960 1249 960 C1261 960 1270 969 1270 981 V991"/>
    <rect x="1220" y="991" width="58" height="38" rx="6"/>
    <circle cx="1249" cy="1007" r="4"/>
    <path d="M1249 1011 V1019"/>
  </g>

  
  <text x="151" y="928" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="151" dy="0">Kernel</tspan>
    <tspan x="151" dy="36">memory: slab,</tspan>
    <tspan x="151" dy="36">page tables,</tspan>
    <tspan x="151" dy="36">stacks, driver</tspan>
    <tspan x="151" dy="36">buffers</tspan>
  </text>

  
  <text x="531" y="964" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="531" dy="0">Page cache</tspan>
    <tspan x="531" dy="36">(file data),</tspan>
    <tspan x="531" dy="36">reclaimable</tspan>
  </text>

  
  <text x="911" y="928" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="911" dy="0">Anonymous</tspan>
    <tspan x="911" dy="36">memory: heap,</tspan>
    <tspan x="911" dy="36">stacks,</tspan>
    <tspan x="911" dy="36">tensors on the</tspan>
    <tspan x="911" dy="36">host</tspan>
  </text>

  
  <text x="1291" y="946" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="1291" dy="0">Hugepages /</tspan>
    <tspan x="1291" dy="36">pinned</tspan>
    <tspan x="1291" dy="36">(locked)</tspan>
    <tspan x="1291" dy="36">memory</tspan>
  </text>
</svg>