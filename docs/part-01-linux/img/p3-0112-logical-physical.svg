<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240">
  <title>Logical I/O is not physical I/O: what shrinks it and what inflates it</title>
  <desc>Infographic explaining how caching, compression, and coalescing shrink logical I/O, while metadata, block rounding, journaling, and RAID inflate it before reaching physical disk.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1240" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448">Logical I/O is not physical I/O: what shrinks it and what inflates it</text>

  
  <rect x="40" y="110" width="470" height="730" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="275" y="155" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Deflated (less than requested)</text>

  
  <rect x="60" y="180" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="225" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Cache hits</text>

  
  <rect x="60" y="272" width="430" height="136" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="312" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Write cancellation</text>
  <text x="275" y="346" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(same bytes rewritten</text>
  <text x="275" y="380" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">before flush)</text>

  
  <rect x="60" y="428" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="473" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Compression</text>

  
  <rect x="60" y="520" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="565" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Coalescing neighbours</text>

  
  <rect x="60" y="612" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="657" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">In-memory filesystems</text>

  
  
  <rect x="550" y="180" width="500" height="635" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <rect x="575" y="280" width="450" height="430" rx="8" fill="#e8f1ea" />
  
  <path d="M 750 340 L 800 375 L 850 340" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 750 470 L 800 505 L 850 470" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 750 600 L 800 635 L 850 600" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  
  <rect x="550" y="180" width="500" height="100" rx="12" fill="#207448" />
  <text x="800" y="222" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">Logical I/O: what the application</text>
  <text x="800" y="258" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#ffffff">asked for (system calls)</text>

  
  <rect x="550" y="715" width="500" height="100" rx="12" fill="#207448" />
  <text x="800" y="757" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">Physical I/O: what reaches</text>
  <text x="800" y="793" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#ffffff">the disk</text>

  
  <rect x="1090" y="110" width="470" height="730" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1325" y="155" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Inflated (more than requested)</text>

  
  <rect x="1110" y="180" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1325" y="225" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Metadata updates</text>

  
  <rect x="1110" y="268" width="430" height="186" rx="10" fill="#fdf5ec" stroke="#db8129" stroke-width="3" />
  <text x="1325" y="304" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">Record or block size rounding</text>
  <text x="1325" y="338" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(a 1-byte write may read</text>
  <text x="1325" y="372" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">and rewrite a whole</text>
  <text x="1325" y="406" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">128 KiB record)</text>

  
  <rect x="1110" y="470" width="430" height="106" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1325" y="510" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Journaling</text>
  <text x="1325" y="546" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(data or metadata written twice)</text>

  
  <rect x="1110" y="592" width="430" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1325" y="642" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">RAID parity read-modify-write</text>

  
  <rect x="1110" y="688" width="430" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1325" y="733" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Mirroring</text>

  
  
  <line x1="490" y1="216" x2="542" y2="216" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="490" y1="340" x2="542" y2="340" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="490" y1="464" x2="542" y2="464" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="490" y1="556" x2="542" y2="556" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="490" y1="648" x2="542" y2="648" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <line x1="1110" y1="216" x2="1058" y2="216" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="1110" y1="361" x2="1058" y2="361" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <line x1="1110" y1="523" x2="1058" y2="523" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="1110" y1="632" x2="1058" y2="632" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="1110" y1="724" x2="1058" y2="724" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="40" y="865" width="1520" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="905" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Not from your application at all</text>

  
  <rect x="60" y="925" width="460" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="290" y="965" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Unrelated</text>
  <text x="290" y="1000" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(other tenants, RAID rebuilds,</text>
  <text x="290" y="1035" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">backups, scrubs)</text>

  
  <rect x="570" y="925" width="460" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="965" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Indirect</text>
  <text x="800" y="1000" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(prefetch, write-back bursts</text>
  <text x="800" y="1035" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">nobody waits on)</text>

  
  <rect x="1080" y="925" width="460" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1310" y="965" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Implicit</text>
  <text x="1310" y="1000" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(mmap loads and stores</text>
  <text x="1310" y="1035" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">that fault)</text>

  
  <rect x="40" y="1125" width="1520" height="75" rx="10" fill="#207448" />
  <text x="800" y="1172" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">Do not assume the disk saw what the application sent</text>
</svg>