<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Five whys: a 20 percent drop traces back three layers to a neighbour's memory</title>
  <desc>Five whys root cause analysis tracing a 20 percent training throughput drop through three intermediate layers down to a neighbour process memory pinning root cause, leading to corrective action.</desc>

  <defs>
    <marker id="arrow-down" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Five whys: a 20 percent drop traces back</text>
  <text x="800" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">three layers to a neighbour's memory</text>

  
  <path d="M 285 350 L 265 350 L 265 590 L 250 590 L 265 590 L 265 835 L 285 835" fill="none" stroke="#7a8c82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <g id="left-note">
    <rect x="40" y="505" width="200" height="170" rx="12" ry="12" fill="#eef2ef" stroke="#7a8c82" stroke-width="2" stroke-dasharray="6 4" />
    <text x="140" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#4a5750">
      <tspan x="140" dy="0">The root cause</tspan>
      <tspan x="140" dy="30">sits three</tspan>
      <tspan x="140" dy="30">layers below</tspan>
      <tspan x="140" dy="30">the symptom.</tspan>
    </text>
  </g>

  
  <g id="box-1">
    <rect x="300" y="160" width="780" height="125" rx="14" ry="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(328, 194.5)">
      <rect x="0" y="0" width="56" height="56" rx="6" ry="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
      <circle cx="10" cy="8" r="3" fill="#207448" />
      <circle cx="20" cy="8" r="3" fill="#207448" />
      <circle cx="30" cy="8" r="3" fill="#207448" />
      <polyline points="10,44 24,30 34,38 46,24" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="410" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">Symptom: training throughput</tspan>
      <tspan x="410" dy="34">dropped 20%</tspan>
    </text>
  </g>

  
  <line x1="690" y1="285" x2="690" y2="345" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
  <text x="715" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">why?</text>

  
  <g id="box-2">
    <rect x="300" y="345" width="780" height="125" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(328, 379.5)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="410" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">Step time grew, so the all-reduce</tspan>
      <tspan x="410" dy="34">phase lengthened</tspan>
    </text>
  </g>

  
  <line x1="690" y1="470" x2="690" y2="530" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
  <text x="715" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">why?</text>

  
  <g id="box-3">
    <rect x="300" y="530" width="780" height="125" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(328, 564.5)">
      <circle cx="28" cy="28" r="11" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="410" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">One rank started that phase late,</tspan>
      <tspan x="410" dy="31">because its data loader stalls</tspan>
      <tspan x="410" dy="31">now and then</tspan>
    </text>
  </g>

  
  <line x1="690" y1="655" x2="690" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
  <text x="715" y="692" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">why?</text>

  
  <g id="box-4">
    <rect x="300" y="715" width="780" height="125" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(328, 749.5)">
      <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 14 L 6 42 A 22 8 0 0 0 50 42 L 50 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 28 A 22 8 0 0 0 50 28" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="410" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">The host page cache was evicted, so the</tspan>
      <tspan x="410" dy="31">dataset was re-read from the network</tspan>
      <tspan x="410" dy="31">filesystem every epoch</tspan>
    </text>
  </g>

  
  <line x1="690" y1="840" x2="690" y2="900" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />
  <text x="715" y="877" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">why?</text>

  
  <g id="box-5">
    <rect x="300" y="900" width="780" height="125" rx="14" ry="14" fill="#dceade" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(328, 934.5)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="4" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="410" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">A neighbour process on that node pins a</tspan>
      <tspan x="410" dy="31">large amount of memory, so the cache</tspan>
      <tspan x="410" dy="31">no longer fits</tspan>
    </text>
  </g>

  
  <line x1="1080" y1="962.5" x2="1120" y2="962.5" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)" />

  
  <g id="action-box">
    <rect x="1120" y="885" width="440" height="155" rx="14" ry="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="1145" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1145" dy="0">Action: fix the memory</tspan>
      <tspan x="1145" dy="29">budget or cgroup limits,</tspan>
      <tspan x="1145" dy="29">and add a cache-hit-</tspan>
      <tspan x="1145" dy="29">ratio alert.</tspan>
    </text>
  </g>

  
  <g id="caption-bar">
    <rect x="180" y="1095" width="1240" height="70" rx="14" ry="14" fill="#207448" />
    <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Stop only when you reach something you can act on.</text>
  </g>
</svg>