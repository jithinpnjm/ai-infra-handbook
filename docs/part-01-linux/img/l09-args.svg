<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The three argument loops</title>
  <desc>Visual comparison of shell argument loops showing behavior of "$@", $@, and "$*"</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f8f5" />

  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The three argument loops</text>

  <g id="invocation">
    <rect x="80" y="125" width="1440" height="90" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(105, 142)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="4" width="56" height="48" rx="8" />
      <line x1="0" y1="18" x2="56" y2="18" stroke-width="3" />
      <polyline points="12,28 22,35 12,42" />
      <line x1="28" y1="42" x2="44" y2="42" />
    </g>
    <text x="185" y="170" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">Script called as: <tspan font-family="monospace" fill="#207448">script 'abc 123' qwe</tspan></text>
  </g>

  <g id="row-1">
    <rect x="80" y="255" width="1440" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="100" y="275" width="480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(120, 292)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 28 A 18 18 0 1 1 28 46" />
      <polyline points="20,46 28,46 28,38" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
    </g>
    <text x="195" y="320" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">for a in "$@"</text>

    <line x1="590" y1="320" x2="685" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="695" y="275" width="805" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(715, 292)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="18,28 25,35 38,20" />
    </g>
    <text x="790" y="320" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">[abc 123] [qwe]</text>
    
    <rect x="1275" y="290" width="205" height="60" rx="10" fill="#207448" />
    <text x="1377" y="320" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" dominant-baseline="central">correct</text>
  </g>

  <g id="row-2">
    <rect x="80" y="425" width="1440" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <rect x="100" y="445" width="480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(120, 462)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 28 A 18 18 0 1 1 28 46" />
      <polyline points="20,46 28,46 28,38" />
      <line x1="24" y1="28" x2="32" y2="28" />
    </g>
    <text x="195" y="490" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">for a in $@</text>

    <line x1="590" y1="490" x2="685" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="695" y="445" width="805" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(715, 462)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 46 L 6 46 Z" />
      <line x1="28" y1="20" x2="28" y2="30" />
      <circle cx="28" cy="38" r="2.5" fill="#db8129" />
    </g>
    <text x="790" y="490" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">[abc] [123] [qwe]</text>

    <rect x="1275" y="460" width="205" height="60" rx="10" fill="#db8129" />
    <text x="1377" y="490" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" dominant-baseline="central">broken</text>
  </g>

  <g id="row-3">
    <rect x="80" y="595" width="1440" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <rect x="100" y="615" width="480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(120, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 28 A 18 18 0 1 1 28 46" />
      <polyline points="20,46 28,46 28,38" />
      <line x1="28" y1="20" x2="28" y2="36" />
    </g>
    <text x="195" y="660" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">for a in "$*"</text>

    <line x1="590" y1="660" x2="685" y2="660" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="695" y="615" width="805" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(715, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="44" height="28" rx="6" />
      <line x1="16" y1="28" x2="40" y2="28" />
    </g>
    <text x="790" y="660" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">[abc 123 qwe]</text>

    <rect x="1275" y="630" width="205" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1377" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" dominant-baseline="central">one word</text>
  </g>

  <g id="takeaway">
    <rect x="80" y="765" width="1440" height="110" rx="16" fill="#207448" />
    <g transform="translate(110, 792)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 4 L 36 4 L 46 14 L 46 48 L 10 48 Z" />
      <polyline points="36,4 36,14 46,14" />
      <line x1="18" y1="24" x2="38" y2="24" />
      <line x1="18" y1="34" x2="32" y2="34" />
    </g>
    <text x="185" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" dominant-baseline="central">Note: <tspan font-family="monospace">"$*"</tspan> joins with the first character of IFS.</text>
  </g>
</svg>