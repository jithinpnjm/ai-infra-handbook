<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Scheduling classes</title>
  <desc>Visual infographic explaining Linux CPU scheduling classes hierarchy, real-time starvation warning, and inspection commands.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="70" y="82" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scheduling classes</text>

  

  
  <g id="node-stop">
    <rect x="70" y="140" width="840" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(98, 167)">
      <polygon points="17,3 39,3 53,17 53,39 39,53 17,53 3,39 3,17" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="17" y1="28" x2="39" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="180" y="206" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Stop (kernel internal)</text>
  </g>

  
  <g id="node-deadline">
    <rect x="70" y="275" width="840" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(98, 302)">
      <circle cx="28" cy="31" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,19 28,31 38,31" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="9" x2="28" y2="5" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="5" x2="34" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="180" y="322" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Deadline</text>
    <text x="180" y="358" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SCHED_DEADLINE</text>
  </g>

  
  <g id="node-realtime">
    <rect x="70" y="410" width="840" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(98, 437)">
      <path d="M 8,42 A 24,24 0 1,1 48,42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="34" x2="42" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="34" r="4" fill="#207448"/>
    </g>
    
    <text x="180" y="457" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Real-time</text>
    <text x="180" y="495" font-family="sans-serif" font-size="24" fill="#303a36">SCHED_FIFO and SCHED_RR with priority 1 to 99</text>

    
    <g id="warning-starvation">
      <rect x="94" y="525" width="792" height="72" rx="10" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(114, 543)">
        <polygon points="18,3 34,31 2,31" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
        <line x1="18" y1="13" x2="18" y2="21" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
        <circle cx="18" cy="26" r="1.5" fill="#db8129"/>
      </g>
      <text x="166" y="569" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">a busy real-time task starves everything below</text>
    </g>
  </g>

  
  <g id="node-fair">
    <rect x="70" y="645" width="840" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(98, 672)">
      <line x1="28" y1="8" x2="28" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="18" y1="48" x2="38" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      
      <polyline points="8,18 3,32 17,32 12,18" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      
      <polyline points="48,18 43,32 57,32 52,18" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    </g>
    
    <text x="180" y="692" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fair CFS/EEVDF</text>
    <text x="180" y="738" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SCHED_OTHER, SCHED_BATCH, SCHED_IDLE,</text>
    <text x="180" y="782" font-family="sans-serif" font-size="24" fill="#303a36">the default for ordinary processes</text>
  </g>

  
  <g id="node-idle">
    <rect x="70" y="880" width="840" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(98, 907)">
      <path d="M 36,8 A 22,22 0 1,1 18,46 A 18,18 0 0,0 36,8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    </g>
    
    <text x="180" y="927" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Idle</text>
    <text x="180" y="963" font-family="sans-serif" font-size="24" fill="#303a36">(runs when nothing else is runnable)</text>
  </g>

  

  
  <g id="chip-1">
    <rect x="960" y="275" width="570" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(990, 312)">
      <polyline points="4,8 14,18 4,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1035" y="340" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">chrt -p $$</text>
  </g>

  
  <g id="chip-2">
    <rect x="960" y="460" width="570" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(980, 497)">
      <polyline points="4,8 14,18 4,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1025" y="525" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo chrt -f 50 ./latency_task</text>
  </g>

  
  <g id="chip-3">
    <rect x="960" y="695" width="570" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(980, 732)">
      <polyline points="4,8 14,18 4,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1025" y="760" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ps -eo pid,cls,rtprio,ni,pri,comm</text>
  </g>

  

  
  <g id="takeaway-bar">
    <rect x="70" y="1040" width="1460" height="80" rx="14" fill="#207448"/>
    <text x="800" y="1090" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Note: use real-time policies sparingly</text>
  </g>
</svg>