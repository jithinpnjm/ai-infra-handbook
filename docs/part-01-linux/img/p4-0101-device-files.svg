<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Device file routing from user space to hardware and pseudodevices</title>
  <desc>Three-tier architectural diagram illustrating how Linux routes standard file operations to devices, showing pathways to physical hardware and pseudodevices.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Device file routing from user space to hardware and pseudodevices</text>
  <text x="800" y="98" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Three-tier architectural diagram illustrating how Linux routes standard file operations to devices.</text>

  
  <rect x="50" y="125" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(80, 155)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="9" r="3" fill="#207448" />
    <circle cx="28" cy="9" r="3" fill="#207448" />
    <circle cx="42" cy="9" r="3" fill="#207448" />
  </g>

  
  <text x="160" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">User Space</text>
  <text x="160" y="218" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">Applications issue standard POSIX file system calls open(), read(), write(), and ioctl()</tspan>
    <tspan x="160" dy="32">on paths in /dev.</tspan>
  </text>

  
  
  <path d="M 425 275 L 425 355" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <path d="M 1175 275 L 1175 355" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="360" width="1500" height="475" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <text x="80" y="405" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kernel Space</text>
  <text x="310" y="405" font-family="sans-serif" font-size="24" fill="#303a36">Divided into two pathways.</text>

  
  <g transform="translate(75, 425)">
    <rect x="0" y="0" width="705" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 22)">
      <rect x="0" y="4" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="4" />
      <circle cx="16" cy="36" r="4" fill="#207448" />
      <circle cx="40" cy="36" r="4" fill="#207448" />
    </g>
    <text x="96" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Hardware-backed device nodes</text>

    
    <rect x="24" y="90" width="657" height="74" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="122" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">Special character device /dev/nvidia0</tspan>
      <tspan x="40" dy="30">and block device /dev/nvme0n1.</tspan>
    </text>

    
    <rect x="24" y="176" width="657" height="112" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="2" />
    <text x="40" y="208" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">The VFS and device subsystem map open() and</tspan>
      <tspan x="40" dy="32">ioctl() requests to loaded kernel modules</tspan>
      <tspan x="40" dy="32">(nvidia.ko and nvme.ko).</tspan>
    </text>

    
    <rect x="24" y="300" width="657" height="64" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="342" font-family="sans-serif" font-size="24" fill="#303a36">Modules reside in kernel space as .ko objects.</text>
  </g>

  
  <g transform="translate(820, 425)">
    <rect x="0" y="0" width="705" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 22)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="9" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" />
    </g>
    <text x="96" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pseudodevices</text>

    
    <rect x="24" y="90" width="657" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="130" font-family="sans-serif" font-size="24" fill="#303a36">Software-only devices in /dev that correspond to no hardware.</text>

    
    <rect x="24" y="162" width="657" height="202" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="198" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="40" dy="0">/dev/null routes writes to a kernel sink that discards bytes;</tspan>
      <tspan x="40" dy="48">/dev/zero routes reads to a kernel generator returning</tspan>
      <tspan x="40" dy="30">0x00 bytes;</tspan>
      <tspan x="40" dy="48">/dev/urandom routes reads to the kernel cryptographic</tspan>
      <tspan x="40" dy="30">entropy pool.</tspan>
    </text>
  </g>

  
  <path d="M 425 835 L 425 885" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 1175 835 L 1175 885" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="890" width="1500" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <text x="80" y="935" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Physical Hardware vs Pure Software</text>

  
  <g transform="translate(75, 955)">
    <rect x="0" y="0" width="705" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 25)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" />
    </g>

    <text x="96" y="60" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">Left pathway connects drivers to physical</tspan>
      <tspan x="96" dy="36">PCIe hardware (NVIDIA H100 GPU and</tspan>
      <tspan x="96" dy="36">NVMe SSD).</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 955)">
    <rect x="0" y="0" width="705" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 25)">
      <path d="M 28 6 L 50 14 L 50 32 C 50 44 28 52 28 52 C 28 52 6 44 6 32 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="6" fill="#207448" />
    </g>

    <text x="96" y="60" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">Right pathway connects pseudodevices to pure</tspan>
      <tspan x="96" dy="36">in-kernel software routines with no physical</tspan>
      <tspan x="96" dy="36">hardware backing.</tspan>
    </text>
  </g>
</svg>