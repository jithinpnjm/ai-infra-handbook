<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <title>How SSH works</title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="18" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="18" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1240" fill="#f5f8f5"/>
  <text x="800" y="78" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">How SSH works</text>

  <rect x="70" y="112" width="700" height="112" rx="18" fill="#e8f1ea"/>
  <rect x="830" y="112" width="700" height="112" rx="18" fill="#e8f1ea"/>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="145" y="139" width="56" height="42" rx="4"/>
    <path d="M137 190 H209 L203 198 H143 Z"/>
    <rect x="920" y="134" width="56" height="58" rx="5"/>
    <path d="M920 153 H976 M920 173 H976"/>
    <circle cx="931" cy="144" r="2" fill="#207448"/>
    <circle cx="931" cy="164" r="2" fill="#207448"/>
    <circle cx="931" cy="183" r="2" fill="#207448"/>
  </g>
  <text x="222" y="177" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">ssh client (your laptop)</text>
  <text x="995" y="177" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">sshd (server)</text>

  <g fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="10 12" opacity="0.55">
    <path d="M420 224 V490 M420 680 V1190"/>
    <path d="M1180 224 V1190"/>
  </g>

  <g font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#303a36">
    <text x="800" y="275">
      <tspan x="800">connect to port 22, agree on protocol</tspan>
      <tspan x="800" dy="32">and algorithms</tspan>
    </text>
    <text x="800" y="405">
      <tspan x="800">server proves its identity with its</tspan>
      <tspan x="800" dy="32">HOST KEY</tspan>
    </text>
    <text x="800" y="725">
      <tspan x="800">both sides derive session keys (key exchange),</tspan>
      <tspan x="800" dy="32">channel is now encrypted</tspan>
    </text>
    <text x="800" y="835">
      <tspan x="800">user authentication: public key (best),</tspan>
      <tspan x="800" dy="32">or password, or other methods</tspan>
    </text>
    <text x="800" y="970">authenticated</text>
    <text x="800" y="1080">
      <tspan x="800">open a session: shell, a single command,</tspan>
      <tspan x="800" dy="32">a file transfer, or a tunnel</tspan>
    </text>
  </g>

  <rect x="70" y="500" width="700" height="180" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="110" y="538" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="110">client checks the host key against</tspan>
    <tspan x="110" dy="28" font-family="monospace">~/.ssh/known_hosts.</tspan>
    <tspan x="110" dy="28" font-family="sans-serif">First time: asks you to confirm</tspan>
    <tspan x="110" dy="28">the fingerprint.</tspan>
    <tspan x="110" dy="28">Changed key: loud warning.</tspan>
  </text>

  <g fill="none" stroke-width="4">
    <path d="M420 340 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M1180 470 H420" stroke="#db8129" marker-end="url(#arrow-orange)"/>
    <path d="M420 790 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M420 900 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M1180 1010 H420" stroke="#207448" marker-end="url(#arrow-green)"/>
    <path d="M420 1145 H1180" stroke="#207448" marker-end="url(#arrow-green)"/>
  </g>

  <g fill="#207448" font-family="sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <circle cx="94" cy="340" r="24"/><text x="94" y="348" fill="#ffffff">1</text>
    <circle cx="94" cy="470" r="24"/><text x="94" y="478" fill="#ffffff">2</text>
    <circle cx="94" cy="790" r="24"/><text x="94" y="798" fill="#ffffff">3</text>
    <circle cx="94" cy="900" r="24"/><text x="94" y="908" fill="#ffffff">4</text>
    <circle cx="94" cy="1010" r="24"/><text x="94" y="1018" fill="#ffffff">5</text>
    <circle cx="94" cy="1145" r="24"/><text x="94" y="1153" fill="#ffffff">6</text>
  </g>
</svg>