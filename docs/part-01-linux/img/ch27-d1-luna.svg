<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Three ways to virtualise</title>
  <desc>Comparison of hardware virtualisation, OS containers, and lightweight microVMs.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <rect x="40" y="150" width="480" height="1010" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="560" y="150" width="480" height="1010" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="1080" y="150" width="480" height="1010" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  <g font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <text x="64" y="190">
      <tspan x="64">Hardware</tspan>
      <tspan x="64" dy="36">virtualisation (VMs):</tspan>
      <tspan x="64" dy="36">KVM, Xen, Nitro,</tspan>
      <tspan x="64" dy="36">Hyper-V</tspan>
    </text>
    <text x="584" y="190">
      <tspan x="584">OS virtualisation</tspan>
      <tspan x="584" dy="36">(containers):</tspan>
      <tspan x="584" dy="36">namespaces + cgroups</tspan>
    </text>
    <text x="1104" y="190">
      <tspan x="1104">Lightweight</tspan>
      <tspan x="1104" dy="36">virtualisation</tspan>
      <tspan x="1104" dy="36">(microVMs): Firecracker,</tspan>
      <tspan x="1104" dy="36">Kata, Cloud Hypervisor</tspan>
    </text>
  </g>

  <g fill="#f5f8f5" stroke="#207448" stroke-width="3">
    <rect x="60" y="340" width="440" height="180" rx="14"/>
    <rect x="60" y="550" width="440" height="180" rx="14"/>
    <rect x="60" y="760" width="440" height="180" rx="14"/>
    <rect x="60" y="970" width="440" height="180" rx="14"/>

    <rect x="580" y="340" width="440" height="180" rx="14"/>
    <rect x="580" y="550" width="440" height="180" rx="14"/>
    <rect x="580" y="760" width="440" height="180" rx="14"/>

    <rect x="1100" y="340" width="440" height="180" rx="14"/>
    <rect x="1100" y="550" width="440" height="180" rx="14"/>
    <rect x="1100" y="760" width="440" height="180" rx="14"/>
    <rect x="1100" y="970" width="440" height="180" rx="14"/>
  </g>
  <rect x="580" y="550" width="440" height="180" rx="14" fill="none" stroke="#db8129" stroke-width="5"/>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(82 402)">
      <rect x="2" y="4" width="56" height="44" rx="4"/>
      <path d="M2 16h56"/>
      <circle cx="10" cy="10" r="1.5" fill="#207448"/>
