      <path d="M20 18h20v20H20z M18 1v7 M28 1v7 M38 1v7 M48 1v7 M18 48v7 M28 48v7 M38 48v7 M48 48v7 M3 18h7 M3 28h7 M3 38h7 M50 18h7 M50 28h7 M50 38h7"/>
    </g>
  </g>

  <g fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 520V550"/>
    <path d="M280 730V760"/>
    <path d="M280 940V970"/>
    <path d="M800 520V550"/>
    <path d="M800 730V760"/>
    <path d="M1320 520V550"/>
    <path d="M1320 730V760"/>
    <path d="M1320 940V970"/>
  </g>

  <g font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <text x="172" y="440">Guest app</text>

    <text x="172" y="618">
      <tspan x="172">Guest kernel</tspan>
      <tspan x="172" dy="34">(own)</tspan>
    </text>

    <text x="172" y="804">
      <tspan x="172">Hypervisor / VMM</tspan>
      <tspan x="172" dy="34">(+ QEMU I/O proxy</tspan>
      <tspan x="172" dy="34">or Nitro offload)</tspan>
    </text>

    <text x="172" y="1040">Hardware</text>

    <text x="692" y="422">
      <tspan x="692">Container</tspan>
      <tspan x="692" dy="34">processes</tspan>
    </text>

    <text x="692" y="618">
      <tspan x="692">ONE shared host</tspan>
      <tspan x="692" dy="34">kernel</tspan>
    </text>

    <text x="692" y="840">Hardware</text>

    <text x="1212" y="440">Guest app</text>

    <text x="1212" y="618">
      <tspan x="1212">Minimal guest</tspan>
      <tspan x="1212" dy="34">kernel</tspan>
    </text>

    <text x="1212" y="804">
      <tspan x="1212">Lightweight VMM</tspan>
      <tspan x="1212" dy="34">(KVM-based, few</tspan>
      <tspan x="1212" dy="34">devices)</tspan>
    </text>

    <text x="1212" y="1040">Hardware</text>
  </g>
</svg>