      <path d="M20 18h20v20H20z M18 1v7 M28 1v7 M38 1v7 M48 1v7 M18 48v7 M28 48v7 M38 48v7 M48 48v7 M3 18h7 M3 28h7 M3 38h7 M50 18h7 M50 28h7 M50 38h7"/>
    </g>

