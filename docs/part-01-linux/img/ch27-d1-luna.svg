      <path d="M30 2v8 M30 48v8 M2 30h8 M50 30h8 M10 10l6 6 M44 44l6 6 M50 10l-6 6 M16 44l-6 6"/>
      <circle cx="30" cy="30" r="21"/>
      <circle cx="30" cy="30" r="9"/>
