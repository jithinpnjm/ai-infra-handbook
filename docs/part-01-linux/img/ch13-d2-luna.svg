      <tspan x="990" dy="36">NUMA</tspan>
    </text>
    <text x="610" y="800">7 PCIe</text>
    <text x="230" y="800">8 GPU memory</text>
  </g>

  <g fill="#303a36" font-family="monospace" font-size="24" text-anchor="middle">
