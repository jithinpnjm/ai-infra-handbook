      <tspan x="230" dy="36">(NVMe/HDD)</tspan>
    </text>
    <text x="610" y="300">
      <tspan x="610">2 Storage server</tspan>
      <tspan x="610" dy="36">/ controller queue</tspan>
    </text>
    <text x="990" y="300">
      <tspan x="990">3 Network fabric</tspan>
      <tspan x="990" dy="36">(Ethernet/IB/</tspan>
      <tspan x="990" dy="36">NVMe-oF)</tspan>
    </text>
    <text x="1370" y="300">
