  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What is inside a package</text>

  
  <rect x="50" y="110" width="870" height="1040" rx="20" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
