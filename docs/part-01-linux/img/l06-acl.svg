<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090">
  <title>Beyond owner, group and other</title>
  <desc>Visual explanation of POSIX Access Control Lists, permission masks, inheritance, and related commands.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="85" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36" text-anchor="middle">Beyond owner, group and other</text>
  <line x1="80" y1="120" x2="1520" y2="120" stroke="#207448" stroke-width="2" stroke-opacity="0.3" />

  

  
  <g id="box-classic">
    <rect x="60" y="150" width="440" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="256" y="196" width="48" height="38" rx="6" />
      <path d="M264 196 V182 A16 16 0 0 1 296 182 V196" />
      <circle cx="280" cy="214" r="3" fill="#207448" />
    </g>

    <text x="280" y="275" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">classic permissions</text>

    
    <rect x="100" y="305" width="360" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="280" y="342" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">owner</text>

    <rect x="100" y="377" width="360" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="280" y="414" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">group</text>

    <rect x="100" y="449" width="360" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="280" y="486" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">other</text>
  </g>

  
  <g id="box-mask">
    <rect x="540" y="150" width="520" height="400" rx="16" fill="#fff7ed" stroke="#db8129" stroke-width="4" />
    
    
    <g stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M775 180 L800 170 L825 180 V210 C825 228 800 242 800 242 C800 242 775 228 775 210 Z" />
      <line x1="786" y1="205" x2="814" y2="205" />
    </g>

    
    <text x="800" y="305" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="800" dy="0">mask caps effective</tspan>
      <tspan x="800" dy="40">permission of the</tspan>
      <tspan x="800" dy="40">extra entries</tspan>
    </text>
  </g>

  
  <g id="box-acl">
    <rect x="1100" y="150" width="440" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1310" cy="186" r="14" />
      <path d="M1286 226 C1286 208 1334 208 1334 226" />
      <line x1="1342" y1="192" x2="1358" y2="192" />
      <line x1="1350" y1="184" x2="1350" y2="200" />
    </g>

    
    <text x="1320" y="260" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="1320" dy="0">ACL adds</tspan>
      <tspan x="1320" dy="36">named entries</tspan>
    </text>

    
    <rect x="1140" y="315" width="360" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="350" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">u:alice:rw</text>

    <rect x="1140" y="380" width="360" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="415" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">u:bob:rw</text>

    <rect x="1140" y="445" width="360" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1320" y="480" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">g:readers:r</text>
  </g>

  
  <g id="box-default-acl">
    <rect x="60" y="580" width="1480" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 645 H155 L170 660 H210 V705 H120 Z" />
      <path d="M165 675 V695 M157 687 L165 695 L173 687" />
    </g>

    
    <text x="830" y="660" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="830" dy="0">default ACL (setfacl -d)</tspan>
      <tspan x="830" dy="40">is inherited by new files and subdirectories</tspan>
    </text>
  </g>

  
  <g id="chips-container">
    <rect x="60" y="790" width="1480" height="250" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="100" y="825" width="670" height="70" rx="10" fill="#f0f5f1" stroke="#207448" stroke-width="2" />
    <text x="435" y="869" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">setfacl -m u:alice:rw mydir</text>

    
    <rect x="830" y="825" width="670" height="70" rx="10" fill="#f0f5f1" stroke="#207448" stroke-width="2" />
    <text x="1165" y="869" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">getfacl mydir</text>

    
    <rect x="100" y="930" width="1400" height="75" rx="10" fill="#f0f5f1" stroke="#207448" stroke-width="2" />
    <text x="800" y="977" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ls -l shows a + at the end of the permissions</text>
  </g>
</svg>