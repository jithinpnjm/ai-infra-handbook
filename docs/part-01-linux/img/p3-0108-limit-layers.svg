<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Which layer sets the limit for your job: login, service, container or Slurm</title>
  <desc>Visual explanation of the four layers that configure resource limits, how children inherit soft limits to the process, and common limit errors.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="14" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Which layer sets the limit for your job:</text>
  <text x="800" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">login, service, container or Slurm</text>

  
  <rect x="50" y="145" width="1020" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="75" y="165" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="75" y1="179" x2="127" y2="179" stroke="#207448" stroke-width="2"/>
  <path d="M 85 192 L 94 198 L 85 204" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="204" x2="114" y2="204" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <text x="145" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Login session (SSH)</text>
  <text x="75" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">PAM reads <tspan font-family="'Courier New', monospace" font-weight="bold">/etc/security/limits.conf</tspan> and <tspan font-family="'Courier New', monospace" font-weight="bold">limits.d/*.conf</tspan></text>
  <text x="75" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">example line <tspan font-family="'Courier New', monospace" font-weight="bold">* soft memlock unlimited</tspan></text>

  
  
  <rect x="50" y="310" width="1020" height="150" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  
  <g transform="translate(101, 354)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M -3 -22 L 3 -22 L 2 -17 L -2 -17 Z
             M -3 17 L 3 17 L 2 22 L -2 22 Z
             M -22 -3 L -22 3 L -17 2 L -17 -2 Z
             M 17 -3 L 17 3 L 22 2 L 22 -2 Z
             M -15 -15 L -10 -18 L -8 -13 L -12 -11 Z
             M 10 10 L 15 13 L 12 17 L 8 13 Z
             M -15 10 L -12 7 L -8 11 L -11 15 Z
             M 10 -15 L 14 -12 L 11 -8 L 8 -11 Z" fill="#207448"/>
  </g>
  
  <text x="145" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">systemd service</text>
  <text x="75" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan font-family="'Courier New', monospace" font-weight="bold">limits.conf</tspan> does NOT apply; set in the unit</text>
  <text x="75" y="440" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#303a36">LimitNOFILE=<tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal"> and </tspan>LimitMEMLOCK=infinity</text>

  
  <rect x="50" y="475" width="1020" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(101, 517)">
    <path d="M 0 -22 L 22 -10 L 0 2 L -22 -10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -22 -10 L -22 14 L 0 26 L 22 14 L 22 -10" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="0" y1="2" x2="0" y2="26" stroke="#207448" stroke-width="3.5"/>
  </g>
  
  <text x="145" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Container</text>
  <text x="75" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the runtime sets it, <tspan font-family="'Courier New', monospace" font-weight="bold">docker run --ulimit memlock=-1:-1</tspan></text>
  <text x="75" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Kubernetes inherits from the container runtime and node configuration</text>

  
  <rect x="50" y="640" width="1020" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(101, 683)">
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="-12" y1="-26" x2="-12" y2="-20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-26" x2="0" y2="-20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="-26" x2="12" y2="-20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="20" x2="-12" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="12" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-26" y1="-12" x2="-20" y2="-12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-26" y1="0" x2="-20" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-26" y1="12" x2="-20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="-12" x2="26" y2="-12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="26" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="12" x2="26" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <text x="145" y="691" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Slurm job</text>
  <text x="75" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">limits propagate from the submitting environment</text>
  <text x="75" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">unless <tspan font-family="'Courier New', monospace" font-weight="bold">PropagateResourceLimits</tspan> says otherwise</text>

  
  
  <line x1="1330" y1="175" x2="1330" y2="368" stroke="#207448" stroke-width="4"/>
  <circle cx="1330" cy="175" r="5" fill="#207448"/>

  
  <rect x="1130" y="372" width="400" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1330" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">children inherit soft limits</text>

  
  <line x1="1330" y1="432" x2="1330" y2="636" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1110" y="640" width="440" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1140, 665)">
    <rect x="0" y="0" width="44" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="12" x2="44" y2="12" stroke="#207448" stroke-width="2"/>
    <circle cx="8" cy="6" r="2" fill="#207448"/>
    <circle cx="15" cy="6" r="2" fill="#207448"/>
  </g>
  <text x="1200" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Your process:</text>
  <text x="1330" y="750" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">check cat /proc/PID/limits</text>

  
  <rect x="50" y="815" width="1500" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(85, 843)">
    <path d="M 0 -15 L 14 12 L -14 12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-6" x2="0" y2="2" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.5" fill="#207448"/>
  </g>
  <text x="118" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Too many open files <tspan font-family="'Courier New', monospace" font-weight="bold">(nofile, default soft limit 1024)</tspan></text>

  
  <g transform="translate(85, 911)">
    <path d="M 0 -15 L 14 12 L -14 12 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-6" x2="0" y2="2" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.5" fill="#207448"/>
  </g>
  <text x="118" y="920" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Cannot allocate memory when pinning for RDMA or GPU <tspan font-family="'Courier New', monospace" font-weight="bold">(memlock)</tspan></text>

  
  <rect x="50" y="985" width="1500" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1027" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Before you raise a limit, check which layer actually sets it for the job</text>
</svg>