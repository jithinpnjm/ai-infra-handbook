<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Restart policy and the start limit: how a crash loop ends in start-limit-hit</title>
  <desc>Infographic illustrating the systemd restart cycle, the start limit burst counter, the transition to start-limit-hit failure, recovery with reset-failed, and restart policy options.</desc>

  <defs>
    <marker id="arrowhead-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrowhead-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Restart policy and the start limit:</text>
  <text x="800" y="126" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">how a crash loop ends in start-limit-hit</text>

  

  
  <rect x="40" y="175" width="310" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="85" cy="225" r="24" fill="#207448"/>
  <text x="85" y="234" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(180, 202)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="21" x2="56" y2="21" stroke="#207448" stroke-width="3"/>
    <circle cx="12" cy="11" r="3.5" fill="#207448"/>
    <circle cx="23" cy="11" r="3.5" fill="#207448"/>
    <circle cx="12" cy="32" r="3.5" fill="#207448"/>
    <circle cx="23" cy="32" r="3.5" fill="#207448"/>
  </g>
  <text x="195" y="305" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service runs</text>

  
  <rect x="40" y="435" width="310" height="210" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="85" cy="485" r="24" fill="#207448"/>
  <text x="85" y="494" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(180, 462)">
    <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
    <circle cx="9" cy="7" r="2.5" fill="#207448"/>
    <circle cx="17" cy="7" r="2.5" fill="#207448"/>
    <path d="M21 21 L35 37 M35 21 L21 37" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="195" y="565" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Process exits</text>
  <text x="195" y="605" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">or crashes</text>

  
  <rect x="40" y="725" width="310" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="85" cy="775" r="24" fill="#207448"/>
  <text x="85" y="784" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(178, 752)">
    <path d="M28 2 L28 20 M28 20 L8 42 M28 20 L48 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="2" r="4.5" fill="#207448"/>
    <circle cx="8" cy="42" r="4.5" fill="#207448"/>
    <circle cx="48" cy="42" r="4.5" fill="#207448"/>
  </g>
  <text x="195" y="845" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">Restart= decides</text>
  <text x="195" y="890" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(no by default;</text>
  <text x="195" y="925" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">on-failure or always</text>
  <text x="195" y="960" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">for daemons that</text>
  <text x="195" y="995" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">must stay up)</text>

  
  <rect x="390" y="725" width="370" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="440" cy="775" r="24" fill="#207448"/>
  <text x="440" y="784" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(548, 748)">
    <circle cx="27" cy="27" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M27 12 L27 27 L40 33" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="575" y="845" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">Wait RestartSec=</text>
  <text x="575" y="900" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(default 100 ms;</text>
  <text x="575" y="940" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the chapter example</text>
  <text x="575" y="980" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">uses 5s)</text>

  
  <rect x="390" y="175" width="370" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(547, 200)">
    <path d="M4 36 A 28 28 0 1 1 52 36" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="36" x2="44" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="36" r="4.5" fill="#207448"/>
  </g>
  <text x="575" y="295" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">StartLimitBurst=</text>
  <text x="575" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">starts within</text>
  <text x="575" y="375" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">StartLimitIntervalSec=</text>
  <text x="575" y="410" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(both set in [Unit])</text>

  

  
  <rect x="805" y="175" width="370" height="370" rx="14" fill="#fdf6ec" stroke="#db8129" stroke-width="4"/>
  
  <g transform="translate(962, 202)">
    <path d="M28 4 L54 48 L2 48 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="42" r="3" fill="#db8129"/>
  </g>
  <text x="990" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">failed</text>
  <text x="990" y="335" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">(start-limit-hit):</text>
  <text x="990" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">systemd stops restarting;</text>
  <text x="990" y="420" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">Result shows start-limit-hit;</text>
  <text x="990" y="460" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">message: start request</text>
  <text x="990" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">repeated too quickly</text>

  
  <rect x="805" y="625" width="370" height="310" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(962, 655)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M19 19 L37 37 M37 19 L19 37" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="990" y="750" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Fix the cause, then</text>
  <text x="990" y="805" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">systemctl reset-failed</text>
  <text x="990" y="845" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">NAME;</text>
  <text x="990" y="890" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">lengthen RestartSec</text>

  

  
  <rect x="1220" y="175" width="340" height="480" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1245, 202)">
    <rect x="0" y="0" width="38" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="8" y1="12" x2="30" y2="12" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="20" x2="30" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1415" y="230" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">Restart= values</text>
  <line x1="1235" y1="255" x2="1545" y2="255" stroke="#207448" stroke-width="2"/>

  
  <circle cx="1255" cy="287" r="5" fill="#207448"/>
  <text x="1275" y="295" font-family="monospace" font-size="24" fill="#303a36">no (default)</text>

  <circle cx="1255" cy="337" r="5" fill="#207448"/>
  <text x="1275" y="345" font-family="monospace" font-size="24" fill="#303a36">on-success</text>

  <circle cx="1255" cy="387" r="5" fill="#207448"/>
  <text x="1275" y="395" font-family="monospace" font-size="24" fill="#303a36">on-failure</text>

  <circle cx="1255" cy="437" r="5" fill="#207448"/>
  <text x="1275" y="445" font-family="monospace" font-size="24" fill="#303a36">on-abnormal</text>

  <circle cx="1255" cy="487" r="5" fill="#207448"/>
  <text x="1275" y="495" font-family="monospace" font-size="24" fill="#303a36">on-abort</text>

  <circle cx="1255" cy="537" r="5" fill="#207448"/>
  <text x="1275" y="545" font-family="monospace" font-size="24" fill="#303a36">on-watchdog</text>

  <circle cx="1255" cy="587" r="5" fill="#207448"/>
  <text x="1275" y="595" font-family="monospace" font-size="24" fill="#303a36">always</text>

  
  <rect x="1220" y="725" width="340" height="330" rx="14" fill="#fdfaf5" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1368, 748)">
    <path d="M4 0 L32 0 L44 12 L44 44 L4 44 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M32 0 L32 12 L44 12" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="2.5"/>
    <line x1="12" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="1390" y="825" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">Restart=always</text>
  <text x="1390" y="860" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">can cause a crash loop</text>
  <text x="1390" y="895" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">that floods the logs;</text>
  <text x="1390" y="930" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">rely on OnFailure= to</text>
  <text x="1390" y="965" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">start an alert or</text>
  <text x="1390" y="1000" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">drain unit</text>

  

  
  <line x1="195" y1="355" x2="195" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <line x1="195" y1="645" x2="195" y2="725" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <line x1="350" y1="890" x2="390" y2="890" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <line x1="575" y1="725" x2="575" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <line x1="390" y1="265" x2="350" y2="265" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <line x1="760" y1="305" x2="805" y2="305" stroke="#db8129" stroke-width="4" marker-end="url(#arrowhead-orange)"/>

  
  <line x1="990" y1="545" x2="990" y2="625" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-green)"/>

  
  <rect x="40" y="1100" width="1520" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1142" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Pick Type= and Restart= before you write a service</text>
</svg>