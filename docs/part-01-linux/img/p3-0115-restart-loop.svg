<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>Restart policy and the start limit: how a crash loop ends in start-limit-hit</title>
  <desc>Visual explanation of systemd service restart loop, start rate limiting, and resolution.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5" />

  
  <g>
    <text x="80" y="60" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Restart policy and the start limit:</text>
    <text x="80" y="112" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448">how a crash loop ends in start-limit-hit</text>
  </g>

  

  
  <g>
    <rect x="80" y="170" width="340" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="118" cy="235" r="22" fill="#207448" />
    <text x="118" y="243" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(155, 213)" fill="none" stroke="#207448" stroke-width="3">
      <circle cx="22" cy="22" r="10" />
      <path d="M22,4 L22,9 M22,35 L22,40 M4,22 L9,22 M35,22 L40,22 M9,9 L13,13 M31,31 L35,35 M9,35 L13,31 M31,13 L35,9" />
    </g>
    <text x="215" y="244" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service runs</text>
  </g>

  
  <line x1="420" y1="235" x2="482" y2="235" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="490" y="170" width="360" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="528" cy="235" r="22" fill="#207448" />
    <text x="528" y="243" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(565, 213)" fill="none" stroke="#207448" stroke-width="3">
      <polygon points="22,6 39,38 5,38" />
      <line x1="22" y1="18" x2="22" y2="28" stroke-width="3.5" />
      <circle cx="22" cy="33" r="1.5" fill="#207448" />
    </g>
    <text x="625" y="224" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Process exits</text>
    <text x="625" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">or crashes</text>
  </g>

  
  <line x1="670" y1="300" x2="670" y2="342" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="490" y="350" width="360" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="528" cy="388" r="22" fill="#207448" />
    <text x="528" y="396" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="565" y="396" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Restart= decides</text>
    <text x="520" y="440" font-family="sans-serif" font-size="24" fill="#303a36">(no by default;</text>
    <text x="520" y="475" font-family="sans-serif" font-size="24" fill="#303a36">on-failure or always</text>
    <text x="520" y="510" font-family="sans-serif" font-size="24" fill="#303a36">for daemons that</text>
    <text x="520" y="545" font-family="sans-serif" font-size="24" fill="#303a36">must stay up)</text>
  </g>

  
  <line x1="670" y1="590" x2="670" y2="632" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="280" y="640" width="570" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(305, 700)" fill="none" stroke="#207448" stroke-width="3">
      <rect x="4" y="8" width="46" height="34" rx="4" />
      <path d="M12,28 L20,28 L25,16 L31,38 L36,28 L42,28" />
    </g>
    <text x="375" y="690" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">StartLimitBurst= starts within</text>
    <text x="375" y="730" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">StartLimitIntervalSec=</text>
    <text x="375" y="770" font-family="sans-serif" font-size="24" fill="#303a36">(both set in [Unit])</text>
  </g>

  
  <path d="M 280 730 L 220 730 L 220 598" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="80" y="350" width="340" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="118" cy="388" r="22" fill="#207448" />
    <text x="118" y="396" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="155" y="396" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Wait RestartSec=</text>
    <text x="110" y="445" font-family="sans-serif" font-size="24" fill="#303a36">(default 100 ms;</text>
    <text x="110" y="485" font-family="sans-serif" font-size="24" fill="#303a36">the chapter example</text>
    <text x="110" y="525" font-family="sans-serif" font-size="24" fill="#303a36">uses 5s)</text>
  </g>

  
  <line x1="250" y1="350" x2="250" y2="308" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  

  
  <line x1="850" y1="715" x2="892" y2="715" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g>
    <rect x="900" y="590" width="640" height="230" rx="14" fill="#fff6ed" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(930, 616)" fill="none" stroke="#db8129" stroke-width="3">
      <circle cx="20" cy="20" r="18" />
      <line x1="12" y1="12" x2="28" y2="28" stroke-width="3.5" />
    </g>
    <text x="980" y="642" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">failed (start-limit-hit):</text>
    <text x="930" y="684" font-family="sans-serif" font-size="24" fill="#303a36">systemd stops restarting;</text>
    <text x="930" y="720" font-family="monospace" font-size="24" fill="#303a36">Result shows start-limit-hit;</text>
    <text x="930" y="756" font-family="monospace" font-size="24" fill="#303a36">message: start request</text>
    <text x="930" y="792" font-family="monospace" font-size="24" fill="#303a36">repeated too quickly</text>
  </g>

  
  <line x1="1220" y1="820" x2="1220" y2="852" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="900" y="860" width="640" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(930, 882)" fill="none" stroke="#207448" stroke-width="3">
      <path d="M12,32 L26,18 M20,12 C18,8 10,8 6,12 C2,16 2,24 6,26 L18,14" />
      <circle cx="28" cy="34" r="3" />
    </g>
    <text x="975" y="906" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Fix the cause, then</text>
    <text x="930" y="955" font-family="monospace" font-size="24" font-weight="bold" fill="#1a5b38">systemctl reset-failed NAME;</text>
    <text x="930" y="995" font-family="sans-serif" font-size="24" fill="#303a36">lengthen RestartSec</text>
  </g>

  
  <g>
    <rect x="900" y="170" width="640" height="390" rx="14" fill="#ffffff" stroke="#c0d6c5" stroke-width="2" />
    <text x="930" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Restart= values</text>

    
    <circle cx="940" cy="258" r="4" fill="#207448" />
    <text x="955" y="265" font-family="monospace" font-size="24" fill="#303a36">no (default)</text>

    <circle cx="940" cy="298" r="4" fill="#207448" />
    <text x="955" y="305" font-family="monospace" font-size="24" fill="#303a36">on-success</text>

    <circle cx="940" cy="338" r="4" fill="#207448" />
    <text x="955" y="345" font-family="monospace" font-size="24" fill="#303a36">on-failure</text>

    <circle cx="940" cy="378" r="4" fill="#207448" />
    <text x="955" y="385" font-family="monospace" font-size="24" fill="#303a36">on-abnormal</text>

    
    <circle cx="1230" cy="258" r="4" fill="#207448" />
    <text x="1245" y="265" font-family="monospace" font-size="24" fill="#303a36">on-abort</text>

    <circle cx="1230" cy="298" r="4" fill="#207448" />
    <text x="1245" y="305" font-family="monospace" font-size="24" fill="#303a36">on-watchdog</text>

    <circle cx="1230" cy="338" r="4" fill="#207448" />
    <text x="1245" y="345" font-family="monospace" font-size="24" fill="#303a36">always</text>

    
    <rect x="920" y="408" width="600" height="135" rx="8" fill="#f5f8f5" stroke="#d5e2d7" stroke-width="1.5" />
    <text x="940" y="440" font-family="sans-serif" font-size="24" fill="#303a36">Restart=always can cause a crash</text>
    <text x="940" y="472" font-family="sans-serif" font-size="24" fill="#303a36">loop that floods the logs; rely on</text>
    <text x="940" y="504" font-family="sans-serif" font-size="24" fill="#303a36">OnFailure= to start an alert</text>
    <text x="940" y="534" font-family="sans-serif" font-size="24" fill="#303a36">or drain unit</text>
  </g>

  
  <g>
    <rect x="80" y="1080" width="1460" height="70" rx="10" fill="#207448" />
    <text x="810" y="1124" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Pick Type= and Restart= before you write a service</text>
  </g>
</svg>