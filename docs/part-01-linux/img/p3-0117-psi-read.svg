<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" width="1600" height="1070">
  <title>Pressure stall information: some versus full</title>
  <desc>Infographic explaining Linux Pressure Stall Information (PSI) some versus full metrics</desc>

  <defs>
    <pattern id="hatch_green" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#207448" stroke-width="3.5" />
    </pattern>
  </defs>

  
  <rect width="1600" height="1070" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Pressure stall information: some versus full</text>

  
  <rect x="40" y="98" width="1520" height="64" rx="8" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="800" y="139" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cat /proc/pressure/memory: some avg10= avg60= avg300= total=  and  full ...</text>

  
  <rect x="40" y="182" width="830" height="275" rx="12" fill="#f5f8f5" stroke="#b8d5bf" stroke-width="1.5" />
  
  
  <g transform="translate(65, 195)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="28" x2="28" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="28" x2="39" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="135" y="235" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">some</text>

  
  
  <rect x="70" y="250" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="250" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="250" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="250" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="282" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="282" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="282" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="282" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="255" y="254" width="430" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="470" y="287" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">stalled waiting for memory</text>

  
  <rect x="70" y="314" width="730" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="346" width="730" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="388" width="730" height="52" rx="8" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="435" y="423" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">some = share of time at least one task stalled</text>

  
  <rect x="40" y="475" width="830" height="288" rx="12" fill="#f5f8f5" stroke="#b8d5bf" stroke-width="1.5" />
  
  
  <g transform="translate(65, 488)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 36 A 18 18 0 1 1 44 36" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="28" y1="28" x2="40" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="135" y="528" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">full</text>

  
  
  <rect x="70" y="542" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="542" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="542" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="542" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="574" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="574" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="574" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="574" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="606" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="606" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="606" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="606" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="638" width="160" height="24" rx="5" fill="#207448" />
  <rect x="230" y="638" width="480" height="24" rx="5" fill="#e8f1ea" />
  <rect x="230" y="638" width="480" height="24" rx="5" fill="url(#hatch_green)" />
  <rect x="710" y="638" width="90" height="24" rx="5" fill="#207448" />

  
  <rect x="70" y="688" width="730" height="56" rx="8" fill="#fef5ed" stroke="#db8129" stroke-width="2.5" />
  <text x="435" y="724" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">full = share of time all non-idle tasks stalled</text>

  
  <rect x="895" y="182" width="665" height="581" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(925, 202)">
    <rect x="4" y="2" width="38" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="12" y1="14" x2="34" y2="14" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="12" y1="24" x2="34" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="12" y1="34" x2="26" y2="34" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="985" y="238" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Reading it</text>

  
  
  <rect x="925" y="270" width="605" height="64" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="950" y="310" font-family="sans-serif" font-size="24" fill="#303a36">averages over 10, 60 and 300 seconds</text>

  
  <rect x="925" y="352" width="605" height="154" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="950" y="392" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="950" dy="0">any sustained non-zero some,</tspan>
    <tspan x="950" dy="38">and any full value, signals saturation</tspan>
    <tspan x="950" dy="38">more directly than free-memory numbers</tspan>
  </text>

  
  <rect x="925" y="524" width="605" height="64" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="950" y="564" font-family="sans-serif" font-size="24" fill="#303a36">per-cgroup pressure in memory.pressure</text>

  
  <rect x="925" y="606" width="605" height="64" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="950" y="646" font-family="sans-serif" font-size="24" fill="#303a36">PSI appeared in Linux 4.20</text>

  
  <rect x="40" y="785" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(65, 825)">
    <rect x="4" y="16" width="24" height="24" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="22" y="6" width="24" height="24" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="125" y="865" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pair it with</text>

  
  <rect x="335" y="810" width="225" height="85" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="447" y="861" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">vmstat si/so</text>

  
  <rect x="580" y="810" width="955" height="85" rx="8" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.5" />
  <text x="605" y="845" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" dy="0">sar -B pgscand/s: allocating threads reclaim</tspan>
    <tspan x="605" dy="32">for themselves, each pass is a stall</tspan>
  </text>

  
  <rect x="40" y="942" width="1520" height="74" rx="10" fill="#207448" />
  <text x="800" y="989" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A machine can have plenty of memory and still be saturated</text>
</svg>