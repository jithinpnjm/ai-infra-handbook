<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>The X Window System</title>
  <desc>Architecture of X11 client and X server over network or SSH forwarding.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L18,9 L0,17 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  <rect x="40" y="110" width="600" height="680" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="340" dy="0">Remote cluster</tspan>
    <tspan x="340" dy="38">login/viz node</tspan>
  </text>

  <rect x="80" y="270" width="520" height="400" rx="20" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="340" y="390" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">X11 Client app</text>
  <text x="340" y="440" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="340" dy="0">(xclock, paraview,</tspan>
    <tspan x="340" dy="34">xterm)</tspan>
  </text>

  <rect x="960" y="110" width="600" height="680" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="1260" y="175" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="1260" dy="0">User's local laptop</tspan>
    <tspan x="1260" dy="38">/ workstation</tspan>
  </text>

  <rect x="1000" y="270" width="520" height="400" rx="20" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1260" y="390" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">X11 Server</text>
  <text x="1260" y="426" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(Xorg / XQuartz / VcXsrv)</text>
  <text x="1260" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1260" dy="0">owns screen, mouse,</tspan>
    <tspan x="1260" dy="34">keyboard (:0)</tspan>
  </text>

  <text x="800" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">X11 protocol (or</tspan>
    <tspan x="800" dy="34">ssh -X tunnel</tspan>
    <tspan x="800" dy="34">with DISPLAY +</tspan>
    <tspan x="800" dy="34">xauth cookie)</tspan>
  </text>
  <path d="M600 590 H1000" fill="none" stroke="#db8129" stroke-width="5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
</svg>