<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230">
  <title>Holding, pinning and reproducibility</title>
  <desc>Holding, pinning and reproducibility</desc>

  <rect width="1600" height="1230" fill="#f5f8f5"/>

  <text x="800" y="82" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Holding, pinning and reproducibility</text>

  
  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="40" y="130" width="240" height="230" rx="18"/>
    <rect x="344" y="130" width="240" height="230" rx="18"/>
    <rect x="648" y="130" width="240" height="230" rx="18"/>
    <rect x="952" y="130" width="240" height="230" rx="18"/>
    <rect x="1256" y="130" width="240" height="230" rx="18"/>
  </g>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="160" cy="171" r="16"/>
    <circle cx="160" cy="171" r="6"/>
    <path d="M160 140v8M160 194v8M129 171h8M183 171h8M138 149l6 6M176 187l6 6M182 149l-6 6M144 187l-6 6"/>
  </g>
  <text x="160" y="235" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="160">Routine</tspan>
    <tspan x="160" dy="36">upgrade</tspan>
    <tspan x="160" dy="36">(cron or</tspan>
    <tspan x="160" dy="36">unattended)</tspan>
  </text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="464" cy="154" rx="26" ry="10"/>
    <path d="M438 154v34c0 6 12 11 26 11s26-5 26-11v-34M438 171c0 6 12 11 26 11s26-5 26-11"/>
  </g>
  <text x="464" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">apt / dnf</text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="748" y="151" width="40" height="40" rx="5"/>
    <rect x="758" y="161" width="20" height="20" rx="2"/>
    <path d="M756 141v10M768 141v10M780 141v10M756 191v10M768 191v10M780 191v10M738 159h10M738 171h10M738 183h10M788 159h10M788 171h10M788 183h10"/>
  </g>
  <text x="768" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="768">Kernel</tspan>
    <tspan x="768" dy="36">package</tspan>
  </text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1072" cy="171" r="17"/>
    <circle cx="1072" cy="171" r="6"/>
    <path d="M1072 140v8M1072 194v8M1041 171h8M1095 171h8M1050 149l6 6M1088 187l6 6M1094 149l-6 6M1056 187l-6 6"/>
  </g>
  <text x="1072" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="1072">DKMS</tspan>
    <tspan x="1072" dy="36">(driver</tspan>
    <tspan x="1072" dy="36">module)</tspan>
  </text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1348" y="145" width="56" height="52" rx="5"/>
    <path d="M1358 157h36M1358 169h24M1358 181h30"/>
    <circle cx="1395" cy="169" r="2" fill="#207448"/>
    <circle cx="1395" cy="181" r="2" fill="#207448"/>
  </g>
  <text x="1376" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">GPU node</text>

  
  <g fill="none" stroke="#9bb9a3" stroke-width="3" stroke-dasharray="10 12">
    <path d="M160 370V1150"/>
    <path d="M464 370V1150"/>
    <path d="M768 370V1150"/>
    <path d="M1072 370V1150"/>
    <path d="M1376 370V1150"/>
  </g>

  
  <circle cx="80" cy="420" r="24" fill="#207448"/>
  <text x="80" y="429" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">1</text>
  <rect x="174" y="380" width="172" height="34" rx="8" fill="#f5f8f5"/>
  <text x="260" y="405" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">apt upgrade</text>
  <path d="M160 420H446" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M464 420l-18-5v10z" fill="#207448"/>

  
  <circle cx="384" cy="495" r="24" fill="#207448"/>
  <text x="384" y="504" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">2</text>
  <rect x="552" y="455" width="392" height="34" rx="8" fill="#f5f8f5"/>
  <text x="748" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">install new kernel 6.x</text>
  <path d="M464 495H750" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M768 495l-18-5v10z" fill="#207448"/>

  
  <circle cx="384" cy="570" r="24" fill="#207448"/>
  <text x="384" y="579" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">3</text>
  <rect x="478" y="530" width="460" height="34" rx="8" fill="#f5f8f5"/>
  <text x="708" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">rebuild nvidia module for 6.x</text>
  <path d="M464 570H1054" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M1072 570l-18-5v10z" fill="#207448"/>

  
  <rect x="40" y="615" width="1520" height="230" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="64" y="658" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">build succeeds (headers present, driver supports kernel)</text>
  <rect x="1140" y="675" width="168" height="34" rx="8" fill="#e8f1ea"/>
  <text x="1224" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">module ready</text>
  <path d="M1072 720H1358" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M1376 720l-18-5v10z" fill="#207448"/>
  <rect x="1264" y="736" width="224" height="88" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1280" y="767" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1280">next reboot:</tspan>
    <tspan x="1280" dy="30">GPUs fine</tspan>
  </text>

  
  <rect x="40" y="865" width="1520" height="325" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="64" y="908" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">build fails (no headers / driver too old for kernel)</text>
  <rect x="1128" y="927" width="192" height="34" rx="8" fill="#e8f1ea"/>
  <text x="1224" y="952" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no module for 6.x</text>
  <path d="M1072 972H1358" fill="none" stroke="#db8129" stroke-width="4"/>
  <path d="M1376 972l-18-5v10z" fill="#db8129"/>
  <rect x="1264" y="986" width="224" height="176" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1280" y="1014" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1280">next reboot</tspan>
    <tspan x="1280" dy="28">boots 6.x:</tspan>
    <tspan x="1280" dy="28">nvidia-smi</tspan>
    <tspan x="1280" dy="28">says no</tspan>
    <tspan x="1280" dy="28">driver</tspan>
  </text>
</svg>