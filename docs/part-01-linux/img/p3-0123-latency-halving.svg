<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Halving the problem: p99 time to first token, one question at a time</title>
  <desc>A binary descent tree troubleshooting high p99 TTFT and an analogous inspection procedure on training step segments.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#8c9b93" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Halving the problem: p99 time to first token,</tspan>
    <tspan x="800" dy="52">one question at a time</tspan>
  </text>

  
  
  
  <rect x="50" y="145" width="810" height="925" rx="16" fill="#ffffff" stroke="#d0ded4" stroke-width="2" />

  
  <rect x="235" y="170" width="440" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(255, 182)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="25" cy="25" r="21" />
    <path d="M 25 25 L 36 15" stroke-linecap="round" />
    <circle cx="25" cy="25" r="3.5" fill="#207448" />
  </g>
  <text x="475" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">p99 TTFT is high</text>

  
  <line x1="455" y1="245" x2="455" y2="288" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <polygon points="455,290 775,342 455,394 135,342" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="455" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">On the GPU, or before it?</text>

  
  <path d="M 775 342 L 830 342" stroke="#8c9b93" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" fill="none" />

  
  <line x1="455" y1="394" x2="455" y2="466" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <rect x="385" y="413" width="140" height="36" rx="18" fill="#207448" />
  <text x="455" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">before it</text>

  
  <polygon points="455,470 775,522 455,574 135,522" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="455" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Waiting in the queue, or in tokenization?</text>

  
  <path d="M 775 522 L 830 522" stroke="#8c9b93" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" fill="none" />

  
  <line x1="455" y1="574" x2="455" y2="644" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <rect x="375" y="592" width="160" height="36" rx="18" fill="#207448" />
  <text x="455" y="617" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the queue</text>

  
  <polygon points="455,648 785,725 455,802 125,725" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="455" y="714" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="455" dy="0">Is the queue long because arrivals exceed</tspan>
    <tspan x="455" dy="32">service capacity, or because batches are held?</tspan>
  </text>

  
  <path d="M 785 725 L 830 725" stroke="#8c9b93" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" fill="none" />

  
  <line x1="455" y1="802" x2="455" y2="888" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <rect x="330" y="828" width="250" height="36" rx="18" fill="#207448" />
  <text x="455" y="853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">batches are held</text>

  
  <rect x="85" y="892" width="740" height="150" rx="14" fill="#fff7ee" stroke="#db8129" stroke-width="3.5" />
  
  <g transform="translate(112, 940)" stroke="#db8129" stroke-width="3.5" fill="none">
    <circle cx="26" cy="26" r="11" />
    <path d="M 26 5 L 26 11 M 26 41 L 26 47 M 5 26 L 11 26 M 41 26 L 47 26 M 11 11 L 15 15 M 37 37 L 41 41 M 11 41 L 15 37 M 37 11 L 41 15" stroke-linecap="round" />
  </g>
  <text x="470" y="955" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#9c4505">
    <tspan x="470" dy="0">The batch scheduler waits for a fill timeout:</tspan>
    <tspan x="470" dy="38">adjust the policy</tspan>
  </text>

  
  
  
  <rect x="890" y="145" width="660" height="925" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(920, 172)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="22" cy="22" r="18" />
    <path d="M 22 10 L 22 22 L 30 28" stroke-linecap="round" />
  </g>
  <text x="975" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">The same procedure on a training step</text>

  
  
  <rect x="920" y="235" width="600" height="60" rx="8" fill="#ffffff" stroke="#8c9b93" stroke-width="2" />
  <rect x="920" y="235" width="18" height="60" rx="4" fill="#8c9b93" />
  <text x="955" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#44524c">data wait</text>

  
  <rect x="920" y="307" width="600" height="60" rx="8" fill="#ffffff" stroke="#8c9b93" stroke-width="2" />
  <rect x="920" y="307" width="18" height="60" rx="4" fill="#8c9b93" />
  <text x="955" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#44524c">host-to-device copies (H2D)</text>

  
  <rect x="920" y="379" width="600" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
  
  <g transform="translate(945, 400)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="8" width="30" height="30" rx="4" fill="#e8f1ea" />
    <path d="M 18 18 L 28 18 L 28 28 L 18 28 Z" fill="#207448" />
    <path d="M 15 2 L 15 8 M 23 2 L 23 8 M 31 2 L 31 8 M 15 38 L 15 44 M 23 38 L 23 44 M 31 38 L 31 44 M 2 15 L 8 15 M 2 23 L 8 23 M 2 31 L 8 31 M 38 15 L 44 15 M 38 23 L 44 23 M 38 31 L 44 31" stroke-linecap="round" />
  </g>
  <text x="1005" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">compute</text>

  
  <rect x="945" y="465" width="550" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(1198, 490)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="22" cy="22" r="18" />
    <path d="M 22 13 L 22 31 M 15 24 L 22 31 L 29 24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="1220" y="585" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="1220" dy="0">descend into the largest;</tspan>
    <tspan x="1220" dy="42">profilers time each part for you</tspan>
  </text>

  
  <rect x="920" y="776" width="600" height="60" rx="8" fill="#ffffff" stroke="#8c9b93" stroke-width="2" />
  <rect x="920" y="776" width="18" height="60" rx="4" fill="#8c9b93" />
  <text x="955" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#44524c">communication</text>

  
  <rect x="920" y="848" width="600" height="60" rx="8" fill="#ffffff" stroke="#8c9b93" stroke-width="2" />
  <rect x="920" y="848" width="18" height="60" rx="4" fill="#8c9b93" />
  <text x="955" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#44524c">optimizer</text>

  
  <rect x="920" y="920" width="600" height="60" rx="8" fill="#ffffff" stroke="#8c9b93" stroke-width="2" />
  <rect x="920" y="920" width="18" height="60" rx="4" fill="#8c9b93" />
  <text x="955" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#44524c">checkpoint</text>

  
  
  
  <rect x="50" y="1095" width="1500" height="75" rx="12" fill="#207448" />
  <text x="800" y="1142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each step is a measurement, not a guess, which is what makes the halving safe</text>
</svg>