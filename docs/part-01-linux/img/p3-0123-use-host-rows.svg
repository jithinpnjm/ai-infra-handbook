<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>USE table, host and fabric side: CPU, memory, storage, network and software limits</title>
  <desc>A matrix covering Utilisation, Saturation, and Errors across CPU, memory, storage, network, fabric, and container resources.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">USE table, host and fabric side:</text>
  <text x="40" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">CPU, memory, storage, network and software limits</text>

  
  <rect x="390" y="160" width="386" height="48" rx="6" fill="#207448"/>
  <text x="583" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Utilisation</text>

  <rect x="780" y="160" width="386" height="48" rx="6" fill="#207448"/>
  <text x="973" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Saturation</text>

  <rect x="1170" y="160" width="390" height="48" rx="6" fill="#207448"/>
  <text x="1365" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Errors</text>

  
  <rect x="40" y="212" width="346" height="116" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
