    <rect x="25" y="24" width="5" height="5" fill="#207448"/>
    <rect x="33" y="24" width="5" height="5" fill="#207448"/>
  </g>
  <text x="116" y="733" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fabric and</text>
  <text x="116" y="765" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">switches</text>

  <rect x="390" y="690" width="386" height="106" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="408" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">port counters</text>
  <text x="408" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(UFM, NetQ, ibdiagnet)</text>

  <rect x="780" y="690" width="386" height="106" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="798" y="726" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">buffer occupancy,</text>
  <text x="798" y="753" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">PFC pause,</text>
  <text x="798" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">adaptive routing stats</text>

  <rect x="1170" y="690" width="390" height="106" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="1188" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">link down events,</text>
  <text x="1188" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">bit error rate</text>

  
  <rect x="40" y="800" width="346" height="114" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(54, 835)">
    <rect x="6" y="6" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="15" y1="6" x2="15" y2="42" stroke="#207448" stroke-width="2.5"/>
    <line x1="24" y1="6" x2="24" y2="42" stroke="#207448" stroke-width="2.5"/>
    <line x1="33" y1="6" x2="33" y2="42" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="116" y="845" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Containers</text>
  <text x="116" y="878" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(cgroup limits)</text>

  <rect x="390" y="800" width="386" height="114" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="408" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">cpu.stat,</text>
  <text x="408" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">memory.current versus</text>
  <text x="408" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">memory.max, io.stat</text>

  <rect x="780" y="800" width="386" height="114" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="798" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">CPU throttling,</text>
  <text x="798" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">memory.events high and max,</text>
  <text x="798" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">PSI per cgroup</text>

  <rect x="1170" y="800" width="390" height="114" rx="6" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="1188" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">OOM kills (memory.events</text>
  <text x="1188" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">oom_kill),</text>
  <text x="1188" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">pids max</text>

  
  <rect x="40" y="926" width="1520" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="60" y="956" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">The interconnects are usually over-provisioned, which is exactly why nobody suspects them:</text>
  <text x="60" y="986" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">check PCIe topology and link speed with nvidia-smi topo -m, about a minute</text>

  
  <rect x="40" y="1012" width="1520" height="74" rx="8" fill="#ffffff" stroke="#c8d6cb" stroke-width="1.5"/>
  <text x="60" y="1042" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Also: NUMA and memory bandwidth via perf stat, pcm-memory, numastat;</text>
  <text x="60" y="1070" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">swap and storage capacity via df -h and df -i</text>

  
  <rect x="40" y="1098" width="1520" height="62" rx="8" fill="#207448"/>
  <text x="800" y="1138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Map each USE cell to a tool, and list the cells with no tool</text>
</svg>