  <g fill="#303a36" font-family="sans-serif">
    <text x="160" y="155" font-size="30" font-weight="700">Workload:</text>
    <text x="160" y="200" font-size="24">PyTorch/JAX job, NCCL, data loader, inference server</text>

    <text x="160" y="287" font-size="30" font-weight="700">Containers / Slurm steps / Kubernetes pods</text>
    <text x="160" y="332" font-size="24">cgroups, CPU Manager, Topology Manager, device plugin</text>

    <text x="160" y="419" font-size="30" font-weight="700">Runtime libs:</text>
    <text x="160" y="464" font-size="24">CUDA, NCCL, MPI, allocators (jemalloc/tcmalloc), OMP/MKL threads</text>

    <text x="160" y="551" font-size="30" font-weight="700">GPU driver &amp; services:</text>
    <text x="160" y="596" font-size="24">nvidia modules, persistenced, fabric manager, DCGM, MIG/MPS, clocks, ECC</text>

    <text x="160" y="683" font-size="30" font-weight="700">OS:</text>
    <text x="160" y="713" font-size="24">sysctl, ulimits, THP, swap, governors, IRQ affinity, services,</text>
    <text x="160" y="741" font-size="24">filesystems, time sync, security</text>

    <text x="160" y="815" font-size="30" font-weight="700">Kernel &amp; boot:</text>
    <text x="160" y="845" font-size="24">cmdline (iommu, numa_balancing, isolcpus, hugepages), modules,</text>
    <text x="160" y="873" font-size="24">cgroup v2, mitigations</text>

    <text x="160" y="947" font-size="30" font-weight="700">Firmware:</text>
    <text x="160" y="977" font-size="24">BIOS/UEFI (NUMA, SMT, C-states, power profile, ACS, ReBAR, PCIe),</text>
    <text x="160" y="1005" font-size="24">BMC, GPU/NIC firmware</text>

    <text x="160" y="1079" font-size="30" font-weight="700">Hardware:</text>
    <text x="160" y="1109" font-size="24">CPU sockets, DRAM, PCIe switches, GPUs, NVLink/NVSwitch, NICs,</text>
    <text x="160" y="1137" font-size="24">NVMe, power &amp; cooling</text>
  </g>
</svg>