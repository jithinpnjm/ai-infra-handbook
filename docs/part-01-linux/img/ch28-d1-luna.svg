      <circle cx="17" cy="10" r="1.5" fill="#207448" stroke="none"/>
      <path d="M15 27l-6 6 6 6M27 39l7-12"/>
    </g>
    <g transform="translate(72 282)">
      <rect x="3" y="4" width="23" height="21" rx="3"/>
      <rect x="30" y="4" width="23" height="21" rx="3"/>
      <rect x="16" y="29" width="24" height="21" rx="3"/>
      <path d="M8 11h13M35 11h13M21 36h14"/>
    </g>
    <g transform="translate(72 414)">
      <circle cx="28" cy="28" r="11"/>
      <circle cx="28" cy="28" r="3"/>
      <path d="M28 3v8M28 45v8M3 28h8M45 28h8M10.3 10.3l5.7 5.7M40 40l5.7 5.7M45.7 10.3 40 16M16 40l-5.7 5.7"/>
    </g>
