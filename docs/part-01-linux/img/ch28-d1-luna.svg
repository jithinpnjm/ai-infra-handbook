      <rect x="9" y="10" width="38" height="36" rx="4"/>
      <path d="M17 4v6M27 4v6M37 4v6M17 46v6M27 46v6M37 46v6M3 18h6M3 29h6M3 40h6M47 18h6M47 29h6M47 40h6"/>
