    <rect x="50" y="780" width="1500" height="116" rx="16"/>
    <rect x="50" y="912" width="1500" height="116" rx="16"/>
    <rect x="50" y="1044" width="1500" height="116" rx="16"/>
  </g>

  <g fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)">
    <path d="M800 236 V252"/>
  </g>
  <g fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)">
    <path d="M800 368 V384"/>
    <path d="M800 500 V516"/>
    <path d="M800 632 V648"/>
    <path d="M800 764 V780"/>
    <path d="M800 896 V912"/>
    <path d="M800 1028 V1044"/>
  </g>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(72 150)">
      <rect x="2" y="4" width="52" height="44" rx="5"/>
