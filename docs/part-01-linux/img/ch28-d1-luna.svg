      <circle cx="12" cy="12" r="1.5" fill="#207448" stroke="none"/>
      <circle cx="12" cy="30" r="1.5" fill="#207448" stroke="none"/>
      <circle cx="12" cy="48" r="1.5" fill="#207448" stroke="none"/>
