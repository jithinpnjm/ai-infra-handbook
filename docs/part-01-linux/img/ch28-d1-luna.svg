<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>The tuning stack, top to bottom</title>
  <desc>A top-to-bottom flow through the tuning stack.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="9" refY="15" orient="0" markerUnits="userSpaceOnUse">
      <path d="M3 4 L9 15 L15 4" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="9" refY="15" orient="0" markerUnits="userSpaceOnUse">
      <path d="M3 4 L9 15 L15 4" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="80" y="88" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">The tuning stack, top to bottom</text>

  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="50" y="120" width="1500" height="116" rx="16"/>
    <rect x="50" y="252" width="1500" height="116" rx="16"/>
