<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Why a container ignores SIGTERM: PID 1 has no default signal actions</title>
  <desc>Visual explanation of container PID 1 signal handling, zombie reaping, and clean shutdown best practices.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#667770" />
    </marker>
  </defs>

  
  <rect width="1600" height="1350" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448">Why a container ignores SIGTERM: PID 1 has no default signal actions</text>

  
  <g transform="translate(50, 110)">
    
    <rect x="0" y="0" width="310" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <path d="M 30 50 A 24 24 0 0 1 30 90 M 42 58 A 14 14 0 0 1 42 82 M 54 66 A 4 4 0 0 1 54 74" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="54" cy="70" r="3" fill="#207448" />
    <text x="95" y="70" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Signal Origin</text>
    <text x="30" y="130" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      <tspan x="30" dy="0">docker stop or</tspan>
      <tspan x="30" dy="32">kubelet sends</tspan>
      <tspan x="30" dy="32">SIGTERM</tspan>
    </text>

    
    <rect x="0" y="320" width="310" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="25" y="355" width="45" height="50" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="60" cy="380" r="3" fill="#207448" />
    <text x="85" y="390" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Inside Namespace</text>
    <text x="30" y="445" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">SIGTERM arrives</text>

    
    <path d="M 155 240 L 155 316" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <path d="M 360 490 L 390 490 L 390 240 L 416 240" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <path d="M 360 490 L 390 490 L 390 500 L 416 500" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(420, 110)">
    
    <rect x="0" y="0" width="1130" height="260" rx="14" fill="#fdf6ee" stroke="#f0be8b" stroke-width="2" />

    
    <rect x="20" y="16" width="560" height="42" rx="8" fill="#db8129" />
    <text x="35" y="45" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Shell script as PID 1, no SIGTERM handler</text>

    
    <rect x="20" y="75" width="245" height="165" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="36" y="112" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="36" dy="0">PID 1 has no</tspan>
      <tspan x="36" dy="30">default action, so</tspan>
      <tspan x="36" dy="30">with no handler the</tspan>
      <tspan x="36" dy="30">signal is ignored</tspan>
    </text>

    
    <path d="M 265 157 L 295 157" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="303" y="75" width="250" height="165" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    
    <circle cx="330" cy="110" r="14" fill="none" stroke="#db8129" stroke-width="3" />
    <polyline points="330,102 330,110 336,114" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="320" y="145" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="320" dy="0">grace period, 30</tspan>
      <tspan x="320" dy="32">seconds in</tspan>
      <tspan x="320" dy="32">Kubernetes by</tspan>
      <tspan x="320" dy="32">default</tspan>
    </text>

    
    <path d="M 553 157 L 583 157" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="591" y="75" width="245" height="165" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    
    <path d="M 618 96 L 610 114 L 622 114 L 614 132" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <text x="610" y="155" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="610" dy="0">SIGKILL from</tspan>
      <tspan x="610" dy="32">the parent</tspan>
      <tspan x="610" dy="32">namespace</tspan>
    </text>

    
    <path d="M 836 157 L 866 157" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="874" y="75" width="240" height="165" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    <text x="890" y="125" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      <tspan x="890" dy="0">training job</tspan>
      <tspan x="890" dy="32">loses its</tspan>
      <tspan x="890" dy="32">chance to</tspan>
      <tspan x="890" dy="32">checkpoint</tspan>
    </text>
  </g>

  
  <g transform="translate(420, 390)">
    
    <rect x="0" y="0" width="1130" height="225" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="20" y="16" width="850" height="42" rx="8" fill="#207448" />
    <text x="35" y="45" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">exec python train.py (the program is PID 1 and installs its own handler)</text>

    
    <rect x="20" y="75" width="310" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="55" cy="140" r="16" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 4" />
    <circle cx="55" cy="140" r="6" fill="#207448" />
    <text x="95" y="148" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">handler runs</text>

    
    <path d="M 330 140 L 375 140" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="385" y="75" width="350" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <ellipse cx="425" cy="125" rx="18" ry="8" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 407 125 v 25 c 0 4.4 8 8 18 8 s 18 -3.6 18 -8 v -25" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 407 137 c 0 4.4 8 8 18 8 s 18 -3.6 18 -8" fill="none" stroke="#207448" stroke-width="3" />
    <text x="465" y="148" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">checkpoint written</text>

    
    <path d="M 735 140 L 780 140" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="790" y="75" width="320" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="830" cy="140" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <polyline points="822,140 828,146 840,132" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="865" y="148" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">clean exit</text>
  </g>

  
  <g transform="translate(50, 645)">
    <text x="0" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">The three PID 1 rules</text>

    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="480" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <path d="M 40 30 L 65 20 L 90 30 C 90 55 65 75 65 75 C 65 75 40 55 40 30 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <text x="105" y="52" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Rule 1</text>
      <text x="30" y="105" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="30" dy="0" font-weight="bold">Signals:</tspan>
        <tspan font-weight="normal"> from inside the namespace a</tspan>
        <tspan x="30" dy="34">signal reaches PID 1 only if it</tspan>
        <tspan x="30" dy="34">installed a handler; SIGKILL and</tspan>
        <tspan x="30" dy="34">SIGSTOP from inside are ignored;</tspan>
        <tspan x="30" dy="34">from the parent namespace they</tspan>
        <tspan x="30" dy="34">still work</tspan>
      </text>
    </g>

    
    <g transform="translate(510, 50)">
      <rect x="0" y="0" width="480" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="65" cy="30" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 65 40 L 65 52 M 45 68 L 45 52 L 85 52 L 85 68" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="45" cy="74" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="85" cy="74" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <text x="105" y="52" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Rule 2</text>
      <text x="30" y="105" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="30" dy="0" font-weight="bold">Zombies:</tspan>
        <tspan font-weight="normal"> orphans are re-parented to</tspan>
        <tspan x="30" dy="34">PID 1, which must call wait();</tspan>
        <tspan x="30" dy="34">otherwise zombies pile up and</tspan>
        <tspan x="30" dy="34">can exhaust pids.max</tspan>
      </text>
    </g>

    
    <g transform="translate(1020, 50)">
      <rect x="0" y="0" width="480" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="65" cy="45" r="20" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 65 30 L 65 45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <text x="105" y="52" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Rule 3</text>
      <text x="30" y="105" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="30" dy="0">When PID 1 exits the kernel kills</tspan>
        <tspan x="30" dy="34">every other process in the</tspan>
        <tspan x="30" dy="34">namespace with SIGKILL, which</tspan>
        <tspan x="30" dy="34">is why a container dies when its</tspan>
        <tspan x="30" dy="34">main process dies</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(50, 1060)">
    <rect x="0" y="0" width="1500" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 45 42 C 40 32 45 22 55 22 C 60 22 65 25 68 28 L 56 40 L 62 46 L 74 34 C 77 37 80 42 80 47 C 80 57 70 62 60 57 L 35 82 C 32 85 27 85 24 82 C 21 79 21 74 24 71 Z" fill="#207448" />
    <text x="95" y="55" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Correct PID 1 configurations:</text>
    <text x="95" y="95" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="95" dy="0">exec in the entrypoint; tini; docker run --init; dumb-init;</tspan>
      <tspan x="95" dy="30">Kubernetes shareProcessNamespace; exec form ["python","train.py"] not the shell form</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1225)">
    <rect x="0" y="0" width="1500" height="75" rx="10" fill="#207448" />
    <text x="750" y="47" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">End the script with exec so the program becomes PID 1</text>
  </g>
</svg>