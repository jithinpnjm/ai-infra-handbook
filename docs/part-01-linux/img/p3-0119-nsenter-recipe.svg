<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Debugging a pod from the host: find the PID, then enter its network namespace</title>
  <desc>An infographic illustrating how to debug a pod from the host by finding the container PID, inspecting the namespace in /proc, and running host diagnostic tools using nsenter.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 0 3 L 16 9 L 0 15 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Debugging a pod from the host:</text>
  <text x="40" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">find the PID, then enter its network namespace</text>

  

  
  <g id="step-1">
    <rect x="40" y="150" width="720" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="75" cy="185" r="24" fill="#207448" />
    <text x="75" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <g transform="translate(680, 165)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="26" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="115" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Find the container's host PID:</text>
    <text x="64" y="255" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">crictl inspect &lt;id&gt; | grep -i pid, or</text>
    <text x="64" y="305" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">docker inspect -f {{.State.Pid}} &lt;name&gt;</text>
  </g>

  
  <g id="step-2">
    <rect x="40" y="400" width="720" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="75" cy="435" r="24" fill="#207448" />
    <text x="75" y="444" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <g transform="translate(680, 415)">
      <rect x="2" y="2" width="22" height="14" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="18" y="14" width="22" height="14" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="12" y1="16" x2="28" y2="16" stroke="#207448" stroke-width="3.5" />
    </g>

    
    <text x="115" y="445" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Check the namespace:</text>
    <text x="64" y="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">ls -l /proc/PID/ns</tspan> shows links like
    </text>
    <text x="64" y="535" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">net:[4026531992]</tspan>; the same number as
    </text>
    <text x="64" y="575" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">another process means the same namespace;</text>
    <text x="64" y="615" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">lsns -t net</tspan> lists network namespaces
    </text>
  </g>

  
  <g id="step-3">
    <rect x="40" y="675" width="720" height="200" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    
    <circle cx="75" cy="710" r="24" fill="#db8129" />
    <text x="75" y="719" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <g transform="translate(680, 690)">
      <rect x="2" y="2" width="44" height="34" rx="4" fill="none" stroke="#db8129" stroke-width="3.5" />
      <path d="M 10 12 L 18 19 L 10 26" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="26" x2="36" y2="26" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="115" y="710" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Run host tools inside the</text>
    <text x="115" y="748" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">pod's network namespace:</text>
    <text x="64" y="805" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">sudo nsenter -t PID -n ss, tcpdump,</text>
    <text x="64" y="845" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">ethtool, ip addr</text>
  </g>

  

  
  <g id="host-box">
    <rect x="800" y="150" width="280" height="350" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(915, 170)">
      <rect x="0" y="0" width="50" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="19" x2="50" y2="19" stroke="#207448" stroke-width="3" />
      <circle cx="10" cy="10" r="2.5" fill="#207448" />
      <circle cx="18" cy="10" r="2.5" fill="#207448" />
      <circle cx="10" cy="28" r="2.5" fill="#207448" />
      <circle cx="18" cy="28" r="2.5" fill="#207448" />
      <line x1="28" y1="10" x2="42" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="28" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>

    
    <rect x="825" y="235" width="230" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="940" y="273" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">tcpdump</text>

    <rect x="825" y="315" width="230" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="940" y="353" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">ss</text>

    <rect x="825" y="395" width="230" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="940" y="433" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">ethtool</text>
  </g>

  
  <line x1="1080" y1="345" x2="1180" y2="345" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="pod-box">
    <rect x="1180" y="150" width="380" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
    
    
    <g transform="translate(1346, 175)">
      <polygon points="24,2 46,14 46,38 24,50 2,38 2,14" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="24" y1="2" x2="24" y2="26" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="26" x2="46" y2="14" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="26" x2="2" y2="14" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="1370" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">pod network namespace</text>
    <text x="1370" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(image has none of</text>
    <text x="1370" y="365" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">those tools)</text>
  </g>

  
  <g id="note-box">
    <rect x="800" y="540" width="760" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(830, 582)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="20" cy="12" r="2.5" fill="#207448" />
      <line x1="20" y1="18" x2="20" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="890" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">nsenter</tspan> wraps <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">setns</tspan>: this is also
    </text>
    <text x="890" y="618" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      approximately what <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">docker exec</tspan>
    </text>
    <text x="890" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      and <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">kubectl exec</tspan> do
    </text>
  </g>

  
  <g id="longer-variant-strip">
    <rect x="800" y="715" width="760" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <path d="M 800 727 A 12 12 0 0 1 812 715 L 1548 715 A 12 12 0 0 1 1560 727 L 1560 755 L 800 755 Z" fill="#e8f1ea" />
    <circle cx="825" cy="735" r="5" fill="#207448" />
    <circle cx="843" cy="735" r="5" fill="#207448" />
    <circle cx="861" cy="735" r="5" fill="#207448" />
    
    
    <g transform="translate(825, 785)">
      <path d="M 4 8 L 14 16 L 4 24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="20" y1="24" x2="34" y2="24" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="875" y="820" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="25" font-weight="bold" fill="#303a36">sudo nsenter -t 1234 -m -u -i -n -p /bin/sh</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="915" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(70, 955)">
      <path d="M 4 8 L 26 2 L 48 8 C 48 28 26 44 26 44 C 26 44 4 28 4 8 Z" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="26" y1="14" x2="26" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="26" cy="32" r="2.5" fill="#207448" />
    </g>

    
    <text x="145" y="955" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      A namespace stays alive while a process, an open file descriptor on <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">/proc/PID/ns/xxx</tspan>, or
    </text>
    <text x="145" y="993" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      a bind mount of that file refers to it; <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">ip netns</tspan> keeps named namespaces under
    </text>
    <text x="145" y="1030" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace">/run/netns</tspan> this way
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1095" width="1520" height="65" rx="10" fill="#207448" />
    <text x="800" y="1137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Learn to read the /proc/PID/ns links before you need them during an incident</text>
  </g>
</svg>