<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Real versus effective UID</title>
  <desc>Visual comparison of real UID and effective UID behaviors for normal programs versus setuid programs owned by root.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="60" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Real versus effective UID</text>

  
  <g id="row1">
    <rect x="60" y="115" width="1480" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 137)">
      <rect x="2" y="2" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="2" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4"/>
      <circle cx="12" cy="10" r="3" fill="#207448"/>
      <circle cx="22" cy="10" r="3" fill="#207448"/>
    </g>

    
    <text x="170" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Row 1: you run a normal program</text>

    
    <rect x="170" y="215" width="620" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="480" y="286" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">ruid = you</text>

    
    <rect x="830" y="215" width="670" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1165" y="286" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">euid = you</text>
  </g>

  
  <g id="row2">
    <rect x="60" y="405" width="1480" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(90, 427)">
      <path d="M 28 4 L 50 14 L 50 32 C 50 46 28 54 28 54 C 28 54 6 46 6 32 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="28" cy="24" r="5" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="29" x2="28" y2="38" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="170" y="464" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Row 2: you run a setuid program owned by root</text>

    
    <rect x="170" y="505" width="620" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="480" y="576" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">ruid stays yours</text>

    
    <rect x="830" y="505" width="670" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="1165" y="576" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">euid becomes the file owner's</text>
  </g>

  
  <g id="legend">
    <rect x="60" y="695" width="1480" height="355" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(90, 717)">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="18" x2="40" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="170" y="754" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Legend</text>

    
    <circle cx="180" cy="803" r="8" fill="#207448"/>
    <text x="206" y="812" font-family="sans-serif" font-size="26" fill="#303a36">euid is the identity used for permission checks (the actor)</text>

    
    <circle cx="180" cy="863" r="8" fill="#207448"/>
    <text x="206" y="872" font-family="sans-serif" font-size="26" fill="#303a36">ruid is who started the process and who may signal it (the owner)</text>

    
    <circle cx="180" cy="923" r="8" fill="#207448"/>
    <text x="206" y="932" font-family="sans-serif" font-size="26" fill="#303a36">saved UID lets euid switch back</text>

    
    <g transform="translate(170, 965)">
      <rect x="0" y="0" width="570" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="38" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ps -eo pid,euser,ruser,comm</text>
    </g>
  </g>
</svg>