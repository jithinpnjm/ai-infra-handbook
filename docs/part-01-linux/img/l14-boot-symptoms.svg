<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1085" width="1600" height="1085">
  <title>Boot symptom to likely cause</title>
  <desc>Infographic mapping Linux boot symptoms to their likely causes and first troubleshooting actions.</desc>

  <rect width="1600" height="1085" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Boot symptom to likely cause</text>

  
  <rect x="50" y="95" width="470" height="55" rx="8" fill="#207448"/>
  <text x="285" y="133" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Symptom</text>

  <rect x="540" y="95" width="490" height="55" rx="8" fill="#207448"/>
  <text x="785" y="133" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Likely cause</text>

  <rect x="1050" y="95" width="500" height="55" rx="8" fill="#207448"/>
  <text x="1300" y="133" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">First action</text>

  
  <rect x="50" y="165" width="470" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 194)">
    
    <ellipse cx="28" cy="14" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 6 14 v 24 c 0 5 10 9 22 9 s 22 -4 22 -9 v -24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 6 26 c 0 5 10 9 22 9 s 22 -4 22 -9" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="145" y="231" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no bootable device</text>

  <rect x="540" y="165" width="490" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="217" font-family="sans-serif" font-size="24" fill="#303a36">boot order or mode wrong,</text>
  <text x="565" y="249" font-family="sans-serif" font-size="24" fill="#303a36">ESP or MBR damaged</text>

  <rect x="1050" y="165" width="500" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="231" font-family="monospace" font-size="24" fill="#303a36">efibootmgr, grub-install</text>

  
  <rect x="50" y="295" width="470" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 324)">
    
    <rect x="4" y="6" width="48" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 14 20 l 8 7 l -8 7 M 28 34 h 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="145" y="361" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">grub rescue&gt; prompt</text>

  <rect x="540" y="295" width="490" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="361" font-family="sans-serif" font-size="24" fill="#303a36">GRUB cannot find its prefix</text>

  <rect x="1050" y="295" width="500" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="361" font-family="monospace" font-size="24" fill="#303a36">ls, set prefix</text>

  
  <rect x="50" y="425" width="470" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 469)">
    
    <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="145" y="475" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">VFS: Unable to mount</text>
  <text x="145" y="507" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">root fs on</text>
  <text x="145" y="539" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">unknown-block(0,0)</text>

  <rect x="540" y="425" width="490" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="491" font-family="sans-serif" font-size="24" fill="#303a36">no driver for root device</text>
  <text x="565" y="523" font-family="sans-serif" font-size="24" fill="#303a36">or stale initramfs</text>

  <rect x="1050" y="425" width="500" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="491" font-family="monospace" font-size="24" fill="#303a36">boot older kernel,</text>
  <text x="1075" y="523" font-family="monospace" font-size="24" fill="#303a36">rebuild initramfs</text>

  
  <rect x="50" y="585" width="470" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 614)">
    
    <rect x="4" y="10" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="16" cy="24" r="3" fill="#207448"/>
    <circle cx="28" cy="24" r="3" fill="#207448"/>
    <circle cx="40" cy="24" r="3" fill="#207448"/>
    <line x1="12" y1="44" x2="12" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="44" x2="20" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="44" y1="44" x2="44" y2="50" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="145" y="651" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">(initramfs) shell</text>

  <rect x="540" y="585" width="490" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="651" font-family="sans-serif" font-size="24" fill="#303a36">root device not found in time</text>

  <rect x="1050" y="585" width="500" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="651" font-family="monospace" font-size="24" fill="#303a36">rootwait, check UUID</text>

  
  <rect x="50" y="715" width="470" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 744)">
    
    <path d="M 28 6 L 6 16 v 16 c 0 14 10 22 22 26 c 12 -4 22 -12 22 -26 V 16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="20" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="42" r="2.5" fill="#207448"/>
  </g>
  <text x="145" y="781" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">emergency mode</text>

  <rect x="540" y="715" width="490" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="781" font-family="sans-serif" font-size="24" fill="#303a36">fstab or fsck failed</text>

  <rect x="1050" y="715" width="500" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="765" font-family="monospace" font-size="24" fill="#303a36">journalctl -xb,</text>
  <text x="1075" y="797" font-family="monospace" font-size="24" fill="#303a36">fix /etc/fstab</text>

  
  <rect x="50" y="845" width="470" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(68, 874)">
    
    <rect x="4" y="8" width="48" height="38" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
    <circle cx="22" cy="27" r="10" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="38" cy="27" r="6" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="8" y1="46" x2="20" y2="46" stroke="#db8129" stroke-width="4"/>
    <line x1="26" y1="46" x2="40" y2="46" stroke="#db8129" stroke-width="4"/>
  </g>
  <text x="145" y="911" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">GPU missing after boot</text>

  <rect x="540" y="845" width="490" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="565" y="897" font-family="sans-serif" font-size="24" fill="#303a36">DKMS failed or Secure Boot</text>
  <text x="565" y="929" font-family="sans-serif" font-size="24" fill="#303a36">rejected module</text>

  <rect x="1050" y="845" width="500" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1075" y="897" font-family="monospace" font-size="24" fill="#303a36">dkms status,</text>
  <text x="1075" y="929" font-family="monospace" font-size="24" fill="#303a36">mokutil --sb-state</text>

  
  <rect x="50" y="985" width="1500" height="65" rx="8" fill="#207448"/>
  <text x="800" y="1027" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">change one thing before you test again.</text>
</svg>