<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Four ways to write the dollar-100 text, and only two print it</title>
  <desc>Four ways to write the dollar-100 text, and only two print it</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Print the literal text $100</text>

  
  <g id="row-1">
    
    <rect x="80" y="130" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(108, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="0" y1="16" x2="56" y2="16"/>
      <path d="M 12 28 L 22 35 L 12 42"/>
      <line x1="28" y1="42" x2="42" y2="42"/>
    </g>
    
    <text x="188" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">echo $100</text>

    
    <text x="800" y="178" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#303a36">shell reads $1 (empty) then 00</text>
    <line x1="500" y1="192" x2="1098" y2="192" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="1100" y="130" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1128, 165)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <line x1="12" y1="28" x2="34" y2="28"/>
      <line x1="12" y1="38" x2="26" y2="38"/>
    </g>
    
    <text x="1208" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="bold" fill="#303a36">00</text>
    
    <g transform="translate(1335, 172)">
      <circle cx="18" cy="20" r="18" fill="none" stroke="#c93b2b" stroke-width="3"/>
      <path d="M 10 12 L 26 28 M 26 12 L 10 28" stroke="#c93b2b" stroke-width="3.5" stroke-linecap="round"/>
      <text x="46" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#c93b2b">wrong</text>
    </g>
  </g>

  
  <g id="row-2">
    
    <rect x="80" y="295" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(108, 330)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="0" y1="16" x2="56" y2="16"/>
      <path d="M 12 28 L 22 35 L 12 42"/>
      <line x1="28" y1="42" x2="42" y2="42"/>
    </g>
    
    <text x="188" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">echo &quot;$100&quot;</text>

    
    <text x="800" y="343" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#303a36">double quotes still expand $1</text>
    <line x1="500" y1="357" x2="1098" y2="357" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="1100" y="295" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1128, 330)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <line x1="12" y1="28" x2="34" y2="28"/>
      <line x1="12" y1="38" x2="26" y2="38"/>
    </g>
    
    <text x="1208" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="bold" fill="#303a36">00</text>
    
    <g transform="translate(1390, 337)">
      <circle cx="20" cy="20" r="20" fill="none" stroke="#c93b2b" stroke-width="3.5"/>
      <path d="M 11 11 L 29 29 M 29 11 L 11 29" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  
  <g id="row-3">
    
    <rect x="80" y="460" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(108, 495)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="0" y1="16" x2="56" y2="16"/>
      <path d="M 12 28 L 22 35 L 12 42"/>
      <line x1="28" y1="42" x2="42" y2="42"/>
    </g>
    
    <text x="188" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">echo &apos;$100&apos;</text>

    
    <text x="800" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#303a36">single quotes keep it literal</text>
    <line x1="500" y1="522" x2="1098" y2="522" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="1100" y="460" width="420" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1128, 495)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <line x1="12" y1="28" x2="34" y2="28"/>
      <line x1="12" y1="38" x2="26" y2="38"/>
    </g>
    
    <text x="1208" y="534" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="bold" fill="#303a36">$100</text>
    
    <g transform="translate(1390, 502)">
      <circle cx="20" cy="20" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 11 20 L 17 27 L 30 13" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  
  <g id="row-4">
    
    <rect x="80" y="625" width="420" height="125" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(108, 660)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="0" y1="16" x2="56" y2="16"/>
      <path d="M 12 28 L 22 35 L 12 42"/>
      <line x1="28" y1="42" x2="42" y2="42"/>
    </g>
    
    <text x="188" y="699" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#303a36">echo \$100</text>

    
    <text x="800" y="673" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#303a36">backslash makes $ literal</text>
    <line x1="500" y1="687" x2="1098" y2="687" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

    
    <rect x="1100" y="625" width="420" height="125" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(1128, 660)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="52" rx="6"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <line x1="12" y1="28" x2="34" y2="28"/>
      <line x1="12" y1="38" x2="26" y2="38"/>
    </g>
    
    <text x="1208" y="699" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="bold" fill="#303a36">$100</text>
    
    <g transform="translate(1390, 667)">
      <circle cx="20" cy="20" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 11 20 L 17 27 L 30 13" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  
  <g id="note-box">
    
    <rect x="80" y="805" width="1440" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(116, 850)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 4 L 38 4 L 50 16 L 50 50 L 6 50 Z"/>
      <path d="M 38 4 L 38 16 L 50 16"/>
      <line x1="16" y1="26" x2="38" y2="26"/>
      <line x1="16" y1="36" x2="32" y2="36"/>
    </g>
    
    <text x="195" y="863" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">echo &quot;${1}00&quot;</text>
    
    <text x="195" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#303a36">writes $1 followed by 00 on purpose</text>
  </g>
</svg>