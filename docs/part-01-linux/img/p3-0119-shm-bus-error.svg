<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>PyTorch bus error in a container: the 64 MiB /dev/shm</title>
  <desc>Visual explanation of container shared memory limits, PyTorch bus errors, and IPC namespace facts.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1360" fill="#f5f8f5" />

  
  <text x="40" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">PyTorch bus error in a container: the 64 MiB /dev/shm</text>

  

  
  <g transform="translate(40, 110)">
    <rect width="335" height="320" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="56" cy="56" r="24" fill="#207448" />
    <text x="56" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <path d="M 270 42 L 302 42 L 302 74 L 270 74 Z M 276 42 L 276 74 M 282 42 L 282 74 M 288 42 L 288 74 M 294 42 L 294 74" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="28" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">Container starts in its own</tspan>
      <tspan x="28" dy="38">IPC namespace; /dev/shm</tspan>
      <tspan x="28" dy="38">is a tmpfs, 64 MiB by</tspan>
      <tspan x="28" dy="38">default in Docker</tspan>
    </text>
  </g>

  
  <line x1="375" y1="270" x2="443" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(445, 110)">
    <rect width="335" height="320" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="56" cy="56" r="24" fill="#207448" />
    <text x="56" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <rect x="265" y="44" width="46" height="28" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 272 44 L 272 38 M 280 44 L 280 38 M 288 44 L 288 38 M 296 44 L 296 38 M 304 44 L 304 38 M 272 72 L 272 78 M 280 72 L 280 78 M 288 72 L 288 78 M 296 72 L 296 78 M 304 72 L 304 78" stroke="#207448" stroke-width="2.5" />
    <text x="28" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">PyTorch DataLoader</tspan>
      <tspan x="28" dy="38">workers pass batches</tspan>
      <tspan x="28" dy="38">through shared memory</tspan>
      <tspan x="28" dy="38">in /dev/shm</tspan>
    </text>
  </g>

  
  <line x1="780" y1="270" x2="848" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(850, 110)">
    <rect width="335" height="320" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <circle cx="56" cy="56" r="24" fill="#db8129" />
    <text x="56" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <path d="M 288 40 L 312 76 L 264 76 Z" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="288" y1="52" x2="288" y2="64" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="288" cy="70" r="1.5" fill="#db8129" />
    <text x="28" y="145" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      <tspan x="28" dy="0">Batches exceed</tspan>
      <tspan x="28" dy="44">64 MiB</tspan>
    </text>
  </g>

  
  <line x1="1185" y1="270" x2="1253" y2="270" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(1255, 110)">
    <rect width="305" height="320" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="56" cy="56" r="24" fill="#207448" />
    <text x="56" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <circle cx="270" cy="56" r="16" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="258" y1="44" x2="282" y2="68" stroke="#207448" stroke-width="2.5" />
    <line x1="282" y1="44" x2="258" y2="68" stroke="#207448" stroke-width="2.5" />
    <text x="24" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">Bus error (SIGBUS)</tspan>
      <tspan x="24" dy="38">or DataLoader hangs;</tspan>
      <tspan x="24" dy="38">the logs say nothing</tspan>
      <tspan x="24" dy="38">about memory</tspan>
    </text>
  </g>

  

  
  
  <g transform="translate(40, 470)">
    <rect width="890" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 32 75 L 46 89 L 76 55" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="100" y="85" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">--shm-size to raise the limit</text>
  </g>

  
  <g transform="translate(40, 645)">
    <rect width="890" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 32 75 L 46 89 L 76 55" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="100" y="85" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">--ipc=host to use the host's IPC namespace</text>
  </g>

  
  <g transform="translate(40, 820)">
    <rect width="890" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 32 90 L 46 104 L 76 70" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="100" y="80" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" dy="0">a memory-backed emptyDir (medium: Memory),</tspan>
      <tspan x="100" dy="40">which is tmpfs and counts toward the pod's memory</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1025)">
    <rect width="890" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="30" y="32" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 38 45 L 46 50 L 38 55 M 48 57 L 62 57" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="96" y="65" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">ipcmk -M 1024 then ipcs -m on the host;</tspan>
      <tspan x="96" dy="44">sudo unshare --ipc ipcs -m shows nothing</tspan>
    </text>
  </g>

  
  <g transform="translate(960, 470)">
    <rect width="600" height="720" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="0" y="0" width="600" height="72" rx="14" fill="#207448" />
    <rect x="0" y="50" width="600" height="22" fill="#207448" />
    <text x="30" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">IPC namespace facts</text>

    
    <g transform="translate(24, 96)">
      <rect width="552" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">System V shared memory, semaphores,</tspan>
        <tspan x="24" dy="36">message queues and POSIX message</tspan>
        <tspan x="24" dy="36">queues are namespaced</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 247)">
      <rect width="552" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">containers in different IPC namespaces</tspan>
        <tspan x="24" dy="36">cannot share SysV segments</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 383)">
      <rect width="552" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">within a pod all containers share the IPC</tspan>
        <tspan x="24" dy="36">namespace by default; hostIPC: true</tspan>
        <tspan x="24" dy="36">joins the host's</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 544)">
      <rect width="552" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">MPI ranks in separate pods on the same</tspan>
        <tspan x="24" dy="36">node fall back to network paths</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 1220)">
    <rect width="1520" height="90" rx="12" fill="#207448" />
    <text x="760" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">When a PyTorch job crashes on shared memory, check the size of /dev/shm before you change the code</text>
  </g>
</svg>