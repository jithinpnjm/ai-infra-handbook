<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>The standard HPC path</title>
  <desc>Horizontal chain illustrating the standard HPC connection path from laptop through bastion and Slurm login node to compute node.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 3 L 14 8 L 0 13 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="105" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The standard HPC path</text>

  
  <rect x="60" y="220" width="200" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(160, 290)">
    <rect x="-26" y="-36" width="52" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="0" cy="-30" r="1.5" fill="#207448"/>
    <path d="M -36 8 L 36 8 C 36 12 33 16 28 16 L -28 16 C -33 16 -36 12 -36 8 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#e8f1ea" stroke-width="4"/>
  </g>
  <text x="160" y="420" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">laptop</text>

  
  <line x1="260" y1="390" x2="330" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="330" y="220" width="200" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(430, 290)">
    <path d="M 0 -36 L 24 -28 C 24 -4 14 12 0 20 C -14 12 -24 -4 -24 -28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="-8" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M -2 -4 L 2 -4 L 3 6 L -3 6 Z" fill="#207448"/>
  </g>
  <text x="430" y="420" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">bastion</text>

  
  <line x1="530" y1="390" x2="600" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="600" y="220" width="250" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(725, 290)">
    <rect x="-27" y="-34" width="54" height="42" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="-27" y1="-22" x2="27" y2="-22" stroke="#207448" stroke-width="2.5"/>
    <circle cx="-19" cy="-28" r="1.5" fill="#207448"/>
    <circle cx="-13" cy="-28" r="1.5" fill="#207448"/>
    <path d="M -16 -12 L -9 -6 L -16 0" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="725" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="725" dy="0">Slurm login</tspan>
    <tspan x="725" dy="38">node</tspan>
  </text>

  
  <line x1="850" y1="390" x2="1340" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="880" y="305" width="430" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="1095" y="340" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">srun --pty bash or salloc</text>

  
  <rect x="865" y="435" width="460" height="240" rx="16" fill="#fef6ee" stroke="#db8129" stroke-width="3"/>
  <text x="1095" y="490" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1095" dy="0">do not ssh into</tspan>
    <tspan x="1095" dy="38">compute nodes uninvited;</tspan>
    <tspan x="1095" dy="38">processes started outside</tspan>
    <tspan x="1095" dy="38">Slurm are not tracked by it.</tspan>
  </text>

  
  <rect x="1340" y="220" width="200" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(1440, 290)">
    <rect x="-20" y="-20" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    
    <line x1="-12" y1="-28" x2="-12" y2="-20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-28" x2="0" y2="-20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="-28" x2="12" y2="-20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="-12" y1="20" x2="-12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="-28" y1="-12" x2="-20" y2="-12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="-20" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="12" x2="-20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="20" y1="-12" x2="28" y2="-12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1440" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1440" dy="0">compute</tspan>
    <tspan x="1440" dy="38">node</tspan>
  </text>
</svg>