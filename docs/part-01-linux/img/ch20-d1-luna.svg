<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Architecture of what we build</title>
  <desc>Host and container architecture with their network, storage, and process connections.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L17 9 L1 17 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L17 9 L1 17 Z" fill="#db8129"/>
    </marker>
    <style>
      .panel { fill:#e8f1ea; stroke:#207448; stroke-width:3; }
      .node { fill:#f5f8f5; stroke:#207448; stroke-width:3; }
      .icon { fill:none; stroke:#207448; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .heading { font-family:sans-serif; font-size:32px; font-weight:700; fill:#303a36; }
      .label { font-family:monospace; font-size:24px; fill:#303a36; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="96" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Architecture of what we build</text>

  <rect class="panel" x="40" y="150" width="740" height="1010" rx="24"/>
  <rect class="panel" x="820" y="150" width="740" height="1010" rx="24"/>
  <text class="heading" x="410" y="208" text-anchor="middle">Host</text>
  <text class="heading" x="1190" y="190" text-anchor="middle">
    <tspan x="1190" dy="0">Container (unshare: pid</tspan>
    <tspan x="1190" dy="38">mnt uts ipc net)</tspan>
  </text>

  <rect class="node" x="80" y="270" width="560" height="190" rx="18"/>
  <rect class="node" x="960" y="270" width="560" height="190" rx="18"/>
  <rect class="node" x="80" y="510" width="560" height="200" rx="18"/>
  <rect class="node" x="960" y="510" width="560" height="200" rx="18"/>
  <rect class="node" x="80" y="790" width="300" height="170" rx="18"/>
  <rect class="node" x="420" y="790" width="300" height="170" rx="18"/>
  <rect class="node" x="420" y="1000" width="300" height="140" rx="18"/>
  <rect class="node" x="960" y="990" width="560" height="150" rx="18"/>

  <!-- Connections -->
  <path d="M380 875 H420" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M570 960 V1000" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M720 1070 H960" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M640 610 H960" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M640 365 H960" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-green)"/>
  <rect x="645" y="341" width="132" height="48" rx="8" fill="#f5f8f5"/>
  <text x="711" y="374" text-anchor="middle" class="label">contains</text>

  <!-- cgroup icon -->
  <g class="icon" transform="translate(104 337)">
    <path d="M8 12h40v34H8z"/>
    <path d="M16 20h24M16 29h24M16 38h16"/>
    <path d="M2 20h6M2 38h6M48 20h6M48 38h6"/>
  </g>
  <text class="label" x="176" y="321">
    <tspan x="176" dy="0">cgroup</tspan>
    <tspan x="176" dy="32">/sys/fs/cgroup/lab-ctr</tspan>
    <tspan x="176" dy="32">cpu.max, memory.max,</tspan>
    <tspan x="176" dy="32">pids.max</tspan>
  </text>

  <!-- PID 1 window icon -->
  <g class="icon" transform="translate(984 337)">
    <rect x="2" y="4" width="52" height="44" rx="4"/>
    <path d="M2 16h52M11 10h1M19 10h1M27 10h1"/>
    <path d="M15 29h12M15 37h24"/>
  </g>
  <text class="label" x="1060" y="374">PID 1 /bin/sh</text>

  <!-- Overlay storage icon -->
  <g class="icon" transform="translate(104 582)">
    <ellipse cx="28" cy="10" rx="25" ry="8"/>
    <path d="M3 10v34c0 5 11 9 25 9s25-4 25-9V10"/>
    <path d="M3 27c0 5 11 9 25 9s25-4 25-9M12 45h1M43 45h1"/>
  </g>
  <text class="label" x="176" y="558">
    <tspan x="176" dy="0">overlay: lowerdir=base,</tspan>
    <tspan x="176" dy="32">upperdir=upper,</tspan>
    <tspan x="176" dy="32">workdir=work →</tspan>
    <tspan x="176" dy="32">merged</tspan>
  </text>

  <!-- Root filesystem folder icon -->
  <g class="icon" transform="translate(984 582)">
    <path d="M4 15h19l7 7h24v27H4z"/>
    <path d="M4 22h50"/>
    <path d="M22 31v12M16 37h12"/>
  </g>
  <text class="label" x="1060" y="618">/ = merged (pivot_root)</text>

  <!-- NAT gear icon -->
  <g class="icon" transform="translate(202 801)">
    <circle cx="28" cy="28" r="12"/>
    <circle cx="28" cy="28" r="4"/>
    <path d="M25 3h6l2 8 6 3 7-4 4 5-5 6 1 7 7 4-2 6-8-1-5 5 1 8-6 2-4-7-7-1-5 6-6-3 2-8-4-5-8 1-2-6 7-4 1-7-5-6 4-5 7 4 6-3z"/>
  </g>
  <text class="label" x="230" y="882" text-anchor="middle">
    <tspan x="230" dy="0">iptables</tspan>
    <tspan x="230" dy="30">MASQUERADE +</tspan>
    <tspan x="230" dy="30">ip_forward</tspan>
  </text>

  <!-- Bridge network icon -->
  <g class="icon" transform="translate(542 801)">
    <rect x="2" y="18" width="18" height="18" rx="3"/>
    <rect x="36" y="18" width="18" height="18" rx="3"/>
    <path d="M20 27h16M11 18V8h34v10M28 8V3"/>
    <circle cx="28" cy="3" r="2"/>
  </g>
  <text class="label" x="570" y="882" text-anchor="middle">
    <tspan x="570" dy="0">bridge</tspan>
    <tspan x="570" dy="30">br-lab</tspan>
    <tspan x="570" dy="30">10.77.0.1/24</tspan>
  </text>

  <!-- veth network icon -->
  <g class="icon" transform="translate(542 1042)">
    <rect x="2" y="13" width="18" height="18" rx="3"/>
    <rect x="36" y="13" width="18" height="18" rx="3"/>
    <path d="M20 22h16M11 13V4h34v9M28 31v9"/>
  </g>
  <text class="label" x="570" y="1107" text-anchor="middle">vethh0</text>

  <!-- Container network icon -->
  <g class="icon" transform="translate(984 1037)">
    <rect x="2" y="6" width="18" height="18" rx="3"/>
    <rect x="36" y="6" width="18" height="18" rx="3"/>
    <path d="M20 15h16M11 24v13h34V24M28 37v8"/>
  </g>
  <text class="label" x="1060" y="1080">eth0 10.77.0.2</text>
</svg>