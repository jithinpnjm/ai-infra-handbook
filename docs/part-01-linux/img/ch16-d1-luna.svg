<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>Central logging for clusters</title>
  <desc>Applications, kernel, and container logs flow through journald and an agent to a queue, store, and query dashboards.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refWidth="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L15 9 L1 17 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L15 9 L1 17 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#f5f8f5"/>
  <text x="60" y="88" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Central logging for clusters</text>

  <rect x="40" y="135" width="1520" height="615" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="75" y="185" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Each GPU / login / management node</text>

  
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 315 H510 V355 H555" marker-end="url(#arrow-green)"/>
    <path d="M480 545 H510 V455 H555" marker-end="url(#arrow-green)"/>
    <path d="M945 405 H1040" marker-end="url(#arrow-green)"/>
    <path d="M945 627 H1000 V590 H1040" marker-end="url(#arrow-green)"/>
    <path d="M520 955 H575" marker-end="url(#arrow-green)"/>
    <path d="M1025 955 H1080" marker-end="url(#arrow-green)"/>
  </g>
  <path d="M1280 710 V824 H295 V850" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <text x="640" y="800" fill="#303a36" font-family="monospace" font-size="24">TCP+TLS / HTTP / Kafka</text>

  
  <rect x="80" y="220" width="400" height="190" rx="18" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="99" y="278" width="56" height="44" rx="4"/>
    <path d="M99 290 H155 M108 284 H109 M118 284 H119 M108 301 H146 M108 311 H137"/>
  </g>
  <text x="175" y="270" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="175" dy="0">Applications,</tspan>
    <tspan x="175" dy="36">services</tspan>
  </text>
  <text x="175" y="342" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="175" dy="0">(stdout, syslog,</tspan>
    <tspan x="175" dy="30">files)</tspan>
  </text>

  
  <rect x="80" y="455" width="400" height="180" rx="18" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="99" y="511" width="56" height="56" rx="8"/>
    <rect x="111" y="523" width="32" height="32" rx="3"/>
    <path d="M108 503 V511 M120 503 V511 M132 503 V511 M144 503 V511 M108 567 V575 M120 567 V575 M132 567 V575 M144 567 V575 M91 520 H99 M91 532 H99 M91 544 H99 M91 556 H99 M155 520 H163 M155 532 H163 M155 544 H163 M155 556 H163"/>
  </g>
  <text x="175" y="520" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">kernel</text>
  <text x="175" y="558" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="175" dy="0">(dmesg, Xid,</tspan>
    <tspan x="175" dy="30">MCE)</tspan>
  </text>

  
  <rect x="555" y="320" width="390" height="170" rx="18" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="601" cy="405" r="24"/>
    <circle cx="601" cy="405" r="8"/>
    <path d="M601 373 V381 M601 429 V437 M569 405 H577 M625 405 H633 M578 382 L584 388 M618 422 L624 428 M624 382 L618 388 M584 422 L578 428"/>
  </g>
  <text x="650" y="391" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="650" dy="0">journald /</tspan>
    <tspan x="650" dy="38">rsyslog</tspan>
  </text>

  
  <rect x="555" y="545" width="390" height="165" rx="18" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M575 584 H609 L627 602 V661 H575 Z"/>
    <path d="M609 584 V602 H627 M585 616 H616 M585 628 H616 M585 640 H609"/>
  </g>
  <text x="645" y="598" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Container logs</text>
  <text x="645" y="634" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="645" dy="0">(/var/log/pods,</tspan>
    <tspan x="645" dy="30">containerd)</tspan>
  </text>

  
  <rect x="1040" y="320" width="470" height="390" rx="18" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1080" cy="374" r="22"/>
    <circle cx="1080" cy="374" r="7"/>
    <path d="M1080 344 V352 M1080 396 V404 M1050 374 H1058 M1102 374 H1110 M1059 353 L1065 359 M1095 389 L1101 395 M1101 353 L1095 359 M1065 389 L1059 395"/>
  </g>
  <text x="1125" y="365" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Agent:</text>
  <text x="1125" y="399" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1125" dy="0">rsyslog omfwd / Fluent</tspan>
    <tspan x="1125" dy="30">Bit / Vector / Promtail</tspan>
    <tspan x="1125" dy="30">/ OTel collector</tspan>
    <tspan x="1125" dy="30">(buffer to disk, retry,</tspan>
    <tspan x="1125" dy="30">add labels: node, rack,</tspan>
    <tspan x="1125" dy="30">cluster)</tspan>
  </text>

  
  <rect x="70" y="850" width="450" height="210" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M91 909 C91 900 109 894 127 894 C145 894 163 900 163 909 V950 C163 959 145 965 127 965 C109 965 91 959 91 950 Z"/>
    <path d="M91 909 C91 918 109 924 127 924 C145 924 163 918 163 909 M91 930 C91 939 109 945 127 945 C145 945 163 939 163 930"/>
  </g>
  <text x="180" y="915" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Optional</text>
  <text x="180" y="952" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="180" dy="0">queue/broker</tspan>
    <tspan x="180" dy="30">(Kafka, Redis)</tspan>
  </text>

  
  <rect x="575" y="850" width="450" height="210" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M596 907 C596 898 614 892 632 892 C650 892 668 898 668 907 V951 C668 960 650 966 632 966 C614 966 596 960 596 951 Z"/>
    <path d="M596 907 C596 916 614 922 632 922 C650 922 668 916 668 907 M596 929 C596 938 614 944 632 944 C650 944 668 938 668 929"/>
  </g>
  <text x="685" y="903" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Store:</text>
  <text x="685" y="937" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="685" dy="0">Loki / Elasticsearch /</tspan>
    <tspan x="685" dy="30">OpenSearch /</tspan>
    <tspan x="685" dy="30">ClickHouse / S3 archive</tspan>
  </text>

  
  <rect x="1080" y="850" width="450" height="210" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1100" y="900" width="58" height="48" rx="4"/>
    <path d="M1100 913 H1158 M1109 940 V930 H1119 V940 M1125 940 V923 H1135 V940 M1141 940 V918 H1151 V940"/>
  </g>
  <text x="1175" y="903" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="1175" dy="0">Query +</tspan>
    <tspan x="1175" dy="36">dashboards</tspan>
  </text>
  <text x="1175" y="975" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1175" dy="0">(Grafana, Kibana),</tspan>
    <tspan x="1175" dy="30">alert rules</tspan>
  </text>
</svg>