<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading the load average</title>
  <desc>Visual infographic explaining Linux load average, including runnable tasks, D-state uninterruptible sleep tasks waiting for I/O, comparison with nproc, and diagnosing high load under idle CPUs or sluggish systems.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading the load average</text>

  
  <g id="left-panel">
    <rect x="50" y="120" width="540" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(85, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="52" height="48" rx="6" />
      <line x1="12" y1="16" x2="44" y2="16" />
      <line x1="12" y1="28" x2="44" y2="28" />
      <line x1="12" y1="40" x2="32" y2="40" />
    </g>
    <text x="160" y="185" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">run queue</text>

    
    <g id="box-tasks-waiting">
      <rect x="80" y="220" width="480" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(292, 245)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="40" height="40" rx="6" />
        <line x1="18" y1="0" x2="18" y2="8" />
        <line x1="28" y1="0" x2="28" y2="8" />
        <line x1="38" y1="0" x2="38" y2="8" />
        <line x1="18" y1="48" x2="18" y2="56" />
        <line x1="28" y1="48" x2="28" y2="56" />
        <line x1="38" y1="48" x2="38" y2="56" />
        <line x1="0" y1="18" x2="8" y2="18" />
        <line x1="0" y1="28" x2="8" y2="28" />
        <line x1="0" y1="38" x2="8" y2="38" />
        <line x1="48" y1="18" x2="56" y2="18" />
        <line x1="48" y1="28" x2="56" y2="28" />
        <line x1="48" y1="38" x2="56" y2="38" />
        <rect x="18" y="18" width="20" height="20" rx="3" fill="#e8f1ea" />
      </g>

      <text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="320" dy="0">tasks waiting</tspan>
        <tspan x="320" dy="40">for cores</tspan>
      </text>

      
      <g transform="translate(140, 440)">
        <rect x="0" y="0" width="70" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <rect x="95" y="0" width="70" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <rect x="190" y="0" width="70" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <rect x="285" y="0" width="75" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <circle cx="35" cy="25" r="8" fill="#207448" />
        <circle cx="130" cy="25" r="8" fill="#207448" />
        <circle cx="225" cy="25" r="8" fill="#207448" />
        <circle cx="322" cy="25" r="8" fill="#207448" />
      </g>
    </g>

    
    <g id="box-d-state">
      <rect x="80" y="550" width="480" height="450" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(292, 580)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="28" cy="14" rx="22" ry="8" />
        <path d="M 6 14 V 42 C 6 48 16 52 28 52 C 40 52 50 48 50 42 V 14" />
        <path d="M 6 28 C 6 34 16 38 28 38 C 40 38 50 34 50 28" />
      </g>

      <text x="320" y="680" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="320" dy="0">D-state</tspan>
        <tspan x="320" dy="40">(waiting for I/O)</tspan>
      </text>

      
      <g id="badge-also-counts">
        <rect x="150" y="780" width="340" height="74" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <g transform="translate(172, 797)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="20" r="16" />
          <line x1="20" y1="12" x2="20" y2="28" />
          <line x1="12" y1="20" x2="28" y2="20" />
        </g>
        <text x="330" y="828" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">also counts</text>
      </g>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="630" y="120" width="920" height="920" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(665, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="44" rx="6" />
      <path d="M 16 4 L 24 4 L 24 12 L 16 12 Z" />
      <path d="M 32 4 L 40 4 L 40 12 L 32 12 Z" />
      <polyline points="16,24 22,30 32,18" />
      <line x1="22" y1="38" x2="42" y2="38" />
    </g>
    <text x="740" y="185" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">decision list</text>

    
    <g id="card-nproc">
      <rect x="660" y="210" width="860" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(685, 226)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="28" y1="8" x2="28" y2="48" />
        <line x1="14" y1="48" x2="42" y2="48" />
        <line x1="8" y1="18" x2="48" y2="18" />
        <path d="M 8 18 L 2 32 L 14 32 Z" />
        <path d="M 48 18 L 42 32 L 54 32 Z" />
      </g>

      <text x="755" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
        <tspan>compare with </tspan>
        <tspan font-family="monospace">nproc</tspan>
      </text>

      
      <g id="sub-row-below">
        <rect x="685" y="280" width="810" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        <text x="715" y="316" font-family="sans-serif" font-size="24" fill="#303a36">
          <tspan x="715" dy="0">load below the thread count</tspan>
          <tspan x="715" dy="32">means not all cores are busy</tspan>
        </text>
      </g>

      
      <g id="sub-row-above">
        <rect x="685" y="380" width="810" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        <text x="715" y="426" font-family="sans-serif" font-size="24" fill="#303a36">
          <tspan>load stays above means tasks are queuing</tspan>
        </text>
      </g>
    </g>

    
    <g id="card-idle-cpus">
      <rect x="660" y="495" width="860" height="255" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />

      
      <g transform="translate(685, 520)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="28" cy="14" rx="20" ry="7" />
        <path d="M 8 14 V 42 C 8 47 17 51 28 51 C 39 51 48 47 48 42 V 14" />
        <path d="M 8 28 C 8 33 17 37 28 37 C 39 37 48 33 48 28" />
        <circle cx="44" cy="44" r="14" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
        <line x1="44" y1="36" x2="44" y2="44" stroke="#db8129" stroke-width="3" />
        <circle cx="44" cy="50" r="1.5" fill="#db8129" stroke="none" />
      </g>

      <text x="765" y="545" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
        <tspan>high load with idle CPUs</tspan>
      </text>

      <text x="765" y="595" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="765" dy="0">means tasks stuck waiting for I/O,</tspan>
        <tspan x="765" dy="36">check <tspan font-family="monospace" font-weight="bold" fill="#db8129">vmstat</tspan> <tspan font-family="monospace" font-weight="bold" fill="#db8129">b</tspan> column, <tspan font-family="monospace" font-weight="bold" fill="#db8129">wa</tspan>, and <tspan font-family="monospace" font-weight="bold" fill="#db8129">iostat</tspan></tspan>
      </text>
    </g>

    
    <g id="card-sluggish-system">
      <rect x="660" y="770" width="860" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(685, 795)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="48" height="36" rx="4" />
        <line x1="12" y1="18" x2="20" y2="18" />
        <line x1="28" y1="18" x2="36" y2="18" />
        <line x1="12" y1="28" x2="20" y2="28" />
        <line x1="28" y1="28" x2="36" y2="28" />
        <line x1="10" y1="46" x2="10" y2="52" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="26" y1="46" x2="26" y2="52" />
        <line x1="34" y1="46" x2="34" y2="52" />
        <line x1="42" y1="46" x2="42" y2="52" />
      </g>

      <text x="765" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
        <tspan>high load with sluggish system</tspan>
      </text>

      <text x="765" y="870" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="765" dy="0">points to memory pressure and</tspan>
        <tspan x="765" dy="36">swapping or I/O</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1075" width="1500" height="85" rx="12" fill="#207448" />
    <text x="800" y="1128" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">if you see a high load with idle CPUs, look at I/O first.</text>
  </g>
</svg>