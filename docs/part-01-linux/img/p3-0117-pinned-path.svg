    <tspan x="950" dy="35">through <tspan font-family="monospace">cudaMemcpyAsync</tspan>, <tspan font-family="monospace">pin_memory=True</tspan></tspan>
    <tspan x="950" dy="35">and <tspan font-family="monospace">non_blocking=True</tspan></tspan>
