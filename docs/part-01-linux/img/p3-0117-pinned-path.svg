<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Pageable versus pinned host memory: why memlock decides whether registration works</title>
  <desc>Visual comparison of pageable versus pinned memory transfer paths to GPU, RLIMIT_MEMLOCK gate outcomes, configuration locations, and consequences.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1420" fill="#f5f8f5" />

  
  <g text-anchor="middle">
    <text x="800" y="52" font-family="sans-serif" font-size="40px" font-weight="bold" fill="#207448">Pageable versus pinned host memory:</text>
    <text x="800" y="92" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">why memlock decides whether registration works</text>
  </g>

  
  <rect x="50" y="120" width="1500" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="70" y="138" width="320" height="42" rx="8" fill="#e8f1ea" />
  <text x="230" y="167" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448" text-anchor="middle">Pageable host memory</text>

  
  <rect x="80" y="195" width="220" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="190" y="249" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">host buffer</text>

  
  <path d="M 300 240 L 368 240" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="380" y="185" width="560" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="660" y="225" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">staging copy into a pinned buffer</text>

  
  <rect x="420" y="258" width="480" height="46" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="660" y="290" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">extra copy; no overlap with compute</text>

  
  <path d="M 940 215 L 1228 215" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="1240" y="170" width="270" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1375" y="224" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448" text-anchor="middle">DMA to the GPU</text>

  
  <rect x="50" y="350" width="1500" height="230" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  
  
  <rect x="70" y="368" width="440" height="46" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="1.5" />
  <text x="290" y="400" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129" text-anchor="middle">Pinned (page-locked) memory</text>

  
  <rect x="80" y="430" width="220" height="90" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="2" />
  <text x="190" y="484" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">host buffer</text>

  
  <path d="M 300 460 L 1228 460" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="320" y="485" width="900" height="80" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="1.5" />
  <text x="770" y="518" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">typically 2x to 3x faster; allows asynchronous overlap through</text>
  <text x="770" y="550" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129" text-anchor="middle">cudaMemcpyAsync, pin_memory=True and non_blocking=True</text>

  
  <rect x="1240" y="415" width="270" height="90" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="2" />
  <text x="1375" y="469" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129" text-anchor="middle">DMA to the GPU</text>

  
  <rect x="50" y="605" width="1500" height="255" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="80" y="665" width="410" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="130" cy="725" r="28" fill="#207448" />
  
  <rect x="118" y="720" width="24" height="18" rx="3" fill="#ffffff" />
  <path d="M 123 720 L 123 713 A 7 7 0 0 1 137 713 L 137 720" fill="none" stroke="#ffffff" stroke-width="3" />
  <text x="175" y="734" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">RLIMIT_MEMLOCK (ulimit -l)</text>

  
  <path d="M 490 700 L 530 655 L 568 655" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="580" y="625" width="430" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="795" y="663" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448" text-anchor="middle">unlimited: pinning succeeds</text>

  
  <path d="M 490 750 L 530 770 L 568 770" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <rect x="580" y="705" width="670" height="135" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="2" />
  <text x="605" y="742" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">low limit: ibv_reg_mr errors,</text>
  <text x="605" y="776" font-family="sans-serif" font-size="24px" fill="#303a36">CUDA out of memory while pinning host memory,</text>
  <text x="605" y="810" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">NCCL ibv_reg_mr failures</text>

  
  <rect x="1270" y="735" width="250" height="75" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="1395" y="780" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129" text-anchor="middle">the GPU has room</text>

  
  <rect x="50" y="880" width="1500" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="75" y="902" width="460" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="305" y="934" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">/etc/security/limits.d/*.conf</text>
  <text x="305" y="964" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">for logins</text>

  
  <rect x="560" y="902" width="455" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="787" y="934" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">LimitMEMLOCK=infinity</text>
  <text x="787" y="964" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">for systemd units</text>

  
  <rect x="1040" y="902" width="485" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1282" y="934" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">--ulimit memlock=-1:-1</text>
  <text x="1282" y="964" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">for Docker</text>

  
  <rect x="180" y="998" width="530" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="445" y="1044" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448" text-anchor="middle">Slurm PropagateResourceLimits</text>

  
  <rect x="750" y="998" width="670" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1085" y="1044" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448" text-anchor="middle">runtime configuration for Kubernetes</text>

  
  <rect x="50" y="1115" width="1500" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="75" y="1135" width="460" height="135" rx="8" fill="#e8f1ea" />
  <text x="305" y="1173" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">Pinned pages are unevictable</text>
  <text x="305" y="1210" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">(counted in Mlocked and</text>
  <text x="305" y="1244" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">Unevictable and in cgroup accounting)</text>

  
  <rect x="560" y="1135" width="455" height="135" rx="8" fill="#e8f1ea" />
  <text x="787" y="1173" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">Pinning is slow:</text>
  <text x="787" y="1210" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">allocate once up front,</text>
  <text x="787" y="1244" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">not per batch</text>

  
  <rect x="1040" y="1135" width="485" height="135" rx="8" fill="#e8f1ea" />
  <text x="1282" y="1173" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">Huge pages for pinned buffers</text>
  <text x="1282" y="1210" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">reduce mappings and</text>
  <text x="1282" y="1244" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">registration cost</text>

  
  <rect x="50" y="1310" width="1500" height="75" rx="10" fill="#207448" />
  <text x="800" y="1356" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff" text-anchor="middle">GPUDirect RDMA, GPUDirect Storage and InfiniBand verbs need registered, pinned memory too</text>
</svg>