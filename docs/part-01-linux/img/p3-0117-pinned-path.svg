<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pageable versus pinned host memory: why memlock decides whether registration works</title>
  <desc>Visual comparison of pageable and pinned host memory transfers to GPU, RLIMIT_MEMLOCK limit outcomes, configuration locations, and operational consequences.</desc>

