<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>NVMe per-CPU queues and namespaces</title>
  <desc>Why NVMe scales to millions of IOPS: per-CPU submission/completion queue pairs in host memory over PCIe, contrasted with SATA's single 32-deep queue, and controller-to-namespace naming.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">NVMe queues per CPU and namespaces</text>

  
  <rect x="40" y="120" width="840" height="710" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="72" y="168" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">Per-CPU queue pairs eliminate lock contention</text>

  
  <rect x="72" y="195" width="776" height="145" rx="16" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
  <text x="100" y="242" fill="#db8129" font-family="sans-serif" font-size="26" font-weight="700">Legacy SATA / SAS (shared queue)</text>
  <text x="100" y="282" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="100" dy="0">CPUs contend on one shared queue (SATA: 32 deep, SAS: 256)</tspan>
    <tspan x="100" dy="32">through SCSI/SATA translation layers.</tspan>
  </text>

  
  <rect x="72" y="365" width="776" height="430" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3.5"/>
  <text x="100" y="410" fill="#207448" font-family="sans-serif" font-size="27" font-weight="700">NVMe (blk-mq): up to 64K queues × 64K entries</text>

  <rect x="100" y="438" width="215" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="208" y="480" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">CPU 0</text>
  <text x="208" y="514" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">SQ + CQ pair 0</text>

  <rect x="352" y="438" width="215" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="460" y="480" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">CPU 1</text>
  <text x="460" y="514" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">SQ + CQ pair 1</text>

  <rect x="604" y="438" width="215" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="712" y="480" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">CPU N</text>
  <text x="712" y="514" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">SQ + CQ pair N</text>

  <path d="M208 534 V586" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M460 534 V586" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M712 534 V586" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="96" y="590" width="728" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="460" y="630" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">
    <tspan x="460" dy="0">Direct PCIe link</tspan>
    <tspan x="460" dy="30" font-size="24" font-weight="400">(Gen3 x4 ~3.5, Gen4 x4 ~7, Gen5 x4 ~14 GB/s)</tspan>
  </text>
  <text x="460" y="704" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="460" dy="0">• Issuing CPU receives its own MSI-X interrupt (no lock).</tspan>
    <tspan x="460" dy="34">• +1 Admin queue pair; scheduler = none; optional io_poll.</tspan>
  </text>

  
  <rect x="920" y="120" width="640" height="710" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="952" y="168" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">Device naming: controller → namespace</text>

  <rect x="955" y="210" width="570" height="145" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="985" y="254" width="44" height="44" rx="5"/><rect x="997" y="266" width="20" height="20"/>
  </g>
  <text x="1050" y="256" fill="#303a36" font-family="monospace" font-size="28" font-weight="700">/dev/nvme0</text>
  <text x="1050" y="294" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1050" dy="0">Character device: one</tspan>
    <tspan x="1050" dy="30">controller per drive / fabric</tspan>
  </text>

  <path d="M1240 355 V385" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M1095 385 H1395" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M1095 385 V426" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M1395 385 V426" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="955" y="430" width="280" height="150" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1095" y="476" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">/dev/nvme0n1</text>
  <text x="1095" y="514" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1095" dy="0">Namespace 1 (block)</tspan>
    <tspan x="1095" dy="30">512 B or 4 KiB LBA</tspan>
  </text>

  <rect x="1255" y="430" width="270" height="150" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1390" y="476" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">/dev/nvme0n2</text>
  <text x="1390" y="514" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1390" dy="0">Optional slice</tspan>
    <tspan x="1390" dy="30">(ns management)</tspan>
  </text>

  <path d="M1095 580 V636" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="955" y="640" width="320" height="115" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1115" y="688" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">/dev/nvme0n1p1</text>
  <text x="1115" y="726" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">Partition 1 (note the 'p')</text>

  
  <rect x="40" y="862" width="1520" height="82" rx="14" fill="#207448"/>
  <text x="800" y="913" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="26" font-weight="700">Watch APST power latency and PCIe link width (lspci -vv); alert on smart-log critical_warning and percentage_used.</text>
</svg>
