  <line x1="284" y1="425" x2="296" y2="425" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="60" y="470" width="460" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="290" y="534" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="290" dy="0">my_command 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3</tspan>
    <tspan x="290" dy="42">| grep -i warning</tspan>
  </text>

  
  <rect x="580" y="145" width="980" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="620" y="187" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Start</text>
  
  <circle cx="1515" cy="180" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1515" y1="180" x2="1515" y2="168" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="1515" y1="180" x2="1527" y2="180" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <rect x="620" y="213" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
