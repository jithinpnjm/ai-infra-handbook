  <text x="1065" y="551" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">terminal</text>

  <rect x="1240" y="441" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1375" y="471" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">fd 3</text>
  <line x1="1375" y1="485" x2="1375" y2="513" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="1240" y="521" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1375" y="551" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">pipe</text>

  
  <rect x="580" y="601" width="980" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="636" cy="633" r="20" fill="#207448" />
  <text x="636" y="641" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="670" y="643" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1&gt;&amp;2  stdout goes where stderr goes</text>
  
  <circle cx="1515" cy="633" r="14" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 1515 613 L 1515 619 M 1515 647 L 1515 653 M 1495 633 L 1501 633 M 1529 633 L 1535 633 M 1501 619 L 1505 623 M 1525 643 L 1529 647 M 1501 647 L 1505 643 M 1525 623 L 1529 619" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
