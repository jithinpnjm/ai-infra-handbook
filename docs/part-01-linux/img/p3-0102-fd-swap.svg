  <text x="1375" y="323" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">closed</text>

  
  <rect x="580" y="373" width="980" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="636" cy="180" r="20" />
  <circle cx="636" cy="405" r="20" fill="#207448" />
