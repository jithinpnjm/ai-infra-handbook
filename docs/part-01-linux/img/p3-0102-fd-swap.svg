<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Piping only stderr: the 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 swap, one step at a time</title>
  <desc>Visual explanation of redirecting only standard error to a pipe using file descriptor duplication steps in shell.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#718079" />
    </marker>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Piping only stderr: the 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 swap, one step at a time
  </text>

  
  <g transform="translate(60, 80)">
    <rect width="1480" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="740" y="42" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
      my_command 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 | grep -i warning
    </text>
  </g>

  
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="300" height="34" rx="6" fill="#dde8e0" />
    <text x="150" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fd 1 (stdout)</text>

    <rect x="340" y="0" width="300" height="34" rx="6" fill="#dde8e0" />
    <text x="490" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fd 2 (stderr)</text>

    <rect x="680" y="0" width="300" height="34" rx="6" fill="#dde8e0" />
    <text x="830" y="24" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fd 3</text>
  </g>

  
  <g transform="translate(60, 206)">
    
    <rect width="1480" height="210" rx="14" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    
    
    <rect x="24" y="24" width="460" height="162" rx="10" fill="#e8f1ea" />
    <text x="44" y="75" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Start</text>
    <text x="44" y="118" font-family="monospace" font-size="24" fill="#207448">| grep -i warning</text>
    <text x="44" y="154" font-family="sans-serif" font-size="24" fill="#718079">Default pipeline setup</text>

    
    <g transform="translate(500, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 1 (stdout)</text>
      
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pipe</text>
    </g>

    
    <g transform="translate(840, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 2 (stderr)</text>
      
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">terminal</text>
    </g>

    
    <g transform="translate(1180, 24)">
      <rect width="270" height="50" rx="8" fill="#e8f1ea" stroke="#718079" stroke-width="1.5" />
      <text x="135" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#718079">fd 3</text>
      
      <line x1="135" y1="52" x2="135" y2="108" stroke="#718079" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow-gray)" />
      
      <rect x="20" y="112" width="230" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="135" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-style="italic" fill="#718079">closed</text>
    </g>
  </g>

  
  <g transform="translate(60, 436)">
    
    <rect width="1480" height="210" rx="14" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    
    
    <rect x="24" y="24" width="460" height="162" rx="10" fill="#e8f1ea" />
    <circle cx="64" cy="64" r="24" fill="#207448" />
    <text x="64" y="73" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="104" y="72" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">3&gt;&amp;1</text>
    <text x="44" y="124" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">saves stdout</text>
    <text x="44" y="156" font-family="sans-serif" font-size="24" fill="#718079">fd 3 now points to pipe</text>

    
    <g transform="translate(500, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 1 (stdout)</text>
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pipe</text>
    </g>

    
    <g transform="translate(840, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 2 (stderr)</text>
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">terminal</text>
    </g>

    
    <g transform="translate(1180, 24)">
      <rect width="270" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="135" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 3</text>
      <line x1="135" y1="52" x2="135" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="230" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="135" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pipe</text>
    </g>
  </g>

  
  <g transform="translate(60, 666)">
    
    <rect width="1480" height="210" rx="14" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    
    
    <rect x="24" y="24" width="460" height="162" rx="10" fill="#e8f1ea" />
    <circle cx="64" cy="64" r="24" fill="#207448" />
    <text x="64" y="73" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="104" y="72" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">1&gt;&amp;2</text>
    <text x="44" y="120" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">stdout goes where</text>
    <text x="44" y="152" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">stderr goes</text>

    
    <g transform="translate(500, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 1 (stdout)</text>
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">terminal</text>
    </g>

    
    <g transform="translate(840, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 2 (stderr)</text>
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">terminal</text>
    </g>

    
    <g transform="translate(1180, 24)">
      <rect width="270" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="135" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 3</text>
      <line x1="135" y1="52" x2="135" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="230" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="135" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pipe</text>
    </g>
  </g>

  
  <g transform="translate(60, 896)">
    
    <rect width="1480" height="210" rx="14" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    
    
    <rect x="24" y="24" width="460" height="162" rx="10" fill="#e8f1ea" />
    <circle cx="64" cy="64" r="24" fill="#207448" />
    <text x="64" y="73" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="104" y="72" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">2&gt;&amp;3</text>
    <text x="44" y="120" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">stderr goes to</text>
    <text x="44" y="152" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">saved fd 3</text>

    
    <g transform="translate(500, 24)">
      <rect width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 1 (stdout)</text>
      <line x1="150" y1="52" x2="150" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#f5f8f5" stroke="#718079" stroke-width="2" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">terminal</text>
    </g>

    
    <g transform="translate(840, 24)">
      <rect width="300" height="50" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2" />
      <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">fd 2 (stderr)</text>
      
      <line x1="150" y1="52" x2="150" y2="108" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
      
      <rect x="20" y="112" width="260" height="50" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
      <text x="150" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">pipe</text>
    </g>

    
    <g transform="translate(1180, 24)">
      <rect width="270" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="135" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fd 3</text>
      <line x1="135" y1="52" x2="135" y2="108" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <rect x="20" y="112" width="230" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <text x="135" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pipe</text>
    </g>
  </g>

  
  <g transform="translate(60, 1140)">
    <rect width="1480" height="76" rx="12" fill="#207448" />
    <text x="740" y="47" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      A pipe carries only fd 1, so after the swap the errors flow down the pipe into grep
    </text>
  </g>
</svg>