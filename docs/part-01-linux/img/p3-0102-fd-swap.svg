<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>Piping only stderr: the 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 swap, one step at a time</title>
  <desc>my_command 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 | grep -i warning</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
