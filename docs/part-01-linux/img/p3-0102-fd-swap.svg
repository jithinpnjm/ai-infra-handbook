  <rect x="40" y="1080" width="1520" height="66" rx="8" fill="#207448" />
  <text x="800" y="1122" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A pipe carries only fd 1, so after the swap the errors flow down the pipe into grep</text>
</svg>