  <text x="1065" y="779" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">terminal</text>

  <rect x="1240" y="669" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1375" y="699" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">fd 3</text>
