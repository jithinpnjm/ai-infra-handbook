  <text x="800" y="112" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">the 3&gt;&amp;1 1&gt;&amp;2 2&gt;&amp;3 swap, one step at a time</text>

  
