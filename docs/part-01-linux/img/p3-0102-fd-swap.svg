  <text x="670" y="415" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3&gt;&amp;1  saves stdout</text>
  
  <ellipse cx="1515" cy="397" rx="20" ry="6" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 1495 397 L 1495 417 A 20 6 0 0 0 1535 417 L 1535 397" fill="none" stroke="#207448" stroke-width="4" />
  
