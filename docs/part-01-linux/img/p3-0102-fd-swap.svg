  <rect x="1240" y="749" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1375" y="779" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">pipe</text>

  
  <rect x="580" y="829" width="980" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="636" cy="861" r="20" fill="#207448" />
  <text x="636" y="869" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="670" y="871" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2&gt;&amp;3  stderr goes to saved fd 3</text>
  
