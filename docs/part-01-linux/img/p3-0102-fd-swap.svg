  <rect x="620" y="521" width="270" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="755" y="551" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">pipe</text>

