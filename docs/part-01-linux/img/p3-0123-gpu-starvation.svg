<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GPUs sit idle in the timeline: seven questions, each answered by a measurement</title>
  <desc>Infographic showing a GPU timeline with idle gaps, seven diagnostic questions answered by measurements, outcome metrics to read first, and a takeaway rule.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">GPUs sit idle in the timeline: seven questions,</text>
  <text x="50" y="112" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">each answered by a measurement</text>

  
  <g transform="translate(50, 134)">
    <rect width="1500" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="25" y="24" width="220" height="62" rx="6" fill="#207448"/>
    
    <path d="M 45 55 L 65 39 L 85 71 L 105 43 L 125 67 L 145 47 L 165 63 L 185 39 L 205 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    
    <rect x="1255" y="24" width="220" height="62" rx="6" fill="#207448"/>
    
    <path d="M 1275 55 L 1295 39 L 1315 71 L 1335 43 L 1355 67 L 1375 47 L 1395 63 L 1415 39 L 1435 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="260" y="24" width="980" height="62" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
    
    
    <line x1="275" y1="36" x2="275" y2="74" stroke="#207448" stroke-width="3"/>
    <line x1="275" y1="55" x2="310" y2="55" stroke="#207448" stroke-width="3"/>
    <line x1="1225" y1="36" x2="1225" y2="74" stroke="#207448" stroke-width="3"/>
    <line x1="1190" y1="55" x2="1225" y2="55" stroke="#207448" stroke-width="3"/>

    
    <text x="750" y="64" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">idle gap (bubble): time between kernels or collectives</text>
  </g>

  
  
  <g transform="translate(50, 260)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <ellipse cx="28" cy="14" rx="22" ry="8"/>
      <path d="M 6 14 v 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -28"/>
      <path d="M 6 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8"/>
    </g>

    
    <text x="175" y="38" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is the data loader the bottleneck?</text>
    <text x="175" y="68" font-family="sans-serif" font-size="24" fill="#303a36">Empty queue, busy workers, a busy iostat,</text>
    <text x="175" y="96" font-family="sans-serif" font-size="24" fill="#303a36">a slow network filesystem</text>
  </g>

  
  <g transform="translate(50, 382)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="3"/>
      <rect x="20" y="20" width="16" height="16"/>
      <line x1="20" y1="4" x2="20" y2="12"/><line x1="28" y1="4" x2="28" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/><line x1="28" y1="44" x2="28" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/><line x1="4" y1="28" x2="12" y2="28"/><line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/><line x1="44" y1="28" x2="52" y2="28"/><line x1="44" y1="36" x2="52" y2="36"/>
    </g>

    
    <text x="175" y="38" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is the CPU the limiter?</text>
    <text x="175" y="68" font-family="sans-serif" font-size="24" fill="#303a36">Single-thread Python launch overhead,</text>
    <text x="175" y="96" font-family="sans-serif" font-size="24" fill="#303a36">torch ops launching tiny kernels</text>

    
    <rect x="660" y="16" width="295" height="74" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="807" y="60" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">fix: CUDA graphs or compile</text>
  </g>

  
  <g transform="translate(50, 504)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="6" y="12" width="44" height="26" rx="2"/>
      <rect x="12" y="18" width="8" height="14"/>
      <rect x="24" y="18" width="8" height="14"/>
      <rect x="36" y="18" width="8" height="14"/>
      <line x1="12" y1="38" x2="12" y2="46"/><line x1="18" y1="38" x2="18" y2="46"/>
      <line x1="28" y1="38" x2="28" y2="46"/><line x1="34" y1="38" x2="34" y2="46"/>
      <line x1="40" y1="38" x2="40" y2="46"/>
    </g>

    
    <text x="175" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is host memory pinned,</text>
    <text x="175" y="80" font-family="sans-serif" font-size="24" fill="#303a36">is the PCIe link at x16, is the NUMA placement right?</text>
  </g>

  
  <g transform="translate(50, 626)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="14" cy="38" r="8"/>
      <circle cx="42" cy="38" r="8"/>
      <circle cx="28" cy="14" r="8"/>
      <line x1="22" y1="20" x2="18" y2="31"/>
      <line x1="34" y1="20" x2="38" y2="31"/>
      <line x1="22" y1="38" x2="34" y2="38"/>
    </g>

    
    <text x="175" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is communication exposed,</text>
    <text x="175" y="80" font-family="sans-serif" font-size="24" fill="#303a36">meaning not overlapped with compute?</text>
  </g>

  
  <g transform="translate(50, 748)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <circle cx="48" cy="53" r="24" fill="#db8129"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>

    
    <g transform="translate(94, 25)" stroke="#db8129" stroke-width="3.5" fill="none">
      <path d="M 10 42 A 22 22 0 1 1 46 42"/>
      <line x1="28" y1="28" x2="40" y2="16"/>
      <circle cx="28" cy="28" r="4" fill="#db8129"/>
    </g>

    
    <text x="175" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Is a straggler rank late:</text>
    <text x="175" y="80" font-family="sans-serif" font-size="24" fill="#303a36">thermal throttle, bad link, noisy neighbour?</text>
  </g>

  
  <g transform="translate(50, 870)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>

    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 10 8 H 38 L 46 16 V 46 H 10 Z"/>
      <rect x="18" y="8" width="18" height="14"/>
      <rect x="16" y="28" width="24" height="18"/>
    </g>

    
    <text x="175" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is the checkpoint blocking the step?</text>
  </g>

  
  <g transform="translate(50, 992)">
    <rect width="970" height="106" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    <circle cx="48" cy="53" r="24" fill="#207448"/>
    <text x="48" y="62" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>

    
    <g transform="translate(94, 25)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="6" y="8" width="44" height="34" rx="4"/>
      <path d="M 12 25 L 20 25 L 24 16 L 30 34 L 34 25 L 44 25"/>
      <line x1="18" y1="46" x2="38" y2="46"/>
    </g>

    
    <text x="175" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is GPU-Util high while SM activity is low?</text>
    <text x="175" y="80" font-family="sans-serif" font-size="24" fill="#303a36">Many small kernels</text>
  </g>

  
  <g transform="translate(1050, 260)">
    
    <rect width="500" height="838" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect width="500" height="60" rx="10" fill="#207448"/>
    <text x="250" y="41" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Outcome metrics to read first</text>

    
    <g transform="translate(20, 76)">
      <rect width="460" height="92" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">throughput (tokens/s or samples/s</text>
      <text x="16" y="70" font-family="sans-serif" font-size="24" fill="#303a36">per GPU and aggregate)</text>
    </g>

    
    <g transform="translate(20, 182)">
      <rect width="460" height="154" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">step time breakdown: data wait, H2D,</text>
      <text x="16" y="66" font-family="sans-serif" font-size="24" fill="#303a36">forward, backward, exposed</text>
      <text x="16" y="98" font-family="sans-serif" font-size="24" fill="#303a36">communication, optimizer,</text>
      <text x="16" y="130" font-family="sans-serif" font-size="24" fill="#303a36">checkpoint</text>
    </g>

    
    <g transform="translate(20, 350)">
      <rect width="460" height="64" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">MFU</text>
    </g>

    
    <g transform="translate(20, 428)">
      <rect width="460" height="96" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">scaling efficiency =</text>
      <text x="16" y="70" font-family="monospace" font-size="24" fill="#303a36">throughput(N) / (N x throughput(1))</text>
    </g>

    
    <g transform="translate(20, 538)">
      <rect width="460" height="174" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">goodput = GPU-hours of useful work /</text>
      <text x="16" y="66" font-family="sans-serif" font-size="24" fill="#303a36">GPU-hours paid, excluding restarts,</text>
      <text x="16" y="98" font-family="sans-serif" font-size="24" fill="#303a36">failures, checkpoint stalls, stragglers</text>
      <text x="16" y="130" font-family="sans-serif" font-size="24" fill="#303a36">and idle waiting</text>
    </g>

    
    <g transform="translate(20, 726)">
      <rect width="460" height="92" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
      <text x="16" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">cost: USD per million tokens</text>
      <text x="16" y="68" font-family="sans-serif" font-size="24" fill="#303a36">or per training run</text>
    </g>
  </g>

  
  <g transform="translate(50, 1122)">
    <rect width="1500" height="54" rx="8" fill="#207448"/>
    <text x="750" y="36" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Answer each question with a measurement rather than an opinion</text>
  </g>
</svg>