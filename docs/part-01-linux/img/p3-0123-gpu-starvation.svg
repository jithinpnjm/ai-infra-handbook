<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>GPUs sit idle in the timeline: seven questions, each answered by a measurement</title>
  <desc>Seven diagnostic questions to identify and measure idle bubbles on GPU timelines during model training.</desc>

  
  <rect x="0" y="0" width="1600" height="1500" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#303a36">GPUs sit idle in the timeline:</text>
  <text x="800" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">seven questions, each answered by a measurement</text>

  
  <rect x="40" y="135" width="1520" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="65" y="165" width="1470" height="66" rx="8" fill="#ffffff" stroke="#cbd5cb" stroke-width="2"/>
  
  
  <rect x="75" y="173" width="150" height="50" rx="6" fill="#207448"/>
  <rect x="235" y="173" width="130" height="50" rx="6" fill="#207448"/>
  
  
  <rect x="375" y="173" width="850" height="50" rx="6" fill="#fff4e8" stroke="#db8129" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="800" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">idle gap (bubble): time between kernels or collectives</text>
  
  
  <rect x="1235" y="173" width="140" height="50" rx="6" fill="#207448"/>
  <rect x="1385" y="173" width="140" height="50" rx="6" fill="#207448"/>

  

  
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 45)">
      <ellipse cx="20" cy="10" rx="18" ry="7"/>
      <path d="M2,10 v28 c0,4 8,7 18,7 c10,0 18,-3 18,-7 v-28"/>
      <path d="M2,24 c0,4 8,7 18,7 c10,0 18,-3 18,-7"/>
    </g>
    
    <text x="160" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Is the data loader the bottleneck?</text>
    <text x="160" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506058">Empty queue, busy workers, a busy iostat,</text>
    <text x="160" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506058">a slow network filesystem</text>
  </g>

  
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 45)">
      <rect x="8" y="8" width="32" height="32" rx="4"/>
      <path d="M2,16 h6 M2,24 h6 M2,32 h6 M40,16 h6 M40,24 h6 M40,32 h6 M16,2 v6 M24,2 v6 M32,2 v6 M16,40 v6 M24,40 v6 M32,40 v6" stroke-width="2.5"/>
    </g>
    
    <text x="160" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Is the CPU the limiter?</text>
    <text x="160" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506058">Single-thread Python launch</text>
    <text x="160" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506058">overhead, torch ops launching</text>
    <text x="160" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506058">tiny kernels</text>
    
    <rect x="540" y="36" width="440" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="760" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">fix: CUDA graphs or compile</text>
  </g>

  
  <g transform="translate(40, 600)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 47)">
      <rect x="4" y="6" width="40" height="24" rx="3"/>
      <path d="M10,30 v10 M16,30 v10 M22,30 v10 M28,30 v10 M34,30 v10 M38,30 v10" stroke-width="2.5"/>
      <circle cx="14" cy="18" r="3" fill="#207448"/>
      <circle cx="34" cy="18" r="3" fill="#207448"/>
    </g>
    
    <text x="160" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Is host memory pinned, is the PCIe</text>
    <text x="160" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">link at x16, is the NUMA placement right?</text>
  </g>

  
  <g transform="translate(40, 760)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 47)">
      <circle cx="10" cy="24" r="8"/>
      <circle cx="38" cy="24" r="8"/>
      <path d="M18,16 h12 l-4,-5 M30,32 h-12 l4,5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="160" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Is communication exposed,</text>
    <text x="160" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">meaning not overlapped with compute?</text>
  </g>

  
  <g transform="translate(40, 920)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="50" cy="71" r="24" fill="#db8129"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g stroke="#db8129" stroke-width="3" fill="none" transform="translate(97, 45)">
      <path d="M18,6 v24 a9,9 0 1,0 10,0 v-24 a5,5 0 0,0 -10,0 z"/>
      <circle cx="23" cy="36" r="4.5" fill="#db8129"/>
      <path d="M23,16 v14" stroke-linecap="round"/>
    </g>
    
    <text x="160" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">Is a straggler rank late:</text>
    <text x="160" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#8a4b08">thermal throttle, bad link, noisy neighbour?</text>
  </g>

  
  <g transform="translate(40, 1080)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 47)">
      <path d="M6,4 h28 l8,8 v28 h-36 z"/>
      <rect x="12" y="4" width="16" height="10" stroke-width="2"/>
      <rect x="12" y="24" width="22" height="16" stroke-width="2"/>
    </g>
    
    <text x="160" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is the checkpoint blocking the step?</text>
  </g>

  
  <g transform="translate(40, 1240)">
    <rect x="0" y="0" width="1000" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="50" cy="71" r="24" fill="#207448"/>
    <text x="50" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    
    <g stroke="#207448" stroke-width="3" fill="none" transform="translate(95, 47)">
      <rect x="6" y="6" width="14" height="36" rx="2" fill="#207448"/>
      <rect x="26" y="26" width="14" height="16" rx="2"/>
    </g>
    
    <text x="160" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Is GPU-Util high while SM activity is low?</text>
    <text x="160" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#506058">Many small kernels</text>
  </g>

  
  <g transform="translate(1070, 280)">
    
    <rect x="0" y="0" width="490" height="1102" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="0" y="0" width="490" height="60" rx="12" fill="#207448"/>
    <text x="245" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Outcome metrics to read first</text>

    
    <g transform="translate(20, 76)">
      <rect x="0" y="0" width="450" height="148" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">throughput (tokens/s or</text>
      <text x="24" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">samples/s per GPU</text>
      <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">and aggregate)</text>
    </g>

    
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="450" height="162" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">step time breakdown: data wait,</text>
      <text x="24" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">H2D, forward, backward,</text>
      <text x="24" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">exposed communication,</text>
      <text x="24" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">optimizer, checkpoint</text>
    </g>

    
    <g transform="translate(20, 418)">
      <rect x="0" y="0" width="450" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="225" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">MFU</text>
    </g>

    
    <g transform="translate(20, 544)">
      <rect x="0" y="0" width="450" height="142" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">scaling efficiency =</text>
      <text x="24" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">throughput(N) /</text>
      <text x="24" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(N x throughput(1))</text>
    </g>

    
    <g transform="translate(20, 702)">
      <rect x="0" y="0" width="450" height="236" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">goodput = GPU-hours of</text>
      <text x="24" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">useful work / GPU-hours paid,</text>
      <text x="24" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">excluding restarts, failures,</text>
      <text x="24" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">checkpoint stalls,</text>
      <text x="24" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">stragglers and</text>
      <text x="24" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">idle waiting</text>
    </g>

    
    <g transform="translate(20, 954)">
      <rect x="0" y="0" width="450" height="128" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">cost: USD per million tokens</text>
      <text x="24" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">or per training run</text>
    </g>
  </g>

  
  <g transform="translate(40, 1406)">
    <rect x="0" y="0" width="1520" height="64" rx="12" fill="#207448"/>
    <text x="760" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Answer each question with a measurement rather than an opinion</text>
  </g>
</svg>