<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Why RSS stays high after free: the allocator keeps the memory</title>
  <desc>Infographic explaining glibc allocator behavior for small vs large allocations, RSS retention, pymalloc arenas, and troubleshooting tools.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#303a36" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1380" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Why RSS stays high after free: the allocator keeps the memory
  </text>

  
  
  <rect x="40" y="95" width="1020" height="1145" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

  
  <g transform="translate(65, 120)">
    <rect x="0" y="0" width="220" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="110" cy="50" r="24" fill="#207448" />
    <text x="110" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <rect x="82" y="95" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="82" y1="113" x2="138" y2="113" stroke="#207448" stroke-width="3" />
    <circle cx="94" cy="104" r="3" fill="#207448" />
    <circle cx="106" cy="104" r="3" fill="#207448" />
    <path d="M 98 132 L 122 132 M 110 122 L 122 132 L 110 142" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="110" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="110" dy="0">Program</tspan>
      <tspan x="110" dy="36">calls</tspan>
      <tspan x="110" dy="36" font-family="ui-monospace, monospace" font-size="28">malloc</tspan>
    </text>
  </g>

  
  <path d="M 285 240 L 350 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  
  <path d="M 285 450 L 350 450" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(360, 120)">
    <rect x="0" y="0" width="670" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="24" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="24" dy="0" font-weight="bold" fill="#207448">small request:</tspan>
      <tspan dy="0"> allocator takes pages from the kernel with</tspan>
      <tspan x="24" dy="36" font-family="ui-monospace, monospace" font-weight="bold">brk</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> (main heap) or </tspan>
      <tspan font-family="ui-monospace, monospace" font-weight="bold">mmap</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> (per-thread arenas)</tspan>
      <tspan x="24" dy="36">and hands out pieces</tspan>
    </text>

    
    <g transform="translate(24, 138)">
      <rect x="0" y="0" width="622" height="68" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <rect x="10" y="10" width="90" height="48" rx="5" fill="#cbe3d3" stroke="#207448" stroke-width="1.5" />
      <text x="55" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#207448" text-anchor="middle">piece 1</text>
      
      <rect x="110" y="10" width="110" height="48" rx="5" fill="#cbe3d3" stroke="#207448" stroke-width="1.5" />
      <text x="165" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#207448" text-anchor="middle">piece 2</text>
      
      <rect x="230" y="10" width="80" height="48" rx="5" fill="#cbe3d3" stroke="#207448" stroke-width="1.5" />
      <text x="270" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#207448" text-anchor="middle">piece 3</text>
      
      <rect x="320" y="10" width="292" height="48" rx="5" fill="#f8faf8" stroke="#90a89a" stroke-dasharray="6 4" stroke-width="1.5" />
      <text x="466" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#607068" text-anchor="middle">arena cached pool</text>
    </g>
  </g>

  
  <g transform="translate(360, 380)">
    <rect x="0" y="0" width="670" height="200" rx="12" fill="#f0f6f2" stroke="#207448" stroke-width="2" />
    <text x="24" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0" font-weight="bold" fill="#207448">large request above</tspan>
      <tspan dy="0" font-family="ui-monospace, monospace" font-weight="bold"> M_MMAP_THRESHOLD</tspan>
      <tspan x="24" dy="36">(default 128 KiB, dynamic): its own mmap</tspan>
    </text>

    
    <g transform="translate(24, 106)">
      <rect x="0" y="0" width="622" height="68" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <rect x="10" y="10" width="602" height="48" rx="6" fill="#e2ede5" stroke="#207448" stroke-width="2" />
      <text x="311" y="42" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">direct dedicated mmap() allocation</text>
    </g>
  </g>

  
  
  <path d="M 530 585 L 530 635" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(65, 645)">
    <rect x="0" y="0" width="965" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="55" cy="45" r="24" fill="#207448" />
    <text x="55" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <path d="M 100 35 L 132 35 M 106 35 L 106 58 C 106 61 108 63 111 63 L 121 63 C 124 63 126 61 126 58 L 126 35 M 112 28 L 120 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="155" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">
      Program calls free
    </text>
  </g>

  
  <path d="M 330 735 L 330 775" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <path d="M 760 735 L 760 775" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(65, 785)">
    <rect x="0" y="0" width="465" height="260" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    <rect x="18" y="16" width="220" height="34" rx="6" fill="#db8129" />
    <text x="28" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Upper branch result</text>

    
    <circle cx="420" cy="33" r="16" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="420" y1="24" x2="420" y2="36" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="420" cy="42" r="2" fill="#db8129" />

    <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0" font-weight="bold" fill="#db8129">memory returns to the allocator,</tspan>
      <tspan x="24" dy="36" font-weight="bold" fill="#db8129">not to the operating system:</tspan>
      <tspan x="24" dy="38" font-weight="bold">RSS stays high;</tspan>
      <tspan x="24" dy="36">normal heap growth, not a leak</tspan>
    </text>
  </g>

  
  <g transform="translate(565, 785)">
    <rect x="0" y="0" width="465" height="260" rx="12" fill="#eef6f1" stroke="#207448" stroke-width="2.5" />
    <rect x="18" y="16" width="220" height="34" rx="6" fill="#207448" />
    <text x="28" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Lower branch result</text>

    
    <path d="M 405 24 L 435 24 M 435 24 L 435 44 M 435 44 L 415 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 410 40 L 398 52 M 398 40 L 410 52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
      <tspan x="24" dy="0">returned to the OS</tspan>
      <tspan x="24" dy="38">right away on free</tspan>
    </text>
    <text x="24" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">Kernel unmaps pages immediately via</tspan>
      <tspan x="24" dy="34" font-family="ui-monospace, monospace">munmap()</tspan>
      <tspan> reducing RSS promptly.</tspan>
    </text>
  </g>

  
  <g transform="translate(65, 1065)">
    <rect x="0" y="0" width="965" height="155" rx="12" fill="#f8fbf9" stroke="#207448" stroke-width="2" stroke-dasharray="8 4" />
    
    
    <circle cx="45" cy="40" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 45 18 L 45 24 M 45 56 L 45 62 M 23 40 L 29 40 M 61 40 L 67 40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="80" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Release option under upper branch:
    </text>
    <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">glibc </tspan>
      <tspan font-family="ui-monospace, monospace" font-weight="bold">malloc_trim()</tspan>
      <tspan> and </tspan>
      <tspan font-family="ui-monospace, monospace" font-weight="bold">M_TRIM_THRESHOLD</tspan>
      <tspan> release memory at</tspan>
      <tspan x="24" dy="36">the top of the heap, and since glibc 2.8 free ranges too</tspan>
    </text>
  </g>

  
  <g transform="translate(1090, 95)">
    <rect x="0" y="0" width="470" height="1145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <rect x="0" y="0" width="470" height="75" rx="16" fill="#207448" />
    
    <rect x="0" y="55" width="470" height="20" fill="#207448" />

    
    <rect x="25" y="20" width="46" height="36" rx="5" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M 33 32 L 41 38 L 33 44 M 45 44 L 57 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="85" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">
      Tools to check
    </text>

    
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="430" height="185" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <circle cx="30" cy="35" r="14" fill="#207448" />
      <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
      
      <text x="56" y="40" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
        MALLOC_ARENA_MAX=2..4
      </text>
      <text x="24" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">(threads can create</tspan>
        <tspan x="24" dy="34">up to 8x CPU-count arenas)</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="430" height="260" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <circle cx="30" cy="35" r="14" fill="#207448" />
      <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

      <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
        Alternative Allocator
      </text>
      
      
      <rect x="16" y="65" width="398" height="110" rx="6" fill="#f4f6f4" stroke="#c8dcd0" stroke-width="1" />
      <text x="26" y="98" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
        <tspan x="26" dy="0">LD_PRELOAD=</tspan>
        <tspan x="26" dy="32">/usr/lib/x86_64-linux-</tspan>
        <tspan x="26" dy="32">gnu/libjemalloc.so.2</tspan>
      </text>
      <text x="24" y="215" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
        python train.py
      </text>
    </g>

    
    <g transform="translate(20, 595)">
      <rect x="0" y="0" width="430" height="185" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <circle cx="30" cy="35" r="14" fill="#207448" />
      <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

      <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
        Verify Loaded Maps
      </text>
      <text x="24" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">check </tspan>
        <tspan font-family="ui-monospace, monospace" font-weight="bold">/proc/PID/maps</tspan>
        <tspan x="24" dy="36">to confirm it loaded</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 805)">
      <rect x="0" y="0" width="430" height="315" rx="10" fill="#f0f6f2" stroke="#207448" stroke-width="2" />
      
      
      <circle cx="35" cy="36" r="16" fill="#207448" />
      <text x="35" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Py</text>

      <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
        Python note
      </text>

      <text x="22" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="22" dy="0" font-weight="bold">pymalloc allocates 256 KiB</tspan>
        <tspan x="22" dy="36" font-weight="bold">arenas: </tspan>
        <tspan>one surviving small</tspan>
        <tspan x="22" dy="36">object keeps the whole</tspan>
        <tspan x="22" dy="36">arena resident</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 1265)">
    <rect x="0" y="0" width="1520" height="75" rx="12" fill="#207448" />
    
    
    <circle cx="45" cy="38" r="18" fill="#ffffff" />
    <path d="M 45 28 L 45 42 M 41 45 L 49 45 M 45 23 L 45 25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="80" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      When RSS climbs, decide whether the growth is a leak or a cache before you touch the allocator
    </text>
  </g>
</svg>