<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Why RSS stays high after free: the allocator keeps the memory</title>
  <desc>Visual infographic explaining why RSS memory remains high after calling free due to allocator retention and arenas.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Why RSS stays high after free: the allocator keeps the memory</text>

  
  
  <path d="M 530 155 L 570 155" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 290 200 L 290 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 200 200 L 200 220 L 30 220 L 30 840 L 50 840" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 290 470 L 290 510" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />

  
  <path d="M 530 355 L 570 355" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 810 200 L 810 240" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 810 560 L 810 740" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 530 845 L 570 845" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  <g id="box-1">
    <rect x="50" y="110" width="480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="95" cy="155" r="24" fill="#207448" />
    <text x="95" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <rect x="135" y="132" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="135" y1="146" x2="181" y2="146" stroke="#207448" stroke-width="4" />
    <circle cx="147" cy="139" r="2.5" fill="#207448" />
    <circle cx="158" cy="139" r="2.5" fill="#207448" />
    
    <text x="195" y="164" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Program calls malloc</text>
  </g>

  
  <g id="upper-branch">
    <rect x="50" y="240" width="480" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(74, 258)">
      <rect x="0" y="0" width="48" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="32" x2="48" y2="32" stroke="#207448" stroke-width="4" />
      <line x1="24" y1="16" x2="24" y2="48" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="74" y="338" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="74" dy="0">small request: allocator takes</tspan>
      <tspan x="74" dy="34">pages from the kernel with brk</tspan>
      <tspan x="74" dy="34">(main heap) or mmap (per-thread</tspan>
      <tspan x="74" dy="34">arenas) and hands out pieces</tspan>
    </text>
  </g>

  
  <g id="release-option">
    <rect x="50" y="510" width="480" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    
    <g transform="translate(74, 528)">
      <circle cx="16" cy="14" r="10" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="16" cy="34" r="10" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="24" y1="19" x2="46" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="24" y1="29" x2="46" y2="10" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="74" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="74" dy="0">glibc <tspan font-family="monospace">malloc_trim()</tspan> and</tspan>
      <tspan x="74" dy="34"><tspan font-family="monospace">M_TRIM_THRESHOLD</tspan> release memory</tspan>
      <tspan x="74" dy="34">at the top of the heap, and since</tspan>
      <tspan x="74" dy="34">glibc 2.8 free ranges too</tspan>
    </text>
  </g>

  
  <g id="lower-branch">
    <rect x="50" y="750" width="480" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(74, 768)">
      <rect x="0" y="4" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 24 L 24 12 L 36 24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="14" x2="24" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="74" y="848" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="74" dy="0">large request above</tspan>
      <tspan x="74" dy="34" font-family="monospace">M_MMAP_THRESHOLD</tspan>
      <tspan x="74" dy="34">(default 128 KiB, dynamic):</tspan>
      <tspan x="74" dy="34">its own mmap</tspan>
    </text>
  </g>

  
  
  <g id="box-2">
    <rect x="570" y="110" width="480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="615" cy="155" r="24" fill="#207448" />
    <text x="615" y="164" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(655, 133)">
      <path d="M 23 4 L 38 14 L 30 14 C 28 26 18 36 6 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 23 42 L 8 32 L 16 32 C 18 20 28 10 40 8" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="715" y="164" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Program calls free</text>
  </g>

  
  <g id="upper-branch-result">
    <rect x="570" y="240" width="480" height="310" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(594, 258)">
      <path d="M 6 42 A 20 20 0 1 1 42 42" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <line x1="24" y1="24" x2="36" y2="14" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="24" cy="24" r="4" fill="#db8129" />
    </g>
    
    <text x="594" y="340" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="594" dy="0">memory returns to the allocator,</tspan>
      <tspan x="594" dy="36">not to the operating system:</tspan>
      <tspan x="594" dy="38" font-size="26" font-weight="bold" fill="#db8129">RSS stays high;</tspan>
      <tspan x="594" dy="38">normal heap growth,</tspan>
      <tspan x="594" dy="36">not a leak</tspan>
    </text>
  </g>

  
  <g id="lower-branch-result">
    <rect x="570" y="750" width="480" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(594, 768)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 24 L 21 31 L 34 17" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="594" y="855" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="594" dy="0">returned to the OS</tspan>
      <tspan x="594" dy="40">right away on free</tspan>
    </text>
  </g>

  
  <g id="tools-panel">
    
    <rect x="1090" y="110" width="460" height="840" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(1115, 132)">
      <rect x="0" y="2" width="46" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 16 L 20 23 L 12 30" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="30" x2="36" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="1175" y="165" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Tools to check</text>

    
    <line x1="1110" y1="195" x2="1530" y2="195" stroke="#207448" stroke-width="2" stroke-opacity="0.4" />

    
    <rect x="1110" y="215" width="420" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1125" y="260" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">MALLOC_ARENA_MAX=2..4</tspan>
      <tspan x="1125" dy="38">(threads can create up to</tspan>
      <tspan x="1125" dy="34">8x CPU-count arenas)</tspan>
    </text>

    
    <rect x="1110" y="410" width="420" height="240" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1125" y="445" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0" font-weight="bold" fill="#207448">LD_PRELOAD=</tspan>
      <tspan x="1125" dy="30">/usr/lib/x86_64-linux-gnu/</tspan>
      <tspan x="1125" dy="30">libjemalloc.so.2</tspan>
      <tspan x="1125" dy="30">python train.py</tspan>
    </text>
    <text x="1125" y="585" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0">check <tspan font-family="monospace">/proc/PID/maps</tspan> to</tspan>
      <tspan x="1125" dy="34">confirm it loaded</tspan>
    </text>

    
    <rect x="1110" y="670" width="420" height="260" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(1125, 686)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="16" cy="14" r="3" fill="#207448" />
      <circle cx="28" cy="30" r="3" fill="#207448" />
      <path d="M 28 8 L 28 18 L 12 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <path d="M 16 36 L 16 26 L 32 26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1125" y="770" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0">pymalloc allocates 256 KiB</tspan>
      <tspan x="1125" dy="36">arenas: one surviving small</tspan>
      <tspan x="1125" dy="36">object keeps the whole</tspan>
      <tspan x="1125" dy="36">arena resident</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="990" width="1500" height="70" rx="10" fill="#207448" />
    <text x="800" y="1035" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">When RSS climbs, decide whether the growth is a leak or a cache before you touch the allocator</text>
  </g>
</svg>