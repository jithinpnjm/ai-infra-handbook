<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Symptom to first check</title>
  <desc>Infographic mapping AI infrastructure symptoms to likely causes and first diagnostic checks.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Symptom to first check</text>

  
  <g>
    
    <rect x="40" y="115" width="410" height="55" rx="6" fill="#207448"/>
    <text x="60" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Symptom</text>

    
    <rect x="470" y="115" width="520" height="55" rx="6" fill="#207448"/>
    <text x="495" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Likely cause</text>

    
    <rect x="1010" y="115" width="550" height="55" rx="6" fill="#207448"/>
    <text x="1035" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">First check</text>
  </g>

  
  <g>
    
    <rect x="40" y="186" width="410" height="145" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(58, 230)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 42 A 24 24 0 1 1 50 42"/>
      <line x1="28" y1="28" x2="16" y2="20"/>
      <circle cx="28" cy="28" r="4" fill="#db8129"/>
      <line x1="10" y1="36" x2="14" y2="34"/>
      <line x1="46" y1="36" x2="42" y2="34"/>
      <line x1="28" y1="8" x2="28" y2="13"/>
    </g>
    <text x="132" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">One rank slower</tspan>
      <tspan x="132" dy="38">than others</tspan>
    </text>

    
    <rect x="470" y="186" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">thermal or power throttling,</tspan>
      <tspan x="495" dy="34">PCIe downtrain</tspan>
    </text>

    
    <rect x="1010" y="186" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">
      <tspan x="1035" dy="0">nvidia-smi -q -d</tspan>
      <tspan x="1035" dy="34">PERFORMANCE,CLOCK,POWER</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="347" width="410" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(58, 391)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 16 Q 16 4 28 16 T 52 16"/>
      <path d="M 4 40 Q 16 48 28 36 T 52 40"/>
      <line x1="28" y1="20" x2="28" y2="32"/>
      <polyline points="24,24 28,20 32,24"/>
      <polyline points="24,28 28,32 32,28"/>
    </g>
    <text x="132" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">Run-to-run</tspan>
      <tspan x="132" dy="38">variance</tspan>
    </text>

    
    <rect x="470" y="347" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">THP, NUMA balancing,</tspan>
      <tspan x="495" dy="32">C-states, IRQs on</tspan>
      <tspan x="495" dy="32">training cores</tspan>
    </text>

    
    <rect x="1010" y="347" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">perf sched, mpstat</text>
  </g>

  
  <g>
    
    <rect x="40" y="508" width="410" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(58, 552)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="14" r="6"/>
      <circle cx="44" cy="14" r="6"/>
      <circle cx="12" cy="42" r="6"/>
      <circle cx="44" cy="42" r="6"/>
      <line x1="18" y1="14" x2="38" y2="14"/>
      <line x1="18" y1="42" x2="38" y2="42"/>
      <line x1="12" y1="20" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="44" y2="36"/>
      <line x1="16" y1="18" x2="40" y2="38"/>
    </g>
    <text x="132" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">Low NCCL</tspan>
      <tspan x="132" dy="38">bandwidth</tspan>
    </text>

    
    <rect x="470" y="508" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">wrong NIC/GPU affinity,</tspan>
      <tspan x="495" dy="34">fallback to TCP</tspan>
    </text>

    
    <rect x="1010" y="508" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">
      <tspan x="1035" dy="0">NCCL_DEBUG=INFO,</tspan>
      <tspan x="1035" dy="34">nvidia-smi topo -m</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="669" width="410" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(58, 713)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="7"/>
      <path d="M 8 14 v 28 c 0 4 9 7 20 7 s 20 -3 20 -7 v -28"/>
      <path d="M 8 28 c 0 4 9 7 20 7 s 20 -3 20 -7"/>
      <line x1="28" y1="21" x2="28" y2="28"/>
      <line x1="28" y1="35" x2="28" y2="42"/>
    </g>
    <text x="132" y="733" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">DataLoader</tspan>
      <tspan x="132" dy="38">stalls</tspan>
    </text>

    
    <rect x="470" y="669" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="733" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">remote NUMA, too few workers,</tspan>
      <tspan x="495" dy="34">slow FS</tspan>
    </text>

    
    <rect x="1010" y="669" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="750" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">iostat, pidstat</text>
  </g>

  
  <g>
    
    <rect x="40" y="830" width="410" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(58, 874)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="44" height="24" rx="3"/>
      <line x1="12" y1="40" x2="12" y2="46"/>
      <line x1="20" y1="40" x2="20" y2="46"/>
      <line x1="28" y1="40" x2="28" y2="46"/>
      <line x1="36" y1="40" x2="36" y2="46"/>
      <line x1="44" y1="40" x2="44" y2="46"/>
      <line x1="14" y1="24" x2="22" y2="24"/>
      <line x1="34" y1="24" x2="42" y2="24"/>
    </g>
    <text x="132" y="894" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">OOM kill in a</tspan>
      <tspan x="132" dy="38">long job</tspan>
    </text>

    
    <rect x="470" y="830" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="894" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">limit counted pinned</tspan>
      <tspan x="495" dy="34">or cache</tspan>
    </text>

    
    <rect x="1010" y="830" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="911" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">memory.events, dmesg</text>
  </g>

  
  <g>
    
    <rect x="40" y="991" width="410" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(58, 1035)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="16" rx="3"/>
      <circle cx="14" cy="16" r="2" fill="#207448"/>
      <circle cx="22" cy="16" r="2" fill="#207448"/>
      <rect x="6" y="32" width="44" height="16" rx="3"/>
      <circle cx="14" cy="40" r="2" fill="#207448"/>
      <circle cx="22" cy="40" r="2" fill="#207448"/>
      <path d="M 38 24 l 6 4 l -6 4"/>
    </g>
    <text x="132" y="1055" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="132" dy="0">Fleet differs</tspan>
      <tspan x="132" dy="38">after update</tspan>
    </text>

    
    <rect x="470" y="991" width="520" height="145" rx="8" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5"/>
    <text x="495" y="1055" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="495" dy="0">image, GRUB, sysctl or</tspan>
      <tspan x="495" dy="34">driver drift</tspan>
    </text>

    
    <rect x="1010" y="991" width="550" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1035" y="1055" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="600" fill="#207448">
      <tspan x="1035" dy="0">run audit,</tspan>
      <tspan x="1035" dy="34">diff against baseline</tspan>
    </text>
  </g>
</svg>