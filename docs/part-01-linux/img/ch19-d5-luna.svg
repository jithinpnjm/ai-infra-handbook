<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <title>OverlayFS: layers, copy-up, and whiteouts</title>
  <desc>How OverlayFS merges read-only lowerdir image layers with a read-write upperdir, and how copy-up and 0/0 whiteouts behave on write and delete.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">OverlayFS: layers, copy-up and whiteouts</text>

  <!-- Top: Merged view -->
  <rect x="40" y="120" width="960" height="165" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5"><path d="M72 168h18l6 8h24v26H72z"/></g>
  <text x="142" y="176" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">merged view (what the container sees as /)</text>
  <text x="142" y="216" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="142" dy="0">a.txt  → "changed" (from upper)</tspan>
    <tspan x="142" dy="32">b.txt  → hidden (deleted via whiteout in upper)</tspan>
  </text>

  <!-- Up arrows into merged -->
  <path d="M520 336 V289" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Upper layer (RW) -->
  <rect x="40" y="340" width="960" height="190" rx="18" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <text x="72" y="388" fill="#db8129" font-family="monospace" font-size="28" font-weight="700">upperdir= (read-write, starts empty) + workdir=</text>
  <rect x="72" y="414" width="430" height="90" rx="12" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
  <text x="287" y="452" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">a.txt ("changed")</text>
  <text x="287" y="486" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">Copied up before first write</text>

  <rect x="530" y="414" width="440" height="90" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="750" y="452" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">b.txt (char device 0/0)</text>
  <text x="750" y="486" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">Whiteout marker hides lower file</text>

  <!-- Lower layers (RO) -->
  <rect x="40" y="575" width="960" height="335" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="72" y="618" fill="#207448" font-family="monospace" font-size="25" font-weight="700">lowerdir=lower2:lower1 (read-only image layers)</text>

  <rect x="72" y="644" width="896" height="114" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="100" y="684" fill="#303a36" font-family="monospace" font-size="24" font-weight="700">lower2: a.txt ("from layer 2"), b.txt ("only-in-2")</text>
  <text x="100" y="724" fill="#303a36" font-family="sans-serif" font-size="24">Hides matching paths in lower1; bytes remain on disk after rm.</text>

  <rect x="72" y="776" width="896" height="106" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="100" y="820" fill="#303a36" font-family="monospace" font-size="25" font-weight="700">lower1 (base layer):     a.txt ("from layer 1")</text>
  <text x="100" y="856" fill="#303a36" font-family="sans-serif" font-size="24">Shared page cache across containers running the same image.</text>

  <!-- Copy-up arrow from lower2 to upper -->
  <path d="M287 646 V534" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#orange-arrow)"/>

  <!-- Right side panel: Operational consequences -->
  <rect x="1035" y="120" width="525" height="790" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="1068" y="172" fill="#207448" font-family="sans-serif" font-size="30" font-weight="700">Why this matters in production</text>

  <rect x="1068" y="206" width="460" height="206" rx="14" fill="#f5f8f5" stroke="#db8129" stroke-width="3.5"/>
  <text x="1094" y="248" fill="#db8129" font-family="sans-serif" font-size="26" font-weight="700">1. Copy-up doubles disk use</text>
  <text x="1094" y="286" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1094" dy="0">Appending to a multi-GB file baked</tspan>
    <tspan x="1094" dy="32">into an image copies the whole file</tspan>
    <tspan x="1094" dy="32">into upperdir, filling node storage</tspan>
    <tspan x="1094" dy="32">(evictions / NodeNotReady).</tspan>
  </text>

  <rect x="1068" y="434" width="460" height="190" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1094" y="476" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">2. Whiteouts do not shrink images</text>
  <text x="1094" y="514" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1094" dy="0">Deleting a file or secret in a later</tspan>
    <tspan x="1094" dy="32">Dockerfile RUN only hides it; the</tspan>
    <tspan x="1094" dy="32">earlier layer still holds the bytes.</tspan>
  </text>

  <rect x="1068" y="646" width="460" height="234" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="1094" y="686" fill="#303a36" font-family="sans-serif" font-size="25" font-weight="700">
    <tspan x="1094" dy="0">3. Put large / mutable data</tspan>
    <tspan x="1094" dy="30">in volumes</tspan>
  </text>
  <text x="1094" y="752" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1094" dy="0">Bind mounts, emptyDir, PVCs</tspan>
    <tspan x="1094" dy="30">bypass overlayfs and avoid slow</tspan>
    <tspan x="1094" dy="30">metadata ops (stat / readdir).</tspan>
    <tspan x="1094" dy="34" font-family="monospace">Needs d_type (XFS ftype=1).</tspan>
  </text>

  <!-- Takeaway bar -->
  <rect x="40" y="942" width="1520" height="80" rx="14" fill="#207448"/>
  <text x="800" y="992" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="26" font-weight="700">Never bake datasets or model weights into image layers; mount them as volumes so writes bypass OverlayFS.</text>
</svg>
