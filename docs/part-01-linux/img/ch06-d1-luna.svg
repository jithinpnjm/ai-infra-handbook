<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img">
  <title>Users and groups: names for numbers</title>
  <desc></desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#f5f8f5"/>
  <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Users and groups: names for numbers</text>

  <rect x="40" y="190" width="560" height="880" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="320" y="258" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#303a36">User space: names and policy</text>

  <rect x="60" y="295" width="520" height="225" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 330h38l18 18v38H82z"/>
    <path d="M120 330v19h18"/>
    <path d="M93 359h31M93 372h31"/>
  </g>
  <text x="155" y="365" font-family="monospace" font-size="30" font-weight="700" fill="#303a36">/etc/passwd</text>
  <text x="82" y="414" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="82">name : x : UID :</tspan>
    <tspan x="82" dy="31">GID : comment :</tspan>
    <tspan x="82" dy="31">home : shell</tspan>
  </text>

  <rect x="60" y="550" width="520" height="225" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 585h38l18 18v38H82z"/>
    <path d="M120 585v19h18"/>
    <path d="M93 614h31M93 627h31"/>
    <rect x="96" y="640" width="24" height="17" rx="4"/>
    <path d="M101 640v-6a7 7 0 0 1 14 0v6"/>
  </g>
  <text x="155" y="620" font-family="monospace" font-size="30" font-weight="700" fill="#303a36">/etc/shadow</text>
  <text x="82" y="690" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="82">name : password</tspan>
    <tspan x="82" dy="31">hash : aging fields</tspan>
  </text>

  <rect x="60" y="805" width="520" height="225" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="98" cy="844" r="13"/>
    <circle cx="127" cy="849" r="10"/>
    <path d="M75 878c2-16 11-24 23-24s22 8 24 24zM115 878c1-12 7-19 15-19s14 7 16 19z"/>
  </g>
  <text x="155" y="875" font-family="monospace" font-size="30" font-weight="700" fill="#303a36">/etc/group</text>
  <text x="82" y="924" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="82">group : x : GID :</tspan>
    <tspan x="82" dy="31">members</tspan>
  </text>

  <rect x="1100" y="190" width="460" height="880" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <text x="1330" y="258" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#303a36">Kernel: knows only numbers</text>

  <rect x="1120" y="320" width="420" height="300" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1145" y="350" width="56" height="48" rx="7"/>
    <path d="M1157 365h32v19h-32zM1162 373h12M1178 373h6"/>
    <path d="M1155 342v8M1167 342v8M1179 342v8M1191 342v8M1155 398v8M1167 398v8M1179 398v8M1191 398v8"/>
  </g>
  <text x="1220" y="385" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">process:</text>
  <text x="1150" y="455" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1150">UID 1042,</tspan>
    <tspan x="1150" dy="36">GID 1042,</tspan>
    <tspan x="1150" dy="36">supplementary GIDs</tspan>
  </text>

  <rect x="1120" y="680" width="420" height="320" rx="18" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1173" cy="730" rx="27" ry="10"/>
    <path d="M1146 730v37c0 6 12 11 27 11s27-5 27-11v-37M1146 748c0 6 12 11 27 11s27-5 27-11"/>
  </g>
  <text x="1220" y="780" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">file inode:</text>
  <text x="1150" y="850" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1150">owner UID 1042,</tspan>
    <tspan x="1150" dy="36">group GID 2001,</tspan>
    <tspan x="1150" dy="36">mode 0640</tspan>
  </text>

  <rect x="680" y="475" width="350" height="350" rx="22" fill="#f5f8f5" stroke="#db8129" stroke-width="5"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="855" cy="535" r="23"/>
    <circle cx="855" cy="535" r="8"/>
    <path d="M855 500v11M855 559v11M820 535h11M879 535h11M830 510l8 8M872 552l8 8M880 510l-8 8M838 552l-8 8"/>
  </g>
  <text x="855" y="608" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">C library:</text>
  <text x="855" y="650" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="855">getpwnam,</tspan>
    <tspan x="855" dy="31">getpwuid,</tspan>
    <tspan x="855" dy="31">getgrnam</tspan>
    <tspan x="855" dy="31">(through NSS,</tspan>
    <tspan x="855" dy="31">see section 9)</tspan>
  </text>

  <path d="M600 650H680" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1030 650H1100" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
</svg>