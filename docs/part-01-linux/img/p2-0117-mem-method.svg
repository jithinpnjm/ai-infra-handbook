<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Five steps for a memory problem, changing one thing at a time</title>
  <desc>Visual flowchart illustrating the five sequential steps for diagnosing and resolving a memory problem, isolating variables by changing one thing at a time.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Five steps for a memory problem, changing one thing at a time</text>

  

  
  <rect x="60" y="130" width="580" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <circle cx="115" cy="180" r="24" fill="#207448" />
  <text x="115" y="180" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>

  
  <g transform="translate(170, 152)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="14" y="14" width="28" height="28" rx="4" fill="#207448" />
    
    <line x1="14" y1="-8" x2="14" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="-8" x2="28" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="-8" x2="42" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="56" x2="14" y2="64" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="56" x2="28" y2="64" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="56" x2="42" y2="64" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="-8" y1="14" x2="0" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="-8" y1="28" x2="0" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="-8" y1="42" x2="0" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="56" y1="14" x2="64" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="56" y1="28" x2="64" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="56" y1="42" x2="64" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="250" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">USE check:</text>
  <text x="90" y="265" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="90" dy="0">utilisation, saturation, errors</tspan>
  </text>

  
  <path d="M 640 230 L 755 230" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="760" y="130" width="780" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="815" cy="180" r="24" fill="#207448" />
  <text x="815" y="180" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

  
  <g transform="translate(865, 152)">
    <rect x="0" y="0" width="56" height="54" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="8" r="3" fill="#207448" />
    <circle cx="20" cy="8" r="3" fill="#207448" />
    <circle cx="30" cy="8" r="3" fill="#207448" />
  </g>

  
  <text x="945" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Characterise:</text>
  <text x="795" y="252" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="795" dy="0">kernel or user memory, cache or anonymous,</tspan>
    <tspan x="795" dy="34">top RSS, cgroup limits</tspan>
  </text>

  
  <path d="M 1150 330 L 1150 390 L 140 390 L 140 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  

  
  
  <circle cx="140" cy="440" r="24" fill="#207448" />
  <text x="140" y="440" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>

  
  <polygon points="140,490 250,645 140,800 30,645" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="140" y="635" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="140" dy="0">Growth</tspan>
    <tspan x="140" dy="36">or leak?</tspan>
  </text>

  
  <path d="M 235 615 C 310 560, 370 535, 540 535" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <text x="270" y="475" font-family="sans-serif" font-size="24" fill="#207448">
    <tspan x="270" dy="0">Growth: normal use at a</tspan>
    <tspan x="270" dy="28">higher rate, or a cache</tspan>
    <tspan x="270" dy="28">warming up</tspan>
  </text>

  
  <rect x="550" y="465" width="440" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="575" y="528" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="575" dy="0">Check the configuration,</tspan>
    <tspan x="575" dy="36">cache sizes and allocator</tspan>
  </text>

  
  <path d="M 235 675 C 310 730, 370 755, 540 755" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <text x="270" y="795" font-family="sans-serif" font-size="24" fill="#db8129">
    <tspan x="270" dy="0">Leak: allocated and</tspan>
    <tspan x="270" dy="28">never freed, a bug</tspan>
  </text>

  
  <rect x="550" y="655" width="440" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="575" y="705" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="575" dy="0" font-weight="bold">Find the allocation path:</tspan>
    <tspan x="575" dy="34" font-family="monospace">memleak,</tspan>
    <tspan x="575" dy="32" font-family="monospace">jemalloc or tcmalloc</tspan>
    <tspan x="575" dy="32" font-family="monospace">profiling, tracemalloc,</tspan>
    <tspan x="575" dy="32" font-family="monospace">memray</tspan>
  </text>

  
  <path d="M 990 535 C 1015 535, 1015 620, 1045 620" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 990 755 C 1015 755, 1015 670, 1045 670" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1055" y="475" width="295" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="1105" cy="525" r="24" fill="#207448" />
  <text x="1105" y="525" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>

  
  <g transform="translate(1160, 497)">
    <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="28" r="6" fill="#207448" />
    
    <rect x="25" y="4" width="6" height="8" rx="2" fill="#207448" />
    <rect x="25" y="44" width="6" height="8" rx="2" fill="#207448" />
    <rect x="4" y="25" width="8" height="6" rx="2" fill="#207448" />
    <rect x="44" y="25" width="8" height="6" rx="2" fill="#207448" />
    <rect x="11" y="11" width="7" height="7" rx="2" fill="#207448" transform="rotate(45 14.5 14.5)" />
    <rect x="39" y="11" width="7" height="7" rx="2" fill="#207448" transform="rotate(45 42.5 14.5)" />
    <rect x="11" y="39" width="7" height="7" rx="2" fill="#207448" transform="rotate(45 14.5 42.5)" />
    <rect x="39" y="39" width="7" height="7" rx="2" fill="#207448" transform="rotate(45 42.5 42.5)" />
  </g>

  
  <text x="1080" y="595" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1080" dy="0">Check the</tspan>
    <tspan x="1080" dy="32">static setup:</tspan>
  </text>
  <text x="1080" y="675" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1080" dy="0">DIMMs,</tspan>
    <tspan x="1080" dy="30">NUMA mode,</tspan>
    <tspan x="1080" dy="30">huge pages,</tspan>
    <tspan x="1080" dy="30">overcommit,</tspan>
    <tspan x="1080" dy="30">limits, allocator</tspan>
  </text>

  
  <path d="M 1350 645 L 1385 645" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="1395" y="525" width="165" height="240" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

  
  <circle cx="1477" cy="575" r="24" fill="#207448" />
  <text x="1477" y="575" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>

  
  <text x="1477" y="645" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1477" dy="0">Tune</tspan>
    <tspan x="1477" dy="34">last,</tspan>
  </text>
  <text x="1477" y="720" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1477" dy="0">one change</tspan>
    <tspan x="1477" dy="30">at a time</tspan>
  </text>

  
  <rect x="60" y="1010" width="1480" height="75" rx="12" fill="#207448" />
  <text x="800" y="1057" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A memory investigation goes wrong when three settings change at once.</text>
</svg>