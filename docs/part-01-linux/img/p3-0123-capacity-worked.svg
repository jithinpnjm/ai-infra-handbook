<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Capacity planning, three methods with the chapter's numbers</title>
  <desc>Infographic explaining capacity planning using the resource-limit method, factor analysis, and scaling dimensions, with demand versus supply GPU arithmetic.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Capacity planning, three methods</tspan>
    <tspan x="800" dy="56">with the chapter's numbers</tspan>
  </text>

  
  <g id="col-resource-limit">
    
    <rect x="40" y="140" width="480" height="695" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(65, 158)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6"/>
      <rect x="19" y="19" width="18" height="18" rx="2"/>
      <line x1="18" y1="2" x2="18" y2="10"/>
      <line x1="28" y1="2" x2="28" y2="10"/>
      <line x1="38" y1="2" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="54"/>
      <line x1="28" y1="46" x2="28" y2="54"/>
      <line x1="38" y1="46" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="10" y2="18"/>
      <line x1="2" y1="28" x2="10" y2="28"/>
      <line x1="2" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="54" y2="18"/>
      <line x1="46" y1="28" x2="54" y2="28"/>
      <line x1="46" y1="38" x2="54" y2="38"/>
    </g>
    
    <text x="135" y="185" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="135" dy="0">Resource-limit</tspan>
      <tspan x="135" dy="36">method</tspan>
    </text>

    
    <rect x="60" y="240" width="440" height="90" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="276" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">measure: 1,000 req/s at</tspan>
      <tspan x="80" dy="32">40% average on 16 CPUs</tspan>
    </text>

    
    <rect x="60" y="348" width="440" height="90" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="384" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">per request: 16 x 40 /</tspan>
      <tspan x="80" dy="32">1,000 = 0.64% of a CPU</tspan>
    </text>

    
    <rect x="60" y="456" width="440" height="90" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="492" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">limit: 16 x 100 / 0.64 =</tspan>
      <tspan x="80" dy="32">2,500 req/s</tspan>
    </text>

    
    <rect x="60" y="564" width="440" height="250" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="80" y="612" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">best case: some other</tspan>
      <tspan x="80" dy="34">limit may come first, and</tspan>
      <tspan x="80" dy="34">plan for the peak, not</tspan>
      <tspan x="80" dy="34">the daily average</tspan>
    </text>
  </g>

  
  <g id="col-factor-analysis">
    
    <rect x="560" y="140" width="480" height="695" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(585, 158)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="48" y2="16"/>
      <circle cx="20" cy="16" r="6" fill="#e8f1ea"/>
      <line x1="8" y1="28" x2="48" y2="28"/>
      <circle cx="36" cy="28" r="6" fill="#e8f1ea"/>
      <line x1="8" y1="40" x2="48" y2="40"/>
      <circle cx="24" cy="40" r="6" fill="#e8f1ea"/>
    </g>
    
    <text x="655" y="185" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="655" dy="0">Factor</tspan>
      <tspan x="655" dy="36">analysis</tspan>
    </text>

    
    <rect x="580" y="240" width="440" height="90" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="600" y="276" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">start with the maximum</tspan>
      <tspan x="600" dy="32">configuration</tspan>
    </text>

    
    <rect x="580" y="348" width="440" height="155" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="600" y="384" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">change one factor at a</tspan>
      <tspan x="600" dy="32">time, record the percentage</tspan>
      <tspan x="600" dy="32">performance drop and</tspan>
      <tspan x="600" dy="32">the cost saving</tspan>
    </text>

    
    <rect x="580" y="521" width="440" height="130" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="600" y="560" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">combine multiplicatively,</tspan>
      <tspan x="600" dy="32">choose, re-test the</tspan>
      <tspan x="600" dy="32">combined configuration</tspan>
    </text>

    
    <rect x="580" y="669" width="440" height="145" rx="10" fill="#fef8f2" stroke="#db8129" stroke-width="2.5"/>
    <text x="800" y="728" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      <tspan x="800" dy="0">eight binary factors need</tspan>
      <tspan x="800" dy="36">about ten tests, not 256</tspan>
    </text>
  </g>

  
  <g id="col-scaling">
    
    <rect x="1080" y="140" width="480" height="695" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(1105, 158)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="18" height="18" rx="3"/>
      <rect x="30" y="8" width="18" height="18" rx="3"/>
      <rect x="8" y="30" width="18" height="18" rx="3"/>
      <rect x="30" y="30" width="18" height="18" rx="3"/>
      <line x1="17" y1="26" x2="17" y2="30"/>
      <line x1="39" y1="26" x2="39" y2="30"/>
      <line x1="26" y1="17" x2="30" y2="17"/>
      <line x1="26" y1="39" x2="30" y2="39"/>
    </g>
    
    <text x="1175" y="196" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scaling</text>

    
    <rect x="1100" y="240" width="440" height="64" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1120" y="280" font-family="sans-serif" font-size="24" fill="#303a36">vertical: a bigger machine</text>

    
    <rect x="1100" y="320" width="440" height="240" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1120" y="356" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0">horizontal: more machines</tspan>
      <tspan x="1120" dy="28">behind a load balancer;</tspan>
      <tspan x="1120" dy="28">autoscaling groups;</tspan>
      <tspan x="1120" dy="28">Kubernetes HPA on CPU</tspan>
      <tspan x="1120" dy="28">or custom metrics such as</tspan>
      <tspan x="1120" dy="28">queue length or</tspan>
      <tspan x="1120" dy="28">GPU utilisation</tspan>
    </text>

    
    <rect x="1100" y="576" width="440" height="64" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1120" y="616" font-family="sans-serif" font-size="24" fill="#303a36">databases shard on a key</text>

    
    <rect x="1100" y="656" width="440" height="158" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
    <text x="1120" y="692" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1120" dy="0">GPUs scale as nodes, but</tspan>
      <tspan x="1120" dy="28">fabrics and storage have</tspan>
      <tspan x="1120" dy="28">step limits: plan them</tspan>
      <tspan x="1120" dy="28">together</tspan>
    </text>
  </g>

  
  <g id="band-gpu-capacity">
    <rect x="40" y="860" width="1520" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(65, 925)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="20" x2="52" y2="20"/>
      <line x1="4" y1="34" x2="52" y2="34"/>
      <circle cx="14" cy="13" r="2" fill="#207448"/>
      <circle cx="22" cy="13" r="2" fill="#207448"/>
      <circle cx="14" cy="27" r="2" fill="#207448"/>
      <circle cx="22" cy="27" r="2" fill="#207448"/>
      <circle cx="14" cy="41" r="2" fill="#207448"/>
      <circle cx="22" cy="41" r="2" fill="#207448"/>
    </g>

    
    <text x="145" y="904" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">GPU capacity: demand (model, tokens/s or samples/s, SLO, utilisation target) versus supply</tspan>
      <tspan x="145" dy="36">(per-GPU throughput achieved at the target latency, measured on your own model and stack,</tspan>
      <tspan x="145" dy="36">not the vendor peak), derated for failures and maintenance, plus headroom for peak load</tspan>
      <tspan x="145" dy="36">and degraded nodes; plan network, storage and power at the same time</tspan>
    </text>
  </g>

  
  <g id="bar-takeaway">
    <rect x="40" y="1075" width="1520" height="85" rx="12" fill="#207448"/>

    
    <g transform="translate(65, 1089)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="18 28 25 35 38 20"/>
    </g>

    <text x="820" y="1128" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Write down demand, supply and headroom before you commit to a purchase</text>
  </g>
</svg>