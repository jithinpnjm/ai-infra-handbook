<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Four kinds of forwarding</title>
  <desc>Visual infographic explaining the four kinds of SSH forwarding: Environment variables, Port forwarding, X11 forwarding, and Agent forwarding, all encapsulated within an encrypted SSH connection.</desc>

  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Four kinds of forwarding</text>

  
  <g transform="translate(80, 115)">
    <rect width="1440" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(28, 17)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="24" width="40" height="28" rx="5" fill="#f5f8f5"/>
      <path d="M16 24V16a12 12 0 0 1 24 0v8"/>
      <circle cx="28" cy="38" r="3" fill="#207448"/>
    </g>
    <text x="96" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">everything travels inside the single encrypted SSH connection</text>
  </g>

  
  <g transform="translate(80, 245)">
    <rect width="695" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(36, 36)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="6" y1="14" x2="50" y2="14"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <line x1="6" y1="42" x2="50" y2="42"/>
      <circle cx="20" cy="14" r="5" fill="#e8f1ea"/>
      <circle cx="38" cy="28" r="5" fill="#e8f1ea"/>
      <circle cx="24" cy="42" r="5" fill="#e8f1ea"/>
    </g>
    <text x="112" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Environment variables</text>

    
    <text x="36" y="145" font-size="24" fill="#303a36">
      <tspan font-family="monospace">SendEnv LANG LC_*</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> on the client and</tspan>
      <tspan x="36" dy="48" font-family="monospace">AcceptEnv LANG LC_*</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> on the server,</tspan>
      <tspan x="36" dy="48" font-family="system-ui, -apple-system, sans-serif">both must agree.</tspan>
    </text>
  </g>

  
  <g transform="translate(825, 245)">
    <rect width="695" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(36, 36)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#f5f8f5"/>
      <path d="M16 48v-8M24 48v-8M32 48v-8M40 48v-8"/>
      <circle cx="20" cy="22" r="3" fill="#207448"/>
      <circle cx="36" cy="22" r="3" fill="#207448"/>
    </g>
    <text x="112" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Port forwarding</text>

    
    <text x="36" y="145" font-size="24" fill="#303a36">
      <tspan font-family="monospace">ssh -L 8080:192.168.0.10:80</tspan>
      <tspan x="36" dy="46" font-family="monospace">your.server.address</tspan>
      <tspan x="36" dy="46" font-family="system-ui, -apple-system, sans-serif">then browse </tspan>
      <tspan font-family="monospace">localhost:8080.</tspan>
    </text>
  </g>

  
  <g transform="translate(80, 625)">
    <rect width="695" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(36, 36)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#f5f8f5"/>
      <line x1="6" y1="20" x2="50" y2="20"/>
      <circle cx="14" cy="14" r="1.5" fill="#207448"/>
      <circle cx="20" cy="14" r="1.5" fill="#207448"/>
      <circle cx="26" cy="14" r="1.5" fill="#207448"/>
    </g>
    <text x="112" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">X11 forwarding</text>

    
    <text x="36" y="145" font-size="24" fill="#303a36">
      <tspan font-family="system-ui, -apple-system, sans-serif">remote graphical program displays on</tspan>
      <tspan x="36" dy="48" font-family="system-ui, -apple-system, sans-serif">your local X server,</tspan>
      <tspan x="36" dy="48" font-family="system-ui, -apple-system, sans-serif">needs </tspan>
      <tspan font-family="monospace">xauth</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> on both ends.</tspan>
    </text>
  </g>

  
  <g transform="translate(825, 625)">
    <rect width="695" height="345" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(36, 36)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8L10 16v14c0 13 8 20 18 24 10-4 18-11 18-24V16L28 8z" fill="#f5f8f5"/>
      <path d="M28 22v12"/>
      <circle cx="28" cy="37" r="1.5" fill="#db8129"/>
    </g>
    <text x="112" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Agent forwarding</text>

    
    <text x="36" y="142" font-size="24" fill="#303a36">
      <tspan font-family="system-ui, -apple-system, sans-serif">exposes your local agent, not the keys,</tspan>
      <tspan x="36" dy="42" font-family="system-ui, -apple-system, sans-serif">anyone with root on that machine can use it</tspan>
      <tspan x="36" dy="42" font-family="system-ui, -apple-system, sans-serif">while you are connected,</tspan>
      <tspan x="36" dy="42" font-family="system-ui, -apple-system, sans-serif">prefer </tspan>
      <tspan font-family="monospace">ProxyJump.</tspan>
    </text>
  </g>
</svg>