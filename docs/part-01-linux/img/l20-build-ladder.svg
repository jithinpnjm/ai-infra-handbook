<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What each step adds</title>
  <desc>Visual infographic ladder showing what each step adds when building a container by hand, compared with docker run in the real-container check.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What each step adds</text>

  

  
  <g id="step-1">
    <rect x="40" y="120" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="175" r="24" fill="#207448" />
    <text x="94" y="184" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(142, 147)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="12" rx="22" ry="7" />
      <path d="M 6 12 v 16 c 0 3.86 9.85 7 22 7 s 22 -3.14 22 -7 v -16" />
      <path d="M 6 28 v 16 c 0 3.86 9.85 7 22 7 s 22 -3.14 22 -7 v -16" />
    </g>
    <text x="224" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 1</text>
    <text x="224" y="196" font-family="sans-serif" font-size="24" fill="#303a36">root filesystem (base)</text>
  </g>

  
  <g id="step-2">
    <rect x="40" y="273" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="328" r="24" fill="#207448" />
    <text x="94" y="337" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(142, 300)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 6 14 h 14 l 6 7 h 24 v 25 h -44 z" />
      <circle cx="28" cy="32" r="6" />
      <line x1="33" y1="36" x2="40" y2="43" />
    </g>
    <text x="224" y="311" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 2</text>
    <text x="224" y="349" fill="#303a36">
      <tspan font-family="sans-serif" font-size="24">plain </tspan>
      <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">chroot</tspan>
      <tspan font-family="sans-serif" font-size="24">, only a different filesystem view</tspan>
    </text>
  </g>

  
  <g id="step-3">
    <rect x="40" y="426" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="481" r="24" fill="#207448" />
    <text x="94" y="490" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(142, 453)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="20" height="20" rx="4" />
      <rect x="30" y="6" width="20" height="20" rx="4" />
      <rect x="6" y="30" width="20" height="20" rx="4" />
      <rect x="30" y="30" width="20" height="20" rx="4" />
    </g>
    <text x="224" y="464" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 3</text>
    <text x="224" y="502" fill="#303a36">
      <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">unshare</tspan>
      <tspan font-family="sans-serif" font-size="24"> with PID, mount, UTS, IPC and net namespaces</tspan>
    </text>
  </g>

  
  <g id="step-4">
    <rect x="40" y="579" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="634" r="24" fill="#207448" />
    <text x="94" y="643" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(142, 606)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="28 6, 50 16, 28 26, 6 16" />
      <path d="M 6 26 l 22 10 l 22 -10" />
      <path d="M 6 36 l 22 10 l 22 -10" />
    </g>
    <text x="224" y="617" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 4</text>
    <text x="224" y="655" fill="#303a36">
      <tspan font-family="sans-serif" font-size="24">OverlayFS layers plus </tspan>
      <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">pivot_root</tspan>
    </text>
  </g>

  
  <g id="step-5">
    <rect x="40" y="732" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="787" r="24" fill="#207448" />
    <text x="94" y="796" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(142, 759)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <line x1="20" y1="4" x2="20" y2="12" />
      <line x1="36" y1="4" x2="36" y2="12" />
      <line x1="20" y1="44" x2="20" y2="52" />
      <line x1="36" y1="44" x2="36" y2="52" />
      <line x1="4" y1="20" x2="12" y2="20" />
      <line x1="4" y1="36" x2="12" y2="36" />
      <line x1="44" y1="20" x2="52" y2="20" />
      <line x1="44" y1="36" x2="52" y2="36" />
      <line x1="20" y1="28" x2="36" y2="28" />
    </g>
    <text x="224" y="770" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 5</text>
    <text x="224" y="808" fill="#303a36">
      <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">cgroup</tspan>
      <tspan font-family="sans-serif" font-size="24"> limits for CPU, memory and PIDs</tspan>
    </text>
  </g>

  
  <g id="step-6">
    <rect x="40" y="885" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="940" r="24" fill="#207448" />
    <text x="94" y="949" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <g transform="translate(142, 912)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="16" width="14" height="24" rx="3" />
      <rect x="36" y="16" width="14" height="24" rx="3" />
      <line x1="20" y1="28" x2="36" y2="28" />
      <line x1="28" y1="28" x2="28" y2="48" />
      <line x1="18" y1="48" x2="38" y2="48" />
    </g>
    <text x="224" y="923" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 6</text>
    <text x="224" y="961" font-family="sans-serif" font-size="24" fill="#303a36">veth pair, bridge and NAT</text>
  </g>

  
  <g id="step-7">
    <rect x="40" y="1038" width="1000" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="94" cy="1093" r="24" fill="#207448" />
    <text x="94" y="1102" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    
    <g transform="translate(142, 1065)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 C 48 34, 28 48, 28 50 C 28 48, 8 34, 8 14 Z" />
      <line x1="28" y1="18" x2="28" y2="34" />
      <polyline points="21 28, 28 35, 35 28" />
    </g>
    <text x="224" y="1076" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 7</text>
    <text x="224" y="1114" font-family="sans-serif" font-size="24" fill="#303a36">drop privileges</text>
  </g>

  

  
  <g id="right-column-container">
    <rect x="1080" y="120" width="480" height="1028" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(1300, 160)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="10" width="28" height="36" rx="3" />
      <path d="M 14 10 V 6 h 12 v 4" />
      <polyline points="12 26, 18 32, 28 20" />
    </g>

    
    <text x="1320" y="240" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">real-container check</text>

    
    <line x1="1130" y1="280" x2="1510" y2="280" stroke="#207448" stroke-width="2" stroke-opacity="0.35" />

    
    <g id="step-8">
      <rect x="1110" y="340" width="420" height="740" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4" />

      
      <circle cx="1320" cy="450" r="28" fill="#db8129" />
      <text x="1320" y="460" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">8</text>

      
      <g transform="translate(1292, 530)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="4" y="10" width="48" height="36" rx="6" />
        <line x1="16" y1="10" x2="16" y2="46" />
        <line x1="28" y1="10" x2="28" y2="46" />
        <line x1="40" y1="10" x2="40" y2="46" />
        <line x1="4" y1="28" x2="52" y2="28" />
      </g>

      
      <text x="1320" y="670" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#db8129">Step 8</text>

      
      <text x="1320" y="770" text-anchor="middle" fill="#303a36">
        <tspan x="1320" dy="0" font-family="sans-serif" font-size="26">compare with</tspan>
        <tspan x="1320" dy="54" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">docker run</tspan>
      </text>
    </g>
  </g>
</svg>