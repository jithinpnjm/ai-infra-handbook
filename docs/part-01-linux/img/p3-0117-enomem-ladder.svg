<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Cannot allocate memory while RAM is free: six limits to check</title>
  <desc>Visual infographic explaining six system and kernel limits to check when memory allocation fails despite free RAM.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Cannot allocate memory while RAM is free: six limits to check</text>

  
  <g id="symptom-box">
    <rect x="40" y="85" width="1520" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 78 128 L 96 94 L 114 128 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="96" y1="106" x2="96" y2="116" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="96" cy="122" r="1.5" fill="#207448" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="130" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cannot allocate memory, but free -h shows plenty of RAM</text>
  </g>

  
  <g id="row-1">
    <rect x="40" y="175" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    
    <circle cx="76" cy="243" r="24" fill="#207448" />
    <text x="76" y="252" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(114, 215)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="44" height="12" rx="2" />
      <rect x="4" y="20" width="44" height="12" rx="2" />
      <rect x="4" y="36" width="44" height="12" rx="2" stroke="#db8129" />
      <line x1="16" y1="4" x2="16" y2="16" />
      <line x1="32" y1="4" x2="32" y2="16" />
      <line x1="24" y1="20" x2="24" y2="32" />
    </g>

    <line x1="185" y1="191" x2="185" y2="295" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="218" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">vm.max_map_count exhausted (default 65530);</tspan>
      <tspan x="205" dy="30">frameworks with many mmaps need</tspan>
      <tspan x="205" dy="30">262144 to 1048576</tspan>
    </text>

    <line x1="705" y1="191" x2="705" y2="295" stroke="#207448" stroke-width="1.5" opacity="0.35" />

    
    <text x="935" y="251" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">sysctl vm.max_map_count</text>
  </g>

  
  <g id="row-2">
    <rect x="40" y="327" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="76" cy="395" r="24" fill="#207448" />
    <text x="76" y="404" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(114, 367)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 44 A 22 22 0 1 1 46 44" />
      <line x1="26" y1="44" x2="38" y2="22" stroke-width="3.5" />
      <circle cx="26" cy="44" r="4" fill="#207448" />
    </g>

    <line x1="185" y1="343" x2="185" y2="447" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="370" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="205" dy="0">overcommit_memory=2 (strict) limits committed</tspan>
      <tspan x="205" dy="30">memory to swap plus overcommit_ratio</tspan>
      <tspan x="205" dy="30">percent of RAM</tspan>
    </text>

    <line x1="705" y1="343" x2="705" y2="447" stroke="#207448" stroke-width="1.5" opacity="0.35" />

    
    <text x="935" y="370" text-anchor="middle" font-size="24">
      <tspan x="935" dy="0" font-family="monospace" font-weight="bold" fill="#207448">grep -E Commit /proc/meminfo</tspan>
      <tspan x="935" dy="30" font-family="sans-serif" fill="#303a36">showing CommitLimit and</tspan>
      <tspan x="935" dy="30" font-family="monospace" font-weight="bold" fill="#207448">Committed_AS</tspan>
    </text>
  </g>

  
  <g id="row-3">
    <rect x="40" y="479" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="76" cy="547" r="24" fill="#207448" />
    <text x="76" y="556" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(114, 519)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="40" height="34" rx="2" />
      <line x1="2" y1="8" x2="50" y2="8" stroke-width="4" />
      <line x1="26" y1="40" x2="26" y2="18" />
      <polyline points="18,26 26,18 34,26" />
    </g>

    <line x1="185" y1="495" x2="185" y2="599" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="555" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Address-space limit hit</text>

    <line x1="705" y1="495" x2="705" y2="599" stroke="#207448" stroke-width="1.5" opacity="0.35" />

    
    <text x="935" y="555" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ulimit -v</text>
  </g>

  
  <g id="row-4">
    <rect x="40" y="631" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="76" cy="699" r="24" fill="#207448" />
    <text x="76" y="708" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(114, 671)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="44" height="42" rx="4" />
      <rect x="12" y="16" width="28" height="24" rx="2" fill="#207448" fill-opacity="0.15" />
      <circle cx="26" cy="28" r="3" fill="#207448" />
    </g>

    <line x1="185" y1="647" x2="185" y2="751" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="707" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">A cgroup limit applies</text>

    <line x1="705" y1="647" x2="705" y2="751" stroke="#207448" stroke-width="1.5" opacity="0.35" />

    
    <text x="935" y="707" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">memory.max and memory.events</text>
  </g>

  
  <g id="row-5">
    <rect x="40" y="783" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="76" cy="851" r="24" fill="#207448" />
    <text x="76" y="860" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    
    <g transform="translate(114, 823)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="18" height="36" rx="3" fill="#207448" fill-opacity="0.35" />
      <rect x="30" y="8" width="18" height="36" rx="3" />
      <line x1="22" y1="20" x2="30" y2="20" />
      <line x1="22" y1="32" x2="30" y2="32" />
    </g>

    <line x1="185" y1="799" x2="185" y2="903" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="859" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">A NUMA bind points at a full node</text>

    <line x1="705" y1="799" x2="705" y2="903" stroke="#207448" stroke-width="1.5" opacity="0.35" />

    
    <text x="935" y="859" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">numactl --show, numastat -p PID</text>
  </g>

  
  <g id="row-6">
    <rect x="40" y="935" width="1130" height="136" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="76" cy="1003" r="24" fill="#207448" />
    <text x="76" y="1012" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    
    <g transform="translate(114, 975)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="26" r="6" />
      <circle cx="42" cy="12" r="6" />
      <circle cx="42" cy="40" r="6" />
      <path d="M 16 26 C 26 26, 28 12, 36 12" />
      <path d="M 16 26 C 26 26, 28 40, 36 40" />
    </g>

    <line x1="185" y1="951" x2="185" y2="1055" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35" />

    
    <text x="205" y="1011" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">A fork of a large process fails under strict overcommit</text>
  </g>

  
  <g id="side-panel">
    <rect x="1190" y="175" width="370" height="896" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1347, 240)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="24" width="48" height="40" rx="6" />
      <path d="M 14 24 L 14 14 A 14 14 0 0 1 42 14 L 42 24" />
      <circle cx="28" cy="42" r="4" fill="#207448" />
      <line x1="28" y1="46" x2="28" y2="54" />
    </g>

    
    <text x="1375" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1375" dy="0">ibv_reg_mr or pinned</tspan>
      <tspan x="1375" dy="36">allocation fails while</tspan>
      <tspan x="1375" dy="36">the GPU has room:</tspan>
      <tspan x="1375" dy="64" font-family="monospace" font-weight="bold" fill="#207448">ulimit -l,</tspan>
      <tspan x="1375" dy="36" font-family="monospace" font-weight="bold" fill="#207448">unit limits,</tspan>
      <tspan x="1375" dy="36" font-family="monospace" font-weight="bold" fill="#207448">container ulimits</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1095" width="1520" height="70" rx="8" fill="#207448" />
    <text x="800" y="1139" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Confirm the symptom with the counters before you change a setting</text>
  </g>
</svg>