<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>How to read a CPU flame graph</title>
  <desc>Visual infographic explaining how to read a CPU flame graph, including call stack hierarchy, X and Y axis interpretations, four reading steps, compiler and perf recipe, and off-CPU profiling.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="9" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 16 9 L 2 16 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How to read a CPU flame graph</text>

  
  <rect x="50" y="110" width="930" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(80, 136)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="10" y="10" width="36" height="36" rx="6" fill="#f5f8f5" />
    <path d="M 18 20 L 38 20 M 18 28 L 38 28 M 18 36 L 38 36" />
    <path d="M 18 2 L 18 10 M 28 2 L 28 10 M 38 2 L 38 10" />
    <path d="M 18 46 L 18 54 M 28 46 L 28 54 M 38 46 L 38 54" />
    <path d="M 2 18 L 10 18 M 2 28 L 10 28 M 2 38 L 10 38" />
    <path d="M 46 18 L 54 18 M 46 28 L 54 28 M 46 38 L 54 38" />
  </g>

  
  <line x1="315" y1="540" x2="315" y2="252" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <text x="180" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0" font-weight="bold">Y axis:</tspan>
    <tspan x="180" dy="34">call depth,</tspan>
    <tspan x="180" dy="34">callers below,</tspan>
    <tspan x="180" dy="34">callees on top</tspan>
  </text>

  
  
  <rect x="512" y="250" width="290" height="65" rx="8" fill="#db8129" stroke="#b86214" stroke-width="2" />
  <text x="657" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">matmul</text>

  
  <rect x="340" y="325" width="166" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="423" y="367" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">read</text>

  <rect x="512" y="325" width="290" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="657" y="367" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">forward</text>

  <rect x="808" y="325" width="152" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="884" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">backward</text>

  
  <rect x="340" y="400" width="166" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="423" y="441" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">load_data</text>

  <rect x="512" y="400" width="448" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="736" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">train_step</text>

  
  <rect x="340" y="475" width="620" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="650" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">main</text>

  
  <path d="M 340 558 v 12 h 310 v 10 v -10 h 310 v -12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  
  <text x="650" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="650" dy="0" font-weight="bold">X axis: width = share of samples;</tspan>
    <tspan x="650" dy="32">left to right order is</tspan>
    <tspan x="650" dy="32">alphabetical, NOT time</tspan>
  </text>


  
  <rect x="1010" y="110" width="540" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1030" y="135" width="500" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1075" cy="202" r="24" fill="#207448" />
  <text x="1075" y="211" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="1120" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" dy="0">Find the widest boxes</tspan>
    <tspan x="1120" dy="34">at the top edge</tspan>
  </text>

  
  <rect x="1030" y="285" width="500" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1075" cy="352" r="24" fill="#207448" />
  <text x="1075" y="361" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="1120" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" dy="0">Follow them down to see</tspan>
    <tspan x="1120" dy="34">who called them</tspan>
  </text>

  
  <rect x="1030" y="435" width="500" height="170" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1075" cy="520" r="24" fill="#207448" />
  <text x="1075" y="529" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="1120" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" dy="0">Names like ext4, blk_,</tspan>
    <tspan x="1120" dy="34">tcp_, futex hint at file,</tspan>
    <tspan x="1120" dy="34">disk, network and</tspan>
    <tspan x="1120" dy="34">lock activity</tspan>
  </text>

  
  <rect x="1030" y="620" width="500" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1075" cy="687" r="24" fill="#207448" />
  <text x="1075" y="696" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <text x="1120" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1120" dy="0">Check stacks are complete:</tspan>
    <tspan x="1120" dy="34">short stacks hide</tspan>
    <tspan x="1120" dy="34">the caller</tspan>
  </text>


  
  <rect x="50" y="810" width="970" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(80, 835)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="10" fill="#f5f8f5" />
    <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11" />
  </g>

  
  <rect x="80" y="908" width="910" height="96" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="535" y="946" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="535" dy="0">compile with -fno-omit-frame-pointer and -g;</tspan>
    <tspan x="535" dy="34">keep debug info</tspan>
  </text>

  
  <rect x="80" y="1022" width="910" height="82" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="535" y="1072" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">perf record -F 99 -g -- sleep 30; perf report</text>


  
  <rect x="1050" y="810" width="500" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1080, 835)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="22" fill="#f5f8f5" />
    <polyline points="28,14 28,28 38,34" />
  </g>

  
  <rect x="1075" y="908" width="450" height="196" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="1300" y="958" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1300" dy="0" font-weight="bold">Off-CPU flame graph:</tspan>
    <tspan x="1300" dy="36">threads blocked on I/O,</tspan>
    <tspan x="1300" dy="36">locks or sleep</tspan>
    <tspan x="1300" dy="36">(offcputime)</tspan>
  </text>
</svg>