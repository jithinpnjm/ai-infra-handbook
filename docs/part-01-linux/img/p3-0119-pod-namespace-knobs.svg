<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pod spec switches that join the host's namespaces, and what each one costs</title>
  <desc>Visual guide comparing Kubernetes pod settings that join host namespaces, their effects, and their security risks or valid use cases.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Pod spec switches that join the host's namespaces,</text>
  <text x="40" y="125" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">and what each one costs</text>

  
  <rect x="40" y="155" width="1520" height="50" rx="8" fill="#207448"/>
  <line x1="520" y1="163" x2="520" y2="197" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="820" y1="163" x2="820" y2="197" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="1160" y1="163" x2="1160" y2="197" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <text x="65" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Setting</text>
  <text x="545" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Which namespace</text>
  <text x="845" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Effect</text>
  <text x="1185" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Risk or use</text>

  
  <rect x="40" y="215" width="470" height="92" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="520" y="215" width="1040" height="92" rx="6" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <g transform="translate(56, 239)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="2" width="40" height="40" rx="6"/>
    <rect x="8" y="8" width="10" height="10" rx="2" fill="#207448"/>
    <rect x="26" y="8" width="10" height="10" rx="2" fill="#207448"/>
    <rect x="8" y="26" width="10" height="10" rx="2" fill="#207448"/>
    <rect x="26" y="26" width="10" height="10" rx="2" fill="#207448"/>
  </g>
  <text x="120" y="271" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">default pod</text>
  <text x="545" y="246" font-family="sans-serif" font-size="24" fill="#303a36">the pause container (infra container) holds</text>
  <text x="545" y="272" font-family="sans-serif" font-size="24" fill="#303a36">the pod's shared namespaces; containers in the pod share</text>
  <text x="545" y="298" font-family="sans-serif" font-size="24" fill="#303a36">one network namespace and one IPC namespace</text>

  
  <rect x="40" y="315" width="470" height="88" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="520" y="315" width="1040" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 337)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="22" cy="8" r="6" fill="#207448"/>
    <path d="M22 14 v12 M10 26 h24 M10 26 v10 M34 26 v10"/>
    <circle cx="10" cy="38" r="4"/>
    <circle cx="34" cy="38" r="4"/>
  </g>
  <text x="120" y="351" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">shareProcessNamespace:</text>
  <text x="120" y="381" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">true</text>
  <text x="545" y="351" font-family="sans-serif" font-size="24" fill="#303a36">all containers in the pod share one PID namespace;</text>
  <text x="545" y="383" font-family="sans-serif" font-size="24" fill="#303a36">pause runs as PID 1 and reaps zombies</text>

  
  <rect x="40" y="411" width="470" height="88" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <rect x="520" y="411" width="290" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  <rect x="820" y="411" width="740" height="88" rx="6" fill="#fff9f5" stroke="#db8129" stroke-width="2.5"/>
  
  <g transform="translate(56, 433)" stroke="#db8129" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 4 L6 11 v14 c0 11 16 19 16 19 s16 -8 16 -19 V11 Z"/>
    <line x1="22" y1="16" x2="22" y2="27"/>
    <circle cx="22" cy="33" r="1.5" fill="#db8129"/>
  </g>
  <text x="120" y="463" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">hostPID: true</text>
  <text x="535" y="449" font-family="sans-serif" font-size="24" fill="#303a36">the host PID</text>
  <text x="535" y="479" font-family="sans-serif" font-size="24" fill="#303a36">namespace</text>
  <text x="845" y="449" font-family="sans-serif" font-size="24" fill="#303a36">some profilers and node agents need it;</text>
  <text x="845" y="479" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">a strong security exposure</text>

  
  <rect x="40" y="507" width="470" height="88" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="520" y="507" width="290" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  <rect x="820" y="507" width="740" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 529)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="8" cy="22" r="5"/>
    <circle cx="36" cy="10" r="5"/>
    <circle cx="36" cy="34" r="5"/>
    <line x1="13" y1="20" x2="31" y2="12"/>
    <line x1="13" y1="24" x2="31" y2="32"/>
    <line x1="36" y1="15" x2="36" y2="29"/>
  </g>
  <text x="120" y="559" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">hostNetwork: true</text>
  <text x="535" y="545" font-family="sans-serif" font-size="24" fill="#303a36">the host network</text>
  <text x="535" y="575" font-family="sans-serif" font-size="24" fill="#303a36">namespace</text>
  <text x="845" y="545" font-family="sans-serif" font-size="24" fill="#303a36">no isolation; node agents and</text>
  <text x="845" y="575" font-family="sans-serif" font-size="24" fill="#303a36">performance-sensitive jobs</text>

  
  <rect x="40" y="603" width="470" height="78" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="520" y="603" width="290" height="78" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  <rect x="820" y="603" width="740" height="78" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 620)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10" y="10" width="24" height="24" rx="4"/>
    <line x1="16" y1="4" x2="16" y2="10"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
    <line x1="16" y1="34" x2="16" y2="40"/>
    <line x1="28" y1="34" x2="28" y2="40"/>
    <line x1="4" y1="16" x2="10" y2="16"/>
    <line x1="4" y1="28" x2="10" y2="28"/>
    <line x1="34" y1="16" x2="40" y2="16"/>
    <line x1="34" y1="28" x2="40" y2="28"/>
  </g>
  <text x="120" y="651" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">hostIPC: true</text>
  <text x="535" y="638" font-family="sans-serif" font-size="24" fill="#303a36">the host IPC</text>
  <text x="535" y="668" font-family="sans-serif" font-size="24" fill="#303a36">namespace</text>
  <text x="845" y="651" font-family="sans-serif" font-size="24" fill="#303a36">shared memory with host processes</text>

  
  <rect x="40" y="689" width="470" height="88" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="520" y="689" width="290" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  <rect x="820" y="689" width="740" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 711)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="22" cy="14" r="8"/>
    <path d="M6 38 c0 -9 7 -14 16 -14 s16 5 16 14"/>
  </g>
  <text x="120" y="741" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">hostUsers: false</text>
  <text x="535" y="741" font-family="sans-serif" font-size="24" fill="#303a36">a user namespace</text>
  <text x="845" y="727" font-family="sans-serif" font-size="24" fill="#303a36">newer, behind a feature gate:</text>
  <text x="845" y="757" font-family="sans-serif" font-size="24" fill="#303a36">check status for your version</text>

  
  <rect x="520" y="785" width="290" height="184" rx="6" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  <text x="545" y="884" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">mount namespace</text>

  
  <rect x="40" y="785" width="470" height="88" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="820" y="785" width="740" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 807)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="22" cy="10" rx="16" ry="6"/>
    <path d="M6 10 v18 c0 3.3 7.2 6 16 6 s16 -2.7 16 -6 V10"/>
    <path d="M14 20 l8 8 l8 -8"/>
  </g>
  <text x="120" y="821" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">mountPropagation:</text>
  <text x="120" y="853" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">HostToContainer (rslave)</text>
  <text x="845" y="823" font-family="sans-serif" font-size="24" fill="#303a36">sees mounts created later on the host;</text>
  <text x="845" y="853" font-family="sans-serif" font-size="24" fill="#303a36">CSI drivers rely on it</text>

  
  <rect x="40" y="881" width="470" height="88" rx="6" fill="#ffffff" stroke="#d5e3d7" stroke-width="1.5"/>
  <rect x="820" y="881" width="740" height="88" rx="6" fill="#f7faf8" stroke="#dbe7dd" stroke-width="1.5"/>
  
  <g transform="translate(56, 903)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="22" cy="10" rx="16" ry="6"/>
    <path d="M6 10 v18 c0 3.3 7.2 6 16 6 s16 -2.7 16 -6 V10"/>
    <path d="M16 18 l6 -6 l6 6 M28 26 l-6 6 l-6 -6"/>
  </g>
  <text x="120" y="917" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">mountPropagation:</text>
  <text x="120" y="949" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Bidirectional (rshared)</text>
  <text x="845" y="919" font-family="sans-serif" font-size="24" fill="#303a36">container mounts are visible on the host;</text>
  <text x="845" y="949" font-family="sans-serif" font-size="24" fill="#303a36">needs privileged mode</text>

  
  <rect x="40" y="985" width="1520" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 1002)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="6" width="36" height="28" rx="4"/>
    <path d="M12 16 l5 4 l-5 4 M21 24 h9"/>
  </g>
  <text x="116" y="1032" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">kubectl debug and ephemeral containers share the target's PID namespace for tracing</text>

  
  <rect x="40" y="1076" width="1520" height="75" rx="8" fill="#207448"/>
  
  <g transform="translate(60, 1093)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="20" cy="20" r="16"/>
    <path d="M12 20 l6 6 l10 -12"/>
  </g>
  <text x="116" y="1123" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Before you add a host namespace to a pod, write down which workload needs it</text>
</svg>