<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510">
  <title>From keystroke to main()</title>
  <desc>Shell, Kernel, ELF loader (kernel), ld.so (dynamic linker), and Program (libc start code + main) exchange fourteen messages in time order.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L16 9 L1 17 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L16 9 L1 17 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1510" fill="#f5f8f5"/>

  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">From keystroke to <tspan font-family="monospace">main()</tspan></text>

  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="48" y="108" width="304" height="192" rx="18"/>
    <rect x="368" y="108" width="304" height="192" rx="18"/>
    <rect x="688" y="108" width="304" height="192" rx="18"/>
    <rect x="1008" y="108" width="304" height="192" rx="18"/>
    <rect x="1328" y="108" width="224" height="192" rx="18"/>
  </g>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="132" y="126" width="56" height="42" rx="5"/>
    <path d="M132 138 H188 M143 149 L151 155 L143 161 M157 161 H171"/>
    <rect x="455" y="126" width="50" height="50" rx="7"/>
    <rect x="467" y="138" width="26" height="26" rx="3"/>
    <path d="M463 118 V126 M475 118 V126 M487 118 V126 M499 118 V126 M463 176 V184 M475 176 V184 M487 176 V184 M499 176 V184 M447 134 H455 M447 146 H455 M447 158 H455 M447 170 H455 M505 134 H513 M505 146 H513 M505 158 H513 M505 170 H513"/>
    <path d="M773 122 H811 L829 140 V180 H773 Z M811 122 V140 H829 M784 151 H818 M784 163 H818"/>
    <circle cx="1160" cy="151" r="18"/>
    <circle cx="1160" cy="151" r="7"/>
    <path d="M1160 122 V130 M1160 172 V180 M1131 151 H1139 M1181 151 H1189 M1140 131 L1146 137 M1174 165 L1180 171 M1180 131 L1174 137 M1146 165 L1140 171"/>
    <rect x="1420" y="126" width="56" height="42" rx="5"/>
    <path d="M1420 138 H1476 M1431 132 H1432 M1441 132 H1442"/>
  </g>

  <g font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">
    <text x="160" y="232">Shell</text>
    <text x="520" y="232">Kernel</text>
    <text x="840" y="232">
      <tspan x="840">ELF loader</tspan>
      <tspan x="840" dy="34">(kernel)</tspan>
    </text>
    <text x="1160" y="232">
      <tspan x="1160">ld.so (dynamic</tspan>
      <tspan x="1160" dy="34">linker)</tspan>
    </text>
  </g>
  <g font-family="sans-serif" font-size="28" font-weight="700" fill="#303a36" text-anchor="middle">
    <text x="1440" y="222">
      <tspan x="1440">Program</tspan>
      <tspan x="1440" dy="32">(libc start</tspan>
      <tspan x="1440" dy="32">code + main)</tspan>
    </text>
  </g>

  <g font-family="sans-serif" font-size="24" fill="#303a36">
    <g>
      <circle cx="65" cy="355" r="24" fill="#207448"/>
      <text x="65" y="363" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
      <text x="800" y="331" text-anchor="middle">fork() then execve("./train", argv, envp)</text>
      <path d="M160 355 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="433" r="24" fill="#207448"/>
      <text x="65" y="441" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
      <text x="800" y="409" text-anchor="middle">check file exists, execute permission, not on a noexec mount</text>
      <path d="M520 433 H556 V447 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="511" r="24" fill="#207448"/>
      <text x="65" y="519" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
      <text x="800" y="487" text-anchor="middle">read first bytes: "#!" script? ELF magic? other format (binfmt)?</text>
      <path d="M520 511 H840" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="589" r="24" fill="#207448"/>
      <text x="65" y="597" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
      <text x="800" y="565" text-anchor="middle">ELF: map LOAD segments (code r-x, data rw-), set up bss, heap start, stack</text>
      <path d="M840 589 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="667" r="24" fill="#207448"/>
      <text x="65" y="675" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
      <text x="800" y="643" text-anchor="middle">PT_INTERP says "/lib64/ld-linux-x86-64.so.2": map that too</text>
      <path d="M840 667 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="745" r="24" fill="#207448"/>
      <text x="65" y="753" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
      <text x="800" y="721" text-anchor="middle">start executing at the dynamic linker's entry point</text>
      <path d="M520 745 H1160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="823" r="24" fill="#207448"/>
      <text x="65" y="831" text-anchor="middle" fill="#ffffff" font-weight="700">7</text>
      <text x="800" y="793" text-anchor="middle">
        <tspan x="800">read DT_NEEDED list, find each library (RPATH, LD_LIBRARY_PATH,</tspan>
        <tspan x="800" dy="27">ld.so.cache, defaults)</tspan>
      </text>
      <path d="M1160 823 H1196 V837 H1160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="901" r="24" fill="#207448"/>
      <text x="65" y="909" text-anchor="middle" fill="#ffffff" font-weight="700">8</text>
      <text x="800" y="871" text-anchor="middle">
        <tspan x="800">mmap each library, resolve symbols (relocations), lazy binding for</tspan>
        <tspan x="800" dy="27">functions via PLT/GOT</tspan>
      </text>
      <path d="M1160 901 H1196 V915 H1160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="979" r="24" fill="#207448"/>
      <text x="65" y="987" text-anchor="middle" fill="#ffffff" font-weight="700">9</text>
      <text x="800" y="955" text-anchor="middle">run library constructors (init functions)</text>
      <path d="M1160 979 H1196 V993 H1160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="1057" r="24" fill="#207448"/>
      <text x="65" y="1065" text-anchor="middle" fill="#ffffff" font-weight="700">10</text>
      <text x="800" y="1033" text-anchor="middle">jump to _start</text>
      <path d="M1160 1057 H1440" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="1135" r="24" fill="#207448"/>
      <text x="65" y="1143" text-anchor="middle" fill="#ffffff" font-weight="700">11</text>
      <text x="800" y="1105" text-anchor="middle">
        <tspan x="800">__libc_start_main: set up stdio, atexit handlers, argc/argv,</tspan>
        <tspan x="800" dy="27">call main()</tspan>
      </text>
      <path d="M1440 1135 H1476 V1149 H1440" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
    </g>

    <g>
      <circle cx="65" cy="1213" r="24" fill="#207448"/>
      <text x="65" y="1221" text-anchor="middle" fill="#ffffff" font-weight="700">12</text>
      <text x="800" y="1189" text-anchor="middle">main runs: read/write/mmap/... system calls</text>
      <path d="M1440 1213 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="1291" r="24" fill="#207448"/>
      <text x="65" y="1299" text-anchor="middle" fill="#ffffff" font-weight="700">13</text>
      <text x="800" y="1267" text-anchor="middle">exit_group(status)</text>
      <path d="M1440 1291 H520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>

    <g>
      <circle cx="65" cy="1369" r="24" fill="#207448"/>
      <text x="65" y="1377" text-anchor="middle" fill="#ffffff" font-weight="700">14</text>
      <text x="800" y="1345" text-anchor="middle">SIGCHLD, shell wait4() collects the status</text>
      <path d="M520 1369 H160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>