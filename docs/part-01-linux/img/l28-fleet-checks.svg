<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Fleet health checks to automate</title>
  <desc>Infographic illustrating the four layered health checks for AI clusters: boot-time audit, prolog and epilog checks, periodic checks, and statistical outlier detection.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Fleet health checks to automate</text>

  
  <g id="layer-1">
    
    <rect x="70" y="105" width="1460" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <circle cx="116" cy="150" r="22" fill="#207448"/>
    <text x="116" y="159" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(155, 122)">
      <rect x="4" y="8" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="36" x2="26" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="40" cy="20" r="3" fill="#207448"/>
      <circle cx="40" cy="36" r="3" fill="#207448"/>
    </g>

    
    <text x="230" y="160" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Boot-time audit</text>

    
    <rect x="95" y="195" width="670" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="430" y="262" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">topology, links, settings, versions</text>

    
    <rect x="785" y="195" width="720" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1145" y="262" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">fails closed so a failing node stays drained</text>
  </g>

  
  <g id="layer-2">
    
    <rect x="70" y="365" width="1460" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <circle cx="116" cy="410" r="22" fill="#207448"/>
    <text x="116" y="419" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(155, 382)">
      <rect x="8" y="12" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M20 12 V6 H36 V12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M16 30 L22 36 L38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <text x="230" y="420" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Prolog and epilog</text>

    
    <rect x="95" y="445" width="425" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="307" y="485" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">GPUs visible and healthy</text>

    <rect x="540" y="445" width="370" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="725" y="485" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">ECC clean</text>

    <rect x="930" y="445" width="575" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1217" y="485" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no Xid since last job</text>

    
    <rect x="95" y="525" width="670" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="430" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">clocks nominal</text>

    <rect x="785" y="525" width="720" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1145" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no leftover processes</text>
  </g>

  
  <g id="layer-3">
    
    <rect x="70" y="645" width="1460" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <circle cx="116" cy="690" r="22" fill="#207448"/>
    <text x="116" y="699" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(155, 662)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M28 16 V28 H38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <text x="230" y="700" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Periodic checks</text>

    
    <rect x="95" y="735" width="445" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="317" y="780" text-anchor="middle" font-size="25" fill="#303a36">
      <tspan x="317" dy="0" font-family="monospace">dcgmi diag -r 1</tspan>
      <tspan x="317" dy="34" font-family="sans-serif">often</tspan>
    </text>

    
    <rect x="560" y="735" width="455" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="787" y="780" text-anchor="middle" font-size="25" fill="#303a36">
      <tspan x="787" dy="0" font-family="monospace">-r 2 or -r 3</tspan>
      <tspan x="787" dy="34" font-family="sans-serif">on a schedule</tspan>
    </text>

    
    <rect x="1035" y="735" width="470" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1270" y="780" text-anchor="middle" font-size="25" fill="#303a36">
      <tspan x="1270" dy="0" font-family="monospace">nccl-tests</tspan>
      <tspan x="1270" dy="34" font-family="sans-serif">pair and ring tests</tspan>
    </text>
  </g>

  
  <g id="layer-4">
    
    <rect x="70" y="905" width="1460" height="255" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <circle cx="116" cy="950" r="22" fill="#207448"/>
    <text x="116" y="959" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(155, 922)">
      <line x1="6" y1="46" x2="50" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M10 46 Q20 44 24 22 Q28 8 32 22 Q36 44 46 46" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="3.5" fill="#207448"/>
    </g>

    
    <text x="230" y="960" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Statistical outlier detection</text>

    
    <rect x="95" y="995" width="970" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="580" y="1052" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="580" dy="0">compare reference-step time, NCCL busbw, GPU clocks,</tspan>
      <tspan x="580" dy="36">temperatures with the fleet median</tspan>
    </text>

    
    <rect x="1085" y="995" width="420" height="135" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
    <path d="M1295 1018 v24 M1295 1018 h18 l-5 7 l5 7 h-18" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1295" y="1084" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">flag beyond 3 MAD</text>
  </g>
</svg>