<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Software limits under USE</title>
  <desc>Table detailing Resource, Utilisation, and Saturation metrics under software limits including CPU quota, Memory limit, Disk I/O limit, PIDs, and VM vCPUs.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Software limits under USE</text>

  
  
  <rect x="40" y="115" width="320" height="60" rx="8" fill="#207448"/>
  <text x="200" y="156" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f5f8f5">Resource</text>

  
  <rect x="380" y="115" width="540" height="60" rx="8" fill="#207448"/>
  <text x="650" y="156" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f5f8f5">Utilisation</text>

  
  <rect x="940" y="115" width="620" height="60" rx="8" fill="#207448"/>
  <text x="1250" y="156" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f5f8f5">Saturation</text>

  
  
  <rect x="40" y="195" width="320" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 232)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="4"/>
    <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="4"/>
    <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="4"/>
    <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="4"/>
    <line x1="48" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="4"/>
    <line x1="48" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="135" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU quota</text>

  
  <rect x="380" y="195" width="540" height="130" rx="8" fill="#e8f1ea"/>
  <text x="405" y="270" font-family="monospace" font-size="24" fill="#303a36">cpu.stat usage_usec vs cpu.max</text>

  
  <rect x="940" y="195" width="620" height="130" rx="8" fill="#e8f1ea"/>
  <text x="965" y="270" font-family="monospace" font-size="24" fill="#303a36">nr_throttled, throttled_usec, PSI cpu</text>

  
  
  <rect x="40" y="345" width="320" height="140" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 387)">
    <rect x="4" y="12" width="48" height="32" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="10" y="18" width="8" height="12" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="24" y="18" width="8" height="12" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="38" y="18" width="8" height="12" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="44" x2="12" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="44" x2="20" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="44" y1="44" x2="44" y2="50" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="135" y="425" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Memory limit</text>

  
  <rect x="380" y="345" width="540" height="140" rx="8" fill="#e8f1ea"/>
  <text x="405" y="425" font-family="monospace" font-size="24" fill="#303a36">memory.current vs memory.max</text>

  
  <rect x="940" y="345" width="620" height="140" rx="8" fill="#e8f1ea"/>
  <text x="965" y="405" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="965" dy="0">memory.events (high, max), PSI memory;</tspan>
    <tspan x="965" dy="40">errors oom_kill, exit 137</tspan>
  </text>

  
  
  <rect x="40" y="505" width="320" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 542)">
    <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M6,14 v14 c0,4.4 9.8,8 22,8 s22,-3.6 22,-8 v-14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M6,28 v14 c0,4.4 9.8,8 22,8 s22,-3.6 22,-8 v-14" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="135" y="580" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Disk I/O limit</text>

  
  <rect x="380" y="505" width="540" height="130" rx="8" fill="#e8f1ea"/>
  <text x="405" y="580" font-family="monospace" font-size="24" fill="#303a36">io.stat vs io.max</text>

  
  <rect x="940" y="505" width="620" height="130" rx="8" fill="#e8f1ea"/>
  <text x="965" y="580" font-family="monospace" font-size="24" fill="#303a36">io.pressure, latency growth</text>

  
  
  <rect x="40" y="655" width="320" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 692)">
    <circle cx="28" cy="12" r="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="12" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="44" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M28,20 v10 M28,30 L12,36 M28,30 L44,36" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="135" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">PIDs</text>

  
  <rect x="380" y="655" width="540" height="130" rx="8" fill="#e8f1ea"/>
  <text x="405" y="730" font-family="monospace" font-size="24" fill="#303a36">pids.current vs pids.max</text>

  
  <rect x="940" y="655" width="620" height="130" rx="8" fill="#e8f1ea"/>
  <text x="965" y="710" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="965" dy="0">fork failures,</tspan>
    <tspan x="965" dy="38">Resource temporarily unavailable</tspan>
  </text>

  
  
  <rect x="40" y="805" width="320" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 842)">
    <rect x="6" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="4"/>
    <circle cx="16" cy="17" r="3" fill="#207448"/>
    <circle cx="16" cy="39" r="3" fill="#207448"/>
    <line x1="28" y1="17" x2="42" y2="17" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="39" x2="42" y2="39" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="135" y="880" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">VM vCPUs</text>

  
  <rect x="380" y="805" width="540" height="130" rx="8" fill="#e8f1ea"/>
  <text x="405" y="880" font-family="sans-serif" font-size="24" fill="#303a36">guest CPU utilisation</text>

  
  <rect x="940" y="805" width="620" height="130" rx="8" fill="#e8f1ea"/>
  <text x="965" y="880" font-family="monospace" font-size="24" fill="#303a36">%steal, run queue</text>

  
  <rect x="40" y="965" width="1520" height="110" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <circle cx="95" cy="1020" r="28" fill="#db8129"/>
  
  <path d="M95,1004 v18 M95,1032 v4" stroke="#f5f8f5" stroke-width="5" stroke-linecap="round"/>
  
  <text x="145" y="1028" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">utilisation is measured against the limit, not against the physical resource.</text>
</svg>