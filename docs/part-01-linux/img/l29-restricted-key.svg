<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Restricting a key</title>
  <desc>Visual infographic explaining how to restrict an SSH authorized_keys line with options</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="9" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 2 L 16 9 L 2 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="9" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 2 L 16 9 L 2 16 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="90" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Restricting a key</text>

  
  <g>
    <rect x="60" y="150" width="680" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(90, 207)">
      <circle cx="28" cy="12" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="10" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="46" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="20" x2="28" y2="30" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="30" x2="46" y2="30" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="30" x2="10" y2="36" stroke="#207448" stroke-width="4" />
      <line x1="46" y1="30" x2="46" y2="36" stroke="#207448" stroke-width="4" />
    </g>
    <text x="175" y="222" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">from works only from</tspan>
      <tspan x="175" dy="42">the management subnet</tspan>
    </text>
  </g>

  
  <g>
    <rect x="860" y="150" width="680" height="170" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(890, 207)">
      <rect x="2" y="4" width="52" height="48" rx="6" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="2" y1="16" x2="54" y2="16" stroke="#db8129" stroke-width="4" />
      <path d="M 12 26 L 22 34 L 12 42" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="42" x2="42" y2="42" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="975" y="222" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="975" dy="0">command runs</tspan>
      <tspan x="975" dy="42">only one command</tspan>
    </text>
  </g>

  
  <line x1="400" y1="320" x2="400" y2="408" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1200" y1="320" x2="1200" y2="408" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g>
    <rect x="60" y="410" width="1480" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="90" y="475">from="10.0.0.0/8",command="/usr/local/bin/status-only",</tspan>
      <tspan x="90" y="545">no-port-forwarding,no-pty ssh-ed25519 AAAA... monitor@mgmt</tspan>
    </text>
  </g>

  
  <line x1="330" y1="670" x2="330" y2="592" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="810" y1="670" x2="810" y2="592" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1280" y1="670" x2="1280" y2="592" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="60" y="670" width="540" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(90, 727)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="11" y1="11" x2="45" y2="45" stroke="#207448" stroke-width="4" />
      <path d="M 18 28 L 38 28 M 30 20 L 38 28 L 30 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="165" y="765" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">no-port-forwarding</text>
  </g>

  
  <g>
    <rect x="640" y="670" width="340" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(670, 727)">
      <rect x="4" y="6" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="48" x2="40" y2="48" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="40" x2="28" y2="48" stroke="#207448" stroke-width="4" />
      <line x1="6" y1="8" x2="50" y2="38" stroke="#207448" stroke-width="4" />
    </g>
    <text x="750" y="765" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">no-pty</text>
  </g>

  
  <g>
    <rect x="1020" y="670" width="520" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1050, 727)">
      <circle cx="16" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="28" x2="42" y2="40" stroke="#207448" stroke-width="4" />
      <line x1="50" y1="28" x2="50" y2="36" stroke="#207448" stroke-width="4" />
    </g>
    <text x="1130" y="742" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1130" dy="0">the key itself</tspan>
      <tspan x="1130" dy="42">at the end</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="890" width="1480" height="80" rx="10" fill="#207448" />
    <text x="800" y="942" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">give monitoring a narrow capability instead of a shell</text>
  </g>
</svg>