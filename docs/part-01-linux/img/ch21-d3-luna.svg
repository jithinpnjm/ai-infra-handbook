<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <title>Syscall security gates: seccomp-bpf, DAC, and MAC (LSM)</title>
  <desc>Three layers checked when a process makes a system call: seccomp-bpf syscall filter, DAC (UID/mode/capabilities), and MAC via Linux Security Modules (SELinux or AppArmor).</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">Three security gates: seccomp, DAC, and MAC</text>

  <!-- Process box -->
  <rect x="40" y="210" width="270" height="240" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5"><rect x="150" y="238" width="48" height="36" rx="5"/><path d="M150 250h48"/></g>
  <text x="175" y="318" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">Process</text>
  <text x="175" y="362" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="175" dy="0">Makes syscall</tspan>
    <tspan x="175" dy="30" font-family="monospace">(open, mount,</tspan>
    <tspan x="175" dy="30" font-family="monospace">bpf, ptrace…)</tspan>
  </text>

  <path d="M310 330 H376" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Gate 1: seccomp-bpf -->
  <rect x="380" y="160" width="350" height="340" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <circle cx="425" cy="208" r="22" fill="#207448"/><text x="425" y="217" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">1</text>
  <text x="464" y="216" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">seccomp-bpf</text>
  <text x="408" y="268" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="408" dy="0">Filters syscall number + args</tspan>
    <tspan x="408" dy="34">(not pointer contents).</tspan>
    <tspan x="408" dy="42">Default profile blocks:</tspan>
    <tspan x="408" dy="32" font-family="monospace">mount, init_module,</tspan>
    <tspan x="408" dy="32" font-family="monospace">bpf, perf_event_open</tspan>
    <tspan x="408" dy="40">Requires no_new_privs.</tspan>
  </text>

  <path d="M730 330 H796" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Gate 2: DAC -->
  <rect x="800" y="160" width="350" height="340" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <circle cx="845" cy="208" r="22" fill="#207448"/><text x="845" y="217" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">2</text>
  <text x="884" y="216" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">DAC + Caps</text>
  <text x="826" y="268" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="826" dy="0">Discretionary access:</tspan>
    <tspan x="826" dy="34">UID / GID, mode bits, ACLs,</tspan>
    <tspan x="826" dy="34">and Linux capabilities.</tspan>
    <tspan x="826" dy="44">Owner sets permissions;</tspan>
    <tspan x="826" dy="34">root (or caps) bypasses it.</tspan>
  </text>

  <path d="M1150 330 H1206" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)"/>

  <!-- Gate 3: MAC (LSM) -->
  <rect x="1210" y="160" width="350" height="340" rx="18" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <circle cx="1255" cy="208" r="22" fill="#db8129"/><text x="1255" y="217" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="24" font-weight="700">3</text>
  <text x="1294" y="216" fill="#db8129" font-family="sans-serif" font-size="28" font-weight="700">MAC (LSM)</text>
  <text x="1238" y="268" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="1238" dy="0">Mandatory access control:</tspan>
    <tspan x="1238" dy="34">SELinux (labels/types) or</tspan>
    <tspan x="1238" dy="34">AppArmor (file paths).</tspan>
    <tspan x="1238" dy="44" font-weight="700">Even root is blocked if the</tspan>
    <tspan x="1238" dy="34" font-weight="700">policy does not allow it.</tspan>
  </text>

  <!-- Denial paths downward -->
  <path d="M555 500 V576" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#orange-arrow)"/>
  <path d="M970 500 V576" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#orange-arrow)"/>
  <path d="M1385 500 V576" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#orange-arrow)"/>

  <rect x="340" y="580" width="1220" height="165" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5"/>
  <text x="372" y="628" fill="#db8129" font-family="sans-serif" font-size="27" font-weight="700">Any gate can deny — MAC can only deny more (never grant past DAC)</text>
  <text x="372" y="672" fill="#303a36" font-family="monospace" font-size="24">
    <tspan x="372" dy="0">• seccomp: grep -E 'Seccomp|NoNewPrivs' /proc/self/status  (0 none, 2 filter)</tspan>
    <tspan x="372" dy="36">• LSMs:    cat /sys/kernel/security/lsm   |   ausearch -m avc -ts recent</tspan>
  </text>

  <!-- Takeaway bar -->
  <rect x="40" y="775" width="1520" height="90" rx="14" fill="#207448"/>
  <text x="800" y="830" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="26" font-weight="700">Like a parcel with two labels: DAC is the owner's label; MAC is the system-wide label that root cannot override.</text>
</svg>
