<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>A user crontab has five fields, and a system crontab adds a sixth for the user</title>
  <desc>Visual comparison showing that a user crontab contains five schedule fields plus a command, while a system crontab inserts a user field before the command.</desc>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A user crontab has five fields,</tspan>
    <tspan x="800" dy="56">and a system crontab adds a sixth for the user</tspan>
  </text>

  
  <g id="left-panel">
    <rect x="40" y="180" width="740" height="515" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g stroke="#207448" stroke-width="4" fill="none">
      <circle cx="106" cy="222" r="14" />
      <path d="M 84 252 C 84 238 94 234 106 234 C 118 234 128 238 128 252" stroke-linecap="round" />
    </g>
    
    <text x="146" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">User crontab (crontab -e)</text>

    
    
    <rect x="70" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="132" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">minute</text>

    
    <rect x="209" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="271" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">hour</text>

    
    <rect x="348" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="410" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="410" dy="0">day of</tspan>
      <tspan x="410" dy="30">month</tspan>
    </text>

    
    <rect x="487" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="549" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">month</text>

    
    <rect x="626" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="688" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="688" dy="0">day of</tspan>
      <tspan x="688" dy="30">week</tspan>
    </text>

    
    <rect x="70" y="376" width="680" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="410" y="416" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">command</text>

    
    <rect x="70" y="460" width="680" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <rect x="86" y="476" width="648" height="54" rx="6" fill="#f5f8f5" />
    <text x="410" y="512" text-anchor="middle" font-family="monospace" font-size="25" fill="#303a36">15 09 * * * /home/juser/bin/spmake</text>
    <text x="410" y="580" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="410" dy="0">No user field: the owner is the</tspan>
      <tspan x="410" dy="34">account that edits it</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    
    <rect x="820" y="180" width="740" height="515" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />

    
    <g stroke="#207448" stroke-width="4" fill="none">
      <circle cx="886" cy="225" r="14" />
      <path d="M 886 199 L 886 207 M 886 243 L 886 251 M 860 225 L 868 225 M 904 225 L 912 225 M 868 207 L 874 213 M 898 237 L 904 243 M 868 243 L 874 237 M 898 213 L 904 207" stroke-linecap="round" />
    </g>
    
    <text x="926" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">System crontab (/etc/crontab, /etc/cron.d/)</text>

    
    
    <rect x="850" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="912" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">minute</text>

    
    <rect x="989" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1051" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">hour</text>

    
    <rect x="1128" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1190" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1190" dy="0">day of</tspan>
      <tspan x="1190" dy="30">month</tspan>
    </text>

    
    <rect x="1267" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1329" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">month</text>

    
    <rect x="1406" y="280" width="124" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1468" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1468" dy="0">day of</tspan>
      <tspan x="1468" dy="30">week</tspan>
    </text>

    
    
    <rect x="850" y="376" width="220" height="64" rx="8" fill="#db8129" stroke="#db8129" stroke-width="2" />
    <text x="960" y="416" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">user</text>

    
    <rect x="1086" y="376" width="444" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1308" y="416" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">command</text>

    
    <rect x="850" y="460" width="680" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <rect x="866" y="476" width="648" height="54" rx="6" fill="#f5f8f5" />
    <text x="1190" y="512" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">42 6 * * * root /usr/local/bin/cleansystem</text>
    <text x="1190" y="580" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1190" dy="0">The sixth field names the user</tspan>
      <tspan x="1190" dy="34">the job runs as</tspan>
    </text>
  </g>

  
  
  <g id="storage-left">
    <rect x="40" y="720" width="740" height="88" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" fill="none">
      <ellipse cx="98" cy="748" rx="24" ry="10" />
      <path d="M 74 748 v 26 c 0 6 11 10 24 10 s 24 -4 24 -10 v -26" />
      <path d="M 74 761 c 0 6 11 10 24 10 s 24 -4 24 -10" />
    </g>
    <text x="146" y="772" font-family="monospace" font-size="24" fill="#303a36">crontab -e edits /var/spool/cron/</text>
  </g>

  
  <g id="storage-right">
    <rect x="820" y="720" width="740" height="88" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" fill="none">
      <ellipse cx="878" cy="748" rx="24" ry="10" />
      <path d="M 854 748 v 26 c 0 6 11 10 24 10 s 24 -4 24 -10 v -26" />
      <path d="M 854 761 c 0 6 11 10 24 10 s 24 -4 24 -10" />
    </g>
    <text x="926" y="772" font-family="monospace" font-size="24" fill="#303a36">/etc/cron.d/ files are owned by root</text>
  </g>

  
  <rect x="40" y="836" width="1520" height="64" rx="10" fill="#207448" />
  <text x="800" y="877" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Same schedule, one extra field for system files.</text>
</svg>