<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Subshell versus group</title>
  <desc>Infographic comparing subshell (commands ) and current shell group { commands; } execution in bash</desc>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="40" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Subshell versus group</text>

  
  <g id="left-panel">
    <rect x="40" y="110" width="740" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(68, 134)">
      <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
      <path d="M 10 26 L 18 32 L 10 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="24" y="24" width="22" height="15" rx="3" fill="none" stroke="#207448" stroke-width="2"/>
    </g>

    
    <text x="144" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#207448">(commands )</text>
    <text x="360" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">subshell</text>
    <text x="144" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">child copy of the shell</text>

    
    <rect x="68" y="235" width="684" height="525" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    <text x="96" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">example</text>

    
    <rect x="96" y="308" width="628" height="68" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="124" y="351" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">myvar=10</text>

    
    <text x="96" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">then</text>

    
    <rect x="96" y="434" width="628" height="68" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="124" y="477" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">( myvar=20 ); echo</text>

    
    <rect x="96" y="528" width="628" height="68" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="124" y="571" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">gives 10</text>

    
    <rect x="96" y="622" width="628" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="124" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">changes vanish</text>
  </g>

  
  <g id="right-panel">
    <rect x="820" y="110" width="740" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(848, 134)">
      <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
      <path d="M 18 24 C 14 24 12 27 12 30 C 12 32 10 33 8 33 C 10 33 12 34 12 36 C 12 39 14 42 18 42" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 38 24 C 42 24 44 27 44 30 C 44 32 46 33 48 33 C 46 33 44 34 44 36 C 44 39 42 42 38 42" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    
    <text x="924" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#207448">{ commands; }</text>
    <text x="1190" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">current shell</text>
    <text x="924" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">note the spaces and semicolon</text>

    
    <rect x="848" y="235" width="684" height="315" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    <rect x="876" y="260" width="628" height="64" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="904" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">myvar=30</text>

    <text x="876" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">then</text>

    <rect x="876" y="380" width="628" height="64" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="904" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#303a36">echo</text>

    <rect x="876" y="466" width="628" height="64" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
    <text x="904" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">gives 30</text>

    
    <rect x="848" y="570" width="684" height="190" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    <text x="876" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">use for one redirection:</text>

    <rect x="876" y="642" width="628" height="88" rx="8" fill="#f5f8f5" stroke="#d0e2d5" stroke-width="1.5"/>
    <text x="904" y="697" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#207448">{ echo a; echo b; } &gt; file</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="820" width="1520" height="96" rx="12" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(68, 843)">
      <circle cx="25" cy="25" r="22" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <line x1="25" y1="13" x2="25" y2="27" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="25" cy="36" r="2.5" fill="#db8129"/>
    </g>

    
    <text x="135" y="877" font-size="24" fill="#303a36">
      <tspan font-family="system-ui, -apple-system, sans-serif">each stage of a pipeline runs in its own subshell, so </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">echo hi | read x; echo &quot;$x&quot;</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> prints nothing</tspan>
    </text>
  </g>
</svg>