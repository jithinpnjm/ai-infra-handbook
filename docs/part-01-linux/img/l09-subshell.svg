<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Subshell versus group</title>
  <desc>Visual comparison between subshell execution in parentheses and command grouping in braces within the current shell.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Subshell versus group</text>

  
  <rect x="40" y="110" width="740" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(68, 130)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M12 16 L22 23 L12 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="26" y1="30" x2="38" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="140" y="164" fill="#207448" font-size="32" font-weight="bold">
    <tspan font-family="monospace">(commands )</tspan>
    <tspan font-family="sans-serif"> subshell</tspan>
  </text>

  
  <rect x="65" y="195" width="690" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 220)">
    
    <rect x="4" y="4" width="34" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M18 18 L46 18 L46 46 L18 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="4 2" />
  </g>
  <text x="165" y="259" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="bold">child copy of the shell</text>

  
  <rect x="65" y="325" width="690" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 385)">
    
    <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3" />
    <path d="M10 26 L18 32 L10 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="24" y1="38" x2="36" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="165" y="385" font-size="26">
    <tspan font-family="sans-serif" font-weight="bold" fill="#303a36">example </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">myvar=10</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> then</tspan>
  </text>
  <text x="165" y="445" font-size="26">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">( myvar=20 ); echo </tspan>
    <tspan font-family="sans-serif" fill="#303a36">gives </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">10</tspan>
  </text>

  
  <rect x="65" y="525" width="690" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 550)">
    
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="6 5" />
    <line x1="14" y1="14" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="165" y="589" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="bold">changes vanish</text>

  
  <rect x="820" y="110" width="740" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(848, 130)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="23" r="5" fill="#207448" />
    <line x1="28" y1="23" x2="44" y2="23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="920" y="164" fill="#207448" font-size="32" font-weight="bold">
    <tspan font-family="monospace">{ commands; }</tspan>
    <tspan font-family="sans-serif"> current shell</tspan>
  </text>

  
  <rect x="845" y="195" width="690" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(865, 220)">
    
    <rect x="4" y="8" width="48" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="4" y1="22" x2="52" y2="22" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="33" r="4" fill="#207448" />
  </g>
  <text x="945" y="259" font-size="26">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">myvar=30 </tspan>
    <tspan font-family="sans-serif" fill="#303a36">then </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">echo </tspan>
    <tspan font-family="sans-serif" fill="#303a36">gives </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">30</tspan>
  </text>

  
  <rect x="845" y="325" width="690" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(865, 350)">
    
    <rect x="2" y="2" width="52" height="50" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <text x="28" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">{ ; }</text>
  </g>
  <text x="945" y="389" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="bold">note the spaces and semicolon</text>

  
  <rect x="845" y="455" width="690" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(865, 515)">
    
    <path d="M12 6 L38 6 L48 16 L48 50 L12 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M38 6 L38 16 L48 16" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M0 32 L24 32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M16 24 L26 32 L16 40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="945" y="515" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="bold">use for one redirection:</text>
  <text x="945" y="575" fill="#207448" font-family="monospace" font-size="26" font-weight="bold">{ echo a; echo b; } &gt; file</text>

  
  <rect x="40" y="800" width="1520" height="140" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(70, 842)">
    <rect x="0" y="16" width="18" height="24" rx="3" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="18" y1="28" x2="38" y2="28" stroke="#db8129" stroke-width="4" />
    <rect x="38" y="16" width="18" height="24" rx="3" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="28" y1="6" x2="28" y2="50" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="150" y="855" fill="#303a36" font-family="sans-serif" font-size="26">each stage of a pipeline runs in its own subshell, so</text>
  <text x="150" y="905" font-size="26">
    <tspan fill="#db8129" font-family="monospace" font-weight="bold">echo hi | read x; echo "$x"</tspan>
    <tspan fill="#303a36" font-family="sans-serif"> prints nothing.</tspan>
  </text>
</svg>