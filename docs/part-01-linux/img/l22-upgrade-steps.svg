<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Safe driver upgrade on one node</title>
  <desc>Seven-step vertical flow for a safe GPU driver upgrade on a single node before fleet rollout.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Safe driver upgrade on one node</text>

  
  <line x1="800" y1="220" x2="800" y2="262" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="800" y1="372" x2="800" y2="414" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="800" y1="524" x2="800" y2="566" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="800" y1="676" x2="800" y2="718" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="800" y1="828" x2="800" y2="870" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="800" y1="980" x2="800" y2="1022" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="100" y="110" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="165" r="24" fill="#207448" />
    <text x="160" y="165" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(205, 137)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="8" y1="12" x2="8" y2="48" />
      <line x1="48" y1="12" x2="48" y2="48" />
      <line x1="4" y1="20" x2="52" y2="20" />
      <line x1="4" y1="36" x2="52" y2="36" />
      <line x1="16" y1="20" x2="24" y2="36" />
      <line x1="32" y1="20" x2="40" y2="36" />
      <line x1="4" y1="48" x2="12" y2="48" />
      <line x1="44" y1="48" x2="52" y2="48" />
    </g>
    <text x="285" y="175" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">cordon and drain</text>
  </g>

  
  <g>
    <rect x="100" y="262" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="317" r="24" fill="#207448" />
    <text x="160" y="317" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(205, 289)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="12" />
      <line x1="28" y1="6" x2="28" y2="12" />
      <line x1="28" y1="44" x2="28" y2="50" />
      <line x1="6" y1="28" x2="12" y2="28" />
      <line x1="44" y1="28" x2="50" y2="28" />
      <line x1="12" y1="12" x2="17" y2="17" />
      <line x1="39" y1="39" x2="44" y2="44" />
      <line x1="12" y1="44" x2="17" y2="39" />
      <line x1="39" y1="17" x2="44" y2="12" />
      <rect x="23" y="23" width="10" height="10" rx="1" fill="#207448" stroke="none" />
    </g>
    <text x="285" y="308" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">stop GPU consumers</text>
    <text x="285" y="344" font-family="sans-serif" font-size="24" fill="#303a36">(DCGM, Fabric Manager, persistence daemon)</text>
  </g>

  
  <g>
    <rect x="100" y="414" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="469" r="24" fill="#207448" />
    <text x="160" y="469" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(205, 441)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 20 L 28 9 L 48 20 L 48 42 L 28 52 L 8 42 Z" />
      <line x1="28" y1="29" x2="28" y2="52" />
      <line x1="8" y1="20" x2="28" y2="29" />
      <line x1="48" y1="20" x2="28" y2="29" />
      <line x1="28" y1="6" x2="28" y2="22" />
      <polyline points="22,16 28,22 34,16" />
    </g>
    <text x="285" y="460" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">install new driver packages</text>
    <text x="285" y="496" font-family="sans-serif" font-size="24" fill="#303a36">with matching Fabric Manager, toolkit, MOFED/DOCA</text>
  </g>

  
  <g>
    <rect x="100" y="566" width="1400" height="110" rx="14" fill="#fff5ec" stroke="#db8129" stroke-width="3.5" />
    <circle cx="160" cy="621" r="24" fill="#db8129" />
    <text x="160" y="621" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(205, 593)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="14" y="14" width="28" height="28" rx="4" />
      <rect x="22" y="22" width="12" height="12" rx="2" />
      <line x1="20" y1="6" x2="20" y2="14" />
      <line x1="28" y1="6" x2="28" y2="14" />
      <line x1="36" y1="6" x2="36" y2="14" />
      <line x1="20" y1="42" x2="20" y2="50" />
      <line x1="28" y1="42" x2="28" y2="50" />
      <line x1="36" y1="42" x2="36" y2="50" />
      <line x1="6" y1="20" x2="14" y2="20" />
      <line x1="6" y1="28" x2="14" y2="28" />
      <line x1="6" y1="36" x2="14" y2="36" />
      <line x1="42" y1="20" x2="50" y2="20" />
      <line x1="42" y1="28" x2="50" y2="28" />
      <line x1="42" y1="36" x2="50" y2="36" />
    </g>
    <text x="285" y="612" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">verify the module build for the target kernel</text>
    <text x="285" y="648" font-family="sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace" font-weight="bold" fill="#db8129">dkms status</tspan>)</text>
  </g>

  
  <g>
    <rect x="100" y="718" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="773" r="24" fill="#207448" />
    <text x="160" y="773" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(205, 745)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 26 A 18 18 0 1 1 38 15" />
      <polyline points="38,8 38,16 46,16" />
      <line x1="28" y1="18" x2="28" y2="30" />
    </g>
    <text x="285" y="783" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">reboot</text>
  </g>

  
  <g>
    <rect x="100" y="870" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="925" r="24" fill="#207448" />
    <text x="160" y="925" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    <g transform="translate(205, 897)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="10" width="32" height="40" rx="4" />
      <rect x="20" y="6" width="16" height="8" rx="2" />
      <polyline points="18,28 25,35 38,20" />
      <line x1="20" y1="42" x2="36" y2="42" />
    </g>
    <text x="285" y="916" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">validate</text>
    <text x="285" y="952" font-family="sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace" font-weight="bold" fill="#207448">nvidia-smi</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#207448">nvidia-smi topo -m</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#207448">dcgmi diag -r 2</tspan>, single-node NCCL test)</text>
  </g>

  
  <g>
    <rect x="100" y="1022" width="1400" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="160" cy="1077" r="24" fill="#207448" />
    <text x="160" y="1077" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    <g transform="translate(205, 1049)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="14" y="24" width="28" height="24" rx="4" />
      <path d="M 20 24 L 20 16 A 8 8 0 0 1 36 16 L 36 10" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
      <line x1="28" y1="36" x2="28" y2="41" />
    </g>
    <text x="285" y="1068" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">uncordon, roll out in waves,</text>
    <text x="285" y="1104" font-family="sans-serif" font-size="24" fill="#303a36">keep previous image for rollback</text>
  </g>
</svg>