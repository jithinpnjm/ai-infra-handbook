<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Which copy tool for which goal</title>
  <desc>Visual comparison mapping copy tools to their specific goals: scp, sftp host, rsync, tar pipe ssh, sshfs host:/path mnt, NFS, Samba, and cloud object store tools.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which copy tool for which goal</text>

  
  <g id="table-headers">
    <rect x="60" y="125" width="700" height="52" rx="10" fill="#207448"/>
    <text x="410" y="161" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Goal</text>

    <rect x="780" y="125" width="760" height="52" rx="10" fill="#207448"/>
    <text x="1160" y="161" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Tool</text>
  </g>

  
  <g id="row-1">
    <rect x="60" y="195" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="205" x2="770" y2="285" stroke="#e0ece3" stroke-width="2"/>
    
    
    <g transform="translate(90, 217)">
      <path d="M14,6 L34,6 L44,16 L44,42 L14,42 Z" stroke="#207448" stroke-width="3" fill="none"/>
      <path d="M6,14 L26,14 L36,24 L36,50 L6,50 Z" stroke="#207448" stroke-width="4" fill="#ffffff"/>
      <path d="M26,14 L26,24 L36,24" stroke="#207448" stroke-width="3" fill="none"/>
      <line x1="12" y1="32" x2="28" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="40" x2="24" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="170" y="255" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">one-off copy of a file or two</text>

    <rect x="800" y="217" width="160" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="880" y="254" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">scp</text>
  </g>

  
  <g id="row-2">
    <rect x="60" y="309" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="319" x2="770" y2="399" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 331)">
      <path d="M6,12 L22,12 L28,20 L48,20 L48,46 L6,46 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <circle cx="32" cy="31" r="9" stroke="#207448" stroke-width="3.5" fill="#ffffff"/>
      <line x1="39" y1="38" x2="47" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="170" y="369" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">interactive browsing</text>

    <rect x="800" y="331" width="240" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="920" y="368" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">sftp host</text>
  </g>

  
  <g id="row-3">
    <rect x="60" y="423" width="1480" height="120" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <line x1="770" y1="435" x2="770" y2="531" stroke="#f2d7bf" stroke-width="2"/>

    
    <g transform="translate(90, 455)">
      <path d="M12,28 A16,16 0 0,1 42,22" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round"/>
      <polyline points="33,14 43,22 34,29" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44,28 A16,16 0 0,1 14,34" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round"/>
      <polyline points="23,42 13,34 22,27" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="170" y="493" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">keep directory trees in step</text>

    
    <rect x="800" y="453" width="160" height="60" rx="8" fill="#db8129"/>
    <text x="880" y="493" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">rsync</text>

    
    <text x="984" y="473" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="984" dy="0">transfers only differences,</tspan>
      <tspan x="984" dy="30">preserves permissions, resumable</tspan>
    </text>
  </g>

  
  <g id="row-4">
    <rect x="60" y="557" width="1480" height="110" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="567" x2="770" y2="657" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 584)">
      <rect x="6" y="16" width="44" height="22" rx="4" stroke="#207448" stroke-width="4" fill="none"/>
      <line x1="6" y1="10" x2="6" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="10" x2="50" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="27" x2="34" y2="27" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="28,21 35,27 28,33" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="170" y="605" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">stream a tree with</tspan>
      <tspan x="170" dy="36">no temporary archive</tspan>
    </text>

    <rect x="800" y="584" width="240" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="920" y="621" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">tar | ssh</text>
  </g>

  
  <g id="row-5">
    <rect x="60" y="681" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="691" x2="770" y2="771" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 703)">
      <ellipse cx="28" cy="14" rx="20" ry="6" stroke="#207448" stroke-width="4" fill="none"/>
      <path d="M8,14 L8,32 A20,6 0 0,0 48,32 L48,14" stroke="#207448" stroke-width="4" fill="none"/>
      <line x1="28" y1="32" x2="28" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="18,42 28,50 38,42" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="170" y="741" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">mount remote directory</text>

    <rect x="800" y="703" width="430" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1015" y="740" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">sshfs host:/path mnt</text>
  </g>

  
  <g id="row-6">
    <rect x="60" y="795" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="805" x2="770" y2="885" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 817)">
      <circle cx="28" cy="27" r="7" stroke="#207448" stroke-width="4" fill="#ffffff"/>
      <circle cx="10" cy="14" r="5" stroke="#207448" stroke-width="3.5" fill="#ffffff"/>
      <circle cx="46" cy="14" r="5" stroke="#207448" stroke-width="3.5" fill="#ffffff"/>
      <circle cx="28" cy="45" r="5" stroke="#207448" stroke-width="3.5" fill="#ffffff"/>
      <line x1="14" y1="18" x2="23" y2="23" stroke="#207448" stroke-width="3"/>
      <line x1="42" y1="18" x2="33" y2="23" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="34" x2="28" y2="40" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="170" y="855" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">share among Linux machines</text>

    <rect x="800" y="817" width="160" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="880" y="854" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">NFS</text>
  </g>

  
  <g id="row-7">
    <rect x="60" y="909" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="919" x2="770" y2="999" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 931)">
      <rect x="6" y="8" width="44" height="34" rx="3" stroke="#207448" stroke-width="4" fill="none"/>
      <line x1="28" y1="8" x2="28" y2="42" stroke="#207448" stroke-width="3.5"/>
      <line x1="6" y1="25" x2="50" y2="25" stroke="#207448" stroke-width="3.5"/>
      <polyline points="16,49 28,45 40,49" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="170" y="969" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">share with Windows</text>

    <rect x="800" y="931" width="180" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="890" y="968" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">Samba</text>
  </g>

  
  <g id="row-8">
    <rect x="60" y="1023" width="1480" height="100" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
    <line x1="770" y1="1033" x2="770" y2="1113" stroke="#e0ece3" stroke-width="2"/>

    
    <g transform="translate(90, 1045)">
      <path d="M12,36 L44,36 A9,9 0 0,0 44,22 A13,13 0 0,0 23,16 A10,10 0 0,0 11,26 A7.5,7.5 0 0,0 12,36 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <rect x="15" y="42" width="10" height="8" rx="2" stroke="#207448" stroke-width="2.5" fill="none"/>
      <rect x="31" y="42" width="10" height="8" rx="2" stroke="#207448" stroke-width="2.5" fill="none"/>
    </g>

    <text x="170" y="1083" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">cloud object stores</text>

    <rect x="800" y="1045" width="600" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1100" y="1082" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">rclone, gcloud storage, aws s3</text>
  </g>
</svg>