<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GPU-Util 100 percent does not mean the GPU is working hard</title>
  <desc>Infographic contrasting 100 percent GPU utilisation caused by a tiny kernel versus saturated SM capacity, highlighting true productivity metrics such as MFU, tokens per second, and SM activity.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    GPU-Util 100 percent does not mean
    <tspan x="800" dy="55">the GPU is working hard</tspan>
  </text>

  

  
  <rect x="50" y="170" width="480" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 190)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="40" height="40" rx="4" />
    <line x1="16" y1="2" x2="16" y2="8" />
    <line x1="28" y1="2" x2="28" y2="8" />
    <line x1="40" y1="2" x2="40" y2="8" />
    <line x1="16" y1="48" x2="16" y2="54" />
    <line x1="28" y1="48" x2="28" y2="54" />
    <line x1="40" y1="48" x2="40" y2="54" />
    <line x1="2" y1="16" x2="8" y2="16" />
    <line x1="2" y1="28" x2="8" y2="28" />
    <line x1="2" y1="40" x2="8" y2="40" />
    <line x1="48" y1="16" x2="54" y2="16" />
    <line x1="48" y1="28" x2="54" y2="28" />
    <line x1="48" y1="40" x2="54" y2="40" />
    
    <rect x="14" y="38" width="8" height="4" fill="#207448" />
  </g>
  <text x="145" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    One tiny kernel
    <tspan x="145" dy="36">running all the time</tspan>
  </text>
  
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="420" height="110" rx="6" fill="#f5f8f5" stroke="#c8d6cb" stroke-width="1.5" />
    
    <line x1="0" y1="27" x2="420" y2="27" stroke="#e1eae2" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="55" x2="420" y2="55" stroke="#e1eae2" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="82" x2="420" y2="82" stroke="#e1eae2" stroke-width="1" stroke-dasharray="4 4" />
    
    <rect x="0" y="98" width="420" height="12" rx="2" fill="#207448" />
  </g>
  
  <rect x="80" y="415" width="420" height="60" rx="8" fill="#fef6ee" stroke="#db8129" stroke-width="2" />
  <text x="290" y="453" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">nvidia-smi GPU-Util: 100%</text>

  
  <g transform="translate(570, 345)" stroke="#303a36" stroke-width="6" stroke-linecap="round">
    <line x1="-22" y1="-12" x2="22" y2="-12" />
    <line x1="-22" y1="12" x2="22" y2="12" />
    <line x1="16" y1="-28" x2="-16" y2="28" stroke="#303a36" />
  </g>

  
  <rect x="610" y="170" width="480" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(635, 190)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="40" height="40" rx="4" />
    <line x1="16" y1="2" x2="16" y2="8" />
    <line x1="28" y1="2" x2="28" y2="8" />
    <line x1="40" y1="2" x2="40" y2="8" />
    <line x1="16" y1="48" x2="16" y2="54" />
    <line x1="28" y1="48" x2="28" y2="54" />
    <line x1="40" y1="48" x2="40" y2="54" />
    <line x1="2" y1="16" x2="8" y2="16" />
    <line x1="2" y1="28" x2="8" y2="28" />
    <line x1="2" y1="40" x2="8" y2="40" />
    <line x1="48" y1="16" x2="54" y2="16" />
    <line x1="48" y1="28" x2="54" y2="28" />
    <line x1="48" y1="40" x2="54" y2="40" />
    
    <rect x="14" y="14" width="8" height="8" fill="#207448" />
    <rect x="24" y="14" width="8" height="8" fill="#207448" />
    <rect x="34" y="14" width="8" height="8" fill="#207448" />
    <rect x="14" y="24" width="8" height="8" fill="#207448" />
    <rect x="24" y="24" width="8" height="8" fill="#207448" />
    <rect x="34" y="24" width="8" height="8" fill="#207448" />
    <rect x="14" y="34" width="8" height="8" fill="#207448" />
    <rect x="24" y="34" width="8" height="8" fill="#207448" />
    <rect x="34" y="34" width="8" height="8" fill="#207448" />
  </g>
  <text x="705" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Many SMs busy
    <tspan x="705" dy="36">with large kernels</tspan>
  </text>
  
  <g transform="translate(640, 275)">
    <rect x="0" y="0" width="420" height="110" rx="6" fill="#207448" stroke="#207448" stroke-width="1.5" />
    
    <line x1="0" y1="27" x2="420" y2="27" stroke="#2a8b57" stroke-width="1" />
    <line x1="0" y1="55" x2="420" y2="55" stroke="#2a8b57" stroke-width="1" />
    <line x1="0" y1="82" x2="420" y2="82" stroke="#2a8b57" stroke-width="1" />
  </g>
  
  <rect x="640" y="415" width="420" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="850" y="453" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">GPU-Util: 100%</text>

  
  <rect x="1120" y="170" width="430" height="350" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1307, 195)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <line x1="28" y1="24" x2="28" y2="38" stroke-width="4" />
    <circle cx="28" cy="16" r="2" fill="#207448" />
  </g>
  <text x="1335" y="295" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    GPU-Util only means
    <tspan x="1335" dy="38">a kernel was running on</tspan>
    <tspan x="1335" dy="38">at least one SM</tspan>
    <tspan x="1335" dy="38">during the sample</tspan>
  </text>

  

  
  <rect x="50" y="550" width="730" height="370" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 568)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 44 A 24 24 0 0 1 48 44" />
    <line x1="28" y1="44" x2="38" y2="24" stroke-width="4" />
    <circle cx="28" cy="44" r="4" fill="#207448" />
  </g>
  <text x="145" y="605" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Look at instead</text>

  
  <rect x="75" y="635" width="680" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="415" y="670" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
    achieved MFU and tokens/s
    <tspan x="415" dy="34">compared with what you expected</tspan>
  </text>

  
  <rect x="75" y="730" width="680" height="52" rx="8" fill="#f5f8f5" stroke="#c8d6cb" stroke-width="1.5" />
  <text x="415" y="765" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">SM activity and occupancy</text>

  
  <rect x="75" y="792" width="680" height="52" rx="8" fill="#f5f8f5" stroke="#c8d6cb" stroke-width="1.5" />
  <text x="415" y="827" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">tensor-core activity</text>

  
  <rect x="75" y="854" width="680" height="52" rx="8" fill="#f5f8f5" stroke="#c8d6cb" stroke-width="1.5" />
  <text x="415" y="889" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">memory bandwidth (DCGM DRAM activity)</text>

  
  <rect x="820" y="550" width="730" height="370" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="850" y="575" width="670" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(875, 602)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 44 A 24 24 0 0 1 48 44" />
    <line x1="28" y1="44" x2="44" y2="30" stroke-width="4" />
    <circle cx="28" cy="44" r="4" fill="#207448" />
  </g>
  <text x="955" y="626" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    When GPU-Util is high
    <tspan x="955" dy="36">but SM activity is low</tspan>
  </text>

  
  <line x1="1185" y1="685" x2="1185" y2="760" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />

  
  <rect x="850" y="765" width="670" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(875, 792)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="10" />
    <line x1="28" y1="12" x2="28" y2="16" />
    <line x1="28" y1="40" x2="28" y2="44" />
    <line x1="12" y1="28" x2="16" y2="28" />
    <line x1="40" y1="28" x2="44" y2="28" />
    <line x1="17" y1="17" x2="20" y2="20" />
    <line x1="36" y1="36" x2="39" y2="39" />
    <line x1="17" y1="39" x2="20" y2="36" />
    <line x1="36" y1="20" x2="39" y2="17" />
  </g>
  <text x="955" y="816" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    many small kernels:
    <tspan x="955" dy="36">CUDA graphs or compile</tspan>
  </text>

  
  <rect x="50" y="945" width="1500" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 977)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="6" width="36" height="44" rx="4" />
    <line x1="18" y1="18" x2="38" y2="18" />
    <line x1="18" y1="28" x2="38" y2="28" />
    <line x1="18" y1="38" x2="28" y2="38" />
  </g>
  <text x="145" y="996" font-family="sans-serif" font-size="24" fill="#303a36">
    MFU = achieved model FLOPs/s divided by peak hardware FLOPs/s (dense, precision-matched);
    <tspan x="145" dy="38">good LLM training values are well below 100% and depend on scale and model: use your own baseline</tspan>
  </text>

  
  <rect x="50" y="1085" width="1500" height="70" rx="10" fill="#207448" />
  <text x="800" y="1130" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Compare MFU and tokens per second, not utilisation</text>
</svg>