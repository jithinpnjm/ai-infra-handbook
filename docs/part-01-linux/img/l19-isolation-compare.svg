<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Containers, VMs and lighter options</title>
  <desc>Visual comparison table of isolation, kernel models, start times, and GPU access across virtualization options.</desc>

  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Containers, VMs and lighter options</text>

  
  
  <rect x="50" y="110" width="260" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="180" cy="155" r="24" fill="#207448" opacity="0.15"/>
  <path d="M168 155h24M180 143v24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="210" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Architecture</text>

  
  <rect x="330" y="110" width="295" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(453, 122)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="5" y="4" width="38" height="20" rx="3"/>
    <circle cx="13" cy="14" r="2" fill="#207448"/>
    <circle cx="21" cy="14" r="2" fill="#207448"/>
    <line x1="31" y1="14" x2="37" y2="14"/>
  </g>
  <text x="477" y="188" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Hardware VM</text>
  <text x="477" y="222" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">(KVM/QEMU)</text>

  
  <rect x="645" y="110" width="295" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(768, 122)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="5" y="5" width="38" height="24" rx="2"/>
    <line x1="14" y1="5" x2="14" y2="29"/>
    <line x1="24" y1="5" x2="24" y2="29"/>
    <line x1="34" y1="5" x2="34" y2="29"/>
  </g>
  <text x="792" y="205" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Container</text>

  
  <rect x="960" y="110" width="295" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1083, 122)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="6" width="32" height="22" rx="3"/>
    <path d="M24 10l-4 8h8l-4 8"/>
  </g>
  <text x="1107" y="188" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">MicroVM</text>
  <text x="1107" y="222" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">(Firecracker, Kata)</text>

  
  <rect x="1275" y="110" width="295" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1398, 122)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M24 6l16 6v10c0 11-8 18-16 22-8-4-16-11-16-22V12l16-6z"/>
    <path d="M17 24l5 5 9-10"/>
  </g>
  <text x="1422" y="205" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">gVisor</text>

  
  
  <rect x="50" y="260" width="260" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(70, 310)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="10" width="30" height="30" rx="4"/>
    <path d="M18 4v6M25 4v6M32 4v6M18 40v6M25 40v6M32 40v6M4 18h6M4 25h6M4 32h6M40 18h6M40 25h6M40 32h6"/>
    <circle cx="25" cy="25" r="4" fill="#207448"/>
  </g>
  <text x="135" y="347" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Kernel</text>

  
  <rect x="330" y="260" width="295" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="477" y="345" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">own guest</text>

  <rect x="645" y="260" width="295" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="792" y="345" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">shared host</text>

  <rect x="960" y="260" width="295" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1107" y="345" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">own minimal guest</text>

  <rect x="1275" y="260" width="295" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1422" y="325" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">Go kernel</text>
  <text x="1422" y="360" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">intercepting syscalls</text>

  
  
  <rect x="50" y="430" width="260" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(70, 465)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="20" width="30" height="24" rx="4"/>
    <path d="M17 20v-8a8 8 0 0 1 16 0v8"/>
    <circle cx="25" cy="31" r="3" fill="#207448"/>
  </g>
  <text x="135" y="501" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Isolation</text>

  
  <rect x="330" y="430" width="295" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="477" y="500" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">strong</text>

  <rect x="645" y="430" width="295" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="792" y="500" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">weaker</text>

  <rect x="960" y="430" width="295" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1107" y="500" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">strong</text>

  <rect x="1275" y="430" width="295" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1422" y="500" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">medium</text>

  
  
  <rect x="50" y="570" width="260" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(70, 610)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="25" cy="25" r="19"/>
    <polyline points="25,14 25,25 33,25"/>
  </g>
  <text x="135" y="646" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Start time</text>

  
  <rect x="330" y="570" width="295" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="477" y="645" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">seconds</text>

  <rect x="645" y="570" width="295" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="792" y="645" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">milliseconds</text>

  <rect x="960" y="570" width="295" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1107" y="645" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">about 100 to 200 ms</text>

  <rect x="1275" y="570" width="295" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1422" y="645" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">milliseconds</text>

  
  
  <rect x="50" y="720" width="260" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(68, 775)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="6" y="10" width="38" height="26" rx="3"/>
    <circle cx="25" cy="23" r="6"/>
    <line x1="12" y1="36" x2="12" y2="42"/>
    <line x1="20" y1="36" x2="20" y2="42"/>
    <line x1="28" y1="36" x2="28" y2="42"/>
  </g>
  <text x="126" y="812" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">GPU access</text>

  
  <rect x="330" y="720" width="295" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="477" y="785" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">passthrough or</text>
  <text x="477" y="825" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">vGPU/MIG</text>

  
  <rect x="645" y="720" width="295" height="160" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
  <text x="792" y="785" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">native driver via</text>
  <text x="792" y="825" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">device nodes</text>

  <rect x="960" y="720" width="295" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1107" y="785" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">possible but</text>
  <text x="1107" y="825" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">complex</text>

  <rect x="1275" y="720" width="295" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1422" y="810" text-anchor="middle" font-family="sans-serif" font-size="25px" fill="#303a36">limited</text>

  
  <rect x="50" y="920" width="1520" height="85" rx="16" fill="#207448"/>
  <text x="810" y="972" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">decide early whether the isolation needs a hardware boundary</text>
</svg>