<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>When X is too slow</title>
  <desc>Comparison table of remote display protocols and alternatives when X11 forwarding is too slow</desc>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="60" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">When X is too slow</text>

  
  <rect x="60" y="110" width="1480" height="74" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="122" width="56" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="113" y1="160" x2="113" y2="170" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="101" y1="170" x2="125" y2="170" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 97 148 L 105 138 L 115 147 L 123 139 L 131 148" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#303a36">these send compressed images of the screen instead of drawing commands.</text>

  
  <rect x="60" y="206" width="1480" height="52" rx="8" fill="#207448"/>
  <text x="90" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Tool</text>
  <text x="480" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Key note</text>

  
  <rect x="60" y="270" width="1480" height="136" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <line x1="450" y1="270" x2="450" y2="406" stroke="#e8f1ea" stroke-width="2"/>
  
  <rect x="85" y="310" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="85" y1="324" x2="141" y2="324" stroke="#207448" stroke-width="3"/>
  <circle cx="95" cy="317" r="2.5" fill="#207448"/>
  <circle cx="103" cy="317" r="2.5" fill="#207448"/>
  <path d="M 107 332 L 107 348 L 113 343 L 118 350 L 122 347 L 117 341 L 124 341 Z" fill="#207448"/>
  <text x="160" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">VNC (TigerVNC)</text>
  <text x="480" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">very common, scaling and compression, any X application works,</text>
  
  <rect x="480" y="338" width="650" height="46" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2"/>
  <text x="498" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">not multi-user: everyone sees one user's desktop</text>

  
  <rect x="60" y="418" width="1480" height="126" rx="12" fill="#fbfdfb" stroke="#c8dcd0" stroke-width="2"/>
  <line x1="450" y1="418" x2="450" y2="544" stroke="#e8f1ea" stroke-width="2"/>
  
  <rect x="85" y="452" width="40" height="34" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="99" y="466" width="42" height="34" rx="3" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <line x1="99" y1="483" x2="141" y2="483" stroke="#207448" stroke-width="3"/>
  <line x1="120" y1="466" x2="120" y2="500" stroke="#207448" stroke-width="3"/>
  <text x="160" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">RDP</text>
  <text x="480" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Windows remote desktop, simultaneous users,</text>
  <text x="480" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">closed protocol, Linux servers rare</text>

  
  <rect x="60" y="556" width="1480" height="126" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <line x1="450" y1="556" x2="450" y2="682" stroke="#e8f1ea" stroke-width="2"/>
  
  <rect x="85" y="590" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="85" y1="604" x2="141" y2="604" stroke="#207448" stroke-width="3"/>
  <path d="M 97 615 L 105 621 L 97 627" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="110" y1="627" x2="122" y2="627" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="628" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">x2go</text>
  <text x="480" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">open, derived from NoMachine NX,</text>
  <text x="480" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">no separate server service, connects over SSH</text>

  
  <rect x="60" y="694" width="1480" height="126" rx="12" fill="#fbfdfb" stroke="#c8dcd0" stroke-width="2"/>
  <line x1="450" y1="694" x2="450" y2="820" stroke="#e8f1ea" stroke-width="2"/>
  
  <rect x="85" y="728" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="95" y1="743" x2="125" y2="743" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="132" cy="743" r="2.5" fill="#207448"/>
  <line x1="95" y1="758" x2="125" y2="758" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="132" cy="758" r="2.5" fill="#207448"/>
  <text x="160" y="766" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">NoMachine NX</text>
  <text x="480" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">commercial origin,</text>
  <text x="480" y="782" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">free server allows two simultaneous users</text>

  
  <rect x="60" y="832" width="1480" height="126" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <line x1="450" y1="832" x2="450" y2="958" stroke="#e8f1ea" stroke-width="2"/>
  
  <rect x="85" y="866" width="42" height="44" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="106" cy="888" r="6" fill="#207448"/>
  <path d="M 134 875 A 16 16 0 0 1 134 901" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140 869 A 24 24 0 0 1 140 907" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="160" y="904" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">SPICE</text>
  <text x="480" y="880" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">another remote display protocol,</text>
  <text x="480" y="920" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">less widespread</text>

  
  <rect x="60" y="976" width="1480" height="88" rx="12" fill="#207448"/>
  
  <ellipse cx="98" cy="1020" rx="10" ry="18" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <path d="M 98 1002 L 130 1002 A 10 18 0 0 1 130 1038 L 98 1038" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <ellipse cx="130" cy="1020" rx="10" ry="18" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <path d="M 88 1020 L 140 1020 M 132 1014 L 140 1020 L 132 1026" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="1029" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">for Jupyter and TensorBoard, run the service on the node and tunnel its port over SSH.</text>
</svg>