<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Field Splitting: Single Delimiter in cut Versus Whitespace Collapsing in awk</title>
  <desc>Visual comparison demonstrating how cut treats each individual space as a field delimiter producing empty fields, whereas awk collapses contiguous whitespace runs into single delimiters.</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 38px; font-weight: bold; fill: #207448; }
      .sect-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: bold; fill: #207448; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #303a36; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #303a36; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 26px; fill: #303a36; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 26px; font-weight: bold; fill: #303a36; }
      .text-white { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; }
      .text-error { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 24px; font-weight: bold; fill: #b91c1c; }
      .text-success { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 24px; font-weight: bold; fill: #15803d; }
    </style>

    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <g id="header">
    <rect x="50" y="24" width="1500" height="70" rx="12" fill="#e8f1ea"/>
    <text x="800" y="72" text-anchor="middle" class="title">Field Splitting: Single Delimiter in cut Versus Whitespace Collapsing in awk</text>
  </g>

  
  <g id="input-container">
    <rect x="50" y="110" width="1500" height="135" rx="12" fill="#ffffff" stroke="#cbdcd0" stroke-width="2"/>
    <text x="80" y="152" class="text-bold">A single text line from a ps table:</text>
    <rect x="80" y="172" width="670" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="100" y="208" class="text-mono-bold">root&#160;&#160;&#160;&#160;&#160;&#160;1024&#160;&#160;0.0&#160;&#160;0.1&#160;slurmd</text>
    <text x="775" y="206" class="text-regular">where 'root' and '1024' are separated by six space characters.</text>
  </g>

  
  <g id="cut-container">
    <rect x="50" y="265" width="1500" height="400" rx="12" fill="#ffffff" stroke="#cbdcd0" stroke-width="2"/>

    
    <rect x="80" y="285" width="220" height="48" rx="8" fill="#db8129"/>
    <text x="190" y="318" text-anchor="middle" class="text-white">cut -d" "</text>
    <text x="325" y="318" class="text-regular">each individual space character forms a delimiter boundary</text>

    
    
    <rect x="80" y="355" width="245" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="202" y="440" text-anchor="middle" class="text-bold">Field 1 contains 'root'</text>

    
    <rect x="340" y="355" width="230" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="455" y="420" text-anchor="middle" class="text-regular">Delimiter 1 creates</text>
    <text x="455" y="460" text-anchor="middle" class="text-regular">empty Field 2 ('')</text>

    
    <rect x="585" y="355" width="230" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="700" y="420" text-anchor="middle" class="text-regular">Delimiter 2 creates</text>
    <text x="700" y="460" text-anchor="middle" class="text-regular">empty Field 3 ('')</text>

    
    <rect x="830" y="355" width="375" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1017" y="420" text-anchor="middle" class="text-regular">Delimiters 3 through 5 create</text>
    <text x="1017" y="460" text-anchor="middle" class="text-regular">empty Fields 4, 5, and 6 ('')</text>

    
    <rect x="1220" y="355" width="300" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1370" y="420" text-anchor="middle" class="text-bold">Delimiter 6 leaves</text>
    <text x="1370" y="460" text-anchor="middle" class="text-bold">'1024' in Field 7</text>

    
    <rect x="80" y="540" width="1440" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    
    <g transform="translate(115, 563)">
      <circle cx="25" cy="25" r="23" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
      <line x1="16" y1="16" x2="34" y2="34" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <line x1="34" y1="16" x2="16" y2="34" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="185" y="599" class="text-error">cut -d" " -f2 returns empty string (fails to extract PID)</text>
  </g>

  
  <g id="awk-container">
    <rect x="50" y="685" width="1500" height="435" rx="12" fill="#ffffff" stroke="#cbdcd0" stroke-width="2"/>

    
    <rect x="80" y="705" width="320" height="48" rx="8" fill="#207448"/>
    <text x="240" y="738" text-anchor="middle" class="text-white">awk default splitting</text>
    <text x="420" y="738" class="text-regular">contiguous whitespace runs are collapsed into a single delimiter, and leading whitespace is stripped</text>

    
    
    <rect x="80" y="780" width="170" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="165" y="845" text-anchor="middle" class="text-bold">Box $1</text>
    <text x="165" y="885" text-anchor="middle" class="text-bold">contains 'root'</text>

    
    <path d="M 250 852 L 320 852" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="320" y="780" width="280" height="145" rx="8" fill="#f5f8f5" stroke="#cbdcd0" stroke-width="1.5"/>
    <text x="460" y="828" text-anchor="middle" class="text-regular">Six collapsed spaces</text>
    <text x="460" y="865" text-anchor="middle" class="text-regular">lead directly to Box $2</text>
    <text x="460" y="902" text-anchor="middle" class="text-regular">containing '1024'</text>
    <path d="M 600 852 L 670 852" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="670" y="780" width="260" height="145" rx="8" fill="#f5f8f5" stroke="#cbdcd0" stroke-width="1.5"/>
    <text x="800" y="845" text-anchor="middle" class="text-regular">Two collapsed spaces</text>
    <text x="800" y="885" text-anchor="middle" class="text-regular">lead to Box $3 containing '0.0'</text>
    <path d="M 930 852 L 990 852" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="990" y="780" width="260" height="145" rx="8" fill="#f5f8f5" stroke="#cbdcd0" stroke-width="1.5"/>
    <text x="1120" y="845" text-anchor="middle" class="text-regular">Two collapsed spaces</text>
    <text x="1120" y="885" text-anchor="middle" class="text-regular">lead to Box $4 containing '0.1'</text>
    <path d="M 1250 852 L 1310 852" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="1310" y="780" width="210" height="145" rx="8" fill="#f5f8f5" stroke="#cbdcd0" stroke-width="1.5"/>
    <text x="1415" y="830" text-anchor="middle" class="text-regular">One space</text>
    <text x="1415" y="868" text-anchor="middle" class="text-regular">leads to Box $5</text>
    <text x="1415" y="905" text-anchor="middle" class="text-regular">containing 'slurmd'</text>

    
    <rect x="80" y="955" width="1440" height="95" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    
    <g transform="translate(115, 978)">
      <circle cx="25" cy="25" r="23" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <path d="M 15 26 L 22 33 L 35 18" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="185" y="1014" class="text-success">awk "{print $2, $5}" returns 1024 slurmd</text>
  </g>
</svg>