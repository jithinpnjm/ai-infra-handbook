<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110">
  <title>Reading chronyc: is this node's clock trustworthy?</title>
  <desc>Visual guide to evaluating node clock synchronization and trustworthiness using chronyc tracking, chronyc sources, and fleet health criteria.</desc>

  
  <rect width="1600" height="1110" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading chronyc: is this node's clock trustworthy?</text>

  
  <rect x="50" y="115" width="720" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="102" cy="162" r="22" />
    <polyline points="102,148 102,162 114,162" />
  </g>
  <text x="145" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="bold" fill="#207448">chronyc tracking</text>

  
  <rect x="75" y="205" width="670" height="150" rx="10" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  <text x="95" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">System time : 0.000012345 seconds</tspan>
    <tspan x="95" dy="30">fast of NTP time</tspan>
  </text>
  <text x="95" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="95" dy="0">On a LAN, microseconds to low</tspan>
    <tspan x="95" dy="28">milliseconds is good</tspan>
  </text>

  
  <rect x="75" y="370" width="670" height="100" rx="10" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  <text x="95" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">Last offset</text>
  <text x="430" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">RMS offset</text>
  <text x="95" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">Frequency (drift in ppm)</text>

  
  <rect x="75" y="485" width="670" height="90" rx="10" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  <text x="95" y="522" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">Leap status : Normal</text>
  <text x="95" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Leap status must be Normal</text>

  
  <rect x="75" y="590" width="670" height="110" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="95" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">Stratum</text>
  <text x="95" y="658" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="95" dy="0">Stratum 16 or Not synchronised</tspan>
    <tspan x="95" dy="28">means no usable source exists</tspan>
  </text>

  
  <rect x="830" y="115" width="720" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="882" cy="150" r="7" />
    <circle cx="868" cy="174" r="7" />
    <circle cx="896" cy="174" r="7" />
    <line x1="882" y1="157" x2="872" y2="168" />
    <line x1="882" y1="157" x2="892" y2="168" />
  </g>
  <text x="925" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="bold" fill="#207448">chronyc sources -v</text>

  
  <rect x="855" y="205" width="670" height="240" rx="10" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  
  <rect x="870" y="215" width="640" height="46" rx="6" fill="#f5f8f5" />
  <text x="890" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">^* current best source</text>

  <rect x="870" y="270" width="640" height="46" rx="6" fill="#ffffff" />
  <text x="890" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">^+ acceptable</text>

  <rect x="870" y="325" width="640" height="46" rx="6" fill="#f5f8f5" />
  <text x="890" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">^- excluded</text>

  <rect x="870" y="380" width="640" height="46" rx="6" fill="#ffffff" />
  <text x="890" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">^? unreachable</text>

  
  <rect x="855" y="460" width="670" height="240" rx="10" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  <text x="880" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="880" dy="0">Reach is octal: 377 = the last 8 polls</tspan>
    <tspan x="880" dy="38">all succeeded; Reach 0 with a firewall</tspan>
    <tspan x="880" dy="38">blocking UDP 123</tspan>
  </text>

  
  <rect x="50" y="735" width="1500" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 102,752 L 122,760 L 122,776 C 122,789 102,798 102,798 C 102,798 82,789 82,776 L 82,760 Z" />
    <line x1="102" y1="765" x2="102" y2="777" />
    <circle cx="102" cy="784" r="1.5" fill="#207448" />
  </g>
  <text x="160" y="782" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">Fail a node when the tracking offset exceeds a threshold such as 100 ms</tspan>
    <tspan x="160" dy="34">or leap status is not normal; drain it before Slurm or Munge starts rejecting it</tspan>
  </text>

  
  <rect x="50" y="870" width="1500" height="105" rx="12" fill="#ffffff" stroke="#cadad0" stroke-width="1.5" />
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="895" width="44" height="34" rx="5" />
    <path d="M 90,906 L 96,912 L 90,918 M 102,918 L 112,918" stroke-width="3" />
  </g>
  <text x="160" y="915" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">
    <tspan x="160" dy="0" font-weight="bold">Other checks: chronyc sourcestats, chronyc activity,</tspan>
    <tspan x="160" dy="34">chronyc clients (on a server), timedatectl timesync-status (for timesyncd)</tspan>
  </text>

  
  <rect x="50" y="995" width="1500" height="75" rx="10" fill="#207448" />
  <text x="800" y="1042" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Read chronyc tracking first</text>
</svg>