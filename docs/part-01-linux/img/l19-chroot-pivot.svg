<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>chroot versus pivot_root</title>
  <desc>Visual comparison between chroot(2) and pivot_root(2) container root filesystem switching</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">chroot versus pivot_root</text>

  
  <g id="left-panel">
    <rect x="60" y="110" width="710" height="895" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <path d="M 100 157 L 118 157 L 126 167 L 152 167 A 4 4 0 0 1 156 171 L 156 193 A 4 4 0 0 1 152 197 L 100 197 A 4 4 0 0 1 96 193 L 96 161 A 4 4 0 0 1 100 157 Z" stroke="#207448" stroke-width="4" fill="none" />
    <line x1="96" y1="173" x2="156" y2="173" stroke="#207448" stroke-width="3" />
    <text x="175" y="186" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">chroot(2)</text>

    
    <g id="node-chroot-1">
      <rect x="95" y="225" width="640" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="127" y="284" width="52" height="48" rx="6" stroke="#207448" stroke-width="4" fill="none" />
      <line x1="127" y1="298" x2="179" y2="298" stroke="#207448" stroke-width="3" />
      <circle cx="137" cy="291" r="2.5" fill="#207448" />
      <circle cx="145" cy="291" r="2.5" fill="#207448" />
      <path d="M 143 318 L 153 308 L 163 318" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="153" y1="308" x2="153" y2="324" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <text x="210" y="295" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="210" dy="0">changes a process's</tspan>
        <tspan x="210" dy="40">root directory</tspan>
      </text>
    </g>

    
    <g id="node-chroot-2">
      <rect x="95" y="430" width="640" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <path d="M 132 522 L 158 522 L 172 536 L 172 568 A 4 4 0 0 1 168 572 L 132 572 A 4 4 0 0 1 128 568 L 128 526 A 4 4 0 0 1 132 522 Z" stroke="#207448" stroke-width="4" fill="none" />
      <path d="M 158 522 L 158 536 L 172 536" stroke="#207448" stroke-width="3" fill="none" />
      <circle cx="144" cy="554" r="6" stroke="#207448" stroke-width="3" fill="none" />
      <path d="M 148 550 L 164 538" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <text x="210" y="515" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="210" dy="0">the old root can stay</tspan>
        <tspan x="210" dy="38">reachable through</tspan>
        <tspan x="210" dy="38">open file descriptors</tspan>
      </text>
    </g>

    
    <g id="node-chroot-3">
      <rect x="95" y="705" width="640" height="240" rx="12" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
      <path d="M 153 790 L 177 799 C 177 823 167 837 153 843 C 139 837 129 823 129 799 Z" stroke="#db8129" stroke-width="4" fill="none" />
      <line x1="153" y1="802" x2="153" y2="822" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="153" cy="831" r="2.5" fill="#db8129" />
      <text x="210" y="832" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">not a security boundary</text>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="830" y="110" width="710" height="435" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="883" cy="173" r="14" stroke="#207448" stroke-width="4" fill="none" />
    <circle cx="919" cy="173" r="14" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M 883 154 C 895 146 907 146 919 154" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 919 192 C 907 200 895 200 883 192" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none" />
    <text x="945" y="186" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">pivot_root(2)</text>

    
    <g id="node-pivot-1">
      <rect x="865" y="220" width="640" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="897" y="261" width="52" height="52" rx="8" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" fill="none" />
      <rect x="909" y="273" width="28" height="28" rx="4" stroke="#207448" stroke-width="4" fill="none" />
      <text x="975" y="278" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="975" dy="0">used by container runtimes</tspan>
        <tspan x="975" dy="36">inside a mount namespace</tspan>
      </text>
    </g>

    
    <g id="node-pivot-2">
      <rect x="865" y="375" width="640" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <ellipse cx="923" cy="435" rx="20" ry="8" stroke="#207448" stroke-width="3.5" fill="none" />
      <path d="M 903 435 L 903 449 A 20 8 0 0 0 943 449 L 943 435" stroke="#207448" stroke-width="3.5" fill="none" />
      <path d="M 903 449 L 903 463 A 20 8 0 0 0 943 463 L 943 449" stroke="#207448" stroke-width="3.5" fill="none" />
      <path d="M 935 448 L 947 448 L 947 436" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="975" y="420" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="975" dy="0">swaps the root mount so</tspan>
        <tspan x="975" dy="36">the old root can be unmounted</tspan>
        <tspan x="975" dy="36">and detached completely</tspan>
      </text>
    </g>
  </g>

  
  <g id="sequence-panel">
    <rect x="830" y="575" width="710" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g id="seq-step-1">
      <rect x="865" y="600" width="640" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="905" cy="630" r="24" fill="#207448" />
      <text x="905" y="630" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
      <text x="950" y="638" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">new mount namespace</text>
    </g>

    
    <line x1="1185" y1="660" x2="1185" y2="680" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="seq-step-2">
      <rect x="865" y="680" width="640" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="905" cy="710" r="24" fill="#207448" />
      <text x="905" y="710" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
      <text x="950" y="718" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">make mounts private</text>
    </g>

    
    <line x1="1185" y1="740" x2="1185" y2="760" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="seq-step-3">
      <rect x="865" y="760" width="640" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="905" cy="790" r="24" fill="#207448" />
      <text x="905" y="790" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
      <text x="950" y="798" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">bind-mount new rootfs onto itself</text>
    </g>

    
    <line x1="1185" y1="820" x2="1185" y2="840" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="seq-step-4">
      <rect x="865" y="840" width="640" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="905" cy="870" r="24" fill="#207448" />
      <text x="905" y="870" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
      <text x="950" y="878" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">mount proc, sysfs and tmpfs</text>
    </g>

    
    <line x1="1185" y1="900" x2="1185" y2="920" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="seq-step-5">
      <rect x="865" y="920" width="640" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="905" cy="950" r="24" fill="#207448" />
      <text x="905" y="950" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
      <text x="950" y="958" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">pivot_root</text>
    </g>
  </g>
</svg>