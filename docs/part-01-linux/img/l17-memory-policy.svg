<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Memory policy by node type</title>
  <desc>Memory policy by node type</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="82" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Memory policy by node type</text>

  
  <rect x="50" y="130" width="1500" height="64" rx="12" fill="#207448" />
  <text x="80" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Node type</text>
  <text x="430" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Swap</text>
  <text x="630" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Swappiness</text>
  <text x="800" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">THP</text>
  <text x="1050" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Limits</text>

  
  <rect x="50" y="214" width="1500" height="184" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(74, 258)">
    <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#db8129" stroke-width="4" />
    <rect x="18" y="18" width="20" height="20" rx="3" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="20" y1="0" x2="20" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="0" x2="28" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="0" x2="36" y2="8" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="48" x2="20" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="48" x2="28" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="48" x2="36" y2="56" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="20" x2="8" y2="20" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="8" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="36" x2="8" y2="36" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="20" x2="56" y2="20" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="28" x2="56" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="36" x2="56" y2="36" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="146" y="294" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="146" dy="0">Training or</tspan>
    <tspan x="146" dy="38">HPC compute</tspan>
  </text>
  <text x="430" y="312" font-family="sans-serif" font-size="26" fill="#303a36">none or minimal</text>
  <text x="630" y="312" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">0 to 10</text>
  <text x="800" y="312" font-family="sans-serif" font-size="26" fill="#303a36">always or madvise</text>
  <text x="1050" y="294" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1050" dy="0">cgroup memory.max per job,</tspan>
    <tspan x="1050" dy="36">memlock unlimited</tspan>
  </text>

  
  <rect x="50" y="422" width="1500" height="184" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(74, 466)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="146" y="502" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="146" dy="0">Inference or</tspan>
    <tspan x="146" dy="38">latency-critical</tspan>
  </text>
  <text x="430" y="520" font-family="sans-serif" font-size="26" fill="#303a36">none</text>
  <text x="630" y="520" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">0 to 10</text>
  <text x="800" y="520" font-family="sans-serif" font-size="26" fill="#303a36">madvise or never</text>
  <text x="1050" y="502" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1050" dy="0">per-service limits,</tspan>
    <tspan x="1050" dy="36">memory.high as early warning</tspan>
  </text>

  
  <rect x="50" y="630" width="1500" height="184" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(74, 674)">
    <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3" />
    <polyline points="14,28 22,34 14,40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="40" x2="40" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="146" y="710" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="146" dy="0">Login or</tspan>
    <tspan x="146" dy="38">shared nodes</tspan>
  </text>
  <text x="430" y="710" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="430" dy="0">small swap,</tspan>
    <tspan x="430" dy="36">maybe zram</tspan>
  </text>
  <text x="630" y="728" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">10 to 60</text>
  <text x="800" y="728" font-family="sans-serif" font-size="26" fill="#303a36">default</text>
  <text x="1050" y="728" font-family="monospace" font-size="24" fill="#303a36">per-user slice MemoryMax</text>

  
  <rect x="50" y="838" width="1500" height="184" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(74, 882)">
    <rect x="6" y="8" width="18" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="32" y="8" width="18" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="19" y="30" width="18" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="24" y1="17" x2="32" y2="17" stroke="#207448" stroke-width="3" />
    <line x1="15" y1="26" x2="23" y2="30" stroke="#207448" stroke-width="3" />
    <line x1="41" y1="26" x2="33" y2="30" stroke="#207448" stroke-width="3" />
  </g>
  <text x="146" y="918" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="146" dy="0">Kubernetes</tspan>
    <tspan x="146" dy="38">workers</tspan>
  </text>
  <text x="430" y="936" font-family="sans-serif" font-size="26" fill="#303a36">usually off</text>
  <text x="630" y="936" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">low</text>
  <text x="800" y="936" font-family="sans-serif" font-size="26" fill="#303a36">per workload</text>
  <text x="1050" y="918" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1050" dy="0">systemReserved, kubeReserved,</tspan>
    <tspan x="1050" dy="36">QoS classes</tspan>
  </text>

  
  <rect x="50" y="1054" width="1500" height="80" rx="12" fill="#207448" />
  <text x="800" y="1104" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">start from your row and change it only after you measure.</text>
</svg>