<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Little's law with two worked examples: how many are in flight</title>
  <desc>Infographic explaining Little's Law with two worked examples: service concurrency and GPU batch scheduler, Kendall notation, and AI serving sizing rules.</desc>

  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Little's law with two worked examples: how many are in flight</text>

  
  <g id="top-formula-bar">
    <rect x="40" y="105" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="148" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">L = lambda x W: the average number of items in a system equals the arrival rate times the average time</tspan>
      <tspan x="800" dy="36">each one spends in it. It holds for any stable system.</tspan>
    </text>
  </g>

  
  <g id="card-a">
    <rect x="40" y="235" width="480" height="585" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(65, 255)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="28" cy="28" r="14"/>
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 16 16 M 40 40 L 45 45 M 11 45 L 16 40 M 40 16 L 45 11"/>
    </g>
    
    <text x="135" y="295" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Service concurrency</text>

    
    <rect x="60" y="325" width="440" height="185" rx="8" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5"/>
    <text x="80" y="365" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">handles 200 req/s (lambda) with</tspan>
      <tspan x="80" dy="34">an average latency of 50 ms (W)</tspan>
    </text>

    <line x1="80" y1="422" x2="480" y2="422" stroke="#e8f1ea" stroke-width="2"/>

    <text x="80" y="458" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="80" dy="0">200 x 0.050 = 10 requests in flight</tspan>
      <tspan x="80" dy="34">on average</tspan>
    </text>

    
    <rect x="60" y="525" width="440" height="275" rx="8" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5"/>

    
    <rect x="75" y="545" width="240" height="38" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="195" y="572" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">concurrency limit 8</text>

    
    <line x1="325" y1="540" x2="325" y2="675" stroke="#207448" stroke-width="4" stroke-dasharray="8 6"/>

    
    <g transform="translate(80, 605)">
      <circle cx="12" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="41" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="70" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="99" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="128" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="157" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="186" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="215" cy="15" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    </g>

    
    <g transform="translate(345, 605)">
      <circle cx="14" cy="15" r="11" fill="#fdf2e9" stroke="#db8129" stroke-width="3"/>
      <circle cx="46" cy="15" r="11" fill="#fdf2e9" stroke="#db8129" stroke-width="3"/>
    </g>

    
    <rect x="135" y="715" width="290" height="55" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
    <text x="280" y="752" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">requests queue</text>
  </g>

  
  <g id="card-b">
    <rect x="550" y="235" width="480" height="585" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(575, 255)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <rect x="20" y="20" width="16" height="16"/>
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
    </g>

    <text x="645" y="295" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">GPU batch scheduler</text>

    
    <rect x="570" y="325" width="440" height="185" rx="8" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5"/>
    <text x="590" y="365" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="590" dy="0">holds 32 sequences (L),</tspan>
      <tspan x="590" dy="34">each takes 4 s (W)</tspan>
    </text>

    <line x1="590" y1="422" x2="990" y2="422" stroke="#e8f1ea" stroke-width="2"/>

    <text x="590" y="470" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">lambda = L / W = 32 / 4</text>

    
    <rect x="570" y="525" width="440" height="275" rx="8" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5"/>

    
    <g transform="translate(595, 545)" fill="#e8f1ea" stroke="#207448" stroke-width="1.5">
      
      <rect x="0" y="0" width="38" height="14" rx="3"/>
      <rect x="46" y="0" width="38" height="14" rx="3"/>
      <rect x="92" y="0" width="38" height="14" rx="3"/>
      <rect x="138" y="0" width="38" height="14" rx="3"/>
      <rect x="184" y="0" width="38" height="14" rx="3"/>
      <rect x="230" y="0" width="38" height="14" rx="3"/>
      <rect x="276" y="0" width="38" height="14" rx="3"/>
      <rect x="322" y="0" width="38" height="14" rx="3"/>
      
      <rect x="0" y="20" width="38" height="14" rx="3"/>
      <rect x="46" y="20" width="38" height="14" rx="3"/>
      <rect x="92" y="20" width="38" height="14" rx="3"/>
      <rect x="138" y="20" width="38" height="14" rx="3"/>
      <rect x="184" y="20" width="38" height="14" rx="3"/>
      <rect x="230" y="20" width="38" height="14" rx="3"/>
      <rect x="276" y="20" width="38" height="14" rx="3"/>
      <rect x="322" y="20" width="38" height="14" rx="3"/>
      
      <rect x="0" y="40" width="38" height="14" rx="3"/>
      <rect x="46" y="40" width="38" height="14" rx="3"/>
      <rect x="92" y="40" width="38" height="14" rx="3"/>
      <rect x="138" y="40" width="38" height="14" rx="3"/>
      <rect x="184" y="40" width="38" height="14" rx="3"/>
      <rect x="230" y="40" width="38" height="14" rx="3"/>
      <rect x="276" y="40" width="38" height="14" rx="3"/>
      <rect x="322" y="40" width="38" height="14" rx="3"/>
      
      <rect x="0" y="60" width="38" height="14" rx="3"/>
      <rect x="46" y="60" width="38" height="14" rx="3"/>
      <rect x="92" y="60" width="38" height="14" rx="3"/>
      <rect x="138" y="60" width="38" height="14" rx="3"/>
      <rect x="184" y="60" width="38" height="14" rx="3"/>
      <rect x="230" y="60" width="38" height="14" rx="3"/>
      <rect x="276" y="60" width="38" height="14" rx="3"/>
      <rect x="322" y="60" width="38" height="14" rx="3"/>
    </g>

    
    <path d="M 790 635 L 790 660" stroke="#207448" stroke-width="3" fill="none"/>
    <polygon points="790,670 782,656 798,656" fill="#207448"/>

    
    <rect x="585" y="685" width="410" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="790" y="724" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="790" dy="0">sustainable throughput</tspan>
      <tspan x="790" dy="34">at most 8 sequences/s</tspan>
    </text>
  </g>

  
  <g id="right-strip">
    <rect x="1060" y="235" width="500" height="585" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1085, 255)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="6" y="6" width="44" height="12" rx="3"/>
      <rect x="6" y="22" width="44" height="12" rx="3"/>
      <rect x="6" y="38" width="44" height="12" rx="3"/>
      <circle cx="14" cy="12" r="2" fill="#207448"/>
      <circle cx="14" cy="28" r="2" fill="#207448"/>
      <circle cx="14" cy="44" r="2" fill="#207448"/>
    </g>

    <text x="1145" y="295" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Kendall notation A/S/m:</text>

    
    <rect x="1080" y="325" width="460" height="475" rx="8" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5"/>

    <text x="1105" y="375" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">arrival process, service-time</tspan>
      <tspan x="1105" dy="36">distribution, servers.</tspan>
      <tspan x="1105" dy="48" font-weight="bold" fill="#207448">M = Markovian (exponential),</tspan>
      <tspan x="1105" dy="36" font-weight="bold" fill="#207448">D = deterministic, G = general;</tspan>
      <tspan x="1105" dy="48">M/M/c is a multi-server queue</tspan>
      <tspan x="1105" dy="36">such as a pool of GPU replicas</tspan>
    </text>

    
    <g transform="translate(1105, 630)">
      
      <path d="M 70 20 L 10 20 L 10 60 L 70 60" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="30" y1="20" x2="30" y2="60" stroke="#9ec5ab" stroke-width="2"/>
      <line x1="50" y1="20" x2="50" y2="60" stroke="#9ec5ab" stroke-width="2"/>
      
      <path d="M 0 40 L 10 40" stroke="#207448" stroke-width="2"/>
      
      <path d="M 70 40 L 95 40" stroke="#207448" stroke-width="2"/>
      <path d="M 95 15 L 95 65" stroke="#207448" stroke-width="2"/>
      <path d="M 95 15 L 120 15" stroke="#207448" stroke-width="2"/>
      <path d="M 95 40 L 120 40" stroke="#207448" stroke-width="2"/>
      <path d="M 95 65 L 120 65" stroke="#207448" stroke-width="2"/>
      
      <circle cx="140" cy="15" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="140" cy="40" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="140" cy="65" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <path d="M 154 15 L 180 15 L 180 40 L 210 40" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 154 40 L 210 40" stroke="#207448" stroke-width="2"/>
      <path d="M 154 65 L 180 65 L 180 40" stroke="#207448" stroke-width="2" fill="none"/>
      <polygon points="218,40 206,34 206,46" fill="#207448"/>
    </g>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="845" width="1520" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="895" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">For AI serving, model the request queue and the batch scheduler: arrival rate and the p99 target together</tspan>
      <tspan x="80" dy="38">decide how many replicas you need; continuous batching changes the service-time distribution;</tspan>
      <tspan x="80" dy="38">always validate by measurement</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1045" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="800" y="1092" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Little's law is the best sanity check you have</text>
  </g>
</svg>