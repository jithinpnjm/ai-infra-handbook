<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which cgroup version does this node run?</title>
  <desc>Decision flow and compatibility guide to determine whether a Linux node runs cgroups v1, v2, or a hybrid configuration.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Which cgroup version does this node run?</text>

  
  <rect x="180" y="130" width="660" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(205, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="8" />
    <line x1="0" y1="16" x2="56" y2="16" />
    <path d="M 12 28 L 22 36 L 12 44" />
    <line x1="28" y1="44" x2="44" y2="44" />
  </g>
  <text x="285" y="183" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">Run: stat -fc %T /sys/fs/cgroup/</text>

  
  <line x1="510" y1="215" x2="510" y2="265" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <polygon points="510,265 730,320 510,375 290,320" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <text x="510" y="329" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">What does it print?</text>

  
  <path d="M 290 320 L 250 320 L 250 405" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="175" y="278" width="150" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="250" y="303" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">cgroup2fs</text>

  
  <path d="M 730 320 L 770 320 L 770 405" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="715" y="278" width="110" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="770" y="303" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">tmpfs</text>

  
  <rect x="40" y="415" width="430" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(65, 435)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="0" width="20" height="16" rx="4" />
    <line x1="28" y1="16" x2="28" y2="34" />
    <line x1="8" y1="34" x2="48" y2="34" />
    <line x1="8" y1="34" x2="8" y2="42" />
    <line x1="48" y1="34" x2="48" y2="42" />
    <rect x="0" y="42" width="16" height="14" rx="3" />
    <rect x="40" y="42" width="16" height="14" rx="3" />
  </g>
  <text x="65" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="65" dy="0">Pure v2: one unified hierarchy,</tspan>
    <tspan x="65" dy="42" font-size="24" font-weight="normal" fill="#303a36">one cgroup2 mount at</tspan>
    <tspan x="65" dy="38" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">/sys/fs/cgroup</tspan>
  </text>

  
  <rect x="500" y="415" width="530" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(525, 428)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="0" width="18" height="16" rx="3" />
    <rect x="34" y="0" width="18" height="16" rx="3" />
    <line x1="13" y1="16" x2="13" y2="34" />
    <line x1="43" y1="16" x2="43" y2="34" />
    <rect x="4" y="34" width="18" height="16" rx="3" />
    <rect x="34" y="34" width="18" height="16" rx="3" />
  </g>
  <text x="595" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">v1 or hybrid</text>

  
  <rect x="520" y="490" width="490" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="765" y="522" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">cat /proc/self/cgroup</text>

  
  <rect x="520" y="546" width="490" height="42" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
  <text x="535" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">one line 0::/path</tspan> means v2
  </text>

  
  <rect x="520" y="598" width="490" height="66" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
  <text x="535" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">many lines N:controller:/path</tspan>
    <tspan x="535" dy="28">means v1</tspan>
  </text>

  
  <rect x="520" y="674" width="490" height="68" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="535" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="535" dy="0">Hybrid systems mount both,</tspan>
    <tspan x="535" dy="30" font-family="monospace" font-size="24" fill="#207448">usually v2 at /sys/fs/cgroup/unified</tspan>
  </text>

  
  <rect x="1060" y="130" width="500" height="625" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1085, 148)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="48" rx="6" />
    <path d="M 18 8 V 4 H 38 V 8" />
    <path d="M 16 26 L 24 34 L 40 18" />
    <line x1="16" y1="44" x2="38" y2="44" />
  </g>
  <text x="1160" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">More checks</text>

  
  <rect x="1085" y="225" width="450" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(1105, 252)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 0 0 L 10 10 L 0 20" />
    <line x1="14" y1="20" x2="28" y2="20" />
  </g>
  <text x="1145" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">mount | grep cgroup</text>

  
  <rect x="1085" y="340" width="450" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(1105, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 0 0 L 10 10 L 0 20" />
    <line x1="14" y1="20" x2="28" y2="20" />
  </g>
  <text x="1145" y="392" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1145" dy="0">cat /sys/fs/cgroup/</tspan>
    <tspan x="1145" dy="34">cgroup.controllers</tspan>
  </text>

  
  <rect x="1085" y="480" width="450" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(1105, 520)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 0 0 L 10 10 L 0 20" />
    <line x1="14" y1="20" x2="28" y2="20" />
  </g>
  <text x="1145" y="532" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1145" dy="0">grep cgroup</tspan>
    <tspan x="1145" dy="34">/proc/filesystems</tspan>
  </text>

  
  <rect x="40" y="780" width="1520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 797)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="10" width="56" height="36" rx="18" />
    <circle cx="38" cy="28" r="10" fill="#207448" />
  </g>
  <text x="145" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-family="monospace" font-weight="bold" fill="#207448">boot parameter systemd.unified_cgroup_hierarchy=1 (v2) or =0 (v1);</tspan>
    <tspan x="145" dy="34">RHEL 8 defaulted to v1, RHEL 9 is v2</tspan>
  </text>

  
  <rect x="40" y="890" width="1520" height="180" rx="10" fill="#fffdf9" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(65, 942)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28,4 54,50 2,50" />
    <line x1="28" y1="20" x2="28" y2="34" />
    <circle cx="28" cy="42" r="2" fill="#db8129" />
  </g>
  <text x="145" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold" fill="#db8129">Older tooling expects v1: </tspan><tspan font-weight="normal">old Docker, Kubernetes before 1.25 v2 support,</tspan>
    <tspan x="145" dy="36">some NVIDIA container toolkit and GPU monitoring tools, old cAdvisor,</tspan>
    <tspan x="145" dy="36">Java before 15 or jdk8u372 container awareness; check compatibility before moving a fleet to v2</tspan>
  </text>

  
  <rect x="40" y="1090" width="1520" height="70" rx="8" fill="#207448" />
  <text x="800" y="1135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Run the version check on every node you touch</text>
</svg>