<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190">
  <title>Which cgroup version does this node run?</title>
  <desc>Decision flow to determine whether a Linux node runs cgroup v1, v2, or hybrid hierarchy, with verification commands and tooling compatibility notes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1190" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which cgroup version does this node run?</text>

  

  
  <rect x="50" y="110" width="375" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <rect x="70" y="133" width="46" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 78 147 L 87 154 L 78 161" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="92" y1="163" x2="105" y2="163" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="130" y="148">Run: stat -fc %T</tspan>
    <tspan x="130" y="180">/sys/fs/cgroup/</tspan>
  </text>

  
  <line x1="237" y1="200" x2="237" y2="230" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <polygon points="237,232 370,290 237,348 104,290" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="237" y="282">What does</tspan>
    <tspan x="237" y="316">it print?</tspan>
  </text>

  
  <line x1="237" y1="348" x2="237" y2="440" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="252" y="398" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">cgroup2fs</text>

  
  <rect x="50" y="442" width="375" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <path d="M 237 465 L 267 477 C 267 507 237 525 237 525 C 237 525 207 507 207 477 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M 223 493 L 233 503 L 253 483" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="72" y="562" font-size="30" font-weight="bold" fill="#207448">Pure v2:</tspan>
    <tspan x="72" y="608" font-size="24">one unified hierarchy,</tspan>
    <tspan x="72" y="648" font-size="24">one cgroup2 mount at</tspan>
    <tspan x="72" y="688" font-family="monospace" font-size="24" fill="#207448">/sys/fs/cgroup</tspan>
  </text>

  
  <line x1="370" y1="290" x2="475" y2="290" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="390" y="278" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">tmpfs</text>


  

  
  <rect x="477" y="110" width="633" height="632" rx="16" fill="#fcfdfc" stroke="#207448" stroke-width="2.5" />

  
  
  <path d="M 505 148 L 525 148 M 515 138 L 515 158 M 525 138 L 535 138 M 525 158 L 535 158" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <rect x="535" y="132" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <rect x="535" y="152" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <rect x="495" y="142" width="14" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <text x="562" y="156" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">v1 or hybrid</text>

  
  <rect x="502" y="185" width="583" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="522" y="230" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">cat /proc/self/cgroup</text>

  
  <path d="M 793 257 L 793 285 L 632 285 L 632 315" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <path d="M 793 285 L 945 285 L 945 315" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <rect x="502" y="318" width="260" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="524" y="362" font-size="24" font-weight="bold">one line</tspan>
    <tspan x="524" y="405" font-family="monospace" font-size="24" fill="#207448">0::/path</tspan>
    <tspan x="524" y="458" font-size="28" font-weight="bold" fill="#207448">means v2</tspan>
  </text>

  
  <rect x="782" y="318" width="303" height="185" rx="12" fill="#ffffff" stroke="#789084" stroke-width="2" />
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="800" y="362" font-size="24" font-weight="bold">many lines</tspan>
    <tspan x="800" y="405" font-family="monospace" font-size="24">N:controller:/path</tspan>
    <tspan x="800" y="458" font-size="28" font-weight="bold">means v1</tspan>
  </text>

  
  <rect x="502" y="525" width="583" height="195" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="524" y="548" width="40" height="18" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
  <path d="M 524 574 C 536 578, 552 578, 564 574" fill="none" stroke="#207448" stroke-width="2.5" />
  <path d="M 524 582 C 536 586, 552 586, 564 582" fill="none" stroke="#207448" stroke-width="2.5" />
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="578" y="572" font-size="26" font-weight="bold">Hybrid systems mount both,</tspan>
    <tspan x="578" y="618" font-size="24">usually v2 at</tspan>
    <tspan x="578" y="658" font-family="monospace" font-size="24" fill="#207448">/sys/fs/cgroup/unified</tspan>
  </text>


  

  <rect x="1135" y="110" width="415" height="632" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  
  <circle cx="1165" cy="150" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1175" y1="160" x2="1187" y2="172" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <text x="1200" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">More checks</text>

  
  <rect x="1155" y="195" width="375" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1180" cy="255" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <path d="M 1176 255 L 1179 258 L 1185 252" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <text x="1205" y="263" font-family="monospace" font-size="24" fill="#303a36">mount | grep cgroup</text>

  
  <rect x="1155" y="340" width="375" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1180" cy="405" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <path d="M 1176 405 L 1179 408 L 1185 402" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1205" y="405">cat /sys/fs/cgroup/</tspan>
    <tspan x="1205" y="442">cgroup.controllers</tspan>
  </text>

  
  <rect x="1155" y="530" width="375" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1180" cy="595" r="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <path d="M 1176 595 L 1179 598 L 1185 592" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1205" y="595">grep cgroup</tspan>
    <tspan x="1205" y="632">/proc/filesystems</tspan>
  </text>


  

  <rect x="50" y="765" width="1500" height="98" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="75" y="794" width="48" height="26" rx="13" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <circle cx="109" cy="807" r="9" fill="#207448" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" y="805">boot parameter systemd.unified_cgroup_hierarchy=1 (v2) or =0 (v1);</tspan>
    <tspan x="145" y="842">RHEL 8 defaulted to v1, RHEL 9 is v2</tspan>
  </text>


  

  <rect x="50" y="885" width="1500" height="195" rx="16" fill="#fffcf8" stroke="#db8129" stroke-width="3" />
  
  <polygon points="100,948 126,998 74,998" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="100" y1="966" x2="100" y2="982" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="100" cy="991" r="2" fill="#db8129" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="148" y="932">Older tooling expects v1: old Docker, Kubernetes before 1.25 v2 support,</tspan>
    <tspan x="148" y="970">some NVIDIA container toolkit and GPU monitoring tools, old cAdvisor,</tspan>
    <tspan x="148" y="1008">Java before 15 or jdk8u372 container awareness;</tspan>
    <tspan x="148" y="1046">check compatibility before moving a fleet to v2</tspan>
  </text>


  

  <rect x="50" y="1102" width="1500" height="66" rx="12" fill="#207448" />
  <text x="800" y="1144" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Run the version check on every node you touch</text>

</svg>