<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Zone Watermarks and Page Reclaim Dynamics</text>

  
  <g id="gauge-structure">
    
    <rect x="70" y="115" width="220" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="180" y="144" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">Normal zone</text>

    
    <rect x="110" y="170" width="140" height="850" rx="20" fill="#ffffff" stroke="#303a36" stroke-width="4" />

    
    
    <path d="M 112 790 L 248 790 L 248 1000 A 18 18 0 0 1 230 1018 L 130 1018 A 18 18 0 0 1 112 1000 Z" fill="#fbe9e7" />
    
    <rect x="112" y="550" width="136" height="240" fill="#fff9c4" opacity="0.6" />
    
    <rect x="112" y="340" width="136" height="210" fill="#e8f5e9" opacity="0.8" />
    
    <path d="M 130 172 L 230 172 A 18 18 0 0 1 248 190 L 248 340 L 112 340 L 112 190 A 18 18 0 0 1 130 172 Z" fill="#c8e6c9" />

    
    
    <line x1="90" y1="340" x2="270" y2="340" stroke="#207448" stroke-width="5" stroke-dasharray="8 4" />
    
    <line x1="90" y1="550" x2="270" y2="550" stroke="#db8129" stroke-width="5" stroke-dasharray="8 4" />
    
    <line x1="90" y1="790" x2="270" y2="790" stroke="#d32f2f" stroke-width="5" />
  </g>

  
  
  <rect x="15" y="316" width="80" height="48" rx="8" fill="#207448" />
  <text x="55" y="350" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">high</text>

  
  <rect x="15" y="526" width="80" height="48" rx="8" fill="#db8129" />
  <text x="55" y="560" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">low</text>

  
  <rect x="15" y="766" width="80" height="48" rx="8" fill="#d32f2f" />
  <text x="55" y="800" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">min</text>

  
  <g id="section-above-high">
    <rect x="300" y="170" width="720" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="345" cy="215" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 345 185 L 345 193 M 345 237 L 345 245 M 315 215 L 323 215 M 367 215 L 375 215" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="385" y="212" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Normal Zone State</text>
    <text x="385" y="252" font-family="sans-serif" font-size="24px" fill="#303a36">where free memory is plentiful and background kswapd sleeps.</text>
  </g>

  
  <g id="at-high">
    <rect x="300" y="318" width="720" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="320" y="352" font-family="sans-serif" font-size="24px" fill="#303a36">hysteresis stop point where kswapd returns to sleep.</text>
  </g>

  
  <g id="between-high-and-low">
    <rect x="300" y="385" width="720" height="125" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="325" y="425" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">allocations proceed smoothly without application stall.</text>
    <text x="325" y="465" font-family="sans-serif" font-size="24px" fill="#303a36">Spacing controlled by vm.watermark_scale_factor</text>
    <text x="325" y="495" font-family="sans-serif" font-size="24px" fill="#303a36">(default 10 = 0.1% RAM)</text>
  </g>

  
  <g id="at-low">
    
    <rect x="300" y="528" width="720" height="50" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="320" y="562" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">kswapd wakes up</text>

    
    <path d="M 275 550 L 295 550" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    
    <rect x="300" y="595" width="720" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="345" cy="640" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="333,640 342,650 358,632" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <text x="385" y="638" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Asynchronous Background Reclaim</text>
    <text x="385" y="674" font-family="sans-serif" font-size="24px" fill="#303a36">kswapd scanning active/inactive LRU lists, dropping</text>
    <text x="385" y="706" font-family="sans-serif" font-size="24px" fill="#303a36">clean page cache and unmapping pages asynchronously</text>
    <text x="385" y="736" font-family="sans-serif" font-size="24px" fill="#303a36">in the background.</text>
  </g>

  
  <g id="at-min">
    <rect x="300" y="768" width="720" height="52" rx="8" fill="#ffffff" stroke="#d32f2f" stroke-width="2" />
    <text x="320" y="803" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#d32f2f">Direct Reclaim Threshold</text>
    <text x="630" y="803" font-family="sans-serif" font-size="24px" fill="#303a36">, derived from vm.min_free_kbytes</text>
  </g>

  
  <g id="below-min">
    <rect x="300" y="836" width="720" height="150" rx="14" fill="#fbe9e7" stroke="#d32f2f" stroke-width="2" />
    
    
    <path d="M 345 860 L 368 902 L 322 902 Z" fill="none" stroke="#d32f2f" stroke-width="4" stroke-linejoin="round" />
    <line x1="345" y1="875" x2="345" y2="887" stroke="#d32f2f" stroke-width="4" stroke-linecap="round" />
    <circle cx="345" cy="895" r="2.5" fill="#d32f2f" />

    <text x="385" y="876" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#d32f2f">Direct Reclaim Zone</text>
    <text x="385" y="914" font-family="sans-serif" font-size="24px" fill="#303a36">an allocating application thread is forced to synchronously</text>
    <text x="385" y="946" font-family="sans-serif" font-size="24px" fill="#303a36">reclaim memory (pgscand/s, allocstall), causing severe</text>
    <text x="385" y="976" font-family="sans-serif" font-size="24px" fill="#303a36">application latency spikes and high sys time.</text>
  </g>

  
  <g id="gauge-bottom-oom">
    <rect x="70" y="1035" width="950" height="60" rx="10" fill="#303a36" />
    <text x="545" y="1073" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">exhaustion below min triggers the OOM killer</text>
  </g>

  
  <g id="side-panel">
    <rect x="1060" y="170" width="480" height="816" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <rect x="1060" y="170" width="480" height="74" rx="18" fill="#e8f1ea" />
    <rect x="1060" y="226" width="480" height="18" fill="#e8f1ea" />
    
    <line x1="1095" y1="207" x2="1135" y2="207" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1110" cy="207" r="7" fill="#207448" />
    <line x1="1095" y1="221" x2="1135" y2="221" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1125" cy="221" r="7" fill="#207448" />
    <text x="1155" y="217" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Tuning Knobs</text>

    
    <rect x="1085" y="270" width="430" height="175" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1105" y="312" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">vm.min_free_kbytes</text>
    <text x="1105" y="360" font-family="sans-serif" font-size="24px" fill="#303a36">sets the min baseline,</text>
    <text x="1105" y="398" font-family="sans-serif" font-size="24px" fill="#303a36">reserving emergency pool.</text>

    
    <rect x="1085" y="475" width="430" height="310" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1105" y="518" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">vm.watermark_scale_factor</text>
    <text x="1105" y="566" font-family="sans-serif" font-size="24px" fill="#303a36">while raising</text>
    <text x="1105" y="602" font-family="monospace" font-size="24px" fill="#207448">vm.watermark_scale_factor</text>
    <text x="1105" y="640" font-family="sans-serif" font-size="24px" fill="#303a36">(e.g. to 50 or 100) widens</text>
    <text x="1105" y="676" font-family="sans-serif" font-size="24px" fill="#303a36">the watermark gaps to start</text>
    <text x="1105" y="712" font-family="sans-serif" font-size="24px" fill="#303a36">kswapd earlier and avoid</text>
    <text x="1105" y="748" font-family="sans-serif" font-size="24px" fill="#303a36">direct-reclaim stalls.</text>

    
    <rect x="1085" y="815" width="430" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1105" y="855" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Reclaim Strategy:</text>
    <text x="1105" y="895" font-family="sans-serif" font-size="24px" fill="#303a36">Scale gaps wide enough so</text>
    <text x="1105" y="930" font-family="sans-serif" font-size="24px" fill="#303a36">kswapd absorbs burst allocs.</text>
  </g>
</svg>