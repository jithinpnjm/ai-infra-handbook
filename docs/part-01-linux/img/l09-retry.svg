<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Retry with backoff</title>
  <desc>Infographic explaining retry with backoff loop and timeout best practices</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="85" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Retry with backoff</text>

  

  
  <rect x="200" y="160" width="340" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <rect x="222" y="197" width="56" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 234 213 L 244 219 L 234 225" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="248" y1="225" x2="262" y2="225" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <text x="295" y="235" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">run command</text>

  
  <line x1="540" y1="225" x2="640" y2="225" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="546" y="188" width="88" height="30" rx="8" fill="#e8f1ea" />
  <text x="590" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">success</text>

  
  <rect x="640" y="160" width="280" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="685" cy="225" r="26" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 672 225 L 682 235 L 700 216" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="730" y="235" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">done</text>

  
  <line x1="370" y1="290" x2="370" y2="440" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="378" y="348" width="94" height="32" rx="8" fill="#e8f1ea" />
  <text x="388" y="372" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">failure</text>

  
  <rect x="200" y="440" width="340" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="242" cy="505" r="26" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 235 496 C 235 490 239 487 243 487 C 248 487 251 490 251 494 C 251 498 243 501 243 506" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="243" cy="516" r="2.5" fill="#207448" />
  <text x="282" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">attempts left?</text>

  
  <line x1="540" y1="505" x2="640" y2="505" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <rect x="568" y="468" width="44" height="30" rx="8" fill="#fff7f0" />
  <text x="590" y="490" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">no</text>

  
  <rect x="640" y="420" width="280" height="165" rx="16" fill="#fff7f0" stroke="#db8129" stroke-width="3.5" />
  
  <path d="M 678 440 L 706 488 L 650 488 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
  <line x1="678" y1="456" x2="678" y2="472" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="678" cy="480" r="2" fill="#db8129" />
  
  <text x="720" y="458" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="720" dy="0">failed after</tspan>
    <tspan x="720" dy="28">n attempts</tspan>
  </text>
  <rect x="715" y="506" width="105" height="42" rx="8" fill="#db8129" />
  <text x="767" y="535" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">exit 1</text>

  
  <line x1="370" y1="570" x2="370" y2="700" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="378" y="620" width="60" height="32" rx="8" fill="#e8f1ea" />
  <text x="390" y="644" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <rect x="200" y="700" width="430" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="248" cy="770" r="26" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="248,753 248,770 262,770" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="290" y="754" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="290" dy="0">sleep delay then</tspan>
    <tspan x="290" dy="38">delay doubles</tspan>
  </text>

  
  <path d="M 200 770 L 45 770 L 45 225 L 200 225" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="58" y="470" width="124" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="120" y="498" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="120" dy="0">back to</tspan>
    <tspan x="120" dy="28">run</tspan>
  </text>

  
  <rect x="960" y="160" width="600" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <rect x="985" y="200" width="550" height="280" rx="12" fill="#ffffff" stroke="#b8d5c2" stroke-width="2" />
  <circle cx="1015" cy="228" r="6" fill="#b8d5c2" />
  <circle cx="1035" cy="228" r="6" fill="#b8d5c2" />
  <circle cx="1055" cy="228" r="6" fill="#b8d5c2" />
  <line x1="985" y1="248" x2="1535" y2="248" stroke="#e8f1ea" stroke-width="2" />
  <text x="1015" y="305" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1015" dy="0">retry 5 2 curl -fsS</tspan>
    <tspan x="1015" dy="48">https://example.com/file</tspan>
    <tspan x="1015" dy="48">-o /tmp/file</tspan>
  </text>

  
  <rect x="985" y="520" width="550" height="280" rx="12" fill="#ffffff" stroke="#b8d5c2" stroke-width="2" />
  <circle cx="1015" cy="548" r="6" fill="#b8d5c2" />
  <circle cx="1035" cy="548" r="6" fill="#b8d5c2" />
  <circle cx="1055" cy="548" r="6" fill="#b8d5c2" />
  <line x1="985" y1="568" x2="1535" y2="568" stroke="#e8f1ea" stroke-width="2" />
  <text x="1015" y="625" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1015" dy="0">timeout 30 ssh</tspan>
    <tspan x="1015" dy="48">-o ConnectTimeout=5</tspan>
    <tspan x="1015" dy="48">-o BatchMode=yes node01 true</tspan>
  </text>

  
  <rect x="45" y="960" width="1515" height="68" rx="14" fill="#207448" />
  <text x="802" y="1003" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">always put a timeout on anything that can block.</text>
</svg>