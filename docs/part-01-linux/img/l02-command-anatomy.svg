<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Anatomy of a command line</title>
  <desc>Visual explanation of command line components including command, options, arguments, and standard syntax conventions.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Anatomy of a command line</text>

  
  <rect x="75" y="130" width="280" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(95, 152)">
    <rect x="0" y="0" width="56" height="56" rx="10" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="14,20 25,28 14,36" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="28" y1="36" x2="42" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="170" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">command</text>

  
  <rect x="380" y="130" width="255" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(400, 152)">
    <rect x="4" y="14" width="48" height="28" rx="14" stroke="#207448" stroke-width="4" fill="none"/>
    <circle cx="36" cy="28" r="7" stroke="#207448" stroke-width="4" fill="none"/>
  </g>
  <text x="475" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">option</text>

  
  <rect x="665" y="130" width="255" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(685, 152)">
    <line x1="8" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="18" r="6" stroke="#207448" stroke-width="4" fill="#ffffff"/>
    <line x1="8" y1="38" x2="48" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="38" r="6" stroke="#207448" stroke-width="4" fill="#ffffff"/>
  </g>
  <text x="760" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">option</text>

  
  <rect x="950" y="130" width="570" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(975, 152)">
    <path d="M 6 14 L 22 14 L 28 20 L 50 20 C 52 20 54 22 54 24 L 54 44 C 54 46 52 48 50 48 L 6 48 C 4 48 2 46 2 44 L 2 18 C 2 16 4 14 6 14 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
  <text x="1050" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">argument</text>
  <text x="1050" y="207" font-family="sans-serif" font-size="24" fill="#303a36">(what to act on)</text>

  
  <line x1="215" y1="230" x2="215" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="230" x2="510" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="230" x2="790" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="1235" y1="230" x2="1235" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>

  
  <rect x="75" y="285" width="1445" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="145" y="305" width="140" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="215" y="368" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">ls</text>

  <rect x="440" y="305" width="140" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="510" y="368" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">-l</text>

  <rect x="720" y="305" width="140" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="790" y="368" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">-a</text>

  <rect x="1065" y="305" width="340" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1235" y="368" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">/var/log</text>

  
  <rect x="75" y="475" width="1445" height="465" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="105" y="520" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Conventions</text>

  
  <rect x="105" y="545" width="445" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(130, 565)">
    <path d="M 10 28 L 28 10 L 46 10 L 46 28 L 28 46 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <circle cx="36" cy="20" r="4" fill="#207448"/>
  </g>
  <rect x="205" y="565" width="80" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="245" y="603" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">-l</text>
  <text x="130" y="665" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">short option</text>

  
  <rect x="575" y="545" width="445" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(600, 565)">
    <path d="M 6 28 L 24 10 L 50 10 L 50 28 L 24 46 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <line x1="28" y1="19" x2="42" y2="19" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="27" x2="42" y2="27" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="675" y="565" width="120" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="735" y="603" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">--all</text>
  <text x="600" y="665" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">long option</text>

  
  <rect x="1045" y="545" width="445" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1070, 565)">
    <rect x="6" y="10" width="44" height="36" rx="6" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="6" y1="24" x2="50" y2="24" stroke="#207448" stroke-width="3"/>
    <circle cx="34" cy="31" r="3" fill="#207448"/>
  </g>
  <rect x="1145" y="565" width="135" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1212" y="603" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">-n 20</text>
  <text x="1070" y="665" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">option with value</text>

  
  <rect x="105" y="730" width="1385" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(135, 755)">
    <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="40" r="2.5" fill="#207448"/>
  </g>
  <rect x="215" y="752" width="100" height="62" rx="10" fill="#db8129"/>
  <text x="265" y="795" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff">--</text>
  <text x="345" y="792" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">end of options</text>
  <text x="345" y="845" font-size="26">
    <tspan fill="#303a36" font-family="sans-serif">with example </tspan>
    <tspan fill="#207448" font-family="monospace" font-weight="bold">rm -- -weird-file</tspan>
  </text>
</svg>