<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Two files for modules</title>
  <desc>Visual comparison between /etc/modules-load.d/gpu.conf for boot loading and /etc/modprobe.d/nvidia.conf for options, policy, and blacklist configuration.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two files for modules</text>

  
  <g id="left-box">
    
    <rect x="50" y="110" width="730" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(80, 138)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="44" height="52" rx="4"/>
      <line x1="16" y1="18" x2="40" y2="18"/>
      <line x1="16" y1="30" x2="40" y2="30"/>
      <line x1="16" y1="42" x2="32" y2="42"/>
    </g>

    
    <text x="156" y="162" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">/etc/modules-load.d/gpu.conf</text>
    <text x="156" y="196" font-family="sans-serif" font-size="24" fill="#303a36">lists what to load at boot</text>

    
    <rect x="80" y="215" width="670" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="110" y="260" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">nvidia</text>
    <text x="110" y="306" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">nvidia_uvm</text>
    <text x="110" y="352" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">nvidia_peermem</text>

    
    <text x="210" y="445" font-family="sans-serif" font-size="24" fill="#303a36">read by</text>
    <line x1="310" y1="438" x2="370" y2="438" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="380" y="408" width="370" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(392, 414)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="12"/>
      <path d="M24 6v6 M24 36v6 M6 24h6 M36 24h6 M11 11l4 4 M33 33l4 4 M11 37l4-4 M33 15l4-4"/>
    </g>
    <text x="450" y="448" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">systemd-modules-load</text>
  </g>

  
  <g id="right-box">
    
    <rect x="820" y="110" width="730" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(850, 138)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="12"/>
      <path d="M28 8v8 M28 44v8 M6 30h8 M42 30h8 M12 14l6 6 M38 40l6 6 M12 46l6-6 M38 20l6-6"/>
    </g>

    
    <text x="926" y="162" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">/etc/modprobe.d/nvidia.conf</text>
    <text x="926" y="196" font-family="sans-serif" font-size="24" fill="#303a36">sets options and policy</text>

    
    <rect x="850" y="215" width="670" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="880" y="280" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">options nvidia ...</text>
    <text x="880" y="340" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">blacklist nouveau</text>

    
    <text x="1030" y="445" font-family="sans-serif" font-size="24" fill="#303a36">read by</text>
    <line x1="1130" y1="438" x2="1190" y2="438" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1200" y="408" width="320" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1215, 416)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="28" rx="4"/>
      <path d="M12 15l6 5-6 5 M22 25h10"/>
    </g>
    <text x="1275" y="448" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">modprobe</text>
  </g>

  
  <g id="blacklist-policy">
    <rect x="50" y="610" width="1500" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(80, 655)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 6L8 16v18c0 14 20 22 20 22s20-8 20-22V16L28 6z"/>
    </g>

    <text x="160" y="670" font-family="sans-serif" font-size="24" fill="#303a36">blacklist only stops automatic loading via aliases; stronger form</text>

    
    <rect x="160" y="688" width="540" height="52" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="180" y="723" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">install nouveau /bin/false</text>
  </g>

  
  <g id="check-commands">
    <rect x="50" y="785" width="1500" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(80, 830)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6"/>
      <path d="M14 22l8 6-8 6 M26 34h14"/>
    </g>

    <text x="160" y="830" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Check merged result:</text>

    <rect x="160" y="852" width="620" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="180" y="889" font-family="monospace" font-size="24" fill="#303a36">sudo modprobe -c | grep -i nvidia</text>

    <text x="805" y="889" font-family="sans-serif" font-size="24" fill="#303a36">and</text>

    <rect x="865" y="852" width="655" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="885" y="889" font-family="monospace" font-size="24" fill="#303a36">systemd-analyze cat-config modprobe.d</text>
  </g>

  
  <g id="initramfs-note">
    <rect x="50" y="960" width="1500" height="80" rx="12" fill="#207448"/>
    
    <g transform="translate(80, 974)" stroke="#ffffff" stroke-width="3" fill="none">
      <ellipse cx="26" cy="14" rx="18" ry="6"/>
      <path d="M8 14v12c0 3.3 8 6 18 6s18-2.7 18-6V14"/>
      <path d="M8 26v12c0 3.3 8 6 18 6s18-2.7 18-6V26"/>
    </g>
    <text x="150" y="1010" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Note: modules needed to mount root or reach the network must be in the initramfs</text>
  </g>
</svg>