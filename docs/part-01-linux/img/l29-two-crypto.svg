<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Two kinds of cryptography in SSH</title>
  <desc>Visual explanation of asymmetric public-key cryptography and symmetric cryptography in SSH, connected by Diffie-Hellman key exchange, with server host key lifecycle at the bottom.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Two kinds of cryptography in SSH</text>

  
  <rect x="60" y="130" width="550" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(85, 148)">
    <circle cx="20" cy="18" r="12" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 32 18 L 56 18 M 46 18 L 46 26 M 54 18 L 54 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="36" cy="38" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 46 38 L 66 38 M 58 38 L 58 45" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="170" y="185" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Asymmetric (public-key)</text>

  
  <g transform="translate(85, 215)">
    <rect width="500" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 24)">
      <circle cx="16" cy="24" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 24 L 50 24 M 40 24 L 40 32 M 48 24 L 48 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">a key pair</text>
  </g>

  
  <g transform="translate(85, 330)">
    <rect width="500" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 30)">
      <rect x="10" y="22" width="34" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 17 22 L 17 14 C 17 8 37 8 37 14 L 37 22" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="95" y="52" font-family="sans-serif" font-size="24" fill="#303a36">what one key encrypts only</text>
    <text x="95" y="86" font-family="sans-serif" font-size="24" fill="#303a36">the other can decrypt</text>
  </g>

  
  <g transform="translate(85, 460)">
    <rect width="500" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 30)">
      <path d="M 27 6 L 47 14 L 47 32 C 47 44 27 52 27 52 C 27 52 7 44 7 32 L 7 14 Z" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="27" cy="24" r="5" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 19 38 C 19 33 35 33 35 38" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="95" y="52" font-family="sans-serif" font-size="24" fill="#303a36">used for identity and</text>
    <text x="95" y="86" font-family="sans-serif" font-size="24" fill="#303a36">key exchange</text>
  </g>

  
  <g transform="translate(85, 590)">
    <rect width="500" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 20)">
      <circle cx="27" cy="27" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 27 15 L 27 27 L 16 33" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="56" font-family="sans-serif" font-size="24" fill="#303a36">slower</text>
  </g>

  
  <g transform="translate(625, 330)">
    <rect width="350" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="175" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Diffie-Hellman family</text>
    <text x="175" y="72" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">key exchange sets up</text>
    <text x="175" y="104" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the shared key</text>
  </g>
  
  <line x1="610" y1="480" x2="990" y2="480" stroke="#db8129" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)" />

  
  <rect x="990" y="130" width="550" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1015, 148)">
    <circle cx="20" cy="25" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 34 25 L 62 25 M 50 25 L 50 35 M 59 25 L 59 35" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1100" y="185" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Symmetric</text>

  
  <g transform="translate(1015, 215)">
    <rect width="500" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 35)">
      <circle cx="16" cy="24" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 24 L 50 24 M 40 24 L 40 32 M 48 24 L 48 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="52" font-family="sans-serif" font-size="24" fill="#303a36">one shared secret key</text>
    <text x="95" y="86" font-family="sans-serif" font-size="24" fill="#303a36">encrypts and decrypts</text>
  </g>

  
  <g transform="translate(1015, 360)">
    <rect width="500" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 35)">
      <path d="M 30 6 L 14 30 L 26 30 L 20 50 L 40 24 L 28 24 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    <text x="95" y="52" font-family="sans-serif" font-size="24" fill="#303a36">fast so it carries</text>
    <text x="95" y="86" font-family="sans-serif" font-size="24" fill="#303a36">the bulk of the data</text>
  </g>

  
  <g transform="translate(1015, 505)">
    <rect width="500" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 55)">
      <path d="M 46 20 A 20 20 0 1 0 46 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="46,10 46,22 34,22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="26" cy="27" r="5" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 31 27 L 37 27" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="95" y="52" font-family="sans-serif" font-size="24" fill="#303a36">key replaced periodically</text>
    <text x="95" y="86" font-family="sans-serif" font-size="24" fill="#303a36">during a long connection</text>
    <text x="95" y="120" font-family="sans-serif" font-size="24" fill="#303a36">(limits data per key)</text>
  </g>

  
  <rect x="60" y="750" width="1480" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(85, 775)">
    <rect width="450" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(200, 20)">
      <rect x="0" y="0" width="50" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="8" y1="9" x2="16" y2="9" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="40" cy="9" r="2.5" fill="#207448" />
      <rect x="0" y="24" width="50" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="8" y1="33" x2="16" y2="33" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="40" cy="33" r="2.5" fill="#207448" />
    </g>
    <text x="225" y="130" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">server has a</text>
    <text x="225" y="166" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">host key pair</text>
  </g>

  
  <g transform="translate(575, 775)">
    <rect width="450" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(198, 20)">
      <rect x="0" y="0" width="54" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="10" y1="12" x2="18" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="20" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="22" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="225" y="115" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">client shows its</text>
    <text x="225" y="148" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">fingerprint on</text>
    <text x="225" y="181" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">first connection</text>
  </g>

  
  <g transform="translate(1065, 775)">
    <rect width="450" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(200, 20)">
      <path d="M 0 10 C 0 4 48 4 48 10 L 48 34 C 48 40 0 40 0 34 Z" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 0 10 C 0 16 48 16 48 10" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 0 22 C 0 28 48 28 48 22" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    <text x="225" y="105" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">save and restore</text>
    <text x="225" y="145" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">/etc/ssh/ssh_host_*</text>
    <text x="225" y="185" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">when reimaging</text>
  </g>
</svg>