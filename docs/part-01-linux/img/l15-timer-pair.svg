<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>A timer and its service</title>
  <desc>systemd timer unit activating a service unit with key configuration directives and trigger families.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="65" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A timer and its service</text>

  
  <rect x="65" y="130" width="610" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="115" cy="180" r="24" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="115,166 115,180 127,180" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="111" y1="151" x2="119" y2="151" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <text x="155" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#207448">fstrim-data.timer</text>

  
  <line x1="65" y1="225" x2="675" y2="225" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

  
  <rect x="85" y="240" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="105" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">OnCalendar=Sun *-*-* 03:00:00</text>

  <rect x="85" y="288" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="105" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">RandomizedDelaySec=30min</text>

  <rect x="85" y="336" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="105" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Persistent=true</text>

  <rect x="85" y="384" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="105" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">AccuracySec=1min</text>

  <rect x="85" y="432" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="105" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">WantedBy=timers.target</text>

  
  <text x="800" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">activates</text>
  <line x1="675" y1="320" x2="925" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <rect x="925" y="130" width="610" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="975" cy="180" r="14" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="975" cy="180" r="22" fill="none" stroke="#207448" stroke-width="3"/>
  <g stroke="#207448" stroke-width="5" stroke-linecap="round">
    <line x1="975" y1="153" x2="975" y2="160"/>
    <line x1="975" y1="200" x2="975" y2="207"/>
    <line x1="948" y1="180" x2="955" y2="180"/>
    <line x1="995" y1="180" x2="1002" y2="180"/>
    <line x1="956" y1="161" x2="961" y2="166"/>
    <line x1="989" y1="194" x2="994" y2="199"/>
    <line x1="956" y1="199" x2="961" y2="194"/>
    <line x1="989" y1="166" x2="994" y2="161"/>
  </g>

  
  <text x="1015" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="bold" fill="#207448">fstrim-data.service</text>

  
  <line x1="925" y1="225" x2="1535" y2="225" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

  
  <rect x="945" y="240" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="965" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Type=oneshot</text>

  <rect x="945" y="288" width="570" height="40" rx="8" fill="#ffffff" stroke="#c4d9cb" stroke-width="1"/>
  <text x="965" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">ExecStart=/usr/sbin/fstrim -v /data</text>

  
  <rect x="65" y="525" width="1470" height="74" rx="20" fill="#db8129"/>
  <text x="800" y="571" text-anchor="middle">
    <tspan fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold">enable the timer, not the service: </tspan>
    <tspan fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold">sudo systemctl enable --now fstrim-data.timer</tspan>
  </text>

  
  <rect x="65" y="625" width="1470" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="95" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Annotations:</text>
  <text x="95" y="708" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">Persistent=true</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> runs a missed job at next start</tspan>
  </text>
  <text x="95" y="750" font-size="24" fill="#303a36">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">RandomizedDelaySec=</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> spreads load</tspan>
  </text>

  
  <rect x="65" y="800" width="1470" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="95" y="842" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Two trigger families:</text>
  <text x="95" y="890" font-size="25" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">calendar </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">(OnCalendar=)</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> and </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">monotonic </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">(OnBootSec=, OnUnitActiveSec=)</tspan>
  </text>
</svg>