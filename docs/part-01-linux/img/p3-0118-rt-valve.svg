<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Real-time starvation and the safety valve</title>
  <desc>Visualization of real-time task starvation, the 1,000,000 microsecond timeline safety valve, throttled dmesg alerts, commands, container restrictions, and safety valve configurations.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Real-time starvation and the safety valve</text>

  
  <rect x="40" y="110" width="1520" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="135" width="670" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="95" y="174" width="48" height="48" rx="6" />
    <rect x="107" y="186" width="24" height="24" rx="3" fill="#207448" fill-opacity="0.15" />
    <line x1="107" y1="166" x2="107" y2="174" />
    <line x1="119" y1="166" x2="119" y2="174" />
    <line x1="131" y1="166" x2="131" y2="174" />
    <line x1="107" y1="222" x2="107" y2="230" />
    <line x1="119" y1="222" x2="119" y2="230" />
    <line x1="131" y1="222" x2="131" y2="230" />
    <line x1="87" y1="186" x2="95" y2="186" />
    <line x1="87" y1="198" x2="95" y2="198" />
    <line x1="87" y1="210" x2="95" y2="210" />
    <line x1="143" y1="186" x2="151" y2="186" />
    <line x1="143" y1="198" x2="151" y2="198" />
    <line x1="143" y1="210" x2="151" y2="210" />
  </g>
  <text x="175" y="212" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">SCHED_FIFO priority 50 spinning</text>

  
  <rect x="760" y="135" width="770" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="785" y="174" width="56" height="46" rx="6" />
    <line x1="785" y1="188" x2="841" y2="188" stroke-width="2" />
    <path d="M 797 199 L 805 205 L 797 211" stroke-width="3" />
    <line x1="809" y1="211" x2="819" y2="211" stroke-width="3" />
  </g>
  <line x1="777" y1="226" x2="849" y2="168" stroke="#303a36" stroke-width="4" stroke-linecap="round" />
  <text x="860" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the shell you need to fix it</text>
  <text x="860" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="860" dy="0">starved: a busy real-time task starves</tspan>
    <tspan x="860" dy="32">everything of lower priority on that CPU</tspan>
  </text>

  
  
  <rect x="70" y="300" width="1020" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="580" y="355" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="580" dy="0">950000 us: real-time tasks may run</tspan>
    <tspan x="580" dy="34">(kernel.sched_rt_runtime_us default)</tspan>
  </text>

  
  <rect x="1110" y="300" width="420" height="130" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
  <text x="1320" y="355" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1320" dy="0">50000 us:</tspan>
    <tspan x="1320" dy="34">left for everything else</tspan>
  </text>

  
  <rect x="40" y="490" width="470" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="65" y="515" width="52" height="52" rx="8" />
    <line x1="77" y1="529" x2="105" y2="529" />
    <line x1="77" y1="541" x2="97" y2="541" />
    <line x1="77" y1="553" x2="101" y2="553" />
    <circle cx="93" cy="529" r="2" fill="#207448" />
    <circle cx="85" cy="541" r="2" fill="#207448" />
    <circle cx="97" cy="553" r="2" fill="#207448" />
  </g>
  <text x="65" y="598" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">FIFO runs until it blocks or</tspan>
    <tspan x="65" dy="30">a higher priority preempts it;</tspan>
    <tspan x="65" dy="30">RR round-robins among equals</tspan>
    <tspan x="65" dy="30">with a time slice;</tspan>
    <tspan x="65" dy="30">priorities 1 to 99</tspan>
  </text>

  
  <rect x="40" y="785" width="470" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 91 805 L 117 818 L 117 848 L 91 861 L 65 848 L 65 818 Z" />
    <line x1="91" y1="818" x2="91" y2="861" />
    <line x1="65" y1="818" x2="91" y2="832" />
    <line x1="117" y1="818" x2="91" y2="832" />
  </g>
  <text x="65" y="885" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">Runtimes usually forbid</tspan>
    <tspan x="65" dy="30">real-time priorities;</tspan>
    <tspan x="65" dy="30">cgroup v2 has no</tspan>
    <tspan x="65" dy="30" font-family="monospace">cpu.rt_runtime_us</tspan><tspan font-family="sans-serif">, so</tspan>
    <tspan x="65" dy="30">real-time work inside</tspan>
    <tspan x="65" dy="30">containers on v2 is hard</tspan>
  </text>

  
  <rect x="540" y="490" width="520" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="565" y="515" width="54" height="46" rx="6" />
    <path d="M 577 533 L 587 538 L 577 543" stroke-width="3" />
    <line x1="591" y1="543" x2="603" y2="543" stroke-width="3" />
  </g>
  <text x="565" y="600" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="565" dy="0">chrt -p $$</tspan>
    <tspan x="565" dy="38">sudo chrt -f 50 ./latency_task</tspan>
    <tspan x="565" dy="38">chrt -m</tspan>
    <tspan x="565" dy="38">ps -eo pid,cls,rtprio,ni,pri,comm</tspan>
  </text>

  
  <rect x="540" y="785" width="520" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 565 818 C 565 810 571 804 579 804 L 611 804 C 619 804 625 810 625 818 L 625 838 C 625 846 619 852 611 852 L 589 852 L 577 864 L 577 852 L 579 852 C 571 852 565 846 565 838 Z" />
    <line x1="595" y1="816" x2="595" y2="832" stroke-width="3" />
    <circle cx="595" cy="840" r="2" fill="#207448" />
  </g>
  <text x="565" y="890" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="565" dy="0">dmesg shows: sched: RT throttling</tspan>
    <tspan x="565" dy="34">activated means a real-time task</tspan>
    <tspan x="565" dy="34">used its 95% share:</tspan>
    <tspan x="565" dy="34" font-weight="bold">fix the task, not the limit</tspan>
  </text>

  
  <rect x="1090" y="490" width="470" height="560" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1115 522 L 1141 512 L 1167 522 L 1167 546 C 1167 562 1141 574 1141 574 C 1141 574 1115 562 1115 546 Z" />
    <path d="M 1131 542 L 1139 550 L 1153 534" stroke-width="3" />
  </g>
  <text x="1190" y="552" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Safety valves</text>

  
  <rect x="1115" y="600" width="420" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1135" y="645" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1135" dy="0">kernel.sched_rt_runtime_us /</tspan>
    <tspan x="1135" dy="36">sched_rt_period_us =</tspan>
    <tspan x="1135" dy="36">950000 / 1000000</tspan>
  </text>

  
  <rect x="1115" y="785" width="420" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1135" y="845" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">RLIMIT_RTTIME</text>

  
  <rect x="1115" y="910" width="420" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1135" y="975" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">combine with CPU isolation</text>

  
  <rect x="40" y="1080" width="1520" height="70" rx="10" fill="#207448" />
  <text x="800" y="1125" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Use real-time policies sparingly</text>
</svg>