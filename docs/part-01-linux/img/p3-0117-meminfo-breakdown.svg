<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where did my RAM go: reading free and /proc/meminfo</title>
  <desc>Visual infographic explaining how to interpret free -h output, MemAvailable, and the composition of RAM from /proc/meminfo.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where did my RAM go: reading free and /proc/meminfo</text>

  
  <rect x="60" y="105" width="1480" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="90" y="125" width="1420" height="120" rx="8" fill="#ffffff" stroke="#c2d6c6" stroke-width="1.5" />

  
  <g transform="translate(110, 142)">
    <rect x="0" y="0" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="10" x2="48" y2="10" stroke="#207448" stroke-width="1.5" />
    <polyline points="10,18 16,23 10,28" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="20" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>

  
  <text x="175" y="172" font-family="monospace" font-size="24" fill="#303a36" xml:space="preserve">total 1.9Ti  used 120Gi  free 40Gi  shared 1.2Gi  buff/cache 1.7Ti  available 1.7Ti</text>
  <text x="175" y="218" font-family="monospace" font-size="24" fill="#303a36" xml:space="preserve">0B 0B 0B</text>

  
  <rect x="1060" y="146" width="236" height="38" rx="19" fill="none" stroke="#db8129" stroke-width="3.5" />

  
  <line x1="570" y1="184" x2="570" y2="266" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <rect x="365" y="268" width="370" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="550" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="550" dy="0">idle memory,</tspan>
    <tspan x="550" dy="30">deliberately small</tspan>
  </text>

  
  <line x1="1178" y1="186" x2="1178" y2="266" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)" />

  
  <rect x="760" y="268" width="750" height="120" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="785" y="302" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="785" dy="0">MemAvailable: how much you can use to</tspan>
    <tspan x="785" dy="30">start new applications without swapping;</tspan>
    <tspan x="785" dy="30">counts reclaimable page cache and slab</tspan>
  </text>

  
  <g transform="translate(60, 445)">
    
    <rect x="0" y="0" width="110" height="586" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <rect x="2" y="2" width="106" height="84" rx="6" fill="#207448" />
    <rect x="2" y="100" width="106" height="84" rx="2" fill="#2a8a56" />
    <rect x="2" y="200" width="106" height="84" rx="2" fill="#349c64" />
    <rect x="2" y="300" width="106" height="84" rx="2" fill="#4aac78" />
    <rect x="2" y="400" width="106" height="84" rx="2" fill="#68bf91" />
    <rect x="2" y="500" width="106" height="84" rx="6" fill="#8cd1ac" />

    
    <polygon points="110,10 140,10 140,76 110,76" fill="#207448" opacity="0.3" />
    <polygon points="110,110 140,110 140,176 110,176" fill="#2a8a56" opacity="0.3" />
    <polygon points="110,210 140,210 140,276 110,276" fill="#349c64" opacity="0.3" />
    <polygon points="110,310 140,310 140,376 110,376" fill="#4aac78" opacity="0.3" />
    <polygon points="110,410 140,410 140,476 110,476" fill="#68bf91" opacity="0.3" />
    <polygon points="110,510 140,510 140,576 110,576" fill="#8cd1ac" opacity="0.3" />
  </g>

  
  <g transform="translate(200, 445)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="8" r="3" fill="#207448" />
      <circle cx="22" cy="8" r="3" fill="#207448" />
      <rect x="12" y="26" width="32" height="18" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4 2" />
    </g>
    <text x="96" y="52" font-family="sans-serif" font-size="24" fill="#303a36">AnonPages: process private heap and stack</text>
  </g>

  
  <g transform="translate(200, 545)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <ellipse cx="28" cy="12" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 12 v 16 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -16" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 28 v 16 c 0 4.4 10.7 8 24 8 s 24 -3.6 24 -8 v -16" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="96" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">Cached: page cache, including mapped files</tspan>
      <tspan x="96" dy="28">and tmpfs through Shmem</tspan>
    </text>
  </g>

  
  <g transform="translate(200, 645)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <rect x="2" y="4" width="52" height="20" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="4" x2="28" y2="24" stroke="#207448" stroke-width="3" stroke-dasharray="3 3" />
      <rect x="2" y="32" width="52" height="20" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="32" x2="28" y2="52" stroke="#207448" stroke-width="3" />
    </g>
    <text x="96" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">Slab = SReclaimable (can be freed)</tspan>
      <tspan x="96" dy="28">+ SUnreclaim (cannot)</tspan>
    </text>
  </g>

  
  <g transform="translate(200, 745)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="20" y="20" width="16" height="16" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" />
    </g>
    <text x="96" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">PageTables and KernelStack:</tspan>
      <tspan x="96" dy="28">kernel overhead</tspan>
    </text>
  </g>

  
  <g transform="translate(200, 845)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <rect x="4" y="4" width="48" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="4" x2="28" y2="52" stroke="#207448" stroke-width="3" />
      <circle cx="16" cy="16" r="3" fill="#207448" />
      <circle cx="40" cy="16" r="3" fill="#207448" />
      <circle cx="16" cy="40" r="3" fill="#207448" />
      <circle cx="40" cy="40" r="3" fill="#207448" />
    </g>
    <text x="96" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">HugePages_*: explicitly reserved,</tspan>
      <tspan x="96" dy="28">ordinary allocation cannot use it</tspan>
    </text>
  </g>

  
  <g transform="translate(200, 945)">
    <rect x="0" y="0" width="850" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 15)">
      <rect x="10" y="22" width="36" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 22 v -8 a 10 10 0 0 1 20 0 v 8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="35" r="3" fill="#207448" />
      <line x1="28" y1="38" x2="28" y2="44" stroke="#207448" stroke-width="3" />
    </g>
    <text x="96" y="38" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="96" dy="0">Mlocked and Unevictable:</tspan>
      <tspan x="96" dy="28">reclaim cannot touch</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 445)">
    <rect x="0" y="0" width="460" height="586" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(202, 120)">
      <path d="M 28 4 L 4 14 v 22 c 0 18 24 28 24 28 s 24 -10 24 -28 v -22 z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 16 32 l 8 8 l 16 -16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="230" dy="0">In buff/cache, shared and</tspan>
      <tspan x="230" dy="38">tmpfs pages and mlocked</tspan>
      <tspan x="230" dy="38">pages are not reclaimable</tspan>
    </text>
  </g>

  
  <rect x="60" y="1065" width="1480" height="75" rx="10" fill="#207448" />
  <text x="800" y="1113" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Read available, not free</text>
</svg>