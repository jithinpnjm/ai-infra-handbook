<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>umask worked out: starting mode minus the mask</title>
  <desc>Infographic explaining Linux umask calculations for files and directories, comparison table across 022, 077, and 002, and a shared directory recipe with setgid.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">umask worked out: starting mode minus the mask</text>

  
  
  <rect x="50" y="105" width="1500" height="64" rx="8" fill="#207448" />

  
  <text x="145" y="147" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">umask</text>

  
  <text x="445" y="147" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">New file: 666 minus mask</text>

  
  <text x="880" y="147" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">New directory: 777 minus mask</text>

  
  <text x="1330" y="147" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Who it suits</text>

  
  <rect x="50" y="179" width="1500" height="186" rx="8" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  
  <rect x="65" y="194" width="160" height="156" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="145" y="260" font-family="monospace" font-size="44" font-weight="bold" fill="#db8129" text-anchor="middle">022</text>
  <rect x="75" y="285" width="140" height="34" rx="4" fill="#db8129" />
  <text x="145" y="309" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">(the common default)</text>

  
  <rect x="240" y="194" width="410" height="156" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="256" y="235" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">file 666 - 022 = 644</text>
  <text x="256" y="268" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">(rw-r--r--)</text>
  
  <rect x="256" y="282" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="272" y="304" font-family="monospace" font-size="24" fill="#303a36">6 6 6</text>
  <text x="272" y="328" font-family="monospace" font-size="24" fill="#db8129">0 2 2</text>
  <line x1="365" y1="288" x2="365" y2="332" stroke="#207448" stroke-width="2" />
  <text x="382" y="318" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">6 4 4</text>

  
  <rect x="665" y="194" width="430" height="156" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="681" y="235" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">directory 777 - 022 = 755</text>
  <text x="681" y="268" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">(rwxr-xr-x)</text>
  
  <rect x="681" y="282" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="697" y="304" font-family="monospace" font-size="24" fill="#303a36">7 7 7</text>
  <text x="697" y="328" font-family="monospace" font-size="24" fill="#db8129">0 2 2</text>
  <line x1="790" y1="288" x2="790" y2="332" stroke="#207448" stroke-width="2" />
  <text x="807" y="318" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">7 5 5</text>

  
  <rect x="1110" y="194" width="425" height="156" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1126" y="236" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">lets others read what you</tspan>
    <tspan x="1126" dy="32">create; single-user systems</tspan>
    <tspan x="1126" dy="32">and daemons that run as</tspan>
    <tspan x="1126" dy="32">pseudo-users</tspan>
  </text>

  
  <rect x="50" y="375" width="1500" height="176" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

  
  <rect x="65" y="388" width="160" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="475" font-family="monospace" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">077</text>

  
  <rect x="240" y="388" width="410" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="256" y="426" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">file 600 <tspan fill="#207448">(rw-------)</tspan></text>
  
  <rect x="256" y="456" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="272" y="478" font-family="monospace" font-size="24" fill="#303a36">6 6 6</text>
  <text x="272" y="502" font-family="monospace" font-size="24" fill="#207448">0 7 7</text>
  <line x1="365" y1="462" x2="365" y2="506" stroke="#207448" stroke-width="2" />
  <text x="382" y="492" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">6 0 0</text>

  
  <rect x="665" y="388" width="430" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="681" y="426" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">directory 700 <tspan fill="#207448">(rwx------)</tspan></text>
  
  <rect x="681" y="456" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="697" y="478" font-family="monospace" font-size="24" fill="#303a36">7 7 7</text>
  <text x="697" y="502" font-family="monospace" font-size="24" fill="#207448">0 7 7</text>
  <line x1="790" y1="462" x2="790" y2="506" stroke="#207448" stroke-width="2" />
  <text x="807" y="492" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">7 0 0</text>

  
  <rect x="1110" y="388" width="425" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1126" y="435" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">most restrictive; multi-user</tspan>
    <tspan x="1126" dy="34">machines where others must</tspan>
    <tspan x="1126" dy="34">not read your files</tspan>
  </text>

  
  <rect x="50" y="561" width="1500" height="176" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

  
  <rect x="65" y="574" width="160" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="145" y="661" font-family="monospace" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">002</text>

  
  <rect x="240" y="574" width="410" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="256" y="612" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">file 664 <tspan fill="#207448">(rw-rw-r--)</tspan></text>
  
  <rect x="256" y="642" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="272" y="664" font-family="monospace" font-size="24" fill="#303a36">6 6 6</text>
  <text x="272" y="688" font-family="monospace" font-size="24" fill="#207448">0 0 2</text>
  <line x1="365" y1="648" x2="365" y2="692" stroke="#207448" stroke-width="2" />
  <text x="382" y="678" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">6 6 4</text>

  
  <rect x="665" y="574" width="430" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="681" y="612" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">directory 775 <tspan fill="#207448">(rwxrwxr-x)</tspan></text>
  
  <rect x="681" y="642" width="190" height="56" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1" />
  <text x="697" y="664" font-family="monospace" font-size="24" fill="#303a36">7 7 7</text>
  <text x="697" y="688" font-family="monospace" font-size="24" fill="#207448">0 0 2</text>
  <line x1="790" y1="648" x2="790" y2="692" stroke="#207448" stroke-width="2" />
  <text x="807" y="678" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">7 7 5</text>

  
  <rect x="1110" y="574" width="425" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1126" y="626" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1126" dy="0">collaborative group directories</tspan>
    <tspan x="1126" dy="34">on systems with user-private</tspan>
    <tspan x="1126" dy="34">groups</tspan>
  </text>

  
  <rect x="50" y="760" width="1500" height="280" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g id="node-chmod">
    <rect x="75" y="785" width="445" height="228" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(95, 805)">
      <path d="M 4 14 L 20 14 L 26 22 L 52 22 A 4 4 0 0 1 56 26 L 56 50 A 4 4 0 0 1 52 54 L 4 54 A 4 4 0 0 1 0 50 L 0 18 A 4 4 0 0 1 4 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <rect x="22" y="32" width="18" height="14" rx="2" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 26 32 L 26 26 A 5 5 0 0 1 36 26 L 36 32" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    
    <text x="165" y="842" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">sudo chmod 2770 /data/projx</text>
    <text x="95" y="900" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">(setgid so new files inherit</tspan>
      <tspan x="95" dy="34">group projx)</tspan>
    </text>
  </g>

  
  <g transform="translate(540, 899)">
    <circle cx="0" cy="0" r="22" fill="#207448" />
    <path d="M -12 0 L 12 0 M 0 -12 L 0 12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <g id="node-umask">
    <rect x="580" y="785" width="415" height="228" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(600, 805)">
      <circle cx="20" cy="18" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 50 C 4 36 12 34 20 34 C 28 34 36 36 36 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 34 22 C 37 20 42 20 44 24 C 47 28 45 34 40 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 40 40 C 46 41 52 44 52 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="670" y="845" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">members</text>
    <text x="600" y="915" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="600" dy="0">members use umask 002</tspan>
    </text>
  </g>

  
  <line x1="1005" y1="899" x2="1055" y2="899" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-result">
    <rect x="1070" y="785" width="460" height="228" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1090, 805)">
      <path d="M 8 0 L 36 0 L 48 14 L 48 54 A 4 4 0 0 1 44 58 L 8 58 A 4 4 0 0 1 4 54 L 4 4 A 4 4 0 0 1 8 0 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 36 0 L 36 14 L 48 14" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="14" y1="26" x2="38" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="14" y1="36" x2="38" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="14" y1="46" x2="28" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="1160" y="845" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Created Files</text>
    <text x="1090" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1090" dy="0">new files created inside:</tspan>
      <tspan x="1090" dy="34" font-weight="bold" fill="#207448">group projx, mode 664</tspan>
    </text>
  </g>

  
  <rect x="50" y="1065" width="1500" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="1117" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    The umask is really a bit mask rather than a subtraction, but for normal masks the result is the same
  </text>
</svg>