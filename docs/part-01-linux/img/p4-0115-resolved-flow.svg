<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>systemd-resolved Architecture and DNS Resolution Path</title>
  <desc>Flow diagram illustrating DNS resolution paths from client applications through systemd-resolved local cache, routing logic, and per-interface manager to upstream nameservers.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">systemd-resolved Architecture and DNS Resolution Path</text>

  
  <g id="client-app">
    <rect x="360" y="105" width="880" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(390, 119)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="48" rx="6" />
      <line x1="0" y1="14" x2="56" y2="14" />
      <circle cx="10" cy="7" r="2.5" fill="#207448" />
      <circle cx="18" cy="7" r="2.5" fill="#207448" />
      <circle cx="26" cy="7" r="2.5" fill="#207448" />
    </g>
    <text x="475" y="159" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Client Application (calling getaddrinfo)</text>
  </g>

  
  
  <path d="M 580,190 L 580,225 L 410,225 L 410,246" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <path d="M 1020,190 L 1020,225 L 1190,225 L 1190,246" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="path-1">
    <rect x="50" y="250" width="720" height="205" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(75, 275)" stroke="#db8129" stroke-width="3" fill="none">
      <rect x="4" y="8" width="48" height="32" rx="4" />
      <line x1="16" y1="40" x2="16" y2="52" />
      <line x1="40" y1="40" x2="40" y2="52" />
      <circle cx="20" cy="24" r="4" fill="#db8129" />
      <circle cx="36" cy="24" r="4" fill="#db8129" />
      <line x1="24" y1="24" x2="32" y2="24" />
    </g>
    <text x="150" y="290" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="150" dy="0">Libc consults /etc/nsswitch.conf with</tspan>
      <tspan x="150" dy="34" font-family="monospace" font-size="24px">'hosts: ... resolve [!UNAVAIL=return] dns'</tspan>
      <tspan x="150" dy="34">routing directly to systemd-resolved</tspan>
      <tspan x="150" dy="34">via D-Bus local IPC</tspan>
    </text>
  </g>

  
  <g id="path-2">
    <rect x="830" y="250" width="720" height="205" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(855, 275)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 6,4 L 34,4 L 46,16 L 46,50 L 6,50 Z" />
      <polyline points="34,4 34,16 46,16" />
      <path d="M 16,36 C 24,24 38,28 40,38" />
      <polyline points="34,38 40,38 40,32" />
    </g>
    <text x="930" y="290" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="930" dy="0">Legacy apps read /etc/resolv.conf,</tspan>
      <tspan x="930" dy="34">shown as a symlink pointing to</tspan>
      <tspan x="930" dy="34" font-family="monospace" font-size="24px">/run/systemd/resolve/stub-resolv.conf,</tspan>
      <tspan x="930" dy="34">which defines 'nameserver 127.0.0.53'</tspan>
    </text>
  </g>

  
  <path d="M 410,455 L 410,500" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <path d="M 1190,455 L 1190,500" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="systemd-resolved-daemon">
    <rect x="50" y="504" width="1500" height="370" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(80, 520)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28,6 L 28,12 M 28,44 L 28,50 M 6,28 L 12,28 M 44,28 L 50,28 M 12,12 L 17,17 M 39,39 L 44,44 M 12,44 L 17,39 M 39,17 L 44,12" />
    </g>
    <text x="155" y="557" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#303a36">systemd-resolved daemon</text>

    
    <g id="local-cache">
      <rect x="80" y="585" width="460" height="260" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(105, 605)" stroke="#207448" stroke-width="3" fill="none">
        <ellipse cx="28" cy="12" rx="22" ry="8" />
        <path d="M 6,12 L 6,26 C 6,31 16,35 28,35 C 40,35 50,31 50,26 L 50,12" />
        <path d="M 6,26 L 6,40 C 6,45 16,49 28,49 C 40,49 50,45 50,40 L 50,26" />
      </g>
      <text x="175" y="642" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Local Cache</text>
      <text x="105" y="700" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="105" dy="0">(configured with</tspan>
        <tspan x="105" dy="38" font-family="monospace">Cache=yes</tspan>
        <tspan font-family="sans-serif"> or </tspan>
        <tspan font-family="monospace">no-negative)</tspan>
      </text>
    </g>

    
    <g id="domain-routing">
      <rect x="570" y="585" width="460" height="260" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(595, 605)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="14" cy="42" r="6" />
        <circle cx="42" cy="14" r="6" />
        <circle cx="42" cy="42" r="6" />
        <path d="M 20,42 L 36,42" />
        <path d="M 17,37 C 22,24 30,16 36,15" />
      </g>
      <text x="665" y="642" font-family="sans-serif" font-size="27px" font-weight="bold" fill="#303a36">Domain Routing Logic</text>
      <text x="595" y="700" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="595" dy="0">(evaluating</tspan>
        <tspan x="595" dy="38" font-family="monospace">Domains=</tspan>
        <tspan font-family="sans-serif"> search lists)</tspan>
      </text>
    </g>

    
    <g id="interface-manager">
      <rect x="1060" y="585" width="460" height="260" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(1085, 605)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="6" y="8" width="44" height="34" rx="4" />
        <rect x="18" y="24" width="20" height="18" />
        <line x1="23" y1="24" x2="23" y2="34" />
        <line x1="28" y1="24" x2="28" y2="34" />
        <line x1="33" y1="24" x2="33" y2="34" />
      </g>
      <text x="1155" y="642" font-family="sans-serif" font-size="27px" font-weight="bold" fill="#303a36">Per-Interface Manager</text>
      <text x="1085" y="695" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="1085" dy="0">(ingesting link DNS from</tspan>
        <tspan x="1085" dy="36" font-family="monospace">systemd-networkd</tspan>
        <tspan x="1085" dy="36" font-family="monospace">.network</tspan>
        <tspan font-family="sans-serif"> files)</tspan>
      </text>
    </g>
  </g>

  
  <g id="egress-flow">
    <line x1="800" y1="874" x2="800" y2="978" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="470" y="904" width="660" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="800" y="936" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Per-link queries dispatched over port 53 / DoT</text>
  </g>

  
  <g id="upstream-dns">
    <rect x="80" y="984" width="1440" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(115, 1020)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 12,38 A 12,12 0 0,1 18,18 A 16,16 0 0,1 46,16 A 14,14 0 0,1 54,38 Z" />
      <line x1="22" y1="48" x2="44" y2="48" />
      <circle cx="28" cy="48" r="2" fill="#207448" />
      <circle cx="38" cy="48" r="2" fill="#207448" />
    </g>
    <text x="195" y="1035" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Upstream DNS</text>
    <text x="195" y="1078" font-family="sans-serif" font-size="25px" fill="#303a36">(e.g. cloud metadata resolver at 169.254.169.254 or corporate nameservers)</text>
  </g>
</svg>