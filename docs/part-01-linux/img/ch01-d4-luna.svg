<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
  <title>Distributions: Linux is a kernel, not a system</title>
  <desc>Five parts grouped together inside one Linux distribution container.</desc>
  <rect width="1600" height="1100" fill="#f5f8f5"/>
  <text x="800" y="90" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Distributions: Linux is a kernel, not a system</text>

  <rect x="40" y="145" width="1520" height="900" rx="28" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <text x="800" y="215" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#207448">A Linux distribution bundles these five parts</text>

  <g font-family="sans-serif" fill="#303a36">
    <rect x="82" y="255" width="1436" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <rect x="82" y="255" width="10" height="135" rx="5" fill="#db8129"/>
    <g transform="translate(125 293)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="48" height="48" rx="8"/>
      <rect x="19" y="19" width="26" height="26" rx="3"/>
      <path d="M18 0v8M30 0v8M42 0v8M18 56v8M30 56v8M42 56v8M0 18h8M0 30h8M0 42h8M56 18h8M56 30h8M56 42h8"/>
    </g>
    <text x="220" y="310" font-size="32" font-weight="700">Linux kernel build</text>
    <text x="220" y="352" font-size="28">+ modules</text>

    <rect x="82" y="408" width="1436" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(125 446)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 12h26v42H6zM32 18h26v36H32z"/>
      <path d="M12 21h14M12 30h14M12 39h14M38 27h14M38 36h14M38 45h14"/>
    </g>
    <text x="220" y="463" font-size="32" font-weight="700">C library, core tools,</text>
    <text x="220" y="505" font-size="28">shell, systemd</text>

    <rect x="82" y="561" width="1436" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(125 599)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 17 32 4l24 13v30L32 60 8 47z"/>
      <path d="M8 17l24 14 24-14M32 31v29"/>
      <path d="M20 10l24 14"/>
    </g>
    <text x="220" y="616" font-size="32" font-weight="700">Package manager</text>
    <text x="220" y="658" font-size="28">apt, dnf, zypper</text>

    <rect x="82" y="714" width="1436" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(125 752)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="13"/>
      <path d="M32 3v8M32 53v8M3 32h8M53 32h8M11.5 11.5l6 6M46.5 46.5l6 6M52.5 11.5l-6 6M17.5 46.5l-6 6"/>
      <path d="M28 3h8l2 7 6 3 6-3 6 7-4 6 1 7 6 4-3 9-7 1-5 5 1 7-9 3-4-6-7-1-5 5-8-5 2-7-3-6-7-2v-9l7-3 3-6-3-6 7-6 6 4 7-2z"/>
    </g>
    <text x="220" y="769" font-size="32" font-weight="700">Services and defaults</text>
    <text x="220" y="811" font-size="28">networking, logging</text>

    <rect x="82" y="867" width="1436" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(125 905)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="8" width="50" height="48" rx="5"/>
      <path d="M7 21h50M18 3v11M46 3v11M17 31h8M32 31h8M17 42h8M32 42h8"/>
    </g>
    <text x="220" y="922" font-size="32" font-weight="700">Support policy and</text>
    <text x="220" y="964" font-size="28">release schedule</text>
  </g>
</svg>