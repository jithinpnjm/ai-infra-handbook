<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>How the kernel checks permissions: first match wins, nothing adds up</title>
  <desc>Flowchart illustrating Linux kernel permission resolution order from user to group to other, demonstrating that permissions do not combine.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    How the kernel checks permissions: first match wins, nothing adds up
  </text>

  
  <g id="start-node">
    <rect x="60" y="110" width="840" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(90, 145)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 0 L 32 0 L 46 14 L 46 64 L 0 64 Z" />
      <path d="M 32 0 L 32 16 L 46 16" />
      <line x1="10" y1="28" x2="36" y2="28" />
      <line x1="10" y1="42" x2="36" y2="42" />
    </g>
    <text x="160" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      Process asks to read report.txt
    </text>
    <text x="160" y="200" font-family="monospace" font-size="24" fill="#303a36">
      file: owner alice UID 1042, group projx GID 2001,
    </text>
    <text x="160" y="234" font-family="monospace" font-size="24" fill="#303a36">
      mode 0070 shown as '---rwx---'
    </text>
  </g>

  
  <path d="M 250 260 L 250 310" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="diamond-1">
    <polygon points="250,310 450,400 250,490 50,400" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="70" cy="335" r="24" fill="#207448" />
    <text x="70" y="343" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="250" y="388" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Effective UID equals</text>
    <text x="250" y="422" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">the file owner?</text>
  </g>

  
  <path d="M 450 400 L 590 400" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <rect x="492" y="384" width="56" height="32" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="520" y="407" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">yes</text>

  
  <g id="box-user-denied">
    <rect x="600" y="335" width="300" height="130" rx="12" fill="#fff5f5" stroke="#db8129" stroke-width="3" />
    <text x="750" y="385" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      Use the user triple only:
    </text>
    <text x="750" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c0392b">
      --- so DENIED (stop)
    </text>
  </g>

  
  <path d="M 250 490 L 250 580" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <rect x="222" y="520" width="56" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="250" y="543" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <g id="diamond-2">
    <polygon points="250,580 460,685 250,790 40,685" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="70" cy="605" r="24" fill="#207448" />
    <text x="70" y="613" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="250" y="655" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Effective GID or a</text>
    <text x="250" y="688" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">supplementary group</text>
    <text x="250" y="721" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">equals the file group?</text>
  </g>

  
  <path d="M 460 685 L 490 685" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 550 685 L 590 685" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <rect x="492" y="669" width="56" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="520" y="692" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <g id="box-group-granted">
    <rect x="600" y="620" width="300" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="750" y="670" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      Use the group triple only:
    </text>
    <text x="750" y="710" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      rwx so GRANTED (stop)
    </text>
  </g>

  
  <path d="M 250 790 L 250 880" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <rect x="222" y="820" width="56" height="32" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="250" y="843" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <g id="box-other">
    <rect x="60" y="880" width="380" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="100" cy="940" r="24" fill="#207448" />
    <text x="100" y="948" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="260" y="948" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      Use the other triple: ---
    </text>
  </g>

  

  
  <g id="card-alice">
    <rect x="960" y="270" width="580" height="240" rx="14" fill="#fffdfa" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(995, 305)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="20" cy="16" r="14" />
      <path d="M 0 52 C 0 38 10 34 20 34 C 30 34 40 38 40 52" />
    </g>
    <text x="1055" y="335" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      alice (UID 1042, member of projx):
    </text>
    <text x="995" y="395" font-family="sans-serif" font-size="24" fill="#303a36">
      matches owner first, user triple --- ,
    </text>
    <text x="995" y="445" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c0392b">
      denied even though she is in projx
    </text>
  </g>

  
  <g id="card-bob">
    <rect x="960" y="550" width="580" height="230" rx="14" fill="#f9fcf9" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(995, 585)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="16" r="14" />
      <path d="M 0 52 C 0 38 10 34 20 34 C 30 34 40 38 40 52" />
    </g>
    <text x="1055" y="615" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
      bob (UID 1043, member of projx):
    </text>
    <text x="995" y="675" font-family="sans-serif" font-size="24" fill="#303a36">
      not the owner, matches group,
    </text>
    <text x="995" y="725" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      group triple rwx, granted
    </text>
  </g>

  
  <g id="note-root">
    <rect x="960" y="820" width="580" height="130" rx="12" fill="#eef3f0" stroke="#7a8b84" stroke-width="2" stroke-dasharray="8 6" />
    
    <g transform="translate(995, 855)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 4 L 34 10 L 34 26 C 34 40 18 50 18 50 C 18 50 2 40 2 26 L 2 10 Z" />
    </g>
    <text x="1050" y="878" font-family="sans-serif" font-size="24" fill="#303a36">
      root (UID 0) passes nearly all checks
    </text>
    <text x="1050" y="918" font-family="sans-serif" font-size="24" fill="#303a36">
      through capabilities
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="60" y="1130" width="1480" height="80" rx="12" fill="#207448" />
    <text x="800" y="1180" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      The checks do not add up: the first matching class decides
    </text>
  </g>
</svg>