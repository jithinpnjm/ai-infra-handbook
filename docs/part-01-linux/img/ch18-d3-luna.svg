<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Quota: hard ceiling (CFS bandwidth control)</title>
  <desc id="svg-desc"></desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L16 9 L0 18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L16 9 L0 18 Z" fill="#db8129"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f8f5"/>
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Quota: hard ceiling (CFS bandwidth control)</text>

  <g fill="#e8f1ea" stroke="#207448" stroke-width="3">
    <rect x="140" y="130" width="1320" height="112" rx="20"/>
    <rect x="140" y="272" width="1320" height="112" rx="20"/>
    <rect x="140" y="414" width="1320" height="112" rx="20"/>
    <rect x="140" y="556" width="1320" height="112" rx="20"/>
    <rect x="140" y="698" width="1320" height="112" rx="20"/>
  </g>

  <path d="M800 242 V272" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M800 384 V414" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M800 526 V556" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M800 668 V698" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="184" y="158" width="56" height="56" rx="7"/>
    <path d="M196 150 V158 M208 150 V158 M220 150 V158 M232 150 V158 M196 214 V222 M208 214 V222 M220 214 V222 M232 214 V222 M176 170 H184 M176 182 H184 M176 194 H184 M176 206 H184 M240 170 H248 M240 182 H248 M240 194 H248 M240 206 H248"/>
    <path d="M201 175 H223 V197 H201 Z M205 180 H219 M205 186 H219 M205 192 H215"/>

    <circle cx="212" cy="328" r="25"/>
    <circle cx="212" cy="328" r="14"/>
    <path d="M212 303 V289 M212 367 V353 M187 328 H173 M251 328 H237 M194 310 L184 300 M240 356 L230 346 M230 310 L240 300 M184 356 L194 346"/>
    <path d="M212 314 V328 L222 334"/>

    <rect x="184" y="442" width="56" height="56" rx="14"/>
    <path d="M198 458 V453 A14 14 0 0 1 226 453 V458 M196 458 H228 V486 H196 Z M212 468 V476"/>

    <circle cx="212" cy="612" r="25"/>
    <path d="M212 594 V612 L225 620 M212 580 V586 M212 638 V644 M180 612 H186 M238 612 H244 M189 589 L193 593 M231 631 L235 635 M235 589 L231 593 M193 631 L189 635"/>

    <rect x="184" y="727" width="56" height="44" rx="5"/>
    <path d="M184 739 H240 M195 751 H204 M195 761 H204 M216 751 H230 M216 761 H230"/>
    <path d="M194 719 V727 M230 719 V727 M194 771 V779 M230 771 V779"/>
