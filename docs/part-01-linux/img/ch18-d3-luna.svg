  <g fill="#303a36">
    <text x="280" y="177" font-family="monospace" font-size="30" font-weight="700">cpu.max = 200000 100000</text>
    <text x="280" y="216" font-family="sans-serif" font-size="26">(quota 200 ms per 100 ms period)</text>

    <text x="280" y="319" font-family="sans-serif" font-size="30" font-weight="700">period 1: 16 threads run in parallel</text>
    <text x="280" y="358" font-family="sans-serif" font-size="26">quota used up after ~12.5 ms</text>

    <text x="280" y="461" font-family="sans-serif" font-size="30" font-weight="700">THROTTLED: all threads paused</text>
    <text x="280" y="500" font-family="sans-serif" font-size="26">for the remaining 87.5 ms</text>

    <text x="280" y="624" font-family="sans-serif" font-size="30" font-weight="700">period 2: quota refilled, repeat</text>

    <text x="280" y="745" font-family="sans-serif" font-size="30" font-weight="700">Observed: avg CPU ≈ 2 cores, but latency spikes</text>
    <text x="280" y="784" font-family="monospace" font-size="26">cpu.stat: nr_throttled / nr_periods high</text>
  </g>
</svg>