<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090">
  <title>Escalate from SIGTERM to SIGKILL, with time to shut down in between</title>
  <desc>An infographic illustrating the progression from polite SIGTERM termination request, allowing time for cleanup, to forced SIGKILL as a last resort.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1090" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Escalate from SIGTERM to SIGKILL,</tspan>
    <tspan x="800" dy="58">with time to shut down in between</tspan>
  </text>

  
  <g id="box-clean-exit">
    <rect x="400" y="160" width="720" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(430, 212)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 28 L 24 36 L 40 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="508" y="206" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">Clean exit: </tspan>
      <tspan font-size="24">flushes buffers, saves a checkpoint,</tspan>
      <tspan x="508" dy="40" font-size="24">closes files, removes lock files</tspan>
    </text>
  </g>

  
  <g id="step-1">
    <rect x="40" y="380" width="370" height="230" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <circle cx="76" cy="422" r="24" fill="#207448" />
    <text x="76" y="423" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(120, 396)">
      <rect x="20" y="2" width="12" height="48" rx="3" fill="#207448" />
      <rect x="2" y="20" width="48" height="12" rx="3" fill="#207448" />
      <rect x="7" y="7" width="38" height="38" rx="3" fill="#207448" transform="rotate(45 26 26)" />
      <circle cx="26" cy="26" r="18" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <circle cx="26" cy="26" r="7" fill="#207448" />
    </g>
    
    <text x="225" y="504" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="25" font-weight="bold" fill="#303a36">kill 1234 (SIGTERM)</text>
    <text x="225" y="552" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="225" dy="0">Polite request</tspan>
      <tspan x="225" dy="32">to terminate</tspan>
    </text>
  </g>

  
  <line x1="410" y1="495" x2="470" y2="495" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="diamond">
    <polygon points="580,360 690,495 580,630 470,495" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="580" y="487" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="580" dy="0">Program</tspan>
      <tspan x="580" dy="34">responds?</tspan>
    </text>
  </g>

  
  <line x1="580" y1="360" x2="580" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="596" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">yes</text>

  
  <line x1="690" y1="495" x2="760" y2="495" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="725" y="478" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">no</text>

  
  <g id="step-2">
    <rect x="760" y="380" width="340" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="796" cy="422" r="24" fill="#207448" />
    <text x="796" y="423" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(840, 396)">
      <circle cx="26" cy="26" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="26,12 26,26 36,26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="930" y="534" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="930" dy="0">Give it time</tspan>
      <tspan x="930" dy="38">to shut down</tspan>
    </text>
  </g>

  
  <line x1="1100" y1="495" x2="1180" y2="495" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="step-3">
    <rect x="1180" y="380" width="380" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="1216" cy="422" r="24" fill="#207448" />
    <text x="1216" y="423" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(1260, 396)">
      <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="105 35" stroke-dashoffset="18" />
      <line x1="26" y1="4" x2="26" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="1370" y="504" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="25" font-weight="bold" fill="#303a36">kill -9 1234 (SIGKILL)</text>
    <text x="1370" y="552" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1370" dy="0">Last resort,</tspan>
      <tspan x="1370" dy="32">cannot be caught</tspan>
    </text>
  </g>

  
  <g id="box-no-cleanup">
    <rect x="1140" y="650" width="420" height="215" rx="12" fill="#f0f2f0" stroke="#71717a" stroke-width="2" />
    <text x="1350" y="688" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1350" dy="0" font-weight="bold">No cleanup: lock files,</tspan>
      <tspan x="1350" dy="32">half-written files and</tspan>
      <tspan x="1350" dy="32">orphaned children can remain.</tspan>
      <tspan x="1350" dy="32">GPU memory may need the</tspan>
      <tspan x="1350" dy="32">driver to reclaim it.</tspan>
    </text>
  </g>

  
  <g id="note-d-state">
    <rect x="40" y="895" width="1520" height="75" rx="10" fill="#f0f2f0" stroke="#71717a" stroke-width="2" />
    
    <g transform="translate(70, 912)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#71717a" stroke-width="3" />
      <line x1="20" y1="18" x2="20" y2="28" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
      <circle cx="20" cy="12" r="2.5" fill="#71717a" />
    </g>
    <text x="125" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      A signal handled by a process in D state takes effect only when the process leaves that state.
    </text>
  </g>

  
  <g id="caption-bar">
    <rect x="40" y="990" width="1520" height="60" rx="8" fill="#207448" />
    <text x="800" y="1031" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">
      Escalate in order.
    </text>
  </g>
</svg>