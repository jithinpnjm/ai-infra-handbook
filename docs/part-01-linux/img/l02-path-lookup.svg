<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>How the shell finds a bare word</title>
  <desc>Visual explanation of shell command search precedence for typing python3: alias, function, builtin, then PATH directories searched in order, leading to program runs.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How the shell finds a bare word</text>

  
  <rect x="80" y="120" width="680" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="105" y="136" width="630" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="420" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">typing python3</text>

  
  <rect x="105" y="205" width="630" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="155" cy="250" r="24" fill="#207448" />
  <text x="155" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <g transform="translate(205, 222)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 28 L 26 8 L 48 8 L 48 30 L 28 50 Z" />
    <circle cx="38" cy="18" r="4" fill="#207448" />
  </g>
  <text x="285" y="261" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">alias</text>

  
  <line x1="420" y1="295" x2="420" y2="326" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="105" y="330" width="630" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="155" cy="375" r="24" fill="#207448" />
  <text x="155" y="375" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <g transform="translate(205, 347)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 8 C 8 8 8 22 2 28 C 8 34 8 48 18 48" />
    <path d="M 38 8 C 48 8 48 22 54 28 C 48 34 48 48 38 48" />
  </g>
  <text x="285" y="386" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">function</text>

  
  <line x1="420" y1="420" x2="420" y2="451" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="105" y="455" width="630" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="155" cy="500" r="24" fill="#207448" />
  <text x="155" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <g transform="translate(205, 472)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="32" height="32" rx="4" />
    <line x1="20" y1="4" x2="20" y2="12" />
    <line x1="36" y1="4" x2="36" y2="12" />
    <line x1="20" y1="44" x2="20" y2="52" />
    <line x1="36" y1="44" x2="36" y2="52" />
    <line x1="4" y1="20" x2="12" y2="20" />
    <line x1="4" y1="36" x2="12" y2="36" />
    <line x1="44" y1="20" x2="52" y2="20" />
    <line x1="44" y1="36" x2="52" y2="36" />
  </g>
  <text x="285" y="511" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">builtin</text>

  
  <line x1="420" y1="545" x2="420" y2="576" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="105" y="580" width="630" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="155" cy="637" r="24" fill="#207448" />
  <text x="155" y="637" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <g transform="translate(205, 609)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 16 L 20 16 L 26 22 L 48 22 C 50 22 52 24 52 26 L 52 46 C 52 48 50 50 48 50 L 6 50 C 4 50 2 48 2 46 L 2 20 C 2 18 4 16 6 16 Z" />
    <circle cx="34" cy="34" r="7" />
    <line x1="39" y1="39" x2="46" y2="46" />
  </g>
  <text x="285" y="628" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="285" dy="0">PATH directories</tspan>
    <tspan x="285" dy="36">searched in order</tspan>
  </text>

  
  <line x1="420" y1="695" x2="420" y2="761" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="105" y="765" width="630" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(205, 787)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="8" />
    <polygon points="22,18 36,28 22,38" fill="#207448" />
  </g>
  <text x="285" y="827" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">program runs</text>

  
  <rect x="840" y="120" width="680" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="865" y="145" width="630" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(895, 175)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="46" height="38" rx="6" />
    <path d="M 14 18 L 22 25 L 14 32" />
    <line x1="26" y1="32" x2="36" y2="32" />
  </g>
  <text x="965" y="204" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">type -a python3</text>
  <text x="895" y="295" font-family="sans-serif" font-size="24" fill="#303a36">(every way it could resolve, in order)</text>

  
  <rect x="865" y="370" width="630" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(895, 400)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="27" cy="25" r="18" />
    <circle cx="27" cy="25" r="8" />
    <line x1="27" y1="3" x2="27" y2="9" />
    <line x1="27" y1="41" x2="27" y2="47" />
    <line x1="5" y1="25" x2="11" y2="25" />
    <line x1="43" y1="25" x2="49" y2="25" />
  </g>
  <text x="965" y="429" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">command -v python3</text>
  <text x="895" y="520" font-family="sans-serif" font-size="24" fill="#303a36">(the one that will run)</text>

  
  <rect x="840" y="640" width="680" height="225" rx="16" fill="#fdf6ee" stroke="#db8129" stroke-width="3" />
  <rect x="840" y="640" width="12" height="225" rx="6" fill="#db8129" />
  
  <g transform="translate(878, 725)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 52 48 L 4 48 Z" />
    <line x1="28" y1="20" x2="28" y2="32" />
    <circle cx="28" cy="40" r="2" fill="#db8129" />
  </g>
  <text x="955" y="736" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="955" dy="0">wrong version runs, check</tspan>
    <tspan x="955" dy="38">PATH order or an alias first</tspan>
  </text>
</svg>