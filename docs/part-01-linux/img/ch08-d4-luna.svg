<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>Signals: disposition, escalation, and D state</title>
  <desc>How Linux signals reach a process, the three dispositions (default, ignore, catch), why SIGKILL and SIGSTOP cannot be caught, and why D state delays delivery.</desc>

  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L16,8 L0,15 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#f5f8f5"/>
  <text x="800" y="72" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">How signals reach a process</text>

  <!-- Sender -->
  <rect x="40" y="135" width="375" height="230" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <g fill="none" stroke="#207448" stroke-width="3.5"><rect x="64" y="164" width="44" height="32" rx="4"/><path d="M64 174h44"/></g>
  <text x="124" y="188" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">Signal source</text>
  <text x="64" y="236" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="64" dy="0">• Kernel (SIGSEGV, SIGCHLD)</tspan>
    <tspan x="64" dy="34">• Terminal (Ctrl-C: SIGINT)</tspan>
    <tspan x="64" dy="34" font-family="monospace">• kill -TERM / kill -9</tspan>
  </text>

  <path d="M415 250 H466" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Kernel signal delivery -->
  <rect x="470" y="135" width="400" height="230" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round">
    <rect x="486" y="160" width="42" height="42" rx="5"/><rect x="497" y="171" width="20" height="20"/>
    <path d="M497 160v-7 M507 160v-7 M517 160v-7 M497 202v7 M507 202v7 M517 202v7"/>
  </g>
  <text x="546" y="188" fill="#303a36" font-family="sans-serif" font-size="28" font-weight="700">Kernel check</text>
  <text x="486" y="238" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="486" dy="0">Same owner or root?</tspan>
    <tspan x="486" dy="34">Records pending signal.</tspan>
    <tspan x="486" dy="34" font-weight="700">SIGKILL / SIGSTOP: kernel acts</tspan>
    <tspan x="486" dy="30" font-weight="700">directly (cannot be caught).</tspan>
  </text>

  <!-- Top-right: 3 dispositions -->
  <path d="M870 190 H925 V165 H976" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M870 250 H976" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M870 310 H925 V375 H976" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  <rect x="980" y="110" width="580" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1006" y="150" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">1. Default action</text>
  <text x="1006" y="186" fill="#303a36" font-family="sans-serif" font-size="24">Terminate, terminate + core, stop, or ignore</text>

  <rect x="980" y="225" width="580" height="86" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1006" y="264" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">2. Ignore (except SIGKILL / SIGSTOP)</text>
  <text x="1006" y="296" fill="#303a36" font-family="sans-serif" font-size="24">Signal discarded without running user code</text>

  <rect x="980" y="326" width="580" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1006" y="366" fill="#303a36" font-family="sans-serif" font-size="26" font-weight="700">3. Catch with handler (SIGTERM, SIGHUP)</text>
  <text x="1006" y="402" fill="#303a36" font-family="sans-serif" font-size="24">Flush buffers, save checkpoint, clean lock files</text>

  <!-- Lower section: Escalation vs D-state trap -->
  <rect x="40" y="480" width="740" height="320" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
  <text x="72" y="528" fill="#207448" font-family="sans-serif" font-size="29" font-weight="700">Escalation order: SIGTERM before SIGKILL</text>
  <rect x="72" y="556" width="310" height="110" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <text x="227" y="600" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">1. kill -TERM PID</text>
  <text x="227" y="638" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">Polite shutdown + cleanup</text>

  <path d="M382 611 H436" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="440" y="556" width="310" height="110" rx="14" fill="#f5f8f5" stroke="#db8129" stroke-width="3.5"/>
  <text x="595" y="600" text-anchor="middle" fill="#303a36" font-family="monospace" font-size="26" font-weight="700">2. kill -9 PID</text>
  <text x="595" y="638" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="24">Last resort: no cleanup</text>

  <text x="72" y="720" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="72" dy="0">Abrupt SIGKILL can leave lock files, half-written files,</tspan>
    <tspan x="72" dy="34">orphaned children, and GPU memory for the driver to reclaim.</tspan>
  </text>

  <!-- Right bottom: D state warning -->
  <rect x="820" y="480" width="740" height="320" rx="18" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <g fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round">
    <path d="M876 508l24 44h-48z"/><path d="M876 526v12 M876 544v2"/>
  </g>
  <text x="916" y="544" fill="#db8129" font-family="sans-serif" font-size="29" font-weight="700">Why kill -9 does not stop a D-state process</text>
  <text x="854" y="602" fill="#303a36" font-family="sans-serif" font-size="24">
    <tspan x="854" dy="0">• Process is in uninterruptible kernel I/O sleep (state D):</tspan>
    <tspan x="876" dy="34">hung NFS/Lustre mount, failing disk, or wedged GPU driver.</tspan>
    <tspan x="854" dy="42">• Pending SIGKILL waits until the kernel I/O call returns.</tspan>
    <tspan x="854" dy="42">• Fix the underlying mount/disk/driver, or reboot.</tspan>
  </text>

  <!-- Takeaway bar -->
  <rect x="40" y="840" width="1520" height="96" rx="14" fill="#207448"/>
  <text x="800" y="898" text-anchor="middle" fill="#f5f8f5" font-family="sans-serif" font-size="27" font-weight="700">Use signal names (SIGTERM, SIGHUP, SIGKILL) in scripts; use kill -- -PGID to signal a whole process group.</text>
</svg>
