<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <title>How Linux frees memory</title>
  <desc>How Linux frees memory</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#db8129"/>
    </marker>
  </defs>

  <rect width="1600" height="1240" fill="#f5f8f5"/>

  <text x="80" y="82" fill="#303a36" font-family="sans-serif" font-size="48" font-weight="700">How Linux frees memory</text>

  
  <rect x="60" y="105" width="1480" height="110" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M91 133h35l17 17v39H91z"/>
    <path d="M126 133v18h17"/>
    <path d="M101 164h31M101 176h25"/>
  </g>
  <text x="170" y="173" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">Free pages above 'high' watermark: all fine</text>

  
  <path d="M800 215V255" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="200" y="255" width="1200" height="135" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="270" cy="322" r="24"/>
    <circle cx="270" cy="322" r="8"/>
    <path d="M270 289v9M270 346v9M237 322h9M294 322h9M247 299l7 7M286 338l7 7M293 299l-7 7M254 338l-7 7"/>
  </g>
  <text x="330" y="307" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="330" dy="0">Below 'low' watermark:</tspan>
    <tspan x="330" dy="38">kswapd wakes (background reclaim)</tspan>
  </text>

  
  <path d="M800 390V430M245 430H1045" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M245 430V470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M645 430V470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1045 430V470" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="60" y="470" width="370" height="300" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M209 493h35l17 17v35h-52z"/>
    <path d="M244 493v18h17"/>
    <path d="M219 522h31M219 534h25"/>
    <path d="M201 500v54h53"/>
  </g>
  <text x="245" y="585" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="245" dy="0">Reclaim page cache</tspan>
    <tspan x="245" dy="36">(clean pages</tspan>
    <tspan x="245" dy="36">dropped instantly;</tspan>
    <tspan x="245" dy="36">dirty ones written</tspan>
    <tspan x="245" dy="36">first)</tspan>
  </text>

  
  <rect x="460" y="470" width="370" height="300" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="617" y="493" width="56" height="56" rx="5"/>
    <path d="M628 485v8M642 485v8M656 485v8M670 485v8M628 549v8M642 549v8M656 549v8M670 549v8M609 504h8M609 518h8M609 532h8M673 504h8M673 518h8M673 532h8"/>
    <path d="M635 511h20v20h-20z"/>
  </g>
  <text x="645" y="585" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="645" dy="0">Swap out cold</tspan>
    <tspan x="645" dy="36">anonymous pages</tspan>
    <tspan x="645" dy="36">(if swap exists;</tspan>
    <tspan x="645" dy="36">bias set by</tspan>
    <tspan x="645" dy="36">vm.swappiness)</tspan>
  </text>

  
  <rect x="860" y="470" width="370" height="300" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1045" cy="521" r="23"/>
    <circle cx="1045" cy="521" r="8"/>
    <path d="M1045 489v9M1045 544v9M1013 521h9M1068 521h9M1022 498l7 7M1061 537l7 7M1068 498l-7 7M1029 537l-7 7"/>
  </g>
  <text x="1045" y="585" text-anchor="middle" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="1045" dy="0">Reap/shrink</tspan>
    <tspan x="1045" dy="36">kernel caches</tspan>
    <tspan x="1045" dy="36">(slab: dentries,</tspan>
    <tspan x="1045" dy="36">inodes)</tspan>
  </text>

  
  <path d="M1400 322H1530V790H900V820" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <text x="1245" y="590" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">
    <tspan x="1245" dy="0">allocation</tspan>
    <tspan x="1245" dy="32">outpaces kswapd;</tspan>
    <tspan x="1245" dy="32">below 'min'</tspan>
  </text>

  
  <rect x="60" y="820" width="940" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="852" width="56" height="49" rx="4"/>
    <path d="M92 864h56M101 858h2M109 858h2M117 858h2"/>
    <path d="M104 875h32v17h-32z"/>
  </g>
  <text x="170" y="866" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="170" dy="0">Direct reclaim:</tspan>
    <tspan x="170" dy="36">the ALLOCATING thread pauses and</tspan>
    <tspan x="170" dy="36">reclaims synchronously -&gt; latency stalls</tspan>
  </text>

  
  <path d="M530 960V1080" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="560" y="982" width="390" height="42" rx="4" fill="#f5f8f5"/>
  <text x="570" y="1012" fill="#303a36" font-family="sans-serif" font-size="24" font-weight="700">nothing left to reclaim</text>

  
  <rect x="60" y="1080" width="940" height="100" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 1102h34l16 16v40H92z"/>
    <path d="M126 1102v17h16"/>
    <path d="M101 1131l10 10M111 1131l-10 10M119 1136h14"/>
  </g>
  <text x="170" y="1120" fill="#303a36" font-family="sans-serif" font-size="30" font-weight="700">
    <tspan x="170" dy="0">OOM killer selects and</tspan>
    <tspan x="170" dy="36">kills a process</tspan>
  </text>
</svg>