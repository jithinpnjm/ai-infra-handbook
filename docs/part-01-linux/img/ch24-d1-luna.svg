<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Tool coverage: what can each tool see?</title>
  <desc>Top-to-bottom flow of six layers, each paired with its listed observation tools.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L15 9 L2 16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L15 9 L2 16" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>
  <text x="800" y="86" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Tool coverage: what can each tool see?</text>

  <rect x="80" y="120" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="118" y="157" width="56" height="48" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M118 170h56M127 164h2M135 164h2M125 179h42v18h-42zM132 185h28M132 191h20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="177" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Applications / Python / CUDA runtime</text>
  <text x="210" y="222" font-family="monospace" font-size="24" fill="#303a36">strace, ltrace, py-spy, uprobes, USDT, Nsight</text>

  <path d="M800 260v40" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="80" y="300" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <path d="M121 345h50l-5 13h-50zM121 359h50l-5 13h-50zM121 373h50l-5 13h-50z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <path d="M130 351h29M130 365h29M130 379h29" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="357" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">System libraries</text>
  <text x="210" y="402" font-family="monospace" font-size="24" fill="#303a36">uprobes, ldd, LD_DEBUG</text>

  <path d="M800 440v40" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="80" y="480" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="120" y="518" width="52" height="48" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M128 530h36M128 539h24M128 548h30M128 557h18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="164" cy="556" r="2.5" fill="#207448"/>
  <text x="210" y="537" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">System call interface</text>
  <text x="210" y="582" font-family="monospace" font-size="24" fill="#303a36">strace, perf trace, syscount, tracepoints</text>

  <path d="M800 620v40" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="80" y="660" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="128" y="699" width="40" height="40" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M138 690v9M158 690v9M138 739v9M158 739v9M119 709h9M119 729h9M168 709h9M168 729h9M140 711h16v16h-16z" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="717" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Kernel: VFS · scheduler · memory · TCP/IP · block</text>
  <text x="210" y="762" font-family="monospace" font-size="24" fill="#303a36">vmstat, mpstat, iostat, sar, ss · tracepoints, kprobes · perf, ftrace, BPF</text>

  <path d="M800 800v40" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="80" y="840" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="148" cy="910" r="19" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M148 883v8M148 929v8M121 910h8M167 910h8M129 891l6 6M161 923l6 6M167 891l-6 6M135 923l-6 6M148 900v10l7 5" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="897" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Drivers (NVMe, NIC, NVIDIA)</text>
  <text x="210" y="942" font-family="monospace" font-size="24" fill="#303a36">dmesg, ethtool, nvidia-smi, DCGM, kprobes</text>

  <path d="M800 980v40" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="80" y="1020" width="1440" height="140" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="122" y="1061" width="52" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M130 1069h36M130 1079h36M130 1089h36M130 1099h24M116 1067v36M180 1067v36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="1077" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Hardware</text>
  <text x="210" y="1122" font-family="monospace" font-size="24" fill="#303a36">PMCs (perf stat), turbostat, ipmitool, lspci, nvme-cli</text>
</svg>