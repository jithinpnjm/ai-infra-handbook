<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Load balancing and migration cost</title>
  <desc></desc>
  <defs>
    <marker id="arrowhead" markerWidth="18" markerHeight="18" refX="18" refY="9" viewBox="0 0 18 18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#db8129"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f8f5"/>

  <text x="800" y="90" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Load balancing and migration cost</text>

  <rect x="40" y="400" width="800" height="460" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="800" y="130" width="400" height="230" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="1200" y="400" width="360" height="460" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="72" y="428" width="40" height="40" rx="6"/>
    <path d="M82 428v-8h8v8M94 428v-8h8v8M82 468v8h8v-8M94 468v8h8v-8M72 438h-8v8h8M112 438h8v8h-8M72 452h-8v8h8M112 452h8v8h-8"/>
    <rect x="832" y="158" width="40" height="40" rx="6"/>
    <path d="M842 158v-8h8v8M854 158v-8h8v8M842 198v8h8v-8M854 198v8h8v-8M832 168h-8v8h8M872 168h8v8h-8M832 182h-8v8h8M872 182h8v8h-8"/>
    <rect x="1232" y="428" width="40" height="40" rx="6"/>
    <path d="M1242 428v-8h8v8M1254 428v-8h8v8M1242 468v8h8v-8M1254 468v8h8v-8M1232 438h-8v8h8M1272 438h8v8h-8M1232 452h-8v8h8M1272 452h8v8h-8"/>
  </g>

  <text x="136" y="450" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">
    <tspan x="136" dy="0">CPU 0 run queue</tspan>
    <tspan x="136" dy="36">(rbtree by vruntime)</tspan>
  </text>
  <text x="892" y="187" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">CPU 1</text>
  <text x="1292" y="455" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">CPU 2 (idle)</text>

  <rect x="60" y="560" width="220" height="240" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <rect x="330" y="560" width="220" height="240" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <rect x="600" y="560" width="220" height="240" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>

  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 584h30l12 12v42h-42z"/>
    <path d="M176 584v12h12M154 608h26M154 620h26"/>
    <path d="M416 584h30l12 12v42h-42z"/>
    <path d="M446 584v12h12M424 608h26M424 620h26"/>
    <path d="M686 584h30l12 12v42h-42z"/>
    <path d="M716 584v12h12M694 608h26M694 620h26"/>
  </g>

  <text x="170" y="682" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Task A</text>
  <text x="170" y="724" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">vr=100</text>
  <text x="440" y="682" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Task B</text>
  <text x="440" y="724" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">vr=120</text>
  <text x="710" y="682" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Task D</text>
  <text x="710" y="724" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">vr=150</text>

  <rect x="840" y="230" width="320" height="100" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M860 248h30l12 12v42h-42z"/>
    <path d="M890 248v12h12M868 272h26M868 284h26"/>
  </g>
  <text x="930" y="270" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Task C</text>
  <text x="930" y="307" font-family="monospace" font-size="24" fill="#303a36">vr=90</text>

  <rect x="1240" y="560" width="280" height="240" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1354 602h52l-5 34h-42z"/>
    <path d="M1348 602h64M1361 614h38"/>
  </g>
  <text x="1380" y="704" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">(empty)</text>

  <text x="1020" y="500" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1020" dy="0">idle balance pulls</tspan>
    <tspan x="1020" dy="30">a task (cheap within</tspan>
    <tspan x="1020" dy="30">an SMT/L3 domain,</tspan>
    <tspan x="1020" dy="30">resisted across</tspan>
    <tspan x="1020" dy="30">NUMA nodes)</tspan>
  </text>
  <path d="M820 680 H1200" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="8 10" marker-end="url(#arrowhead)"/>
</svg>