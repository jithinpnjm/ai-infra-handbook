<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Affinity and cpuset: the fence and the spot you stand on</title>
  <desc>Visual infographic explaining Linux CPU affinity and cgroup cpuset constraints</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Affinity and cpuset: the fence and the spot you stand on</text>

  
  <rect x="40" y="100" width="800" height="510" rx="16" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>

  
  <g transform="translate(65, 122)">
    <rect x="6" y="6" width="38" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="15" y="15" width="20" height="20" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="14" y1="2" x2="14" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="2" x2="25" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="2" x2="36" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="14" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="44" x2="25" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="44" x2="36" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="14" x2="6" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="25" x2="6" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="36" x2="6" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="25" x2="48" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="36" x2="48" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="425" y="175" width="395" height="415" rx="16" fill="#f0f7f2" stroke="#207448" stroke-width="4" stroke-dasharray="10,8"/>

  
  <rect x="445" y="190" width="355" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="622" y="217" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="622" dy="0">cgroup cpuset:</tspan>
    <tspan x="622" dy="26">the allowed set,</tspan>
    <tspan x="622" dy="26">set from outside</tspan>
    <tspan x="622" dy="26">(cpuset.cpus 4-7)</tspan>
  </text>

  
  <rect x="65" y="325" width="750" height="85" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5"/>

  
  
  <rect x="75" y="335" width="62" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="106" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">0</text>

  
  <rect x="150" y="335" width="62" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="181" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">1</text>

  
  <rect x="225" y="335" width="62" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="256" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">2</text>

  
  <rect x="300" y="335" width="62" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="331" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">3</text>

  
  <rect x="438" y="325" width="160" height="245" rx="12" fill="#dceee0" stroke="#207448" stroke-width="3"/>

  
  <rect x="446" y="335" width="65" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="478" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">4</text>

  
  <rect x="523" y="335" width="65" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="555" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">5</text>

  
  <rect x="635" y="335" width="65" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="667" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">6</text>

  
  <rect x="715" y="335" width="65" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="747" y="377" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">7</text>

  
  <rect x="445" y="415" width="146" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="518" y="442" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="518" dy="0">taskset</tspan>
    <tspan x="518" dy="26">-c 4-5:</tspan>
    <tspan x="518" dy="26">affinity,</tspan>
    <tspan x="518" dy="26">narrows</tspan>
    <tspan x="518" dy="26">the set</tspan>
  </text>

  
  <defs>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129"/>
    </marker>
  </defs>

  
  <path d="M 438 325 C 438 220, 410 210, 360 210 L 210 210 C 181 210, 181 250, 181 323" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrowhead-orange)"/>

  
  <line x1="285" y1="188" x2="329" y2="232" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>
  <line x1="329" y1="188" x2="285" y2="232" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>

  
  <text x="270" y="145" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="270" dy="0">affinity can only narrow</tspan>
    <tspan x="270" dy="28">the cpuset, never escape it</tspan>
  </text>

  
  <rect x="880" y="100" width="680" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(908, 128)">
    <rect x="0" y="0" width="46" height="34" rx="5" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="10" x2="46" y2="10" stroke="#207448" stroke-width="2"/>
    <path d="M 8 18 L 15 23 L 8 28" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="968" y="155" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Commands</text>

  
  <rect x="908" y="180" width="624" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="926" y="212" font-family="monospace" font-size="24" fill="#303a36">taskset -c 0-7 ./prog</text>

  
  <rect x="908" y="240" width="624" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="926" y="272" font-family="monospace" font-size="24" fill="#303a36">taskset -cp 8-15 PID (all threads: -a)</text>

  
  <rect x="908" y="300" width="624" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="926" y="332" font-family="monospace" font-size="24" fill="#303a36">taskset -pc PID shows the list</text>

  
  <rect x="908" y="360" width="624" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="926" y="392" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="926" dy="0">grep -E Cpus_allowed_list|</tspan>
    <tspan x="926" dy="28">Mems_allowed_list /proc/PID/status</tspan>
  </text>

  
  <rect x="908" y="448" width="624" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="926" y="480" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="926" dy="0">python3 -c</tspan>
    <tspan x="926" dy="28">os.sched_setaffinity(0, {0,1,2,3})</tspan>
  </text>

  
  <rect x="40" y="635" width="1520" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(70, 656)">
    <polygon points="20 2, 38 36, 2 36" fill="#ffffff" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="20" y1="13" x2="20" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="30" r="2" fill="#207448"/>
  </g>
  <text x="125" y="686" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Pitfalls</text>

  
  <circle cx="85" cy="722" r="6" fill="#207448"/>
  <text x="105" y="730" font-family="sans-serif" font-size="24" fill="#303a36">Pinning on a shared host can collide with other tenants pinning the same cores</text>

  
  <circle cx="85" cy="764" r="6" fill="#207448"/>
  <text x="105" y="772" font-family="sans-serif" font-size="24" fill="#303a36">Pins go stale after hardware or topology changes</text>

  
  <circle cx="85" cy="806" r="6" fill="#207448"/>
  <text x="105" y="814" font-family="sans-serif" font-size="24" fill="#303a36">Pinning a multithreaded process to fewer cores than it has busy threads causes contention</text>

  
  <circle cx="85" cy="854" r="6" fill="#207448"/>
  <text x="105" y="856" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">OpenMP, MKL and BLAS thread pools can oversubscribe:</tspan>
    <tspan x="105" dy="28">check OMP_NUM_THREADS, MKL_NUM_THREADS, OMP_PROC_BIND, OMP_PLACES</tspan>
  </text>

  
  <rect x="70" y="925" width="1460" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="960" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">One thread per physical core avoids SMT contention</text>

  
  <rect x="40" y="1025" width="1520" height="65" rx="12" fill="#207448"/>
  <text x="800" y="1066" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Affinity passes down to children and to threads created later</text>
</svg>