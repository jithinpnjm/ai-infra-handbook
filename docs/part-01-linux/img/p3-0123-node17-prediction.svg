<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A failed prediction is information: the node 17 example</title>
  <desc>An infographic explaining the scientific troubleshooting loop using the node 17 training slowdown scenario, experimental validation, and systematic resource elimination.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A failed prediction is information:</text>
  <text x="40" y="112" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">the node 17 example</text>

  

  
  <rect x="40" y="135" width="450" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="76" cy="172" r="24" fill="#207448"/>
  <text x="76" y="181" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g stroke="#207448" stroke-width="3" fill="none">
    <rect x="118" y="152" width="42" height="40" rx="4"/>
    <line x1="126" y1="165" x2="132" y2="165" stroke-linecap="round"/>
    <line x1="126" y1="178" x2="132" y2="178" stroke-linecap="round"/>
    <path d="M 144 163 Q 148 158 152 162 Q 154 166 150 170 L 150 173"/>
    <circle cx="150" cy="179" r="1.5" fill="#207448"/>
  </g>
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="65" y="228" font-size="24" font-weight="bold" fill="#207448">Question: </tspan>
    <tspan font-size="24">why are training</tspan>
    <tspan x="65" y="263" font-size="24">steps on node 17 slow, and</tspan>
    <tspan x="65" y="298" font-size="24">only that node?</tspan>
  </text>

  
  <line x1="490" y1="240" x2="567" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="575" y="135" width="450" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="611" cy="172" r="24" fill="#207448"/>
  <text x="611" y="181" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g stroke="#207448" stroke-width="3" fill="none">
    <path d="M 654 166 A 14 14 0 1 1 672 166 C 672 172 667 175 667 180 L 659 180 C 659 175 654 172 654 166 Z"/>
    <line x1="660" y1="184" x2="666" y2="184"/>
    <line x1="661" y1="188" x2="665" y2="188"/>
  </g>
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="600" y="228" font-size="24" font-weight="bold" fill="#207448">Hypothesis: </tspan>
    <tspan font-size="24">its data loader</tspan>
    <tspan x="600" y="263" font-size="24">is starved by a slow local</tspan>
    <tspan x="600" y="298" font-size="24">NVMe</tspan>
  </text>

  
  <line x1="1025" y1="240" x2="1102" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1110" y="135" width="450" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1146" cy="172" r="24" fill="#207448"/>
  <text x="1146" y="181" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g stroke="#207448" stroke-width="3" fill="none">
    <path d="M 1192 184 A 18 18 0 1 1 1228 184"/>
    <line x1="1210" y1="184" x2="1222" y2="172" stroke-linecap="round"/>
    <circle cx="1210" cy="184" r="3" fill="#207448"/>
  </g>
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="1135" y="222" font-size="24" font-weight="bold" fill="#207448">Prediction: </tspan>
    <tspan font-size="24">iostat will show</tspan>
    <tspan x="1135" y="254" font-size="24">high await on that device,</tspan>
    <tspan x="1135" y="286" font-size="24">and GPU sm activity will</tspan>
    <tspan x="1135" y="318" font-size="24">drop in lockstep</tspan>
  </text>

  
  <line x1="1335" y1="345" x2="1335" y2="427" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1110" y="435" width="450" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1146" cy="477" r="24" fill="#207448"/>
  <text x="1146" y="486" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g stroke="#207448" stroke-width="3" fill="none">
    <path d="M 1190 477 Q 1215 457 1240 477 Q 1215 497 1190 477 Z"/>
    <circle cx="1215" cy="477" r="7"/>
    <circle cx="1215" cy="477" r="3" fill="#207448"/>
  </g>
  <text x="1146" y="555" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Test: look</text>

  
  <line x1="1110" y1="540" x2="1033" y2="540" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="40" y="435" width="985" height="210" rx="12" fill="#fff9f5" stroke="#db8129" stroke-width="3"/>
  <circle cx="76" cy="477" r="24" fill="#db8129"/>
  <text x="76" y="486" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <g stroke="#db8129" stroke-width="3" fill="none">
    <path d="M 148 494 L 124 494 L 136 462 Z"/>
    <line x1="136" y1="472" x2="136" y2="483" stroke-linecap="round"/>
    <circle cx="136" cy="489" r="1.5" fill="#db8129"/>
  </g>
  <text x="168" y="487" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Result</text>
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="65" y="538" font-size="24" font-weight="bold" fill="#db8129">Prediction fails: </tspan>
    <tspan font-size="24">await is normal and the data loader queue is full,</tspan>
    <tspan x="65" y="573" font-size="24">so the GPU is waiting in NCCL;</tspan>
    <tspan x="65" y="608" font-size="24">the NVMe is not the cause</tspan>
  </text>

  
  <line x1="800" y1="435" x2="800" y2="353" stroke="#db8129" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <text x="780" y="395" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="end">new hypothesis, such as a slow NIC link</text>

  
  <rect x="40" y="675" width="1520" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="718" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Experimental example: does disabling NUMA balancing raise throughput?</text>

  
  <rect x="65" y="742" width="470" height="132" rx="8" fill="#e8f1ea"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" y="798">prediction: smaller run-to-run</tspan>
    <tspan x="85" y="834">variance and fewer page faults</tspan>
  </text>

  
  <rect x="565" y="742" width="470" height="132" rx="8" fill="#e8f1ea"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="585" y="782">A/B comparison on identical</tspan>
    <tspan x="585" y="816">nodes, same data, pinned</tspan>
    <tspan x="585" y="850">clocks, confidence intervals</tspan>
  </text>

  
  <rect x="1065" y="742" width="470" height="132" rx="8" fill="#e8f1ea"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" y="798">if no effect, revert it and</tspan>
    <tspan x="1085" y="834">write down that you tried</tspan>
  </text>

  
  <rect x="40" y="920" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3" fill="none">
    <circle cx="85" cy="987" r="22"/>
    <line x1="72" y1="987" x2="98" y2="987" stroke-linecap="round"/>
  </g>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" y="962" font-weight="bold" fill="#207448">Elimination is also an answer: </tspan>
    <tspan>a resource with low utilisation, no saturation and no errors</tspan>
    <tspan x="130" y="996">removes that resource from the search; document negative findings so other teams</tspan>
    <tspan x="130" y="1030">do not re-check the same dead end</tspan>
  </text>

  
  <rect x="40" y="1080" width="1520" height="80" rx="12" fill="#207448"/>
  <text x="800" y="1131" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">A failed prediction is information, not a wasted trip</text>
</svg>