<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Overcommit modes</title>
  <desc id="svg-desc">Visual infographic explaining Linux memory overcommit modes 0, 1, and 2, and the failure flow for overcommit.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 16 9 L 0 17 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Overcommit modes</text>

  
  <rect x="50" y="115" width="1500" height="425" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="90" y="162" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">vm.overcommit_memory</text>

  
  <g id="card-mode-0">
    <rect x="85" y="185" width="430" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="115" y="205" width="56" height="56" rx="8"/>
      <line x1="126" y1="221" x2="160" y2="221"/>
      <circle cx="136" cy="221" r="4" fill="#ffffff"/>
      <line x1="126" y1="233" x2="160" y2="233"/>
      <circle cx="150" cy="233" r="4" fill="#ffffff"/>
      <line x1="126" y1="245" x2="160" y2="245"/>
      <circle cx="139" cy="245" r="4" fill="#ffffff"/>
    </g>

    
    <text x="188" y="244" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">0 (default)</text>

    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" y="300">heuristic, refuse only</tspan>
      <tspan x="115" y="338">obviously excessive</tspan>
      <tspan x="115" y="376">single requests</tspan>
    </text>
  </g>

  
  <g id="card-mode-1">
    <rect x="585" y="185" width="430" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="615" y="205" width="56" height="56" rx="8"/>
      <line x1="615" y1="222" x2="671" y2="222"/>
      <path d="M 627 241 L 638 251 L 659 231"/>
    </g>

    
    <text x="688" y="244" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">1</text>

    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="615" y="300">always allow, never fail</tspan>
      <tspan x="615" y="338" font-family="monospace">malloc</tspan>
    </text>
  </g>

  
  <g id="card-mode-2">
    <rect x="1085" y="185" width="430" height="330" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

    
    <g fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1115" y="223" width="56" height="38" rx="6"/>
      <path d="M 1128 223 V 214 C 1128 206 1158 206 1158 214 V 223"/>
      <circle cx="1143" cy="239" r="3" fill="#db8129"/>
      <line x1="1143" y1="242" x2="1143" y2="251"/>
    </g>

    
    <text x="1186" y="244" font-family="monospace" font-size="32" font-weight="bold" fill="#db8129">2</text>

    
    <rect x="1225" y="217" width="265" height="36" rx="8" fill="#db8129"/>
    <text x="1357" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the only hard limit</text>

    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1115" y="295">strict, total committed</tspan>
      <tspan x="1115" y="330">memory limited to swap</tspan>
      <tspan x="1115" y="365">plus <tspan font-family="monospace">vm.overcommit_ratio</tspan>%</tspan>
      <tspan x="1115" y="400">of RAM, allocations fail</tspan>
      <tspan x="1115" y="435">with <tspan font-family="monospace">ENOMEM</tspan></tspan>
    </text>
  </g>

  
  <rect x="50" y="580" width="1500" height="270" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="90" y="624" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">flow for 0 and 1:</text>

  
  <g id="step-1">
    <rect x="90" y="645" width="420" height="185" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="140" cy="690" r="24" fill="#207448"/>
    <text x="140" y="698" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="185" y="662" width="56" height="56" rx="8"/>
      <line x1="185" y1="679" x2="241" y2="679"/>
      <circle cx="197" cy="671" r="2" fill="#207448"/>
      <circle cx="206" cy="671" r="2" fill="#207448"/>
      <circle cx="215" cy="671" r="2" fill="#207448"/>
      <path d="M 198 701 L 208 709 L 228 691"/>
    </g>

    
    <text x="115" y="775" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36"><tspan font-family="monospace">malloc</tspan> succeeds</text>
  </g>

  
  <line x1="510" y1="737" x2="588" y2="737" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>

  
  <g id="step-2">
    <rect x="590" y="645" width="420" height="185" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="640" cy="690" r="24" fill="#207448"/>
    <text x="640" y="698" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="713" cy="690" r="25"/>
      <polyline points="713,673 713,690 727,698"/>
    </g>

    
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="615" y="760">memory runs out later</tspan>
      <tspan x="615" y="796">at first touch</tspan>
    </text>
  </g>

  
  <line x1="1010" y1="737" x2="1088" y2="737" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>

  
  <g id="step-3">
    <rect x="1090" y="645" width="420" height="185" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="1140" cy="690" r="24" fill="#207448"/>
    <text x="1140" y="698" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1213" cy="690" r="24"/>
      <circle cx="1213" cy="690" r="11"/>
      <line x1="1213" y1="660" x2="1213" y2="674"/>
      <line x1="1213" y1="706" x2="1213" y2="720"/>
      <line x1="1183" y1="690" x2="1197" y2="690"/>
      <line x1="1229" y1="690" x2="1243" y2="690"/>
    </g>

    
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1115" y="760">then the OOM killer</tspan>
      <tspan x="1115" y="796">picks a victim</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="890" width="1500" height="70" rx="14" fill="#207448"/>
    <text x="800" y="934" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Note: overcommit defers the failure.</text>
  </g>
</svg>