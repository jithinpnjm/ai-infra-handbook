<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Kernel and user space move independently</title>
  <desc>Infographic showing that old user-space binaries run on newer kernels while glibc mismatches and mismatched kernel modules fail.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Kernel and user space move independently</text>

  
  <g id="layer-userspace">
    <rect x="50" y="130" width="350" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(197, 185)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="0" y="0" width="56" height="46" rx="6"/>
      <line x1="0" y1="14" x2="56" y2="14"/>
      <circle cx="10" cy="7" r="2" fill="#207448"/>
      <circle cx="18" cy="7" r="2" fill="#207448"/>
      <circle cx="26" cy="7" r="2" fill="#207448"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke-linecap="round"/>
      <line x1="12" y1="36" x2="32" y2="36" stroke-linecap="round"/>
    </g>
    <text x="225" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="225" dy="0">user space</tspan>
      <tspan x="225" dy="42">(glibc, programs)</tspan>
    </text>
  </g>

  
  <g id="layer-kernel">
    <rect x="50" y="510" width="350" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(197, 615)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="8" y="8" width="40" height="40" rx="6"/>
      <line x1="18" y1="0" x2="18" y2="8"/>
      <line x1="28" y1="0" x2="28" y2="8"/>
      <line x1="38" y1="0" x2="38" y2="8"/>
      <line x1="18" y1="48" x2="18" y2="56"/>
      <line x1="28" y1="48" x2="28" y2="56"/>
      <line x1="38" y1="48" x2="38" y2="56"/>
      <line x1="0" y1="18" x2="8" y2="18"/>
      <line x1="0" y1="28" x2="8" y2="28"/>
      <line x1="0" y1="38" x2="8" y2="38"/>
      <line x1="48" y1="18" x2="56" y2="18"/>
      <line x1="48" y1="28" x2="56" y2="28"/>
      <line x1="48" y1="38" x2="56" y2="38"/>
      <circle cx="28" cy="28" r="6" fill="#207448"/>
    </g>
    <text x="225" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#303a36">kernel</text>
  </g>

  
  <g id="left-panel">
    <rect x="440" y="130" width="530" height="720" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <rect x="475" y="165" width="460" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(677, 195)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M 6 0 L 36 0 L 50 14 L 50 56 L 6 56 Z" rx="3"/>
      <path d="M 36 0 L 36 14 L 50 14"/>
      <polyline points="18,30 14,35 18,40" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="32,30 36,35 32,40" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="28" x2="24" y2="42" stroke-linecap="round"/>
    </g>
    <text x="705" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="705" dy="0">old user-space binary</tspan>
      <tspan x="705" dy="40">on newer kernel</tspan>
    </text>

    
    <line x1="705" y1="400" x2="705" y2="560" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <circle cx="705" cy="485" r="34" fill="#207448"/>
    <path d="M 688 485 L 700 497 L 723 471" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="475" y="580" width="460" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(677, 610)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M 28 6 L 50 14 C 50 36 28 50 28 50 C 28 50 6 36 6 14 Z"/>
      <line x1="28" y1="18" x2="28" y2="38" stroke-linecap="round"/>
      <line x1="18" y1="28" x2="38" y2="28" stroke-linecap="round"/>
    </g>
    <text x="705" y="715" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="705" dy="0">works:</tspan>
      <tspan x="705" dy="40">never break user space</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    
    <g id="failure-glibc">
      <rect x="1010" y="130" width="540" height="340" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(1252, 160)" stroke="#db8129" stroke-width="4" fill="none">
        <circle cx="28" cy="28" r="16"/>
        <line x1="28" y1="4" x2="28" y2="12"/>
        <line x1="28" y1="44" x2="28" y2="52"/>
        <line x1="4" y1="28" x2="12" y2="28"/>
        <line x1="44" y1="28" x2="52" y2="28"/>
        <line x1="11" y1="11" x2="17" y2="17"/>
        <line x1="39" y1="39" x2="45" y2="45"/>
        <line x1="11" y1="45" x2="17" y2="39"/>
        <line x1="39" y1="17" x2="45" y2="11"/>
        
        <circle cx="44" cy="44" r="12" fill="#db8129" stroke="none"/>
        <line x1="38" y1="38" x2="50" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="38" x2="38" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="1280" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="1280" dy="0">program built against newer</tspan>
        <tspan x="1280" dy="38">glibc on older distribution:</tspan>
        <tspan x="1280" dy="44" font-weight="bold" fill="#db8129">fails to start</tspan>
      </text>
    </g>

    
    <g id="failure-module">
      <rect x="1010" y="510" width="540" height="340" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(1252, 545)" stroke="#db8129" stroke-width="4" fill="none">
        <rect x="8" y="14" width="38" height="38" rx="5"/>
        <line x1="18" y1="4" x2="18" y2="14"/>
        <line x1="34" y1="4" x2="34" y2="14"/>
        <circle cx="27" cy="33" r="6"/>
        
        <circle cx="44" cy="44" r="12" fill="#db8129" stroke="none"/>
        <line x1="38" y1="38" x2="50" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="38" x2="38" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="1280" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="1280" dy="0">kernel module (.ko) built for</tspan>
        <tspan x="1280" dy="38">one kernel build on another:</tspan>
        <tspan x="1280" dy="44" font-weight="bold" fill="#db8129">refuses to load</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="890" width="1500" height="70" rx="12" fill="#207448"/>
    <text x="800" y="934" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Standardise a single tested OS release across every node.</text>
  </g>
</svg>