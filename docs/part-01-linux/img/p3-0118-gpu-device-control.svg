<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GPUs are not a cgroup controller: how a container gets /dev/nvidia*</title>
  <desc>Layered diagram explaining how GPU device nodes are assigned by policy, exposed via runtime hooks and cgroup device rules, and opened by containers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">GPUs are not a cgroup controller:</text>
  <text x="50" y="128" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">how a container gets /dev/nvidia*</text>

  
  <g id="top-row">
    <rect x="50" y="164" width="1500" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="198" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Who decides how many GPUs</text>

    
    <rect x="80" y="212" width="670" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(100, 222)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="2" y="2" width="22" height="22" rx="4"/>
      <rect x="32" y="2" width="22" height="22" rx="4"/>
      <rect x="2" y="32" width="22" height="22" rx="4"/>
      <rect x="32" y="32" width="22" height="22" rx="4"/>
      <path d="M 24 13 L 32 13 M 13 24 L 13 32 M 43 24 L 43 32 M 24 43 L 32 43"/>
    </g>
    <text x="175" y="244" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Kubernetes device plugin</text>
    <text x="175" y="272" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">and scheduler</text>

    
    <rect x="790" y="212" width="730" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(810, 222)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="14" y1="18" x2="42" y2="18"/>
      <line x1="14" y1="28" x2="34" y2="28"/>
      <line x1="14" y1="38" x2="38" y2="38"/>
      <circle cx="40" cy="28" r="3" fill="#207448"/>
    </g>
    <text x="885" y="244" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Slurm GRES with</text>
    <text x="885" y="272" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ConstrainDevices=yes</text>
  </g>

  
  <g id="middle-row">
    <rect x="50" y="344" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="380" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Who exposes the device nodes</text>

    
    <rect x="80" y="402" width="410" height="136" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(100, 442)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="28" cy="18" r="12"/>
      <path d="M 28 30 L 28 42 C 28 50 16 50 16 42"/>
    </g>
    <text x="175" y="444" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Runtime hook such</text>
    <text x="175" y="474" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">as the NVIDIA</text>
    <text x="175" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Container Toolkit</text>

    
    <line x1="490" y1="470" x2="538" y2="470" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="540" y="402" width="460" height="136" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(556, 442)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 28 4 L 48 12 L 48 28 C 48 42 28 52 28 52 C 28 52 8 42 8 28 L 8 12 Z"/>
      <path d="M 20 28 L 26 34 L 38 22"/>
    </g>
    <text x="625" y="432" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">devices cgroup allows</text>
    <text x="625" y="462" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidia0,</text>
    <text x="625" y="492" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidiactl,</text>
    <text x="625" y="522" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidia-uvm</text>

    
    <rect x="1040" y="402" width="485" height="136" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1062" y="432" font-family="sans-serif" font-size="24" fill="#303a36">In v1 <tspan font-family="monospace">devices.allow</tspan> and</text>
    <text x="1062" y="462" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">devices.deny</tspan>; in v2 implemented</text>
    <text x="1062" y="492" font-family="sans-serif" font-size="24" fill="#303a36">as eBPF programs attached</text>
    <text x="1062" y="522" font-family="sans-serif" font-size="24" fill="#303a36">to the cgroup</text>
  </g>

  
  <g id="bottom-row">
    <rect x="50" y="594" width="1500" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 606)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <circle cx="12" cy="12" r="2" fill="#207448"/>
      <circle cx="18" cy="12" r="2" fill="#207448"/>
      <path d="M 16 32 L 24 38 L 16 44 M 28 44 L 40 44"/>
    </g>
    <text x="160" y="645" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Container opens the nodes</text>
  </g>

  
  <g id="failure-and-fix">
    
    <rect x="50" y="714" width="710" height="190" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(75, 740)" stroke="#db8129" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 28 6 L 52 48 L 4 48 Z"/>
      <line x1="28" y1="22" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2" fill="#db8129"/>
    </g>
    <text x="150" y="764" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Container loses GPU access after</text>
    <text x="150" y="796" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan font-family="monospace">systemctl daemon-reload</tspan> or a cgroup</text>
    <text x="150" y="828" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">driver mismatch because the device</text>
    <text x="150" y="860" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">rules reset</text>

    
    <rect x="800" y="714" width="750" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(825, 740)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="28" cy="28" r="10"/>
      <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11"/>
    </g>
    <text x="900" y="752" font-family="monospace" font-size="24" fill="#303a36">nvidia-ctk runtime configure</text>
    <text x="900" y="780" font-family="monospace" font-size="24" fill="#303a36">--runtime=containerd --cdi.enabled,</text>
    <text x="900" y="808" font-family="sans-serif" font-size="24" fill="#303a36">plus matching driver settings;</text>
    <text x="900" y="836" font-family="sans-serif" font-size="24" fill="#303a36">verify against the current NVIDIA</text>
    <text x="900" y="864" font-family="sans-serif" font-size="24" fill="#303a36">Container Toolkit docs</text>
  </g>

  
  <g id="memory-note">
    <rect x="50" y="944" width="1500" height="110" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    
    <g transform="translate(75, 971)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="8" y="12" width="40" height="32" rx="4"/>
      <line x1="16" y1="4" x2="16" y2="12"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="40" y1="4" x2="40" y2="12"/>
      <line x1="16" y1="44" x2="16" y2="52"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="40" y1="44" x2="40" y2="52"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
    </g>
    <text x="150" y="992" font-family="sans-serif" font-size="24" fill="#303a36">Memory: pinned, GPU-registered host memory and hugetlbfs count differently,</text>
    <text x="150" y="1024" font-family="sans-serif" font-size="24" fill="#303a36">so a data loader with large pinned buffers hits <tspan font-family="monospace">memory.max</tspan> sooner than expected</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1094" width="1500" height="60" rx="8" fill="#207448"/>
    <text x="800" y="1134" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU quantity is policy; GPU access is a device rule</text>
  </g>
</svg>