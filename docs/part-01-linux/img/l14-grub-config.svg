<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Never edit grub.cfg</title>
  <desc>Visual infographic explaining the GRUB configuration generation flow from user space scripts to grub.cfg and verification.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 10 6 L 0 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Never edit grub.cfg</text>

  
  <g id="step-circles">
    <circle cx="212" cy="145" r="24" fill="#207448" />
    <text x="212" y="154" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <circle cx="625" cy="145" r="24" fill="#207448" />
    <text x="625" y="154" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <circle cx="1030" cy="145" r="24" fill="#207448" />
    <text x="1030" y="154" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <circle cx="1387" cy="145" r="24" fill="#207448" />
    <text x="1387" y="154" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  </g>

  
  
  <rect x="50" y="190" width="325" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(184, 210)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="6" y1="12" x2="50" y2="12" />
    <line x1="6" y1="28" x2="50" y2="28" />
    <line x1="6" y1="44" x2="50" y2="44" />
    <circle cx="20" cy="12" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="38" cy="28" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="24" cy="44" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  </g>
  <text x="212" y="295" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/default/grub</text>
  <text x="212" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">settings such as</text>
  <text x="212" y="385" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">GRUB_CMDLINE_LINUX</text>

  
  <rect x="50" y="460" width="325" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(184, 480)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" />
    <path d="M 36 6 L 36 16 L 46 16" />
    <line x1="20" y1="26" x2="38" y2="26" />
    <line x1="20" y1="36" x2="34" y2="36" />
  </g>
  <text x="212" y="565" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">/etc/grub.d/</text>
  <text x="212" y="600" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">scripts</text>
  <text x="212" y="650" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">00_header</text>
  <text x="212" y="692" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">10_linux</text>
  <text x="212" y="734" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">30_os-prober</text>
  <text x="212" y="776" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">40_custom</text>

  
  <path d="M 375 310 H 395 V 640 H 375" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="395" y1="505" x2="415" y2="505" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="415" y="190" width="420" height="630" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(597, 215)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="10" />
    <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
  </g>
  <text x="625" y="310" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">grub-mkconfig</text>

  
  <rect x="430" y="345" width="390" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="625" y="390" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Debian and Ubuntu</text>
  <rect x="445" y="420" width="360" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1" />
  <text x="625" y="464" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo update-grub</text>

  
  <rect x="430" y="540" width="390" height="255" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="625" y="585" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">RHEL with BIOS</text>
  <rect x="436" y="615" width="378" height="150" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1" />
  <text x="625" y="668" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo grub2-mkconfig</text>
  <text x="625" y="722" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">-o /boot/grub2/grub.cfg</text>

  
  <line x1="835" y1="505" x2="875" y2="505" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="875" y="190" width="310" height="630" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3.5" />
  
  <g transform="translate(1002, 215)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 12 6 L 34 6 L 44 16 L 44 50 L 12 50 Z" />
    <path d="M 34 6 L 34 16 L 44 16" />
    <line x1="28" y1="25" x2="28" y2="36" />
    <circle cx="28" cy="43" r="1.5" fill="#db8129" />
  </g>
  <text x="1030" y="310" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#db8129">grub.cfg</text>
  <text x="1030" y="360" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">in /boot/grub/</text>

  
  <rect x="895" y="415" width="270" height="375" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <g transform="translate(1002, 450)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 28 8 L 50 46 L 6 46 Z" />
    <line x1="28" y1="22" x2="28" y2="33" />
    <circle cx="28" cy="40" r="1.5" fill="#db8129" />
  </g>
  <text x="1030" y="565" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
    <tspan x="1030" dy="0">generated,</tspan>
    <tspan x="1030" dy="55">your edits are</tspan>
    <tspan x="1030" dy="55">overwritten</tspan>
  </text>

  
  <line x1="1185" y1="505" x2="1225" y2="505" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="1225" y="190" width="325" height="630" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1387" y="245" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">After:</text>

  
  <rect x="1245" y="275" width="285" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1359, 290)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 26 A 18 18 0 1 1 38 14" />
    <polyline points="38 6 38 16 48 16" />
  </g>
  <text x="1387" y="388" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">reboot</text>

  
  <line x1="1387" y1="420" x2="1387" y2="443" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1347" y="445" width="80" height="36" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1387" y="471" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">then</text>
  <line x1="1387" y1="481" x2="1387" y2="505" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="1237" y="505" width="301" height="290" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1359, 520)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="8" width="44" height="38" rx="6" />
    <path d="M 16 22 L 24 28 L 16 34" />
    <line x1="28" y1="34" x2="38" y2="34" />
  </g>
  <rect x="1243" y="595" width="289" height="70" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1" />
  <text x="1387" y="639" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cat /proc/cmdline</text>
  <text x="1387" y="735" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">to verify</text>

  
  <rect x="50" y="860" width="1500" height="90" rx="12" fill="#207448" />
  
  <g transform="translate(80, 877)" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="22" />
    <line x1="28" y1="26" x2="28" y2="39" />
    <circle cx="28" cy="18" r="2" fill="#ffffff" stroke="none" />
  </g>
  <text x="145" y="915" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Note: the scripts run in user space to generate the file, GRUB never runs them at boot.</text>
</svg>