  <g class="icon">
    <path d="M99 679 L122 710 L99 741 L76 710 Z"/>
    <circle cx="99" cy="710" r="5"/>
    <path d="M99 705 L99 691 M99 715 L99 729"/>
  </g>
  <g class="icon">
    <path d="M99 839 L122 870 L99 901 L76 870 Z"/>
    <circle cx="99" cy="870" r="5"/>
    <path d="M99 865 L99 851 M99 875 L99 889"/>
  </g>
  <g class="icon">
    <path d="M99 989 L122 1020 L99 1051 L76 1020 Z"/>
    <circle cx="99" cy="1020" r="5"/>
    <path d="M99 1015 L99 1001 M99 1025 L99 1039"/>
  </g>

  
  <g class="icon">
    <path d="M922 296 A25 25 0 0 1 972 296"/>
    <path d="M947 296 L962 278"/>
    <path d="M927 287 L932 290 M947 273 L947 280 M967 287 L962 290"/>
  </g>
  
