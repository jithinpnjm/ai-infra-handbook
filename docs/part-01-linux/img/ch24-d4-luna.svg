  <text class="branch" x="795" y="264" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="357" text-anchor="end">no</text>
  <text class="branch" x="795" y="404" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="497" text-anchor="end">no</text>
  <text class="branch" x="795" y="544" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="637" text-anchor="end">no</text>
  <text class="branch" x="795" y="694" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="797" text-anchor="end">no</text>
  <text class="branch" x="795" y="854" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="957" text-anchor="end">no</text>
  <text class="branch" x="795" y="1004" text-anchor="middle">yes</text>
  <text class="branch" x="328" y="1110" text-anchor="end">no</text>

  
  <text class="decision" x="150" y="173">What do I want to know?</text>
  <text class="decision" x="150" y="270">
    <tspan x="150">A rate, total or</tspan>
    <tspan x="150" dy="35">utilisation over time?</tspan>
  </text>
  <text class="decision" x="150" y="430">Where does CPU time go?</text>
  <text class="decision" x="150" y="547">
    <tspan x="150">Why do threads WAIT?</tspan>
    <tspan x="150" dy="35">(blocked, off-CPU)</tspan>
  </text>
  <text class="decision" x="150" y="686">
    <tspan x="150">Individual events or latency</tspan>
    <tspan x="150" dy="35">distribution of a known</tspan>
    <tspan x="150" dy="35">subsystem?</tspan>
  </text>
  <text class="decision" x="150" y="846">
    <tspan x="150">Kernel function call flow</tspan>
    <tspan x="150" dy="35">or counts, minimal</tspan>
    <tspan x="150" dy="35">environment?</tspan>
  </text>
  <text class="decision" x="150" y="1006">
    <tspan x="150">Microarchitecture</tspan>
    <tspan x="150" dy="35">(IPC, cache, TLB)?</tspan>
  </text>

  
  <text class="body" x="995" y="250">Counters:</text>
  <text class="mono" x="1110" y="250">vmstat/mpstat/iostat/</text>
  <text class="mono" x="995" y="278">sar/ss/nvidia-smi/DCGM</text>
  <text class="body" x="995" y="306">(cheap, always on)</text>

  <text class="mono" x="995" y="409">perf record -F 99 -g +</text>
  <text class="body" x="995" y="441">flame graph (or <tspan class="mono">BCC</tspan> profile)</text>

  <text class="mono" x="995" y="549">offcputime / perf sched /</text>
  <text class="mono" x="995" y="577">wakeup stacks</text>

  <text class="body" x="995" y="679">BCC tool (<tspan class="mono">biolatency, tcplife,</tspan></text>
  <text class="mono" x="995" y="710">opensnoop, runqlat...)</text>
  <text class="body" x="995" y="741">else <tspan class="mono">bpftrace</tspan> one-liner</text>

  <text class="body" x="995" y="859">Ftrace: <tspan class="mono">funccount /</tspan></text>
  <text class="mono" x="995" y="891">function_graph / trace-cmd</text>

  <text class="mono" x="995" y="1009">perf stat / perf record</text>
  <text class="mono" x="995" y="1041">on PMCs; perf c2c / mem</text>

  <text class="body" x="995" y="1158">Custom question: write a</text>
  <text class="mono" x="995" y="1190">bpftrace program</text>
  <text class="body" x="995" y="1222">(or <tspan class="mono">uprobe/USDT</tspan> in the app)</text>
</svg>