<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" font-family="sans-serif" font-size="24" fill="#303a36">
  <title>Choosing a tool</title>
  <desc>Choosing a tool</desc>
  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="18" refY="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="18" refY="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#db8129"/>
    </marker>
    <style>
      .box { fill:#e8f1ea; stroke:#207448; stroke-width:3; }
      .icon { fill:none; stroke:#207448; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .decision { font-size:30px; font-weight:700; }
      .body { font-size:24px; }
      .mono { font-family:monospace; font-size:24px; }
      .flow { fill:none; stroke:#207448; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-green); }
      .key-flow { fill:none; stroke:#db8129; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-orange); }
      .branch { font-size:24px; font-weight:700; }
    </style>
  </defs>

  <rect width="1600" height="1320" fill="#f5f8f5"/>
  <text x="50" y="82" font-size="48" font-weight="700">Choosing a tool</text>

  
  <rect class="box" x="50" y="120" width="640" height="85" rx="18"/>
