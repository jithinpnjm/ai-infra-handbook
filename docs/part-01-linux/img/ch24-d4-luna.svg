  <rect class="box" x="900" y="645" width="650" height="130" rx="18"/>
  <rect class="box" x="900" y="805" width="650" height="130" rx="18"/>
  <rect class="box" x="900" y="970" width="650" height="100" rx="18"/>
  <rect class="box" x="900" y="1125" width="650" height="150" rx="18"/>

  
  <g class="icon">
    <circle cx="92" cy="158" r="20"/>
    <path d="M107 173 L126 192"/>
  </g>

  
