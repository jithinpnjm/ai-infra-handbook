  <g class="icon">
    <path d="M922 710 L932 710 L938 690 L947 731 L955 700 L962 710 L972 710"/>
  </g>
  
  <g class="icon">
    <path d="M925 851 L925 889 M945 851 L945 889 M965 851 L965 889"/>
