<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" style="background:#f5f8f5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Tail sampling needs two tiers so every span of a trace reaches one sampler</title>
  <desc>Architecture infographic illustrating two-tier tail sampling with traceID routing between edge agents and tail samplers.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-orange" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M 1 2 L 13 8 L 1 14 Z" fill="#db8129"/>
    </marker>
    
    <marker id="pipe-arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <text x="800" y="58" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">
    Tail sampling needs two tiers so every span
  </text>
  <text x="800" y="108" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">
    of a trace reaches one sampler
  </text>

  
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="220" height="610" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 40)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="60" height="46" rx="5" fill="#ffffff"/>
      <line x1="0" y1="14" x2="60" y2="14"/>
      <circle cx="10" cy="7" r="2.5" fill="#207448"/>
      <circle cx="18" cy="7" r="2.5" fill="#207448"/>
      <circle cx="26" cy="7" r="2.5" fill="#207448"/>
    </g>
    
    <text x="110" y="270" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="110" dy="0">Engines and</tspan>
      <tspan x="110" dy="38">gateway emit</tspan>
      <tspan x="110" dy="38">OTLP spans</tspan>
    </text>
  </g>

  
  <g>
    <line x1="250" y1="440" x2="288" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    <circle cx="269" cy="380" r="24" fill="#207448"/>
    <text x="269" y="388" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  </g>

  
  <g transform="translate(290, 160)">
    
    <rect x="0" y="0" width="280" height="610" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="140" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#207448">Edge agents</text>

    
    <rect x="20" y="70" width="240" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="108" text-anchor="middle" font-size="24" fill="#303a36">OTLP receiver</text>

    
    <line x1="140" y1="130" x2="140" y2="152" stroke="#207448" stroke-width="3" marker-end="url(#pipe-arrow)"/>

    
    <rect x="20" y="155" width="240" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="193" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">memory_limiter</text>

    
    <line x1="140" y1="215" x2="140" y2="237" stroke="#207448" stroke-width="3" marker-end="url(#pipe-arrow)"/>

    
    <rect x="20" y="240" width="240" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="278" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">batch</text>

    
    <line x1="140" y1="300" x2="140" y2="322" stroke="#207448" stroke-width="3" marker-end="url(#pipe-arrow)"/>

    
    <rect x="15" y="325" width="250" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="140" y="375" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="140" dy="0">load_balancing</tspan>
      <tspan x="140" dy="32">exporter</tspan>
    </text>

    
    <rect x="25" y="470" width="230" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="140" y="505" text-anchor="middle" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">routing key</tspan>
      <tspan x="140" dy="32" font-family="monospace" font-weight="bold" fill="#207448">traceID</tspan>
    </text>
  </g>

  
  <g>
    
    <line x1="570" y1="440" x2="910" y2="440" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)"/>

    
    <circle cx="740" cy="355" r="24" fill="#207448"/>
    <text x="740" y="363" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>

    
    <rect x="655" y="415" width="170" height="48" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="740" y="448" text-anchor="middle" font-size="24" font-weight="bold" fill="#db8129">by trace id</text>

    
    <rect x="585" y="485" width="310" height="135" rx="10" fill="#fff5eb" stroke="#db8129" stroke-width="2.5"/>
    <text x="740" y="525" text-anchor="middle" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="740" dy="0">every span of</tspan>
      <tspan x="740" dy="32">one trace reaches</tspan>
      <tspan x="740" dy="32">the same sampler</tspan>
    </text>
  </g>

  
  <g transform="translate(915, 160)">
    
    <rect x="0" y="0" width="510" height="610" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="255" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#207448">Tail samplers</text>

    
    <rect x="25" y="65" width="460" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="255" y="101" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">memory_limiter</text>

    
    <line x1="255" y1="120" x2="255" y2="135" stroke="#207448" stroke-width="3" marker-end="url(#pipe-arrow)"/>

    
    <rect x="25" y="140" width="460" height="380" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="255" y="175" text-anchor="middle" font-size="26" font-family="monospace" font-weight="bold" fill="#207448">tail_sampling</text>

    
    <rect x="40" y="195" width="430" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="55" y="232" font-size="24" fill="#303a36">
      <tspan x="55" dy="0" font-family="monospace" font-weight="bold" fill="#207448">keep-errors</tspan>
      <tspan x="55" dy="32">(status ERROR)</tspan>
    </text>

    
    <rect x="40" y="295" width="430" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="55" y="332" font-size="24" fill="#303a36">
      <tspan x="55" dy="0" font-family="monospace" font-weight="bold" fill="#207448">keep-slow</tspan>
      <tspan x="55" dy="32">(latency over 5000 ms)</tspan>
    </text>

    
    <rect x="40" y="395" width="430" height="110" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="55" y="432" font-size="24" fill="#303a36">
      <tspan x="55" dy="0" font-family="monospace" font-weight="bold" fill="#207448">keep-some-healthy</tspan>
      <tspan x="55" dy="32">(probabilistic</tspan>
      <tspan x="205" dy="0">1 percent)</tspan>
    </text>

    
    <line x1="255" y1="520" x2="255" y2="535" stroke="#207448" stroke-width="3" marker-end="url(#pipe-arrow)"/>

    
    <rect x="25" y="540" width="460" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="255" y="576" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">batch</text>
  </g>

  
  <g>
    <line x1="1425" y1="440" x2="1465" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    <circle cx="1445" cy="380" r="24" fill="#207448"/>
    <text x="1445" y="388" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  </g>

  
  <g transform="translate(1468, 360)">
    
    <g stroke="#207448" stroke-width="3" fill="#ffffff">
      
      <path d="M 12 30 L 12 90 A 42 16 0 0 0 96 90 L 96 30 Z" fill="#e8f1ea"/>
      
      <ellipse cx="54" cy="30" rx="42" ry="16" fill="#ffffff"/>
      
      <path d="M 12 60 A 42 16 0 0 0 96 60" fill="none"/>
    </g>
    
    <text x="54" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="54" dy="0">Trace</tspan>
      <tspan x="54" dy="30">store</tspan>
    </text>
  </g>

  
  <g transform="translate(850, 795)">
    <rect x="0" y="0" width="640" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="320" y="40" text-anchor="middle" font-size="24" fill="#303a36">
      <tspan x="320" dy="0">5,000 new traces per second</tspan>
      <tspan x="320" dy="34">times 30 s decision_wait equals 150,000 traces held,</tspan>
      <tspan x="320" dy="34" font-family="monospace" font-weight="bold" fill="#207448">num_traces 200,000</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 985)">
    <rect x="0" y="0" width="1520" height="95" rx="12" fill="#207448"/>
    <text x="760" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="760" dy="0">Keep every error and slow trace, route by trace id to a stateful tier,</tspan>
      <tspan x="760" dy="34">and size memory from decision wait times trace rate.</tspan>
    </text>
  </g>
</svg>