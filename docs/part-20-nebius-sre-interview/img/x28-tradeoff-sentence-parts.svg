<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" font-family="sans-serif">
  <title>The four-part trade-off sentence</title>
  <desc>A left-to-right chain of four green panels numbered 1 to 4, describing a trade-off sentence: given this constraint, I chose A over B, accepting this cost, and I would revisit if this condition changed, with a monospace example line below.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  <text x="800" y="92" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36">The four-part trade-off sentence</text>

  <g>
    <rect x="40" y="170" width="350" height="300" rx="14" fill="#e8f1ea" stroke="#d6dfd8" stroke-width="2"/>
    <circle cx="84" cy="214" r="24" fill="#207448"/>
    <text x="84" y="223" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <g transform="translate(346,214)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -10 -2 L -10 -8 A 10 10 0 0 1 10 -8 L 10 -2"/>
      <rect x="-19" y="-5" width="38" height="25" rx="5"/>
      <circle cx="0" cy="8" r="3"/>
    </g>

    <text x="60" y="266" font-size="30" font-weight="bold" fill="#207448">Given this</text>
    <text x="60" y="302" font-size="30" font-weight="bold" fill="#207448">constraint</text>
    <text x="60" y="348" font-size="24" fill="#303a36">The limit that</text>
    <text x="60" y="376" font-size="24" fill="#303a36">shaped the choice</text>
  </g>

  <g>
    <rect x="430" y="170" width="350" height="300" rx="14" fill="#e8f1ea" stroke="#d6dfd8" stroke-width="2"/>
    <circle cx="474" cy="214" r="24" fill="#207448"/>
    <text x="474" y="223" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <g transform="translate(736,214)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-22" x2="0" y2="4"/>
      <polygon points="-5,-8 5,-8 0,-16"/>
      <line x1="-24" y1="-8" x2="24" y2="-8"/>
      <line x1="-18" y1="-8" x2="-18" y2="3"/>
      <line x1="18" y1="-8" x2="18" y2="3"/>
      <path d="M -27 3 Q -18 14 -9 3 Z"/>
      <path d="M 9 3 Q 18 14 27 3 Z"/>
    </g>

    <text x="450" y="266" font-size="30" font-weight="bold" fill="#207448">I chose A over B</text>
    <text x="450" y="348" font-size="24" fill="#303a36">The option picked</text>
    <text x="450" y="376" font-size="24" fill="#303a36">and the one rejected</text>
  </g>

  <g>
    <rect x="820" y="170" width="350" height="300" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    <circle cx="864" cy="214" r="24" fill="#207448"/>
    <text x="864" y="223" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <g transform="translate(1126,214)" fill="none" stroke="#db8129" stroke-width="4">
      <circle cx="0" cy="0" r="22"/>
      <circle cx="0" cy="0" r="9"/>
    </g>

    <text x="840" y="266" font-size="30" font-weight="bold" fill="#207448">Accepting this</text>
    <text x="840" y="302" font-size="30" font-weight="bold" fill="#207448">cost</text>
    <text x="840" y="348" font-size="24" fill="#303a36">The price you</text>
    <text x="840" y="376" font-size="24" fill="#303a36">knowingly paid</text>
  </g>

  <g>
    <rect x="1210" y="170" width="350" height="300" rx="14" fill="#e8f1ea" stroke="#d6dfd8" stroke-width="2"/>
    <circle cx="1254" cy="214" r="24" fill="#207448"/>
    <text x="1254" y="223" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    <g transform="translate(1516,214)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -17 A 17 17 0 1 1 -12 -12"/>
      <polygon points="0,-9 7,7 -7,7" transform="translate(-12,-12) rotate(45)"/>
      <path d="M 0 17 A 17 17 0 1 1 12 12"/>
      <polygon points="0,-9 7,7 -7,7" transform="translate(12,12) rotate(225)"/>
    </g>

    <text x="1230" y="266" font-size="30" font-weight="bold" fill="#207448">I would revisit</text>
    <text x="1230" y="302" font-size="30" font-weight="bold" fill="#207448">if this condition</text>
    <text x="1230" y="338" font-size="30" font-weight="bold" fill="#207448">changed</text>
    <text x="1230" y="380" font-size="24" fill="#303a36">The point where</text>
    <text x="1230" y="408" font-size="24" fill="#303a36">the decision expires</text>
  </g>

  <line x1="390" y1="320" x2="412" y2="320" stroke="#207448" stroke-width="4"/>
  <polygon points="430,320 412,311 412,329" fill="#207448"/>
  <line x1="780" y1="320" x2="802" y2="320" stroke="#207448" stroke-width="4"/>
  <polygon points="820,320 802,311 802,329" fill="#207448"/>
  <line x1="1170" y1="320" x2="1192" y2="320" stroke="#207448" stroke-width="4"/>
  <polygon points="1210,320 1192,311 1192,329" fill="#207448"/>

  <rect x="50" y="560" width="1500" height="116" rx="12" fill="#e3e6e2" stroke="#b9c4bc" stroke-width="2"/>
  <text x="74" y="606" font-family="monospace" font-size="24" fill="#303a36">Given a two-week deadline, I chose YOUR CHOICE over YOUR ALTERNATIVE,</text>
  <text x="74" y="642" font-family="monospace" font-size="24" fill="#303a36">accepting YOUR COST, and I would revisit when load passes YOUR NUMBER</text>
</svg>