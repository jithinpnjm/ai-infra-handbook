<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>The 16-request burst: same traffic, two memory budgets</title>
  <desc>Visual comparison of a 16-request burst on a 24 GB GPU with 10 GB free cache versus a 34 GB free cache on L40S, illustrating preemption, recompute, and queueing under limited admission.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5" />

  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The 16-request burst: same traffic, two memory budgets</text>

  <g id="header-container">
    <rect x="60" y="120" width="1480" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(85, 162)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="#ffffff" />
      <rect x="18" y="18" width="20" height="20" rx="3" fill="#e8f1ea" />
      <line x1="18" y1="2" x2="18" y2="8" />
      <line x1="28" y1="2" x2="28" y2="8" />
      <line x1="38" y1="2" x2="38" y2="8" />
      <line x1="18" y1="48" x2="18" y2="54" />
      <line x1="28" y1="48" x2="28" y2="54" />
      <line x1="38" y1="48" x2="38" y2="54" />
      <line x1="2" y1="18" x2="8" y2="18" />
      <line x1="2" y1="28" x2="8" y2="28" />
      <line x1="2" y1="38" x2="8" y2="38" />
      <line x1="48" y1="18" x2="54" y2="18" />
      <line x1="48" y1="28" x2="54" y2="28" />
      <line x1="48" y1="38" x2="54" y2="38" />
    </g>
    <text x="165" y="165" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="165" dy="0">Llama-2-7B FP16 on a 24 GB GPU: weights 14 GB leave 10 GB;</tspan>
      <tspan x="165" dy="35">0.5 MB per token = 20,480 tokens of cache;</tspan>
      <tspan x="165" dy="35">16 requests of 3,000 prompt plus 1,000 output tokens, each growing to 4,000</tspan>
    </text>
  </g>

  <g id="col-10gb">
    <rect x="60" y="305" width="720" height="290" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <g transform="translate(85, 325)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea" />
      <line x1="16" y1="8" x2="16" y2="48" />
      <line x1="28" y1="8" x2="28" y2="48" />
      <line x1="40" y1="8" x2="40" y2="48" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    <text x="160" y="363" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">10 GB free</text>
    <text x="85" y="420" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">capacity 20,480 tokens; peak KV usage 1.0;</tspan>
      <tspan x="85" dy="35">2 preemptions; 11 requests waiting at the worst moment;</tspan>
      <tspan x="85" dy="35">6,759 recomputed tokens; 3,000 steps</tspan>
    </text>
  </g>

  <g id="col-34gb">
    <rect x="820" y="305" width="720" height="290" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(845, 325)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea" />
      <circle cx="28" cy="28" r="8" fill="#ffffff" />
      <line x1="28" y1="12" x2="28" y2="20" />
      <line x1="28" y1="36" x2="28" y2="44" />
      <line x1="12" y1="28" x2="20" y2="28" />
      <line x1="36" y1="28" x2="44" y2="28" />
    </g>
    <text x="920" y="363" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">34 GB free (the L40S case from the book)</text>
    <text x="845" y="420" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">no preemptions;</tspan>
      <tspan x="845" dy="35">1,000 steps</tspan>
    </text>
  </g>

  <g id="sequence-container">
    <rect x="60" y="640" width="1480" height="145" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(85, 682)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" fill="#ffffff" />
      <polyline points="20,28 26,34 38,20" />
    </g>
    <text x="165" y="683" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="165" dy="0">by prompt size six are admitted, the rest wait;</tspan>
      <tspan x="165" dy="35">as admitted requests grow the cache fills;</tspan>
      <tspan x="165" dy="35">the newest is preempted and recomputed</tspan>
    </text>
  </g>

  <g id="answer-container">
    <rect x="60" y="830" width="1480" height="145" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(85, 872)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 V 14 Z" fill="#e8f1ea" />
    </g>
    <text x="165" y="873" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="165" dy="0">KV exhaustion with queueing. Now: lower batch size limits</tspan>
      <tspan x="165" dy="35">or send the job to a bigger pool. Later: size the endpoint</tspan>
      <tspan x="165" dy="35">for the longest realistic request or add replicas</tspan>
    </text>
  </g>

  <g id="takeaway-bar">
    <rect x="60" y="1020" width="1480" height="75" rx="12" fill="#207448" />
    <text x="800" y="1067" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">three times as many steps on the small GPU because admission is limited</text>
  </g>
</svg>