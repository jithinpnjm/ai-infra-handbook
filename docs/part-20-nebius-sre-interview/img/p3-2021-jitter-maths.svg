<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Backoff ceilings, full jitter and the herd measurement</title>
  <desc>Visual infographic explaining backoff ceilings, full jitter delay formulas, herd measurement in lockstep failures, default settings, and retry rules.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Backoff ceilings, full jitter and the herd measurement</text>

  
  <g id="formula-node">
    <rect x="50" y="110" width="730" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(75, 125)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <path d="M 16 38 C 22 38 24 35 25 28 L 27 18 C 28 12 32 10 38 10 M 18 24 L 34 24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="145" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Formula</text>
    
    
    <rect x="75" y="195" width="680" height="175" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    <text x="95" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">ceiling for retry n = smaller of cap and</tspan>
      <tspan x="95" dy="34">base x 2 to the power (n - 1);</tspan>
      <tspan x="95" dy="40">full jitter sleeps a random time between</tspan>
      <tspan x="95" dy="34">0 and the ceiling, mean half the ceiling</tspan>
    </text>
  </g>

  
  <g id="worked-row-node">
    <rect x="820" y="110" width="730" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(845, 125)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="44" x2="48" y2="44" stroke="#207448" stroke-width="3"/>
      <rect x="12" y="34" width="6" height="10" fill="#207448"/>
      <rect x="22" y="26" width="6" height="18" fill="#207448"/>
      <rect x="32" y="18" width="6" height="26" fill="#207448"/>
      <rect x="42" y="10" width="6" height="34" fill="#207448"/>
    </g>
    
    <text x="915" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="915" dy="0">Worked row with base 0.1 s,</tspan>
      <tspan x="915" dy="34">cap 5 s</tspan>
    </text>

    
    <rect x="845" y="195" width="680" height="70" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    <text x="865" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">ceilings 0.1, 0.2, 0.4, 0.8 = total 1.5 s</text>

    
    <rect x="845" y="275" width="680" height="95" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    <text x="865" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">full-jitter means 0.05, 0.1, 0.2, 0.4</tspan>
      <tspan x="865" dy="34">= total 0.75 s</tspan>
    </text>
  </g>

  
  <g id="herd-measurement-node">
    <rect x="50" y="430" width="1500" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(75, 445)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <circle cx="16" cy="20" r="5" fill="#207448"/>
      <circle cx="40" cy="20" r="5" fill="#207448"/>
      <circle cx="14" cy="38" r="5" fill="#207448"/>
      <circle cx="28" cy="34" r="6" fill="#db8129"/>
      <circle cx="42" cy="38" r="5" fill="#207448"/>
    </g>
    
    <text x="145" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Herd measurement</text>

    
    <rect x="75" y="515" width="1120" height="185" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    <text x="95" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">1,000 clients fail together and keep failing for three rounds;</tspan>
      <tspan x="95" dy="34">largest number of retries in one 10 ms bin:</tspan>
      <tspan x="95" dy="34">1,000 without jitter (lockstep) versus 165 with full jitter;</tspan>
      <tspan x="95" dy="34">first round ceiling is only 0.1 s so a thousand clients land in</tspan>
      <tspan x="95" dy="34">about ten bins, the dangerous round</tspan>
    </text>

    
    <rect x="1215" y="515" width="310" height="185" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    
    <line x1="1235" y1="670" x2="1505" y2="670" stroke="#303a36" stroke-width="2"/>
    
    <rect x="1255" y="540" width="36" height="130" rx="3" fill="#db8129"/>
    
    <line x1="1310" y1="540" x2="1310" y2="670" stroke="#e8f1ea" stroke-width="2" stroke-dasharray="4 4"/>
    
    <rect x="1330" y="640" width="12" height="30" rx="2" fill="#207448"/>
    <rect x="1346" y="648" width="12" height="22" rx="2" fill="#207448"/>
    <rect x="1362" y="635" width="12" height="35" rx="2" fill="#207448"/>
    <rect x="1378" y="642" width="12" height="28" rx="2" fill="#207448"/>
    <rect x="1394" y="650" width="12" height="20" rx="2" fill="#207448"/>
    <rect x="1410" y="638" width="12" height="32" rx="2" fill="#207448"/>
    <rect x="1426" y="645" width="12" height="25" rx="2" fill="#207448"/>
    <rect x="1442" y="652" width="12" height="18" rx="2" fill="#207448"/>
    <rect x="1458" y="640" width="12" height="30" rx="2" fill="#207448"/>
    <rect x="1474" y="644" width="12" height="26" rx="2" fill="#207448"/>
  </g>

  
  <g id="defaults-strip-node">
    <rect x="50" y="760" width="1500" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(75, 775)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="18" r="5" fill="#207448"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="28" r="5" fill="#207448"/>
      <line x1="12" y1="38" x2="44" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="38" r="5" fill="#207448"/>
    </g>
    
    <text x="145" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Defaults strip</text>

    
    <rect x="75" y="840" width="1450" height="135" rx="8" fill="#ffffff" stroke="#cbdad0" stroke-width="1.5"/>
    <text x="95" y="872" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">Envoy: fully jittered exponential, 25 ms base, maximum 10 times base = 250 ms;</tspan>
      <tspan x="95" dy="30">first three retries wait 0 to 24 ms, 0 to 74 ms, 0 to 174 ms;</tspan>
      <tspan x="95" dy="30">tuned for web calls, an inference call that fails after a 20 s wait needs bigger numbers;</tspan>
      <tspan x="95" dy="30">gRPC uses plus or minus 20 percent jitter</tspan>
    </text>
  </g>

  
  <g id="rule-takeaway-node">
    <rect x="50" y="1030" width="1500" height="130" rx="12" fill="#207448"/>
    
    <g transform="translate(75, 1067)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
      <path d="M 28 12 L 44 19 L 44 32 C 44 41 28 46 28 46 C 28 46 12 41 12 32 L 12 19 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>
    
    <text x="145" y="1106" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Rule</text>

    
    <line x1="245" y1="1055" x2="245" y2="1135" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>

    
    <text x="275" y="1083" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff">
      <tspan x="275" dy="0">jitter fixes bunching, a budget fixes volume;</tspan>
      <tspan x="275" dy="36">honour Retry-After: sleep the larger of the server hint and your own jittered delay</tspan>
    </text>
  </g>
</svg>