<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>A Pending GPU pod: read the scheduler's reason, then take one of three branches</title>
  <desc>Decision tree illustrating how to diagnose a Pending Kubernetes GPU pod using kubectl describe pod and scheduler events.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">A Pending GPU pod: read the scheduler's reason,</text>
  <text x="800" y="105" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">then take one of three branches</text>

  
  <rect x="250" y="145" width="720" height="150" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  
  <text x="610" y="190" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129" text-anchor="middle">kubectl describe pod</text>
  <text x="610" y="232" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Read the <tspan font-family="monospace" fill="#db8129">FailedScheduling</tspan> event</text>
  <text x="610" y="270" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">The scheduler's own reason</text>

  
  <line x1="610" y1="295" x2="610" y2="340" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="260" y="340" width="700" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="610" y="384" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Pending means the scheduler has not placed it</text>

  
  <line x1="610" y1="410" x2="610" y2="445" stroke="#207448" stroke-width="3"/>
  <line x1="220" y1="445" x2="1000" y2="445" stroke="#207448" stroke-width="3"/>
  
  
  <line x1="220" y1="445" x2="220" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="610" y1="445" x2="610" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1000" y1="445" x2="1000" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="40" y="480" width="360" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  
  <g transform="translate(195, 502)">
    <rect x="4" y="4" width="42" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="12" y1="0" x2="12" y2="4" stroke="#207448" stroke-width="3.5"/>
    <line x1="25" y1="0" x2="25" y2="4" stroke="#207448" stroke-width="3.5"/>
    <line x1="38" y1="0" x2="38" y2="4" stroke="#207448" stroke-width="3.5"/>
    <line x1="12" y1="42" x2="12" y2="46" stroke="#207448" stroke-width="3.5"/>
    <line x1="25" y1="42" x2="25" y2="46" stroke="#207448" stroke-width="3.5"/>
    <line x1="38" y1="42" x2="38" y2="46" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="14" x2="4" y2="14" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="25" x2="4" y2="25" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="34" x2="4" y2="34" stroke="#207448" stroke-width="3.5"/>
    <line x1="46" y1="14" x2="50" y2="14" stroke="#207448" stroke-width="3.5"/>
    <line x1="46" y1="25" x2="50" y2="25" stroke="#207448" stroke-width="3.5"/>
    <line x1="46" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="3.5"/>
  </g>
  
  <text x="220" y="580" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Insufficient</text>
  <text x="220" y="614" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">nvidia.com/gpu</text>
  <text x="220" y="670" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">No node has a free GPU</text>
  <text x="220" y="704" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">in its Allocatable</text>

  
  <line x1="220" y1="750" x2="220" y2="795" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <rect x="40" y="795" width="360" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="220" y="838" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Allocatable is zero</text>
  <text x="220" y="872" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">on a GPU node</text>

  
  <line x1="220" y1="895" x2="220" y2="945" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="40" y="945" width="360" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="220" y="985" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Device plugin</text>
  <text x="220" y="1018" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">is the suspect</text>

  
  <rect x="430" y="480" width="360" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  
  <g transform="translate(585, 502)">
    <path d="M 25 4 L 46 12 L 46 28 C 46 40 25 48 25 48 C 25 48 4 40 4 28 L 4 12 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="25" y1="16" x2="25" y2="28" stroke="#207448" stroke-width="3.5"/>
    <circle cx="25" cy="35" r="2" fill="#207448"/>
  </g>
  
  <text x="610" y="585" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Untolerated taint</text>
  <text x="610" y="670" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Pod needs a toleration</text>

  
  <rect x="820" y="480" width="360" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  
  <g transform="translate(975, 502)">
    <path d="M 6 10 L 22 10 L 44 32 L 28 48 L 6 26 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="16" cy="18" r="3.5" fill="#207448"/>
  </g>
  
  <text x="1000" y="585" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Selector mismatch</text>
  <text x="1000" y="670" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Labels do not match</text>

  
  <rect x="1210" y="480" width="350" height="270" rx="10" fill="#f0f4f1" stroke="#303a36" stroke-width="2.5" stroke-dasharray="8,6"/>
  
  
  <g transform="translate(1360, 502)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#303a36" stroke-width="3.5"/>
    <line x1="10" y1="10" x2="40" y2="40" stroke="#303a36" stroke-width="3.5"/>
  </g>
  
  <text x="1385" y="585" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">ResourceQuota is hit</text>
  <text x="1385" y="632" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">API server returns 403,</text>
  <text x="1385" y="666" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">so no Pod exists and</text>
  <text x="1385" y="700" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the ReplicaSet records</text>
  <text x="1385" y="734" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the failure</text>

</svg>