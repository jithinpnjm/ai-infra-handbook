<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Turning an Xid code into ignore, suspect or drain</title>
  <desc>A decision flowchart detailing how to classify and handle GPU Xid error codes into ignore, suspect, or drain actions.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Turning an Xid code into ignore, suspect or drain</text>

  
  <g transform="translate(560, 100)">
    <rect width="480" height="80" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(25, 18)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="10" y="10" width="24" height="24" rx="3" fill="#f5f8f5" />
      <line x1="16" y1="4" x2="16" y2="10" />
      <line x1="22" y1="4" x2="22" y2="10" />
      <line x1="28" y1="4" x2="28" y2="10" />
      <line x1="16" y1="34" x2="16" y2="40" />
      <line x1="22" y1="34" x2="22" y2="40" />
      <line x1="28" y1="34" x2="28" y2="40" />
      <line x1="4" y1="16" x2="10" y2="16" />
      <line x1="4" y1="22" x2="10" y2="22" />
      <line x1="4" y1="28" x2="10" y2="28" />
      <line x1="34" y1="16" x2="40" y2="16" />
      <line x1="34" y1="22" x2="40" y2="22" />
      <line x1="34" y1="28" x2="40" y2="28" />
    </g>
    <text x="90" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Xid reported on a node</text>
  </g>

  
  <line x1="800" y1="180" x2="800" y2="230" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(570, 230)">
    <rect width="460" height="90" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="45" cy="45" r="24" fill="#207448" />
    <text x="45" y="54" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="90" y="54" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Code in the catalog?</text>
  </g>

  
  
  <path d="M 570 275 L 230 275 L 230 350" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  
  <rect x="360" y="257" width="60" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="390" y="282" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">no</text>

  
  <g transform="translate(60, 350)">
    <rect width="340" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="170" y="52" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Suspect</text>
    <text x="170" y="96" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">never ignore an unknown code</text>
  </g>

  
  <line x1="800" y1="320" x2="800" y2="400" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <rect x="815" y="342" width="65" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="847" y="367" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">yes</text>

  
  <g transform="translate(610, 400)">
    <rect width="380" height="90" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="45" cy="45" r="24" fill="#207448" />
    <text x="45" y="54" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="95" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Catalog action</text>
  </g>

  
  <path d="M 610 445 L 200 445 L 200 660" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  
  <g transform="translate(45, 510)">
    <rect width="310" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="155" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">IGNORE</text>
    <text x="155" y="65" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(for example Xid 43, 63)</text>
  </g>
  
  <g transform="translate(70, 660)">
    <rect width="260" height="90" rx="16" fill="#207448" stroke="#207448" stroke-width="3" />
    <text x="130" y="56" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Ignore</text>
  </g>

  
  <line x1="800" y1="490" x2="800" y2="660" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <g transform="translate(560, 525)">
    <rect width="480" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="240" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">application-level, RESTART_APP</text>
    <text x="240" y="72" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(for example Xid 13, 31, 94)</text>
  </g>

  
  <g transform="translate(480, 660)">
    <rect width="640" height="110" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="320" y="48" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Same code three times</text>
    <text x="320" y="84" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">within an hour on this node?</text>
  </g>

  
  <g transform="translate(1140, 660)">
    
    <rect x="15" y="15" width="55" height="80" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <line x1="25" y1="95" x2="25" y2="105" stroke="#207448" stroke-width="3" />
    <line x1="35" y1="95" x2="35" y2="105" stroke="#207448" stroke-width="3" />
    <line x1="45" y1="95" x2="45" y2="105" stroke="#207448" stroke-width="3" />
    <line x1="55" y1="95" x2="55" y2="105" stroke="#207448" stroke-width="3" />
    
    <rect x="23" y="25" width="38" height="18" fill="#207448" rx="2" />
    <rect x="23" y="55" width="38" height="18" fill="#207448" rx="2" />
    
    <text x="85" y="48" font-family="sans-serif" font-size="24" fill="#303a36">recent Xid times</text>
    <text x="85" y="80" font-family="sans-serif" font-size="24" fill="#303a36">kept per node</text>
  </g>

  
  <path d="M 600 770 L 600 890" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  
  <rect x="570" y="805" width="60" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="600" y="830" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">no</text>
  
  <g transform="translate(480, 890)">
    <rect width="240" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="120" y="56" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Suspect</text>
  </g>

  
  <path d="M 1000 770 L 1000 890" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  
  <rect x="968" y="805" width="65" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1000" y="830" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">yes</text>
  
  <g transform="translate(880, 890)">
    <rect width="240" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="120" y="56" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Drain</text>
  </g>

  
  <path d="M 990 445 L 1400 445 L 1400 890" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />
  
  <g transform="translate(1180, 500)">
    <rect width="400" height="110" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="200" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">reset, reboot or link</text>
    <text x="200" y="70" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(for example Xid 48, 64,</text>
    <text x="200" y="98" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">79, 95, 119, 120, 74)</text>
  </g>
  
  <g transform="translate(1230, 890)">
    <rect width="340" height="90" rx="16" fill="#db8129" stroke="#db8129" stroke-width="3" />
    <text x="170" y="56" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Drain at once</text>
  </g>

  
  <g transform="translate(50, 1070)">
    <rect width="1500" height="85" rx="16" fill="#207448" />
    <text x="750" y="52" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Translate the catalog into ignore, suspect and drain, and never ignore a code you do not recognise.</text>
  </g>

</svg>