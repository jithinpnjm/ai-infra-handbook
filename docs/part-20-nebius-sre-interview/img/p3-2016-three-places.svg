<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Three places a failing GPU shows up</title>
  <desc>Infographic explaining how GPU failures manifest across hardware reports, physical state, and workload effect, with a story strip showing performance degradation before errors appear.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Three places a failing GPU shows up</text>

  
  
  
  <rect x="60" y="112" width="315" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="148" r="24" fill="#207448" />
  <text x="95" y="157" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="95" y="210" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="78" dy="0">one GPU overheats</tspan>
    <tspan x="78" dy="32">and slows</tspan>
  </text>

  
  <line x1="375" y1="200" x2="415" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="425" y="112" width="335" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="460" cy="148" r="24" fill="#207448" />
  <text x="460" y="157" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="445" y="202" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="445" dy="0">every token step waits</tspan>
    <tspan x="445" dy="30">for the slowest GPU,</tspan>
    <tspan x="445" dy="30">so the whole replica slows</tspan>
  </text>

  
  <line x1="760" y1="200" x2="800" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="810" y="112" width="355" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="845" cy="148" r="24" fill="#207448" />
  <text x="845" y="157" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="830" y="202" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="830" dy="0">customer sees worse</tspan>
    <tspan x="830" dy="30">time to first token long</tspan>
    <tspan x="830" dy="30">before any crash</tspan>
  </text>

  
  <line x1="1165" y1="200" x2="1205" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1215" y="112" width="325" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1250" cy="148" r="24" fill="#207448" />
  <text x="1250" y="157" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1235" y="210" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="1235" dy="0">no error appears</tspan>
    <tspan x="1235" dy="32">anywhere</tspan>
  </text>

  
  
  <g id="col1">
    <rect x="60" y="325" width="460" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <rect x="95" y="360" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="109" y="374" width="28" height="28" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="107" y1="352" x2="107" y2="360" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="123" y1="352" x2="123" y2="360" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="139" y1="352" x2="139" y2="360" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="107" y1="416" x2="107" y2="424" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="123" y1="416" x2="123" y2="424" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="139" y1="416" x2="139" y2="424" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="87" y1="374" x2="95" y2="374" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="87" y1="388" x2="95" y2="388" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="87" y1="402" x2="95" y2="402" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="151" y1="374" x2="159" y2="374" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="151" y1="388" x2="159" y2="388" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="151" y1="402" x2="159" y2="402" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="175" y="400" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Hardware reports:</text>
    <text x="95" y="465" font-family="sans-serif" font-size="26px" fill="#303a36">
      <tspan x="95" dy="0">Xid messages,</tspan>
      <tspan x="95" dy="44">ECC counters,</tspan>
      <tspan x="95" dy="44">PCIe replays,</tspan>
      <tspan x="95" dy="44">NVLink errors</tspan>
    </text>
  </g>

  
  <g id="col2">
    <rect x="570" y="325" width="460" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <path d="M 605 385 C 605 375 613 367 623 367 C 633 367 641 375 641 385 L 641 405 C 648 411 653 420 653 430 C 653 446 640 459 623 459 C 606 459 593 446 593 430 C 593 420 598 411 605 405 Z" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="623" cy="430" r="16" fill="#207448" />
    <line x1="623" y1="420" x2="623" y2="390" stroke="#207448" stroke-width="5" stroke-linecap="round" />

    
    <text x="680" y="400" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Physical state:</text>
    <text x="605" y="495" font-family="sans-serif" font-size="26px" fill="#303a36">
      <tspan x="605" dy="0">temperature,</tspan>
      <tspan x="605" dy="44">power,</tspan>
      <tspan x="605" dy="44">clock throttling</tspan>
    </text>
  </g>

  
  <g id="col3">
    <rect x="1080" y="325" width="460" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <rect x="1115" y="360" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="1125,404 1137,392 1149,400 1161,376" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    
    <text x="1195" y="400" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Workload effect:</text>
    <text x="1115" y="465" font-family="sans-serif" font-size="25px" fill="#303a36">
      <tspan x="1115" dy="0">per-replica tokens per</tspan>
      <tspan x="1115" dy="38">second compared with the</tspan>
      <tspan x="1115" dy="38">fleet median for the same</tspan>
      <tspan x="1115" dy="38">model and GPU type</tspan>
    </text>

    
    <rect x="1100" y="635" width="420" height="375" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    
    
    <circle cx="1132" cy="672" r="16" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="1132" y1="664" x2="1132" y2="674" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="1132" cy="681" r="2" fill="#db8129" />

    <text x="1120" y="725" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="1120" dy="0">a throttled GPU raises</tspan>
      <tspan x="1120" dy="34">no Xid so the error log</tspan>
      <tspan x="1120" dy="34">stays clean;</tspan>
      <tspan x="1120" dy="42">a replica 30 percent</tspan>
      <tspan x="1120" dy="34">slower than the fleet</tspan>
      <tspan x="1120" dy="34">median for an hour is</tspan>
      <tspan x="1120" dy="34">suspect even when</tspan>
      <tspan x="1120" dy="34">every hardware counter</tspan>
      <tspan x="1120" dy="34">is quiet</tspan>
    </text>
  </g>

  
  <rect x="60" y="1075" width="1480" height="70" rx="10" fill="#207448" />
  <text x="800" y="1119" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">each place hides failures from the other two, so watch all three</text>
</svg>