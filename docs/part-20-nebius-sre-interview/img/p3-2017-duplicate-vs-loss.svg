<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Billing: a duplicate costs twenty times a tolerated loss</title>
  <desc>Infographic comparing tolerated billing loss with the severe cost of duplicate event billing.</desc>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">
    Billing: a duplicate costs twenty times a tolerated loss
  </text>

  
  <rect x="50" y="110" width="730" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(75, 128)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="28" x2="20" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="75" y="175" width="680" height="75" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
  <text x="95" y="206" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">Events per day: 1,000 requests per second x 86,400</tspan>
    <tspan x="95" dy="30">= 86.4 million</tspan>
  </text>

  
  <rect x="75" y="260" width="680" height="52" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
  <text x="95" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
    Storage per day at 200 B per event = 17.3 GB
  </text>

  
  <rect x="75" y="322" width="680" height="52" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
  <text x="95" y="357" font-family="sans-serif" font-size="24" fill="#303a36">
    Dedupe keys at 16 B for one day = 1.38 GB
  </text>

  
  <rect x="75" y="384" width="680" height="165" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
  <text x="95" y="418" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">Revenue per day: 86.4M x (800 x 0.10 + 300 x 0.40)</tspan>
    <tspan x="95" dy="34">/ 1M = 17,280 dollars</tspan>
    <tspan x="95" dy="38" fill="#4a5852">(prices 0.10 and 0.40 dollars per million tokens</tspan>
    <tspan x="95" dy="28" fill="#4a5852">in and out)</tspan>
  </text>

  
  <rect x="820" y="110" width="730" height="460" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(845, 128)">
    <line x1="6" y1="32" x2="32" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="8" y="18" width="6" height="14" fill="#207448"/>
    <rect x="18" y="6" width="6" height="26" fill="#207448"/>
    <rect x="28" y="24" width="6" height="8" fill="#207448"/>
  </g>

  
  <rect x="845" y="175" width="680" height="120" rx="8" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
  <text x="865" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    Loss at the tolerated 0.1 percent: 17.28 dollars per day
  </text>
  
  <rect x="865" y="235" width="640" height="28" rx="6" fill="#f0f5f1"/>
  <rect x="865" y="235" width="31" height="28" rx="6" fill="#207448"/>

  
  <rect x="845" y="315" width="680" height="234" rx="8" fill="#fff9f5" stroke="#db8129" stroke-width="2"/>
  <text x="865" y="352" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Overbilling if 2 percent of events duplicate:</tspan>
    <tspan x="865" dy="34" fill="#db8129">345.60 dollars per day</tspan>
  </text>
  
  <rect x="865" y="445" width="640" height="42" rx="6" fill="#faeee3"/>
  <rect x="865" y="445" width="620" height="42" rx="6" fill="#db8129"/>

  
  <rect x="50" y="595" width="1500" height="115" rx="14" fill="#207448"/>
  <g transform="translate(75, 632)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M12 20 L18 26 L28 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="642" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
    <tspan x="130" dy="0">duplicates are 20 times worse than the tolerated loss, so dedupe is the key design point;</tspan>
    <tspan x="130" dy="36">charging a customer twice breaks trust</tspan>
  </text>

  
  <rect x="50" y="735" width="1500" height="165" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(75, 760)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="18" y1="8" x2="18" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="18" x2="28" y2="18" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="130" y="776" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" dy="0">at-least-once delivery plus idempotent consumption equals effectively once;</tspan>
    <tspan x="130" dy="38">unique request id written at request end;</tspan>
    <tspan x="130" dy="38">a cancelled stream still bills the tokens already sent</tspan>
  </text>

  
  <rect x="50" y="925" width="1500" height="105" rx="14" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <g transform="translate(75, 958)">
    <polygon points="18,4 34,34 2,34" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="18" y1="14" x2="18" y2="24" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="29" r="1.5" fill="#db8129"/>
  </g>
  <text x="130" y="986" font-family="sans-serif" font-size="26" font-weight="bold" fill="#a44b00">
    a consumer replay after a bug fix, without dedupe, bills customers twice
  </text>
</svg>