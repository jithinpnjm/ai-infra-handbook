<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Drill 10: GPU capacity vanished on two upgraded nodes</title>
  <desc>Visual explanation of GPU capacity vanishing on upgraded nodes due to missing tolerations, the fix, upgrade order with verification gate, and prevention.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Drill 10: GPU capacity vanished on two upgraded nodes</text>

  
  <rect x="40" y="110" width="1520" height="365" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Three-step cause chain</text>

  
  <rect x="70" y="175" width="440" height="275" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="106" cy="212" r="24" fill="#207448" />
  <text x="106" y="221" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(434, 186)">
    <rect x="0" y="0" width="52" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="12" r="3" fill="#207448" />
    <line x1="24" y1="12" x2="42" y2="12" stroke="#207448" stroke-width="3" />
    <path d="M 26 50 L 26 30 M 18 38 L 26 30 L 34 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="96" y="296" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="96" dy="0">Upgrade recreated two GPU</tspan>
    <tspan x="96" dy="36">nodes with the GPU taint</tspan>
  </text>

  
  <line x1="510" y1="312" x2="568" y2="312" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="570" y="175" width="440" height="275" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="606" cy="212" r="24" fill="#207448" />
  <text x="606" y="221" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(934, 186)">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="28" y="0" width="22" height="22" rx="3" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="4 3" />
    <rect x="0" y="28" width="22" height="22" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="28" y="28" width="22" height="22" rx="3" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="4 3" />
  </g>
  <text x="596" y="278" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="596" dy="0">device plugin DaemonSet</tspan>
    <tspan x="596" dy="32">has no toleration for that</tspan>
    <tspan x="596" dy="32">taint: desired 10, ready 8,</tspan>
    <tspan x="596" dy="32">missing pods are on the</tspan>
    <tspan x="596" dy="32">two upgraded nodes</tspan>
  </text>

  
  <line x1="1010" y1="312" x2="1068" y2="312" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1070" y="175" width="460" height="275" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1106" cy="212" r="24" fill="#207448" />
  <text x="1106" y="221" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1454, 186)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="4" />
    <line x1="26" y1="0" x2="26" y2="8" stroke="#207448" stroke-width="4" />
    <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="44" x2="16" y2="52" stroke="#207448" stroke-width="4" />
    <line x1="26" y1="44" x2="26" y2="52" stroke="#207448" stroke-width="4" />
    <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="26" x2="8" y2="26" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="4" />
    <line x1="44" y1="16" x2="52" y2="16" stroke="#207448" stroke-width="4" />
    <line x1="44" y1="26" x2="52" y2="26" stroke="#207448" stroke-width="4" />
    <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" />
  </g>
  <text x="1096" y="268" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1096" dy="0">kubelet never learns about</tspan>
    <tspan x="1096" dy="28">the GPUs: Allocatable</tspan>
    <tspan x="1096" dy="28">nvidia.com/gpu is 0 on both</tspan>
    <tspan x="1096" dy="28">nodes (others show 8); pod</tspan>
    <tspan x="1096" dy="28">events show Insufficient</tspan>
    <tspan x="1096" dy="28">nvidia.com/gpu; old pods</tspan>
    <tspan x="1096" dy="28">still run</tspan>
  </text>

  
  <rect x="40" y="515" width="1520" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="558" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Fix</text>
  
  <g transform="translate(1480, 526)">
    <path d="M 28 8 C 22 2 12 2 6 8 C 2 12 1 18 3 24 L 28 49 L 41 36 L 16 11 C 21 10 27 11 31 15 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>

  <rect x="70" y="585" width="1460" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="96" y="622" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="96" dy="0">add the toleration to the DaemonSet and watch the pods come up;</tspan>
    <tspan x="96" dy="32">check Allocatable before you uncordon;</tspan>
    <tspan x="96" dy="32">check the plugin re-registers after any kubelet restart</tspan>
    <tspan x="96" dy="32">(a new kubelet deletes the plugin sockets);</tspan>
    <tspan x="96" dy="32">unhealthy device lowers allocatable and keeps capacity the same, so compare the two numbers</tspan>
  </text>

  
  <rect x="40" y="825" width="860" height="335" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="868" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Upgrade order with gate</text>
  
  <g transform="translate(822, 836)">
    <circle cx="26" cy="26" r="20" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="24 10" />
    <path d="M 38 6 L 46 14 L 38 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect x="70" y="895" width="800" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="96" y="938" font-family="monospace, monospace" font-size="24" fill="#303a36">kubectl drain NODE --ignore-daemonsets,</text>
  <text x="96" y="976" font-family="sans-serif" font-size="24" fill="#303a36">upgrade and restart kubelet,</text>

  
  <rect x="96" y="998" width="748" height="54" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
  <text x="116" y="1034" font-family="monospace, monospace" font-size="24" font-weight="bold" fill="#db8129">GATE: Allocatable shows the GPU count,</text>

  <text x="96" y="1098" font-family="monospace, monospace" font-size="24" fill="#303a36">then uncordon</text>

  
  <rect x="940" y="825" width="620" height="335" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="970" y="868" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Prevention</text>
  
  <g transform="translate(1482, 836)">
    <path d="M 26 4 L 48 12 L 48 26 C 48 38 38 48 26 52 C 14 48 4 38 4 26 L 4 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 16 26 L 24 34 L 36 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect x="970" y="895" width="560" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="996" y="946" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="996" dy="0">plugin DaemonSet tolerates every</tspan>
    <tspan x="996" dy="36">GPU taint;</tspan>
    <tspan x="996" dy="56">runbook step checks Allocatable</tspan>
    <tspan x="996" dy="36">before uncordon</tspan>
  </text>
</svg>