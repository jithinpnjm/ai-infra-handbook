<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Engine, server and orchestrator: place each tool on its layer</title>
  <desc>A vertical architecture stack showing orchestrator, server, engine, and GPU layers for LLM serving.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="sans-serif" font-size="38" font-weight="bold" fill="#207448" text-anchor="middle">Engine, server and orchestrator: place each tool on its layer</text>

  
  <rect x="670" y="88" width="260" height="56" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="690" y="99" width="30" height="22" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="705" y1="121" x2="705" y2="129" stroke="#207448" stroke-width="2.5"/>
  <line x1="697" y1="129" x2="713" y2="129" stroke="#207448" stroke-width="2.5"/>
  <text x="740" y="126" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Client</text>

  
  <line x1="800" y1="144" x2="800" y2="195" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="100" y="195" width="1400" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="120" y="210" width="560" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="150" y="258" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="28" fill="#207448">Orchestrator: </tspan>
    <tspan x="150" dy="40">how many copies, where they run,</tspan>
    <tspan x="150" dy="38">how requests reach them</tspan>
  </text>
  
  <g transform="translate(605, 230)" fill="none" stroke="#207448" stroke-width="3">
    <circle cx="15" cy="10" r="8"/>
    <circle cx="5" cy="38" r="7"/>
    <circle cx="35" cy="38" r="7"/>
    <line x1="12" y1="17" x2="7" y2="31"/>
    <line x1="20" y1="17" x2="31" y2="31"/>
  </g>

  
  <rect x="760" y="260" width="320" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="920" y="309" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Ray Serve LLM</text>

  <rect x="1130" y="260" width="280" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1270" y="309" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Kubernetes</text>

  
  <line x1="800" y1="410" x2="800" y2="450" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="100" y="450" width="1400" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="120" y="465" width="560" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="150" y="513" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="28" fill="#207448">Server layer: </tspan>
    <tspan x="150" dy="40">wraps engines in an API, model repository,</tspan>
    <tspan x="150" dy="38">health and metrics</tspan>
  </text>
  
  <g transform="translate(605, 485)" fill="none" stroke="#207448" stroke-width="2.5">
    <rect x="0" y="0" width="44" height="20" rx="3"/>
    <circle cx="9" cy="10" r="2.5" fill="#207448"/>
    <line x1="18" y1="10" x2="35" y2="10"/>
    <rect x="0" y="26" width="44" height="20" rx="3"/>
    <circle cx="9" cy="36" r="2.5" fill="#207448"/>
    <line x1="18" y1="36" x2="35" y2="36"/>
  </g>

  
  <rect x="730" y="518" width="225" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="842" y="567" font-family="monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">vllm serve</text>

  <rect x="980" y="518" width="245" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1102" y="567" font-family="monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">trtllm-serve</text>

  <rect x="1250" y="518" width="210" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1355" y="567" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Triton</text>

  
  <line x1="800" y1="665" x2="800" y2="705" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="100" y="705" width="1400" height="295" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

  
  <rect x="120" y="722" width="560" height="258" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="2"/>
  <text x="150" y="768" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="28" fill="#db8129">Engine: </tspan>
    <tspan x="150" dy="42">runs the model on the GPU,</tspan>
    <tspan x="150" dy="38">batches requests,</tspan>
    <tspan x="150" dy="38">manages the KV cache</tspan>
  </text>
  
  <g transform="translate(605, 740)" fill="none" stroke="#db8129" stroke-width="3">
    <circle cx="20" cy="20" r="10"/>
    <path d="M 20 2 L 20 7 M 20 33 L 20 38 M 2 20 L 7 20 M 33 20 L 38 20 M 7 7 L 11 11 M 29 29 L 33 33 M 7 33 L 11 29 M 29 11 L 33 7"/>
  </g>

  
  <rect x="730" y="732" width="220" height="76" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="2.5"/>
  <text x="840" y="780" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">vLLM</text>

  <rect x="975" y="732" width="265" height="76" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="2.5"/>
  <text x="1107" y="780" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">TensorRT-LLM</text>

  <rect x="1265" y="732" width="210" height="76" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="2.5"/>
  <text x="1370" y="780" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">SGLang</text>

  
  <rect x="730" y="842" width="745" height="110" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="1.5"/>
  <text x="1102" y="886" font-family="sans-serif" font-size="24" fill="#8c4800" text-anchor="middle">
    <tspan x="1102" dy="0">Triton is the older general server; </tspan>
    <tspan x="1102" dy="36">the engines are built for LLMs</tspan>
  </text>

  
  <line x1="800" y1="1000" x2="800" y2="1040" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

  
  <rect x="100" y="1040" width="1400" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(435, 1065)" fill="none" stroke="#207448" stroke-width="2.5">
    <rect x="8" y="8" width="40" height="40" rx="4"/>
    <rect x="17" y="17" width="22" height="22" fill="#207448" opacity="0.15"/>
    <line x1="16" y1="2" x2="16" y2="8"/><line x1="28" y1="2" x2="28" y2="8"/><line x1="40" y1="2" x2="40" y2="8"/>
    <line x1="16" y1="48" x2="16" y2="54"/><line x1="28" y1="48" x2="28" y2="54"/><line x1="40" y1="48" x2="40" y2="54"/>
    <line x1="2" y1="16" x2="8" y2="16"/><line x1="2" y1="28" x2="8" y2="28"/><line x1="2" y1="40" x2="8" y2="40"/>
    <line x1="48" y1="16" x2="54" y2="16"/><line x1="48" y1="28" x2="54" y2="28"/><line x1="48" y1="40" x2="54" y2="40"/>
  </g>
  <text x="830" y="1105" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">GPUs: weights and KV cache</text>

  
  <rect x="100" y="1185" width="1400" height="85" rx="14" fill="#207448"/>
  <text x="800" y="1238" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Before you compare tools, place each one on its layer.</text>
</svg>