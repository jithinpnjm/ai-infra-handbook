<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>A four-week practice routine</title>
  <desc>A horizontal timeline of four week blocks showing focus, session time, end-of-week test milestones, bug log tracking, and timed practice routine.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A four-week practice routine</text>

  
  <g id="card-week-1">
    <rect x="40" y="125" width="345" height="490" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 40 141 A 16 16 0 0 1 56 125 H 369 A 16 16 0 0 1 385 141 V 255 H 40 Z" fill="#207448" />
    <circle cx="88" cy="167" r="24" fill="#ffffff" />
    <text x="88" y="176" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1</text>
    <g transform="translate(309, 139)">
      <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5" />
      <line x1="4" y1="18" x2="52" y2="18" stroke="#ffffff" stroke-width="2.5" />
      <polyline points="12,28 20,34 12,40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="40" x2="36" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="212" y="233" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Language basics</text>
    <rect x="55" y="275" width="315" height="195" rx="12" fill="#e8f1ea" />
    <text x="212" y="335" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="212" dy="0">Dicts, counters, </tspan>
      <tspan x="212" dy="36">sorting, strings, </tspan>
      <tspan x="212" dy="36">the harness</tspan>
    </text>
    <rect x="55" y="490" width="315" height="105" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="212" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="212" dy="0">Time: 5 sessions </tspan>
      <tspan x="212" dy="34">of 1 hour</tspan>
    </text>
  </g>

  
  <g id="card-week-2">
    <rect x="431" y="125" width="345" height="490" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 431 141 A 16 16 0 0 1 447 125 H 760 A 16 16 0 0 1 776 141 V 255 H 431 Z" fill="#207448" />
    <circle cx="479" cy="167" r="24" fill="#ffffff" />
    <text x="479" y="176" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2</text>
    <g transform="translate(700, 139)">
      <rect x="6" y="8" width="18" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
      <rect x="32" y="8" width="18" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
      <rect x="6" y="34" width="18" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
      <rect x="32" y="34" width="18" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
    </g>
    <text x="603" y="233" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Core patterns</text>
    <rect x="446" y="275" width="315" height="195" rx="12" fill="#e8f1ea" />
    <text x="603" y="323" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="603" dy="0">Hash maps, </tspan>
      <tspan x="603" dy="32">two pointers, </tspan>
      <tspan x="603" dy="32">sliding window, </tspan>
      <tspan x="603" dy="32">stacks</tspan>
    </text>
    <rect x="446" y="490" width="315" height="105" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="603" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="603" dy="0">Time: 4 sessions </tspan>
      <tspan x="603" dy="34">of 75 minutes</tspan>
    </text>
  </g>

  
  <g id="card-week-3">
    <rect x="822" y="125" width="345" height="490" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <path d="M 822 141 A 16 16 0 0 1 838 125 H 1151 A 16 16 0 0 1 1167 141 V 255 H 822 Z" fill="#207448" />
    <circle cx="870" cy="167" r="24" fill="#ffffff" />
    <text x="870" y="176" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3</text>
    <g transform="translate(1091, 139)">
      <circle cx="28" cy="12" r="7" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="14" cy="42" r="7" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="42" cy="42" r="7" fill="none" stroke="#ffffff" stroke-width="3" />
      <line x1="23" y1="18" x2="17" y2="36" stroke="#ffffff" stroke-width="2.5" />
      <line x1="33" y1="18" x2="39" y2="36" stroke="#ffffff" stroke-width="2.5" />
    </g>
    <rect x="837" y="275" width="315" height="195" rx="12" fill="#e8f1ea" />
    <text x="994" y="335" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="994" dy="0">Heaps, intervals, </tspan>
      <tspan x="994" dy="36">binary search, </tspan>
      <tspan x="994" dy="36">graphs</tspan>
    </text>
    <rect x="837" y="490" width="315" height="105" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="994" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="994" dy="0">Time: 4 sessions </tspan>
      <tspan x="994" dy="34">of 75 minutes</tspan>
    </text>
  </g>

  
  <g id="card-week-4">
    <rect x="1214" y="125" width="345" height="490" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <path d="M 1214 141 A 16 16 0 0 1 1230 125 H 1543 A 16 16 0 0 1 1559 141 V 255 H 1214 Z" fill="#207448" />
    <circle cx="1262" cy="167" r="24" fill="#ffffff" />
    <text x="1262" y="176" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4</text>
    <g transform="translate(1483, 139)">
      <circle cx="28" cy="30" r="21" fill="none" stroke="#ffffff" stroke-width="3.5" />
      <line x1="28" y1="16" x2="28" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="30" x2="38" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 40 10 L 46 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1386" y="233" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Full mock rounds</text>
    <rect x="1229" y="275" width="315" height="195" rx="12" fill="#e8f1ea" />
    <text x="1386" y="335" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1386" dy="0">Two problems in </tspan>
      <tspan x="1386" dy="36">60 minutes, </tspan>
      <tspan x="1386" dy="36">once recorded</tspan>
    </text>
    <rect x="1229" y="490" width="315" height="105" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1386" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1386" dy="0">Time: 3 mocks </tspan>
      <tspan x="1386" dy="34">of 90 minutes</tspan>
    </text>
  </g>

  
  <line x1="385" y1="190" x2="431" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="776" y1="190" x2="822" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1167" y1="190" x2="1214" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="end-of-week-test-track">
    <rect x="40" y="655" width="1520" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="212" cy="695" r="22" fill="#207448" />
    <path d="M 202 695 L 209 702 L 222 689" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <circle cx="603" cy="695" r="22" fill="#207448" />
    <path d="M 593 695 L 600 702 L 613 689" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <rect x="660" y="670" width="280" height="50" rx="10" fill="#207448" />
    <text x="800" y="704" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">End-of-week test</text>
    
    <circle cx="994" cy="695" r="22" fill="#207448" />
    <path d="M 984 695 L 991 702 L 1004 689" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <circle cx="1386" cy="695" r="22" fill="#207448" />
    <path d="M 1376 695 L 1383 702 L 1396 689" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="212" y1="615" x2="212" y2="655" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="603" y1="615" x2="603" y2="655" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="994" y1="615" x2="994" y2="655" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="1386" y1="615" x2="1386" y2="655" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="bug-log-bar">
    <rect x="40" y="775" width="1520" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(70, 792)">
      <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="14" y1="18" x2="42" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="38" x2="34" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="150" y="830" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Keep a bug log: harness-found bugs are what to practise on</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="905" width="1520" height="70" rx="12" fill="#207448" />
    <text x="800" y="949" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Practise the process under time pressure.</text>
  </g>

</svg>