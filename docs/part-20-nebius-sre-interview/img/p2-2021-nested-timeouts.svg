<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Timeouts nest: client above gateway above engine</title>
  <desc>Visual explanation of nested timeout hierarchy across client, gateway, and engine layers, highlighting orphan work and retry storm dynamics.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="60" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Timeouts nest: client above gateway above engine</text>

  
  <rect x="60" y="94" width="1020" height="86" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
  <text x="570" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Each layer timeout is shorter than the one above,</text>
  <text x="570" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">with room for its retries</text>

  
  <rect x="60" y="195" width="1020" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(85, 215)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="4" />
    <circle cx="10" cy="7" r="3" fill="#207448" />
    <circle cx="20" cy="7" r="3" fill="#207448" />
    <circle cx="38" cy="33" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <polyline points="38,25 38,33 44,33" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="165" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client timeout: 60 seconds,</text>
  <text x="165" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">then the user gives up and retries</text>

  
  <rect x="85" y="310" width="890" height="310" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <g transform="translate(110, 325)">
    <rect x="2" y="6" width="52" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="28" r="4" fill="#207448" />
    <circle cx="40" cy="28" r="4" fill="#207448" />
    <path d="M 28 16 L 28 40 M 22 22 L 28 16 L 34 22 M 22 34 L 28 40 L 34 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="185" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Gateway: retries inside the</text>
  <text x="185" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">overall request timeout</text>

  
  <rect x="110" y="410" width="750" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(135, 430)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="210" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Engine: still generating</text>
  <text x="210" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">for nobody</text>

  
  <rect x="1140" y="195" width="400" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(1175, 230)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 8 A 20 20 0 0 1 48 28 A 12 12 0 0 1 36 40 A 6 6 0 0 1 30 34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <polygon points="28,2 34,8 28,14" fill="#207448" />
  </g>

  
  <text x="1255" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Fuel of a</text>
  <text x="1255" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">retry storm</text>

  
  <g transform="translate(1340, 440)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#e8f1ea" stroke-width="12" />
    <path d="M -60 0 A 60 60 0 1 1 60 0" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    <polygon points="60,-10 72,2 54,6" fill="#207448" />
    <path d="M 60 0 A 60 60 0 0 1 -60 0" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    <polygon points="-60,10 -72,-2 -54,-6" fill="#207448" />
  </g>

  
  <rect x="890" y="492" width="220" height="58" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="1000" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">Orphan work</text>

  
  <path d="M 860 562 L 1136 562" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <rect x="60" y="670" width="1480" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="95" y="705" width="445" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="125" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">First-token timeout</text>
  <text x="125" y="784" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(per try, before</text>
  <text x="125" y="816" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">output starts)</text>

  
  <rect x="575" y="705" width="445" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="605" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Inter-token idle timeout</text>
  <text x="605" y="784" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(detects a</text>
  <text x="605" y="816" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">stalled stream)</text>

  
  <rect x="1055" y="705" width="445" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1085" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Maximum stream duration</text>
  <text x="1085" y="784" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(protects the</text>
  <text x="1085" y="816" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">fleet)</text>

  
  <rect x="60" y="925" width="1480" height="85" rx="14" fill="#207448" />

  
  <g transform="translate(90, 940)">
    <circle cx="27" cy="27" r="24" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <polyline points="20,27 26,33 36,20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="165" y="978" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Pass a deadline down instead of inventing one at each hop.</text>
</svg>