<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>File names with spaces: newline lists split them, NUL separators do not</title>
  <desc>Visual comparison showing how standard newlines cause xargs to split filenames with spaces into incorrect fragments, while NUL delimiters with xargs -0 preserve complete filenames safely.</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d32f2f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="50" dy="0">File names with spaces: newline lists split them,</tspan>
    <tspan x="50" dy="56">NUL separators do not</tspan>
  </text>

  
  <rect x="40" y="145" width="1520" height="315" rx="12" fill="#ffffff" stroke="#d32f2f" stroke-width="3"/>

  
  <rect x="65" y="165" width="850" height="42" rx="6" fill="#fde8e8"/>
  <text x="80" y="196" font-family="monospace" font-size="30" font-weight="bold" fill="#c62828">Wrong: find . -name *.log -size +100k | xargs wc -c</text>

  
  <rect x="70" y="225" width="410" height="210" rx="8" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="118" cy="260" rx="20" ry="8"/>
    <path d="M 98 260 v 26 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -26"/>
    <path d="M 98 273 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8"/>
  </g>
  <text x="165" y="262" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">svc/api.log</text>
  
  <path d="M 280 278 h 18 v 12 h -8 m 4 -4 l -4 4 l 4 4" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="325" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">svc/old requests.log</text>
  
  <path d="M 390 341 h 18 v 12 h -8 m 4 -4 l -4 4 l 4 4" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="388" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">tmp/core dump.log</text>

  
  <line x1="480" y1="330" x2="525" y2="330" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrow-red)"/>

  
  <rect x="530" y="225" width="410" height="210" rx="8" fill="#fafafa" stroke="#d32f2f" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="575" cy="265" r="14"/>
    <path d="M 575 245 v 6 m 0 28 v 6 m -20 -20 h 6 m 28 0 h 6 m -18 -14 l 4 4 m 14 14 l 4 4 m -22 0 l 4 -4 m 14 -14 l 4 -4"/>
  </g>
  <text x="625" y="273" font-family="monospace" font-size="30" font-weight="bold" fill="#c62828">xargs</text>
  
  <rect x="550" y="295" width="160" height="46" rx="6" fill="#fde8e8" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="630" y="327" font-family="monospace" font-size="24" font-weight="bold" fill="#c62828" text-anchor="middle">svc/old</text>
  <rect x="730" y="295" width="190" height="46" rx="6" fill="#fde8e8" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="825" y="327" font-family="monospace" font-size="24" font-weight="bold" fill="#c62828" text-anchor="middle">requests.log</text>
  <rect x="550" y="360" width="160" height="46" rx="6" fill="#fde8e8" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="630" y="392" font-family="monospace" font-size="24" font-weight="bold" fill="#c62828" text-anchor="middle">tmp/core</text>
  <rect x="730" y="360" width="190" height="46" rx="6" fill="#fde8e8" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="825" y="392" font-family="monospace" font-size="24" font-weight="bold" fill="#c62828" text-anchor="middle">dump.log</text>

  
  <line x1="940" y1="330" x2="985" y2="330" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrow-red)"/>

  
  <rect x="990" y="225" width="545" height="210" rx="8" fill="#fde8e8" stroke="#d32f2f" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <path d="M 1035 242 L 1059 284 H 1011 Z" stroke-linejoin="round"/>
    <line x1="1035" y1="257" x2="1035" y2="269"/>
    <circle cx="1035" cy="276" r="1.5" fill="#207448"/>
  </g>
  <text x="1075" y="265" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c62828">
    <tspan x="1075" dy="0">missed old requests.log and</tspan>
    <tspan x="1075" dy="36">core dump.log, and included</tspan>
    <tspan x="1075" dy="36">svc/fresh.log which is newer</tspan>
    <tspan x="1075" dy="36">than the stamp</tspan>
  </text>

  
  <rect x="40" y="485" width="1520" height="605" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="65" y="505" width="1440" height="44" rx="6" fill="#e8f1ea"/>
  <text x="80" y="536" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">Right: find . -type f -name *.log -size +100k ! -newer ref.stamp -print0 | xargs -0 wc -c</text>

  
  <rect x="70" y="565" width="760" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g>
    <circle cx="112" cy="597" r="20" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="112,586 112,597 122,597" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="94" y1="579" x2="130" y2="615" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="150" y="605" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">ref.stamp: a fixed file, not the moving clock</text>

  
  <rect x="70" y="650" width="280" height="415" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="105" y="675" width="40" height="48" rx="4"/>
    <line x1="115" y1="690" x2="135" y2="690"/>
    <line x1="115" y1="702" x2="135" y2="702"/>
  </g>
  
  <rect x="90" y="775" width="240" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <circle cx="210" cy="820" r="24" fill="#db8129"/>
  <text x="210" y="828" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">\0</text>
  <text x="210" y="875" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="210" dy="0">NUL byte</tspan>
    <tspan x="210" dy="30">between names</tspan>
  </text>

  
  <line x1="350" y1="857" x2="385" y2="857" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="390" y="650" width="310" height="415" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="430" cy="695" r="14"/>
    <path d="M 430 675 v 6 m 0 28 v 6 m -20 -20 h 6 m 28 0 h 6 m -18 -14 l 4 4 m 14 14 l 4 4 m -22 0 l 4 -4 m 14 -14 l 4 -4"/>
  </g>
  <text x="475" y="703" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">xargs -0</text>
  
  <rect x="410" y="765" width="270" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="806" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">old requests.log</text>
  <rect x="410" y="865" width="270" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="906" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">core dump.log</text>

  
  <line x1="700" y1="857" x2="735" y2="857" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="740" y="650" width="280" height="415" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <polygon points="770,680 810,680 796,706 796,725 784,725 784,706"/>
  </g>
  <text x="760" y="785" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="760" dy="0">awk removes</tspan>
    <tspan x="760" dy="36">the total line</tspan>
    <tspan x="760" dy="36">that wc -c adds</tspan>
  </text>

  
  <line x1="1020" y1="857" x2="1055" y2="857" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="1060" y="650" width="475" height="415" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="1085" y="675" width="48" height="40" rx="4"/>
    <line x1="1085" y1="687" x2="1133" y2="687"/>
    <polyline points="1093,702 1098,706 1093,710" stroke-width="2.5"/>
  </g>
  
  <text x="1085" y="755" font-family="monospace" font-size="24" fill="#303a36">716800 ./deep/a/b/engine.log</text>
  <text x="1085" y="805" font-family="monospace" font-size="24" fill="#303a36">409600 ./svc/worker-a.log</text>
  <text x="1085" y="855" font-family="monospace" font-size="24" fill="#303a36">307200 ./svc/api.log</text>
  <text x="1085" y="905" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">256000 ./svc/old requests.log</text>
  <text x="1085" y="955" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">153600 ./tmp/core dump.log</text>
  <text x="1085" y="1005" font-family="monospace" font-size="24" fill="#303a36">122880 ./tmp/boundary.log</text>

  
  <rect x="40" y="1115" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1154" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Never delete from such a list without printing it first.</text>
</svg>