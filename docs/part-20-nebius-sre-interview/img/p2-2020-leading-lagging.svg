<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Leading signals move before users feel the pain</title>
  <desc>A visual comparison showing how concurrent running requests lead user pain, while queue depth and time to first token lag behind.</desc>

  <defs>
    <marker id="axis-arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Leading signals move before users feel the pain</text>

  
  <rect x="900" y="118" width="300" height="42" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
  <text x="1050" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Users first complain</text>

  
  <rect x="60" y="175" width="1480" height="185" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>

  
  <rect x="85" y="222" width="56" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="97" cy="233" r="3" fill="#207448"/>
  <line x1="110" y1="233" x2="131" y2="233" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <rect x="85" y="254" width="56" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="97" cy="265" r="3" fill="#207448"/>
  <line x1="110" y1="265" x2="131" y2="265" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="160" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Concurrent requests: <tspan x="160" dy="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="normal" fill="#207448">vllm:num_requests_running</tspan></text>

  
  <line x1="550" y1="190" x2="550" y2="345" stroke="#b8d5c4" stroke-width="1.5" stroke-dasharray="4 4"/>

  
  <line x1="580" y1="325" x2="1500" y2="325" stroke="#b8d5c4" stroke-width="2"/>
  <path d="M 580,325 L 660,325 C 720,325 760,270 820,270 L 1500,270" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round"/>

  
  <rect x="620" y="185" width="350" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="795" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="795" dy="0">Leads: rises with load</tspan>
    <tspan x="795" dy="28">before any queue forms</tspan>
  </text>
  <line x1="745" y1="253" x2="745" y2="284" stroke="#207448" stroke-width="2.5"/>
  <circle cx="745" cy="295" r="9" fill="#207448" stroke="#ffffff" stroke-width="3"/>


  
  <rect x="60" y="385" width="1480" height="185" rx="12" fill="#e8f1ea" stroke="#b8d5c4" stroke-width="2"/>

  
  <rect x="85" y="433" width="56" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="85" y="457" width="56" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="85" y="481" width="56" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="97" y1="441" x2="129" y2="441" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="465" x2="129" y2="465" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="97" y1="489" x2="121" y2="489" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <text x="160" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Waiting queue: <tspan x="160" dy="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="normal" fill="#207448">vllm:num_requests_waiting</tspan></text>

  
  <line x1="550" y1="400" x2="550" y2="555" stroke="#b8d5c4" stroke-width="1.5" stroke-dasharray="4 4"/>

  
  <line x1="580" y1="535" x2="1500" y2="535" stroke="#b8d5c4" stroke-width="2"/>
  <path d="M 580,535 L 1080,535 C 1130,535 1170,480 1220,480 L 1500,480" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round"/>

  
  <rect x="1150" y="395" width="310" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1305" y="423" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1305" dy="0">Lags: zero until</tspan>
    <tspan x="1305" dy="28">slots are full</tspan>
  </text>
  <line x1="1260" y1="463" x2="1260" y2="474" stroke="#207448" stroke-width="2.5"/>
  <circle cx="1260" cy="480" r="6" fill="#207448"/>


  
  <rect x="60" y="595" width="1480" height="185" rx="12" fill="#e8f1ea" stroke="#b8d5c4" stroke-width="2"/>

  
  <circle cx="113" cy="687" r="26" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="113,671 113,687 125,687" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="113" y1="657" x2="113" y2="661" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="160" y="697" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Time to first token</text>

  
  <line x1="550" y1="610" x2="550" y2="765" stroke="#b8d5c4" stroke-width="1.5" stroke-dasharray="4 4"/>

  
  <line x1="580" y1="745" x2="1500" y2="745" stroke="#b8d5c4" stroke-width="2"/>
  <path d="M 580,745 L 1040,745 C 1090,745 1130,690 1180,690 L 1500,690" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round"/>

  
  <rect x="1110" y="605" width="370" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1295" y="639" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Lags: rises with the pain</text>
  <line x1="1240" y1="657" x2="1240" y2="684" stroke="#207448" stroke-width="2.5"/>
  <circle cx="1240" cy="690" r="6" fill="#207448"/>


  
  <line x1="550" y1="800" x2="1515" y2="800" stroke="#303a36" stroke-width="3" marker-end="url(#axis-arrow)"/>
  
  <line x1="600" y1="795" x2="600" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="750" y1="795" x2="750" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="900" y1="795" x2="900" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="1050" y1="795" x2="1050" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="1200" y1="795" x2="1200" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="1350" y1="795" x2="1350" y2="805" stroke="#303a36" stroke-width="2"/>
  <line x1="1480" y1="795" x2="1480" y2="805" stroke="#303a36" stroke-width="2"/>

  
  <line x1="1050" y1="160" x2="1050" y2="800" stroke="#303a36" stroke-width="3" stroke-dasharray="8 6"/>

  
  <rect x="60" y="835" width="1480" height="66" rx="10" fill="#ffffff" stroke="#b8d5c4" stroke-width="2"/>
  <text x="800" y="876" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Lay the candidate metric next to the first complaint, and see which line moved first.</text>

  
  <rect x="60" y="930" width="1480" height="76" rx="10" fill="#207448"/>
  <text x="800" y="977" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A poor signal rises together with the pain, and by then the autoscaler is already late.</text>
</svg>