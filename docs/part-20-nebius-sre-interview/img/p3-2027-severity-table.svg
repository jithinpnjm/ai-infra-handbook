<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Severity levels defined by customer impact and a response</title>
  <desc>Infographic table outlining incident severity levels (SEV1 to Ticket), customer impacts, API examples, response times, update cadences, and operational notes.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="50" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Severity levels defined by customer impact and a response</text>
  <text x="50" y="98" font-family="sans-serif" font-size="24" fill="#303a36">Table (an example to adapt, not a standard; Nebius has not published its levels)</text>

  
  <g id="table-headers">
    <rect x="50" y="120" width="1500" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="140" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Level</text>
    <text x="250" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Customer impact</text>
    <text x="610" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Example for a token API</text>
    <text x="1080" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">First response</text>
    <text x="1340" y="153" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Update cadence</text>
  </g>

  
  <g id="row-sev1">
    <rect x="50" y="180" width="1500" height="130" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <path d="M 140 196 L 164 238 L 116 238 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="140" y1="207" x2="140" y2="223" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="140" cy="231" r="2" fill="#db8129" />
    <text x="140" y="280" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">SEV1</text>

    
    <text x="250" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="250" dy="0">most users cannot use</tspan>
      <tspan x="250" dy="32">the service</tspan>
    </text>
    <text x="610" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">gateway returns errors for</tspan>
      <tspan x="610" dy="32">most chat requests</tspan>
    </text>
    <text x="1080" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">5 minutes, page</tspan>
      <tspan x="1080" dy="32">the commander</tspan>
    </text>
    <text x="1340" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1340" dy="0">every 15</tspan>
      <tspan x="1340" dy="32">minutes</tspan>
    </text>
  </g>

  
  <g id="row-sev2">
    <rect x="50" y="320" width="1500" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <path d="M 140 336 C 132 336 127 342 127 352 L 123 364 L 157 364 L 153 352 C 153 342 148 336 140 336 Z" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 137 368 C 137 370 138 372 140 372 C 142 372 143 370 143 368" fill="none" stroke="#207448" stroke-width="3.5" />
    <text x="140" y="425" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">SEV2</text>

    
    <text x="250" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="250" dy="0">a real share of users</tspan>
      <tspan x="250" dy="32">see a worse service</tspan>
    </text>
    <text x="610" y="365" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">one replica group slow,</tspan>
      <tspan x="610" dy="32">25 percent of requests</tspan>
      <tspan x="610" dy="32">affected</tspan>
    </text>
    <text x="1080" y="395" font-family="sans-serif" font-size="24" fill="#303a36">15 minutes</text>
    <text x="1340" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1340" dy="0">every 30</tspan>
      <tspan x="1340" dy="32">minutes</tspan>
    </text>
  </g>

  
  <g id="row-sev3">
    <rect x="50" y="475" width="1500" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <path d="M 140 491 L 158 497 C 158 513 149 523 140 527 C 131 523 122 513 122 497 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <text x="140" y="575" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">SEV3</text>

    
    <text x="250" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="250" dy="0">few users affected or</tspan>
      <tspan x="250" dy="32">a workaround exists</tspan>
    </text>
    <text x="610" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">one tenant on a rarely</tspan>
      <tspan x="610" dy="32">used model sees errors</tspan>
    </text>
    <text x="1080" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">within working</tspan>
      <tspan x="1080" dy="32">hours</tspan>
    </text>
    <text x="1340" y="546" font-family="sans-serif" font-size="24" fill="#303a36">daily</text>
  </g>

  
  <g id="row-ticket">
    <rect x="50" y="615" width="1500" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <path d="M 124 631 L 156 631 C 156 637 153 640 153 645 C 153 650 156 653 156 659 L 124 659 C 124 653 127 650 127 645 C 127 640 124 637 124 631 Z" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="134" cy="645" r="2.5" fill="#207448" />
    <text x="140" y="715" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Ticket</text>

    
    <text x="250" y="686" font-family="sans-serif" font-size="24" fill="#303a36">no user effect yet</text>
    <text x="610" y="670" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">certificate expires</tspan>
      <tspan x="610" dy="32">in 20 days</tspan>
    </text>
    <text x="1080" y="670" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">next planning</tspan>
      <tspan x="1080" dy="32">round</tspan>
    </text>
    <text x="1340" y="686" font-family="sans-serif" font-size="24" fill="#303a36">none</text>
  </g>

  
  <g id="notes-section">
    
    <text x="50" y="785" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Notes</text>

    
    <rect x="50" y="805" width="1500" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="95" cy="870" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="95,856 95,870 106,870" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="150" y="845" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" dy="0">workbook on-call table: revenue-impacting outage response in 5 minutes,</tspan>
      <tspan x="150" dy="32">stuck batch system 30 minutes, failing pre-launch backup only a ticket;</tspan>
      <tspan x="150" dy="32">the response time comes from the impact, not from how alarming the failure looks</tspan>
    </text>

    
    <rect x="50" y="945" width="1500" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <line x1="75" y1="985" x2="115" y2="985" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="87" cy="985" r="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="75" y1="1010" x2="115" y2="1010" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="103" cy="1010" r="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="150" y="988" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" dy="0">a level is a setting, not a verdict: raise it when impact grows,</tspan>
      <tspan x="150" dy="34">lower it when damage is contained, write each change and its reason in the incident record</tspan>
    </text>

    
    <rect x="50" y="1060" width="1500" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="95" cy="1105" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="95" y1="1081" x2="95" y2="1087" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <polyline points="95,1105 103,1099" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="150" y="1112" font-family="sans-serif" font-size="24" fill="#303a36">declare a level within the first two minutes and say why; raising early is cheap</text>
  </g>
</svg>