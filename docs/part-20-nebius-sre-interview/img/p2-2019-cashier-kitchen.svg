<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <title>Measure at the gateway, explain at the engine</title>
  <desc>Visual infographic explaining measurement at the gateway and explanation at the engine in inference serving</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Measure at the gateway, explain at the engine</text>

  
  <g transform="translate(65, 215)">
    
    <circle cx="28" cy="18" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 6 52 C 6 36, 16 34, 28 34 C 40 34, 50 36, 50 52" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <line x1="120" y1="240" x2="148" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <rect x="150" y="130" width="450" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(347, 155)">
    <rect x="0" y="0" width="56" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8 16 L 48 16" stroke="#207448" stroke-width="3"/>
    <path d="M -6 50 L 62 50 L 52 32 L 4 32 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="-6" y1="58" x2="62" y2="58" stroke="#207448" stroke-width="4"/>
  </g>

  
  <text font-family="sans-serif" text-anchor="middle" fill="#303a36">
    <tspan x="375" y="250" font-size="30" font-weight="bold" fill="#207448">Gateway:</tspan>
    <tspan x="375" y="290" font-size="25">nearest the customer,</tspan>
    <tspan x="375" y="328" font-size="25">SLO ratios come from here</tspan>
  </text>

  
  <rect x="175" y="560" width="400" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(350, 580)">
    <path d="M 0 12 C 12 0, 18 24, 30 12 C 42 0, 48 24, 60 12" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 0 28 C 12 16, 18 40, 30 28 C 42 16, 48 40, 60 28" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="375" y="665">Gateway sends 200 at</tspan>
    <tspan x="375" y="705">the first token: count a</tspan>
    <tspan x="375" y="745">stream good only if it</tspan>
    <tspan x="375" y="785">ends with a normal finish</tspan>
  </text>

  
  <rect x="1090" y="130" width="450" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1287, 155)">
    <rect x="8" y="44" width="40" height="14" rx="2" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8 44 C -6 28, -2 0, 18 10 C 22 -6, 34 -6, 38 10 C 58 0, 62 28, 48 44 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="22" y1="44" x2="22" y2="24" stroke="#207448" stroke-width="3"/>
    <line x1="34" y1="44" x2="34" y2="24" stroke="#207448" stroke-width="3"/>
  </g>

  
  <text font-family="sans-serif" text-anchor="middle" fill="#303a36">
    <tspan x="1315" y="250" font-size="30" font-weight="bold" fill="#207448">Engine:</tspan>
    <tspan x="1315" y="290" font-size="25">queue, prefill and decode,</tspan>
    <tspan x="1315" y="328" font-size="25">KV cache use, preemptions</tspan>
  </text>

  
  <rect x="1115" y="360" width="400" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1275, 380)">
    <rect x="0" y="0" width="22" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="29" y="0" width="22" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="58" y="0" width="22" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="1315" y="445">Request waits in the</tspan>
    <tspan x="1315" y="480">router queue, six seconds</tspan>
    <tspan x="1315" y="515">in the example</tspan>
  </text>

  
  <line x1="600" y1="450" x2="1113" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <rect x="640" y="550" width="410" height="175" rx="16" fill="#fffbf7" stroke="#db8129" stroke-width="4"/>

  
  <line x1="600" y1="595" x2="638" y2="595" stroke="#db8129" stroke-width="3.5"/>
  <line x1="1050" y1="595" x2="1088" y2="595" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrowhead-orange)"/>
  <line x1="1090" y1="675" x2="1052" y2="675" stroke="#db8129" stroke-width="3.5"/>
  <line x1="640" y1="675" x2="602" y2="675" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrowhead-orange)"/>

  
  <text font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="845" y="605">Retry hides the first</tspan>
    <tspan x="845" y="640">failure, so count the</tspan>
    <tspan x="845" y="675">outcome the customer</tspan>
    <tspan x="845" y="710">sees</tspan>
  </text>

  
  <line x1="600" y1="800" x2="1088" y2="800" stroke="#207448" stroke-width="3" stroke-dasharray="10,6" marker-end="url(#arrowhead)"/>
  <rect x="695" y="760" width="300" height="75" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="845" y="792">Explains why an</tspan>
    <tspan x="845" y="824">order was slow</tspan>
  </text>

  
  <rect x="70" y="925" width="1460" height="75" rx="12" fill="#207448"/>
  <text x="800" y="971" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">The engine cannot report that it is dead, because it is the thing that died.</text>
</svg>