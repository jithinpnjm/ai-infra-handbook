<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Cost per million tokens: utilisation is the big lever</title>
  <desc>Infographic illustrating how GPU utilisation impacts cost per million tokens.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Cost per million tokens: utilisation is the big lever</text>

  
  <g id="formula-strip">
    <rect x="50" y="110" width="1500" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="153" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">cost per million tokens = price per GPU-hour x GPUs / (tokens per second x 3600 x utilisation) x 1e6</text>
  </g>

  
  <g id="bar-chart-panel">
    <rect x="50" y="205" width="880" height="445" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(80, 230)">
      <line x1="0" y1="52" x2="52" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <rect x="6" y="32" width="10" height="20" fill="none" stroke="#207448" stroke-width="3" rx="2" />
      <rect x="21" y="20" width="10" height="32" fill="none" stroke="#207448" stroke-width="3" rx="2" />
      <rect x="36" y="6" width="10" height="46" fill="none" stroke="#207448" stroke-width="3" rx="2" />
    </g>

    
    <text x="150" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">100 percent: $0.44 per million output tokens</text>
    <rect x="150" y="280" width="215" height="42" rx="8" fill="#207448" />

    
    <text x="150" y="380" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">60 percent: $0.73</text>
    <rect x="150" y="395" width="358" height="42" rx="8" fill="#207448" />

    
    <text x="150" y="495" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">30 percent: $1.47</text>
    <rect x="150" y="510" width="720" height="42" rx="8" fill="#207448" stroke="#db8129" stroke-width="5" />
  </g>

  
  <g id="price-card">
    <rect x="970" y="205" width="580" height="210" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1005, 282)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="20" y="20" width="16" height="16" fill="#207448" />
      
      <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="48" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="48" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="48" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    <text x="1080" y="280" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1080" dy="0">Price used: $4.50 per H100</tspan>
      <tspan x="1080" dy="36">GPU-hour (on-demand,</tspan>
      <tspan x="1080" dy="36">fetched 2026-11-09)</tspan>
    </text>
  </g>

  
  <g id="callout-card">
    <path d="M 970 440 L 1534 440 A 16 16 0 0 1 1550 456 L 1550 634 A 16 16 0 0 1 1534 650 L 970 650 A 16 16 0 0 1 954 634 L 954 560 L 935 545 L 954 530 L 954 456 A 16 16 0 0 1 970 440 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1005, 517)">
      <line x1="28" y1="6" x2="28" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="10" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="16" y1="48" x2="40" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 6 34 L 14 16 L 22 34 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <path d="M 34 34 L 42 16 L 50 34 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    </g>

    <text x="1090" y="530" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="1090" dy="0">Halving utilisation</tspan>
      <tspan x="1090" dy="42">doubles the cost</tspan>
    </text>
  </g>

  
  <g id="finance-levers">
    
    <g transform="translate(50, 680)">
      <rect x="0" y="0" width="1500" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(25, 10)">
        <path d="M 8 42 A 22 22 0 1 1 48 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="28" y1="36" x2="42" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="36" r="4" fill="#207448" />
      </g>
      <text x="105" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">1. Raise utilisation: fill the batch, smooth the traffic</text>
    </g>

    
    <g transform="translate(50, 765)">
      <rect x="0" y="0" width="1500" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(25, 10)">
        <line x1="6" y1="16" x2="50" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="20" cy="16" r="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="38" cy="28" r="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <line x1="6" y1="40" x2="50" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="26" cy="40" r="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
      </g>
      <text x="105" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">2. Lower cost per token: a precision the quality tests accept</text>
    </g>

    
    <g transform="translate(50, 850)">
      <rect x="0" y="0" width="1500" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(25, 10)">
        <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <circle cx="28" cy="28" r="7" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="105" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">3. Only then the GPU type</text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="950" width="1500" height="70" rx="12" fill="#207448" />
    <text x="800" y="994" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Quote cost per million output tokens with its utilisation.</text>
  </g>
</svg>