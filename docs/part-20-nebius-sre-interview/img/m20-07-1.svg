<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Build every pipeline in four moves</title>
  <desc>Five chained shell steps: look at the head and line count, narrow with grep or awk, extract one field, rank with sort and uniq, then cross-check with a second method.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#f5f8f5"/>

  <text x="800" y="78" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#303a36" text-anchor="middle">Build every pipeline in four moves</text>
  <rect x="752" y="100" width="96" height="5" rx="2.5" fill="#207448"/>

  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 280 H 560"/>
    <path d="M1020 280 H 1060"/>
    <path d="M1300 400 V 500 H 800 V 580"/>
    <path d="M1020 720 H 1060"/>
  </g>
  <g fill="#207448" stroke="none">
    <polygon points="580,280 560,271 560,289"/>
    <polygon points="1080,280 1060,271 1060,289"/>
    <polygon points="800,600 791,580 809,580"/>
    <polygon points="1080,720 1060,711 1060,729"/>
  </g>

  
  <g>
    <rect x="80" y="160" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(300 210)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-27 0 C -13 -17, 13 -17, 27 0 C 13 17, -13 17, -27 0 Z"/>
      <circle cx="0" cy="0" r="6.5"/>
    </g>
    <text x="300" y="309" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">Look:</text>
    <text x="300" y="347" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#303a36" text-anchor="middle">head, wc -l</text>
  </g>

  
  <g>
    <rect x="580" y="160" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(800 210)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24 -18 H 24 L 6 4 V 22 L -6 16 V 4 Z"/>
    </g>
    <text x="800" y="309" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">Narrow:</text>
    <text x="800" y="347" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#303a36" text-anchor="middle">grep or awk test</text>
  </g>

  
  <g>
    <rect x="1080" y="160" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1300 210)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-26" y="-21" width="52" height="42" rx="4"/>
      <path d="M-9 -21 V 21 M 9 -21 V 21 M -26 0 H 26"/>
      <rect x="-9" y="-21" width="18" height="21" fill="#207448" stroke="none"/>
    </g>
    <text x="1300" y="328" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">Extract one field</text>
  </g>

  
  <g>
    <rect x="580" y="600" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(800 650)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-30" y="-18" width="12" height="40" rx="4"/>
      <rect x="-14" y="-6" width="12" height="28" rx="4"/>
      <rect x="2" y="4" width="12" height="18" rx="4"/>
      <rect x="18" y="12" width="12" height="10" rx="4"/>
    </g>
    <text x="800" y="749" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">Rank:</text>
    <text x="800" y="787" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#303a36" text-anchor="middle">sort | uniq -c | sort -rn</text>
  </g>

  
  <g>
    <rect x="1080" y="600" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(1300 650)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-25" y="-23" width="50" height="46" rx="9"/>
      <path d="M-13 0 L -3 10 L 15 -11" stroke-width="5"/>
    </g>
    <text x="1300" y="749" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">Cross-check with a</text>
    <text x="1300" y="787" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">second method</text>
  </g>
</svg>