<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>One dashboard row per question, not per engine</title>
  <desc>Infographic table mapping observability questions across vLLM, Triton, and Ray Serve LLM inference engines, with critical gotchas.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-size="48" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">One dashboard row per question, not per engine</text>

  
  <g>
    
    <rect x="370" y="100" width="350" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="545" y="136" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#207448">vLLM</text>

    
    <rect x="740" y="100" width="390" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="935" y="136" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#207448">Triton</text>

    
    <rect x="1150" y="100" width="410" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1355" y="136" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#207448">Ray Serve LLM</text>
  </g>

  
  <g>
    
    <rect x="40" y="165" width="310" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 178)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="0" y="0" width="56" height="12" rx="3"/>
      <rect x="0" y="16" width="56" height="12" rx="3"/>
      <rect x="0" y="32" width="56" height="12" rx="3"/>
    </g>
    <text x="195" y="250" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">Is work</text>
    <text x="195" y="278" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">queued?</text>

    
    <rect x="370" y="165" width="350" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="545" y="222" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">waiting-requests</text>
    <text x="545" y="258" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">gauge</text>

    
    <rect x="740" y="165" width="390" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="222" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">nv_inference_pending_</text>
    <text x="935" y="258" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">request_count</text>

    
    <rect x="1150" y="165" width="410" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1355" y="222" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">ray_serve_deployment_</text>
    <text x="1355" y="258" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">queued_queries</text>
  </g>

  
  <g>
    
    <rect x="40" y="305" width="310" height="215" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 335)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="28" cy="28" r="26"/>
      <polyline points="28,12 28,28 40,28"/>
    </g>
    <text x="195" y="445" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">How long</text>
    <text x="195" y="482" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">does it wait?</text>

    
    <rect x="370" y="305" width="350" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="545" y="400" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">queue-time</text>
    <text x="545" y="435" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">histogram</text>

    
    <rect x="740" y="305" width="390" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="385" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">nv_inference_queue_</text>
    <text x="935" y="420" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">duration_us</text>
    <text x="935" y="455" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">(cumulative)</text>

    
    <rect x="1150" y="305" width="410" height="215" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <rect x="1150" y="305" width="410" height="8" rx="4" fill="#db8129"/>
    <text x="1355" y="352" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">no queue-time histogram on</text>
    <text x="1355" y="387" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">the metrics page, and</text>
    <text x="1355" y="422" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">ray_serve_deployment_</text>
    <text x="1355" y="457" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">processing_latency_ms</text>
    <text x="1355" y="492" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">excludes queue wait</text>
  </g>

  
  <g>
    
    <rect x="40" y="535" width="310" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 546)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="10" y="8" width="36" height="34" rx="3"/>
      <line x1="18" y1="2" x2="18" y2="8"/><line x1="28" y1="2" x2="28" y2="8"/><line x1="38" y1="2" x2="38" y2="8"/>
      <line x1="18" y1="42" x2="18" y2="48"/><line x1="28" y1="42" x2="28" y2="48"/><line x1="38" y1="42" x2="38" y2="48"/>
      <line x1="4" y1="16" x2="10" y2="16"/><line x1="4" y1="25" x2="10" y2="25"/><line x1="4" y1="34" x2="10" y2="34"/>
      <line x1="46" y1="16" x2="52" y2="16"/><line x1="46" y1="25" x2="52" y2="25"/><line x1="46" y1="34" x2="52" y2="34"/>
    </g>
    <text x="195" y="618" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">Is the</text>
    <text x="195" y="648" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">cache full?</text>

    
    <rect x="370" y="535" width="350" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="545" y="608" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">KV usage gauge</text>

    
    <rect x="740" y="535" width="390" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="590" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">not on the core metrics</text>
    <text x="935" y="626" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">page, backend-specific</text>

    
    <rect x="1150" y="535" width="410" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1355" y="590" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">vLLM engine metrics such</text>
    <text x="1355" y="626" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">as GPU cache utilization</text>
  </g>

  
  <g>
    
    <rect x="40" y="675" width="310" height="195" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(167, 702)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 28 4 L 50 14 L 50 32 C 50 44 28 54 28 54 C 28 54 6 44 6 32 L 6 14 Z"/>
      <line x1="28" y1="18" x2="28" y2="32"/>
      <circle cx="28" cy="40" r="1.5" fill="#207448"/>
    </g>
    <text x="195" y="795" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">Is it</text>
    <text x="195" y="828" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">failing?</text>

    
    <rect x="370" y="675" width="350" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="545" y="760" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">503 on /health when</text>
    <text x="545" y="796" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">the engine is dead</text>

    
    <rect x="740" y="675" width="390" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="730" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">nv_inference_request_</text>
    <text x="935" y="765" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">failure by reason</text>
    <text x="935" y="800" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">(REJECTED for scheduler</text>
    <text x="935" y="835" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">timeouts, BACKEND)</text>

    
    <rect x="1150" y="675" width="410" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1355" y="748" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">ray_serve_deployment_</text>
    <text x="1355" y="783" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#303a36">error_counter_total</text>
    <text x="1355" y="818" font-size="24" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#303a36">by exception type</text>
  </g>

  
  <g>
    
    <rect x="40" y="885" width="1520" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(60, 898)" stroke="#207448" stroke-width="3.5" fill="none">
      <polygon points="18,4 34,36 2,36"/>
      <line x1="18" y1="16" x2="18" y2="25"/>
      <circle cx="18" cy="30" r="1.5" fill="#207448"/>
    </g>
    <text x="105" y="927" font-size="30" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" fill="#207448">Gotchas</text>

    
    <rect x="60" y="942" width="470" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="75" y="976" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">Triton metrics on port 8002</text>
    <text x="75" y="1010" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">at /metrics; latency histograms</text>
    <text x="75" y="1044" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">only when summary_latencies is</text>
    <text x="75" y="1078" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">simplified, otherwise</text>
    <text x="75" y="1112" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">counters only;</text>

    
    <rect x="550" y="942" width="480" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="565" y="976" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">TensorRT-LLM v1.2.1</text>
    <text x="565" y="1010" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">/metrics returns JSON</text>
    <text x="565" y="1044" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">iteration stats and entries</text>
    <text x="565" y="1078" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">are removed once read, so</text>
    <text x="565" y="1112" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">poll from one collector only;</text>

    
    <rect x="1050" y="942" width="490" height="205" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1065" y="990" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">SGLang needs --enable-metrics</text>
    <text x="1065" y="1028" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#303a36">(sglang:num_queue_reqs,</text>
    <text x="1065" y="1066" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#303a36">sglang:token_usage,</text>
    <text x="1065" y="1104" font-size="24" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#303a36">sglang:queue_time_seconds)</text>
  </g>
</svg>