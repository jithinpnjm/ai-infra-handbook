<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A decision tree, an alert-to-cause table and a classifier</title>
  <desc>Troubleshooting decision tree mapping inference latency and errors to root causes and mitigation actions</desc>

