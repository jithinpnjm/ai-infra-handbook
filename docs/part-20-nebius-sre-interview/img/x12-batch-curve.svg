<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Batching raises total tokens per second but cuts each request's speed</title>
  <desc>A two-series bar chart showing total tokens per second scaling with batch size while per-request speed drops, with formula and takeaway.</desc>

  <defs>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 8 2 L 2 5 L 8 8 z" fill="#207448"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2 L 8 5 L 2 8 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#303a36">Batching raises total tokens per second but cuts each request's speed</text>

  
  <rect x="470" y="96" width="28" height="28" rx="6" fill="#207448"/>
  <text x="510" y="118" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tokens/s total</text>

  <rect x="800" y="96" width="28" height="28" rx="6" fill="#7a8b84"/>
  <text x="840" y="118" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tokens/s per request</text>

  
  <line x1="160" y1="520" x2="1340" y2="520" stroke="#d5e2d8" stroke-dasharray="6 6" stroke-width="1.5"/>
  <line x1="160" y1="420" x2="1340" y2="420" stroke="#d5e2d8" stroke-dasharray="6 6" stroke-width="1.5"/>
  <line x1="160" y1="320" x2="1340" y2="320" stroke="#d5e2d8" stroke-dasharray="6 6" stroke-width="1.5"/>

  
  <line x1="160" y1="620" x2="1340" y2="620" stroke="#303a36" stroke-width="2"/>

  
  <line x1="1060" y1="152" x2="1520" y2="152" stroke="#207448" stroke-width="3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <rect x="1050" y="166" width="480" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1290" y="202" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">34 times more total throughput</text>

  
  <rect x="580" y="285" width="310" height="50" rx="10" fill="#ffffff" stroke="#7a8b84" stroke-width="2"/>
  <text x="735" y="319" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the knee is near here</text>
  <path d="M 890 310 C 910 310, 920 330, 924 350" fill="none" stroke="#7a8b84" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="924" cy="350" r="4" fill="#7a8b84"/>

  
  <rect x="1260" y="330" width="315" height="120" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="2"/>
  <text x="1275" y="366" font-family="sans-serif" font-size="24" fill="#303a36">the gain from doubling</text>
  <text x="1275" y="401" font-family="sans-serif" font-size="24" fill="#303a36">the batch has shrunk to</text>
  <text x="1275" y="436" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">about 26 percent</text>
  <line x1="1260" y1="390" x2="1218" y2="390" stroke="#db8129" stroke-width="2.5"/>
  <circle cx="1216" cy="390" r="4" fill="#db8129"/>

  

  
  <rect x="204" y="606" width="50" height="14" rx="3" fill="#207448"/>
  <text x="229" y="578" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">200</text>
  <rect x="266" y="606" width="50" height="14" rx="3" fill="#7a8b84"/>
  <text x="291" y="600" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5a6862">200</text>
  <line x1="260" y1="620" x2="260" y2="628" stroke="#303a36" stroke-width="2"/>
  <text x="260" y="658" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">1</text>

  
  <rect x="444" y="550" width="50" height="70" rx="3" fill="#207448"/>
  <text x="469" y="536" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">1,385</text>
  <rect x="506" y="608" width="50" height="12" rx="3" fill="#7a8b84"/>
  <text x="531" y="598" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5a6862">173</text>
  <line x1="500" y1="620" x2="500" y2="628" stroke="#303a36" stroke-width="2"/>
  <text x="500" y="658" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">8</text>

  
  <rect x="684" y="428" width="50" height="192" rx="3" fill="#207448"/>
  <text x="709" y="414" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">3,802</text>
  <rect x="746" y="610" width="50" height="10" rx="3" fill="#7a8b84"/>
  <text x="771" y="600" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5a6862">119</text>
  <line x1="740" y1="620" x2="740" y2="628" stroke="#303a36" stroke-width="2"/>
  <text x="740" y="658" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">32</text>

  
  <rect x="924" y="350" width="50" height="270" rx="3" fill="#207448"/>
  <text x="949" y="336" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">5,361</text>
  <rect x="986" y="612" width="50" height="8" rx="3" fill="#7a8b84"/>
  <text x="1011" y="602" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5a6862">84</text>
  <line x1="980" y1="620" x2="980" y2="628" stroke="#303a36" stroke-width="2"/>
  <text x="980" y="658" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">64</text>

  
  <rect x="1164" y="280" width="50" height="340" rx="3" fill="#db8129"/>
  <text x="1189" y="266" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">6,744</text>
  <rect x="1226" y="614" width="50" height="6" rx="3" fill="#7a8b84"/>
  <text x="1251" y="604" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#5a6862">53</text>
  <line x1="1220" y1="620" x2="1220" y2="628" stroke="#303a36" stroke-width="2"/>
  <text x="1220" y="658" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">128</text>

  
  <rect x="120" y="700" width="1360" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(150, 742)">
    <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="16" y1="0" x2="16" y2="6" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="0" x2="28" y2="6" stroke="#207448" stroke-width="3"/>
    <line x1="40" y1="0" x2="40" y2="6" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="50" x2="16" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="50" x2="28" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="40" y1="50" x2="40" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="16" x2="6" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="28" x2="6" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="40" x2="6" y2="40" stroke="#207448" stroke-width="3"/>
    <line x1="50" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="50" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="50" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="240" y="755" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">step time = (weights + batch x context x bytes per token) / bandwidth</text>
  <text x="240" y="805" font-family="sans-serif" font-size="24" fill="#303a36">Qwen3-8B on one H100 at 2,500 tokens of context</text>

  
  <rect x="120" y="875" width="1360" height="80" rx="12" fill="#207448"/>
  <text x="800" y="925" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Choose the batch by the latency target, not by the largest number that fits.</text>
</svg>