<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>From a slow histogram bucket to one trace and its logs</title>
  <desc>An infographic showing the five-step path from a slow histogram bucket to one trace and its correlated logs using exemplars and trace ID.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 2 L 15 8 L 1 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">From a slow histogram bucket to one trace and its logs</text>

  
  <rect x="217" y="140" width="540" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="487" y="172" text-anchor="middle">
    <tspan x="487" dy="0" font-family="sans-serif" font-size="24" fill="#303a36">Turn on with</tspan>
    <tspan x="487" dy="30" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">--enable-feature=exemplar-storage</tspan>
  </text>
  <line x1="487" y1="216" x2="487" y2="255" stroke="#db8129" stroke-width="2.5" stroke-dasharray="5,4" />

  
  <rect x="40" y="255" width="268" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="105" cy="305" r="24" fill="#207448" />
  <text x="105" y="306" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>
  
  <rect x="194" y="283" width="52" height="44" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="194" y1="297" x2="246" y2="297" stroke="#207448" stroke-width="2.5" />
  <circle cx="203" cy="290" r="2.5" fill="#207448" />
  <circle cx="211" cy="290" r="2.5" fill="#207448" />
  <circle cx="219" cy="290" r="2.5" fill="#207448" />
  <line x1="205" y1="318" x2="205" y2="322" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="215" y1="312" x2="215" y2="322" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="225" y1="305" x2="225" y2="322" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="235" y1="315" x2="235" y2="322" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <line x1="64" y1="355" x2="284" y2="355" stroke="#c2d8c7" stroke-width="1.5" />
  
  <text x="174" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="174" dy="0">Panel shows</tspan>
    <tspan x="174" dy="38">a red bar</tspan>
    <tspan x="174" dy="38">on a slow</tspan>
    <tspan x="174" dy="38">bucket</tspan>
  </text>

  
  <line x1="308" y1="480" x2="353" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="353" y="255" width="268" height="580" rx="12" fill="#fef7ef" stroke="#db8129" stroke-width="3.5" />
  
  <circle cx="418" cy="305" r="24" fill="#207448" />
  <text x="418" y="306" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
  
  <path d="M 507 283 L 507 327 L 551 327" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 513 320 L 523 308 L 533 295 L 545 312" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="533" cy="295" r="5" fill="#db8129" stroke="#fef7ef" stroke-width="2" />
  
  <line x1="377" y1="355" x2="597" y2="355" stroke="#fbd8b5" stroke-width="1.5" />
  
  <text x="487" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="487" dy="0">Exemplar</tspan>
    <tspan x="487" dy="38">carries a</tspan>
    <tspan x="487" dy="38">trace ID</tspan>
  </text>
  
  <text x="487" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="487" dy="0">Enabled in the</tspan>
    <tspan x="487" dy="32">query editor,</tspan>
    <tspan x="487" dy="32">not for instant</tspan>
    <tspan x="487" dy="32">queries</tspan>
  </text>

  
  <line x1="621" y1="480" x2="666" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="666" y="255" width="268" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="731" cy="305" r="24" fill="#207448" />
  <text x="731" y="306" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
  
  <circle cx="844" cy="305" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
  <polyline points="844,291 844,305 855,305" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="844" y1="284" x2="844" y2="288" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <line x1="865" y1="305" x2="861" y2="305" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <line x1="844" y1="326" x2="844" y2="322" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <line x1="823" y1="305" x2="827" y2="305" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  
  <line x1="690" y1="355" x2="910" y2="355" stroke="#c2d8c7" stroke-width="1.5" />
  
  <text x="800" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Open the</tspan>
    <tspan x="800" dy="38">trace</tspan>
  </text>
  
  <text x="800" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">Gateway span,</tspan>
    <tspan x="800" dy="32">router span,</tspan>
    <tspan x="800" dy="32">engine span</tspan>
  </text>

  
  <line x1="934" y1="480" x2="979" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="979" y="255" width="268" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="1044" cy="305" r="24" fill="#207448" />
  <text x="1044" y="306" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
  
  <circle cx="1157" cy="305" r="16" fill="none" stroke="#207448" stroke-width="3.5" />
  <circle cx="1157" cy="305" r="6" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1157" y1="283" x2="1157" y2="289" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1157" y1="321" x2="1157" y2="327" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1135" y1="305" x2="1141" y2="305" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1173" y1="305" x2="1179" y2="305" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1141" y1="289" x2="1146" y2="294" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1168" y1="316" x2="1173" y2="321" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1141" y1="321" x2="1146" y2="316" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <line x1="1168" y1="294" x2="1173" y2="289" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  
  <line x1="1003" y1="355" x2="1223" y2="355" stroke="#c2d8c7" stroke-width="1.5" />
  
  <text x="1113" y="405" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1113" dy="0" font-family="sans-serif">Read the</tspan>
    <tspan x="1113" dy="38" font-family="monospace">trace_id</tspan>
    <tspan x="1113" dy="38" font-family="sans-serif">from the</tspan>
    <tspan x="1113" dy="38" font-family="sans-serif">trace</tspan>
  </text>

  
  <line x1="1247" y1="480" x2="1292" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1292" y="255" width="268" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="1357" cy="305" r="24" fill="#207448" />
  <text x="1357" y="306" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
  
  <ellipse cx="1470" cy="292" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 1450 292 v 14 c 0 3.86 8.95 7 20 7 s 20 -3.14 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 1450 306 v 14 c 0 3.86 8.95 7 20 7 s 20 -3.14 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
  
  <line x1="1316" y1="355" x2="1536" y2="355" stroke="#c2d8c7" stroke-width="1.5" />
  
  <text x="1426" y="405" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1426" dy="0" font-family="sans-serif">Search</tspan>
    <tspan x="1426" dy="38" font-family="sans-serif">the same</tspan>
    <tspan x="1426" dy="38" font-family="monospace">trace_id</tspan>
    <tspan x="1426" dy="38" font-family="sans-serif">in logs</tspan>
  </text>
  
  <text x="1426" y="555" text-anchor="middle" font-size="24" fill="#303a36">
    <tspan x="1426" dy="0"><tspan font-family="monospace">trace_id</tspan><tspan font-family="sans-serif"> on</tspan></tspan>
    <tspan x="1426" dy="32" font-family="sans-serif">every gateway</tspan>
    <tspan x="1426" dy="32" font-family="sans-serif">and engine</tspan>
    <tspan x="1426" dy="32" font-family="sans-serif">log line</tspan>
  </text>

  
  <rect x="40" y="875" width="1520" height="64" rx="8" fill="#207448" />
  <text x="800" y="916" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep errors and slow traces with tail sampling</text>
</svg>