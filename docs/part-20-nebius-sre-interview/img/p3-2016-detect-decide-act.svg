<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Detection, decision and action are three components</title>
  <desc>Infographic illustrating the three separate stages of GPU node fault remediation: detection, decision, and action, along with separation of concerns.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Detection, decision and action are three components</text>

  
  <line x1="490" y1="370" x2="590" y2="370" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="1010" y1="370" x2="1110" y2="370" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="70" y="140" width="420" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="120" cy="200" r="24" fill="#207448"/>
  <text x="120" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(176, 172)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" stroke-width="3"/>
    <circle cx="28" cy="28" r="15" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="28" cy="28" r="6" stroke-width="2"/>
    <line x1="28" y1="4" x2="28" y2="52" stroke-width="2"/>
    <line x1="4" y1="28" x2="52" y2="28" stroke-width="2"/>
    <line x1="28" y1="28" x2="45" y2="11" stroke-width="3.5"/>
    <circle cx="45" cy="11" r="3" fill="#207448" stroke="none"/>
  </g>
  
  <text x="256" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Detect:</text>

  <line x1="94" y1="245" x2="466" y2="245" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

  
  <text x="94" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="94" dy="0">DCGM exporter into</tspan>
    <tspan x="94" dy="33">Prometheus for GPU</tspan>
    <tspan x="94" dy="33">counters; node problem</tspan>
    <tspan x="94" dy="33">detector daemon on</tspan>
    <tspan x="94" dy="33">every node reports</tspan>
    <tspan x="94" dy="33">permanent faults as</tspan>
    <tspan x="94" dy="33">node conditions and</tspan>
    <tspan x="94" dy="33">temporary ones as</tspan>
    <tspan x="94" dy="33">events to the</tspan>
    <tspan x="94" dy="33">API server</tspan>
  </text>

  
  <line x1="280" y1="620" x2="280" y2="660" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>

  
  <rect x="70" y="660" width="420" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="94" y="702" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="94" dy="0">node problem detector</tspan>
    <tspan x="94" dy="32">says nothing about</tspan>
    <tspan x="94" dy="32">repair, so remediation</tspan>
    <tspan x="94" dy="32">is a separate job</tspan>
    <tspan x="94" dy="32">you build</tspan>
  </text>

  
  <rect x="590" y="140" width="420" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="640" cy="200" r="24" fill="#207448"/>
  <text x="640" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(696, 172)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="32" height="32" rx="6" stroke-width="3.5"/>
    <line x1="20" y1="4" x2="20" y2="12" stroke-width="3"/>
    <line x1="28" y1="4" x2="28" y2="12" stroke-width="3"/>
    <line x1="36" y1="4" x2="36" y2="12" stroke-width="3"/>
    <line x1="20" y1="44" x2="20" y2="52" stroke-width="3"/>
    <line x1="28" y1="44" x2="28" y2="52" stroke-width="3"/>
    <line x1="36" y1="44" x2="36" y2="52" stroke-width="3"/>
    <line x1="4" y1="20" x2="12" y2="20" stroke-width="3"/>
    <line x1="4" y1="28" x2="12" y2="28" stroke-width="3"/>
    <line x1="4" y1="36" x2="12" y2="36" stroke-width="3"/>
    <line x1="44" y1="20" x2="52" y2="20" stroke-width="3"/>
    <line x1="44" y1="28" x2="52" y2="28" stroke-width="3"/>
    <line x1="44" y1="36" x2="52" y2="36" stroke-width="3"/>
    <path d="M 22 28 L 28 22 L 34 28 L 28 34 Z" stroke-width="2.5"/>
  </g>
  
  <text x="776" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Decide:</text>

  <line x1="614" y1="245" x2="986" y2="245" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

  
  <text x="614" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="614" dy="0">your own controller</tspan>
    <tspan x="614" dy="33">watches the conditions</tspan>
    <tspan x="614" dy="33">and applies the fleet</tspan>
    <tspan x="614" dy="33">policy (ignore,</tspan>
    <tspan x="614" dy="33">suspect, drain) with</tspan>
    <tspan x="614" dy="33">memory of past</tspan>
    <tspan x="614" dy="33">Xids per node</tspan>
  </text>

  
  <rect x="1110" y="140" width="420" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="1160" cy="200" r="24" fill="#207448"/>
  <text x="1160" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1216, 172)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 C 42 6 48 10 48 20 C 48 37 28 48 28 50 C 28 48 8 37 8 20 C 8 10 14 6 28 6 Z" stroke-width="3.5"/>
    <path d="M 30 14 L 21 27 L 27 27 L 25 38 L 36 24 L 29 24 Z" fill="#207448" stroke="none"/>
  </g>
  
  <text x="1296" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Act:</text>

  <line x1="1134" y1="245" x2="1506" y2="245" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

  
  <text x="1134" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1134" dy="0">calls the cordon and</tspan>
    <tspan x="1134" dy="33">drain APIs through the</tspan>
    <tspan x="1134" dy="33">blast-radius limiter</tspan>
  </text>

  
  <rect x="70" y="900" width="1460" height="72" rx="12" fill="#207448"/>
  <text x="800" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">keep the three separate so a bug in one cannot silently do the job of another</text>
</svg>