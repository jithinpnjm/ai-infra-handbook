<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Memory Mechanics of list.insert versus deque.appendleft</title>
  <desc>Visual comparison showing list head insertion shifting contiguous memory with linear time growth versus deque prepending into an available block slot in constant time.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c9382c" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Memory Mechanics of list.insert versus deque.appendleft</text>

  
  <rect x="60" y="95" width="1480" height="425" rx="16" fill="#e8f1ea" stroke="#c4dcd0" stroke-width="2" />

  
  <g transform="translate(85, 115)">
    <rect x="0" y="4" width="56" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="19" y1="4" x2="19" y2="52" stroke="#207448" stroke-width="3" />
    <line x1="37" y1="4" x2="37" y2="52" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="160" y="152" font-family="monospace, monospace" font-size="32" font-weight="bold" fill="#207448">list.insert(0, x)</text>

  
  <rect x="100" y="200" width="84" height="74" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="142" y="247" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">x</text>

  
  <path d="M 184 237 L 275 237" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="contiguous-array" transform="translate(285, 200)">
    
    <rect x="0" y="0" width="150" height="74" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" />
    <text x="75" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">item 0</text>

    
    <rect x="160" y="0" width="150" height="74" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" />
    <text x="235" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">item 1</text>

    
    <rect x="320" y="0" width="150" height="74" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" />
    <text x="395" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">item 2</text>

    
    <rect x="480" y="0" width="90" height="74" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" stroke-dasharray="4,4" />
    <text x="525" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">...</text>

    
    <rect x="580" y="0" width="170" height="74" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" />
    <text x="665" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">item n-1</text>

    
    <path d="M 75 0 C 75 -24, 235 -24, 235 0" fill="none" stroke="#c9382c" stroke-width="3" marker-end="url(#arrow-red)" />
    <path d="M 235 0 C 235 -24, 395 -24, 395 0" fill="none" stroke="#c9382c" stroke-width="3" marker-end="url(#arrow-red)" />
    <path d="M 395 0 C 395 -24, 525 -24, 525 0" fill="none" stroke="#c9382c" stroke-width="3" marker-end="url(#arrow-red)" />
    <path d="M 525 0 C 525 -24, 665 -24, 665 0" fill="none" stroke="#c9382c" stroke-width="3" marker-end="url(#arrow-red)" />
  </g>

  
  <g transform="translate(415, 305)">
    <rect x="0" y="0" width="490" height="46" rx="23" fill="#fff5ec" stroke="#db8129" stroke-width="2" />
    <text x="245" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Shifts every item in contiguous memory</text>
  </g>

  
  <g transform="translate(100, 425)">
    
    <rect x="0" y="0" width="450" height="72" rx="12" fill="#ffffff" stroke="#c4dcd0" stroke-width="2" />
    <text x="225" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1,000 items: 0.61 us</text>

    
    <rect x="480" y="0" width="880" height="72" rx="12" fill="#feebe8" stroke="#f5b5ab" stroke-width="2" />
    <text x="920" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#96281b" text-anchor="middle">100,000 items: 30 us (O(n) linear growth)</text>
  </g>

  
  <rect x="60" y="550" width="1480" height="425" rx="16" fill="#e8f1ea" stroke="#c4dcd0" stroke-width="2" />

  
  <g transform="translate(85, 570)">
    <rect x="0" y="8" width="24" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="32" y="8" width="24" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="160" y="607" font-family="monospace, monospace" font-size="32" font-weight="bold" fill="#207448">deque.appendleft(x)</text>

  
  <g transform="translate(620, 575)">
    <rect x="0" y="0" width="280" height="42" rx="10" fill="#d8ebd9" stroke="#207448" stroke-width="2" />
    <text x="140" y="29" font-family="monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">collections.deque</text>
  </g>

  
  <rect x="100" y="655" width="84" height="74" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="142" y="702" font-family="monospace, monospace" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">x</text>

  
  <path d="M 184 692 L 275 692" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(285, 655)">
    
    <rect x="0" y="0" width="340" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="8" y="8" width="100" height="58" rx="6" fill="#e6f5eb" stroke="#207448" stroke-width="2" stroke-dasharray="5,4" />
    
    
    <rect x="118" y="8" width="100" height="58" rx="6" fill="#f0f4f1" stroke="#a2b8aa" stroke-width="1.5" />
    <rect x="228" y="8" width="100" height="58" rx="6" fill="#f0f4f1" stroke="#a2b8aa" stroke-width="1.5" />

    
    <path d="M 348 37 L 442 37" fill="none" stroke="#207448" stroke-width="3" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)" />

    
    <rect x="450" y="0" width="340" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="458" y="8" width="100" height="58" rx="6" fill="#f0f4f1" stroke="#a2b8aa" stroke-width="1.5" />
    <rect x="568" y="8" width="100" height="58" rx="6" fill="#f0f4f1" stroke="#a2b8aa" stroke-width="1.5" />
    <rect x="678" y="8" width="100" height="58" rx="6" fill="#f0f4f1" stroke="#a2b8aa" stroke-width="1.5" />
  </g>

  
  <g transform="translate(370, 760)">
    <rect x="0" y="0" width="480" height="46" rx="23" fill="#e0f2e6" stroke="#207448" stroke-width="2" />
    <text x="240" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#1b613c" text-anchor="middle">Writes to free slot in head block</text>
  </g>

  
  <g transform="translate(100, 880)">
    
    <rect x="0" y="0" width="450" height="72" rx="12" fill="#ffffff" stroke="#c4dcd0" stroke-width="2" />
    <text x="225" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1,000 items: 0.014 us</text>

    
    <rect x="480" y="0" width="880" height="72" rx="12" fill="#e0f2e6" stroke="#9fd4b2" stroke-width="2" />
    <text x="920" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#1b613c" text-anchor="middle">100,000 items: 0.16 us (O(1) flat, within noise)</text>
  </g>

  
  <rect x="60" y="1005" width="1480" height="115" rx="16" fill="#207448" />
  <text x="800" y="1052" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">At 100,000 items, list head insertion is ~187x slower because shifting contiguous memory</tspan>
    <tspan x="800" dy="36">scales with n, whereas deque prepends in constant time.</tspan>
  </text>
</svg>