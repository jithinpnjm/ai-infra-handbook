<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>Three-hour remote write outage: what is lost and where it still lives</title>
  <desc>Visual explanation of data retention, WAL compaction cutoff, and recovery during a remote write outage.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .text-dark { fill: #303a36; font-family: system-ui, -apple-system, sans-serif; }
      .title-text { font-size: 44px; font-weight: bold; fill: #1c2b24; }
      .section-heading { font-size: 28px; font-weight: bold; fill: #207448; }
      .label-text { font-size: 24px; font-weight: normal; fill: #303a36; }
      .label-bold { font-size: 25px; font-weight: bold; fill: #303a36; }
      .panel-card { fill: #e8f1ea; stroke: #207448; stroke-width: 2; rx: 12; }
      .panel-warning { fill: #fff7f0; stroke: #db8129; stroke-width: 2.5; rx: 12; }
      .panel-danger-dashed { fill: #fff3eb; stroke: #db8129; stroke-width: 2.5; stroke-dasharray: 8 6; rx: 12; }
      .timeline-axis { stroke: #207448; stroke-width: 6; stroke-linecap: round; }
      .axis-tick { stroke: #207448; stroke-width: 4; }
      .icon-stroke { fill: none; stroke: #207448; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .icon-warning { fill: none; stroke: #db8129; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .num-circle { fill: #207448; }
      .num-text { fill: #ffffff; font-size: 24px; font-weight: bold; text-anchor: middle; dominant-baseline: central; font-family: sans-serif; }
    </style>
  </defs>

  
  <rect width="1600" height="1280" class="bg" />

  
  <text x="800" y="68" class="text-dark title-text" text-anchor="middle">Three-hour remote write outage: what is lost and where it still lives</text>

  

  
  <rect x="160" y="115" width="670" height="100" class="panel-card" />
  <text x="495" y="156" class="text-dark label-bold" text-anchor="middle">store down: failed sends retry,</text>
  <text x="495" y="190" class="text-dark label-bold" text-anchor="middle">nothing lost</text>

  
  
  <rect x="890" y="95" width="550" height="135" class="panel-danger-dashed" />
  <text x="1165" y="138" class="text-dark label-bold" text-anchor="middle">unsent data lost from the</text>
  <text x="1165" y="172" class="text-dark label-bold" text-anchor="middle">long-term store,</text>
  <text x="1165" y="206" class="text-dark label-bold" text-anchor="middle">the hole dashboards show</text>

  
  <line x1="200" y1="270" x2="1400" y2="270" class="timeline-axis" />

  
  
  <line x1="200" y1="250" x2="200" y2="290" class="axis-tick" />
  <circle cx="200" cy="270" r="8" fill="#207448" />
  <text x="200" y="325" class="text-dark label-bold" text-anchor="middle">0 hours</text>

  
  <line x1="600" y1="250" x2="600" y2="290" class="axis-tick" />
  <circle cx="600" cy="270" r="8" fill="#207448" />
  <text x="600" y="325" class="text-dark label-bold" text-anchor="middle">1 hour</text>

  
  <line x1="1000" y1="240" x2="1000" y2="350" stroke="#db8129" stroke-width="5" stroke-dasharray="6 4" />
  <circle cx="1000" cy="270" r="9" fill="#db8129" />
  <text x="1000" y="325" class="text-dark label-bold" text-anchor="middle" fill="#db8129">2 hours</text>

  
  <line x1="1400" y1="250" x2="1400" y2="350" class="axis-tick" />
  <circle cx="1400" cy="270" r="8" fill="#207448" />
  <text x="1400" y="325" class="text-dark label-bold" text-anchor="middle">3 hours</text>

  
  <rect x="650" y="360" width="570" height="95" class="panel-warning" />
  <path d="M 990 360 L 1000 345 L 1010 360 Z" fill="#db8129" />
  <text x="935" y="400" class="text-dark label-bold" text-anchor="middle">write-ahead log is compacted,</text>
  <text x="935" y="434" class="text-dark label-bold" text-anchor="middle">unsent data is lost after this line</text>

  
  <rect x="1270" y="365" width="260" height="85" class="panel-card" />
  <path d="M 1390 365 L 1400 350 L 1410 365 Z" fill="#207448" />
  <text x="1400" y="418" class="text-dark label-bold" text-anchor="middle">store returns</text>

  

  
  <g transform="translate(100, 485)">
    <rect x="0" y="0" width="1400" height="85" class="panel-card" />
    
    <g transform="translate(25, 17)">
      <ellipse cx="25" cy="14" rx="20" ry="8" class="icon-stroke" />
      <path d="M 5 14 v 22 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -22" class="icon-stroke" />
      <path d="M 5 25 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8" class="icon-stroke" />
    </g>
    <text x="95" y="50" class="text-dark label-bold">Local Prometheus: keeps everything, local retention 15 days by default, queries still work</text>
  </g>

  
  <g transform="translate(100, 590)">
    <rect x="0" y="0" width="1400" height="85" rx="12" fill="#fdf0ea" stroke="#db8129" stroke-width="2" />
    
    <rect x="0" y="0" width="900" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 17)">
      <rect x="5" y="6" width="40" height="16" rx="4" class="icon-stroke" />
      <circle cx="15" cy="14" r="2" fill="#207448" />
      <circle cx="22" cy="14" r="2" fill="#207448" />
      <rect x="5" y="28" width="40" height="16" rx="4" class="icon-warning" />
      <circle cx="15" cy="36" r="2" fill="#db8129" />
      <circle cx="22" cy="36" r="2" fill="#db8129" />
    </g>
    <text x="95" y="50" class="text-dark label-bold">Long-term store: missing the last hour of the gap</text>
  </g>

  

  
  <g transform="translate(100, 705)">
    <rect x="0" y="0" width="680" height="235" class="panel-card" />
    
    <g transform="translate(30, 26)">
      <path d="M 24 6 C 15 6 10 13 10 23 C 10 33 6 37 6 37 L 42 37 C 42 37 38 33 38 23 C 38 13 33 6 24 6 Z" class="icon-stroke" />
      <path d="M 20 42 C 20 44.5 21.8 46 24 46 C 26.2 46 28 44.5 28 42" class="icon-stroke" />
    </g>
    <text x="95" y="58" class="section-heading">Prevention</text>
    <text x="35" y="128" class="text-dark label-text">RemoteWriteFallingBehind alert fires well</text>
    <text x="35" y="168" class="text-dark label-text">before the two-hour line</text>
  </g>

  
  <g transform="translate(820, 705)">
    <rect x="0" y="0" width="680" height="235" class="panel-card" />
    
    <g transform="translate(30, 26)">
      <rect x="10" y="10" width="28" height="28" rx="4" class="icon-stroke" />
      <line x1="18" y1="2" x2="18" y2="10" class="icon-stroke" />
      <line x1="30" y1="2" x2="30" y2="10" class="icon-stroke" />
      <line x1="18" y1="38" x2="18" y2="46" class="icon-stroke" />
      <line x1="30" y1="38" x2="30" y2="46" class="icon-stroke" />
      <line x1="2" y1="18" x2="10" y2="18" class="icon-stroke" />
      <line x1="2" y1="30" x2="10" y2="30" class="icon-stroke" />
      <line x1="38" y1="18" x2="46" y2="18" class="icon-stroke" />
      <line x1="38" y1="30" x2="46" y2="30" class="icon-stroke" />
    </g>
    <text x="95" y="58" class="section-heading">Side note</text>
    <text x="35" y="112" class="text-dark label-text">remote write raises Prometheus memory by about</text>
    <text x="35" y="148" class="text-dark label-text">25 percent on average; if one shard's queue fills,</text>
    <text x="35" y="184" class="text-dark label-text">reading of the WAL stops for all shards</text>
  </g>

  
  <g transform="translate(100, 965)">
    <rect x="0" y="0" width="1400" height="270" class="panel-card" />
    
    <g transform="translate(30, 24)">
      <path d="M 38 14 C 33 9 25 10 21 14 L 10 25 C 8 27 8 30 10 32 L 16 38 C 18 40 21 40 23 38 L 34 27 C 38 23 39 15 34 10" class="icon-stroke" />
      <circle cx="16" cy="32" r="3" fill="#207448" />
    </g>
    <text x="95" y="56" class="section-heading">Recovery steps</text>

    
    <g transform="translate(35, 85)">
      <circle cx="22" cy="22" r="22" class="num-circle" />
      <text x="22" y="22" class="num-text">1</text>
      <text x="60" y="28" class="text-dark label-bold">query it locally;</text>
    </g>

    
    <g transform="translate(35, 145)">
      <circle cx="22" cy="22" r="22" class="num-circle" />
      <text x="22" y="22" class="num-text">2</text>
      <text x="60" y="28" class="text-dark label-bold">to refill the store backfill from local blocks with a store-specific tool;</text>
    </g>

    
    <g transform="translate(35, 205)">
      <circle cx="22" cy="22" r="22" class="num-circle" />
      <text x="22" y="22" class="num-text">3</text>
      <text x="60" y="28" class="text-dark label-bold">read your store's procedure</text>
    </g>
  </g>

</svg>