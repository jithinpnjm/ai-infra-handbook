<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Three-hour remote write outage: what is lost and where it still lives</title>
  <desc>Visual explanation of Prometheus remote write behavior during a three-hour outage, showing WAL retention, compaction thresholds, data loss in long-term storage, and recovery procedures.</desc>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Three-hour remote write outage: what is lost and where it still lives</text>

  
  <rect x="60" y="105" width="1480" height="535" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(90, 135)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <line x1="200" y1="163" x2="1380" y2="163" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>

  
  
  <line x1="220" y1="145" x2="220" y2="181" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
  <text x="220" y="132" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">0 h</text>

  
  <line x1="600" y1="145" x2="600" y2="181" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
  <text x="600" y="132" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">1 h</text>

  
  <line x1="980" y1="145" x2="980" y2="181" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
  <text x="980" y="132" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">2 h</text>

  
  <line x1="1360" y1="145" x2="1360" y2="181" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
  <text x="1360" y="132" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">3 h</text>

  
  <rect x="220" y="200" width="760" height="96" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="600" y="256" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">store down: failed sends retry, nothing lost</text>

  
  <rect x="980" y="200" width="380" height="96" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1170" y="238" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1170" dy="0">unsent data lost from the</tspan>
    <tspan x="1170" dy="30">long-term store, the</tspan>
    <tspan x="1170" dy="30">hole dashboards show</tspan>
  </text>

  
  <line x1="980" y1="181" x2="980" y2="315" stroke="#db8129" stroke-width="4" stroke-dasharray="6,4"/>

  
  <rect x="670" y="315" width="620" height="82" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
  <text x="980" y="348" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="980" dy="0">write-ahead log is compacted,</tspan>
    <tspan x="980" dy="30">unsent data is lost after this line</tspan>
  </text>

  
  <line x1="1360" y1="181" x2="1360" y2="325" stroke="#207448" stroke-width="3" stroke-dasharray="4,4"/>
  <rect x="1245" y="325" width="230" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1360" y="365" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">store returns</text>

  
  <rect x="140" y="420" width="1320" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(165, 434)">
    <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8,14 V 42 A 20,8 0 0,0 48,42 V 14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8,28 A 20,8 0 0,0 48,28" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="245" y="470" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">Local Prometheus: </tspan>keeps everything, local retention 15 days by default, queries still work
  </text>

  
  <rect x="140" y="525" width="840" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="980" y="525" width="480" height="84" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4"/>
  
  <g transform="translate(165, 539)">
    <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8,14 V 42 A 20,8 0 0,0 48,42 V 14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 8,28 A 20,8 0 0,0 48,28" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="245" y="575" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Long-term store: </tspan>missing the last hour of the gap
  </text>

  
  <rect x="60" y="665" width="720" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(90, 685)">
    <path d="M 28,6 L 48,16 V 32 C 48,44 28,52 28,52 C 28,52 8,44 8,32 V 16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="165" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Prevention</text>
  <text x="90" y="792" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" fill="#207448">RemoteWriteFallingBehind</tspan> alert fires
    <tspan x="90" dy="36">well before the two-hour line</tspan>
  </text>

  
  <rect x="820" y="665" width="720" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(850, 685)">
    <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 28,8 V 16 M 28,40 V 48 M 8,28 H 16 M 40,28 H 48 M 14,14 L 20,20 M 36,36 L 42,42 M 14,42 L 20,36 M 36,20 L 42,14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="925" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Recovery steps</text>
  <text x="850" y="776" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="850" dy="0">query it locally;</tspan>
    <tspan x="850" dy="32">to refill the store backfill from local blocks</tspan>
    <tspan x="850" dy="32">with a store-specific tool;</tspan>
    <tspan x="850" dy="32">read your store's procedure</tspan>
  </text>

  
  <rect x="60" y="920" width="1480" height="195" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(90, 942)">
    <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="4"/>
    <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="4"/>
    <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="4"/>
    <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="4"/>
    <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="4"/>
    <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4"/>
    <line x1="4" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="4"/>
    <line x1="44" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4"/>
    <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4"/>
    <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="165" y="982" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side note</text>
  <text x="90" y="1036" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">remote write raises Prometheus memory by about 25 percent on average;</tspan>
    <tspan x="90" dy="36">if one shard's queue fills, reading of the WAL stops for all shards</tspan>
  </text>
</svg>