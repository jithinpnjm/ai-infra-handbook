<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <title>Ranking Hypotheses by Likelihood and Test Cost</title>
  <desc>A 2x2 prioritization matrix mapping hypotheses by likelihood and cost alongside a 5-step scientific falsification sequence.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1250" fill="#f5f8f5" />

  
  <text x="60" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ranking Hypotheses by Likelihood and Test Cost</text>

  
  
  

  
  <rect x="60" y="130" width="760" height="1060" rx="16" fill="#e8f1ea" stroke="#c4d7c8" stroke-width="2" />

  
  <g>
    <rect x="90" y="165" width="370" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 118 202 L 118 180 M 110 188 L 118 180 L 126 188" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="140" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Likelihood (Low to High)</text>
  </g>

  
  <rect x="90" y="245" width="340" height="410" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  
  <g transform="translate(115, 270)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 2 C 34 10 38 24 38 34 L 6 34 C 6 24 10 10 22 2 Z" />
    <circle cx="22" cy="18" r="4" />
    <path d="M 6 26 L 0 34 L 6 34 M 38 26 L 44 34 L 38 34" />
  </g>

  <text x="175" y="302" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">Test 1st (Horses)</text>

  <text x="115" y="365" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="115" dy="0">Recent deploy or</tspan>
    <tspan x="115" dy="32">config change</tspan>
  </text>

  <text x="115" y="475" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">1 command (rollout</tspan>
    <tspan x="115" dy="32">status, values diff)</tspan>
    <tspan x="115" dy="32">and timestamp check</tspan>
  </text>


  
  <rect x="455" y="245" width="340" height="410" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />

  
  <g transform="translate(480, 270)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="12" r="6" />
    <circle cx="34" cy="12" r="6" />
    <circle cx="22" cy="34" r="6" />
    <line x1="15" y1="15" x2="29" y2="30" />
    <line x1="29" y1="15" x2="15" y2="30" />
  </g>

  <text x="535" y="302" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Test 3rd</text>

  <text x="480" y="365" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="480" dy="0">Deep resource</tspan>
    <tspan x="480" dy="30">saturation /</tspan>
    <tspan x="480" dy="30">cross-zone network</tspan>
    <tspan x="480" dy="30">degradation</tspan>
  </text>

  <text x="480" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="480" dy="0">multi-graph</tspan>
    <tspan x="480" dy="32">correlation</tspan>
  </text>


  
  <rect x="90" y="680" width="340" height="410" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />

  
  <g transform="translate(115, 705)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="22 4, 38 12, 22 20, 6 12" />
    <polygon points="6 12, 22 20, 22 38, 6 30" />
    <polygon points="38 12, 22 20, 22 38, 38 30" />
  </g>

  <text x="175" y="730" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="175" dy="0">Test 2nd</tspan>
    <tspan x="175" dy="32">(Cheap Check)</tspan>
  </text>

  <text x="115" y="835" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Single bad pod</text>

  <text x="115" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">per-replica metric</tspan>
    <tspan x="115" dy="32">comparison</tspan>
  </text>


  
  <rect x="455" y="680" width="340" height="410" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />

  
  <g transform="translate(480, 705)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="22" cy="22" rx="10" ry="12" />
    <line x1="22" y1="10" x2="22" y2="34" />
    <line x1="8" y1="16" x2="36" y2="16" />
    <line x1="8" y1="28" x2="36" y2="28" />
  </g>

  <text x="535" y="730" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="535" dy="0">Avoid Until Last</tspan>
    <tspan x="535" dy="32">(Zebras)</tspan>
  </text>

  <text x="480" y="835" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="480" dy="0">Kernel bug / driver</tspan>
    <tspan x="480" dy="32">race condition</tspan>
  </text>

  <text x="480" y="930" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="480" dy="0">requiring kernel</tspan>
    <tspan x="480" dy="32">tracing</tspan>
  </text>


  
  <g>
    <rect x="250" y="1115" width="380" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 275 1141 L 297 1141 M 289 1133 L 297 1141 L 289 1149" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="312" y="1150" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Cost to Test (Low to High)</text>
  </g>


  
  
  

  
  <rect x="850" y="130" width="690" height="1060" rx="16" fill="#e8f1ea" stroke="#c4d7c8" stroke-width="2" />

  
  <text x="880" y="175" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Scientific falsification sequence</text>

  
  <rect x="880" y="200" width="630" height="130" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />
  <circle cx="920" cy="240" r="24" fill="#207448" />
  <text x="920" y="249" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="965" y="250" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Observation</text>
  <text x="965" y="295" font-family="sans-serif" font-size="24" fill="#303a36">p99 TTFT alert at 14:05</text>

  
  <line x1="1195" y1="330" x2="1195" y2="360" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="880" y="360" width="630" height="130" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />
  <circle cx="920" cy="400" r="24" fill="#207448" />
  <text x="920" y="409" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="965" y="410" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Hypothesis</text>
  <text x="965" y="455" font-family="sans-serif" font-size="24" fill="#303a36">13:50 deploy broke cache routing</text>

  
  <line x1="1195" y1="490" x2="1195" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="880" y="520" width="630" height="210" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />
  <circle cx="920" cy="560" r="24" fill="#207448" />
  <text x="920" y="569" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="965" y="570" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Concrete Prediction</text>
  <text x="965" y="618" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="965" dy="0">If true: prefix cache hit ratio dropped</tspan>
    <tspan x="965" dy="34">at 13:52 across all replicas;</tspan>
    <tspan x="965" dy="34">If false: hit ratio flat</tspan>
  </text>

  
  <line x1="1195" y1="730" x2="1195" y2="760" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="880" y="760" width="630" height="135" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />
  <circle cx="920" cy="800" r="24" fill="#207448" />
  <text x="920" y="809" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="965" y="810" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Decisive Test</text>
  <text x="965" y="858" font-family="monospace" font-size="24" fill="#303a36">Query vllm:prefix_cache_hits / queries</text>

  
  <line x1="1195" y1="895" x2="1195" y2="925" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="880" y="925" width="630" height="230" rx="12" fill="#ffffff" stroke="#c4d7c8" stroke-width="2" />
  <circle cx="920" cy="965" r="24" fill="#207448" />
  <text x="920" y="974" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="965" y="975" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Verdict</text>
  <text x="965" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="965" dy="0">Ratio fell from 0.55 to 0.03 -> Confirmed,</tspan>
    <tspan x="965" dy="32">roll back;</tspan>
    <tspan x="965" dy="32">If unchanged -> Hypothesis killed,</tspan>
    <tspan x="965" dy="32">proceed to next rank</tspan>
  </text>
</svg>