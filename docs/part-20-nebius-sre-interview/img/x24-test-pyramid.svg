<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>Four test layers for a module, cheapest at the base</title>
  <desc>A pyramid diagram illustrating the four testing layers for an infrastructure module, ordered by cost from cheapest at the base to the most expensive real apply in a sandbox at the top, along with their execution triggers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Four test layers for a module, cheapest at the base</text>

  
  <g id="layer-4">
    
    <rect x="170" y="150" width="840" height="160" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />

    
    <circle cx="220" cy="230" r="24" fill="#db8129" />
    <text x="220" y="239" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(264, 202)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#db8129" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="8" x2="28" y2="12" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="345" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Real apply in a sandbox</text>
    <text x="345" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="345" dy="0">Tiny pool, run on a schedule,</tspan>
      <tspan x="345" dy="32">the only layer that sees quota and capacity</tspan>
    </text>
  </g>

  
  <g id="layer-3">
    
    <rect x="130" y="330" width="920" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="180" cy="410" r="24" fill="#207448" />
    <text x="180" y="419" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(224, 382)">
      <path d="M 28 6 L 46 13 C 46 31 38 44 28 50 C 18 44 10 31 10 13 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <polyline points="20,27 26,33 37,21" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="305" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Policy on the plan</text>
    <text x="305" y="442" fill="#303a36">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">terraform show -json</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">, checked for deletes</tspan>
    </text>
  </g>

  
  <g id="layer-2">
    
    <rect x="90" y="510" width="1000" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="140" cy="590" r="24" fill="#207448" />
    <text x="140" y="599" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(184, 562)">
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 25 7 L 31 7 L 32 11 L 37 13 L 41 9 L 45 13 L 42 18 L 44 23 L 49 24 L 49 30 L 44 31 L 42 36 L 46 40 L 42 44 L 37 41 L 32 43 L 31 47 L 25 47 L 24 43 L 19 41 L 14 44 L 10 40 L 14 36 L 12 31 L 7 30 L 7 24 L 12 23 L 14 18 L 10 13 L 14 9 L 19 13 L 24 11 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    </g>

    
    <text x="265" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">terraform test</text>
    <text x="265" y="612" fill="#303a36">
      <tspan x="265" dy="0">
        <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">command = plan</tspan>
        <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> with a mock provider,</tspan>
      </tspan>
      <tspan x="265" dy="32">
        <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">expect_failures</tspan>
        <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> proves guards</tspan>
      </tspan>
    </text>
  </g>

  
  <g id="layer-1">
    
    <rect x="50" y="690" width="1080" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="100" cy="770" r="24" fill="#207448" />
    <text x="100" y="779" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(144, 742)">
      <rect x="10" y="10" width="36" height="36" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="20" y="20" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="20" y1="4" x2="20" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="28" y1="4" x2="28" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="4" x2="36" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="46" x2="20" y2="52" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="52" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="36" y1="46" x2="36" y2="52" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="20" x2="10" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="36" x2="10" y2="36" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>

    
    <text x="225" y="750" fill="#303a36">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold">terraform fmt -check</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold"> and </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold">terraform validate</tspan>
    </text>
    <text x="225" y="800" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Syntax and schema, offline, every commit</text>
  </g>

  
  <g id="runs-on-column">
    
    <text x="1385" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Runs on</text>

    
    <rect x="1220" y="180" width="330" height="100" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <text x="1385" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1385" dy="0">On a schedule,</tspan>
      <tspan x="1385" dy="32">not every commit</tspan>
    </text>

    
    <line x1="1010" y1="230" x2="1218" y2="230" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="1220" y="625" width="330" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text x="1385" y="690" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Every pull request</text>

    
    <path d="M 1090 590 L 1160 590 L 1160 770 L 1130 770" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1160" y1="680" x2="1218" y2="680" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>
</svg>