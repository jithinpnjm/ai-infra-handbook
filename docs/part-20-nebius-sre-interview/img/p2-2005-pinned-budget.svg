<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" width="1600" height="970">
  <title>Pinned memory budget for a 24 GiB pod</title>
  <desc>Visual infographic explaining why an inference pod with four workers and pinned staging buffers exceeds a 24 GiB memory limit, resulting in an OOM kill.</desc>

  <rect width="1600" height="970" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Pinned memory budget for a 24 GiB pod</text>

  
  <g id="input-card">
    <rect x="40" y="105" width="380" height="465" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(65, 128)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="44" height="14" rx="3"/>
      <rect x="0" y="18" width="44" height="14" rx="3"/>
      <circle cx="9" cy="7" r="1.5" fill="#207448"/>
      <circle cx="9" cy="25" r="1.5" fill="#207448"/>
      <line x1="20" y1="7" x2="35" y2="7"/>
      <line x1="20" y1="25" x2="35" y2="25"/>
    </g>
    
    
    <text x="125" y="155" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Hypothetical inference pod</text>

    
    <rect x="60" y="190" width="340" height="52" rx="8" fill="#e8f1ea"/>
    <text x="75" y="224" font-family="sans-serif" font-size="24" fill="#303a36">Limit: 24 GiB</text>

    <rect x="60" y="252" width="340" height="52" rx="8" fill="#e8f1ea"/>
    <text x="75" y="286" font-family="sans-serif" font-size="24" fill="#303a36">Worker processes: 4</text>

    <rect x="60" y="314" width="340" height="74" rx="8" fill="#e8f1ea"/>
    <text x="75" y="344" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">Pinned staging buffers </tspan>
      <tspan x="75" dy="28">per worker: 4 GiB</tspan>
    </text>

    <rect x="60" y="398" width="340" height="74" rx="8" fill="#e8f1ea"/>
    <text x="75" y="428" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">Runtime memory per </tspan>
      <tspan x="75" dy="28">worker: 3 GiB</tspan>
    </text>

    <rect x="60" y="482" width="340" height="52" rx="8" fill="#e8f1ea"/>
    <text x="75" y="516" font-family="sans-serif" font-size="24" fill="#303a36">Cached weights: 15 GiB</text>
  </g>

  
  <g id="middle-bar-card">
    <rect x="440" y="105" width="800" height="465" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(465, 128)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="6" width="46" height="24" rx="2"/>
      <line x1="8" y1="12" x2="8" y2="24"/>
      <line x1="16" y1="12" x2="16" y2="24"/>
      <line x1="24" y1="12" x2="24" y2="24"/>
      <line x1="32" y1="12" x2="32" y2="24"/>
      <line x1="6" y1="30" x2="6" y2="34"/>
      <line x1="14" y1="30" x2="14" y2="34"/>
      <line x1="22" y1="30" x2="22" y2="34"/>
      <line x1="30" y1="30" x2="30" y2="34"/>
      <line x1="38" y1="30" x2="38" y2="34"/>
    </g>

    
    <text x="525" y="155" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Cannot be reclaimed</text>

    
    
    <rect x="448" y="240" width="196" height="170" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="546" y="333" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Worker 1 (4 + 3)</text>

    
    <rect x="644" y="240" width="196" height="170" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="742" y="333" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Worker 2 (4 + 3)</text>

    
    <rect x="840" y="240" width="196" height="170" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="938" y="333" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Worker 3 (4 + 3)</text>

    
    <rect x="1036" y="240" width="196" height="170" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <text x="1134" y="333" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Worker 4 (4 + 3)</text>

    
    
    <rect x="1075" y="140" width="90" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="1120" y="170" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Limit</text>
    
    
    <line x1="1120" y1="182" x2="1120" y2="236" stroke="#db8129" stroke-width="3"/>
    <polygon points="1120,240 1114,226 1126,226" fill="#db8129"/>

    
    <line x1="1120" y1="240" x2="1120" y2="275" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4"/>
    <line x1="1120" y1="375" x2="1120" y2="410" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  
  <g id="verdict-box">
    <rect x="1260" y="105" width="300" height="465" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(1386, 140)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24,0 L 48,42 L 0,42 Z"/>
      <line x1="24" y1="16" x2="24" y2="26"/>
      <circle cx="24" cy="33" r="1.5" fill="#db8129"/>
    </g>

    
    <text x="1410" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="1410" dy="0">OOM kill expected: </tspan>
      <tspan x="1410" dy="44">28.0 GiB cannot </tspan>
      <tspan x="1410" dy="44">be reclaimed, </tspan>
      <tspan x="1410" dy="44">limit is lower</tspan>
    </text>
  </g>

  
  <g id="scenario-card-2">
    <rect x="40" y="590" width="1520" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(70, 645)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24,4 L 44,12 L 44,28 C 44,38 24,46 24,46 C 24,46 4,38 4,28 L 4,12 Z"/>
      <polyline points="15,24 21,30 33,18"/>
    </g>

    <text x="140" y="658" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Fits, but page cache will be reclaimed constantly</text>
    <text x="140" y="725" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">28 plus 15 equals 43 GiB</text>
  </g>

  
  <g id="formula-strip">
    <rect x="40" y="795" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(70, 835)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="38" rx="4"/>
      <polyline points="10,12 18,19 10,26"/>
      <line x1="24" y1="26" x2="36" y2="26"/>
    </g>

    <text x="140" y="845" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">unreclaimable = workers x (pinned + runtime)</text>
    <text x="140" y="895" font-family="sans-serif" font-size="24" fill="#303a36">Page cache is left out of the sum.</text>
  </g>
</svg>