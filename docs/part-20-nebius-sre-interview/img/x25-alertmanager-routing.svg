<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Alertmanager: grouped alerts, route by severity, and inhibition rules</title>
  <desc>Visual infographic explaining Alertmanager grouping, severity routing, and inhibition rules with explicit silences and intervals.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="sans-serif" font-size="38" font-weight="bold" fill="#207448" text-anchor="middle">Alertmanager: grouped alerts, route by severity,</text>
  <text x="800" y="96" font-family="sans-serif" font-size="38" font-weight="bold" fill="#207448" text-anchor="middle">and inhibition rules</text>

  
  <rect x="420" y="130" width="1130" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
  
  
  <g transform="translate(450, 150)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16"/>
    <line x1="9" y1="9" x2="31" y2="31"/>
  </g>
  <text x="500" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Inhibition</text>

  
  <rect x="450" y="205" width="1070" height="100" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="475" y="246" font-size="24">
    <tspan font-family="monospace" font-weight="bold" fill="#db8129">VllmTargetsMissing</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> silences </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">ErrorRatioHigh</tspan>
    <tspan font-family="sans-serif" fill="#303a36">,</tspan>
  </text>
  <text x="475" y="282" font-size="24">
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">KVCacheSaturated</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> and </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">QueueDeep</tspan>
    <tspan font-family="sans-serif" fill="#303a36"> in the same cluster</tspan>
  </text>

  
  <rect x="450" y="325" width="1070" height="80" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="475" y="374" font-family="sans-serif" font-size="24" fill="#303a36">A page silences tickets for the same model</text>

  
  
  <path d="M 60,538 L 30,538 L 30,898" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 30,658 L 52,658" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <path d="M 30,778 L 52,778" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <path d="M 30,898 L 52,898" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>

  
  <path d="M 1550,575 L 1575,575 L 1575,995 L 1558,995" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>

  
  
  <rect x="60" y="500" width="310" height="76" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="215" y="547" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">VllmTargetsMissing</text>

  
  <rect x="60" y="620" width="310" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="667" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ErrorRatioHigh</text>

  
  <rect x="60" y="740" width="310" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="787" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">QueueDeep</text>

  
  <rect x="60" y="860" width="310" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="907" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">KVCacheSaturated</text>

  
  <path d="M 370,538 L 395,538 L 395,898 L 370,898" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="395" y1="718" x2="412" y2="718" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="420" y="465" width="440" height="585" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>

  
  <g transform="translate(615, 485)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="40" height="30" rx="4"/>
    <line x1="12" y1="4" x2="12" y2="34"/>
  </g>
  <text x="640" y="555" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Group by cluster and model</text>

  
  <text x="640" y="605" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">group_wait 30s,</text>
  <text x="640" y="640" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">group_interval 5m,</text>
  <text x="640" y="675" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">repeat_interval 12h</text>

  
  <rect x="445" y="730" width="390" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(612, 780)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="32" rx="4"/>
    <path d="M 6 12 L 28 28 L 50 12"/>
  </g>
  <text x="640" y="875" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">One notification per</text>
  <text x="640" y="915" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">model and cluster</text>

  
  <line x1="860" y1="810" x2="892" y2="810" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="900" y="730" width="190" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
  
  
  <g transform="translate(970, 745)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="24" r="5" fill="#207448"/>
    <path d="M 15 24 L 30 24 L 40 12"/>
    <path d="M 30 24 L 40 36"/>
  </g>
  <text x="995" y="830" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Route by</text>
  <text x="995" y="865" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">severity</text>

  
  
  <path d="M 995,730 L 995,575 L 1252,575" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <rect x="1035" y="555" width="185" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1127" y="583" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">severity=page</text>

  
  <path d="M 995,890 L 995,995 L 1252,995" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <rect x="1025" y="975" width="205" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1127" y="1003" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">severity=ticket</text>

  
  
  <rect x="1260" y="500" width="290" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
  
  
  <g transform="translate(1380, 515)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 15 28 A 12 12 0 0 1 35 28 L 39 34 L 11 34 Z"/>
    <path d="M 21 34 A 4 4 0 0 0 29 34"/>
    <circle cx="25" cy="14" r="2" fill="#207448"/>
  </g>
  <text x="1405" y="590" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">pager</text>
  <text x="1405" y="630" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">repeat_interval 4h</text>

  
  <rect x="1260" y="930" width="290" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
  
  
  <g transform="translate(1380, 945)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 12 L 28 12 L 40 24 L 24 40 L 12 28 Z"/>
    <circle cx="20" cy="20" r="3" fill="#207448"/>
  </g>
  <text x="1405" y="1025" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">ticket</text>
</svg>