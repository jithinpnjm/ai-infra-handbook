<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Seeding one node per rack turns a 700 second pull into a 163 second tree</title>
  <desc>Infographic comparing a 700-second naive origin pull across 100 nodes with a 163-second two-tier tree distribution across 10 racks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" y="58">Seeding one node per rack turns a 700 second pull</tspan>
    <tspan x="800" y="114">into a 163 second tree</tspan>
  </text>

  
  <rect x="40" y="150" width="580" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="200" y="195">Naive, all 100 nodes</tspan>
    <tspan x="200" y="225">pull from origin: 700 s</tspan>
  </text>

  
  <rect x="130" y="240" width="140" height="440" rx="8" fill="#db8129" stroke="#b36215" stroke-width="2"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="450" y="360">Rack copy, 4 doubling</tspan>
    <tspan x="450" y="390">rounds at 23.3 s each:</tspan>
    <tspan x="450" y="420">93 s</tspan>
  </text>
  <line x1="450" y1="432" x2="450" y2="568" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="450" y="475">Seed one node</tspan>
    <tspan x="450" y="505">per rack: 70 s</tspan>
  </text>
  <line x1="450" y1="517" x2="450" y2="628" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  
  <text x="450" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Tree total: 163 s</text>

  
  
  <rect x="380" y="577" width="140" height="59" rx="6" fill="#4ca973" stroke="#207448" stroke-width="2"/>
  
  <rect x="380" y="636" width="140" height="44" rx="6" fill="#207448" stroke="#165132" stroke-width="2"/>

  
  <line x1="80" y1="680" x2="560" y2="680" stroke="#789c89" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="65" y="730" width="530" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="330" y="776">Note: the rack stage is a sum,</tspan>
    <tspan x="330" y="812">an upper bound, since it</tspan>
    <tspan x="330" y="848">overlaps with seeding.</tspan>
  </text>

  
