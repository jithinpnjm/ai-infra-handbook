<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <title>The TTFT page fires: five checks in order</title>
  <desc>Troubleshooting ladder and immediate mitigation steps for the GatewayTTFTBurnFast alert on an LLM inference model.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1130" fill="#f5f8f5" />

  
  <text x="60" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">The TTFT page fires: five checks in order</text>
  <text x="60" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="600" fill="#207448">Ladder for the alert GatewayTTFTBurnFast on one model.</text>

  
  <g>
    <rect x="60" y="160" width="710" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="100" cy="202" r="22" fill="#207448" />
    <text x="100" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="135" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 1</text>
    
    <g transform="translate(685, 180)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="8" width="50" height="28" rx="4" />
      <circle cx="14" cy="22" r="3" fill="#207448" />
      <circle cx="25" cy="22" r="3" fill="#207448" />
      <circle cx="36" cy="22" r="3" fill="#207448" />
      <line x1="12" y1="8" x2="6" y2="0" />
      <line x1="38" y1="8" x2="44" y2="0" />
    </g>
    
    <text x="85" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="85" dy="0">gateway: is the slow share rising for all</tspan>
      <tspan x="85" dy="34">tenants or one? run the per-tenant ratio;</tspan>
      <tspan x="85" dy="34">one tenant means look for a burst of long</tspan>
      <tspan x="85" dy="34">prompts</tspan>
    </text>
  </g>

  
  <g>
    <rect x="830" y="160" width="710" height="260" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
    
    <rect x="855" y="182" width="130" height="38" rx="8" fill="#db8129" />
    <text x="920" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">Side box</text>
    
    <g transform="translate(1455, 180)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 25 2 L 46 10 L 46 26 C 46 38 25 48 25 48 C 25 48 4 38 4 26 L 4 10 Z" />
      <path d="M 25 14 L 25 26" stroke-linecap="round" />
      <circle cx="25" cy="33" r="2.5" fill="#db8129" />
    </g>
    
    <text x="855" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="855" dy="0" font-weight="bold" fill="#db8129">mitigate before the root cause:</tspan>
      <tspan x="855" dy="34">add replicas, shed a tenant that</tspan>
      <tspan x="855" dy="34">exceeded its quota, or route away</tspan>
      <tspan x="855" dy="34">from the bad replica</tspan>
    </text>
  </g>

  
  <line x1="415" y1="420" x2="415" y2="456" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="60" y="460" width="710" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="100" cy="502" r="22" fill="#207448" />
    <text x="100" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="135" y="511" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 2</text>
    
    <g transform="translate(685, 480)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="2" y="8" width="12" height="34" rx="2" />
      <rect x="18" y="8" width="12" height="34" rx="2" />
      <rect x="34" y="8" width="12" height="34" rx="2" />
      <path d="M 54 25 L 48 25" stroke-linecap="round" />
    </g>
    
    <text x="85" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="85" dy="0">engine queue: sum by (model_name)</tspan>
      <tspan x="85" dy="34" font-family="monospace">(vllm:num_requests_waiting);</tspan>
      <tspan x="85" dy="34">growing means requests wait before</tspan>
      <tspan x="85" dy="34">prefill</tspan>
    </text>
  </g>

  
  <g>
    <rect x="830" y="460" width="710" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="870" cy="502" r="22" fill="#207448" />
    <text x="870" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="905" y="511" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 4</text>
    
    <g transform="translate(1455, 480)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="10" width="38" height="34" rx="4" />
      <path d="M 25 24 L 25 2" stroke-linecap="round" />
      <polyline points="18,8 25,2 32,8" />
    </g>
    
    <text x="855" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="855" dy="0">preemptions:</tspan>
      <tspan x="855" dy="34" font-family="monospace">rate(vllm:num_preemptions_total[10m]);</tspan>
      <tspan x="855" dy="34">non-zero means running requests were</tspan>
      <tspan x="855" dy="34">evicted and restarted</tspan>
    </text>
  </g>

  
  <line x1="415" y1="720" x2="415" y2="756" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="60" y="760" width="710" height="310" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="100" cy="802" r="22" fill="#207448" />
    <text x="100" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="135" y="811" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 3</text>
    
    <g transform="translate(685, 780)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="42" height="38" rx="4" />
      <line x1="4" y1="19" x2="46" y2="19" />
      <line x1="4" y1="32" x2="46" y2="32" />
      <line x1="18" y1="6" x2="18" y2="44" />
      <line x1="32" y1="6" x2="32" y2="44" />
    </g>
    
    <text x="85" y="856" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="85" dy="0">memory: max by (model_name)</tspan>
      <tspan x="85" dy="34" font-family="monospace">(vllm:kv_cache_usage_perc);</tspan>
      <tspan x="85" dy="34">near 1 means the cache is full and new</tspan>
      <tspan x="85" dy="34">requests wait for blocks</tspan>
    </text>
  </g>

  
  <path d="M 770 870 L 800 870 L 800 590 L 826 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1185" y1="720" x2="1185" y2="756" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="830" y="760" width="710" height="310" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="870" cy="802" r="22" fill="#207448" />
    <text x="870" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="905" y="811" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Step 5</text>
    
    <g transform="translate(1455, 780)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="20" />
      <polyline points="25,12 25,25 35,25" />
      <line x1="25" y1="1" x2="25" y2="5" />
    </g>
    
    <text x="855" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="855" dy="0">compare vllm:time_to_first_token_seconds</tspan>
      <tspan x="855" dy="34">with vllm:request_queue_time_seconds:</tspan>
      <tspan x="855" dy="34">if queue time explains most of TTFT the fix is</tspan>
      <tspan x="855" dy="34">capacity or routing; if prefill time grew look</tspan>
      <tspan x="855" dy="34">at prompt length mix and the prefix cache</tspan>
    </text>
  </g>
</svg>