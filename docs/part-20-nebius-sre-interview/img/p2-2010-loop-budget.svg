<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" width="1600" height="1070">
  <title>A one-second budget for ten million items</title>
  <desc>Infographic showing a one-second budget for ten million items with per-item timing comparisons and off-scale network call cost.</desc>

  
  <rect width="1600" height="1070" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A one-second budget for ten million items</text>

  
  <g id="calculation-card">
    <rect x="80" y="105" width="1440" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="125" cy="147" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="125" y1="120" x2="125" y2="125" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="117" y1="120" x2="133" y2="120" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="125,135 125,147 136,147" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="180" y="157" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">Budget: 1 second divided by 10,000,000 items = 100 ns per item</text>
  </g>

  
  <g id="bar-chart-container">
    <rect x="80" y="215" width="1440" height="715" rx="16" fill="#ffffff" stroke="#c2d6c6" stroke-width="2"/>

    
    <g id="budget-line">
      
      <rect x="850" y="232" width="340" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="1020" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Budget: 100 ns per item</text>
      
      <line x1="1020" y1="276" x2="1020" y2="905" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
    </g>

    
    <g id="row-builtin-sum">
      <rect x="105" y="300" width="1390" height="130" rx="10" fill="#f8faf8"/>
      
      <rect x="127" y="327" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
      <rect x="137" y="337" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
      <line x1="134" y1="321" x2="134" y2="327" stroke="#207448" stroke-width="2.5"/>
      <line x1="145" y1="321" x2="145" y2="327" stroke="#207448" stroke-width="2.5"/>
      <line x1="156" y1="321" x2="156" y2="327" stroke="#207448" stroke-width="2.5"/>
      <line x1="134" y1="363" x2="134" y2="369" stroke="#207448" stroke-width="2.5"/>
      <line x1="145" y1="363" x2="145" y2="369" stroke="#207448" stroke-width="2.5"/>
      <line x1="156" y1="363" x2="156" y2="369" stroke="#207448" stroke-width="2.5"/>
      <line x1="121" y1="334" x2="127" y2="334" stroke="#207448" stroke-width="2.5"/>
      <line x1="121" y1="345" x2="127" y2="345" stroke="#207448" stroke-width="2.5"/>
      <line x1="121" y1="356" x2="127" y2="356" stroke="#207448" stroke-width="2.5"/>
      <line x1="163" y1="334" x2="169" y2="334" stroke="#207448" stroke-width="2.5"/>
      <line x1="163" y1="345" x2="169" y2="345" stroke="#207448" stroke-width="2.5"/>
      <line x1="163" y1="356" x2="169" y2="356" stroke="#207448" stroke-width="2.5"/>

      
      <text x="195" y="342" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Built-in sum(range(n)): 8 ns, 0.08 s total</text>
      
      <rect x="195" y="364" width="825" height="38" rx="6" fill="#edf3ee"/>
      <rect x="195" y="364" width="66" height="38" rx="6" fill="#207448"/>
    </g>

    
    <g id="row-for-loop">
      <rect x="105" y="450" width="1390" height="130" rx="10" fill="#f8faf8"/>
      
      <path d="M 125,495 A 19,19 0 1,1 163,495 A 19,19 0 0,1 133,509" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="124,501 133,511 143,504" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      
      <text x="195" y="492" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">for loop with total += i: 18 ns, 0.18 s total</text>
      
      <rect x="195" y="514" width="825" height="38" rx="6" fill="#edf3ee"/>
      <rect x="195" y="514" width="149" height="38" rx="6" fill="#207448"/>
    </g>

    
    <g id="row-function-call">
      <rect x="105" y="600" width="1390" height="130" rx="10" fill="#f8faf8"/>
      
      <rect x="125" y="625" width="40" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
      <polyline points="135,640 142,645 135,650" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="147" y1="650" x2="155" y2="650" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

      
      <text x="195" y="642" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Same loop with one Python function call: 41 ns, 0.41 s total</text>
      
      <rect x="195" y="664" width="825" height="38" rx="6" fill="#edf3ee"/>
      <rect x="195" y="664" width="338" height="38" rx="6" fill="#207448"/>

      
      <g id="margin-note-group">
        <rect x="620" y="662" width="320" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="780" y="691" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">about two times margin</text>
      </g>
    </g>

    
    <g id="row-network-call">
      <rect x="105" y="755" width="1390" height="135" rx="10" fill="#fffbf7" stroke="#fed7aa" stroke-width="1.5"/>
      
      <circle cx="145" cy="800" r="18" fill="#fff5eb" stroke="#db8129" stroke-width="3.5"/>
      <ellipse cx="145" cy="800" rx="8" ry="18" fill="none" stroke="#db8129" stroke-width="2.5"/>
      <line x1="127" y1="800" x2="163" y2="800" stroke="#db8129" stroke-width="2.5"/>

      
      <text x="195" y="796" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">One network call per item at 500 microseconds: 5,000 seconds, about 83 minutes</text>

      
      <rect x="195" y="818" width="985" height="42" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="3.5"/>

      
      <g id="break-symbol">
        <line x1="1190" y1="810" x2="1178" y2="868" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="1208" y1="810" x2="1196" y2="868" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      
      <rect x="1215" y="818" width="255" height="42" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="3.5"/>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="955" width="1440" height="70" rx="12" fill="#207448"/>
    
    <circle cx="130" cy="990" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <polyline points="122,990 128,996 138,984" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="800" y="999" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Compare the per-item cost with the budget before you commit.</text>
  </g>
</svg>