<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" width="1600" height="1450">
  <title>Apply deleted a production node pool: order of response</title>
  <desc>Visual incident response procedure when a Terraform apply deletes an active production GPU node pool, from containment to root-cause prevention.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1450" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Apply deleted a production node pool: order of response</text>

  
  <g id="timeline">
    <rect x="80" y="95" width="1440" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="140" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="125,128 125,140 135,140" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="165" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Timeline </tspan>14:05 pipeline run finished green; 14:07 inference alert fires, capacity dropped
    </text>
    <text x="165" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      by a third and requests queue; node pool is gone.
    </text>
  </g>

  
  <path d="M 800 185 L 800 215" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  <g id="step1">
    <rect x="80" y="220" width="1440" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="260" r="24" fill="#207448" />
    <text x="125" y="269" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <rect x="165" y="248" width="22" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 170 248 L 170 242 A 6 6 0 0 1 182 242 L 182 248" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="205" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1 contain:</text>
    
    <text x="125" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      pause the pipeline so no other run changes things, check the lock state,
    </text>
    <text x="125" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      tell the incident channel what you know and do not know
    </text>
  </g>

  
  <path d="M 800 355 L 800 385" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  <g id="step2">
    <rect x="80" y="390" width="1440" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="430" r="24" fill="#207448" />
    <text x="125" y="439" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <rect x="165" y="420" width="28" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="173" cy="429" r="2" fill="#207448" />
    <circle cx="185" cy="429" r="2" fill="#207448" />
    
    <text x="205" y="439" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2 impact:</text>
    
    <text x="125" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      list services that ran on the pool, check other pools and regions for spare capacity, shed load or fail over at the router;
    </text>
    
    <rect x="125" y="515" width="1350" height="65" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2" />
    
    <path d="M 152 558 L 164 534 L 176 558 Z" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="164" y1="544" x2="164" y2="550" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="164" cy="554" r="1.5" fill="#db8129" />
    <text x="188" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      do not touch Terraform yet, a rushed apply is how the second outage starts
    </text>
  </g>

  
  <path d="M 800 605 L 800 645" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  <g id="step3">
    <rect x="80" y="650" width="1440" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="690" r="24" fill="#207448" />
    <text x="125" y="699" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="165" y="678" width="26" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="171" y1="690" x2="185" y2="690" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="205" y="699" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3 restore:</text>
    
    <text x="125" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      state no longer holds the pool so re-apply of the previous commit creates a new one;
    </text>
    <text x="125" y="777" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      do not import the old ID, the object is gone; run and read the plan;
    </text>
    <text x="125" y="812" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      check quota and capacity because GPU nodes are scarce;
    </text>
    <text x="125" y="847" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      caution if it was only <tspan font-family="monospace">terraform state rm</tspan>, then the real pool still exists,
    </text>
    <text x="125" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      check with the provider CLI before applying to avoid a duplicate or name conflict
    </text>
  </g>

  
  <path d="M 800 930 L 800 965" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  <g id="step4">
    <rect x="80" y="970" width="1440" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="1010" r="24" fill="#207448" />
    <text x="125" y="1019" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <circle cx="176" cy="1006" r="9" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="183" y1="1013" x2="192" y2="1022" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="205" y="1019" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4 cause:</text>
    
    <text x="125" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      renamed key without a moved block, removed resource block, wrong variable file for the environment,
    </text>
    <text x="125" y="1097" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      module version bump that changed addresses, a plan nobody read
    </text>
  </g>

  
  <path d="M 800 1125 L 800 1160" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  
  <g id="step5">
    <rect x="80" y="1165" width="1440" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="125" cy="1205" r="24" fill="#207448" />
    <text x="125" y="1214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <path d="M 176 1195 L 186 1198 L 186 1209 C 186 1215 176 1221 176 1221 C 176 1221 166 1215 166 1209 L 166 1198 Z" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="171,1207 174,1210 181,1203" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="205" y="1214" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 5 prevention in order:</text>
    
    <text x="125" y="1260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">prevent_destroy</tspan> on pools, plan risk gate, <tspan font-family="monospace">moved</tspan> blocks, named approver for destroys
    </text>
  </g>

  
  <g id="footer">
    <rect x="80" y="1335" width="1440" height="70" rx="12" fill="#207448" />
    <text x="800" y="1379" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      restore speed depends on GPU capacity, which Terraform cannot create
    </text>
  </g>
</svg>