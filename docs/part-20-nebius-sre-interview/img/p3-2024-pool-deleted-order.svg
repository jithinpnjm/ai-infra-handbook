<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" style="background:#f5f8f5; font-family:sans-serif;">
  <title>Apply deleted a production node pool: order of response</title>
  <desc>Visual guide to the five-step response order when a Terraform apply accidentally deletes a production GPU node pool.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448"/>
    </marker>
  </defs>

  
  <text x="800" y="52" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Apply deleted a production node pool: order of response</text>

  
  <g id="timeline">
    <rect x="40" y="75" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(60, 97)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="28,14 28,28 38,28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="130" y="134" font-size="30" font-weight="bold" fill="#303a36">Timeline</text>

    
    <rect x="270" y="87" width="360" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="290" y="134" font-size="24" font-weight="bold" fill="#207448">14:05 pipeline run finished</text>

    
    <line x1="630" y1="125" x2="666" y2="125" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="680" y="87" width="860" height="76" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
    <text x="704" y="119" font-size="24" fill="#303a36">
      <tspan x="704" dy="0">14:07 inference alert fires, capacity dropped by a third</tspan>
      <tspan x="704" dy="28">and requests queue; node pool is gone</tspan>
    </text>
  </g>

  
  <g id="step1">
    <rect x="40" y="195" width="740" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="75" cy="232" r="24" fill="#207448"/>
    <text x="75" y="241" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    
    <g transform="translate(112, 206)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="6" y="22" width="38" height="26" rx="4"/>
      <path d="M 13 22 L 13 14 A 12 12 0 0 1 37 14 L 37 22" stroke-linecap="round"/>
    </g>
    <text x="175" y="241" font-size="32" font-weight="bold" fill="#303a36">Step 1 contain</text>

    
    <rect x="60" y="265" width="700" height="66" rx="8" fill="#e8f1ea"/>
    <text x="80" y="293" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">pause the pipeline so no other run</tspan>
      <tspan x="80" dy="28">changes things</tspan>
    </text>

    <rect x="60" y="340" width="700" height="46" rx="8" fill="#e8f1ea"/>
    <text x="80" y="372" font-size="24" fill="#303a36">check the lock state</text>

    <rect x="60" y="396" width="700" height="78" rx="8" fill="#e8f1ea"/>
    <text x="80" y="427" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">tell the incident channel what you know</tspan>
      <tspan x="80" dy="30">and do not know</tspan>
    </text>
  </g>

  
  <line x1="780" y1="345" x2="818" y2="345" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step2">
    <rect x="820" y="195" width="740" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="855" cy="232" r="24" fill="#207448"/>
    <text x="855" y="241" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <g transform="translate(892, 206)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="25" cy="25" r="10"/>
      <path d="M 25 5 L 25 11 M 25 39 L 25 45 M 5 25 L 11 25 M 39 25 L 45 25 M 11 11 L 15 15 M 35 35 L 39 39 M 11 39 L 15 35 M 35 15 L 39 11" stroke-linecap="round"/>
    </g>
    <text x="955" y="241" font-size="32" font-weight="bold" fill="#303a36">Step 2 impact</text>

    
    <rect x="840" y="258" width="700" height="42" rx="6" fill="#e8f1ea"/>
    <text x="858" y="287" font-size="24" fill="#303a36">list services that ran on the pool</text>

    <rect x="840" y="306" width="700" height="58" rx="6" fill="#e8f1ea"/>
    <text x="858" y="331" font-size="24" fill="#303a36">
      <tspan x="858" dy="0">check other pools and regions</tspan>
      <tspan x="858" dy="26">for spare capacity</tspan>
    </text>

    <rect x="840" y="370" width="700" height="40" rx="6" fill="#e8f1ea"/>
    <text x="858" y="398" font-size="24" fill="#303a36">shed load or fail over at the router</text>

    
    <rect x="840" y="416" width="700" height="66" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2"/>
    <text x="858" y="442" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="858" dy="0">do not touch Terraform yet, a rushed apply</tspan>
      <tspan x="858" dy="28">is how the second outage starts</tspan>
    </text>
  </g>

  
  <line x1="1200" y1="495" x2="1200" y2="513" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step3">
    <rect x="40" y="515" width="1520" height="300" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="75" cy="552" r="24" fill="#207448"/>
    <text x="75" y="561" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    
    <g transform="translate(112, 526)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="6" y="8" width="40" height="16" rx="3"/>
      <rect x="6" y="28" width="40" height="16" rx="3"/>
      <circle cx="14" cy="16" r="2" fill="#207448"/>
      <circle cx="14" cy="36" r="2" fill="#207448"/>
      <line x1="24" y1="16" x2="38" y2="16" stroke-linecap="round"/>
      <line x1="24" y1="36" x2="38" y2="36" stroke-linecap="round"/>
    </g>
    <text x="175" y="561" font-size="32" font-weight="bold" fill="#303a36">Step 3 restore</text>

    
    <rect x="60" y="578" width="690" height="66" rx="8" fill="#e8f1ea"/>
    <text x="78" y="605" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">state no longer holds the pool so re-apply</tspan>
      <tspan x="78" dy="28">of the previous commit creates a new one</tspan>
    </text>

    <rect x="60" y="650" width="690" height="42" rx="6" fill="#e8f1ea"/>
    <text x="78" y="679" font-size="24" fill="#303a36">do not import the old ID, the object is gone</text>

    <rect x="60" y="698" width="690" height="42" rx="6" fill="#e8f1ea"/>
    <text x="78" y="727" font-size="24" fill="#303a36">run and read the plan</text>

    <rect x="60" y="746" width="690" height="54" rx="6" fill="#e8f1ea"/>
    <text x="78" y="771" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">check quota and capacity because</tspan>
      <tspan x="78" dy="26">GPU nodes are scarce</tspan>
    </text>

    
    <rect x="770" y="578" width="770" height="222" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="796" y="618" font-size="24" fill="#303a36">
      <tspan x="796" dy="0">caution if it was only <tspan font-family="monospace">terraform state rm</tspan>, then</tspan>
      <tspan x="796" dy="36">the real pool still exists, check with the provider CLI</tspan>
      <tspan x="796" dy="36">before applying to avoid a duplicate or name conflict</tspan>
    </text>
  </g>

  
  <line x1="400" y1="815" x2="400" y2="833" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step4">
    <rect x="40" y="835" width="740" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="75" cy="872" r="24" fill="#207448"/>
    <text x="75" y="881" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

    
    <g transform="translate(112, 846)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="20" cy="20" r="14"/>
      <line x1="30" y1="30" x2="44" y2="44" stroke-linecap="round"/>
      <path d="M 16 20 L 24 20" stroke-linecap="round"/>
    </g>
    <text x="175" y="881" font-size="32" font-weight="bold" fill="#303a36">Step 4 cause</text>

    
    <rect x="60" y="904" width="700" height="34" rx="6" fill="#e8f1ea"/>
    <text x="78" y="929" font-size="24" fill="#303a36">renamed key without a moved block</text>

    <rect x="60" y="944" width="700" height="34" rx="6" fill="#e8f1ea"/>
    <text x="78" y="969" font-size="24" fill="#303a36">removed resource block</text>

    <rect x="60" y="984" width="700" height="34" rx="6" fill="#e8f1ea"/>
    <text x="78" y="1009" font-size="24" fill="#303a36">wrong variable file for the environment</text>

    <rect x="60" y="1024" width="700" height="34" rx="6" fill="#e8f1ea"/>
    <text x="78" y="1049" font-size="24" fill="#303a36">module version bump that changed addresses</text>

    <rect x="60" y="1064" width="700" height="34" rx="6" fill="#e8f1ea"/>
    <text x="78" y="1089" font-size="24" fill="#303a36">a plan nobody read</text>
  </g>

  
  <line x1="780" y1="975" x2="818" y2="975" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="step5">
    <rect x="820" y="835" width="740" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <circle cx="855" cy="872" r="24" fill="#207448"/>
    <text x="855" y="881" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    
    <g transform="translate(892, 846)" stroke="#207448" stroke-width="4" fill="none">
      <path d="M 24 6 L 42 12 L 42 26 C 42 38 24 46 24 46 C 24 46 6 38 6 26 L 6 12 Z" stroke-linejoin="round"/>
    </g>
    <text x="955" y="881" font-size="32" font-weight="bold" fill="#303a36">Step 5 prevention in order</text>

    
    <rect x="840" y="904" width="700" height="42" rx="6" fill="#e8f1ea"/>
    <text x="858" y="934" font-size="24" fill="#303a36"><tspan font-family="monospace">prevent_destroy</tspan> on pools</text>

    <rect x="840" y="954" width="700" height="42" rx="6" fill="#e8f1ea"/>
    <text x="858" y="984" font-size="24" fill="#303a36">plan risk gate</text>

    <rect x="840" y="1004" width="700" height="42" rx="6" fill="#e8f1ea"/>
    <text x="858" y="1034" font-size="24" fill="#303a36">moved blocks</text>

    <rect x="840" y="1054" width="700" height="42" rx="6" fill="#e8f1ea"/>
    <text x="858" y="1084" font-size="24" fill="#303a36">named approver for destroys</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1130" width="1520" height="55" rx="8" fill="#207448"/>
    <text x="800" y="1166" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">restore speed depends on GPU capacity, which Terraform cannot create</text>
  </g>
</svg>