<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Refused, timed out, reset: three different stories</title>
  <desc>Three TCP failure stories: Connection refused where a host answers with RST, Connection timed out where SYNs go unanswered, and Connection reset where a middlebox forgets state.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Refused, timed out, reset: three different stories</text>
  <text x="800" y="104" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ask which error the client saw</text>

  
  <g id="panel-1">
    
    <rect x="40" y="135" width="480" height="915" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(252, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="3"/>
      <circle cx="12" cy="15" r="2.5" fill="#207448"/>
      <line x1="20" y1="15" x2="44" y2="15"/>
      <rect x="4" y="28" width="48" height="18" rx="3"/>
      <circle cx="12" cy="37" r="2.5" fill="#207448"/>
      <line x1="20" y1="37" x2="44" y2="37"/>
    </g>

    
    <text x="280" y="232" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Connection refused</text>

    
    
    <rect x="65" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="145" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">client</text>

    
    <rect x="295" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="375" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">server</text>

    
    <line x1="145" y1="310" x2="145" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>
    <line x1="375" y1="310" x2="375" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>

    
    <line x1="145" y1="415" x2="360" y2="415" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="220" y="390" width="80" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="260" y="416" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">SYN</text>

    
    <line x1="375" y1="525" x2="160" y2="525" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="220" y="500" width="80" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="260" y="526" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">RST</text>

    
    <path d="M 395 415 L 420 415 L 420 525 L 395 525" fill="none" stroke="#207448" stroke-width="2"/>
    <rect x="130" y="640" width="260" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(148, 651)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="14"/>
      <polyline points="16,8 16,16 23,16"/>
    </g>
    <text x="272" y="677" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">milliseconds</text>

    
    <rect x="65" y="880" width="430" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="280" y="920" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">a host answered and</tspan>
      <tspan x="280" dy="34">nothing listens on the port</tspan>
    </text>
  </g>

  
  <g id="panel-2">
    
    <rect x="560" y="135" width="480" height="915" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(772, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="27" r="23"/>
      <polyline points="28,14 28,27 40,27"/>
    </g>

    
    <text x="800" y="232" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Connection timed out</text>

    
    
    <rect x="585" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="665" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">client</text>

    
    <rect x="815" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="895" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">server</text>

    
    <line x1="665" y1="310" x2="665" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>
    <line x1="895" y1="310" x2="895" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>

    
    <rect x="805" y="350" width="16" height="260" rx="4" fill="#a0aba4" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="375" x2="821" y2="395" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="405" x2="821" y2="425" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="435" x2="821" y2="455" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="465" x2="821" y2="485" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="495" x2="821" y2="515" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="525" x2="821" y2="545" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="555" x2="821" y2="575" stroke="#707d76" stroke-width="2"/>
    <line x1="805" y1="585" x2="821" y2="605" stroke="#707d76" stroke-width="2"/>

    
    <line x1="665" y1="390" x2="790" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="690" y="365" width="80" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="730" y="391" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">SYN</text>

    
    <line x1="665" y1="475" x2="790" y2="475" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
    <rect x="645" y="450" width="150" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="720" y="476" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">
      <tspan font-family="monospace">SYN</tspan>
      <tspan font-family="sans-serif"> retry</tspan>
    </text>

    
    <line x1="665" y1="560" x2="790" y2="560" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
    <rect x="645" y="535" width="150" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="720" y="561" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">
      <tspan font-family="monospace">SYN</tspan>
      <tspan font-family="sans-serif"> retry</tspan>
    </text>

    
    <rect x="585" y="660" width="430" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(605, 671)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="14"/>
      <polyline points="16,8 16,16 23,16"/>
    </g>
    <text x="815" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">about 127 seconds in total</text>

    
    <rect x="585" y="880" width="430" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="920" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">nobody answered,</tspan>
      <tspan x="800" dy="34">the client keeps retrying</tspan>
    </text>
  </g>

  
  <g id="panel-3">
    
    <rect x="1080" y="135" width="480" height="915" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(1292, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="38" rx="6"/>
      <line x1="4" y1="27" x2="52" y2="27"/>
      <circle cx="14" cy="18" r="3" fill="#207448"/>
      <circle cx="28" cy="18" r="3" fill="#207448"/>
      <circle cx="42" cy="18" r="3" fill="#207448"/>
      <path d="M16 38 L28 44 L40 38"/>
    </g>

    
    <text x="1320" y="232" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Connection reset</text>

    
    
    <rect x="1105" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1185" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">client</text>

    
    <rect x="1335" y="260" width="160" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1415" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">server</text>

    
    <line x1="1185" y1="310" x2="1185" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>
    <line x1="1415" y1="310" x2="1415" y2="850" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6"/>

    
    <line x1="1185" y1="355" x2="1400" y2="355" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="1260" y="335" width="80" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1300" y="360" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SYN</text>

    
    <line x1="1415" y1="410" x2="1200" y2="410" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="1235" y="390" width="130" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1300" y="415" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">SYN-ACK</text>

    
    <line x1="1185" y1="465" x2="1400" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="1260" y="445" width="80" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1300" y="470" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ACK</text>

    
    <line x1="1185" y1="520" x2="1400" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <line x1="1415" y1="540" x2="1200" y2="540" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="1210" y="513" width="180" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1300" y="537" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">data flowing</text>

    
    <rect x="1115" y="595" width="410" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1320" y="625" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1320" dy="0">middlebox</tspan>
      <tspan x="1320" dy="28">forgot the flow</tspan>
    </text>

    
    <line x1="1300" y1="720" x2="1200" y2="720" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)"/>
    
    <rect x="1225" y="695" width="80" height="42" rx="8" fill="#fff6eb" stroke="#db8129" stroke-width="3.5"/>
    <text x="1265" y="726" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">RST</text>

    
    <rect x="1105" y="770" width="430" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1320" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">when the next write happens</text>

    
    <rect x="1105" y="880" width="430" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1320" y="936" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">state destroyed mid-session</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1080" width="1520" height="74" rx="14" fill="#207448"/>
    <text x="800" y="1126" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Refused points to the service, timeout points to the path or the queue, reset points to state in a middlebox</text>
  </g>
</svg>