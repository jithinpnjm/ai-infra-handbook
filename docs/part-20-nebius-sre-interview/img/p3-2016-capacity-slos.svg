<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Fleet capacity SLIs and an example objective</title>
  <desc>Visual infographic explaining fleet capacity SLIs, example objectives, and limiter alert thresholds.</desc>

  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Fleet capacity SLIs and an example objective</text>

  
  <g transform="translate(50, 100)">
    <rect width="1500" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(24, 16)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="24" cy="24" r="20"/>
      <polyline points="24,12 24,24 34,24"/>
    </g>
    <text x="90" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">a capacity SLO is about supply and leads the request SLO by hours or days</text>
  </g>

  
  <g transform="translate(50, 215)">
    <rect width="470" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="2" width="22" height="22" rx="4"/>
      <rect x="30" y="2" width="22" height="22" rx="4"/>
      <rect x="2" y="30" width="22" height="22" rx="4"/>
      <rect x="30" y="30" width="22" height="22" rx="4"/>
    </g>
    <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="30" dy="0" font-weight="bold" fill="#207448">SLI 1:</tspan>
      <tspan dx="8">share of time each</tspan>
      <tspan x="30" dy="38">dedicated endpoint has</tspan>
      <tspan x="30" dy="38">at least its minimum</tspan>
      <tspan x="30" dy="38">number of ready replicas;</tspan>
      <tspan x="30" dy="38">ties to the stated</tspan>
      <tspan x="30" dy="38">99.9 percent availability</tspan>
    </text>
  </g>

  
  <g transform="translate(565, 215)">
    <rect width="470" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="12" rx="24" ry="8"/>
      <path d="M4,12 v16 c0,4.4 10.7,8 24,8 s24,-3.6 24,-8 v-16"/>
      <path d="M4,28 v16 c0,4.4 10.7,8 24,8 s24,-3.6 24,-8 v-16"/>
    </g>
    <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="30" dy="0" font-weight="bold" fill="#207448">SLI 2:</tspan>
      <tspan dx="8">share of time the</tspan>
      <tspan x="30" dy="38">spare pool is at or above</tspan>
      <tspan x="30" dy="38">its target size</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 215)">
    <rect width="470" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M42,6 A18,18 0 0,0 24,20 L6,38 A4,4 0 0,0 12,44 L30,26 A18,18 0 0,0 44,8 L36,16 L32,12 Z"/>
      <circle cx="20" cy="40" r="2" fill="#207448"/>
    </g>
    <text x="30" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="30" dy="0" font-weight="bold" fill="#207448">SLI 3:</tspan>
      <tspan dx="8">repair time from</tspan>
      <tspan x="30" dy="38">quarantine to healthy at</tspan>
      <tspan x="30" dy="38">the 90th percentile</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 625)">
    <rect width="1500" height="185" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(36, 64)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="24"/>
      <circle cx="28" cy="28" r="14"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
    </g>
    <text x="120" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">spare pool at or above target 99 percent of the time;</tspan>
      <tspan x="120" dy="44">90th percentile repair time under 5 days;</tspan>
      <tspan x="120" dy="44">a starting point to argue about, not a standard</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 845)">
    <rect width="1500" height="165" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(36, 54)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M28,6 L52,48 L4,48 Z"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
      <circle cx="28" cy="41" r="2" fill="#db8129"/>
    </g>
    <text x="120" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">cordoned-node ratio alert at 5 percent matches the limiter budget;</tspan>
      <tspan x="120" dy="44">if it fires, the automation failed to stop</tspan>
    </text>
  </g>
</svg>