<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Headroom needed for a ramp: demand growth during one cold start</title>
  <desc>Worked example calculating headroom replicas needed during cold starts for fresh nodes versus spare waiting nodes.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Headroom needed for a ramp:</tspan>
    <tspan x="800" dy="56">demand growth during one cold start</tspan>
  </text>

  
  <g id="inputs-strip">
    <rect x="40" y="158" width="1520" height="92" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 176)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="8" stroke-width="3"/>
      <line x1="10" y1="44" x2="46" y2="44" stroke-width="2.5"/>
      <line x1="10" y1="10" x2="10" y2="44" stroke-width="2.5"/>
      <path d="M12 40 L26 32 L36 20 L46 14" stroke-width="4"/>
      <circle cx="46" cy="14" r="3" fill="#207448" stroke="none"/>
    </g>
    <text x="145" y="197" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">demand grows 0.4 requests per second every minute;</tspan>
      <tspan x="145" dy="36">one replica serves 0.8 requests per second</tspan>
    </text>
  </g>

  
  <g id="column-fresh-node">
    <rect x="40" y="290" width="740" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 308)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6" stroke-width="3"/>
      <line x1="4" y1="20" x2="52" y2="20" stroke-width="2.5"/>
      <line x1="4" y1="34" x2="52" y2="34" stroke-width="2.5"/>
      <circle cx="14" cy="13" r="2.5" fill="#207448" stroke="none"/>
      <circle cx="14" cy="27" r="2.5" fill="#207448" stroke="none"/>
      <circle cx="14" cy="41" r="2.5" fill="#207448" stroke="none"/>
      <circle cx="38" cy="27" r="8" stroke-width="2.5" fill="#ffffff"/>
      <polyline points="38,23 38,27 42,27" stroke-width="2.5"/>
    </g>

    <text x="140" y="330" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="140" dy="0">Fresh node,</tspan>
      <tspan x="140" dy="36">cold start 480 s (8 min)</tspan>
    </text>

    
    <rect x="60" y="385" width="700" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(80, 432)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" stroke-width="3"/>
      <rect x="20" y="20" width="16" height="16" fill="#e8f1ea" stroke-width="2"/>
      <line x1="20" y1="4" x2="20" y2="12"/><line x1="28" y1="4" x2="28" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/><line x1="28" y1="44" x2="28" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/><line x1="4" y1="28" x2="12" y2="28"/><line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/><line x1="44" y1="28" x2="52" y2="28"/><line x1="44" y1="36" x2="52" y2="36"/>
    </g>
    <text x="152" y="428" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="152" dy="0">demand grows 0.4 x 8 = 3.2 requests</tspan>
      <tspan x="152" dy="34">per second during one cold start;</tspan>
      <tspan x="152" dy="34" font-weight="bold" fill="#207448">3.2 / 0.8 = 4 replicas of headroom</tspan>
    </text>

    
    <rect x="60" y="550" width="700" height="162" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(80, 603)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="22" stroke-width="3"/>
      <polyline points="28,16 28,30 38,30" stroke-width="3.5"/>
      <line x1="24" y1="4" x2="32" y2="4" stroke-width="3"/>
      <line x1="28" y1="4" x2="28" y2="8" stroke-width="3"/>
    </g>
    <text x="152" y="586" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="152" dy="0">fresh node: decision plus</tspan>
      <tspan x="152" dy="32">node provision 240 s plus</tspan>
      <tspan x="152" dy="32">image pull 90 s plus weight load 120 s</tspan>
      <tspan x="152" dy="32">plus warm-up 30 s, about 480 s</tspan>
    </text>
  </g>

  
  <g id="column-spare-node">
    <rect x="820" y="290" width="740" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(845, 308)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6" stroke-width="3"/>
      <line x1="4" y1="20" x2="52" y2="20" stroke-width="2.5"/>
      <line x1="4" y1="34" x2="52" y2="34" stroke-width="2.5"/>
      <circle cx="14" cy="13" r="2.5" fill="#207448" stroke="none"/>
      <circle cx="14" cy="27" r="2.5" fill="#207448" stroke="none"/>
      <circle cx="14" cy="41" r="2.5" fill="#207448" stroke="none"/>
      <polygon points="32,22 42,27 32,32" fill="#207448" stroke="none"/>
      <polygon points="40,22 50,27 40,32" fill="#207448" stroke="none"/>
    </g>

    <text x="920" y="330" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="920" dy="0">Spare node waiting,</tspan>
      <tspan x="920" dy="36">cold start 150 s</tspan>
    </text>

    
    <rect x="840" y="385" width="700" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(860, 432)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" stroke-width="3"/>
      <rect x="20" y="20" width="16" height="16" fill="#e8f1ea" stroke-width="2"/>
      <line x1="20" y1="4" x2="20" y2="12"/><line x1="28" y1="4" x2="28" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/><line x1="28" y1="44" x2="28" y2="52"/><line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/><line x1="4" y1="28" x2="12" y2="28"/><line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/><line x1="44" y1="28" x2="52" y2="28"/><line x1="44" y1="36" x2="52" y2="36"/>
    </g>
    <text x="932" y="428" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="932" dy="0">demand grows about 1.0 requests</tspan>
      <tspan x="932" dy="34">per second in that time;</tspan>
      <tspan x="932" dy="34" font-weight="bold" fill="#207448">1.0 / 0.8, so 2 replicas</tspan>
    </text>

    
    <rect x="840" y="550" width="700" height="162" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(860, 603)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="22" stroke-width="3"/>
      <polyline points="28,16 28,30 38,24" stroke-width="3.5"/>
      <path d="M12 12 L18 6" stroke-width="3.5"/>
      <path d="M44 12 L38 6" stroke-width="3.5"/>
    </g>
    <text x="932" y="618" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="932" dy="0">warm node free:</tspan>
      <tspan x="932" dy="36">weight load and warm-up, about 150 s</tspan>
    </text>
  </g>

  
  <g id="answer-box">
    <rect x="40" y="770" width="1520" height="110" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(65, 797)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3.5"/>
      <circle cx="28" cy="28" r="13" stroke-width="3"/>
      <circle cx="28" cy="28" r="3" fill="#db8129" stroke="none"/>
    </g>
    <text x="145" y="815" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">hold 4 standing replicas, or hold spare nodes and 2 standing replicas;</tspan>
      <tspan x="145" dy="38">then say which costs less per hour at your GPU price</tspan>
    </text>
  </g>

  
  <g id="tradeoff-box">
    <rect x="40" y="920" width="1520" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 948)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="6" x2="28" y2="48" stroke-width="3.5"/>
      <line x1="12" y1="14" x2="44" y2="14" stroke-width="3.5"/>
      <path d="M6 30 L12 14 L18 30 Z" stroke-width="3"/>
      <path d="M38 30 L44 14 L50 30 Z" stroke-width="3"/>
      <line x1="18" y1="48" x2="38" y2="48" stroke-width="3.5"/>
    </g>
    <text x="145" y="965" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="145" dy="0">standing replicas answer the ramp fastest and cost money in every quiet hour;</tspan>
      <tspan x="145" dy="38">spare nodes cost less while idle and leave the weight load exposed</tspan>
    </text>
  </g>

  
  <g id="note-strip">
    <rect x="40" y="1072" width="1520" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <g transform="translate(65, 1080)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="6" width="36" height="44" rx="4" stroke-width="3"/>
      <line x1="18" y1="18" x2="38" y2="18"/>
      <line x1="18" y1="26" x2="38" y2="26"/>
      <line x1="18" y1="34" x2="30" y2="34"/>
    </g>
    <text x="145" y="1117" font-family="sans-serif" font-size="25" fill="#303a36">Stage values are the author's assumptions, not measurements.</text>
  </g>
</svg>