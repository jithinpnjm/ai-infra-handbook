<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Toil arithmetic: when an automation fix pays for itself</title>
  <desc>Visual infographic comparing two toil automation calculations: a recurring monthly restart task paying back in 8 months, and an alerting break-even fix paying for itself after 30 pages.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Toil arithmetic: when an automation fix pays for itself</text>

  
  <line x1="800" y1="115" x2="800" y2="900" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />

  
  <rect x="50" y="115" width="715" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="407" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Made-up task: a restart</text>

  
  <rect x="80" y="205" width="655" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(110, 232)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="28" r="3" fill="#207448" />
  </g>
  <text x="190" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Restart 15 times a month</text>

  
  <line x1="215" y1="315" x2="215" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="365" width="655" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(110, 392)">
    <rect x="6" y="6" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="20" x2="40" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="36" x2="36" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="190" y="430" font-size="28" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">At 20 minutes each: </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">300 minutes</tspan>
  </text>

  
  <line x1="215" y1="475" x2="215" y2="525" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="80" y="525" width="220" height="335" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(162, 565)">
    <path d="M 8 6 L 48 6 L 34 28 L 48 50 L 8 50 L 22 28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="14" y1="6" x2="42" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="50" x2="42" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="190" y="675" font-size="26" fill="#303a36" text-anchor="middle">
    <tspan x="190" dy="0" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">That is</tspan>
    <tspan x="190" dy="42" font-family="monospace" font-weight="bold" fill="#207448" font-size="30">5 hours</tspan>
    <tspan x="190" dy="42" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">a month</tspan>
  </text>

  
  <line x1="300" y1="692" x2="340" y2="692" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="340" y="525" width="395" height="335" rx="12" fill="#f0f7f2" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(510, 555)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="18,28 25,36 38,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="537" y="640" font-size="25" fill="#303a36" text-anchor="middle">
    <tspan x="537" dy="0" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Automation of </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">40 hours</tspan>
    <tspan x="537" dy="38" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">pays back in 8 months</tspan>
  </text>

  
  <g transform="translate(349, 735)">
    
    <rect x="0" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="23.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <rect x="47" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="70.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <rect x="94" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="117.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <rect x="141" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="164.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <rect x="188" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="211.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <rect x="235" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="258.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <rect x="282" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="305.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    
    <rect x="329" y="0" width="47" height="56" rx="4" fill="#207448" stroke="#ffffff" stroke-width="2" />
    <text x="352.5" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  </g>


  
  <rect x="835" y="115" width="715" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1192" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Workbook example: break-even</text>

  
  <rect x="865" y="205" width="655" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(895, 232)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 14 L 28 20 M 28 36 L 28 42 M 14 28 L 20 28 M 36 28 L 42 28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="28" r="7" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="975" y="270" font-size="28" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">A fix that takes </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">120 working hours</tspan>
  </text>

  
  <rect x="865" y="365" width="655" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(895, 392)">
    <rect x="8" y="12" width="40" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="22" x2="32" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="40" cy="22" r="2.5" fill="#207448" />
    <path d="M 20 12 L 20 6" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="975" y="430" font-size="28" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Each page costs about </tspan>
    <tspan font-family="monospace" font-weight="bold" fill="#207448">4 hours</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold"> to handle</tspan>
  </text>

  
  <line x1="1192" y1="475" x2="1192" y2="525" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="865" y="525" width="655" height="335" rx="12" fill="#fdf6ef" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(1164, 580)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="#db8129" stroke-width="3" />
    <circle cx="28" cy="28" r="4" fill="#db8129" />
  </g>
  <text x="1192" y="700" font-size="32" fill="#303a36" text-anchor="middle">
    <tspan x="1192" dy="0" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Pays for itself after about</tspan>
    <tspan x="1192" dy="54" font-family="monospace" font-weight="bold" fill="#db8129" font-size="38">30 pages</tspan>
  </text>

  
  <rect x="50" y="930" width="1500" height="80" rx="12" fill="#207448" />
  <text x="800" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Rank toil by hours per month and by the cost of getting it wrong</text>
</svg>