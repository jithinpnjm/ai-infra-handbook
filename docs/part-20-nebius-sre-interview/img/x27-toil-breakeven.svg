<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Toil arithmetic: when an automation fix pays for itself</title>
  <desc>Visual calculation comparing toil payback periods for regular restart automation versus alert paging break-even.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#207448" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    Toil arithmetic: when an automation fix pays for itself
  </text>

  
  <line x1="800" y1="120" x2="800" y2="980" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  
  <g transform="translate(60, 110)">
    
    <rect x="0" y="0" width="700" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" opacity="0.7" />

    
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">
      Made-up task: a restart
    </text>

    
    
    <g transform="translate(30, 95)" filter="url(#shadow)">
      <rect width="320" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 24)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="24" cy="24" r="22" />
        <polyline points="24,10 24,24 34,28" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="85" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Restart</text>
      <text x="24" y="112" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">15 times a month</text>
    </g>

    
    <path d="M 190 245 L 190 295" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

    
    <g transform="translate(30, 305)" filter="url(#shadow)">
      <rect width="320" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="24" y="55" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">At 20 minutes each:</text>
      <rect x="20" y="80" width="180" height="46" rx="8" fill="#e8f1ea" />
      <text x="32" y="112" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">300 minutes</text>
    </g>

    
    <path d="M 190 455 L 190 505" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

    
    <g transform="translate(30, 515)" filter="url(#shadow)">
      <rect width="320" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">That is</text>
      <text x="24" y="96" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">5 hours a month</text>
    </g>

    
    <path d="M 350 580 Q 370 580 380 580" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

    
    <g transform="translate(370, 470)" filter="url(#shadow)">
      <rect width="300" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <rect width="300" height="44" rx="12" fill="#207448" />
      <rect y="30" width="300" height="14" fill="#207448" />
      <text x="150" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Payback Reached</text>
      
      <text x="24" y="80" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
        <tspan x="20" dy="0">Automation of</tspan>
        <tspan font-family="monospace" font-weight="bold" fill="#207448"> 40 hours</tspan>
        <tspan x="20" dy="36">pays back in</tspan>
        <tspan font-family="monospace" font-weight="bold" fill="#207448"> 8 months</tspan>
      </text>
    </g>

    
    <g transform="translate(30, 685)">
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">Payback period timeline (months):</text>
      <g transform="translate(0, 50)">
        
        
        <rect x="0" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="38" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
        
        <rect x="81" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="119" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
        
        <rect x="162" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="200" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
        
        <rect x="243" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="281" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
        
        <rect x="324" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="362" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
        
        <rect x="405" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="443" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
        
        <rect x="486" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="524" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
        
        <rect x="567" y="0" width="76" height="60" rx="6" fill="#207448" />
        <text x="605" y="38" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(840, 110)">
    
    <rect x="0" y="0" width="700" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" opacity="0.7" />

    
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">
      Workbook example: break-even
    </text>

    
    <g transform="translate(40, 110)" filter="url(#shadow)">
      <rect width="620" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(30, 48)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="26" cy="26" r="18" />
        <path d="M26 2 L26 8 M26 44 L26 50 M2 26 L8 26 M44 26 L50 26 M9 9 L13 13 M39 39 L43 43 M9 43 L13 39 M39 9 L43 13" />
      </g>
      <text x="100" y="65" font-family="system-ui, sans-serif" font-size="26" fill="#303a36">
        <tspan>A fix that takes</tspan>
      </text>
      <text x="100" y="108" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">
        120 working hours
      </text>
    </g>

    
    <path d="M 350 260 L 350 320" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

    
    <g transform="translate(40, 330)" filter="url(#shadow)">
      <rect width="620" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(30, 50)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="4" y="10" width="44" height="32" rx="6" />
        <circle cx="16" cy="26" r="4" fill="#207448" />
        <line x1="26" y1="22" x2="40" y2="22" />
        <line x1="26" y1="30" x2="36" y2="30" />
      </g>
      <text x="100" y="70" font-family="system-ui, sans-serif" font-size="26" fill="#303a36">
        <tspan x="100" dy="0">Each page costs about </tspan>
        <tspan font-family="monospace" font-weight="bold" fill="#207448">4 hours</tspan>
        <tspan x="100" dy="40">to handle</tspan>
      </text>
    </g>

    
    <g>
      <path d="M 350 490 L 350 565" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />
    </g>

    
    <g transform="translate(40, 580)" filter="url(#shadow)">
      <rect width="620" height="180" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
      
      <rect width="620" height="46" rx="12" fill="#db8129" />
      <rect y="32" width="620" height="14" fill="#db8129" />
      <text x="310" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
        BREAK-EVEN THRESHOLD
      </text>
      
      <text x="310" y="100" font-family="system-ui, sans-serif" font-size="28" fill="#303a36" text-anchor="middle">
        Pays for itself after about
      </text>
      <text x="310" y="145" font-family="monospace" font-size="34" font-weight="bold" fill="#db8129" text-anchor="middle">
        30 pages
      </text>
    </g>
  </g>

  
  <g transform="translate(60, 1015)">
    <rect width="1480" height="75" rx="12" fill="#207448" />
    <text x="740" y="47" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Rank toil by hours per month and by the cost of getting it wrong
    </text>
  </g>
</svg>