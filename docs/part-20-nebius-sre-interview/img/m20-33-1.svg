<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Pattern A: a managed Dedicated Endpoint behind your own gateway</title>
  <desc>Architecture infographic illustrating Pattern A: a managed Dedicated Endpoint behind your own gateway with authentication, regional token factory, failover endpoint, and observability telemetry.</desc>

