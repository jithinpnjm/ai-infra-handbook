<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Nearest-rank percentile: the p95 is the 3023rd of 3181 sorted values</title>
  <desc>Visual explanation of nearest-rank percentile calculation, contrasting p50, p95, p99 tail values against the mean across 3181 sorted request times.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Nearest-rank percentile:</text>
    <text x="800" y="120" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">the p95 is the 3023rd of 3181 sorted values</text>
    <text x="800" y="165" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Nearest rank: no averaging, no guessing</text>
  </g>

  
  <g id="scale-card" transform="translate(60, 195)">
    
    <rect width="1480" height="430" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="42" x2="44" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="14" y1="32" x2="14" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="20" x2="28" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="12" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="100" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">sorted ascending</text>

    
    <g transform="translate(800, 20)">
      <rect width="640" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="320" y="33" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">the top 1 percent with p99, value 29.176 s</text>
      
      <path d="M 606 48 L 606 200" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
      <circle cx="606" cy="200" r="5" fill="#207448" />
    </g>

    
    <g transform="translate(780, 95)">
      <rect width="600" height="52" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
      <text x="300" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">p95, rank 3023 of 3181, value 2.857 s</text>
      
      <path d="M 572 52 L 572 125" fill="none" stroke="#db8129" stroke-width="4" />
      <polygon points="572,135 565,123 579,123" fill="#db8129" />
    </g>

    
    <g transform="translate(430, 115)">
      <rect width="320" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="160" y="33" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">p50, value 1.152 s</text>
      
      <path d="M 250 48 L 250 105" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
      <circle cx="250" cy="105" r="5" fill="#207448" />
    </g>

    
    
    <rect x="60" y="225" width="1360" height="54" rx="8" fill="#d2e4d6" />

    
    <rect x="60" y="225" width="1292" height="54" rx="8" fill="#207448" />
    <text x="560" y="260" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the bulk of requests</text>

    
    <rect x="1406" y="225" width="14" height="54" fill="#db8129" />

    
    <text x="60" y="315" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fastest on the left</text>
    <text x="1420" y="315" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">slowest on the right</text>

    
    <line x1="60" y1="355" x2="1420" y2="355" stroke="#7a8b84" stroke-width="3" stroke-dasharray="8,6" />

    
    <g transform="translate(390, 368)">
      <rect width="700" height="46" rx="8" fill="#f0f4f1" stroke="#a0b4a8" stroke-width="1.5" />
      <text x="140" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">mean 1.606 s</text>
      <line x1="240" y1="12" x2="240" y2="34" stroke="#a0b4a8" stroke-width="1.5" />
      <text x="460" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">it sits in the bulk and hides the tail</text>
    </g>
  </g>

  
  
  <g id="formula-box" transform="translate(60, 650)">
    <rect width="920" height="210" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 38 L 24 18 L 32 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="19" y1="32" x2="29" y2="32" stroke="#207448" stroke-width="4" />
      <line x1="36" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="36" y1="32" x2="44" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="110" y="60" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">rank = ceil(p / 100 times N)</text>

    
    <g transform="translate(110, 90)">
      <rect width="770" height="90" rx="8" fill="#e8f1ea" />
      <text x="30" y="40" font-family="monospace" font-size="24" fill="#303a36">with N = 3181</text>
      <text x="30" y="72" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">p95 example ceil(3022.95) = 3023</text>
    </g>
  </g>

  
  <g id="awk-card" transform="translate(1020, 650)">
    <rect width="520" height="210" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 20 L 24 28 L 14 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="36" x2="42" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="110" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">awk trick</text>

    
    <g transform="translate(30, 105)">
      <rect width="460" height="75" rx="8" fill="#e8f1ea" />
      <text x="230" y="46" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">add 0.999999 then int</text>
    </g>
  </g>

  
  <g id="steps" transform="translate(60, 890)">
    
    <g transform="translate(0, 0)">
      <rect width="450" height="130" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <circle cx="55" cy="65" r="24" fill="#207448" />
      <text x="55" y="73" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="100" y="73" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">sort the values</text>
    </g>

    
    <line x1="455" y1="65" x2="505" y2="65" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <g transform="translate(515, 0)">
      <rect width="450" height="130" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <circle cx="55" cy="65" r="24" fill="#207448" />
      <text x="55" y="73" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="100" y="73" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">count N</text>
    </g>

    
    <line x1="970" y1="65" x2="1020" y2="65" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <g transform="translate(1030, 0)">
      <rect width="450" height="130" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      <circle cx="55" cy="65" r="24" fill="#207448" />
      <text x="55" y="73" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="96" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="96" dy="0">take the value</tspan>
        <tspan x="96" dy="32">at the rank</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar" transform="translate(60, 1055)">
    <rect width="1480" height="85" rx="16" fill="#207448" />
    <text x="740" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The mean hides the tail; the percentile shows where the slow requests start.</text>
  </g>
</svg>