<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>What the API promises and what it does not</title>
  <desc>Visual comparison between API contract guarantees and non-guarantees with implementation guidelines.</desc>

  
  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">What the API promises and what it does not</text>

  
  
  <rect x="60" y="130" width="710" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="110" cy="170" r="24" fill="#207448"/>
  <path d="M98 170 L106 178 L122 162" fill="none" stroke="#f5f8f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="180" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">Promises</text>

  
  <rect x="60" y="240" width="710" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 275)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 38 L6 10 C6 6 10 2 15 2 L45 2 C50 2 54 6 54 10 L54 30 C54 34 50 38 45 38 L18 38 Z"/>
    <line x1="16" y1="14" x2="42" y2="14"/>
    <line x1="16" y1="24" x2="32" y2="24"/>
  </g>
  <text x="165" y="295" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="165" dy="0">OpenAI-compatible streaming chat</tspan>
    <tspan x="165" dy="36">or completion call</tspan>
  </text>

  
  <rect x="60" y="410" width="710" height="290" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 440)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="46" height="52" rx="6"/>
    <line x1="14" y1="18" x2="40" y2="18"/>
    <line x1="14" y1="30" x2="40" y2="30"/>
    <line x1="14" y1="42" x2="28" y2="42"/>
  </g>
  <text x="165" y="455" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">four properties of the data plane call:</tspan>
    <tspan x="165" dy="36">carries a tenant credential,</tspan>
    <tspan x="165" dy="36">names a model or an endpoint,</tspan>
    <tspan x="165" dy="36">can stream tokens back,</tspan>
    <tspan x="165" dy="36">returns token counts for billing in a usage object</tspan>
    <tspan x="165" dy="36">with prompt_tokens and completion_tokens</tspan>
  </text>

  
  <rect x="60" y="730" width="710" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 765)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="30" r="24"/>
    <polyline points="28 16 28 30 38 36"/>
  </g>
  <text x="165" y="775" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">failure is part of the contract:</tspan>
    <tspan x="165" dy="36">overload returns HTTP 429 with a Retry-After</tspan>
    <tspan x="165" dy="36">header so clients wait instead of retrying at</tspan>
    <tspan x="165" dy="36">random</tspan>
  </text>


  
  
  <rect x="830" y="130" width="710" height="80" rx="12" fill="#fbeee2" stroke="#db8129" stroke-width="3"/>
  
  <circle cx="880" cy="170" r="24" fill="#db8129"/>
  <path d="M868 158 L892 182 M892 158 L868 182" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="920" y="180" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#db8129">Does not promise</text>

  
  <rect x="830" y="240" width="710" height="690" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(860, 280)" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="50" height="50" rx="8"/>
    <circle cx="18" cy="18" r="3" fill="#db8129"/>
    <circle cx="40" cy="18" r="3" fill="#db8129"/>
    <circle cx="29" cy="29" r="3" fill="#db8129"/>
    <circle cx="18" cy="40" r="3" fill="#db8129"/>
    <circle cx="40" cy="40" r="3" fill="#db8129"/>
  </g>
  <text x="940" y="300" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="940" dy="0" font-weight="bold" fill="#db8129">exactly-once generation:</tspan>
    <tspan x="940" dy="42">a retry after a stream started can produce</tspan>
    <tspan x="940" dy="42">different text because sampling is not repeatable;</tspan>
    <tspan x="940" dy="42">the API is at-least-once</tspan>
  </text>


  
  <rect x="60" y="970" width="1480" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(95, 1030)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="30"/>
    <polygon points="32 12 42 32 32 52 22 32 32 12" fill="#207448"/>
  </g>
  <text x="180" y="1035" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="180" dy="0">keep the surface small; a customer who wrote a script on Monday expects it to work on Friday;</tspan>
    <tspan x="180" dy="44">ask clarifying questions first: chat or batch, which models and context lengths,</tspan>
    <tspan x="180" dy="44">availability target, data residency, tenants</tspan>
  </text>
</svg>