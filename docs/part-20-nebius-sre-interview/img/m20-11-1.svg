<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Run every problem the same way</title>
  <desc>Flowchart illustrating the six-step sequence to run every problem: Restate + 2 examples, Brute force + cost, Name the waste, Better approach + cost, Code, then trace an example, Edge cases, then follow-up.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 2 2 L 15 8 L 2 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Run every problem the same way</text>

  
  
  <line x1="490" y1="320" x2="590" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1010" y1="320" x2="1110" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1320 470 L 1320 510 Q 1320 530 1300 530 L 300 530 Q 280 530 280 550 L 280 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="490" y1="740" x2="590" y2="740" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1010" y1="740" x2="1110" y2="740" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-1">
    <rect x="70" y="170" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="120" cy="220" r="24" fill="#207448" />
    <text x="120" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(254, 214)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="2" width="48" height="50" rx="6" />
      <line x1="12" y1="14" x2="40" y2="14" />
      <circle cx="15" cy="27" r="2" fill="#207448" />
      <line x1="23" y1="27" x2="40" y2="27" />
      <circle cx="15" cy="39" r="2" fill="#207448" />
      <line x1="23" y1="39" x2="40" y2="39" />
    </g>

    <text x="280" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Restate +</tspan>
      <tspan x="280" dy="42">2 examples</tspan>
    </text>
  </g>

  
  <g id="node-2">
    <rect x="590" y="170" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="640" cy="220" r="24" fill="#207448" />
    <text x="640" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(774, 214)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="44" height="18" rx="4" />
      <line x1="26" y1="24" x2="26" y2="48" />
      <line x1="18" y1="48" x2="34" y2="48" />
      <line x1="0" y1="10" x2="2" y2="10" />
      <line x1="0" y1="20" x2="2" y2="20" />
      <line x1="50" y1="10" x2="52" y2="10" />
      <line x1="50" y1="20" x2="52" y2="20" />
    </g>

    <text x="800" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Brute force</tspan>
      <tspan x="800" dy="42">+ cost</tspan>
    </text>
  </g>

  
  <g id="node-3">
    <rect x="1110" y="170" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    <circle cx="1160" cy="220" r="24" fill="#db8129" />
    <text x="1160" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(1294, 214)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="18" y1="6" x2="34" y2="6" />
      <line x1="4" y1="12" x2="48" y2="12" />
      <path d="M 8 12 L 13 48 Q 14 50 17 50 L 35 50 Q 38 50 39 48 L 44 12" />
      <line x1="20" y1="20" x2="20" y2="42" />
      <line x1="26" y1="20" x2="26" y2="42" />
      <line x1="32" y1="20" x2="32" y2="42" />
    </g>

    <text x="1320" y="361" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Name the waste</text>
  </g>

  
  <g id="node-4">
    <rect x="70" y="590" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="120" cy="640" r="24" fill="#207448" />
    <text x="120" y="640" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(254, 634)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 18 36 C 8 28 4 16 12 8 C 18 2 34 2 40 8 C 48 16 44 28 34 36 Z" />
      <line x1="19" y1="42" x2="33" y2="42" />
      <line x1="22" y1="48" x2="30" y2="48" />
      <line x1="26" y1="12" x2="26" y2="22" />
    </g>

    <text x="280" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Better approach</tspan>
      <tspan x="280" dy="42">+ cost</tspan>
    </text>
  </g>

  
  <g id="node-5">
    <rect x="590" y="590" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="640" cy="640" r="24" fill="#207448" />
    <text x="640" y="640" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>

    
    <g transform="translate(774, 634)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="4" width="48" height="44" rx="6" />
      <line x1="2" y1="16" x2="50" y2="16" />
      <circle cx="10" cy="10" r="1.5" fill="#207448" />
      <circle cx="16" cy="10" r="1.5" fill="#207448" />
      <path d="M 14 26 L 22 32 L 14 38" />
      <line x1="26" y1="38" x2="38" y2="38" />
    </g>

    <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Code, then trace</tspan>
      <tspan x="800" dy="42">an example</tspan>
    </text>
  </g>

  
  <g id="node-6">
    <rect x="1110" y="590" width="420" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1160" cy="640" r="24" fill="#207448" />
    <text x="1160" y="640" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>

    
    <g transform="translate(1294, 634)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 26 4 L 46 12 C 46 32 36 44 26 50 C 16 44 6 32 6 12 Z" />
      <path d="M 16 26 L 23 33 L 36 18" />
    </g>

    <text x="1320" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="1320" dy="0">Edge cases, then</tspan>
      <tspan x="1320" dy="42">follow-up</tspan>
    </text>
  </g>
</svg>