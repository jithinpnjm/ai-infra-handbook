<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Grace Period Sizing to Prevent Rolling Update Stream Truncation</title>
  <desc>A comparative timeline diagram contrasting the default Kubernetes termination timeline with the production-sized 135-second grace period for LLM inference pods.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Grace Period Sizing to Prevent Rolling Update Stream Truncation</text>

  
  
  <rect x="50" y="85" width="1070" height="355" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 105)">
    
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="20,10 20,20 28,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="125" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Top Timeline (Default 30s Grace Period)</text>

  
  <rect x="75" y="155" width="465" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="95" y="187" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">At t=0s, deployment rolls replica.</tspan>
    <tspan x="95" dy="30">Pod holds ~40 active streams</tspan>
    <tspan x="95" dy="30">lasting up to 90s. SIGTERM sent;</tspan>
    <tspan x="95" dy="30">endpoint removal races in parallel.</tspan>
  </text>

  
  <line x1="540" y1="225" x2="600" y2="225" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="610" y="155" width="485" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="630" y="215" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="630" dy="0">At t=30s, termination grace period</tspan>
    <tspan x="630" dy="32">expires. Kubelet sends SIGKILL.</tspan>
  </text>

  
  <rect x="75" y="315" width="1020" height="105" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
  <g transform="translate(95, 335)">
    
    <polygon points="18,4 34,34 2,34" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="18" y1="16" x2="18" y2="24" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="18" cy="29" r="1.5" fill="#db8129" />
  </g>
  <text x="145" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="145" dy="0">SIGKILL at 30s truncates running 90s streams mid-generation.</tspan>
    <tspan x="145" dy="32">First token already delivered, so streams cannot be retried!</tspan>
  </text>

  
  <rect x="1150" y="85" width="400" height="355" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(1325, 110)">
    <rect x="0" y="0" width="50" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="14" cy="20" r="4" fill="#207448" />
    <circle cx="26" cy="20" r="4" fill="#207448" />
    <circle cx="38" cy="20" r="4" fill="#207448" />
  </g>

  <text x="1175" y="195" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">Roll 1 pod at a time;</tspan>
    <tspan x="1175" dy="36">wait for readiness probe</tspan>
    <tspan x="1175" dy="36">before proceeding to</tspan>
    <tspan x="1175" dy="36">maintain spare capacity</tspan>
    <tspan x="1175" dy="36">above X+1</tspan>
  </text>

  
  
  <rect x="50" y="465" width="1500" height="605" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 485)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="125" y="512" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Bottom Timeline (Production Grace Period = 135s)</text>

  
  <rect x="75" y="540" width="450" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="112" cy="578" r="22" fill="#207448" />
  <text x="112" y="586" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="145" y="586" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Block 1 (t=0s to 5s)</text>
  <text x="95" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="95" dy="0">preStop sleep (5s) allows router</tspan>
    <tspan x="95" dy="36">EndpointSlice propagation across</tspan>
    <tspan x="95" dy="36">all proxies; router marks replica</tspan>
    <tspan x="95" dy="36">as draining</tspan>
  </text>

  
  <line x1="525" y1="692" x2="558" y2="692" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="568" y="540" width="525" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="605" cy="578" r="22" fill="#207448" />
  <text x="605" y="586" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="638" y="586" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Block 2 (t=5s to 125s)</text>
  <text x="588" y="630" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="588" dy="0">SIGTERM received by engine</tspan>
    <tspan x="588" dy="34">(--shutdown-timeout &gt; 0). Max allowed</tspan>
    <tspan x="588" dy="34">stream duration (120s stream cap)</tspan>
    <tspan x="588" dy="34">allows active streams to finish</tspan>
    <tspan x="588" dy="34">generating</tspan>
  </text>

  
  <line x1="1093" y1="692" x2="1126" y2="692" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="1136" y="540" width="389" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1173" cy="578" r="22" fill="#207448" />
  <text x="1173" y="586" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1206" y="586" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Block 3 (t=125s to 135s)</text>
  <text x="1156" y="650" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1156" dy="0">10s safety margin buffer</tspan>
    <tspan x="1156" dy="36">before SIGKILL</tspan>
  </text>

  
  <g transform="translate(75, 865)">
    
    <rect x="0" y="0" width="100" height="46" rx="6" fill="#207448" />
    <text x="50" y="31" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5s</text>

    
    <rect x="106" y="0" width="1180" height="46" rx="6" fill="#2e8b57" />
    <text x="696" y="31" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">120s</text>

    
    <rect x="1292" y="0" width="158" height="46" rx="6" fill="#207448" />
    <text x="1371" y="31" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">10s</text>
  </g>

  
  <rect x="75" y="935" width="1450" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="998" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Grace Period = 5s (preStop sleep) + 120s (longest allowed stream) + 10s (margin) = 135s</text>
</svg>