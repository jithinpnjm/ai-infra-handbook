<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
  <title>One spoken sentence carries idea, cost and check</title>
  <desc>Infographic explaining how one spoken sentence carries idea, cost, and check with examples and bad practices crossed out.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1010" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">One spoken sentence carries idea, cost and check</text>

  
  <g>
    <rect x="80" y="100" width="1440" height="180" rx="20" ry="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 125 155 C 125 141 137 130 152 130 L 175 130 C 190 130 202 141 202 155 C 202 169 190 180 175 180 L 155 180 L 138 195 L 142 180 C 132 177 125 167 125 155 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <text x="230" y="145" font-family="sans-serif" font-size="25" font-style="italic" fill="#303a36">
      <tspan x="230">My first idea is a double loop, which is quadratic. </tspan>
      <tspan x="230" dy="36">The repeated work is looking up a complement, </tspan>
      <tspan x="230" dy="36">so a dictionary should make that constant time. </tspan>
      <tspan x="230" dy="36">I will check with the example.</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="80" y="315" width="430" height="240" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="130" cy="358" r="24" fill="#207448" />
    <text x="130" y="367" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <path d="M 200 330 A 16 16 0 0 1 215 354 C 212 360 210 363 210 367 L 190 367 C 190 363 188 360 185 354 A 16 16 0 0 1 200 330 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="193" y1="373" x2="207" y2="373" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="196" y1="379" x2="204" y2="379" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="110" y="440" font-family="sans-serif">
      <tspan x="110" font-size="30" font-weight="bold" fill="#207448">Idea: </tspan>
      <tspan x="110" dy="50" font-size="25" fill="#303a36">double loop, quadratic</tspan>
    </text>

    
    <line x1="510" y1="435" x2="560" y2="435" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="565" y="315" width="470" height="240" rx="16" ry="16" fill="#e8f1ea" stroke="#db8129" stroke-width="5" />
    <circle cx="615" cy="358" r="24" fill="#207448" />
    <text x="615" y="367" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <circle cx="695" cy="358" r="20" fill="none" stroke="#db8129" stroke-width="4" />
    <polyline points="695,345 695,358 705,358" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="595" y="420" font-family="sans-serif">
      <tspan x="595" font-size="30" font-weight="bold" fill="#db8129">Cost: </tspan>
      <tspan x="595" dy="36" font-size="25" fill="#303a36">repeated lookup, </tspan>
      <tspan x="595" dy="36" font-size="25" fill="#303a36">dictionary makes it </tspan>
      <tspan x="595" dy="36" font-size="25" fill="#303a36">constant time</tspan>
    </text>

    
    <line x1="1035" y1="435" x2="1085" y2="435" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="1090" y="315" width="430" height="240" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="1140" cy="358" r="24" fill="#207448" />
    <text x="1140" y="367" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <rect x="1200" y="336" width="34" height="42" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="1207,358 1215,366 1227,348" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1120" y="440" font-family="sans-serif">
      <tspan x="1120" font-size="30" font-weight="bold" fill="#207448">Check: </tspan>
      <tspan x="1120" dy="50" font-size="25" fill="#303a36">run the example</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="80" y="585" width="430" height="210" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="130" cy="612" r="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="114" cy="638" r="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="146" cy="638" r="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="125" y1="618" x2="118" y2="632" stroke="#207448" stroke-width="3.5" />
    <line x1="135" y1="618" x2="142" y2="632" stroke="#207448" stroke-width="3.5" />
    <text x="110" y="690" font-family="sans-serif">
      <tspan x="110" font-size="30" font-weight="bold" fill="#207448">Idea: </tspan>
      <tspan x="110" dy="48" font-size="25" fill="#303a36">a heap of size three</tspan>
    </text>

    
    <rect x="565" y="585" width="470" height="210" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="605" y="622" width="7" height="22" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="618" y="614" width="7" height="30" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="631" y="605" width="7" height="39" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 602 604 C 618 596 636 596 644 604" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="595" y="675" font-family="sans-serif">
      <tspan x="595" font-size="30" font-weight="bold" fill="#207448">Cost: </tspan>
      <tspan x="595" dy="38" font-size="25" fill="#303a36">the sort over all keys </tspan>
      <tspan x="595" dy="38" font-size="25" fill="#303a36">repeats work</tspan>
    </text>

    
    <rect x="1090" y="585" width="430" height="210" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <polygon points="1125,610 1157,610 1147,626 1147,642 1135,638 1135,626" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <circle cx="1133" cy="603" r="2.5" fill="#207448" />
    <circle cx="1141" cy="603" r="2.5" fill="#207448" />
    <circle cx="1149" cy="603" r="2.5" fill="#207448" />
    <text x="1120" y="675" font-family="sans-serif">
      <tspan x="1120" font-size="30" font-weight="bold" fill="#207448">Check: </tspan>
      <tspan x="1120" dy="38" font-size="25" fill="#303a36">the top three </tspan>
      <tspan x="1120" dy="38" font-size="25" fill="#303a36">only are needed</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="80" y="825" width="690" height="145" rx="16" ry="16" fill="#ffffff" stroke="#c2cec6" stroke-width="2" />
    
    <rect x="125" y="860" width="16" height="26" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 115 873 C 115 887 127 894 133 894 C 139 894 151 887 151 873" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="133" y1="894" x2="133" y2="904" stroke="#207448" stroke-width="3.5" />
    <line x1="123" y1="904" x2="143" y2="904" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    
    <circle cx="185" cy="880" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
    <path d="M 174 869 L 196 891 M 196 869 L 174 891" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" />
    <text x="235" y="890" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Silence</text>

    
    <rect x="830" y="825" width="690" height="145" rx="16" ry="16" fill="#ffffff" stroke="#c2cec6" stroke-width="2" />
    
    <rect x="865" y="863" width="52" height="34" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="873" y1="874" x2="881" y2="874" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="887" y1="874" x2="895" y2="874" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="901" y1="874" x2="909" y2="874" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="877" y1="885" x2="899" y2="885" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="950" cy="880" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
    <path d="M 939 869 L 961 891 M 961 869 L 939 891" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" />
    <text x="1005" y="890" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Narrating every keystroke</text>
  </g>
</svg>