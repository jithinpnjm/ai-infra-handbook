<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background-color: #f5f8f5; font-family: system-ui, -apple-system, sans-serif;">
  <title>Why counter += 1 can lose an update without a lock</title>
  <desc>Visual comparison showing how two concurrent threads without synchronization lose an increment due to interleaved execution, while a mutex lock preserves atomicity.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#c83232" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <text x="800" y="52" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Why counter += 1 can lose an update without a lock</text>

  
  <rect x="120" y="78" width="1360" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="112" font-size="24" fill="#303a36" text-anchor="middle">CPU-bound work: use processes because of the global interpreter lock. I/O-bound fan-out: threads or asyncio.</text>

  
  
  
  <rect x="50" y="155" width="720" height="710" rx="16" fill="#ffffff" stroke="#c83232" stroke-width="3"/>

  
  <path d="M 50 171 A 16 16 0 0 1 66 155 L 754 155 A 16 16 0 0 1 770 171 L 770 215 L 50 215 Z" fill="#fdf2f2"/>
  <line x1="50" y1="215" x2="770" y2="215" stroke="#c83232" stroke-width="2"/>
  
  
  <g transform="translate(230, 167)" stroke="#c83232" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="6" y="16" width="24" height="18" rx="3"/>
    <path d="M 12 16 V 10 A 6 6 0 0 1 24 10 V 7"/>
  </g>
  <text x="410" y="198" font-size="32" font-weight="bold" fill="#c83232" text-anchor="middle">Without a lock</text>

  
  <g transform="translate(0, 235)">
    
    <rect x="75" y="0" width="180" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="165" y="39" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Thread A</text>

    
    <rect x="325" y="0" width="170" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="410" y="39" font-size="28" font-family="monospace" font-weight="bold" fill="#207448" text-anchor="middle">self.n</text>

    
    <rect x="565" y="0" width="180" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="655" y="39" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Thread B</text>

    
    <line x1="165" y1="60" x2="165" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="410" y1="60" x2="410" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="655" y1="60" x2="655" y2="480" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  
  <g transform="translate(75, 320)">
    <rect x="0" y="0" width="670" height="68" rx="12" fill="#f8faf8" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <circle cx="40" cy="34" r="22" fill="#207448"/>
    <text x="40" y="42" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <text x="80" y="42" font-size="26" font-weight="bold" fill="#303a36">A reads n</text>
    
    <line x1="335" y1="34" x2="225" y2="34" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  <g transform="translate(75, 405)">
    <rect x="0" y="0" width="670" height="68" rx="12" fill="#f8faf8" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <circle cx="40" cy="34" r="22" fill="#207448"/>
    <text x="40" y="42" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <text x="80" y="42" font-size="26" font-weight="bold" fill="#303a36">B reads n (the same value)</text>
    
    <line x1="335" y1="34" x2="445" y2="34" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  <g transform="translate(75, 490)">
    <rect x="0" y="0" width="670" height="68" rx="12" fill="#f8faf8" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <circle cx="40" cy="34" r="22" fill="#207448"/>
    <text x="40" y="42" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <text x="80" y="42" font-size="26" font-weight="bold" fill="#303a36">A adds one and writes n</text>
    
    <line x1="225" y1="34" x2="335" y2="34" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  
  <g transform="translate(75, 575)">
    <rect x="0" y="0" width="670" height="110" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="2.5"/>
    
    <circle cx="45" cy="55" r="24" fill="#db8129"/>
    <text x="45" y="63" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <text x="90" y="44" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="90" dy="0">B adds one and</tspan>
      <tspan x="90" dy="36" fill="#db8129">writes n (the same result)</tspan>
    </text>
    
    <line x1="580" y1="55" x2="470" y2="55" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>
  </g>

  
  <g transform="translate(75, 715)">
    <rect x="0" y="0" width="670" height="115" rx="12" fill="#fdf2f2" stroke="#c83232" stroke-width="2"/>
    
    <g transform="translate(25, 33)" stroke="#c83232" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 22 2 L 42 38 L 2 38 Z"/>
      <line x1="22" y1="14" x2="22" y2="24"/>
      <circle cx="22" cy="31" r="1.5" fill="#c83232"/>
    </g>
    <text x="85" y="48" font-size="25" font-weight="bold" fill="#c83232">
      <tspan x="85" dy="0">two increments,</tspan>
      <tspan x="85" dy="34">the count is one lower than it should be</tspan>
    </text>
  </g>


  
  
  
  <rect x="830" y="155" width="720" height="710" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <path d="M 830 171 A 16 16 0 0 1 846 155 L 1534 155 A 16 16 0 0 1 1550 171 L 1550 215 L 830 215 Z" fill="#e8f1ea"/>
  <line x1="830" y1="215" x2="1550" y2="215" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1040, 167)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="6" y="15" width="24" height="18" rx="3"/>
    <path d="M 12 15 V 9 A 6 6 0 0 1 24 9 V 15"/>
  </g>
  <text x="1190" y="198" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">With a lock</text>

  
  <g transform="translate(860, 245)">
    <rect x="0" y="0" width="660" height="210" rx="14" fill="#f0f8f3" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(25, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 24 4 L 42 10 V 22 C 42 34 24 44 24 44 C 24 44 6 34 6 22 V 10 Z" fill="#e8f1ea"/>
      <circle cx="24" cy="22" r="4" fill="#207448"/>
      <path d="M 24 26 V 32"/>
    </g>

    <text x="85" y="48" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="85" dy="0">A takes the lock: read, add, write as one unit</tspan>
    </text>

    
    <g transform="translate(85, 80)">
      <rect x="0" y="0" width="540" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4"/>
      
      <rect x="25" y="22" width="130" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="90" y="56" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">read</text>

      <line x1="165" y1="48" x2="195" y2="48" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

      <rect x="205" y="22" width="130" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="270" y="56" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">add</text>

      <line x1="345" y1="48" x2="375" y2="48" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

      <rect x="385" y="22" width="130" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="450" y="56" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">write</text>
    </g>
  </g>

  
  <g transform="translate(860, 485)">
    <rect x="0" y="0" width="660" height="200" rx="14" fill="#f8faf8" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(25, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="24" cy="24" r="20" fill="#e8f1ea"/>
      <polyline points="24,12 24,24 34,24"/>
    </g>

    <text x="85" y="50" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="85" dy="0">B waits off the CPU, then takes the lock</tspan>
      <tspan x="85" dy="36" fill="#207448">and does the same</tspan>
    </text>

    
    <g transform="translate(85, 115)">
      <rect x="0" y="0" width="240" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="120" y="36" font-size="24" font-weight="bold" fill="#64748b" text-anchor="middle">suspended</text>

      <line x1="255" y1="28" x2="285" y2="28" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

      <rect x="295" y="0" width="245" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="417" y="36" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">atomic update</text>
    </g>
  </g>

  
  <g transform="translate(860, 715)">
    <rect x="0" y="0" width="660" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 35)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="22" fill="#ffffff"/>
      <polyline points="12,22 19,30 32,14"/>
    </g>
    <text x="100" y="66" font-size="28" font-weight="bold" fill="#207448">both increments count</text>
  </g>


  
  
  
  <g transform="translate(50, 895)">
    <rect x="0" y="0" width="1500" height="165" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(30, 48)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" fill="#ffffff"/>
      <line x1="28" y1="26" x2="28" y2="38"/>
      <circle cx="28" cy="18" r="1.5" fill="#207448"/>
    </g>

    <text x="95" y="48" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">The Python 3.12 FAQ says i = i + 1 is not atomic and to use a mutex when in doubt.</tspan>
      <tspan x="95" dy="36">8 threads of 200,000 increments reported exactly 1,600,000 here, so the race did not appear, which proves nothing.</tspan>
      <tspan x="95" dy="36" font-weight="bold">Never offer it worked when I ran it.</tspan>
    </text>
  </g>

</svg>