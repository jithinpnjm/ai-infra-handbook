<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Why counter += 1 can lose an update without a lock</title>
  <desc>Visual comparison showing how two threads lose an increment when modifying a shared variable concurrently without a mutex versus executing atomically with a lock.</desc>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#303a36" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Why counter += 1 can lose an update without a lock</text>

  
  <rect x="40" y="105" width="940" height="745" rx="14" fill="#ffffff" stroke="#c53030" stroke-width="3" />

  
  <g transform="translate(65, 125)">
    
    <rect x="0" y="18" width="44" height="34" rx="6" fill="none" stroke="#c53030" stroke-width="4" />
    <path d="M 11 18 V 10 A 11 11 0 0 1 33 10 V 13" fill="none" stroke="#c53030" stroke-width="4" stroke-linecap="round" />
    <circle cx="22" cy="35" r="4" fill="#c53030" />
    <text x="60" y="42" font-family="sans-serif" font-size="34" font-weight="bold" fill="#c53030">Without a lock</text>
  </g>

  
  
  <rect x="75" y="195" width="210" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="180" y="233" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Thread A</text>

  
  <rect x="425" y="195" width="170" height="56" rx="8" fill="#f0f4f1" stroke="#303a36" stroke-width="2" />
  <text x="510" y="233" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">self.n</text>

  
  <rect x="735" y="195" width="210" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="840" y="233" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Thread B</text>

  
  <line x1="180" y1="251" x2="180" y2="705" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="510" y1="251" x2="510" y2="705" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="840" y1="251" x2="840" y2="705" stroke="#8fa89b" stroke-width="2" stroke-dasharray="6 6" />

  
  <circle cx="215" cy="295" r="22" fill="#207448" />
  <text x="215" y="303" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="365" y="295" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">A reads n</text>
  <line x1="490" y1="315" x2="200" y2="315" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />

  
  <circle cx="560" cy="395" r="22" fill="#207448" />
  <text x="560" y="403" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="700" y="385" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="700" dy="0">B reads n</tspan>
    <tspan x="700" dy="30">(the same value)</tspan>
  </text>
  <line x1="530" y1="435" x2="820" y2="435" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />

  
  <circle cx="215" cy="510" r="22" fill="#207448" />
  <text x="215" y="518" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="365" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="365" dy="0">A adds one and</tspan>
    <tspan x="365" dy="30">writes n</tspan>
  </text>
  <line x1="200" y1="550" x2="490" y2="550" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />

  
  <circle cx="805" cy="610" r="22" fill="#207448" />
  <text x="805" y="618" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="670" y="595" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="670" dy="0">B adds one and writes n</tspan>
    <tspan x="670" dy="30">(the same result)</tspan>
  </text>
  <line x1="820" y1="645" x2="530" y2="645" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />

  
  <rect x="70" y="730" width="880" height="95" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <g transform="translate(95, 750)">
    <polygon points="26,4 50,46 2,46" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="26" y1="20" x2="26" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="39" r="2.5" fill="#db8129" />
  </g>
  <text x="175" y="787" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">two increments, the count is one lower than it should be</text>

  
  <rect x="1010" y="105" width="550" height="745" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(1040, 125)">
    
    <rect x="0" y="18" width="44" height="34" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 11 18 V 10 A 11 11 0 0 1 33 10 V 18" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="22" cy="35" r="4" fill="#207448" />
    <text x="60" y="42" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">With a lock</text>
  </g>

  
  <rect x="1040" y="215" width="490" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1065, 262)">
    
    <path d="M 24 4 L 44 14 V 30 C 44 42 24 50 24 50 C 24 50 4 42 4 30 V 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="1135" y="278" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1135" dy="0">A takes the lock:</tspan>
    <tspan x="1135" dy="38">read, add, write as one unit</tspan>
  </text>

  
  <line x1="1285" y1="365" x2="1285" y2="435" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1040" y="445" width="490" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1065, 510)">
    
    <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="24,12 24,24 34,24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1135" y="495" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1135" dy="0">B waits off the CPU,</tspan>
    <tspan x="1135" dy="38">then takes the lock</tspan>
    <tspan x="1135" dy="38">and does the same</tspan>
  </text>

  
  <line x1="1285" y1="625" x2="1285" y2="720" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1040" y="730" width="490" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <g transform="translate(1065, 755)">
    
    <circle cx="22" cy="22" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="13,22 19,28 31,16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1135" y="788" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">both increments count</text>

  
  <rect x="40" y="875" width="1520" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(65, 895)">
    
    <rect x="4" y="4" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="14" y="14" width="16" height="16" fill="#207448" />
    <line x1="12" y1="0" x2="12" y2="4" stroke="#207448" stroke-width="3" />
    <line x1="22" y1="0" x2="22" y2="4" stroke="#207448" stroke-width="3" />
    <line x1="32" y1="0" x2="32" y2="4" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="40" x2="12" y2="44" stroke="#207448" stroke-width="3" />
    <line x1="22" y1="40" x2="22" y2="44" stroke="#207448" stroke-width="3" />
    <line x1="32" y1="40" x2="32" y2="44" stroke="#207448" stroke-width="3" />
  </g>
  <text x="800" y="912" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">CPU-bound work: use processes because of the global interpreter lock.</tspan>
    <tspan x="800" dy="32">I/O-bound fan-out: threads or asyncio.</tspan>
  </text>

  
  <rect x="40" y="980" width="1520" height="150" rx="10" fill="#ffffff" stroke="#ccd5cf" stroke-width="2" />
  <g transform="translate(65, 1025)">
    
    <path d="M 6 0 L 30 0 L 42 12 L 42 50 L 6 50 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <polyline points="30,0 30,12 42,12" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="14" y1="22" x2="34" y2="22" stroke="#207448" stroke-width="2" />
    <line x1="14" y1="30" x2="34" y2="30" stroke="#207448" stroke-width="2" />
    <line x1="14" y1="38" x2="26" y2="38" stroke="#207448" stroke-width="2" />
  </g>
  <text x="135" y="1018" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">The Python 3.12 FAQ says i = i + 1 is not atomic and to use a mutex when in doubt.</tspan>
    <tspan x="135" dy="30">8 threads of 200,000 increments reported exactly 1,600,000 here,</tspan>
    <tspan x="135" dy="30">so the race did not appear, which proves nothing.</tspan>
    <tspan x="135" dy="30">Never offer it worked when I ran it.</tspan>
  </text>
</svg>