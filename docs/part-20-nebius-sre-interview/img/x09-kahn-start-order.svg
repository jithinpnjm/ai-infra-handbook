<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Kahn's algorithm gives a start order, and leftovers mean a cycle.</title>
  <desc>Kahn's algorithm: start the services with no open dependencies first</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Kahn's algorithm gives a start order, </tspan>
    <tspan x="800" dy="56">and leftovers mean a cycle.</tspan>
  </text>

  
  <rect x="40" y="145" width="620" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="65" y="165" width="170" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="150" y="197" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">in-degree</text>

  
  <rect x="210" y="240" width="280" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(225, 252)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="46" height="40" rx="5" fill="#f5f8f5"/>
    <line x1="4" y1="18" x2="50" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448"/>
    <circle cx="20" cy="12" r="2" fill="#207448"/>
    <circle cx="28" cy="12" r="2" fill="#207448"/>
  </g>
  <text x="330" y="290" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">web</text>
  
  <circle cx="450" cy="280" r="20" fill="#207448"/>
  <path d="M 446 274 L 450 271 L 450 289 M 444 289 L 456 289" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  
  <line x1="350" y1="320" x2="350" y2="398" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="210" y="400" width="280" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(225, 412)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="27" cy="27" r="14" fill="#f5f8f5"/>
    <circle cx="27" cy="27" r="5" fill="#207448"/>
    <line x1="27" y1="7" x2="27" y2="2"/>
    <line x1="27" y1="52" x2="27" y2="47"/>
    <line x1="7" y1="27" x2="2" y2="27"/>
    <line x1="52" y1="27" x2="47" y2="27"/>
  </g>
  <text x="330" y="450" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">api</text>
  
  <circle cx="450" cy="440" r="20" fill="#207448"/>
  <path d="M 444 435 C 444 431 456 431 456 437 C 456 443 444 445 444 449 L 456 449" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  
  <path d="M 250 480 L 190 558" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 450 480 L 510 558" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  
  <rect x="60" y="560" width="260" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(74, 572)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="#f5f8f5"/>
    <line x1="18" y1="3" x2="18" y2="10"/>
    <line x1="28" y1="3" x2="28" y2="10"/>
    <line x1="38" y1="3" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="53"/>
    <line x1="28" y1="46" x2="28" y2="53"/>
    <line x1="38" y1="46" x2="38" y2="53"/>
  </g>
  <text x="185" y="610" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cache</text>
  
  <circle cx="280" cy="600" r="20" fill="#207448"/>
  <path d="M 276 594 L 280 591 L 280 609 M 274 609 L 286 609" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  
  <rect x="380" y="560" width="260" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
  <g transform="translate(394, 572)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="28" cy="14" rx="20" ry="7" fill="#f5f8f5"/>
    <path d="M 8 14 V 42 C 8 46 17 50 28 50 C 39 50 48 46 48 42 V 14" fill="#f5f8f5"/>
    <path d="M 8 28 C 8 32 17 36 28 36 C 39 36 48 32 48 28"/>
  </g>
  <text x="500" y="610" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">db</text>
  
  <circle cx="600" cy="600" r="20" fill="#207448"/>
  <path d="M 596 594 L 600 591 L 600 609 M 594 609 L 606 609" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  
  <path d="M 190 640 L 250 718" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 510 640 L 450 718" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  
  <rect x="210" y="720" width="280" height="80" rx="12" fill="#d2e8d7" stroke="#207448" stroke-width="3.5"/>
  
  <g transform="translate(225, 732)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="28" cy="15" r="7" fill="#ffffff"/>
    <circle cx="14" cy="40" r="6" fill="#ffffff"/>
    <circle cx="42" cy="40" r="6" fill="#ffffff"/>
    <line x1="23" y1="21" x2="17" y2="34"/>
    <line x1="33" y1="21" x2="39" y2="34"/>
  </g>
  <text x="330" y="770" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">net</text>
  
  <circle cx="450" cy="760" r="20" fill="#207448"/>
  <ellipse cx="450" cy="760" rx="6" ry="9" stroke="#ffffff" stroke-width="3" fill="none"/>

  
  <rect x="690" y="145" width="870" height="870" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="715" y="168" width="820" height="74" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <circle cx="755" cy="205" r="22" fill="#207448"/>
  <text x="755" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="795" y="213" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">queue net, output net</text>

  
  <rect x="715" y="254" width="820" height="124" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <circle cx="755" cy="316" r="22" fill="#207448"/>
  <text x="755" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="795" y="294" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="795" dy="0">queue cache and db after net finishes, </tspan>
    <tspan x="795" dy="32">output net, cache, db </tspan>
    <tspan x="795" dy="32">(db and cache each drop to zero)</tspan>
  </text>

  
  <rect x="715" y="390" width="820" height="66" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <circle cx="755" cy="423" r="22" fill="#207448"/>
  <text x="755" y="431" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="795" y="431" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">queue api</text>

  
  <rect x="715" y="468" width="820" height="66" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <circle cx="755" cy="501" r="22" fill="#207448"/>
  <text x="755" y="509" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="795" y="509" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">queue web</text>

  
  <rect x="715" y="546" width="820" height="74" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <circle cx="755" cy="583" r="22" fill="#207448"/>
  <text x="755" y="591" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="795" y="591" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">done, start order net, cache, db, api, web</text>

  
  
  <rect x="715" y="650" width="560" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="740" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="740" dy="0">if any node is left after </tspan>
    <tspan x="740" dy="36">the queue is empty, it is on a </tspan>
    <tspan x="740" dy="36">cycle or blocked by one</tspan>
  </text>

  
  <rect x="1305" y="650" width="230" height="340" rx="14" fill="#fbf0e4" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(1392, 680)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28,6 50,46 6,46" fill="#fbe6d3"/>
    <line x1="28" y1="20" x2="28" y2="32"/>
    <circle cx="28" cy="39" r="1.5" fill="#db8129"/>
  </g>
  <text x="1420" y="795" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">
    <tspan x="1420" dy="0">stuck nodes </tspan>
    <tspan x="1420" dy="40">show a loop</tspan>
  </text>

  
  <rect x="40" y="1045" width="1520" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1092" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Leftover nodes mean a cycle, so refuse to proceed and name the loop.</text>
</svg>