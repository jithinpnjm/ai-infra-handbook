<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>A counter that restarts: subtraction gets the sign wrong, increase repairs the reset</title>
  <desc>Visual explanation showing how Prometheus counter resets produce incorrect negative values with subtraction, whereas increase repairs the reset.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#607267" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">A counter that restarts: subtraction gets the sign wrong,</text>
  <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">increase repairs the reset</text>

  
  <rect x="50" y="140" width="720" height="810" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <line x1="130" y1="780" x2="130" y2="240" stroke="#607267" stroke-width="3" marker-end="url(#axis-arrow)" />
  <line x1="130" y1="780" x2="720" y2="780" stroke="#607267" stroke-width="3" marker-end="url(#axis-arrow)" />

  
  <line x1="130" y1="360" x2="710" y2="360" stroke="#e8f1ea" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="130" y1="440" x2="710" y2="440" stroke="#e8f1ea" stroke-width="2" stroke-dasharray="4,4" />

  
  <rect x="250" y="170" width="450" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="475" y="206" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Pod restarts, counter resets to zero</text>
  <path d="M 475 224 L 475 285" fill="none" stroke="#207448" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  
  
  <line x1="140" y1="780" x2="475" y2="310" stroke="#207448" stroke-width="6" stroke-linecap="round" />
  
  <line x1="475" y1="310" x2="475" y2="780" stroke="#db8129" stroke-width="4" stroke-dasharray="6,6" />
  
  <line x1="475" y1="780" x2="690" y2="440" stroke="#207448" stroke-width="6" stroke-linecap="round" />

  
  <circle cx="410" cy="400" r="10" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <rect x="145" y="380" width="235" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="262" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Ten minutes earlier</text>
  <line x1="380" y1="400" x2="398" y2="400" stroke="#207448" stroke-width="2" />

  
  <circle cx="690" cy="440" r="10" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <rect x="635" y="480" width="105" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="687" y="512" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Now</text>
  <line x1="687" y1="452" x2="687" y2="480" stroke="#207448" stroke-width="2" />

  
  <path d="M 410 810 L 410 835 L 550 835 L 550 850 L 550 835 L 690 835 L 690 810" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="475" y="860" width="150" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="550" y="891" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">offset 10m</text>

  
  <path d="M 410 390 L 410 320 L 800 320" fill="none" stroke="#607267" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)" />

  
  <path d="M 690 440 L 755 440 L 755 690 L 800 690" fill="none" stroke="#607267" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)" />

  

  
  <g transform="translate(810, 140)">
    <rect x="0" y="0" width="740" height="375" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="25" y="25" width="690" height="90" rx="12" fill="#e8f1ea" />
    
    <g transform="translate(45, 42)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
    </g>
    <text x="130" y="82" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">x - x offset 10m</text>

    
    <g transform="translate(45, 155)">
      
      <g stroke="#207448" stroke-width="3.5" fill="none">
        <rect x="0" y="0" width="56" height="56" rx="6" />
        <path d="M 12 42 L 24 28 L 34 36 L 46 14" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="85" y="44" font-family="monospace" font-size="44" font-weight="bold" fill="#303a36">minus 10</text>
    </g>

    
    <rect x="25" y="270" width="690" height="75" rx="10" fill="#f5f8f5" />
    <text x="370" y="318" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Subtraction gets the sign wrong</text>
  </g>

  
  <g transform="translate(810, 560)">
    <rect x="0" y="0" width="740" height="390" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="25" y="25" width="690" height="90" rx="12" fill="#e8f1ea" />
    
    <g transform="translate(45, 42)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
    </g>
    <text x="130" y="82" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">increase(x[10m])</text>

    
    <g transform="translate(45, 155)">
      
      <g stroke="#207448" stroke-width="3.5" fill="none">
        <rect x="0" y="0" width="56" height="56" rx="6" />
        <path d="M 12 42 L 24 28 L 34 36 L 46 14" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="85" y="46" font-family="monospace" font-size="52" font-weight="bold" fill="#db8129">88.9</text>
    </g>

    
    <rect x="25" y="270" width="690" height="90" rx="10" fill="#f5f8f5" />
    <text x="370" y="326" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">The real work done, once the reset is repaired</text>
  </g>

  
  <rect x="50" y="990" width="1500" height="90" rx="16" fill="#207448" />
  <text x="800" y="1047" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Never subtract counters yourself</text>
</svg>