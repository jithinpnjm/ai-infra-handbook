<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>A counter that restarts: subtraction gets the sign wrong, increase repairs the reset</title>
  <desc>Visual comparison showing that naive counter subtraction yields negative results across restarts, while increase repairs the reset.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A counter that restarts:</tspan>
    <tspan x="800" dy="50">subtraction gets the sign wrong, increase repairs the reset</tspan>
  </text>

  
  <rect x="50" y="150" width="710" height="705" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <line x1="120" y1="270" x2="700" y2="270" stroke="#d5e2d8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="120" y1="360" x2="700" y2="360" stroke="#d5e2d8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="120" y1="450" x2="700" y2="450" stroke="#d5e2d8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="120" y1="540" x2="700" y2="540" stroke="#d5e2d8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="120" y1="630" x2="700" y2="630" stroke="#d5e2d8" stroke-width="1.5" stroke-dasharray="4 4"/>

  
  <line x1="120" y1="720" x2="120" y2="220" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-axis)"/>
  <line x1="120" y1="720" x2="715" y2="720" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-axis)"/>

  
  <line x1="120" y1="720" x2="570" y2="270" stroke="#207448" stroke-width="5" stroke-linecap="round"/>

  
  <line x1="570" y1="270" x2="570" y2="720" stroke="#207448" stroke-width="3.5" stroke-dasharray="6 6"/>

  
  <line x1="570" y1="720" x2="680" y2="665" stroke="#207448" stroke-width="5" stroke-linecap="round"/>

  
  <rect x="290" y="210" width="260" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 550 247 L 570 270" stroke="#207448" stroke-width="2"/>
  <text x="420" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="420" dy="0">Pod restarts,</tspan>
    <tspan x="420" dy="30">counter resets to zero</tspan>
  </text>

  
  <circle cx="210" cy="630" r="9" fill="#207448" stroke="#ffffff" stroke-width="3"/>
  <text x="210" y="595" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Ten minutes earlier</text>

  
  <circle cx="680" cy="665" r="9" fill="#207448" stroke="#ffffff" stroke-width="3"/>
  <text x="680" y="630" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Now</text>

  
  <path d="M 210 740 L 210 760 L 445 760 L 445 775 L 445 760 L 680 760 L 680 740" fill="none" stroke="#207448" stroke-width="2.5"/>
  <text x="445" y="815" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">offset 10m</text>

  
  
  <path d="M 210 621 L 210 185 L 810 185" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  
  <path d="M 689 665 L 750 665 L 750 310 L 810 310" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  
  <path d="M 525 810 L 750 810 L 750 680 L 810 680" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="810" y="150" width="740" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(845, 175)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="25" cy="25" r="11"/>
    <path d="M 25 5 L 25 10 M 25 40 L 25 45 M 5 25 L 10 25 M 40 25 L 45 25 M 11 11 L 15 15 M 35 35 L 39 39 M 11 39 L 15 35 M 35 15 L 39 11"/>
  </g>

  
  <text x="915" y="210" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#303a36">x - x offset 10m</text>

  
  <line x1="845" y1="250" x2="1515" y2="250" stroke="#c0d6c7" stroke-width="2" stroke-dasharray="6 6"/>

  
  <g transform="translate(845, 280)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="5" y="5" width="40" height="40" rx="4"/>
    <polyline points="10,35 20,25 30,30 40,15"/>
  </g>

  
  <text x="915" y="318" font-family="ui-monospace, monospace" font-size="40" font-weight="bold" fill="#303a36">minus 10</text>

  
  <text x="915" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Subtraction gets the sign wrong</text>

  
  <rect x="810" y="515" width="740" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(845, 540)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="25" cy="25" r="11"/>
    <path d="M 25 5 L 25 10 M 25 40 L 25 45 M 5 25 L 10 25 M 40 25 L 45 25 M 11 11 L 15 15 M 35 35 L 39 39 M 11 39 L 15 35 M 35 15 L 39 11"/>
  </g>

  
  <text x="915" y="575" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#303a36">increase(x[10m])</text>

  
  <line x1="845" y1="615" x2="1515" y2="615" stroke="#c0d6c7" stroke-width="2" stroke-dasharray="6 6"/>

  
  <g transform="translate(845, 650)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="5" y="5" width="40" height="40" rx="4"/>
    <polyline points="10,35 20,25 30,30 40,15"/>
  </g>

  
  <text x="915" y="692" font-family="ui-monospace, monospace" font-size="44" font-weight="bold" fill="#db8129">88.9</text>

  
  <text x="915" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="915" dy="0">The real work done,</tspan>
    <tspan x="915" dy="32">once the reset is repaired</tspan>
  </text>

  
  <rect x="810" y="885" width="740" height="70" rx="12" fill="#207448"/>
  <text x="1180" y="930" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Never subtract counters yourself</text>
</svg>