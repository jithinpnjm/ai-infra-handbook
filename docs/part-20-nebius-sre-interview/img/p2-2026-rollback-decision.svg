<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Roll back when the symptom follows a change</title>
  <desc>Visual decision flow explaining when to roll back a Kubernetes deployment after a change and identifying destructive traps that look like fixes.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Roll back when the symptom follows a change</text>

  

  
  <g id="node-start">
    <rect x="60" y="105" width="800" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(85, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,4 52,28 28,52 4,28" />
      <circle cx="28" cy="38" r="1.5" fill="#207448" />
      <path d="M 23 20 C 23 15 33 15 33 24 C 33 29 28 29 28 33" />
    </g>
    <text x="165" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Symptom began right after a change?</text>
  </g>

  
  <g id="node-timing-clue">
    <rect x="920" y="105" width="620" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(945, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" />
      <path d="M 22 2 L 34 2" />
    </g>
    <text x="1030" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1030" dy="0">The timing is the strongest</tspan>
      <tspan x="1030" dy="30">clue in the room</tspan>
    </text>
  </g>

  

  
  <line x1="460" y1="195" x2="460" y2="263" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <circle cx="460" cy="229" r="16" fill="#207448" />
  <polyline points="453,229 458,235 468,223" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  
  <path d="M 760 195 L 760 229 L 1230 229 L 1230 263" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <circle cx="995" cy="229" r="16" fill="#ecefec" stroke="#717a76" stroke-width="2" />
  <line x1="988" y1="222" x2="1002" y2="236" stroke="#717a76" stroke-width="3" stroke-linecap="round" />
  <line x1="1002" y1="222" x2="988" y2="236" stroke="#717a76" stroke-width="3" stroke-linecap="round" />

  

  
  <g id="node-decision-cheap">
    <rect x="60" y="265" width="800" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(85, 297)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="8" x2="28" y2="48" />
      <line x1="10" y1="18" x2="46" y2="18" />
      <path d="M 10 18 L 4 34 h 12 Z" />
      <path d="M 46 18 L 40 34 h 12 Z" />
      <line x1="16" y1="48" x2="40" y2="48" stroke-width="5" />
    </g>
    <text x="165" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="165" dy="0">Is the rollback tested and cheap,</tspan>
      <tspan x="165" dy="42">and do you not yet know the cause?</tspan>
    </text>
  </g>

  
  <g id="node-no-outcome">
    <rect x="920" y="265" width="620" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(945, 297)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="16" />
      <line x1="36" y1="36" x2="48" y2="48" stroke-width="5" />
      <line x1="18" y1="24" x2="30" y2="24" stroke-width="3" />
      <line x1="24" y1="18" x2="24" y2="30" stroke-width="3" />
    </g>
    <text x="1030" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1030" dy="0">Keep investigating with</tspan>
      <tspan x="1030" dy="42">the evidence still in place</tspan>
    </text>
  </g>

  

  
  <line x1="460" y1="385" x2="460" y2="443" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <circle cx="460" cy="414" r="16" fill="#207448" />
  <polyline points="453,414 458,420 468,408" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  

  
  <g id="node-rollback-action">
    <rect x="60" y="445" width="800" height="120" rx="14" fill="#207448" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(85, 477)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 28 A 18 18 0 1 1 20 44" />
      <polyline points="6,28 14,28 14,20" />
    </g>
    <text x="165" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">
      <tspan x="165" dy="0">Roll back: </tspan>
      <tspan x="165" dy="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25">kubectl rollout undo deployment/name</tspan>
    </text>
  </g>

  

  
  <line x1="460" y1="565" x2="460" y2="618" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-followup-status">
    <rect x="220" y="620" width="480" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(242, 636)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="24" rx="4" />
      <polyline points="10,13 16,18 10,23" />
      <line x1="20" y1="23" x2="30" y2="23" />
    </g>
    <text x="296" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">kubectl rollout status</text>
  </g>

  

  
  <g id="container-traps">
    <rect x="60" y="735" width="1480" height="295" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(85, 755)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 46 H 6 Z" />
      <line x1="28" y1="20" x2="28" y2="32" />
      <circle cx="28" cy="40" r="1.5" fill="#db8129" />
    </g>
    
    
    <text x="165" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">Destructive traps that look like fixes</text>

    
    <g id="trap-chip-1">
      <rect x="90" y="825" width="670" height="85" rx="10" fill="#fff9f5" stroke="#db8129" stroke-width="1.5" />
      
      <g transform="translate(110, 845)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="14,4 32,4 42,14 42,32 32,42 14,42 4,32 4,14" />
        <line x1="16" y1="23" x2="30" y2="23" />
      </g>
      <text x="175" y="877" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Restart every replica at once</text>
    </g>

    
    <g id="trap-chip-2">
      <rect x="800" y="825" width="710" height="85" rx="10" fill="#fff9f5" stroke="#db8129" stroke-width="1.5" />
      
      <g transform="translate(820, 845)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="23" cy="12" rx="16" ry="6" />
        <path d="M 7 12 v 22 c 0 3.3 7.2 6 16 6 s 16 -2.7 16 -6 v -22" />
        <path d="M 7 23 c 0 3.3 7.2 6 16 6 s 16 -2.7 16 -6" />
      </g>
      <text x="885" y="877" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Defragment a live etcd member</text>
    </g>

    
    <g id="trap-chip-3">
      <rect x="90" y="925" width="670" height="85" rx="10" fill="#fff9f5" stroke="#db8129" stroke-width="1.5" />
      
      <g transform="translate(110, 945)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="23" cy="23" r="18" />
        <path d="M 5 23 h 36" />
        <path d="M 23 5 c 6 8 9 12 9 18 s -3 10 -9 18" />
        <path d="M 23 5 c -6 8 -9 12 -9 18 s 3 10 9 18" />
      </g>
      <text x="175" y="977" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Send EU traffic to a US region</text>
    </g>

    
    <g id="trap-chip-4">
      <rect x="800" y="925" width="710" height="85" rx="10" fill="#fff9f5" stroke="#db8129" stroke-width="1.5" />
      
      <g transform="translate(820, 945)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 6 h 22 l 12 12 v 22 h -34 Z" />
        <polyline points="28,6 28,18 40,18" />
        <line x1="14" y1="32" x2="30" y2="16" />
      </g>
      <text x="885" y="961" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="885" dy="0">Edit live config that</tspan>
        <tspan x="885" dy="32">GitOps will overwrite</tspan>
      </text>
    </g>
  </g>
</svg>