<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The RMA is a queue with an age limit</title>
  <desc>Visual infographic explaining the RMA lifecycle as a time-bounded queue, from quarantining the node and gathering evidence to vendor replacement and validation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="82" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The RMA is a queue with an age limit</text>

  
  <line x1="300" y1="365" x2="330" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="670" y1="365" x2="700" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="970" y1="365" x2="1000" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="1270" y1="365" x2="1300" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g>
    <rect x="40" y="145" width="260" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="85" cy="195" r="22" fill="#207448" />
    <text x="85" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(160, 168)">
      <rect x="0" y="8" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 13 8 L 13 2 C 13 0, 33 0, 33 2 L 33 8" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="0" y1="18" x2="46" y2="18" stroke="#207448" stroke-width="2.5" stroke-dasharray="3 3" />
      <rect x="11" y="24" width="24" height="20" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <line x1="16" y1="30" x2="29" y2="30" stroke="#207448" stroke-width="2" />
      <line x1="16" y1="36" x2="25" y2="36" stroke="#207448" stroke-width="2" />
    </g>
    
    <text x="170" y="295" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="170" dy="0">Quarantine</tspan>
      <tspan x="170" dy="38">the node and</tspan>
      <tspan x="170" dy="38">keep its</tspan>
      <tspan x="170" dy="38">evidence</tspan>
    </text>
  </g>

  
  <g>
    <rect x="330" y="145" width="340" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="370" cy="195" r="22" fill="#207448" />
    <text x="370" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <text x="515" y="204" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Evidence list</text>

    
    <rect x="348" y="235" width="304" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="366" y="264" font-family="sans-serif" font-size="24" font-weight="600" fill="#303a36">Xid history</text>

    
    <rect x="348" y="285" width="304" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="366" y="314" font-family="sans-serif" font-size="24" font-weight="600" fill="#303a36">diagnostic output</text>

    
    <rect x="348" y="335" width="304" height="152" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="366" y="364" font-family="sans-serif" font-size="24" font-weight="600" fill="#303a36">
      <tspan x="366" dy="0">temperature and</tspan>
      <tspan x="366" dy="32">ECC counters for</tspan>
      <tspan x="366" dy="32">the days before</tspan>
      <tspan x="366" dy="32">the fault</tspan>
    </text>

    
    <rect x="348" y="495" width="304" height="78" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="366" y="527" font-family="sans-serif" font-size="24" font-weight="600" fill="#303a36">
      <tspan x="366" dy="0">GPU and board</tspan>
      <tspan x="366" dy="32">serial numbers</tspan>
    </text>
  </g>

  
  <g>
    <rect x="700" y="145" width="270" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="745" cy="195" r="22" fill="#207448" />
    <text x="745" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(845, 172)">
      <rect x="0" y="0" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="8" y1="14" x2="38" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="24" x2="38" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="34" x2="26" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="36" cy="34" r="3" fill="#207448" />
    </g>
    
    <text x="835" y="278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="835" dy="0">Open a case</tspan>
      <tspan x="835" dy="38">with the vendor</tspan>
      <tspan x="835" dy="38">or integrator</tspan>
      <tspan x="835" dy="38">and attach</tspan>
      <tspan x="835" dy="38">the evidence</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1000" y="145" width="270" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1045" cy="195" r="22" fill="#207448" />
    <text x="1045" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(1145, 195)">
      <circle cx="0" cy="0" r="24" fill="#fff5ea" stroke="#db8129" stroke-width="4" />
      <polyline points="0,-13 0,0 12,0" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="3" fill="#db8129" />
    </g>
    
    <text x="1135" y="295" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1135" dy="0">Vendor</tspan>
      <tspan x="1135" dy="38">replacement:</tspan>
      <tspan x="1135" dy="38">technician</tspan>
      <tspan x="1135" dy="38">swaps the part</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1300" y="145" width="260" height="445" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1345" cy="195" r="22" fill="#207448" />
    <text x="1345" y="195" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g transform="translate(1440, 195)">
      <path d="M 0,-24 L 22,-14 C 22,12 11,22 0,26 C -11,22 -22,12 -22,-14 Z" fill="#ffffff" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <polyline points="-10,0 -3,8 11,-8" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="1430" y="295" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1430" dy="0">Validation runs</tspan>
      <tspan x="1430" dy="38">before the node</tspan>
      <tspan x="1430" dy="38">returns to</tspan>
      <tspan x="1430" dy="38">the pool</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="300" y="630" width="500" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(360, 698)">
      <rect x="0" y="0" width="46" height="58" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="16" r="3" fill="#207448" />
      <line x1="20" y1="16" x2="36" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="12" cy="29" r="3" fill="#207448" />
      <line x1="20" y1="29" x2="36" y2="29" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="12" cy="42" r="3" fill="#207448" />
      <line x1="20" y1="42" x2="36" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="435" y="705" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="435" dy="0">Track the age of</tspan>
      <tspan x="435" dy="36">every open case.</tspan>
      <tspan x="435" dy="36">Chase the oldest.</tspan>
    </text>
  </g>

  
  <g>
    <rect x="840" y="630" width="500" height="195" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(905, 727)">
      <circle cx="0" cy="0" r="38" fill="#fff5ea" stroke="#db8129" stroke-width="4.5" />
      <polyline points="0,-22 0,0 18,0" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="4" fill="#db8129" />
      
      <line x1="0" y1="-32" x2="0" y2="-26" stroke="#db8129" stroke-width="3" />
      <line x1="0" y1="32" x2="0" y2="26" stroke="#db8129" stroke-width="3" />
      <line x1="-32" y1="0" x2="-26" y2="0" stroke="#db8129" stroke-width="3" />
      <line x1="32" y1="0" x2="26" y2="0" stroke="#db8129" stroke-width="3" />
    </g>
    
    <text x="965" y="705" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="965" dy="0">Every day of waiting</tspan>
      <tspan x="965" dy="36">is capacity missing</tspan>
      <tspan x="965" dy="36">from the pool</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="865" width="1520" height="95" rx="12" fill="#207448" />
    <text x="800" y="907" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="800" dy="0">Treat the RMA as a queue with an age limit,</tspan>
      <tspan x="800" dy="36">and always run validation before the node returns.</tspan>
    </text>
  </g>
</svg>