<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Dashboard says 10,000,000 tokens, invoice says 10,200,000</title>
  <desc>Troubleshooting ladder resolving discrepancies between sampled telemetry counters and billing ledger invoices.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Dashboard says 10,000,000 tokens,</text>
  <text x="800" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">invoice says 10,200,000</text>

  
  <g id="header-node">
    <rect x="60" y="140" width="1480" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(86, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="18" x2="48" y2="18" />
      <line x1="28" y1="12" x2="28" y2="48" />
      <path d="M 18 48 L 38 48" />
      <path d="M 8 18 L 16 32 L 2 32 Z" />
      <path d="M 48 18 L 56 32 L 42 32 Z" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="170" y="180">Dashboard (sampled counters) 10,000,000 versus invoice (ledger) 10,200,000:</tspan>
      <tspan x="170" y="214">the invoice is the record if the ledger is correct</tspan>
    </text>
  </g>

  
  <line x1="800" y1="236" x2="800" y2="268" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-1">
    <rect x="60" y="270" width="1480" height="144" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="104" cy="342" r="24" fill="#207448" />
    <text x="104" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(148, 314)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="20" rx="4" />
      <circle cx="16" cy="16" r="2" fill="#207448" />
      <line x1="24" y1="16" x2="38" y2="16" />
      <path d="M 10 34 L 20 48 L 32 30 L 46 44" />
      <line x1="40" y1="34" x2="48" y2="42" />
      <line x1="48" y1="34" x2="40" y2="42" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="224" y="318">cheap explanations first: a killed gateway pod lost increments since its last scrape;</tspan>
      <tspan x="224" y="352">the dashboard rule uses increase, which extrapolates;</tspan>
      <tspan x="224" y="386">some scrapes failed, up shows gaps</tspan>
    </text>
  </g>

  
  <line x1="800" y1="414" x2="800" y2="448" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-2">
    <rect x="60" y="450" width="1480" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="104" cy="495" r="24" fill="#207448" />
    <text x="104" y="503" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(148, 467)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="22" height="44" rx="3" />
      <rect x="28" y="6" width="22" height="44" rx="3" />
      <line x1="12" y1="18" x2="22" y2="18" />
      <line x1="12" y1="28" x2="22" y2="28" />
      <line x1="34" y1="18" x2="44" y2="18" />
      <line x1="34" y1="28" x2="44" y2="28" />
    </g>
    <text x="224" y="503" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">compare the ledger with the gateway's own counters</text>
  </g>

  
  <path d="M 800 540 L 800 575 L 420 575 L 420 608" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 800 540 L 800 575 L 1180 575 L 1180 608" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="branch-a">
    <rect x="60" y="610" width="720" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="104" cy="690" r="24" fill="#207448" />
    <text x="104" y="698" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">A</text>
    
    <g transform="translate(148, 662)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="28" height="34" rx="3" />
      <path d="M 16 16 L 16 6 L 44 6 L 44 34 L 34 34" />
      <line x1="14" y1="26" x2="26" y2="26" />
      <line x1="14" y1="36" x2="26" y2="36" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="224" y="660">duplicates in the ledger:</tspan>
      <tspan x="224" y="694">the idempotency key</tspan>
      <tspan x="224" y="728">(request id) is missing</tspan>
    </text>
  </g>

  
  <g id="branch-b">
    <rect x="820" y="610" width="720" height="160" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="864" cy="690" r="24" fill="#db8129" />
    <text x="864" y="698" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">B</text>
    
    <g transform="translate(908, 662)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 48 L 6 48 Z" />
      <line x1="28" y1="22" x2="28" y2="32" />
      <circle cx="28" cy="40" r="1.5" fill="#db8129" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="984" y="660">fewer ledger rows than requests:</tspan>
      <tspan x="984" y="694">the queue dropped records,</tspan>
      <tspan x="984" y="728">a severity-one bug</tspan>
    </text>
  </g>

  
  <path d="M 420 770 L 420 805 L 800 805" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 1180 770 L 1180 805 L 800 805" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="800" y1="805" x2="800" y2="838" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-3">
    <rect x="60" y="840" width="1480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="104" cy="895" r="24" fill="#207448" />
    <text x="104" y="903" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(148, 867)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 10 L 50 10 L 50 38 L 24 38 L 12 48 L 12 38 L 6 38 Z" />
      <line x1="16" y1="20" x2="40" y2="20" />
      <line x1="16" y1="28" x2="32" y2="28" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="224" y="880">tell the customer the dashboard is an approximation</tspan>
      <tspan x="224" y="916">and the invoice is the record</tspan>
    </text>
  </g>

  
  <line x1="800" y1="950" x2="800" y2="984" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-4">
    <rect x="60" y="986" width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="104" cy="1041" r="24" fill="#207448" />
    <text x="104" y="1049" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(148, 1013)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="22" y1="15" x2="34" y2="15" />
      <line x1="22" y1="34" x2="34" y2="34" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="224" y="1026">keep the reconciliation report on file; a normal variance comes from</tspan>
      <tspan x="224" y="1062">your own reconciliation history, not an invented number</tspan>
    </text>
  </g>
</svg>