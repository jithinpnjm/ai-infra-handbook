<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Training storage: the checkpoint write is a burst, not an average</title>
  <desc>Infographic illustrating training storage bandwidth demands comparing burst checkpoint writes to average rates, alongside storage cost tiering.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" letter-spacing="-0.5px">Training storage: the checkpoint write is a burst, not an average</text>

  

  
  <g transform="translate(50, 105)">
    <rect width="920" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6" />
      <rect x="18" y="18" width="20" height="20" rx="3" />
      <line x1="16" y1="2" x2="16" y2="8" />
      <line x1="28" y1="2" x2="28" y2="8" />
      <line x1="40" y1="2" x2="40" y2="8" />
      <line x1="16" y1="48" x2="16" y2="54" />
      <line x1="28" y1="48" x2="28" y2="54" />
      <line x1="40" y1="48" x2="40" y2="54" />
      <line x1="2" y1="16" x2="8" y2="16" />
      <line x1="2" y1="28" x2="8" y2="28" />
      <line x1="2" y1="40" x2="8" y2="40" />
      <line x1="48" y1="16" x2="54" y2="16" />
      <line x1="48" y1="28" x2="54" y2="28" />
      <line x1="48" y1="40" x2="54" y2="40" />
    </g>
    <text x="106" y="48" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Aggregate read:</tspan>
      <tspan x="106" dy="40" font-size="25" fill="#303a36">4,096 GPUs x 50 MB/s = 204.8 GB/s</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 233)">
    <rect width="920" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M6 14v28c0 4.4 9.8 8 22 8s22-3.6 22-8V14" />
      <path d="M6 28c0 4.4 9.8 8 22 8s22-3.6 22-8" />
    </g>
    <text x="106" y="48" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Checkpoint size:</tspan>
      <tspan x="106" dy="40" font-size="25" fill="#303a36">70 billion parameters x 14 bytes = 980 GB</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 361)">
    <rect width="920" height="112" rx="14" fill="#fdf6ee" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(24, 28)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="22" />
      <line x1="28" y1="4" x2="28" y2="8" />
      <line x1="28" y1="30" x2="42" y2="18" />
      <circle cx="28" cy="30" r="3.5" fill="#db8129" />
    </g>
    <text x="106" y="48" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#db8129">Write rate if it must finish in 60 s:</tspan>
      <tspan x="106" dy="40" font-size="25" font-weight="bold" fill="#303a36">980 / 60 = 16.3 GB/s</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 489)">
    <rect width="920" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28 14 28 28 38 28" />
      <path d="M10 6L4 12" />
      <path d="M46 6L52 12" />
    </g>
    <text x="106" y="48" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Average write rate over a 1,800 s interval:</tspan>
      <tspan x="106" dy="40" font-size="25" fill="#303a36">980 / 1,800 = 0.54 GB/s</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 617)">
    <rect width="920" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="12" rx="22" ry="6" />
      <path d="M6 12v11c0 3.3 9.8 6 22 6s22-2.7 22-6V12" />
      <path d="M6 23v11c0 3.3 9.8 6 22 6s22-2.7 22-6V23" />
      <path d="M6 34v11c0 3.3 9.8 6 22 6s22-2.7 22-6V34" />
    </g>
    <text x="106" y="48" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Retained checkpoints:</tspan>
      <tspan x="106" dy="40" font-size="25" fill="#303a36">980 GB x 5 = 4.9 TB</tspan>
    </text>
  </g>

  

  
  <g transform="translate(1000, 105)">
    <rect width="550" height="296" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 30)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="36" rx="6" />
      <line x1="6" y1="28" x2="50" y2="28" />
      <circle cx="16" cy="19" r="3" fill="#207448" />
      <circle cx="16" cy="37" r="3" fill="#207448" />
      <line x1="28" y1="19" x2="42" y2="19" />
      <line x1="28" y1="37" x2="42" y2="37" />
    </g>
    <text x="110" y="58" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">dataset 2 PB all hot at</tspan>
      <tspan x="110" dy="70" font-size="26" fill="#303a36">0.10 dollars per GB-month</tspan>
      <tspan x="110" dy="80" font-size="32" font-weight="bold" fill="#207448">= 200,000 dollars</tspan>
    </text>
  </g>

  
  <g transform="translate(1000, 433)">
    <rect width="550" height="296" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 30)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28 6 6 18 28 30 50 18 28 6" />
      <polyline points="6 28 28 40 50 28" />
      <polyline points="6 38 28 50 50 38" />
    </g>
    <text x="110" y="58" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">tiered:</tspan>
      <tspan x="110" dy="70" font-size="25" fill="#303a36">10 percent hot at 0.10 plus rest at 0.02</tspan>
      <tspan x="110" dy="80" font-size="32" font-weight="bold" fill="#207448">= 56,000 dollars</tspan>
    </text>
  </g>

  

  
  <g transform="translate(50, 760)">
    <rect width="1500" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(32, 52)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 32a10 10 0 0 1 18-6 12 12 0 0 1 22 4 8 8 0 0 1-4 16H10a8 8 0 0 1-2-14z" />
      <polyline points="38 46 48 46 48 36" />
    </g>
    <text x="114" y="65" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="28" font-weight="bold" fill="#207448">object store (cold) to parallel file system (hot) to node NVMe cache to GPU data loaders;</tspan>
      <tspan x="114" dy="48" font-size="26" fill="#303a36">async checkpoint copies to host memory then writes in the background</tspan>
    </text>
  </g>

  

  
  <g transform="translate(50, 950)">
    <rect width="1500" height="180" rx="14" fill="#207448" stroke="#185635" stroke-width="2" />
    
    <g transform="translate(36, 62)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 26a14 14 0 1 1 24 0c-3 4-5 7-5 12H21c0-5-2-8-5-12z" />
      <line x1="21" y1="44" x2="35" y2="44" />
      <line x1="24" y1="50" x2="32" y2="50" />
      <line x1="28" y1="4" x2="28" y2="8" />
      <line x1="10" y1="12" x2="14" y2="15" />
      <line x1="46" y1="12" x2="42" y2="15" />
    </g>
    <text x="120" y="74" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="32" font-weight="bold" fill="#ffffff">the average is tiny but the write must finish fast,</tspan>
      <tspan x="120" dy="52" font-size="30" font-weight="bold" fill="#e8f1ea">or the GPUs stall (expensive hardware waits idle)</tspan>
    </text>
  </g>

</svg>