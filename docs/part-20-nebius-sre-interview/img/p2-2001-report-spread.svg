<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Candidate reports disagree on rounds and duration</title>
  <desc>Visual comparison showing the variance between the official interview process description and actual candidate experiences across different locations.</desc>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Candidate reports disagree on rounds and duration</text>

  
  <g id="official-box">
    <rect x="60" y="105" width="720" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 135)">
      <path d="M 28,4 L 48,12 L 48,32 C 48,46 28,54 28,54 C 28,54 8,46 8,32 L 8,12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 20,28 L 26,34 L 38,22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <rect x="640" y="120" width="115" height="36" rx="6" fill="#207448" />
    <text x="697" y="146" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[official]</text>
    
    <text x="160" y="160" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan x="160" dy="0" font-weight="bold">Official page: three technical interviews</tspan>
      <tspan x="160" dy="36">plus a final hour, days</tspan>
    </text>
  </g>

  
  <g id="reports-box">
    <rect x="820" y="105" width="720" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(845, 135)">
      <rect x="10" y="6" width="36" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="18" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="38" x2="30" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <rect x="1415" y="120" width="105" height="36" rx="6" fill="#207448" />
    <text x="1467" y="146" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">[report]</text>
    
    <text x="920" y="160" font-family="sans-serif" font-size="26" fill="#303a36">
      <tspan x="920" dy="0" font-weight="bold">Candidate reports: 4 to 7 rounds,</tspan>
      <tspan x="920" dy="36">a week to 3 months</tspan>
    </text>
  </g>

  
  <g id="range-axis-section">
    <rect x="60" y="265" width="1480" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <text x="800" y="305" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Number of rounds</text>

    
    <line x1="300" y1="365" x2="1300" y2="365" stroke="#e8f1ea" stroke-width="8" stroke-linecap="round" />

    
    <rect x="350" y="353" width="900" height="24" rx="12" fill="#207448" />

    
    <rect x="343" y="335" width="14" height="60" rx="7" fill="#db8129" />

    
    
    <line x1="350" y1="380" x2="350" y2="395" stroke="#303a36" stroke-width="3" />
    <text x="350" y="424" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">4</text>

    
    <line x1="650" y1="380" x2="650" y2="395" stroke="#303a36" stroke-width="3" />
    <text x="650" y="424" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">5</text>

    
    <line x1="950" y1="380" x2="950" y2="395" stroke="#303a36" stroke-width="3" />
    <text x="950" y="424" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">6</text>

    
    <line x1="1250" y1="380" x2="1250" y2="395" stroke="#303a36" stroke-width="3" />
    <text x="1250" y="424" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">7</text>
  </g>

  
  
  <g id="card-amsterdam">
    <rect x="60" y="465" width="349" height="435" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(85, 490)">
      <polygon points="28,6 52,50 4,50" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="22" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="42" r="2.5" fill="#db8129" />
    </g>
    
    <text x="85" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0" font-weight="bold">Amsterdam SRE:</tspan>
      <tspan x="85" dy="34">four stages,</tspan>
      <tspan x="85" dy="34">30-minute</tspan>
      <tspan x="85" dy="34">production-incident</tspan>
      <tspan x="85" dy="34">stress interview,</tspan>
      <tspan x="85" dy="34" font-weight="bold" fill="#db8129">hardest,</tspan>
      <tspan x="85" dy="34" font-weight="bold" fill="#db8129">prepare for this one</tspan>
    </text>
  </g>

  
  <g id="card-dublin">
    <rect x="437" y="465" width="349" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(462, 490)">
      <path d="M 12,28 C 12,18 20,10 28,10 C 36,10 44,18 44,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <rect x="8" y="26" width="8" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="40" y="26" width="8" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 44,38 L 44,46 C 44,50 38,50 34,50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="462" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="462" dy="0" font-weight="bold">Dublin SRE or</tspan>
      <tspan x="462" dy="34" font-weight="bold">DevOps:</tspan>
      <tspan x="462" dy="34">recruiter screen,</tspan>
      <tspan x="462" dy="34">up to six or</tspan>
      <tspan x="462" dy="34">seven rounds</tspan>
    </text>
  </g>

  
  <g id="card-london">
    <rect x="814" y="465" width="349" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(839, 490)">
      <rect x="8" y="8" width="40" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 22,24 C 22,20 28,18 28,22 C 28,26 24,28 24,32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="24" cy="38" r="2.5" fill="#207448" />
    </g>
    
    <text x="839" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="839" dy="0" font-weight="bold">London Senior SRE:</tspan>
      <tspan x="839" dy="34">five rounds,</tspan>
      <tspan x="839" dy="34">mostly junior-level</tspan>
      <tspan x="839" dy="34">questions</tspan>
    </text>
  </g>

  
  <g id="card-czech">
    <rect x="1191" y="465" width="349" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1216, 490)">
      <rect x="8" y="10" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="8" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="6" x2="18" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="6" x2="38" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="20" cy="32" r="3" fill="#207448" />
      <circle cx="32" cy="32" r="3" fill="#207448" />
      <circle cx="20" cy="40" r="3" fill="#207448" />
    </g>
    
    <text x="1216" y="580" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1216" dy="0" font-weight="bold">Czech Senior SRE,</tspan>
      <tspan x="1216" dy="34" font-weight="bold">June 2025:</tspan>
      <tspan x="1216" dy="34">about a week,</tspan>
      <tspan x="1216" dy="34">no offer</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway">
    <rect x="60" y="930" width="1480" height="75" rx="10" fill="#207448" />
    <text x="800" y="977" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Read the reports as a range, not as promises.</text>
  </g>
</svg>