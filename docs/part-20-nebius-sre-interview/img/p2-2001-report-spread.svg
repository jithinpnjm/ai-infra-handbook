<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Candidate reports disagree on rounds and duration</title>
  <desc>Infographic comparing official interview duration expectations against candidate reports and varied experiences across locations.</desc>

  
  <rect width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Candidate reports disagree on rounds and duration</text>

  
  
  <g id="official-box">
    <rect x="75" y="145" width="705" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="105" y="170" width="130" height="38" rx="8" fill="#207448" />
    <text x="170" y="197" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">[official]</text>
    <text x="105" y="244" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Official page: three technical interviews</text>
    <text x="105" y="278" font-family="sans-serif" font-size="26" fill="#303a36">plus a final hour, days</text>
  </g>

  
  <g id="report-box">
    <rect x="820" y="145" width="705" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="850" y="170" width="130" height="38" rx="8" fill="#207448" />
    <text x="915" y="197" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">[report]</text>
    <text x="850" y="244" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Candidate reports: 4 to 7 rounds,</text>
    <text x="850" y="278" font-family="sans-serif" font-size="26" fill="#303a36">a week to 3 months</text>
  </g>

  
  <g id="range-section">
    <rect x="75" y="335" width="1450" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="110" y="385" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Number of rounds</text>

    
    <line x1="420" y1="475" x2="1380" y2="475" stroke="#ccd7ce" stroke-width="4" stroke-linecap="round" />

    
    <rect x="450" y="460" width="900" height="30" rx="8" fill="#207448" />

    
    <rect x="442" y="435" width="16" height="80" rx="6" fill="#db8129" />
    <text x="450" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">(shown as 4 stages)</text>

    
    
    <line x1="450" y1="460" x2="450" y2="500" stroke="#ffffff" stroke-width="3" />
    <text x="450" y="535" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">4</text>

    
    <line x1="750" y1="460" x2="750" y2="490" stroke="#ffffff" stroke-width="3" />
    <text x="750" y="535" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">5</text>

    
    <line x1="1050" y1="460" x2="1050" y2="490" stroke="#ffffff" stroke-width="3" />
    <text x="1050" y="535" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">6</text>

    
    <line x1="1350" y1="460" x2="1350" y2="490" stroke="#ffffff" stroke-width="3" />
    <text x="1350" y="535" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">7</text>
  </g>

  
  
  <g id="card-amsterdam">
    <rect x="75" y="605" width="345" height="485" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(105, 635)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 4 L52 48 L4 48 Z" />
      <line x1="28" y1="20" x2="28" y2="34" />
      <circle cx="28" cy="42" r="1.5" fill="#db8129" />
    </g>
    
    <text x="105" y="730" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Amsterdam SRE:</text>
    <text x="105" y="770" font-family="sans-serif" font-size="24" fill="#303a36">four stages,</text>
    <text x="105" y="810" font-family="sans-serif" font-size="24" fill="#303a36">30-minute</text>
    <text x="105" y="850" font-family="sans-serif" font-size="24" fill="#303a36">production-incident</text>
    <text x="105" y="890" font-family="sans-serif" font-size="24" fill="#303a36">stress interview,</text>
    <text x="105" y="930" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">hardest, prepare</text>
    <text x="105" y="970" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">for this one</text>
  </g>

  
  <g id="card-dublin">
    <rect x="445" y="605" width="345" height="485" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(475, 635)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="24" r="16" />
      <path d="M12 28 C6 28 6 42 12 44" />
      <path d="M44 28 C50 28 50 42 44 44 L36 44" />
    </g>
    
    <text x="475" y="730" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Dublin SRE or</text>
    <text x="475" y="766" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">DevOps:</text>
    <text x="475" y="810" font-family="sans-serif" font-size="24" fill="#303a36">recruiter screen,</text>
    <text x="475" y="850" font-family="sans-serif" font-size="24" fill="#303a36">up to six or seven</text>
    <text x="475" y="890" font-family="sans-serif" font-size="24" fill="#303a36">rounds</text>
  </g>

  
  <g id="card-london">
    <rect x="815" y="605" width="345" height="485" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(845, 635)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="44" rx="4" />
      <line x1="16" y1="18" x2="38" y2="18" />
      <line x1="16" y1="28" x2="38" y2="28" />
      <line x1="16" y1="38" x2="28" y2="38" />
    </g>
    
    <text x="845" y="730" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">London Senior SRE:</text>
    <text x="845" y="770" font-family="sans-serif" font-size="24" fill="#303a36">five rounds,</text>
    <text x="845" y="810" font-family="sans-serif" font-size="24" fill="#303a36">mostly</text>
    <text x="845" y="850" font-family="sans-serif" font-size="24" fill="#303a36">junior-level</text>
    <text x="845" y="890" font-family="sans-serif" font-size="24" fill="#303a36">questions</text>
  </g>

  
  <g id="card-czech">
    <rect x="1185" y="605" width="345" height="485" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1215, 635)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="40" rx="4" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="18" y1="4" x2="18" y2="12" />
      <line x1="38" y1="4" x2="38" y2="12" />
      <line x1="22" y1="32" x2="34" y2="42" />
      <line x1="34" y1="32" x2="22" y2="42" />
    </g>
    
    <text x="1215" y="730" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Czech Senior SRE,</text>
    <text x="1215" y="766" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">June 2025:</text>
    <text x="1215" y="810" font-family="sans-serif" font-size="24" fill="#303a36">about a week,</text>
    <text x="1215" y="850" font-family="sans-serif" font-size="24" fill="#303a36">no offer</text>
  </g>

  
  <g id="bottom-takeaway">
    <rect x="75" y="1125" width="1455" height="85" rx="14" fill="#207448" />
    <text x="802" y="1178" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Read the reports as a range, not as promises.</text>
  </g>
</svg>