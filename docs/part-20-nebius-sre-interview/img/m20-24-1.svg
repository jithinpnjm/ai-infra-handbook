  <rect x="460" y="707" width="180" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="550" y="725" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" dominant-baseline="central">cluster_id</text>

  
  <rect x="960" y="707" width="180" height="36" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1050" y="725" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" dominant-baseline="central">cluster_id</text>

  
