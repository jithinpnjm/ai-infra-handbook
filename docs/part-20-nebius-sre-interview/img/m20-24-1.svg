<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>State splitting and blast radius</title>
  <desc>Architecture diagram illustrating Terraform state splitting across remote state bucket, networking, cloud stage, and regional platform stages to minimize blast radius.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">State splitting and blast radius</text>

  
   N -->
  <path d="M 800 240 V 300" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

   C -->
  <path d="M 520 205 H 400 V 605 H 520" stroke="#207448" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />

   P1 -->
  <path d="M 520 175 H 80 V 850 H 200" stroke="#207448" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />

   P2 -->
  <path d="M 1080 175 H 1520 V 850 H 1400" stroke="#207448" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />

  |"outputs"| C -->
  <path d="M 800 430 V 540" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  |"cluster_id"| P1 -->
  <path d="M 640 670 V 725 H 460 V 780" stroke="#207448" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />

  |"cluster_id"| P2 -->
  <path d="M 960 670 V 725 H 1140 V 780" stroke="#207448" stroke-width="3" stroke-linejoin="round" fill="none" marker-end="url(#arrow)" />

  
  
