<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The first two minutes: a timed opening script</title>
  <desc>A horizontal timeline showing five opening markers from 0:00 to 2:00 for incident response.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The first two minutes: a timed opening script</text>

  
  <rect x="380" y="105" width="840" height="60" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Silence is not a plan: say what you will do</text>

  
  
  <g transform="translate(180, 235)">
    <circle cx="0" cy="0" r="22" stroke="#207448" stroke-width="4" fill="none"/>
    <circle cx="0" cy="0" r="10" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="0" y1="-28" x2="0" y2="-18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="-18" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="28" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <g transform="translate(494, 235)">
    <path d="M -24,14 A 24,24 0 1,1 24,14" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="14" y2="-8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="4" fill="#207448"/>
  </g>

  
  <g transform="translate(808, 235)">
    <path d="M -12,-5 L 12,-17 L 12,17 L -12,5 Z" stroke="#207448" stroke-width="4" stroke-linejoin="round" fill="none"/>
    <rect x="-20" y="-5" width="8" height="10" rx="2" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="-6" y1="5" x2="-6" y2="21" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 18,-8 A 10,10 0 0,1 18,8" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  
  <g transform="translate(1122, 235)">
    <circle cx="0" cy="0" r="22" stroke="#db8129" stroke-width="4" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="0" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#db8129"/>
  </g>

  
  <g transform="translate(1436, 235)">
    <path d="M 0,22 L 0,2 Q 0,-12 -14,-12 L -20,-12" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -14,-18 L -22,-12 L -14,-6" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0,2 Q 0,-12 14,-12 L 20,-12" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 14,-18 L 22,-12 L 14,-6" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="22" r="3" fill="#207448"/>
  </g>

  
  <line x1="90" y1="330" x2="1520" y2="330" stroke="#207448" stroke-width="6"/>
  <polygon points="1516,318 1540,330 1516,342" fill="#207448"/>

  
  
  <circle cx="180" cy="330" r="44" fill="#207448"/>
  <text x="180" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">0:00</text>

  
  <circle cx="494" cy="330" r="44" fill="#207448"/>
  <text x="494" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">0:30</text>

  
  <circle cx="808" cy="330" r="44" fill="#207448"/>
  <text x="808" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">1:00</text>

  
  <circle cx="1122" cy="330" r="52" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="1122" cy="330" r="44" fill="#207448" stroke="#db8129" stroke-width="6"/>
  <text x="1122" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">1:30</text>

  
  <circle cx="1436" cy="330" r="44" fill="#207448"/>
  <text x="1436" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">2:00</text>

  
  
  <path d="M 52,405 L 166,405 L 180,385 L 194,405 L 308,405 Q 322,405 322,419 L 322,681 Q 322,695 308,695 L 52,695 Q 38,695 38,681 L 38,419 Q 38,405 52,405 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="180" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Confirming</tspan>
    <tspan x="180" dy="38">impact: who,</tspan>
    <tspan x="180" dy="38">how bad,</tspan>
    <tspan x="180" dy="38">since when?</tspan>
  </text>

  
  <path d="M 366,405 L 480,405 L 494,385 L 508,405 L 622,405 Q 636,405 636,419 L 636,681 Q 636,695 622,695 L 366,695 Q 352,695 352,681 L 352,419 Q 352,405 366,405 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="494" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="494" dy="0">Can I see the</tspan>
    <tspan x="494" dy="38">golden-signals</tspan>
    <tspan x="494" dy="38">dashboard?</tspan>
  </text>

  
  <path d="M 680,405 L 794,405 L 808,385 L 822,405 L 936,405 Q 950,405 950,419 L 950,681 Q 950,695 936,695 L 680,695 Q 666,695 666,681 L 666,419 Q 666,405 680,405 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="808" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="808" dy="0">Declaring SEV2.</tspan>
    <tspan x="808" dy="36">I am commander</tspan>
    <tspan x="808" dy="36">and ops. Comms</tspan>
    <tspan x="808" dy="36">updates every</tspan>
    <tspan x="808" dy="36">ten minutes.</tspan>
  </text>

  
  <path d="M 994,405 L 1108,405 L 1122,385 L 1136,405 L 1250,405 Q 1264,405 1264,419 L 1264,681 Q 1264,695 1250,695 L 994,695 Q 980,695 980,681 L 980,419 Q 980,405 994,405 Z" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  <text x="1122" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1122" dy="0">What changed</tspan>
    <tspan x="1122" dy="40">in the last day?</tspan>
  </text>

  
  <path d="M 1308,405 L 1422,405 L 1436,385 L 1450,405 L 1564,405 Q 1578,405 1578,419 L 1578,681 Q 1578,695 1564,695 L 1308,695 Q 1294,695 1294,681 L 1294,419 Q 1294,405 1308,405 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1436" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1436" dy="0">My first</tspan>
    <tspan x="1436" dy="34">mitigation</tspan>
    <tspan x="1436" dy="34">options are</tspan>
    <tspan x="1436" dy="34">rollback or</tspan>
    <tspan x="1436" dy="34">traffic shift,</tspan>
    <tspan x="1436" dy="34">pending what</tspan>
    <tspan x="1436" dy="34">I see.</tspan>
  </text>

  
  
  <rect x="352" y="725" width="284" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="494" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="494" dy="0">Rate, errors,</tspan>
    <tspan x="494" dy="38">latency and</tspan>
    <tspan x="494" dy="38">saturation</tspan>
  </text>

  
  <rect x="666" y="725" width="284" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="808" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="808" dy="0">Roles and</tspan>
    <tspan x="808" dy="38">cadence set</tspan>
    <tspan x="808" dy="38">early</tspan>
  </text>

  
  <rect x="980" y="725" width="284" height="270" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="1122" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1122" dy="0">Recent change</tspan>
    <tspan x="1122" dy="38">is the cheapest</tspan>
    <tspan x="1122" dy="38">hypothesis</tspan>
  </text>

  
  <rect x="1294" y="725" width="284" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1436" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1436" dy="0">Shows you think</tspan>
    <tspan x="1436" dy="38">about users</tspan>
    <tspan x="1436" dy="38">first</tspan>
  </text>

  
  <rect x="40" y="1035" width="1520" height="110" rx="16" fill="#207448"/>
  <text x="800" y="1080" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">Commander, operations, communication and planning: you play all four,</tspan>
    <tspan x="800" dy="38">and only operations changes the system.</tspan>
  </text>
</svg>