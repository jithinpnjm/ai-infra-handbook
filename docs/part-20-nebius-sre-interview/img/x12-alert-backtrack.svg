<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Working backwards from a live alert to the token count</title>
  <desc>Infographic illustrating how to work backwards from a KV-cache usage alert and request count to estimate token count per request and identify prompt length divergence.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Working backwards from a live alert to the token count</text>

  
  <g id="live-indicators">
    
    <rect x="280" y="115" width="480" height="72" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(305, 126)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 38 A 22 22 0 1 1 44 38" />
      <line x1="25" y1="25" x2="38" y2="15" />
      <circle cx="25" cy="25" r="3" fill="#207448" />
    </g>
    <text x="375" y="159" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">KV-cache usage 95 percent</text>

    
    <rect x="840" y="115" width="480" height="72" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(865, 126)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="46" height="38" rx="6" />
      <line x1="2" y1="16" x2="48" y2="16" />
      <circle cx="10" cy="10" r="2.5" fill="#207448" />
      <circle cx="17" cy="10" r="2.5" fill="#207448" />
      <circle cx="24" cy="10" r="2.5" fill="#207448" />
    </g>
    <text x="935" y="159" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">60 requests running</text>
  </g>

  
  <g id="box-1">
    <rect x="55" y="230" width="230" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="95" cy="274" r="22" fill="#207448" />
    <text x="95" y="282" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(195, 248)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="10" rx="20" ry="7" />
      <path d="M 4 10 L 4 42 A 20 7 0 0 0 44 42 L 44 10" />
      <path d="M 4 26 A 20 7 0 0 0 44 26" />
    </g>
    <text x="170" y="360" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">KV budget</tspan>
      <tspan x="170" dy="34">50.6 GB</tspan>
    </text>
    <text x="170" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#667770">
      <tspan x="170" dy="0">with 95 percent</tspan>
      <tspan x="170" dy="28">in use</tspan>
    </text>
    <text x="170" y="525" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">about 48.07 GB</text>
  </g>

  
  <g id="arrow-1">
    <rect x="297" y="335" width="166" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="380" y="372" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="380" dy="0">divide by</tspan>
      <tspan x="380" dy="30">60 requests</tspan>
    </text>
    <line x1="285" y1="465" x2="475" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="box-2">
    <rect x="475" y="230" width="230" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="515" cy="274" r="22" fill="#207448" />
    <text x="515" y="282" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(615, 248)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="18" rx="4" />
      <rect x="4" y="28" width="40" height="18" rx="4" />
      <circle cx="12" cy="15" r="2.5" fill="#207448" />
      <circle cx="12" cy="37" r="2.5" fill="#207448" />
      <line x1="20" y1="15" x2="36" y2="15" />
      <line x1="20" y1="37" x2="36" y2="37" />
    </g>
    <text x="590" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="590" dy="0">0.80 GB</tspan>
      <tspan x="590" dy="38" font-size="26" font-weight="normal" fill="#303a36">per request</tspan>
    </text>
  </g>

  
  <g id="arrow-2">
    <rect x="717" y="300" width="166" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="332" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">divide by</tspan>
      <tspan x="800" dy="28">147,456</tspan>
      <tspan x="800" dy="28">bytes</tspan>
      <tspan x="800" dy="28">per token</tspan>
    </text>
    <line x1="705" y1="465" x2="895" y2="465" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="box-3">
    <rect x="895" y="230" width="230" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="935" cy="274" r="22" fill="#207448" />
    <text x="935" y="282" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(1035, 248)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="16" height="16" rx="3" />
      <rect x="26" y="6" width="16" height="16" rx="3" />
      <rect x="6" y="26" width="16" height="16" rx="3" />
      <rect x="26" y="26" width="16" height="16" rx="3" />
    </g>
    <text x="1010" y="405" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="1010" dy="0">about 5,430</tspan>
      <tspan x="1010" dy="36" font-size="24" font-weight="normal" fill="#303a36">tokens</tspan>
      <tspan x="1010" dy="30" font-size="24" font-weight="normal" fill="#303a36">per request</tspan>
    </text>
  </g>

  
  <g id="arrow-3">
    <line x1="1125" y1="395" x2="1315" y2="395" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
  </g>

  
  <g id="box-4">
    <rect x="1315" y="230" width="230" height="330" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <circle cx="1355" cy="274" r="22" fill="#207448" />
    <text x="1355" y="282" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(1455, 248)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 6 L 44 42 L 4 42 Z" />
      <line x1="24" y1="18" x2="24" y2="28" />
      <circle cx="24" cy="35" r="1.5" fill="#db8129" />
    </g>
    <text x="1430" y="375" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1430" dy="0">planned</tspan>
      <tspan x="1430" dy="32">2,500 tokens</tspan>
    </text>
    <text x="1430" y="470" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      <tspan x="1430" dy="0">live more than</tspan>
      <tspan x="1430" dy="32">twice that</tspan>
    </text>
  </g>

  
  <g id="actions-below-box-4">
    
    <rect x="1285" y="585" width="260" height="305" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="1295" y="600" width="240" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1415" y="628" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1415" dy="0">check the</tspan>
      <tspan x="1415" dy="26">prompt-length</tspan>
      <tspan x="1415" dy="26">histogram</tspan>
    </text>

    
    <rect x="1295" y="700" width="240" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1415" y="728" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1415" dy="0">lower the</tspan>
      <tspan x="1415" dy="26">batch ceiling,</tspan>
      <tspan x="1415" dy="26">shed or queue</tspan>
    </text>

    
    <rect x="1295" y="820" width="240" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1415" y="856" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">add replicas</text>
  </g>

  
  <rect x="55" y="925" width="1490" height="70" rx="12" fill="#207448" />
  <text x="800" y="969" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">the estimate tells you which question to ask in ten seconds</text>
</svg>