<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Standard library results you must know exactly</title>
  <desc>Standard library results you must know exactly</desc>

  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Standard library results you must know exactly</text>

  
  <g id="top-banner">
    <rect x="60" y="95" width="1480" height="58" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="133" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Know what it returns on the edge cases, not only its name.</text>
  </g>

  
  <g id="column-headers">
    <text x="160" y="205" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Call</text>
    <text x="930" y="205" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Verified result</text>
  </g>

  
  <g id="row-1">
    <rect x="60" y="235" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 265)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="10" y="22" width="8" height="24" fill="#207448"/>
      <rect x="24" y="12" width="8" height="34" fill="#207448"/>
      <rect x="38" y="30" width="8" height="16" fill="#207448"/>
    </g>
    <line x1="900" y1="235" x2="900" y2="350" stroke="#c4d9c8" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="302" font-family="monospace" font-size="24" fill="#303a36">Counter(&quot;abracadabra&quot;).most_common(2)</text>
    <text x="930" y="302" font-family="monospace" font-size="24" fill="#303a36">[(&apos;a&apos;, 5), (&apos;b&apos;, 2)]</text>
  </g>

  
  <g id="row-2">
    <rect x="60" y="370" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 400)">
      <circle cx="18" cy="28" r="12" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="18" cy="28" r="4" fill="#207448"/>
      <path d="M 30 28 L 48 28 L 48 36 M 40 28 L 40 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <line x1="900" y1="370" x2="900" y2="485" stroke="#c4d9c8" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="437" font-family="monospace" font-size="24" fill="#303a36">Counter()[&quot;z&quot;] for a missing key</text>
    <text x="930" y="437" font-family="monospace" font-size="24" fill="#303a36">0, and the key is not added</text>
  </g>

  
  <g id="row-3">
    <rect x="60" y="505" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 535)">
      <rect x="4" y="14" width="48" height="28" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 16 28 L 40 28" stroke="#207448" stroke-width="3"/>
      <path d="M 12 22 L 6 28 L 12 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 44 22 L 50 28 L 44 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="900" y1="505" x2="900" y2="620" stroke="#c4d9c8" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="572" font-family="monospace" font-size="24" fill="#303a36">deque([1,2,3], maxlen=3), append(4), appendleft(0)</text>
    <text x="930" y="572" font-family="monospace" font-size="24" fill="#303a36">[0, 2, 3], items fall off the other end</text>
  </g>

  
  <g id="row-4">
    <rect x="60" y="640" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 670)">
      <circle cx="28" cy="12" r="7" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="14" cy="42" r="6" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="42" cy="42" r="6" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="23" y1="18" x2="17" y2="36" stroke="#207448" stroke-width="2.5"/>
      <line x1="33" y1="18" x2="39" y2="36" stroke="#207448" stroke-width="2.5"/>
    </g>
    <line x1="900" y1="640" x2="900" y2="755" stroke="#c4d9c8" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="707" font-family="monospace" font-size="24" fill="#303a36">heapq.heapify then heappop on [5,1,4]</text>
    <text x="930" y="707" font-family="monospace" font-size="24" fill="#303a36">pops 1, so it is a min-heap</text>
  </g>

  
  <g id="row-5">
    <rect x="60" y="775" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(80, 805)">
      <rect x="6" y="24" width="14" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="21" y="10" width="14" height="38" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="36" y="18" width="14" height="30" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <line x1="900" y1="775" x2="900" y2="890" stroke="#c4d9c8" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="842" font-family="monospace" font-size="24" fill="#303a36">heapq.nlargest(2, [5,1,4,9])</text>
    <text x="930" y="842" font-family="monospace" font-size="24" fill="#303a36">[9, 5]</text>
  </g>

  
  <g id="row-6">
    <rect x="60" y="910" width="1480" height="115" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(80, 940)">
      <rect x="4" y="8" width="48" height="40" rx="6" fill="none" stroke="#db8129" stroke-width="3"/>
      <line x1="28" y1="4" x2="28" y2="52" stroke="#db8129" stroke-width="3" stroke-dasharray="4 3"/>
      <circle cx="16" cy="28" r="4" fill="#db8129"/>
      <circle cx="40" cy="28" r="4" fill="#db8129"/>
    </g>
    <line x1="900" y1="910" x2="900" y2="1025" stroke="#f0cfb3" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="160" y="977" font-family="monospace" font-size="24" fill="#303a36">bisect_left and bisect_right for 2 in [1,2,2,2,5]</text>
    <text x="930" y="977" font-family="monospace" font-size="24" fill="#303a36">1 and 4</text>
  </g>
</svg>