<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three layers that catch nodes that never rejoin</title>
  <desc>Infographic explaining the five failure modes where nodes go missing and the three defence layers that detect and mitigate them.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three layers that catch nodes that never rejoin</text>

  
  <rect x="50" y="115" width="1500" height="375" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="70" y="95" width="400" height="42" rx="8" fill="#207448"/>
  <text x="270" y="124" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">looks normal from far away</text>

  
  <rect x="75" y="160" width="274" height="305" rx="12" fill="#e8f1ea" stroke="#b0ceb7" stroke-width="1.5"/>
  
  <g transform="translate(184, 182)">
    <line x1="10" y1="36" x2="10" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="46" y1="36" x2="46" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <rect x="2" y="0" width="52" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="36" x2="32" y2="0" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="36" x2="48" y2="0" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="212" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="212" dy="0">cordoned, the</tspan>
    <tspan x="212" dy="32">uncordon step</tspan>
    <tspan x="212" dy="32">never ran</tspan>
  </text>

  
  <rect x="369" y="160" width="274" height="305" rx="12" fill="#e8f1ea" stroke="#b0ceb7" stroke-width="1.5"/>
  
  <g transform="translate(478, 182)">
    <line x1="12" y1="44" x2="32" y2="24" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    <path d="M 26 18 C 26 11 34 5 42 7 L 37 15 L 43 21 L 51 16 C 53 24 47 32 40 32 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="12,4 4,17 14,17 8,29" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="506" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="506" dy="0">passed repair</tspan>
    <tspan x="506" dy="30">but the</tspan>
    <tspan x="506" dy="30">validation job</tspan>
    <tspan x="506" dy="30">crashed and</tspan>
    <tspan x="506" dy="30">nobody read</tspan>
    <tspan x="506" dy="30">the result</tspan>
  </text>

  
  <rect x="663" y="160" width="274" height="305" rx="12" fill="#e8f1ea" stroke="#b0ceb7" stroke-width="1.5"/>
  
  <g transform="translate(772, 182)">
    <rect x="4" y="0" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="18" y1="34" x2="12" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="34" x2="44" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="8" y1="48" x2="48" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="10,17 18,17 23,8 31,26 36,17 46,17" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">came back</tspan>
    <tspan x="800" dy="32">but its</tspan>
    <tspan x="800" dy="32">readiness probe</tspan>
    <tspan x="800" dy="32">never passed</tspan>
  </text>

  
  <rect x="957" y="160" width="274" height="305" rx="12" fill="#e8f1ea" stroke="#b0ceb7" stroke-width="1.5"/>
  
  <g transform="translate(1066, 182)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="2" x2="40" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="48" x2="16" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="48" x2="40" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="16" x2="54" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="40" x2="54" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1094" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1094" dy="0">device plugin</tspan>
    <tspan x="1094" dy="32">did not</tspan>
    <tspan x="1094" dy="32">re-register</tspan>
    <tspan x="1094" dy="32">its GPUs</tspan>
  </text>

  
  <rect x="1251" y="160" width="274" height="305" rx="12" fill="#e8f1ea" stroke="#b0ceb7" stroke-width="1.5"/>
  
  <g transform="translate(1360, 182)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="0" x2="28" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="42" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="14" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="42" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  <text x="1388" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1388" dy="0">aggressive</tspan>
    <tspan x="1388" dy="32">liveness probe</tspan>
    <tspan x="1388" dy="32">killed healthy</tspan>
    <tspan x="1388" dy="32">workers</tspan>
  </text>

  
  <line x1="800" y1="490" x2="800" y2="540" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="50" y="545" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(80, 592)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,12 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="165" y="605" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Layer 1: </tspan>
    <tspan font-size="26">time limit on every non-healthy state, </tspan>
    <tspan font-family="monospace" font-size="26" font-weight="bold">stuck()</tspan>
    <tspan font-size="26"> in the code and </tspan>
    <tspan x="165" dy="50" font-family="monospace" font-size="26" font-weight="bold">NodeCordonedTooLong</tspan>
    <tspan font-size="26"> in Prometheus: catches a forgotten node</tspan>
  </text>

  
  <line x1="800" y1="695" x2="800" y2="720" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="50" y="725" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(80, 772)">
    <rect x="6" y="2" width="44" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="16" y1="16" x2="38" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="40" x2="28" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="165" y="785" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Layer 2: </tspan>
    <tspan font-size="26">compare GPUs the cluster advertises with GPUs the inventory says exist:</tspan>
    <tspan x="165" dy="50" font-size="26">catches a node whose state was never recorded</tspan>
  </text>

  
  <line x1="800" y1="875" x2="800" y2="900" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="50" y="905" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(80, 952)">
    <path d="M 6 12 L 28 4 L 50 12 C 50 38 28 52 28 52 C 28 52 6 38 6 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="165" y="965" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">Layer 3: </tspan>
    <tspan font-size="26">a missing node still holds its slot in the limiter budget:</tspan>
    <tspan x="165" dy="50" font-size="26">stops automation from draining healthy capacity</tspan>
  </text>

  
  <line x1="800" y1="1055" x2="800" y2="1085" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="50" y="1090" width="1500" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1137" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">alert on the distance between GPUs you own and GPUs actually serving, not only on errors</text>
</svg>