<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Host looks healthy, container hits its own cgroup limit</title>
  <desc>Visual infographic contrasting healthy host-level free memory with a container hitting its isolated cgroup memory and PID limits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Host looks healthy, container hits its own cgroup limit</text>

  
  <g transform="translate(90, 105)">
    <rect width="430" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(25, 20)">
      <circle cx="20" cy="20" r="15" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="31" y1="31" x2="45" y2="45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="88" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      Host-level <tspan font-family="ui-monospace, monospace">free</tspan>
      <tspan x="88" dy="32">shows no problem</tspan>
    </text>
  </g>

  
  <path d="M 305 195 L 305 308" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 240)">
    <rect width="1000" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(30, 22)">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" rx="3" fill="#207448" />
      
      <line x1="18" y1="2" x2="18" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="2" x2="38" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="48" x2="18" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="48" x2="38" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="38" x2="8" y2="38" stroke="#207448" stroke-width="3" />
      <line x1="48" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="48" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="100" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Node (host)</text>

    
    <g transform="translate(30, 80)">
      <rect width="430" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(25, 25)">
        <circle cx="24" cy="24" r="24" fill="#207448" />
        <path d="M 14 24 L 21 31 L 34 17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <text x="88" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan font-family="ui-monospace, monospace">free:</tspan> plenty of
        <tspan x="88" dy="36">memory on the host</tspan>
      </text>

      
      <g transform="translate(25, 130)">
        <rect width="380" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <rect width="70" height="60" rx="8" fill="#207448" opacity="0.3" />
        <rect x="70" width="310" height="60" rx="8" fill="#207448" />
      </g>
    </g>

    
    <g transform="translate(490, 80)">
      <rect width="480" height="330" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(25, 18)">
        <circle cx="12" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="28" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="20" cy="26" r="8" fill="none" stroke="#207448" stroke-width="3" />
      </g>
      
      <text x="70" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod</text>

      
      <g transform="translate(20, 60)">
        <rect width="440" height="250" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
        
        <g transform="translate(20, 12)">
          <rect x="4" y="6" width="30" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
          <line x1="4" y1="14" x2="34" y2="14" stroke="#207448" stroke-width="2" />
          <line x1="14" y1="14" x2="14" y2="32" stroke="#207448" stroke-width="2" />
          <line x1="24" y1="14" x2="24" y2="32" stroke="#207448" stroke-width="2" />
        </g>
        
        <text x="65" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Container</text>

        
        <g id="full-container-bar" transform="translate(20, 55)">
          <rect width="400" height="175" rx="10" fill="#fdf3e7" stroke="#db8129" stroke-width="4" />

          
          <rect x="16" y="105" width="368" height="50" rx="6" fill="#db8129" />

          
          <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
            cgroup limit: <tspan font-family="ui-monospace, monospace">memory.max</tspan>
          </text>
          <text x="20" y="84" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">
            pids.current
          </text>
        </g>
      </g>
    </g>
  </g>

  
  <g transform="translate(1100, 240)">
    <rect width="440" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 24)">
      <rect x="4" y="4" width="32" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="14" x2="28" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="22" x2="28" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="30" x2="22" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="75" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      With only container access,
      <tspan x="24" dy="32">use a privileged debugging</tspan>
      <tspan x="24" dy="32">container with shared</tspan>
      <tspan x="24" dy="32">namespaces.</tspan>
    </text>
  </g>

  
  <g transform="translate(1100, 445)">
    <rect width="440" height="175" rx="14" fill="#fdf3e7" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(25, 30)">
      <polygon points="25,4 46,42 4,42" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <line x1="25" y1="18" x2="25" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="25" cy="35" r="2.5" fill="#db8129" />
    </g>
    
    <text x="88" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      Kill that host-level
      <tspan x="88" dy="38"><tspan font-family="ui-monospace, monospace">free</tspan> never showed</tspan>
    </text>
  </g>

  
  <path d="M 990 532 L 1088 532" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  
  <g transform="translate(60, 715)">
    <rect width="460" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 10 20 L 18 28 L 30 12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="80" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      1 Am I on the host
      <tspan x="80" dy="40">or in a container?</tspan>
    </text>
  </g>

  
  <g transform="translate(570, 715)">
    <rect width="460" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 10 20 L 18 28 L 30 12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="80" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      2 Read the cgroup limit:
      <tspan x="80" dy="38" font-family="ui-monospace, monospace">memory.max</tspan>,
      <tspan x="80" dy="38" font-family="ui-monospace, monospace">pids.current</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 715)">
    <rect width="460" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 10 20 L 18 28 L 30 12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="80" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">3 Events live in </tspan><tspan font-family="ui-monospace, monospace">etcd</tspan> and
      <tspan x="80" dy="32">are kept one hour by default,</tspan>
      <tspan x="80" dy="32">so use logs and metrics</tspan>
      <tspan x="80" dy="32">for older incidents</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 925)">
    <rect width="1480" height="75" rx="12" fill="#207448" />
    <text x="740" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Say whether you are checking the host or the container, and check the limit as a resource.</text>
  </g>
</svg>