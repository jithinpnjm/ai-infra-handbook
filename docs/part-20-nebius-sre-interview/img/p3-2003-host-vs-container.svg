<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Host looks healthy, container hits its own cgroup limit</title>
  <desc>Visual comparison showing ample memory on the host while a container reaches its cgroup memory limit and is killed.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Host looks healthy, container hits its own cgroup limit</text>

  
  <rect x="60" y="110" width="680" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(90, 137)">
    <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="38" y1="38" x2="54" y2="54" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  </g>
  <text x="175" y="175" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Host-level free shows no problem</text>

  
  <rect x="840" y="95" width="700" height="135" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
  
  <g transform="translate(865, 130)">
    <path d="M 6 0 L 32 0 L 46 14 L 46 56 L 6 56 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 32 0 L 32 16 L 46 16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="16" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="38" x2="36" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="935" y="137" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="935" dy="0">With only container access, use a privileged</tspan>
    <tspan x="935" dy="34">debugging container with shared namespaces.</tspan>
  </text>

  
  <path d="M 380 220 L 380 348" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="270" width="1020" height="420" rx="20" fill="#ffffff" stroke="#207448" stroke-width="4" />
  
  
  <g transform="translate(90, 292)">
    <rect x="8" y="8" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="0" x2="34" y2="8" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="44" x2="18" y2="52" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="44" x2="34" y2="52" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="34" x2="8" y2="34" stroke="#207448" stroke-width="3" />
    <line x1="44" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3" />
    <line x1="44" y1="34" x2="52" y2="34" stroke="#207448" stroke-width="3" />
  </g>
  <text x="160" y="328" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Node (host)</text>

  
  <rect x="90" y="360" width="450" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(120, 395)">
    <circle cx="28" cy="28" r="26" fill="#207448" />
    <path d="M 16 28 L 24 36 L 40 18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="190" y="432" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Host Memory Status</text>

  
  <rect x="120" y="475" width="390" height="150" rx="12" fill="#207448" />
  <text x="315" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="315" dy="0">free: plenty of memory</tspan>
    <tspan x="315" dy="36">on the host</tspan>
  </text>

  
  <rect x="570" y="360" width="480" height="300" rx="14" fill="#f5f8f5" stroke="#303a36" stroke-width="2" />
  <text x="600" y="402" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Pod</text>

  
  <rect x="595" y="420" width="430" height="220" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <text x="620" y="456" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Container</text>

  
  <rect x="620" y="475" width="380" height="85" rx="8" fill="#db8129" stroke="#db8129" stroke-width="3" />
  <text x="810" y="527" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">cgroup limit: memory.max</text>

  
  <rect x="620" y="575" width="380" height="45" rx="8" fill="#e8f1ea" />
  <text x="810" y="606" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">pids.current</text>

  
  <path d="M 1000 518 L 1138 518" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <rect x="1150" y="445" width="390" height="150" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <g transform="translate(1175, 485)">
    <circle cx="28" cy="28" r="24" fill="#db8129" />
    <line x1="18" y1="18" x2="38" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="18" x2="18" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1245" y="515" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">
    <tspan x="1245" dy="0">Kill that host-level free</tspan>
    <tspan x="1245" dy="36">never showed</tspan>
  </text>

  
  
  <rect x="60" y="720" width="1480" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="770" r="24" fill="#207448" />
  <text x="115" y="779" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="165" y="779" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">1 Am I on the host or in a container?</text>

  
  <rect x="60" y="840" width="1480" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="890" r="24" fill="#207448" />
  <text x="115" y="899" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="165" y="899" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">2 Read the cgroup limit: memory.max, pids.current</text>

  
  <rect x="60" y="960" width="1480" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="1020" r="24" fill="#207448" />
  <text x="115" y="1029" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="165" y="1008" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">3 Events live in etcd and are kept one hour by default, so use logs and metrics for older incidents</tspan>
  </text>

  
  <rect x="60" y="1110" width="1480" height="100" rx="16" fill="#207448" />
  <text x="800" y="1170" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Say whether you are checking the host or the container, and check the limit as a resource.</text>
</svg>