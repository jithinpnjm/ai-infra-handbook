<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Weights distribution and the custom-weights flow</title>
  <desc>Flowchart illustrating the custom-weights distribution lifecycle from checkpoint upload through validation, evaluation, endpoint update, rollout, and final promotion or rollback.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Weights distribution and the custom-weights flow</text>

  

  
  <path d="M 490 200 L 490 235" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 490 340 L 490 375" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 800 427.5 L 980 427.5" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="890" y="415" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">fail</text>

  
  <path d="M 490 480 L 490 520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="512" y="506" text-anchor="start" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">pass</text>

  
  <path d="M 800 572.5 L 980 572.5" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="890" y="560" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">fail</text>

  
  <path d="M 490 625 L 490 665" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="512" y="651" text-anchor="start" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">pass</text>

  
  <path d="M 490 770 L 490 810" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 640 915 L 640 940 L 1120 940 L 1120 965" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="880" y="930" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">promote</text>

  
  <path d="M 400 915 L 400 965" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="382" y="945" text-anchor="end" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">rollback</text>

  

  
  <g id="node-a">
    <rect x="180" y="115" width="620" height="85" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="157.5" r="24" fill="#207448"/>
    <text x="230" y="166" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 285 168 L 285 176 L 315 176 L 315 168"/>
      <path d="M 300 170 L 300 142"/>
      <path d="M 291 151 L 300 142 L 309 151"/>
    </g>
    <text x="355" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Upload checkpoint</text>
  </g>

  
  <g id="node-b">
    <rect x="180" y="235" width="620" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="287.5" r="24" fill="#207448"/>
    <text x="230" y="296" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="300" cy="272" rx="18" ry="7"/>
      <path d="M 282 272 L 282 298 C 282 305 318 305 318 298 L 318 272"/>
      <path d="M 282 285 C 282 292 318 292 318 285"/>
    </g>
    <text x="355" y="278" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Weights hub</text>
    <text x="355" y="316" font-family="sans-serif" font-size="25" fill="#303a36">immutable version + hash</text>
  </g>

  
  <g id="node-c">
    <rect x="180" y="375" width="620" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="427.5" r="24" fill="#207448"/>
    <text x="230" y="436" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 282 410 L 300 402 L 318 410 L 318 430 C 318 443 300 452 300 452 C 300 452 282 443 282 430 Z"/>
      <path d="M 292 427 L 298 433 L 309 422"/>
    </g>
    <text x="355" y="418" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Validate:</text>
    <text x="355" y="456" font-family="sans-serif" font-size="25" fill="#303a36">hash, arch, tokenizer</text>
  </g>

  
  <g id="node-x">
    <rect x="980" y="375" width="500" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="1230" cy="455" r="25"/>
      <path d="M 1213 438 L 1247 472"/>
      <path d="M 1247 438 L 1213 472"/>
    </g>
    <text x="1230" y="535" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Reject, no GPU used</text>
  </g>

  
  <g id="node-d">
    <rect x="180" y="520" width="620" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="572.5" r="24" fill="#207448"/>
    <text x="230" y="581" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 294 553 L 306 553"/>
      <path d="M 300 553 L 300 567 L 285 590 C 282 595 286 600 292 600 L 308 600 C 314 600 318 595 315 590 L 300 567"/>
      <path d="M 291 588 Q 300 584 309 588"/>
    </g>
    <text x="355" y="563" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Eval on fixed prompts</text>
    <text x="355" y="601" font-family="sans-serif" font-size="25" fill="#303a36">on a scratch replica</text>
  </g>

  
  <g id="node-e">
    <rect x="180" y="665" width="620" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="717.5" r="24" fill="#207448"/>
    <text x="230" y="726" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 285 700 L 306 700 L 315 709 L 315 735 L 285 735 Z"/>
      <path d="M 306 700 L 306 709 L 315 709"/>
      <path d="M 292 718 L 308 718"/>
      <path d="M 292 726 L 304 726"/>
    </g>
    <text x="355" y="708" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Update endpoint spec</text>
    <text x="355" y="746" font-family="sans-serif" font-size="25" fill="#303a36">to new version</text>
  </g>

  
  <g id="node-f">
    <rect x="180" y="810" width="620" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="230" cy="862.5" r="24" fill="#207448"/>
    <text x="230" y="871" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="283" y="865" width="8" height="15" rx="2"/>
      <rect x="296" y="855" width="8" height="25" rx="2"/>
      <rect x="309" y="845" width="8" height="35" rx="2"/>
      <path d="M 281 876 L 297 856 L 318 843"/>
    </g>
    <text x="355" y="853" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rollout:</text>
    <text x="355" y="891" font-family="sans-serif" font-size="25" fill="#303a36">surge, canary, gates</text>
  </g>

  
  <g id="node-h">
    <rect x="140" y="965" width="520" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="220" cy="1015" r="22"/>
      <path d="M 220 1003 L 220 1015 L 231 1015"/>
      <path d="M 213 993 L 221 997 L 221 989 Z" fill="#207448"/>
    </g>
    <text x="275" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Old version kept</text>
  </g>

  
  <g id="node-g">
    <rect x="760" y="965" width="720" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="840" cy="1015" r="22"/>
      <path d="M 818 1015 Q 840 1023 862 1015"/>
      <path d="M 818 1015 Q 840 1007 862 1015"/>
      <path d="M 840 993 C 832 1005 832 1025 840 1037"/>
      <path d="M 840 993 C 848 1005 848 1025 840 1037"/>
    </g>
    <text x="895" y="1025" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">New version serves all</text>
  </g>

</svg>