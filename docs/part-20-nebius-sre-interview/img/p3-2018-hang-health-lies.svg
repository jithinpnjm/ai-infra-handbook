<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A hang that /health and status codes do not show</title>
  <desc>Infographic explaining how tensor-parallel NCCL hangs and streaming GenerationErrors escape HTTP health checks and status code monitoring.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A hang that <tspan font-family="ui-monospace, monospace">/health</tspan> and status codes do not show</text>

  
  
  
  <g id="panel-1">
    
    <rect x="40" y="95" width="740" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <path d="M 40 111 A 16 16 0 0 1 56 95 L 764 95 A 16 16 0 0 1 780 111 L 780 165 L 40 165 Z" fill="#dbeadd" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(68, 102)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <line x1="28" y1="14" x2="28" y2="28" />
      <line x1="28" y1="28" x2="38" y2="28" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>
    
    <text x="145" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">Stall</text>

    
    <g id="stall-symptom">
      <rect x="58" y="175" width="704" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(74, 242)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="12" width="32" height="32" rx="4" />
        <line x1="20" y1="4" x2="20" y2="12" />
        <line x1="28" y1="4" x2="28" y2="12" />
        <line x1="36" y1="4" x2="36" y2="12" />
        <line x1="20" y1="44" x2="20" y2="52" />
        <line x1="28" y1="44" x2="28" y2="52" />
        <line x1="36" y1="44" x2="36" y2="52" />
        <line x1="4" y1="20" x2="12" y2="20" />
        <line x1="4" y1="28" x2="12" y2="28" />
        <line x1="4" y1="36" x2="12" y2="36" />
        <line x1="44" y1="20" x2="52" y2="20" />
        <line x1="44" y1="28" x2="52" y2="28" />
        <line x1="44" y1="36" x2="52" y2="36" />
        <line x1="20" y1="28" x2="36" y2="28" />
      </g>
      
      <text x="148" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="148" dy="0" font-family="ui-monospace, monospace">rate(vllm:generation_tokens_total[1m])</tspan>
        <tspan x="148" dy="34">is zero while waiting plus running</tspan>
        <tspan x="148" dy="34">is above zero; process alive, CPU idle,</tspan>
        <tspan x="148" dy="34">a GPU may sit at 100 percent</tspan>
      </text>
    </g>

    
    <g id="stall-cause">
      <rect x="58" y="380" width="704" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(74, 468)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="18" height="18" rx="3" />
        <rect x="32" y="8" width="18" height="18" rx="3" />
        <rect x="12" y="34" width="32" height="16" rx="3" />
        <line x1="15" y1="26" x2="20" y2="34" />
        <line x1="41" y1="26" x2="36" y2="34" />
      </g>
      
      <text x="148" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="148" dy="0">tensor-parallel hang: one rank waiting</tspan>
        <tspan x="148" dy="33">for another in a collective (NCCL), the</tspan>
        <tspan x="148" dy="33">rest wait forever; Docker default shared</tspan>
        <tspan x="148" dy="33">memory is only 64 MB and tensor-parallel</tspan>
        <tspan x="148" dy="33">workers route NCCL and IPC buffers</tspan>
        <tspan x="148" dy="33">through it</tspan>
      </text>
    </g>

    
    <g id="stall-trap">
      <rect x="58" y="630" width="704" height="200" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(74, 700)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="28,6 50,48 6,48" />
        <line x1="28" y1="18" x2="28" y2="32" />
        <circle cx="28" cy="40" r="2.5" fill="#db8129" />
      </g>
      
      <text x="148" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="148" dy="0"><tspan font-family="ui-monospace, monospace">v0.32.0 /health</tspan> returns 200 unless the</tspan>
        <tspan x="148" dy="34">engine is marked dead; the check only</tspan>
        <tspan x="148" dy="34">reads an error flag, so the route reports</tspan>
        <tspan x="148" dy="34">a crash, not a stall; a hung engine</tspan>
        <tspan x="148" dy="34">keeps answering 200</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="panel-2">
    
    <rect x="820" y="95" width="740" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <path d="M 820 111 A 16 16 0 0 1 836 95 L 1544 95 A 16 16 0 0 1 1560 111 L 1560 165 L 820 165 Z" fill="#dbeadd" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(848, 102)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="6" />
      <line x1="6" y1="18" x2="50" y2="18" />
      <circle cx="13" cy="12" r="2" fill="#207448" />
      <circle cx="20" cy="12" r="2" fill="#207448" />
      <line x1="14" y1="28" x2="32" y2="28" />
      <line x1="14" y1="38" x2="40" y2="38" />
    </g>
    
    <text x="925" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Failure after the first token</text>

    
    <g id="failure-card">
      <rect x="838" y="175" width="704" height="655" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(856, 475)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="20" rx="4" />
        <circle cx="14" cy="18" r="2" fill="#207448" />
        <line x1="24" y1="18" x2="38" y2="18" />
        <rect x="8" y="34" width="16" height="14" rx="2" />
        <rect x="32" y="34" width="16" height="14" rx="2" />
        <line x1="24" y1="41" x2="32" y2="41" stroke-dasharray="2 2" />
      </g>
      
      <text x="930" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="930" dy="0">the server already sent HTTP 200 and</tspan>
        <tspan x="930" dy="46">cannot change it; a GenerationError</tspan>
        <tspan x="930" dy="46">becomes one <tspan font-family="ui-monospace, monospace">data: error</tspan> chunk then</tspan>
        <tspan x="930" dy="46"><tspan font-family="ui-monospace, monospace">data: [DONE]</tspan>; the engine counts it in</tspan>
        <tspan x="930" dy="46" font-family="ui-monospace, monospace">vllm:request_success_total</tspan>
        <tspan x="930" dy="46">with finished_reason error, or abort if the</tspan>
        <tspan x="930" dy="46">client left first; a status-code SLI</tspan>
        <tspan x="930" dy="46">misses it, the finish-reason counter</tspan>
        <tspan x="930" dy="46">sees it</tspan>
      </text>
    </g>
  </g>

  
  
  
  <g id="action-strip">
    <rect x="40" y="885" width="1520" height="155" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(68, 935)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <polyline points="18,25 25,32 38,19" />
    </g>

    
    <text x="145" y="930" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0"><tspan font-weight="bold" fill="#207448">mitigate:</tspan> capture logs and a stack dump, drain the replica, restart it,</tspan>
      <tspan x="145" dy="38">cordon the node for hardware Xid codes; <tspan font-weight="bold" fill="#207448">fix later:</tspan> NCCL timeouts,</tspan>
      <tspan x="145" dy="38">a watchdog on token rate, automated cordon on fatal Xid</tspan>
    </text>
  </g>

  
  
  
  <g id="rule-bar">
    <rect x="40" y="1080" width="1520" height="80" rx="14" fill="#207448" />
    <text x="800" y="1130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">zero tokens with work present is a hang, and a green /health does not change that</text>
  </g>
</svg>