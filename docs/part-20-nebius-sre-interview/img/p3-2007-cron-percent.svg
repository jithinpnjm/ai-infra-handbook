<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1025" width="1600" height="1025">
  <title>Why a percent sign cuts a crontab command in two</title>
  <desc>Visual infographic explaining crontab percent sign command truncation, standard input splitting, escaping rules, cron defaults, and detection regex.</desc>

  <defs>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#d32f2f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1025" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Why a percent sign cuts a crontab command in two</text>

  
  
  <rect x="40" y="115" width="670" height="270" rx="12" fill="#ffffff" stroke="#d32f2f" stroke-width="3"/>

  
  <g transform="translate(65, 135)">
    <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#d32f2f" stroke-width="3.5"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#d32f2f" stroke-width="2"/>
    <path d="M 8 24 L 14 30 L 8 36" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="36" x2="28" y2="36" stroke="#d32f2f" stroke-width="2.5"/>
  </g>

  
  <text x="145" y="166" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">date +</text>
  <rect x="238" y="141" width="28" height="34" rx="4" fill="#db8129"/>
  <text x="252" y="166" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">%</text>
  <text x="270" y="166" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Y%m%d &gt; /tmp/cr1</text>

  
  <line x1="252" y1="180" x2="252" y2="208" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3 3"/>
  <g transform="translate(236, 185)">
    <circle cx="6" cy="6" r="4.5" fill="none" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="26" cy="6" r="4.5" fill="none" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="16" cy="14" r="2" fill="#d32f2f"/>
    <path d="M 9 9 L 23 23" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/>
    <path d="M 23 9 L 9 23" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/>
  </g>

  
  <rect x="55" y="214" width="275" height="152" rx="8" fill="#fcf3f2" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="192" y="254" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">date +</text>
  <text x="192" y="296" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="192" dy="0">runs as the</tspan>
    <tspan x="192" dy="32">command</tspan>
  </text>

  
  <rect x="345" y="214" width="350" height="152" rx="8" fill="#fcf3f2" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="254" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Y%m%d &gt; /tmp/cr1</text>
  <text x="520" y="296" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="520" dy="0">is sent to the command</tspan>
    <tspan x="520" dy="32">as standard input</tspan>
  </text>

  
  <line x1="710" y1="250" x2="746" y2="250" stroke="#d32f2f" stroke-width="4" marker-end="url(#arrow-red)"/>

  
  <rect x="750" y="115" width="350" height="270" rx="12" fill="#ffffff" stroke="#d32f2f" stroke-width="2.5"/>
  
  <g transform="translate(897, 135)">
    <path d="M 0 0 L 34 0 L 52 18 L 52 56 L 0 56 Z" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 34 0 L 34 18 L 52 18" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="16" y1="28" x2="36" y2="44" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="28" x2="16" y2="44" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="925" y="240" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="925" dy="0">cr1 was never created,</tspan>
    <tspan x="925" dy="34">the redirect is on the</tspan>
    <tspan x="925" dy="34">far side of the cut</tspan>
  </text>

  
  
  <rect x="40" y="405" width="670" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(65, 452)">
    <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
    <path d="M 8 24 L 14 30 L 8 36" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="2.5"/>
  </g>

  
  <text x="145" y="484" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">date +\%Y\%m\%d &gt; /tmp/cr2</text>

  
  <line x1="710" y1="475" x2="746" y2="475" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="750" y="405" width="350" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(770, 447)">
    <path d="M 0 0 L 32 0 L 48 16 L 48 52 L 0 52 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 32 0 L 32 16 L 48 16" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 14 32 L 22 40 L 36 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="836" y="484" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">cr2 held 20261109</text>

  
  <rect x="1130" y="115" width="430" height="430" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <g transform="translate(1155, 138)">
    <path d="M 0 0 L 48 0 L 30 24 L 30 48 L 18 42 L 18 24 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  
  <text x="1225" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1225" dy="0">Task 11 finds</tspan>
    <tspan x="1225" dy="36">these lines</tspan>
  </text>

  
  <text x="1155" y="252" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1155" dy="0">awk skips comments, blanks</tspan>
    <tspan x="1155" dy="34">and NAME=value lines,</tspan>
    <tspan x="1155" dy="34">takes the command from</tspan>
    <tspan x="1155" dy="34">field 6, or field 2 for an</tspan>
    <tspan x="1155" dy="34">@daily line, and looks</tspan>
    <tspan x="1155" dy="34">for a percent sign not</tspan>
    <tspan x="1155" dy="34">preceded by a backslash</tspan>
  </text>

  
  
  <rect x="40" y="580" width="480" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(252, 606)">
    <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2"/>
    <path d="M 8 24 L 14 30 L 8 36" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="280" y="704" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="280" dy="0">SHELL defaults to /bin/sh,</tspan>
    <tspan x="280" dy="36">no default PATH is stated,</tspan>
    <tspan x="280" dy="36">so use absolute paths</tspan>
  </text>

  
  <rect x="560" y="580" width="480" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(772, 608)">
    <rect x="0" y="0" width="56" height="40" rx="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 0 0 L 28 22 L 56 0" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="800" y="704" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Output is mailed to the</tspan>
    <tspan x="800" dy="36">job owner, redirect</tspan>
    <tspan x="800" dy="36">what you do not want</tspan>
  </text>

  
  <rect x="1080" y="580" width="480" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1296, 604)">
    <circle cx="24" cy="24" r="23" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="24,10 24,24 37,24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="1320" y="694" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1320" dy="0">Times that do not exist in a</tspan>
    <tspan x="1320" dy="34">spring-forward change never</tspan>
    <tspan x="1320" dy="34">match, repeated times in a</tspan>
    <tspan x="1320" dy="34">fall-back change run twice</tspan>
  </text>

  
  <rect x="40" y="885" width="1520" height="85" rx="12" fill="#207448"/>
  <text x="800" y="938" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">grep -n % also lists the correct escaped line and a commented-out line.</text>
</svg>