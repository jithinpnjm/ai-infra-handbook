<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>What locking protects and what it does not</title>
  <desc>Infographic explaining Terraform state locking, race conditions without locking, branch collisions, and backend locking configuration.</desc>

  <rect width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">What locking protects and what it does not</text>

  
  <g transform="translate(40, 90)">
    <rect width="1520" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(30, 22)">
      
      <rect x="0" y="0" width="40" height="56" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="10" y1="14" x2="30" y2="14" stroke="#207448" stroke-width="3"/>
      <line x1="10" y1="28" x2="30" y2="28" stroke="#207448" stroke-width="3"/>
      <line x1="10" y1="42" x2="24" y2="42" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="90" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="90" dy="0">state is Terraform's notebook: a JSON map from resource addresses in code to real object IDs,</tspan>
      <tspan x="90" dy="34">a private format, never edit by hand</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 220)">
    <rect width="740" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(30, 24)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M18 18 L38 38 M38 18 L18 38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="38" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Timeline 1 without locking</text>
    </g>

    
    <g transform="translate(30, 95)">
      <circle cx="24" cy="35" r="22" fill="#207448"/>
      <text x="24" y="43" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
      <rect x="64" y="0" width="616" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="80" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="80" dy="0">two engineers run apply on the same cluster</tspan>
        <tspan x="80" dy="28">within one minute</tspan>
      </text>
    </g>

    
    <g transform="translate(30, 185)">
      <circle cx="24" cy="30" r="22" fill="#207448"/>
      <text x="24" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
      <rect x="64" y="0" width="616" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="80" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">both read the same state</text>
    </g>

    
    <g transform="translate(30, 265)">
      <circle cx="24" cy="30" r="22" fill="#207448"/>
      <text x="24" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">3</text>
      <rect x="64" y="0" width="616" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="80" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">both write back</text>
    </g>

    
    <g transform="translate(30, 345)">
      <rect x="64" y="0" width="616" height="145" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      
      <path d="M34 10 L60 54 L8 54 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="34" y1="26" x2="34" y2="38" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="34" cy="46" r="2" fill="#db8129"/>
      <text x="80" y="46" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
        <tspan x="80" dy="0">one write wins and the other</tspan>
        <tspan x="80" dy="38">is lost without an error</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(820, 220)">
    <rect width="740" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(30, 24)">
      <rect x="8" y="20" width="40" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M16 20 V12 A12 12 0 0 1 40 12 V20" fill="none" stroke="#207448" stroke-width="4"/>
      <text x="70" y="38" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Timeline 2 with locking</text>
    </g>

    
    <g transform="translate(30, 85)">
      <rect width="680" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="36" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="24" dy="0">Terraform takes a lock in the backend before</tspan>
        <tspan x="24" dy="32">any operation that could write state</tspan>
      </text>
    </g>

    
    <g transform="translate(30, 185)">
      <rect width="680" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">the second run waits or fails</text>
    </g>

    
    <g transform="translate(30, 260)">
      <rect width="680" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">flag -lock-timeout=10m retries</text>
    </g>

    
    <g transform="translate(30, 335)">
      <rect width="680" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">CI jobs use -lock-timeout and never -lock=false</text>
    </g>

    
    <g transform="translate(30, 410)">
      <rect width="680" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="40" font-family="sans-serif" font-size="24px" fill="#303a36">force-unlock is a human action with a ticket</text>
    </g>
  </g>

  
  <g transform="translate(40, 770)">
    <rect width="740" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(30, 25)">
      <circle cx="16" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="44" cy="14" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="44" cy="44" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M16 36 V24 A10 10 0 0 1 26 14 H36 M24 44 H36" fill="none" stroke="#207448" stroke-width="4"/>
      <text x="70" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">locks protect the state file, not the code</text>
    </g>

    
    <g transform="translate(30, 95)">
      <rect width="680" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">engineers Anna and Bill on different branches</text>
    </g>

    
    <g transform="translate(30, 185)">
      <rect width="680" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">Bill's plan would quietly undo Anna's change</text>
    </g>

    
    <g transform="translate(30, 275)">
      <rect width="680" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">no lock stops that</text>
    </g>

    
    <g transform="translate(30, 365)">
      <rect width="680" height="160" rx="12" fill="#207448"/>
      
      <g transform="translate(30, 48)">
        <path d="M24 6 L44 14 V32 C44 46 24 56 24 56 C24 56 4 46 4 32 V14 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M16 30 L22 36 L34 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="96" y="94" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#ffffff">rule 'apply only from main'</text>
    </g>
  </g>

  
  <g transform="translate(820, 770)">
    <rect width="740" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(30, 25)">
      
      <rect x="6" y="8" width="40" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M14 24 L20 30 L32 18 M14 40 L20 46 L32 34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Backend checklist</text>
    </g>

    
    <g transform="translate(30, 90)">
      <rect width="680" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="24" dy="0">S3 backend locking is opt-in through use_lockfile</tspan>
        <tspan x="24" dy="30">(default false)</tspan>
      </text>
    </g>

    
    <g transform="translate(30, 180)">
      <rect width="680" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="37" font-family="sans-serif" font-size="24px" fill="#303a36">DynamoDB locking is deprecated</text>
    </g>

    
    <g transform="translate(30, 250)">
      <rect width="680" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="37" font-family="sans-serif" font-size="24px" fill="#303a36">Nebius page uses the s3 backend with a Nebius endpoint</text>
    </g>

    
    <g transform="translate(30, 320)">
      <rect width="680" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="37" font-family="sans-serif" font-size="24px" fill="#303a36">use_lockfile true and skips the AWS-specific checks</text>
    </g>

    
    <g transform="translate(30, 390)">
      <rect width="680" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 20)">
        <ellipse cx="20" cy="14" rx="16" ry="7" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M4 14 V38 C4 42 11 45 20 45 C29 45 36 42 36 38 V14" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M4 26 C4 30 11 33 20 33 C29 33 36 30 36 26" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      <text x="74" y="42" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="74" dy="0">turn on bucket versioning because the lock</tspan>
        <tspan x="74" dy="34">protects the write and only versioning</tspan>
        <tspan x="74" dy="34">protects earlier copies</tspan>
      </text>
    </g>
  </g>
</svg>