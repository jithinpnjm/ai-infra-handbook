<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>When to declare an incident and how to hand it over</title>
  <desc>Visual infographic explaining incident declaration criteria from the Google SRE book, the four-step handover procedure, common failure modes, handover verification checks, and role delegation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="40" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">When to declare an incident and how to hand it over</text>

  
  <rect x="40" y="110" width="680" height="614" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(70, 136)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 4 L 52 14 C 52 38 28 52 28 52 C 28 52 4 38 4 14 Z" />
    <line x1="28" y1="18" x2="28" y2="32" />
    <circle cx="28" cy="40" r="2" fill="#207448" stroke="none" />
  </g>

  
  <text x="70" y="234" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="70" dy="0">Declare when any one of three</tspan>
    <tspan x="70" dy="34">signs is true (Google SRE book):</tspan>
    <tspan x="70" dy="44">a second team is needed;</tspan>
    <tspan x="70" dy="34">the outage is visible to customers;</tspan>
    <tspan x="70" dy="34">the problem is unsolved after</tspan>
    <tspan x="70" dy="34">an hour of focused analysis.</tspan>
  </text>

  
  <rect x="66" y="474" width="628" height="116" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="90" y="522" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="90" dy="0">Declaring costs very little, declaring</tspan>
    <tspan x="90" dy="34">late can cost the whole night</tspan>
  </text>

  
  
  <rect x="760" y="110" width="800" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="802" cy="148" r="24" fill="#207448" />
  <text x="802" y="157" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="846" y="142" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="846" dy="0">1 the outgoing commander fully</tspan>
    <tspan x="846" dy="32">briefs the successor</tspan>
  </text>

  
  <line x1="802" y1="186" x2="802" y2="226" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="760" y="226" width="800" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="802" cy="264" r="24" fill="#207448" />
  <text x="802" y="273" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="846" y="258" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="846" dy="0">2 says: You're now the incident</tspan>
    <tspan x="846" dy="32">commander, okay?</tspan>
  </text>

  
  <line x1="802" y1="302" x2="802" y2="342" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="760" y="342" width="800" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="802" cy="380" r="24" fill="#207448" />
  <text x="802" y="389" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="846" y="374" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="846" dy="0">3 stays on the call until the</tspan>
    <tspan x="846" dy="32">successor firmly acknowledges</tspan>
  </text>

  
  <line x1="802" y1="418" x2="802" y2="458" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="760" y="458" width="800" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="802" cy="496" r="24" fill="#207448" />
  <text x="802" y="505" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="846" y="490" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="846" dy="0">4 tells everyone else who is</tspan>
    <tspan x="846" dy="32">in charge</tspan>
  </text>

  
  <rect x="760" y="574" width="800" height="150" rx="8" fill="#fdf5ec" stroke="#db8129" stroke-width="2.5" />

  
  <g transform="translate(785, 620)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 4 L 46 44 L 2 44 Z" />
    <line x1="24" y1="18" x2="24" y2="30" />
    <circle cx="24" cy="37" r="2" fill="#db8129" stroke="none" />
  </g>

  
  <text x="846" y="608" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="846" dy="0">a short-sentence handover from an</tspan>
    <tspan x="846" dy="32">exhausted commander leaves the successor</tspan>
    <tspan x="846" dy="32">not knowing what has been tried, and the</tspan>
    <tspan x="846" dy="32">next hour is wasted</tspan>
  </text>

  
  <rect x="40" y="764" width="1520" height="156" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(72, 814)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="10" width="40" height="42" rx="4" />
    <path d="M 18 10 V 6 C 18 4 20 2 24 2 H 32 C 36 2 38 4 38 6 V 10" />
    <line x1="16" y1="22" x2="22" y2="28" />
    <line x1="22" y1="28" x2="32" y2="18" />
    <line x1="20" y1="38" x2="40" y2="38" />
  </g>

  
  <text x="160" y="812" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="160" dy="0">what the successor checks on taking over: the current mitigation,</tspan>
    <tspan x="160" dy="36">the open hypotheses, and who holds each role; if unclear ask for</tspan>
    <tspan x="160" dy="36">those three facts again before touching anything</tspan>
  </text>

  
  <rect x="40" y="960" width="1520" height="156" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(72, 1010)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 8 C 4 4 8 2 12 2 H 34 C 38 2 42 4 42 8 V 24 C 42 28 38 30 34 30 H 16 L 8 38 V 30 H 12 C 8 30 4 28 4 24 Z" />
    <circle cx="16" cy="16" r="2" fill="#207448" stroke="none" />
    <circle cx="23" cy="16" r="2" fill="#207448" stroke="none" />
    <circle cx="30" cy="16" r="2" fill="#207448" stroke="none" />
  </g>

  
  <text x="160" y="1008" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="160" dy="0">name the roles you filled; if you did everything yourself say so and</tspan>
    <tspan x="160" dy="36">say what you would delegate first, usually communications, which</tspan>
    <tspan x="160" dy="36">frees the commander to keep thinking</tspan>
  </text>
</svg>