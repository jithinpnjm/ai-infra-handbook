<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>A 100 ms quota stalls five threads in blocks</title>
  <desc>Visual infographic showing how a 100 ms CFS quota is consumed in 20 ms by five threads, causing an 80 ms throttle stall.</desc>

  <defs>
    <pattern id="greyHatch" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#e8ece9" />
      <line x1="0" y1="0" x2="0" y2="24" stroke="#c0c8c3" stroke-width="5" />
    </pattern>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A 100 ms quota stalls five threads in blocks</text>

  
  <g id="top-panel">
    <rect x="100" y="130" width="1400" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="120" y="145" width="660" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(145, 162)">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="2" x2="18" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="48" x2="18" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="48" x2="38" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="38" x2="8" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="48" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="48" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="225" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Container limit: 1 CPU</text>

    
    <rect x="820" y="145" width="660" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(845, 162)">
      <path d="M 6 42 A 22 22 0 1 1 50 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="42" x2="38" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="42" r="4" fill="#207448" />
      <line x1="12" y1="24" x2="16" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="14" x2="28" y2="19" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="24" x2="40" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="925" y="202" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Average CPU: 1 CPU (looks calm)</text>
  </g>

  
  <g id="timeline-header">
    <line x1="100" y1="295" x2="100" y2="325" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="310" x2="465" y2="310" stroke="#207448" stroke-width="3" />
    <line x1="875" y1="310" x2="1240" y2="310" stroke="#207448" stroke-width="3" />
    <line x1="1240" y1="295" x2="1240" y2="325" stroke="#207448" stroke-width="3" stroke-linecap="round" />

    <rect x="480" y="290" width="380" height="40" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="670" y="318" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">One CFS period: 100 ms</text>
  </g>

  
  <g id="timeline-bar">
    
    <rect x="100" y="345" width="380" height="190" rx="14" fill="#207448" />
    
    <g transform="translate(262, 362)">
      <line x1="4" y1="12" x2="52" y2="12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="22" x2="52" y2="22" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="32" x2="52" y2="32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="42" x2="52" y2="42" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="52" x2="52" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="290" y="465" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="290" dy="0">Five busy threads run:</tspan>
      <tspan x="290" dy="32">quota used up at 20 ms</tspan>
    </text>

    
    <rect x="480" y="345" width="760" height="190" rx="14" fill="url(#greyHatch)" stroke="#db8129" stroke-width="5" />
    <rect x="520" y="360" width="680" height="160" rx="12" fill="#ffffff" fill-opacity="0.92" />
    
    <g transform="translate(832, 380)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="20" y1="16" x2="20" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="36" y1="16" x2="36" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="860" y="482" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Throttled: nothing runs for 80 ms</text>

    
    <line x1="1240" y1="330" x2="1240" y2="550" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <polygon points="1240,330 1232,316 1248,316" fill="#207448" />

    <rect x="1265" y="380" width="235" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1382" y="432" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1382" dy="0">New period,</tspan>
      <tspan x="1382" dy="34">quota refilled</tspan>
    </text>
  </g>

  
  <g id="note-row">
    <rect x="100" y="575" width="1400" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(145, 607)">
      <circle cx="28" cy="30" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="4" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="4" x2="36" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="20" x2="28" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="39" r="2.5" fill="#207448" />
    </g>
    <text x="235" y="647" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Requests stall in 80 ms blocks</text>
  </g>

  
  <g id="caption-takeaway">
    <rect x="100" y="735" width="1400" height="100" rx="16" fill="#207448" />
    <text x="800" y="796" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The average looks calm, but the slowest requests land in the stalled block.</text>
  </g>
</svg>