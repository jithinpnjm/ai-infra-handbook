<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>The endpoint as a spec, owned by a control plane</title>
  <desc>Architecture diagram showing control plane managing endpoint lifecycle and desired state across regional data planes and replicas.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="60" y="68" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">The endpoint as a spec, owned by a control plane</text>

  
  
  <path d="M 300 530 L 390 530" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 690 530 L 715 530" fill="none" stroke="#207448" stroke-width="3.5"/>

  
  <path d="M 810 510 L 810 325 Q 810 310 825 310 L 940 310" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 810 550 L 810 855 Q 810 870 825 870 L 940 870" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="715" y="510" width="190" height="40" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="810" y="538" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">desired state</text>

  
  <path d="M 1220 310 L 1270 310" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 1080 400 L 1080 565 Q 1080 580 1095 580 L 1270 580" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 1415 220 L 1415 290" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 1415 430 L 1415 490" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 1415 780 L 1415 670" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="1435" y="707" width="75" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1472" y="732" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">pull</text>

  

  
  <g id="node-customer">
    <rect x="40" y="450" width="260" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="146" y="468" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="146" y1="479" x2="194" y2="479" stroke="#207448" stroke-width="2"/>
    <polyline points="154,486 160,490 154,494" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="165" y1="494" x2="175" y2="494" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="170" y="542" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="170" dy="0">Customer /</tspan>
      <tspan x="170" dy="36">CLI</tspan>
    </text>
  </g>

  
  <g id="node-control-plane">
    <rect x="390" y="430" width="300" height="200" rx="12" fill="#fffaf3" stroke="#db8129" stroke-width="3.5"/>
    
    <circle cx="540" cy="485" r="12" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <path d="M 540 463 L 540 469 M 540 501 L 540 507 M 518 485 L 524 485 M 556 485 L 562 485 M 524 469 L 529 474 M 551 496 L 556 501 M 524 501 L 529 496 M 551 474 L 556 469" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="540" cy="485" r="4.5" fill="#db8129"/>
    
    <text x="540" y="550" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Control plane</text>
    <text x="540" y="590" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">spec + lifecycle</text>
  </g>

  
  <g id="node-region-eu">
    <rect x="940" y="220" width="280" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="1080" cy="265" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <ellipse cx="1080" cy="265" rx="10" ry="22" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="1058" y1="265" x2="1102" y2="265" stroke="#207448" stroke-width="2.5"/>
    <line x1="1063" y1="254" x2="1097" y2="254" stroke="#207448" stroke-width="2"/>
    <line x1="1063" y1="276" x2="1097" y2="276" stroke="#207448" stroke-width="2"/>
    
    <text x="1080" y="335" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="1080" dy="0">Region EU</tspan>
      <tspan x="1080" dy="36">data plane</tspan>
    </text>
  </g>

  
  <g id="node-region-us">
    <rect x="940" y="780" width="280" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="1080" cy="825" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <ellipse cx="1080" cy="825" rx="10" ry="22" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="1058" y1="825" x2="1102" y2="825" stroke="#207448" stroke-width="2.5"/>
    <line x1="1063" y1="814" x2="1097" y2="814" stroke="#207448" stroke-width="2"/>
    <line x1="1063" y1="836" x2="1097" y2="836" stroke="#207448" stroke-width="2"/>
    
    <text x="1080" y="895" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="1080" dy="0">Region US</tspan>
      <tspan x="1080" dy="36">data plane</tspan>
    </text>
  </g>

  
  <g id="node-client-traffic">
    <rect x="1270" y="90" width="290" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="1415" cy="125" r="9" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 1401 146 C 1405 138 1425 138 1429 146" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1391 123 C 1387 128 1387 136 1391 141" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1439 123 C 1443 128 1443 136 1439 141" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="1415" y="190" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Client traffic</text>
  </g>

  
  <g id="node-router">
    <rect x="1270" y="290" width="290" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="1415" cy="335" r="22" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1403" y1="335" x2="1427" y2="335" stroke="#207448" stroke-width="2.5"/>
    <line x1="1415" y1="323" x2="1415" y2="347" stroke="#207448" stroke-width="2.5"/>
    <polyline points="1423,331 1427,335 1423,339" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="1407,331 1403,335 1407,339" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="1411,327 1415,323 1419,327" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="1411,343 1415,347 1419,343" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="1415" y="400" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Router</text>
  </g>

  
  <g id="node-replicas">
    <rect x="1270" y="490" width="290" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="1397" y="515" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="1406" y="524" width="18" height="18" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="1404" y1="509" x2="1404" y2="515" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1415" y1="509" x2="1415" y2="515" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1426" y1="509" x2="1426" y2="515" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1404" y1="551" x2="1404" y2="557" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1415" y1="551" x2="1415" y2="557" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1426" y1="551" x2="1426" y2="557" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1391" y1="524" x2="1397" y2="524" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1391" y1="533" x2="1397" y2="533" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1391" y1="542" x2="1397" y2="542" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1433" y1="524" x2="1439" y2="524" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1433" y1="533" x2="1439" y2="533" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1433" y1="542" x2="1439" y2="542" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="1415" y="605" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Replicas</text>
    <text x="1415" y="642" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="sans-serif">GPU pods</text>
  </g>

  
  <g id="node-weights-hub">
    <rect x="1270" y="780" width="290" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <ellipse cx="1415" cy="815" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 1393 815 L 1393 828 C 1393 833 1403 837 1415 837 C 1427 837 1437 833 1437 828 L 1437 815" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 1393 828 L 1393 841 C 1393 846 1403 850 1415 850 C 1427 850 1437 846 1437 841 L 1437 828" fill="none" stroke="#207448" stroke-width="3"/>
    
    <text x="1415" y="895" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Weights hub</text>
    <text x="1415" y="934" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(object store)</text>
  </g>
</svg>