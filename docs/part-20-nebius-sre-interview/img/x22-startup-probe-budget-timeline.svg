<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>A startup probe budget must be longer than the measured start</title>
  <desc>A startup probe budget must be longer than the measured start</desc>
  <defs>
    <pattern id="slackHatch" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#207448" stroke-width="2" stroke-opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1600" height="950" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A startup probe budget must be longer than the measured start</text>

  
  <line x1="900" y1="145" x2="900" y2="620" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>

  
  <g>
    <rect x="790" y="102" width="220" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="900" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Engine ready</text>
  </g>

  
  <g>
    <rect x="420" y="165" width="480" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(438, 186)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="24" cy="24" r="14"/>
      <path d="M 24 4 L 24 10 M 24 38 L 24 44 M 4 24 L 10 24 M 38 24 L 44 24 M 10 10 L 14 14 M 34 34 L 38 38 M 10 38 L 14 34 M 34 14 L 38 10"/>
    </g>
    <text x="496" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Engine start takes 400 s</text>
    <text x="496" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">includes a fresh image pull</text>
  </g>

  
  <g>
    <rect x="420" y="280" width="405" height="75" rx="10" fill="#fffbf5" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(434, 296)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="22" cy="22" r="16"/>
      <path d="M 22 12 L 22 22 L 28 22" stroke-linecap="round"/>
      <path d="M 17 2 L 27 2"/>
    </g>
    <text x="478" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Probe budget too short</text>
    
    <g transform="translate(825, 317)">
      <circle cx="0" cy="0" r="22" fill="#db8129"/>
      <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <rect x="420" y="375" width="365" height="115" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="1.5"/>
    <text x="440" y="407" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36"><tspan x="440" dy="0">Container vllm failed</tspan><tspan x="440" dy="32">startup probe,</tspan><tspan x="440" dy="32">will be restarted</tspan></text>
  </g>

  
  <g>
    
    <path d="M 430 510 L 900 510 L 900 590 L 430 590 A 10 10 0 0 1 420 580 L 420 520 A 10 10 0 0 1 430 510 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 900 510 L 1490 510 A 10 10 0 0 1 1500 520 L 1500 580 A 10 10 0 0 1 1490 590 L 900 590 Z" fill="#f0f7f2" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>
    <path d="M 900 510 L 1490 510 A 10 10 0 0 1 1500 520 L 1500 580 A 10 10 0 0 1 1490 590 L 900 590 Z" fill="url(#slackHatch)"/>
    
    <g transform="translate(438, 526)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 22 6 L 36 12 L 36 26 C 36 36 22 42 22 42 C 22 42 8 36 8 26 L 8 12 Z"/>
      <path d="M 15 22 L 20 27 L 29 17" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="492" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Raised probe budget: 10 s period x 90 failures = 900 s</text>
  </g>

  
  <g>
    
    <line x1="420" y1="620" x2="1500" y2="620" stroke="#303a36" stroke-width="3"/>
    
    <line x1="420" y1="620" x2="420" y2="634" stroke="#303a36" stroke-width="3"/>
    <text x="420" y="664" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">0 s</text>

    <line x1="900" y1="620" x2="900" y2="634" stroke="#303a36" stroke-width="3"/>
    <text x="900" y="664" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">400 s</text>

    <line x1="1500" y1="620" x2="1500" y2="634" stroke="#303a36" stroke-width="3"/>
    <text x="1500" y="664" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">900 s</text>

    
    <g transform="translate(42, 620)">
      <circle cx="18" cy="18" r="16" stroke="#207448" stroke-width="3" fill="none"/>
      <path d="M 18 10 L 18 18 L 24 18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="86" y="646" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Time since container start</text>
  </g>

  
  <g>
    <rect x="420" y="700" width="760" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(442, 725)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="44" height="36" rx="4"/>
      <path d="M 8 13 L 15 18 L 8 23" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="20" y1="23" x2="32" y2="23" stroke-linecap="round"/>
    </g>
    <text x="504" y="739" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Log of the killed container</text>
    <text x="504" y="773" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#db8129">KeyboardInterrupt: terminated</text>
  </g>

  
  <g>
    <rect x="80" y="835" width="1440" height="75" rx="12" fill="#207448"/>
    <text x="800" y="882" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Raise the budget above the measured start, pre-pull the image, and stagger the roll.</text>
  </g>
</svg>