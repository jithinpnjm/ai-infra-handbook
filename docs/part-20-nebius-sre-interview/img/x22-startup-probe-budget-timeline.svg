<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>A startup probe budget must be longer than the measured start</title>
  <desc>Visual explanation of container startup probe budgets showing why the probe budget must exceed the measured engine startup time.</desc>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">A startup probe budget must be longer than the measured start</text>

  
  <g transform="translate(100, 130)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="24,12 24,24 34,24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="60" y="32" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Time since container start</text>
  </g>

  
  <rect x="710" y="130" width="180" height="44" rx="22" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="160" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Engine ready</text>

  
  <line x1="800" y1="174" x2="800" y2="525" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>

  
  <g>
    <rect x="240" y="200" width="560" height="84" rx="10" fill="#207448"/>
    <text x="265" y="236" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Engine start takes 400 s</text>
    <text x="265" y="268" font-family="sans-serif" font-size="24" fill="#d4ebd9">includes a fresh image pull</text>
  </g>

  
  <g>
    <rect x="240" y="320" width="350" height="64" rx="10" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>
    <text x="265" y="362" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">Probe budget too short</text>

    
    <circle cx="635" cy="352" r="22" fill="#d93829"/>
    <line x1="623" y1="340" x2="647" y2="364" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="623" y1="364" x2="647" y2="340" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <g>
    <rect x="240" y="405" width="520" height="86" rx="8" fill="#fdf2f0" stroke="#e0a098" stroke-width="2"/>
    <text font-family="monospace" font-size="24" fill="#b82818">
      <tspan x="265" y="440">Container vllm failed</tspan>
      <tspan x="265" y="472">startup probe, will be restarted</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="240" y="525" width="800" height="80" rx="10" fill="#207448"/>
    
    <rect x="1040" y="525" width="460" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-dasharray="10,6"/>
    
    <text x="265" y="574" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Raised probe budget: 10 s period x 90 failures = 900 s</text>
  </g>

  
  <g>
    <line x1="240" y1="650" x2="1500" y2="650" stroke="#303a36" stroke-width="3"/>

    
    <line x1="240" y1="650" x2="240" y2="665" stroke="#303a36" stroke-width="3"/>
    <text x="240" y="698" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">0 s</text>

    
    <line x1="800" y1="650" x2="800" y2="665" stroke="#303a36" stroke-width="3"/>
    <text x="800" y="698" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">400 s</text>

    
    <line x1="1500" y1="650" x2="1500" y2="665" stroke="#303a36" stroke-width="3"/>
    <text x="1500" y="698" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">900 s</text>
  </g>

  
  <g>
    <text x="240" y="755" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Log of the killed container</text>
    <rect x="240" y="775" width="560" height="66" rx="8" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
    <text x="265" y="817" font-family="monospace" font-size="24" fill="#f7fafc">KeyboardInterrupt: terminated</text>
  </g>

  
  <g>
    <rect x="80" y="900" width="1440" height="74" rx="12" fill="#207448"/>
    <text x="800" y="946" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Raise the budget above the measured start, pre-pull the image, and stagger the roll.</text>
  </g>
</svg>