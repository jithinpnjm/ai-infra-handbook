<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <title>Scale on queue and KV pressure, not GPU utilisation</title>
  <desc>Infographic explaining why autoscaling LLM inference must rely on queue depth and KV-cache pressure rather than GPU utilisation alone, along with safe lifecycle scaling rules.</desc>

  <defs>
    
    <marker id="orange-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129" />
    </marker>
    
    <marker id="timeline-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1250" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Scale on queue and KV pressure, not GPU utilisation</text>

  
  <g transform="translate(40, 110)">
    
    <rect x="0" y="0" width="650" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="30" y="30" width="590" height="300" rx="12" fill="#ffffff" stroke="#c4d8c8" stroke-width="2"/>

    
    
    
    <path d="M 205 205 A 120 120 0 0 1 445 205" fill="none" stroke="#e0e8e2" stroke-width="28" stroke-linecap="round"/>
    
    
    <path d="M 205 205 A 120 120 0 0 1 288 91" fill="none" stroke="#207448" stroke-width="28" stroke-linecap="round"/>

    
    <circle cx="325" cy="205" r="14" fill="#303a36"/>
    <line x1="325" y1="205" x2="295" y2="105" stroke="#303a36" stroke-width="6" stroke-linecap="round"/>

    
    <rect x="135" y="240" width="380" height="56" rx="28" fill="#e8f1ea"/>
    <text x="325" y="278" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">GPU utilisation 40%</text>

    
    <rect x="30" y="355" width="590" height="270" rx="12" fill="#ffffff" stroke="#c4d8c8" stroke-width="2"/>

    
    <line x1="80" y1="585" x2="570" y2="585" stroke="#b0c0b4" stroke-width="3"/>
    <line x1="80" y1="395" x2="80" y2="585" stroke="#b0c0b4" stroke-width="3"/>

    
    <line x1="80" y1="520" x2="570" y2="520" stroke="#f0f4f1" stroke-width="2"/>
    <line x1="80" y1="455" x2="570" y2="455" stroke="#f0f4f1" stroke-width="2"/>

    
    <rect x="100" y="405" width="150" height="46" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
    <text x="175" y="437" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#db8129">TTFT up</text>

    
    <path d="M 95 565 C 220 560, 330 520, 535 422" fill="none" stroke="#db8129" stroke-width="6" stroke-linecap="round" marker-end="url(#orange-arrow)"/>

    
    <rect x="30" y="645" width="590" height="60" rx="10" fill="#303a36"/>
    <text x="325" y="684" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Users are waiting while the GPUs look half asleep</text>
  </g>

  
  <g transform="translate(720, 110)">
    
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="840" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      <circle cx="55" cy="57" r="28" fill="#e8f1ea"/>
      <path d="M 43 57 L 51 65 L 68 47" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="67" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Scale on: queue depth (requests waiting)</text>
    </g>

    
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="840" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      <circle cx="55" cy="57" r="28" fill="#e8f1ea"/>
      <path d="M 43 57 L 51 65 L 68 47" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="67" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Scale on: KV-cache pressure (how full the cache is)</text>
    </g>

    
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="840" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      <circle cx="55" cy="57" r="28" fill="#e8f1ea"/>
      <path d="M 43 57 L 51 65 L 68 47" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="67" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Check the outcome: tail TTFT</text>
    </g>

    
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="840" height="310" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="4"/>
      
      <circle cx="60" cy="65" r="28" fill="#fbebe8"/>
      <line x1="46" y1="51" x2="74" y2="79" stroke="#c93b2b" stroke-width="5" stroke-linecap="round"/>
      <line x1="74" y1="51" x2="46" y2="79" stroke="#c93b2b" stroke-width="5" stroke-linecap="round"/>

      <text x="110" y="74" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#c93b2b">Do not scale on: GPU utilisation alone</text>

      
      <rect x="40" y="140" width="760" height="120" rx="10" fill="#ffffff" stroke="#ecd7c5" stroke-width="2"/>
      
      <circle cx="85" cy="200" r="24" fill="#fdf2e9"/>
      <text x="85" y="209" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#db8129">!</text>
      <text x="135" y="208" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">Batching keeps the GPU busy while queues grow</text>
    </g>
  </g>

  
  <g transform="translate(40, 875)">
    
    <rect x="0" y="0" width="1520" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    
    <rect x="30" y="30" width="460" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="65" cy="85" r="20" fill="#207448"/>
    <text x="65" y="93" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">1</text>
    <text x="105" y="75" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Scale up early</text>
    <text x="105" y="105" font-family="sans-serif" font-size="24px" fill="#586761">(new replicas take minutes)</text>

    
    <line x1="500" y1="85" x2="538" y2="85" stroke="#207448" stroke-width="4" marker-end="url(#timeline-arrow)"/>

    
    <rect x="550" y="30" width="440" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="585" cy="85" r="20" fill="#207448"/>
    <text x="585" y="93" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">2</text>
    <text x="625" y="92" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Scale down late</text>

    
    <line x1="1000" y1="85" x2="1038" y2="85" stroke="#207448" stroke-width="4" marker-end="url(#timeline-arrow)"/>

    
    <rect x="1050" y="30" width="440" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="1085" cy="85" r="20" fill="#207448"/>
    <text x="1085" y="93" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">3</text>
    <text x="1125" y="92" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Drain before delete</text>

    
    
    <rect x="30" y="170" width="460" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 65 210 L 85 200 L 105 210 L 105 240 Q 85 260 65 240 Z" fill="none" stroke="#207448" stroke-width="3"/>
    <text x="125" y="247" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Absorbs the first minutes</text>

    
    <rect x="520" y="170" width="970" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="565" cy="237" r="24" fill="#e8f1ea"/>
    <path d="M 565 222 L 565 252 M 550 237 L 580 237" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="610" y="247" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">X+1 spare capacity so one failure does not trigger a scramble</text>
  </g>
</svg>