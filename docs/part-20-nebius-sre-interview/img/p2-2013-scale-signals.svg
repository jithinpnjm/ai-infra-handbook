<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Scale on queue and KV pressure, not GPU utilisation</title>
  <desc>Infographic explaining why LLM inference scaling must trigger on request queue depth and KV-cache pressure rather than GPU utilisation.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scale on queue and KV pressure, not GPU utilisation</text>

  
  <g id="dashboard-mock">
    <rect x="40" y="110" width="660" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="70" y="135" width="600" height="200" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5" />
    
    <path d="M 260 255 A 110 110 0 0 1 480 255" fill="none" stroke="#e2ede4" stroke-width="22" stroke-linecap="round" />
    
    <path d="M 260 255 A 110 110 0 0 1 370 145" fill="none" stroke="#207448" stroke-width="22" stroke-linecap="round" />
    
    <circle cx="370" cy="255" r="8" fill="#303a36" />
    <line x1="370" y1="255" x2="342" y2="168" stroke="#303a36" stroke-width="4" stroke-linecap="round" />
    
    <text x="370" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPU utilisation 40%</text>

    
    <rect x="70" y="355" width="600" height="225" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="1.5" />
    
    <line x1="130" y1="520" x2="620" y2="520" stroke="#b0c4b5" stroke-width="2" />
    <line x1="130" y1="520" x2="130" y2="380" stroke="#b0c4b5" stroke-width="2" />
    <line x1="130" y1="470" x2="620" y2="470" stroke="#e8f1ea" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="130" y1="420" x2="620" y2="420" stroke="#e8f1ea" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <path d="M 140 505 C 260 505, 360 490, 430 450 C 490 415, 530 385, 570 375" fill="none" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)" />
    
    <text x="450" y="395" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">TTFT up</text>

    
    <rect x="70" y="600" width="600" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="370" y="652" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="370" dy="0">Users are waiting while</tspan>
      <tspan x="370" dy="36">the GPUs look half asleep</tspan>
    </text>
  </g>

  
  <g id="signal-cards">
    
    <rect x="740" y="110" width="820" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="795" cy="167" r="26" fill="#207448" />
    <path d="M 783 167 L 792 176 L 808 159" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="845" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="845" dy="0">Scale on: queue depth</tspan>
      <tspan x="845" dy="34" font-size="24" font-weight="normal" fill="#506058">(requests waiting)</tspan>
    </text>

    
    <rect x="740" y="245" width="820" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="795" cy="302" r="26" fill="#207448" />
    <path d="M 783 302 L 792 311 L 808 294" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="845" y="288" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="845" dy="0">Scale on: KV-cache pressure</tspan>
      <tspan x="845" dy="34" font-size="24" font-weight="normal" fill="#506058">(how full the cache is)</tspan>
    </text>

    
    <rect x="740" y="380" width="820" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="795" cy="437" r="26" fill="#207448" />
    <path d="M 783 437 L 792 446 L 808 429" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="845" y="447" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Check the outcome: tail TTFT</text>

    
    <rect x="740" y="515" width="820" height="235" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <circle cx="795" cy="568" r="26" fill="#c53030" />
    <path d="M 784 557 L 806 579 M 806 557 L 784 579" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <text x="845" y="578" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do not scale on: GPU utilisation alone</text>

    
    <rect x="775" y="630" width="750" height="95" rx="10" fill="#fdf8f4" stroke="#d0ded3" stroke-width="1.5" />
    <text x="1150" y="687" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Batching keeps the GPU busy while queues grow</text>
  </g>

  
  <g id="bottom-timeline">
    <rect x="40" y="780" width="1520" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="65" y="805" width="500" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="860" r="24" fill="#207448" />
    <text x="105" y="869" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="145" y="848" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">Scale up early</tspan>
      <tspan x="145" dy="34" font-size="24" font-weight="normal" fill="#506058">(new replicas take minutes)</tspan>
    </text>

    
    <line x1="565" y1="860" x2="598" y2="860" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="605" y="805" width="380" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="645" cy="860" r="24" fill="#207448" />
    <text x="645" y="869" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="685" y="869" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Scale down late</text>

    
    <line x1="985" y1="860" x2="1018" y2="860" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="1025" y="805" width="510" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1065" cy="860" r="24" fill="#207448" />
    <text x="1065" y="869" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1105" y="869" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Drain before delete</text>

    
    <rect x="65" y="935" width="500" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="108" cy="990" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 108 977 L 108 990 L 119 990" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="150" y="1000" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Absorbs the first minutes</text>

    
    <rect x="605" y="935" width="930" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 655 970 L 675 978 C 675 998 655 1010 655 1010 C 655 1010 635 998 635 978 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <text x="705" y="980" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="705" dy="0">X+1 spare capacity</tspan>
      <tspan x="705" dy="34" font-size="24" font-weight="normal" fill="#506058">so one failure does not trigger a scramble</tspan>
    </text>
  </g>
</svg>