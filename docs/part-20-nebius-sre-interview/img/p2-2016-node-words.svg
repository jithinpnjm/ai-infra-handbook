<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>Four words for a node out of service</title>
  <desc>Visual explanation of the four node states: Cordon, Drain, Quarantine, and Validation, and budget slot retention.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="74" font-size="48" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">Four words for a node out of service</text>

  
  <rect x="51" y="125" width="355" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(228.5, 188)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="-11,-26 11,-26 26,-11 26,11 11,26 -11,26 -26,11 -26,-11"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
  </g>
  <text x="228.5" y="260" font-size="32" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">Cordon</text>
  <text x="228.5" y="325" font-size="24" font-family="sans-serif" text-anchor="middle" fill="#303a36">Send no new work</text>

  
  <rect x="432" y="125" width="355" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(609.5, 188)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-24" y="-22" width="28" height="44" rx="5"/>
    <line x1="-10" y1="0" x2="24" y2="0"/>
    <polyline points="14,-9 24,0 14,9"/>
  </g>
  <text x="609.5" y="260" font-size="32" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">Drain</text>
  <text x="609.5" y="312" font-size="24" font-family="sans-serif" text-anchor="middle" fill="#303a36">
    <tspan x="609.5" dy="0">Move the existing</tspan>
    <tspan x="609.5" dy="32">work off</tspan>
  </text>

  
  <rect x="813" y="125" width="355" height="320" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <g transform="translate(990.5, 188)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-18" y="-4" width="36" height="28" rx="5"/>
    <path d="M -11 -4 L -11 -13 C -11 -19, 11 -19, 11 -13 L 11 -4"/>
    <circle cx="0" cy="7" r="3" fill="#207448" stroke="none"/>
    <line x1="0" y1="9" x2="0" y2="15"/>
  </g>
  <text x="990.5" y="260" font-size="32" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">Quarantine</text>
  <text x="990.5" y="304" font-size="24" font-family="sans-serif" text-anchor="middle" fill="#303a36">
    <tspan x="990.5" dy="0">Out until a human</tspan>
    <tspan x="990.5" dy="30">or a repair process</tspan>
    <tspan x="990.5" dy="30">clears it</tspan>
  </text>

  
  <rect x="1194" y="125" width="355" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1371.5, 188)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-18" y="-18" width="36" height="44" rx="4"/>
    <path d="M -8 -18 L -8 -23 C -8 -25, 8 -25, 8 -23 L 8 -18"/>
    <polyline points="-11,-6 -7,-2 0,-9" stroke-width="3"/>
    <line x1="4" y1="-5" x2="11" y2="-5" stroke-width="3"/>
    <polyline points="-11,8 -7,12 0,5" stroke-width="3"/>
    <line x1="4" y1="9" x2="11" y2="9" stroke-width="3"/>
  </g>
  <text x="1371.5" y="260" font-size="32" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">Validation</text>
  <text x="1371.5" y="325" font-size="24" font-family="sans-serif" text-anchor="middle" fill="#303a36">Run the active checks</text>

  
  <rect x="51" y="490" width="1498" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="800" y="546" font-size="26" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#303a36">A node holds its budget slot from cordon until it returns to healthy</text>

  
  <rect x="200" y="625" width="1200" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" text-anchor="middle" fill="#303a36">Stuck in repair for nine days: still counts against the budget</text>

  
  <rect x="51" y="740" width="1498" height="130" rx="10" fill="#207448"/>
  <text x="800" y="792" font-size="28" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#ffffff">
    <tspan x="800" dy="0">Give every state an owner and a maximum time,</tspan>
    <tspan x="800" dy="38">and keep the node counted as lost until proven healthy.</tspan>
  </text>
</svg>