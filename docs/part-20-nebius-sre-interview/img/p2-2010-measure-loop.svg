<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Measure, find, change one thing, measure again</title>
  <desc>Circular loop infographic of four stages: Measure the whole, Find where the time goes, Change one thing, and Measure again.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Measure, find, change one thing, measure again</text>

  
  <g id="stage-1">
    <rect x="80" y="160" width="500" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="130" cy="210" r="24" fill="#207448" />
    <text x="130" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(330, 235)">
      <circle cx="0" cy="8" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="-16" x2="0" y2="-23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="-7" y1="-23" x2="7" y2="-23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="17" y1="-9" x2="22" y2="-14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="0, -3 0, 8 8, 8" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="330" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Measure the whole</text>
  </g>

  
  <g id="stage-2">
    <rect x="700" y="160" width="440" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="750" cy="210" r="24" fill="#207448" />
    <text x="750" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(920, 230)">
      <rect x="-26" y="-24" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="-16" y1="-11" x2="16" y2="-11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="-6" y1="0" x2="16" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="-16" y1="11" x2="4" y2="11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="920" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="920" dy="0">Find where the</tspan>
      <tspan x="920" dy="38">time goes</tspan>
    </text>
    
    <rect x="830" y="398" width="180" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="920" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="bold" fill="#207448">cProfile</text>
  </g>

  
  <g id="timeit-card">
    <rect x="1180" y="160" width="340" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    
    <rect x="1270" y="195" width="160" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1350" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="bold" fill="#207448">timeit</text>
    
    <text x="1350" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1350" dy="0">Report the minimum</tspan>
      <tspan x="1350" dy="36">of repeats: higher</tspan>
      <tspan x="1350" dy="36">values come from</tspan>
      <tspan x="1350" dy="36">other processes</tspan>
    </text>
  </g>

  
  <g id="stage-3">
    
    <rect x="700" y="570" width="820" height="330" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <circle cx="750" cy="620" r="24" fill="#207448" />
    <text x="750" y="629" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(920, 650)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M -5 -24 L 5 -24 L 4 -18 L -4 -18 Z" fill="#207448" />
      <path d="M -5 24 L 5 24 L 4 18 L -4 18 Z" fill="#207448" />
      <path d="M -24 -5 L -24 5 L -18 4 L -18 -4 Z" fill="#207448" />
      <path d="M 24 -5 L 24 5 L 18 4 L 18 -4 Z" fill="#207448" />
      <path d="M -18 -15 L -11 -21 L -7 -17 L -14 -10 Z" fill="#207448" />
      <path d="M 18 15 L 11 21 L 7 17 L 14 10 Z" fill="#207448" />
      <path d="M 15 -18 L 21 -11 L 17 -7 L 10 -14 Z" fill="#207448" />
      <path d="M -15 18 L -21 11 L -17 7 L -10 14 Z" fill="#207448" />
      <circle cx="0" cy="0" r="6" fill="#207448" />
    </g>
    
    <text x="920" y="750" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Change one thing</text>
    
    <rect x="1140" y="605" width="350" height="260" rx="12" fill="#fff6eb" stroke="#db8129" stroke-width="2" />
    <text x="1315" y="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1315" dy="0">Change one thing,</tspan>
      <tspan x="1315" dy="38">so you know which</tspan>
      <tspan x="1315" dy="38">change mattered</tspan>
    </text>
  </g>

  
  <g id="stage-4">
    <rect x="80" y="570" width="500" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="130" cy="620" r="24" fill="#207448" />
    <text x="130" y="629" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(330, 650)">
      <circle cx="0" cy="8" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="-16" x2="0" y2="-23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="-7" y1="-23" x2="7" y2="-23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="17" y1="-9" x2="22" y2="-14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <polyline points="0, -3 0, 8 8, 8" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="330" y="750" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Measure again</text>
  </g>

  
  
  <line x1="580" y1="325" x2="696" y2="325" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="920" y1="490" x2="920" y2="566" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="700" y1="735" x2="584" y2="735" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="330" y1="570" x2="330" y2="494" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="80" y="970" width="1440" height="76" rx="14" fill="#207448" />
  <text x="800" y="1017" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A measurement tells you where to look. A guess only tells you where you hope the problem is.</text>
</svg>