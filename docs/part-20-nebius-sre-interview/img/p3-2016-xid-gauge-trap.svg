<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240">
  <title>The Xid gauge stays high after the repair</title>
  <desc>Visual infographic explaining why DCGM_FI_DEV_XID_ERROR gauge remains high after repairs and how to construct alerts properly.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#207448" />
    </marker>
    <marker id="axis-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1240" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">The Xid gauge stays high after the repair</text>

  
  <rect x="60" y="105" width="1480" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="90" y="125" width="410" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="295" y="157" text-anchor="middle" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">DCGM_FI_DEV_XID_ERROR</text>

  
  <line x1="120" y1="390" x2="1500" y2="390" stroke="#303a36" stroke-width="3" marker-end="url(#axis-arrow)" />
  <line x1="120" y1="390" x2="120" y2="185" stroke="#303a36" stroke-width="3" marker-end="url(#axis-arrow)" />

  
  <line x1="120" y1="250" x2="1500" y2="250" stroke="#303a36" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.35" />

  
  <line x1="800" y1="200" x2="800" y2="390" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,6" />

  
  <path d="M 120 390 L 380 390 L 380 250 L 1490 250" fill="none" stroke="#db8129" stroke-width="6" stroke-linejoin="round" />

  
  <circle cx="380" cy="250" r="8" fill="#db8129" stroke="#ffffff" stroke-width="2" />
  <circle cx="800" cy="250" r="8" fill="#207448" stroke="#ffffff" stroke-width="2" />
  <circle cx="1260" cy="250" r="8" fill="#db8129" stroke="#ffffff" stroke-width="2" />

  
  <line x1="380" y1="390" x2="380" y2="465" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="800" y1="390" x2="800" y2="465" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="1260" y1="390" x2="1260" y2="465" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

  
  <rect x="60" y="465" width="460" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="110" cy="520" r="24" fill="#207448" />
  <text x="110" y="529" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">1</text>
  <text x="155" y="527" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
    <tspan x="155" y="527">Xid 79 appears,</tspan>
    <tspan x="155" y="567">gauge jumps to 79</tspan>
  </text>

  
  <rect x="560" y="465" width="480" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="610" cy="515" r="24" fill="#207448" />
  <text x="610" y="524" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">2</text>
  <text x="650" y="515" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="650" y="515">node repaired, but gauge stays</tspan>
    <tspan x="650" y="555">at 79 until another Xid replaces</tspan>
    <tspan x="650" y="595">it or the exporter restarts</tspan>
  </text>

  
  <rect x="1080" y="465" width="460" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1130" cy="520" r="24" fill="#207448" />
  <text x="1130" y="529" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">3</text>
  <text x="1175" y="527" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
    <tspan x="1175" y="527">alert on equals 79 keeps</tspan>
    <tspan x="1175" y="567">firing after the repair</tspan>
  </text>

  
  <rect x="60" y="715" width="670" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="90" y="745" width="52" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 98 757 L 108 766 L 98 775 M 114 775 L 132 775" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="160" y="765" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="160" y="765">a bad exporter restart can</tspan>
    <tspan x="160" y="805">also re-emit a stuck gauge,</tspan>
    <tspan x="160" y="845">so confirm a real Xid with</tspan>
    <tspan x="160" y="885">dmesg on one node</tspan>
  </text>

  
  <line x1="650" y1="715" x2="650" y2="685" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="770" y="715" width="770" height="105" rx="14" fill="#ffffff" stroke="#303a36" stroke-width="2" />
  
  <circle cx="820" cy="767" r="24" fill="#f5f8f5" stroke="#303a36" stroke-width="3" />
  <path d="M 810 757 L 830 777 M 830 757 L 810 777" stroke="#303a36" stroke-width="4" stroke-linecap="round" />
  <text x="865" y="776" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">DCGM_FI_DEV_XID_ERROR == 79</text>

  
  <rect x="770" y="840" width="770" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="820" cy="892" r="24" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <path d="M 808 892 L 816 900 L 832 884" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="865" y="880" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
    <tspan x="865" y="880">value plus recency: check when the value</tspan>
    <tspan x="865" y="915">last changed, not only what it is</tspan>
  </text>

  
  <rect x="60" y="985" width="1480" height="150" rx="14" fill="#207448" />
  <text x="800" y="1045" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#ffffff">
    <tspan x="800" y="1045">verify each metric name against /metrics on your exporter version; throttle, double-bit ECC</tspan>
    <tspan x="800" y="1085">and NVLink CRC counters are not enabled by default in DCGM exporter 4.9.0, enable them</tspan>
  </text>
</svg>