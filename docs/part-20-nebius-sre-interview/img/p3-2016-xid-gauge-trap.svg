<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The Xid gauge stays high after the repair</title>
  <desc>Infographic explaining why the DCGM_FI_DEV_XID_ERROR gauge metric stays at 79 after GPU node repair, why equality alerts fire continuously, and how recency checking fixes it.</desc>

  <defs>
    <!-- Arrowhead green 18px -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1080" fill="#f5f8f5" />

  <!-- Diagram Title (48px bold) -->
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The Xid gauge stays high after the repair</text>

  <!-- ==================== TIMELINE & LINE PLOT CONTAINER ==================== -->
  <rect x="40" y="85" width="1520" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  <!-- Timeline Section Header Card -->
  <rect x="65" y="105" width="1470" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <!-- Icon: Line chart / Graph (56px) beside header -->
  <g transform="translate(85, 109)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <polyline points="12,38 22,24 32,32 44,16" />
    <circle cx="44" cy="16" r="2.5" fill="#207448" />
  </g>
  <text x="800" y="147" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline with a line plot of DCGM_FI_DEV_XID_ERROR for one GPU</text>

  <!-- Visual Line Plot Area -->
  <rect x="65" y="185" width="1470" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

  <!-- Y-Axis and Baseline -->
  <line x1="160" y1="205" x2="160" y2="335" stroke="#303a36" stroke-width="2.5" stroke-linecap="round" />
  <line x1="160" y1="335" x2="1500" y2="335" stroke="#303a36" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Grid dashed line at 79 level -->
  <line x1="160" y1="235" x2="1500" y2="235" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3" />

  <!-- Firing alert zone shading from x=300 to 1480 -->
  <rect x="300" y="210" width="1180" height="125" fill="#e8f1ea" fill-opacity="0.8" rx="6" />

  <!-- Plotted Line of DCGM_FI_DEV_XID_ERROR -->
  <!-- 1. Normal state: value 0 (y=335) from x=160 to x=300 -->
  <line x1="160" y1="335" x2="300" y2="335" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <circle cx="160" cy="335" r="5" fill="#207448" />
  
  <!-- 2. Jump: at x=300 jumps from 0 to 79 (y=235) -->
  <line x1="300" y1="335" x2="300" y2="235" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 3. Stays at 79 up to repair (x=800) -->
  <line x1="300" y1="235" x2="800" y2="235" stroke="#207448" stroke-width="5" />
  <circle cx="300" cy="235" r="7" fill="#207448" />

  <!-- Repair point vertical marker at x=800 -->
  <line x1="800" y1="205" x2="800" y2="335" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 4" />
  <circle cx="800" cy="235" r="7" fill="#207448" />

  <!-- 4. After repair: STAYS AT 79! Highlighted in single accent color - the single most important item -->
  <line x1="800" y1="235" x2="1480" y2="235" stroke="#db8129" stroke-width="6" stroke-linecap="round" />
  <circle cx="1480" cy="235" r="7" fill="#db8129" />

  <!-- ==================== THREE STEPS IN TIME ORDER ==================== -->
  
  <!-- Step 1 Card -->
  <g id="step1-card">
    <rect x="65" y="385" width="470" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <!-- Number circle 1 -->
    <circle cx="105" cy="425" r="24" fill="#207448" />
    <text x="105" y="434" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <!-- Icon: Lightning / fault on chip (56px) -->
    <g transform="translate(455, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="6" />
      <polygon points="30,12 20,30 28,30 24,44 38,24 29,24" fill="#e8f1ea" />
    </g>

    <!-- Step 1 Text -->
    <text x="300" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0">Xid 79 appears,</tspan>
      <tspan x="300" dy="36">gauge jumps to 79</tspan>
    </text>
  </g>

  <!-- Step 2 Card (The Stale Case) -->
  <g id="step2-card">
    <rect x="565" y="385" width="470" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <!-- Number circle 2 -->
    <circle cx="605" cy="425" r="24" fill="#207448" />
    <text x="605" y="434" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <!-- Icon: Wrench / node maintenance (56px) -->
    <g transform="translate(955, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 20 20 L 36 36 M 34 22 L 38 26 M 22 34 L 26 38" />
    </g>

    <!-- Step 2 Text -->
    <text x="800" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">node repaired, but gauge</tspan>
      <tspan x="800" dy="32">stays at 79 until another</tspan>
      <tspan x="800" dy="32">Xid replaces it or the</tspan>
      <tspan x="800" dy="32">exporter restarts</tspan>
    </text>
  </g>

  <!-- Step 3 Card -->
  <g id="step3-card">
    <rect x="1065" y="385" width="470" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <!-- Number circle 3 -->
    <circle cx="1105" cy="425" r="24" fill="#207448" />
    <text x="1105" y="434" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <!-- Icon: Bell / continuous alert (56px) -->
    <g transform="translate(1455, 400)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 A 16 16 0 0 0 12 24 C 12 36 6 42 6 42 L 50 42 C 50 42 44 36 44 24 A 16 16 0 0 0 28 8 Z" />
      <circle cx="28" cy="48" r="4" fill="#207448" />
    </g>

    <!-- Step 3 Text -->
    <text x="1300" y="482" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1300" dy="0">alert on equals 79</tspan>
      <tspan x="1300" dy="34">keeps firing after</tspan>
      <tspan x="1300" dy="34">the repair</tspan>
    </text>
  </g>

  <!-- ==================== ARROW: SIDE NOTE -> STALE CASE ==================== -->
  <!-- Exact connection: Side note linking to the stale case (Step 2) -->
  <line x1="800" y1="635" x2="800" y2="593" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <!-- ==================== ALERT BOXES & SIDE NOTE ROW ==================== -->
  
  <!-- Left Box: Wrong Alert Box -->
  <g id="box-wrong-alert">
    <rect x="65" y="635" width="470" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <!-- Warning Icon (56px) -->
    <g transform="translate(272, 660)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 50 46 L 6 46 Z" />
      <line x1="28" y1="22" x2="28" y2="34" />
      <circle cx="28" cy="40" r="2" fill="#207448" />
    </g>

    <!-- Wrong alert label in monospace -->
    <text x="300" y="780" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">DCGM_FI_DEV_XID_ERROR == 79</text>
  </g>

  <!-- Middle Box: Side Note (links straight up to Step 2) -->
  <g id="box-sidenote">
    <rect x="565" y="635" width="470" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <!-- File / Terminal log icon (56px) -->
    <g transform="translate(772, 655)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="40" height="44" rx="4" />
      <polyline points="18,22 26,28 18,34" />
      <line x1="28" y1="34" x2="38" y2="34" />
    </g>

    <!-- Side Note Text -->
    <text x="800" y="745" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">a bad exporter restart</tspan>
      <tspan x="800" dy="34">can also re-emit a stuck</tspan>
      <tspan x="800" dy="34">gauge, so confirm a real</tspan>
      <tspan x="800" dy="34">Xid with dmesg on one node</tspan>
    </text>
  </g>

  <!-- Right Box: Right Alert Box -->
  <g id="box-right-alert">
    <rect x="1065" y="635" width="470" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <!-- Success / Checkmark Icon (56px) -->
    <g transform="translate(1272, 660)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="18,28 25,35 38,20" />
    </g>

    <!-- Right alert label -->
    <text x="1300" y="745" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1300" dy="0">value plus recency: check</tspan>
      <tspan x="1300" dy="34">when the value last changed,</tspan>
      <tspan x="1300" dy="34">not only what it is</tspan>
    </text>
  </g>

  <!-- ==================== FOOTER CARD ==================== -->
  <rect x="40" y="935" width="1520" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <!-- Info / Checklist Icon (56px) -->
  <g transform="translate(65, 962)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="40" height="46" rx="4" />
    <line x1="16" y1="18" x2="38" y2="18" />
    <line x1="16" y1="28" x2="38" y2="28" />
    <line x1="16" y1="38" x2="28" y2="38" />
  </g>

  <!-- Footer Text -->
  <text x="825" y="974" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="825" dy="0">verify each metric name against /metrics on your exporter version; throttle, double-bit</tspan>
    <tspan x="825" dy="34">ECC and NVLink CRC counters are not enabled by default in DCGM exporter 4.9.0, enable them</tspan>
  </text>

</svg>