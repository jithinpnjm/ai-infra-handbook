<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>429 means your quota; 503 means the server is overloaded</title>
  <desc>A comparison of HTTP status codes 429, 503, and 504 explaining meanings, retry behaviour, client actions, and originating components, along with separate monitoring dashboard recommendations.</desc>

  
  <rect x="0" y="0" width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">429 means your quota; 503 means the server is overloaded</text>

  
  <rect x="40" y="105" width="1520" height="66" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="800" y="147" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Sending 429 for everything hides whether it is the client quota or the platform</text>

  
  <text x="55" y="235" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Code</text>
  <text x="250" y="235" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Means</text>
  <text x="600" y="222" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="600" dy="0">Retry on</tspan>
    <tspan x="600" dy="28">another replica</tspan>
  </text>
  <text x="930" y="235" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Client action</text>
  <text x="1250" y="235" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Who sets it</text>

  
  <rect x="40" y="265" width="1520" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <line x1="230" y1="280" x2="230" y2="390" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="580" y1="280" x2="580" y2="390" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="910" y1="280" x2="910" y2="390" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="1220" y1="280" x2="1220" y2="390" stroke="#e8f1ea" stroke-width="2"/>

  
  <path d="M 80 305 L 102 313 C 102 333 92 350 80 357 C 68 350 58 333 58 313 Z" fill="#e8f1ea" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="80" cy="326" r="4" fill="#207448"/>
  <path d="M 80 330 L 80 340" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <text x="125" y="347" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448">429</text>
  <text x="250" y="324" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="250" dy="0">This tenant is</tspan>
    <tspan x="250" dy="32">over its limit</tspan>
  </text>
  <text x="600" y="324" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="600" dy="0">No, same limit</tspan>
    <tspan x="600" dy="32">everywhere</tspan>
  </text>
  <text x="930" y="324" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="930" dy="0">Wait for</tspan>
    <tspan x="930" dy="32" font-family="monospace" font-weight="bold" fill="#207448">Retry-After</tspan>
  </text>
  <text x="1250" y="342" font-family="sans-serif" font-size="25" fill="#303a36">Gateway limiter</text>

  
  <rect x="40" y="420" width="1520" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <line x1="230" y1="435" x2="230" y2="545" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="580" y1="435" x2="580" y2="545" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="910" y1="435" x2="910" y2="545" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="1220" y1="435" x2="1220" y2="545" stroke="#e8f1ea" stroke-width="2"/>

  
  <rect x="56" y="462" width="48" height="20" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <line x1="66" y1="472" x2="84" y2="472" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="472" r="2.5" fill="#207448"/>
  <rect x="56" y="488" width="48" height="20" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <line x1="66" y1="498" x2="84" y2="498" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="498" r="2.5" fill="#207448"/>
  
  <text x="125" y="502" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448">503</text>
  <text x="250" y="479" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="250" dy="0">This server is</tspan>
    <tspan x="250" dy="32">overloaded or draining</tspan>
  </text>
  <text x="600" y="479" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="600" dy="0">Yes, once,</tspan>
    <tspan x="600" dy="32">within budget</tspan>
  </text>
  <text x="930" y="479" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="930" dy="0">Back off, honour</tspan>
    <tspan x="930" dy="32" font-family="monospace" font-weight="bold" fill="#207448">Retry-After</tspan>
  </text>
  <text x="1250" y="479" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="1250" dy="0">Engine admission,</tspan>
    <tspan x="1250" dy="32">router</tspan>
  </text>

  
  <rect x="40" y="575" width="1520" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <line x1="230" y1="590" x2="230" y2="700" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="580" y1="590" x2="580" y2="700" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="910" y1="590" x2="910" y2="700" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="1220" y1="590" x2="1220" y2="700" stroke="#e8f1ea" stroke-width="2"/>

  
  <circle cx="80" cy="645" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  <polyline points="80,629 80,645 92,645" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="116" y="632" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="116" dy="0">504 or</tspan>
    <tspan x="116" dy="30">timeout</tspan>
  </text>
  <text x="250" y="650" font-family="sans-serif" font-size="25" fill="#303a36">No answer in time</text>
  <text x="600" y="632" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="600" dy="0">Yes, if before</tspan>
    <tspan x="600" dy="32">first token</tspan>
  </text>
  <text x="930" y="632" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="930" dy="0">Cancel the</tspan>
    <tspan x="930" dy="32">first copy</tspan>
  </text>
  <text x="1250" y="650" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Gateway</text>

  
  <rect x="580" y="738" width="440" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <rect x="595" y="746" width="180" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="685" y="771" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Retry-After</text>
  <text x="795" y="772" font-family="sans-serif" font-size="24" fill="#303a36">in seconds</text>

  
  <text x="800" y="828" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Keep 429 and 503 on separate dashboards</text>

  
  <g>
    <rect x="40" y="855" width="740" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M 40 867 Q 40 855 52 855 L 768 855 Q 780 855 780 867 L 780 892 L 40 892 Z" fill="#e8f1ea"/>
    <circle cx="65" cy="874" r="5" fill="#207448"/>
    <circle cx="85" cy="874" r="5" fill="#207448" opacity="0.6"/>
    <circle cx="105" cy="874" r="5" fill="#207448" opacity="0.3"/>

    
    <path d="M 90 1020 A 55 55 0 0 1 190 1020" fill="none" stroke="#e8f1ea" stroke-width="16" stroke-linecap="round"/>
    <path d="M 90 1020 A 55 55 0 0 1 175 980" fill="none" stroke="#207448" stroke-width="16" stroke-linecap="round"/>
    <circle cx="140" cy="1020" r="8" fill="#207448"/>

    
    <line x1="250" y1="1055" x2="730" y2="1055" stroke="#303a36" stroke-width="2"/>
    <line x1="250" y1="920" x2="250" y2="1055" stroke="#303a36" stroke-width="2"/>
    
    <line x1="250" y1="965" x2="730" y2="965" stroke="#303a36" stroke-width="2" stroke-dasharray="6,4"/>

    
    <rect x="290" y="1005" width="40" height="50" rx="4" fill="#207448"/>
    <rect x="360" y="985" width="40" height="70" rx="4" fill="#207448"/>
    <rect x="430" y="995" width="40" height="60" rx="4" fill="#207448"/>
    <rect x="500" y="930" width="40" height="125" rx="4" fill="#207448"/>
    <rect x="570" y="975" width="40" height="80" rx="4" fill="#207448"/>
    <rect x="640" y="1015" width="40" height="40" rx="4" fill="#207448"/>
  </g>

  
  <g>
    <rect x="820" y="855" width="740" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M 820 867 Q 820 855 832 855 L 1548 855 Q 1560 855 1560 867 L 1560 892 L 820 892 Z" fill="#e8f1ea"/>
    <circle cx="845" cy="874" r="5" fill="#207448"/>
    <circle cx="865" cy="874" r="5" fill="#207448" opacity="0.6"/>
    <circle cx="885" cy="874" r="5" fill="#207448" opacity="0.3"/>

    
    <rect x="855" y="920" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="905" y="920" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="955" y="920" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="855" y="968" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="905" y="968" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <rect x="955" y="968" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="855" y="1016" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="905" y="1016" width="36" height="36" rx="6" fill="#207448"/>
    <rect x="955" y="1016" width="36" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <line x1="1040" y1="1055" x2="1510" y2="1055" stroke="#303a36" stroke-width="2"/>
    <line x1="1040" y1="920" x2="1040" y2="1055" stroke="#303a36" stroke-width="2"/>
    <path d="M 1040 1025 Q 1080 1020 1110 1030 T 1180 1020 T 1250 990 T 1320 940 T 1380 930 T 1440 990 T 1510 1025 L 1510 1055 L 1040 1055 Z" fill="#e8f1ea"/>
    <path d="M 1040 1025 Q 1080 1020 1110 1030 T 1180 1020 T 1250 990 T 1320 940 T 1380 930 T 1440 990 T 1510 1025" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1350" cy="935" r="5" fill="#207448"/>
  </g>
</svg>