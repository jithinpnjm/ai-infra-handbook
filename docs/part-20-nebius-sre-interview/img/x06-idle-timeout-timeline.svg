<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" width="1600" height="1220">
  <title>A silent stream is reset by the middlebox; a heartbeat keeps it alive</title>
  <desc>Infographic showing how middlebox idle timeouts silently drop connections, producing an error on the next client write unless kept alive by heartbeats.</desc>

  <defs>
    
    <marker id="orange-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#db8129" />
    </marker>
    
    <marker id="green-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1220" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">
    A silent stream is reset by the middlebox; a heartbeat keeps it alive
  </text>

  
  <rect x="80" y="95" width="1440" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="360" y="133" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">0 seconds</text>
  <text x="700" y="133" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">0.3 seconds</text>
  <text x="1040" y="133" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">0.6 seconds</text>
  <text x="1380" y="133" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">the next write</text>

  
  <line x1="1040" y1="151" x2="1040" y2="840" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" />

  
  <rect x="945" y="160" width="190" height="42" rx="21" fill="#db8129" />
  <text x="1040" y="189" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">idle timeout</text>

  
  <rect x="80" y="215" width="1440" height="265" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="2" />
  
  
  <rect x="80" y="215" width="230" height="265" rx="12" fill="#edf3ee" />
  
  <g transform="translate(167, 280)">
    <rect x="0" y="0" width="56" height="46" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="7" r="3" fill="#207448" />
    <circle cx="20" cy="7" r="3" fill="#207448" />
  </g>
  <text x="195" y="375" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">silent client</text>

  
  <circle cx="360" cy="355" r="14" fill="#207448" />
  <rect x="290" y="275" width="140" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="360" y="305" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">last byte</text>
  <line x1="360" y1="319" x2="360" y2="341" stroke="#207448" stroke-width="2" />

  
  <rect x="374" y="337" width="630" height="36" rx="6" fill="#e3e8e5" stroke="#9aa8a1" stroke-width="2" />
  <text x="689" y="363" font-family="sans-serif" font-size="24" fill="#4d5a54" text-anchor="middle">
    quiet for longer than the idle timeout
  </text>

  
  
  <g transform="translate(1012, 327)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <line x1="10" y1="28" x2="46" y2="28" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="10" x2="28" y2="46" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="28" r="8" fill="#db8129" />
  </g>
  
  <rect x="880" y="405" width="320" height="50" rx="8" fill="#fdeddc" stroke="#db8129" stroke-width="2" />
  <text x="1040" y="438" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9e4e08" text-anchor="middle">
    middlebox closes idle flow
  </text>

  
  
  <rect x="1235" y="270" width="250" height="52" rx="8" fill="#fdeddc" stroke="#db8129" stroke-width="3" />
  <text x="1360" y="305" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">reset or BrokenPipe</text>
  
  
  <line x1="1360" y1="326" x2="1360" y2="400" stroke="#db8129" stroke-width="5" marker-end="url(#orange-arrow)" />


  
  <rect x="80" y="495" width="1440" height="70" rx="8" fill="#2d3732" stroke="#207448" stroke-width="2" />
  <text x="800" y="539" font-family="monospace" font-size="24" fill="#c3e88d" text-anchor="middle">
    Flags [F.] from the server, then ack from the client, then silence, then Flags [R] at the next client write
  </text>


  
  <rect x="80" y="580" width="1440" height="260" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="2" />
  
  
  <rect x="80" y="580" width="230" height="260" rx="12" fill="#edf3ee" />
  
  <g transform="translate(167, 638)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 6 30 L 18 30 L 23 15 L 33 45 L 38 30 L 50 30" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="195" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">heartbeat client</text>

  
  <g transform="translate(340, 680)">
    <circle cx="20" cy="20" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <path d="M 10 20 L 16 20 L 20 10 L 24 30 L 28 20 L 30 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <g transform="translate(680, 680)">
    <circle cx="20" cy="20" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <path d="M 10 20 L 16 20 L 20 10 L 24 30 L 28 20 L 30 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <g transform="translate(1020, 680)">
    <circle cx="20" cy="20" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <path d="M 10 20 L 16 20 L 20 10 L 24 30 L 28 20 L 30 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <line x1="376" y1="700" x2="680" y2="700" stroke="#207448" stroke-width="4" />
  <line x1="716" y1="700" x2="1020" y2="700" stroke="#207448" stroke-width="4" />

  
  <rect x="490" y="618" width="420" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="700" y="650" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan font-family="monospace">ping</tspan> every half the idle timeout
  </text>

  
  <line x1="1056" y1="700" x2="1480" y2="700" stroke="#207448" stroke-width="5" marker-end="url(#green-arrow)" />
  <rect x="1190" y="630" width="180" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1280" y="661" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">still alive</text>


  
  
  <g transform="translate(80, 860)">
    <rect x="0" y="0" width="450" height="170" rx="10" fill="#ffffff" stroke="#c8d6cc" stroke-width="2" />
    <circle cx="48" cy="48" r="24" fill="#207448" />
    <text x="48" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="96" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Measure path timeout</text>
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">
      find the lowest idle timeout on the path
    </text>
  </g>

  
  <g transform="translate(575, 860)">
    <rect x="0" y="0" width="450" height="170" rx="10" fill="#ffffff" stroke="#c8d6cc" stroke-width="2" />
    <circle cx="48" cy="48" r="24" fill="#207448" />
    <text x="48" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="96" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Tune heartbeat interval</text>
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">
      send a heartbeat below it with margin
    </text>
  </g>

  
  <g transform="translate(1070, 860)">
    <rect x="0" y="0" width="450" height="170" rx="10" fill="#ffffff" stroke="#c8d6cc" stroke-width="2" />
    <circle cx="48" cy="48" r="24" fill="#207448" />
    <text x="48" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">3</text>
    <text x="96" y="55" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Verify lifetime limits</text>
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">
      check no hard total duration limit applies
    </text>
  </g>


  
  <g transform="translate(80, 1060)">
    <rect x="0" y="0" width="1440" height="100" rx="12" fill="#207448" />
    <text x="720" y="59" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">
      The reset appears only when the client speaks again, so a silent stream looks fine until its next write.
    </text>
  </g>
</svg>