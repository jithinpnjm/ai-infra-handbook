<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Three ceilings: per process, system-wide, and the cap on the cap</title>
  <desc>Visual infographic explaining the three limits for open files: per-process RLIMIT_NOFILE, system-wide fs.file-max, and the /proc/sys/fs/nr_open cap.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Three ceilings: per process, system-wide,</tspan>
    <tspan x="800" dy="58">and the cap on the cap</tspan>
  </text>

  

  
  <g id="outer-box">
    
    <rect x="50" y="150" width="1010" height="710" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(75, 168)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="52" y2="12" stroke-width="5"/>
      <line x1="8" y1="4" x2="16" y2="12"/>
      <line x1="20" y1="4" x2="28" y2="12"/>
      <line x1="32" y1="4" x2="40" y2="12"/>
      <line x1="44" y1="4" x2="52" y2="12"/>
      <line x1="28" y1="48" x2="28" y2="22"/>
      <polyline points="18,32 28,22 38,32"/>
      <line x1="8" y1="12" x2="8" y2="24"/>
      <line x1="48" y1="12" x2="48" y2="24"/>
    </g>

    
    <text x="150" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">The cap on the cap</text>

    
    <rect x="150" y="222" width="335" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="317" y="251" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">/proc/sys/fs/nr_open</text>

    
    <rect x="505" y="222" width="250" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="630" y="251" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">default 1048576</text>

    
    <text x="150" y="295" font-size="24" fill="#303a36">
      <tspan font-family="sans-serif">raising </tspan>
      <tspan font-family="monospace">RLIMIT_NOFILE</tspan>
      <tspan font-family="sans-serif"> cannot go above this</tspan>
    </text>

    
    <g id="middle-box">
      
      <rect x="75" y="320" width="960" height="515" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

      
      <g transform="translate(98, 336)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="16" rx="3"/>
        <circle cx="14" cy="16" r="2" fill="#207448"/>
        <line x1="22" y1="16" x2="42" y2="16" stroke-width="3"/>
        <rect x="6" y="32" width="44" height="16" rx="3"/>
        <circle cx="14" cy="40" r="2" fill="#207448"/>
        <line x1="22" y1="40" x2="42" y2="40" stroke-width="3"/>
      </g>

      
      <text x="170" y="372" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Whole machine</text>

      
      <rect x="440" y="340" width="200" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="540" y="369" text-anchor="middle" font-family="monospace" font-size="24" fill="#207448">fs.file-max</text>

      
      <rect x="660" y="340" width="215" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="767" y="369" text-anchor="middle" font-size="24" fill="#303a36">
        <tspan font-family="sans-serif">error </tspan>
        <tspan font-family="monospace" font-weight="bold">ENFILE</tspan>
      </text>

      
      <text x="170" y="420" font-size="24" fill="#303a36">
        <tspan font-family="sans-serif">read in </tspan>
        <tspan font-family="monospace">/proc/sys/fs/file-nr</tspan>
      </text>

      
      <text x="170" y="456" font-family="sans-serif" font-size="24" fill="#303a36">every process that needs a new descriptor fails</text>

      
      <g id="innermost-box">
        
        <rect x="98" y="480" width="914" height="330" rx="14" fill="#f5f8f5" stroke="#db8129" stroke-width="3.5"/>

        
        <g transform="translate(120, 496)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="8" width="44" height="40" rx="4"/>
          <line x1="6" y1="20" x2="50" y2="20" stroke-width="3"/>
          <circle cx="13" cy="14" r="1.5" fill="#db8129"/>
          <circle cx="19" cy="14" r="1.5" fill="#db8129"/>
          <polyline points="14,30 20,35 14,40" stroke-width="3"/>
          <line x1="24" y1="40" x2="34" y2="40" stroke-width="3"/>
        </g>

        
        <text x="190" y="532" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">One process</text>

        
        <rect x="420" y="500" width="305" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
        <text x="572" y="529" text-anchor="middle" font-size="24" fill="#303a36">
          <tspan font-family="monospace">RLIMIT_NOFILE</tspan>
          <tspan font-family="sans-serif"> soft</tspan>
        </text>

        
        <rect x="745" y="500" width="215" height="42" rx="8" fill="#ffe8d1" stroke="#db8129" stroke-width="2"/>
        <text x="852" y="529" text-anchor="middle" font-size="24" fill="#db8129">
          <tspan font-family="sans-serif">error </tspan>
          <tspan font-family="monospace" font-weight="bold">EMFILE</tspan>
        </text>

        
        <rect x="190" y="556" width="324" height="38" rx="8" fill="#ffe8d1" stroke="#db8129" stroke-width="1.5"/>
        <text x="352" y="583" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">the most common case</text>

        
        <text x="540" y="583" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">only this process fails</text>

        
        <text x="190" y="628" font-size="24" fill="#303a36">
          <tspan font-family="sans-serif">read in </tspan>
          <tspan font-family="monospace">/proc/PID/limits</tspan>
          <tspan font-family="sans-serif"> as Max open files</tspan>
        </text>

        
        <g id="lock-card">
          <rect x="125" y="658" width="860" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

          
          <g transform="translate(148, 688)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 12 18 V 10 A 8 8 0 0 1 28 10 V 18"/>
            <rect x="6" y="18" width="28" height="24" rx="4" fill="#e8f1ea"/>
            <circle cx="20" cy="28" r="2.5" fill="#207448"/>
            <line x1="20" y1="30.5" x2="20" y2="36"/>
          </g>

          <text x="210" y="718" font-size="24" fill="#303a36">
            <tspan x="210" dy="0" font-family="sans-serif">hard limit can be raised up to </tspan>
            <tspan font-family="monospace" font-weight="bold" fill="#207448">nr_open</tspan>
            <tspan x="210" dy="36" font-family="sans-serif">by a privileged process</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>

  
  <g id="checklist-box">
    
    <rect x="1100" y="150" width="450" height="710" rx="20" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <rect x="1100" y="150" width="450" height="85" rx="20" fill="#e8f1ea"/>
    <rect x="1100" y="215" width="450" height="20" fill="#e8f1ea"/>
    <line x1="1100" y1="235" x2="1550" y2="235" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1125, 167)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="36" height="40" rx="4"/>
      <rect x="18" y="4" width="16" height="8" rx="2" fill="#ffffff"/>
      <polyline points="14,24 18,28 26,20" stroke-width="2.5"/>
      <line x1="30" y1="24" x2="38" y2="24" stroke-width="2.5"/>
      <polyline points="14,38 18,42 26,34" stroke-width="2.5"/>
      <line x1="30" y1="38" x2="38" y2="38" stroke-width="2.5"/>
    </g>

    
    <text x="1190" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Who is refusing?</text>

    
    <rect x="1125" y="275" width="400" height="250" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(1155, 380)">
      <circle cx="20" cy="20" r="20" fill="#db8129"/>
      <path d="M 12 20 L 17 25 L 28 14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1210" y="392" font-size="28" font-weight="bold">
      <tspan x="1210" dy="0" font-family="sans-serif" fill="#303a36">one process:</tspan>
      <tspan x="1210" dy="46" font-family="monospace" font-size="34" fill="#db8129">EMFILE</tspan>
    </text>

    
    <rect x="1125" y="575" width="400" height="250" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1155, 680)">
      <circle cx="20" cy="20" r="20" fill="#207448"/>
      <path d="M 12 20 L 17 25 L 28 14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1210" y="692" font-size="28" font-weight="bold">
      <tspan x="1210" dy="0" font-family="sans-serif" fill="#303a36">whole host:</tspan>
      <tspan x="1210" dy="46" font-family="monospace" font-size="34" fill="#207448">ENFILE</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="900" width="1500" height="70" rx="14" fill="#207448"/>
    <text x="800" y="944" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Check the error name before you touch any setting.</text>
  </g>
</svg>