<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Cold start runs three stages in sequence, and download dominates</title>
  <desc>Visual timeline of LLM cold start divided into download, load, compile, and warm-up stages showing download dominance.</desc>

  <rect width="1600" height="920" fill="#f5f8f5" />

  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Cold start runs three stages in sequence, and download dominates</text>

  <text x="90" y="140" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">pod scheduled</text>
  <line x1="285" y1="132" x2="675" y2="132" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  <text x="800" y="140" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">total 170 seconds</text>
  <line x1="925" y1="132" x2="1415" y2="132" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  <text x="1510" y="140" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">ready</text>

  <g id="step-circles">
    <circle cx="375" cy="185" r="24" fill="#207448" />
    <text x="375" y="194" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    <circle cx="720" cy="185" r="24" fill="#207448" />
    <text x="720" y="194" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <circle cx="1025" cy="185" r="24" fill="#207448" />
    <text x="1025" y="194" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <circle cx="1390" cy="185" r="24" fill="#207448" />
    <text x="1390" y="194" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  </g>

  <g id="timeline-blocks">
    <g id="block-1">
      <rect x="90" y="230" width="570" height="230" rx="14" fill="#fff8f0" stroke="#db8129" stroke-width="3.5" />
      <g transform="translate(347, 252)">
        <path d="M 12 38 A 12 12 0 0 1 20 20 A 18 18 0 0 1 46 22 A 14 14 0 0 1 54 44 L 14 44 A 8 8 0 0 1 12 38 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
      </g>
      <text x="375" y="350" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Download</text>
      <text x="375" y="405" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">70 s</text>
    </g>

    <g id="block-2">
      <rect x="660" y="230" width="120" height="230" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(697, 252)">
        <ellipse cx="23" cy="11" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
        <path d="M 3 11 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
        <path d="M 3 25 v 14 c 0 4 9 7 20 7 s 20 -3 20 -7 v -14" fill="none" stroke="#207448" stroke-width="3.5" />
      </g>
      <text x="720" y="350" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Load</text>
      <text x="720" y="405" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">10 s</text>
    </g>

    <g id="block-3">
      <rect x="780" y="230" width="490" height="230" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(998, 248)">
        <path d="M 23 5 h 8 l 2 5 a 18 18 0 0 1 5 2 l 5 -3 l 6 6 l -3 5 a 18 18 0 0 1 2 5 l 5 2 v 8 l -5 2 a 18 18 0 0 1 -2 5 l 3 5 l -6 6 l -5 -3 a 18 18 0 0 1 -5 2 l -2 5 h -8 l -2 -5 a 18 18 0 0 1 -5 -2 l -5 3 l -6 -6 l 3 -5 a 18 18 0 0 1 -2 -5 l -5 -2 v -8 l 5 -2 a 18 18 0 0 1 2 -5 l -3 -5 l 6 -6 l 5 3 a 18 18 0 0 1 5 -2 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
        <circle cx="27" cy="27" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
      </g>
      <text x="1025" y="350" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Compile</text>
      <text x="1025" y="405" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">60 s</text>
    </g>

    <g id="block-4">
      <rect x="1270" y="230" width="240" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(1363, 248)">
        <circle cx="27" cy="27" r="23" fill="none" stroke="#207448" stroke-width="3.5" />
        <polyline points="27,13 27,27 37,27" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="1390" y="350" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Warm-up</text>
      <text x="1390" y="405" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">30 s</text>
    </g>
  </g>

  <g id="note-block-1">
    <rect x="90" y="485" width="570" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    <text x="375" y="525" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="375" dy="0">pre-stage weights on node-local disk</tspan>
      <tspan x="375" dy="32">removes 70 of 170 seconds</tspan>
    </text>
  </g>

  <g id="formula-panel">
    <rect x="90" y="610" width="1420" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="665" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">total = weights / download rate + weights / load rate + compile + warm-up</text>
    <text x="800" y="718" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">with weights 140 GB, download 2 GB/s, load 14 GB/s, compile 60 s, warm-up 30 s</text>
  </g>

  <g id="takeaway-bar">
    <rect x="90" y="790" width="1420" height="80" rx="12" fill="#207448" />
    <text x="800" y="840" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Split cold start into download, load and compile before you promise a rollout time.</text>
  </g>
</svg>