<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Why the short window clears the alert within minutes</title>
  <desc>Infographic explaining how multiwindow multi-burn-rate alerting clears alerts quickly after an outage using a 5-minute short window while the 1-hour long window confirms persistence.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why the short window clears the alert within minutes</text>

  
  <rect x="380" y="115" width="220" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="490" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="490" dy="0">Five-minute</tspan>
    <tspan x="490" dy="28">full outage</tspan>
  </text>

  
  <g transform="translate(190, 150)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Time in minutes</text>

  
  <line x1="380" y1="210" x2="1420" y2="210" stroke="#207448" stroke-width="3"/>

  
  <line x1="380" y1="205" x2="380" y2="225" stroke="#207448" stroke-width="3"/>
  <text x="380" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">0</text>

  <line x1="600" y1="205" x2="600" y2="225" stroke="#207448" stroke-width="3"/>
  <text x="600" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">5</text>

  <line x1="800" y1="205" x2="800" y2="225" stroke="#207448" stroke-width="3"/>
  <text x="800" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">10</text>

  <line x1="1100" y1="205" x2="1100" y2="225" stroke="#207448" stroke-width="3"/>
  <text x="1100" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">30</text>

  <line x1="1420" y1="205" x2="1420" y2="225" stroke="#207448" stroke-width="3"/>
  <text x="1420" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">60</text>

  
  <rect x="50" y="280" width="1500" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(190, 345)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="-28" y1="-8" x2="28" y2="-8" stroke="#207448" stroke-width="3"/>
    <circle cx="-16" cy="-15" r="2.5" fill="#207448"/>
    <circle cx="-6" cy="-15" r="2.5" fill="#207448"/>
  </g>
  <text x="190" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="190" dy="0">5 minute</tspan>
    <tspan x="190" dy="36">window</tspan>
  </text>

  
  <rect x="360" y="295" width="1170" height="230" rx="8" fill="#ffffff" stroke="#c0d6c8" stroke-width="1.5"/>

  
  <line x1="380" y1="295" x2="380" y2="525" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="295" x2="600" y2="525" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="800" y1="295" x2="800" y2="525" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1100" y1="295" x2="1100" y2="525" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1420" y1="295" x2="1420" y2="525" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>

  
  <line x1="380" y1="430" x2="1420" y2="430" stroke="#506058" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="1390" y="420" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Threshold 1.44%</text>

  
  <path d="M 380 490 L 600 340 L 800 490 L 1420 490" fill="none" stroke="#207448" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="600" cy="340" r="6" fill="#207448"/>
  <circle cx="800" cy="490" r="6" fill="#207448"/>

  <text x="710" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="710" dy="0">drops quickly</tspan>
    <tspan x="710" dy="28">after recovery</tspan>
  </text>

  
  <rect x="50" y="580" width="1500" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(190, 645)">
    <rect x="-28" y="-22" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="-28" y1="-8" x2="28" y2="-8" stroke="#207448" stroke-width="3"/>
    <circle cx="-16" cy="-15" r="2.5" fill="#207448"/>
    <circle cx="-6" cy="-15" r="2.5" fill="#207448"/>
  </g>
  <text x="190" y="705" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="190" dy="0">1 hour</tspan>
    <tspan x="190" dy="36">window</tspan>
  </text>

  
  <rect x="360" y="595" width="1170" height="230" rx="8" fill="#ffffff" stroke="#c0d6c8" stroke-width="1.5"/>

  
  <line x1="380" y1="595" x2="380" y2="825" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="595" x2="600" y2="825" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="800" y1="595" x2="800" y2="825" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1100" y1="595" x2="1100" y2="825" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1420" y1="595" x2="1420" y2="825" stroke="#e0ece3" stroke-width="1.5" stroke-dasharray="4,4"/>

  
  <line x1="380" y1="730" x2="1420" y2="730" stroke="#506058" stroke-width="2.5" stroke-dasharray="8,6"/>

  
  <path d="M 380 790 L 600 650 L 1420 650" fill="none" stroke="#207448" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="600" cy="650" r="6" fill="#207448"/>
  <circle cx="1420" cy="650" r="6" fill="#207448"/>

  <text x="830" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">1 hour ratio still above 1.44%</text>

  
  <rect x="475" y="527" width="250" height="66" rx="10" fill="#207448" stroke="#ffffff" stroke-width="3"/>
  <text x="600" y="571" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Alert fires</text>

  
  <rect x="1285" y="527" width="270" height="66" rx="10" fill="#db8129" stroke="#ffffff" stroke-width="3"/>
  <text x="1420" y="571" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Alert cleared</text>

  
  <rect x="50" y="885" width="1500" height="75" rx="10" fill="#207448"/>
  <text x="800" y="932" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The long window proves the problem is real and the short window proves it is still happening.</text>
</svg>