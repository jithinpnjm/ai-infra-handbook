<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The first token is the point of no return for a retry</title>
  <desc>Flowchart: Retry freely before the first token, never after it. Decide for every endpoint which row it belongs to before you touch any retry setting.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Retry freely before the first token, never after it</text>

  
  <rect x="270" y="110" width="300" height="54" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 302 125 L 317 151 L 287 151 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <line x1="302" y1="133" x2="302" y2="142" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="302" cy="147" r="1.5" fill="#207448" />
  <text x="330" y="147" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Error arrives</text>

  
  <line x1="420" y1="164" x2="420" y2="208" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <g transform="translate(60, 248)">
    <path d="M 26 2 L 48 10 C 48 34 26 50 26 50 C 26 50 4 34 4 10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 26 10 L 26 42" stroke="#207448" stroke-width="2.5" />
  </g>

  
  <polygon points="420,210 700,275 420,340 140,275" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="420" y="265" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">First token</text>
  <text x="420" y="300" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">already sent?</text>

  
  <line x1="700" y1="275" x2="838" y2="275" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="768" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="840" y="215" width="700" height="120" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="4" />
  
  <circle cx="890" cy="275" r="22" fill="none" stroke="#db8129" stroke-width="4" />
  <line x1="875" y1="260" x2="905" y2="290" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <text x="940" y="252" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Never replay</text>
  <text x="940" y="288" font-family="sans-serif" font-size="24" fill="#303a36">End the stream with an error.</text>
  <text x="940" y="318" font-family="sans-serif" font-size="24" fill="#303a36">A replay gives different text.</text>

  
  <line x1="420" y1="340" x2="420" y2="398" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="445" y="375" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  
  <g transform="translate(60, 453)">
    <rect x="8" y="20" width="36" height="28" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 20 L 14 10 C 14 2 38 2 38 10 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="32" r="3" fill="#207448" />
    <line x1="26" y1="35" x2="26" y2="41" stroke="#207448" stroke-width="3" />
  </g>

  
  <polygon points="420,400 700,480 420,560 140,480" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="420" y="470" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Side effects and</text>
  <text x="420" y="510" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">no idempotency key?</text>

  
  <line x1="700" y1="480" x2="838" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="768" y="470" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="840" y="435" width="700" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="480" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="877" y1="480" x2="903" y2="480" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="940" y="490" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do not retry</text>

  
  <line x1="420" y1="560" x2="420" y2="618" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="445" y="595" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  
  <g transform="translate(60, 680)">
    <rect x="10" y="4" width="34" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="16" x2="36" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="26" x2="36" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <polygon points="420,620 700,705 420,790 140,705" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="420" y="680" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client error</text>
  <text x="420" y="715" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">400, 401, 403, 404,</text>
  <text x="420" y="748" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">413 or 422?</text>

  
  <line x1="700" y1="705" x2="838" y2="705" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="768" y="695" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="840" y="650" width="700" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="705" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="880" y1="700" x2="900" y2="700" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="880" y1="710" x2="900" y2="710" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="877" y1="718" x2="903" y2="692" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="940" y="692" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Do not retry,</text>
  <text x="940" y="728" font-family="sans-serif" font-size="24" fill="#303a36">the same request gets the same answer</text>

  
  <line x1="420" y1="790" x2="420" y2="838" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="445" y="820" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  
  <g transform="translate(60, 870)">
    <path d="M 6 36 A 22 22 0 1 1 46 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="26" y1="26" x2="38" y2="14" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>

  
  <polygon points="420,840 700,895 420,950 140,895" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="420" y="905" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Status 429?</text>

  
  <line x1="700" y1="895" x2="838" y2="895" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="768" y="885" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="840" y="845" width="700" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="895" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="890,882 890,895 901,895" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="940" y="885" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Wait for Retry-After.</text>
  <text x="940" y="920" font-family="sans-serif" font-size="24" fill="#303a36">Do not hop replicas.</text>

  
  <line x1="420" y1="950" x2="420" y2="988" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <text x="445" y="974" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  
  <rect x="40" y="990" width="760" height="125" rx="16" fill="#207448" stroke="#175736" stroke-width="3" />
  
  <g transform="translate(68, 1026)">
    <rect x="4" y="4" width="34" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="3" />
    <rect x="4" y="22" width="34" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="10" cy="10" r="1.5" fill="#ffffff" />
    <circle cx="10" cy="28" r="1.5" fill="#ffffff" />
    <polyline points="30,0 36,6 46,-4" fill="none" stroke="#e8f1ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="135" y="1030" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Retry on another replica</text>
  <text x="135" y="1064" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">within the budget</text>
  <text x="135" y="1098" font-family="monospace" font-size="24" fill="#e8f1ea">connect failure, 503, first-token timeout</text>

  
  <rect x="40" y="1135" width="1520" height="50" rx="10" fill="#207448" />
  <text x="800" y="1168" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Decide for every endpoint which row it belongs to before you touch any retry setting.</text>
</svg>