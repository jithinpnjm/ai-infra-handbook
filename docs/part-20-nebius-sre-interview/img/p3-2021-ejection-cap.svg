    </g>
    
    <text x="915" y="388" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="915" dy="0">Pool of 8 hosts: can lose none, because</tspan>
      <tspan x="915" dy="34">one host is already 12.5 percent;</tspan>
      <tspan x="915" dy="34"><tspan font-family="monospace">always_eject_one_host</tspan> overrides</tspan>
    </text>
    
    <g transform="translate(885, 510)">
      
      <rect x="0" y="0" width="130" height="44" rx="6" fill="#fbe6d5" stroke="#cc7020" stroke-width="2.5"/>
