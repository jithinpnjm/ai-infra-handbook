<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The 10 percent ejection cap and the panic threshold</title>
  <desc>Visual infographic explaining Envoy outlier detection ejection cap rules, pool size sensitivity, panic threshold behavior, circuit breaking, and LLM-specific ejection criteria.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The 10 percent ejection cap and the panic threshold</text>

  
  <g>
    <rect x="40" y="105" width="1520" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(64, 132)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="145" y="152" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="145" dy="0">5 consecutive errors; check interval 10 s; base ejection time 30 s, growing with consecutive ejections of the same host;</tspan>
      <tspan x="145" dy="38">cap 10 percent of hosts ejected</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="235" width="1520" height="95" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(64, 255)">
      <path d="M28,8 L28,48 M14,48 L42,48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M10,20 L28,14 L46,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10,20 L6,34 L18,34 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M46,20 L42,34 L54,34 Z" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="145" y="293" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">Envoy tests whether ejected hosts plus one, as a share of the pool, stays at or under the cap</tspan>
    </text>
  </g>

  
  
  <g>
    <rect x="40" y="350" width="740" height="325" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(64, 372)">
