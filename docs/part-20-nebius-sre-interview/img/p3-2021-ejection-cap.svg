      <line x1="20" y1="8" x2="20" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="36" y1="40" x2="36" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="20" cy="28" r="3.5" fill="#207448"/>
      <circle cx="36" cy="28" r="3.5" fill="#207448"/>
      <line x1="20" y1="28" x2="33" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="948" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">caps connections, pending requests,</tspan>
      <tspan x="140" dy="34">requests and active retries per cluster;</tspan>
      <tspan x="140" dy="34">Envoy example 1024 connections per cluster;</tspan>
      <tspan x="140" dy="34">Istio connection pool defaults are</tspan>
      <tspan x="140" dy="34"><tspan font-family="monospace">4294967295</tspan>, effectively no limit</tspan>
    </text>
  </g>

  
