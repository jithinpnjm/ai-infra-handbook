    <text x="920" y="972" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="920" dy="0">eject on time-to-first-token timeouts and</tspan>
      <tspan x="920" dy="38">zero tokens with work queued, not only 5xx;</tspan>
      <tspan x="920" dy="38">alert whenever the cap is hit</tspan>
    </text>
  </g>
