      <rect x="6" y="32" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="16" cy="16" r="2.5" fill="#207448"/>
      <circle cx="16" cy="40" r="2.5" fill="#207448"/>
      <line x1="26" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="40" x2="42" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="388" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">Pool of 20 hosts: can lose at most 2</tspan>
      <tspan x="140" dy="34">(3 of 20 would be 15 percent), so most bad</tspan>
      <tspan x="140" dy="34">replicas stay in rotation when a quarter fail</tspan>
    </text>
    
    <g transform="translate(68, 510)">
      
      
      <rect x="0" y="0" width="52" height="42" rx="6" fill="#d8e2dc" stroke="#889690" stroke-width="2" stroke-dasharray="4,3"/>
