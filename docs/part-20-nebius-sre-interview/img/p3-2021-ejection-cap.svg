  <g>
    <rect x="40" y="695" width="1520" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(64, 720)">
      <path d="M10,44 A24,24 0 1,1 46,44" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="28" x2="40" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
      <line x1="28" y1="10" x2="28" y2="14" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="145" y="742" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="145" dy="0">panic threshold default 50 percent: when fewer than half the hosts are available Envoy ignores health status and</tspan>
      <tspan x="145" dy="38">spreads traffic across all hosts; set to 0 and an all-unhealthy pool returns 503; the docs do not describe how panic</tspan>
      <tspan x="145" dy="38">interacts with outlier ejection, test it</tspan>
    </text>
  </g>

  
  
  <g>
    <rect x="40" y="905" width="740" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(64, 930)">
