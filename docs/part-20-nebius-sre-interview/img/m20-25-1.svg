<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Histograms: keep le, then take the quantile once</title>
  <desc>Flowchart showing Prometheus histogram aggregation: compute rate per series for Pod A and Pod B buckets, sum by model and le, calculate histogram_quantile once for alerts or panels, avoiding the wrong answer of taking p99 per pod and averaging.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Histograms: keep le, then take the quantile once</text>

  
  
  <path d="M 280 475 L 348 475" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 280 765 L 348 765" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 570 475 C 605 475, 605 580, 638 580" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 570 765 C 605 765, 605 660, 638 660" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 920 620 L 978 620" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 1290 620 L 1348 620" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>

  
  <path d="M 175 380 L 175 250 Q 175 230, 195 230 L 478 230" stroke="#db8129" stroke-width="4" stroke-dasharray="10,6" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="336" y="178" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="336" dy="0">p99 per pod,</tspan>
    <tspan x="336" dy="30">then avg</tspan>
  </text>

  
  <g id="node-x">
    <rect x="480" y="155" width="240" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="600" cy="192" r="18" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 593 185 L 607 199 M 607 185 L 593 199" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="600" y="248" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="600" dy="0">wrong</tspan>
      <tspan x="600" dy="36">answer</tspan>
    </text>
  </g>

  
  <g id="node-p1">
    <rect x="70" y="380" width="210" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 175 404 L 199 417 L 199 443 L 175 456 L 151 443 L 151 417 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <path d="M 175 404 L 175 430 M 151 417 L 175 430 M 199 417 L 175 430" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <text x="175" y="495" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">Pod A</tspan>
      <tspan x="175" dy="36">buckets</tspan>
    </text>
  </g>

  
  <g id="node-p2">
    <rect x="70" y="670" width="210" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 175 694 L 199 707 L 199 733 L 175 746 L 151 733 L 151 707 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <path d="M 175 694 L 175 720 M 151 707 L 175 720 M 199 707 L 175 720" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <text x="175" y="785" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">Pod B</tspan>
      <tspan x="175" dy="36">buckets</tspan>
    </text>
  </g>

  
  <g id="node-r1">
    <rect x="350" y="380" width="220" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 442 448 A 20 20 0 1 1 478 448" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 460 440 L 472 422" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="460" cy="440" r="3" fill="#207448"/>
    <text x="460" y="495" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="460" dy="0">rate</tspan>
      <tspan x="460" dy="36">per series</tspan>
    </text>
  </g>

  
  <g id="node-r2">
    <rect x="350" y="670" width="220" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 442 738 A 20 20 0 1 1 478 738" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 460 730 L 472 712" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="460" cy="730" r="3" fill="#207448"/>
    <text x="460" y="785" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="460" dy="0">rate</tspan>
      <tspan x="460" dy="36">per series</tspan>
    </text>
  </g>

  
  <g id="node-s">
    <rect x="640" y="525" width="280" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 764 548 L 796 548 L 778 568 L 796 588 L 764 588" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="780" y="640" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="780" dy="0">sum by</tspan>
      <tspan x="780" dy="38" font-size="26">(model, le)</tspan>
    </text>
  </g>

  
  <g id="node-h">
    <rect x="980" y="525" width="310" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 1113 588 L 1157 588" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1118 588 L 1118 574 M 1126 588 L 1126 558 M 1135 588 L 1135 548 M 1144 588 L 1144 562 M 1152 588 L 1152 576" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1115 582 C 1125 580, 1132 544, 1135 544 C 1138 544, 1145 580, 1155 582" stroke="#207448" stroke-width="2.5" fill="none"/>
    <text x="1135" y="640" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1135" dy="0">histogram_quantile</tspan>
      <tspan x="1135" dy="36">(0.99)</tspan>
    </text>
  </g>

  
  <g id="node-a">
    <rect x="1350" y="525" width="210" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 1443 572 C 1443 572, 1446 552, 1455 548 C 1464 552, 1467 572, 1467 572 L 1473 578 L 1437 578 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <path d="M 1455 542 L 1455 548" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1451 581 C 1451 584, 1453 586, 1455 586 C 1457 586, 1459 584, 1459 581" stroke="#207448" stroke-width="3.5" fill="none"/>
    <text x="1455" y="640" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1455" dy="0">alert or</tspan>
      <tspan x="1455" dy="36">panel</tspan>
    </text>
  </g>
</svg>