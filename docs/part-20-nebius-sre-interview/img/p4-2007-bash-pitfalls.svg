<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Production Bash Pitfalls: pipefail, Local Masking, and Arithmetic Status</title>
  <desc>Visual infographic explaining three silent failure traps in bash scripts: pipeline failure masked without pipefail, local variable masking under set -e, and arithmetic post-increment exit code failures.</desc>

  <defs>
    <style>
      .title-text { font-family: sans-serif; font-size: 44px; font-weight: bold; fill: #207448; }
      .panel-header { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .sub-title { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #303a36; }
      .body-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .code-text { font-family: monospace; font-size: 24px; fill: #207448; font-weight: bold; }
      .code-alert { font-family: monospace; font-size: 24px; fill: #db8129; font-weight: bold; }
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <rect x="60" y="32" width="1480" height="80" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="86" text-anchor="middle" class="title-text">Production Bash Pitfalls: pipefail, Local Masking, and Arithmetic Status</text>

  
  
  
  <g id="panel-1">
    <rect x="60" y="136" width="1480" height="390" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(90, 160)">
      <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <path d="M12,28 L24,28 M32,28 L44,28 M28,14 L28,42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="160" y="198" class="panel-header">Pipeline failure: false | true</text>

    
    <rect x="90" y="232" width="650" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="270" class="sub-title">Without pipefail</text>
    <text x="114" y="306" class="body-text">
      <tspan class="code-text">'false'</tspan> exits 1, <tspan class="code-text">'true'</tspan> exits 0, resulting in
    </text>
    
    <rect x="110" y="318" width="570" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="120" y="348" class="code-alert">overall status $? = 0 (silent failure masked)</text>

    
    <rect x="760" y="232" width="750" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="784" y="270" class="sub-title">With 'set -o pipefail'</text>
    <text x="784" y="306" class="body-text">Pipe captures rightmost non-zero exit,</text>
    <text x="784" y="344" class="code-text">resulting in $? = 1 (script halts or handles failure)</text>

    
    <rect x="90" y="394" width="1420" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="434" class="body-text">
      <tspan class="code-text">'yes | head -1'</tspan> closing pipe early, raising SIGPIPE (exit status 141) under pipefail
    </text>
    <text x="114" y="474" class="body-text">
      contrasted with <tspan class="code-text">'awk NR&lt;=5'</tspan> reading without early pipe closure
    </text>
  </g>

  
  
  
  <g id="panel-2">
    <rect x="60" y="550" width="1480" height="380" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(90, 574)">
      <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <path d="M28,14 L42,20 L42,32 C42,40 28,46 28,46 C28,46 14,40 14,32 L14,20 Z" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="160" y="612" class="panel-header">Local variable masking: Under 'set -e'</text>

    
    <rect x="90" y="646" width="1420" height="126" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="686" class="code-text">local x=$(false)</text>
    <text x="114" y="724" class="body-text">The subshell fails with status 1, but 'local' command itself succeeds</text>
    <text x="114" y="756" class="body-text">with exit 0, causing set -e to ignore the failure</text>

    
    <rect x="90" y="792" width="1420" height="116" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="834" class="sub-title">Fix:</text>
    <text x="114" y="874" class="code-text">separate 'local x' followed by 'x=$(false)'</text>
  </g>

  
  
  
  <g id="panel-3">
    <rect x="60" y="954" width="1480" height="386" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(90, 978)">
      <circle cx="28" cy="28" r="26" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <path d="M20,28 L36,28 M28,20 L28,36 M18,40 L38,40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="160" y="1016" class="panel-header">Arithmetic exit code: set -e; i=0; ((i++))</text>

    
    <rect x="90" y="1050" width="1420" height="126" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="1090" class="body-text">In bash 5.2, post-increment evaluates the expression to the old value 0,</text>
    <text x="114" y="1126" class="body-text">returning exit status 1 and terminating the script immediately.</text>
    <text x="114" y="1158" class="code-text">((i++)) evaluates to 0 -&gt; exit status 1</text>

    
    <rect x="90" y="1196" width="1420" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="114" y="1238" class="sub-title">Safe alternative:</text>
    <text x="114" y="1280" class="code-text">'i=$((i+1))' which always returns exit status 0</text>
  </g>
</svg>