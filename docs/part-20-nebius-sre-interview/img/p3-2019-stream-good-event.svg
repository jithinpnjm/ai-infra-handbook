<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Green status codes, broken streams: redefine the good event</title>
  <desc>Visual infographic explaining why HTTP 200 status codes fail to detect broken streaming responses, contrasting status-code SLIs with stream-aware SLIs and defining proper gateway counting rules.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Green status codes, broken streams:</tspan>
    <tspan x="800" dy="54">redefine the good event</tspan>
  </text>
  
  <rect x="40" y="140" width="1520" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="180" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline of one streamed request</text>
  <line x1="420" y1="330" x2="450" y2="330" stroke="#207448" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="710" y1="330" x2="740" y2="330" stroke="#207448" stroke-width="4" stroke-dasharray="6 4" />
  
  <g id="timeline-card-1">
    <rect x="60" y="205" width="360" height="240" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(212, 218)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="44" height="48" rx="6" />
      <line x1="6" y1="18" x2="50" y2="18" stroke-width="3" />
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="3" />
      <line x1="14" y1="38" x2="32" y2="38" stroke-width="3" />
    </g>
    <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="240" dy="0">headers: HTTP 200 sent</tspan>
      <tspan x="240" dy="32">with the first token</tspan>
    </text>
  </g>
  
  <g id="timeline-card-2">
    <rect x="450" y="205" width="260" height="240" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(552, 218)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="16" width="12" height="24" rx="2" />
      <rect x="22" y="16" width="12" height="24" rx="2" />
      <rect x="40" y="16" width="12" height="24" rx="2" />
    </g>
    <text x="580" y="356" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="580" dy="0">tokens stream</tspan>
    </text>
  </g>
  
  <g id="timeline-card-3">
    <rect x="740" y="205" width="800" height="240" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <g transform="translate(1112, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,4 52,48 4,48" />
      <line x1="28" y1="20" x2="28" y2="34" />
      <circle cx="28" cy="42" r="2" fill="#207448" />
    </g>
    <text x="1140" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1140" dy="0">server fails mid-stream: a data: error chunk</tspan>
      <tspan x="1140" dy="30">and [DONE] under HTTP 200; the engine</tspan>
      <tspan x="1140" dy="30">counts it as finished_reason error;</tspan>
      <tspan x="1140" dy="30">a client disconnect is counted</tspan>
      <tspan x="1140" dy="30">as abort</tspan>
    </text>
  </g>
  
  <g id="measuring-row-1">
    <rect x="40" y="490" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(68, 514)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 42 A 22 22 0 1 1 48 42" />
      <line x1="28" y1="32" x2="42" y2="18" />
      <circle cx="28" cy="32" r="4" fill="#207448" />
    </g>
    <text x="145" y="536" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">status-code SLI: 200 means success, dashboard shows 100 percent</tspan>
      <tspan x="145" dy="32">while customers see replies stop in the middle</tspan>
    </text>
  </g>
  
  <g id="measuring-row-2">
    <rect x="40" y="615" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(68, 639)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 8 16 V 30 C 8 42 28 50 28 50 C 28 50 48 42 48 30 V 16 Z" />
      <polyline points="18,28 25,35 38,20" />
    </g>
    <text x="145" y="661" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">stream SLI: good only if the stream ends with a normal finish;</tspan>
      <tspan x="145" dy="32">a mid-stream abort by the server counts as bad</tspan>
    </text>
  </g>
  
  <g id="fix-list">
    <rect x="40" y="740" width="1520" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(68, 770)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 36 8 A 12 12 0 0 0 20 24 L 6 38 A 4 4 0 0 0 12 44 L 26 30 A 12 12 0 0 0 42 14 L 34 22 L 28 16 Z" />
      <circle cx="10" cy="40" r="2" fill="#207448" />
    </g>
    <text x="145" y="784" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">count a stream good only if it ends normally;</tspan>
      <tspan x="145" dy="34">add a gateway counter for streams that ended with a server-side abort;</tspan>
      <tspan x="145" dy="34">cross-check against vllm:request_success_total by finished_reason;</tspan>
      <tspan x="145" dy="34">do not alert on abort alone because client disconnects count as abort</tspan>
    </text>
  </g>
  
  <g id="footer-bar">
    <rect x="40" y="980" width="1520" height="130" rx="12" fill="#207448" />
    <text x="800" y="1022" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">
      <tspan x="800" dy="0">how the gateway observes a mid-stream break depends on its design,</tspan>
      <tspan x="800" dy="32">so name the assumption you make; also count the outcome the customer sees,</tspan>
      <tspan x="800" dy="32">not each attempt, and track retries separately</tspan>
    </text>
  </g>
</svg>