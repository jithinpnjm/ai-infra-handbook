<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>A removed metric looks like a healthy, idle system</title>
  <desc>Visual infographic showing how a removed vLLM metric causes monitoring to go blind, risks of uneven router-engine upgrades, and a mitigation checklist.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">A removed metric looks like a healthy, idle system</text>

  
  
  <g>
    <rect x="40" y="115" width="460" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="82" cy="155" r="22" fill="#207448" />
    <text x="82" y="163" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">1</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="452" cy="155" r="18" />
      <line x1="452" y1="145" x2="452" y2="155" stroke-linecap="round" />
      <line x1="452" y1="155" x2="461" y2="155" stroke-linecap="round" />
    </g>
    
    <text x="120" y="165" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">version X.Y:</text>
    <text x="65" y="210" font-size="24" fill="#303a36" font-family="sans-serif">metric deprecated,</text>
    <text x="65" y="240" font-size="24" fill="#303a36" font-family="sans-serif">still works</text>
  </g>

  
  <path d="M 500 187 L 568 187" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />

  
  <g>
    <rect x="570" y="115" width="460" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="612" cy="155" r="22" fill="#207448" />
    <text x="612" y="163" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">2</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 960 155 Q 982 140 1004 155 Q 982 170 960 155 Z" />
      <circle cx="982" cy="155" r="5" />
      <line x1="964" y1="142" x2="1000" y2="168" stroke-linecap="round" />
    </g>
    
    <text x="650" y="165" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">version X.Y+1:</text>
    <text x="595" y="222" font-size="24" fill="#303a36" font-family="sans-serif">metric hidden</text>
  </g>

  
  <path d="M 1030 187 L 1098 187" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />

  
  <g>
    <rect x="1100" y="115" width="460" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1142" cy="155" r="22" fill="#207448" />
    <text x="1142" y="163" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">3</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="1512" cy="155" r="18" />
      <line x1="1500" y1="143" x2="1524" y2="167" stroke-linecap="round" />
      <line x1="1524" y1="143" x2="1500" y2="167" stroke-linecap="round" />
    </g>
    
    <text x="1180" y="165" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">version X.Y+2:</text>
    <text x="1125" y="222" font-size="24" fill="#303a36" font-family="sans-serif">metric removed</text>
  </g>

  
  <path d="M 1330 260 L 1330 298" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" fill="none" />

  
  <g>
    <rect x="40" y="300" width="1520" height="100" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
    
    <g stroke="#db8129" stroke-width="3.5" fill="none">
      <path d="M 72 365 A 22 22 0 1 1 114 365" />
      <line x1="93" y1="365" x2="79" y2="348" stroke-linecap="round" />
      <circle cx="93" cy="365" r="4" fill="#db8129" />
    </g>
    
    <text x="145" y="343" font-size="25" fill="#303a36" font-family="sans-serif">goes blind; the drop shows as no data,</text>
    <text x="145" y="377" font-size="25" fill="#303a36" font-family="sans-serif">which many alert rules treat as healthy</text>
  </g>

  
  <g>
    <rect x="40" y="430" width="1520" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="73" y="473" width="40" height="26" rx="4" />
      <line x1="83" y1="473" x2="77" y2="463" stroke-linecap="round" />
      <line x1="103" y1="473" x2="109" y2="463" stroke-linecap="round" />
      <circle cx="83" cy="486" r="2.5" fill="#207448" stroke="none" />
      <circle cx="93" cy="486" r="2.5" fill="#207448" stroke="none" />
      <circle cx="103" cy="486" r="2.5" fill="#207448" stroke="none" />
    </g>
    
    <text x="145" y="475" font-size="25" fill="#303a36" font-family="sans-serif">router and engine share API fields, token accounting, metric names and defaults;</text>
    <text x="145" y="510" font-size="25" fill="#303a36" font-family="sans-serif">errors or odd outputs begin right after a rollout and only on some routes</text>
  </g>

  
  
  <g>
    <rect x="40" y="575" width="1520" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="90" cy="640" r="16" />
      <line x1="102" y1="652" x2="114" y2="664" stroke-linecap="round" stroke-width="4.5" />
      <path d="M 83 640 L 88 645 L 97 635" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </g>
    
    <text x="145" y="618" font-size="25" fill="#303a36" font-family="sans-serif"><tspan font-weight="bold" fill="#207448">confirm: </tspan>put engine version and router version in labels or a startup log line</text>
    <text x="145" y="655" font-size="25" fill="#303a36" font-family="sans-serif">and compare across hops; query <tspan font-family="monospace">/metrics</tspan> to see which names exist;</text>
    <text x="145" y="692" font-size="25" fill="#303a36" font-family="sans-serif">if a name is missing, check the version pair before assuming the system is idle</text>
  </g>

  
  <g>
    <rect x="40" y="750" width="1520" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 73 780 L 93 772 L 113 780 C 113 804 93 818 93 818 C 93 818 73 804 73 780 Z" stroke-linejoin="round" />
      <path d="M 86 795 A 7 7 0 1 1 96 803" stroke-linecap="round" stroke-width="2.5" />
    </g>
    
    <text x="145" y="808" font-size="25" fill="#303a36" font-family="sans-serif"><tspan font-weight="bold" fill="#207448">mitigate: </tspan>pin both sides to a known pair and roll back the newer one</text>
  </g>

  
  <g>
    <rect x="40" y="875" width="1520" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="76" y="915" width="34" height="42" rx="4" />
      <rect x="85" y="909" width="16" height="8" rx="2" fill="#e8f1ea" stroke-width="2.5" />
      <line x1="84" y1="928" x2="102" y2="928" stroke-linecap="round" stroke-width="2.5" />
      <line x1="84" y1="937" x2="102" y2="937" stroke-linecap="round" stroke-width="2.5" />
      <line x1="84" y1="946" x2="96" y2="946" stroke-linecap="round" stroke-width="2.5" />
    </g>
    
    <text x="145" y="920" font-size="25" fill="#303a36" font-family="sans-serif"><tspan font-weight="bold" fill="#207448">fix later: </tspan>compatibility matrix in CI, rollout order for control plane</text>
    <text x="145" y="955" font-size="25" fill="#303a36" font-family="sans-serif">and data plane, alerts that treat missing series as a fault</text>
  </g>

  
  <g>
    <rect x="40" y="1025" width="1520" height="85" rx="10" fill="#207448" />
    <text x="800" y="1078" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff" font-family="sans-serif">after any rollout, check versions at every hop before debugging behaviour</text>
  </g>
</svg>