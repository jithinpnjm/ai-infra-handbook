<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>The five-part mistake story and the traps to avoid</title>
  <desc>Visual infographic detailing the five-part framework for discussing production mistakes, common diagnostic anti-patterns to avoid, and structured trade-off communication.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1300" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">The five-part mistake story and the traps to avoid</text>

  
  <rect x="60" y="95" width="1480" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="134" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">keep blame out of it; use we for what the team did and I for what you did</text>

  
  
  <rect x="60" y="185" width="272" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="196" cy="225" r="22" fill="#207448"/>
  <path d="M 186 225 L 194 233 L 206 217" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 174 265 C 174 252 184 246 196 246 C 208 246 218 252 218 265" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="196" cy="242" r="7" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="196" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="196" dy="0">1 what you did</tspan>
  </text>

  
  <line x1="332" y1="307" x2="354" y2="307" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="362" y="185" width="272" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <polygon points="498,212 522,254 474,254" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="498" y1="227" x2="498" y2="239" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="498" cy="247" r="1.5" fill="#207448"/>
  <text x="498" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="498" dy="0">2 what it caused,</tspan>
    <tspan x="498" dy="32">with a number</tspan>
  </text>

  
  <line x1="634" y1="307" x2="656" y2="307" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="664" y="185" width="272" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="794" cy="235" r="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="806" y1="247" x2="819" y2="260" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="800" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">3 how you</tspan>
    <tspan x="800" dy="32">found out</tspan>
  </text>

  
  <line x1="936" y1="307" x2="958" y2="307" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="966" y="185" width="272" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 1090 226 L 1104 240 M 1114 230 C 1118 226 1120 220 1118 215 C 1113 213 1107 215 1103 219 L 1093 229 L 1104 240 L 1114 230 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="1090" y1="240" x2="1080" y2="250" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="1102" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1102" dy="0">4 what you changed</tspan>
  </text>

  
  <line x1="1238" y1="307" x2="1260" y2="307" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="1268" y="185" width="272" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1404" cy="235" r="22" fill="none" stroke="#207448" stroke-width="3"/>
  <polygon points="1404,219 1410,235 1404,231 1398,235" fill="#207448"/>
  <polygon points="1404,251 1410,235 1404,239 1398,235" fill="#207448"/>
  <text x="1404" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1404" dy="0">5 what you now</tspan>
    <tspan x="1404" dy="32">do differently</tspan>
  </text>

  
  <rect x="60" y="465" width="1480" height="475" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="85" y="490" width="450" height="425" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(310, 530)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="310" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="310" dy="0" font-weight="bold">blame-someone-else:</tspan>
    <tspan x="310" dy="34">pick a component you do not</tspan>
    <tspan x="310" dy="34">own, say the problem is there</tspan>
    <tspan x="310" dy="34">and hand it off (it was the</tspan>
    <tspan x="310" dy="34">network team's problem)</tspan>
  </text>

  
  <rect x="575" y="490" width="450" height="425" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(800, 520)">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="-5" y2="12" stroke="#207448" stroke-width="3"/>
    <line x1="5" y1="0" x2="5" y2="12" stroke="#207448" stroke-width="3"/>
    <path d="M -5 12 L -20 38 C -22 41 -20 44 -16 44 L 16 44 C 20 44 22 41 20 38 L 5 12" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-12" y1="34" x2="12" y2="34" stroke="#207448" stroke-width="2"/>
    <circle cx="-4" cy="26" r="2" fill="#207448"/>
    <circle cx="5" cy="22" r="1.5" fill="#207448"/>
  </g>
  <text x="800" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0" font-weight="bold">false certainty: say I do not</tspan>
    <tspan x="800" dy="34">know why it worked, my best</tspan>
    <tspan x="800" dy="34">explanation is this, and here is</tspan>
    <tspan x="800" dy="34">how I would test it (question,</tspan>
    <tspan x="800" dy="34">hypothesis, prediction, test)</tspan>
  </text>

  
  <rect x="1065" y="490" width="450" height="425" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1290, 520)">
    <path d="M -12 44 L -12 12 C -12 2 8 2 8 12 L 8 16" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 2 16 L 14 16 L 11 24 L 5 24 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 0 26 L -10 44 L 26 44 L 16 26 Z" fill="#207448" fill-opacity="0.15"/>
    <line x1="-18" y1="44" x2="-6" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1290" y="620" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1290" dy="0" font-weight="bold">streetlight: pick whichever</tspan>
    <tspan x="1290" dy="34">tool is familiar and hope</tspan>
    <tspan x="1290" dy="34">something obvious</tspan>
    <tspan x="1290" dy="34">shows up</tspan>
  </text>

  
  <rect x="60" y="970" width="1480" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="800" y="1022" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Given this constraint, I chose A over B, accepting this cost,</tspan>
    <tspan x="800" dy="38">and I would revisit if this condition changed</tspan>
  </text>

  
  <rect x="60" y="1120" width="1480" height="135" rx="12" fill="#207448"/>
  <text x="800" y="1173" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">
    <tspan x="800" dy="0">an interviewer who has run production systems has made expensive mistakes of their own</tspan>
    <tspan x="800" dy="36">and listens for whether you have too; keep a list of the costs you accepted, one per decision</tspan>
  </text>
</svg>