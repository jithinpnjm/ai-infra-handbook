<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which side is at fault: reading the ss state counts</title>
  <desc>Visual guide to diagnosing network faults using ss connection states, listen queue thresholds, and tcp socket flags.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which side is at fault: reading the ss state counts</text>

  
  <g id="top-strip">
    <rect x="40" y="95" width="1520" height="195" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g id="lane-client">
      
      <rect x="55" y="112" width="240" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <path d="M 72 150 L 72 130 L 102 130 L 102 150 Z M 67 154 L 107 154" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="114" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client socket</text>

      
      <rect x="325" y="117" width="230" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="440" y="159" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">SYN-SENT</text>

      <line x1="555" y1="149" x2="625" y2="149" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="635" y="117" width="235" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="752" y="159" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">ESTABLISHED</text>

      <line x1="870" y1="149" x2="940" y2="149" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="950" y="117" width="235" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1067" y="159" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">FIN-WAIT-2</text>

      <line x1="1185" y1="149" x2="1255" y2="149" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="1265" y="117" width="230" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1380" y="159" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">TIME-WAIT</text>
    </g>

    
    <g id="lane-server">
      
      <rect x="55" y="200" width="240" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <path d="M 72 220 L 102 220 L 102 234 L 72 234 Z M 72 238 L 102 238 L 102 252 L 72 252 Z M 77 227 L 79 227 M 77 245 L 79 245" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="114" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server socket</text>

      
      <rect x="325" y="205" width="230" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="440" y="247" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">LISTEN</text>

      <line x1="555" y1="237" x2="625" y2="237" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="635" y="205" width="235" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="752" y="247" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">SYN-RECV</text>

      <line x1="870" y1="237" x2="940" y2="237" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="950" y="205" width="235" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1067" y="247" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">ESTABLISHED</text>

      <line x1="1185" y1="237" x2="1255" y2="237" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

      <rect x="1265" y="205" width="230" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1380" y="247" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">CLOSE-WAIT</text>
    </g>
  </g>

  

  
  <g id="row-syn-sent">
    <rect x="40" y="310" width="920" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 339)">
      <path d="M 28 48 L 28 28 M 20 24 A 12 12 0 0 1 36 24 M 14 18 A 20 20 0 0 1 42 18 M 8 12 A 28 28 0 0 1 48 12" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="8" y1="46" x2="48" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="140" y="356">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">SYN-SENT: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">remote drops or ignores us,</tspan>
    </text>
    <text x="140" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">or the path is cut</text>
  </g>

  
  <g id="row-syn-recv">
    <rect x="40" y="442" width="920" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 471)">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 22 22 L 28 28 L 34 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="140" y="509">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">SYN-RECV: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a SYN flood, or clients that vanish</tspan>
    </text>
  </g>

  
  <g id="row-established">
    <rect x="40" y="574" width="920" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 603)">
      <circle cx="16" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="40" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="24" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="4" />
      <path d="M 16 16 C 28 8 36 12 40 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />
    </g>
    <text x="140" y="641">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ESTABLISHED: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">normal, idle ones may hide a dead peer</tspan>
    </text>
  </g>

  
  <g id="row-close-wait">
    <rect x="40" y="706" width="920" height="114" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(62, 735)">
      <rect x="6" y="8" width="44" height="38" rx="6" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="6" y1="20" x2="50" y2="20" stroke="#db8129" stroke-width="3" />
      <line x1="28" y1="26" x2="28" y2="38" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="42" r="1.5" fill="#db8129" />
    </g>
    <text x="140" y="752">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">CLOSE-WAIT: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the peer closed, our application</tspan>
    </text>
    <text x="140" y="790" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">has not: a leaked connection in our code</text>
  </g>

  
  <g id="row-fin-wait-2">
    <rect x="40" y="838" width="920" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 867)">
      <path d="M 12 8 L 44 8 L 32 28 L 44 48 L 12 48 L 24 28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="18" y1="8" x2="38" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="48" x2="38" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="140" y="905">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">FIN-WAIT-2: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a slow or stuck peer</tspan>
    </text>
  </g>

  
  <g id="row-time-wait">
    <rect x="40" y="970" width="920" height="114" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(62, 999)">
      <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,16 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="140" y="1037">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">TIME-WAIT: </tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">many short connections</tspan>
    </text>
  </g>

  

  
  <g id="panel-listen">
    <rect x="990" y="310" width="570" height="378" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1015, 328)">
      <rect x="6" y="8" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="6" y="22" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="6" y="36" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="1080" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">LISTEN row, two numbers</text>

    
    <rect x="1015" y="398" width="520" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1035" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold">Recv-Q</tspan> = connections waiting
    </text>
    <text x="1035" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">to be accepted</text>

    
    <rect x="1015" y="492" width="520" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1035" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold">Send-Q</tspan> = the limit
    </text>

    
    <rect x="1015" y="572" width="520" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1035" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">flag a listener whose Recv-Q</text>
    <text x="1035" y="646" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">has reached its Send-Q</text>
  </g>

  
  <g id="panel-flags">
    <rect x="990" y="706" width="570" height="378" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1015, 724)">
      <rect x="4" y="6" width="44" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 18 L 22 25 L 14 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="32" x2="38" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1080" y="761" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">ss -tiepm flags</text>

    
    <rect x="1015" y="794" width="520" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1035" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold">app_limited: </tspan>application not
    </text>
    <text x="1035" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">handing data over fast enough</text>

    
    <rect x="1015" y="890" width="520" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1035" y="926" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold">rwnd_limited: </tspan>receiver
    </text>
    <text x="1035" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">window is the limit</text>

    
    <rect x="1015" y="986" width="520" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1035" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="ui-monospace, monospace" font-weight="bold">sndbuf_limited: </tspan>sender
    </text>
    <text x="1035" y="1054" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">buffer is full</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1110" width="1520" height="65" rx="8" fill="#207448" />
    <text x="800" y="1151" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Start every network incident with ss, then say which states dominate and what that means.</text>
  </g>
</svg>