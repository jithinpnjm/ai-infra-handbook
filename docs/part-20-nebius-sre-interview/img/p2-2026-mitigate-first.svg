<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" style="background-color: #f5f8f5; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Mitigate first with a reversible, cheap action</title>
  <desc>An infographic contrasting root-cause investigation during an outage with rapid, cheap, reversible mitigation actions.</desc>

  
  <text x="800" y="75" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36">Mitigate first with a reversible, cheap action</text>

  
  <rect x="60" y="130" width="710" height="530" rx="16" fill="#ffffff" stroke="#d5dfd8" stroke-width="2"/>

  
  
  <g transform="translate(92, 150)">
    <circle cx="26" cy="30" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="22" y="4" width="8" height="5" rx="1.5" fill="#207448"/>
    <line x1="19" y1="4" x2="33" y2="4" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="30" x2="26" y2="18" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="30" x2="35" y2="30" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  
  <g transform="translate(154, 150)">
    <rect x="14" y="6" width="28" height="36" rx="3" fill="#f0f5f2" stroke="#207448" stroke-width="2"/>
    <rect x="8" y="12" width="28" height="36" rx="3" fill="#f8faf9" stroke="#207448" stroke-width="2"/>
    <rect x="2" y="18" width="28" height="36" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <line x1="7" y1="26" x2="23" y2="26" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="32" x2="25" y2="32" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="38" x2="19" y2="38" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="44" x2="22" y2="44" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
  </g>

  
  <text x="225" y="190" font-size="32" font-weight="bold" fill="#303a36">Find the root cause first</text>

  
  <rect x="90" y="230" width="650" height="96" rx="12" fill="#fdf2f2" stroke="#e07171" stroke-width="2"/>
  <g transform="translate(112, 253)">
    <path d="M16 3 L30 28 L2 28 Z" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="16" y1="12" x2="16" y2="19" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="24" r="1.5" fill="#b91c1c"/>
  </g>
  <text x="160" y="268" font-size="26" font-weight="bold" fill="#b91c1c">Customers keep seeing errors<tspan x="160" dy="34">while you read logs</tspan></text>

  
  
  <rect x="90" y="350" width="650" height="76" rx="10" fill="#f5f7f6" stroke="#d3ded6" stroke-width="2"/>
  <text x="415" y="398" text-anchor="middle" font-size="28" font-weight="bold" fill="#6f7d76">Streetlight</text>
  <line x1="260" y1="388" x2="570" y2="388" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="90" y="445" width="650" height="76" rx="10" fill="#f5f7f6" stroke="#d3ded6" stroke-width="2"/>
  <text x="415" y="493" text-anchor="middle" font-size="28" font-weight="bold" fill="#6f7d76">Random change</text>
  <line x1="230" y1="483" x2="600" y2="483" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="90" y="540" width="650" height="76" rx="10" fill="#f5f7f6" stroke="#d3ded6" stroke-width="2"/>
  <text x="415" y="588" text-anchor="middle" font-size="28" font-weight="bold" fill="#6f7d76">Blame someone else</text>
  <line x1="200" y1="578" x2="630" y2="578" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

  
  <line x1="800" y1="140" x2="800" y2="650" stroke="#c0d4c6" stroke-width="2" stroke-dasharray="8 8"/>

  
  <rect x="830" y="130" width="710" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  
  <g transform="translate(862, 148)">
    <path d="M26 4 L48 12 C48 30 38 46 26 52 C14 46 4 30 4 12 Z" fill="#ffffff" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M17 26 L23 32 L35 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="935" y="190" font-size="32" font-weight="bold" fill="#207448">Mitigate first</text>

  
  
  <rect x="860" y="230" width="650" height="66" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
  <text x="1185" y="272" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">Rollback</text>

  
  <rect x="860" y="312" width="650" height="66" rx="10" fill="#ffffff" stroke="#b8d4c2" stroke-width="2"/>
  <text x="1185" y="354" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36">Drain a bad zone</text>

  
  <rect x="860" y="394" width="650" height="66" rx="10" fill="#ffffff" stroke="#b8d4c2" stroke-width="2"/>
  <text x="1185" y="436" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36">Cap one tenant</text>

  
  <rect x="860" y="476" width="650" height="66" rx="10" fill="#ffffff" stroke="#b8d4c2" stroke-width="2"/>
  <text x="1185" y="518" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36">Flip a feature flag</text>

  
  <rect x="860" y="558" width="650" height="66" rx="10" fill="#ffffff" stroke="#b8d4c2" stroke-width="2"/>
  <text x="1185" y="600" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36">Shed load on purpose</text>

  
  <rect x="60" y="690" width="1480" height="120" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="734" text-anchor="middle" font-size="28" font-weight="bold" fill="#303a36">If the move is wrong, can you undo it in seconds?</text>

  
  <rect x="610" y="756" width="28" height="28" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <path d="M616 770 L622 776 L632 764" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="648" y="779" font-size="26" font-weight="bold" fill="#303a36">Cheap</text>

  
  <rect x="850" y="756" width="28" height="28" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <path d="M856 770 L862 776 L872 764" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="888" y="779" font-size="26" font-weight="bold" fill="#303a36">Reversible</text>

  
  <rect x="490" y="835" width="620" height="64" rx="32" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(522, 848)">
    <path d="M4 6 L4 30 L34 30" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 25 L15 17 L23 21 L31 9" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="17" r="2" fill="#207448"/>
    <circle cx="23" cy="21" r="2" fill="#207448"/>
    <circle cx="31" cy="9" r="2" fill="#207448"/>
  </g>
  <text x="575" y="876" font-size="26" font-weight="bold" fill="#207448">Name the graph that will confirm it</text>

  
  <rect x="60" y="925" width="1480" height="80" rx="14" fill="#207448"/>
  <text x="800" y="975" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">Pick the lowest-risk reversible action, and name the graph that confirms it.</text>
</svg>