<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Queueing: response time climbs steeply as utilisation rises</title>
  <desc>A line chart illustrating the non-linear relationship between system utilisation and response time based on the M/D/1 queueing model.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="60" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Queueing: response time climbs steeply as utilisation rises</text>

  
  <g id="formula-box">
    <rect x="60" y="108" width="1480" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(85, 134)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="40" height="40" rx="6"/>
      <path d="M20 25 h20 M30 18 v14 M20 40 h20"/>
      <path d="M20 10 V4 M30 10 V4 M40 10 V4 M20 50 v6 M30 50 v6 M40 50 v6 M10 20 H4 M10 30 H4 M10 40 H4 M50 20 h6 M50 30 h6 M50 40 h6"/>
    </g>
    
    <text x="170" y="153" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">r = s (2 - u) / (2 (1 - u))</text>
    
    <text x="170" y="194" font-family="sans-serif" font-size="24" fill="#303a36">M/D/1: random arrivals, fixed service times; s is service time, u is utilisation</text>
  </g>

  
  
  <g stroke="#d5e2d7" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="240" y1="845" x2="1080" y2="845"/>
    <line x1="240" y1="770" x2="1080" y2="770"/>
    <line x1="240" y1="645" x2="1080" y2="645"/>
    <line x1="240" y1="395" x2="1080" y2="395"/>
    <line x1="240" y1="300" x2="1080" y2="300"/>
  </g>

  
  <g transform="translate(95, 620) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">mean response time as a multiple of service time s</text>
  </g>

  
  <g id="marker-60">
    <line x1="535" y1="375" x2="535" y2="920" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="290" y="245" width="490" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="315" y="283" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">beyond 60 percent utilisation</text>
    <text x="315" y="317" font-family="sans-serif" font-size="24" fill="#303a36">the average response time doubles</text>
    <text x="315" y="351" font-family="sans-serif" font-size="24" fill="#303a36">(Systems Performance)</text>
  </g>

  
  <path d="M 260 854 C 330 851, 370 848, 400 845 C 450 841, 490 837, 535 832.5 C 630 820, 720 798, 805 770 C 865 745, 905 700, 940 645 C 975 585, 995 490, 1010 395 C 1022 315, 1032 230, 1038 180" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round"/>

  

  
  <circle cx="400" cy="845" r="9" fill="#207448"/>
  <line x1="335" y1="815" x2="395" y2="842" stroke="#207448" stroke-width="2"/>
  <rect x="150" y="730" width="260" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="170" y="765" font-family="sans-serif" font-size="24" fill="#303a36">at 50 percent busy:</text>
  <text x="170" y="797" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">1.5 x service time</text>

  
  <circle cx="805" cy="770" r="9" fill="#207448"/>
  <line x1="740" y1="740" x2="800" y2="768" stroke="#207448" stroke-width="2"/>
  <rect x="520" y="700" width="240" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="540" y="742" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">at 80 percent: 3 x</text>

  
  <circle cx="1010" cy="395" r="9" fill="#207448"/>
  <line x1="945" y1="415" x2="1002" y2="398" stroke="#207448" stroke-width="2"/>
  <rect x="670" y="385" width="285" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="690" y="427" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">at 95 percent: 10.5 x</text>

  
  <circle cx="940" cy="645" r="22" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="940" cy="645" r="11" fill="#ffffff" stroke="#db8129" stroke-width="5"/>
  <line x1="955" y1="645" x2="1005" y2="645" stroke="#db8129" stroke-width="2.5"/>
  <rect x="1005" y="612" width="295" height="66" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="1025" y="654" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">at 90 percent: 5.5 x</text>

  
  <line x1="240" y1="920" x2="1080" y2="920" stroke="#303a36" stroke-width="3"/>
  <line x1="240" y1="300" x2="240" y2="920" stroke="#303a36" stroke-width="3"/>

  
  
  <line x1="400" y1="920" x2="400" y2="932" stroke="#303a36" stroke-width="3"/>
  <text x="400" y="962" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">50</text>
  
  <line x1="535" y1="920" x2="535" y2="932" stroke="#303a36" stroke-width="3"/>
  <text x="535" y="962" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">60</text>
  
  <line x1="805" y1="920" x2="805" y2="932" stroke="#303a36" stroke-width="3"/>
  <text x="805" y="962" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">80</text>
  
  <line x1="940" y1="920" x2="940" y2="932" stroke="#303a36" stroke-width="3"/>
  <text x="940" y="962" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">90</text>
  
  <line x1="1010" y1="920" x2="1010" y2="932" stroke="#303a36" stroke-width="3"/>
  <text x="1010" y="962" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">95</text>

  
  <text x="660" y="1005" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">utilisation u (percent busy)</text>

  
  <g id="side-mini-box">
    <rect x="1140" y="245" width="400" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1312, 268)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="24"/>
      <path d="M28 14 v14 l10 6" stroke-linecap="round"/>
    </g>
    <text x="1165" y="360" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Same idea in requests:</text>
    <text x="1165" y="400" font-family="sans-serif" font-size="24" fill="#303a36">99.9 percent allows 1,000</text>
    <text x="1165" y="440" font-family="sans-serif" font-size="24" fill="#303a36">failures per million and</text>
    <text x="1165" y="480" font-family="sans-serif" font-size="24" fill="#303a36">86.4 seconds of failure</text>
    <text x="1165" y="520" font-family="sans-serif" font-size="24" fill="#303a36">in a 24-hour day.</text>
  </g>

  
  <g id="bottom-note">
    <rect x="60" y="1045" width="1480" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(85, 1073)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10"/>
      <path d="M28 6 v6 M28 44 v6 M6 28 h6 M44 28 h6 M12 12 l5 5 M39 39 l5 5 M12 44 l5-5 M39 17 l5-5"/>
    </g>
    <text x="165" y="1088" font-family="sans-serif" font-size="24" fill="#303a36">a simplified model, treat it as a shape; p95 latency can rise</text>
    <text x="165" y="1126" font-family="sans-serif" font-size="24" fill="#303a36">steeply as load nears a limit (AI Systems Performance Engineering, chapter 16)</text>
  </g>
</svg>