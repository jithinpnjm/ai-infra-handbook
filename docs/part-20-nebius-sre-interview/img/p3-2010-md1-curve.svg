<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Queueing: response time climbs steeply as utilisation rises</title>
  <desc>Infographic explaining how queueing response time climbs steeply as utilisation rises, showing the M/D/1 curve and key utilisation thresholds.</desc>

  <defs>
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#207448" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#207448" stop-opacity="0.01" />
    </linearGradient>
    <marker id="axisArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="60" y="86" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="60" dy="0">Queueing: response time climbs</tspan>
    <tspan x="60" dy="58">steeply as utilisation rises</tspan>
  </text>

  
  <g id="formula-box">
    <rect x="790" y="45" width="750" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(820, 92)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14" />
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
    </g>
    <text x="1195" y="98" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">r = s (2 - u) / (2 (1 - u))</text>
    <text x="1195" y="142" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1195" dy="0">M/D/1: random arrivals, fixed service times;</tspan>
      <tspan x="1195" dy="32">s is service time, u is utilisation</tspan>
    </text>
  </g>

  
  <g id="side-mini-box">
    <rect x="1100" y="360" width="440" height="380" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1292, 388)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="26" fill="#f5f8f5" />
      <polyline points="28,14 28,28 38,28" />
    </g>
    <text x="1320" y="492" text-anchor="middle" font-family="sans-serif" fill="#303a36">
      <tspan x="1320" dy="0" font-size="28" font-weight="bold">Same idea in requests:</tspan>
      <tspan x="1320" dy="44" font-size="24">99.9 percent allows</tspan>
      <tspan x="1320" dy="36" font-size="24">1,000 failures per million</tspan>
      <tspan x="1320" dy="36" font-size="24">and 86.4 seconds of failure</tspan>
      <tspan x="1320" dy="36" font-size="24">in a 24-hour day.</tspan>
    </text>
  </g>

  
  <g id="line-chart">
    
    <line x1="180" y1="802" x2="1050" y2="802" stroke="#d6e3d8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="180" y1="724" x2="1050" y2="724" stroke="#d6e3d8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="180" y1="594" x2="1050" y2="594" stroke="#d6e3d8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="180" y1="334" x2="1050" y2="334" stroke="#d6e3d8" stroke-width="1.5" stroke-dasharray="4,4" />

    
    <path d="M 220 880 L 220 815 C 260 810 300 806 340 802 C 390 798 440 794 490 789 C 590 778 690 758 790 724 C 850 700 900 660 940 594 C 970 540 1000 440 1015 334 C 1022 280 1030 250 1035 240 L 1035 880 Z" fill="url(#curveGradient)" />

    
    <line x1="490" y1="880" x2="490" y2="550" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" />
    <line x1="490" y1="380" x2="490" y2="250" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" />

    
    <g id="marker-60">
      <rect x="310" y="380" width="360" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="490" y="424" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="490" dy="0">beyond 60 percent</tspan>
        <tspan x="490" dy="34">utilisation the average</tspan>
        <tspan x="490" dy="34">response time doubles</tspan>
        <tspan x="490" dy="34" font-weight="bold">(Systems Performance)</tspan>
      </text>
    </g>

    
    <path d="M 220 815 C 260 810 300 806 340 802 C 390 798 440 794 490 789 C 590 778 690 758 790 724 C 850 700 900 660 940 594 C 970 540 1000 440 1015 334 C 1022 280 1030 250 1035 240" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" />

    
    <line x1="180" y1="880" x2="1060" y2="880" stroke="#303a36" stroke-width="3" marker-end="url(#axisArrow)" />
    <line x1="180" y1="880" x2="180" y2="230" stroke="#303a36" stroke-width="3" marker-end="url(#axisArrow)" />

    
    <text x="100" y="555" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" transform="rotate(-90 100 555)">mean response time as a multiple of service time s</text>

    
    <g id="x-axis-marks">
      <line x1="340" y1="880" x2="340" y2="892" stroke="#303a36" stroke-width="3" />
      <text x="340" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">50</text>

      <line x1="490" y1="880" x2="490" y2="892" stroke="#303a36" stroke-width="3" />
      <text x="490" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">60</text>

      <line x1="790" y1="880" x2="790" y2="892" stroke="#303a36" stroke-width="3" />
      <text x="790" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">80</text>

      <line x1="940" y1="880" x2="940" y2="892" stroke="#303a36" stroke-width="3" />
      <text x="940" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">90</text>

      <line x1="1015" y1="880" x2="1015" y2="892" stroke="#303a36" stroke-width="3" />
      <text x="1015" y="924" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">95</text>
    </g>

    
    <text x="617" y="972" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">utilisation u (percent busy)</text>

    
    <g id="point-50">
      <circle cx="340" cy="802" r="8" fill="#207448" />
      <line x1="340" y1="754" x2="340" y2="794" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
      <rect x="180" y="670" width="270" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="315" y="705" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="315" dy="0">at 50 percent busy:</tspan>
        <tspan x="315" dy="32" font-weight="bold">1.5 x service time</tspan>
      </text>
    </g>

    
    <g id="point-80">
      <circle cx="790" cy="724" r="8" fill="#207448" />
      <line x1="760" y1="712" x2="782" y2="724" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
      <rect x="540" y="670" width="220" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="650" y="705" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="650" dy="0">at 80 percent:</tspan>
        <tspan x="650" dy="32" font-weight="bold">3 x</tspan>
      </text>
    </g>

    
    <g id="point-90">
      <circle cx="940" cy="594" r="10" fill="#ffffff" stroke="#db8129" stroke-width="5" />
      <line x1="940" y1="650" x2="940" y2="604" stroke="#db8129" stroke-width="2" stroke-dasharray="4,4" />
      <rect x="830" y="650" width="220" height="84" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      <text x="940" y="685" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="940" dy="0">at 90 percent:</tspan>
        <tspan x="940" dy="32" fill="#db8129">5.5 x</tspan>
      </text>
    </g>

    
    <g id="point-95">
      <circle cx="1015" cy="334" r="8" fill="#207448" />
      <line x1="980" y1="322" x2="1007" y2="330" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
      <rect x="750" y="280" width="230" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="865" y="315" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="865" dy="0">at 95 percent:</tspan>
        <tspan x="865" dy="32" font-weight="bold">10.5 x</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-note">
    <rect x="60" y="1030" width="1480" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(90, 1050)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="24" />
      <line x1="28" y1="26" x2="28" y2="40" />
      <circle cx="28" cy="17" r="1" fill="#207448" />
    </g>
    <text x="820" y="1070" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="820" dy="0">a simplified model, treat it as a shape; p95 latency can rise steeply</tspan>
      <tspan x="820" dy="34">as load nears a limit (AI Systems Performance Engineering, chapter 16)</tspan>
    </text>
  </g>
</svg>