<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>An inference gateway rate limiter [my addition]</title>
  <desc>Flowchart diagram showing an inference gateway rate limiter with request, gateway, bucket reservation, engine, refund unused, and 429 retry-after.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">An inference gateway rate limiter [my addition]</text>

  
  
  <line x1="360" y1="295" x2="450" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="700" y1="295" x2="790" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1150" y1="295" x2="1240" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1355" y1="400" x2="1355" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1195 675 L 990 675 Q 970 675 970 655 L 970 400" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="575" y1="400" x2="575" y2="570" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  
  <g id="node-request">
    <rect x="130" y="190" width="230" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="221" y="233" width="48" height="38" rx="6" />
      <polyline points="221,239 245,257 269,239" />
      <line x1="233" y1="262" x2="257" y2="262" />
    </g>
    <text x="245" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Request</text>
  </g>

  
  <g id="node-gateway">
    <rect x="450" y="190" width="250" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 553 277 L 553 249 C 553 237 563 231 575 231 C 587 231 597 237 597 249 L 597 277" />
      <path d="M 563 277 L 563 253 C 563 247 568 243 575 243 C 582 243 587 247 587 253 L 587 277" />
      <line x1="549" y1="277" x2="601" y2="277" />
      <line x1="551" y1="247" x2="599" y2="247" />
    </g>
    <text x="575" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Gateway</text>
  </g>

  
  <g id="node-bucket-reserve">
    <rect x="790" y="190" width="360" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="970" cy="240" rx="20" ry="7" />
      <path d="M 950 240 L 956 273 C 957 277 962 279 970 279 C 978 279 983 277 984 273 L 990 240" />
      <path d="M 953 256 C 957 261 983 261 987 256" stroke-dasharray="3 3" />
      <path d="M 950 240 C 950 227 990 227 990 240" />
    </g>
    <text x="970" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Bucket: reserve</text>
  </g>

  
  <g id="node-engine">
    <rect x="1240" y="190" width="230" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1339" y="237" width="32" height="32" rx="5" />
      <rect x="1347" y="245" width="16" height="16" rx="2" fill="#207448" fill-opacity="0.15" />
      <line x1="1345" y1="229" x2="1345" y2="237" />
      <line x1="1355" y1="229" x2="1355" y2="237" />
      <line x1="1365" y1="229" x2="1365" y2="237" />
      <line x1="1345" y1="269" x2="1345" y2="277" />
      <line x1="1355" y1="269" x2="1355" y2="277" />
      <line x1="1365" y1="269" x2="1365" y2="277" />
      <line x1="1331" y1="245" x2="1339" y2="245" />
      <line x1="1331" y1="253" x2="1339" y2="253" />
      <line x1="1331" y1="261" x2="1339" y2="261" />
      <line x1="1371" y1="245" x2="1379" y2="245" />
      <line x1="1371" y1="253" x2="1379" y2="253" />
      <line x1="1371" y1="261" x2="1379" y2="261" />
    </g>
    <text x="1355" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Engine</text>
  </g>

  
  
  <g id="node-retry-after">
    <rect x="385" y="570" width="380" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="575" cy="635" r="20" />
      <polyline points="575,623 575,635 586,635" />
      <line x1="575" y1="611" x2="575" y2="615" />
      <line x1="570" y1="611" x2="580" y2="611" />
    </g>
    <text x="575" y="725" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">429 + Retry-After</text>
  </g>

  
  <g id="node-refund-unused">
    <rect x="1195" y="570" width="320" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1373 633 A 18 18 0 1 0 1371 645" />
      <polyline points="1373,623 1373,633 1363,633" />
      <circle cx="1355" cy="633" r="7" />
      <line x1="1355" y1="629" x2="1355" y2="637" />
      <line x1="1351" y1="633" x2="1359" y2="633" />
    </g>
    <text x="1355" y="725" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Refund unused</text>
  </g>
</svg>