<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>A full conntrack table: new connections fail, old ones keep working</title>
  <desc>Diagram showing a full conntrack table rejecting new connections while established flows continue working, diagnostic steps, Kubernetes implications, and remedies.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">A full conntrack table: new connections fail, old ones keep working</text>

  

  
  <rect x="40" y="110" width="280" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(150, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M -25 -5 C -15 -20, 15 -20, 25 -5" />
    <path d="M -35 15 C -20 -5, 20 -5, 35 15" />
    <circle cx="0" cy="30" r="10" fill="#207448" />
  </g>

  
  <rect x="55" y="240" width="250" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="180" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="180" dy="0">established flow:</tspan>
    <tspan x="180" dy="32">keeps its slot,</tspan>
    <tspan x="180" dy="32">works</tspan>
  </text>

  
  <path d="M 320 230 L 398 230" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />
  <path d="M 320 320 L 398 320" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />
  <path d="M 320 410 L 398 410" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />

  
  <rect x="400" y="110" width="800" height="420" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <text x="800" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">conntrack table (hash table)</text>

  
  <rect x="520" y="172" width="560" height="50" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="206" text-anchor="middle" font-family="monospace, ui-monospace, sans-serif" font-size="24" font-weight="bold" fill="#303a36">nf_conntrack_count = nf_conntrack_max</text>

  
  
  <rect x="420" y="235" width="760" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="282" text-anchor="middle" font-family="monospace, ui-monospace, sans-serif" font-size="24" fill="#303a36">source address, source port, destination address, destination port, protocol</text>

  
  <rect x="420" y="325" width="760" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="372" text-anchor="middle" font-family="monospace, ui-monospace, sans-serif" font-size="24" fill="#303a36">source address, source port, destination address, destination port, protocol</text>

  
  <rect x="420" y="415" width="760" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="462" text-anchor="middle" font-family="monospace, ui-monospace, sans-serif" font-size="24" fill="#303a36">source address, source port, destination address, destination port, protocol</text>


  
  
  <g transform="translate(1220, 240)">
    <rect x="-10" y="0" width="20" height="230" rx="4" fill="#db8129" stroke="#db8129" stroke-width="2" />
    
    <circle cx="0" cy="115" r="8" fill="#ffffff" />
    <path d="M -3 115 L -5 130 L 5 130 L 3 115 Z" fill="#ffffff" />
  </g>

  
  <rect x="1260" y="110" width="300" height="420" rx="16" fill="#fdf3e8" stroke="#db8129" stroke-width="2" />

  
  <g transform="translate(1410, 160)" stroke="#db8129" stroke-width="4" fill="none">
    <rect x="-24" y="-10" width="48" height="42" rx="6" />
    <path d="M -14 -10 L -14 -24 C -14 -34, 14 -34, 14 -24 L 14 -10" stroke-linecap="round" />
  </g>

  
  <rect x="1275" y="235" width="270" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="1410" y="272" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1410" dy="0">new connection:</tspan>
    <tspan x="1410" dy="32">no space,</tspan>
    <tspan x="1410" dy="32">cannot be made</tspan>
  </text>

  
  <path d="M 1320 380 L 1238 380" fill="none" stroke="#db8129" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#arrow-orange)" />
  <path d="M 1320 440 L 1238 440" fill="none" stroke="#db8129" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#arrow-orange)" />


  

  
  <rect x="40" y="560" width="760" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 610)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="0" cy="0" r="16" />
    <path d="M 0 -24 L 0 24 M -24 0 L 24 0 M -17 -17 L 17 17 M -17 17 L 17 -17" stroke-linecap="round" />
  </g>
  <text x="130" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Kubernetes &amp; iptables impact</text>
  <text x="70" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">Kube-proxy Service load balancing through iptables depends</tspan>
    <tspan x="70" dy="36">on conntrack, so a full table looks like Service flakiness;</tspan>
    <tspan x="70" dy="36">pods on one node share that node's table.</tspan>
  </text>

  
  <rect x="830" y="560" width="730" height="250" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(875, 608)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="0" cy="0" r="18" />
    <polyline points="0 -10 0 0 8 4" stroke-linecap="round" />
  </g>
  <text x="910" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Established timeout default: 432000 seconds, five days</text>

  
  <line x1="860" y1="645" x2="1530" y2="645" stroke="#e8f1ea" stroke-width="2" />

  
  <text x="860" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Fixes:</text>
  <text x="860" y="726" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="860" dy="0">raise the maximum if memory allows,</tspan>
    <tspan x="860" dy="36">reuse connections,</tspan>
    <tspan x="860" dy="36">find the client opening connections in a loop</tspan>
  </text>


  

  
  <rect x="40" y="840" width="1520" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="865" width="1470" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="115" cy="912" r="24" fill="#207448" />
  <text x="115" y="921" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="160" y="921" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Read the two numbers: </tspan><tspan font-family="monospace, ui-monospace, sans-serif">sysctl net.netfilter.nf_conntrack_count and nf_conntrack_max</tspan>
  </text>

  
  <rect x="65" y="980" width="1470" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="115" cy="1027" r="24" fill="#207448" />
  <text x="115" y="1036" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="160" y="1036" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Divide: </tspan><tspan font-family="monospace, ui-monospace, sans-serif">count / max</tspan>
  </text>

  
  <rect x="65" y="1095" width="1470" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="115" cy="1150" r="24" fill="#207448" />
  <text x="115" y="1159" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="160" y="1145" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Watch the trend: </tspan>read twice; climbing and staying = flows arrive faster than they leave;
    <tspan x="160" dy="40">rising then falling = a burst</tspan>
  </text>


  
  <rect x="40" y="1300" width="1520" height="80" rx="14" fill="#207448" />
  <text x="800" y="1350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">For any new connections fail, old ones work symptom, compare conntrack count to max first.</text>

</svg>