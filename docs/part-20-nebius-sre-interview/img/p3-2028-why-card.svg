<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>The answer card for why Nebius, why SRE, why inference</title>
  <desc>Visual infographic explaining how to structure answers for Nebius, SRE, and inference interviews using public facts paired with personal experience.</desc>

  <rect width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">The answer card for why Nebius, why SRE, why inference</text>

  
  <g id="card-nebius">
    <rect x="50" y="95" width="1500" height="340" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <rect x="70" y="110" width="48" height="48" rx="8" fill="#e8f1ea"/>
    
    <path d="M 82 142 A 10 10 0 0 1 86 126 A 14 14 0 0 1 106 124 A 10 10 0 0 1 112 142 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <text x="130" y="145" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Why Nebius</text>

    
    <rect x="70" y="170" width="715" height="245" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="202" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">public fact (with the page you read it from)</text>
    <text x="90" y="234" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">Token Factory offers serverless and dedicated endpoints</tspan>
      <tspan x="90" dy="28">behind an OpenAI-compatible API, with a control plane</tspan>
      <tspan x="90" dy="28">kept separate from a region-specific data plane;</tspan>
      <tspan x="90" dy="28">dedicated endpoints let a customer choose GPU type,</tspan>
      <tspan x="90" dy="28">replicas and region; a vendor-tagged case study</tspan>
      <tspan x="90" dy="28">describes lessons such as stopping retry amplification</tspan>
    </text>

    
    <rect x="815" y="170" width="715" height="245" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="835" y="202" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">true fact about you (from your own work)</text>
    <text x="1172" y="295" font-family="sans-serif" font-size="26" font-style="italic" fill="#db8129" text-anchor="middle">write yours here</text>
  </g>

  
  <g id="card-sre">
    <rect x="50" y="455" width="1500" height="315" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <rect x="70" y="470" width="48" height="48" rx="8" fill="#e8f1ea"/>
    
    <circle cx="94" cy="494" r="9" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 94 476 L 94 480 M 94 508 L 94 512 M 76 494 L 80 494 M 108 494 L 112 494 M 81 481 L 84 484 M 104 504 L 107 507 M 81 507 L 84 504 M 104 484 L 107 481" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="130" y="505" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Why SRE</text>

    
    <rect x="70" y="530" width="715" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="562" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">public fact (with the page you read it from)</text>
    <text x="90" y="594" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">SRE means owning whether a service works for its users</tspan>
      <tspan x="90" dy="28">and building the tools that keep it working; the posting</tspan>
      <tspan x="90" dy="28">asks for incident detection, isolation and remediation</tspan>
      <tspan x="90" dy="28">with automation and runbooks, and for post-mortems;</tspan>
      <tspan x="90" dy="28">link one to something you have done</tspan>
    </text>

    
    <rect x="815" y="530" width="715" height="220" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="835" y="562" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">true fact about you (from your own work)</text>
    <text x="1172" y="640" font-family="sans-serif" font-size="26" font-style="italic" fill="#db8129" text-anchor="middle">write yours here</text>
  </g>

  
  <g id="card-inference">
    <rect x="50" y="790" width="1500" height="315" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <rect x="70" y="805" width="48" height="48" rx="8" fill="#e8f1ea"/>
    
    <rect x="82" y="817" width="24" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 88 812 L 88 817 M 100 812 L 100 817 M 88 841 L 88 846 M 100 841 L 100 846 M 77 823 L 82 823 M 77 835 L 82 835 M 106 823 L 111 823 M 106 835 L 111 835" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="840" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Why inference</text>

    
    <rect x="70" y="865" width="715" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="90" y="897" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">public fact (with the page you read it from)</text>
    <text x="90" y="929" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">inference means running a trained model to answer</tspan>
      <tspan x="90" dy="28">requests; traffic is bursty; latency has two parts, time</tspan>
      <tspan x="90" dy="28">to first token and the gap between tokens; the scarce</tspan>
      <tspan x="90" dy="28">resource is GPU memory held by the KV cache; the</tspan>
      <tspan x="90" dy="28">posting names autoscaling tuned for GPU efficiency</tspan>
      <tspan x="90" dy="28">and request routing</tspan>
    </text>

    
    <rect x="815" y="865" width="715" height="220" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="835" y="897" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">true fact about you (from your own work)</text>
    <text x="1172" y="975" font-family="sans-serif" font-size="26" font-style="italic" fill="#db8129" text-anchor="middle">write yours here</text>
  </g>

  
  <g id="rules-and-followups">
    
    <rect x="50" y="1125" width="735" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="1165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Rules</text>
    <text x="80" y="1205" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">• a weak answer is generic praise you could give any company;</tspan>
      <tspan x="80" dy="30">• never invent either fact;</tspan>
      <tspan x="80" dy="30">• if you cannot fill the public half from a page you have</tspan>
      <tspan x="100" dy="28">read, drop that part;</tspan>
      <tspan x="80" dy="30">• keep the whole answer under 90 seconds</tspan>
    </text>

    
    <rect x="815" y="1125" width="735" height="225" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="845" y="1165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Follow-ups</text>
    <text x="845" y="1205" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">• what do you know about our product;</tspan>
      <tspan x="845" dy="38">• what worries you about this role: say the gap honestly</tspan>
      <tspan x="865" dy="30">and how you are closing it</tspan>
    </text>
  </g>
</svg>