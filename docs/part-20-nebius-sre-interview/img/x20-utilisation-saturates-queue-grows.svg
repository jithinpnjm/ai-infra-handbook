<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>GPU utilisation saturates while the queue keeps growing</title>
  <desc>A line chart showing load, GPU utilisation, and waiting queue over time as batch capacity fills and overload occurs.</desc>

  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif"><tspan x="800" dy="0">GPU utilisation saturates </tspan><tspan x="800" dy="56">while the queue keeps growing</tspan></text>

  
  <line x1="940" y1="170" x2="940" y2="890" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>

  
  <rect x="825" y="125" width="230" height="40" rx="8" fill="#207448"/>
  <text x="940" y="153" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">Batch is full</text>

  
  <rect x="60" y="170" width="1480" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="90" y="275" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Load</text>

  
  <path d="M 400 320 L 1460 210" fill="none" stroke="#e8f1ea" stroke-width="8"/>
  <path d="M 400 320 L 1460 210" fill="none" stroke="#207448" stroke-width="4"/>
  <text x="420" y="295" font-size="24" fill="#303a36" font-family="sans-serif">Requests arrive</text>

  
  <rect x="60" y="410" width="1480" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="90" y="465" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">GPU utilisation</text>

  
  <g transform="translate(90, 520)">
    <line x1="14" y1="-6" x2="14" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="-6" x2="28" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="42" y1="-6" x2="42" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="56" x2="14" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="56" x2="28" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="42" y1="56" x2="42" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="14" x2="0" y2="14" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="28" x2="0" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="42" x2="0" y2="42" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="14" x2="62" y2="14" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="28" x2="62" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="42" x2="62" y2="42" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <rect x="14" y="14" width="28" height="28" rx="3" fill="#207448"/>
  </g>
  <text x="165" y="556" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">GPU</text>

  
  <line x1="400" y1="470" x2="1460" y2="470" stroke="#9bbba2" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="410" y="458" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">100 percent</text>

  
  <path d="M 400 610 Q 500 470 580 470 L 1460 470" fill="none" stroke="#e8f1ea" stroke-width="8"/>
  <path d="M 400 610 Q 500 470 580 470 L 1460 470" fill="none" stroke="#207448" stroke-width="4"/>

  
  <line x1="680" y1="470" x2="1400" y2="470" stroke="#db8129" stroke-width="8" stroke-linecap="round"/>

  
  <line x1="1180" y1="470" x2="1180" y2="520" stroke="#db8129" stroke-width="3"/>
  <rect x="980" y="520" width="400" height="75" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="1180" y="550" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif"><tspan x="1180" dy="0">Looks busy at light load </tspan><tspan x="1180" dy="30">and at overload</tspan></text>

  
  <rect x="60" y="690" width="1480" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="90" y="795" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Waiting queue</text>

  
  <path d="M 400 840 L 940 840 L 1460 730" fill="none" stroke="#e8f1ea" stroke-width="8"/>
  <path d="M 400 840 L 940 840 L 1460 730" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="940" cy="840" r="6" fill="#207448"/>
  <text x="1000" y="760" font-size="24" fill="#303a36" font-family="sans-serif"><tspan x="1000" dy="0">Queue grows, </tspan><tspan x="1000" dy="30">utilisation cannot rise</tspan></text>

  
  <line x1="400" y1="925" x2="1460" y2="925" stroke="#303a36" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <text x="1480" y="933" font-size="26" font-weight="bold" fill="#303a36" font-family="sans-serif">Time</text>

  
  <text x="1540" y="965" text-anchor="end" font-size="24" font-family="monospace" fill="#303a36">vllm:num_requests_waiting</text>

  
  <rect x="60" y="990" width="1480" height="70" rx="10" fill="#207448"/>
  <text x="800" y="1034" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">Utilisation cannot tell busy from overloaded.</text>
</svg>