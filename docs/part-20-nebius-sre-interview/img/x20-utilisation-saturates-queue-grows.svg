<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>GPU utilisation saturates while the queue keeps growing</title>
  <desc>A multi-panel chart illustrating that GPU utilisation hits 100 percent once a batch is full, after which requests accumulate in a waiting queue without further utilisation changes.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">GPU utilisation saturates while the queue keeps growing</text>

  
  <g id="panel-load">
    <rect x="60" y="130" width="1480" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="100" y="255" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Load</text>

    
    <rect x="330" y="145" width="1185" height="200" rx="8" fill="#ffffff" />

    
    <path d="M 360 315 L 1480 185" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <rect x="380" y="165" width="220" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="490" y="198" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Requests arrive</text>
    <line x1="490" y1="213" x2="490" y2="285" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  </g>

  
  <g id="panel-utilisation">
    <rect x="60" y="380" width="1480" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(90, 420)">
      
      <line x1="16" y1="6" x2="16" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="6" x2="30" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="6" x2="44" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="60" x2="16" y2="66" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="60" x2="30" y2="66" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="44" y1="60" x2="44" y2="66" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="16" x2="0" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="30" x2="0" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="6" y1="44" x2="0" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="60" y1="16" x2="66" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="60" y1="30" x2="66" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="60" y1="44" x2="66" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      
      <rect x="6" y="6" width="48" height="48" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">GPU</text>
    </g>

    
    <text x="80" y="540" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPU utilisation</text>

    
    <rect x="330" y="395" width="1185" height="310" rx="8" fill="#ffffff" />

    
    <line x1="330" y1="490" x2="1515" y2="490" stroke="#b2ccb9" stroke-width="2" stroke-dasharray="6,6" />

    
    <rect x="350" y="425" width="180" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="440" y="457" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">100 percent</text>

    
    <path d="M 360 670 C 440 670, 560 490, 720 490 L 880 490" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" />

    
    <line x1="880" y1="490" x2="1480" y2="490" stroke="#db8129" stroke-width="6" stroke-linecap="round" />

    
    <rect x="940" y="550" width="480" height="92" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3" />
    <text x="1180" y="588" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">Looks busy at light load</text>
    <text x="1180" y="624" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">and at overload</text>
    <line x1="1180" y1="550" x2="1180" y2="504" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  </g>

  
  <g id="panel-queue">
    <rect x="60" y="740" width="1480" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="80" y="875" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Waiting queue</text>

    
    <rect x="330" y="755" width="1185" height="230" rx="8" fill="#ffffff" />

    
    <line x1="360" y1="945" x2="880" y2="945" stroke="#207448" stroke-width="6" stroke-linecap="round" />

    
    <line x1="880" y1="945" x2="1480" y2="855" stroke="#207448" stroke-width="6" stroke-linecap="round" />

    
    <rect x="920" y="768" width="460" height="74" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1150" y="800" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Queue grows,</text>
    <text x="1150" y="830" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">utilisation cannot rise</text>
  </g>

  
  
  <line x1="880" y1="472" x2="880" y2="975" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" />

  
  <rect x="765" y="415" width="230" height="48" rx="24" fill="#207448" />
  <text x="880" y="448" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Batch is full</text>

  
  <line x1="330" y1="1025" x2="1440" y2="1025" stroke="#303a36" stroke-width="3" marker-end="url(#arrow)" />
  <text x="1460" y="1033" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Time</text>

  
  <text x="1515" y="1075" text-anchor="end" font-family="monospace" font-size="24" fill="#303a36">vllm:num_requests_waiting</text>

  
  <rect x="60" y="1105" width="1480" height="68" rx="12" fill="#207448" />
  <text x="800" y="1149" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Utilisation cannot tell busy from overloaded.</text>
</svg>