<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Why strace slows a process and what to try first</title>
  <desc>Visual infographic explaining why strace slows process execution and safe alternatives to try first.</desc>

  <defs>
    
    <marker id="arrow-green-right" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto">
      <path d="M 11 2 L 1 7 L 11 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange-right" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Why strace slows a process and what to try first</text>

  
  
  
  <rect x="40" y="130" width="740" height="940" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  
  <line x1="160" y1="260" x2="160" y2="920" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  
  <line x1="410" y1="260" x2="410" y2="790" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  
  <line x1="660" y1="260" x2="660" y2="920" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  
  <rect x="60" y="150" width="200" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <rect x="132" y="162" width="56" height="42" rx="5" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="132" y1="174" x2="188" y2="174" stroke="#207448" stroke-width="3" />
  <circle cx="143" cy="168" r="2.5" fill="#207448" />
  <circle cx="151" cy="168" r="2.5" fill="#207448" />
  <circle cx="159" cy="168" r="2.5" fill="#207448" />
  <text x="160" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Program</text>

  
  <rect x="310" y="150" width="200" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <rect x="387" y="160" width="46" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="399" y="171" width="22" height="22" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="396" y1="154" x2="396" y2="160" stroke="#207448" stroke-width="3" />
  <line x1="410" y1="154" x2="410" y2="160" stroke="#207448" stroke-width="3" />
  <line x1="424" y1="154" x2="424" y2="160" stroke="#207448" stroke-width="3" />
  <line x1="396" y1="204" x2="396" y2="210" stroke="#207448" stroke-width="3" />
  <line x1="410" y1="204" x2="410" y2="210" stroke="#207448" stroke-width="3" />
  <line x1="424" y1="204" x2="424" y2="210" stroke="#207448" stroke-width="3" />
  <line x1="381" y1="168" x2="387" y2="168" stroke="#207448" stroke-width="3" />
  <line x1="381" y1="182" x2="387" y2="182" stroke="#207448" stroke-width="3" />
  <line x1="381" y1="196" x2="387" y2="196" stroke="#207448" stroke-width="3" />
  <line x1="433" y1="168" x2="439" y2="168" stroke="#207448" stroke-width="3" />
  <line x1="433" y1="182" x2="439" y2="182" stroke="#207448" stroke-width="3" />
  <line x1="433" y1="196" x2="439" y2="196" stroke="#207448" stroke-width="3" />
  <text x="410" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Kernel</text>

  
  <rect x="550" y="150" width="210" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="650" cy="177" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="662" y1="189" x2="676" y2="203" stroke="#207448" stroke-width="5" stroke-linecap="round" />
  <circle cx="650" cy="177" r="7" fill="none" stroke="#207448" stroke-width="3" />
  <text x="655" y="240" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">strace (tracer)</text>

  
  <line x1="160" y1="330" x2="396" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-right)" />
  <circle cx="160" cy="330" r="22" fill="#207448" />
  <text x="160" y="338" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="195" y="295" width="190" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="290" y="324" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">system call entry</text>

  
  <line x1="410" y1="460" x2="646" y2="460" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange-right)" />
  <circle cx="410" cy="460" r="22" fill="#db8129" />
  <text x="410" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="425" y="380" width="245" height="74" rx="8" fill="#fffdfa" stroke="#db8129" stroke-width="3" />
  <text x="547" y="410" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="547" dy="0">breakpoint: program</tspan>
    <tspan x="547" dy="30">stopped, tracer runs</tspan>
  </text>

  
  <rect x="70" y="480" width="290" height="95" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" stroke-dasharray="6 4" />
  <text x="215" y="518" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="215" dy="0">Even with -e filters,</tspan>
    <tspan x="215" dy="32">every call stops</tspan>
  </text>
  
  <path d="M 360 528 L 385 528" fill="none" stroke="#db8129" stroke-width="2" stroke-dasharray="4 3" />

  
  <line x1="660" y1="620" x2="424" y2="620" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-left)" />
  <circle cx="660" cy="620" r="22" fill="#207448" />
  <text x="660" y="628" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="475" y="585" width="120" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="535" y="614" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">resume</text>

  
  <line x1="410" y1="740" x2="646" y2="740" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange-right)" />
  <circle cx="410" cy="740" r="22" fill="#db8129" />
  <text x="410" y="748" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="435" y="690" width="225" height="44" rx="8" fill="#fffdfa" stroke="#db8129" stroke-width="3" />
  <text x="547" y="720" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">breakpoint on exit</text>

  
  <line x1="660" y1="860" x2="174" y2="860" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-left)" />
  <circle cx="660" cy="860" r="22" fill="#207448" />
  <text x="660" y="868" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="295" y="825" width="230" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="410" y="854" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">result returned</text>


  
  
  

  
  <rect x="840" y="140" width="720" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="885" cy="187" r="24" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="885,172 885,187 898,187" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="925" y="196" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Book example: dd slowed by a factor of 73</text>

  
  <rect x="840" y="260" width="720" height="565" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  
  <path d="M 885,282 L 908,293 L 908,312 C 908,328 885,339 885,339 C 885,339 862,328 862,312 L 862,293 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <polyline points="874,310 882,318 896,303" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="930" y="320" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Safe answer</text>

  
  <rect x="870" y="355" width="16" height="440" rx="4" fill="#207448" />
  <rect x="1514" y="355" width="16" height="440" rx="4" fill="#207448" />

  
  <rect x="894" y="370" width="612" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1200" y="432" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Prefer /proc, lsof and logs</text>

  
  <rect x="894" y="500" width="612" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1200" y="542" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1200" dy="0">If you must trace: attach to one</tspan>
    <tspan x="1200" dy="32">process briefly with -p PID,</tspan>
    <tspan x="1200" dy="32">write to a file with -o</tspan>
  </text>

  
  <rect x="894" y="660" width="612" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1200" y="715" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1200" dy="0">System-wide: perf trace, Ftrace,</tspan>
    <tspan x="1200" dy="32">BCC or bpftrace tools such as opensnoop</tspan>
  </text>

  
  <rect x="840" y="855" width="720" height="215" rx="14" fill="#242e2b" stroke="#207448" stroke-width="3" />
  
  <circle cx="875" cy="885" r="6" fill="#e8f1ea" opacity="0.4" />
  <circle cx="895" cy="885" r="6" fill="#e8f1ea" opacity="0.4" />
  <circle cx="915" cy="885" r="6" fill="#e8f1ea" opacity="0.4" />
  <text x="875" y="940" font-family="monospace" font-size="24" font-weight="bold" fill="#e8f1ea">
    <tspan x="875" dy="0">strace -f -e trace=%file</tspan>
    <tspan x="875" dy="40">  -e status=failed</tspan>
    <tspan x="875" dy="40">  -o /tmp/gw.trace -p PID</tspan>
  </text>

</svg>