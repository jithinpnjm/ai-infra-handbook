<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Why strace slows a process and what to try first</title>
  <desc>Infographic explaining why strace slows down processes through context switches and breakpoints, along with safe alternative approaches.</desc>

  <defs>
    
    <marker id="arrow-green-right" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-green-left" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M 9 1 L 0 5 L 9 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange-right" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Why strace slows a process and what to try first</text>

  
  <rect x="50" y="110" width="730" height="990" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <line x1="160" y1="230" x2="160" y2="900" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.4" />
  
  <line x1="410" y1="230" x2="410" y2="900" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.4" />
  
  <line x1="660" y1="230" x2="660" y2="900" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.4" />

  
  <rect x="75" y="130" width="170" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="136" y="142" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="136" y1="152" x2="184" y2="152" stroke="#207448" stroke-width="2" />
  <circle cx="144" cy="147" r="2" fill="#207448" />
  <circle cx="150" cy="147" r="2" fill="#207448" />
  <circle cx="156" cy="147" r="2" fill="#207448" />
  <text x="160" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Program</text>

  
  <rect x="325" y="130" width="170" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="386" y="142" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="398" y="150" width="24" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2" />
  <line x1="395" y1="138" x2="395" y2="142" stroke="#207448" stroke-width="2" />
  <line x1="410" y1="138" x2="410" y2="142" stroke="#207448" stroke-width="2" />
  <line x1="425" y1="138" x2="425" y2="142" stroke="#207448" stroke-width="2" />
  <line x1="395" y1="178" x2="395" y2="182" stroke="#207448" stroke-width="2" />
  <line x1="410" y1="178" x2="410" y2="182" stroke="#207448" stroke-width="2" />
  <line x1="425" y1="178" x2="425" y2="182" stroke="#207448" stroke-width="2" />
  <text x="410" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Kernel</text>

  
  <rect x="545" y="130" width="230" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="636" y="142" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 645 153 L 653 160 L 645 167" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="657" y1="167" x2="667" y2="167" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <text x="660" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">strace (tracer)</text>

  
  <circle cx="195" cy="275" r="22" fill="#207448" />
  <text x="195" y="283" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="230" y="283" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">system call entry</text>
  <line x1="160" y1="310" x2="400" y2="310" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green-right)" />

  
  <rect x="425" y="360" width="245" height="100" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <circle cx="455" cy="392" r="20" fill="#db8129" />
  <text x="455" y="399" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="485" y="399" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">breakpoint:</text>
  <text x="435" y="427" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">program stopped,</text>
  <text x="435" y="453" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">tracer runs</text>
  <line x1="410" y1="480" x2="650" y2="480" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange-right)" />

  
  <circle cx="625" cy="545" r="22" fill="#207448" />
  <text x="625" y="553" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="515" y="553" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">resume</text>
  <line x1="660" y1="580" x2="420" y2="580" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green-left)" />

  
  <rect x="425" y="635" width="245" height="70" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <circle cx="455" cy="670" r="20" fill="#db8129" />
  <text x="455" y="677" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="485" y="665" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">breakpoint</text>
  <text x="485" y="692" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">on exit</text>
  <line x1="410" y1="725" x2="650" y2="725" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange-right)" />

  
  <circle cx="625" cy="790" r="22" fill="#207448" />
  <text x="625" y="798" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="435" y="798" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">result returned</text>
  <line x1="660" y1="830" x2="170" y2="830" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green-left)" />

  
  <rect x="80" y="940" width="670" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="125" cy="1000" r="20" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="125" y1="992" x2="125" y2="1003" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="125" cy="1011" r="2.5" fill="#207448" />
  <text x="165" y="988" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">Even with -e filters,</tspan>
    <tspan x="165" dy="34">every call stops</tspan>
  </text>

  
  <rect x="820" y="110" width="730" height="990" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="850" y="130" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="895" cy="185" r="24" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="895,171 895,185 906,185" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="940" y="175" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="940" dy="0">Book example:</tspan>
    <tspan x="940" dy="34">dd slowed by a factor of 73</tspan>
  </text>

  
  
  <path d="M 875 272 L 895 264 L 915 272 C 915 292 895 304 895 304 C 895 304 875 292 875 272 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <path d="M 887 282 L 893 288 L 903 276" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="930" y="292" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Safe answer</text>

  
  <line x1="880" y1="330" x2="880" y2="820" stroke="#207448" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <line x1="1490" y1="330" x2="1490" y2="820" stroke="#207448" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  
  <rect x="850" y="330" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="355" width="60" height="60" rx="8" fill="#207448" />
  <text x="900" y="396" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="955" y="396" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Prefer /proc, lsof and logs</text>

  
  <rect x="850" y="460" width="670" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="510" width="60" height="60" rx="8" fill="#207448" />
  <text x="900" y="551" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="955" y="505" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="955" dy="0">If you must trace: attach to one</tspan>
    <tspan x="955" dy="34">process briefly with -p PID,</tspan>
    <tspan x="955" dy="34">write to a file with -o</tspan>
  </text>

  
  <rect x="850" y="640" width="670" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="690" width="60" height="60" rx="8" fill="#207448" />
  <text x="900" y="731" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="955" y="685" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="955" dy="0">System-wide: perf trace,</tspan>
    <tspan x="955" dy="34">Ftrace, BCC or bpftrace tools</tspan>
    <tspan x="955" dy="34">such as opensnoop</tspan>
  </text>

  
  <rect x="850" y="820" width="670" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="850" y="820" width="670" height="42" rx="12" fill="#207448" />
  <circle cx="875" cy="841" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="895" cy="841" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="915" cy="841" r="6" fill="#ffffff" opacity="0.6" />

  
  <text x="880" y="910" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="880" dy="0">strace -f</tspan>
    <tspan x="880" dy="44">-e trace=%file -e status=failed</tspan>
    <tspan x="880" dy="44">-o /tmp/gw.trace -p PID</tspan>
  </text>

</svg>