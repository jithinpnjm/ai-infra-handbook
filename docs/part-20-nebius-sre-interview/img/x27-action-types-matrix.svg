<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Three action types, and which one changes tomorrow</title>
  <desc>Visual infographic explaining three action types: prevent, detect, and mitigate, and contrasting weak versus strong actions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three action types, and which one changes tomorrow</text>

  
  <g id="column-prevent">
    <rect x="80" y="130" width="450" height="400" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    
    <path d="M 283 162 L 327 162 C 327 192 305 214 305 214 C 305 214 283 192 283 162 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    
    <text x="305" y="255" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#db8129">Prevent</text>
    
    
    <text x="305" y="298" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="305" dy="0">Stops the same failure</tspan>
      <tspan x="305" dy="32">from happening again</tspan>
    </text>
    
    
    <rect x="110" y="380" width="390" height="90" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="305" y="433" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Canary latency gate</text>
  </g>

  
  <g id="column-detect">
    <rect x="575" y="130" width="450" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="800" cy="186" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="800" cy="186" r="7" fill="#207448"/>
    
    
    <text x="800" y="255" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Detect</text>
    
    
    <text x="800" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Finds the failure sooner</text>
    
    
    <rect x="605" y="380" width="390" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="433" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Per-group TTFT p99 alert</text>
  </g>

  
  <g id="column-mitigate">
    <rect x="1070" y="130" width="450" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="1295" cy="186" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 1295 162 L 1295 170 M 1295 202 L 1295 210 M 1271 186 L 1279 186 M 1311 186 L 1319 186 M 1278 169 L 1284 175 M 1306 197 L 1312 203 M 1278 203 L 1284 197 M 1306 175 L 1312 169" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    
    
    <text x="1295" y="255" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Mitigate</text>
    
    
    <text x="1295" y="298" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1295" dy="0">Makes the response</tspan>
      <tspan x="1295" dy="32">faster or safer</tspan>
    </text>
    
    
    <rect x="1100" y="380" width="390" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1295" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1295" dy="0">Runbook step for the</tspan>
      <tspan x="1295" dy="32">gateway weight</tspan>
    </text>
  </g>

  
  <g id="note-prevent">
    <rect x="80" y="560" width="450" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="305" y="598" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="305" dy="0">If every item is detect</tspan>
      <tspan x="305" dy="30">or mitigate, you have</tspan>
      <tspan x="305" dy="30">described how to live</tspan>
      <tspan x="305" dy="30">with the failure.</tspan>
    </text>
  </g>

  
  <g id="wide-strip">
    <rect x="80" y="750" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="110" y="780" width="550" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="385" y="848" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Weak action: Improve monitoring</text>
    
    
    <line x1="665" y1="840" x2="745" y2="840" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    
    
    <rect x="750" y="780" width="740" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1120" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Strong version: one owner, a due date, a measure</text>
  </g>
</svg>