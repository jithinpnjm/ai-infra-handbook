<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>An SLO and alerting platform for 1,000 endpoints [my addition]</title>
  <desc>Architecture of an SLO and alerting platform for 1,000 endpoints, showing rule generation, recording rules, metrics store, burn-rate alerts, and routing by owner.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f5f8f5" />
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">An SLO and alerting platform </tspan>
    <tspan x="800" dy="58">for 1,000 endpoints [my addition]</tspan>
  </text>
  
  <path d="M 320 325 L 365 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <path d="M 625 325 L 670 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <path d="M 930 325 L 975 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <path d="M 1235 325 L 1280 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <path d="M 800 570 L 800 450" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <g id="node-y">
    <rect x="60" y="200" width="260" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(166, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 2 H 32 L 42 12 V 50 H 6 Z" />
      <polyline points="32,2 32,12 42,12" />
      <line x1="14" y1="24" x2="34" y2="24" />
      <line x1="14" y1="34" x2="34" y2="34" />
      <line x1="14" y1="42" x2="26" y2="42" />
    </g>
    <text x="190" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="190" dy="0">SLO file </tspan>
      <tspan x="190" dy="40">per endpoint</tspan>
    </text>
  </g>
  
  <g id="node-gen">
    <rect x="365" y="200" width="260" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(469, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="16" />
      <circle cx="26" cy="26" r="6" />
      <line x1="26" y1="2" x2="26" y2="8" />
      <line x1="26" y1="44" x2="26" y2="50" />
      <line x1="2" y1="26" x2="8" y2="26" />
      <line x1="44" y1="26" x2="50" y2="26" />
      <line x1="9" y1="9" x2="13" y2="13" />
      <line x1="39" y1="39" x2="43" y2="43" />
      <line x1="9" y1="43" x2="13" y2="39" />
      <line x1="39" y1="13" x2="43" y2="9" />
    </g>
    <text x="495" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="495" dy="0">Rule </tspan>
      <tspan x="495" dy="40">generator</tspan>
    </text>
  </g>
  
  <g id="node-rec">
    <rect x="670" y="200" width="260" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(774, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 38 A 22 22 0 1 1 46 38" />
      <circle cx="26" cy="28" r="4" fill="#207448" />
      <line x1="26" y1="28" x2="38" y2="16" />
      <line x1="8" y1="28" x2="14" y2="28" />
      <line x1="26" y1="8" x2="26" y2="14" />
      <line x1="44" y1="28" x2="38" y2="28" />
    </g>
    <text x="800" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Recording </tspan>
      <tspan x="800" dy="40">rules</tspan>
    </text>
  </g>
  
  <g id="node-br">
    <rect x="975" y="200" width="260" height="250" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <g transform="translate(1079, 230)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 26 8 C 18 8 14 14 14 24 C 14 34 8 38 8 40 H 44 C 44 38 38 34 38 24 C 38 14 34 8 26 8 Z" />
      <path d="M 22 44 A 4 4 0 0 0 30 44" />
      <line x1="26" y1="4" x2="26" y2="8" />
    </g>
    <text x="1105" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1105" dy="0">Burn-rate </tspan>
      <tspan x="1105" dy="40">alerts</tspan>
    </text>
  </g>
  
  <g id="node-rt">
    <rect x="1280" y="200" width="260" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(1384, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="15" r="9" />
      <path d="M 8 48 C 8 36 16 32 26 32 C 36 32 44 36 44 48" />
    </g>
    <text x="1410" y="345" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1410" dy="0">Routing by </tspan>
      <tspan x="1410" dy="40">owner</tspan>
    </text>
  </g>
  
  <g id="node-m">
    <rect x="670" y="570" width="260" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(774, 600)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="26" cy="12" rx="20" ry="7" />
      <line x1="6" y1="12" x2="6" y2="40" />
      <line x1="46" y1="12" x2="46" y2="40" />
      <path d="M 6 26 C 6 33 46 33 46 26" />
      <path d="M 6 40 C 6 47 46 47 46 40" />
    </g>
    <text x="800" y="715" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Metrics </tspan>
      <tspan x="800" dy="40">store</tspan>
    </text>
  </g>
</svg>