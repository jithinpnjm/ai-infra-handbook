<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Drill 7: half the lookups are slow because one replica is</title>
  <desc>Kubernetes DNS troubleshooting infographic showing intermittent 5-second delays caused by a degraded CoreDNS replica.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Drill 7: half the lookups are slow because one replica is</text>

  
  
  <rect x="50" y="150" width="230" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="135" y="170" width="60" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="135" y1="184" x2="195" y2="184" stroke="#207448" stroke-width="3" />
  <circle cx="145" cy="177" r="3" fill="#207448" />
  <circle cx="155" cy="177" r="3" fill="#207448" />
  <text x="165" y="260" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">gateway pod</text>

  
  <path d="M 280 240 L 370 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="380" y="150" width="290" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="525" cy="190" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 525 166 L 525 174 M 525 206 L 525 214 M 501 190 L 509 190 M 541 190 L 549 190 M 508 173 L 514 179 M 536 201 L 542 207 M 508 207 L 514 201 M 536 179 L 542 173" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="525" y="260" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Service kube-dns</text>

  
  <path d="M 670 240 L 730 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="740" y="150" width="310" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="865" y="172" width="60" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="882" cy="191" r="7" fill="#207448" />
  <line x1="889" y1="191" x2="915" y2="191" stroke="#207448" stroke-width="4" />
  <text x="895" y="250" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">kube-proxy</text>
  <text x="895" y="285" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">iptables chain</text>

  
  
  <path d="M 1050 200 L 1100 170" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <path d="M 1050 280 L 1100 320" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="1110" y="90" width="440" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1135" y="135" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">CoreDNS replica A</text>
  <text x="1135" y="180" font-family="sans-serif" font-size="24" fill="#303a36">pod IP, healthy node,</text>
  <text x="1135" y="215" font-family="sans-serif" font-size="24" fill="#303a36">answers instantly</text>

  
  <rect x="1110" y="270" width="440" height="175" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <text x="1135" y="315" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">CoreDNS replica B</text>
  <text x="1135" y="360" font-family="sans-serif" font-size="24" fill="#303a36">on a node under heavy CPU</text>
  <text x="1135" y="395" font-family="sans-serif" font-size="24" fill="#303a36">pressure, no errors in logs,</text>
  <text x="1135" y="430" font-family="sans-serif" font-size="24" fill="#db8129" font-weight="bold">very slow</text>

  
  
  <rect x="50" y="475" width="730" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="520" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Result</text>
  <text x="80" y="565" font-family="sans-serif" font-size="24" fill="#303a36">about half of lookups fast, half take five seconds;</text>
  <text x="80" y="605" font-family="monospace" font-size="24" fill="#303a36">nslookup kubernetes.default</text>
  <text x="80" y="640" font-family="sans-serif" font-size="24" fill="#303a36">from a debug pod alternates instant and timeout</text>

  
  <rect x="820" y="475" width="730" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="850" y="520" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Test box</text>
  <text x="850" y="570" font-family="sans-serif" font-size="24" fill="#303a36">query each replica by its pod IP: A instant,</text>
  <text x="850" y="615" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">B times out</text>

  
  <rect x="50" y="695" width="1500" height="385" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="80" y="745" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Fix order from the Kubernetes DNS debugging page</text>

  
  <rect x="80" y="775" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="815" r="20" fill="#207448" />
  <text x="115" y="823" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="150" y="820" font-family="monospace" font-size="24" fill="#303a36">nslookup</text>
  <text x="150" y="855" font-family="monospace" font-size="24" fill="#303a36">kubernetes.default</text>
  <text x="150" y="888" font-family="sans-serif" font-size="24" fill="#303a36">from a pod</text>

  
  <rect x="580" y="775" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="615" cy="815" r="20" fill="#207448" />
  <text x="615" y="823" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="650" y="825" font-family="sans-serif" font-size="24" fill="#303a36">check</text>
  <text x="650" y="865" font-family="monospace" font-size="24" fill="#303a36">/etc/resolv.conf</text>

  
  <rect x="1080" y="775" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="1115" cy="815" r="20" fill="#207448" />
  <text x="1115" y="823" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1150" y="820" font-family="sans-serif" font-size="24" fill="#303a36">list pods with label</text>
  <text x="1150" y="855" font-family="monospace" font-size="24" fill="#303a36">k8s-app=kube-dns</text>
  <text x="1150" y="888" font-family="monospace" font-size="24" fill="#303a36">in kube-system</text>

  
  <rect x="80" y="925" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="965" r="20" fill="#207448" />
  <text x="115" y="973" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="150" y="975" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">read logs</text>

  
  <rect x="580" y="925" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="615" cy="965" r="20" fill="#207448" />
  <text x="615" y="973" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1000" y="965" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="end">confirm kube-dns Service</text>
  <text x="1000" y="1005" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="end">and EndpointSlice</text>

  
  <rect x="1080" y="925" width="440" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <circle cx="1115" cy="965" r="20" fill="#207448" />
  <text x="1115" y="973" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1150" y="960" font-family="sans-serif" font-size="24" fill="#303a36">then move the</text>
  <text x="1150" y="995" font-family="sans-serif" font-size="24" fill="#303a36">unhealthy replica off</text>
  <text x="1150" y="1030" font-family="sans-serif" font-size="24" fill="#303a36">the loaded node</text>

  
  <rect x="50" y="1105" width="1500" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 85 1145 Q 110 1135 135 1145 Q 135 1180 110 1205 Q 85 1180 85 1145 Z" fill="none" stroke="#207448" stroke-width="4" />
  <text x="160" y="1150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Prevention</text>
  <text x="160" y="1195" font-family="sans-serif" font-size="25" fill="#303a36">CoreDNS replicas spread across nodes with NodeLocal DNSCache,</text>
  <text x="160" y="1230" font-family="sans-serif" font-size="25" fill="#303a36">a per-node DaemonSet, in front</text>

  
  <rect x="50" y="1275" width="1500" height="105" rx="12" fill="#207448" />
  <text x="80" y="1337" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Note</text>
  <text x="155" y="1337" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">: intermittent failure tied to one replica means check backends first</text>

</svg>