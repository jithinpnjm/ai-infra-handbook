  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">A 3x burst needs three times the GPUs,</tspan>
    <tspan x="800" dy="55">so the design must queue and shed</tspan>
  </text>

  
  <rect x="60" y="160" width="1480" height="745" rx="16" fill="#ffffff" stroke="#c4d6c8" stroke-width="2" />

  
  <g transform="translate(85, 185)">
