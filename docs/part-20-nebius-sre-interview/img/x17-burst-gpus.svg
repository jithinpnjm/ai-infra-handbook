<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>A 3x burst needs three times the GPUs, so the design must queue and shed</title>
  <desc>Horizontal bar chart showing Peak (28 GPUs), N+1 spare (29 GPUs), and a 3x burst (84 GPUs), illustrating the queue and shed design requirement.</desc>

