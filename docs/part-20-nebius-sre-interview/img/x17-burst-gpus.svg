  <text x="160" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">300 requests per second times 300 output tokens = 90,000 tokens/s,</tspan>
    <tspan x="160" dy="30">needs 28 GPUs at a planning rate of 3,217 tokens/s per GPU (0.6 times 5,361)</tspan>
  </text>

  
