<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Metering is exact and durable, limiting can be approximate</title>
  <desc>Visual comparison between fast, approximate rate limiting and exact, durable metering pipelines.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Metering is exact and durable, limiting can be approximate</text>

  
  <g id="left-lane">
    <rect x="50" y="110" width="560" height="905" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 50 124 A 14 14 0 0 1 64 110 L 596 110 A 14 14 0 0 1 610 124 L 610 175 L 50 175 Z" fill="#207448" />
    <text x="330" y="153" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Rate limiter: fast and approximate</text>

    
    <g id="gateway-box">
      <rect x="90" y="215" width="480" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(130, 262)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
        <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
        <path d="M 28 8 L 28 20 M 28 36 L 28 48 M 8 28 L 20 28 M 36 28 L 48 28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>
      <text x="215" y="303" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Gateway</text>
    </g>

    
    <line x1="330" y1="365" x2="330" y2="465" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="counter-box">
      <rect x="90" y="465" width="480" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(302, 485)">
        <path d="M 6 42 A 24 24 0 1 1 50 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="28" y1="28" x2="42" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="28" r="4" fill="#207448" />
      </g>
      <text x="330" y="585" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Limits tokens and requests</text>
    </g>

    
    <line x1="330" y1="625" x2="330" y2="675" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

    
    <g id="approximate-note">
      <rect x="130" y="675" width="400" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />
      <text x="330" y="725" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">May be approximate</text>
    </g>
  </g>

  
  <line x1="570" y1="290" x2="685" y2="290" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="right-lane">
    <rect x="650" y="110" width="900" height="905" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 650 124 A 14 14 0 0 1 664 110 L 1536 110 A 14 14 0 0 1 1550 124 L 1550 175 L 650 175 Z" fill="#207448" />
    <text x="1100" y="153" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Meter: exact and durable</text>

    
    <g id="usage-event-card">
      <rect x="685" y="195" width="440" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(705, 212)">
        <rect x="0" y="0" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="8" y1="12" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="8" y1="22" x2="28" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="8" y1="32" x2="20" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="755" y="244" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Usage event</text>

      
      <text x="705" y="282" font-family="monospace" font-size="24" fill="#303a36">tenant</text>
      <text x="705" y="316" font-family="monospace" font-size="24" fill="#303a36">model</text>
      <text x="705" y="350" font-family="monospace" font-size="24" fill="#303a36">region</text>
      <text x="705" y="384" font-family="monospace" font-size="24" fill="#303a36">request id</text>

      
      <text x="865" y="282" font-family="monospace" font-size="24" fill="#303a36">prompt tokens</text>
      <text x="865" y="316" font-family="monospace" font-size="24" fill="#303a36">completion tokens</text>
      <text x="865" y="350" font-family="monospace" font-size="24" fill="#303a36">cache hit</text>
      <text x="865" y="384" font-family="monospace" font-size="24" fill="#303a36">status</text>
    </g>

    
    <path d="M 1125 240 C 1205 240, 1205 365, 1125 365" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#loop-arrow)" />
    
    <text x="1215" y="260" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1215" dy="0">Request id as</tspan>
      <tspan x="1215" dy="32">idempotency key:</tspan>
      <tspan x="1215" dy="32">a retried event</tspan>
      <tspan x="1215" dy="32">is counted once</tspan>
    </text>

    
    <line x1="905" y1="405" x2="905" y2="465" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="durable-log-box">
      <rect x="750" y="465" width="640" height="110" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
      
      <g transform="translate(780, 492)">
        <ellipse cx="28" cy="12" rx="24" ry="8" fill="none" stroke="#db8129" stroke-width="4" />
        <path d="M 4 12 L 4 44 A 24 8 0 0 0 52 44 L 52 12" fill="none" stroke="#db8129" stroke-width="4" />
        <path d="M 4 28 A 24 8 0 0 0 52 28" fill="none" stroke="#db8129" stroke-width="4" />
      </g>
      <text x="860" y="533" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Durable log</text>
    </g>

    
    <line x1="905" y1="575" x2="905" y2="635" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="aggregator-box">
      <rect x="750" y="635" width="640" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(780, 662)">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
        <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="860" y="703" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Aggregator writes hourly totals</text>
    </g>

    
    <line x1="905" y1="745" x2="905" y2="805" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g id="invoice-box">
      <rect x="830" y="805" width="480" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      
      <g transform="translate(865, 827)">
        <path d="M 8 4 L 48 4 L 48 52 L 40 46 L 32 52 L 24 46 L 16 52 L 8 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
        <line x1="18" y1="18" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="18" y1="30" x2="38" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>
      <text x="945" y="867" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Invoice</text>
    </g>

    
    <g id="stream-side-note">
      <rect x="680" y="925" width="840" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
      <text x="1100" y="955" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1100" dy="0">Bill tokens actually delivered if a stream dies at token 100,</tspan>
        <tspan x="1100" dy="30">a product choice to name aloud.</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1040" width="1500" height="80" rx="12" fill="#207448" />
    <text x="800" y="1090" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A late bill is an annoyance. A wrong bill is a trust problem.</text>
  </g>
</svg>