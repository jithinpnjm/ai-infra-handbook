<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Scale to zero: the first request pays the full cold start</title>
  <desc>Visual infographic showing how scale-to-zero results in long cold starts for the first request, outlining trade-offs, checklist conditions, and SLA decisions.</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="60" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scale to zero: the first request pays the full cold start</text>

  
  <rect x="60" y="130" width="940" height="710" rx="16" fill="#ffffff" stroke="#d5dfd8" stroke-width="2" />

  
  <line x1="100" y1="290" x2="960" y2="290" stroke="#b8c8bf" stroke-width="3" stroke-dasharray="8,6" />

  
  <rect x="100" y="230" width="400" height="60" rx="8" fill="#e2e8e4" stroke="#8fa39a" stroke-width="2" />
  <text x="300" y="269" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#505f59">Idle GPU hours</text>

  
  <rect x="760" y="230" width="200" height="60" rx="8" fill="#e2e8e4" stroke="#8fa39a" stroke-width="2" />

  
  <rect x="100" y="330" width="860" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(130, 346)">
    <circle cx="16" cy="16" r="14" fill="#207448" />
    <path d="M16,30 L16,46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="16" cy="16" r="6" fill="#ffffff" />
  </g>
  <text x="540" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">First request after zero: waits for the full cold start</text>

  
  <rect x="100" y="450" width="860" height="150" rx="14" fill="#fffaf4" stroke="#db8129" stroke-width="3" />

  <text x="530" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">About 170 seconds before the first token in the section 3 example</text>

  
  <rect x="300" y="525" width="460" height="52" rx="10" fill="#db8129" />
  
  <g transform="translate(325, 536)">
    <path d="M14,2 L26,26 L2,26 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <line x1="14" y1="10" x2="14" y2="17" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="14" cy="22" r="1.8" fill="#ffffff" />
  </g>
  <text x="540" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Breaks an interactive timeout</text>

  
  
  <rect x="100" y="640" width="340" height="140" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="2" />
  <circle cx="150" cy="685" r="24" fill="#207448" />
  <text x="150" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(240, 660)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,28 C4,28 2,20 8,14 C6,6 18,2 24,8 C30,4 40,8 38,18 C44,18 46,28 38,28 Z" />
    <line x1="24" y1="20" x2="24" y2="38" />
    <polyline points="17,32 24,39 31,32" />
  </g>

  
  <rect x="455" y="640" width="80" height="140" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="2" />
  <circle cx="495" cy="685" r="24" fill="#207448" />
  <text x="495" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(477, 722)" stroke="#db8129" stroke-width="2.5" fill="none">
    <ellipse cx="18" cy="8" rx="16" ry="5" />
    <path d="M2,8 L2,24 C2,27 9,30 18,30 C27,30 34,27 34,24 L34,8" />
  </g>

  
  <rect x="550" y="640" width="240" height="140" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="2" />
  <circle cx="600" cy="685" r="24" fill="#207448" />
  <text x="600" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(670, 660)" stroke="#db8129" stroke-width="3" fill="none">
    <circle cx="22" cy="22" r="10" />
    <path d="M22,2 L22,8 M22,36 L22,42 M2,22 L8,22 M36,22 L42,22 M8,8 L13,13 M31,31 L36,36 M8,36 L13,31 M31,13 L36,8" stroke-linecap="round" />
  </g>

  
  <rect x="805" y="640" width="155" height="140" rx="10" fill="#fdf3eb" stroke="#db8129" stroke-width="2" />
  <circle cx="855" cy="685" r="24" fill="#207448" />
  <text x="855" y="694" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(895, 660)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18,38 C8,38 4,30 8,20 C12,14 16,16 18,4 C24,12 32,18 32,26 C32,34 26,38 18,38 Z" />
  </g>

  
  <rect x="1040" y="130" width="500" height="710" rx="16" fill="#ffffff" stroke="#d5dfd8" stroke-width="2" />

  
  <rect x="1065" y="175" width="450" height="170" rx="14" fill="#f8faf8" stroke="#c2d2c7" stroke-width="2" />
  <rect x="1090" y="235" width="44" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1155" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1155" dy="0">Client tolerates a long</tspan>
    <tspan x="1155" dy="38">first request or a retry</tspan>
  </text>

  
  <rect x="1065" y="390" width="450" height="170" rx="14" fill="#f8faf8" stroke="#c2d2c7" stroke-width="2" />
  <rect x="1090" y="450" width="44" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1155" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1155" dy="0">Weights cached locally, so</tspan>
    <tspan x="1155" dy="38">the download stage is gone</tspan>
  </text>

  
  <rect x="1065" y="605" width="450" height="170" rx="14" fill="#f8faf8" stroke="#c2d2c7" stroke-width="2" />
  <rect x="1090" y="665" width="44" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1155" y="678" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1155" dy="0">Owner accepts the cold-start</tspan>
    <tspan x="1155" dy="38">delay on first request</tspan>
  </text>

  
  
  <rect x="60" y="875" width="720" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(95, 903)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24,4 L44,12 L44,26 C44,38 24,48 24,48 C24,48 4,38 4,26 L4,12 Z" />
    <polyline points="15,25 21,31 33,19" />
  </g>
  <text x="175" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Has an SLA: minimum one replica</text>

  
  <rect x="820" y="875" width="720" height="105" rx="14" fill="#eef2f0" stroke="#7b8c85" stroke-width="2" />
  
  <g transform="translate(855, 903)" stroke="#505f59" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="20" />
    <polyline points="24,12 24,24 34,24" />
  </g>
  <text x="935" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#46544f">Long first request acceptable: zero allowed</text>

  
  <rect x="60" y="1015" width="1480" height="75" rx="12" fill="#207448" />
  <text x="800" y="1062" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Cost saving from zero versus the cost of failing a customer's first request.</text>
</svg>