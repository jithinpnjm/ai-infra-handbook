<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Scale to zero: the first request pays the full cold start</title>
  <desc>Visual infographic explaining the cold start delay and trade-offs when scaling an endpoint to zero.</desc>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scale to zero: the first request pays the full cold start</text>

  
  <rect x="50" y="120" width="940" height="630" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="90" y="150" width="860" height="150" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>

  
  <g transform="translate(115, 195)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="530" y="202" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="530" dy="0">About 170 seconds before the first token</tspan>
    <tspan x="530" dy="34">in the section 3 example</tspan>
  </text>
  <text x="530" y="274" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Breaks an interactive timeout</text>

  
  <path d="M 380 435 L 380 345 L 460 345 L 460 300 M 460 345 L 540 345 L 540 435" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

  
  
  <line x1="80" y1="480" x2="960" y2="480" stroke="#94a3b8" stroke-width="3"/>

  
  <text x="235" y="420" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Idle GPU hours</text>
  <rect x="90" y="445" width="290" height="35" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

  
  <rect x="380" y="445" width="160" height="35" rx="6" fill="#fed7aa" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="380" y1="435" x2="380" y2="490" stroke="#db8129" stroke-width="2"/>
  <line x1="540" y1="435" x2="540" y2="490" stroke="#db8129" stroke-width="2"/>

  
  <path d="M 540 480 L 545 375 Q 580 350 615 375 L 620 480 Z" fill="#bbf7d0" stroke="#207448" stroke-width="3"/>

  
  <rect x="620" y="445" width="120" height="35" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

  
  <path d="M 740 480 L 743 410 Q 760 395 777 410 L 780 480 Z" fill="#bbf7d0" stroke="#207448" stroke-width="2"/>

  
  <rect x="780" y="445" width="160" height="35" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

  
  <circle cx="380" cy="480" r="6" fill="#303a36"/>
  <line x1="380" y1="486" x2="380" y2="560" stroke="#303a36" stroke-width="3"/>
  <polygon points="372,492 388,492 380,480" fill="#303a36"/>

  
  <rect x="100" y="560" width="560" height="120" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="380" y="612" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="380" dy="0">First request after zero:</tspan>
    <tspan x="380" dy="34">waits for the full cold start</tspan>
  </text>

  
  <rect x="1010" y="120" width="540" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1252, 142)">
    <rect x="0" y="8" width="56" height="62" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <rect x="16" y="0" width="24" height="14" rx="4" fill="#207448"/>
    <line x1="14" y1="30" x2="42" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="44" x2="42" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="56" x2="32" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="1030" y="230" width="500" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1052" y="272" width="36" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1110" y="284" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1110" dy="0">Client tolerates a long</tspan>
    <tspan x="1110" dy="32">first request or a retry</tspan>
  </text>

  
  <rect x="1030" y="380" width="500" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1052" y="422" width="36" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1110" y="434" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1110" dy="0">Weights cached locally, so</tspan>
    <tspan x="1110" dy="32">the download stage is gone</tspan>
  </text>

  
  <rect x="1030" y="530" width="500" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1052" y="572" width="36" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1110" y="584" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1110" dy="0">Owner accepts the cold-start</tspan>
    <tspan x="1110" dy="32">delay on first request</tspan>
  </text>

  
  <line x1="80" y1="835" x2="1520" y2="835" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="800,815 820,835 800,855 780,835" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="80" y="790" width="670" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(105, 807)">
    <rect x="0" y="0" width="48" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="11" r="3" fill="#207448"/>
    <rect x="0" y="28" width="48" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="39" r="3" fill="#207448"/>
  </g>
  <text x="430" y="846" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Has an SLA: minimum one replica</text>

  
  <rect x="850" y="790" width="670" height="90" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  
  <g transform="translate(875, 810)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="25" y1="12" x2="25" y2="26" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1200" y="846" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#475569">Long first request acceptable: zero allowed</text>

  
  <rect x="50" y="930" width="1500" height="70" rx="12" fill="#207448"/>
  <text x="800" y="974" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Cost saving from zero versus the cost of failing a customer's first request.</text>
</svg>