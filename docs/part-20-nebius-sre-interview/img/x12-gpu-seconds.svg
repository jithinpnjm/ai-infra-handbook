<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>One request uses GPU seconds for prefill and then for decode</title>
  <desc>Infographic showing GPU seconds consumed across prefill and decode stages for a single request, the resulting request throughput, and a Little's law verification.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">One request uses GPU seconds for prefill and then for decode</text>

  
  <path d="M 80 215 L 80 185 L 560 185 L 570 170 L 580 185 L 1060 185 L 1060 215" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="570" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">GPU seconds per request: 0.0829 + 0.0933 = 0.1762 s</text>

  
  <line x1="1060" y1="185" x2="1098" y2="185" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  
  <rect x="80" y="240" width="470" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="125" cy="285" r="24" fill="#207448" />
  <text x="125" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>

  
  <g transform="translate(165, 257)">
    <path d="M 10 5 L 34 5 L 46 17 L 46 51 L 10 51 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 34 5 L 34 17 L 46 17" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 18 27 L 24 33 L 18 39" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="39" x2="38" y2="39" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>

  
  <text x="235" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Prefill</text>
  <text x="110" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">2,000 prompt tokens</text>
  <text x="110" y="415" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#207448">0.0829 s</text>
  <text x="110" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">at 24,134 tokens/s</text>

  
  <rect x="550" y="240" width="510" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <circle cx="595" cy="285" r="24" fill="#207448" />
  <text x="595" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

  
  <g transform="translate(635, 257)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="19" y="19" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="18" y1="3" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="3" x2="28" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="3" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="46" x2="18" y2="53" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="46" x2="28" y2="53" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="46" x2="38" y2="53" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="3" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="3" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="3" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="18" x2="53" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="28" x2="53" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="38" x2="53" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="705" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Decode</text>
  <text x="580" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">500 output tokens</text>
  <text x="580" y="415" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#207448">0.0933 s</text>
  <text x="580" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">at 5,361 tokens/s at batch 64</text>

  
  <g transform="translate(85, 532)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#55605a" stroke-width="2" />
    <line x1="12" y1="11" x2="12" y2="16" stroke="#55605a" stroke-width="2" stroke-linecap="round" />
    <circle cx="12" cy="7.5" r="1.25" fill="#55605a" />
  </g>
  <text x="115" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-style="italic" fill="#55605a">this is a ceiling, not a promise</text>

  
  <rect x="1100" y="140" width="420" height="360" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />

  
  <circle cx="1145" cy="185" r="24" fill="#207448" />
  <text x="1145" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>

  
  <g transform="translate(1190, 157)">
    <path d="M 8 40 A 20 20 0 1 1 48 40" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="28" y1="36" x2="42" y2="20" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="28" cy="36" r="4" fill="#207448" />
  </g>

  
  <text x="1135" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Requests per second:</text>
  <text x="1135" y="340" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#303a36">1 / 0.1762 =</text>
  
  
  <rect x="1135" y="380" width="350" height="85" rx="12" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
  <text x="1310" y="440" font-family="ui-monospace, SFMono-Regular, monospace" font-size="52" font-weight="bold" fill="#db8129" text-anchor="middle">5.68</text>

  
  <rect x="80" y="620" width="1440" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <g transform="translate(110, 667)">
    <line x1="6" y1="48" x2="50" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="28" y1="8" x2="28" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="10" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 10 16 L 3 32 L 17 32 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M 46 16 L 39 32 L 53 32 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  </g>

  
  <text x="190" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">Little's law check: </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, monospace">64 in flight / 5.68 per s = 11.3 s in system,</tspan>
    <tspan x="190" dy="44">and 22.4 ms per output token</tspan>
  </text>
</svg>