<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Drill 8: a Service with no endpoints</title>
  <desc>Visual comparison showing a Kubernetes Service selector mismatch against Pod labels, EndpointSlice controller evaluation failure, fork of root causes, targetPort verification, fix verification, and prevention rules.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#207448">Drill 8: a Service with no endpoints</text>

  
  
  

  
  <g id="service-card">
    <rect x="50" y="105" width="630" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(75, 125)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="28" r="9" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="145" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#207448">Service</text>
    <text x="275" y="152" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="26" font-weight="bold" fill="#303a36">llm-server</text>

    
    <text x="75" y="208" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" fill="#303a36">ClusterIP 10.0.1.175   port 80/TCP</text>

    
    <rect x="75" y="238" width="580" height="60" rx="8" fill="#fff5f5" stroke="#d9383a" stroke-width="2"/>
    <text x="95" y="276" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" font-weight="bold" fill="#d9383a">selector app: llm-serv</text>
  </g>

  
  <g id="mismatch-mark">
    
    <line x1="680" y1="268" x2="745" y2="268" stroke="#d9383a" stroke-width="2.5" stroke-dasharray="6 4"/>
    <line x1="855" y1="268" x2="920" y2="268" stroke="#d9383a" stroke-width="2.5" stroke-dasharray="6 4"/>

    
    <circle cx="800" cy="185" r="30" fill="#fff5f5" stroke="#d9383a" stroke-width="3.5"/>
    <line x1="786" y1="180" x2="814" y2="180" stroke="#d9383a" stroke-width="4" stroke-linecap="round"/>
    <line x1="786" y1="192" x2="814" y2="192" stroke="#d9383a" stroke-width="4" stroke-linecap="round"/>
    <line x1="790" y1="202" x2="810" y2="170" stroke="#d9383a" stroke-width="4" stroke-linecap="round"/>

    
    <text x="800" y="275" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#d9383a">missing letter e</text>
  </g>

  
  <g id="pods-card">
    <rect x="920" y="105" width="630" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(945, 125)">
      <rect x="2" y="10" width="22" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="18" y="6" width="22" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="34" y="2" width="22" height="44" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>

    
    <text x="1015" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#207448">three pods</text>
    <text x="1205" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#207448">Running 3/3</text>

    
    <g transform="translate(945, 185)">
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" fill="#207448">pod-1</text>
      <rect x="180" y="0" width="160" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="260" y="24" text-anchor="middle" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" fill="#207448">pod-2</text>
      <rect x="360" y="0" width="160" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      <text x="440" y="24" text-anchor="middle" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" fill="#207448">pod-3</text>
    </g>

    
    <rect x="945" y="238" width="580" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="965" y="276" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" font-weight="bold" fill="#207448">label app: llm-server</text>
  </g>

  
  <line x1="800" y1="320" x2="800" y2="350" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  

  <g id="controller-status-panel">
    <rect x="50" y="358" width="1500" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(80, 405)">
      <rect x="2" y="2" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="160" y="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#207448">EndpointSlice controller evaluates each Service selector and writes the result;</text>

    <text x="160" y="440" font-family="'SF Mono', 'Consolas', 'Courier New', monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl get endpointslices -l kubernetes.io/service-name=llm-server shows no addresses;</text>

    <text x="160" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#d9383a">the gateway gets connection refused</text>
  </g>

  
  
  

  
  <line x1="800" y1="508" x2="800" y2="532" stroke="#207448" stroke-width="3.5"/>
  <line x1="412" y1="532" x2="800" y2="532" stroke="#db8129" stroke-width="3.5"/>
  <line x1="800" y1="532" x2="1188" y2="532" stroke="#207448" stroke-width="3"/>

  
  <line x1="412" y1="532" x2="412" y2="550" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>

  
  <line x1="1188" y1="532" x2="1188" y2="550" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  

  
  <g id="cause-1-card">
    <rect x="50" y="558" width="725" height="135" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(75, 578)">
      <circle cx="22" cy="22" r="18" fill="none" stroke="#db8129" stroke-width="4"/>
      <line x1="36" y1="36" x2="52" y2="52" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="15" y1="22" x2="29" y2="22" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="15" x2="22" y2="29" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="145" y="605" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">cause 1: selector does not match pod labels,</tspan>
      <tspan x="145" dy="32">compare character by character,</tspan>
      <tspan x="145" dy="32">correct the selector</tspan>
    </text>
  </g>

  
  <g id="targetport-card">
    <rect x="50" y="710" width="725" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(75, 742)">
      <rect x="4" y="8" width="44" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="20" x2="16" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="26" y1="20" x2="26" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="36" y1="20" x2="36" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <text x="145" y="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">targetPort is the named port http,</tspan>
      <tspan x="145" dy="34">which exists, so rule it out</tspan>
    </text>
  </g>

  
  <g id="cause-2-card">
    <rect x="825" y="558" width="725" height="272" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(855, 580)">
      <rect x="2" y="2" width="52" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 8 26 L 18 26 L 24 12 L 32 40 L 38 26 L 48 26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="930" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="930" dy="0">cause 2 (more common): labels match</tspan>
      <tspan x="855" dy="44">but no ready addresses because the readiness</tspan>
      <tspan x="855" dy="36">probe fails; the controller reads the pod</tspan>
      <tspan x="855" dy="36">Ready condition and a server leaves the</tspan>
      <tspan x="855" dy="36">endpoints after failing checks</tspan>
    </text>
  </g>

  
  
  

  
  <g id="fix-verification-panel">
    <rect x="50" y="855" width="725" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(75, 875)">
      <path d="M 28 4 L 50 12 L 50 28 C 50 42 28 52 28 52 C 28 52 6 42 6 28 L 6 12 Z" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="18,28 26,36 38,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <text x="145" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Fix verification</text>

    
    <text x="75" y="965" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="75" dy="0">apply the corrected Service and confirm the</tspan>
      <tspan x="75" dy="34">EndpointSlice fills before calling it done</tspan>
    </text>
  </g>

  
  <g id="prevention-panel">
    <rect x="825" y="855" width="725" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(850, 875)">
      <rect x="6" y="4" width="44" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="16" y1="26" x2="40" y2="26" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="16" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    
    <text x="920" y="910" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Prevention</text>

    
    <text x="850" y="955" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="850" dy="0">selectors and labels from one template;</tspan>
      <tspan x="850" dy="34">a deploy check fails if a Service has no</tspan>
      <tspan x="850" dy="34">EndpointSlice addresses</tspan>
    </text>
  </g>
</svg>