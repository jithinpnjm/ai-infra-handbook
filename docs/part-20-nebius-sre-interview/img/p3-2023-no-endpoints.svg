<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title-text { font-family: sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; }
      .panel-bg { fill: #e8f1ea; stroke: #207448; stroke-width: 2; rx: 12px; }
      .panel-warn { fill: #fff3e6; stroke: #db8129; stroke-width: 2; rx: 12px; }
      .panel-alert { fill: #fdf0ed; stroke: #c83b3b; stroke-width: 2; rx: 12px; }
      .text-reg { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .text-bold { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #303a36; }
      .text-code { font-family: monospace; font-size: 24px; fill: #207448; }
      .text-code-alert { font-family: monospace; font-size: 25px; font-weight: bold; fill: #c83b3b; }
      .badge-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; }
      .arrow { stroke: #207448; stroke-width: 3; fill: none; }
      .arrow-orange { stroke: #db8129; stroke-width: 4; fill: none; }
      .icon-stroke { stroke: #207448; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#db8129" />
    </marker>
  </defs>

  <title>Drill 8: a Service with no endpoints</title>
  <desc>Visual explanation of why a Kubernetes Service can end up with no endpoints, comparing selector mismatches and failed readiness probes.</desc>

  
  <rect width="1600" height="1340" class="bg" />

  
  <text x="60" y="70" class="title-text">Drill 8: a Service with no endpoints</text>

  
  
  <rect x="60" y="110" width="600" height="230" class="panel-bg" />
  
  <circle cx="110" cy="165" r="24" class="icon-stroke" />
  <path d="M 110 133 L 110 141 M 110 189 L 110 197 M 78 165 L 86 165 M 134 165 L 142 165 M 88 143 L 94 149 M 126 181 L 132 187 M 88 187 L 94 181 M 126 149 L 132 143" class="icon-stroke" />
  
  <text x="160" y="160" class="text-bold">Service llm-server</text>
  <text x="160" y="195" class="text-code">ClusterIP 10.0.1.175 port 80/TCP</text>
  <text x="90" y="275" class="text-reg">with selector</text>
  <text x="245" y="275" class="text-code-alert">app: llm-serv</text>

  
  <rect x="690" y="155" width="220" height="135" rx="10" fill="#c83b3b" />
  
  <path d="M 780 180 L 820 205 M 820 180 L 780 205" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <text x="800" y="240" text-anchor="middle" class="badge-text">missing</text>
  <text x="800" y="270" text-anchor="middle" class="badge-text">letter e</text>

  
  <rect x="940" y="110" width="600" height="230" class="panel-bg" />
  
  <rect x="980" y="145" width="45" height="40" rx="4" class="icon-stroke" />
  <line x1="980" y1="165" x2="1025" y2="165" class="icon-stroke" />
  <line x1="1002" y1="145" x2="1002" y2="165" class="icon-stroke" />

  <text x="1050" y="160" class="text-bold">three pods Running 3/3</text>
  <text x="980" y="275" class="text-reg">with label</text>
  <text x="1105" y="275" class="text-code">app: llm-server</text>

  
  <rect x="60" y="370" width="1480" height="90" class="panel-bg" />
  
  <path d="M 105 395 L 125 403 L 145 395 L 145 425 C 145 440 125 450 125 450 C 125 450 105 440 105 425 Z" class="icon-stroke" />
  <path d="M 118 422 L 124 428 L 135 416" class="icon-stroke" />
  <text x="175" y="425" class="text-reg">targetPort is the named port http, which exists, so rule it out</text>

  
  <rect x="60" y="490" width="1480" height="175" class="panel-warn" />
  
  <circle cx="115" cy="565" r="22" stroke="#db8129" stroke-width="3.5" fill="none" />
  <path d="M 115 533 L 123 543 L 115 553" fill="#db8129" />
  <text x="165" y="540" class="text-reg">EndpointSlice controller evaluates each Service selector and writes the result;</text>
  <text x="165" y="585" class="text-code">kubectl get endpointslices -l kubernetes.io/service-name=llm-server</text>
  <text x="165" y="630" class="text-reg">shows no addresses; the gateway gets connection refused</text>

  
  
  <path d="M 800 665 L 800 690" class="arrow-orange" />
  <path d="M 800 690 L 400 690 L 400 720" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 800 690 L 1200 690 L 1200 720" class="arrow" marker-end="url(#arrowhead)" />

  
  <rect x="60" y="725" width="710" height="300" class="panel-alert" />
  <circle cx="115" cy="775" r="20" fill="#c83b3b" />
  <text x="115" y="784" text-anchor="middle" class="badge-text">1</text>
  <text x="155" y="782" class="text-bold" fill="#c83b3b">Selector Mismatch</text>
  <text x="90" y="840" class="text-reg">cause 1: selector does not match</text>
  <text x="90" y="885" class="text-reg">pod labels, compare character by character,</text>
  <text x="90" y="930" class="text-reg">correct the selector</text>

  
  <rect x="830" y="725" width="710" height="300" class="panel-bg" />
  <circle cx="885" cy="775" r="20" fill="#207448" />
  <text x="885" y="784" text-anchor="middle" class="badge-text">2</text>
  <text x="925" y="782" class="text-bold">Probe Failure</text>
  <text x="860" y="840" class="text-reg">cause 2 (more common): labels match but</text>
  <text x="860" y="885" class="text-reg">no ready addresses because the readiness probe fails;</text>
  <text x="860" y="930" class="text-reg">the controller reads the pod Ready condition and a server</text>
  <text x="860" y="975" class="text-reg">leaves the endpoints after failing checks</text>

  
  
  <rect x="60" y="1060" width="710" height="230" class="panel-bg" />
  
  <circle cx="115" cy="1110" r="22" class="icon-stroke" />
  <path d="M 104 1110 L 112 1118 L 126 1102" class="icon-stroke" />
  <text x="155" y="1118" class="text-bold">Fix verification</text>
  <text x="90" y="1175" class="text-reg">apply the corrected Service and confirm</text>
  <text x="90" y="1220" class="text-reg">the EndpointSlice fills before calling</text>
  <text x="90" y="1265" class="text-reg">it done</text>

  
  <rect x="830" y="1060" width="710" height="230" class="panel-bg" />
  
  <rect x="870" y="1100" width="36" height="28" rx="3" class="icon-stroke" />
  <path d="M 878 1100 L 878 1088 C 878 1082 898 1082 898 1088 L 898 1100" class="icon-stroke" />
  <text x="925" y="1118" class="text-bold">Prevention</text>
  <text x="860" y="1175" class="text-reg">selectors and labels from one template;</text>
  <text x="860" y="1220" class="text-reg">a deploy check fails if a Service has</text>
  <text x="860" y="1265" class="text-reg">no EndpointSlice addresses</text>
</svg>