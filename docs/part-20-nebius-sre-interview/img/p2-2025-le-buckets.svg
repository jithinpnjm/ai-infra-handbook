<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Histogram buckets: keep le, then take the quantile once</title>
  <desc>Visual guide explaining why le must be preserved in sum aggregation before calculating histogram_quantile</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Histogram buckets: keep le, then take the quantile once</text>

  

  
  <rect x="50" y="110" width="580" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(75, 130)">
    <rect x="0" y="24" width="8" height="16" fill="#207448"/>
    <rect x="12" y="14" width="8" height="26" fill="#207448"/>
    <rect x="24" y="4" width="8" height="36" fill="#207448"/>
    <rect x="36" y="18" width="8" height="22" fill="#207448"/>
    <line x1="-4" y1="42" x2="48" y2="42" stroke="#207448" stroke-width="3"/>
  </g>

  
  
  <rect x="75" y="320" width="155" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="152" y="380" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">le: 0.5</text>
  <text x="152" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">count: 350</text>

  
  <rect x="255" y="230" width="170" height="290" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="5"/>
  <text x="340" y="320" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">le: 1.0</text>
  <text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">count: 850</text>

  
  <rect x="450" y="170" width="155" height="350" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="527" y="280" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">le: +Inf</text>
  <text x="527" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">count: 1000</text>

  
  <text x="340" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="340" dy="0">Each box counts every request at or</tspan>
    <tspan x="340" dy="32">under its bound: cumulative</tspan>
  </text>

  
  <line x1="640" y1="400" x2="1018" y2="400" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  
  <rect x="655" y="200" width="350" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="830" y="240" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">histogram_quantile</text>
  <text x="830" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">interpolates inside</text>
  <text x="830" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the bucket that holds</text>
  <text x="830" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the quantile</text>

  
  <rect x="1030" y="110" width="520" height="530" rx="16" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>

  
  <rect x="1055" y="140" width="470" height="210" rx="12" fill="#fdf2f2" stroke="#c53030" stroke-width="2"/>
  
  <circle cx="1095" cy="190" r="20" fill="#fbd5d5"/>
  <path d="M 1083 178 L 1107 202 M 1107 178 L 1083 202" stroke="#c53030" stroke-width="4" stroke-linecap="round"/>
  <text x="1130" y="198" font-family="sans-serif" font-size="25" font-weight="bold" fill="#9b2c2c">Trap: sum by (model) drops le</text>
  <rect x="1090" y="240" width="400" height="60" rx="8" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="1290" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c53030">Breaks histogram_quantile</text>

  
  <rect x="1055" y="380" width="470" height="235" rx="12" fill="#e8f8f0" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1095" cy="430" r="20" fill="#c6f6d5"/>
  <path d="M 1083 430 L 1092 440 L 1107 420" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1130" y="438" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Right: sum by (le, model)</text>
  <text x="1130" y="495" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1130" dy="0">Keep le in the by clause,</tspan>
    <tspan x="1130" dy="34">then take the quantile once</tspan>
  </text>

  

  
  <rect x="50" y="670" width="1500" height="375" rx="16" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>

  
  <rect x="80" y="720" width="250" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="100" y="755" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="100" y1="769" x2="128" y2="769" stroke="#207448" stroke-width="2"/>
  <text x="140" y="780" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Pod A buckets</text>

  
  <rect x="80" y="880" width="250" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="100" y="915" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="100" y1="929" x2="128" y2="929" stroke="#207448" stroke-width="2"/>
  <text x="140" y="940" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Pod B buckets</text>

  
  <path d="M 330 770 L 390 770 L 390 850 L 438 850" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 330 930 L 390 930 L 390 850" fill="none" stroke="#207448" stroke-width="4"/>

  
  <rect x="450" y="795" width="280" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 475 850 L 490 835 L 505 865 L 520 850" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="590" y="860" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">rate per series</text>

  
  <line x1="730" y1="850" x2="788" y2="850" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="800" y="795" width="350" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 835 832 L 855 832 L 845 850 L 855 868 L 835 868" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="860" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">sum by (le, model)</text>

  
  <line x1="1150" y1="850" x2="1198" y2="850" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1210" y="795" width="320" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1235" cy="850" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1235" cy="850" r="5" fill="#207448"/>
  <text x="1375" y="860" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">histogram_quantile(0.99)</text>

  
  <rect x="50" y="1075" width="1500" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1114" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">le stands for less than or equal to.</text>

</svg>