<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Load average counts state D tasks, so high load can come from disk waits.</title>
  <desc>Visual infographic explaining why a load average of 30 can occur with idle CPUs when tasks are in state D waiting on disk.</desc>

  <defs>
    
    <pattern id="grey-hatch" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#9aa8a0" stroke-width="4"/>
    </pattern>

    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Load average counts state D tasks,</tspan>
    <tspan x="800" dy="56">so high load can come from disk waits.</tspan>
  </text>

  
  <g id="left-container">
    <rect x="40" y="155" width="680" height="575" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(68, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6"/>
      <line x1="16" y1="38" x2="16" y2="22"/>
      <line x1="28" y1="38" x2="28" y2="16"/>
      <line x1="40" y1="38" x2="40" y2="28"/>
    </g>
    <text x="142" y="214" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">load average 30</text>

    
    
    <rect x="165" y="260" width="130" height="84" rx="4" fill="#207448" stroke="#207448" stroke-width="2"/>

    
    <rect x="165" y="344" width="130" height="60" fill="#88be9a" stroke="#207448" stroke-width="2"/>

    
    <rect x="165" y="404" width="130" height="276" fill="#e8eee9"/>
    <rect x="165" y="404" width="130" height="276" fill="url(#grey-hatch)"/>
    
    <rect x="165" y="404" width="130" height="276" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>

    
    <rect x="325" y="272" width="375" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <line x1="295" y1="302" x2="325" y2="302" stroke="#207448" stroke-width="2"/>
    <text x="512" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">running on a CPU</text>

    
    <rect x="325" y="344" width="375" height="88" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <line x1="295" y1="388" x2="325" y2="388" stroke="#207448" stroke-width="2"/>
    <text x="512" y="382" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="512" dy="0">runnable and</tspan>
      <tspan x="512" dy="28">waiting for a CPU</tspan>
    </text>

    
    
    <rect x="58" y="432" width="95" height="56" rx="8" fill="#207448"/>
    <text x="105" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">CPUs</text>
    
    <line x1="153" y1="460" x2="325" y2="460" stroke="#207448" stroke-width="3" stroke-dasharray="8 5"/>
    
    <rect x="325" y="445" width="375" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="512" y="483" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">16 CPUs in the example</text>

    
    <rect x="325" y="520" width="375" height="120" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="2"/>
    <line x1="295" y1="565" x2="325" y2="565" stroke="#db8129" stroke-width="2"/>
    <text x="512" y="552" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="512" dy="0"><tspan font-family="monospace" fill="#db8129">state D</tspan><tspan font-family="sans-serif">,</tspan></tspan>
      <tspan x="512" dy="30" font-family="sans-serif">uninterruptible,</tspan>
      <tspan x="512" dy="30" font-family="sans-serif">waiting on disk</tspan>
    </text>

    
    <line x1="295" y1="660" x2="720" y2="660" stroke="#207448" stroke-width="4"/>
  </g>

  
  <g id="arrow-to-disk">
    
    <line x1="720" y1="660" x2="1046" y2="660" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    <text x="885" y="595" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="885" dy="0">the stuck tasks</tspan>
      <tspan x="885" dy="30">wait on the disk</tspan>
    </text>
  </g>

  
  <g id="panel-cpu">
    <rect x="760" y="155" width="790" height="340" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(790, 175)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="5" fill="#e8f1ea"/>
      
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="28" y1="46" x2="28" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
      <line x1="4" y1="18" x2="10" y2="18"/>
      <line x1="4" y1="28" x2="10" y2="28"/>
      <line x1="4" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="52" y2="18"/>
      <line x1="46" y1="28" x2="52" y2="28"/>
      <line x1="46" y1="38" x2="52" y2="38"/>
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#207448"/>
    </g>
    <text x="865" y="214" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">CPU</text>

    
    
    
    <path d="M 1075 315 A 80 80 0 0 1 1235 315" fill="none" stroke="#d5e2d8" stroke-width="18" stroke-linecap="round"/>
    
    <path d="M 1075 315 A 80 80 0 0 1 1130.3 238.9" fill="none" stroke="#207448" stroke-width="18" stroke-linecap="round"/>
    
    <circle cx="1155" cy="315" r="7" fill="#303a36"/>
    <line x1="1155" y1="315" x2="1132" y2="243" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>

    
    <text x="1155" y="368" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">40 percent busy</text>

    
    <text x="1155" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the CPUs are not the full part of the picture</text>
  </g>

  
  <g id="panel-slow-disk">
    <rect x="1050" y="560" width="500" height="170" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1090, 617)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="26" ry="10" fill="#e8f1ea"/>
      <path d="M 2 14 V 46 C 2 52 14 56 28 56 C 42 56 54 52 54 46 V 14" fill="#e8f1ea"/>
      <path d="M 2 30 C 2 36 14 40 28 40 C 42 40 54 36 54 30"/>
    </g>

    
    <text x="1175" y="659" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">slow disk</text>
  </g>

  
  <g id="numbered-steps">
    
    <rect x="50" y="760" width="480" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="95" cy="812" r="24" fill="#207448"/>
    <text x="95" y="821" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="145" y="798" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">say load counts</tspan>
      <tspan x="145" dy="30">demand, not only CPU</tspan>
    </text>

    
    <rect x="560" y="760" width="480" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="605" cy="812" r="24" fill="#207448"/>
    <text x="605" y="821" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="655" y="798" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="655" dy="0" font-family="sans-serif">check </tspan><tspan font-family="monospace" fill="#207448">vmstat 1</tspan>
      <tspan x="655" dy="30" font-family="sans-serif">for r and b</tspan>
    </text>

    
    <rect x="1070" y="760" width="480" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1115" cy="812" r="24" fill="#207448"/>
    <text x="1115" y="821" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1165" y="798" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1165" dy="0" font-family="sans-serif">check the trend in</tspan>
      <tspan x="1165" dy="30" font-family="monospace" fill="#207448">uptime</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="895" width="1500" height="80" rx="12" fill="#207448"/>
    <text x="800" y="945" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A load of 30 with idle CPUs points at the storage path, not the CPU.</text>
  </g>
</svg>