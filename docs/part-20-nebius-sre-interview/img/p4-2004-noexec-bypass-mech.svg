<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1460" width="1600" height="1460">
  <title>Kernel noexec Mount Enforcement versus Interpreter Execution</title>
  <desc>Visual comparison showing how Linux kernel noexec mount flags block direct binary execution via execve while interpreter execution succeeds via read operations.</desc>

  <defs>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b3022" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 18 18" refX="9" refY="15" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 4 L 9 14 L 16 4 z" fill="#207448"/>
    </marker>
    <marker id="arrow-down-orange" viewBox="0 0 18 18" refX="9" refY="15" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 4 L 9 14 L 16 4 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1460" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Kernel noexec Mount Enforcement versus Interpreter Execution</text>

  
  <rect x="60" y="100" width="1480" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)"/>
  
  <g transform="translate(85, 122)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="28" cy="16" rx="24" ry="10"/>
    <path d="M 4 16 v 32 c 0 6 11 10 24 10 s 24 -4 24 -10 v -32"/>
    <path d="M 4 32 c 0 6 11 10 24 10 s 24 -4 24 -10"/>
  </g>
  <text x="160" y="148" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan>mount at </tspan><tspan font-family="monospace" fill="#207448">/mnt/data</tspan><tspan> with flags </tspan><tspan font-family="monospace">'rw,noexec,relatime'</tspan>
  </text>
  <text x="160" y="186" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>containing script </tspan><tspan font-family="monospace">run.sh</tspan><tspan> with permissions </tspan><tspan font-family="monospace">0755 (-rwxr-xr-x)</tspan><tspan> owned by user </tspan><tspan font-family="monospace">u</tspan>
  </text>

  
  <rect x="60" y="235" width="715" height="1075" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)"/>
  
  
  <rect x="60" y="235" width="715" height="70" rx="16" fill="#207448"/>
  <rect x="60" y="285" width="715" height="20" fill="#207448"/>
  
  <g transform="translate(80, 246)" stroke="#f5f8f5" stroke-width="2.5" fill="none">
    <rect x="4" y="6" width="44" height="34" rx="4"/>
    <line x1="4" y1="16" x2="48" y2="16"/>
    <line x1="12" y1="26" x2="18" y2="30"/>
    <line x1="18" y1="30" x2="12" y2="34"/>
  </g>
  <text x="145" y="281" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f5f8f5">Direct execution './run.sh'</text>

  
  <rect x="85" y="325" width="665" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="125" cy="365" r="24" fill="#207448"/>
  <text x="125" y="374" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">1</text>
  
  <g transform="translate(165, 345)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="18" r="8"/>
    <path d="M 18 2 v 6 M 18 28 v 6 M 2 18 h 6 M 28 18 h 6 M 6 6 l 5 5 M 25 25 l 5 5 M 6 30 l 5 -5 M 25 11 l 5 -5"/>
  </g>
  <text x="215" y="372" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 1</text>
  <text x="105" y="425" font-family="monospace" font-size="24" fill="#303a36">Shell invokes execve('./run.sh', ...)</text>

  
  <rect x="85" y="500" width="665" height="150" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="125" cy="540" r="24" fill="#207448"/>
  <text x="125" y="549" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">2</text>
  
  <g transform="translate(165, 520)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 18 4 L 4 10 v 12 c 0 10 14 18 14 18 s 14 -8 14 -18 V 10 z"/>
  </g>
  <text x="215" y="547" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 2</text>
  <text x="105" y="598" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">Linux VFS examines mount flags for</tspan>
    <tspan x="105" dy="32">/mnt/data and encounters MS_NOEXEC.</tspan>
  </text>

  
  <rect x="85" y="690" width="665" height="165" rx="12" fill="#f5f8f5" stroke="#db8129" stroke-width="3.5"/>
  <circle cx="125" cy="735" r="24" fill="#db8129"/>
  <text x="125" y="744" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">3</text>
  
  <g transform="translate(165, 715)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="6" y="14" width="26" height="22" rx="3"/>
    <path d="M 12 14 V 8 a 7 7 0 0 1 14 0 v 6"/>
  </g>
  <text x="215" y="742" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Step 3</text>
  <text x="105" y="796" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="105" dy="0">Kernel immediately halts execution and</tspan>
    <tspan x="105" dy="32">returns -1 EACCES.</tspan>
  </text>

  
  <rect x="85" y="895" width="665" height="185" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="125" cy="940" r="24" fill="#207448"/>
  <text x="125" y="949" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">4</text>
  
  <g transform="translate(165, 920)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="36" height="30" rx="3"/>
    <line x1="10" y1="28" x2="20" y2="28"/>
  </g>
  <text x="215" y="947" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 4</text>
  <text x="105" y="1000" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">Shell outputs 'Permission denied' with</tspan>
    <tspan x="105" dy="32">exit status 126; inode execute bits</tspan>
    <tspan x="105" dy="32">are never evaluated.</tspan>
  </text>

  
  <line x1="417" y1="460" x2="417" y2="496" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="417" y1="650" x2="417" y2="686" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-down-orange)"/>
  <line x1="417" y1="855" x2="417" y2="891" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>


  
  <rect x="825" y="235" width="715" height="1075" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)"/>
  
  
  <rect x="825" y="235" width="715" height="70" rx="16" fill="#207448"/>
  <rect x="825" y="285" width="715" height="20" fill="#207448"/>
  
  <g transform="translate(845, 246)" stroke="#f5f8f5" stroke-width="2.5" fill="none">
    <path d="M 8 6 h 24 l 10 10 v 24 h -34 z"/>
    <path d="M 32 6 v 10 h 10"/>
    <line x1="16" y1="22" x2="28" y2="22"/>
    <line x1="16" y1="28" x2="34" y2="28"/>
  </g>
  <text x="910" y="281" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f5f8f5">Interpreter execution 'sh run.sh'</text>

  
  <rect x="850" y="325" width="665" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="890" cy="365" r="24" fill="#207448"/>
  <text x="890" y="374" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">1</text>
  
  <g transform="translate(930, 345)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="18" r="8"/>
    <path d="M 18 2 v 6 M 18 28 v 6 M 2 18 h 6 M 28 18 h 6 M 6 6 l 5 5 M 25 25 l 5 5 M 6 30 l 5 -5 M 25 11 l 5 -5"/>
  </g>
  <text x="980" y="372" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 1</text>
  <text x="870" y="425" font-family="monospace" font-size="24" fill="#303a36">Shell invokes execve('/bin/sh', ['sh', 'run.sh']).</text>

  
  <rect x="850" y="490" width="665" height="155" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="890" cy="530" r="24" fill="#207448"/>
  <text x="890" y="539" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">2</text>
  
  <g transform="translate(930, 510)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="38" height="28" rx="3"/>
    <line x1="4" y1="14" x2="42" y2="14"/>
  </g>
  <text x="980" y="537" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 2</text>
  <text x="870" y="588" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">/bin/sh binary is on rootfs mounted</tspan>
    <tspan x="870" dy="32">with exec; execve succeeds.</tspan>
  </text>

  
  <rect x="850" y="675" width="665" height="155" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="890" cy="715" r="24" fill="#207448"/>
  <text x="890" y="724" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">3</text>
  
  <g transform="translate(930, 695)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 6 8 h 14 l 6 6 h 14 v 20 h -34 z"/>
  </g>
  <text x="980" y="722" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 3</text>
  <text x="870" y="774" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">Running sh process issues</tspan>
    <tspan x="870" dy="32" font-family="monospace">openat(AT_FDCWD, 'run.sh', O_RDONLY).</tspan>
  </text>

  
  <rect x="850" y="860" width="665" height="190" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="890" cy="900" r="24" fill="#207448"/>
  <text x="890" y="909" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">4</text>
  
  <g transform="translate(930, 880)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 18 4 L 4 10 v 12 c 0 10 14 18 14 18 s 14 -8 14 -18 V 10 z"/>
    <path d="M 12 20 l 4 4 l 8 -8"/>
  </g>
  <text x="980" y="907" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 4</text>
  <text x="870" y="958" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">VFS checks read permission on run.sh;</tspan>
    <tspan x="870" dy="32">read is allowed by both mount flags ('rw')</tspan>
    <tspan x="870" dy="32">and inode mode ('r-x').</tspan>
  </text>

  
  <rect x="850" y="1080" width="665" height="190" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <circle cx="890" cy="1120" r="24" fill="#207448"/>
  <text x="890" y="1129" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f5f8f5">5</text>
  
  <g transform="translate(930, 1100)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="8" width="24" height="24" rx="2"/>
    <line x1="14" y1="2" x2="14" y2="8"/>
    <line x1="26" y1="2" x2="26" y2="8"/>
    <line x1="14" y1="32" x2="14" y2="38"/>
    <line x1="26" y1="32" x2="26" y2="38"/>
    <line x1="2" y1="14" x2="8" y2="14"/>
    <line x1="2" y1="26" x2="8" y2="26"/>
    <line x1="32" y1="14" x2="38" y2="14"/>
    <line x1="32" y1="26" x2="38" y2="26"/>
  </g>
  <text x="980" y="1127" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Step 5</text>
  <text x="870" y="1178" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">Shell reads script text as data into</tspan>
    <tspan x="870" dy="32">memory and runs commands;</tspan>
    <tspan x="870" dy="32">prints 'it ran'.</tspan>
  </text>

  
  <line x1="1182" y1="460" x2="1182" y2="486" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="1182" y1="645" x2="1182" y2="671" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="1182" y1="830" x2="1182" y2="856" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>
  <line x1="1182" y1="1050" x2="1182" y2="1076" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>

  
  <rect x="60" y="1340" width="1480" height="85" rx="14" fill="#207448" filter="url(#card-shadow)"/>
  
  <g transform="translate(85, 1358)" stroke="#f5f8f5" stroke-width="3" fill="none">
    <circle cx="16" cy="16" r="12"/>
    <path d="M 24 24 l 14 14"/>
  </g>
  <text x="145" y="1393" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f5f8f5">
    <tspan>mount -o remount,bind,exec /mnt/data</tspan>
  </text>
</svg>