<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Busy is not saturated: three disk numbers read together</title>
  <desc>Infographic explaining why disk utilization does not equal saturation using %util, aqu-sz, and await metrics with a supermarket checkout analogy.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="50" y="85" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Busy is not the same as saturated</text>
  <rect x="1330" y="50" width="220" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1440" y="83" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">iostat -sxz 1</text>

  
  
  <g id="panel-util">
    <rect x="50" y="125" width="473" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="286.5" y="175" font-family="monospace" font-size="34" font-weight="bold" fill="#207448" text-anchor="middle">%util</text>
    
    
    <path d="M 222.5 265 A 64 64 0 0 1 350.5 265" stroke="#e8f1ea" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M 222.5 265 A 64 64 0 0 1 350.5 265" stroke="#207448" stroke-width="12" fill="none" stroke-linecap="round" />
    <line x1="286.5" y1="265" x2="344.5" y2="265" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="286.5" cy="265" r="7" fill="#207448" />
    
    <text x="286.5" y="345" font-family="monospace" font-size="50" font-weight="bold" fill="#303a36" text-anchor="middle">100.00</text>
    <text x="286.5" y="410" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">The device was never idle</text>
  </g>

  
  <g id="panel-aqu-sz">
    <rect x="563" y="125" width="473" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="799.5" y="175" font-family="monospace" font-size="34" font-weight="bold" fill="#207448" text-anchor="middle">aqu-sz</text>
    
    
    <path d="M 735.5 265 A 64 64 0 0 1 863.5 265" stroke="#e8f1ea" stroke-width="12" fill="none" stroke-linecap="round" />
    <line x1="799.5" y1="265" x2="741.5" y2="265" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="799.5" cy="265" r="7" fill="#207448" />
    
    <text x="799.5" y="345" font-family="monospace" font-size="50" font-weight="bold" fill="#303a36" text-anchor="middle">0.00</text>
    <text x="799.5" y="398" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="799.5" dy="0">No queue forms</tspan>
      <tspan x="799.5" dy="32">in front of the device</tspan>
    </text>
  </g>

  
  <g id="panel-await">
    <rect x="1076" y="125" width="473" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1312.5" y="175" font-family="monospace" font-size="34" font-weight="bold" fill="#207448" text-anchor="middle">await</text>
    
    
    <path d="M 1248.5 265 A 64 64 0 0 1 1376.5 265" stroke="#e8f1ea" stroke-width="12" fill="none" stroke-linecap="round" />
    <line x1="1312.5" y1="265" x2="1255.5" y2="255" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1312.5" cy="265" r="7" fill="#207448" />
    
    <text x="1312.5" y="345" font-family="monospace" font-size="50" font-weight="bold" fill="#303a36" text-anchor="middle">0.44 ms</text>
    <text x="1312.5" y="398" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1312.5" dy="0">Each request waits</tspan>
      <tspan x="1312.5" dy="32">under half a millisecond</tspan>
    </text>
  </g>

  
  
  <g id="analogy-till">
    <rect x="50" y="500" width="473" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(0, 5)">
      <rect x="261.5" y="542" width="50" height="18" rx="3" stroke="#207448" stroke-width="3" fill="none" />
      <line x1="281.5" y1="551" x2="291.5" y2="551" stroke="#207448" stroke-width="2" />
      <path d="M 266.5 542 L 273.5 517 L 306.5 517 L 306.5 542" stroke="#207448" stroke-width="3" fill="none" />
      <rect x="288.5" y="502" width="22" height="15" rx="2" stroke="#207448" stroke-width="3" fill="none" />
      <line x1="299.5" y1="517" x2="299.5" y2="522" stroke="#207448" stroke-width="3" />
    </g>

    <text x="286.5" y="632" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="286.5" dy="0">open the whole time</tspan>
      <tspan x="286.5" dy="32">(utilisation)</tspan>
    </text>
  </g>

  
  <g id="analogy-queue">
    <rect x="563" y="500" width="473" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(0, 5)">
      <line x1="764.5" y1="558" x2="784.5" y2="558" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="774.5" y1="512" x2="774.5" y2="558" stroke="#207448" stroke-width="3" />
      <circle cx="774.5" cy="509" r="4" fill="#207448" />

      <line x1="814.5" y1="558" x2="834.5" y2="558" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="824.5" y1="512" x2="824.5" y2="558" stroke="#207448" stroke-width="3" />
      <circle cx="824.5" cy="509" r="4" fill="#207448" />

      <path d="M 774.5 519 Q 799.5 536 824.5 519" stroke="#207448" stroke-width="2.5" stroke-dasharray="4,4" fill="none" />
    </g>

    <text x="799.5" y="632" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="799.5" dy="0">no line</tspan>
      <tspan x="799.5" dy="32">(saturation)</tspan>
    </text>
  </g>

  
  <g id="analogy-clock">
    <rect x="1076" y="500" width="473" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(0, 5)">
      <circle cx="1312.5" cy="535" r="26" stroke="#207448" stroke-width="3" fill="none" />
      <circle cx="1312.5" cy="535" r="3" fill="#207448" />
      <line x1="1312.5" y1="535" x2="1312.5" y2="517" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="1312.5" y1="535" x2="1323.5" y2="528" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    <text x="1312.5" y="632" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1312.5" dy="0">how long each customer waited</tspan>
      <tspan x="1312.5" dy="32">(await)</tspan>
    </text>
  </g>

  
  
  <g id="verdict-busy">
    <rect x="50" y="750" width="730" height="130" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <circle cx="330" cy="815" r="28" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 318 815 L 326 823 L 342 807" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="375" y="827" font-family="sans-serif" font-size="38" font-weight="bold" fill="#303a36">Busy</text>
  </g>

  
  <g id="verdict-saturated">
    <rect x="820" y="750" width="730" height="130" rx="12" fill="#ffffff" stroke="#8a9992" stroke-width="3" />
    <circle cx="1060" cy="815" r="28" fill="#f5f5f5" stroke="#8a9992" stroke-width="3" />
    <line x1="1051" y1="806" x2="1069" y2="824" stroke="#8a9992" stroke-width="4" stroke-linecap="round" />
    <line x1="1069" y1="806" x2="1051" y2="824" stroke="#8a9992" stroke-width="4" stroke-linecap="round" />
    <text x="1105" y="827" font-family="sans-serif" font-size="38" font-weight="bold" fill="#303a36">Saturated</text>
  </g>

  
  <rect x="50" y="910" width="1500" height="70" rx="12" fill="#207448" />
  <text x="800" y="954" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Always check saturation next to utilisation</text>
</svg>