    <text x="1450" y="415" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Autoscaler</text>
  </g>

  

  
  <path d="M 260 355 L 298 355" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
