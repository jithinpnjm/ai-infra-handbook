    <text x="955" y="635" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Decode</text>
    <text x="955" y="672" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pool</text>
  </g>

  
  <g id="node-AS">
    <rect x="1340" y="280" width="220" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1422, 310)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
