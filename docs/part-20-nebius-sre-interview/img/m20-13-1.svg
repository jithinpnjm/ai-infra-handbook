      <line x1="36" y1="6" x2="36" y2="12" />
      <line x1="20" y1="44" x2="20" y2="50" />
      <line x1="36" y1="44" x2="36" y2="50" />
    </g>
    <text x="955" y="385" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Prefill</text>
    <text x="955" y="422" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pool</text>
  </g>

  
  <g id="node-DC">
    <rect x="850" y="530" width="210" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(927, 545)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <line x1="20" y1="22" x2="34" y2="22" />
      <line x1="20" y1="30" x2="28" y2="30" />
      <line x1="20" y1="38" x2="32" y2="38" />
      <circle cx="36" cy="30" r="2" fill="#207448" />
