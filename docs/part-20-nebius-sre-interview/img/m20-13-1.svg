<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The whole picture in one diagram</title>
  <desc>Architecture flowchart depicting LLM inference serving disaggregation with Client, Gateway, Usage events log, Billing aggregator, Router, Prefill pool, Decode pool, Control plane, and Autoscaler.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The whole picture in one diagram</text>

  
  <g id="node-CP">
    <rect x="350" y="100" width="710" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(375, 122)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12.5 12.5 L 16.7 16.7 M 39.3 39.3 L 43.5 43.5 M 12.5 43.5 L 16.7 39.3 M 39.3 16.7 L 43.5 12.5" />
    </g>
    <text x="455" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Control plane:</text>
    <text x="455" y="176" font-family="sans-serif" font-size="24" fill="#303a36">endpoints, models, replicas</text>
  </g>

  
  <g id="node-C">
    <rect x="40" y="280" width="220" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(122, 298)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="40" height="28" rx="4" />
      <line x1="28" y1="36" x2="28" y2="48" />
      <line x1="16" y1="48" x2="40" y2="48" />
    </g>
    <text x="150" y="392" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client</text>
  </g>

  
  <g id="node-M">
    <rect x="40" y="530" width="220" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(122, 545)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" />
      <path d="M 36 6 L 36 16 L 46 16" />
      <line x1="20" y1="26" x2="38" y2="26" />
      <line x1="20" y1="34" x2="38" y2="34" />
      <line x1="20" y1="42" x2="30" y2="42" />
