      <line x1="8" y1="20" x2="48" y2="20" />
      <line x1="20" y1="30" x2="26" y2="30" />
      <line x1="32" y1="30" x2="38" y2="30" />
      <line x1="20" y1="38" x2="26" y2="38" />
