    <text x="690" y="382" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Router:</text>
    <text x="690" y="418" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">cache and</text>
    <text x="690" y="448" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">load aware</text>
  </g>

  
  <g id="node-PF">
