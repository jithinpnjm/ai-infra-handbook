    <text x="415" y="382" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Gateway:</text>
    <text x="415" y="418" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">auth, quotas,</text>
    <text x="415" y="448" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">token limits</text>
  </g>

  
  <g id="node-R">
    <rect x="580" y="280" width="220" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(662, 295)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="16" width="40" height="24" rx="4" />
      <line x1="16" y1="16" x2="16" y2="8" />
      <line x1="40" y1="16" x2="40" y2="8" />
      <circle cx="20" cy="28" r="2" fill="#207448" />
      <circle cx="28" cy="28" r="2" fill="#207448" />
      <circle cx="36" cy="28" r="2" fill="#207448" />
