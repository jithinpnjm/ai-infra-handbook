    <text x="150" y="635" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Usage</text>
    <text x="150" y="672" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">events log</text>
  </g>

  
  <g id="node-B">
    <rect x="40" y="765" width="220" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
