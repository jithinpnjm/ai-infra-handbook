  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Control plane, data plane and the routing key</text>

  

  
  <line x1="420" y1="215" x2="441" y2="215" stroke="#207448" stroke-width="3" />
