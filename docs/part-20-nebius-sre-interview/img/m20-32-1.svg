<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Control plane, data plane and the routing key</title>
  <desc>Architecture diagram illustrating interaction between Your app, Control plane, Data plane, and GPU worker Replicas using routing keys.</desc>

