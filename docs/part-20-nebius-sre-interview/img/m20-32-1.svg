  <line x1="240" y1="350" x2="240" y2="381" stroke="#db8129" stroke-width="4" />
  <circle cx="240" cy="405" r="24" fill="#207448" />
  <text x="240" y="405" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
