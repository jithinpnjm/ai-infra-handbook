  <line x1="774" y1="700" x2="1078" y2="700" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <line x1="1310" y1="350" x2="1310" y2="457" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" />
