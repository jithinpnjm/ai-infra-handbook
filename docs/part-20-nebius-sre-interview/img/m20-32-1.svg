      <path d="M1138,235 L1138,241 M1138,269 L1138,275 M1118,255 L1124,255 M1152,255 L1158,255 M1124,241 L1128,245 M1148,265 L1152,269 M1124,269 L1128,265 M1148,245 L1152,241" stroke-width="4" stroke-linecap="round" />
