<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Prefill and decode pools, split only when interference is measured</title>
  <desc>Visual comparison showing colocated prefill and decode on a single GPU causing stalls versus a disaggregated split architecture connected by fast links.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="64" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Prefill and decode pools, split only when interference is measured</text>

  
  <g id="colocated-gpu-group">
    
    <rect x="50" y="105" width="1500" height="315" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(80, 125)">
      <rect x="6" y="6" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="15" y="15" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
      
      <line x1="14" y1="1" x2="14" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="24" y1="1" x2="24" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="34" y1="1" x2="34" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="42" x2="14" y2="47" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="24" y1="42" x2="24" y2="47" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="34" y1="42" x2="34" y2="47" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="1" y1="14" x2="6" y2="14" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="1" y1="24" x2="6" y2="24" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="1" y1="34" x2="6" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="42" y1="14" x2="47" y2="14" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="42" y1="24" x2="47" y2="24" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="42" y1="34" x2="47" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>

    
    <text x="145" y="158" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Colocated: prefill and decode share one GPU</text>

    
    <rect x="80" y="185" width="1440" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="226" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Long prefill: compute heavy</text>

    
    <g transform="translate(0, 0)">
      
      <path d="M 120,285 L 155,270 L 190,300 L 225,270 L 260,300 L 295,270 L 330,300 L 365,270 L 400,300 L 435,285" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
      
      <rect x="470" y="260" width="660" height="50" rx="25" fill="#ffffff" stroke="#d32f2f" stroke-width="2" />
      <text x="800" y="295" font-family="sans-serif" font-size="25" font-weight="bold" fill="#d32f2f" text-anchor="middle">Streaming users see a stall</text>
      
      
      <path d="M 1165,285 L 1200,270 L 1235,300 L 1270,270 L 1305,300 L 1340,270 L 1375,300 L 1410,270 L 1445,300 L 1480,285" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <rect x="80" y="330" width="1440" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="371" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Decode: memory-bandwidth heavy, one token at a time</text>
  </g>

  
  <g id="split-design-group">
    
    <rect x="50" y="470" width="220" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(132, 510)">
      <rect x="0" y="10" width="56" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="14" cy="28" r="4" fill="#207448" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <circle cx="42" cy="28" r="4" fill="#207448" />
      
      <line x1="16" y1="10" x2="16" y2="2" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="10" x2="40" y2="2" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="160" y="605" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Router</text>

    
    <rect x="360" y="470" width="370" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(517, 505)">
      <rect x="0" y="4" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="14" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="25" x2="42" y2="25" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="14" y1="34" x2="32" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="42" cy="34" r="3" fill="#207448" />
    </g>
    <text x="545" y="595" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="545" dy="0">Prefill pool:</tspan>
      <tspan x="545" dy="40" font-size="24" font-weight="normal">picks by cache and load</tspan>
    </text>

    
    <rect x="1180" y="470" width="370" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(1337, 505)">
      <rect x="4" y="2" width="48" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="2" x2="16" y2="48" stroke="#207448" stroke-width="2" />
      <line x1="28" y1="2" x2="28" y2="48" stroke="#207448" stroke-width="2" />
      <line x1="40" y1="2" x2="40" y2="48" stroke="#207448" stroke-width="2" />
      <line x1="4" y1="16" x2="52" y2="16" stroke="#207448" stroke-width="2" />
      <line x1="4" y1="34" x2="52" y2="34" stroke="#207448" stroke-width="2" />
    </g>
    <text x="1365" y="595" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1365" dy="0">Decode pool:</tspan>
      <tspan x="1365" dy="40" font-size="24" font-weight="normal">picks by free KV memory</tspan>
    </text>

    
    <line x1="270" y1="560" x2="344" y2="560" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <path d="M 270,660 L 315,660 L 315,765 L 1365,765 L 1365,736" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <line x1="730" y1="535" x2="1164" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <text x="955" y="515" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">KV cache moved between pools, needs a fast link</text>

    
    <rect x="745" y="565" width="420" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="955" y="594" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Keep prefill and decode inside one fast domain where possible</text>

    
    <line x1="1180" y1="645" x2="746" y2="645" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)" />
    
    
    <text x="955" y="688" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Backpressure: decode queue full, prefill slows down</text>
  </g>

  
  <g id="bottom-rule-group">
    <rect x="50" y="855" width="1500" height="95" rx="14" fill="#207448" />
    <text x="800" y="897" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Start colocated with chunked prefill.</text>
    <text x="800" y="933" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Split when p99 inter-token latency is dominated by prefill interference.</text>
  </g>
</svg>