<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Alert to likely causes to first check</title>
  <desc>Table mapping production alerts to likely causes in order and first check commands.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Alert to likely causes to first check</text>

  
  <rect x="40" y="95" width="1520" height="975" rx="8" fill="#ffffff" stroke="#c8d8cb" stroke-width="2"/>

  
  <path d="M 40 103 A 8 8 0 0 1 48 95 L 1552 95 A 8 8 0 0 1 1560 103 L 1560 150 L 40 150 Z" fill="#207448"/>
  <text x="245" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Alert</text>
  <text x="710" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Likely causes in order</text>
  <text x="1265" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">First check</text>

  
  <line x1="450" y1="95" x2="450" y2="1070" stroke="#c8d8cb" stroke-width="2"/>
  <line x1="970" y1="95" x2="970" y2="1070" stroke="#c8d8cb" stroke-width="2"/>

  
  <line x1="40" y1="265" x2="1560" y2="265" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 183)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="26" r="18"/>
    <polyline points="24,14 24,26 33,26"/>
    <line x1="16" y1="4" x2="32" y2="4"/>
    <line x1="24" y1="4" x2="24" y2="8"/>
  </g>
  <text x="122" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">TTFT p99 high</text>
  <text x="470" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">queue growth, cache hit collapse,</tspan>
    <tspan x="470" dy="28">head-of-line blocking,</tspan>
    <tspan x="470" dy="28">KV exhaustion</tspan>
  </text>
  <text x="990" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">vllm:request_queue_time_seconds p99</tspan>
    <tspan x="990" dy="30">versus vllm:num_requests_waiting</tspan>
  </text>

  
  <rect x="41" y="266" width="1518" height="113" fill="#e8f1ea"/>
  <line x1="40" y1="380" x2="1560" y2="380" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 298)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 36 A 20 20 0 1 1 42 36"/>
    <line x1="24" y1="28" x2="34" y2="16"/>
    <circle cx="24" cy="28" r="3" fill="#207448"/>
  </g>
  <text x="122" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Inter-token</tspan>
    <tspan x="122" dy="30">latency high</tspan>
  </text>
  <text x="470" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">KV exhaustion,</tspan>
    <tspan x="470" dy="28">head-of-line blocking,</tspan>
    <tspan x="470" dy="28">low speculative acceptance</tspan>
  </text>
  <text x="990" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">vllm:num_preemptions_total rate</tspan>
    <tspan x="990" dy="30">and prompt-token tail</tspan>
  </text>

  
  <line x1="40" y1="495" x2="1560" y2="495" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 413)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="36" height="8" rx="2"/>
    <rect x="6" y="20" width="36" height="8" rx="2"/>
    <rect x="6" y="32" width="36" height="8" rx="2"/>
    <polyline points="2,12 2,36 6,36"/>
  </g>
  <text x="122" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Waiting queue</tspan>
    <tspan x="122" dy="30">growing</tspan>
  </text>
  <text x="470" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">capacity, noisy tenant,</tspan>
    <tspan x="470" dy="30">retry amplification</tspan>
  </text>
  <text x="990" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">vllm:num_requests_running at limit,</tspan>
    <tspan x="990" dy="30">per-tenant tokens</tspan>
  </text>

  
  <rect x="41" y="496" width="1518" height="113" fill="#e8f1ea"/>
  <line x1="40" y1="610" x2="1560" y2="610" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 528)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 6 L 40 12 L 40 26 C 40 36 24 44 24 44 C 24 44 8 36 8 26 L 8 12 Z"/>
    <line x1="24" y1="16" x2="24" y2="28"/>
    <circle cx="24" cy="34" r="1.5" fill="#207448"/>
  </g>
  <text x="122" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">503s rising</text>
  <text x="470" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">admission limit, pool shrink,</tspan>
    <tspan x="470" dy="30">overload</tspan>
  </text>
  <text x="990" y="545" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">vllm:admission_rejections_total</tspan>
    <tspan x="990" dy="30">and ready replicas</tspan>
  </text>

  
  <rect x="41" y="611" width="1518" height="113" fill="#ffffff"/>
  <rect x="41" y="611" width="10" height="113" fill="#db8129"/>
  <line x1="40" y1="725" x2="1560" y2="725" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 643)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="28" height="28" rx="4"/>
    <line x1="18" y1="18" x2="30" y2="30"/>
    <line x1="30" y1="18" x2="18" y2="30"/>
    <line x1="16" y1="4" x2="16" y2="10"/>
    <line x1="32" y1="4" x2="32" y2="10"/>
    <line x1="16" y1="38" x2="16" y2="44"/>
    <line x1="32" y1="38" x2="32" y2="44"/>
  </g>
  <text x="122" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Tokens per second</tspan>
    <tspan x="122" dy="30">is zero</tspan>
  </text>
  <text x="470" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">hang, Xid fault, crash loop</text>
  <text x="990" y="675" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">dmesg Xid lines and NCCL log</text>

  
  <rect x="41" y="726" width="1518" height="113" fill="#e8f1ea"/>
  <line x1="40" y1="840" x2="1560" y2="840" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 758)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="24" height="24" rx="3"/>
    <path d="M 38 12 A 18 18 0 1 0 42 28"/>
    <polyline points="44,20 42,28 34,28"/>
  </g>
  <text x="122" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Pods restarting</text>
  <text x="470" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">liveness kill, startup OOM,</tspan>
    <tspan x="470" dy="30">runtime OOM</tspan>
  </text>
  <text x="990" y="792" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">pod last state and restart reason</text>

  
  <line x1="40" y1="955" x2="1560" y2="955" stroke="#c8d8cb" stroke-width="1.5"/>
  
  <g transform="translate(58, 873)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="16" height="14" rx="2"/>
    <rect x="26" y="8" width="16" height="14" rx="2"/>
    <rect x="6" y="26" width="16" height="14" rx="2"/>
    <line x1="28" y1="33" x2="40" y2="33" stroke-dasharray="3 3"/>
  </g>
  <text x="122" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Ready below</tspan>
    <tspan x="122" dy="30">desired</tspan>
  </text>
  <text x="470" y="905" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">shrink, herd, slow load</text>
  <text x="990" y="890" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">router backend list,</tspan>
    <tspan x="990" dy="30">load time in startup log</tspan>
  </text>

  
  <path d="M 41 956 L 1559 956 L 1559 1062 A 8 8 0 0 1 1551 1070 L 49 1070 A 8 8 0 0 1 41 1062 Z" fill="#e8f1ea"/>
  
  <g transform="translate(58, 988)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 8 L 30 8 L 38 16 L 38 40 L 10 40 Z"/>
    <polyline points="30,8 30,16 38,16"/>
    <line x1="16" y1="24" x2="30" y2="24"/>
    <line x1="16" y1="32" x2="26" y2="32"/>
  </g>
  <text x="122" y="1005" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="122" dy="0">Output complaints,</tspan>
    <tspan x="122" dy="30">infra green</tspan>
  </text>
  <text x="470" y="991" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">finish_reason drift,</tspan>
    <tspan x="470" dy="28">quantisation, version skew,</tspan>
    <tspan x="470" dy="28">sampling defaults</tspan>
  </text>
  <text x="990" y="1005" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="990" dy="0">vllm:request_success_total shares</tspan>
    <tspan x="990" dy="30">by finished_reason</tspan>
  </text>

  
  <rect x="40" y="1090" width="1520" height="70" rx="8" fill="#207448"/>
  <text x="800" y="1134" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">use the tree first and the table second: anchor symptom, then supporting evidence</text>
</svg>