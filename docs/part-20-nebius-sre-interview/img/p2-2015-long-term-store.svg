<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940">
  <title>Long-term storage: choose by what breaks first</title>
  <desc>Decision flow comparing local Prometheus, remote write, and Thanos based on failure modes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="940" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Long-term storage: choose by what breaks first</text>

  
  <rect x="520" y="115" width="560" height="70" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="800" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Choose by what breaks first</text>

  
  <line x1="505" y1="405" x2="570" y2="405" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="1030" y1="405" x2="1095" y2="405" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="stage-1">
    <rect x="45" y="225" width="460" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(247, 270)">
      <rect x="0" y="0" width="56" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <rect x="7" y="8" width="8" height="12" rx="1" fill="#207448" />
      <rect x="19" y="8" width="8" height="12" rx="1" fill="#207448" />
      <rect x="31" y="8" width="8" height="12" rx="1" fill="#207448" />
      <rect x="43" y="8" width="8" height="12" rx="1" fill="#207448" />
      <line x1="10" y1="36" x2="10" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="36" x2="18" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="36" x2="26" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="34" y1="36" x2="34" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="36" x2="42" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="275" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="275" dy="0">Local Prometheus:</tspan>
      <tspan x="275" dy="44">active series in memory</tspan>
    </text>
  </g>

  
  <g id="stage-2">
    <rect x="570" y="225" width="460" height="360" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(800, 275)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#db8129" stroke-width="3.5" />
      <path d="M -12 0 L 10 0 M 0 -10 L 10 0 L 0 10" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="800" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Remote write to a</tspan>
      <tspan x="800" dy="40">long-term store</tspan>
    </text>

    
    <rect x="595" y="430" width="410" height="130" rx="12" fill="#fdf6ee" stroke="#db8129" stroke-width="2" />
    <text x="800" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">A remote write outage</tspan>
      <tspan x="800" dy="32">is a gap, see the</tspan>
      <tspan x="800" dy="32">scenario three</tspan>
    </text>
  </g>

  
  <g id="stage-3">
    <rect x="1095" y="225" width="460" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(1325, 260)">
      <polygon points="0,0 28,14 0,28 -28,14" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M -28 26 L 0 40 L 28 26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -28 38 L 0 52 L 28 38" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="1325" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1325" dy="0">Thanos or a</tspan>
      <tspan x="1325" dy="44">similar layer on top</tspan>
    </text>
  </g>

  
  
  <g id="note-1">
    <rect x="45" y="625" width="460" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="275" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="275" dy="0">Memory and query time</tspan>
      <tspan x="275" dy="38">break first</tspan>
    </text>
  </g>

  
  <g id="note-2">
    <rect x="570" y="625" width="460" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="800" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Storage cost and</tspan>
      <tspan x="800" dy="38">remote write backlog</tspan>
    </text>
  </g>

  
  <g id="note-3">
    <rect x="1095" y="625" width="460" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="1325" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1325" dy="0">Query fan-out across</tspan>
      <tspan x="1325" dy="38">many stores</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="45" y="795" width="1510" height="90" rx="16" fill="#207448" />
    <text x="800" y="850" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Keep the recording rules small, so the long-term store holds the rolled-up series.</text>
  </g>
</svg>