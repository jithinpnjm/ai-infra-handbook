  <text x="580" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Guest virtual machine</text>

  
  <rect x="90" y="175" width="450" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
