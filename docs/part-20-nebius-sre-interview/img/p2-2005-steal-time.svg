  <text x="195" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Guest CPU looks idle</text>

  
  <rect x="570" y="175" width="500" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
