  <circle cx="128" cy="610" r="11" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 112 638 C 112 626 118 623 128 623 C 138 623 144 626 144 638" fill="none" stroke="#207448" stroke-width="3" />
  <text x="165" y="628" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Other tenant</text>

  
  <rect x="370" y="535" width="480" height="185" rx="12" fill="#1b2e25" stroke="#db8129" stroke-width="4" />
  
  <rect x="582" y="555" width="56" height="56" rx="8" fill="none" stroke="#db8129" stroke-width="3" />
  <path d="M 596 583 L 624 583 M 616 575 L 624 583 L 616 591" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="610" y="660" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Hypervisor takes the CPU</text>

  
  <rect x="880" y="550" width="190" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="975" cy="576" r="9" fill="none" stroke="#207448" stroke-width="2.5" />
