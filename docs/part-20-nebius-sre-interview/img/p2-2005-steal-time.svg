  <rect x="600" y="221" width="34" height="10" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <path d="M 648 262 L 648 221 M 641 229 L 648 221 L 655 229" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="680" y="238">Run queue grows,</tspan>
    <tspan x="680" y="278">threads runnable</tspan>
  </text>

  
  <rect x="90" y="335" width="980" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="125" cy="372" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
  <line x1="125" y1="365" x2="125" y2="373" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="125" cy="379" r="1.5" fill="#207448" />
  <text x="155" y="381" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tuning the guest scheduler cannot give back stolen time.</text>


  
  <rect x="60" y="470" width="1040" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="90" y="515" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Hypervisor</text>

  
