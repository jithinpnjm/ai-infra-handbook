  <circle cx="975" cy="661" r="9" fill="none" stroke="#207448" stroke-width="2.5" />
  <path d="M 962 687 C 962 677 967 675 975 675 C 983 675 988 677 988 687" fill="none" stroke="#207448" stroke-width="2.5" />


  
  <rect x="60" y="790" width="1040" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="360" y="855" width="60" height="60" rx="6" fill="none" stroke="#207448" stroke-width="4" />
