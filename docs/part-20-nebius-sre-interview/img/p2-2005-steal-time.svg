  <line x1="1200" y1="280" x2="1480" y2="280" stroke="#207448" stroke-width="1.5" />
  <line x1="1245" y1="245" x2="1245" y2="420" stroke="#207448" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="1290" y1="245" x2="1290" y2="420" stroke="#207448" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="1335" y1="245" x2="1335" y2="420" stroke="#207448" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="1380" y1="245" x2="1380" y2="420" stroke="#207448" stroke-width="1" stroke-dasharray="2 2" />
  
  <rect x="1425" y="245" width="55" height="175" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="1435" y="300" width="35" height="100" rx="3" fill="#207448" />
  <text x="1340" y="475" font-family="monospace, Courier" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">vmstat: st column</text>

  
  <rect x="1170" y="565" width="340" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 1320 630 A 20 20 0 1 1 1360 630" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1340" y1="630" x2="1354" y2="615" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <path d="M 1220 770 A 100 100 0 0 1 1460 770" fill="none" stroke="#e8f1ea" stroke-width="24" stroke-linecap="round" />
  <path d="M 1390 699 A 100 100 0 0 1 1460 770" fill="none" stroke="#207448" stroke-width="24" stroke-linecap="round" />
