<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>The hypervisor takes time the guest cannot see</title>
  <desc>Visual infographic explaining how hypervisor CPU preemption steals time from guest virtual machines, causing run queues to grow while guest CPU appears idle, and how vmstat and mpstat report CPU steal time.</desc>

  <defs>
    <marker id="arrow-up" viewBox="0 0 16 16" refX="8" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 8 2 L 14 14 L 8 11 L 2 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 16 16" refX="8" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 8 14 L 14 2 L 8 5 L 2 2 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The hypervisor takes time the guest cannot see</text>

  
  <rect x="1140" y="110" width="400" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1170" y="145" width="340" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
