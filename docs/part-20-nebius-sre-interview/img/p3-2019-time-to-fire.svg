<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>How long each alert takes to fire at different error ratios</title>
  <desc>Infographic explaining how long each alert takes to fire at different error ratios from 100 percent to 0.5 percent</desc>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="80" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How long each alert takes to fire at different error ratios</text>

  
  <rect x="80" y="115" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(110, 142)">
    <rect x="5" y="2" width="46" height="52" rx="6" stroke="#207448" stroke-width="4" fill="none" />
    <rect x="13" y="10" width="30" height="12" rx="2" stroke="#207448" stroke-width="2" fill="none" />
    <circle cx="18" cy="32" r="2.5" fill="#207448" />
    <circle cx="28" cy="32" r="2.5" fill="#207448" />
    <circle cx="38" cy="32" r="2.5" fill="#207448" />
    <circle cx="18" cy="42" r="2.5" fill="#207448" />
    <circle cx="28" cy="42" r="2.5" fill="#207448" />
    <circle cx="38" cy="42" r="2.5" fill="#207448" />
  </g>

  
  <text x="195" y="158" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="25" font-weight="bold">time for the 1 hour window average to reach the 0.0144 threshold = </tspan>
    <tspan x="195" dy="38" font-size="25">0.0144 / error ratio hours (long window was clean before)</tspan>
  </text>

  
  <rect x="80" y="248" width="1440" height="660" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <text x="110" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Table of error ratio against the first alert that catches it</text>

  
  <rect x="105" y="318" width="1390" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(130, 350)">
    <path d="M 6 44 L 50 44" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <path d="M 12 44 C 12 16 44 16 44 44 Z" stroke="#db8129" stroke-width="4" fill="none" />
    <line x1="28" y1="4" x2="28" y2="11" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="11" x2="16" y2="17" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="11" x2="40" y2="17" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="215" y="365" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">100 percent errors (service fully dark): </tspan>
    <tspan x="215" dy="40" font-size="25">fast page after 0.0144 hours = 0.864 min, about 52 seconds</tspan>
  </text>

  
  <rect x="105" y="458" width="1390" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(130, 490)">
    <rect x="5" y="10" width="46" height="38" rx="6" stroke="#207448" stroke-width="4" fill="none" />
    <rect x="13" y="18" width="22" height="12" rx="2" stroke="#207448" stroke-width="2" fill="none" />
    <line x1="41" y1="21" x2="46" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="41" y1="27" x2="46" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 10 L 12 4" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="215" y="505" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">2 percent errors: </tspan>
    <tspan x="215" dy="40" font-size="25">fast page after 0.0144 / 0.02 = 0.72 hours = 43.2 minutes</tspan>
  </text>

  
  <rect x="105" y="598" width="1390" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(130, 645)">
    <circle cx="28" cy="28" r="24" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M 28 12 L 28 28 L 40 28" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="215" y="642" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">1 percent errors: </tspan>
    <tspan x="215" dy="38" font-size="25">fast page never fires because 1 percent is below 1.44 percent; </tspan>
    <tspan x="215" dy="36" font-size="25">the 6-hour rule catches it after 0.006 / 0.01 x 6 hours = 3.6 hours</tspan>
  </text>

  
  <rect x="105" y="768" width="1390" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(130, 800)">
    <rect x="9" y="8" width="38" height="44" rx="4" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M 20 8 L 20 4 L 36 4 L 36 8" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none" />
    <line x1="17" y1="20" x2="39" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="17" y1="30" x2="39" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="17" y1="40" x2="30" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="215" y="815" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">0.5 percent errors: </tspan>
    <tspan x="215" dy="40" font-size="25">only the ticket catches it, after 14.4 hours</tspan>
  </text>

  
  <rect x="80" y="930" width="1440" height="110" rx="12" fill="#207448" />
  
  
  <g transform="translate(110, 957)">
    <path d="M 7 6 L 49 6 C 49 29 28 50 28 50 C 28 50 7 29 7 6 Z" stroke="#ffffff" stroke-width="4" fill="none" />
    <path d="M 18 24 L 25 31 L 38 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  
  <text x="195" y="972" font-family="system-ui, -apple-system, sans-serif" fill="#ffffff">
    <tspan font-size="25" font-weight="bold">big outages page within a minute, slow leaks are caught by the slower rules; </tspan>
    <tspan x="195" dy="38" font-size="25">the unit-tested calculator reproduces each number</tspan>
  </text>
</svg>