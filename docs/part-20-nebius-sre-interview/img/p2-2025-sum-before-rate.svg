<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Summing counters before rate hides the restart</title>
  <desc>Visual comparison demonstrating why counters must be rated before being summed across pods to avoid hiding restarts.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Summing counters before rate hides the restart</text>

  
  <rect x="60" y="125" width="715" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(100, 145)">
    
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="16" x2="28" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="38" r="2.5" fill="#207448"/>
  </g>
  <text x="430" y="180" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Wrong: sum first, then rate</text>

  
  <rect x="90" y="215" width="655" height="295" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>

  
  <line x1="120" y1="330" x2="710" y2="330" stroke="#e0ece2" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="120" y1="450" x2="710" y2="450" stroke="#e0ece2" stroke-width="2" stroke-dasharray="6,6"/>
  
  <line x1="415" y1="230" x2="415" y2="485" stroke="#9bb3a2" stroke-width="2" stroke-dasharray="4,4"/>

  
  <rect x="130" y="235" width="140" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="200" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pod A</text>

  <rect x="290" y="235" width="140" height="58" rx="8" fill="#e8f1ea" stroke="#303a36" stroke-width="2"/>
  <text x="360" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod B</text>

  
  
  <path d="M 120 330 L 415 330 L 415 450 L 710 450" fill="none" stroke="#207448" stroke-width="4"/>
  
  <path d="M 120 450 L 415 450 L 415 330 L 710 330" fill="none" stroke="#303a36" stroke-width="4" stroke-dasharray="8,6"/>

  
  <line x1="417" y1="510" x2="417" y2="540" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="90" y="550" width="655" height="315" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>

  
  <rect x="115" y="575" width="605" height="64" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
  <text x="417" y="616" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">Sum stays flat: the reset is invisible</text>

  
  <line x1="130" y1="675" x2="705" y2="675" stroke="#db8129" stroke-width="8" stroke-linecap="round"/>

  
  <rect x="115" y="725" width="605" height="110" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
  <text x="417" y="770" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="417" dy="0">The work pod A did</tspan>
    <tspan x="417" dy="34">before the restart is lost</tspan>
  </text>


  
  <rect x="825" y="125" width="715" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(850, 142)">
    
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 18 28 L 25 35 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1200" y="165" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#207448">
    <tspan x="1200" dy="0">Right: rate per series, then</tspan>
    <tspan x="1200" dy="34">sum by the labels you keep</tspan>
  </text>

  
  
  <g transform="translate(860, 230)">
    <rect x="0" y="0" width="280" height="150" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <line x1="30" y1="25" x2="30" y2="125" stroke="#d5e3d9" stroke-width="2"/>
    <line x1="30" y1="125" x2="255" y2="125" stroke="#d5e3d9" stroke-width="2"/>
    <line x1="140" y1="25" x2="140" y2="125" stroke="#9bb3a2" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <path d="M 30 55 L 140 55 L 140 120 L 255 120" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  
  <g transform="translate(1220, 230)">
    <rect x="0" y="0" width="280" height="150" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <line x1="30" y1="25" x2="30" y2="125" stroke="#d5e3d9" stroke-width="2"/>
    <line x1="30" y1="125" x2="255" y2="125" stroke="#d5e3d9" stroke-width="2"/>
    <line x1="140" y1="25" x2="140" y2="125" stroke="#9bb3a2" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <path d="M 30 120 L 140 120 L 140 55 L 255 55" fill="none" stroke="#303a36" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  
  <g>
    
    <line x1="1000" y1="380" x2="1000" y2="470" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    
    <circle cx="1000" cy="425" r="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M 992 430 L 1008 420" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    
    <line x1="1360" y1="380" x2="1360" y2="470" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    
    <circle cx="1360" cy="425" r="18" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <path d="M 1352 430 L 1368 420" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="880" y="475" width="605" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1182" y="528" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">sum by the labels you keep</text>

  
  <line x1="1182" y1="560" x2="1182" y2="615" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="860" y="615" width="645" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="890" y="638" width="585" height="64" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1182" y="678" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Fleet rate, reset handled per pod</text>

  
  <g transform="translate(890, 715)">
    
    <line x1="30" y1="105" x2="555" y2="105" stroke="#d5e3d9" stroke-width="2"/>
    <line x1="30" y1="20" x2="30" y2="105" stroke="#d5e3d9" stroke-width="2"/>
    
    <path d="M 30 50 Q 150 45, 270 50 T 555 50" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
  </g>


  
  <rect x="60" y="915" width="1480" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="90" y="938" width="1420" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="980" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">sum by (labels you keep) (rate(counter))</text>

  
  <text x="800" y="1045" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Rate per series, sum by the labels you want to keep, then divide.</text>

  
  <text x="800" y="1092" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Numerator and denominator summed separately, then divided. Never average ratios.</text>
</svg>