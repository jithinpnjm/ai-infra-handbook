<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Summing counters before rate hides the restart</title>
  <desc>SVG infographic contrasting wrong pattern of summing counters before rate versus right pattern of computing rate per series then summing</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Summing counters before rate hides the restart</text>

  
  <rect x="40" y="100" width="740" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(68, 128)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="20" y1="11" x2="20" y2="23" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="20" cy="29" r="2.5" fill="#207448" />
  </g>
  <text x="125" y="156" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Wrong: sum first, then rate</text>

  
  <rect x="70" y="180" width="680" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <line x1="130" y1="370" x2="670" y2="370" stroke="#c8dcd0" stroke-width="2" />
  <line x1="130" y1="220" x2="130" y2="370" stroke="#c8dcd0" stroke-width="2" />

  
  <path d="M 140 370 L 370 230" fill="none" stroke="#303a36" stroke-width="4" />
  <line x1="370" y1="230" x2="370" y2="370" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 370 370 L 470 320" fill="none" stroke="#303a36" stroke-width="4" />
  <text x="235" y="275" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">pod A</text>

  
  <path d="M 140 370 L 370 370 L 600 230 L 660 230" fill="none" stroke="#207448" stroke-width="4" />
  <text x="515" y="275" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">pod B</text>

  
  <line x1="410" y1="410" x2="410" y2="445" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="450" width="680" height="280" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />

  
  <line x1="130" y1="580" x2="670" y2="580" stroke="#c8dcd0" stroke-width="2" />
  <line x1="130" y1="480" x2="130" y2="580" stroke="#c8dcd0" stroke-width="2" />

  
  <line x1="140" y1="500" x2="660" y2="500" stroke="#db8129" stroke-width="6" />

  <text x="410" y="635" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Sum stays flat: the reset is invisible</text>
  <text x="410" y="685" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">The work pod A did before the restart is lost</text>


  
  <rect x="820" y="100" width="740" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(845, 128)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 11 20 L 17 26 L 29 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="895" y="140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="895" dy="0">Right: rate per series,</tspan>
    <tspan x="895" dy="36">then sum by the labels you keep</tspan>
  </text>

  
  <rect x="850" y="210" width="320" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 870 330 L 940 260" fill="none" stroke="#303a36" stroke-width="3" />
  <line x1="940" y1="260" x2="940" y2="330" stroke="#db8129" stroke-width="2" stroke-dasharray="4,3" />
  <path d="M 940 330 L 980 300" fill="none" stroke="#303a36" stroke-width="3" />
  
  <g transform="translate(1000, 240)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <path d="M 1080 330 L 1100 250 L 1140 250" fill="none" stroke="#207448" stroke-width="4" />

  
  <rect x="1210" y="210" width="320" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 1230 330 L 1290 330 L 1340 260" fill="none" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1360, 240)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <path d="M 1440 330 L 1460 250 L 1500 250" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 1010 365 L 1010 405" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 1370 365 L 1370 405" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="880" y="415" width="620" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(915, 432)">
    <path d="M 38 10 L 14 10 L 26 28 L 14 46 L 38 46" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1210" y="471" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">sum by the labels you keep</text>

  
  <line x1="1190" y1="505" x2="1190" y2="538" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="850" y="545" width="680" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <line x1="910" y1="635" x2="1470" y2="635" stroke="#c8dcd0" stroke-width="2" />
  <line x1="910" y1="570" x2="910" y2="635" stroke="#c8dcd0" stroke-width="2" />

  
  <path d="M 930 600 L 1120 600 L 1150 580 L 1450 580" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" />

  <text x="1190" y="685" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Fleet rate, reset handled per pod</text>


  
  <rect x="40" y="785" width="1520" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="80" y="805" width="1440" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="847" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">sum by (labels you keep) (rate(counter))</text>

  
  <text x="800" y="918" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Rate per series, sum by the labels you want to keep, then divide.</text>
  <text x="800" y="970" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Numerator and denominator summed separately, then divided. Never average ratios.</text>
</svg>