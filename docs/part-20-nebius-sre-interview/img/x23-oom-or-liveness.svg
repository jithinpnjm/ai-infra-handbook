<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Restart loop: read Last State first, then the OOM branch or the liveness branch</title>
  <desc>A decision flow diagram diagnosing Kubernetes pod restart loops via Last State, splitting into OOM kill and Liveness kill branches, with remediation steps and restart back-off details.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Restart loop: read Last State first,</tspan>
    <tspan x="800" dy="56">then the OOM branch or the liveness branch</tspan>
  </text>

  
  <g>
    <rect x="430" y="160" width="740" height="115" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(460, 190)">
      <circle cx="27" cy="27" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="27,13 27,27 38,27" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="27" cy="27" r="3" fill="#207448" />
    </g>
    <text x="540" y="206" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Pod restarts every few minutes</text>
    <text x="540" y="248" font-family="sans-serif" font-size="24px" fill="#303a36">Read Last State from describe</text>
  </g>

  
  <path d="M 800 275 L 800 333" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

  
  <g>
    <rect x="520" y="335" width="560" height="110" rx="20" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(552, 363)">
      <circle cx="27" cy="27" r="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 27 7 L 27 13 M 27 41 L 27 47 M 7 27 L 13 27 M 41 27 L 47 27 M 13 13 L 17 17 M 37 37 L 41 41 M 13 41 L 17 37 M 37 13 L 41 17" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="27" cy="27" r="18" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />
    </g>
    <text x="625" y="402" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Who pulled the trigger?</text>
  </g>

  
  
  <path d="M 720 445 V 475 Q 720 480 715 480 H 435 Q 430 480 430 485 V 513" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />
  
  <path d="M 880 445 V 475 Q 880 480 885 480 H 1165 Q 1170 480 1170 485 V 513" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

  
  <g>
    <rect x="80" y="515" width="700" height="425" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(115, 540)">
      <rect x="8" y="8" width="38" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 2 L 18 8 M 27 2 L 27 8 M 36 2 L 36 8 M 18 46 L 18 52 M 27 46 L 27 52 M 36 46 L 36 52 M 2 18 L 8 18 M 2 27 L 8 27 M 2 36 L 8 36 M 46 18 L 52 18 M 46 27 L 52 27 M 46 36 L 52 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="185" y="578" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">OOM kill</text>

    
    <rect x="115" y="615" width="630" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="140" y="655" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24px" font-weight="bold" fill="#303a36">Reason: OOMKilled</text>
    <text x="140" y="695" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24px" font-weight="bold" fill="#303a36">Exit Code: 137</text>

    
    <text x="430" y="760" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">Kernel enforces the memory limit</text>

    
    <rect x="115" y="790" width="630" height="125" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="430" y="842" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="430" dy="0">Fix: the memory limit, a leak, or</tspan>
      <tspan x="430" dy="38">the batch and context size</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="515" width="700" height="425" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(855, 540)">
      <rect x="4" y="6" width="46" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 28 L 18 28 L 22 18 L 28 38 L 34 24 L 38 28 L 44 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="925" y="578" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Liveness kill</text>

    
    <rect x="855" y="615" width="630" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="880" y="655" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24px" font-weight="bold" fill="#303a36">Unhealthy</text>
    <text x="880" y="695" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24px" font-weight="bold" fill="#303a36">Killing</text>

    
    <text x="1170" y="760" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">No OOMKilled in Last State</text>

    
    <rect x="855" y="790" width="630" height="125" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <text x="1170" y="828" text-anchor="middle" font-size="24px" fill="#303a36">
      <tspan x="1170" dy="0" font-family="sans-serif">Fix: a startup probe with</tspan>
      <tspan x="1170" dy="36"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">failureThreshold</tspan><tspan font-family="sans-serif"> times </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">periodSeconds</tspan></tspan>
      <tspan x="1170" dy="36" font-family="sans-serif">covering the worst start time</tspan>
    </text>
  </g>

  
  <g>
    <rect x="80" y="970" width="1440" height="110" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(115, 998)">
      <circle cx="27" cy="27" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 27 13 V 27 H 39" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 37 9 L 45 9 L 45 1" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="185" y="1018" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Restart back-off</text>
    <text x="185" y="1056" font-family="sans-serif" font-size="24px" fill="#303a36">Starts at 10 seconds, doubles, capped at 300 seconds, resets after ten clean minutes</text>
  </g>
</svg>