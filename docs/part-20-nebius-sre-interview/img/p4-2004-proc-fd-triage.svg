<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Triage Pipeline for Leaked File Descriptors via /proc and lsof</title>
  <desc>Visual triage workflow for diagnosing leaked file descriptors on a specific process ID using procfs and lsof.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Triage Pipeline for Leaked File Descriptors via /proc and lsof</text>
  <text x="800" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Flow diagram of descriptor triage on PID $pid</text>

  
  <rect x="40" y="130" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(65, 167)" stroke="#207448" stroke-width="4" fill="none">
    <path d="M 6 42 A 26 26 0 1 1 50 42"/>
    <line x1="28" y1="28" x2="40" y2="16"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  
  <circle cx="150" cy="195" r="24" fill="#207448"/>
  <text x="150" y="204" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <text x="195" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1: inspect limits via</text>
  <text x="195" y="210" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">grep 'Max open files' /proc/$pid/limits</text>
  <text x="195" y="244" font-family="sans-serif" font-size="24" fill="#303a36">yielding soft limit (e.g. 1024) and hard limit (1048576)</text>

  
  <line x1="800" y1="260" x2="800" y2="290" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="40" y="290" width="1520" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(65, 320)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="8" y="6" width="40" height="44" rx="4"/>
    <line x1="16" y1="18" x2="40" y2="18"/>
    <line x1="16" y1="28" x2="34" y2="28"/>
    <line x1="16" y1="38" x2="26" y2="38"/>
  </g>
  
  <circle cx="150" cy="345" r="24" fill="#207448"/>
  <text x="150" y="354" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <text x="195" y="335" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2: count current descriptors with</text>
  <text x="195" y="375" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ls /proc/$pid/fd | wc -l</text>

  
  <line x1="800" y1="400" x2="800" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="40" y="430" width="1520" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(65, 460)" stroke="#207448" stroke-width="4" fill="none">
    <polygon points="6,8 50,8 34,28 34,46 22,46 22,28"/>
  </g>
  
  <circle cx="150" cy="487" r="24" fill="#207448"/>
  <text x="150" y="496" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <text x="195" y="470" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3: aggregation pipeline</text>
  <text x="195" y="515" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ls -l /proc/$pid/fd | awk 'NR &gt; 1 {print $NF}' | sort | uniq -c | sort -rn | head</text>

  
  <line x1="800" y1="545" x2="800" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="40" y="570" width="1520" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="599" r="20" fill="#207448"/>
  <text x="75" y="607" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="110" y="609" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4 splits into four diagnostic target boxes:</text>

  

  
  
  <rect x="40" y="650" width="460" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="686" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Box A</text>
  <text x="65" y="722" font-family="sans-serif" font-size="24" fill="#303a36">Regular file path repeated</text>
  <text x="65" y="754" font-family="sans-serif" font-size="24" fill="#303a36">hundreds of times,</text>
  <text x="65" y="788" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">e.g. /var/log/app.log</text>

  
  <line x1="500" y1="730" x2="570" y2="730" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="570" y="650" width="470" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="595" y="718" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">Bug: Missing close() call</text>
  <text x="595" y="756" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">in file handler</text>

  
  
  <rect x="40" y="830" width="460" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="866" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Box B</text>
  <text x="65" y="910" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">socket:[2248868] repeating</text>

  
  <line x1="500" y1="910" x2="570" y2="910" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="570" y="830" width="470" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="595" y="898" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">Bug: Leaked TCP connections,</text>
  <text x="595" y="936" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">missing socket close</text>

  
  
  <rect x="40" y="1010" width="460" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="1046" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Box C</text>
  <text x="65" y="1090" font-family="sans-serif" font-size="24" fill="#303a36">Target ending in ' (deleted)',</text>
  <text x="65" y="1128" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">e.g. /tmp/app.log (deleted)</text>

  
  <line x1="500" y1="1090" x2="570" y2="1090" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="570" y="1010" width="470" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="595" y="1078" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">Bug: Unlinked log held open,</text>
  <text x="595" y="1116" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">blocks not freed</text>

  
  
  <rect x="40" y="1190" width="460" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="1226" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Box D</text>
  <text x="65" y="1270" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">anon_inode:[eventpoll]</text>
  <text x="65" y="1308" font-family="sans-serif" font-size="24" fill="#303a36">repeating</text>

  
  <line x1="500" y1="1270" x2="570" y2="1270" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="570" y="1190" width="470" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="595" y="1278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#9c2828">Bug: Leaked epoll instances</text>

  
  <rect x="1080" y="650" width="480" height="700" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="1105" y="694" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Side panel shows</text>
  <text x="1105" y="730" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">lsof columns comparison</text>

  
  <rect x="1105" y="760" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1207" y="792" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">COMMAND</text>

  <rect x="1105" y="820" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1207" y="852" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">PID</text>

  <rect x="1105" y="880" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1207" y="912" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">USER</text>

  <rect x="1105" y="940" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1207" y="972" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">FD</text>

  <rect x="1105" y="1000" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1207" y="1032" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">TYPE</text>

  
  <rect x="1330" y="760" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1432" y="792" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">DEVICE</text>

  <rect x="1330" y="820" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1432" y="852" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">SIZE/OFF</text>

  <rect x="1330" y="880" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1432" y="912" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">NODE</text>

  <rect x="1330" y="940" width="205" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1432" y="972" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">NAME</text>

  
  <rect x="1105" y="1080" width="430" height="235" rx="10" fill="#fef8f2" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(1292, 1105)" stroke="#db8129" stroke-width="3.5" fill="none">
    <circle cx="18" cy="18" r="14"/>
    <line x1="28" y1="28" x2="42" y2="42"/>
  </g>
  <text x="1320" y="1195" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">highlighting</text>
  <text x="1320" y="1245" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129" text-anchor="middle">+L1 for unlinked files</text>
</svg>