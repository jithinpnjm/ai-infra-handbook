<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Route by the endpoint's region, never by nearest</title>
  <desc>Visual infographic explaining endpoint-based routing versus nearest-region routing and data residency boundaries.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#c53030"/>
    </marker>
    <marker id="arrow-metering" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Route by the endpoint's region, never by nearest</text>

  
  <g id="control-plane">
    <rect x="50" y="95" width="1500" height="75" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(95, 132)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#207448" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="11" ry="22" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="145" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Control plane: metadata only, global</text>
  </g>

  
  <g id="customer-box">
    <rect x="50" y="200" width="440" height="105" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(95, 252)">
      <circle cx="0" cy="-12" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M -22 18 C -20 2, 20 2, 22 18" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="145" y="261" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">European customer</text>
  </g>

  
  <line x1="270" y1="305" x2="270" y2="408" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="295" y="362" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Routed by endpoint region</text>

  
  <path d="M 490 252 L 1350 252 L 1350 408" fill="none" stroke="#c53030" stroke-width="3.5" stroke-dasharray="10,6" marker-end="url(#arrow-red)"/>
  <text x="920" y="238" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c53030">Nearest region: breaks the promise without an error</text>

  
  <g transform="translate(1350, 330)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <line x1="-16" y1="-16" x2="16" y2="16" stroke="#db8129" stroke-width="10" stroke-linecap="round"/>
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#db8129" stroke-width="10" stroke-linecap="round"/>
    <line x1="-16" y1="-16" x2="16" y2="16" stroke="#c53030" stroke-width="6" stroke-linecap="round"/>
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#c53030" stroke-width="6" stroke-linecap="round"/>
  </g>

  
  <g id="eu-region">
    <rect x="50" y="410" width="1040" height="550" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="85" y="455" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">EU region (promised region)</text>

    
    <g transform="translate(90, 485)">
      <rect width="430" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(55, 75)">
        <rect x="-24" y="-18" width="48" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#207448" stroke-width="3.5"/>
        <circle cx="-14" cy="0" r="3" fill="#207448"/>
        <circle cx="14" cy="0" r="3" fill="#207448"/>
      </g>
      <text x="115" y="85" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Gateway</text>
    </g>

    
    <g transform="translate(570, 485)">
      <rect width="480" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(55, 75)">
        <rect x="-26" y="-24" width="52" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="-26" y="6" width="52" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <circle cx="-14" cy="-15" r="3" fill="#207448"/>
        <circle cx="-14" cy="15" r="3" fill="#207448"/>
      </g>
      <text x="115" y="85" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Replica group</text>
    </g>

    
    <g transform="translate(90, 680)">
      <rect width="460" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(55, 55)">
        <ellipse cx="0" cy="-16" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M -22 -16 L -22 16 C -22 21, 22 21, 22 16 L 22 -16" fill="none" stroke="#207448" stroke-width="3"/>
        <path d="M -22 0 C -22 5, 22 5, 22 0" fill="none" stroke="#207448" stroke-width="3"/>
      </g>
      <text x="115" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Log store</text>

      
      <g transform="translate(45, 145)">
        
        <rect x="0" y="10" width="28" height="22" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
        <path d="M 6 10 L 6 0 C 6 -6, 22 -6, 22 0 L 22 10" fill="none" stroke="#207448" stroke-width="3"/>
        <circle cx="14" cy="20" r="3" fill="#207448"/>
      </g>
      <text x="95" y="152" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="95" dy="0">Prompts, completions</tspan>
        <tspan x="95" dy="32">and logs stay in region</tspan>
      </text>
    </g>

    
    <g id="metering-box" transform="translate(590, 680)">
      <rect width="460" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(55, 60)">
        <path d="M -24 16 A 26 26 0 1 1 24 16" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="0" y1="12" x2="12" y2="-8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="0" cy="12" r="4" fill="#207448"/>
      </g>
      <text x="115" y="70" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Metering</text>
    </g>
  </g>

  
  <path d="M 1050 820 L 1530 820" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="10,6" marker-end="url(#arrow-metering)"/>
  <text x="1130" y="760" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1130" dy="0">Metering events leave only</tspan>
    <tspan x="1130" dy="32">after content is stripped</tspan>
  </text>

  
  <g id="us-region">
    <rect x="1160" y="410" width="380" height="240" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="1200" y="465" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">US region</text>

    
    <g transform="translate(1350, 545)">
      <rect x="-42" y="-45" width="84" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <line x1="-34" y1="-15" x2="34" y2="-15" stroke="#207448" stroke-width="2.5"/>
      <line x1="-34" y1="15" x2="34" y2="15" stroke="#207448" stroke-width="2.5"/>
      <circle cx="-22" cy="-30" r="3" fill="#207448"/>
      <circle cx="-12" cy="-30" r="3" fill="#207448"/>
      <circle cx="-22" cy="0" r="3" fill="#207448"/>
      <circle cx="-12" cy="0" r="3" fill="#207448"/>
      <circle cx="-22" cy="30" r="3" fill="#207448"/>
      <circle cx="-12" cy="30" r="3" fill="#207448"/>
    </g>
  </g>

  
  <g id="bottom-takeaway">
    <rect x="50" y="1005" width="1500" height="65" rx="14" fill="#207448"/>
    <text x="800" y="1046" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Cross-region failover is off by default for residency-bound tenants.</text>
  </g>
</svg>