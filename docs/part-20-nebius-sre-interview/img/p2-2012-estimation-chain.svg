<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>The six-step estimation chain from weights to GPUs</title>
  <desc>Visual explanation of the six-step estimation chain from model weights to GPU infrastructure capacity and cost.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The six-step estimation chain from weights to GPUs</text>

  
  <rect x="30" y="130" width="202" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="131" cy="172" r="24" fill="#207448" />
  <text x="131" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <g transform="translate(103, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="6" width="44" height="44" rx="4" />
    <rect x="16" y="16" width="24" height="24" />
    <line x1="18" y1="0" x2="18" y2="6" /><line x1="28" y1="0" x2="28" y2="6" /><line x1="38" y1="0" x2="38" y2="6" />
    <line x1="18" y1="50" x2="18" y2="56" /><line x1="28" y1="50" x2="28" y2="56" /><line x1="38" y1="50" x2="38" y2="56" />
    <line x1="0" y1="18" x2="6" y2="18" /><line x1="0" y1="28" x2="6" y2="28" /><line x1="0" y1="38" x2="6" y2="38" />
    <line x1="50" y1="18" x2="56" y2="18" /><line x1="50" y1="28" x2="56" y2="28" /><line x1="50" y1="38" x2="56" y2="38" />
  </g>
  <text x="131" y="305" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="131" dy="0">Weights</tspan>
    <tspan x="131" dy="38">memory</tspan>
  </text>
  <line x1="50" y1="440" x2="212" y2="440" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="131" y="490" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="131" dy="0">parameters</tspan>
    <tspan x="131" dy="34">x bytes</tspan>
    <tspan x="131" dy="34">per</tspan>
    <tspan x="131" dy="34">parameter</tspan>
  </text>

  
  <line x1="232" y1="430" x2="252" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="252" y="130" width="202" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="353" cy="172" r="24" fill="#207448" />
  <text x="353" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <g transform="translate(325, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="28" cy="12" rx="22" ry="8" />
    <path d="M 6 12 v 16 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -16" />
    <path d="M 6 28 v 16 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -16" />
  </g>
  <text x="353" y="305" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="353" dy="0">KV cache</tspan>
    <tspan x="353" dy="38">per</tspan>
    <tspan x="353" dy="38">request</tspan>
  </text>
  <line x1="272" y1="440" x2="434" y2="440" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="353" y="480" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="353" dy="0">KV bytes</tspan>
    <tspan x="353" dy="34">per token</tspan>
    <tspan x="353" dy="34">x (prompt</tspan>
    <tspan x="353" dy="34">+ output</tspan>
    <tspan x="353" dy="34">tokens)</tspan>
  </text>

  
  <line x1="454" y1="430" x2="474" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="474" y="130" width="208" height="600" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  <circle cx="578" cy="172" r="24" fill="#207448" />
  <text x="578" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <g transform="translate(550, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="10" width="48" height="36" rx="4" />
    <circle cx="28" cy="28" r="10" />
    <line x1="28" y1="18" x2="28" y2="38" />
    <line x1="18" y1="28" x2="38" y2="28" />
    <line x1="10" y1="46" x2="16" y2="52" /><line x1="20" y1="46" x2="26" y2="52" /><line x1="30" y1="46" x2="36" y2="52" /><line x1="40" y1="46" x2="46" y2="52" />
  </g>
  <text x="578" y="300" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="578" dy="0">Requests</tspan>
    <tspan x="578" dy="36">that fit</tspan>
    <tspan x="578" dy="36">on one</tspan>
    <tspan x="578" dy="36">GPU</tspan>
  </text>
  <line x1="494" y1="452" x2="662" y2="452" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="578" y="482" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="578" dy="0">GPU memory</tspan>
    <tspan x="578" dy="32">x 0.9 minus</tspan>
    <tspan x="578" dy="32">weights,</tspan>
    <tspan x="578" dy="32">divided by</tspan>
    <tspan x="578" dy="32">KV per</tspan>
    <tspan x="578" dy="32">request</tspan>
  </text>

  
  <line x1="682" y1="430" x2="702" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="702" y="130" width="202" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="803" cy="172" r="24" fill="#207448" />
  <text x="803" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <g transform="translate(775, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
    <line x1="28" y1="2" x2="28" y2="6" />
    <line x1="50" y1="28" x2="54" y2="28" />
  </g>
  <text x="803" y="300" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="803" dy="0">Decode</tspan>
    <tspan x="803" dy="36">tokens</tspan>
    <tspan x="803" dy="36">per</tspan>
    <tspan x="803" dy="36">second</tspan>
  </text>
  <line x1="722" y1="452" x2="884" y2="452" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="803" y="525" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="803" dy="0">batch size</tspan>
    <tspan x="803" dy="34">and decode</tspan>
    <tspan x="803" dy="34">rate</tspan>
  </text>

  
  <line x1="904" y1="430" x2="924" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="924" y="130" width="208" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1028" cy="172" r="24" fill="#207448" />
  <text x="1028" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <g transform="translate(1000, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="8" y1="12" x2="28" y2="28" />
    <line x1="8" y1="44" x2="28" y2="28" />
    <line x1="28" y1="28" x2="48" y2="28" />
    <polyline points="40,20 48,28 40,36" />
    <circle cx="8" cy="12" r="4" fill="#207448" />
    <circle cx="8" cy="44" r="4" fill="#207448" />
  </g>
  <text x="1028" y="300" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1028" dy="0">Requests</tspan>
    <tspan x="1028" dy="36">per</tspan>
    <tspan x="1028" dy="36">second</tspan>
    <tspan x="1028" dy="36">per GPU</tspan>
  </text>
  <line x1="944" y1="452" x2="1112" y2="452" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="1028" y="482" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1028" dy="0">prefill</tspan>
    <tspan x="1028" dy="32">tokens per</tspan>
    <tspan x="1028" dy="32">second</tspan>
    <tspan x="1028" dy="38">decode</tspan>
    <tspan x="1028" dy="32">tokens per</tspan>
    <tspan x="1028" dy="32">second</tspan>
  </text>

  
  <line x1="1132" y1="430" x2="1152" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="1152" y="130" width="202" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1253" cy="172" r="24" fill="#207448" />
  <text x="1253" y="172" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <g transform="translate(1225, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="6" width="44" height="12" rx="2" />
    <rect x="6" y="22" width="44" height="12" rx="2" />
    <rect x="6" y="38" width="44" height="12" rx="2" />
    <circle cx="14" cy="12" r="2" fill="#207448" /><circle cx="14" cy="28" r="2" fill="#207448" /><circle cx="14" cy="44" r="2" fill="#207448" />
    <line x1="42" y1="12" x2="44" y2="12" /><line x1="42" y1="28" x2="44" y2="28" /><line x1="42" y1="44" x2="44" y2="44" />
  </g>
  <text x="1253" y="300" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1253" dy="0">GPUs for</tspan>
    <tspan x="1253" dy="36">QPS, plus</tspan>
    <tspan x="1253" dy="36">headroom</tspan>
    <tspan x="1253" dy="36">and N+1</tspan>
  </text>
  <line x1="1172" y1="452" x2="1334" y2="452" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <text x="1253" y="492" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1253" dy="0">demand</tspan>
    <tspan x="1253" dy="34">divided by</tspan>
    <tspan x="1253" dy="34">requests</tspan>
    <tspan x="1253" dy="34">per second</tspan>
    <tspan x="1253" dy="34">per GPU</tspan>
  </text>

  
  <line x1="1354" y1="430" x2="1374" y2="430" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="1374" y="130" width="196" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1444, 212)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="22" />
    <path d="M 28 14 v 28" />
    <path d="M 34 20 C 34 16, 22 16, 22 23 C 22 31, 34 27, 34 35 C 34 42, 22 42, 22 37" />
  </g>
  <text x="1472" y="335" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1472" dy="0">Cost per</tspan>
    <tspan x="1472" dy="38">million</tspan>
    <tspan x="1472" dy="38">tokens</tspan>
  </text>

  
  <rect x="30" y="760" width="1540" height="64" rx="8" fill="#207448" />
  <text x="800" y="802" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Each box is a ceiling, not a measurement</text>

  
  <text x="800" y="872" font-family="sans-serif" font-size="26" font-style="italic" fill="#303a36" text-anchor="middle">Work forward from the inputs, never backward from the answer you want.</text>
</svg>