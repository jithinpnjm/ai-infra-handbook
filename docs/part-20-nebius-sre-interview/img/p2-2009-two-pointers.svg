<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Two pointers walk toward each other on sorted data</title>
  <desc>Visual explanation of the two-pointer technique on a sorted array showing pointer movement rules based on comparison with the target sum.</desc>

  <defs>
    
    <marker id="arrow-green-right" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 1,1 L 11,6 L 1,11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M 11,1 L 1,6 L 11,11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange-left" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M 11,1 L 1,6 L 11,11 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-green-up" markerWidth="12" markerHeight="12" refX="6" refY="2" orient="auto">
      <path d="M 1,11 L 6,1 L 11,11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Two pointers walk toward each other on sorted data</text>

  
  <rect x="70" y="160" width="670" height="570" rx="16" fill="#ffffff" stroke="#e8f1ea" stroke-width="3" />

  
  <rect x="130" y="210" width="550" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="405" y="270" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">a[i] + a[j] = target?</text>

  
  
  <rect x="130" y="380" width="100" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="180" y="442" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">a[0]</text>

  
  <rect x="242" y="380" width="100" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="292" y="442" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">a[1]</text>

  
  <rect x="355" y="380" width="100" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="405" y="442" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">a[2]</text>

  
  <rect x="467" y="380" width="100" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
  <text x="517" y="442" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">...</text>

  
  <rect x="580" y="380" width="100" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="630" y="442" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">a[n-1]</text>

  
  <path d="M 180,380 L 180,336 L 310,336 L 310,306" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 630,380 L 630,336 L 500,336 L 500,306" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6,4" />

  
  <path d="M 180,545 L 180,490" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-up)" />
  <rect x="145" y="555" width="70" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="180" y="597" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">i</text>
  
  <line x1="180" y1="645" x2="270" y2="645" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green-right)" />

  
  <path d="M 630,545 L 630,490" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-up)" />
  <rect x="595" y="555" width="70" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="630" y="597" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">j</text>
  
  <line x1="630" y1="645" x2="540" y2="645" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green-left)" />

  
  <rect x="780" y="160" width="750" height="570" rx="16" fill="#ffffff" stroke="#e8f1ea" stroke-width="3" />

  
  <rect x="815" y="210" width="680" height="135" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="4" />
  <text x="845" y="270" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">sum too big: move j left</text>
  
  <line x1="1350" y1="305" x2="900" y2="305" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange-left)" />

  
  <rect x="815" y="380" width="680" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="845" y="440" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">sum too small: move i right</text>
  
  <line x1="900" y1="475" x2="1350" y2="475" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green-right)" />

  
  <rect x="815" y="550" width="680" height="135" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <text x="845" y="615" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">sum equal: return (i, j)</text>
  
  <circle cx="1320" cy="615" r="22" fill="#207448" />
  <path d="M 1310,615 L 1317,623 L 1332,607" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  
  <rect x="70" y="790" width="1460" height="90" rx="14" fill="#207448" />
  <text x="800" y="847" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Sortedness tells you which pointer can never help again.</text>
</svg>