<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Fan-out makes the tail the common case</title>
  <desc>Bar chart showing the chance of at least one slow call escalating rapidly as fan-out N increases from 1 to 1000.</desc>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Fan-out makes the tail the common case</text>

  
  <g transform="translate(120, 115)">
    <rect width="1360" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="680" y="41" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">chance at least one slow = 1 - (1 - p) to the power N, with p = 0.01</text>
  </g>

  
  <g transform="translate(60, 205)">
    <rect width="960" height="690" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(870, 30)">
      <rect x="0" y="0" width="56" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="12" cy="8" r="2.5" fill="#207448"/>
      <rect x="0" y="20" width="56" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="12" cy="28" r="2.5" fill="#207448"/>
      <rect x="0" y="40" width="56" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="12" cy="48" r="2.5" fill="#207448"/>
    </g>

    
    <line x1="180" y1="145" x2="910" y2="145" stroke="#d5e3d8" stroke-width="2" stroke-dasharray="6 6"/>

    
    <line x1="180" y1="120" x2="180" y2="555" stroke="#303a36" stroke-width="3"/>
    <line x1="180" y1="555" x2="910" y2="555" stroke="#303a36" stroke-width="3"/>

    
    <text x="105" y="340" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" transform="rotate(-90 105 340)">Chance at least one call is slow</text>

    
    <rect x="235" y="550" width="115" height="5" rx="2" fill="#207448"/>
    <text x="292" y="534" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">1.0 percent</text>
    <text x="292" y="595" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">N = 1</text>

    
    <rect x="415" y="516" width="115" height="39" rx="3" fill="#207448"/>
    <text x="472" y="500" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">9.6 percent</text>
    <text x="472" y="595" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">N = 10</text>

    
    <rect x="595" y="295" width="115" height="260" rx="4" fill="#207448" stroke="#db8129" stroke-width="6"/>
    <text x="652" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">63.4 percent</text>
    <text x="652" y="595" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">N = 100</text>

    
    <rect x="775" y="145" width="115" height="410" rx="4" fill="#207448"/>
    <text x="832" y="128" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">about 99.996 percent</text>
    <text x="832" y="595" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">N = 1,000</text>

    
    <text x="545" y="650" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Fan-out N</text>
  </g>

  
  <g transform="translate(1050, 205)">
    <rect width="490" height="690" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(217, 45)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,12 28,28 42,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="245" y="170" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="245" dy="0">One request sends 100 calls</tspan>
      <tspan x="245" dy="38">and waits for all of them.</tspan>
      <tspan x="245" dy="58">The slowest call decides</tspan>
      <tspan x="245" dy="38">the wait.</tspan>
    </text>

    
    <g transform="translate(45, 360)">
      
      <rect x="175" y="0" width="50" height="32" rx="6" fill="#207448"/>
      
      
      <path d="M 200,32 L 60,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 95,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 130,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 165,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 200,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 235,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 270,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 305,150" stroke="#207448" stroke-width="2" fill="none"/>
      <path d="M 200,32 L 340,240" stroke="#207448" stroke-width="3" fill="none"/>

      
      <circle cx="60" cy="150" r="7" fill="#207448"/>
      <circle cx="95" cy="150" r="7" fill="#207448"/>
      <circle cx="130" cy="150" r="7" fill="#207448"/>
      <circle cx="165" cy="150" r="7" fill="#207448"/>
      <circle cx="200" cy="150" r="7" fill="#207448"/>
      <circle cx="235" cy="150" r="7" fill="#207448"/>
      <circle cx="270" cy="150" r="7" fill="#207448"/>
      <circle cx="305" cy="150" r="7" fill="#207448"/>

      
      <line x1="45" y1="165" x2="320" y2="165" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>

      
      <circle cx="340" cy="240" r="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="45" y1="255" x2="355" y2="255" stroke="#207448" stroke-width="2"/>
    </g>
  </g>

  
  <g transform="translate(60, 920)">
    <rect width="1480" height="74" rx="12" fill="#207448"/>
    <text x="740" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A healthy p99 on one backend does not describe the tail the request waits through.</text>
  </g>
</svg>