<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Token limiter: reserve up front, refund after</title>
  <desc>Visual explanation of token limiting with up-front reservation and post-execution refund.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">Token limiter: reserve up front, refund after</text>

  
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1480" height="54" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="740" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      Timeline for one request against a bucket of 100,000 tokens per minute per tenant per model (assumed)
    </text>
  </g>

  
  
  <g transform="translate(60, 180)">
    <rect x="0" y="0" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="46" r="24" fill="#207448" />
    <text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 100 46 L 128 32 L 156 46 C 156 64 128 78 128 78 C 128 78 100 64 100 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

    
    <text x="24" y="112" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">admission: output length unknown,</tspan>
      <tspan x="24" dy="34">so reserve prompt 800 +</tspan>
      <tspan x="24" dy="34">max_tokens 1,024 = 1,824 tokens</tspan>
    </text>
  </g>

  
  <path d="M 505 295 L 570 295" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(580, 180)">
    <rect x="0" y="0" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="46" r="24" fill="#207448" />
    <text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(128, 46)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 0 -22 L 0 -14 M 0 14 L 0 22 M -22 0 L -14 0 M 14 0 L 22 0 M -15 -15 L -10 -10 M 10 10 L 15 15 M -15 15 L -10 10 M 10 -10 L 15 -15" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="24" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">request runs;</tspan>
      <tspan x="24" dy="36">actual use is 1,100</tspan>
    </text>
  </g>

  
  <path d="M 1025 295 L 1090 295" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(1100, 180)">
    <rect x="0" y="0" width="440" height="230" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="50" cy="46" r="24" fill="#db8129" />
    <text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(128, 46)">
      <path d="M 16 10 A 16 16 0 1 0 -6 -12" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <path d="M -16 -12 L -6 -12 L -6 -2" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="24" y="130" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="24" dy="0">refund</tspan>
      <tspan x="24" dy="36">1,824 - 1,100 = 724 tokens</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="1480" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="1420" height="70" rx="10" fill="#ffffff" stroke="#b2c9b6" stroke-width="1.5" />
      <text x="30" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
        requests per full bucket if reserved and never refunded: 100,000 / 1,824 = 54
      </text>
    </g>

    
    <g transform="translate(30, 108)">
      <rect x="0" y="0" width="1420" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="30" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        with refund, actual use 1,100: 100,000 / 1,100 = 90
      </text>
    </g>

    
    <g transform="translate(30, 192)">
      <rect x="0" y="0" width="1420" height="74" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <text x="30" y="46" font-family="sans-serif" font-size="24" fill="#303a36">
        without the refund the tenant gets 54 requests where the limit should allow 90
      </text>
    </g>
  </g>

  
  
  <g transform="translate(60, 760)">
    <rect x="0" y="0" width="460" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="54" cy="54" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 54 38 L 54 54 L 66 60" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    <text x="24" y="128" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">refill rate</tspan>
      <tspan x="24" dy="36">100,000 / 60 =</tspan>
      <tspan x="24" dy="36">1,667 tokens per second</tspan>
    </text>
  </g>

  
  <g transform="translate(570, 760)">
    <rect x="0" y="0" width="460" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <ellipse cx="54" cy="40" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 32 40 L 32 66 C 32 72 42 76 54 76 C 66 76 76 72 76 66 L 76 40" fill="none" stroke="#207448" stroke-width="4" />

    <text x="24" y="128" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">state:</tspan>
      <tspan x="24" dy="36">5,000 tenants x 50 models</tspan>
      <tspan x="24" dy="36">x 64 B = 16 MB</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 760)">
    <rect x="0" y="0" width="460" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="36" y="36" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="44" y1="28" x2="44" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="64" y1="28" x2="64" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="44" y1="72" x2="44" y2="80" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="64" y1="72" x2="64" y2="80" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    <text x="24" y="128" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">store operations:</tspan>
      <tspan x="24" dy="36">2 x 2,000 requests per second</tspan>
      <tspan x="24" dy="36">= 4,000 per second</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 1030)">
    <rect x="0" y="0" width="1480" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <text x="36" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0">central store against local buckets with leases of 5,000 tokens per gateway;</tspan>
      <tspan x="36" dy="44">error bounded by lease size times gateway count;</tspan>
      <tspan x="36" dy="44">store down: fail open with a local safety limit, stated as a choice</tspan>
    </text>
  </g>
</svg>