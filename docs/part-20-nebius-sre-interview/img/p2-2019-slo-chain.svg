<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>From user outcome to SLI to SLO to error budget</title>
  <desc>Infographic explaining the progression from user outcome to SLI, SLO, error budget, and burn rate.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">From user outcome to SLI to SLO to error budget</text>

  
  <line x1="320" y1="280" x2="360" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="620" y1="280" x2="660" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="920" y1="280" x2="960" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1240" y1="280" x2="1280" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="box-1">
    <rect x="40" y="130" width="280" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="76" cy="166" r="24" fill="#207448" />
    <text x="76" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <circle cx="180" cy="166" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 158 206 C 158 190 168 186 180 186 C 192 186 202 190 202 206" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="180" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">User outcome:</text>
    
    <text x="180" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="180" dy="0">did the request</tspan>
      <tspan x="180" dy="36">succeed fast</tspan>
      <tspan x="180" dy="36">enough?</tspan>
    </text>
  </g>

  
  <g id="box-2">
    <rect x="360" y="130" width="260" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="396" cy="166" r="24" fill="#207448" />
    <text x="396" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <line x1="476" y1="206" x2="504" y2="162" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="478" cy="172" r="5" fill="#207448" />
    <circle cx="502" cy="196" r="5" fill="#207448" />
    
    <text x="490" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">SLI:</text>
    
    <text x="490" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="490" dy="0">good events</tspan>
      <tspan x="490" dy="36">divided by</tspan>
      <tspan x="490" dy="36">all events</tspan>
    </text>
  </g>

  
  <g id="box-3">
    <rect x="660" y="130" width="260" height="300" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="696" cy="166" r="24" fill="#207448" />
    <text x="696" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <circle cx="790" cy="184" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="790" cy="184" r="12" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="790" cy="184" r="4" fill="#207448" />
    
    <text x="790" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">SLO:</text>
    
    <text x="790" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="790" dy="0">the target, for</tspan>
      <tspan x="790" dy="36">example</tspan>
      <tspan x="790" dy="36">99.9 percent</tspan>
    </text>
  </g>

  
  <g id="box-4">
    <rect x="960" y="130" width="280" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="996" cy="166" r="24" fill="#207448" />
    <text x="996" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <rect x="1076" y="165" width="48" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1084 165 L 1084 157 C 1084 153 1087 151 1091 151 L 1109 151 C 1113 151 1116 153 1116 157 L 1116 165" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1106 177 L 1124 177 C 1127 177 1128 179 1128 183 C 1128 187 1127 189 1124 189 L 1106 189 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1120" cy="183" r="2.5" fill="#207448" />
    
    <text x="1100" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Error budget:</text>
    
    <text x="1100" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">100 percent</tspan>
      <tspan x="1100" dy="36">minus the SLO</tspan>
    </text>
  </g>

  
  <g id="burn-rate-gauge">
    <rect x="1280" y="130" width="280" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 1380 205 A 40 40 0 0 1 1460 205" fill="none" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    
    <line x1="1380" y1="205" x2="1388" y2="205" stroke="#207448" stroke-width="3" />
    <line x1="1420" y1="165" x2="1420" y2="173" stroke="#207448" stroke-width="3" />
    <line x1="1460" y1="205" x2="1452" y2="205" stroke="#207448" stroke-width="3" />
    
    <line x1="1420" y1="205" x2="1445" y2="180" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1420" cy="205" r="7" fill="#207448" />
    
    <text x="1420" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Burn rate:</text>
    
    <text x="1420" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1420" dy="0">how fast the</tspan>
      <tspan x="1420" dy="36">budget is spent</tspan>
    </text>
  </g>

  
  <g id="note-below-box-2">
    <path d="M 320 490 L 480 490 L 490 475 L 500 490 L 660 490 A 16 16 0 0 1 676 506 L 676 674 A 16 16 0 0 1 660 690 L 320 690 A 16 16 0 0 1 304 674 L 304 506 A 16 16 0 0 1 320 490 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    <text x="490" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="490" dy="0">Count the outcome</tspan>
      <tspan x="490" dy="40">the customer sees,</tspan>
      <tspan x="490" dy="40">not each attempt</tspan>
    </text>
  </g>

  
  <g id="note-below-box-4">
    <path d="M 930 490 L 1090 490 L 1100 475 L 1110 490 L 1270 490 A 16 16 0 0 1 1286 506 L 1286 674 A 16 16 0 0 1 1270 690 L 930 690 A 16 16 0 0 1 914 674 L 914 506 A 16 16 0 0 1 930 490 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    <text x="1100" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">Latency is three</tspan>
      <tspan x="1100" dy="38">numbers, and</tspan>
      <tspan x="1100" dy="38">end-to-end</tspan>
      <tspan x="1100" dy="38">depends on length</tspan>
    </text>
  </g>

  
  <g id="caption-takeaway">
    <rect x="40" y="750" width="1520" height="80" rx="16" fill="#207448" />
    <text x="800" y="800" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A token API breaks the usual SLI recipe, so define good events per request outcome.</text>
  </g>
</svg>