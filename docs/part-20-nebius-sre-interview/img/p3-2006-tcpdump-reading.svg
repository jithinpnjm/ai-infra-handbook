<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading a tcpdump line and the four signals to look for</title>
  <desc>Visual breakdown of a tcpdump packet line, TCP flags legend, four primary diagnostic signals, retransmission types, capture safety rules, and operational takeaway.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading a tcpdump line and the four signals to look for</text>

  
  <rect x="40" y="80" width="1520" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <text x="75" y="130" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">01:20:46.769073 IP 10.2.203.2.22 &gt; 10.2.0.2.33771: Flags [P.], seq 1:193, ack 5, win 132, length 192</text>

  
  
  <path d="M 80,144 L 80,152 L 286,152 L 286,144 M 183,152 L 183,172" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="135" y="172" width="96" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="183" y="196" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">time</text>

  
  <path d="M 800,144 L 800,152 L 948,152 L 948,144 M 874,152 L 874,172" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="822" y="172" width="104" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="874" y="196" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">flags</text>

  
  <path d="M 1130,144 L 1130,152 L 1208,152 L 1208,144 M 1169,152 L 1169,172" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="1055" y="172" width="228" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1169" y="196" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">acknowledgement</text>

  
  <path d="M 1360,144 L 1360,152 L 1496,152 L 1496,144 M 1428,152 L 1428,172" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="1370" y="172" width="116" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1428" y="196" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">length</text>

  
  
  <path d="M 310,144 L 310,156 L 775,156 L 775,144 M 542,156 L 542,238" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="322" y="238" width="440" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="542" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">source and destination with ports</text>

  
  <path d="M 972,144 L 972,156 L 1108,156 L 1108,144 M 1040,156 L 1040,238" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="925" y="238" width="230" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1040" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">sequence range</text>

  
  <path d="M 1232,144 L 1232,156 L 1338,156 L 1338,144 M 1284,156 L 1284,238" fill="none" stroke="#207448" stroke-width="2"/>
  <rect x="1224" y="238" width="120" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1284" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">window</text>

  
  <g transform="translate(0, 312)">
    
    <rect x="40" y="0" width="160" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="120" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">S = SYN</text>

    
    <rect x="220" y="0" width="200" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">S. = SYN-ACK</text>

    
    <rect x="440" y="0" width="460" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="670" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">P. = push with data and an ack</text>

    
    <rect x="920" y="0" width="190" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1015" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">. = pure ack</text>

    
    <rect x="1130" y="0" width="160" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1210" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">F = FIN</text>

    
    <rect x="1310" y="0" width="250" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1435" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">R = reset</text>
  </g>

  
  
  <g transform="translate(40, 385)">
    <rect width="940" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(25, 47)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="44" height="56" rx="4"/>
      <line x1="8" y1="16" x2="36" y2="16"/>
      <line x1="8" y1="28" x2="36" y2="28"/>
      <line x1="8" y1="40" x2="36" y2="40"/>
      <path d="M 52,18 L 52,42 M 45,35 L 52,42 L 59,35"/>
    </g>
    <text x="105" y="65" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0" font-weight="bold">SYN repeated, no SYN-ACK:</tspan>
      <tspan x="105" dy="38">packet or answer dropped, or queue full</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 555)">
    <rect width="940" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(25, 47)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 12,28 A 18,18 0 1,1 36,46"/>
      <polyline points="28,46 36,46 36,38"/>
      <rect x="42" y="8" width="16" height="22" rx="2"/>
      <rect x="42" y="32" width="16" height="22" rx="2"/>
    </g>
    <text x="105" y="65" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0" font-weight="bold">Same sequence range sent twice:</tspan>
      <tspan x="105" dy="38">a retransmit</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 725)">
    <rect width="940" height="150" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(25, 47)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 8,16 L 24,16 A 12,12 0 0,1 36,28 L 36,30"/>
      <path d="M 48,40 L 48,42 A 12,12 0 0,1 36,54 L 20,54"/>
      <line x1="20" y1="46" x2="42" y2="24"/>
      <line x1="24" y1="24" x2="38" y2="46"/>
    </g>
    <text x="105" y="65" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0" font-weight="bold">An R flag arrives:</tspan>
      <tspan x="105" dy="38">someone destroyed the connection</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 895)">
    <rect width="940" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(25, 47)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="30" y1="6" x2="30" y2="22"/>
      <line x1="30" y1="36" x2="30" y2="52"/>
      <rect x="4" y="8" width="18" height="24" rx="2"/>
      <line x1="6" y1="12" x2="20" y2="28"/>
      <line x1="20" y1="12" x2="6" y2="28"/>
      <rect x="42" y="24" width="16" height="10" rx="2"/>
    </g>
    <text x="105" y="65" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="105" dy="0" font-weight="bold">Full size data sent but never acked</tspan>
      <tspan x="105" dy="38">while small ones pass: MTU</tspan>
    </text>
  </g>

  
  <g transform="translate(1010, 385)">
    <rect width="550" height="385" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(25, 20)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="16"/>
      <polyline points="20,10 20,20 28,24"/>
    </g>
    <text x="75" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Two retransmit kinds</text>

    
    <rect x="20" y="70" width="510" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="104" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="35" dy="0" font-weight="bold">Timer-based:</tspan><tspan font-weight="normal"> waits for the retransmit</tspan>
      <tspan x="35" dy="34">timeout, at least 200 ms on Linux for</tspan>
      <tspan x="35" dy="34">the first, doubling on later ones</tspan>
    </text>

    
    <rect x="20" y="235" width="510" height="130" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="275" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="35" dy="0" font-weight="bold">Fast retransmit:</tspan><tspan font-weight="normal"> after duplicate</tspan>
      <tspan x="35" dy="34">acknowledgements, no timer</tspan>
    </text>
  </g>

  
  <g transform="translate(1010, 790)">
    <rect width="550" height="255" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(25, 20)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 20,6 L 36,12 L 36,26 C 36,36 20,44 20,44 C 20,44 4,36 4,26 L 4,12 Z"/>
      <polyline points="12,24 18,30 28,18"/>
    </g>

    
    <text x="35" y="85" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="35" dy="0">tcpdump -i eth4</tspan>
      <tspan x="35" dy="32">-w /tmp/out.tcpdump,</tspan>
      <tspan x="35" dy="32">read with tcpdump -nr,</tspan>
      <tspan x="35" dy="32">filter on host and port,</tspan>
      <tspan x="35" dy="32">short fixed time</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1080)">
    <rect width="1520" height="80" rx="14" fill="#207448"/>
    <text x="760" y="50" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Name what was seen, what it means, and what evidence supports it.</text>
  </g>
</svg>