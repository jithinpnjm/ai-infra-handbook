<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Percentile sketches: exact, reservoir sample and fixed buckets</title>
  <desc>Visual comparison of three percentile estimation approaches: exact nearest rank, reservoir sampling, and fixed-bucket histograms, including measured error on 200,000 lognormal samples.</desc>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 44px; font-weight: bold; fill: #303a36; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #303a36; line-height: 1.45; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; fill: #303a36; }
      .mono-bold { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 26px; font-weight: bold; fill: #207448; }
      .table-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: bold; fill: #207448; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #db8129; }
      .footnote-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; fill: #4a5752; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="80" y="70" class="title">Percentile sketches: exact, reservoir sample and fixed buckets</text>

  
  <g id="column-1">
    <rect x="50" y="110" width="470" height="580" rx="16" fill="#e8f1ea" stroke="#c4d8c8" stroke-width="2"/>
    
    
    <g transform="translate(80, 140)">
      <ellipse cx="28" cy="14" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 2 14 V 46 C 2 54 54 54 54 46 V 14" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 2 30 C 2 38 54 38 54 30" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    
    <text x="150" y="178" class="col-header">Exact: nearest rank</text>

    
    <rect x="76" y="230" width="418" height="230" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    <text class="body-text">
      <tspan x="98" y="275" class="code-text" font-weight="bold">rank = ceil(p / 100 x N),</tspan>
      <tspan x="98" y="315">the smallest value with</tspan>
      <tspan x="98" y="355">at least p percent at</tspan>
      <tspan x="98" y="395">or below it</tspan>
    </text>

    
    <rect x="76" y="490" width="418" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="114" cy="565" r="16" fill="#207448"/>
    <path d="M 108 565 L 113 570 L 121 559" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="144" y="573" class="col-header" font-size="28">needs every sample</text>
  </g>

  
  <g id="column-2">
    <rect x="565" y="110" width="470" height="580" rx="16" fill="#e8f1ea" stroke="#c4d8c8" stroke-width="2"/>

    
    <g transform="translate(595, 140)">
      <rect x="2" y="8" width="52" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="19" y1="8" x2="19" y2="48" stroke="#207448" stroke-width="4"/>
      <line x1="36" y1="8" x2="36" y2="48" stroke="#207448" stroke-width="4"/>
    </g>

    <text x="665" y="165" class="col-header" font-size="28">Reservoir sample</text>
    <text x="665" y="198" class="code-text" fill="#207448" font-weight="bold">(Algorithm R)</text>

    
    <rect x="591" y="230" width="418" height="130" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    
    
    <path d="M 615 275 L 705 275" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="620" y="255" class="code-text" font-size="20">stream</text>

    
    <g transform="translate(720, 248)">
      <rect x="0" y="0" width="265" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <line x1="53" y1="0" x2="53" y2="52" stroke="#207448" stroke-width="2"/>
      <line x1="106" y1="0" x2="106" y2="52" stroke="#207448" stroke-width="2"/>
      <line x1="159" y1="0" x2="159" y2="52" stroke="#207448" stroke-width="2"/>
      <line x1="212" y1="0" x2="212" y2="52" stroke="#207448" stroke-width="2"/>
      <text x="26" y="34" text-anchor="middle" class="code-text">1</text>
      <text x="80" y="34" text-anchor="middle" class="code-text">2</text>
      <text x="133" y="34" text-anchor="middle" class="code-text">·</text>
      <text x="185" y="34" text-anchor="middle" class="code-text">·</text>
      <text x="238" y="34" text-anchor="middle" class="code-text" font-weight="bold">k</text>
    </g>
    <text x="852" y="335" text-anchor="middle" class="body-text" font-size="22" fill="#4a5752">k slots</text>

    
    <rect x="591" y="375" width="418" height="145" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    <text class="body-text">
      <tspan x="611" y="413">after the first k, item number</tspan>
      <tspan x="611" y="449">n replaces a random slot with</tspan>
      <tspan x="611" y="485">probability k over n</tspan>
    </text>

    
    <rect x="591" y="535" width="418" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text class="body-text">
      <tspan x="611" y="573">every item seen so far has the</tspan>
      <tspan x="611" y="609">same chance of being in the</tspan>
      <tspan x="611" y="645">sample</tspan>
    </text>
  </g>

  
  <g id="column-3">
    <rect x="1080" y="110" width="470" height="580" rx="16" fill="#e8f1ea" stroke="#c4d8c8" stroke-width="2"/>

    
    <g transform="translate(1105, 140)">
      <rect x="2" y="30" width="10" height="20" fill="#207448"/>
      <rect x="16" y="20" width="10" height="30" fill="#207448"/>
      <rect x="30" y="10" width="10" height="40" fill="#207448"/>
      <rect x="44" y="24" width="10" height="26" fill="#207448"/>
    </g>

    <text x="1175" y="165" class="col-header" font-size="26">Fixed-bucket histogram</text>
    <text x="1175" y="198" class="code-text" fill="#207448" font-weight="bold">(like Prometheus)</text>

    
    <rect x="1106" y="230" width="418" height="160" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    
    
    <g transform="translate(1126, 250)">
      <rect x="10" y="65" width="36" height="35" rx="3" fill="#c4d8c8"/>
      <rect x="56" y="48" width="48" height="52" rx="3" fill="#a4c6ab"/>
      <rect x="114" y="28" width="62" height="72" rx="3" fill="#6ba57e"/>
      <rect x="186" y="10" width="80" height="90" rx="3" fill="#207448"/>
      <rect x="276" y="38" width="98" height="62" rx="3" fill="#a4c6ab"/>

      
      <line x1="0" y1="102" x2="380" y2="102" stroke="#303a36" stroke-width="2"/>

      
      <path d="M 114 125 L 266 125" stroke="#207448" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="190" y="146" text-anchor="middle" class="code-text" font-size="20" font-weight="bold" fill="#207448">bucket ratio</text>
    </g>

    
    <rect x="1106" y="410" width="418" height="255" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    <text class="body-text">
      <tspan x="1126" y="448">memory depends on the number</tspan>
      <tspan x="1126" y="484">of buckets, not on traffic;</tspan>
      <tspan x="1126" y="520">histograms from many servers</tspan>
    </text>

    
    <rect x="1126" y="542" width="378" height="96" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="4"/>
    <text x="1315" y="602" text-anchor="middle" class="pill-text" font-size="28">add bucket by bucket</text>
  </g>

  
  <g id="bottom-table">
    <rect x="50" y="730" width="1500" height="380" rx="16" fill="#e8f1ea" stroke="#c4d8c8" stroke-width="2"/>

    <text x="80" y="776" class="table-title">Measured table on 200,000 lognormal samples:</text>

    
    <rect x="80" y="810" width="400" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="120" cy="885" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="120" y="893" text-anchor="middle" class="code-text" font-weight="bold" fill="#207448">P</text>
    <text class="body-text">
      <tspan x="165" y="870" class="mono-bold">exact p99 = 551.79</tspan>
      <tspan x="165" y="906" font-size="22" fill="#4a5752">ground truth baseline</tspan>
    </text>

    
    <rect x="535" y="810" width="455" height="150" rx="12" fill="#ffffff" stroke="#b6d1bc" stroke-width="2"/>
    <text class="code-text">
      <tspan x="565" y="868" font-weight="bold">ratio 1.1, 123 buckets:</tspan>
      <tspan x="565" y="912" font-size="34" font-weight="bold" fill="#db8129">593.35</tspan>
      <tspan x="705" y="910" font-size="22" fill="#4a5752">(+7.5% error)</tspan>
    </text>

    
    <rect x="1045" y="810" width="475" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text class="code-text">
      <tspan x="1075" y="868" font-weight="bold">ratio 1.02, 584 buckets:</tspan>
      <tspan x="1075" y="912" font-size="34" font-weight="bold" fill="#207448">553.93</tspan>
      <tspan x="1215" y="910" font-size="22" fill="#4a5752">(+0.39% error)</tspan>
    </text>

    
    <g transform="translate(80, 990)">
      
      <line x1="455" y1="40" x2="1440" y2="40" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
      
      
      <rect x="620" y="14" width="670" height="52" rx="26" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
      <text x="955" y="49" text-anchor="middle" class="pill-text" font-size="25">finer buckets, smaller error, more memory</text>
    </g>
  </g>

  
  <g id="footnote">
    <rect x="50" y="1135" width="1500" height="90" rx="10" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <text class="footnote-text">
      <tspan x="75" y="1170" font-weight="bold" fill="#207448">Prometheus:</tspan>
      <tspan dx="10">histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))</tspan>
      <tspan x="75" y="1202" fill="#303a36">works only while bucket boundaries match across instances.</tspan>
    </text>
  </g>
</svg>