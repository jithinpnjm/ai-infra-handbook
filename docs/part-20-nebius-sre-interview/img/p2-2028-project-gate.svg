<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pick one project with five honest yeses out of six tests</title>
  <desc>Flowchart guiding project selection based on six tests, dossier preparation, and rehearsal.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="60" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="60" dy="0">Pick one project with five honest yeses</tspan>
    <tspan x="60" dy="56">out of six tests</tspan>
  </text>

  
  <g>
    <rect x="270" y="150" width="460" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="295" y="167" width="36" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="305" y1="180" x2="323" y2="180" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="305" y1="192" x2="323" y2="192" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="305" y1="204" x2="317" y2="204" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="355" y="200" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">List 3 candidate projects</text>
  </g>

  
  <line x1="500" y1="230" x2="500" y2="260" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g>
    <rect x="270" y="260" width="410" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="295" y="285" width="44" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="303" y="295" width="8" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="317" y1="299" x2="331" y2="299" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <rect x="303" y="312" width="8" height="8" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="317" y1="316" x2="331" y2="316" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="360" y="320">Score 6 tests,</tspan>
      <tspan x="360" y="360">yes or no for each</tspan>
    </text>
  </g>

  
  <g>
    
    <line x1="680" y1="330" x2="710" y2="330" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />

    
    <rect x="710" y="260" width="400" height="40" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="725" y="288" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Made or shaped the key decisions</text>

    
    <rect x="710" y="310" width="400" height="40" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="725" y="338" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Ran in production</text>

    
    <g>
      <rect x="710" y="360" width="90" height="38" rx="6" fill="#edf0ed" stroke="#bcc7c1" stroke-width="1.5" />
      <rect x="725" y="376" width="60" height="6" rx="3" fill="#bcc7c1" />

      <rect x="813" y="360" width="90" height="38" rx="6" fill="#edf0ed" stroke="#bcc7c1" stroke-width="1.5" />
      <rect x="828" y="376" width="60" height="6" rx="3" fill="#bcc7c1" />

      <rect x="916" y="360" width="90" height="38" rx="6" fill="#edf0ed" stroke="#bcc7c1" stroke-width="1.5" />
      <rect x="931" y="376" width="60" height="6" rx="3" fill="#bcc7c1" />

      <rect x="1020" y="360" width="90" height="38" rx="6" fill="#edf0ed" stroke="#bcc7c1" stroke-width="1.5" />
      <rect x="1035" y="376" width="60" height="6" rx="3" fill="#bcc7c1" />
    </g>
  </g>

  
  <line x1="500" y1="400" x2="500" y2="460" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g>
    <polygon points="500,460 670,530 500,600 330,530" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <text x="500" y="538" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Five or more yes?</text>
  </g>

  
  <path d="M 330 530 L 175 530 L 175 570" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="240" y="515" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No</text>

  
  <g>
    <rect x="60" y="570" width="230" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 80 598 L 90 590 L 110 590 L 120 598 L 120 622 L 80 622 Z" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="94" y1="606" x2="106" y2="606" stroke="#207448" stroke-width="2.5" />
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="175" y="625">Drop it, or keep</tspan>
      <tspan x="175" y="660">as a second story</tspan>
    </text>
  </g>

  
  <line x1="500" y1="600" x2="500" y2="660" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="525" y="635" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <g>
    <rect x="350" y="660" width="300" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 370 686 L 382 686 L 388 692 L 406 692 L 406 714 L 370 714 Z" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="378" y1="700" x2="398" y2="700" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="430" y="710" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Fill the dossier</text>
  </g>

  
  <line x1="500" y1="740" x2="500" y2="790" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g>
    <polygon points="500,790 640,850 500,910 360,850" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="500" y="858" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Checker clean?</text>
  </g>

  
  <path d="M 640 850 L 700 850 L 700 700 L 650 700" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="715" y="780" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No</text>

  
  <line x1="500" y1="910" x2="500" y2="960" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="525" y="940" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <g>
    <rect x="220" y="960" width="560" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="269" cy="1008" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="269" y1="990" x2="269" y2="983" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="269" y1="1008" x2="269" y2="998" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="269" y1="1008" x2="279" y2="1008" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="315" y="1000">Rehearse at 2 minutes,</tspan>
      <tspan x="315" y="1038">10 minutes and 90 minutes</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1150" y="260" width="390" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1204" cy="314" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1204 298 L 1208 310 L 1220 314 L 1208 318 L 1204 330 L 1200 318 L 1188 314 L 1200 310 Z" fill="#207448" />
    <text font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1180" y="380">Choose the project where</tspan>
      <tspan x="1180" y="422">you know the numbers</tspan>
      <tspan x="1180" y="464">and the mistakes, not</tspan>
      <tspan x="1180" y="506">the one that sounds</tspan>
      <tspan x="1180" y="548">biggest.</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="1100" width="1480" height="65" rx="12" fill="#207448" />
    <text x="800" y="1141" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Breadth is punished in a deep dive: prepare one project deeply.</text>
  </g>
</svg>