<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Pick one project with five honest yeses out of six tests</title>
  <desc>Flowchart detailing how to select and prepare a candidate project for technical deep dives using rigorous gating tests.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-muted" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#708077" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#143621" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Pick one project with five honest yeses out of six tests</text>

  

  
  
  <g transform="translate(260, 120)" filter="url(#shadow)">
    <rect width="560" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="100" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">List 3 candidate projects</text>
  </g>

  
  <path d="M 540 210 L 540 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(80, 270)" filter="url(#shadow)">
    
    <rect width="920" height="230" rx="16" fill="#e8f1ea" stroke="#c0d7c5" stroke-width="2" />
    
    
    <rect x="20" y="25" width="400" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="65" cy="65" r="24" fill="#207448" />
    <text x="65" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="108" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Score 6 tests,</text>
    <text x="40" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">yes or no for each</text>

    
    
    <g transform="translate(440, 25)">
      <rect width="455" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="24" cy="23" r="10" fill="#207448" />
      <text x="48" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Made or shaped the key decisions</text>
    </g>

    
    <g transform="translate(440, 82)">
      <rect width="455" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="24" cy="23" r="10" fill="#207448" />
      <text x="48" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Ran in production</text>
    </g>

    
    <g transform="translate(440, 138)">
      <rect width="215" height="32" rx="6" fill="#dde4df" stroke="#b0beba" stroke-width="2" />
      <rect x="20" y="12" width="130" height="8" rx="4" fill="#8f9d98" />
    </g>
    <g transform="translate(680, 138)">
      <rect width="215" height="32" rx="6" fill="#dde4df" stroke="#b0beba" stroke-width="2" />
      <rect x="20" y="12" width="140" height="8" rx="4" fill="#8f9d98" />
    </g>
    <g transform="translate(440, 178)">
      <rect width="215" height="32" rx="6" fill="#dde4df" stroke="#b0beba" stroke-width="2" />
      <rect x="20" y="12" width="110" height="8" rx="4" fill="#8f9d98" />
    </g>
    <g transform="translate(680, 178)">
      <rect width="215" height="32" rx="6" fill="#dde4df" stroke="#b0beba" stroke-width="2" />
      <rect x="20" y="12" width="125" height="8" rx="4" fill="#8f9d98" />
    </g>
  </g>

  
  <path d="M 540 500 L 540 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <g transform="translate(540, 650)">
    
    <path d="M 0 -80 L 190 0 L 0 80 L -190 0 Z" fill="#ffffff" stroke="#db8129" stroke-width="5" filter="url(#shadow)" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Five or more yes?</text>
  </g>

  
  <path d="M 350 650 L 220 650 L 220 740" fill="none" stroke="#708077" stroke-width="3" marker-end="url(#arrow-muted)" />
  
  <g transform="translate(245, 634)">
    <rect width="64" height="32" rx="8" fill="#e8f1ea" stroke="#708077" stroke-width="2" />
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#708077" text-anchor="middle">No</text>
  </g>

  
  <g transform="translate(40, 740)" filter="url(#shadow)">
    <rect width="360" height="110" rx="14" fill="#ffffff" stroke="#708077" stroke-dasharray="6 6" stroke-width="3" />
    <text x="180" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#586762" text-anchor="middle">Drop it, or keep</text>
    <text x="180" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#586762" text-anchor="middle">as a second story</text>
  </g>

  
  <path d="M 540 730 L 540 820" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <g transform="translate(508, 755)">
    <rect width="64" height="32" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>
  </g>

  
  <g transform="translate(370, 820)" filter="url(#shadow)">
    <rect width="340" height="84" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="45" cy="42" r="22" fill="#207448" />
    <text x="45" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="85" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Fill the dossier</text>
  </g>

  
  <path d="M 540 904 L 540 950" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(540, 1020)">
    <path d="M 0 -65 L 170 0 L 0 65 L -170 0 Z" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Checker clean?</text>
  </g>

  
  <path d="M 710 1020 L 780 1020 L 780 862 L 720 862" fill="none" stroke="#708077" stroke-width="3" marker-end="url(#arrow-muted)" />
  
  <g transform="translate(748, 930)">
    <rect width="64" height="32" rx="8" fill="#e8f1ea" stroke="#708077" stroke-width="2" />
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#708077" text-anchor="middle">No</text>
  </g>

  
  <path d="M 540 1085 L 540 1130" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <g transform="translate(508, 1088)">
    <rect width="64" height="32" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>
  </g>

  
  <g transform="translate(190, 1130)" filter="url(#shadow)">
    <rect width="700" height="84" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="45" cy="42" r="22" fill="#207448" />
    <text x="45" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="82" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Rehearse at 2 minutes, 10 minutes and 90 minutes</text>
  </g>

  
  <g transform="translate(1050, 270)" filter="url(#shadow)">
    <rect width="470" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="55" r="20" fill="#207448" />
    
    <path d="M 50 42 L 53 51 L 62 55 L 53 59 L 50 68 L 47 59 L 38 55 L 47 51 Z" fill="#ffffff" />
    
    <text x="85" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Selection Rule</text>
    <line x1="30" y1="95" x2="440" y2="95" stroke="#c0d7c5" stroke-width="2" />

    
    <text x="35" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" line-height="1.4">
      <tspan x="35" dy="0">Choose the project</tspan>
      <tspan x="35" dy="44">where you know the</tspan>
      <tspan x="35" dy="44">numbers and the mistakes,</tspan>
      <tspan x="35" dy="44">not the one that sounds</tspan>
      <tspan x="35" dy="44">biggest.</tspan>
    </text>
  </g>

  
  <g transform="translate(80, 1245)">
    <rect width="1440" height="65" rx="12" fill="#207448" />
    <text x="720" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Breadth is punished in a deep dive: prepare one project deeply.</text>
  </g>
</svg>