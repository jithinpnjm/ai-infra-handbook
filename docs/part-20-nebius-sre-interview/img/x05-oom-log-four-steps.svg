<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010">
  <title>Reading an OOM log in four steps</title>
  <desc>Visual guide to reading a Linux OOM log in four steps: constraint scope, cgroup path, anon-rss usage, and tasks state table.</desc>

  
  <rect width="1600" height="1010" fill="#f5f8f5" />

  
  <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading an OOM log in four steps</text>

  
  <rect x="50" y="120" width="1160" height="144" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  <circle cx="95" cy="192" r="24" fill="#207448" />
  <text x="95" y="192" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <circle cx="170" cy="186" r="16" stroke="#207448" stroke-width="4" fill="none" />
  <line x1="182" y1="198" x2="196" y2="212" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="230" y="180">oom-kill:constraint=</tspan>
    <tspan x="230" y="214">CONSTRAINT_MEMCG</tspan>
  </text>
  
  <text font-size="24" fill="#303a36">
    <tspan x="640" y="166" font-family="system-ui, -apple-system, sans-serif">Scope: a cgroup limit, not the node.</tspan>
    <tspan x="640" y="198"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">CONSTRAINT_NONE</tspan><tspan font-family="system-ui, -apple-system, sans-serif"> with global_oom</tspan></tspan>
    <tspan x="640" y="230" font-family="system-ui, -apple-system, sans-serif">would mean the node.</tspan>
  </text>

  
  <rect x="50" y="282" width="1160" height="144" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="354" r="24" fill="#207448" />
  <text x="95" y="354" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <path d="M 152,344 L 168,344 L 175,350 L 196,350 A 3 3 0 0 1 199,353 L 199,372 A 3 3 0 0 1 196,375 L 152,375 A 3 3 0 0 1 149,372 L 149,347 A 3 3 0 0 1 152,344 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round" />
  
  <text x="230" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">oom_memcg=PATH</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="640" y="342">Which cgroup. The path maps to</tspan>
    <tspan x="640" y="376">a pod through its container.</tspan>
  </text>

  
  <rect x="50" y="444" width="1160" height="144" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="516" r="24" fill="#207448" />
  <text x="95" y="516" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <rect x="156" y="498" width="36" height="36" rx="4" stroke="#207448" stroke-width="3.5" fill="none" />
  <line x1="162" y1="492" x2="162" y2="498" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="174" y1="492" x2="174" y2="498" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="186" y1="492" x2="186" y2="498" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="162" y1="534" x2="162" y2="540" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="174" y1="534" x2="174" y2="540" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="186" y1="534" x2="186" y2="540" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="150" y1="510" x2="156" y2="510" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="150" y1="522" x2="156" y2="522" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="192" y1="510" x2="198" y2="510" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="192" y1="522" x2="198" y2="522" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text font-size="24">
    <tspan x="230" y="504"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">anon-rss</tspan><tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> in the Memory</tspan></tspan>
    <tspan x="230" y="538" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">cgroup out of memory line</tspan>
  </text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="640" y="504">Compare the victim anonymous</tspan>
    <tspan x="640" y="538">resident memory with the limit.</tspan>
  </text>

  
  <rect x="50" y="606" width="1160" height="144" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="678" r="24" fill="#207448" />
  <text x="95" y="678" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <circle cx="156" cy="666" r="3" fill="#207448" />
  <line x1="168" y1="666" x2="196" y2="666" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="156" cy="678" r="3" fill="#207448" />
  <line x1="168" y1="678" x2="196" y2="678" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="156" cy="690" r="3" fill="#207448" />
  <line x1="168" y1="690" x2="190" y2="690" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  
  <text x="230" y="686" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">Tasks state table</text>
  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="640" y="666">Who else was large. Look for other</tspan>
    <tspan x="640" y="700">big candidates in the table.</tspan>
  </text>

  
  <rect x="1240" y="120" width="310" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="1367" y="340" width="56" height="44" rx="6" stroke="#207448" stroke-width="3" fill="none" />
  <line x1="1367" y1="353" x2="1423" y2="353" stroke="#207448" stroke-width="1.5" />
  <circle cx="1375" cy="346.5" r="2" fill="#207448" />
  <circle cx="1382" cy="346.5" r="2" fill="#207448" />
  <path d="M 1375,361 L 1381,366 L 1375,371" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="1386" y1="371" x2="1394" y2="371" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  
  <text x="1395" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">dmesg -T</text>
  
  <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1395" y="480">grep for invoked</tspan>
    <tspan x="1395" y="514">oom-killer</tspan>
  </text>

  
  <rect x="50" y="774" width="1500" height="96" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text text-anchor="middle" font-size="24">
    <tspan x="800" y="812">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">CONSTRAINT_MEMCG</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> plus </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">anon-rss</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> near the limit means the container</tspan>
    </tspan>
    <tspan x="800" y="848" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">really used its allowance, then the question is leak or mis-sized.</tspan>
  </text>

  
  <rect x="50" y="890" width="1500" height="76" rx="12" fill="#207448" />
  <text x="800" y="937" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Read the constraint line first, because it separates a node problem from a limit problem.</text>
</svg>