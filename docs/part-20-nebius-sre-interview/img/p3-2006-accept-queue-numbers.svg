<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Backlog 5: six clients connect, four time out</title>
  <desc>Visual infographic showing how a backlog of 5 allows 6 connections before subsequent client SYNs are dropped, with corresponding socket state and kernel metrics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Backlog 5: six clients connect, four time out</text>

  

  
  <rect x="420" y="130" width="370" height="800" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

  
  <g transform="translate(577, 155)">
    <rect x="-28" y="-24" width="56" height="48" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
    <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-20" y1="8" x2="20" y2="8" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="12" cy="-16" r="3" fill="#207448" />
    <circle cx="12" cy="0" r="3" fill="#207448" />
    <circle cx="12" cy="16" r="3" fill="#207448" />
  </g>

  
  <text x="605" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="605" dy="0">Server: listen(5),</tspan>
    <tspan x="605" dy="38">never calls accept()</tspan>
  </text>

  
  <rect x="440" y="295" width="330" height="375" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <text x="605" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="605" dy="0">accept queue holds 6 =</tspan>
    <tspan x="605" dy="30">backlog 5 plus 1</tspan>
  </text>

  
  
  <rect x="455" y="380" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="399" r="7" fill="#207448" />
  <line x1="495" y1="399" x2="735" y2="399" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="455" y="426" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="445" r="7" fill="#207448" />
  <line x1="495" y1="445" x2="735" y2="445" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="455" y="472" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="491" r="7" fill="#207448" />
  <line x1="495" y1="491" x2="735" y2="491" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="455" y="518" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="537" r="7" fill="#207448" />
  <line x1="495" y1="537" x2="735" y2="537" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="455" y="564" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="583" r="7" fill="#207448" />
  <line x1="495" y1="583" x2="735" y2="583" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="455" y="610" width="300" height="38" rx="6" fill="#cbe4d3" stroke="#207448" stroke-width="2" />
  <circle cx="480" cy="629" r="7" fill="#207448" />
  <line x1="495" y1="629" x2="735" y2="629" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <line x1="420" y1="695" x2="420" y2="905" stroke="#db8129" stroke-width="6" stroke-linecap="round" />

  
  
  <g transform="translate(75, 399)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="399" x2="451" y2="399" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(75, 445)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="445" x2="451" y2="445" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(75, 491)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="491" x2="451" y2="491" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(75, 537)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="537" x2="451" y2="537" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(75, 583)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="583" x2="451" y2="583" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(75, 629)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="629" x2="451" y2="629" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="180" y="340" width="165" height="38" rx="19" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="262" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">connected</text>

  
  <g transform="translate(75, 720)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="720" x2="415" y2="720" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(75, 770)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="770" x2="415" y2="770" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(75, 835)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="835" x2="415" y2="835" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(75, 885)">
    <rect x="-24" y="-16" width="48" height="28" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <line x1="-12" y1="16" x2="12" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="108" y1="885" x2="415" y2="885" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

  
  <rect x="120" y="788" width="285" height="40" rx="20" fill="#fff5ec" stroke="#db8129" stroke-width="2" />
  <text x="262" y="816" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">SYN dropped, timeout</text>

  

  
  <rect x="840" y="130" width="710" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(865, 155)">
    <rect x="0" y="0" width="44" height="34" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="10" x2="44" y2="10" stroke="#207448" stroke-width="2" />
    <polyline points="8,18 14,23 8,28" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="925" y="180" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">ss -ltn</text>

  <rect x="865" y="205" width="660" height="65" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5" />
  <text x="885" y="246" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">LISTEN 6 5 127.0.0.1:39459</text>

  <text x="865" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">Recv-Q 6 =</tspan> connections waiting to be accepted
  </text>
  <text x="865" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">Send-Q 5 =</tspan> the limit
  </text>

  
  <rect x="840" y="435" width="710" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(865, 460)">
    <rect x="0" y="0" width="44" height="34" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="10" x2="44" y2="10" stroke="#207448" stroke-width="2" />
    <polyline points="8,18 14,23 8,28" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="925" y="485" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">ss -tn state syn-sent</text>

  <rect x="865" y="510" width="660" height="60" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5" />
  <text x="885" y="549" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">Send-Q 1</text>

  <text x="865" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the late clients wait in SYN-SENT</text>

  
  <rect x="840" y="685" width="710" height="245" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(865, 710)">
    <rect x="0" y="0" width="44" height="34" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="10" x2="44" y2="10" stroke="#207448" stroke-width="2" />
    <polyline points="8,18 14,23 8,28" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="925" y="728" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="925" dy="0">nstat -az TcpExtListenOverflows</tspan>
    <tspan x="925" dy="30">TcpExtListenDrops</tspan>
  </text>

  <rect x="865" y="780" width="660" height="115" rx="8" fill="#ffffff" stroke="#c0d7c7" stroke-width="1.5" />
  <text x="885" y="822" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">TcpExtListenOverflows 8</text>
  <text x="885" y="865" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#303a36">TcpExtListenDrops 8</text>

  
  <rect x="50" y="960" width="1500" height="90" rx="12" fill="#ffffff" stroke="#c0d7c7" stroke-width="2" />
  
  <g transform="translate(85, 1005)">
    <circle cx="0" cy="0" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    <polyline points="0,-12 0,0 9,6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="130" y="998" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" dy="0">Each late client sent its SYN again about once a second</tspan>
    <tspan x="130" dy="32">(four linear retries, tcp_syn_linear_timeouts default 4).</tspan>
  </text>

  
  <rect x="50" y="1080" width="1500" height="80" rx="12" fill="#207448" />
  <text x="800" y="1129" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">When connects are slow, read the listener queue, then the overflow counters, then the application.</text>
</svg>