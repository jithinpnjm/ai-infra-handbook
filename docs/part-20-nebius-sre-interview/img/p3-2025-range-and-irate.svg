<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>The range selector must hold enough scrapes, and irate looks at two samples</title>
  <desc>Visual explanation of Prometheus range selectors, scrape intervals, Grafana rate interval calculation, and irate versus rate behavior.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The range selector must hold enough scrapes,</tspan>
    <tspan x="800" dy="56">and irate looks at two samples</tspan>
  </text>

  
  <g id="left-panel">
    <rect x="40" y="150" width="550" height="890" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="93" cy="198" r="24" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="93,184 93,198 105,198" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="135" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">range too short</text>

    
    <rect x="60" y="245" width="510" height="235" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="80" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">scrape every 30 s</text>
    
    
    <line x1="85" y1="365" x2="495" y2="365" stroke="#303a36" stroke-width="3"/>
    <polygon points="495,365 480,358 480,372" fill="#303a36"/>

    
    <circle cx="110" cy="365" r="8" fill="#ffffff" stroke="#303a36" stroke-width="3"/>
    <circle cx="200" cy="365" r="8" fill="#207448"/>
    <circle cx="290" cy="365" r="8" fill="#207448"/>
    <circle cx="380" cy="365" r="8" fill="#207448"/>
    <circle cx="470" cy="365" r="8" fill="#207448"/>

    
    <path d="M 115,345 L 115,330 L 157,330 L 157,318 L 157,330 L 200,330 L 200,345" fill="none" stroke="#303a36" stroke-width="2.5"/>
    <text x="157" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">[30s]</text>

    
    <path d="M 115,385 L 115,405 L 290,405 L 290,418 L 290,405 L 470,405 L 470,385" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="290" y="445" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">[2m]</text>

    
    <rect x="60" y="495" width="510" height="205" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="80" y="535" font-family="ui-monospace, monospace" font-size="24" fill="#207448">rate(gateway_requests_total[30s])</text>
    <text x="80" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">holds one sample (range is left-open</tspan>
      <tspan x="80" dy="36">and right-closed, a sample exactly</tspan>
      <tspan x="80" dy="36">on the old edge is left out)</tspan>
    </text>

    
    <rect x="60" y="715" width="510" height="150" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="80" y="765" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">one sample cannot give a slope, so</tspan>
      <tspan x="80" dy="38">the panel is empty while traffic flows</tspan>
    </text>

    
    <rect x="60" y="880" width="510" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="958" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">fix [2m]</text>
  </g>

  
  <g id="middle-rule">
    <rect x="620" y="150" width="390" height="890" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="645" y="172" width="56" height="56" rx="8" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="657" y1="188" x2="689" y2="188" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="657" y1="200" x2="689" y2="200" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="657" y1="212" x2="689" y2="212" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="667" cy="188" r="4" fill="#207448"/>
    <circle cx="679" cy="200" r="4" fill="#207448"/>
    <circle cx="671" cy="212" r="4" fill="#207448"/>

    <text x="645" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="645" dy="0">two samples is the bare</tspan>
      <tspan x="645" dy="38">minimum and still thin</tspan>
    </text>

    
    <rect x="640" y="325" width="350" height="465" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="658" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="658" dy="0">Grafana </tspan>
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">$__rate_interval</tspan>
      <tspan x="658" dy="44">is designed to capture at</tspan>
      <tspan x="658" dy="38">least four scrape samples:</tspan>
      <tspan x="658" dy="38">the larger of the dashboard</tspan>
      <tspan x="658" dy="38">interval plus the scrape</tspan>
      <tspan x="658" dy="38">interval, and four times</tspan>
      <tspan x="658" dy="38">the scrape interval</tspan>
    </text>

    
    <rect x="640" y="805" width="350" height="210" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="658" y="855" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="658" dy="0" font-weight="bold">mismatch warning:</tspan>
      <tspan x="658" dy="38">data source set to 15 s</tspan>
      <tspan x="658" dy="36">while the real scrape is 60 s</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="1040" y="150" width="520" height="890" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="1065" y="170" width="56" height="56" rx="8" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="1073,205 1083,205 1091,185 1099,215 1107,195 1113,205 1117,205" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="1135" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1135" dy="0">irate uses only the</tspan>
      <tspan x="1135" dy="38">last two data points</tspan>
    </text>

    
    <rect x="1060" y="260" width="480" height="150" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="1080" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">good for graphs of fast counters</tspan>
      <tspan x="1080" dy="38">where you want every wiggle</tspan>
    </text>

    
    <rect x="1060" y="425" width="480" height="365" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="1080" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0" font-weight="bold" fill="#db8129">trap in alerts:</tspan>
      <tspan x="1080" dy="40">the test feeds a counter that</tspan>
      <tspan x="1080" dy="36">jumps by 100 then stays flat</tspan>
      <tspan x="1080" dy="36">and at the end irate sees calm</tspan>
      <tspan x="1080" dy="36">while rate over 5m still</tspan>
      <tspan x="1080" dy="36">sees the burst</tspan>
    </text>

    
    <rect x="1060" y="805" width="480" height="210" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5"/>
    <text x="1080" y="850" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">exercise 2</text>
    <text x="1080" y="895" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="1080" dy="0">irate(gateway_errors_total[5m])</tspan>
      <tspan x="1080" dy="38" font-weight="bold" fill="#207448">> 1 fix rate(...[5m])</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1060" width="1520" height="100" rx="14" fill="#207448"/>
    <text x="800" y="1102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">rate: per-second average over the range, extrapolated to its ends;</tspan>
      <tspan x="800" dy="34">increase is the same maths times the seconds in the window</tspan>
    </text>
  </g>
</svg>