<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A node cordoned for nine days: state before cause</title>
  <desc>Decision tree explaining triage and state before cause for a node cordoned for nine days.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A node cordoned for nine days: state before cause</text>

  
  <rect x="260" y="86" width="1080" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(290, 103)">
    <path d="M 28 8 C 16 8 10 18 10 30 L 6 42 L 50 42 L 46 30 C 46 18 40 8 28 8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 22 46 C 22 50 25 53 28 53 C 31 53 34 50 34 46" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="3" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="375" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">NodeCordonedTooLong fires: node out for nine days</text>

  
  <path d="M 800 176 L 800 216" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="420" y="216" width="760" height="86" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(450, 231)">
    <circle cx="28" cy="28" r="23" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 21 21 C 21 16 25 13 29 13 C 33 13 36 16 36 20 C 36 25 28 27 28 33" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="41" r="2.5" fill="#207448" />
  </g>
  <text x="535" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">what is the lifecycle state?</text>

  
  <path d="M 600 302 L 600 326 L 420 326 L 420 350" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1000 302 L 1000 326 L 1180 326 L 1180 350" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="80" y="350" width="680" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(392, 368)">
    <rect x="6" y="14" width="44" height="34" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 14 L 18 8 C 18 5 21 3 24 3 L 32 3 C 35 3 38 5 38 8 L 38 14" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="25" x2="50" y2="25" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="35" r="3" fill="#207448" />
  </g>
  <text x="420" y="450" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="420" font-size="30" font-weight="bold" fill="#303a36">repairing with a vendor case open:</tspan>
    <tspan x="420" dy="44" font-size="24" fill="#303a36">the age is a vendor issue,</tspan>
    <tspan x="420" dy="36" font-size="24" fill="#303a36">chase the case</tspan>
  </text>

  
  <rect x="840" y="350" width="680" height="250" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />
  
  <g transform="translate(1152, 366)">
    <path d="M 28 6 L 48 13 L 48 29 C 48 41 39 49 28 53 C 17 49 8 41 8 29 L 8 13 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="33" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="41" r="2.5" fill="#db8129" />
  </g>
  <text x="1180" y="448" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="1180" font-size="30" font-weight="bold" fill="#db8129">cordoned with no ticket:</tspan>
    <tspan x="1180" dy="42" font-size="24" font-weight="bold" fill="#303a36">nothing owns it, this is the silent loss;</tspan>
    <tspan x="1180" dy="36" font-size="24" fill="#303a36">run the stuck-state check,</tspan>
    <tspan x="1180" dy="36" font-size="24" fill="#303a36">find ticketless nodes, give each an owner</tspan>
  </text>

  
  <path d="M 1180 600 L 1180 640" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="840" y="640" width="680" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(1152, 655)">
    <circle cx="23" cy="23" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="35" y1="35" x2="49" y2="49" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="23" x2="30" y2="23" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1180" y="730" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="1180" font-size="30" font-weight="bold" fill="#303a36">ask why it happened:</tspan>
    <tspan x="1180" dy="40" font-size="24" fill="#303a36">a common cause is a validation step that</tspan>
    <tspan x="1180" dy="35" font-size="24" fill="#303a36">failed and was only logged</tspan>
  </text>

  
  <path d="M 1180 815 L 1180 855" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="840" y="855" width="680" height="215" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(1152, 870)">
    <rect x="8" y="10" width="40" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 28 L 26 36 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1180" y="942" text-anchor="middle">
    <tspan x="1180" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">a failed validation sends the node</tspan>
    <tspan x="1180" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">back to quarantine and raises a ticket:</tspan>
    <tspan x="1180" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">the VALIDATING to QUARANTINED</tspan>
    <tspan x="1180" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">edge in the state machine</tspan>
  </text>

  
  <rect x="80" y="1100" width="1440" height="70" rx="12" fill="#207448" />
  <text x="800" y="1145" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">ask about the state before the cause, because the state tells you who must act right now</text>
</svg>