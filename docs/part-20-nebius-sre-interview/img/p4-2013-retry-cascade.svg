<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Worked Retry Storm Cascade Arithmetic and Defense Architecture</title>
  <desc>A comparative infographic contrasting the mathematical breakdown of an uncontrolled retry storm cascade against the four-part defense architecture.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Worked Retry Storm Cascade Arithmetic and Defense Architecture</text>

  
  <rect x="40" y="95" width="740" height="1045" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="410" y="145" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Uncontrolled Retry Storm Cascade</text>

  
  <rect x="70" y="170" width="680" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(90, 185)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="16" rx="3" />
    <circle cx="10" cy="8" r="2" fill="#207448" />
    <rect x="0" y="20" width="48" height="16" rx="3" />
    <circle cx="10" cy="28" r="2" fill="#207448" />
    <rect x="0" y="40" width="48" height="16" rx="3" />
    <circle cx="10" cy="48" r="2" fill="#207448" />
  </g>
  <text x="165" y="222" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">10 total replicas serving 100% capacity</text>

  
  <line x1="410" y1="255" x2="410" y2="283" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="285" width="680" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(90, 303)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="24" rx="3" />
    <circle cx="10" cy="12" r="2" fill="#207448" />
    <rect x="0" y="32" width="48" height="24" rx="3" stroke-dasharray="4 3" />
    <line x1="16" y1="38" x2="32" y2="50" stroke="#207448" />
    <line x1="32" y1="38" x2="16" y2="50" stroke="#207448" />
  </g>
  <text x="165" y="327" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">2 replicas fail leaving 8 replicas</tspan>
    <tspan x="165" dy="32">(80% remaining capacity)</tspan>
  </text>

  
  <line x1="410" y1="380" x2="410" y2="408" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="410" width="680" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(90, 442)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 24 6 A 18 18 0 1 1 8 24" />
    <polyline points="2 6 24 6 24 28" />
    <path d="M 24 42 A 18 18 0 1 1 40 24" />
    <polyline points="46 42 24 42 24 20" />
  </g>
  <text x="165" y="447" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="165" dy="0" font-weight="bold">5% initial error rate triggers 3 unbudgeted</tspan>
    <tspan x="165" dy="32">client retries per failed request</tspan>
    <tspan x="165" dy="32">(5% * 3 = 15% added load)</tspan>
  </text>

  
  <line x1="410" y1="530" x2="410" y2="558" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="560" width="680" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(90, 578)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 6 44 A 22 22 0 1 1 44 44" />
    <line x1="25" y1="28" x2="38" y2="14" stroke-width="4" />
    <circle cx="25" cy="28" r="4" fill="#207448" />
  </g>
  <text x="165" y="602" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="165" dy="0">total offered load becomes</tspan>
    <tspan x="165" dy="32" font-weight="bold">100% + 15% = 115%</tspan>
  </text>

  
  <line x1="410" y1="655" x2="410" y2="683" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="685" width="680" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(90, 712)" stroke="#207448" stroke-width="3" fill="none">
    <polygon points="25,4 47,44 3,44" />
    <line x1="25" y1="18" x2="25" y2="30" stroke-width="4" />
    <circle cx="25" cy="37" r="2.5" fill="#207448" />
  </g>
  <text x="165" y="732" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="165" dy="0">effective load on 8 surviving replicas is</tspan>
    <tspan x="165" dy="34" font-weight="bold">115% / 80% = 144% load saturation</tspan>
  </text>

  
  <line x1="410" y1="795" x2="410" y2="875" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <rect x="70" y="885" width="680" height="225" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(382, 910)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" stroke-dasharray="6 4" />
    <line x1="12" y1="12" x2="44" y2="44" stroke="#207448" stroke-width="4" />
    <line x1="44" y1="12" x2="12" y2="44" stroke="#207448" stroke-width="4" />
  </g>
  <text x="410" y="1005" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="410" dy="0">queue buildup, timeouts,</tspan>
    <tspan x="410" dy="36">further retries, and total collapse</tspan>
  </text>

  
  <rect x="820" y="95" width="740" height="1045" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1190" y="145" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">The Four-Part Defense Architecture</text>

  
  <rect x="850" y="170" width="680" height="210" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="210" r="22" fill="#207448" />
  <text x="890" y="218" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="930" y="218" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Pre-first-token only</text>
  
  <g transform="translate(1450, 185)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 25 4 L 45 12 V 26 C 45 38 25 46 25 46 C 25 46 5 38 5 26 V 12 Z" />
    <path d="M 16 24 L 23 31 L 35 18" />
  </g>
  <text x="890" y="270" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">only requests failing before first token</tspan>
    <tspan x="890" dy="34">are eligible for retry; partial streams</tspan>
    <tspan x="890" dy="34">abort to avoid nondeterministic replays</tspan>
  </text>

  
  <rect x="850" y="405" width="680" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="445" r="22" fill="#207448" />
  <text x="890" y="453" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="930" y="453" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">10% Retry Budget Cap</text>
  
  <g transform="translate(1450, 420)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="6" width="36" height="42" rx="4" />
    <line x1="16" y1="36" x2="36" y2="36" />
    <line x1="16" y1="26" x2="30" y2="26" />
    <line x1="16" y1="16" x2="36" y2="16" />
    <path d="M 26 26 L 40 14" stroke-width="3" />
  </g>
  <text x="890" y="505" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">gateway rejects retries exceeding</tspan>
    <tspan x="890" dy="34">10% of total normal traffic</tspan>
  </text>

  
  <rect x="850" y="615" width="680" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="655" r="22" fill="#207448" />
  <text x="890" y="663" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="930" y="663" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Jittered Exponential Backoff</text>
  
  <g transform="translate(1450, 630)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="26" cy="26" r="20" />
    <polyline points="26 14 26 26 34 32" />
    <path d="M 6 42 Q 16 34 26 42 T 46 42" stroke-width="2" />
  </g>
  <text x="890" y="715" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">retries disperse smoothly instead</tspan>
    <tspan x="890" dy="34">of synchronized waves</tspan>
  </text>

  
  <rect x="850" y="825" width="680" height="285" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="890" cy="865" r="22" fill="#207448" />
  <text x="890" y="873" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="930" y="873" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Single-layer Retries with 429 Shedding</text>
  
  <g transform="translate(1450, 840)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 6 8 L 46 8 L 30 28 L 30 44 L 22 40 L 22 28 Z" />
    <line x1="6" y1="8" x2="46" y2="8" stroke-width="4" />
  </g>
  <text x="890" y="925" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">retries execute only at gateway, never stacked</tspan>
    <tspan x="890" dy="34">with SDK; router sheds full queues immediately</tspan>
    <tspan x="890" dy="34">with HTTP 429 and Retry-After header</tspan>
  </text>
</svg>