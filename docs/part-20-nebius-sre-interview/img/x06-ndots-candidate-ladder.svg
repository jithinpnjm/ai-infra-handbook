<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>One call to api.example.com under ndots 5: eight queries before the useful answer</title>
  <desc>Visual explanation showing how ndots 5 causes four candidate FQDN lookups with A and AAAA queries totaling eight queries before reaching the useful answer, along with resolv.conf rules and fixes.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">One call to api.example.com under ndots 5:</tspan>
    <tspan x="800" dy="58">eight queries before the useful answer</tspan>
  </text>

  
  <g id="resolv-conf-box">
    <rect x="60" y="150" width="940" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="60" y="150" width="180" height="36" rx="8" fill="#e8f1ea"/>
    
    <path d="M 78 159 L 90 159 L 96 165 L 96 177 L 78 177 Z" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 90 159 L 90 165 L 96 165" fill="none" stroke="#207448" stroke-width="2"/>
    <text x="104" y="175" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolv.conf</text>
    <text x="85" y="224" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">search ml.svc.cluster.local svc.cluster.local cluster.local</text>
    <text x="85" y="262" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">options ndots:5</text>
  </g>

  
  <g id="side-note-box">
    <rect x="1030" y="150" width="510" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="195" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1055" dy="0">api.example.com has two dots,</tspan>
      <tspan x="1055" dy="35">below ndots 5 so search</tspan>
      <tspan x="1055" dy="35">suffixes come first</tspan>
    </text>
  </g>

  
  <line x1="110" y1="350" x2="110" y2="680" stroke="#207448" stroke-width="4" stroke-dasharray="8 6"/>

  
  <g id="row-1">
    <rect x="60" y="315" width="1480" height="92" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="110" cy="361" r="24" fill="#207448"/>
    <text x="110" y="361" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="160" y="350" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">api.example.com.ml.svc.cluster.local</text>
    <text x="160" y="384" font-family="sans-serif" font-size="24" fill="#5a6862">queries A and AAAA</text>
    <text x="1380" y="361" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">running total 2</text>
    
    <circle cx="1450" cy="361" r="20" fill="#fbebe8" stroke="#c93b2b" stroke-width="2"/>
    <line x1="1442" y1="353" x2="1458" y2="369" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
    <line x1="1458" y1="353" x2="1442" y2="369" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <g id="row-2">
    <rect x="60" y="423" width="1480" height="92" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="110" cy="469" r="24" fill="#207448"/>
    <text x="110" y="469" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="160" y="469" dominant-baseline="central" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">api.example.com.svc.cluster.local</text>
    <text x="1380" y="469" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">running total 4</text>
    
    <circle cx="1450" cy="469" r="20" fill="#fbebe8" stroke="#c93b2b" stroke-width="2"/>
    <line x1="1442" y1="461" x2="1458" y2="477" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
    <line x1="1458" y1="461" x2="1442" y2="477" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <g id="row-3">
    <rect x="60" y="531" width="1480" height="92" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="110" cy="577" r="24" fill="#207448"/>
    <text x="110" y="577" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="160" y="577" dominant-baseline="central" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">api.example.com.cluster.local</text>
    <text x="1380" y="577" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">running total 6</text>
    
    <circle cx="1450" cy="577" r="20" fill="#fbebe8" stroke="#c93b2b" stroke-width="2"/>
    <line x1="1442" y1="569" x2="1458" y2="585" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
    <line x1="1458" y1="569" x2="1442" y2="585" stroke="#c93b2b" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <g id="row-4">
    <rect x="60" y="639" width="1480" height="104" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <circle cx="110" cy="691" r="24" fill="#207448"/>
    <text x="110" y="691" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <text x="160" y="675" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">api.example.com</text>
    <text x="160" y="713" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">the real name and the only useful answer</text>
    <text x="1380" y="675" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">running total 8</text>
    <text x="1380" y="713" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">cost total 8 queries</text>
    
    <circle cx="1450" cy="691" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <path d="M 1439 691 L 1447 699 L 1461 683" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <g id="fix-tile-1">
    <rect x="60" y="775" width="710" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="115" cy="860" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="115" cy="860" r="8" fill="#207448"/>
    <text x="165" y="845" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">trailing dot api.example.com.</text>
    <text x="165" y="888" font-family="sans-serif" font-size="24" fill="#303a36">sends one query per record type</text>
  </g>

  <g id="fix-tile-2">
    <rect x="830" y="775" width="710" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="885" cy="860" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 885 834 L 885 842 M 885 878 L 885 886 M 859 860 L 867 860 M 903 860 L 911 860 M 867 842 L 873 848 M 897 872 L 903 878 M 867 878 L 873 872 M 897 848 L 903 842" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="945" y="845" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">dnsConfig ndots lower</text>
    <text x="945" y="888" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">NodeLocal DNSCache</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="975" width="1480" height="95" rx="16" fill="#207448"/>
    
    <circle cx="110" cy="1022" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 124 1022 L 144 1022 M 136 1022 L 136 1029 M 142 1022 L 142 1029" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="820" y="1022" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Count the lookups one call causes before you blame CoreDNS capacity.</text>
  </g>
</svg>