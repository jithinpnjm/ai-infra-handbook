<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Same one-liner, different answer on Mac and Ubuntu</title>
  <desc>Comparison table showing how identical shell commands produce different results on macOS BSD utilities versus Ubuntu GNU tools.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Same one-liner, different answer on Mac and Ubuntu</text>

  
  
  <rect x="40" y="130" width="495" height="65" rx="8" fill="#e8f1ea" stroke="#c0d4c5" stroke-width="1.5"/>
  
  <rect x="65" y="145" width="40" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 74 158 L 81 162 L 74 166" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="85" y1="166" x2="94" y2="166" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="125" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Command</text>

  
  <rect x="545" y="130" width="495" height="65" rx="8" fill="#52606d" stroke="#414c57" stroke-width="1.5"/>
  
  <rect x="570" y="145" width="38" height="26" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="565" y1="175" x2="613" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 584 171 L 582 175 M 594 171 L 596 175" stroke="#ffffff" stroke-width="2.5"/>
  <text x="625" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">On the Mac</text>

  
  <rect x="1050" y="130" width="510" height="65" rx="8" fill="#207448" stroke="#185937" stroke-width="1.5"/>
  
  <rect x="1072" y="145" width="38" height="34" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="1080" y1="155" x2="1088" y2="155" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1080" y1="164" x2="1102" y2="164" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="1100" cy="155" r="2.5" fill="#ffffff"/>
  <text x="1125" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">On Ubuntu with GNU tools</text>

  
  <rect x="40" y="215" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="215" x2="535" y2="311" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="215" x2="1045" y2="311" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">date -d '2026-03-12' +%F</text>
  <text x="560" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#c53030">illegal option -- d</text>
  <text x="1070" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#207448">2026-03-12</text>

  
  <rect x="40" y="327" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="327" x2="535" y2="423" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="327" x2="1045" y2="423" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="383" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">stat -c %s file</text>
  <text x="560" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">illegal option -- c</text>
  <text x="1070" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">4 for a four-byte file</text>

  
  <rect x="40" y="439" width="1520" height="96" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <line x1="535" y1="439" x2="535" y2="535" stroke="#f3dfcd" stroke-width="1.5"/>
  <line x1="1045" y1="439" x2="1045" y2="535" stroke="#f3dfcd" stroke-width="1.5"/>
  <text x="65" y="495" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">echo -n | xargs echo hi</text>
  <text x="560" y="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">printed nothing</text>
  <text x="1070" y="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">printed hi, add -r to stop that</text>

  
  <rect x="40" y="551" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="551" x2="535" y2="647" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="551" x2="1045" y2="647" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="607" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">sed -i s/x/y/ file</text>
  <text x="560" y="607" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">needs a suffix argument</text>
  <text x="1070" y="607" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">works without one</text>

  
  <rect x="40" y="663" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="663" x2="535" y2="759" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="663" x2="1045" y2="759" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="719" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">((i++)) under set -e with i=0</text>
  <text x="560" y="719" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">script did not stop on bash 3.2</text>
  <text x="1070" y="704" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1070" dy="0">script stops with exit 1</tspan>
    <tspan x="1070" dy="30">on bash 5.2.21</tspan>
  </text>

  
  <rect x="40" y="775" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="775" x2="535" y2="871" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="775" x2="1045" y2="871" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="831" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">grep -oP '\d+'</text>
  <text x="560" y="831" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">not available in the BSD grep</text>
  <text x="1070" y="831" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">prints each number</text>

  
  <rect x="40" y="887" width="1520" height="96" rx="10" fill="#ffffff" stroke="#d5dfd7" stroke-width="1.5"/>
  <line x1="535" y1="887" x2="535" y2="983" stroke="#e6eee8" stroke-width="1.5"/>
  <line x1="1045" y1="887" x2="1045" y2="983" stroke="#e6eee8" stroke-width="1.5"/>
  <text x="65" y="943" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">default awk</text>
  <text x="560" y="943" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">one true awk, 20200816</text>
  <text x="1070" y="943" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36">mawk 1.3.4 on a fresh Ubuntu</text>

  
  <rect x="40" y="1015" width="1520" height="80" rx="10" fill="#207448"/>
  
  <rect x="65" y="1031" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M 77 1055 L 85 1063 L 101 1047" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="135" y="1064" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Write POSIX pipelines and say aloud when you use a GNU extension.</text>
</svg>