<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Three places where a request can wait</title>
  <desc>Architecture infographic illustrating request waiting states, KV cache full preemption, and vLLM latency metrics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-size="48px" font-weight="bold" fill="#303a36" font-family="sans-serif">Three places where a request can wait</text>

  
  
  <rect x="40" y="125" width="720" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="400" y="166" text-anchor="middle" font-size="24px" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">vllm:request_queue_time_seconds:</tspan><tspan font-family="sans-serif"> time waiting</tspan>
  </text>

  
  <rect x="840" y="125" width="720" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1200" y="166" text-anchor="middle" font-size="24px" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">vllm:time_to_first_token_seconds:</tspan><tspan font-family="sans-serif"> TTFT</tspan>
  </text>

  
  <rect x="500" y="210" width="1060" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1030" y="251" text-anchor="middle" font-size="24px" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">vllm:inter_token_latency_seconds:</tspan><tspan font-family="sans-serif"> gap between streamed outputs</tspan>
  </text>

  
  <text x="926" y="332" text-anchor="middle" font-size="24px" font-weight="bold" fill="#207448" font-family="sans-serif">Full: preempt the newest, recompute later</text>
  <path d="M 1370 440 L 1370 372 Q 1370 352 1350 352 L 502.5 352 Q 482.5 352 482.5 372 L 482.5 430" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="40" y="440" width="195" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(137.5, 500)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 0 -22 L 0 -32 M -4 -27 L 0 -33 L 4 -27" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 0 22 L 0 32 M -4 27 L 0 33 L 4 27" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -22 0 L -32 0 M -27 -4 L -33 0 L -27 4" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 0 L 32 0 M 27 -4 L 33 0 L 27 4" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="6" fill="#207448" />
  </g>
  <text x="137.5" y="585" text-anchor="middle" font-size="30px" font-weight="bold" fill="#303a36" font-family="sans-serif">
    <tspan x="137.5" dy="0">Client or</tspan>
    <tspan x="137.5" dy="38">router</tspan>
  </text>

  
  <path d="M 235 590 L 270 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="280" y="440" width="405" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(482.5, 495)">
    <rect x="-28" y="-20" width="56" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="-9" y1="-20" x2="-9" y2="20" stroke="#207448" stroke-width="3.5" />
    <line x1="10" y1="-20" x2="10" y2="20" stroke="#207448" stroke-width="3.5" />
    <circle cx="-18.5" cy="0" r="4" fill="#207448" />
    <circle cx="0.5" cy="0" r="4" fill="#207448" />
    <circle cx="19.5" cy="0" r="4" fill="#207448" />
    <path d="M -46 0 L -34 0 M -39 -5 L -33 0 L -39 5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="482.5" y="555" text-anchor="middle" font-size="30px" font-weight="bold" fill="#303a36" font-family="sans-serif">Waiting queue</text>
  
  <rect x="295" y="578" width="375" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="482.5" y="607" text-anchor="middle" font-size="24px" font-family="monospace" font-weight="bold" fill="#207448">vllm:num_requests_waiting</text>
  
  <text x="482.5" y="660" text-anchor="middle" font-size="24px" fill="#303a36" font-family="sans-serif">
    <tspan x="482.5" dy="0">The line outside</tspan>
    <tspan x="482.5" dy="32">a busy kitchen</tspan>
  </text>

  
  <path d="M 685 590 L 720 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="440" width="405" height="300" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(932.5, 495)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2.5" />
    <path d="M -16 -30 L -16 -24 M -8 -30 L -8 -24 M 0 -30 L 0 -24 M 8 -30 L 8 -24 M 16 -30 L 16 -24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M -16 24 L -16 30 M -8 24 L -8 30 M 0 24 L 0 30 M 8 24 L 8 30 M 16 24 L 16 30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M -30 -16 L -24 -16 M -30 -8 L -24 -8 M -30 0 L -24 0 M -30 8 L -24 8 M -30 16 L -24 16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 24 -16 L 30 -16 M 24 -8 L 30 -8 M 24 0 L 30 0 M 24 8 L 30 8 M 24 16 L 30 16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="932.5" y="555" text-anchor="middle" font-size="30px" font-weight="bold" fill="#303a36" font-family="sans-serif">Running batch</text>
  
  <rect x="745" y="578" width="375" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="932.5" y="607" text-anchor="middle" font-size="24px" font-family="monospace" font-weight="bold" fill="#207448">vllm:num_requests_running</text>
  
  <text x="932.5" y="660" text-anchor="middle" font-size="24px" fill="#303a36" font-family="sans-serif">
    <tspan x="932.5" dy="0">Requests the GPU is</tspan>
    <tspan x="932.5" dy="32">cooking together</tspan>
  </text>

  
  <path d="M 932.5 740 L 932.5 848" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="958" y="805" font-size="24px" fill="#303a36">
    <tspan font-family="sans-serif" font-weight="bold">Tokens out: </tspan><tspan font-family="monospace" fill="#207448" font-weight="bold">generation_tokens</tspan>
  </text>

  
  <path d="M 1135 590 L 1170 590" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1180" y="440" width="380" height="300" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="5" />
  
  <g transform="translate(1370, 502)">
    <rect x="-24" y="-22" width="20" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="4" y="-22" width="20" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="-24" y="4" width="20" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="4" y="4" width="20" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M -14 -17 L -14 -9 M 14 -17 L 14 -9 M -14 9 L -14 17 M 14 9 L 14 17" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="1370" y="565" text-anchor="middle" font-size="30px" font-weight="bold" fill="#303a36" font-family="sans-serif">KV cache</text>
  
  <rect x="1195" y="605" width="350" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1370" y="635" text-anchor="middle" font-size="24px" font-family="monospace" font-weight="bold" fill="#207448">vllm:kv_cache_usage_perc</text>

  
  <rect x="40" y="930" width="1520" height="70" rx="12" fill="#207448" />
  <text x="800" y="974" text-anchor="middle" font-size="26px" font-weight="bold" fill="#ffffff" font-family="sans-serif">Name the place that is full before you name a cause.</text>
</svg>