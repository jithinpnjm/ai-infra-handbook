<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Xid 79 on three nodes in different racks: what to do first</title>
  <desc>Incident triage ladder for Xid 79 GPU bus errors across multiple racks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Xid 79 on three nodes in different racks: what to do first</text>

  
  <rect x="50" y="95" width="1500" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(72, 114)">
    <rect x="0" y="8" width="54" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="8" y="16" width="28" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="42" y1="20" x2="46" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="28" x2="46" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="8" x2="12" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="145" y="137" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Pager: Xid 79 on three nodes, different racks, within five minutes.<tspan x="145" dy="38" font-size="25" font-weight="normal">Xid 79 means the GPU fell off the PCIe bus</tspan></text>

  
  <rect x="50" y="230" width="990" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="265" r="24" fill="#207448" />
  <text x="90" y="274" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="130" y="275" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1</text>
  
  <g transform="translate(245, 245)">
    <rect x="0" y="4" width="14" height="34" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="20" y="4" width="14" height="34" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="40" y="4" width="14" height="34" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
    <circle cx="7" cy="14" r="1.5" fill="#207448" />
    <circle cx="27" cy="14" r="1.5" fill="#207448" />
    <circle cx="47" cy="14" r="1.5" fill="#207448" />
  </g>
  <text x="85" y="322" font-family="sans-serif" font-size="24" fill="#303a36">a pattern across racks points to a shared cause, not three coincident hardware faults</text>

  
  <line x1="545" y1="355" x2="545" y2="395" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="395" width="990" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="430" r="24" fill="#207448" />
  <text x="90" y="439" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="130" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2</text>
  
  <g transform="translate(245, 410)">
    <circle cx="24" cy="20" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="24" cy="20" r="5" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="2" x2="24" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="24" y1="34" x2="24" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="6" y1="20" x2="10" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="38" y1="20" x2="42" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="85" y="482" font-family="sans-serif" font-size="24" fill="#303a36">candidates: driver or firmware rollout, a bad exporter restart<tspan x="85" dy="32">that re-emitted a stuck gauge, a power or cooling event</tspan></text>

  
  <line x1="545" y1="525" x2="545" y2="565" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="565" width="990" height="110" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <circle cx="90" cy="620" r="24" fill="#db8129" />
  <text x="90" y="629" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="130" y="630" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Step 3</text>
  
  <g transform="translate(245, 595)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#db8129" stroke-width="4" />
    <polyline points="24,12 24,24 34,24" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="325" y="629" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">check what changed in the last hour</text>

  
  <line x1="545" y1="675" x2="545" y2="715" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="715" width="990" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="750" r="24" fill="#207448" />
  <text x="90" y="759" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="130" y="760" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4</text>
  
  <g transform="translate(245, 730)">
    <rect x="0" y="4" width="52" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="14" x2="52" y2="14" stroke="#207448" stroke-width="3" />
    <polyline points="8,22 14,27 8,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="18" y1="32" x2="28" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="85" y="802" font-family="sans-serif" font-size="24" fill="#303a36">check <tspan font-family="monospace">dmesg</tspan> on one node to confirm the Xid is real<tspan x="85" dy="32">and not a gauge that stayed high</tspan></text>

  
  <line x1="545" y1="845" x2="545" y2="885" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="50" y="885" width="990" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="90" cy="920" r="24" fill="#207448" />
  <text x="90" y="929" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="130" y="930" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 5</text>
  
  <g transform="translate(245, 900)">
    <polygon points="4,6 48,6 30,26 30,40 18,36 18,26" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="85" y="972" font-family="sans-serif" font-size="24" fill="#303a36">keep the freeze; drain only nodes<tspan x="85" dy="32">whose logs show a new Xid</tspan></text>

  
  <rect x="1085" y="230" width="465" height="785" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1290, 255)">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 10 40 A 18 18 0 0 1 46 40" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="40" x2="38" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <text x="1115" y="360" font-family="sans-serif" font-size="25" fill="#303a36">the limiter already froze<tspan x="1115" dy="38">after the flags, as the</tspan><tspan x="1115" dy="38">simulation showed:</tspan><tspan x="1115" dy="38">serving 196 of 200,</tspan><tspan x="1115" dy="38">human paged</tspan></text>

  
