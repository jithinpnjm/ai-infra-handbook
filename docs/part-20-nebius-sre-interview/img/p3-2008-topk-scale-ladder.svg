<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Top error endpoints: three layers as the log gets bigger</title>
  <desc>Visual explanation of scaling error endpoint counting from bounded memory counters to heaps and distributed sharding.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1420" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Top error endpoints: three layers as the log gets bigger
  </text>

  
  
  <rect x="50" y="120" width="600" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="75" y="145" width="550" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(95, 165)">
    <rect x="0" y="0" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="12" x2="48" y2="12" stroke="#207448" stroke-width="2"/>
    <circle cx="8" cy="6" r="2.5" fill="#207448"/>
    <circle cx="16" cy="6" r="2.5" fill="#207448"/>
  </g>
  <text x="160" y="195" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
    parse: 10.0.0.7 - GET /v1/chat 503 12ms
  </text>

  
  <g transform="translate(95, 245)">
    
    <rect x="0" y="0" width="150" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">address</text>

    
    <rect x="180" y="0" width="140" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="250" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">status</text>

    
    <rect x="350" y="0" width="150" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="425" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">latency</text>
  </g>

  
  <line x1="350" y1="330" x2="350" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="75" y="380" width="550" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(110, 405)">
    <polygon points="0,5 44,5 28,26 28,45 16,38 16,26" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="185" y="448" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    keep 5xx only
  </text>

  
  <line x1="350" y1="490" x2="350" y2="540" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="75" y="540" width="550" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(110, 565)">
    <line x1="0" y1="45" x2="48" y2="45" stroke="#207448" stroke-width="3"/>
    <rect x="6" y="24" width="8" height="21" fill="#207448"/>
    <rect x="20" y="12" width="8" height="33" fill="#207448"/>
    <rect x="34" y="4" width="8" height="41" fill="#207448"/>
  </g>
  <text x="185" y="608" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    count by endpoint
  </text>

  
  <rect x="50" y="780" width="600" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(90, 815)">
    <line x1="26" y1="8" x2="26" y2="48" stroke="#207448" stroke-width="4"/>
    <line x1="6" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="3"/>
    <polygon points="6,16 0,34 12,34" fill="none" stroke="#207448" stroke-width="2"/>
    <polygon points="46,16 40,34 52,34" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="16" y1="48" x2="36" y2="48" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="160" y="855" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    Tie-breaking rule
  </text>
  
  <rect x="75" y="890" width="550" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="105" y="945" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="105" dy="0">ties go to the alphabetically smaller</tspan>
    <tspan x="105" dy="42">endpoint, key = negative count then name</tspan>
    <tspan x="105" dy="42">via heapq.nsmallest; most_common</tspan>
    <tspan x="105" dy="42">gives first-seen order</tspan>
  </text>


  

  
  <rect x="690" y="120" width="860" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(725, 145)">
    <rect x="0" y="0" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="10" y1="16" x2="22" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="16" x2="38" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="10" y1="32" x2="22" y2="32" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="32" x2="38" y2="32" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="795" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Counter, then take the top k
  </text>
  <text x="725" y="240" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="725" dy="0">fine at any log size when the endpoint set is bounded; memory</tspan>
    <tspan x="725" dy="38">depends on distinct endpoints, not lines</tspan>
  </text>

  
  <line x1="1120" y1="330" x2="1120" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  
  <rect x="965" y="355" width="310" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1120" y="389" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    too many keys to sort
  </text>

  
  <rect x="690" y="430" width="860" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(725, 455)">
    <circle cx="24" cy="10" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="38" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="38" cy="38" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="19" y1="16" x2="14" y2="32" stroke="#207448" stroke-width="2"/>
    <line x1="29" y1="16" x2="34" y2="32" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="795" y="490" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Heap of size k over the counts
  </text>
  <text x="725" y="550" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="725" dy="0">keeps only k items; counting is linear in n and the heap step</tspan>
    <tspan x="725" dy="38">is about n log k in the worst case</tspan>
  </text>

  
  <line x1="1120" y1="640" x2="1120" y2="760" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  
  <rect x="835" y="675" width="570" height="54" rx="27" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="1120" y="711" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    distinct endpoints no longer fit in memory
  </text>

  
  <rect x="690" y="760" width="860" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(720, 785)">
    <rect x="18" y="0" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="0" y="32" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="36" y="32" width="16" height="14" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="20" y1="14" x2="10" y2="32" stroke="#207448" stroke-width="2"/>
    <line x1="32" y1="14" x2="42" y2="32" stroke="#207448" stroke-width="2"/>
  </g>

  
  <text x="785" y="820" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    Shard by a hash of the endpoint
  </text>

  
  <rect x="720" y="855" width="450" height="46" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
  <text x="740" y="887" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    my reasoning, not a Nebius answer
  </text>

  
  <g transform="translate(720, 925)">
    
    <rect x="0" y="0" width="245" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="122" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
      worker 1
    </text>

    
    <rect x="277" y="0" width="245" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="400" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
      worker 2
    </text>

    
    <rect x="555" y="0" width="245" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="677" y="65" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
      worker 3
    </text>
  </g>

  
  <line x1="842" y1="1035" x2="980" y2="1120" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1120" y1="1035" x2="1120" y2="1120" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1397" y1="1035" x2="1260" y2="1120" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="850" y="1120" width="540" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1120" y="1185" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
    merge the per-worker top k lists
  </text>

  
  <rect x="50" y="1310" width="1500" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1358" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    When the parameters change, say what assumption in your solution just broke.
  </text>
</svg>