<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The cgroup wall, not the node, decides the kill</title>
  <desc>Visual infographic explaining that OOM kills occur when the pod working set reaches the cgroup memory.max limit, regardless of plenty of free memory on the host node.</desc>

  <defs>
    
    <pattern id="brickWall" width="60" height="28" patternUnits="userSpaceOnUse">
      <rect width="60" height="28" fill="#fcf6ed"/>
      <rect x="0" y="0" width="60" height="14" fill="none" stroke="#db8129" stroke-width="2.5"/>
      <line x1="30" y1="0" x2="30" y2="14" stroke="#db8129" stroke-width="2.5"/>
      <rect x="0" y="14" width="60" height="14" fill="none" stroke="#db8129" stroke-width="2.5"/>
      <line x1="0" y1="14" x2="0" y2="28" stroke="#db8129" stroke-width="2.5"/>
      <line x1="60" y1="14" x2="60" y2="28" stroke="#db8129" stroke-width="2.5"/>
    </pattern>

    
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The cgroup wall, not the node, decides the kill</text>

  
  <g id="node-container">
    <rect x="80" y="110" width="940" height="755" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(110, 136)">
      <rect x="0" y="6" width="56" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="10" y1="20" x2="36" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="32" x2="26" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="20" r="3" fill="#207448"/>
      <circle cx="44" cy="32" r="3" fill="#207448"/>
    </g>

    
    <text x="185" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Node: 512 GiB memory</text>

    
    <g id="plenty-free-area">
      <rect x="670" y="210" width="320" height="625" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
      
      <circle cx="830" cy="480" r="64" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M810 480 L825 495 L855 465" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="830" y="585" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Plenty free</text>
    </g>

    
    <g id="pod-cgroup-wall">
      
      <rect x="110" y="210" width="530" height="625" rx="14" fill="url(#brickWall)" stroke="#db8129" stroke-width="6"/>

      
      <rect x="132" y="232" width="486" height="581" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>

      
      <g transform="translate(150, 246)">
        <rect x="0" y="4" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="0" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
        <circle cx="14" cy="12" r="3" fill="#207448"/>
        <circle cx="26" cy="12" r="3" fill="#207448"/>
      </g>

      
      <text font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="225" y="270">Pod cgroup,</tspan>
        <tspan x="225" y="302" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26">memory.max: 24 GiB</tspan>
      </text>

      
      <g id="oom-kill-box">
        <rect x="145" y="322" width="460" height="82" rx="8" fill="#fff5f5" stroke="#d32f2f" stroke-width="3"/>
        <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#b71c1c">
          <tspan x="375" y="354" font-size="26" font-weight="bold">OOM kill:</tspan>
          <tspan x="375" y="386" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24">memory.events oom_kill rises</tspan>
        </text>
      </g>

      
      <g id="limit-reached-connection">
        <line x1="280" y1="480" x2="280" y2="416" stroke="#db8129" stroke-width="5" marker-end="url(#arrow)"/>
        <rect x="305" y="432" width="180" height="38" rx="6" fill="#fdf3e7" stroke="#db8129" stroke-width="1.5"/>
        <text x="395" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">Limit reached</text>
      </g>

      
      <g id="page-cache-bar">
        <rect x="145" y="485" width="460" height="95" rx="8" fill="#a5d6a7" stroke="#207448" stroke-width="2"/>
        <text x="375" y="542" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#1b4d2e">Page cache (reclaimable)</text>
      </g>

      
      <g id="working-set-bar">
        <rect x="145" y="590" width="460" height="210" rx="8" fill="#207448"/>
        <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#ffffff">
          <tspan x="375" y="680" font-size="26" font-weight="bold">Working set</tspan>
          <tspan x="375" y="720" font-size="24">(cannot be given back cheaply)</tspan>
        </text>
      </g>
    </g>
  </g>

  
  <g id="alert-card">
    <rect x="1060" y="110" width="460" height="755" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(1095, 136)">
      <path d="M28 8 C16 8 10 18 10 28 C10 38 4 42 4 44 L52 44 C52 42 46 38 46 28 C46 18 40 8 28 8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <path d="M22 48 C22 51.3 24.7 54 28 54 C31.3 54 34 51.3 34 48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="1175" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#303a36">Alert on</text>

    
    <g id="alert-row-1">
      <rect x="1090" y="220" width="400" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

      
      <circle cx="1140" cy="320" r="24" fill="#207448"/>
      <path d="M1128 320 L1136 328 L1152 312" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      
      <text font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="1180" y="305">working set</tspan>
        <tspan x="1180" y="345">against the limit</tspan>
      </text>
    </g>

    
    <g id="alert-row-2">
      <rect x="1090" y="450" width="400" height="385" rx="12" fill="#f5f6f5" stroke="#88928c" stroke-width="2"/>

      
      <circle cx="1140" cy="535" r="24" fill="#88928c"/>
      <path d="M1128 523 L1152 547 M1152 523 L1128 547" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

      
      <text font-family="system-ui, -apple-system, sans-serif" fill="#4a5550">
        <tspan x="1180" y="525" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="25" font-weight="bold">memory.current</tspan>
        <tspan x="1180" y="560" font-size="25" font-weight="bold">including cache</tspan>
      </text>

      
      <rect x="1115" y="635" width="350" height="150" rx="8" fill="#ebebeb" stroke="#b0b8b3" stroke-width="1.5"/>
      <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#505a55">
        <tspan x="1290" y="700">looks alarming,</tspan>
        <tspan x="1290" y="740">rarely a kill</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="895" width="1440" height="70" rx="10" fill="#207448"/>
    <text x="800" y="939" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The limit is the wall. Compare the working set to the cgroup limit, not to node memory.</text>
  </g>
</svg>