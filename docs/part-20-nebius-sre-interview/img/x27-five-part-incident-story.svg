<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>The five parts of an incident story, each with one number</title>
  <desc>An infographic illustrating the five parts of an incident story: Impact, Role, Decisions, Result, and Change, each with quantified metrics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="85" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The five parts of an incident story, each with one number</text>

  
  <line x1="312" y1="480" x2="352" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="624" y1="480" x2="664" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="936" y1="480" x2="976" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="1248" y1="480" x2="1288" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="box-1">
    
    <rect x="40" y="160" width="272" height="640" rx="12" ry="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />

    
    <circle cx="76" cy="196" r="24" fill="#db8129" />
    <text x="76" y="196" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>

    
    <g transform="translate(176, 210)">
      <circle cx="0" cy="0" r="24" stroke="#db8129" stroke-width="4" fill="none" />
      <path d="M 0 0 L 0 -13 M 0 0 L 11 0" stroke="#db8129" stroke-width="4" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="0" r="2.5" fill="#db8129" />
    </g>

    
    <text x="176" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129" text-anchor="middle">Impact</text>

    
    <text x="176" y="335" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="176" dy="0">Who, how bad,</tspan>
      <tspan x="176" dy="34">since when</tspan>
    </text>

    
    <rect x="56" y="470" width="240" height="295" rx="8" ry="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
    <text x="176" y="550" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="176" dy="0">Share of</tspan>
      <tspan x="176" dy="34">requests,</tspan>
      <tspan x="176" dy="34">minutes, error</tspan>
      <tspan x="176" dy="34">budget used</tspan>
    </text>
  </g>

  
  <g id="box-2">
    
    <rect x="352" y="160" width="272" height="640" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="388" cy="196" r="24" fill="#207448" />
    <text x="388" y="196" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

    
    <g transform="translate(488, 210)">
      <circle cx="0" cy="-11" r="11" stroke="#207448" stroke-width="4" fill="none" />
      <path d="M -21 21 C -21 7 -11 3 0 3 C 11 3 21 7 21 21" stroke="#207448" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    
    <text x="488" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Role</text>

    
    <text x="488" y="325" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="488" dy="0">What you owned</tspan>
      <tspan x="488" dy="34">and what you</tspan>
      <tspan x="488" dy="34">delegated</tspan>
    </text>

    
    <rect x="368" y="470" width="240" height="295" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="488" y="595" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="488" dy="0">Team size,</tspan>
      <tspan x="488" dy="34">roles filled</tspan>
    </text>
  </g>

  
  <g id="box-3">
    
    <rect x="664" y="160" width="272" height="640" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="700" cy="196" r="24" fill="#207448" />
    <text x="700" y="196" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>

    
    <g transform="translate(800, 210)">
      <path d="M 0 -22 L 18 -14 C 18 8 0 22 0 22 C 0 22 -18 8 -18 -14 Z" stroke="#207448" stroke-width="4" stroke-linejoin="round" fill="none" />
      <path d="M 0 -22 L 0 22" stroke="#207448" stroke-width="2.5" />
    </g>

    
    <text x="800" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Decisions</text>

    
    <text x="800" y="320" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Two or three</tspan>
      <tspan x="800" dy="32">choices, each</tspan>
      <tspan x="800" dy="32">with the</tspan>
      <tspan x="800" dy="32">rejected option</tspan>
    </text>

    
    <rect x="680" y="470" width="240" height="295" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="800" y="595" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Time each</tspan>
      <tspan x="800" dy="34">decision took</tspan>
    </text>
  </g>

  
  <g id="box-4">
    
    <rect x="976" y="160" width="272" height="640" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="1012" cy="196" r="24" fill="#207448" />
    <text x="1012" y="196" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>

    
    <g transform="translate(1112, 210)">
      <path d="M -20 20 L 20 20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M -13 20 L -13 9" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M -4 20 L -4 0" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 5 20 L 5 -8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 14 20 L 14 -18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="1112" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Result</text>

    
    <text x="1112" y="325" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1112" dy="0">How you</tspan>
      <tspan x="1112" dy="34">mitigated, then</tspan>
      <tspan x="1112" dy="34">resolved</tspan>
    </text>

    
    <rect x="992" y="470" width="240" height="295" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="1112" y="555" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1112" dy="0">Minutes to</tspan>
      <tspan x="1112" dy="34">detect,</tspan>
      <tspan x="1112" dy="34">mitigate,</tspan>
      <tspan x="1112" dy="34">resolve</tspan>
    </text>
  </g>

  
  <g id="box-5">
    
    <rect x="1288" y="160" width="272" height="640" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="1324" cy="196" r="24" fill="#207448" />
    <text x="1324" y="196" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>

    
    <g transform="translate(1424, 210)">
      <circle cx="0" cy="0" r="8" stroke="#207448" stroke-width="4" fill="none" />
      <circle cx="0" cy="0" r="16" stroke="#207448" stroke-width="3" fill="none" />
      <path d="M 0 -22 L 0 -16 M 0 16 L 0 22 M -22 0 L -16 0 M 16 0 L 22 0 M -15 -15 L -11 -11 M 11 11 L 15 15 M -15 15 L -11 11 M 11 -11 L 15 -15" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="1424" y="275" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Change</text>

    
    <text x="1424" y="325" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1424" dy="0">The fix that</tspan>
      <tspan x="1424" dy="34">stops it</tspan>
      <tspan x="1424" dy="34">recurring</tspan>
    </text>

    
    <rect x="1304" y="470" width="240" height="295" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="1424" y="575" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1424" dy="0">Alert window,</tspan>
      <tspan x="1424" dy="34">gate,</tspan>
      <tspan x="1424" dy="34">drill time</tspan>
    </text>
  </g>

  
  <g id="note-strip">
    <rect x="450" y="840" width="700" height="64" rx="10" ry="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="872" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle" dominant-baseline="central">About three minutes, then stop</text>
  </g>
</svg>