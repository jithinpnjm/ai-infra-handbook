    </g>
    <text x="745" y="375" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="745" dy="0">Sustained safe rate: 65,536 / 60 = about 1,092 per second</tspan>
    </text>

    
    <rect x="650" y="448" width="880" height="96" rx="8" fill="#f0f3f1" stroke="#7d8c85" stroke-width="1.5"/>
