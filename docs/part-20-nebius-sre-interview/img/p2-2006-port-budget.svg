    <text x="745" y="294" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TIME_WAIT hold: 60 seconds</text>

    
    <rect x="650" y="336" width="880" height="96" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
