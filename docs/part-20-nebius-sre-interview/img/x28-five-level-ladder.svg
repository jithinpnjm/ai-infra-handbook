<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The five-level ladder: one decision, questioned down to the bottom</title>
  <desc>A five-level vertical decision ladder diagram showing steps 1 to 5 questioning a decision down to the bottom, with a side branch at Step 3 for untested gaps.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 11 6 L 2 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The five-level ladder: one decision, questioned down to the bottom</text>

  
  <g id="step-1">
    <rect x="60" y="140" width="890" height="140" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="210" r="24" fill="#207448" />
    <text x="105" y="210" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(150, 182)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>
    <text x="230" y="196" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Why did you pick YOUR CHOICE?</text>
    <text x="230" y="244" font-family="sans-serif" font-size="24" fill="#303a36">Give the constraint and the option</text>
  </g>

  
  <line x1="505" y1="280" x2="505" y2="340" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-2">
    <rect x="60" y="340" width="890" height="140" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="410" r="24" fill="#207448" />
    <text x="105" y="410" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g transform="translate(150, 382)">
      <rect x="4" y="4" width="30" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="20" y="14" width="30" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="230" y="396" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">What else did you consider?</text>
    <text x="230" y="444" font-family="sans-serif" font-size="24" fill="#303a36">Name two alternatives</text>
  </g>

  
  <line x1="505" y1="480" x2="505" y2="540" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-3">
    <rect x="60" y="540" width="890" height="140" rx="16" ry="16" fill="#fffaf5" stroke="#db8129" stroke-width="4" />
    <circle cx="105" cy="610" r="24" fill="#207448" />
    <text x="105" y="610" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(150, 582)">
      <path d="M 6 42 A 24 24 0 1 1 50 42" fill="none" stroke="#db8129" stroke-width="4" />
      <line x1="28" y1="36" x2="42" y2="18" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="36" r="4" fill="#db8129" />
    </g>
    <text x="230" y="596" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">How did you know it would work?</text>
    <text x="230" y="644" font-family="sans-serif" font-size="24" fill="#303a36">A test, a benchmark or a pilot, with a number</text>
  </g>

  
  <line x1="950" y1="610" x2="1030" y2="610" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)" />

  
  <g id="side-box">
    <rect x="1030" y="485" width="510" height="250" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1060, 508)">
      <path d="M 24 4 L 44 12 L 44 28 C 44 40 24 46 24 46 C 24 46 4 40 4 28 L 4 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="24" y1="16" x2="24" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="24" cy="35" r="2.5" fill="#207448" />
    </g>
    <text font-family="sans-serif" fill="#303a36">
      <tspan x="1125" y="542" font-size="26" font-weight="bold">No test? Say the gap:</tspan>
      <tspan x="1060" y="600" font-size="24">I did not test it,</tspan>
      <tspan x="1060" y="642" font-size="24">I decided on my reason,</tspan>
      <tspan x="1060" y="684" font-size="24">and the risk was my risk.</tspan>
    </text>
  </g>

  
  <line x1="505" y1="680" x2="505" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-4">
    <rect x="60" y="740" width="890" height="140" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="810" r="24" fill="#207448" />
    <text x="105" y="810" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(150, 782)">
      <path d="M 28 6 L 50 46 L 6 46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="28" y1="20" x2="28" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="39" r="2.5" fill="#207448" />
    </g>
    <text x="230" y="796" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">What went wrong with it?</text>
    <text x="230" y="844" font-family="sans-serif" font-size="24" fill="#303a36">Tell the failure story</text>
  </g>

  
  <line x1="505" y1="880" x2="505" y2="940" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="step-5">
    <rect x="60" y="940" width="890" height="140" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="105" cy="1010" r="24" fill="#207448" />
    <text x="105" y="1010" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g transform="translate(150, 982)">
      <path d="M 46 22 A 20 20 0 1 0 44 38" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="36,10 48,20 48,6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="230" y="996" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Would you pick it again?</text>
    <text x="230" y="1044" font-family="sans-serif" font-size="24" fill="#303a36">Yes or no, and the condition</text>
  </g>
</svg>