<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Sliding maximum: the deque keeps indexes of decreasing values</title>
  <desc>Infographic explaining the sliding-window maximum algorithm using a monotonic deque of indexes.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 1 L 12 7 L 0 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    <tspan x="50" dy="0">Sliding maximum: the deque keeps</tspan>
    <tspan x="50" dy="56">indexes of decreasing values</tspan>
  </text>

  
  
  <g transform="translate(50, 160)">
    
    <rect x="0" y="5" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 5 L 12 53 M 24 5 L 24 53 M 36 5 L 36 53" stroke="#207448" stroke-width="3" />
    <text x="64" y="40" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">values</text>

    
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="76" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="152" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="228" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="304" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="380" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="456" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="532" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="608" y="0" width="68" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

      
      <path d="M 456 68 L 456 86 L 566 86 L 566 100 L 566 86 L 676 86 L 676 68" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <text x="380" y="132" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">window of k values</text>
    </g>
  </g>

  
  <g transform="translate(50, 340)">
    
    <rect x="0" y="0" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 8 24 L 40 24 M 32 16 L 40 24 L 32 32 M 16 16 L 8 24 L 16 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    
    <text x="64" y="34" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">deque of indexes, values decreasing from front to back</text>

    
    <rect x="0" y="56" width="940" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    
    <rect x="24" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="5" />

    
    <rect x="174" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <rect x="324" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <rect x="474" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />

    
    <rect x="624" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-dasharray="6 6" stroke-width="2" />
    <rect x="774" y="74" width="130" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-dasharray="6 6" stroke-width="2" />
  </g>

  
  <g transform="translate(50, 520)">
    <path d="M 89 0 L 89 40" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <rect x="0" y="56" width="940" height="88" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="24" y="92" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" dy="0">the front index points at the maximum of the window; output it once</tspan>
      <tspan x="24" dy="32">i is at least k minus 1</tspan>
    </text>
  </g>

  
  
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="940" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 940 55 L 970 55 L 970 -190 L 920 -190" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="24" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" dy="0">1 New value arrives at the back: pop every smaller value from the back,</tspan>
      <tspan x="24" dy="34">they can never be a maximum again</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 810)">
    <rect x="0" y="0" width="940" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 940 42 L 990 42 L 990 -330 L 920 -330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="24" y="50" font-family="sans-serif" font-size="24px" fill="#303a36">2 Append the new index at the back</text>
  </g>

  
  <g transform="translate(50, 914)">
    <rect x="0" y="0" width="940" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 0 55 L -20 55 L -20 -445 L 20 -445" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="24" y="44" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" dy="0">3 If the front index is at or beyond i minus k, popleft: it fell out of</tspan>
      <tspan x="24" dy="34">the window</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1044)">
    <rect x="0" y="0" width="1500" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 26)">
      <circle cx="26" cy="16" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 52 C 6 36 16 34 26 34 C 36 34 46 36 46 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="96" y="44" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
      <tspan x="96" dy="0">a shorter person behind a taller newcomer is never the tallest while the</tspan>
      <tspan x="96" dy="32">newcomer stays</tspan>
    </text>
  </g>

  

  
  <g transform="translate(1030, 160)">
    <rect x="0" y="0" width="520" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 24)">
      <circle cx="26" cy="26" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 26 4 L 26 12 M 26 40 L 26 48 M 4 26 L 12 26 M 40 26 L 48 26 M 10 10 L 16 16 M 36 36 L 42 42 M 10 42 L 16 36 M 36 10 L 42 16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="86" y="58" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Complexity</text>
    <text x="24" y="128" font-family="sans-serif" font-size="25px" fill="#303a36">
      <tspan x="24" dy="0">Why O(n): each index enters once</tspan>
      <tspan x="24" dy="42">and leaves once, the inner loop</tspan>
      <tspan x="24" dy="42">only removes</tspan>
    </text>
  </g>

  
  <g transform="translate(1030, 495)">
    <rect x="0" y="0" width="520" height="529" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 24)">
      <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 26 14 L 26 26 L 36 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="86" y="58" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Benchmarks</text>
    <text x="24" y="130" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="24" dy="0">timing, window 1,000: deque 0.0012,</tspan>
      <tspan x="24" dy="42">0.0028, 0.0052 s for n = 10,000,</tspan>
      <tspan x="24" dy="42">20,000, 40,000; naive 0.0567,</tspan>
      <tspan x="24" dy="42">0.1184, 0.2495 s, about k times</tspan>
      <tspan x="24" dy="42">more</tspan>
    </text>
  </g>

</svg>