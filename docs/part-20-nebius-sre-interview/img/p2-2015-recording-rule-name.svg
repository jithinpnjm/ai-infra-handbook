<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Recording rule names: level, metric, operations</title>
  <desc>Visual infographic explaining Prometheus recording rule naming conventions and ratio calculation rules.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Recording rule names: level, metric, operations</text>

  

  
  <rect x="40" y="100" width="910" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g id="connected-segments">
    <rect x="70" y="125" width="850" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <line x1="315" y1="125" x2="315" y2="195" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="565" y1="125" x2="565" y2="195" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    
    <text x="495" y="169" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="32" font-weight="bold" fill="#207448">level:metric:operations</text>
  </g>

  
  <line x1="192" y1="195" x2="192" y2="235" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="440" y1="195" x2="440" y2="235" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="742" y1="195" x2="742" y2="235" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="block-level">
    <rect x="65" y="235" width="255" height="330" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(164, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="4" width="32" height="10" rx="2" />
      <rect x="6" y="22" width="44" height="10" rx="2" />
      <rect x="0" y="40" width="56" height="10" rx="2" />
    </g>
    <text x="192" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="192" dy="0">level: the</tspan>
      <tspan x="192" dy="34">aggregation</tspan>
      <tspan x="192" dy="34">level and the</tspan>
      <tspan x="192" dy="34">labels that</tspan>
      <tspan x="192" dy="34">remain</tspan>
    </text>
  </g>

  
  <g id="block-metric">
    <rect x="340" y="235" width="255" height="330" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(439, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="52" height="42" rx="4" />
      <path d="M 8 30 L 18 30 L 25 16 L 33 40 L 40 26 L 48 26" />
    </g>
    <text x="467" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="467" dy="0">metric: the</tspan>
      <tspan x="467" dy="32">metric name,</tspan>
      <tspan x="467" dy="32">with _total</tspan>
      <tspan x="467" dy="32">dropped for</tspan>
      <tspan x="467" dy="32">counters used</tspan>
      <tspan x="467" dy="32">with rate</tspan>
    </text>
  </g>

  
  <g id="block-operations">
    <rect x="615" y="235" width="255" height="330" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(714, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 16 16 M 40 40 L 45 45 M 11 45 L 16 40 M 40 16 L 45 11" />
    </g>
    <text x="742" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="742" dy="0">operations:</tspan>
      <tspan x="742" dy="34">what you</tspan>
      <tspan x="742" dy="34">applied, such</tspan>
      <tspan x="742" dy="34">as rate, sum</tspan>
      <tspan x="742" dy="34">or ratio</tspan>
    </text>
  </g>

  
  <g id="card-ratio-example">
    <rect x="40" y="615" width="910" height="325" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g id="ratio-name-display">
      <rect x="70" y="645" width="850" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(100, 663)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
        <circle cx="16" cy="14" r="5" fill="#207448" />
        <line x1="8" y1="44" x2="44" y2="10" />
        <circle cx="36" cy="40" r="5" fill="#207448" />
      </g>
      <text x="500" y="702" text-anchor="middle" font-family="'SF Mono', 'Courier New', monospace" font-size="30" font-weight="bold" fill="#207448">numerator_per_denominator:ratio</text>
    </g>

    
    <g id="ratio-note-display">
      <rect x="70" y="760" width="850" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(100, 807)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="40" height="48" rx="4" />
        <line x1="16" y1="16" x2="36" y2="16" />
        <line x1="16" y1="28" x2="36" y2="28" />
        <line x1="16" y1="40" x2="28" y2="40" />
      </g>
      <text x="500" y="822" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="500" dy="0">For ratios, join the names with _per_</tspan>
        <tspan x="500" dy="38">and use ratio as the operation</tspan>
      </text>
    </g>
  </g>

  

  
  <g id="right-panel">
    <rect x="980" y="100" width="580" height="840" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1270" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Always compute the ratio last</text>

    
    <g id="box-sum-separately">
      <rect x="1015" y="180" width="510" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="1065" cy="252" r="24" fill="#207448" />
      <text x="1065" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      
      <text x="1115" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1115" dy="0">Sum the numerator and the</tspan>
        <tspan x="1115" dy="36">denominator separately</tspan>
      </text>
    </g>

    
    <line x1="1270" y1="325" x2="1270" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="box-then-divide">
      <rect x="1015" y="365" width="510" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="1065" cy="425" r="24" fill="#207448" />
      <text x="1065" y="433" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      
      <text x="1115" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Then divide</text>
      
      <g transform="translate(1435, 397)" stroke="#207448" stroke-width="4" stroke-linecap="round">
        <circle cx="16" cy="8" r="4" fill="#207448" />
        <line x1="4" y1="28" x2="28" y2="28" />
        <circle cx="16" cy="48" r="4" fill="#207448" />
      </g>
    </g>

    
    <g id="box-red-cross">
      
      <rect x="1015" y="520" width="510" height="385" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />

      
      <g transform="translate(1270, 580)">
        <circle cx="0" cy="0" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
        <line x1="-16" y1="-16" x2="16" y2="16" stroke="#dc2626" stroke-width="5" stroke-linecap="round" />
        <line x1="16" y1="-16" x2="-16" y2="16" stroke="#dc2626" stroke-width="5" stroke-linecap="round" />
      </g>

      
      <text x="1270" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Average the per-pod ratios</text>

      
      <rect x="1045" y="715" width="450" height="155" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(1242, 735)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="28" y1="4" x2="28" y2="34" />
        <line x1="6" y1="12" x2="50" y2="12" />
        <polygon points="6,12 0,26 12,26" />
        <polygon points="50,12 44,26 56,26" />
        <line x1="16" y1="34" x2="40" y2="34" />
      </g>
      <text x="1270" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Gives every pod equal weight</text>
    </g>
  </g>

  
  <g id="bottom-takeaway-bar">
    <rect x="40" y="960" width="1520" height="65" rx="10" fill="#207448" />
    
    <g transform="translate(70, 975)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="32" x2="36" y2="32" />
      <rect x="6" y="20" width="6" height="12" fill="#ffffff" />
      <rect x="16" y="10" width="6" height="22" fill="#ffffff" />
      <rect x="26" y="4" width="6" height="28" fill="#ffffff" />
    </g>
    <text x="800" y="1001" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Keep the le label on histograms so histogram_quantile still works.</text>
  </g>
</svg>