<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>SLO platform for 1,000 endpoints: the numbers</title>
  <desc>Visual calculation chain of telemetry volume, SLO rules, and evaluation rate for 1,000 endpoints, along with rollout guidance and operational alerting principles.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">SLO platform for 1,000 endpoints: the numbers</text>

  
  <rect x="45" y="100" width="1510" height="715" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="80" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Chain of assumed inputs</text>

  
  <rect x="70" y="165" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="94" y="177" width="46" height="46" rx="6" />
    <line x1="94" y1="200" x2="140" y2="200" />
    <circle cx="106" cy="189" r="2.5" fill="#207448" />
    <line x1="116" y1="189" x2="130" y2="189" />
    <circle cx="106" cy="211" r="2.5" fill="#207448" />
    <line x1="116" y1="211" x2="130" y2="211" />
  </g>
  <circle cx="180" cy="200" r="24" fill="#207448" />
  <text x="180" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="225" y="209" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">Per replica:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 30 plain series + 4 histograms of 12 buckets = 30 + 48 = 78 series</tspan>
  </text>

  
  <line x1="800" y1="235" x2="800" y2="275" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="275" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="117" cy="290" rx="18" ry="6" />
    <path d="M 99 290 v 11 c 0 3.3 8.1 6 18 6 s 18 -2.7 18 -6 v -11" />
    <path d="M 99 301 v 11 c 0 3.3 8.1 6 18 6 s 18 -2.7 18 -6 v -11" />
  </g>
  <circle cx="180" cy="310" r="24" fill="#207448" />
  <text x="180" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="225" y="319" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">Raw series:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 1,000 endpoints x 6 replicas x 78 = 468,000</tspan>
  </text>

  
  <line x1="800" y1="345" x2="800" y2="385" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="385" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="117" cy="420" r="19" />
    <circle cx="117" cy="420" r="11" />
    <circle cx="117" cy="420" r="3" fill="#207448" />
    <line x1="117" y1="397" x2="117" y2="404" />
    <line x1="117" y1="436" x2="117" y2="443" />
    <line x1="94" y1="420" x2="101" y2="420" />
    <line x1="133" y1="420" x2="140" y2="420" />
  </g>
  <circle cx="180" cy="420" r="24" fill="#207448" />
  <text x="180" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="225" y="429" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">SLOs:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 1,000 x 4 SLIs (availability, TTFT, inter-token latency, quality) = 4,000</tspan>
  </text>

  
  <line x1="800" y1="455" x2="800" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="495" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="97" y="508" width="40" height="44" rx="5" />
    <line x1="97" y1="522" x2="137" y2="522" />
    <line x1="110" y1="522" x2="110" y2="552" />
    <line x1="124" y1="522" x2="124" y2="552" />
  </g>
  <circle cx="180" cy="530" r="24" fill="#207448" />
  <text x="180" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="225" y="539" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">Recorded series with 5 windows:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 4,000 x 5 = 20,000</tspan>
  </text>

  
  <line x1="800" y1="565" x2="800" y2="605" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="605" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 117 617 a 3 3 0 0 1 3 3 v 2 a 13 13 0 0 1 10 12 v 7 l 4 4 h -34 l 4 -4 v -7 a 13 13 0 0 1 10 -12 v -2 a 3 3 0 0 1 3 -3 z" />
    <circle cx="117" cy="651" r="2.5" fill="#207448" />
  </g>
  <circle cx="180" cy="640" r="24" fill="#207448" />
  <text x="180" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="225" y="649" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">Alert rules with 3 burn-rate pairs:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 4,000 x 3 = 12,000</tspan>
  </text>

  
  <line x1="800" y1="675" x2="800" y2="715" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="70" y="715" width="1460" height="70" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="117" cy="750" r="19" />
    <polyline points="117,737 117,750 127,750" />
    <line x1="117" y1="727" x2="117" y2="731" />
  </g>
  <circle cx="180" cy="750" r="24" fill="#207448" />
  <text x="180" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="225" y="759" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#207448">Evaluations per second at a 60 s interval:</tspan>
    <tspan font-size="25" font-weight="normal" fill="#303a36"> 12,000 / 60 = 200</tspan>
  </text>

  
  <rect x="45" y="855" width="1510" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 910 h 26 l 14 14 v 30 h -40 z" />
    <polyline points="106,910 106,924 120,924" />
    <line x1="90" y1="928" x2="100" y2="928" />
    <line x1="90" y1="936" x2="110" y2="936" />
    <line x1="90" y1="944" x2="105" y2="944" />
  </g>
  <text x="155" y="897" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="155" dy="0">teams declare SLOs in a file; a rule generator writes recording and alert rules,</tspan>
    <tspan x="155" dy="38">never hand-written 12,000 times; a generator bug ships a wrong threshold to every</tspan>
    <tspan x="155" dy="38">endpoint at once, so roll out in stages with a diff against current alert volume</tspan>
  </text>

  
  <rect x="45" y="1045" width="1510" height="105" rx="12" fill="#207448" />
  <text x="800" y="1088" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">page on symptoms and burn rate, ticket on slow burn;</tspan>
    <tspan x="800" dy="36">alert on missing data so a dead metrics store cannot stay silent</tspan>
  </text>
</svg>