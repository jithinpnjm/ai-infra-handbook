<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Five rungs out of being stuck</title>
  <desc>A staircase with five steps climbing from left to right depicting strategies when stuck, from saying it plainly to offering the slow answer, with a 30-second timer rule.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Five rungs out of being stuck</text>

  
  <path d="M 40 520 H 312 V 420 H 624 V 320 H 936 V 220 H 1248 V 120 H 1560" fill="none" stroke="#d0dfd4" stroke-width="3" stroke-dasharray="6 6"/>

  
  <rect x="40" y="520" width="272" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="85" cy="565" r="24" fill="#207448"/>
  <text x="85" y="565" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
  
  <path d="M 188 548 h 34 a 8 8 0 0 1 8 8 v 18 a 8 8 0 0 1 -8 8 h -16 l -10 10 v -10 h -8 a 8 8 0 0 1 -8 -8 v -18 a 8 8 0 0 1 8 -8 z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  <line x1="194" y1="560" x2="216" y2="560" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="194" y1="568" x2="208" y2="568" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <text x="176" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Say it</text>
  <text x="176" y="678" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">plainly</text>
  
  <line x1="64" y1="708" x2="288" y2="708" stroke="#d5e5d8" stroke-width="2"/>
  
  <rect x="56" y="726" width="240" height="224" rx="10" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5"/>
  <text x="176" y="768" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#207448">
    <tspan x="176" dy="0">I am not sure</tspan>
    <tspan x="176" dy="38">how to get</tspan>
    <tspan x="176" dy="38">below this</tspan>
    <tspan x="176" dy="38">complexity.</tspan>
  </text>

  
  <rect x="352" y="420" width="272" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="397" cy="465" r="24" fill="#207448"/>
  <text x="397" y="465" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
  
  <rect x="495" y="443" width="44" height="44" rx="6" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
  <rect x="507" y="455" width="20" height="20" rx="3" stroke="#207448" stroke-width="3" fill="#e8f1ea"/>
  
  <text x="488" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shrink the</text>
  <text x="488" y="578" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">problem</text>
  
  <line x1="376" y1="608" x2="600" y2="608" stroke="#d5e5d8" stroke-width="2"/>
  
  <rect x="368" y="626" width="240" height="224" rx="10" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5"/>
  <text x="488" y="662" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="488" dy="0">Solve a</tspan>
    <tspan x="488" dy="36">smaller case</tspan>
    <tspan x="488" dy="36">by hand and</tspan>
    <tspan x="488" dy="36">say what</tspan>
    <tspan x="488" dy="36">you see.</tspan>
  </text>

  
  <rect x="664" y="320" width="272" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="709" cy="365" r="24" fill="#207448"/>
  <text x="709" y="365" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
  
  <path d="M 829 344 a 14 14 0 0 1 11 22 c -2.5 2.5 -4 5.5 -4 9 h -14 c 0 -3.5 -1.5 -6.5 -4 -9 a 14 14 0 0 1 11 -22 z" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <line x1="824" y1="380" x2="834" y2="380" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="826" y1="385" x2="832" y2="385" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="800" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Say what</text>
  <text x="800" y="478" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">you do know</text>
  
  <line x1="688" y1="508" x2="912" y2="508" stroke="#d5e5d8" stroke-width="2"/>
  
  <rect x="680" y="526" width="240" height="224" rx="10" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5"/>
  <text x="800" y="575" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">I know the</tspan>
    <tspan x="800" dy="38">answer must</tspan>
    <tspan x="800" dy="38">visit every</tspan>
    <tspan x="800" dy="38">item once.</tspan>
  </text>

  
  <rect x="976" y="220" width="272" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1021" cy="265" r="24" fill="#207448"/>
  <text x="1021" y="265" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>
  
  <circle cx="1141" cy="265" r="22" stroke="#207448" stroke-width="3" fill="none"/>
  <path d="M 1134 256 a 7 7 0 0 1 13 4 c 0 5 -6 6 -6 11" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="1141" cy="277" r="2" fill="#207448"/>
  
  <text x="1112" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ask a</text>
  <text x="1112" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">specific</text>
  <text x="1112" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">question</text>
  
  <line x1="1000" y1="430" x2="1224" y2="430" stroke="#d5e5d8" stroke-width="2"/>
  
  <rect x="992" y="446" width="240" height="204" rx="10" fill="#e8f1ea" stroke="#b8d5bf" stroke-width="1.5"/>
  <text x="1112" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">Would a</tspan>
    <tspan x="1112" dy="34">hash map be</tspan>
    <tspan x="1112" dy="34">the right</tspan>
    <tspan x="1112" dy="34">direction</tspan>
    <tspan x="1112" dy="34">here?</tspan>
  </text>

  
  <rect x="1288" y="120" width="272" height="470" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  
  <circle cx="1333" cy="165" r="24" fill="#db8129"/>
  <text x="1333" y="165" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">5</text>
  
  <circle cx="1453" cy="165" r="14" stroke="#db8129" stroke-width="3.5" fill="none"/>
  <circle cx="1453" cy="165" r="5" fill="#db8129"/>
  <path d="M 1453 146 v -4 M 1453 188 v -4 M 1434 165 h -4 M 1476 165 h -4 M 1440 152 l -3 -3 M 1469 181 l -3 -3 M 1440 178 l -3 3 M 1469 149 l -3 3" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
  
  <text x="1424" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Offer</text>
  <text x="1424" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">the slow</text>
  <text x="1424" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">answer and</text>
  <text x="1424" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">improve it</text>
  
  <line x1="1312" y1="368" x2="1536" y2="368" stroke="#f0d5be" stroke-width="2"/>
  
  <rect x="1304" y="384" width="240" height="186" rx="10" fill="#fff8f2" stroke="#f0c299" stroke-width="1.5"/>
  <text x="1424" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1424" dy="0">The brute</tspan>
    <tspan x="1424" dy="32">force is</tspan>
    <tspan x="1424" dy="32">quadratic.</tspan>
    <tspan x="1424" dy="32">Let me write</tspan>
    <tspan x="1424" dy="32">that first.</tspan>
  </text>

  
  <rect x="1288" y="630" width="272" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  
  <path d="M 1404 680 h 40 M 1404 680 v -35 M 1404 680 q 24 0 34 -30" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <text x="1424" y="722" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1424" dy="0" font-weight="bold">Quadratic:</tspan>
    <tspan x="1424" dy="34">the work grows</tspan>
    <tspan x="1424" dy="34">with the square</tspan>
    <tspan x="1424" dy="34">of the input.</tspan>
  </text>

  
  <rect x="40" y="1020" width="1520" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="85" cy="1090" r="26" stroke="#207448" stroke-width="3.5" fill="#ffffff"/>
  <line x1="85" y1="1090" x2="85" y2="1074" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="85" y1="1090" x2="85" y2="1106" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="85" cy="1090" r="3" fill="#207448"/>
  
  <text x="135" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Never silent for more than about 30 seconds</text>
  
  <line x1="135" y1="1084" x2="1515" y2="1084" stroke="#207448" stroke-width="5" stroke-dasharray="12 8" stroke-linecap="round"/>
  
  <text x="135" y="1122" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">If you need to think, say I need a moment to think about X, then do.</text>
</svg>