<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Recording rules are built in layers named level:metric:operations</title>
  <desc>Architecture infographic illustrating Prometheus recording rules structured in hierarchical layers from raw metrics to alerts.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#db8129" />
    </marker>
    <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b3d2b" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <g id="header">
    <text x="800" y="55" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Recording rules are built in layers</text>
    <text x="800" y="105" font-family="monospace" font-size="38" font-weight="bold" fill="#303a36" text-anchor="middle">named level:metric:operations</text>
  </g>

  

  
  <g id="alerts-node" filter="url(#subtle-shadow)">
    <rect x="60" y="140" width="960" height="190" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(88, 162)">
      <path d="M 28 8 A 16 16 0 0 0 12 24 C 12 34 8 40 4 44 L 52 44 C 48 40 44 34 44 24 A 16 16 0 0 0 28 8 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 22 44 A 6 6 0 0 0 34 44" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <line x1="28" y1="4" x2="28" y2="8" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <text x="160" y="196" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Alerts on top</text>
    
    <text x="88" y="244" font-family="monospace" font-size="24" fill="#303a36">ErrorRatioHigh: ratio above 0.05 for 5m, page</text>
    
    
    <text x="88" y="280" font-family="monospace" font-size="24" fill="#303a36">KVCacheSaturated: max above 0.95 and</text>
    <text x="88" y="310" font-family="monospace" font-size="24" fill="#303a36">waiting above 0 for 10m, page</text>
  </g>

  
  <line x1="540" y1="370" x2="540" y2="338" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g id="layer-3-node" filter="url(#subtle-shadow)">
    <rect x="60" y="370" width="960" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(88, 392)">
      <path d="M 8 42 A 22 22 0 1 1 48 42" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="40" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="3.5" fill="#207448"/>
    </g>

    
    <text x="160" y="426" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Layer 3</text>
    
    <text x="88" y="476" font-family="monospace" font-size="24" fill="#303a36">model:req_seconds:p99 = histogram_quantile(0.99, layer 2 buckets)</text>
    
    <text x="88" y="522" font-family="monospace" font-size="24" fill="#303a36">model_name:vllm_kv_cache_usage_perc:max =</text>
    <text x="88" y="556" font-family="monospace" font-size="24" fill="#303a36">max by (model_name): the worst pod, not the average</text>
  </g>

  
  <line x1="540" y1="640" x2="540" y2="608" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="layer-2-node" filter="url(#subtle-shadow)">
    <rect x="60" y="640" width="960" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(88, 660)">
      <rect x="6" y="8" width="44" height="40" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="28" cy="18" r="3" fill="#207448"/>
      <circle cx="28" cy="38" r="3" fill="#207448"/>
    </g>

    <text x="160" y="694" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Layer 2</text>
    
    <text x="88" y="740" font-family="monospace" font-size="24" fill="#303a36">model:gateway_errors:ratio_rate5m = errors rate / requests rate</text>
    <text x="88" y="774" font-family="sans-serif" font-size="24" fill="#303a36">(numerator and denominator summed separately, then divided)</text>
    
    <text x="88" y="824" font-family="monospace" font-size="24" fill="#303a36">model_le:req_seconds_bucket:rate5m =</text>
    <text x="88" y="858" font-family="sans-serif" font-size="24" fill="#303a36">sum by (model, le) of the bucket rate (keep le)</text>
  </g>

  
  <line x1="540" y1="940" x2="540" y2="908" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="layer-1-node" filter="url(#subtle-shadow)">
    <rect x="60" y="940" width="960" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(88, 960)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <text x="160" y="994" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Layer 1</text>
    
    <text x="88" y="1044" font-family="monospace" font-size="24" fill="#303a36">model:gateway_requests:rate5m and model:gateway_errors:rate5m</text>
    <text x="88" y="1086" font-family="sans-serif" font-size="24" fill="#303a36">(sum by model of the rate over 5 minutes; rate first, then sum)</text>
  </g>

  
  <line x1="540" y1="1195" x2="540" y2="1163" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="raw-node" filter="url(#subtle-shadow)">
    <rect x="60" y="1195" width="960" height="205" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(88, 1215)">
      <ellipse cx="28" cy="14" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 14 L 8 40 A 20 7 0 0 0 48 40 L 48 14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 27 A 20 7 0 0 0 48 27" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>

    <text x="160" y="1250" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Bottom raw series</text>
    
    <text x="88" y="1308" font-family="monospace" font-size="24" fill="#303a36">gateway_requests_total, gateway_errors_total,</text>
    <text x="88" y="1348" font-family="monospace" font-size="24" fill="#303a36">req_seconds_bucket, vllm:kv_cache_usage_perc</text>
  </g>


  

  
  <g id="reason-panel" filter="url(#subtle-shadow)">
    <rect x="1060" y="140" width="480" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1090, 165)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="28,14 28,28 38,34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <text x="1165" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Reason</text>
    
    <text x="1090" y="258" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1090" dy="0">a dashboard that takes eight</tspan>
      <tspan x="1090" dy="36">seconds to refresh a heavy</tspan>
      <tspan x="1090" dy="36">histogram_quantile over a</tspan>
      <tspan x="1090" dy="36">week should read a</tspan>
      <tspan x="1090" dy="36">precomputed series</tspan>
    </text>
  </g>

  
  <g id="name-rule-panel" filter="url(#subtle-shadow)">
    <rect x="1060" y="520" width="480" height="880" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1090, 545)">
      <path d="M 10 24 L 24 10 L 46 10 L 46 32 L 32 46 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="36" cy="20" r="3.5" fill="#207448"/>
    </g>

    <text x="1165" y="582" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Name rule</text>
    
    <text x="1090" y="640" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1090" dy="0" font-weight="bold" fill="#207448">• level =</tspan>
      <tspan x="1090" dy="34">aggregation level and</tspan>
      <tspan x="1090" dy="34">output labels;</tspan>

      <tspan x="1090" dy="54" font-weight="bold" fill="#207448">• metric name unchanged</tspan>
      <tspan x="1090" dy="34">except stripping _total;</tspan>

      <tspan x="1090" dy="54" font-weight="bold" fill="#207448">• operations</tspan>
      <tspan x="1090" dy="34">newest first;</tspan>

      <tspan x="1090" dy="54" font-weight="bold" fill="#207448">• always a</tspan>
      <tspan x="1090" dy="34">without clause;</tspan>

      <tspan x="1090" dy="54" font-weight="bold" fill="#207448">• errors_ratio</tspan>
      <tspan x="1090" dy="34">tells a reader nothing</tspan>
    </text>
  </g>

</svg>