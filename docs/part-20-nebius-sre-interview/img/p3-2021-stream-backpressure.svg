<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110">
  <title>A slow reader holds a GPU slot unless every buffer is bounded</title>
  <desc>Infographic explaining how slow clients cause GPU slot and KV cache exhaustion across pipeline buffers, fix markers, and backpressure between pools.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1110" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="50" dy="0">A slow reader holds a GPU slot</tspan>
    <tspan x="50" dy="58">unless every buffer is bounded</tspan>
  </text>

  
  <line x1="375" y1="265" x2="442" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="767" y1="265" x2="834" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1159" y1="265" x2="1225" y2="265" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="50" y="175" width="325" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="85" cy="214" r="24" fill="#207448"/>
  <text x="85" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(300, 186)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="6" y="6" width="44" height="44" rx="4"/>
    <rect x="18" y="18" width="20" height="20" rx="2"/>
    <line x1="16" y1="0" x2="16" y2="6"/>
    <line x1="28" y1="0" x2="28" y2="6"/>
    <line x1="40" y1="0" x2="40" y2="6"/>
    <line x1="16" y1="50" x2="16" y2="56"/>
    <line x1="28" y1="50" x2="28" y2="56"/>
    <line x1="40" y1="50" x2="40" y2="56"/>
    <line x1="0" y1="16" x2="6" y2="16"/>
    <line x1="0" y1="28" x2="6" y2="28"/>
    <line x1="0" y1="40" x2="6" y2="40"/>
    <line x1="50" y1="16" x2="56" y2="16"/>
    <line x1="50" y1="28" x2="56" y2="28"/>
    <line x1="50" y1="40" x2="56" y2="40"/>
  </g>
  <text x="75" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="75" dy="0">engine</tspan>
    <tspan x="75" dy="36">generates</tspan>
    <tspan x="75" dy="36">tokens</tspan>
  </text>

  
  <rect x="442" y="175" width="325" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="477" cy="214" r="24" fill="#207448"/>
  <text x="477" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(692, 186)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="14"/>
    <path d="M28 4 L28 10 M28 46 L28 52 M4 28 L10 28 M46 28 L52 28 M11 11 L15 15 M41 41 L45 45 M11 45 L15 41 M41 11 L45 15"/>
  </g>
  <text x="467" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="467" dy="0">gateway</tspan>
    <tspan x="467" dy="36">per-stream</tspan>
    <tspan x="467" dy="36">buffer</tspan>
  </text>

  
  <rect x="834" y="175" width="325" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="869" cy="214" r="24" fill="#207448"/>
  <text x="869" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1084, 186)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="8" width="48" height="40" rx="4"/>
    <line x1="4" y1="20" x2="52" y2="20"/>
    <circle cx="12" cy="14" r="2" fill="#207448"/>
    <circle cx="20" cy="14" r="2" fill="#207448"/>
    <circle cx="28" cy="14" r="2" fill="#207448"/>
    <line x1="28" y1="28" x2="28" y2="40"/>
    <line x1="20" y1="34" x2="36" y2="34"/>
  </g>
  <text x="859" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="859" dy="0">socket buffer</tspan>
    <tspan x="859" dy="42">(TCP window)</tspan>
  </text>

  
  <rect x="1225" y="175" width="325" height="180" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <circle cx="1260" cy="214" r="24" fill="#207448"/>
  <text x="1260" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1475, 186)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="14" y="4" width="28" height="48" rx="5"/>
    <line x1="24" y1="44" x2="32" y2="44"/>
    <path d="M4 22 C4 22, 8 18, 12 18"/>
    <path d="M48 18 C52 18, 56 22, 56 22"/>
  </g>
  <text x="1250" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1250" dy="0">slow client</tspan>
    <tspan x="1250" dy="36">on a bad mobile</tspan>
    <tspan x="1250" dy="36">connection</tspan>
  </text>

  
  <rect x="442" y="380" width="325" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(460, 412)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M14 2 L2 7 L2 18 C2 25 8 31 14 34 C20 31 26 25 26 18 L26 7 Z"/>
  </g>
  <text x="502" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="502" dy="0">bound every</tspan>
    <tspan x="502" dy="30">per-stream buffer</tspan>
  </text>

  
  <rect x="834" y="380" width="325" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(852, 412)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="16" cy="17" r="14"/>
    <polyline points="16,8 16,17 23,17"/>
  </g>
  <text x="898" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="898" dy="0">set a write</tspan>
    <tspan x="898" dy="30">timeout</tspan>
  </text>

  
  <rect x="50" y="500" width="1500" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(75, 524)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="20" cy="20" r="18"/>
    <line x1="8" y1="8" x2="32" y2="32"/>
  </g>
  <text x="135" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="135" dy="0">abort the generation when the client is too slow, and the abort</tspan>
    <tspan x="135" dy="32">must reach the engine so the slot and KV cache come back</tspan>
  </text>

  
  <rect x="50" y="615" width="1500" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(80, 695)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="22" ry="8"/>
    <path d="M6 14 v28 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8 v-28"/>
    <path d="M6 28 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8"/>
  </g>
  <text x="160" y="666" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
    <tspan x="160" dy="0">reader does not read, socket buffer fills, the next write blocks or queues in your process;</tspan>
    <tspan x="160" dy="40">an async gateway can accept tokens faster than it can write them</tspan>
    <tspan x="160" dy="40">and queue them in memory without limit;</tspan>
    <tspan x="160" dy="44" font-weight="bold">the request keeps its slot and its KV cache for as long as the reader lags</tspan>
  </text>

  
  <rect x="50" y="860" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(80, 935)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="6" width="20" height="18" rx="3"/>
    <rect x="4" y="32" width="20" height="18" rx="3"/>
    <rect x="32" y="19" width="20" height="18" rx="3"/>
    <line x1="24" y1="15" x2="32" y2="25"/>
    <line x1="24" y1="41" x2="32" y2="31"/>
  </g>
  <text x="160" y="904" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">between pools:</text>
  <text x="160" y="948" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="160" dy="0">with separate prefill and decode pools the router stops sending prefill outputs</tspan>
    <tspan x="160" dy="38">to a decode pool whose queue is full and sheds new requests at the front;</tspan>
    <tspan x="160" dy="40" font-weight="bold">pressure flows backwards from the busy stage to the source</tspan>
  </text>
</svg>