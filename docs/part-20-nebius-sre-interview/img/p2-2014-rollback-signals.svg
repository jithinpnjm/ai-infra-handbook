<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Strong automatic signals roll back; weaker ones page a person</title>
  <desc>Infographic contrasting strong automated rollback signals with weaker signals that hold and page a person, alongside the three-step rollback path.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Strong automatic signals roll back; weaker ones page a person</text>

  
  <rect x="60" y="105" width="710" height="635" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="415" y="155" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Strong: roll back automatically</text>

  
  <line x1="800" y1="115" x2="800" y2="730" stroke="#207448" stroke-width="2" stroke-dasharray="8 8"/>

  
  <rect x="830" y="105" width="710" height="635" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="155" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Weaker: hold, then page a person</text>

  

  
  <rect x="85" y="185" width="660" height="115" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  
  <g transform="translate(112, 214)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 22 13 A 16 16 0 1 1 14 30" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="12,12 25,14 17,23" fill="#207448"/>
    <polygon points="28,20 22,30 28,30 24,40 36,28 30,28" fill="#207448"/>
  </g>
  <text x="185" y="252" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Canary produces zero tokens</text>

  
  <rect x="85" y="320" width="660" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(112, 349)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 22 13 A 16 16 0 1 1 14 30" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="12,12 25,14 17,23" fill="#207448"/>
    <polygon points="28,20 22,30 28,30 24,40 36,28 30,28" fill="#207448"/>
  </g>
  <text x="185" y="368" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="185" dy="0">Error rate above</tspan>
    <tspan x="185" dy="38">a hard ceiling</tspan>
  </text>

  
  <rect x="85" y="455" width="660" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(112, 484)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 22 13 A 16 16 0 1 1 14 30" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="12,12 25,14 17,23" fill="#207448"/>
    <polygon points="28,20 22,30 28,30 24,40 36,28 30,28" fill="#207448"/>
  </g>
  <text x="185" y="503" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="185" dy="0">Pod restarting or failing</tspan>
    <tspan x="185" dy="38">readiness repeatedly</tspan>
  </text>

  
  <rect x="85" y="590" width="660" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(112, 619)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 22 13 A 16 16 0 1 1 14 30" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="12,12 25,14 17,23" fill="#207448"/>
    <polygon points="28,20 22,30 28,30 24,40 36,28 30,28" fill="#207448"/>
  </g>
  <text x="185" y="638" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="185" dy="0">Quality score below the floor</tspan>
    <tspan x="185" dy="38">on the live eval probe</tspan>
  </text>

  

  
  <rect x="855" y="235" width="660" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(885, 274)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#d97706" stroke-width="3.5"/>
    <rect x="18" y="16" width="7" height="24" rx="3" fill="#d97706"/>
    <rect x="31" y="16" width="7" height="24" rx="3" fill="#d97706"/>
  </g>
  <text x="965" y="312" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Latency ratios</text>

  
  <rect x="855" y="420" width="660" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(885, 477)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#d97706" stroke-width="3.5"/>
    <rect x="18" y="16" width="7" height="24" rx="3" fill="#d97706"/>
    <rect x="31" y="16" width="7" height="24" rx="3" fill="#d97706"/>
  </g>
  <text x="965" y="490" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">finish_reason shifts</text>
  <text x="965" y="538" font-family="sans-serif" font-size="24" fill="#303a36">Need a baseline and enough traffic</text>

  
  <rect x="60" y="765" width="1480" height="295" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="90" y="795" width="380" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="132" cy="840" r="24" fill="#207448"/>
  <text x="132" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(175, 812)">
    <rect x="0" y="8" width="56" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="12" y1="26" x2="44" y2="26" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="26" r="3" fill="#207448"/>
    <circle cx="42" cy="26" r="3" fill="#207448"/>
    <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="3.5"/>
    <circle cx="28" cy="0" r="2.5" fill="#207448"/>
  </g>
  
  <text x="115" y="925" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="115" dy="0">Router weight</tspan>
    <tspan x="115" dy="40">change: seconds</tspan>
  </text>

  
  <line x1="472" y1="912" x2="520" y2="912" stroke="#207448" stroke-width="4"/>
  <polygon points="534,912 516,904 516,920" fill="#207448"/>

  
  <rect x="540" y="795" width="380" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="582" cy="840" r="24" fill="#207448"/>
  <text x="582" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(625, 812)">
    <path d="M 28 4 L 52 16 L 28 28 L 4 16 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 4 16 L 4 42 L 28 54 L 52 42 L 52 16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="28" y1="28" x2="28" y2="54" stroke="#207448" stroke-width="3.5"/>
  </g>
  
  <text x="565" y="925" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="565" dy="0">Pod replacement:</tspan>
    <tspan x="565" dy="40">a cold start</tspan>
  </text>

  
  <line x1="922" y1="912" x2="970" y2="912" stroke="#207448" stroke-width="4"/>
  <polygon points="984,912 966,904 966,920" fill="#207448"/>

  
  <rect x="990" y="795" width="520" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1032" cy="840" r="24" fill="#207448"/>
  <text x="1032" y="848" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(1075, 812)">
    <ellipse cx="28" cy="12" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 4 12 L 4 28 A 24 8 0 0 0 52 28 L 52 12" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 4 28 L 4 44 A 24 8 0 0 0 52 44 L 52 28" fill="none" stroke="#207448" stroke-width="3.5"/>
  </g>
  
  <text x="1015" y="910" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1015" dy="0">Previous version id</tspan>
    <tspan x="1015" dy="38">still in the weights hub</tspan>
    <tspan x="1015" dy="38">and cached on nodes</tspan>
  </text>

  
  <rect x="60" y="1085" width="1480" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1132" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep the old replicas alive until the new version has carried traffic.</text>
</svg>