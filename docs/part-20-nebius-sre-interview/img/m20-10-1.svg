<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Why the p99 of a fan-out is worse than the p99 of one call</title>
  <desc>Flowchart showing one request fanning out to Call 1, Call 2, and Call N, waiting for the slowest, resulting in latency equal to the maximum of N calls.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 15 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Why the p99 of a fan-out is worse</tspan>
    <tspan x="800" dy="56">than the p99 of one call</tspan>
  </text>

  
  <rect x="70" y="370" width="260" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="172" y="414" width="56" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <line x1="172" y1="426" x2="228" y2="426" stroke="#207448" stroke-width="3" />
  <circle cx="182" cy="420" r="2.5" fill="#207448" />
  <circle cx="190" cy="420" r="2.5" fill="#207448" />
  <circle cx="198" cy="420" r="2.5" fill="#207448" />
  <line x1="184" y1="438" x2="216" y2="438" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="184" y1="446" x2="204" y2="446" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="200" y="520" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">One request</text>

  
  <rect x="420" y="220" width="220" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="530" cy="262" r="14" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <circle cx="530" cy="262" r="5" fill="#207448" />
  <line x1="530" y1="242" x2="530" y2="247" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="530" y1="277" x2="530" y2="282" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="510" y1="262" x2="515" y2="262" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="545" y1="262" x2="550" y2="262" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="248" x2="520" y2="252" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="272" x2="544" y2="276" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="276" x2="520" y2="272" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="252" x2="544" y2="248" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="530" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Call 1</text>

  
  <rect x="420" y="415" width="220" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="530" cy="457" r="14" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <circle cx="530" cy="457" r="5" fill="#207448" />
  <line x1="530" y1="437" x2="530" y2="442" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="530" y1="472" x2="530" y2="477" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="510" y1="457" x2="515" y2="457" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="545" y1="457" x2="550" y2="457" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="443" x2="520" y2="447" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="467" x2="544" y2="471" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="471" x2="520" y2="467" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="447" x2="544" y2="443" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="530" y="517" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Call 2</text>

  
  <rect x="420" y="610" width="220" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="530" cy="652" r="14" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <circle cx="530" cy="652" r="5" fill="#207448" />
  <line x1="530" y1="632" x2="530" y2="637" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="530" y1="667" x2="530" y2="672" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="510" y1="652" x2="515" y2="652" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="545" y1="652" x2="550" y2="652" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="638" x2="520" y2="642" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="662" x2="544" y2="666" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="516" y1="666" x2="520" y2="662" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="540" y1="642" x2="544" y2="638" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="530" y="712" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Call N</text>

  
  <rect x="730" y="360" width="340" height="240" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  <circle cx="900" cy="425" r="26" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <line x1="900" y1="393" x2="900" y2="399" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="894" y1="393" x2="906" y2="393" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <polyline points="900 411 900 425 914 425" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="900" cy="425" r="3" fill="#db8129" />
  <text x="900" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="900" dy="0">Wait for the</tspan>
    <tspan x="900" dy="38">slowest</tspan>
  </text>

  
  <rect x="1160" y="360" width="360" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <path d="M 1314 442 A 28 28 0 1 1 1366 442" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="1340" y1="432" x2="1358" y2="414" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <circle cx="1340" cy="432" r="4" fill="#207448" />
  <text x="1340" y="505" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1340" dy="0">Latency =</tspan>
    <tspan x="1340" dy="38">max of N calls</tspan>
  </text>

  
  
  <path d="M 330 420 C 380 420, 370 285, 420 285" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  
  <path d="M 330 480 L 420 480" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  
  <path d="M 330 540 C 380 540, 370 675, 420 675" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />

  
  <path d="M 640 285 C 690 285, 680 420, 730 420" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  
  <path d="M 640 480 L 730 480" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  
  <path d="M 640 675 C 690 675, 680 540, 730 540" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />

  
  <path d="M 1070 480 L 1160 480" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
</svg>