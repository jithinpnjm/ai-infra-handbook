<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>eBPF and BCC observability tools mapped to Linux kernel subsystems</title>
  <desc>Architecture diagram mapping opensnoop, runqlat, runqlen, offcputime, cachestat, oomkill, biolatency, biotop, and biosnoop to Linux subsystems.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">eBPF and BCC observability tools mapped to Linux kernel subsystems</text>

  
  <g>
    <rect x="40" y="90" width="1150" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="65" y="108" width="44" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="65" y1="120" x2="109" y2="120" stroke="#207448" stroke-width="3"/>
    <circle cx="75" cy="114" r="2.5" fill="#207448"/>
    <circle cx="83" cy="114" r="2.5" fill="#207448"/>
    <text x="130" y="139" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">User Space Applications and Runtimes</text>
  </g>

  
  <g>
    <rect x="40" y="185" width="1150" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="65" y="238" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">System Call Interface</text>
    
    
    <rect x="490" y="197" width="680" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="510" y="236" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">opensnoop</text>
    <text x="665" y="236" font-family="sans-serif" font-size="24" fill="#303a36">(tracing opened files)</text>
  </g>

  
  <g>
    <rect x="40" y="290" width="370" height="910" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="65" y="310" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="76" y="321" width="24" height="24" fill="#207448"/>
    <line x1="73" y1="310" x2="73" y2="304" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="310" x2="88" y2="304" stroke="#207448" stroke-width="3"/>
    <line x1="103" y1="310" x2="103" y2="304" stroke="#207448" stroke-width="3"/>
    <line x1="73" y1="356" x2="73" y2="362" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="356" x2="88" y2="362" stroke="#207448" stroke-width="3"/>
    <line x1="103" y1="356" x2="103" y2="362" stroke="#207448" stroke-width="3"/>
    
    <text x="125" y="344" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU &amp; Scheduler</text>

    
    <rect x="55" y="375" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="225" y="408" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="225" dy="0">Process Scheduler</tspan>
      <tspan x="225" dy="30">and Run Queue</tspan>
    </text>

    
    <rect x="55" y="470" width="340" height="225" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="75" y="505" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">runqlat</text>
    <text x="75" y="538" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">measures wake-to-</tspan>
      <tspan x="75" dy="30">switch latency</tspan>
    </text>
    
    <rect x="70" y="605" width="310" height="75" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
    <text x="225" y="635" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="225" dy="0">high overhead,</tspan>
      <tspan x="225" dy="28">over 1M events/sec</tspan>
    </text>

    
    <rect x="55" y="710" width="340" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="75" y="745" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">runqlen</text>
    <text x="75" y="780" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">99 Hz sampling of</tspan>
      <tspan x="75" dy="30">queue depth</tspan>
    </text>
    <rect x="75" y="835" width="190" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="170" y="864" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">low overhead</text>

    
    <rect x="55" y="910" width="340" height="275" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="75" y="945" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">offcputime</text>
    <text x="75" y="985" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">context-switch wait</tspan>
      <tspan x="75" dy="32">reasons feeding</tspan>
      <tspan x="75" dy="32">off-CPU flame</tspan>
      <tspan x="75" dy="32">graphs</tspan>
    </text>
  </g>

  
  <g>
    <rect x="430" y="290" width="370" height="910" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="455" y="310" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="455" y1="324" x2="501" y2="324" stroke="#207448" stroke-width="2"/>
    <line x1="455" y1="340" x2="501" y2="340" stroke="#207448" stroke-width="2"/>
    <circle cx="467" cy="332" r="3" fill="#207448"/>
    <circle cx="489" cy="332" r="3" fill="#207448"/>
    
    
    <text x="635" y="332" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="635" dy="0">Memory</tspan>
      <tspan x="635" dy="32">Management</tspan>
    </text>

    
    <rect x="445" y="385" width="340" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="615" y="428" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">VFS / Page Cache</text>

    
    <rect x="445" y="470" width="340" height="170" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="465" y="505" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">cachestat</text>
    <text x="465" y="545" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="465" dy="0">kprobes checking</tspan>
      <tspan x="465" dy="32">page cache hits</tspan>
    </text>

    
    <rect x="445" y="660" width="340" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="615" y="703" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">MM / OOM Killer</text>

    
    <rect x="445" y="745" width="340" height="210" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="465" y="785" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">oomkill</text>
    <text x="465" y="825" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="465" dy="0">tracing SIGKILL</tspan>
      <tspan x="465" dy="32">invocation and</tspan>
      <tspan x="465" dy="32">victim stats</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="290" width="370" height="910" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="845" y="310" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <ellipse cx="868" cy="324" rx="15" ry="5" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 853,324 v 16 a 15 5 0 0 0 30 0 v -16" fill="none" stroke="#207448" stroke-width="2"/>

    
    <text x="1035" y="332" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1035" dy="0">Storage &amp;</tspan>
      <tspan x="1035" dy="32">Block Layer</tspan>
    </text>

    
    <rect x="835" y="385" width="340" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1005" y="415" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1005" dy="0">Block Device Queue</tspan>
      <tspan x="1005" dy="28">and Drivers</tspan>
    </text>

    
    <rect x="835" y="470" width="340" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="855" y="505" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">biolatency</text>
    <text x="855" y="545" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">latency distribution</tspan>
      <tspan x="855" dy="32">histogram in</tspan>
      <tspan x="855" dy="32">power-of-two</tspan>
      <tspan x="855" dy="32">buckets</tspan>
    </text>

    
    <rect x="835" y="720" width="340" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="855" y="755" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">biotop</text>
    <text x="855" y="795" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">top processes</tspan>
      <tspan x="855" dy="32">by I/O</tspan>
    </text>

    
    <rect x="835" y="885" width="340" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="855" y="920" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">biosnoop</text>
    <text x="855" y="960" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">individual I/O</tspan>
      <tspan x="855" dy="32">requests with</tspan>
      <tspan x="855" dy="32">latency</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1215" y="90" width="345" height="1225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="1255" cy="130" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 1245,130 h 20 M 1255,120 v 20" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="1235" y="175" width="305" height="290" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1255" y="220" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">BCC</text>
    <text x="1255" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1255" dy="0">80+ prepackaged</tspan>
      <tspan x="1255" dy="34">tools for complex</tspan>
      <tspan x="1255" dy="34">multi-probe</tspan>
      <tspan x="1255" dy="34">diagnostics</tspan>
    </text>

    
    <rect x="1235" y="485" width="305" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1255" y="530" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">bpftrace</text>
    <text x="1255" y="575" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1255" dy="0">one-liner scripts</tspan>
      <tspan x="1255" dy="34">for ad-hoc custom</tspan>
      <tspan x="1255" dy="34">questions</tspan>
    </text>

    
    <rect x="1235" y="780" width="305" height="340" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
    <text x="1387" y="830" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">RULE</text>
    <line x1="1255" y1="845" x2="1520" y2="845" stroke="#207448" stroke-width="2"/>
    <text x="1255" y="890" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1255" dy="0">identify</tspan>
      <tspan x="1255" dy="34">bottlenecked</tspan>
      <tspan x="1255" dy="34">resource first,</tspan>
      <tspan x="1255" dy="44">sample before</tspan>
      <tspan x="1255" dy="34">tracing</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1225" width="1150" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="65" y="1245" width="46" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="65" y1="1268" x2="111" y2="1268" stroke="#207448" stroke-width="2"/>
    <circle cx="77" cy="1257" r="3" fill="#207448"/>
    <circle cx="77" cy="1280" r="3" fill="#207448"/>
    <text x="135" y="1280" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Physical Hardware (CPUs, System RAM, NVMe/Disks)</text>
  </g>
</svg>