<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>How Linux frees memory: four drawers, each costlier than the last</title>
  <desc>Visual explanation of Linux memory reclaim stages: free list, page cache, swap, and OOM killer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#303a36">How Linux frees memory: four drawers, each costlier than the last</text>
  <text x="800" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#207448">Free memory is the first drawer, not the whole cupboard.</text>

  
  <g id="setting-swappiness">
    <rect x="520" y="125" width="560" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
    <text x="800" y="153" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">vm.swappiness</text>
    <text x="800" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">0 to 100, default 60</text>
    <text x="800" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">tilts the choice between swap and cache</text>
  </g>

  
  <g id="drawer-1">
    <rect x="60" y="360" width="310" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="165" y="374" width="100" height="8" rx="4" fill="#207448" opacity="0.3" />
    
    <circle cx="102" cy="412" r="22" fill="#207448" />
    <text x="102" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <circle cx="235" cy="412" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 226 412 L 232 418 L 244 406" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="215" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">free list</text>
    <text x="215" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">empty memory</text>
    <text x="215" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">opened first</text>
  </g>

  
  <path d="M 370 475 H 400 V 445 H 426" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="drawer-2">
    <rect x="430" y="300" width="310" height="290" rx="8" fill="#d0e2d3" stroke="#207448" stroke-width="2.5" />
    
    <rect x="535" y="314" width="100" height="8" rx="4" fill="#207448" opacity="0.3" />
    
    <circle cx="472" cy="352" r="22" fill="#207448" />
    <text x="472" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(585, 332)">
      <rect x="0" y="0" width="28" height="36" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="10" x2="22" y2="10" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="18" x2="22" y2="18" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="26" x2="16" y2="26" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    
    <text x="585" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">page cache</text>
    <text x="585" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="585" dy="0">clean file pages</tspan>
      <tspan x="585" dy="28">dropped</tspan>
    </text>
    <text x="585" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="585" dy="0">data can be read</tspan>
      <tspan x="585" dy="28">again from disk</tspan>
    </text>
  </g>

  
  <path d="M 740 445 H 770 V 415 H 796" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="drawer-3">
    <rect x="800" y="240" width="310" height="350" rx="8" fill="#b4d2bb" stroke="#207448" stroke-width="2.5" />
    
    <rect x="905" y="254" width="100" height="8" rx="4" fill="#207448" opacity="0.3" />
    
    <circle cx="842" cy="292" r="22" fill="#207448" />
    <text x="842" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(955, 272)">
      <ellipse cx="18" cy="8" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 8 V 30 C 0 35 36 35 36 30 V 8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 19 C 0 24 36 24 36 19" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="955" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">swap</text>
    <text x="955" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="955" dy="0">application pages</tspan>
      <tspan x="955" dy="28">written out</tspan>
    </text>
    <text x="955" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">slow</text>
  </g>

  
  <path d="M 1110 415 H 1140 V 385 H 1166" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="drawer-4">
    <rect x="1170" y="180" width="310" height="410" rx="8" fill="#98c1a1" stroke="#db8129" stroke-width="4.5" />
    
    <rect x="1275" y="194" width="100" height="8" rx="4" fill="#db8129" opacity="0.4" />
    
    <circle cx="1212" cy="232" r="22" fill="#207448" />
    <text x="1212" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(1325, 212)">
      <polygon points="18,2 34,34 2,34" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="18" y1="13" x2="18" y2="22" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="18" cy="28" r="2" fill="#db8129" />
    </g>
    
    <text x="1325" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">OOM killer</text>
    <text x="1325" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">last resort</text>
  </g>

  

  
  <g id="card-memavailable">
    <rect x="100" y="645" width="670" height="130" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(130, 685)">
      <rect x="6" y="6" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="14" y1="0" x2="14" y2="6" stroke="#207448" stroke-width="2.5" />
      <line x1="24" y1="0" x2="24" y2="6" stroke="#207448" stroke-width="2.5" />
      <line x1="34" y1="0" x2="34" y2="6" stroke="#207448" stroke-width="2.5" />
      <line x1="14" y1="42" x2="14" y2="48" stroke="#207448" stroke-width="2.5" />
      <line x1="24" y1="42" x2="24" y2="48" stroke="#207448" stroke-width="2.5" />
      <line x1="34" y1="42" x2="34" y2="48" stroke="#207448" stroke-width="2.5" />
      <path d="M 16 24 L 22 30 L 32 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="210" y="695">
      <tspan font-family="monospace" font-size="28" font-weight="bold" fill="#207448">MemAvailable</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"> from </tspan>
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#207448">/proc/meminfo</tspan>
    </text>
    <text x="210" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">memory available without swapping</text>
  </g>

  
  <g id="card-memfree">
    <rect x="830" y="645" width="670" height="130" rx="10" fill="#e5e8e6" stroke="#8e9992" stroke-width="2.5" />
    
    <line x1="835" y1="770" x2="1495" y2="650" stroke="#8e9992" stroke-width="3" stroke-dasharray="10,6" opacity="0.6" />
    
    <g transform="translate(860, 685)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#8e9992" stroke-width="3.5" />
      <line x1="10" y1="38" x2="38" y2="10" stroke="#8e9992" stroke-width="3.5" />
    </g>
    
    <text x="940" y="695" font-family="monospace" font-size="28" font-weight="bold" fill="#66726a">MemFree</text>
    <text x="940" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#505a54">do not alert on this</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="100" y="825" width="1400" height="80" rx="10" fill="#207448" />
    <text x="800" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Alert on <tspan font-family="monospace">MemAvailable</tspan> and memory pressure, never on <tspan font-family="monospace">MemFree</tspan>.
    </text>
  </g>
</svg>