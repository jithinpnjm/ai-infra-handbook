<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Token bucket: a savings account for requests</title>
  <desc>SVG infographic explaining token bucket rate limiting mechanics, refill, allow decision, timeline phases, memory usage, test scenario, and comparison with other rate limiting algorithms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Token bucket: a savings account for requests</text>

  
  <rect x="40" y="125" width="480" height="205" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="95" cy="170" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="95,156 95,170 107,170" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="70" y="222" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">refill: rate tokens</tspan>
    <tspan x="70" dy="28">per second, up to burst,</tspan>
    <tspan x="70" dy="28">computed from the</tspan>
    <tspan x="70" dy="28">elapsed time on each call</tspan>
  </text>

  
  <path d="M 520 227 L 640 227" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="40" y="348" width="480" height="157" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="70" y="375" width="42" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="81" y1="365" x2="81" y2="375" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="101" y1="365" x2="101" y2="375" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="81" y1="417" x2="81" y2="427" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="101" y1="417" x2="101" y2="427" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="386" x2="70" y2="386" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="406" x2="70" y2="406" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="112" y1="386" x2="122" y2="386" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="112" y1="406" x2="122" y2="406" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="135" y="415" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">two numbers per key:</tspan>
    <tspan x="135" dy="32">level and last time</tspan>
  </text>

  
  <rect x="560" y="125" width="480" height="380" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="800" cy="155" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 776 155 L 776 180 Q 800 192 824 180 L 824 155" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 648 315 L 670 435 Q 800 465 930 435 L 952 315 Z" fill="#e8f1ea" />
  <path d="M 640 215 L 670 435 Q 800 465 930 435 L 960 215" fill="none" stroke="#db8129" stroke-width="5" />
  <ellipse cx="800" cy="215" rx="160" ry="24" fill="#ffffff" stroke="#db8129" stroke-width="5" />

  
  <path d="M 648 315 Q 800 335 952 315" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" />

  
  <circle cx="760" cy="395" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="800" cy="400" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="840" cy="395" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="780" cy="365" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <circle cx="820" cy="365" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <text x="800" y="265" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">bucket: level,</tspan>
    <tspan x="800" dy="36">capped at burst</tspan>
  </text>

  
  <path d="M 960 227 L 1080 227" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1080" y="125" width="480" height="205" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 1135 150 L 1157 160 L 1157 175 Q 1157 195 1135 204 Q 1113 195 1113 175 L 1113 160 Z" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="1126,176 1133,183 1146,170" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="1110" y="222" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1110" dy="0">allow(now): if level is</tspan>
    <tspan x="1110" dy="28">at least cost, subtract</tspan>
    <tspan x="1110" dy="28">cost and return True,</tspan>
    <tspan x="1110" dy="28">else False</tspan>
  </text>

  
  <rect x="1080" y="348" width="480" height="157" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 1115 405 A 24 24 0 1 1 1155 405" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1135" y1="405" x2="1148" y2="390" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="1175" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">rate 5, burst 10,</tspan>
  </text>
  <text x="1110" y="420" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1110" dy="0">offered 100 requests a second</tspan>
    <tspan x="1110" dy="28">for 60 seconds:</tspan>
    <tspan x="1110" dy="28">between 300 and 310 pass</tspan>
  </text>

  
  
  <rect x="40" y="530" width="480" height="195" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="85" cy="575" r="24" fill="#207448" />
  <text x="85" y="583" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <circle cx="465" cy="575" r="20" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="465" y1="563" x2="465" y2="575" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="465" y1="575" x2="475" y2="575" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="70" y="640" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="70" dy="0">idle: bucket fills</tspan>
    <tspan x="70" dy="36">up to burst</tspan>
  </text>

  
  <line x1="520" y1="627" x2="560" y2="627" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />

  
  <rect x="560" y="530" width="480" height="195" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="605" cy="575" r="24" fill="#207448" />
  <text x="605" y="583" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <polygon points="985,555 970,578 983,578 975,597 998,572 985,572" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  
  <text x="590" y="640" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="590" dy="0">burst: spends the saved</tspan>
    <tspan x="590" dy="36">tokens at once, all allowed</tspan>
  </text>

  
  <line x1="1040" y1="627" x2="1080" y2="627" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />

  
  <rect x="1080" y="530" width="480" height="195" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1125" cy="575" r="24" fill="#207448" />
  <text x="1125" y="583" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <path d="M 1485 560 L 1515 560 L 1504 577 L 1504 592 L 1496 592 L 1496 577 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  
  <text x="1110" y="640" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="1110" dy="0">empty: only as fast as</tspan>
    <tspan x="1110" dy="36">the refill rate</tspan>
  </text>

  
  <rect x="40" y="750" width="1520" height="340" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <line x1="1485" y1="768" x2="1525" y2="768" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1505" y1="768" x2="1505" y2="798" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1495" y1="798" x2="1515" y2="798" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 1480 782 L 1490 782" stroke="#207448" stroke-width="3" />
  <path d="M 1520 782 L 1530 782" stroke="#207448" stroke-width="3" />

  
  <rect x="55" y="765" width="1490" height="68" rx="10" fill="#e8f1ea" />
  <text x="75" y="807" font-family="sans-serif" font-size="24" fill="#303a36">Fixed window: one counter, up to 2x the limit across a boundary</text>

  
  <rect x="55" y="845" width="1490" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1" />
  <text x="75" y="887" font-family="sans-serif" font-size="24" fill="#303a36">Sliding log: one timestamp per accepted request, exact</text>

  
  <rect x="55" y="925" width="1490" height="68" rx="10" fill="#e8f1ea" />
  <text x="75" y="967" font-family="sans-serif" font-size="24" fill="#303a36">Sliding window counter: two counters, approximate</text>

  
  <rect x="55" y="1005" width="1490" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1" />
  <text x="75" y="1047" font-family="sans-serif" font-size="24" fill="#303a36">Leaky bucket: a queue that drains at a fixed rate, output smooth, rejects short bursts a backend could take</text>

  
  <rect x="40" y="1115" width="1520" height="65" rx="12" fill="#207448" />
  <text x="800" y="1156" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Say token bucket for APIs and name the fixed window boundary burst as the reason not to use it.</text>
</svg>