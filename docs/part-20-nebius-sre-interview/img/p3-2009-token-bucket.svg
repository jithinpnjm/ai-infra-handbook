<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Token bucket: a savings account for requests</title>
  <desc>Visual explanation of the token bucket rate limiting algorithm, refilling logic, consumption, operational phases, and comparison with alternatives.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1380" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">Token bucket: a savings account for requests</text>

  

  
  <rect x="50" y="120" width="530" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="100" cy="175" r="26" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="100,160 100,175 114,175" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="145" y="170" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Refill Engine</text>
  <text x="145" y="200" font-family="sans-serif" font-size="24px" fill="#303a36">computed lazily on incoming call</text>
  
  <text x="75" y="260" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="75" dy="0">refill: rate tokens per second,</tspan>
    <tspan x="75" dy="34">up to burst, computed from the elapsed</tspan>
    <tspan x="75" dy="34">time on each call</tspan>
  </text>

  
  <path d="M 580,235 L 665,235" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />

  
  
  <g id="token-bucket">
    
    <path d="M 696,285 L 904,285 L 888,385 L 712,385 Z" fill="#cbe2d1" opacity="0.8" />
    
    
    <ellipse cx="800" cy="355" rx="55" ry="14" fill="#207448" opacity="0.35" />
    <ellipse cx="800" cy="335" rx="60" ry="14" fill="#207448" opacity="0.5" />
    <ellipse cx="800" cy="315" rx="65" ry="14" fill="#207448" opacity="0.75" />

    
    <line x1="680" y1="285" x2="920" y2="285" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" />
    <text x="800" y="275" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">current level</text>

    
    
    <path d="M 670,160 L 715,400 Q 720,415 745,415 L 855,415 Q 880,415 885,400 L 930,160" fill="none" stroke="#db8129" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <line x1="655" y1="160" x2="945" y2="160" stroke="#db8129" stroke-width="6" stroke-linecap="round" />

    
    <rect x="660" y="430" width="280" height="70" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="800" y="460" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">bucket: level,</tspan>
      <tspan x="800" dy="30">capped at burst</tspan>
    </text>
  </g>

  
  <path d="M 935,275 L 1020,275" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />

  
  <rect x="1035" y="120" width="515" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 1085,150 L 1115,160 L 1115,185 Q 1115,205 1085,215 Q 1055,205 1055,185 L 1055,160 Z" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="1075,182 1083,190 1100,172" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1135" y="170" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Request Gate</text>
  <text x="1135" y="200" font-family="sans-serif" font-size="24px" fill="#303a36">atomic check &amp; decrement</text>
  
  <text x="1060" y="260" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="1060" dy="0">allow(now): if level is at least cost,</tspan>
    <tspan x="1060" dy="34">subtract cost and return True,</tspan>
    <tspan x="1060" dy="34">else False</tspan>
  </text>


  

  
  <rect x="50" y="525" width="670" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 555)">
    <ellipse cx="30" cy="18" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 4,18 L 4,50 Q 30,62 56,50 L 56,18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 4,34 Q 30,46 56,34" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="160" y="575" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Compact Storage Overhead</text>
  <text x="160" y="625" font-family="sans-serif" font-size="24px" fill="#303a36">two numbers per key: level and last time</text>


  
  
  <rect x="760" y="525" width="790" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="815" cy="600" r="28" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  <polyline points="803,600 812,610 829,591" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="865" y="575" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Simulation Example</text>
  
  <text x="865" y="618" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="865" dy="0">rate 5, burst 10, offered 100 requests a second</tspan>
    <tspan x="865" dy="34">for 60 seconds: between 300 and 310 pass</tspan>
  </text>


  

  
  <rect x="50" y="700" width="1500" height="195" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="738" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Lifecycle Phases</text>

  
  <rect x="75" y="755" width="430" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="110" cy="795" r="18" fill="#207448" />
  <text x="110" y="802" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="140" y="802" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Phase: Inactive</text>
  <text x="95" y="845" font-family="sans-serif" font-size="24px" fill="#303a36">idle: bucket fills up to burst</text>

  
  <path d="M 515,815 L 560,815" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="575" y="755" width="450" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="610" cy="795" r="18" fill="#207448" />
  <text x="610" y="802" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="640" y="802" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Phase: Spike</text>
  <text x="590" y="835" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="590" dy="0">burst: spends the saved tokens at</tspan>
    <tspan x="590" dy="28">once, all allowed</tspan>
  </text>

  
  <path d="M 1035,815 L 1080,815" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1095" y="755" width="435" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="1130" cy="795" r="18" fill="#207448" />
  <text x="1130" y="802" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1160" y="802" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Phase: Steady State</text>
  <text x="1115" y="835" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="1115" dy="0">empty: only as fast as the refill</tspan>
    <tspan x="1115" dy="28">rate</tspan>
  </text>


  

  
  <rect x="50" y="920" width="1500" height="305" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="955" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Comparison with Other Rate Limiters</text>

  
  <rect x="75" y="970" width="1450" height="50" rx="8" fill="#ffffff" stroke="#c4d9ca" stroke-width="1.5" />
  <circle cx="100" cy="995" r="8" fill="#207448" />
  <text x="125" y="1003" font-family="sans-serif" font-size="24px" fill="#303a36">Fixed window: one counter, up to 2x the limit across a boundary</text>

  
  <rect x="75" y="1030" width="1450" height="50" rx="8" fill="#ffffff" stroke="#c4d9ca" stroke-width="1.5" />
  <circle cx="100" cy="1055" r="8" fill="#207448" />
  <text x="125" y="1063" font-family="sans-serif" font-size="24px" fill="#303a36">Sliding log: one timestamp per accepted request, exact</text>

  
  <rect x="75" y="1090" width="1450" height="50" rx="8" fill="#ffffff" stroke="#c4d9ca" stroke-width="1.5" />
  <circle cx="100" cy="1115" r="8" fill="#207448" />
  <text x="125" y="1123" font-family="sans-serif" font-size="24px" fill="#303a36">Sliding window counter: two counters, approximate</text>

  
  <rect x="75" y="1150" width="1450" height="60" rx="8" fill="#ffffff" stroke="#c4d9ca" stroke-width="1.5" />
  <circle cx="100" cy="1180" r="8" fill="#207448" />
  <text x="125" y="1188" font-family="sans-serif" font-size="24px" fill="#303a36">Leaky bucket: a queue that drains at a fixed rate, output smooth, rejects short bursts a backend could take</text>


  

  <rect x="50" y="1255" width="1500" height="75" rx="14" fill="#207448" />
  <text x="800" y="1302" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">Say token bucket for APIs and name the fixed window boundary burst as the reason not to use it.</text>

</svg>