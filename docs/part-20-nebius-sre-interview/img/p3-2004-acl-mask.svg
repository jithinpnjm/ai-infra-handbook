<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <title>Why chmod 640 silently cut a user's ACL write right</title>
  <desc>Visual infographic explaining how chmod mode bits define the ACL mask and cut effective permissions</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Why chmod 640 silently cut a user's ACL write right</text>

  
  <rect x="40" y="130" width="320" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="85" cy="180" r="24" fill="#207448" />
  <text x="85" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  
  <rect x="125" y="152" width="40" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="135" y1="168" x2="155" y2="168" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="135" y1="180" x2="155" y2="180" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <polyline points="135,192 143,195 135,198" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  
  <text x="180" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Deploy script</tspan>
    <tspan x="180" dy="34">grants write</tspan>
  </text>

  
  <rect x="65" y="240" width="270" height="135" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <text x="85" y="288" font-family="monospace" font-size="26" fill="#303a36">user:12345:rw-</text>
  <text x="85" y="342" font-family="monospace" font-size="26" fill="#303a36">mask::rw-</text>

  
  <rect x="65" y="405" width="270" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="200" y="448" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">effective: rw-</text>

  
  <text x="450" y="305" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">chmod 640</text>
  <line x1="360" y1="325" x2="540" y2="325" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="540" y="130" width="560" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="585" cy="180" r="24" fill="#207448" />
  <text x="585" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  
  <path d="M 625 160 L 647 152 L 669 160 C 669 188 647 206 647 206 C 647 206 625 188 625 160 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

  
  <text x="685" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">After the hardening job</text>

  
  <rect x="560" y="235" width="520" height="180" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <text x="580" y="275" font-family="monospace" font-size="24" fill="#303a36">ls -l shows -rw-r-----+</text>
  <text x="580" y="325" font-family="monospace" font-size="24" fill="#303a36">user:12345:rw-    #effective:r--</text>

  
  <rect x="575" y="352" width="490" height="48" rx="6" fill="#fdf4eb" stroke="#db8129" stroke-width="2" />
  <text x="590" y="384" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">mask::r--</text>

  
  <text x="820" y="455" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="820" dy="0">The group bits of the mode</tspan>
    <tspan x="820" dy="30">are the mask</tspan>
  </text>

  
  <text x="1210" y="285" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1210" dy="0">setfacl -m</tspan>
    <tspan x="1210" dy="28">m::rw FILE</tspan>
  </text>
  <line x1="1100" y1="325" x2="1320" y2="325" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1320" y="130" width="240" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="1365" cy="180" r="24" fill="#207448" />
  <text x="1365" y="188" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  
  <circle cx="1415" cy="180" r="20" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="1406,180 1412,187 1425,173" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  
  <text x="1450" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1450" dy="0">After the</tspan>
    <tspan x="1450" dy="34">fix</tspan>
  </text>

  
  <rect x="1340" y="270" width="200" height="110" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <text x="1440" y="335" font-family="monospace" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">mask::rw-</text>

  
  <rect x="540" y="550" width="560" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="570" y="640" width="100" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="620" y="679" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">rw-</text>

  
  <polygon points="670,625 745,645 745,695 670,715" fill="#d0e5d7" stroke="#207448" stroke-width="2" />

  
  <rect x="745" y="620" width="160" height="100" rx="8" fill="#fdf4eb" stroke="#db8129" stroke-width="3" />
  <line x1="770" y1="620" x2="770" y2="720" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="880" y1="620" x2="880" y2="720" stroke="#db8129" stroke-width="2" stroke-dasharray="4 4" />
  <text x="825" y="678" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">mask r--</text>

  
  <polygon points="905,650 970,650 970,690 905,690" fill="#d0e5d7" stroke="#207448" stroke-width="2" />

  
  <rect x="970" y="640" width="100" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1020" y="679" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">r--</text>

  
  <rect x="40" y="830" width="1520" height="80" rx="12" fill="#207448" />
  <text x="800" y="879" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The named entry is intact but the mask is r--, so the effective right is read-only.</text>
</svg>