<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Why chmod 640 silently cut a user's ACL write right</title>
  <desc>Visual explanation of how changing standard group permissions modifies the POSIX ACL mask, silently demoting named user write permissions to read-only.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why chmod 640 silently cut a user's ACL write right</text>

  
  <g transform="translate(40, 130)">
    <rect width="270" height="450" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    
    <circle cx="95" cy="52" r="24" fill="#207448"/>
    <text x="95" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(145, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="40" height="48" rx="4"/>
      <line x1="8" y1="12" x2="24" y2="12"/>
      <line x1="8" y1="22" x2="32" y2="22"/>
      <line x1="8" y1="32" x2="26" y2="32"/>
    </g>

    
    <text x="135" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="135" dy="0">Deploy script</tspan>
      <tspan x="135" dy="36">grants write</tspan>
    </text>

    
    <rect x="20" y="185" width="230" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">user:12345:rw-</text>
    <text x="35" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">mask::rw-</text>

    
    <rect x="20" y="345" width="230" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="135" y="384" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">effective: rw-</text>
  </g>

  
  <g>
    <text x="387" y="325" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">chmod 640</text>
    <line x1="315" y1="355" x2="455" y2="355" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  </g>

  
  <g transform="translate(465, 130)">
    <rect width="530" height="450" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <circle cx="215" cy="52" r="24" fill="#207448"/>
    <text x="215" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(265, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 0 6 L 24 0 L 48 6 C 48 26 24 46 24 46 C 24 46 0 26 0 6 Z"/>
      <path d="M 16 20 L 22 26 L 34 14"/>
    </g>

    
    <text x="265" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="265" dy="0">After the</tspan>
      <tspan x="265" dy="36">hardening job</tspan>
    </text>

    
    <rect x="20" y="185" width="490" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="35" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">ls -l shows -rw-r-----+</text>
    <text x="35" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" xml:space="preserve">user:12345:rw-    #effective:r--</text>
    
    <text x="35" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#db8129">mask::r--</text>

    
    <text x="265" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="265" dy="0">The group bits of the mode</tspan>
      <tspan x="265" dy="32">are the mask</tspan>
    </text>
  </g>

  
  <g>
    <text x="1150" y="325" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">setfacl -m m::rw FILE</text>
    <line x1="1000" y1="355" x2="1295" y2="355" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  </g>

  
  <g transform="translate(1305, 130)">
    <rect width="255" height="450" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <circle cx="85" cy="52" r="24" fill="#207448"/>
    <text x="85" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(135, 28)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 32 6 C 36 2 42 2 46 6 C 50 10 50 16 46 20 L 38 24 L 24 10 L 28 2 Z"/>
      <line x1="24" y1="10" x2="6" y2="36"/>
      <circle cx="6" cy="36" r="3"/>
    </g>

    
    <text x="127" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="127" dy="0">After</tspan>
      <tspan x="127" dy="36">the fix</tspan>
    </text>

    
    <rect x="25" y="210" width="205" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="127" y="274" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">mask::rw-</text>
  </g>

  
  <line x1="730" y1="580" x2="730" y2="615" stroke="#207448" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <g transform="translate(465, 625)">
    <rect width="530" height="205" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <rect x="40" y="70" width="95" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="87" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">rw-</text>

    
    <line x1="145" y1="102" x2="195" y2="102" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <g transform="translate(205, 30)">
      
      <path d="M 0 0 L 120 0 L 95 32 L 25 32 Z" fill="#207448"/>
      
      <path d="M 25 112 L 95 112 L 120 144 L 0 144 Z" fill="#207448"/>
      
      
      <rect x="5" y="42" width="110" height="60" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="60" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#db8129">mask r--</text>
    </g>

    
    <line x1="335" y1="102" x2="385" y2="102" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="395" y="70" width="95" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="442" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">r--</text>
  </g>

  
  <g transform="translate(40, 875)">
    <rect width="1520" height="80" rx="10" fill="#207448" filter="url(#shadow)"/>
    <text x="760" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The named entry is intact but the mask is r--, so the effective right is read-only.</text>
  </g>
</svg>