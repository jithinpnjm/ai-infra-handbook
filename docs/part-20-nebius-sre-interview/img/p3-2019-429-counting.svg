<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>The same 429 can be good or bad for the SLO</title>
  <desc>Visual infographic explaining why HTTP 429 errors are counted differently for SLOs depending on cause: pool exhaustion is bad capacity failure while customer quota exceeded is not bad, with dedicated vs serverless endpoint comparison.</desc>

  
  <rect width="1600" height="1170" fill="#f5f8f5" />

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The same 429 can be good or bad for the SLO</text>

  

  
  <g id="card-path-a">
    <rect x="50" y="98" width="730" height="260" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(387, 116)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="6" y1="22" x2="50" y2="22" stroke-width="3" />
      <line x1="28" y1="30" x2="28" y2="38" stroke-width="4" />
      <circle cx="28" cy="43" r="2.5" fill="#db8129" stroke="none" />
    </g>
    <text x="415" y="212" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="415" dy="0">gateway refused with 429 because the</tspan>
      <tspan x="415" dy="34">whole pool was full: your own</tspan>
      <tspan x="415" dy="34">capacity failed the customer:</tspan>
      <tspan x="415" dy="34" fill="#db8129">count as BAD</tspan>
    </text>
  </g>

  
  <g id="card-path-b">
    <rect x="820" y="98" width="730" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1157, 116)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="20" r="11" />
      <path d="M 10 46 C 10 35 18 33 28 33 C 38 33 46 35 46 46" />
    </g>
    <text x="1185" y="212" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1185" dy="0">gateway refused with 429 because the</tspan>
      <tspan x="1185" dy="34">customer went past their own quota:</tspan>
      <tspan x="1185" dy="34">the customer chose to exceed the</tspan>
      <tspan x="1185" dy="34" fill="#207448">agreed limit: count as NOT bad</tspan>
    </text>
  </g>

  
  <g id="card-central-insight">
    <rect x="50" y="390" width="1500" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(80, 422)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="10" x2="28" y2="46" stroke-width="4" />
      <line x1="12" y1="18" x2="44" y2="18" stroke-width="4" />
      <line x1="18" y1="46" x2="38" y2="46" stroke-width="4" />
      <path d="M 6 30 L 12 18 L 18 30 Z" />
      <path d="M 38 30 L 44 18 L 50 30 Z" />
    </g>
    <text x="825" y="442" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="825" dy="0">Both carry the same status code and land on opposite sides of the SLO;</tspan>
      <tspan x="825" dy="38">the cause label on the gateway counter separates them</tspan>
    </text>
  </g>

  

  
  <g id="card-dedicated-endpoint">
    <rect x="50" y="542" width="730" height="330" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(387, 558)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" stroke-width="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" />
      <line x1="20" y1="5" x2="20" y2="12" />
      <line x1="28" y1="5" x2="28" y2="12" />
      <line x1="36" y1="5" x2="36" y2="12" />
      <line x1="20" y1="44" x2="20" y2="51" />
      <line x1="28" y1="44" x2="28" y2="51" />
      <line x1="36" y1="44" x2="36" y2="51" />
      <line x1="5" y1="20" x2="12" y2="20" />
      <line x1="5" y1="28" x2="12" y2="28" />
      <line x1="5" y1="36" x2="12" y2="36" />
      <line x1="44" y1="20" x2="51" y2="20" />
      <line x1="44" y1="28" x2="51" y2="28" />
      <line x1="44" y1="36" x2="51" y2="36" />
    </g>
    <text x="415" y="656" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="415" dy="0" font-size="28" font-weight="bold" fill="#207448">Dedicated endpoint: availability</tspan>
      <tspan x="415" dy="34">target such as 99.9 percent plus TTFT</tspan>
      <tspan x="415" dy="34">while traffic is within provisioned</tspan>
      <tspan x="415" dy="34">capacity; exclude load above the</tspan>
      <tspan x="415" dy="34">contracted capacity from the SLI;</tspan>
      <tspan x="415" dy="34">slice alerts per endpoint</tspan>
    </text>
  </g>

  
  <g id="card-serverless-endpoint">
    <rect x="820" y="542" width="730" height="330" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1157, 558)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 38 C 10 38 6 34 6 28 C 6 23 10 19 15 19 C 17 13 23 9 30 9 C 38 9 44 14 46 21 C 50 22 53 25 53 30 C 53 35 49 38 44 38 Z" />
    </g>
    <text x="1185" y="656" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1185" dy="0" font-size="28" font-weight="bold" fill="#207448">Serverless endpoint: looser latency</tspan>
      <tspan x="1185" dy="34">targets with fairness limits and 429</tspan>
      <tspan x="1185" dy="34">responses as the control; count</tspan>
      <tspan x="1185" dy="34">overload 429 as bad, quota 429 as not</tspan>
      <tspan x="1185" dy="34">bad; slice alerts per model, tickets</tspan>
      <tspan x="1185" dy="34">per tenant</tspan>
    </text>
  </g>

  
  <g id="card-example">
    <rect x="50" y="904" width="1500" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(80, 936)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="34" height="44" rx="4" stroke-width="4" />
      <line x1="16" y1="18" x2="34" y2="18" />
      <line x1="16" y1="26" x2="34" y2="26" />
      <line x1="16" y1="34" x2="26" y2="34" />
    </g>
    <text x="825" y="955" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="825" dy="0">a customer sending 3 times their provisioned traffic</tspan>
      <tspan x="825" dy="38">and TTFT rising is not your breach</tspan>
    </text>
  </g>

  
  <g id="card-footer">
    <rect x="50" y="1054" width="1500" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(80, 1070)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" stroke-width="3.5" />
      <line x1="24" y1="21" x2="24" y2="33" stroke-width="3.5" />
      <circle cx="24" cy="15" r="2.5" fill="#207448" stroke="none" />
    </g>
    <text x="825" y="1103" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">table is the author's reasoning, Nebius has not published its SLO terms</text>
  </g>
</svg>