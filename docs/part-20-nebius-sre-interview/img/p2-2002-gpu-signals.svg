<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Busy GPUs can hide a drowning engine</title>
  <desc>Comparison between a healthy engine with a short queue and a drowning engine with a growing queue despite identical busy GPU utilisation.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2 2 L 10 7 L 2 12 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2 2 L 10 7 L 2 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="46px" font-weight="bold" fill="#303a36">Busy GPUs can hide a drowning engine</text>

  
  <g id="shared-utilisation-badge">
    <rect x="300" y="135" width="1000" height="66" rx="16" fill="#207448" />
    <text x="340" y="178" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">GPU utilisation looks busy</text>
    
    <rect x="760" y="153" width="500" height="30" rx="8" fill="#144d2f" />
    <rect x="763" y="156" width="460" height="24" rx="6" fill="#88d8a7" />
  </g>

  
  <g id="left-panel">
    <rect x="100" y="230" width="670" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="140" y="285" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Healthy engine</text>

    
    <rect x="140" y="320" width="220" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(190, 360)">
      <rect x="20" y="20" width="80" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="38" y="38" width="44" height="44" rx="4" fill="#207448" />
      
      <line x1="35" y1="12" x2="35" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="60" y1="12" x2="60" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="85" y1="12" x2="85" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="35" y1="100" x2="35" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="60" y1="100" x2="60" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="85" y1="100" x2="85" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="35" x2="20" y2="35" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="60" x2="20" y2="60" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="85" x2="20" y2="85" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="35" x2="108" y2="35" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="60" x2="108" y2="60" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="85" x2="108" y2="85" stroke="#207448" stroke-width="3" />
    </g>

    
    <rect x="160" y="560" width="180" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="164" y="564" width="162" height="40" rx="6" fill="#207448" />

    
    <rect x="380" y="320" width="360" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="410" y="368" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Short queue</text>

    
    <g transform="translate(410, 410)">
      <rect x="0" y="0" width="300" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="36" cy="35" r="14" fill="#207448" />
      <rect x="68" y="24" width="140" height="10" rx="5" fill="#207448" />
      <rect x="68" y="42" width="80" height="8" rx="4" fill="#88d8a7" />
    </g>

    
    <g transform="translate(410, 505)">
      <rect x="0" y="0" width="300" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="36" cy="35" r="14" fill="#207448" />
      <rect x="68" y="24" width="140" height="10" rx="5" fill="#207448" />
      <rect x="68" y="42" width="80" height="8" rx="4" fill="#88d8a7" />
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="830" y="230" width="670" height="480" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="870" y="285" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Drowning engine</text>

    
    <rect x="870" y="320" width="220" height="350" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(920, 360)">
      <rect x="20" y="20" width="80" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <rect x="38" y="38" width="44" height="44" rx="4" fill="#207448" />
      
      <line x1="35" y1="12" x2="35" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="60" y1="12" x2="60" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="85" y1="12" x2="85" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="35" y1="100" x2="35" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="60" y1="100" x2="60" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="85" y1="100" x2="85" y2="108" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="35" x2="20" y2="35" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="60" x2="20" y2="60" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="85" x2="20" y2="85" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="35" x2="108" y2="35" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="60" x2="108" y2="60" stroke="#207448" stroke-width="3" />
      <line x1="100" y1="85" x2="108" y2="85" stroke="#207448" stroke-width="3" />
    </g>

    
    <rect x="890" y="560" width="180" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="894" y="564" width="162" height="40" rx="6" fill="#207448" />

    
    <rect x="1110" y="320" width="360" height="350" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="1135" y="368" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129">Queue keeps growing</text>

    
    
    <g transform="translate(1135, 400)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>
    <g transform="translate(1135, 465)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>
    <g transform="translate(1135, 530)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>

    
    <g transform="translate(1300, 400)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>
    <g transform="translate(1300, 465)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>
    <g transform="translate(1300, 530)">
      <rect x="0" y="0" width="145" height="52" rx="8" fill="#fff5ed" stroke="#db8129" stroke-width="1.5" />
      <circle cx="24" cy="26" r="10" fill="#db8129" />
      <rect x="44" y="21" width="75" height="8" rx="4" fill="#db8129" />
    </g>

    
    <path d="M 1140 615 L 1430 615" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrow-orange)" />
  </g>

  
  
  <g id="signal-chip-1">
    <rect x="100" y="745" width="290" height="80" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(125, 765)">
      
      <rect x="0" y="0" width="32" height="8" rx="3" fill="#207448" />
      <rect x="0" y="14" width="32" height="8" rx="3" fill="#207448" />
      <rect x="0" y="28" width="32" height="8" rx="3" fill="#207448" />
    </g>
    <text x="175" y="795" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Queue depth</text>
  </g>

  
  <g id="signal-chip-2">
    <rect x="420" y="745" width="360" height="80" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(445, 765)">
      
      <circle cx="18" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
      <polyline points="18,10 18,20 27,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="495" y="795" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Time spent waiting</text>
  </g>

  
  
  <g id="signal-chip-3">
    <rect x="810" y="745" width="690" height="80" rx="16" fill="#fff5ed" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(835, 763)">
      <circle cx="22" cy="22" r="20" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      <line x1="8" y1="8" x2="36" y2="36" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="895" y="795" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">GPU utilisation alone (misleading)</text>
  </g>

  
  <g id="bottom-caption">
    <rect x="100" y="860" width="1400" height="75" rx="14" fill="#207448" />
    <text x="800" y="907" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff">Scaling on GPU utilisation alone can mislead; queue depth and waiting time show the difference.</text>
  </g>
</svg>