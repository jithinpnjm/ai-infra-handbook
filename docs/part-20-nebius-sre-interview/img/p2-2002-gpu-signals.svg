<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" width="1600" height="970">
  <title>Busy GPUs can hide a drowning engine</title>
  <desc>An infographic illustrating how identical high GPU utilisation can mask a drowning engine with a growing request queue compared to a healthy engine with a short queue.</desc>

  
  <rect width="1600" height="970" fill="#f5f8f5" />

  
  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Busy GPUs can hide a drowning engine</text>

  
  <path d="M 205 348 L 205 155 L 450 155 M 1150 155 L 1395 155 L 1395 348" fill="none" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 6" />

  
  <g id="shared-badge">
    <rect x="450" y="126" width="700" height="58" rx="29" fill="#207448" />
    <text x="800" y="165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">GPU utilisation looks busy</text>
  </g>

  
  <g id="left-panel">
    
    <rect x="60" y="210" width="720" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(230, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28" />
      <polyline points="20,28 26,34 38,22" />
    </g>
    <text x="305" y="268" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Healthy engine</text>

    
    <g transform="translate(90, 305)">
      <rect x="0" y="0" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(30, 48)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="12" width="36" height="36" rx="4" fill="#e8f1ea" />
        <line x1="20" y1="2" x2="20" y2="12" />
        <line x1="30" y1="2" x2="30" y2="12" />
        <line x1="40" y1="2" x2="40" y2="12" />
        <line x1="20" y1="48" x2="20" y2="58" />
        <line x1="30" y1="48" x2="30" y2="58" />
        <line x1="40" y1="48" x2="40" y2="58" />
        <line x1="2" y1="20" x2="12" y2="20" />
        <line x1="2" y1="30" x2="12" y2="30" />
        <line x1="2" y1="40" x2="12" y2="40" />
        <line x1="48" y1="20" x2="58" y2="20" />
        <line x1="48" y1="30" x2="58" y2="30" />
        <line x1="48" y1="40" x2="58" y2="40" />
      </g>
      
      <rect x="115" y="55" width="515" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <rect x="118" y="58" width="485" height="40" rx="6" fill="#207448" />
    </g>

    
    <g transform="translate(90, 480)">
      <rect x="0" y="0" width="660" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="30" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Short queue</text>
      
      <g transform="translate(30, 68)">
        <rect x="0" y="0" width="115" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <g stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round">
          <rect x="35" y="25" width="45" height="55" rx="4" />
          <line x1="45" y1="40" x2="70" y2="40" />
          <line x1="45" y1="52" x2="70" y2="52" />
          <line x1="45" y1="64" x2="62" y2="64" />
        </g>
      </g>
      
      <g transform="translate(165, 68)">
        <rect x="0" y="0" width="115" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <g stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round">
          <rect x="35" y="25" width="45" height="55" rx="4" />
          <line x1="45" y1="40" x2="70" y2="40" />
          <line x1="45" y1="52" x2="70" y2="52" />
          <line x1="45" y1="64" x2="62" y2="64" />
        </g>
      </g>
      
      <line x1="310" y1="123" x2="625" y2="123" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" opacity="0.35" />
    </g>
  </g>

  
  <g id="right-panel">
    
    <rect x="820" y="210" width="720" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(970, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28" />
      <line x1="28" y1="18" x2="28" y2="28" />
      <circle cx="28" cy="36" r="1.5" fill="#207448" />
    </g>
    <text x="1045" y="268" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Drowning engine</text>

    
    <g transform="translate(850, 305)">
      <rect x="0" y="0" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(30, 48)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="12" width="36" height="36" rx="4" fill="#e8f1ea" />
        <line x1="20" y1="2" x2="20" y2="12" />
        <line x1="30" y1="2" x2="30" y2="12" />
        <line x1="40" y1="2" x2="40" y2="12" />
        <line x1="20" y1="48" x2="20" y2="58" />
        <line x1="30" y1="48" x2="30" y2="58" />
        <line x1="40" y1="48" x2="40" y2="58" />
        <line x1="2" y1="20" x2="12" y2="20" />
        <line x1="2" y1="30" x2="12" y2="30" />
        <line x1="2" y1="40" x2="12" y2="40" />
        <line x1="48" y1="20" x2="58" y2="20" />
        <line x1="48" y1="30" x2="58" y2="30" />
        <line x1="48" y1="40" x2="58" y2="40" />
      </g>
      
      <rect x="115" y="55" width="515" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <rect x="118" y="58" width="485" height="40" rx="6" fill="#207448" />
    </g>

    
    <g transform="translate(850, 480)">
      <rect x="0" y="0" width="660" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="30" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Queue keeps growing</text>

      
      <g transform="translate(30, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(102, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(174, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(246, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(318, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(390, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <g transform="translate(462, 68)">
        <rect x="0" y="0" width="62" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <line x1="16" y1="45" x2="46" y2="45" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <line x1="16" y1="60" x2="46" y2="60" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>

      
      <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="540" y1="123" x2="615" y2="123" />
        <polyline points="602,112 617,123 602,134" />
      </g>
    </g>
  </g>

  
  <g id="signal-chips-row" transform="translate(60, 730)">
    
    <rect x="0" y="0" width="1480" height="96" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(25, 16)">
      <rect x="0" y="0" width="295" height="64" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(22, 17)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15" cy="15" r="14" />
        <polyline points="10,15 14,19 21,11" />
      </g>
      <text x="68" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Queue depth</text>
    </g>

    
    <g transform="translate(345, 16)">
      <rect x="0" y="0" width="380" height="64" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(22, 17)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15" cy="15" r="14" />
        <polyline points="15,7 15,15 21,18" />
      </g>
      <text x="68" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Time spent waiting</text>
    </g>

    
    <g transform="translate(750, 16)">
      <rect x="0" y="0" width="705" height="64" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
      
      <g transform="translate(24, 17)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round">
        <circle cx="15" cy="15" r="14" />
        <line x1="10" y1="10" x2="20" y2="20" />
        <line x1="20" y1="10" x2="10" y2="20" />
      </g>
      
      <text x="70" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">GPU utilisation alone (misleading)</text>
      
      <line x1="62" y1="33" x2="665" y2="33" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  
  <g id="caption-takeaway" transform="translate(60, 852)">
    <rect x="0" y="0" width="1480" height="78" rx="14" fill="#207448" />
    <text x="740" y="49" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Scaling on GPU utilisation alone can mislead; queue depth and waiting time show the difference.</text>
  </g>
</svg>