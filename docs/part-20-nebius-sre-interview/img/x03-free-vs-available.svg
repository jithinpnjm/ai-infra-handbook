<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Free is small, available is large: the page cache is reclaimable</title>
  <desc>Visual explanation of Linux memory accounting showing why free memory is small while available memory is large due to reclaimable page cache and buffers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="8" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Free is small, available is large:</tspan>
    <tspan x="800" dy="56">the page cache is reclaimable</tspan>
  </text>

  
  <g transform="translate(80, 150)">
    <rect width="160" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 16 14 L 25 21 L 16 28 M 28 28 L 38 28" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="29" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">free -m</text>
  </g>

  
  <text x="800" y="180" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">total 1950 MB</text>

  
  
  <rect x="80" y="200" width="220" height="85" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="190" y="252" text-anchor="middle" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">free</tspan>
    <tspan font-family="sans-serif"> 163 MB</tspan>
  </text>

  
  <rect x="300" y="200" width="740" height="85" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="670" y="252" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">page cache, buffers and reclaimable</text>

  
  <rect x="1040" y="200" width="480" height="85" fill="#207448" stroke="#207448" stroke-width="3"/>
  <text x="1280" y="252" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">used by applications</text>

  
  <path d="M 80 295 L 80 415 L 550 415 L 560 428 L 570 415 L 1040 415 L 1040 295" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="560" y="468" text-anchor="middle" font-size="30" font-weight="bold" fill="#207448">
    <tspan font-family="monospace">available</tspan>
    <tspan font-family="sans-serif"> 1187 MB</tspan>
  </text>

  
  <line x1="770" y1="285" x2="770" y2="408" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="750" y="340" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="750" dy="0">the kernel gives it back</tspan>
    <tspan x="750" dy="32">to applications on demand</tspan>
  </text>

  
  <g transform="translate(80, 510)">
    <rect width="690" height="325" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(317, 25)">
      <path d="M 6 44 A 24 24 0 1 1 50 44" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="16" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="44" r="4" fill="#207448"/>
    </g>

    <text x="345" y="125" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">free</tspan>
      <tspan font-family="sans-serif">, the column that looks scary</tspan>
    </text>

    <text x="345" y="195" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">163 MB</text>

    
    <rect x="35" y="235" width="620" height="64" rx="8" fill="#fef3e7" stroke="#db8129" stroke-width="2"/>
    <text x="345" y="275" text-anchor="middle" font-size="24" font-weight="bold" fill="#db8129">
      <tspan font-family="monospace">free</tspan>
      <tspan font-family="sans-serif"> looks low, but that is not a problem.</tspan>
    </text>
  </g>

  
  <g transform="translate(830, 510)">
    <rect width="690" height="325" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(317, 25)">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 18 26 L 25 33 L 38 19" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="345" y="125" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">available</tspan>
      <tspan font-family="sans-serif">, the number to read</tspan>
    </text>

    <text x="345" y="210" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="#207448">1187 MB</text>
  </g>

  
  <g transform="translate(80, 875)">
    <rect width="1440" height="80" rx="12" fill="#207448"/>
    <text x="720" y="49" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">
      <tspan font-family="sans-serif">Read </tspan>
      <tspan font-family="monospace">available</tspan>
      <tspan font-family="sans-serif">, not </tspan>
      <tspan font-family="monospace">free</tspan>
      <tspan font-family="sans-serif">.</tspan>
    </text>
  </g>
</svg>