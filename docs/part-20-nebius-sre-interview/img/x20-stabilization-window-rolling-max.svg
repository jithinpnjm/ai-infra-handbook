<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>The scale-down window keeps the highest recent recommendation</title>
  <desc>An infographic illustrating how the Kubernetes HPA scale-down stabilization window preserves the highest recommendation over the window period, preventing premature downscaling during temporary dips in load.</desc>

  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">The scale-down window keeps</tspan>
    <tspan x="800" dy="52">the highest recent recommendation</tspan>
  </text>

  
  <rect x="80" y="165" width="1440" height="485" rx="16" fill="#ffffff" stroke="#d0ddd3" stroke-width="2"/>

  
  <line x1="240" y1="580" x2="240" y2="230" stroke="#303a36" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="145" y="405" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" transform="rotate(-90 145 405)">Recommended replicas</text>

  
  <line x1="240" y1="580" x2="1470" y2="580" stroke="#303a36" stroke-width="2.5" marker-end="url(#axis-arrow)"/>

  
  <rect x="680" y="260" width="750" height="305" rx="8" fill="#e8f1ea" fill-opacity="0.5"/>

  
  <path d="M 690 260 L 690 235 L 1420 235 L 1420 260" fill="none" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(585, 205)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 38,34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="613" y="285" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Window</text>

  
  <rect x="870" y="212" width="370" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1055" y="242" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Stabilization window 300 s</text>

  
  <path d="M 330 370 L 730 370 L 810 435 L 890 500 L 970 435 L 1050 370 L 1370 370" fill="none" stroke="#a0b8a6" stroke-width="2" stroke-dasharray="6,6"/>

  
  <line x1="680" y1="370" x2="1430" y2="370" stroke="#207448" stroke-width="6"/>

  
  <rect x="785" y="316" width="530" height="38" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1050" y="343" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Highest recommendation in the window</text>

  
  
  <circle cx="330" cy="370" r="9" fill="#207448"/>
  <circle cx="410" cy="370" r="9" fill="#207448"/>
  <circle cx="490" cy="370" r="9" fill="#207448"/>
  <circle cx="570" cy="370" r="9" fill="#207448"/>
  <circle cx="650" cy="370" r="9" fill="#207448"/>
  <circle cx="730" cy="370" r="9" fill="#207448"/>

  
  <circle cx="810" cy="435" r="9" fill="#207448"/>
  <circle cx="970" cy="435" r="9" fill="#207448"/>

  
  <circle cx="1050" cy="370" r="9" fill="#207448"/>
  <circle cx="1130" cy="370" r="9" fill="#207448"/>
  <circle cx="1210" cy="370" r="9" fill="#207448"/>
  <circle cx="1290" cy="370" r="9" fill="#207448"/>
  <circle cx="1370" cy="370" r="9" fill="#207448"/>

  
  <circle cx="890" cy="500" r="9" fill="#db8129"/>
  <circle cx="890" cy="500" r="18" fill="none" stroke="#db8129" stroke-width="2.5"/>
  <text x="890" y="546" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Dip in load</text>

  
  <rect x="80" y="675" width="700" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(115, 702)">
    
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="14" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="14" r="5" fill="#207448"/>
    <circle cx="34" cy="28" r="5" fill="#207448"/>
  </g>
  <text x="195" y="734" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scale down to</text>
  
  <rect x="115" y="760" width="630" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="430" y="794" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">highest recommendation in the window</text>

  
  <rect x="820" y="675" width="700" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(860, 725)">
    
    <path d="M 28 6 L 50 14 L 50 34 C 50 48 28 56 28 56 C 28 56 6 48 6 34 L 6 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="18,30 25,37 38,23" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1200" y="745" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1200" dy="0">A short dip in load</tspan>
    <tspan x="1200" dy="38">changes nothing</tspan>
  </text>

  
  <rect x="80" y="860" width="1440" height="80" rx="12" fill="#207448"/>
  <text x="800" y="909" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Scale-up is fast by default, scale-down waits for the highest recommendation in the window.</text>
</svg>