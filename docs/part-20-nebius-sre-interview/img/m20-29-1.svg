<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>The mock-interview protocol</title>
  <desc>Flowchart illustrating the six-step cyclical mock-interview protocol.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 0 2 L 15 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 0 2 L 15 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The mock-interview protocol</text>

  
  
  <line x1="520" y1="315" x2="600" y2="315" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1000" y1="315" x2="1080" y2="315" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1280" y1="460" x2="1280" y2="560" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1080" y1="705" x2="1000" y2="705" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="600" y1="705" x2="520" y2="705" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="320" y1="560" x2="320" y2="460" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g>
    <rect x="120" y="170" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="170" cy="215" r="24" fill="#207448" />
    <text x="170" y="215" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="320" cy="254" r="24" />
      <line x1="320" y1="230" x2="320" y2="223" />
      <line x1="311" y1="223" x2="329" y2="223" />
      <line x1="338" y1="236" x2="344" y2="230" />
      <line x1="320" y1="254" x2="320" y2="238" />
      <line x1="320" y1="254" x2="333" y2="246" />
      <circle cx="320" cy="254" r="2.5" fill="#207448" />
    </g>
    <text x="320" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Set a timer</text>
  </g>

  
  <g>
    <rect x="600" y="170" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="650" cy="215" r="24" fill="#207448" />
    <text x="650" y="215" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="774" y="226" width="36" height="26" rx="5" />
      <path d="M 780 252 L 774 260 L 788 252 Z" fill="#e8f1ea" />
      <line x1="782" y1="235" x2="802" y2="235" stroke-width="3" />
      <line x1="782" y1="243" x2="796" y2="243" stroke-width="3" />
      <rect x="796" y="242" width="36" height="26" rx="5" />
      <path d="M 824 268 L 830 276 L 816 268 Z" fill="#e8f1ea" />
      <line x1="804" y1="251" x2="824" y2="251" stroke-width="3" />
      <line x1="804" y1="259" x2="818" y2="259" stroke-width="3" />
    </g>
    <text x="800" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Run the round</text>
  </g>

  
  <g>
    <rect x="1080" y="170" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1130" cy="215" r="24" fill="#207448" />
    <text x="1130" y="215" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1252" y="225" width="56" height="38" rx="4" />
      <line x1="1280" y1="263" x2="1280" y2="273" />
      <line x1="1268" y1="273" x2="1292" y2="273" />
      <circle cx="1280" cy="220" r="2.5" fill="#207448" />
      <path d="M 1262 244 L 1268 244 L 1272 236 L 1276 252 L 1280 238 L 1284 250 L 1288 244 L 1298 244" stroke-width="3" />
    </g>
    <text x="1280" y="356" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1280" dy="0">Record audio</tspan>
      <tspan x="1280" dy="38">or screen</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1080" y="560" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1130" cy="605" r="24" fill="#207448" />
    <text x="1130" y="605" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1255" y="614" width="50" height="56" rx="5" />
      <path d="M 1270 614 V 610 C 1270 608 1272 606 1275 606 H 1285 C 1288 606 1290 608 1290 610 V 614 Z" />
      <path d="M 1263 628 L 1267 632 L 1274 624" stroke-width="3" />
      <line x1="1278" y1="628" x2="1296" y2="628" stroke-width="3" />
      <path d="M 1263 642 L 1267 646 L 1274 638" stroke-width="3" />
      <line x1="1278" y1="642" x2="1296" y2="642" stroke-width="3" />
      <path d="M 1263 656 L 1267 660 L 1274 652" stroke-width="3" />
      <line x1="1278" y1="656" x2="1292" y2="656" stroke-width="3" />
    </g>
    <text x="1280" y="746" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1280" dy="0">Score with</tspan>
      <tspan x="1280" dy="38">the rubric</tspan>
    </text>
  </g>

  
  <g>
    <rect x="600" y="560" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="650" cy="605" r="24" fill="#207448" />
    <text x="650" y="605" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="774" y="612" width="46" height="56" rx="4" />
      <line x1="783" y1="626" x2="806" y2="626" stroke-width="3" />
      <line x1="783" y1="638" x2="808" y2="638" stroke-width="3" />
      <line x1="783" y1="650" x2="802" y2="650" stroke-width="3" />
      <path d="M 814 620 L 826 632 L 808 656 L 802 656 L 802 650 Z" />
      <line x1="802" y1="656" x2="807" y2="651" />
    </g>
    <text x="800" y="765" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Write three fixes</text>
  </g>

  
  <g>
    <rect x="120" y="560" width="400" height="290" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="170" cy="605" r="24" fill="#207448" />
    <text x="170" y="605" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="306" y="612" width="48" height="36" rx="4" transform="rotate(8 330 630)" stroke-dasharray="4 2" />
      <rect x="292" y="622" width="50" height="38" rx="4" fill="#e8f1ea" />
      <line x1="300" y1="633" x2="318" y2="633" stroke-width="3" />
      <line x1="300" y1="643" x2="334" y2="643" stroke-width="3" />
      <line x1="300" y1="651" x2="326" y2="651" stroke-width="3" />
    </g>
    <text x="320" y="746" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="320" dy="0">Make cards</tspan>
      <tspan x="320" dy="38">from misses</tspan>
    </text>
  </g>
</svg>