<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="sans-serif">
  <title>Incident timeline measured from when impact started</title>
  <desc>Seven incident events on a timeline measured from when impact started, with brackets for time to detect, time to mitigate, and time to resolve.</desc>

  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  
  <line x1="212" y1="600" x2="1404" y2="600" stroke="#207448" stroke-width="4"/>

  
  <line x1="232"  y1="540" x2="232"  y2="576" stroke="#8db0a0" stroke-width="4"/>
  <line x1="616"  y1="540" x2="616"  y2="576" stroke="#8db0a0" stroke-width="4"/>
  <line x1="1000" y1="540" x2="1000" y2="576" stroke="#8db0a0" stroke-width="4"/>
  <line x1="1384" y1="540" x2="1384" y2="576" stroke="#8db0a0" stroke-width="4"/>

  
  <line x1="424"  y1="624" x2="424"  y2="660" stroke="#8db0a0" stroke-width="4"/>
  <line x1="808"  y1="624" x2="808"  y2="660" stroke="#8db0a0" stroke-width="4"/>
  <line x1="1192" y1="624" x2="1192" y2="660" stroke="#8db0a0" stroke-width="4"/>

  
  <line x1="232" y1="628" x2="232" y2="650" stroke="#207448" stroke-width="8" stroke-linecap="round"/>

  
  <g fill="#207448">
    <circle cx="232"  cy="600" r="24"/>
    <circle cx="424"  cy="600" r="24"/>
    <circle cx="616"  cy="600" r="24"/>
    <circle cx="808"  cy="600" r="24"/>
    <circle cx="1000" cy="600" r="24"/>
    <circle cx="1192" cy="600" r="24"/>
    <circle cx="1384" cy="600" r="24"/>
  </g>
  <g fill="#ffffff" font-size="34" font-weight="bold" text-anchor="middle">
    <text x="232"  y="612">1</text>
    <text x="424"  y="612">2</text>
    <text x="616"  y="612">3</text>
    <text x="808"  y="612">4</text>
    <text x="1000" y="612">5</text>
    <text x="1192" y="612">6</text>
    <text x="1384" y="612">7</text>
  </g>

  
  <rect x="62" y="272" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(76,284)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="26" r="12"/>
    <circle cx="26" cy="26" r="3"/>
    <line x1="42" y1="26" x2="48" y2="26"/>
    <line x1="34" y1="39.9" x2="37" y2="45.1"/>
    <line x1="18" y1="39.9" x2="15" y2="45.1"/>
    <line x1="10" y1="26" x2="4" y2="26"/>
    <line x1="18" y1="12.1" x2="15" y2="6.9"/>
    <line x1="34" y1="12.1" x2="37" y2="6.9"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="78" y="368">Rollout of config</text>
    <text x="78" y="404">v42 to replica</text>
    <text x="78" y="440">group B begins</text>
  </g>
  <rect x="72" y="497" width="133" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="88" y="522" font-size="24" font-weight="bold" fill="#207448">started</text>
  <text x="386" y="522" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">09:12 UTC</text>

  
  <rect x="254" y="660" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(268,672)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 27 A11 11 0 0 1 37 27"/>
    <line x1="12" y1="31" x2="40" y2="31"/>
    <circle cx="26" cy="36" r="3"/>
    <circle cx="26" cy="11" r="2"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="270" y="756">Pager fires: TTFT</text>
    <text x="270" y="792">p99 above 4 s for</text>
    <text x="270" y="828">5 minutes</text>
  </g>
  <rect x="264" y="885" width="147" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="280" y="910" font-size="24" font-weight="bold" fill="#207448">detected</text>
  <text x="578" y="910" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">09:31 UTC</text>

  
  <rect x="446" y="272" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(460,284)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 9 L37 9 L43 21 L26 45 L9 21 Z"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="462" y="368">On-call declares</text>
    <text x="462" y="404">SEV2, takes</text>
    <text x="462" y="440">commander role</text>
  </g>
  <text x="770" y="522" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">09:35 UTC</text>

  
  <rect x="638" y="660" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(652,672)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="11" y="20" width="8" height="22"/>
    <rect x="22" y="11" width="8" height="31"/>
    <rect x="33" y="26" width="8" height="16"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="654" y="756">Preemption</text>
    <text x="654" y="792">counter rising</text>
    <text x="654" y="828">only on group</text>
    <text x="654" y="864">B pods</text>
  </g>
  <text x="962" y="910" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">09:44 UTC</text>

  
  <rect x="830" y="272" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(844,284)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="26" x2="44" y2="26"/>
    <circle cx="14" cy="26" r="6"/>
    <circle cx="38" cy="26" r="6"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="846" y="368">Group B set to</text>
    <text x="846" y="404">weight 0 at the</text>
    <text x="846" y="440">gateway, p99</text>
    <text x="846" y="476">recovers</text>
  </g>
  <rect x="840" y="497" width="162" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="856" y="522" font-size="24" font-weight="bold" fill="#207448">mitigated</text>
  <text x="1154" y="522" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">09:52 UTC</text>

  
  <rect x="1022" y="660" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(1036,672)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 16 A18 18 0 1 0 34 36"/>
    <path d="M34 46 L27 34 L41 34 Z"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="1038" y="756">Config v41</text>
    <text x="1038" y="792">restored on group</text>
    <text x="1038" y="828">B, traffic ramped</text>
    <text x="1038" y="864">back</text>
  </g>
  <text x="1346" y="910" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">10:40 UTC</text>

  
  <rect x="1214" y="272" width="340" height="278" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(1228,284)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="26" r="17"/>
    <path d="M17 28 L23 34 L35 18"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#303a36">
    <text x="1230" y="368">SLO burn back to</text>
    <text x="1230" y="404">normal, incident</text>
    <text x="1230" y="440">closed</text>
  </g>
  <rect x="1224" y="497" width="147" height="34" rx="17" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="1240" y="522" font-size="24" font-weight="bold" fill="#207448">resolved</text>
  <text x="1538" y="522" text-anchor="end" font-family="monospace" font-size="24" fill="#207448">11:05 UTC</text>

  
  <line x1="232" y1="995" x2="424" y2="995" stroke="#db8129" stroke-width="4"/>
  <line x1="232" y1="981" x2="232" y2="995" stroke="#db8129" stroke-width="4"/>
  <line x1="424" y1="981" x2="424" y2="995" stroke="#db8129" stroke-width="4"/>
  <text x="328" y="975" text-anchor="middle" font-size="24" fill="#db8129">Time to detect: <tspan font-family="monospace" font-weight="bold">19 min</tspan></text>

  
  <line x1="232" y1="1042" x2="1000" y2="1042" stroke="#7b9185" stroke-width="4"/>
  <line x1="232" y1="1028" x2="232" y2="1042" stroke="#7b9185" stroke-width="4"/>
  <line x1="1000" y1="1028" x2="1000" y2="1042" stroke="#7b9185" stroke-width="4"/>
  <text x="616" y="1022" text-anchor="middle" font-size="24" fill="#303a36">Time to mitigate: <tspan font-family="monospace" font-weight="bold">40 min</tspan></text>

  
  <line x1="232" y1="1089" x2="1384" y2="1089" stroke="#7b9185" stroke-width="4"/>
  <line x1="232" y1="1075" x2="232" y2="1089" stroke="#7b9185" stroke-width="4"/>
  <line x1="1384" y1="1075" x2="1384" y2="1089" stroke="#7b9185" stroke-width="4"/>
  <text x="808" y="1069" text-anchor="middle" font-size="24" fill="#303a36">Time to resolve: <tspan font-family="monospace" font-weight="bold">113 min</tspan></text>

  
  <rect x="60" y="1106" width="1480" height="54" rx="12" fill="#207448"/>
  <text x="800" y="1140" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">Measured from when impact started, not from the page</text>

  
  <text x="800" y="84" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36">Incident timeline measured from when</text>
  <text x="800" y="140" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36">impact started</text>
</svg>