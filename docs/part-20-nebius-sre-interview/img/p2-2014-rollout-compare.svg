<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Rolling, blue/green and canary: extra GPUs while rolling</title>
  <desc>Visual comparison table of Rolling update, Blue/green, and Canary deployment strategies and their GPU resource requirements, rollback speeds, weak points, and a hybrid approach.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Rolling, blue/green and canary:</tspan>
    <tspan x="800" dy="58">extra GPUs while rolling</tspan>
  </text>

  
  <g transform="translate(50, 160)">
    <rect width="1500" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="28" height="28" rx="4"/>
      <path d="M14 2v6M22 2v6M30 2v6M14 36v6M22 36v6M30 36v6M2 14h6M2 22h6M2 30h6M36 14h6M36 22h6M36 30h6"/>
      <circle cx="22" cy="22" r="5"/>
    </g>
    <text x="750" y="47" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">You have 8 replicas and one spare GPU: blue/green needs 16 GPUs</text>
  </g>

  
  
  <g transform="translate(50, 260)">
    <rect width="310" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(131, 29)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="40" height="44" rx="4"/>
      <line x1="4" y1="18" x2="44" y2="18"/>
      <line x1="4" y1="32" x2="44" y2="32"/>
      <line x1="20" y1="4" x2="20" y2="48"/>
    </g>
  </g>

  
  <g transform="translate(380, 260)">
    <rect width="370" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 28)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 26A19 19 0 1 1 38 12"/>
      <polyline points="44 6 44 14 36 14"/>
    </g>
    <text x="215" y="65" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Rolling update</text>
  </g>

  
  <g transform="translate(770, 260)">
    <rect width="370" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 30)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="18" height="38" rx="3"/>
      <rect x="28" y="6" width="18" height="38" rx="3"/>
    </g>
    <text x="215" y="65" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Blue/green</text>
  </g>

  
  <g transform="translate(1160, 260)">
    <rect width="390" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 28)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 40A22 22 0 1 1 44 40"/>
      <line x1="26" y1="26" x2="38" y2="16"/>
      <circle cx="26" cy="26" r="3" fill="#207448"/>
    </g>
    <text x="225" y="65" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Canary</text>
  </g>

  
  <g transform="translate(50, 390)">
    <rect width="310" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(18, 28)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="36" height="36" rx="4"/>
      <line x1="14" y1="18" x2="34" y2="18"/>
      <line x1="14" y1="26" x2="34" y2="26"/>
      <circle cx="14" cy="34" r="2" fill="#207448"/>
      <circle cx="22" cy="34" r="2" fill="#207448"/>
    </g>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="180" dy="0">Extra GPUs</tspan>
      <tspan x="180" dy="32">while rolling</tspan>
    </text>
  </g>

  <g transform="translate(380, 390)">
    <rect width="370" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="185" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="185" dy="0">the surge amount,</tspan>
      <tspan x="185" dy="32">for example 1 replica</tspan>
    </text>
  </g>

  <g transform="translate(770, 390)">
    <rect width="370" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="185" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">a full second fleet, 2x</text>
  </g>

  <g transform="translate(1160, 390)">
    <rect width="390" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="195" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">the canary replicas,</tspan>
      <tspan x="195" dy="32">at least 1</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 520)">
    <rect width="310" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(20, 28)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="28" r="18"/>
      <line x1="26" y1="18" x2="26" y2="28"/>
      <line x1="26" y1="28" x2="34" y2="28"/>
      <line x1="22" y1="4" x2="30" y2="4"/>
    </g>
    <text x="185" y="65" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Rollback speed</text>
  </g>

  <g transform="translate(380, 520)">
    <rect width="370" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="185" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">slow, a reverse rollout</text>
  </g>

  <g transform="translate(770, 520)">
    <rect width="370" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="185" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">instant, flip the router</text>
  </g>

  <g transform="translate(1160, 520)">
    <rect width="390" height="110" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="195" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">fast, drop its weight</text>
  </g>

  
  <g transform="translate(50, 650)">
    <rect width="310" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(20, 38)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 6L4 44h44L26 6z"/>
      <line x1="26" y1="20" x2="26" y2="30"/>
      <circle cx="26" cy="37" r="1.5" fill="#207448"/>
    </g>
    <text x="185" y="74" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Weak point</text>
  </g>

  <g transform="translate(380, 650)">
    <rect width="370" height="130" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="185" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="185" dy="0">old and new mix</tspan>
      <tspan x="185" dy="32">on every route</tspan>
    </text>
  </g>

  
  <g transform="translate(770, 650)">
    <rect width="370" height="130" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <text x="185" y="73" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">needs double the GPUs</text>
  </g>

  <g transform="translate(1160, 650)">
    <rect width="390" height="130" rx="14" fill="#ffffff" stroke="#c0d4c6" stroke-width="2"/>
    <text x="195" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="195" dy="0">needs a router</tspan>
      <tspan x="195" dy="30">with weights and</tspan>
      <tspan x="195" dy="30">enough traffic</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 805)">
    <rect width="1500" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(25, 20)">
      <rect width="405" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="202" y="53" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="202" dy="0">Rolling update</tspan>
        <tspan x="202" dy="32">with small surge</tspan>
      </text>
    </g>

    
    <g transform="translate(450, 64)">
      <circle cx="16" cy="16" r="18" fill="#207448"/>
      <text x="16" y="24" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">+</text>
    </g>

    
    <g transform="translate(502, 20)">
      <rect width="435" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="217" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="217" dy="0">Canary gate:</tspan>
        <tspan x="217" dy="28">one new replica,</tspan>
        <tspan x="217" dy="28">small weight</tspan>
      </text>
    </g>

    
    <g transform="translate(957, 64)">
      <circle cx="16" cy="16" r="18" fill="#207448"/>
      <text x="16" y="24" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">+</text>
    </g>

    
    <g transform="translate(1008, 20)">
      <rect width="465" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="232" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="232" dy="0">Result:</tspan>
        <tspan x="232" dy="28">replace pods in order,</tspan>
        <tspan x="232" dy="28">promote by gate</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(50, 990)">
    <rect width="1500" height="70" rx="12" fill="#207448"/>
    <text x="750" y="44" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">When GPUs are scarce, a hybrid fits.</text>
  </g>
</svg>