<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>A module is an API: inputs, outputs and two repositories</title>
  <desc>Architecture infographic illustrating cluster module API boundaries, inputs, inside resources, outputs, and multi-repo deployment patterns.</desc>

  
  <rect width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="bold" fill="#207448">A module is an API: inputs, outputs and two repositories</text>

  
  <g id="left-panel">
    
    <rect x="40" y="100" width="760" height="1165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(68, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 24 4 L 46 16 L 46 40 L 24 52 L 2 40 L 2 16 Z" />
      <path d="M 2 16 L 24 28 L 46 16" />
      <path d="M 24 28 L 24 52" />
    </g>
    <text x="130" y="158" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">cluster module</text>

    
    <g id="card-inputs">
      <rect x="65" y="185" width="710" height="355" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      
      <g transform="translate(90, 204)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 4 20 L 28 20" />
        <path d="M 20 12 L 28 20 L 20 28" />
        <path d="M 24 4 L 36 4 L 36 36 L 24 36" />
      </g>
      <text x="140" y="233" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">Inputs in</text>

      <text x="90" y="278" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
        <tspan x="90" dy="0">name, parent_id (project), subnet_id,</tspan>
        <tspan x="90" dy="34">pinned k8s_version, and node_pools as a</tspan>
        <tspan x="90" dy="34">map whose key is a short stable name</tspan>
        <tspan x="90" dy="34">such as gpu; validation rejects a floating</tspan>
        <tspan x="90" dy="34">version (for example latest), a pool with</tspan>
        <tspan x="90" dy="34">both fixed size and autoscaling, and an</tspan>
        <tspan x="90" dy="34">upgrade strategy with max_unavailable 0</tspan>
        <tspan x="90" dy="34">and max_surge 0.</tspan>
      </text>
    </g>

    
    <g id="card-inside">
      <rect x="65" y="560" width="710" height="305" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      
      <g transform="translate(90, 578)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="8" />
        <path d="M 20 4 L 20 9 M 20 31 L 20 36 M 4 20 L 9 20 M 31 20 L 36 20 M 9 9 L 13 13 M 27 27 L 31 31 M 9 31 L 13 27 M 27 13 L 31 9" />
      </g>
      <text x="140" y="607" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">Inside</text>

      <text x="90" y="652" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
        <tspan x="90" dy="0">nebius_mk8s_v1_cluster this with</tspan>
        <tspan x="90" dy="36">prevent_destroy, and</tspan>
        <tspan x="90" dy="36">nebius_mk8s_v1_node_group pool with</tspan>
        <tspan x="90" dy="36">for_each over node_pools so each pool</tspan>
        <tspan x="90" dy="36">has a stable address pool[gpu].</tspan>
      </text>
    </g>

    
    <g id="card-outputs">
      <rect x="65" y="885" width="710" height="360" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      
      <g transform="translate(90, 904)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 4 L 4 4 L 4 36 L 12 36" />
        <path d="M 12 20 L 36 20" />
        <path d="M 28 12 L 36 20 L 28 28" />
      </g>
      <text x="140" y="933" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">Outputs out</text>

      <text x="90" y="978" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">cluster_id and node_group_ids</text>

      
      <rect x="90" y="1015" width="660" height="205" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="110" y="1060" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
        <tspan x="110" dy="0">renaming an output is a breaking change</tspan>
        <tspan x="110" dy="40">for every stack that reads it, like</tspan>
        <tspan x="110" dy="40">changing a function signature</tspan>
      </text>
    </g>
  </g>

  
  <g id="right-panel">
    
    <rect x="840" y="100" width="720" height="1165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <g transform="translate(868, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="12" cy="12" r="6" />
      <circle cx="12" cy="40" r="6" />
      <circle cx="38" cy="22" r="6" />
      <path d="M 12 18 L 12 34" />
      <path d="M 12 26 C 24 26 28 22 32 22" />
    </g>
    <text x="930" y="158" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#207448">two repositories</text>

    
    <g id="card-modules-repo">
      <rect x="865" y="185" width="670" height="305" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      
      <g transform="translate(895, 210)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="36" height="36" rx="4" />
        <path d="M 14 16 L 34 16" />
        <path d="M 14 24 L 28 24" />
        <path d="M 14 32 L 22 32" />
      </g>
      <text x="895" y="295" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="895" dy="0">modules repository holds blueprints,</tspan>
        <tspan x="895" dy="42">versioned and pinned</tspan>
      </text>
    </g>

    
    <g id="card-live-repo">
      <rect x="865" y="515" width="670" height="350" rx="12" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
      
      <g transform="translate(895, 540)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 4 22 L 24 6 L 44 22" />
        <path d="M 10 18 L 10 40 L 38 40 L 38 18" />
        <rect x="18" y="26" width="12" height="14" />
      </g>
      <text x="895" y="625" font-family="system-ui, sans-serif" font-size="25" fill="#303a36">
        <tspan x="895" dy="0">live repository holds the houses built</tspan>
        <tspan x="895" dy="40">from them: staging pins one module</tspan>
        <tspan x="895" dy="40">version, production pins another,</tspan>
        <tspan x="895" dy="40">so a change is seen in staging first</tspan>
      </text>
    </g>

    
    <g id="card-warning">
      <rect x="865" y="885" width="670" height="360" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(895, 915)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 24 6 L 44 40 L 4 40 Z" />
        <line x1="24" y1="18" x2="24" y2="28" />
        <circle cx="24" cy="34" r="1.5" fill="#db8129" />
      </g>

      <text x="895" y="1005" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="895" dy="0">if staging and production point</tspan>
        <tspan x="895" dy="44">at the same module folder, a change</tspan>
        <tspan x="895" dy="44">lands in both on the next apply</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-rule-bar">
    <rect x="40" y="1290" width="1520" height="75" rx="12" fill="#207448" />
    <text x="800" y="1338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">expose pools as data, keep the module small, pin every module and provider version</text>
  </g>
</svg>