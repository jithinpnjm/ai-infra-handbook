<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Decode sits far below the ridge, prefill sits above it</title>
  <desc>Infographic illustrating LLM decode and prefill operational regimes relative to the hardware ridge point on an arithmetic intensity axis.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Decode sits far below the ridge, prefill sits above it</text>

  
  <g transform="translate(160, 145)">
    
    <ellipse cx="22" cy="12" rx="14" ry="5" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 8 12 v 18 a 14 5 0 0 0 28 0 v -18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 8 21 a 14 5 0 0 0 28 0" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 42 14 c 4 -2 8 2 12 0" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 42 21 c 4 -2 8 2 12 0" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 42 28 c 4 -2 8 2 12 0" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="28" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Bandwidth-bound</text>
  </g>

  
  <g transform="translate(1040, 145)">
    
    <rect x="10" y="6" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="18" y="14" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="17" y1="1" x2="17" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="1" x2="24" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="31" y1="1" x2="31" y2="6" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="17" y1="34" x2="17" y2="39" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="34" x2="24" y2="39" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="31" y1="34" x2="31" y2="39" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="13" x2="10" y2="13" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="20" x2="10" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="27" x2="10" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="13" x2="43" y2="13" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="20" x2="43" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="27" x2="43" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="58" y="28" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Compute-bound</text>
  </g>

  
  <rect x="130" y="220" width="460" height="150" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(155, 267)">
    <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 8 14 v 28 a 20 8 0 0 0 40 0 v -28" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 8 28 a 20 8 0 0 0 40 0" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="232" y="285" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="232" dy="0">Decode at batch 1</tspan>
    <tspan x="232" dy="38">at about 1 FLOP/B</tspan>
  </text>

  
  <line x1="360" y1="370" x2="360" y2="412" stroke="#207448" stroke-width="3.5" />
  <polygon points="351,412 369,412 360,430" fill="#207448" />

  
  <rect x="160" y="430" width="400" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="360" y="471" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">bandwidth sets the speed</text>

  
  <rect x="950" y="220" width="460" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(975, 267)">
    <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="22" y="22" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="20" y1="5" x2="20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="5" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="5" x2="36" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="44" x2="20" y2="51" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="44" x2="28" y2="51" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="44" x2="36" y2="51" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="20" x2="51" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="28" x2="51" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="36" x2="51" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1052" y="285" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1052" dy="0">Prefill of a</tspan>
    <tspan x="1052" dy="38">long prompt</tspan>
  </text>

  
  <line x1="1180" y1="370" x2="1180" y2="412" stroke="#207448" stroke-width="3.5" />
  <polygon points="1171,412 1189,412 1180,430" fill="#207448" />

  
  <rect x="990" y="430" width="380" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1180" y="471" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">compute sets the speed</text>

  
  <line x1="360" y1="494" x2="360" y2="648" stroke="#b0c8b6" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="1180" y1="494" x2="1180" y2="648" stroke="#b0c8b6" stroke-width="2" stroke-dasharray="4 4" />

  
  <line x1="840" y1="140" x2="840" y2="525" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

  
  <rect x="470" y="525" width="740" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="840" y="557" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="840" dy="0">ridge point at 295 FLOP/B,</tspan>
    <tspan x="840" dy="32">computed as 989.5 TFLOPS divided by 3.35 TB/s</tspan>
  </text>

  
  <line x1="840" y1="607" x2="840" y2="705" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

  
  <line x1="160" y1="660" x2="1330" y2="660" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="1355" y="669" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">FLOP per byte</text>

  
  <line x1="360" y1="648" x2="360" y2="672" stroke="#207448" stroke-width="3" />
  <circle cx="360" cy="660" r="9" fill="#207448" stroke="#ffffff" stroke-width="3" />

  <circle cx="840" cy="660" r="6" fill="#207448" />

  <line x1="1180" y1="648" x2="1180" y2="672" stroke="#207448" stroke-width="3" />
  <circle cx="1180" cy="660" r="9" fill="#207448" stroke="#ffffff" stroke-width="3" />

  
  <rect x="250" y="735" width="1100" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="777" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Ridge point = 989.5e12 FLOP/s / 3.35e12 B/s = 295 FLOP/B</text>

  
  <rect x="80" y="850" width="1440" height="80" rx="12" fill="#207448" />
  <text x="800" y="899" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Long prompts are compute-bound, and decode at batch one is bandwidth-bound.</text>
</svg>