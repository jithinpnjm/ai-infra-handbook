<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Load average, run queue and pressure: which one says CPU, which says disk</title>
  <desc>Infographic explaining how load average, run queue, and pressure stall information (PSI) distinguish CPU bottlenecks from disk waits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5" />

  
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold">
    <text x="50" y="75" font-size="48" fill="#303a36">Load average, run queue and pressure:</text>
    <text x="50" y="130" font-size="48" fill="#207448">which one says CPU, which says disk</text>
  </g>

  

  
  <g>
    <rect x="50" y="175" width="550" height="265" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 85 238 A 24 24 0 1 1 125 238" />
      <line x1="105" y1="225" x2="119" y2="211" />
      <circle cx="105" cy="225" r="3" fill="#207448" />
      <line x1="87" y1="210" x2="93" y2="214" />
      <line x1="105" y1="203" x2="105" y2="209" />
      <line x1="123" y1="210" x2="117" y2="214" />
    </g>

    
    <text x="150" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Load average</text>
    <text x="75" y="285" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Running, waiting and uninterruptible tasks</text>
    
    
    <rect x="75" y="318" width="410" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="95" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#207448">uptime or /proc/loadavg</text>
    
    
    <text x="75" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Slow to react, includes disk waits</text>
  </g>

  
  <g>
    <rect x="50" y="475" width="550" height="265" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 83 505 L 83 545 L 127 545" />
      <rect x="90" y="525" width="7" height="20" rx="1" />
      <rect x="102" y="513" width="7" height="32" rx="1" />
      <rect x="114" y="519" width="7" height="26" rx="1" />
    </g>

    
    <text x="150" y="535" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Run queue r</text>
    <text x="75" y="585" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Runnable threads now</text>
    
    
    <rect x="75" y="618" width="180" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="95" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#207448">vmstat 1</text>
    
    
    <text x="75" y="708" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Includes the threads that are running</text>
  </g>

  
  <g>
    <rect x="50" y="775" width="550" height="265" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="105" cy="825" r="22" />
      <line x1="105" y1="825" x2="119" y2="813" />
      <circle cx="105" cy="825" r="3" fill="#207448" />
      <path d="M 94 833 Q 105 820 116 833" />
    </g>

    
    <text x="150" y="835" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">PSI</text>
    <text x="75" y="885" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Percent of time stalled per resource</text>
    
    
    <rect x="75" y="918" width="495" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="95" y="948" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#207448">/proc/pressure/cpu, memory, io</text>
    
    
    <text x="75" y="1008" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">Needs Linux 4.20 or newer</text>
  </g>

  

  
  <g>
    <rect x="940" y="175" width="320" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 972 235 A 18 18 0 1 1 1002 235" />
      <path d="M 983 216 Q 987 210 992 215 Q 992 220 987 223 L 987 228" />
      <circle cx="987" cy="234" r="1.5" fill="#207448" />
    </g>

    <text x="1030" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Load high?</text>
  </g>

  
  <path d="M 1010 265 L 1010 335 L 780 335 L 780 478" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  
  
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <text x="805" y="390">run queue high</text>
    <text x="805" y="422">and pressure high</text>
  </g>

  
  <path d="M 1190 265 L 1190 335 L 1420 335 L 1420 478" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  
  
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <text x="1170" y="375">load high,</text>
    <text x="1170" y="407">run queue idle,</text>
    <text x="1170" y="439">no pressure</text>
  </g>

  
  <g>
    <rect x="640" y="480" width="430" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="837" y="517" width="36" height="36" rx="4" />
      <rect x="846" y="526" width="18" height="18" rx="2" />
      
      <line x1="844" y1="517" x2="844" y2="510" />
      <line x1="855" y1="517" x2="855" y2="510" />
      <line x1="866" y1="517" x2="866" y2="510" />
      <line x1="844" y1="553" x2="844" y2="560" />
      <line x1="855" y1="553" x2="855" y2="560" />
      <line x1="866" y1="553" x2="866" y2="560" />
      <line x1="837" y1="524" x2="830" y2="524" />
      <line x1="837" y1="535" x2="830" y2="535" />
      <line x1="837" y1="546" x2="830" y2="546" />
      <line x1="873" y1="524" x2="880" y2="524" />
      <line x1="873" y1="535" x2="880" y2="535" />
      <line x1="873" y1="546" x2="880" y2="546" />
    </g>

    
    <text x="855" y="630" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU is the bottleneck</text>
  </g>

  
  <g>
    <rect x="1110" y="480" width="450" height="260" rx="16" fill="#fff5eb" stroke="#db8129" stroke-width="4" />
    
    
    <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="1335" cy="518" rx="22" ry="7" />
      <path d="M 1313 533 A 22 7 0 0 0 1357 533" />
      <path d="M 1313 548 A 22 7 0 0 0 1357 548" />
      <line x1="1313" y1="518" x2="1313" y2="548" />
      <line x1="1357" y1="518" x2="1357" y2="548" />
    </g>

    
    <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="1335" y="605" font-size="30" font-weight="bold" fill="#db8129">Disk waits:</text>
      <text x="1335" y="642" font-size="24" fill="#303a36">uninterruptible tasks</text>
      <text x="1335" y="674" font-size="24" fill="#303a36">inflate load without</text>
      <text x="1335" y="706" font-size="24" fill="#303a36">using CPU</text>
    </g>
  </g>

  
  <g>
    <rect x="640" y="775" width="920" height="265" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 685 895 C 685 880 700 870 720 870 C 740 870 755 880 755 895 C 755 907 745 917 730 920 L 726 932 L 715 921 C 697 920 685 909 685 895 Z" />
    </g>

    
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <text x="785" y="890">Say load is demand, not just CPU, so I will</text>
      <text x="785" y="935">confirm with the run queue and pressure.</text>
    </g>
  </g>

  
  <g>
    <rect x="50" y="1075" width="1500" height="65" rx="12" fill="#207448" />
    <text x="800" y="1117" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Load is a question, run queue and PSI answer it.</text>
  </g>
</svg>