    <path d="M 114 750 h 8 l 6 -14 l 8 28 l 8 -20 l 6 6 h 8" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="188" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
