      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Multi-region failover for dedicated endpoints</text>

  
  
  <path d="M 500 250 H 533 Q 545 250 545 262 V 463 Q 545 475 557 475 H 590" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 500 750 H 533 Q 545 750 545 738 V 537 Q 545 525 557 525 H 590" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1010 475 H 1043 Q 1055 475 1055 463 V 262 Q 1055 250 1067 250 H 1100" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
