<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Multi-region failover for dedicated endpoints</title>
  <desc>Architecture flowchart showing a customer app routing through a client-side switch to primary and warm endpoints across regions, supported by distributed weights and real token health probes.</desc>

  <defs>
