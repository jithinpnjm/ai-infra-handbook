  <g>
    <rect x="40" y="665" width="1520" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(70, 712)">
      <line x1="28" y1="8" x2="28" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="8" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 8 16 L 2 32 L 14 32 Z" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 48 16 L 42 32 L 54 32 Z" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="48" x2="40" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="145" y="708" font-family="sans-serif" fill="#303a36">
      <tspan x="145" dy="0" font-size="30" font-weight="bold">surge you can afford is set by spare GPUs, not by a percentage:</tspan>
      <tspan x="145" dy="36" font-size="24">pod cap = the smaller of replicas plus surge and replicas plus spare GPU slots;</tspan>
      <tspan x="145" dy="34" font-size="24">surge above the spare count buys nothing because extra pods stay pending</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="835" width="1520" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(70, 882)">
      <line x1="8" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="36" cy="14" r="7" fill="#207448" />
      <line x1="8" y1="28" x2="48" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="20" cy="28" r="7" fill="#207448" />
      <line x1="8" y1="42" x2="48" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="40" cy="42" r="7" fill="#207448" />
    </g>

    <text x="145" y="878" font-family="sans-serif" fill="#303a36">
      <tspan x="145" dy="0" font-size="30" font-weight="bold">three levers: schedule rollouts in a quiet hour for larger headroom;</tspan>
      <tspan x="145" dy="36" font-size="24">roll in small batches, surge one at a time; if no spare exists run with surge zero</tspan>
      <tspan x="145" dy="34" font-size="24">and unavailable one only when the forecast shows N minus 1 capacity is enough</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1005" width="1520" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(70, 1052)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="145" y="1058" font-family="sans-serif" fill="#303a36">
      <tspan x="145" dy="0" font-size="30" font-weight="bold">Cluster Autoscaler reacts to pending pods so the cluster is already</tspan>
      <tspan x="145" dy="40" font-size="24">full when it acts; node provisioning takes time</tspan>
    </text>
  </g>
</svg>