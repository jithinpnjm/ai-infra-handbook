    <line x1="720" y1="369" x2="736" y2="393" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="736" y1="369" x2="720" y2="393" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <g>
    <rect x="820" y="145" width="740" height="505" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(850, 165)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="8" y="8" width="16" height="16" rx="3" fill="#207448" />
      <rect x="32" y="8" width="16" height="16" rx="3" fill="#207448" />
      <rect x="8" y="32" width="16" height="16" rx="3" fill="#207448" />
      <rect x="32" y="32" width="16" height="16" rx="3" fill="#207448" />
      <line x1="16" y1="24" x2="16" y2="32" stroke="#207448" stroke-width="3" />
      <line x1="40" y1="24" x2="40" y2="32" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="16" x2="32" y2="16" stroke="#207448" stroke-width="3" />
      <line x1="24" y1="40" x2="32" y2="40" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="922" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spare pool holds whole nodes:</text>
    <text x="850" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="850" dy="0">four free GPUs together on one node</tspan>
      <tspan x="850" dy="34">(possibly in the same NVLink domain),</tspan>
      <tspan x="850" dy="34">the new replica schedules</tspan>
    </text>

    
    <rect x="850" y="355" width="680" height="52" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="872" cy="381" r="5" fill="#207448" />
    <rect x="892" y="363" width="64" height="36" rx="4" fill="#a4baa8" stroke="#718b76" stroke-width="1.5" />
