<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A surge slot for a multi-GPU replica needs GPUs together</title>
  <desc>Visual comparison showing that scattered free GPUs across nodes cause multi-GPU pods to stay pending, while whole-node spare pools enable successful scheduling.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A surge slot for a multi-GPU replica</tspan>
    <tspan x="800" dy="56">needs GPUs together</tspan>
  </text>

  
  <g>
    <rect x="40" y="145" width="740" height="505" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(70, 165)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="8" y="8" width="16" height="16" rx="3" fill="#207448" />
      <rect x="32" y="8" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="8" y="32" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="32" y="32" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="142" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">free GPUs scattered:</text>
    <text x="70" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">one free GPU on each of four nodes,</tspan>
      <tspan x="70" dy="34">count looks like 4 free but a 4-GPU</tspan>
      <tspan x="70" dy="34">replica pod will not schedule; pending</tspan>
    </text>

    
    <rect x="70" y="355" width="680" height="52" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="92" cy="381" r="5" fill="#207448" />
    
