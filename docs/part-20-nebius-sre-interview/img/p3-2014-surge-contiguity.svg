    <rect x="568" y="363" width="64" height="36" rx="4" fill="#a4baa8" stroke="#718b76" stroke-width="1.5" />
    
    <rect x="644" y="363" width="64" height="36" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />

    
    <rect x="70" y="420" width="680" height="52" rx="8" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="92" cy="446" r="5" fill="#207448" />
