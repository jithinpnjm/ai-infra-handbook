    <rect x="416" y="558" width="64" height="36" rx="4" fill="#a4baa8" stroke="#718b76" stroke-width="1.5" />
    <rect x="492" y="558" width="64" height="36" rx="4" fill="#a4baa8" stroke="#718b76" stroke-width="1.5" />
    <rect x="568" y="558" width="64" height="36" rx="4" fill="#a4baa8" stroke="#718b76" stroke-width="1.5" />
    <rect x="644" y="558" width="64" height="36" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />

    
