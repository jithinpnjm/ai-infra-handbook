<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Drill 11: control plane slow while serving is fine</title>
  <desc>Infographic explaining why Kubernetes control plane slows down while serving remains fine due to a cross-region etcd member.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 1,2 L 12,7 L 1,12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 1,2 L 12,7 L 1,12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Drill 11: control plane slow while serving is fine</text>

  
  
  
  <g id="zone-control-plane">
    
    <rect x="40" y="95" width="990" height="575" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 40,107 A 12,12 0 0,1 52,95 L 1018,95 A 12,12 0 0,1 1030,107 L 1030,165 L 40,165 Z" fill="#e8f1ea" />

    
    <g transform="translate(60, 102)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="28" r="7" fill="#207448" />
      <line x1="28" y1="6" x2="28" y2="50" stroke="#207448" stroke-width="3" />
      <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="12" x2="44" y2="44" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="44" x2="44" y2="12" stroke="#207448" stroke-width="3" />
    </g>
    <text x="135" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Control plane side</text>

    
    <rect x="60" y="180" width="950" height="235" rx="8" fill="#f9fbf9" stroke="#c2dac8" stroke-width="1.5" />

    
    <g transform="translate(80, 192)">
      <ellipse cx="14" cy="7" rx="12" ry="5" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 2,7 v 10 c 0,2.8 5.4,5 12,5 s 12,-2.2 12,-5 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
      <ellipse cx="30" cy="16" rx="12" ry="5" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 18,16 v 10 c 0,2.8 5.4,5 12,5 s 12,-2.2 12,-5 v -10" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="135" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">3 etcd members</text>

    
    <rect x="75" y="240" width="455" height="160" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(92, 255)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="26" cy="12" r="3" fill="#207448" />
      <line x1="6" y1="12" x2="16" y2="12" stroke="#207448" stroke-width="2.5" />
      <rect x="8" y="36" width="36" height="24" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="34" cy="48" r="3" fill="#207448" />
      <line x1="14" y1="48" x2="24" y2="48" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="155" y="305" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">two near each other with</tspan>
      <tspan x="155" dy="36">round trips under 1 ms</tspan>
    </text>

    
    <line x1="530" y1="320" x2="575" y2="320" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />

    
    <rect x="580" y="240" width="415" height="160" rx="6" fill="#fdf6ee" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(595, 255)">
      <rect x="0" y="20" width="36" height="24" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
      <circle cx="26" cy="32" r="3" fill="#db8129" />
      <line x1="6" y1="32" x2="16" y2="32" stroke="#db8129" stroke-width="2.5" />
      <path d="M 6,12 A 16,16 0 0,1 30,12" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 12,16 A 8,8 0 0,1 24,16" fill="none" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="650" y="290" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="650" dy="0">one rebuilt yesterday in</tspan>
      <tspan x="650" dy="34">another region with</tspan>
      <tspan x="650" dy="34">about 60 ms round trip</tspan>
    </text>

    
    <rect x="60" y="430" width="445" height="225" rx="8" fill="#f9fbf9" stroke="#c2dac8" stroke-width="1.5" />
    
    <g transform="translate(80, 448)">
      <ellipse cx="26" cy="14" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 4,14 v 18 c 0,5 9.8,9 22,9 s 22,-4 22,-9 v -18" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 4,32 v 18 c 0,5 9.8,9 22,9 s 22,-4 22,-9 v -18" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="145" y="490" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">disk is fast local SSD</tspan>
      <tspan x="145" dy="36">on all members so disk</tspan>
      <tspan x="145" dy="36">is not the cause</tspan>
    </text>

    
    <rect x="520" y="430" width="490" height="225" rx="8" fill="#f9fbf9" stroke="#c2dac8" stroke-width="1.5" />
    
    
    <g transform="translate(535, 448)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
      <polyline points="16,8 16,16 22,16" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="580" y="470" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="580" dy="0">leader changed twice</tspan>
      <tspan x="580" dy="30">in the last hour</tspan>
    </text>

    
    <g transform="translate(535, 520)">
      <rect x="0" y="2" width="32" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
      <polyline points="6,9 12,14 6,19" fill="none" stroke="#207448" stroke-width="2" />
      <line x1="16" y1="19" x2="24" y2="19" stroke="#207448" stroke-width="2" />
    </g>
    <text x="580" y="538" font-size="24" fill="#303a36">
      <tspan x="580" dy="0"><tspan font-family="monospace">kubectl</tspan><tspan font-family="sans-serif"> commands</tspan></tspan>
      <tspan x="580" dy="30" font-family="sans-serif">take ten seconds</tspan>
    </text>

    
    <g transform="translate(535, 588)">
      <polyline points="4,24 12,16 20,20 28,8" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <polyline points="20,8 28,8 28,16" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="580" y="608" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="580" dy="0">writes and reads</tspan>
      <tspan x="580" dy="30">slow and rising</tspan>
    </text>
  </g>

  
  
  
  <g id="zone-data-plane">
    
    <rect x="1070" y="95" width="490" height="575" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 1070,107 A 12,12 0 0,1 1082,95 L 1548,95 A 12,12 0 0,1 1560,107 L 1560,165 L 1070,165 Z" fill="#e8f1ea" />

    
    <g transform="translate(1090, 102)">
      <rect x="2" y="4" width="48" height="42" rx="5" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="16" x2="50" y2="16" stroke="#207448" stroke-width="2.5" />
      <circle cx="10" cy="10" r="3" fill="#207448" />
      <circle cx="18" cy="10" r="3" fill="#207448" />
    </g>
    <text x="1155" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Data plane side</text>

    
    <rect x="1090" y="180" width="450" height="475" rx="8" fill="#f9fbf9" stroke="#c2dac8" stroke-width="1.5" />

    
    <g transform="translate(1110, 205)">
      
      <rect x="10" y="10" width="115" height="85" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="35" cy="45" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="35" cy="45" r="5" fill="#207448" />
      <line x1="62" y1="38" x2="110" y2="38" stroke="#207448" stroke-width="2" />
      <line x1="62" y1="52" x2="100" y2="52" stroke="#207448" stroke-width="2" />

      
      <rect x="145" y="10" width="115" height="85" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="170" cy="45" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="170" cy="45" r="5" fill="#207448" />
      <line x1="197" y1="38" x2="245" y2="38" stroke="#207448" stroke-width="2" />
      <line x1="197" y1="52" x2="235" y2="52" stroke="#207448" stroke-width="2" />

      
      <rect x="280" y="10" width="115" height="85" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="305" cy="45" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="305" cy="45" r="5" fill="#207448" />
      <line x1="332" y1="38" x2="380" y2="38" stroke="#207448" stroke-width="2" />
      <line x1="332" y1="52" x2="370" y2="52" stroke="#207448" stroke-width="2" />

      
      <line x1="67" y1="135" x2="67" y2="105" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <line x1="202" y1="135" x2="202" y2="105" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <line x1="337" y1="135" x2="337" y2="105" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      <line x1="30" y1="135" x2="375" y2="135" stroke="#207448" stroke-width="3" />
    </g>

    
    <text x="1115" y="420" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1115" dy="0">serving pods have no</tspan>
      <tspan x="1115" dy="42">dependency on the</tspan>
      <tspan x="1115" dy="42">Kubernetes API so they</tspan>
      <tspan x="1115" dy="42">keep answering</tspan>
    </text>
  </g>

  
  
  
  
  <g id="card-cause-note">
    <rect x="40" y="695" width="480" height="395" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 40,705 A 10,10 0 0,1 50,695 L 510,695 A 10,10 0 0,1 520,705 L 520,755 L 40,755 Z" fill="#e8f1ea" />
    
    
    <g transform="translate(60, 706)">
      <polygon points="20,4 38,36 2,36" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="20" y1="16" x2="20" y2="24" stroke="#207448" stroke-width="2.5" />
      <circle cx="20" cy="30" r="1.5" fill="#207448" />
    </g>
    <text x="115" y="738" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Cause note</text>

    <text x="65" y="795" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">etcd defaults assume</tspan>
      <tspan x="65" dy="36">one datacenter; test round</tspan>
      <tspan x="65" dy="36">trips and tune heartbeat</tspan>
      <tspan x="65" dy="36">interval and election</tspan>
      <tspan x="65" dy="36">timeout if you must span;</tspan>
      <tspan x="65" dy="36">etcd across regions is</tspan>
      <tspan x="65" dy="36">strongly discouraged</tspan>
    </text>
  </g>

  
  <g id="card-fix">
    <rect x="550" y="695" width="500" height="395" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 550,705 A 10,10 0 0,1 560,695 L 1040,695 A 10,10 0 0,1 1050,705 L 1050,755 L 550,755 Z" fill="#e8f1ea" />

    
    <g transform="translate(570, 706)">
      <path d="M 28,6 A 10,10 0 0,0 16,18 L 6,28 A 4,4 0 0,0 12,34 L 22,24 A 10,10 0 0,0 34,12 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="625" y="738" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Fix</text>

    <text x="575" y="790" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" dy="0">bring the member back</tspan>
      <tspan x="575" dy="33">close, or remove it and add</tspan>
      <tspan x="575" dy="33">one in the same datacenter;</tspan>
      <tspan x="575" dy="33">one membership change at</tspan>
      <tspan x="575" dy="33">a time; snapshot first;</tspan>
      <tspan x="575" dy="33">do not defragment a live</tspan>
      <tspan x="575" dy="33">member as a reflex;</tspan>
      <tspan x="575" dy="33">do not roll the whole</tspan>
      <tspan x="575" dy="33">control plane at once</tspan>
    </text>
  </g>

  
  <g id="card-prevention">
    <rect x="1080" y="695" width="480" height="395" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 1080,705 A 10,10 0 0,1 1090,695 L 1550,695 A 10,10 0 0,1 1560,705 L 1560,755 L 1080,755 Z" fill="#e8f1ea" />

    
    <g transform="translate(1100, 706)">
      <path d="M 18,4 L 32,9 V 19 C 32,27 26,33 18,36 C 10,33 4,27 4,19 V 9 Z" fill="none" stroke="#207448" stroke-width="2.5" />
      <polyline points="11,18 16,23 25,14" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    <text x="1155" y="738" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Prevention</text>

    <text x="1105" y="795" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">members in one</tspan>
      <tspan x="1105" dy="36">low-latency domain</tspan>
      <tspan x="1105" dy="36">with an odd count;</tspan>
      <tspan x="1105" dy="36">alert on leader changes</tspan>
      <tspan x="1105" dy="36">and request latency</tspan>
    </text>
  </g>

  
  
  
  <g id="takeaway-bar">
    <rect x="40" y="1115" width="1520" height="65" rx="8" fill="#207448" />
    <text x="800" y="1156" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">running pods are fine means the API layer is slow, not the data plane</text>
  </g>
</svg>