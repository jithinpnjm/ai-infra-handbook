<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>[[0] * 2] * 2 gives two rows that are one list</title>
  <desc>Visual comparison showing that list multiplication [[0] * 2] * 2 copies references to a single shared list object, while a list comprehension creates separate list objects for each row.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 Z" fill="#db8129" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#153623" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">[[0] * 2] * 2 gives two rows that are one list</text>

  
  <line x1="800" y1="125" x2="800" y2="855" stroke="#c8dcd0" stroke-width="2" stroke-dasharray="6 6" />

  
  
  
  <g id="left-panel">
    
    <rect x="50" y="125" width="720" height="730" rx="16" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="2" filter="url(#card-shadow)" />

    
    <g transform="translate(75, 148)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <path d="M 22 28 L 34 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 24 20 L 18 20 C 13.5 20 10 23.5 10 28 C 10 32.5 13.5 36 18 36 L 24 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 32 20 L 38 20 C 42.5 20 46 23.5 46 28 C 46 32.5 42.5 36 38 36 L 32 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="150" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="150" dy="0">Multiplying a list </tspan><tspan x="150" dy="36">copies references</tspan></text>

    
    <rect x="75" y="235" width="670" height="54" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="410" y="271" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">[[0] * 2] * 2</text>

    
    <g id="left-outer-list">
      
      <rect x="75" y="345" width="160" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <text x="155" y="398" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">row 0</text>

      
      <rect x="75" y="475" width="160" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <text x="155" y="528" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">row 1</text>
    </g>

    
    <g id="left-inner-list">
      <rect x="355" y="330" width="390" height="270" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />

      
      <rect x="370" y="347" width="360" height="50" rx="8" fill="#fff5eb" />
      <text x="550" y="381" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">one shared list object</text>

      
      
      <rect x="390" y="415" width="145" height="75" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2" />
      <text x="462" y="464" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#db8129">1</text>

      
      <rect x="565" y="415" width="145" height="75" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="2" />
      <text x="637" y="464" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">0</text>

      
      <text x="550" y="534" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="550" dy="0">setting one cell </tspan><tspan x="550" dy="32">changes both rows</tspan></text>
    </g>

    
    
    <path d="M 235 387 L 295 387 L 295 425 L 353 425" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
    
    <path d="M 235 517 L 295 517 L 295 480 L 353 480" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

    
    <g id="left-result-strip">
      <rect x="75" y="690" width="670" height="135" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" filter="url(#card-shadow)" />

      
      <text x="300" y="770" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">[[1, 0], [1, 0]]</text>

      
      <g transform="translate(535, 720)">
        <circle cx="36" cy="48" r="26" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
        <path d="M 26 38 L 46 58 M 46 38 L 26 58" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
        <text x="80" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">wrong</text>
      </g>
    </g>
  </g>

  
  
  
  <g id="right-panel">
    
    <rect x="830" y="125" width="720" height="730" rx="16" fill="#e8f1ea" stroke="#c8dcd0" stroke-width="2" filter="url(#card-shadow)" />

    
    <g transform="translate(855, 148)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="28" x2="46" y2="28" stroke="#207448" stroke-width="3.5" />
      <line x1="28" y1="10" x2="28" y2="46" stroke="#207448" stroke-width="3.5" />
      <rect x="15" y="15" width="10" height="8" rx="2" fill="#207448" />
      <rect x="31" y="33" width="10" height="8" rx="2" fill="#207448" />
    </g>

    
    <text x="930" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan x="930" dy="0">Comprehension makes </tspan><tspan x="930" dy="36">separate rows</tspan></text>

    
    <rect x="855" y="235" width="670" height="54" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <text x="1190" y="271" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">[[0] * 2 for _ in range(2)]</text>

    
    <g id="right-outer-list">
      
      <rect x="855" y="360" width="120" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="915" cy="402" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="915" cy="402" r="5" fill="#207448" />

      
      <rect x="855" y="490" width="120" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="915" cy="532" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <circle cx="915" cy="532" r="5" fill="#207448" />
    </g>

    
    <g id="right-inner-lists">
      
      <rect x="1115" y="294" width="410" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1320" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">separate list object</text>

      
      <rect x="1115" y="354" width="410" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
      
      <rect x="1145" y="368" width="160" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="1225" y="415" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#207448">1</text>
      
      <rect x="1335" y="368" width="160" height="70" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="2" />
      <text x="1415" y="415" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">0</text>

      
      <rect x="1115" y="484" width="410" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
      
      <rect x="1145" y="498" width="160" height="70" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="2" />
      <text x="1225" y="545" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">0</text>
      
      <rect x="1335" y="498" width="160" height="70" rx="8" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="2" />
      <text x="1415" y="545" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">0</text>
    </g>

    
    
    <line x1="975" y1="402" x2="1113" y2="402" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
    
    <line x1="975" y1="532" x2="1113" y2="532" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <g id="right-result-strip">
      <rect x="855" y="690" width="670" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />

      
      <text x="1080" y="770" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">[[1, 0], [0, 0]]</text>

      
      <g transform="translate(1315, 720)">
        <circle cx="36" cy="48" r="26" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
        <path d="M 24 48 L 33 57 L 50 39" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="80" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">right</text>
      </g>
    </g>
  </g>

  
  
  
  <g id="takeaway-bar">
    <rect x="50" y="885" width="1500" height="75" rx="12" fill="#207448" filter="url(#card-shadow)" />
    <text x="800" y="932" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Build the grid with a comprehension so each row is its own list.</text>
  </g>
</svg>