<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Token admission: reserve at the door, refund the unused part at the end</title>
  <desc>Visual infographic explaining token admission flow, request and token bucket checks, rejection paths, admission, and end-of-response token refund formula.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Token admission: reserve at the door,</text>
  <text x="800" y="120" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">refund the unused part at the end</text>

  
  <g transform="translate(425, 150)">
    <rect x="0" y="0" width="225" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 28 32 L 28 26 C 28 22 34 22 34 22 L 56 22 C 56 22 62 22 62 26 L 62 32 L 66 38 L 66 84 C 66 88 62 92 58 92 L 32 92 C 28 92 24 88 24 84 L 24 38 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="24" y1="32" x2="66" y2="32" stroke="#207448" stroke-width="3" />
    <path d="M 18 45 C 14 52 14 68 24 72" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 72 45 C 76 52 76 68 66 72" fill="none" stroke="#207448" stroke-width="2.5" />
    
    <text x="146" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Requests</text>
    <text x="146" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">per second</text>
  </g>

  
  <g transform="translate(765, 150)">
    <rect x="0" y="0" width="225" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 28 32 L 28 26 C 28 22 34 22 34 22 L 56 22 C 56 22 62 22 62 26 L 62 32 L 66 38 L 66 84 C 66 88 62 92 58 92 L 32 92 C 28 92 24 88 24 84 L 24 38 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="24" y1="32" x2="66" y2="32" stroke="#207448" stroke-width="3" />
    <circle cx="45" cy="55" r="12" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 18 45 C 14 52 14 68 24 72" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 72 45 C 76 52 76 68 66 72" fill="none" stroke="#207448" stroke-width="2.5" />
    
    <text x="146" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Tokens</text>
    <text x="146" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">per second</text>
  </g>

  
  <g transform="translate(45, 295)">
    <rect x="0" y="0" width="310" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(130, 18)">
      <path d="M 0 0 L 32 0 L 50 18 L 50 56 L 0 56 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 32 0 L 32 18 L 50 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="12" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="40" x2="38" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="155" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Request arrives</text>
    <text x="155" y="146" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">with prompt tokens</text>
    <text x="155" y="174" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">and max tokens</text>
  </g>

  
  <g transform="translate(395, 295)">
    <rect x="0" y="0" width="285" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(118, 18)">
      <path d="M 4 8 L 44 8 L 38 52 L 10 52 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 12 8 C 12 -4 36 -4 36 8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="24" cy="30" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <text x="24" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#207448" text-anchor="middle">1</text>
    </g>
    
    <text x="142" y="115" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Requests bucket</text>
    <text x="142" y="156" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">take 1</text>
    
    <circle cx="24" cy="24" r="22" fill="#207448" />
    <text x="24" y="24" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  </g>

  
  <g transform="translate(720, 295)">
    <rect x="0" y="0" width="315" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(133, 18)">
      <path d="M 4 8 L 44 8 L 38 52 L 10 52 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 12 8 C 12 -4 36 -4 36 8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="18" cy="30" r="8" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="30" cy="30" r="8" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="157" y="110" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Tokens bucket</text>
    <text x="157" y="145" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">take prompt</text>
    <text x="157" y="174" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">plus max tokens</text>
    
    <circle cx="24" cy="24" r="22" fill="#207448" />
    <text x="24" y="24" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  </g>

  
  <g transform="translate(1055, 295)">
    <rect x="0" y="0" width="500" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(225, 14)">
      <path d="M 25 0 L 50 10 L 50 28 C 50 42 25 54 25 54 C 25 54 0 42 0 28 L 0 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 15 26 L 22 34 L 35 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="250" y="102" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Admit,</text>
    <text x="250" y="136" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">reserve held</text>
  </g>

  
  <g transform="translate(395, 565)">
    <rect x="0" y="0" width="285" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(118, 18)">
      <circle cx="25" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3.5" />
      <polyline points="25,14 25,28 35,34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="20" y1="2" x2="30" y2="2" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    
    <text x="142" y="122" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Reject with</text>
    <text x="142" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">wait time</text>
  </g>

  
  <g transform="translate(180, 635)">
    <rect x="0" y="0" width="195" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="97" y="34" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">slot not burned</text>
  </g>

  
  <g transform="translate(720, 565)">
    <rect x="0" y="0" width="315" height="190" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(133, 18)">
      <path d="M 12 36 A 20 20 0 1 1 42 36" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <polyline points="4,28 12,36 20,28" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="18" y="24" width="14" height="14" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="157" y="122" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Refund the</text>
    <text x="157" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">request slot</text>
  </g>

  
  <g transform="translate(675, 805)">
    <rect x="0" y="0" width="370" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="185" y="44" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">a request bigger than the</text>
    <text x="185" y="82" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">whole bucket is rejected</text>
    <text x="185" y="120" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">at once, never queued</text>
  </g>

  
  <g transform="translate(1055, 515)">
    <rect x="0" y="0" width="500" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(225, 14)">
      <line x1="8" y1="4" x2="8" y2="52" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 8 8 L 44 8 L 32 24 L 44 40 L 8 40 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    </g>
    
    <text x="250" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Response ends</text>
    
    <circle cx="24" cy="24" r="22" fill="#207448" />
    <text x="24" y="24" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  </g>

  
  <g transform="translate(1055, 745)">
    <rect x="0" y="0" width="500" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(225, 14)">
      <path d="M 10 32 A 20 20 0 1 1 42 32" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <polyline points="2,24 10,32 18,24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="26" cy="26" r="8" fill="none" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="250" y="105" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Refund unused</text>
    <text x="250" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">output tokens</text>
    
    <text x="250" y="184" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">unused = reserved minus prompt</text>
    <text x="250" y="214" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">minus generated</text>
  </g>

  

  
  <line x1="355" y1="390" x2="395" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="680" y1="390" x2="720" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="1035" y1="390" x2="1055" y2="390" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="537" y1="485" x2="537" y2="565" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="877" y1="485" x2="877" y2="565" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="720" y1="660" x2="680" y2="660" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="1305" y1="445" x2="1305" y2="515" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="1305" y1="665" x2="1305" y2="745" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(45, 1025)">
    <rect x="0" y="0" width="1510" height="65" rx="12" fill="#207448" />
    <text x="755" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Count tokens, reserve at admission, refund at the end, and reject what can never fit.</text>
  </g>
</svg>