<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Token admission: reserve at the door, refund the unused part at the end</title>
  <desc>Visual infographic detailing token admission rate limiting with request and token buckets, early rejection, and unused token refunds.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#db8129"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#303a36" text-anchor="middle">Token admission: reserve at the door,</text>
  <text x="800" y="115" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#303a36" text-anchor="middle">refund the unused part at the end</text>

  
  
  <g filter="url(#card-shadow)">
    <rect x="240" y="150" width="380" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 272 180 L 302 180 L 298 218 C 298 223, 276 223, 276 218 Z" fill="#cbe3d3" stroke="#207448" stroke-width="3"/>
    <ellipse cx="287" cy="180" rx="15" ry="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <path d="M 276 180 C 276 168, 298 168, 298 180" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="455" y="208" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Requests per second</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="980" y="150" width="380" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 1012 180 L 1042 180 L 1038 218 C 1038 223, 1016 223, 1016 218 Z" fill="#cbe3d3" stroke="#207448" stroke-width="3"/>
    <ellipse cx="1027" cy="180" rx="15" ry="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <path d="M 1016 180 C 1016 168, 1038 168, 1038 180" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="1195" y="208" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Tokens per second</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="50" y="360" width="230" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="165" y="415" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Request arrives with</text>
    <text x="165" y="450" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">prompt tokens and</text>
    <text x="165" y="485" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">max tokens</text>
  </g>

  
  <path d="M 280 435 L 328 435" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" fill="none"/>

  
  <circle cx="330" cy="325" r="22" fill="#207448"/>
  <text x="330" y="333" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g filter="url(#card-shadow)">
    <rect x="330" y="360" width="230" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="445" y="425" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Requests bucket</text>
    <text x="445" y="465" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">take 1</text>
  </g>

  
  <path d="M 560 435 L 618 435" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" fill="none"/>

  
  <circle cx="620" cy="325" r="22" fill="#207448"/>
  <text x="620" y="333" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g filter="url(#card-shadow)">
    <rect x="620" y="360" width="260" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="750" y="415" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">Tokens bucket take</text>
    <text x="750" y="450" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">prompt plus</text>
    <text x="750" y="485" font-family="system-ui, sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">max tokens</text>
  </g>

  
  <path d="M 880 435 L 928 435" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" fill="none"/>

  
  <g filter="url(#card-shadow)">
    <rect x="930" y="360" width="220" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="1040" y="425" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Admit,</text>
    <text x="1040" y="465" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">reserve held</text>
  </g>

  
  <path d="M 1150 435 L 1198 435" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" fill="none"/>

  
  <circle cx="1200" cy="325" r="22" fill="#207448"/>
  <text x="1200" y="333" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g filter="url(#card-shadow)">
    <rect x="1200" y="360" width="220" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1310" y="425" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Response</text>
    <text x="1310" y="465" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">ends</text>
  </g>

  
  <path d="M 1310 510 L 1310 598" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" fill="none"/>

  
  <g filter="url(#card-shadow)">
    <rect x="1040" y="600" width="510" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="1295" y="655" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Refund unused output tokens</text>
    <line x1="1080" y1="680" x2="1510" y2="680" stroke="#e8f1ea" stroke-width="2"/>
    <text x="1295" y="730" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">unused = reserved minus</text>
    <text x="1295" y="775" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">prompt minus generated</text>
  </g>

  
  <path d="M 445 510 L 445 868" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow-red)" fill="none"/>

  
  <g>
    <rect x="70" y="670" width="210" height="80" rx="12" fill="#f0f4f1" stroke="#7a8c82" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="175" y="718" font-family="system-ui, sans-serif" font-size="24" font-style="italic" fill="#303a36" text-anchor="middle">slot not burned</text>
    <path d="M 280 710 L 445 710" stroke="#7a8c82" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="330" y="870" width="230" height="130" rx="16" fill="#fdeeed" stroke="#c0392b" stroke-width="2.5"/>
    <text x="445" y="925" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">Reject with</text>
    <text x="445" y="965" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">wait time</text>
  </g>

  
  <path d="M 660 510 L 660 868" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow-red)" fill="none"/>

  
  <g>
    <rect x="685" y="615" width="330" height="160" rx="12" fill="#fff9ed" stroke="#db8129" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="850" y="660" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">a request bigger than the</text>
    <text x="850" y="700" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">whole bucket is rejected</text>
    <text x="850" y="740" font-family="system-ui, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">at once, never queued</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="640" y="870" width="260" height="130" rx="16" fill="#fdeeed" stroke="#c0392b" stroke-width="2.5"/>
    <text x="770" y="925" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">Refund the</text>
    <text x="770" y="965" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">request slot</text>
  </g>

  
  <path d="M 640 935 L 562 935" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow-red)" fill="none"/>

  
  <g filter="url(#card-shadow)">
    <rect x="50" y="1060" width="1500" height="74" rx="16" fill="#207448"/>
    <text x="800" y="1106" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Count tokens, reserve at admission, refund at the end, and reject what can never fit.</text>
  </g>
</svg>