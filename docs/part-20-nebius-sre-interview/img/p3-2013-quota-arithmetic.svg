<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Sizing a token quota: reserve, refund and burst</title>
  <desc>Visual infographic explaining token quota sizing arithmetic: reservation per call, start rate, early-finish refunds, and burst capacity.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Sizing a token quota: reserve, refund and burst</text>

  
  <rect x="60" y="90" width="1480" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 112)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="48" rx="8" />
    <line x1="4" y1="20" x2="52" y2="20" />
    <line x1="28" y1="20" x2="28" y2="52" />
    <circle cx="16" cy="36" r="4" />
    <circle cx="40" cy="36" r="4" />
  </g>
  <text x="165" y="134" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">Worked example. Tenant pays for 10,000 tokens per second </tspan>
    <tspan x="165" dy="36">and sends chat calls of 1,500 prompt tokens with max output 500.</tspan>
  </text>

  
  <rect x="60" y="230" width="710" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(387, 250)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 50 16 C 50 36 28 50 28 50 C 28 50 6 36 6 16 Z" />
    <circle cx="28" cy="26" r="6" />
    <path d="M 28 32 L 28 38" />
  </g>
  <text x="415" y="358" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="415" dy="0">Reservation per call: </tspan>
    <tspan x="415" dy="40">1,500 + 500 = 2,000 tokens.</tspan>
  </text>

  
  <rect x="830" y="230" width="710" height="240" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1157, 250)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
    <line x1="28" y1="2" x2="28" y2="6" />
    <line x1="28" y1="50" x2="28" y2="54" />
  </g>
  <text x="1185" y="358" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="1185" dy="0">Start rate: 10,000 / 2,000 </tspan>
    <tspan x="1185" dy="40">= 5 requests per second.</tspan>
  </text>

  
  <rect x="60" y="510" width="710" height="290" rx="16" fill="#fef8f2" stroke="#db8129" stroke-width="3" />
  <g transform="translate(387, 530)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 28 C 10 16 20 8 32 8 C 42 8 50 15 50 24" />
    <polyline points="16,36 10,28 18,22" />
    <path d="M 46 28 C 46 40 36 48 24 48 C 14 48 6 41 6 32" />
    <polyline points="40,20 46,28 38,34" />
  </g>
  <text x="415" y="632" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="415" dy="0">Refund when calls finish early: real output </tspan>
    <tspan x="415" dy="35">averages 300, call used 1,800, refund 200, </tspan>
    <tspan x="415" dy="35">so the sustained start rate rises to </tspan>
    <tspan x="415" dy="35">about 5.5 per second (10,000 / 1,800).</tspan>
  </text>

  
  <rect x="830" y="510" width="710" height="290" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1157, 530)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="32,6 14,30 28,30 24,50 42,26 28,26" />
  </g>
  <text x="1185" y="635" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1185" dy="0">Burst: set burst to 10 seconds of rate </tspan>
    <tspan x="1185" dy="38">= 100,000 tokens, which allows </tspan>
    <tspan x="1185" dy="38">50 requests at once.</tspan>
  </text>

  
  <rect x="60" y="840" width="1480" height="105" rx="14" fill="#207448" />
  <text x="800" y="884" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">reserving the maximum does not punish short answers for long </tspan>
    <tspan x="800" dy="36">because the refund returns the unused tokens</tspan>
  </text>

  
  <rect x="440" y="985" width="720" height="65" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1026" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">test_finish_refunds_unused_output_tokens</text>
</svg>