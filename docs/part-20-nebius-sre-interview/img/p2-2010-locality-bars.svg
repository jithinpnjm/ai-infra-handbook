<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Same sum, two memory orders</title>
  <desc>Infographic comparing index order sequential memory access versus shuffled order scattered memory access, cache line behaviour, runtime formula, and hit rate impact.</desc>

  <defs>
    <marker id="axis-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="80" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Same sum, two memory orders</text>

  
  <rect x="80" y="115" width="1440" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(110, 145)">
    <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="0" x2="28" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="0" x2="16" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="40" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="50" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="50" x2="16" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="50" x2="40" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="6" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="6" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="6" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="190" y="156" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Reading one value pulls in its neighbours</text>

  
  <g transform="translate(190, 185)">
    
    <rect x="0" y="0" width="1280" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="5" y="5" width="155" height="60" rx="6" fill="#207448"/>
    <circle cx="82" cy="35" r="12" fill="#ffffff"/>

    
    <rect x="165" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="242" cy="35" r="8" fill="#207448"/>

    <rect x="325" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="402" cy="35" r="8" fill="#207448"/>

    <rect x="485" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="562" cy="35" r="8" fill="#207448"/>

    <rect x="645" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="722" cy="35" r="8" fill="#207448"/>

    <rect x="805" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="882" cy="35" r="8" fill="#207448"/>

    <rect x="965" y="5" width="155" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="1042" cy="35" r="8" fill="#207448"/>

    <rect x="1125" y="5" width="150" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="1200" cy="35" r="8" fill="#207448"/>
  </g>

  
  <rect x="80" y="315" width="1440" height="425" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(110, 345)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <text x="190" y="365" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Index order, sequential walk: 0.157 seconds</text>

  
  <rect x="190" y="385" width="260" height="52" rx="6" fill="#207448"/>

  
  <line x1="450" y1="437" x2="450" y2="665" stroke="#207448" stroke-width="2" stroke-dasharray="4,4"/>

  
  <path d="M 450,470 L 450,460 L 840,460 L 840,450 L 840,460 L 1230,460 L 1230,470" fill="none" stroke="#db8129" stroke-width="3"/>
  
  <text x="840" y="445" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">About 4 times slower</text>

  
  <text x="190" y="505" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Shuffled order, scattered access: 0.622 seconds</text>

  
  <rect x="190" y="525" width="1040" height="52" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

  
  <line x1="1230" y1="577" x2="1230" y2="665" stroke="#db8129" stroke-width="2" stroke-dasharray="4,4"/>

  
  <text x="190" y="618" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Random walk wastes the neighbours</text>

  
  <g transform="translate(0, 665)">
    
    <line x1="190" y1="0" x2="1460" y2="0" stroke="#303a36" stroke-width="3" marker-end="url(#axis-arrow)"/>
    
    <line x1="190" y1="-8" x2="190" y2="8" stroke="#303a36" stroke-width="3"/>
    
    <line x1="450" y1="-8" x2="450" y2="8" stroke="#207448" stroke-width="3"/>
    
    <line x1="1230" y1="-8" x2="1230" y2="8" stroke="#db8129" stroke-width="3"/>
  </g>

  
  <rect x="80" y="765" width="1440" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="811" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">runtime = hit rate x hit latency + miss rate x miss latency</text>

  
  <rect x="80" y="865" width="1440" height="74" rx="10" fill="#207448"/>
  <text x="800" y="911" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Going from 98 to 99 percent hits matters far more than 10 to 11 percent.</text>
</svg>