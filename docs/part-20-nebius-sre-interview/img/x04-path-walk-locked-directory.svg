<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>The path walk: a locked directory blocks a 644 file before its mode is checked</title>
  <desc>An infographic illustrating how Linux path resolution checks directory search permissions sequentially, blocking access to a readable file if a parent directory lacks search permissions.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red-dashed" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#c53030" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The path walk: a locked directory blocks a 644 file</tspan>
    <tspan x="800" dy="50">before its mode is checked</tspan>
  </text>

  
  <rect x="40" y="140" width="1520" height="430" rx="16" fill="#f9fbf9" stroke="#d0ddd3" stroke-width="2" />

  
  <g transform="translate(80, 240)" filter="url(#shadow)">
    
    <rect width="240" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <text x="120" y="50" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#207448">/</text>
    
    <text x="120" y="95" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">r-x</text>

    
    <g transform="translate(120, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-20" r="16" />
      <circle cx="0" cy="-20" r="6" />
      <line x1="0" y1="-4" x2="0" y2="35" />
      <line x1="0" y1="15" x2="14" y2="15" />
      <line x1="0" y1="28" x2="10" y2="28" />
    </g>

    
    <g transform="translate(120, 255)">
      <circle cx="0" cy="0" r="22" fill="#207448" />
      <path d="M -8 0 L -2 7 L 9 -6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  
  <g>
    
    <circle cx="60" cy="395" r="5" fill="#207448" />
    <line x1="65" y1="395" x2="78" y2="395" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <line x1="320" y1="395" x2="630" y2="395" stroke="#207448" stroke-width="5" stroke-linecap="round" />

    
    <text x="480" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#c53030">no search bit, so EACCES</text>

    
    <line x1="634" y1="375" x2="634" y2="415" stroke="#c53030" stroke-width="6" stroke-linecap="round" />
  </g>

  
  <g transform="translate(640, 240)" filter="url(#shadow)">
    
    <rect width="340" height="310" rx="12" fill="#eeeeee" stroke="#db8129" stroke-width="5" />
    
    <text x="170" y="50" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36">secret</text>
    
    <text x="170" y="95" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">drw-------</text>

    
    <g transform="translate(170, 160)" stroke="#303a36" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-24" y="-5" width="48" height="42" rx="6" />
      <path d="M -15 -5 L -15 -22 C -15 -32, 15 -32, 15 -22 L 15 -5" />
      <circle cx="0" cy="12" r="4" fill="#303a36" />
      <line x1="0" y1="16" x2="0" y2="25" />
    </g>

    
    <g transform="translate(170, 255)">
      <circle cx="0" cy="0" r="22" fill="#c53030" />
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="7" y1="-7" x2="-7" y2="7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>

  
  <g>
    <line x1="980" y1="395" x2="1080" y2="395" stroke="#a0aba4" stroke-width="3" stroke-dasharray="6,6" />
    
    <circle cx="1080" cy="395" r="14" fill="#ffffff" stroke="#c53030" stroke-width="3" />
    <line x1="1070" y1="385" x2="1090" y2="405" stroke="#c53030" stroke-width="3" />
  </g>

  
  <g>
    
    <rect x="1200" y="156" width="160" height="42" rx="8" fill="#207448" />
    <text x="1280" y="185" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">chmod 777</text>

    
    <path d="M 1360 177 L 1500 177 L 1500 232" fill="none" stroke="#c53030" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#arrow-red-dashed)" />

    
    <text x="1330" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#c53030">chmod on the file cannot help</text>
    <line x1="1160" y1="216" x2="1500" y2="216" stroke="#c53030" stroke-width="2" />
  </g>

  
  <g transform="translate(1180, 240)" filter="url(#shadow)">
    
    <rect width="340" height="310" rx="12" fill="#f0f3f1" stroke="#8a9990" stroke-width="2.5" stroke-dasharray="8,6" />
    
    <text x="170" y="50" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#707d77">app.conf</text>
    
    <text x="170" y="95" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#707d77">-rw-r--r--</text>

    
    <g transform="translate(170, 160)" stroke="#707d77" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -18 -25 L 8 -25 L 18 -15 L 18 28 L -18 28 Z" />
      <path d="M 8 -25 L 8 -15 L 18 -15" />
      <circle cx="0" cy="5" r="4" fill="#707d77" />
      <line x1="0" y1="9" x2="0" y2="18" />
    </g>

    
    <rect x="95" y="235" width="150" height="40" rx="8" fill="#e0e6e2" />
    <text x="170" y="263" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#606d67">unreached</text>
  </g>

  
  <g transform="translate(40, 595)">
    
    <rect width="1520" height="205" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="40" y="60" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">namei -l</text>

    
    <rect x="250" y="20" width="1230" height="165" rx="10" fill="#ffffff" stroke="#b0c4b5" stroke-width="1.5" />

    
    <text x="290" y="65" font-family="monospace" font-size="26" fill="#303a36">
      <tspan fill="#207448" font-weight="bold">dr-xr-xr-x</tspan>  /
    </text>

    <text x="290" y="112" font-family="monospace" font-size="26" fill="#303a36">
      <tspan fill="#db8129" font-weight="bold">drw-------</tspan>  secret
    </text>

    <text x="290" y="158" font-family="monospace" font-size="26" fill="#c53030" font-weight="bold">
      <tspan fill="#707d77" font-weight="normal">          </tspan>  app.conf Permission denied
    </text>
  </g>

  
  <g transform="translate(40, 825)">
    
    <g transform="translate(0, 0)">
      <rect width="480" height="115" rx="12" fill="#ffffff" stroke="#d0ddd3" stroke-width="1.5" />
      <circle cx="50" cy="58" r="24" fill="#207448" />
      <text x="50" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="95" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="95" dy="0">check search bit on</tspan>
        <tspan x="95" dy="30">every directory</tspan>
      </text>
    </g>

    
    <g transform="translate(520, 0)">
      <rect width="480" height="115" rx="12" fill="#ffffff" stroke="#d0ddd3" stroke-width="1.5" />
      <circle cx="50" cy="58" r="24" fill="#207448" />
      <text x="50" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="95" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">read the file mode</text>
    </g>

    
    <g transform="translate(1040, 0)">
      <rect width="480" height="115" rx="12" fill="#ffffff" stroke="#d0ddd3" stroke-width="1.5" />
      <circle cx="50" cy="58" r="24" fill="#207448" />
      <text x="50" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="95" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="95" dy="0">fix the directory with</tspan>
        <tspan x="95" dy="30" font-family="monospace">chmod u+x or 755</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 965)">
    <rect width="1520" height="65" rx="12" fill="#207448" />
    <text x="760" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Check every parent directory, not only the last.</text>
  </g>
</svg>