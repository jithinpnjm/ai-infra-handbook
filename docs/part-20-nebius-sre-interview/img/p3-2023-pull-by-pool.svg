<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" width="1600" height="1370">
  <title>Drill 2: one difference lines up with one pool</title>
  <desc>Visual comparison between old and new node pools diagnosing ImagePullBackOff caused by missing egress rules and credentials.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1370" fill="#f5f8f5"/>

  
  <text x="60" y="68" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Drill 2: one difference lines up with one pool</text>
  <text x="60" y="112" font-family="sans-serif" font-size="24" fill="#303a36">Two-column comparison for the 40 GB llm-server:v3 image.</text>

  
  
  <g id="old-pool-column">
    <rect x="60" y="145" width="715" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 175)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="46" height="14" rx="3"/>
      <rect x="0" y="20" width="46" height="14" rx="3"/>
      <circle cx="8" cy="7" r="2" fill="#207448"/>
      <circle cx="8" cy="27" r="2" fill="#207448"/>
    </g>
    
    <text x="155" y="202" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Old pool (7 nodes):</text>
    <text x="90" y="258" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">pulled fine yesterday;</tspan>
      <tspan x="90" dy="38">node-level registry credentials;</tspan>
      <tspan x="90" dy="38">cold-node pull takes about 9 minutes</tspan>
    </text>
  </g>

  
  <g id="new-pool-column">
    <rect x="825" y="145" width="715" height="310" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    
    <g transform="translate(855, 172)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 23 2 L 44 38 L 2 38 Z" stroke-linejoin="round"/>
      <line x1="23" y1="15" x2="23" y2="26"/>
      <circle cx="23" cy="32" r="1.5" fill="#db8129"/>
    </g>
    
    <text x="920" y="196" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="920" dy="0">New pool (3 of 10 new nodes)</tspan>
      <tspan x="920" dy="34" fill="#db8129">in ImagePullBackOff:</tspan>
    </text>
    
    <text x="855" y="282" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">service account has no imagePullSecrets;</tspan>
      <tspan x="855" dy="36">registry host times out on port 443 from a new</tspan>
      <tspan x="855" dy="34">node because egress rules for the new subnet</tspan>
      <tspan x="855" dy="34">are missing</tspan>
    </text>
  </g>

  
  <g id="checks-panel" transform="translate(60, 480)">
    <rect x="0" y="0" width="1480" height="90" rx="14" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    
    <g transform="translate(30, 24)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 20 2 C 32 6 38 12 38 22 C 38 33 28 41 20 44 C 12 41 2 33 2 22 C 2 12 8 6 20 2 Z"/>
      <path d="M 12 22 L 18 28 L 29 16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="88" y="54" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">Checks that agree: </tspan>
      <tspan>image name and tag are correct, the tag exists</tspan>
    </text>
  </g>

  
  <text x="60" y="614" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Event sequence below:</text>

  
  <g id="step1-card">
    <rect x="60" y="635" width="415" height="150" rx="14" fill="#ffffff" stroke="#c2d9c7" stroke-width="2"/>
    <circle cx="95" cy="672" r="18" fill="#207448"/>
    <text x="95" y="679" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="125" y="678" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Pulling image</text>
    <text x="90" y="734" font-family="monospace" font-size="24" fill="#207448">registry.example/</text>
    <text x="90" y="762" font-family="monospace" font-size="24" fill="#207448">llm-server:v3</text>
  </g>

  
  <path d="M 485 710 L 530 710" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  
  <g id="step2-card">
    <rect x="540" y="635" width="415" height="150" rx="14" fill="#ffffff" stroke="#c2d9c7" stroke-width="2"/>
    <circle cx="575" cy="672" r="18" fill="#207448"/>
    <text x="575" y="679" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="605" y="678" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Image Pull Fails</text>
    <rect x="565" y="710" width="365" height="50" rx="8" fill="#fdf3eb"/>
    <text x="580" y="744" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">Error: ErrImagePull</text>
  </g>

  
  <path d="M 965 710 L 1010 710" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  
  <g id="step3-card">
    <rect x="1020" y="635" width="520" height="150" rx="14" fill="#ffffff" stroke="#c2d9c7" stroke-width="2"/>
    <circle cx="1055" cy="672" r="18" fill="#207448"/>
    <text x="1055" y="679" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1085" y="678" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Back-off pulling image</text>
    
    <g transform="translate(1048, 712)" stroke="#303a36" stroke-width="2.5" fill="none">
      <circle cx="12" cy="12" r="12"/>
      <polyline points="12,5 12,12 17,15"/>
    </g>
    <text x="1085" y="733" font-family="sans-serif" font-size="24" fill="#303a36">delay keeps growing up to</text>
    <text x="1085" y="762" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">300 seconds</text>
  </g>

  
  <text x="60" y="830" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Fix list:</text>

  <g id="fix-item-1" transform="translate(60, 848)">
    <rect x="0" y="0" width="1480" height="64" rx="10" fill="#ffffff" stroke="#c2d9c7" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="10" fill="#207448"/>
    <text x="58" y="40" font-family="sans-serif" font-size="24" fill="#303a36">fix the egress rule or the pull secret</text>
  </g>

  <g id="fix-item-2" transform="translate(60, 924)">
    <rect x="0" y="0" width="1480" height="64" rx="10" fill="#ffffff" stroke="#c2d9c7" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="10" fill="#207448"/>
    <text x="58" y="40" font-family="sans-serif" font-size="24" fill="#303a36">delete stuck pods so the next pull happens now, not at the back-off ceiling</text>
  </g>

  <g id="fix-item-3" transform="translate(60, 1000)">
    <rect x="0" y="0" width="1480" height="64" rx="10" fill="#ffffff" stroke="#c2d9c7" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="10" fill="#207448"/>
    <text x="58" y="40" font-family="sans-serif" font-size="24" fill="#303a36">take the pull off the critical path: bake the image into the node image or pre-pull with a DaemonSet</text>
  </g>

  
  <g id="prevention-bar" transform="translate(60, 1095)">
    <rect x="0" y="0" width="1480" height="195" rx="16" fill="#207448"/>
    
    <g transform="translate(40, 40)" stroke="#ffffff" stroke-width="3.5" fill="none">
      <path d="M 28 4 C 45 9 52 17 52 30 C 52 46 38 57 28 62 C 18 57 4 46 4 30 C 4 17 11 9 28 4 Z"/>
      <path d="M 18 31 L 25 38 L 38 23" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="120" y="64" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Prevention:</text>
    <text x="120" y="112" font-family="sans-serif" font-size="25" fill="#ffffff">
      <tspan x="120" dy="0">cold start is a capacity number; measure pull time per pool;</tspan>
      <tspan x="120" dy="40">never scale into a pool that has not pulled the image</tspan>
    </text>
  </g>
</svg>