<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Error budget: 0.1 percent of 43,200 minutes</title>
  <desc>Visual infographic explaining error budget calculations based on SLO over a 30-day window.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Error budget: 0.1 percent of 43,200 minutes</text>

  
  <rect x="60" y="115" width="1480" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="157" font-family="monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Error budget = 100 percent minus the SLO</text>

  
  <text x="1540" y="218" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="end">0.1 percent = 43.2 minutes of full outage</text>
  <line x1="1505" y1="224" x2="1505" y2="235" stroke="#db8129" stroke-width="3"/>

  
  <rect x="60" y="235" width="1400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(85, 246)">
    <circle cx="24" cy="24" r="22" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="24,10 24,24 35,24" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  
  <text x="760" y="279" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">30 x 24 x 60 = 43,200 minutes</text>

  
  <rect x="1470" y="235" width="70" height="70" rx="6" fill="#db8129"/>

  
  <rect x="60" y="350" width="890" height="370" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <line x1="300" y1="350" x2="300" y2="720" stroke="#e8f1ea" stroke-width="2"/>
  <line x1="590" y1="350" x2="590" y2="720" stroke="#e8f1ea" stroke-width="2"/>

  
  <rect x="60" y="350" width="890" height="70" rx="10" fill="#e8f1ea"/>
  
  <rect x="60" y="410" width="890" height="10" fill="#e8f1ea"/>
  <line x1="60" y1="420" x2="950" y2="420" stroke="#207448" stroke-width="2"/>

  
  <text x="180" y="394" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">SLO</text>
  <text x="445" y="394" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Budget fraction</text>
  <text x="770" y="394" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Minutes per 30 days</text>

  
  <text x="180" y="466" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">99 percent</text>
  <text x="445" y="466" font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">0.01</text>
  <text x="770" y="466" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">432</text>
  <line x1="60" y1="495" x2="950" y2="495" stroke="#e8f1ea" stroke-width="2"/>

  
  <rect x="63" y="497" width="884" height="71" rx="6" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <text x="180" y="541" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">99.9 percent</text>
  <text x="445" y="541" font-family="monospace" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">0.001</text>
  <text x="770" y="541" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129" text-anchor="middle">43.2</text>
  <line x1="60" y1="570" x2="950" y2="570" stroke="#e8f1ea" stroke-width="2"/>

  
  <text x="180" y="616" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">99.95 percent</text>
  <text x="445" y="616" font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">0.0005</text>
  <text x="770" y="616" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">21.6</text>
  <line x1="60" y1="645" x2="950" y2="645" stroke="#e8f1ea" stroke-width="2"/>

  
  <text x="180" y="691" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">99.99 percent</text>
  <text x="445" y="691" font-family="monospace" font-size="25" fill="#303a36" text-anchor="middle">0.0001</text>
  <text x="770" y="691" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">4.32</text>

  
  <rect x="990" y="350" width="550" height="370" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1237, 385)">
    <rect x="0" y="0" width="56" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="44" cy="7.5" r="2.5" fill="#207448"/>
    <rect x="0" y="20" width="56" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="44" cy="27.5" r="2.5" fill="#207448"/>
    <rect x="0" y="40" width="56" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="44" cy="47.5" r="2.5" fill="#207448"/>
  </g>

  
  <text x="1265" y="495" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1265" dy="0">At 100 requests per second,</tspan>
    <tspan x="1265" dy="46">30 days = 259,200,000 requests;</tspan>
    <tspan x="1265" dy="46">0.1 percent allows</tspan>
    <tspan x="1265" dy="46">259,200 failed requests</tspan>
  </text>

  
  <rect x="60" y="760" width="1480" height="80" rx="10" fill="#207448"/>
  <text x="800" y="810" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The budget turns a vague target into a number you can spend.</text>
</svg>