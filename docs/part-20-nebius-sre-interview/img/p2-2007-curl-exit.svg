<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>curl without -f exits zero on a 404</title>
  <desc>Comparison between curl without -f exiting zero on a 404 versus curl with -f exiting code 22 to stop set -e scripts.</desc>

  <defs>
    <marker id="arrow-left" viewBox="0 0 18 18" refX="2" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 16 2 L 2 9 L 16 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">curl without -f exits zero on a 404</text>

  
  <g id="left-panel">
    
    <rect x="70" y="130" width="550" height="620" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(100, 160)">
      <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
      <path d="M 12 24 L 20 29 L 12 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="34" x2="36" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="175" y="196" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">curl without -f</text>

    
    <rect x="95" y="230" width="500" height="240" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <text x="125" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">curl ... missing page</text>
    <text x="125" y="375" font-family="monospace" font-size="26" fill="#303a36">status 404</text>

    
    <rect x="125" y="500" width="220" height="54" rx="27" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text x="235" y="536" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">exit code 0</text>

    
    <rect x="125" y="580" width="440" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="345" y="621" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the script sees success</text>
  </g>

  
  <g id="bridge">
    <text x="800" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Same request, same 404</text>
    <line x1="620" y1="350" x2="980" y2="350" stroke="#207448" stroke-width="3" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)"/>
  </g>

  
  <g id="right-panel">
    
    <rect x="980" y="130" width="550" height="620" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1010, 160)">
      <rect x="0" y="0" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
      <path d="M 12 24 L 20 29 L 12 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="34" x2="36" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="1085" y="196" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">curl with -f</text>

    
    <rect x="1005" y="230" width="500" height="240" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <text x="1035" y="295" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">curl -f ... missing page</text>

    
    <rect x="1035" y="500" width="230" height="54" rx="27" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <text x="1150" y="536" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">exit code 22</text>

    
    <rect x="1035" y="580" width="440" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1255" y="621" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">set -e stops the script</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="70" y="790" width="1460" height="70" rx="12" fill="#207448"/>
    <text x="800" y="834" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">In scripts, the exit code is the only thing set -e sees.</text>
  </g>
</svg>