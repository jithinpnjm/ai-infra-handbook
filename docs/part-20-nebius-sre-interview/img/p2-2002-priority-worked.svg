<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Worked example of the gap-tracker priority</title>
  <desc>A card table demonstrating gap-tracker priority calculation across three skill rows, with a formula banner, right-hand side note, and warning badge.</desc>

  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Worked example of the gap-tracker priority</text>

  
  <g transform="translate(40, 95)">
    <rect width="1520" height="70" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="25" y="15" width="40" height="40" rx="8" fill="#207448" />
    <path d="M 38 42 L 44 28 M 48 42 L 42 28 M 38 35 L 48 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="800" y="44" font-family="monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">priority = (5 minus confidence) x posting lines</text>
  </g>

  
  <g transform="translate(40, 185)">
    <rect width="1150" height="55" rx="10" fill="#207448" />
    <text x="85" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Rank</text>
    <text x="215" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="start">Skill</text>
    <text x="600" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Confidence</text>
    <text x="780" y="25" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="780" dy="0">Posting</tspan>
      <tspan x="780" dy="24">lines</tspan>
    </text>
    <text x="940" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Priority</text>
    <text x="1080" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Study</text>
  </g>

  
  <g transform="translate(40, 255)">
    <rect width="1150" height="185" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <text x="85" y="105" font-family="sans-serif" font-size="36" font-weight="bold" fill="#db8129" text-anchor="middle">1</text>
    
    <g transform="translate(135, 64)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="8" width="40" height="40" rx="6" />
      <path d="M 20 20 L 36 20 L 36 36 L 20 36 Z" />
      <path d="M 16 2 L 16 8 M 28 2 L 28 8 M 40 2 L 40 8" />
      <path d="M 16 48 L 16 54 M 28 48 L 28 54 M 40 48 L 40 54" />
      <path d="M 2 16 L 8 16 M 2 28 L 8 28 M 2 40 L 8 40" />
      <path d="M 48 16 L 54 16 M 48 28 L 54 28 M 48 40 L 54 40" />
    </g>
    
    <text x="215" y="68" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="215" dy="0">Kubernetes</tspan>
      <tspan x="215" dy="36">operations and</tspan>
      <tspan x="215" dy="36">GPU autoscaling</tspan>
    </text>
    
    <text x="600" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">2</text>
    
    <text x="780" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">3</text>
    
    <text x="940" y="103" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">9 (5-2)x3</text>
    
    <text x="1080" y="90" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1080" dy="0">20.20,</tspan>
      <tspan x="1080" dy="30">20.23</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 460)">
    <rect width="1150" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="85" y="105" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448" text-anchor="middle">2</text>
    
    <g transform="translate(135, 64)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 28 50" />
      <path d="M 12 50 L 44 50" />
      <path d="M 10 18 L 46 18" />
      <path d="M 10 18 L 4 34 L 20 34 Z" />
      <path d="M 46 18 L 40 34 L 56 34 Z" />
      <circle cx="28" cy="8" r="2" fill="#207448" />
    </g>
    
    <text x="215" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="215" dy="0">Cost and capacity</tspan>
      <tspan x="215" dy="38">at scale</tspan>
    </text>
    
    <text x="600" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">1</text>
    
    <text x="780" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">2</text>
    
    <text x="940" y="103" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">8 (5-1)x2</text>
    
    <text x="1080" y="90" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1080" dy="0">20.12,</tspan>
      <tspan x="1080" dy="30">20.16</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 665)">
    <rect width="1150" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="85" y="105" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448" text-anchor="middle">3</text>
    
    <g transform="translate(135, 64)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 8 38 A 22 22 0 1 1 48 38" />
      <path d="M 28 38 L 38 20" />
      <circle cx="28" cy="38" r="3" fill="#207448" />
      <path d="M 12 46 L 44 46" />
    </g>
    
    <text x="215" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="215" dy="0">SLOs and</tspan>
      <tspan x="215" dy="38">alert design</tspan>
    </text>
    
    <text x="600" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">4</text>
    
    <text x="780" y="105" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">3</text>
    
    <text x="940" y="103" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">3 (5-4)x3</text>
    
    <text x="1080" y="105" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">20.19</text>
  </g>

  
  <g transform="translate(1230, 255)">
    <rect width="330" height="390" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(137, 45)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 14 36 A 16 16 0 1 1 42 36 C 38 42 34 44 34 50 L 22 50 C 22 44 18 42 14 36 Z" />
      <path d="M 22 56 L 34 56" />
      <path d="M 28 10 L 28 2" />
      <path d="M 44 16 L 50 10" />
      <path d="M 12 16 L 6 10" />
    </g>
    
    <text x="165" y="180" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="165" dy="0">Low confidence</tspan>
      <tspan x="165" dy="40">on many lines</tspan>
      <tspan x="165" dy="40">hurts most.</tspan>
    </text>
  </g>

  
  <g transform="translate(1230, 665)">
    <rect width="330" height="185" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(141, 16)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 24 4 L 44 40 L 4 40 Z" />
      <line x1="24" y1="16" x2="24" y2="28" />
      <circle cx="24" cy="34" r="1.5" fill="#207448" />
    </g>
    
    <text x="165" y="90" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="165" dy="0">confidence 4</tspan>
      <tspan x="165" dy="30">without evidence:</tspan>
      <tspan x="165" dy="30">SLOs and alert design</tspan>
    </text>
  </g>
</svg>