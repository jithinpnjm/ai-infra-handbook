<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Pull makes silence visible, push does not</title>
  <desc>Infographic explaining how pull monitoring makes silence visible through failed scrapes and the up metric, whereas push monitoring makes dead replicas look identical to quiet periods.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pull makes silence visible, push does not</text>
  <text x="800" y="92" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Two lanes for a GPU replica that dies at night</text>

  
  <rect x="40" y="115" width="1520" height="280" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="65" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pull (metrics)</text>

  
  <rect x="75" y="170" width="266" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="212" r="24" fill="#207448" />
  <text x="115" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(235, 186)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="0" y="12" width="34" height="26" rx="4" />
    <line x1="8" y1="25" x2="16" y2="25" />
    <circle cx="26" cy="25" r="2" fill="#207448" />
    <path d="M 40 14 A 14 14 0 0 1 40 36" />
    <path d="M 47 7 A 22 22 0 0 1 47 43" />
  </g>
  <text x="208" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="208" dy="0">Prometheus</tspan>
    <tspan x="208" dy="30">scrapes the</tspan>
    <tspan x="208" dy="30">replica</tspan>
  </text>

  
  <line x1="341" y1="272" x2="371" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="371" y="170" width="266" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="411" cy="212" r="24" fill="#207448" />
  <text x="411" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(535, 186)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="8" width="36" height="36" rx="6" />
    <line x1="8" y1="18" x2="2" y2="18" />
    <line x1="8" y1="34" x2="2" y2="34" />
    <line x1="44" y1="18" x2="50" y2="18" />
    <line x1="44" y1="34" x2="50" y2="34" />
    <line x1="18" y1="8" x2="18" y2="2" />
    <line x1="34" y1="8" x2="34" y2="2" />
    <line x1="18" y1="44" x2="18" y2="50" />
    <line x1="34" y1="44" x2="34" y2="50" />
    <line x1="20" y1="20" x2="32" y2="32" />
    <line x1="32" y1="20" x2="20" y2="32" />
  </g>
  <text x="504" y="306" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="504" dy="0">replica</tspan>
    <tspan x="504" dy="30">dies</tspan>
  </text>

  
  <line x1="637" y1="272" x2="667" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="667" y="170" width="266" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="707" cy="212" r="24" fill="#207448" />
  <text x="707" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(835, 186)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 6 26 L 36 26" />
    <path d="M 26 16 L 36 26 L 26 36" />
    <line x1="16" y1="10" x2="34" y2="42" stroke-width="4" />
  </g>
  <text x="800" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">next scrape</tspan>
    <tspan x="800" dy="30">fails</tspan>
  </text>

  
  <line x1="933" y1="272" x2="963" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="963" y="170" width="266" height="205" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <circle cx="1005" cy="212" r="24" fill="#db8129" />
  <text x="1005" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(1135, 186)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 8 38 A 20 20 0 1 1 44 38" />
    <line x1="26" y1="26" x2="14" y2="36" stroke-width="4" />
    <circle cx="26" cy="26" r="3" fill="#db8129" />
  </g>
  <text x="1096" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1096" dy="0">automatic series</tspan>
    <tspan x="1096" dy="32"><tspan font-family="monospace">up</tspan> goes to 0</tspan>
  </text>

  
  <line x1="1229" y1="272" x2="1259" y2="272" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="1259" y="170" width="266" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1299" cy="212" r="24" fill="#207448" />
  <text x="1299" y="221" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  
  <g transform="translate(1425, 186)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 14 36 C 14 22 18 14 26 14 C 34 14 38 22 38 36 L 44 40 L 8 40 Z" />
    <path d="M 22 44 A 4 4 0 0 0 30 44" />
    <circle cx="26" cy="9" r="2" fill="#207448" />
  </g>
  <text x="1392" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1392" dy="0">an alert</tspan>
    <tspan x="1392" dy="30">can fire</tspan>
  </text>

  
  <rect x="40" y="425" width="1520" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="65" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Push (events)</text>

  
  <rect x="170" y="475" width="560" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="215" cy="515" r="24" fill="#207448" />
  <text x="215" y="524" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(645, 490)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="10" width="34" height="32" rx="6" />
    <line x1="16" y1="26" x2="34" y2="26" stroke-dasharray="4 4" />
    <line x1="6" y1="4" x2="44" y2="48" stroke-width="4" />
  </g>
  <text x="450" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="450" dy="0">replica sends nothing</tspan>
    <tspan x="450" dy="32">after it dies</tspan>
  </text>

  
  <line x1="730" y1="557" x2="870" y2="557" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="870" y="475" width="560" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="915" cy="515" r="24" fill="#207448" />
  <text x="915" y="524" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(1345, 490)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="6" width="44" height="32" rx="4" />
    <line x1="16" y1="44" x2="36" y2="44" />
    <line x1="26" y1="38" x2="26" y2="44" />
    <line x1="10" y1="22" x2="42" y2="22" />
  </g>
  <text x="1150" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1150" dy="0">dashboard shows silence,</tspan>
    <tspan x="1150" dy="30">which looks the same</tspan>
    <tspan x="1150" dy="30">as no traffic</tspan>
  </text>

  
  
  <rect x="40" y="690" width="486" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(255, 712)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 6 26 C 14 12 38 12 46 26 C 38 40 14 40 6 26 Z" />
    <circle cx="26" cy="26" r="7" />
    <circle cx="26" cy="26" r="2" fill="#207448" />
  </g>
  <text x="283" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="283" dy="0" font-weight="bold">metrics: pull,</tspan>
    <tspan x="283" dy="34">so silence is visible</tspan>
  </text>

  
  <rect x="557" y="690" width="486" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(772, 706)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="4" width="24" height="32" rx="3" />
    <line x1="14" y1="12" x2="24" y2="12" />
    <line x1="14" y1="18" x2="22" y2="18" />
    <line x1="14" y1="24" x2="18" y2="24" />
    <path d="M 36 14 L 44 14 M 40 10 L 44 14 L 40 18" />
    <path d="M 36 24 L 44 24 M 40 20 L 44 24 L 40 28" />
  </g>
  <text x="800" y="768" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0" font-weight="bold">traces and logs: push,</tspan>
    <tspan x="800" dy="30">they are events with</tspan>
    <tspan x="800" dy="30">no scrape model</tspan>
    <tspan x="800" dy="30">(OpenTelemetry push protocol,</tspan>
    <tspan x="800" dy="30">node agent such as Fluent Bit)</tspan>
  </text>

  
  <rect x="1074" y="690" width="486" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1291, 708)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 8 8 L 44 8 L 34 30 L 18 30 Z" />
    <rect x="18" y="34" width="16" height="10" rx="2" />
    <line x1="26" y1="14" x2="26" y2="24" />
  </g>
  <text x="1317" y="782" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1317" dy="0" font-weight="bold">short-lived batch jobs:</tspan>
    <tspan x="1317" dy="32">Pushgateway, a holding point</tspan>
    <tspan x="1317" dy="32">where a finished job leaves</tspan>
    <tspan x="1317" dy="32">its last numbers</tspan>
  </text>

  
  <rect x="40" y="965" width="1520" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 1010)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="24" cy="12" rx="16" ry="6" />
    <path d="M 8 12 V 38 C 8 42 40 42 40 38 V 12" />
    <path d="M 8 25 C 8 29 40 29 40 25" />
    <path d="M 44 22 L 54 18 M 54 18 L 49 16 M 54 18 L 51 22" />
    <path d="M 44 30 L 54 34 M 54 34 L 51 30 M 54 34 L 49 36" />
  </g>
  <text x="160" y="1026" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">remote write is also push, with a queue read from the write-ahead log and sent by shards:</tspan>
    <tspan x="160" dy="38">the one push path that can quietly fall behind, so monitor it</tspan>
  </text>
</svg>