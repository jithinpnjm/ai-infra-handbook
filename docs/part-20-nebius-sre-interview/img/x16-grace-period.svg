<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The grace period must cover the longest stream, or long answers get cut</title>
  <desc>Horizontal timeline from 0 to 120 seconds showing pod shutdown steps, a 102-second stream, the default 30-second cut, and terminationGracePeriodSeconds 120 with margin.</desc>

  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The grace period must cover the longest stream,</text>
  <text x="800" y="112" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">or long answers get cut</text>

  
  <rect x="60" y="130" width="1480" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="106" cy="195" r="24" fill="#207448"/>
  <text x="106" y="204" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="146" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">stop new requests</text>
  
  <path d="M 148 190 L 156 196 L 148 202" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="160" y1="202" x2="170" y2="202" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="178" y="198" font-family="sans-serif" font-size="24" fill="#303a36">a pre-stop hook runs first,</text>
  <text x="178" y="226" font-family="sans-serif" font-size="24" fill="#303a36">then SIGTERM</text>

  
  <circle cx="680" cy="195" r="24" fill="#207448"/>
  <text x="680" y="204" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="720" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">let streams finish within</text>
  <text x="720" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">the grace period</text>

  
  <circle cx="1270" cy="195" r="24" fill="#207448"/>
  <text x="1270" y="204" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="1310" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">stop the</text>
  <text x="1310" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">process</text>

  
  <text x="240" y="280" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">drain signal</text>
  <text x="880" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">seconds</text>
  <text x="1540" y="280" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">end of the pod shutdown</text>

  
  <line x1="280" y1="295" x2="1480" y2="295" stroke="#303a36" stroke-width="3"/>

  
  <line x1="280" y1="295" x2="280" y2="307" stroke="#303a36" stroke-width="3"/>
  <text x="280" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">0</text>

  <line x1="580" y1="295" x2="580" y2="307" stroke="#303a36" stroke-width="3"/>
  <text x="580" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">30</text>

  <line x1="880" y1="295" x2="880" y2="307" stroke="#303a36" stroke-width="3"/>
  <text x="880" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">60</text>

  <line x1="1180" y1="295" x2="1180" y2="307" stroke="#303a36" stroke-width="3"/>
  <text x="1180" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">90</text>

  <line x1="1480" y1="295" x2="1480" y2="307" stroke="#303a36" stroke-width="3"/>
  <text x="1480" y="330" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">120</text>

  
  <line x1="280" y1="335" x2="280" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="580" y1="335" x2="580" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="880" y1="335" x2="880" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1180" y1="335" x2="1180" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1300" y1="335" x2="1300" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1480" y1="335" x2="1480" y2="910" stroke="#cbd8cf" stroke-width="2" stroke-dasharray="4 4"/>

  
  <rect x="60" y="350" width="1480" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 365)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 20 C 22 16, 34 16, 40 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 14 28 C 22 24, 34 24, 42 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 16 36 C 22 32, 34 32, 40 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="155" y="401" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">longest stream</text>
  
  <rect x="280" y="425" width="1020" height="66" rx="10" fill="#207448"/>
  <text x="790" y="467" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4,096 tokens at 40 tokens per second = 102 s</text>

  
  <rect x="60" y="545" width="1480" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 560)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="12" x2="28" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="155" y="596" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">default grace period of 30 seconds</text>
  
  <rect x="280" y="620" width="300" height="66" rx="10" fill="#207448"/>
  
  <rect x="595" y="620" width="885" height="66" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="1037" y="662" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">the default of 30 seconds would cut every long answer</text>
  
  <line x1="580" y1="605" x2="580" y2="700" stroke="#db8129" stroke-width="5" stroke-dasharray="6 4"/>
  <circle cx="580" cy="620" r="14" fill="#db8129"/>
  <line x1="573" y1="613" x2="587" y2="627" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="587" y1="613" x2="573" y2="627" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="60" y="740" width="1480" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(85, 755)">
    <rect x="6" y="8" width="44" height="40" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="6" y1="22" x2="50" y2="22" stroke="#207448" stroke-width="3"/>
    <circle cx="16" cy="15" r="3" fill="#207448"/>
    <circle cx="26" cy="15" r="3" fill="#207448"/>
  </g>
  <text x="155" y="791" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">terminationGracePeriodSeconds 120</text>
  
  <rect x="280" y="815" width="1020" height="66" rx="10" fill="#207448"/>
  
  <rect x="1300" y="815" width="180" height="66" rx="10" fill="#c2e0cb" stroke="#207448" stroke-width="3"/>
  <text x="1390" y="857" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">margin</text>

  
  <rect x="60" y="945" width="1480" height="90" rx="16" fill="#207448"/>
  <text x="800" y="1000" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Set the grace period from your longest honest stream plus a small margin, not an arbitrary big number.</text>
</svg>