<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Start-up: what takes the time</title>
  <desc>Infographic flowchart showing the sequence of steps during model start-up: pulling the image, fetching and mounting the model, starting the runtime, loading weights to GPU, profiling memory and capturing graphs, and opening the API at /health 200.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Start-up: what takes the time</text>

  
  
  <line x1="510" y1="275" x2="568" y2="275" stroke="#207448" stroke-width="4" stroke-linecap="butt"/>
  <polygon points="566,266 580,275 566,284" fill="#207448"/>

  
  <line x1="1020" y1="275" x2="1078" y2="275" stroke="#207448" stroke-width="4" stroke-linecap="butt"/>
  <polygon points="1076,266 1090,275 1076,284" fill="#207448"/>

  
  <path d="M 1310 410 L 1310 450 Q 1310 470 1290 470 L 310 470 Q 290 470 290 490 L 290 518" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="butt"/>
  <polygon points="281,516 290,530 299,516" fill="#207448"/>

  
  <line x1="510" y1="665" x2="568" y2="665" stroke="#207448" stroke-width="4" stroke-linecap="butt"/>
  <polygon points="566,656 580,665 566,674" fill="#207448"/>

  
  <line x1="1020" y1="665" x2="1078" y2="665" stroke="#207448" stroke-width="4" stroke-linecap="butt"/>
  <polygon points="1076,656 1090,665 1076,674" fill="#207448"/>

  
  <g id="node-1">
    <rect x="70" y="140" width="440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="118" cy="188" r="24" fill="#207448"/>
    <text x="118" y="196" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 266 201 L 266 227 L 314 227 L 314 201" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="266" y1="215" x2="314" y2="215" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="181" x2="290" y2="209" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="280,199 290,209 300,199" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="290" y="315" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Pull image</text>
  </g>

  
  <g id="node-2">
    <rect x="580" y="140" width="440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="628" cy="188" r="24" fill="#207448"/>
    <text x="628" y="196" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <ellipse cx="800" cy="190" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 778 190 L 778 220 A 22 8 0 0 0 822 220 L 822 190" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 778 205 A 22 8 0 0 0 822 205" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="800" y="315" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Fetch + mount model</text>
  </g>

  
  <g id="node-3">
    <rect x="1090" y="140" width="440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="1138" cy="188" r="24" fill="#207448"/>
    <text x="1138" y="196" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <path d="M 1306 182 L 1314 182 L 1315 188 L 1321 191 L 1326 187 L 1332 193 L 1328 198 L 1331 204 L 1337 205 L 1337 213 L 1331 214 L 1328 220 L 1332 225 L 1326 231 L 1321 227 L 1315 230 L 1314 236 L 1306 236 L 1305 230 L 1299 227 L 1294 231 L 1288 225 L 1292 220 L 1289 214 L 1283 213 L 1283 205 L 1289 204 L 1292 198 L 1288 193 L 1294 187 L 1299 191 L 1305 188 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
