    <rect x="281" y="586" width="18" height="18" rx="2" fill="none" stroke="#db8129" stroke-width="2.5"/>
    
    <line x1="280" y1="577" x2="280" y2="569" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="577" x2="290" y2="569" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="577" x2="300" y2="569" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="613" x2="280" y2="621" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="290" y1="613" x2="290" y2="621" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="613" x2="300" y2="621" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="272" y1="585" x2="264" y2="585" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="272" y1="595" x2="264" y2="595" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="272" y1="605" x2="264" y2="605" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="585" x2="316" y2="585" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="595" x2="316" y2="595" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="605" x2="316" y2="605" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <text x="290" y="705" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Load weights to GPU</text>
  </g>

  
  <g id="node-5">
    <rect x="580" y="530" width="440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="628" cy="578" r="24" fill="#207448"/>
    <text x="628" y="586" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <line x1="788" y1="585" x2="796" y2="591" stroke="#207448" stroke-width="3"/>
    <line x1="812" y1="585" x2="804" y2="591" stroke="#207448" stroke-width="3"/>
    <line x1="789" y1="605" x2="796" y2="599" stroke="#207448" stroke-width="3"/>
    <line x1="811" y1="605" x2="804" y2="599" stroke="#207448" stroke-width="3"/>
    <line x1="789" y1="581" x2="811" y2="581" stroke="#207448" stroke-width="3"/>
