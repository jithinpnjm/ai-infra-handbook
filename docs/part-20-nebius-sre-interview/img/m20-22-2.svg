    <circle cx="816" cy="581" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="800" cy="595" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="785" cy="609" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="815" cy="609" r="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <text x="800" y="685" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Profile memory,</text>
    <text x="800" y="728" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">compile, capture graphs</text>
  </g>

  
  <g id="node-6">
    <rect x="1090" y="530" width="440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <circle cx="1138" cy="578" r="24" fill="#207448"/>
    <text x="1138" y="586" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <rect x="1286" y="575" width="48" height="40" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1286" y1="586" x2="1334" y2="586" stroke="#207448" stroke-width="3"/>
