<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>The finish_reason mix as a ticket-level quality signal</title>
  <desc>The finish_reason mix as a ticket-level quality signal</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The finish_reason mix as a</text>
  <text x="800" y="125" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">ticket-level quality signal</text>

  
  <rect x="40" y="160" width="850" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="70" y1="235" x2="125" y2="235" />
    <line x1="70" y1="185" x2="70" y2="235" />
    <rect x="76" y="210" width="10" height="25" />
    <rect x="92" y="195" width="10" height="40" />
    <rect x="108" y="202" width="10" height="33" />
  </g>

  
  <text x="145" y="218" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">vllm:request_success_total by finished_reason</text>

  
  <g>
    
    <rect x="75" y="260" width="85" height="180" fill="#207448" />
    
    <rect x="75" y="440" width="85" height="35" fill="#4d966e" />
    
    <rect x="75" y="475" width="85" height="35" fill="#78b793" />
    
    <rect x="75" y="510" width="85" height="35" fill="#9ecdb3" />
    
    <rect x="75" y="545" width="85" height="35" fill="#c4e2d1" />
    
    <rect x="75" y="260" width="85" height="320" rx="6" fill="none" stroke="#207448" stroke-width="2" />
  </g>

  
  <path d="M 160,320 L 195,315" stroke="#207448" stroke-width="2" fill="none" />
  <path d="M 160,457 L 195,380" stroke="#207448" stroke-width="2" fill="none" />
  <path d="M 160,492 L 195,440" stroke="#207448" stroke-width="2" fill="none" />
  <path d="M 160,527 L 195,500" stroke="#207448" stroke-width="2" fill="none" />
  <path d="M 160,562 L 195,560" stroke="#207448" stroke-width="2" fill="none" />

  
  <text x="205" y="300" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="205" dy="0">stop: a stop string was emitted</tspan>
    <tspan x="205" dy="32">(most of a healthy bar)</tspan>
  </text>
  <text x="205" y="385" font-family="sans-serif" font-size="24" fill="#303a36">length: token limit reached</text>
  <text x="205" y="445" font-family="sans-serif" font-size="24" fill="#303a36">abort: client cancelled</text>
  <text x="205" y="505" font-family="sans-serif" font-size="24" fill="#303a36">error: retryable internal error, HTTP 500</text>
  <text x="205" y="565" font-family="sans-serif" font-size="24" fill="#303a36">repetition: repetitive token pattern detected</text>

  
  <rect x="920" y="160" width="640" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="980" cy="210" r="22" />
    <polyline points="970,212 978,218 992,202" />
  </g>

  
  <g>
    <rect x="990" y="260" width="100" height="215" fill="#207448" />
    <rect x="990" y="475" width="100" height="8" fill="#78b793" />
    <rect x="990" y="483" width="100" height="17" fill="#c4e2d1" />
    <rect x="990" y="260" width="100" height="240" rx="6" fill="none" stroke="#207448" stroke-width="2" />
  </g>
  <text x="1040" y="540" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1040" dy="0">healthy:</tspan>
    <tspan x="1040" dy="32">length 3 percent</tspan>
  </text>

  
  <g>
    <rect x="1270" y="260" width="100" height="190" fill="#207448" />
    <rect x="1270" y="450" width="100" height="30" fill="#db8129" />
    <rect x="1270" y="480" width="100" height="20" fill="#c4e2d1" />
    <rect x="1270" y="260" width="100" height="240" rx="6" fill="none" stroke="#db8129" stroke-width="3" />
  </g>
  <text x="1320" y="540" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1320" dy="0">after a deploy:</tspan>
    <tspan x="1320" dy="32">length 12 percent</tspan>
  </text>

  
  <rect x="40" y="635" width="850" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 72,670 Q 92,664 102,674 Q 112,664 132,670 V 705 Q 112,699 102,709 Q 92,699 72,705 Z" />
    <line x1="102" y1="674" x2="102" y2="709" />
  </g>

  
  <text x="72" y="745" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="72" dy="0">something changed: a prompt template grew, or a</tspan>
    <tspan x="72" dy="38">model update makes answers longer; repetition</tspan>
    <tspan x="72" dy="38">appearing means the model or sampling settings</tspan>
    <tspan x="72" dy="38">are broken; a single slice can also move for a</tspan>
    <tspan x="72" dy="38">boring reason such as longer essays, so ask</tspan>
    <tspan x="72" dy="38">what changed in the same hour</tspan>
  </text>

  
  <rect x="920" y="635" width="640" height="340" rx="16" fill="#fdf7f2" stroke="#db8129" stroke-width="3" />

  
  <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 975,662 L 950,707 H 1000 Z" />
    <line x1="975" y1="678" x2="975" y2="690" />
    <circle cx="975" cy="699" r="1.5" fill="#db8129" />
  </g>

  
  <text x="952" y="750" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="952" dy="0">ticket when length share is above</tspan>
    <tspan x="952" dy="40">5 percent and more than double its value</tspan>
    <tspan x="952" dy="40">a day earlier; 5 percent and the factor</tspan>
    <tspan x="952" dy="40">of two are starting values to tune on</tspan>
    <tspan x="952" dy="40">weeks of your own traffic</tspan>
  </text>

  
  <rect x="40" y="1005" width="1520" height="75" rx="12" fill="#207448" />

  
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 75,1027 L 95,1020 L 115,1027 V 1045 Q 115,1060 95,1068 Q 75,1060 75,1045 Z" />
    <polyline points="87,1042 93,1048 103,1036" />
  </g>

  
  <text x="140" y="1052" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">never promote to a page without evidence it predicts user pain</text>
</svg>