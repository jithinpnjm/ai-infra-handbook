    <rect x="1056" y="388" width="28" height="28" rx="3" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="1054" y1="370" x2="1054" y2="378" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1070" y1="370" x2="1070" y2="378" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1086" y1="370" x2="1086" y2="378" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1054" y1="426" x2="1054" y2="434" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1070" y1="426" x2="1070" y2="434" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1086" y1="426" x2="1086" y2="434" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1038" y1="386" x2="1046" y2="386" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1038" y1="402" x2="1046" y2="402" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1038" y1="418" x2="1046" y2="418" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1094" y1="386" x2="1102" y2="386" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1094" y1="402" x2="1102" y2="402" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="1094" y1="418" x2="1102" y2="418" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    
    <text x="1070" y="478" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Engine</text>
    <text x="1070" y="522" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">abort at 15 s</text>
  </g>

  
  <g>
    <rect x="1250" y="350" width="290" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="1377" cy="402" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="1377,390 1377,402 1387,402" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 1408 390 C 1414 396, 1414 408, 1408 414" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 1417 384 C 1425 393, 1425 411, 1417 420" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    
    <text x="1395" y="478" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Idle gap 10 s,</text>
    <text x="1395" y="522" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">max stream 120 s</text>
  </g>

  
  
  <path d="M 270 460 L 340 460" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
