  <path d="M 890 310 C 925 310, 925 410, 960 410" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 890 610 C 925 610, 925 510, 960 510" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1180 460 L 1250 460" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
</svg>