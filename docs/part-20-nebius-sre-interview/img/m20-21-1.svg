<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Timeouts must nest: client above gateway above engine</title>
  <desc>Flowchart demonstrating nested timeouts across client, gateway, retry attempts, engine abort, and idle gap limits.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="90" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Timeouts must nest: client above gateway above engine</text>

  
  <g>
    <rect x="60" y="350" width="210" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="137" y="376" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="137" y1="392" x2="193" y2="392" stroke="#207448" stroke-width="3" />
    <circle cx="147" cy="384" r="2.5" fill="#207448" />
    <circle cx="155" cy="384" r="2.5" fill="#207448" />
    <circle cx="163" cy="384" r="2.5" fill="#207448" />
    <line x1="147" y1="406" x2="177" y2="406" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="147" y1="416" x2="167" y2="416" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="165" y="478" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Client</text>
    <text x="165" y="522" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">total 60 s</text>
  </g>

  
  <g>
    <rect x="340" y="350" width="210" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="417" y="380" width="56" height="42" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="427" y1="401" x2="463" y2="401" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <polyline points="457,395 463,401 457,407" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="433" cy="391" r="2.5" fill="#207448" />
    <circle cx="445" cy="391" r="2.5" fill="#207448" />
    <circle cx="457" cy="391" r="2.5" fill="#207448" />
    
    <text x="445" y="478" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Gateway</text>
    <text x="445" y="522" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">total 40 s</text>
  </g>

  
  <g>
    <rect x="620" y="200" width="270" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="755" cy="252" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="755,236 755,252 768,252" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="755" y1="222" x2="755" y2="226" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="755" y="328" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Try 1</text>
    <text x="755" y="372" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">first token 18 s</text>
  </g>

  
  <g>
    <rect x="620" y="500" width="270" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="755" cy="552" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="755,536 755,552 768,560" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="755" y1="522" x2="755" y2="526" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="755" y="628" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Try 2</text>
    <text x="755" y="672" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">first token 18 s</text>
  </g>

  
  <g>
