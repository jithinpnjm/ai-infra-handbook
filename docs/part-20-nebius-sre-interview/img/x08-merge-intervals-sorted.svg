<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260" style="background:#f5f8f5; font-family:sans-serif;">
  <title>Merge intervals: after sorting by start, only the last merged interval can overlap</title>
  <desc>Visual explanation of merging intervals by sorting first, comparing with the last merged interval, and extending or appending.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <text x="80" y="65" font-size="44" font-weight="bold" fill="#303a36">Merge intervals: after sorting by start, only the last merged interval can overlap</text>

  
  <g id="strip-1">
    
    <rect x="80" y="105" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="2"/>
    
    
    
    <g transform="translate(110, 130)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 12 18 L 26 18 L 38 38 L 44 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 12 38 L 26 38 L 38 18 L 44 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="40,12 46,18 40,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <polyline points="40,32 46,38 40,44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="185" y="152" font-size="30" font-weight="bold" fill="#303a36">unsorted input</text>
    
    
    <text x="185" y="200" font-size="40" font-weight="bold" fill="#889890">?</text>
    <text x="215" y="198" font-size="24" fill="#303a36">any pair might overlap</text>

    
    
    <line x1="540" y1="285" x2="1440" y2="285" stroke="#889890" stroke-width="3" stroke-linecap="round"/>
    
    <g font-size="24" fill="#889890" text-anchor="middle">
      <line x1="540" y1="285" x2="540" y2="295" stroke="#889890" stroke-width="3"/><text x="540" y="318">0</text>
      <line x1="630" y1="285" x2="630" y2="295" stroke="#889890" stroke-width="3"/><text x="630" y="318">1</text>
      <line x1="720" y1="285" x2="720" y2="295" stroke="#889890" stroke-width="3"/><text x="720" y="318">2</text>
      <line x1="810" y1="285" x2="810" y2="295" stroke="#889890" stroke-width="3"/><text x="810" y="318">3</text>
      <line x1="900" y1="285" x2="900" y2="295" stroke="#889890" stroke-width="3"/><text x="900" y="318">4</text>
      <line x1="990" y1="285" x2="990" y2="295" stroke="#889890" stroke-width="3"/><text x="990" y="318">5</text>
      <line x1="1080" y1="285" x2="1080" y2="295" stroke="#889890" stroke-width="3"/><text x="1080" y="318">6</text>
      <line x1="1170" y1="285" x2="1170" y2="295" stroke="#889890" stroke-width="3"/><text x="1170" y="318">7</text>
      <line x1="1260" y1="285" x2="1260" y2="295" stroke="#889890" stroke-width="3"/><text x="1260" y="318">8</text>
      <line x1="1350" y1="285" x2="1350" y2="295" stroke="#889890" stroke-width="3"/><text x="1350" y="318">9</text>
      <line x1="1440" y1="285" x2="1440" y2="295" stroke="#889890" stroke-width="3"/><text x="1440" y="318">10</text>
    </g>

    
    
    <rect x="720" y="145" width="90" height="42" rx="8" fill="#b8d4c2" stroke="#207448" stroke-width="2"/>
    <text x="765" y="174" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">[2,3]</text>

    
    <rect x="630" y="205" width="90" height="42" rx="8" fill="#b8d4c2" stroke="#207448" stroke-width="2"/>
    <text x="675" y="234" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">[1,2]</text>
  </g>

  
  <g id="transition-sort">
    <path d="M 720 315 L 720 380" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)"/>
    <rect x="750" y="332" width="200" height="42" rx="21" fill="#207448"/>
    <text x="850" y="361" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">sort by start</text>
  </g>

  
  <g id="strip-2">
    
    <rect x="80" y="390" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="2"/>
    
    
    
    <g transform="translate(110, 415)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="42" x2="44" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="14" x2="22" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="185" y="442" font-size="30" font-weight="bold" fill="#303a36">sorted by start</text>

    
    <line x1="540" y1="570" x2="1440" y2="570" stroke="#889890" stroke-width="3" stroke-linecap="round"/>
    
    <g font-size="24" fill="#889890" text-anchor="middle">
      <line x1="540" y1="570" x2="540" y2="580" stroke="#889890" stroke-width="3"/><text x="540" y="602">0</text>
      <line x1="630" y1="570" x2="630" y2="580" stroke="#889890" stroke-width="3"/><text x="630" y="602">1</text>
      <line x1="720" y1="570" x2="720" y2="580" stroke="#889890" stroke-width="3"/><text x="720" y="602">2</text>
      <line x1="810" y1="570" x2="810" y2="580" stroke="#889890" stroke-width="3"/><text x="810" y="602">3</text>
      <line x1="900" y1="570" x2="900" y2="580" stroke="#889890" stroke-width="3"/><text x="900" y="602">4</text>
      <line x1="990" y1="570" x2="990" y2="580" stroke="#889890" stroke-width="3"/><text x="990" y="602">5</text>
      <line x1="1080" y1="570" x2="1080" y2="580" stroke="#889890" stroke-width="3"/><text x="1080" y="602">6</text>
      <line x1="1170" y1="570" x2="1170" y2="580" stroke="#889890" stroke-width="3"/><text x="1170" y="602">7</text>
      <line x1="1260" y1="570" x2="1260" y2="580" stroke="#889890" stroke-width="3"/><text x="1260" y="602">8</text>
      <line x1="1350" y1="570" x2="1350" y2="580" stroke="#889890" stroke-width="3"/><text x="1350" y="602">9</text>
      <line x1="1440" y1="570" x2="1440" y2="580" stroke="#889890" stroke-width="3"/><text x="1440" y="602">10</text>
    </g>

    
    
    <rect x="630" y="445" width="90" height="42" rx="8" fill="#b8d4c2" stroke="#207448" stroke-width="2"/>
    <text x="675" y="474" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">[1,2]</text>

    
    <rect x="720" y="500" width="90" height="42" rx="8" fill="#b8d4c2" stroke="#207448" stroke-width="2"/>
    <text x="765" y="529" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">[2,3]</text>
  </g>

  
  <g id="sweep-and-callout">
    
    <line x1="720" y1="545" x2="720" y2="760" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4"/>

    
    <path d="M 725 640 L 805 640" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    
    <rect x="825" y="618" width="480" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="840" y="648" font-size="24" fill="#303a36">
      <tspan font-weight="bold">last merged end</tspan>: <tspan font-family="monospace" font-weight="bold" fill="#207448">start &lt;= merged[-1][1]</tspan>
    </text>

    
    
    <rect x="180" y="612" width="490" height="96" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 670 655 L 710 655" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

    <text x="425" y="650" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="425" dy="0">less than or equal</tspan>
      <tspan x="425" dy="32">merges touching intervals</tspan>
    </text>
  </g>

  
  <g id="strip-3">
    
    <rect x="80" y="730" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#d0ded3" stroke-width="2"/>
    
    
    
    <g transform="translate(110, 755)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="8" y="14" width="20" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="22" y="14" width="26" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="185" y="782" font-size="30" font-weight="bold" fill="#303a36">merged result</text>
    
    
    <text x="185" y="830" font-size="24" fill="#303a36">
      <tspan font-family="monospace">[(1,2),(2,3)]</tspan> giving <tspan font-family="monospace" font-weight="bold" fill="#207448">[(1,3)]</tspan>
    </text>

    
    <line x1="540" y1="910" x2="1440" y2="910" stroke="#889890" stroke-width="3" stroke-linecap="round"/>
    
    <g font-size="24" fill="#889890" text-anchor="middle">
      <line x1="540" y1="910" x2="540" y2="920" stroke="#889890" stroke-width="3"/><text x="540" y="942">0</text>
      <line x1="630" y1="910" x2="630" y2="920" stroke="#889890" stroke-width="3"/><text x="630" y="942">1</text>
      <line x1="720" y1="910" x2="720" y2="920" stroke="#889890" stroke-width="3"/><text x="720" y="942">2</text>
      <line x1="810" y1="910" x2="810" y2="920" stroke="#889890" stroke-width="3"/><text x="810" y="942">3</text>
      <line x1="900" y1="910" x2="900" y2="920" stroke="#889890" stroke-width="3"/><text x="900" y="942">4</text>
      <line x1="990" y1="910" x2="990" y2="920" stroke="#889890" stroke-width="3"/><text x="990" y="942">5</text>
      <line x1="1080" y1="910" x2="1080" y2="920" stroke="#889890" stroke-width="3"/><text x="1080" y="942">6</text>
      <line x1="1170" y1="910" x2="1170" y2="920" stroke="#889890" stroke-width="3"/><text x="1170" y="942">7</text>
      <line x1="1260" y1="910" x2="1260" y2="920" stroke="#889890" stroke-width="3"/><text x="1260" y="942">8</text>
      <line x1="1350" y1="910" x2="1350" y2="920" stroke="#889890" stroke-width="3"/><text x="1350" y="942">9</text>
      <line x1="1440" y1="910" x2="1440" y2="920" stroke="#889890" stroke-width="3"/><text x="1440" y="942">10</text>
    </g>

    
    <rect x="630" y="800" width="180" height="52" rx="8" fill="#207448" stroke="#165132" stroke-width="2"/>
    <text x="720" y="835" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">[(1,3)]</text>
  </g>

  
  <g id="steps" transform="translate(80, 975)">
    
    <rect x="0" y="0" width="455" height="100" rx="14" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#207448"/>
    <text x="50" y="58" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="96" y="58" font-size="26" font-weight="bold" fill="#303a36">sort by start</text>

    
    <rect x="492" y="0" width="455" height="100" rx="14" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    <circle cx="542" cy="50" r="24" fill="#207448"/>
    <text x="542" y="58" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="588" y="50" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="588" dy="0">keep the last</tspan>
      <tspan x="588" dy="28">merged interval</tspan>
    </text>

    
    <rect x="985" y="0" width="455" height="100" rx="14" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>
    <circle cx="1035" cy="50" r="24" fill="#207448"/>
    <text x="1035" y="58" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1081" y="58" font-size="26" font-weight="bold" fill="#303a36">extend it or append</text>
  </g>

  
  <g id="takeaway" transform="translate(80, 1110)">
    <rect x="0" y="0" width="1440" height="90" rx="14" fill="#207448"/>
    <text x="720" y="56" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
      After sorting, an interval can only overlap the last merged one.
    </text>
  </g>
</svg>