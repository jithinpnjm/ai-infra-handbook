<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <title>A utilisation panel needs a saturation panel and the worst pod</title>
  <desc>Visual infographic contrasting utilisation, saturation, gauge metrics, and dashboard structure for inference workloads.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A utilisation panel needs a saturation panel</tspan>
    <tspan x="800" dy="56">and the worst pod</tspan>
  </text>

  
  <rect x="40" y="160" width="510" height="690" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(65, 185)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <rect x="18" y="18" width="20" height="20" rx="2"/>
    <line x1="18" y1="2" x2="18" y2="10"/>
    <line x1="28" y1="2" x2="28" y2="10"/>
    <line x1="38" y1="2" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="54"/>
    <line x1="28" y1="46" x2="28" y2="54"/>
    <line x1="38" y1="46" x2="38" y2="54"/>
    <line x1="2" y1="18" x2="10" y2="18"/>
    <line x1="2" y1="28" x2="10" y2="28"/>
    <line x1="2" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="54" y2="18"/>
    <line x1="46" y1="28" x2="54" y2="28"/>
    <line x1="46" y1="38" x2="54" y2="38"/>
  </g>

  
  <text x="135" y="222" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">KV cache usage</text>

  
  <text x="65" y="285" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">pod 1</text>
  <rect x="65" y="298" width="460" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="65" y="298" width="138" height="32" rx="6" fill="#207448"/>

  
  <text x="65" y="365" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">pod 2</text>
  <rect x="65" y="378" width="460" height="32" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="65" y="378" width="133" height="32" rx="6" fill="#207448"/>

  
  <text x="65" y="448" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
    <tspan x="65" dy="0">pod 3 at 100 percent</tspan>
    <tspan x="65" dy="28">(rejecting work)</tspan>
  </text>
  <rect x="65" y="490" width="460" height="32" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <rect x="65" y="490" width="460" height="32" rx="6" fill="#db8129"/>

  
  <rect x="65" y="555" width="460" height="265" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="85" y="610" font-size="24px" fill="#303a36">
    <tspan x="85" dy="0" font-family="monospace" font-weight="bold">avg(vllm:kv_cache_usage_perc)</tspan>
    <tspan x="85" dy="50" font-family="sans-serif">shows 0.53 while one pod</tspan>
    <tspan x="85" dy="45" font-family="sans-serif">is at 1; max(...) shows it</tspan>
  </text>

  
  <rect x="590" y="160" width="420" height="690" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(615, 185)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="9"/>
    <circle cx="28" cy="28" r="18"/>
    <line x1="28" y1="2" x2="28" y2="8"/>
    <line x1="28" y1="48" x2="28" y2="54"/>
    <line x1="2" y1="28" x2="8" y2="28"/>
    <line x1="48" y1="28" x2="54" y2="28"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="42" y1="42" x2="46" y2="46"/>
    <line x1="10" y1="46" x2="14" y2="42"/>
    <line x1="42" y1="14" x2="46" y2="10"/>
  </g>

  
  <text x="615" y="280" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
    USE method:
  </text>
  <text x="615" y="325" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="615" dy="0">utilization is how busy a</tspan>
    <tspan x="615" dy="34">resource is, saturation is</tspan>
    <tspan x="615" dy="34">queued work it cannot</tspan>
    <tspan x="615" dy="34">service; errors first,</tspan>
    <tspan x="615" dy="34">then saturation. For an</tspan>
    <tspan x="615" dy="34">inference engine KV</tspan>
    <tspan x="615" dy="34">cache usage is</tspan>
    <tspan x="615" dy="34">utilization, the waiting</tspan>
    <tspan x="615" dy="34">queue is saturation.</tspan>
    <tspan x="615" dy="34">A busy pod with an</tspan>
    <tspan x="615" dy="34">empty queue is working</tspan>
    <tspan x="615" dy="34">as designed; a pod with</tspan>
    <tspan x="615" dy="34">a queue behind it is</tspan>
    <tspan x="615" dy="34">in trouble</tspan>
  </text>

  
  <rect x="1050" y="160" width="510" height="690" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1075, 185)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 38 A 24 24 0 1 1 50 38"/>
    <line x1="28" y1="38" x2="42" y2="20"/>
    <circle cx="28" cy="38" r="4" fill="#207448"/>
    <line x1="10" y1="20" x2="14" y2="23"/>
    <line x1="28" y1="10" x2="28" y2="15"/>
    <line x1="46" y1="20" x2="42" y2="23"/>
  </g>

  
  <text x="1075" y="280" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
    <tspan x="1075" dy="0">rate over a gauge</tspan>
    <tspan x="1075" dy="38">that holds at 7</tspan>
  </text>
  <text x="1075" y="375" font-size="24px" fill="#303a36">
    <tspan x="1075" dy="0" font-family="sans-serif">returns zero and says the</tspan>
    <tspan x="1075" dy="38" font-family="sans-serif">queue is empty (exercise 13);</tspan>
    <tspan x="1075" dy="48" font-family="sans-serif">use the value itself,</tspan>
    <tspan x="1075" dy="42" font-family="monospace" font-weight="bold">avg_over_time,</tspan>
    <tspan x="1075" dy="42" font-family="monospace" font-weight="bold">max_over_time,</tspan>
    <tspan x="1075" dy="48" font-family="sans-serif">or deriv for the trend</tspan>
  </text>

  
  <rect x="40" y="880" width="1520" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="40" y="880" width="1520" height="12" rx="4" fill="#207448"/>
  <text x="70" y="930" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="70" dy="0" font-weight="bold">Grafana: USE suits hardware resources such as a GPU or disk,</tspan>
    <tspan x="70" dy="36">RED (request rate, errors, duration) suits services; alert on symptoms rather than causes;</tspan>
    <tspan x="70" dy="36">inference dashboard = a RED row for the gateway and a USE row for the engine,</tspan>
    <tspan x="70" dy="36">saturation next to every utilization panel</tspan>
  </text>
</svg>