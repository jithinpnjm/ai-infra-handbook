<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>LRU cache: a hash map and a linked list with sentinels</title>
  <desc>Visual diagram of an LRU cache featuring a hash map pointing to doubly linked list nodes between head and tail sentinels.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">LRU cache: a hash map and a linked list with sentinels</text>

  
  <rect x="50" y="130" width="320" height="490" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  
  <text x="85" y="185" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="85" dy="0">Hash map:</tspan>
    <tspan x="85" dy="36">key to node</tspan>
  </text>

  
  
  <rect x="85" y="270" width="200" height="60" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="135" y="311" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">k1</text>
  <circle cx="270" cy="300" r="6" fill="#207448"/>

  
  <rect x="85" y="350" width="200" height="60" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="135" y="391" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">k2</text>
  <circle cx="270" cy="380" r="6" fill="#207448"/>

  
  <rect x="85" y="430" width="200" height="60" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="135" y="471" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">k3</text>
  <circle cx="270" cy="460" r="6" fill="#207448"/>

  
  
  <rect x="520" y="360" width="190" height="46" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="615" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Most recent</text>

  
  <rect x="1380" y="360" width="180" height="46" rx="12" ry="12" fill="#faefe6" stroke="#db8129" stroke-width="2"/>
  <text x="1470" y="392" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Evicted first</text>

  
  
  <rect x="470" y="440" width="170" height="130" rx="12" ry="12" fill="#e2e8e5" stroke="#788882" stroke-width="3"/>
  <text x="555" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="555" dy="0">Head</tspan>
    <tspan x="555" dy="34">sentinel</tspan>
  </text>

  
  <rect x="680" y="440" width="210" height="130" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <text x="785" y="495" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="785" dy="0" font-size="28" font-weight="bold">k3 most recent</tspan>
  </text>

  
  <rect x="930" y="440" width="180" height="130" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <rect x="948" y="465" width="65" height="80" rx="6" ry="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="1025" y="465" width="65" height="80" rx="6" ry="6" fill="#f5f8f5" stroke="#788882" stroke-width="2"/>

  
  <rect x="1150" y="440" width="210" height="130" rx="12" ry="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="1255" y="495" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1255" dy="0" font-size="28" font-weight="bold">k1 least recent</tspan>
  </text>

  
  <rect x="1400" y="440" width="170" height="130" rx="12" ry="12" fill="#e2e8e5" stroke="#788882" stroke-width="3"/>
  <text x="1485" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1485" dy="0">Tail</tspan>
    <tspan x="1485" dy="34">sentinel</tspan>
  </text>

  
  
  <path d="M 640 485 L 678 485" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 680 525 L 642 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 890 485 L 928 485" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 930 525 L 892 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1110 485 L 1148 485" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1150 525 L 1112 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 1360 485 L 1398 485" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1400 525 L 1362 525" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  
  <path d="M 270 460 L 440 460 L 440 280 L 785 280 L 785 438" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 270 380 L 410 380 L 410 235 L 1020 235 L 1020 438" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <path d="M 270 300 L 380 300 L 380 190 L 1255 190 L 1255 438" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  
  <rect x="470" y="660" width="1100" height="74" rx="10" ry="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="500" y="706" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">get(k1): move the node to the front</text>

  
  <rect x="470" y="756" width="1100" height="104" rx="10" ry="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="500" y="798" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="500" dy="0">put when full: remove the node next to the tail sentinel</tspan>
    <tspan x="500" dy="34">and delete its key from the map</tspan>
  </text>

  
  <rect x="50" y="900" width="1520" height="84" rx="12" ry="12" fill="#207448"/>
  <text x="810" y="952" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Each node stores its key, so eviction can delete the map entry.</text>
</svg>