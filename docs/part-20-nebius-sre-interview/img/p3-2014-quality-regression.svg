<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Latency is green but quality regressed</title>
  <desc>Side-by-side metric table for a fine-tuned checkpoint canary at 5 percent. Rows: 'TTFT and inter-token latency: match baseline'; 'error rate: same'; 'token rate: same'; 'eval quality: 0.90 baseline versus 0.84 canary, down 0.060'; 'finish_reason length share: 0.05 versus 0.22, shift 0.17'. Verdict: 'decision returned rollback with two reasons, quality down 0.060 and a length-share shift of 0.17; a latency-only gate would have promoted; support reported cut-off answers a day after rollout'. Actions: 'roll back by pointing the endpoint at the previous version id; compare outputs on the fixed prompt set; check the tokenizer and generation config bound to the new version; add the eval and finish_reason gates to the pipeline'.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Latency is green but quality regressed</text>

  
  <rect x="50" y="100" width="1500" height="410" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="70" y="118" width="50" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="70" y1="132" x2="120" y2="132" stroke="#207448" stroke-width="4" />
  <line x1="95" y1="132" x2="95" y2="160" stroke="#207448" stroke-width="4" />
  
  <text x="140" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Side-by-side metric table for a fine-tuned checkpoint canary at 5 percent</text>

  
  <rect x="75" y="180" width="1450" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="105" y="214" font-family="sans-serif" font-size="24" fill="#303a36">TTFT and inter-token latency: match baseline</text>

  <rect x="75" y="244" width="1450" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="105" y="278" font-family="sans-serif" font-size="24" fill="#303a36">error rate: same</text>

  <rect x="75" y="308" width="1450" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="105" y="342" font-family="sans-serif" font-size="24" fill="#303a36">token rate: same</text>

  <rect x="75" y="372" width="1450" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="105" y="406" font-family="sans-serif" font-size="24" fill="#303a36">eval quality: 0.90 baseline versus 0.84 canary, down 0.060</text>

  <rect x="75" y="436" width="1450" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="105" y="470" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">finish_reason</tspan> length share: 0.05 versus 0.22, shift 0.17</text>

  
  <rect x="50" y="535" width="1500" height="230" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  
  <path d="M 72 558 L 95 550 L 118 558 C 118 578 95 592 95 592 C 95 578 72 558 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  
  <text x="140" y="582" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Verdict</text>
  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" y="640">decision returned rollback with two reasons, quality down 0.060 and a length-share shift of 0.17; </tspan>
    <tspan x="75" y="682">a latency-only gate would have promoted; support reported cut-off answers a day after rollout</tspan>
  </text>

  
  <rect x="50" y="790" width="1500" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="95" cy="832" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="95" cy="832" r="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="95" y1="810" x2="95" y2="816" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="95" y1="848" x2="95" y2="854" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="73" y1="832" x2="79" y2="832" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="111" y1="832" x2="117" y2="832" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="140" y="840" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Actions</text>

  
  <circle cx="100" cy="895" r="24" fill="#207448" />
  <text x="100" y="903" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="100" cy="960" r="24" fill="#207448" />
  <text x="100" y="968" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="100" cy="1025" r="24" fill="#207448" />
  <text x="100" y="1033" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <circle cx="100" cy="1090" r="24" fill="#207448" />
  <text x="100" y="1098" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" y="903">roll back by pointing the endpoint at the previous version id; </tspan>
    <tspan x="140" y="968">compare outputs on the fixed prompt set; </tspan>
    <tspan x="140" y="1033">check the tokenizer and generation config bound to the new version; </tspan>
    <tspan x="140" y="1098">add the eval and finish_reason gates to the pipeline</tspan>
  </text>
</svg>