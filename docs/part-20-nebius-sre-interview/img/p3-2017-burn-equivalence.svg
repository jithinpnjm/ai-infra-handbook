<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Fast burn and slow burn can use the same share of the budget</title>
  <desc>Infographic illustrating how fast burn and slow burn consume the error budget over time, and how error budget governs rollout speed.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="80" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Fast burn and slow burn can use the same share of the budget</text>

  
  <rect x="80" y="100" width="1440" height="540" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(115, 126)">
    <circle cx="28" cy="30" r="22" stroke="#207448" stroke-width="4" fill="none" />
    <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="22" y1="2" x2="34" y2="2" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <polyline points="28,18 28,30 38,30" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  
  <text x="190" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="190" dy="0">Error budget for a 99.9 percent SLO over 30 days:</tspan>
    <tspan x="190" dy="38">0.001 x 30 x 24 x 60 = 43.2 min (720 hours)</tspan>
  </text>

  
  <line x1="115" y1="210" x2="1485" y2="210" stroke="#b8cebf" stroke-width="2" />

  
  <g transform="translate(115, 230)">
    <path d="M28,6 C28,16 38,20 38,32 C38,42 30,50 20,50 C12,50 6,42 6,32 C6,22 14,14 18,10 C18,18 22,22 24,20 C26,16 28,6 28,6 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" />
  </g>
  <text x="190" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">14.4x burn for 1 h: 14.4 x 1 / 720 = 2 percent of the budget</text>
  <rect x="190" y="268" width="1280" height="32" rx="6" fill="#ffffff" stroke="#b8cebf" stroke-width="2" />
  <rect x="190" y="268" width="26" height="32" rx="6" fill="#db8129" />

  
  <g transform="translate(115, 330)">
    <path d="M8,44 A22,22 0 1,1 48,44" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" />
    <line x1="28" y1="28" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="28" r="4" fill="#207448" />
  </g>
  <text x="190" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">6x for 6 h: 6 x 6 / 720 = 5 percent</text>
  <rect x="190" y="368" width="1280" height="32" rx="6" fill="#ffffff" stroke="#b8cebf" stroke-width="2" />
  <rect x="190" y="368" width="64" height="32" rx="6" fill="#207448" />

  
  <g transform="translate(115, 430)">
    <circle cx="28" cy="28" r="22" stroke="#207448" stroke-width="4" fill="none" />
    <polyline points="28,14 28,28 38,34" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="190" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">1x for 72 h: 72 / 720 = 10 percent</text>
  <rect x="190" y="468" width="1280" height="32" rx="6" fill="#ffffff" stroke="#b8cebf" stroke-width="2" />
  <rect x="190" y="468" width="128" height="32" rx="6" fill="#207448" />

  
  <line x1="115" y1="525" x2="1485" y2="525" stroke="#b8cebf" stroke-width="1.5" stroke-dasharray="6 6" />

  
  <text x="115" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">read each row as how fast the budget disappears; a fast burn for a short time and</tspan>
    <tspan x="115" dy="34">a slow burn for a long time can use up the same share, which is why the alert policy has three pairs</tspan>
  </text>

  
  <rect x="80" y="680" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(115, 742)">
    <circle cx="28" cy="28" r="22" stroke="#207448" stroke-width="4" fill="none" />
    <circle cx="28" cy="28" r="14" stroke="#207448" stroke-width="3" fill="none" />
    <line x1="28" y1="14" x2="28" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="0" x2="28" y2="4" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="8" x2="13" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="8" x2="43" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="195" y="745" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="195" dy="0">error budget is the control knob for rollout speed: budget left means</tspan>
    <tspan x="195" dy="42">a rollout can move faster, budget spent means it slows or stops</tspan>
  </text>
</svg>