<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Model inference serving [report]</title>
  <desc>Inference serving architecture showing traffic flowing from clients through a gateway with authentication and limits to a router, which dispatches requests to engine replicas that emit metrics.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Model inference serving [report]</text>

  
  <g id="node-clients">
    <rect x="50" y="375" width="160" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(102, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="18" r="12" />
      <path d="M 8 50 C 8 36, 48 36, 48 50" />
      <path d="M 38 12 A 9 9 0 0 1 47 21 C 47 26, 44 30, 40 32" />
      <path d="M 46 48 C 47 43, 54 41, 54 48" />
    </g>
    <text x="130" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Clients</text>
  </g>

  
  <line x1="210" y1="480" x2="270" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-gateway">
    <rect x="270" y="375" width="400" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(442, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 15 C 48 36, 28 50, 28 50 C 28 50, 8 36, 8 15 Z" />
      <circle cx="28" cy="24" r="5" />
      <line x1="28" y1="29" x2="28" y2="38" />
    </g>
    <text x="470" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Gateway: auth, limits</text>
  </g>

  
  <line x1="670" y1="480" x2="730" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-router">
    <rect x="730" y="375" width="160" height="210" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(782, 410)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="18" width="44" height="24" rx="5" />
      <line x1="16" y1="18" x2="10" y2="8" />
      <line x1="40" y1="18" x2="46" y2="8" />
      <circle cx="16" cy="30" r="2.5" fill="#db8129" />
      <circle cx="28" cy="30" r="2.5" fill="#db8129" />
      <circle cx="40" cy="30" r="2.5" fill="#db8129" />
    </g>
    <text x="810" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Router</text>
  </g>

  
  <path d="M 890 460 H 925 A 20 20 0 0 0 945 440 V 355 A 20 20 0 0 1 965 335 H 995" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 890 500 H 925 A 20 20 0 0 1 945 520 V 605 A 20 20 0 0 0 965 625 H 995" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-engine-1">
    <rect x="995" y="230" width="290" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1112, 265)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" />
      <line x1="18" y1="4" x2="18" y2="12" />
      <line x1="28" y1="4" x2="28" y2="12" />
      <line x1="38" y1="4" x2="38" y2="12" />
      <line x1="18" y1="44" x2="18" y2="52" />
      <line x1="28" y1="44" x2="28" y2="52" />
      <line x1="38" y1="44" x2="38" y2="52" />
      <line x1="4" y1="18" x2="12" y2="18" />
      <line x1="4" y1="28" x2="12" y2="28" />
      <line x1="4" y1="38" x2="12" y2="38" />
      <line x1="44" y1="18" x2="52" y2="18" />
      <line x1="44" y1="28" x2="52" y2="28" />
      <line x1="44" y1="38" x2="52" y2="38" />
    </g>
    <text x="1140" y="385" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Engine replica</text>
  </g>

  
  <g id="node-engine-2">
    <rect x="995" y="520" width="290" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1112, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" />
      <line x1="18" y1="4" x2="18" y2="12" />
      <line x1="28" y1="4" x2="28" y2="12" />
      <line x1="38" y1="4" x2="38" y2="12" />
      <line x1="18" y1="44" x2="18" y2="52" />
      <line x1="28" y1="44" x2="28" y2="52" />
      <line x1="38" y1="44" x2="38" y2="52" />
      <line x1="4" y1="18" x2="12" y2="18" />
      <line x1="4" y1="28" x2="12" y2="28" />
      <line x1="4" y1="38" x2="12" y2="38" />
      <line x1="44" y1="18" x2="52" y2="18" />
      <line x1="44" y1="28" x2="52" y2="28" />
      <line x1="44" y1="38" x2="52" y2="38" />
    </g>
    <text x="1140" y="675" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Engine replica</text>
  </g>

  
  <path d="M 1285 335 H 1315 A 20 20 0 0 1 1335 355 V 440 A 20 20 0 0 0 1355 460 H 1390" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1285 625 H 1315 A 20 20 0 0 0 1335 605 V 520 A 20 20 0 0 1 1355 500 H 1390" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="node-metrics">
    <rect x="1390" y="375" width="160" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1442, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <line x1="6" y1="40" x2="50" y2="40" stroke-width="2" />
      <polyline points="12,34 22,22 32,28 42,14" />
    </g>
    <text x="1470" y="530" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Metrics</text>
  </g>
</svg>