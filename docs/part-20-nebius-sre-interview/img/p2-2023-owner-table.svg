<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Each symptom has one owner and one first object to read</title>
  <desc>A table of Kubernetes symptoms, their component owners, and the first diagnostic objects to examine.</desc>

  <defs>
    
    <g id="icon-wheel" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="20" fill="#e8f1ea"/>
      <circle cx="0" cy="0" r="6" fill="#207448"/>
      <line x1="0" y1="-26" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="18" y2="-18"/>
    </g>

    
    <g id="icon-gear" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="16" fill="#e8f1ea"/>
      <circle cx="0" cy="0" r="6" fill="#207448"/>
      <line x1="0" y1="-24" x2="0" y2="-16" stroke-width="4.5"/>
      <line x1="0" y1="16" x2="0" y2="24" stroke-width="4.5"/>
      <line x1="-24" y1="0" x2="-16" y2="0" stroke-width="4.5"/>
      <line x1="16" y1="0" x2="24" y2="0" stroke-width="4.5"/>
      <line x1="-17" y1="-17" x2="-11" y2="-11" stroke-width="4.5"/>
      <line x1="11" y1="11" x2="17" y2="17" stroke-width="4.5"/>
      <line x1="-17" y1="17" x2="-11" y2="11" stroke-width="4.5"/>
      <line x1="11" y1="-11" x2="17" y2="-16" stroke-width="4.5"/>
    </g>

    
    <g id="icon-loop" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 0 -20 A 20 20 0 0 1 20 0 A 20 20 0 0 1 2 20"/>
      <polyline points="8,14 1,20 7,26" stroke-width="3.5"/>
      <path d="M 0 20 A 20 20 0 0 1 -20 0 A 20 20 0 0 1 -2 -20"/>
      <polyline points="-8,-14 -1,-20 -7,-26" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="5" fill="#207448"/>
    </g>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">Each symptom has one owner </tspan><tspan x="800" dy="56">and one first object to read</tspan></text>

  
  <rect x="50" y="145" width="1500" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="165" y="181" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Symptom</text>
  <text x="585" y="181" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Owner</text>
  <text x="965" y="181" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">First object to read</text>

  
  <g id="row-1">
    <rect x="50" y="210" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-wheel" x="100" y="258"/>
    <line x1="145" y1="218" x2="145" y2="298" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="266" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Pending, no node assigned</text>
    <line x1="565" y1="218" x2="565" y2="298" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="266" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kube-scheduler</text>
    <line x1="945" y1="218" x2="945" y2="298" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="250" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="965" dy="0">Pod events, </tspan><tspan x="965" dy="30">node Allocatable and Taints</tspan></text>
  </g>

  
  <g id="row-2">
    <rect x="50" y="318" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-gear" x="100" y="366"/>
    <line x1="145" y1="326" x2="145" y2="406" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="374" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Waiting, ImagePullBackOff</text>
    <line x1="565" y1="326" x2="565" y2="406" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="374" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">kubelet and runtime</text>
    <line x1="945" y1="326" x2="945" y2="406" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="374" font-family="sans-serif" font-size="24" fill="#303a36">Pod events, registry</text>
  </g>

  
  <g id="row-3">
    <rect x="50" y="426" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-gear" x="100" y="474"/>
    <line x1="145" y1="434" x2="145" y2="514" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="482" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Restart count rising</text>
    <line x1="565" y1="434" x2="565" y2="514" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="482" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubelet</text>
    <line x1="945" y1="434" x2="945" y2="514" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="466" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="965" dy="0">Last State, probe events, </tspan><tspan x="965" dy="30" font-family="monospace">logs --previous</tspan></text>
  </g>

  
  <g id="row-4">
    <rect x="50" y="534" width="1500" height="154" rx="10" fill="#fffefc" stroke="#db8129" stroke-width="3"/>
    <use href="#icon-loop" x="100" y="582"/>
    <line x1="145" y1="542" x2="145" y2="622" stroke="#fbe7d5" stroke-width="2"/>
    <text x="165" y="590" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Pod missing from a Service</text>
    <line x1="565" y1="542" x2="565" y2="622" stroke="#fbe7d5" stroke-width="2"/>
    <text x="585" y="574" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="585" dy="0">EndpointSlice </tspan><tspan x="585" dy="30">controller</tspan></text>
    <line x1="945" y1="542" x2="945" y2="622" stroke="#fbe7d5" stroke-width="2"/>
    <text x="965" y="574" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="965" dy="0">Pod Ready condition, </tspan><tspan x="965" dy="30">selector</tspan></text>
    
    <rect x="70" y="634" width="1460" height="42" rx="6" fill="#fef3e7" stroke="#db8129" stroke-width="1.5"/>
    <text x="800" y="663" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">A Service with no endpoints: check the Ready condition</text>
  </g>

  
  <g id="row-5">
    <rect x="50" y="700" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-loop" x="100" y="748"/>
    <line x1="145" y1="708" x2="145" y2="788" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="740" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan x="165" dy="0">Replica count not </tspan><tspan x="165" dy="30">following load</tspan></text>
    <line x1="565" y1="708" x2="565" y2="788" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="756" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">HPA controller</text>
    <line x1="945" y1="708" x2="945" y2="788" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="756" font-family="sans-serif" font-size="24" fill="#303a36">HPA conditions, metrics</text>
  </g>

  
  <g id="row-6">
    <rect x="50" y="808" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-loop" x="100" y="856"/>
    <line x1="145" y1="816" x2="145" y2="896" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="848" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan x="165" dy="0">Pods vanish when </tspan><tspan x="165" dy="30">a node dies</tspan></text>
    <line x1="565" y1="816" x2="565" y2="896" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="864" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">node controller</text>
    <line x1="945" y1="816" x2="945" y2="896" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="864" font-family="sans-serif" font-size="24" fill="#303a36">Node conditions, taints</text>
  </g>

  
  <g id="row-7">
    <rect x="50" y="916" width="1500" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <use href="#icon-loop" x="100" y="964"/>
    <line x1="145" y1="924" x2="145" y2="1004" stroke="#e8f1ea" stroke-width="2"/>
    <text x="165" y="972" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Deploy rejected or hangs</text>
    <line x1="565" y1="924" x2="565" y2="1004" stroke="#e8f1ea" stroke-width="2"/>
    <text x="585" y="956" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="585" dy="0">API server and </tspan><tspan x="585" dy="30">webhooks</tspan></text>
    <line x1="945" y1="924" x2="945" y2="1004" stroke="#e8f1ea" stroke-width="2"/>
    <text x="965" y="956" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="965" dy="0">Event text, </tspan><tspan x="965" dy="30">webhook configuration</tspan></text>
  </g>

  
  <rect x="50" y="1032" width="1500" height="68" rx="10" fill="#207448"/>
  <text x="800" y="1074" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Most Kubernetes failures are a disagreement between loops.</text>
</svg>