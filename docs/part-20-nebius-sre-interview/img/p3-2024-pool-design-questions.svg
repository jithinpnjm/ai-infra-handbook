<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Six questions before writing a GPU node pool</title>
  <desc>Visual infographic detailing the six essential architecture and configuration questions to resolve before provisioning a GPU node pool.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Six questions before writing a GPU node pool</text>

  
  <rect x="60" y="110" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(88, 126)">
    <path d="M 8 44 A 20 20 0 1 1 48 44" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="32" x2="40" y2="20" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="32" r="3.5" fill="#db8129"/>
    <line x1="42" y1="14" x2="48" y2="20" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="160" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">1 Quota</text>
  <line x1="88" y1="196" x2="752" y2="196" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="88" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="88" dy="0">per project and per region, only admin-role</tspan>
    <tspan x="88" dy="31">group users can change it; a quota can be</tspan>
    <tspan x="88" dy="31">lowered automatically if usage stays well</tspan>
    <tspan x="88" dy="31">below the limit for a long time; check</tspan>
    <tspan x="88" dy="31">quota in the pipeline before apply</tspan>
  </text>

  
  <rect x="820" y="110" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(848, 126)">
    <rect x="8" y="10" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="8" y="24" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="8" y="38" width="40" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="16" cy="15" r="2" fill="#207448"/>
    <circle cx="16" cy="29" r="2" fill="#207448"/>
    <circle cx="16" cy="43" r="2" fill="#207448"/>
  </g>
  <text x="920" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">2 Capacity type</text>
  <line x1="848" y1="196" x2="1512" y2="196" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="848" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="848" dy="0">spot with price cap, on demand, reserved;</tspan>
    <tspan x="848" dy="31">reserved pools use capacity blocks first</tspan>
    <tspan x="848" dy="31">and roll with zero surge, so set</tspan>
    <tspan x="848" dy="31"><tspan font-family="monospace">max_unavailable</tspan> at 1 or more</tspan>
  </text>

  
  <rect x="60" y="465" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(88, 481)">
    <rect x="18" y="18" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="18" y1="18" x2="8" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="3.5" fill="#207448"/>
    <line x1="38" y1="18" x2="48" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="48" cy="8" r="3.5" fill="#207448"/>
    <line x1="18" y1="38" x2="8" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="8" cy="48" r="3.5" fill="#207448"/>
    <line x1="38" y1="38" x2="48" y2="48" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="3.5" fill="#207448"/>
  </g>
  <text x="160" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">3 Size</text>
  <line x1="88" y1="551" x2="752" y2="551" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="88" y="587" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="88" dy="0"><tspan font-family="monospace">fixed_node_count</tspan> and autoscaling cannot</tspan>
    <tspan x="88" dy="31">be combined; a group with NVLink cannot</tspan>
    <tspan x="88" dy="31">change <tspan font-family="monospace">fixed_node_count</tspan>; InfiniBand pools</tspan>
    <tspan x="88" dy="31">need 8-GPU presets and the autoscaler</tspan>
    <tspan x="88" dy="31">never adds InfiniBand nodes; serving pools</tspan>
    <tspan x="88" dy="31">fixed at N plus 1</tspan>
  </text>

  
  <rect x="820" y="465" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(848, 481)">
    <rect x="6" y="12" width="20" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="30" y="12" width="20" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
    <circle cx="16" cy="20" r="2.5" fill="#207448"/>
    <circle cx="16" cy="36" r="2.5" fill="#207448"/>
    <circle cx="40" cy="20" r="2.5" fill="#207448"/>
    <circle cx="40" cy="36" r="2.5" fill="#207448"/>
  </g>
  <text x="920" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">4 Zones and regions</text>
  <line x1="848" y1="551" x2="1512" y2="551" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="848" y="587" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="848" dy="0">the node group schema shows no zone</tspan>
    <tspan x="848" dy="31">argument; the cluster takes a subnet; do not</tspan>
    <tspan x="848" dy="31">claim a zone model Nebius has not published;</tspan>
    <tspan x="848" dy="31">multi-region is one block per region; ask</tspan>
    <tspan x="848" dy="31">what the failure domains really are</tspan>
  </text>

  
  <rect x="60" y="820" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(88, 836)">
    <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="20" y1="6" x2="20" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="6" x2="36" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="44" x2="20" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="22" y="22" width="12" height="12" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="160" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">5 Drivers</text>
  <line x1="88" y1="906" x2="752" y2="906" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="88" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="88" dy="0">node group <tspan font-family="monospace">gpu_settings</tspan> <tspan font-family="monospace">drivers_preset</tspan> left</tspan>
    <tspan x="88" dy="31">empty for GPU nodes without preinstalled</tspan>
    <tspan x="88" dy="31">drivers including DRA groups; operators</tspan>
    <tspan x="88" dy="31">go in the platform stage</tspan>
  </text>

  
  <rect x="820" y="820" width="720" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(848, 836)">
    <path d="M 12 28 A 16 16 0 0 1 42 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 40 10 L 46 18 L 36 21" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 28 A 16 16 0 0 1 14 38" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 16 46 L 10 38 L 20 35" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  <text x="920" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">6 Upgrades</text>
  <line x1="848" y1="906" x2="1512" y2="906" stroke="#d0dfd3" stroke-width="1.5"/>
  <text x="848" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="848" dy="0">most template changes roll new nodes, but</tspan>
    <tspan x="848" dy="29">changes to taints and labels apply only to</tspan>
    <tspan x="848" dy="29">nodes created afterwards, so the plan shows</tspan>
    <tspan x="848" dy="29">a change that does not roll nodes; always</tspan>
    <tspan x="848" dy="29">set the strategy because defaults are</tspan>
    <tspan x="848" dy="29">changing; <tspan font-family="monospace">etcd_cluster_size</tspan> defaults to 3</tspan>
    <tspan x="848" dy="29">and the module refuses other values</tspan>
  </text>
</svg>