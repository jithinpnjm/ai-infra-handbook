<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The bounded cache-aware router only follows the cache while the holder is not much busier</title>
  <desc>Visual flowchart of bounded cache-aware routing decisions comparing KV cache presence and backlog bounds against toy benchmark results.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f8f5"/>

  <text x="800" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The bounded cache-aware router only follows the cache</tspan>
    <tspan x="800" dy="54">while the holder is not much busier</tspan>
  </text>

  <g id="node-start">
    <rect x="330" y="145" width="570" height="95" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <g transform="translate(365, 164)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6" fill="#e8f1ea"/>
      <path d="M 12 20 L 28 20 M 12 28 L 38 28 M 12 36 L 24 36"/>
      <path d="M 38 14 L 46 22 L 38 30"/>
    </g>
    <text x="645" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">New request with prefix</text>
  </g>

  <line x1="615" y1="240" x2="615" y2="298" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="node-step1">
    <rect x="330" y="300" width="570" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <circle cx="372" cy="365" r="24" fill="#207448"/>
    <text x="372" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(418, 337)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="#e8f1ea"/>
      <path d="M 8 14 V 38 C 8 42 17 46 28 46 C 39 46 48 42 48 38 V 14"/>
      <path d="M 8 26 C 8 30 17 34 28 34 C 39 34 48 30 48 26"/>
    </g>
    <text x="675" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="675" dy="0">Does a replica hold the</tspan>
      <tspan x="675" dy="38">prefix in KV cache?</tspan>
    </text>
  </g>

  <line x1="900" y1="365" x2="968" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="node-least-loaded-1">
    <rect x="970" y="300" width="590" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1010, 337)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="6" fill="#ffffff"/>
      <line x1="8" y1="22" x2="48" y2="22"/>
      <circle cx="16" cy="16" r="2.5" fill="#207448"/>
      <circle cx="24" cy="16" r="2.5" fill="#207448"/>
      <path d="M 28 32 L 34 26 L 40 32"/>
    </g>
    <text x="1305" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Send to least loaded replica</text>
  </g>

  <line x1="615" y1="430" x2="615" y2="470" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="node-knob">
    <rect x="40" y="475" width="250" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(137, 485)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="24" r="18" fill="#ffffff"/>
      <line x1="28" y1="10" x2="28" y2="20"/>
      <circle cx="28" cy="24" r="3.5" fill="#207448"/>
      <path d="M 14 34 L 10 38 M 42 34 L 46 38"/>
    </g>
    <text x="165" y="546" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="165" dy="0">sweep the bound</tspan>
      <tspan x="165" dy="28">against p99,</tspan>
      <tspan x="165" dy="28">not hit rate</tspan>
    </text>
    <line x1="290" y1="540" x2="330" y2="540" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g id="node-step2">
    <rect x="330" y="475" width="570" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <circle cx="372" cy="540" r="24" fill="#207448"/>
    <text x="372" y="549" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(418, 512)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="8" x2="28" y2="46"/>
      <line x1="12" y1="18" x2="44" y2="18"/>
      <path d="M 12 18 L 6 34 H 18 Z" fill="#e8f1ea"/>
      <path d="M 44 18 L 38 30 H 50 Z" fill="#e8f1ea"/>
      <line x1="18" y1="46" x2="38" y2="46"/>
    </g>
    <text x="675" y="528" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="675" dy="0">Holder backlog within bound</tspan>
      <tspan x="675" dy="36">of least loaded replica?</tspan>
    </text>
  </g>

  <line x1="900" y1="540" x2="968" y2="540" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="node-least-loaded-2">
    <rect x="970" y="475" width="590" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1010, 512)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="34" height="40" rx="5" fill="#ffffff"/>
      <line x1="6" y1="20" x2="40" y2="20"/>
      <circle cx="14" cy="14" r="2.5" fill="#207448"/>
      <circle cx="42" cy="38" r="11" fill="#e8f1ea"/>
      <line x1="42" y1="32" x2="42" y2="44"/>
      <line x1="36" y1="38" x2="48" y2="38"/>
    </g>
    <text x="1305" y="528" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1305" dy="0">Send to least loaded replica,</tspan>
      <tspan x="1305" dy="36">which then caches the prefix too</tspan>
    </text>
  </g>

  <line x1="615" y1="605" x2="615" y2="643" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="node-cache-holder">
    <rect x="330" y="645" width="570" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <g transform="translate(370, 677)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" fill="#e8f1ea"/>
      <polygon points="18,18 28,28 18,38" fill="#207448"/>
      <polygon points="28,18 38,28 28,38" fill="#207448"/>
    </g>
    <text x="655" y="698" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="655" dy="0">Send to cache holder,</tspan>
      <tspan x="655" dy="36">prefill mostly skipped</tspan>
    </text>
  </g>

  <g id="panel-legend">
    <rect x="120" y="810" width="1360" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="140" y="825" width="1320" height="48" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(165, 831)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="30" x2="8" y2="18"/>
      <line x1="18" y1="30" x2="18" y2="10"/>
      <line x1="28" y1="30" x2="28" y2="6"/>
      <line x1="38" y1="30" x2="38" y2="14"/>
    </g>
    <text x="800" y="858" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">toy results</text>

    <rect x="140" y="885" width="1320" height="58" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    <text x="800" y="922" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">cache-only hit 0.98, p99 4.39 s, max over mean load 3.8</text>

    <rect x="140" y="953" width="1320" height="58" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="800" y="990" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">bounded hit 0.95, p99 0.50 s, max over mean load 2.13</text>
  </g>

  <g id="panel-takeaway">
    <rect x="40" y="1075" width="1520" height="65" rx="12" fill="#207448"/>
    <text x="800" y="1116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Use the cache holder only while it is not much busier than the idlest replica.</text>
  </g>
</svg>