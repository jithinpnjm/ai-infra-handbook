<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Which failures are safe to retry, and the guards around retries</title>
  <desc>Visual explanation of safe retry decision logic, retry guards, and scenario impact</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Which failures are safe to retry, and the guards around retries</text>

  
  <rect x="60" y="95" width="1480" height="245" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    
    <path d="M 28 44 L 28 26 M 28 26 L 16 14 M 28 26 L 40 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="16" cy="14" r="3" fill="#207448" />
    <circle cx="40" cy="14" r="3" fill="#207448" />
    <circle cx="28" cy="44" r="3" fill="#207448" />
  </g>
  <text x="160" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Decision tree</text>

  
  <path d="M 370 143 L 440 143 L 440 170" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 370 143 L 1150 143 L 1150 170" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="90" y="170" width="690" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(115, 190)">
    
    <path d="M 28 6 L 48 14 L 48 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 L 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 18 27 L 25 34 L 38 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="190" y="222" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="190" dy="0">Request failed before the first token: user has</tspan>
    <tspan x="190" dy="32">seen nothing, safe to send to another replica</tspan>
  </text>

  
  <rect x="800" y="170" width="710" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(825, 190)">
    
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="14" y1="14" x2="42" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="900" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="900" dy="0">Stream failed after tokens were sent: not safe to</tspan>
    <tspan x="900" dy="32">retry unless the platform can resume; the user</tspan>
    <tspan x="900" dy="32">who read half an answer would see it restart</tspan>
  </text>


  
  <rect x="60" y="365" width="1480" height="555" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(90, 385)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    
    <rect x="14" y="24" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 20 24 L 20 16 C 20 11.5 23.5 8 28 8 C 32.5 8 36 11.5 36 16 L 36 24" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="160" y="423" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Guards</text>

  
  <rect x="90" y="455" width="690" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(115, 475)">
    
    <path d="M 28 8 L 28 46 M 14 46 L 42 46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 12 18 L 44 18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 12 18 L 6 30 L 18 30 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <path d="M 44 18 L 38 30 L 50 30 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  </g>
  <text x="190" y="485" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="190" dy="0">retry budget caps retries at a fraction of normal</tspan>
    <tspan x="190" dy="28">traffic, for example 10 percent (rule of thumb,</tspan>
    <tspan x="190" dy="28">not a Nebius number), per client and per hop;</tspan>
    <tspan x="190" dy="28">retry only errors that are safe and likely</tspan>
    <tspan x="190" dy="28">transient; jittered backoff; retries in one</tspan>
    <tspan x="190" dy="28">layer only</tspan>
  </text>

  
  <rect x="800" y="455" width="710" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(825, 475)">
    
    <rect x="8" y="14" width="40" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="28" x2="34" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="14" x2="16" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="14" x2="40" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="900" y="535" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="900" dy="0">Router sheds with 429 and Retry-After</tspan>
    <tspan x="900" dy="34">when queues are full</tspan>
  </text>

  
  <rect x="90" y="685" width="690" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(115, 705)">
    
    <circle cx="14" cy="38" r="5" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="42" cy="38" r="5" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 16 34 L 36 14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="6" y1="38" x2="9" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="47" y1="38" x2="50" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="190" y="720" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="190" dy="0">Circuit breaker: stop sending to a component</tspan>
    <tspan x="190" dy="30">that keeps failing, try again after a short wait;</tspan>
    <tspan x="190" dy="30">eject a failing replica briefly and let the router</tspan>
    <tspan x="190" dy="30">try others; cap ejections to a set share so</tspan>
    <tspan x="190" dy="30">capacity does not vanish</tspan>
  </text>

  
  <rect x="800" y="685" width="710" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(825, 705)">
    
    <rect x="8" y="10" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 28 L 20 28 L 24 18 L 30 38 L 34 28 L 42 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="900" y="718" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="900" dy="0">Probes need care: aggressive liveness probes</tspan>
    <tspan x="900" dy="28">restarted healthy workers that sometimes did not</tspan>
    <tspan x="900" dy="28">rejoin the pool and capacity shrank silently;</tspan>
    <tspan x="900" dy="28">a busy engine may answer a health check slowly;</tspan>
    <tspan x="900" dy="28">keep probes lenient; alert on ready versus</tspan>
    <tspan x="900" dy="28">desired replicas</tspan>
  </text>


  
  
  <rect x="60" y="945" width="1480" height="185" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(90, 965)">
    
    <path d="M 28 6 L 50 46 L 6 46 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="39" r="2.5" fill="#db8129" />
  </g>
  <text x="160" y="1003" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Scenario numbers</text>

  
  <text x="90" y="1055" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">pool loses two of ten replicas, error rate 5 percent, three retries with no backoff: load about</tspan>
    <tspan x="90" dy="36">1.15 times at once and growing as timeouts trigger more retries</tspan>
  </text>

</svg>