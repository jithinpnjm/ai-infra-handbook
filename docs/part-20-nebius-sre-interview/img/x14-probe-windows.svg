<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <title>Startup, readiness and liveness probes cover different windows of an engine's life</title>
  <desc>Visual infographic showing how startup, readiness, and liveness probes cover distinct operational windows of an engine's lifecycle.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="60" y="75" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Startup, readiness and liveness probes</text>
  <text x="60" y="132" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">cover different windows of an engine's life</text>

  
  <g id="time-axis">
    <rect x="60" y="170" width="1480" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 186)">
      <circle cx="24" cy="24" r="22" fill="#ffffff" stroke="#207448" stroke-width="3.5"/>
      <path d="M 24 12 L 24 24 L 33 24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    
    <text x="155" y="221" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Pod life in seconds from start</text>
    
    
    <line x1="580" y1="210" x2="1500" y2="210" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  
  <line x1="840" y1="250" x2="840" y2="990" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  
  <g id="lane-startup">
    <rect x="60" y="275" width="1480" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="75" y="290" width="240" height="195" rx="10" fill="#e8f1ea"/>
    
    <g transform="translate(165, 315)">
      <circle cx="30" cy="30" r="26" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <path d="M 30 14 L 30 30 M 20 20 A 16 16 0 1 0 40 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="195" y="420" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">Startup probe</text>

    
    <rect x="335" y="295" width="495" height="70" rx="10" fill="#207448"/>
    <text x="582" y="340" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">load and compile</text>

    
    <rect x="335" y="380" width="495" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="355" y="418" font-family="monospace" font-size="24px" fill="#303a36">failureThreshold 60 times</text>
    <text x="355" y="455" font-family="monospace" font-size="24px" fill="#303a36">periodSeconds 10 equals 600 s</text>

    
    <rect x="850" y="318" width="665" height="25" rx="5" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 6"/>

    
    <rect x="860" y="365" width="650" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="1185" y="402" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448" text-anchor="middle">its length must be at least</text>
    <text x="1185" y="434" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448" text-anchor="middle">the measured cold start</text>
  </g>

  
  <g id="lane-readiness">
    <rect x="60" y="525" width="1480" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="75" y="540" width="240" height="195" rx="10" fill="#e8f1ea"/>
    
    <g transform="translate(165, 565)">
      <circle cx="30" cy="30" r="26" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <path d="M 18 30 L 26 38 L 42 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="195" y="670" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">Readiness probe</text>

    
    <rect x="335" y="618" width="485" height="25" rx="5" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 6"/>

    
    <rect x="840" y="540" width="460" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1070" y="572" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">when the startup probe succeeds</text>

    
    <rect x="840" y="598" width="675" height="66" rx="10" fill="#207448"/>
    <text x="1177" y="640" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">can complete a real one-token request</text>

    
    <rect x="840" y="677" width="675" height="48" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="1177" y="709" font-family="monospace" font-size="24px" fill="#303a36" text-anchor="middle">periodSeconds 5 and failureThreshold 2</text>
  </g>

  
  <g id="lane-liveness">
    <rect x="60" y="775" width="1480" height="225" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <rect x="75" y="790" width="240" height="195" rx="10" fill="#e8f1ea"/>
    
    <g transform="translate(165, 810)">
      <path d="M 30 6 C 48 6 54 12 54 26 C 54 44 30 54 30 54 C 30 54 6 44 6 26 C 6 12 12 6 30 6 Z" fill="#ffffff" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <text x="195" y="920" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448" text-anchor="middle">Liveness probe</text>

    
    <rect x="335" y="865" width="280" height="25" rx="5" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 6"/>

    
    <rect x="840" y="790" width="390" height="48" rx="8" fill="#207448"/>
    <line x1="860" y1="814" x2="1205" y2="814" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8"/>

    
    <rect x="640" y="850" width="590" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="878" font-family="monospace" font-size="24px" fill="#303a36" text-anchor="middle">periodSeconds 10, timeoutSeconds 5,</text>
    <text x="935" y="906" font-family="monospace" font-size="24px" fill="#303a36" text-anchor="middle">failureThreshold 6</text>

    
    <rect x="640" y="928" width="590" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="935" y="961" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">cheap and local, generous tolerance</text>

    
    <rect x="1255" y="790" width="265" height="195" rx="12" fill="#fdf5ee" stroke="#db8129" stroke-width="2.5"/>
    
    
    <g transform="translate(1363, 808)">
      <circle cx="25" cy="25" r="22" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
      <path d="M 25 11 A 14 14 0 1 1 14 20" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="10,12 21,19 12,25" fill="#db8129"/>
    </g>
    
    <text x="1387" y="895" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">restart is the</text>
    <text x="1387" y="930" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">costliest action</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="1025" width="1480" height="100" rx="12" fill="#207448"/>
    <text x="800" y="1063" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff" text-anchor="middle">Make readiness mean can complete a real request, keep liveness local and tolerant,</text>
    <text x="800" y="1101" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#ffffff" text-anchor="middle">and size the startup probe to your measured cold start.</text>
  </g>
</svg>