<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Start-up phases and the remedy that attacks each one</title>
  <desc>Visual infographic explaining the six start-up phases of model serving and the remedy attacking each phase.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Start-up phases and the remedy that attacks each one</text>
  
  <g id="box-1">
    <rect id="outer-1" x="40" y="80" width="480" height="405" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="90" cy="128" r="24" fill="#207448" />
    <text x="90" y="137" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(440, 100)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="16" width="48" height="36" rx="4" />
      <path d="M 28 4 L 28 32 M 18 22 L 28 32 L 38 22" />
    </g>
    <rect id="remedy-1" x="56" y="255" width="448" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" y="128" font-size="30" font-weight="bold" fill="#207448">Pull image </tspan>
      <tspan x="280" y="154">(vLLM v0.32.0 amd64 </tspan>
      <tspan x="280" y="180">image is about 9.2 GB on </tspan>
      <tspan x="280" y="206">Docker Hub, not under 5 GB </tspan>
      <tspan x="280" y="232">as the book says): </tspan>
      <tspan x="280" y="295">pin the tag or digest and </tspan>
      <tspan x="280" y="333">use <tspan font-family="monospace">IfNotPresent</tspan> so a node </tspan>
      <tspan x="280" y="371">that has the image does not </tspan>
      <tspan x="280" y="409">pull again; pre-pull</tspan>
    </text>
  </g>
  
  <g id="box-2">
    <rect id="outer-2" x="560" y="80" width="480" height="405" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="610" cy="128" r="24" fill="#207448" />
    <text x="610" y="137" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(960, 100)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 16 C 8 10 48 10 48 16 C 48 22 8 22 8 16 Z" />
      <path d="M 8 16 L 8 40 C 8 46 48 46 48 40 L 48 16" />
      <path d="M 8 28 C 8 34 48 34 48 28" />
    </g>
    <rect id="remedy-2" x="576" y="255" width="448" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" y="175" font-size="30" font-weight="bold" fill="#207448">Fetch and mount model: </tspan>
      <tspan x="800" y="295">weights on a PVC, an OCI </tspan>
      <tspan x="800" y="333">image or node-local NVMe </tspan>
      <tspan x="800" y="371">instead of downloading from </tspan>
      <tspan x="800" y="409">Hugging Face on every start</tspan>
    </text>
  </g>
  
  <g id="box-3">
    <rect id="outer-3" x="1080" y="80" width="480" height="405" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1130" cy="128" r="24" fill="#207448" />
    <text x="1130" y="137" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(1480, 100)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="11" />
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 14 L 42 18" />
    </g>
    <rect id="remedy-3" x="1096" y="255" width="448" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" y="175" font-size="30" font-weight="bold" fill="#207448">Start runtime: </tspan>
      <tspan x="1320" y="338">a second or less </tspan>
      <tspan x="1320" y="376">per the book</tspan>
    </text>
  </g>
  
  <g id="box-4">
    <rect id="outer-4" x="40" y="525" width="480" height="440" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <circle cx="90" cy="573" r="24" fill="#db8129" />
    <text x="90" y="582" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(440, 545)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4" />
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea" />
      <line x1="18" y1="6" x2="18" y2="12" /><line x1="28" y1="6" x2="28" y2="12" /><line x1="38" y1="6" x2="38" y2="12" />
      <line x1="18" y1="44" x2="18" y2="50" /><line x1="28" y1="44" x2="28" y2="50" /><line x1="38" y1="44" x2="38" y2="50" />
      <line x1="6" y1="18" x2="12" y2="18" /><line x1="6" y1="28" x2="12" y2="28" /><line x1="6" y1="38" x2="12" y2="38" />
      <line x1="44" y1="18" x2="50" y2="18" /><line x1="44" y1="28" x2="50" y2="28" /><line x1="44" y1="38" x2="50" y2="38" />
    </g>
    <rect id="remedy-4" x="56" y="690" width="448" height="255" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" y="620" font-size="30" font-weight="bold" fill="#db8129">Load weights to GPU: </tspan>
      <tspan x="280" y="728">bounded by I/O into GPU </tspan>
      <tspan x="280" y="762">memory; faster loader such </tspan>
      <tspan x="280" y="796">as Run:ai Model Streamer </tspan>
      <tspan x="280" y="830">with <tspan font-family="monospace">--load-format</tspan> </tspan>
      <tspan x="280" y="864" font-family="monospace">runai_streamer, </tspan>
      <tspan x="280" y="898">no repackaging</tspan>
    </text>
  </g>
  
  <g id="box-5">
    <rect id="outer-5" x="560" y="525" width="480" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="610" cy="573" r="24" fill="#207448" />
    <text x="610" y="582" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(960, 545)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" />
      <line x1="24" y1="2" x2="32" y2="2" />
    </g>
    <rect id="remedy-5" x="576" y="690" width="448" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" y="573" font-size="30" font-weight="bold" fill="#207448">Warm-up: </tspan>
      <tspan x="800" y="601">allocate KV pool, profile, </tspan>
      <tspan x="800" y="629">compile and capture </tspan>
      <tspan x="800" y="657">CUDA graphs: </tspan>
      <tspan x="800" y="728">reuse the <tspan font-family="monospace">torch.compile</tspan> </tspan>
      <tspan x="800" y="758">cache under <tspan font-family="monospace">VLLM_CACHE_ROOT,</tspan></tspan>
      <tspan x="800" y="788">set <tspan font-family="monospace">VLLM_FORCE_AOT_LOAD=1</tspan> </tspan>
      <tspan x="800" y="818">to fail loudly on a </tspan>
      <tspan x="800" y="848">cache miss, pass </tspan>
      <tspan x="800" y="878" font-family="monospace">--kv-cache-memory </tspan>
      <tspan x="800" y="908">to skip profiling</tspan>
    </text>
  </g>
  
  <g id="box-6">
    <rect id="outer-6" x="1080" y="525" width="480" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1130" cy="573" r="24" fill="#207448" />
    <text x="1130" y="582" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    <g transform="translate(1480, 545)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="10,28 18,28 23,16 29,40 34,24 38,28 46,28" />
    </g>
    <rect id="remedy-6" x="1096" y="690" width="448" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" y="620" font-size="30" font-weight="bold" fill="#207448">API opens: </tspan>
      <tspan x="1320" y="820" font-family="monospace">/health 200</tspan>
    </text>
  </g>
  
  <g id="footer">
    <rect id="footer-rect" x="40" y="1005" width="1520" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" y="1043">book says these together can cut scale-up from many minutes </tspan>
      <tspan x="800" y="1073">to tens of seconds depending on model size; <tspan font-family="monospace">--enforce-eager</tspan> and </tspan>
      <tspan x="800" y="1103"><tspan font-family="monospace">-O0</tspan> make boot fast but decode slower, use them in development only; </tspan>
      <tspan x="800" y="1133">most time goes to model download and weight load; measure each phase on your own cluster</tspan>
    </text>
  </g>
</svg>