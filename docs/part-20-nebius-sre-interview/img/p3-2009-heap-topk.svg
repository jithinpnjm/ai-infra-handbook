<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" style="background:#f5f8f5; font-family:sans-serif;">
  <title>Top k with a min-heap of size k: the root is the weakest member</title>
  <desc>Visual explanation of finding the top k slowest items using a bounded min-heap of size k.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <text x="800" y="56" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">
    Top k with a min-heap of size k: the root is the weakest member
  </text>

  
  
  <rect x="40" y="110" width="370" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(60, 130)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 28 L 38 28 M 30 20 L 38 28 L 30 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="166" font-size="28" font-weight="bold" fill="#207448">stream</text>

  
  <rect x="60" y="220" width="330" height="74" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(74, 232)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="90" y="33" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">endpoint, ms</text>
  </g>
  <g transform="translate(268, 232)">
    <rect x="0" y="0" width="110" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
    <text x="55" y="33" text-anchor="middle" font-size="24" fill="#303a36">...</text>
  </g>

  
  <rect x="60" y="324" width="330" height="116" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="76" y="362" font-size="24" fill="#303a36">
    <tspan x="76" dy="0">first k samples: heappush</tspan>
    <tspan x="76" dy="34">until the heap has k items</tspan>
  </text>

  
  <rect x="60" y="460" width="330" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="76" y="496" font-size="24" fill="#303a36">
    <tspan x="76" dy="0">tuples are (ms, endpoint)</tspan>
    <tspan x="76" dy="34">so the root is the</tspan>
    <tspan x="76" dy="34">smallest ms</tspan>
  </text>

  
  <path d="M 410 257 L 460 257" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <g transform="translate(466, 157)">
    <polygon points="140,0 280,100 140,200 0,100" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="140" y="82">Is the new sample</tspan>
      <tspan x="140" y="114">slower than</tspan>
      <tspan x="140" y="146">the root?</tspan>
    </text>
  </g>

  
  <path d="M 606 357 L 606 480" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  <rect x="470" y="396" width="270" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="605" y="428" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">no: ignored at once</text>

  
  <g transform="translate(578, 492)">
    <rect x="0" y="10" width="56" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="-6" y1="10" x2="62" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="2" x2="38" y2="2" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="22" x2="18" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="22" x2="28" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="22" x2="38" y2="48" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <path d="M 746 257 L 910 257" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="746" y="118" width="158" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="756" y="146" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="756" dy="0">yes:</tspan>
    <tspan x="756" dy="28">heapreplace,</tspan>
    <tspan x="756" dy="28">the root leaves</tspan>
    <tspan x="756" dy="28">and the new</tspan>
    <tspan x="756" dy="28">sample enters</tspan>
  </text>

  
  <rect x="918" y="110" width="374" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1105" y="152" text-anchor="middle" font-size="28" font-weight="bold" fill="#207448">min-heap of size k (k = 10)</text>

  
  
  <line x1="1105" y1="300" x2="1000" y2="390" stroke="#207448" stroke-width="4" />
  <line x1="1105" y1="300" x2="1210" y2="390" stroke="#207448" stroke-width="4" />
  <line x1="1000" y1="440" x2="960" y2="500" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <line x1="1000" y1="440" x2="1040" y2="500" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <line x1="1210" y1="440" x2="1170" y2="500" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <line x1="1210" y1="440" x2="1250" y2="500" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />

  
  <rect x="936" y="176" width="338" height="142" rx="14" fill="#db8129" stroke="#db8129" stroke-width="2" />
  <text x="1105" y="210" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="1105" dy="0">root = the fastest of the</tspan>
    <tspan x="1105" dy="32">current top k,</tspan>
    <tspan x="1105" dy="32">the weakest member</tspan>
  </text>

  
  <circle cx="1000" cy="415" r="32" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1000" y="423" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">#2</text>

  
  <circle cx="1210" cy="415" r="32" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1210" y="423" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">#3</text>

  
  <circle cx="960" cy="524" r="22" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1040" cy="524" r="22" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1170" cy="524" r="22" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1250" cy="524" r="22" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1105" y="574" text-anchor="middle" font-size="24" fill="#207448">... up to k items ...</text>

  
  <path d="M 1292 257 L 1332 257" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1340" y="110" width="220" height="490" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1422, 140)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 18 28 L 26 36 L 40 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect x="1356" y="210" width="188" height="370" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1450" y="254" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1450" dy="0">At the end the</tspan>
    <tspan x="1450" dy="36">heap holds the</tspan>
    <tspan x="1450" dy="36">k slowest,</tspan>
    <tspan x="1450" dy="36">sort those k</tspan>
    <tspan x="1450" dy="36">and print</tspan>
    <tspan x="1450" dy="36">slowest first</tspan>
  </text>

  
  <rect x="40" y="630" width="1520" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="660" width="670" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <g transform="translate(100, 685)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="24,12 24,24 32,24" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="160" y="746" font-size="30" font-weight="bold" fill="#207448">
    Cost: O(n log k) time, O(k) memory
  </text>

  
  <circle cx="800" cy="735" r="32" fill="#207448" />
  <text x="800" y="744" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">vs</text>

  
  <rect x="860" y="660" width="670" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(890, 685)">
    <rect x="6" y="8" width="36" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="14" y1="18" x2="34" y2="18" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="26" x2="28" y2="26" stroke="#207448" stroke-width="3" />
  </g>
  <text x="950" y="746" font-size="28" font-weight="bold" fill="#303a36">
    sort everything: O(n log n) and holds everything
  </text>

  
  <rect x="70" y="836" width="1460" height="214" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="100" y="884" font-size="26" fill="#303a36">
    <tspan x="100" dy="0">Measured, k = 10: heap 0.0045 s for 100,000 samples and 0.0185 s for 400,000;</tspan>
    <tspan x="100" dy="46">sort and slice 0.0154 s and 0.0735 s.</tspan>
    <tspan x="100" dy="46" font-weight="bold" fill="#207448">Honest claim: the memory, not a dramatic speedup.</tspan>
  </text>
</svg>