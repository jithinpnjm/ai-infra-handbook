<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Scenario A: Rolling Update State Trace with 8 Replicas and 1 Spare GPU</title>
  <desc>Timeline state trace diagram depicting 8 replicas on 1-GPU pods with 1 spare GPU slot under different Deployment strategies.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Scenario A: Rolling Update State Trace</text>
  <text x="800" y="115" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">with 8 Replicas and 1 Spare GPU</text>

  
  <g id="box1">
    <rect x="60" y="150" width="1480" height="525" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(90, 175)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="4" y="4" width="44" height="44" rx="8"/>
      <circle cx="26" cy="26" r="10"/>
      <line x1="26" y1="4" x2="26" y2="10"/>
      <line x1="26" y1="42" x2="26" y2="48"/>
      <line x1="4" y1="26" x2="10" y2="26"/>
      <line x1="42" y1="26" x2="48" y2="26"/>
    </g>

    
    <text x="160" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Strategy: maxSurge=1, maxUnavailable=0 (Recommended)</text>

    
    <rect x="160" y="222" width="350" height="38" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="180" y="249" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Pod Cap = 9, Floor = 8</text>

    
    <rect x="90" y="280" width="445" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="132" cy="324" r="22" fill="#207448"/>
    <text x="132" y="332" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="115" y="385" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="115" dy="0">Step 1: Pod 9 (v2) launches</tspan>
      <tspan x="115" dy="38">in spare slot, status Loading</tspan>
      <tspan x="115" dy="38">(ticks 1-4). Available = 8</tspan>
      <tspan x="115" dy="38">v1 pods.</tspan>
    </text>

    
    <line x1="540" y1="460" x2="570" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="578" y="280" width="445" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="620" cy="324" r="22" fill="#207448"/>
    <text x="620" y="332" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="603" y="380" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="603" dy="0">Step 2: Pod 9 passes readiness</tspan>
      <tspan x="603" dy="36">probe at tick 4. Controller</tspan>
      <tspan x="603" dy="36">issues SIGTERM to Pod 1 (v1).</tspan>
      <tspan x="603" dy="36">Pod 1 slot becomes free.</tspan>
      <tspan x="603" dy="36">Available = 8 (7 v1 + 1 v2).</tspan>
    </text>

    
    <line x1="1028" y1="460" x2="1058" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="1065" y="280" width="445" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1107" cy="324" r="22" fill="#207448"/>
    <text x="1107" y="332" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="1090" y="385" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1090" dy="0">Step 3: Pod 10 (v2) schedules</tspan>
      <tspan x="1090" dy="38">into vacated slot. Repeats</tspan>
      <tspan x="1090" dy="38">across 33 ticks. Available</tspan>
      <tspan x="1090" dy="38">pods never drop below 8.</tspan>
    </text>
  </g>

  
  <g id="box2">
    <rect x="60" y="705" width="715" height="425" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>

    
    <g transform="translate(90, 735)" stroke="#db8129" stroke-width="3.5" fill="none">
      <path d="M 26 4 L 46 12 L 46 26 C 46 38 26 48 26 48 C 26 48 6 38 6 26 L 6 12 Z"/>
      <line x1="26" y1="18" x2="26" y2="28"/>
      <circle cx="26" cy="36" r="2" fill="#db8129"/>
    </g>

    
    <text x="155" y="756" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
      <tspan x="155" dy="0">Trap: maxSurge=1, maxUnavailable=0</tspan>
      <tspan x="155" dy="36">with 0 Spare GPUs</tspan>
    </text>

    
    <rect x="90" y="845" width="655" height="255" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="1.5"/>
    <text x="120" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="120" dy="0">New Pod 9 stays Pending indefinitely.</tspan>
      <tspan x="120" dy="42">Availability remains 8, but rollout hangs</tspan>
      <tspan x="120" dy="42">until ProgressDeadlineExceeded triggers.</tspan>
    </text>
  </g>

  
  <g id="box3">
    <rect x="825" y="705" width="715" height="425" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(855, 735)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="26" cy="26" r="22"/>
      <polyline points="26,12 26,26 36,26"/>
    </g>

    
    <text x="920" y="756" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="920" dy="0">Alternative: maxSurge=0,</tspan>
      <tspan x="920" dy="36">maxUnavailable=1 with 0 Spare GPUs</tspan>
    </text>

    
    <rect x="855" y="845" width="655" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="885" y="905" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="885" dy="0">Terminates Pod 1 first; availability</tspan>
      <tspan x="885" dy="42">drops to 7 of 8 (violates SLA floor if</tspan>
      <tspan x="885" dy="42">headroom absent); finishes in 33 ticks.</tspan>
    </text>
  </g>
</svg>