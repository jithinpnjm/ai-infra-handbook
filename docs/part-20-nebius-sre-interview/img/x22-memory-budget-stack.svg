<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From one 80 GB card to about 389,100 tokens of KV cache</title>
  <desc>Visual infographic showing GPU memory allocation on an H100 80 GB card and the arithmetic to calculate KV cache tokens and request capacities.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0,3 16,9 0,15" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">From one 80 GB card</tspan>
    <tspan x="800" dy="58">to about 389,100 tokens of KV cache</tspan>
  </text>

  

  
  <rect x="60" y="145" width="360" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="240" y="181" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">One H100, 80 GB</text>

  
  <rect x="60" y="210" width="360" height="800" rx="12" fill="none" stroke="#207448" stroke-width="3"/>

  
  <path d="M 60 222 A 12 12 0 0 1 72 210 L 408 210 A 12 12 0 0 1 420 222 L 420 290 L 60 290 Z" fill="#ffffff" stroke="#7a8c82" stroke-width="2" stroke-dasharray="8 6"/>

  
  <rect x="60" y="290" width="360" height="170" fill="#e6ebe8" stroke="#7a8c82" stroke-width="2"/>
  <text x="240" y="362" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="240" dy="0">Weights,</tspan>
    <tspan x="240" dy="34">Llama 3.1 8B: 16 GB</tspan>
  </text>

  
  <rect x="60" y="460" width="360" height="100" fill="#e6ebe8" stroke="#7a8c82" stroke-width="2"/>
  <text x="240" y="498" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Overhead: 5 GB</text>
  <text x="240" y="534" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">planning assumption</text>

  
  <path d="M 60 560 L 420 560 L 420 998 A 12 12 0 0 1 408 1010 L 72 1010 A 12 12 0 0 1 60 998 Z" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="240" y="770" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="240" dy="0">Left for KV cache:</tspan>
    <tspan x="240" dy="44">51 GB</tspan>
  </text>

  

  
  <path d="M 430 215 Q 442 215 442 225 L 442 240 Q 442 250 454 250 Q 442 250 442 260 L 442 275 Q 442 285 430 285" fill="none" stroke="#7a8c82" stroke-width="2.5"/>
  <text x="470" y="244" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="470" dy="0">Left free by</tspan>
    <tspan x="470" dy="32" font-family="monospace">gpu_memory_utilization 0.90</tspan>
  </text>

  
  <path d="M 430 298 Q 442 298 442 312 L 442 636 Q 442 650 454 650 Q 442 650 442 664 L 442 988 Q 442 1002 430 1002" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="470" y="658" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">80 x 0.90 = 72 GB</text>

  

  
  <g id="box-1">
    <rect x="910" y="170" width="640" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(935, 192)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="4"/>
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#e8f1ea"/>
      <line x1="20" y1="4" x2="20" y2="12"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="36" y1="4" x2="36" y2="12"/>
      <line x1="20" y1="44" x2="20" y2="52"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="36" y1="44" x2="36" y2="52"/>
      <line x1="4" y1="20" x2="12" y2="20"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="4" y1="36" x2="12" y2="36"/>
      <line x1="44" y1="20" x2="52" y2="20"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="44" y1="36" x2="52" y2="36"/>
    </g>

    <text x="1015" y="228" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">KV bytes per token</text>

    
    <rect x="928" y="272" width="604" height="58" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
    <text x="1230" y="308" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">2 x 32 x 8 x 128 x 2 = 131,072 bytes</text>
  </g>

  
  <line x1="1230" y1="350" x2="1230" y2="395" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="box-2">
    <rect x="910" y="395" width="640" height="180" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>

    
    <g transform="translate(935, 417)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8"/>
      <path d="M 6 14 V 38 A 22 8 0 0 0 50 38 V 14"/>
      <path d="M 6 26 A 22 8 0 0 0 50 26"/>
      <path d="M 6 38 A 22 8 0 0 0 50 38"/>
    </g>

    <text x="1015" y="453" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Tokens that fit</text>

    
    <rect x="928" y="497" width="604" height="58" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
    <text x="1230" y="533" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">51e9 / 131,072 = about 389,100</text>
  </g>

  
  <line x1="1230" y1="575" x2="1230" y2="620" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="box-3">
    <rect x="910" y="620" width="640" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(935, 638)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="5"/>
      <line x1="6" y1="20" x2="50" y2="20" stroke-width="3"/>
      <circle cx="14" cy="14" r="2.5" fill="#207448"/>
      <circle cx="22" cy="14" r="2.5" fill="#207448"/>
      <circle cx="30" cy="14" r="2.5" fill="#207448"/>
    </g>

    <text x="1015" y="656" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1015" dy="0">Full-length requests</tspan>
      <tspan x="1015" dy="34">at 16,384 tokens</tspan>
    </text>

    
    <rect x="928" y="722" width="604" height="58" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
    <text x="1230" y="758" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">389,100 / 16,384 = about 23.7</text>
  </g>

  
  <line x1="1230" y1="800" x2="1230" y2="845" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="box-4">
    <rect x="910" y="845" width="640" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(935, 863)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28 14 28 28 38 28"/>
    </g>

    <text x="1015" y="881" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1015" dy="0">Average length</tspan>
      <tspan x="1015" dy="34">when 128 requests run</tspan>
    </text>

    
    <rect x="928" y="947" width="604" height="58" rx="8" fill="#e8f1ea" stroke="#cfded2" stroke-width="1.5"/>
    <text x="1230" y="983" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">389,100 / 128 = about 3,040 tokens</text>
  </g>

  
  <rect x="40" y="1055" width="1520" height="95" rx="14" fill="#207448"/>
  <text x="800" y="1095" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">Size the cache first, then set the sequence cap</tspan>
    <tspan x="800" dy="34">and the length limit so that your real average request fits.</tspan>
  </text>
</svg>