<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Two HPA syncs: the ratio doubles, then the not-ready rule stops a runaway</title>
  <desc>Visual infographic comparing two Horizontal Pod Autoscaler sync cycles, showing how an initial scale-up ratio is stabilized by the not-ready pod rule.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Two HPA syncs: the ratio doubles, </tspan>
    <tspan x="800" dy="58">then the not-ready rule stops a runaway</tspan>
  </text>

  
  
  <rect x="40" y="155" width="670" height="845" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <path d="M 40 171 Q 40 155 56 155 L 694 155 Q 710 155 710 171 L 710 235 L 40 235 Z" fill="#e8f1ea"/>
  <line x1="40" y1="235" x2="710" y2="235" stroke="#207448" stroke-width="2"/>

  
  
  <circle cx="88" cy="195" r="24" fill="#207448"/>
  <text x="88" y="205" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

  
  <g transform="translate(130, 171)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="21"/>
    <circle cx="24" cy="24" r="2.5" fill="#207448"/>
    <polyline points="24,11 24,24 34,24"/>
  </g>

  
  <text x="194" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Sync 1 at 0 s</text>

  
  <g id="left-box-1">
    <rect x="65" y="260" width="620" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="375" y="302" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ready replicas: 4</text>
    <text x="375" y="342" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">each holds 22 in-flight requests</text>
  </g>

  
  <line x1="375" y1="365" x2="375" y2="405" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="left-box-2">
    <rect x="65" y="405" width="620" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="375" y="461" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Target: 11 per replica</text>
  </g>

  
  <line x1="375" y1="495" x2="375" y2="535" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="left-box-3">
    <rect x="65" y="535" width="620" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="375" y="591" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">Ratio: 22 / 11 = 2.0</text>
  </g>

  
  <line x1="375" y1="625" x2="375" y2="670" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="left-box-4">
    <rect x="65" y="670" width="620" height="105" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    <text x="375" y="733" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">desiredReplicas = ceil(4 x 2.0) = 8</text>
  </g>

  
  <line x1="375" y1="775" x2="375" y2="825" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="left-box-5">
    <rect x="65" y="825" width="620" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="375" y="896" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Scale up from 4 to 8</text>
  </g>

  
  <g id="horizontal-transition">
    <line x1="710" y1="195" x2="890" y2="195" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>
    <text x="800" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">waits 15 s</text>
  </g>

  
  
  <rect x="890" y="155" width="670" height="845" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <path d="M 890 171 Q 890 155 906 155 L 1544 155 Q 1560 155 1560 171 L 1560 235 L 890 235 Z" fill="#e8f1ea"/>
  <line x1="890" y1="235" x2="1560" y2="235" stroke="#207448" stroke-width="2"/>

  
  
  <circle cx="938" cy="195" r="24" fill="#207448"/>
  <text x="938" y="205" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

  
  <g transform="translate(980, 171)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="21"/>
    <circle cx="24" cy="24" r="2.5" fill="#207448"/>
    <polyline points="24,11 24,24 34,24"/>
  </g>

  
  <text x="1044" y="206" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Sync 2 at 15 s</text>

  
  <g id="right-box-1">
    <rect x="915" y="260" width="620" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1225" y="298" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1225" dy="0">Ready replicas: 4, plus 4 new </tspan>
      <tspan x="1225" dy="34">pods still loading weights</tspan>
    </text>
  </g>

  
  <line x1="1225" y1="355" x2="1225" y2="385" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="right-box-2">
    <rect x="915" y="385" width="620" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1225" y="435" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">In-flight requests: 88</text>
  </g>

  
  <line x1="1225" y1="465" x2="1225" y2="495" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="right-box-3">
    <rect x="915" y="495" width="620" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1225" y="535" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1225" dy="0">Not-ready pods count as </tspan>
      <tspan x="1225" dy="34">0 percent of target</tspan>
    </text>
  </g>

  
  <line x1="1225" y1="590" x2="1225" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="right-box-4">
    <rect x="915" y="625" width="620" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1225" y="675" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Average: 88 / 8 pods = 11</text>
  </g>

  
  <line x1="1225" y1="705" x2="1225" y2="740" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="right-box-5">
    <rect x="915" y="740" width="620" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1225" y="790" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Ratio: 11 / 11 = 1.0</text>
  </g>

  
  <line x1="1225" y1="820" x2="1225" y2="855" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="right-box-6">
    <rect x="915" y="855" width="620" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="1225" y="913" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Within tolerance, no change</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="1035" width="1480" height="70" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="1079" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Every step is bounded, and the bound keeps the burst from turning into a runaway.</text>
  </g>
</svg>