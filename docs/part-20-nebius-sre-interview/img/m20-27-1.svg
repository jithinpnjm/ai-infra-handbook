<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Incident roles: one person decides, one person changes things, one per</title>
  <desc>Flowchart depicting incident response roles including the incident commander, operations lead, communications lead, planning lead, and the shared incident document.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Incident roles: one person decides,</tspan>
    <tspan x="800" dy="56">one person changes things, one per</tspan>
  </text>

  
  <g id="node-ic">
    <rect x="510" y="175" width="580" height="200" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <path d="M 776,203 h 48 c 14,0 24,10 24,24 c 0,26 -24,46 -48,56 c -24,-10 -48,-30 -48,-56 c 0,-14 10,-24 24,-24 z" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" fill="none" />
    <path d="M 800,217 l 4,11 l 12,1 l -9,8 l 3,12 l -10,-6 l -10,6 l 3,-12 l -9,-8 l 12,-1 z" stroke="#db8129" stroke-width="2.5" stroke-linejoin="round" fill="none" />
    
    <text x="800" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="800" dy="0" font-size="32" font-weight="bold">Incident commander:</tspan>
      <tspan x="800" dy="40" font-size="26" font-weight="normal">state, roles, decisions</tspan>
    </text>
  </g>

  
  <g id="node-ops">
    <rect x="75" y="465" width="450" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="300" cy="516" r="10" stroke="#207448" stroke-width="3.5" fill="none" />
    <circle cx="300" cy="516" r="18" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 300,494 v 4 M 300,534 v 4 M 278,516 h 4 M 318,516 h 4 M 284,500 l 3,3 M 313,529 l 3,3 M 284,532 l 3,-3 M 313,503 l 3,-3" stroke="#207448" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <text x="300" y="578" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="300" dy="0" font-size="30" font-weight="bold">Operations lead:</tspan>
      <tspan x="300" dy="38" font-size="24" font-weight="normal">the only one</tspan>
      <tspan x="300" dy="32" font-size="24" font-weight="normal">changing the system</tspan>
    </text>
  </g>

  
  <g id="node-com">
    <rect x="575" y="465" width="450" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 788,506 l 24,-12 v 40 l -24,-12 h -8 v -16 h 8 z" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" fill="none" />
    <path d="M 792,522 v 10 c 0,2 -2,4 -4,4" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 818,508 c 5,4 5,12 0,16" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 825,502 c 9,8 9,20 0,28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <text x="800" y="578" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="800" dy="0" font-size="30" font-weight="bold">Communications lead:</tspan>
      <tspan x="800" dy="38" font-size="24" font-weight="normal">updates on a</tspan>
      <tspan x="800" dy="32" font-size="24" font-weight="normal">fixed cadence</tspan>
    </text>
  </g>

  
  <g id="node-plan">
    <rect x="1075" y="465" width="450" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1282" y="493" width="36" height="48" rx="4" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 1294,493 v -4 c 0,-2 2,-4 4,-4 h 4 c 2,0 4,2 4,4 v 4" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none" />
    <line x1="1290" y1="509" x2="1310" y2="509" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="1290" y1="519" x2="1310" y2="519" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="1290" y1="529" x2="1304" y2="529" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="1300" y="578" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="1300" dy="0" font-size="30" font-weight="bold">Planning:</tspan>
      <tspan x="1300" dy="38" font-size="24" font-weight="normal">bugs, handoff,</tspan>
      <tspan x="1300" dy="32" font-size="24" font-weight="normal">revert list</tspan>
    </text>
  </g>

  
  <g id="node-doc">
    <rect x="510" y="775" width="580" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 782,799 h 22 l 14,14 v 35 h -36 z" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" fill="none" />
    <path d="M 804,799 v 14 h 14" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" fill="none" />
    <line x1="790" y1="825" x2="810" y2="825" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="790" y1="835" x2="806" y2="835" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="800" y="895" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Shared incident document</text>
  </g>

  
   OPS -->
  <path d="M 580,375 C 580,430 300,410 300,465" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

   COM -->
  <path d="M 800,375 V 465" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

   PLAN -->
  <path d="M 1020,375 C 1020,430 1300,410 1300,465" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

  
   DOC -->
  <path d="M 300,685 C 300,740 580,720 580,775" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

   DOC -->
  <path d="M 800,685 V 775" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />

   DOC -->
  <path d="M 1300,685 C 1300,740 1020,720 1020,775" stroke="#207448" stroke-width="3.5" fill="none" marker-end="url(#arrow)" />
</svg>