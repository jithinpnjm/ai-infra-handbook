<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Incident roles: one person decides, one changes things, one communicates</title>
  <desc>Visual flowchart of incident response roles: Incident Commander, Operations Lead, Communications Lead, Planning, and Shared Incident Document.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Incident roles: one person decides,</text>
  <text x="800" y="120" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">one changes things, one communicates</text>

  
  <path d="M 660 360 C 660 420, 300 420, 300 476" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  <path d="M 800 360 L 800 476" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  <path d="M 940 360 C 940 420, 1300 420, 1300 476" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <path d="M 300 700 C 300 760, 660 760, 660 816" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  <path d="M 800 700 L 800 816" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />
  <path d="M 1300 700 C 1300 760, 940 760, 940 816" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <g id="node-ic">
    <rect x="490" y="170" width="620" height="190" rx="18" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(800, 218)">
      <polygon points="0,-24 7,-8 24,-7 11,5 15,22 0,13 -15,22 -11,5 -24,-7 -7,-8" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    </g>
    <text x="800" y="290" text-anchor="middle" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#303a36">Incident commander:</text>
    <text x="800" y="332" text-anchor="middle" font-family="sans-serif" font-size="26px" fill="#303a36">state, roles, decisions</text>
  </g>

  
  <g id="node-ops">
    <rect x="70" y="480" width="460" height="220" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(300, 535)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M -4 -24 L 4 -24 L 4 -18 L -4 -18 Z M -4 18 L 4 18 L 4 24 L -4 24 Z M -24 -4 L -24 4 L -18 4 L -18 -4 Z M 18 -4 L 24 -4 L 24 4 L 18 4 Z M -17 -17 L -11 -17 L -13 -11 L -19 -11 Z M 11 11 L 17 11 L 19 17 L 13 17 Z M 11 -17 L 17 -17 L 19 -11 L 13 -11 Z M -17 11 L -11 11 L -13 17 L -19 17 Z" fill="#207448" />
    </g>
    <text x="300" y="612" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Operations lead:</text>
    <text x="300" y="656" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">the only one changing the system</text>
  </g>

  
  <g id="node-com">
    <rect x="570" y="480" width="460" height="220" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(800, 535)">
      <path d="M -16 -6 L -2 -14 L 6 -14 L 6 14 L -2 14 L -16 6 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M -2 14 L -2 22 L -8 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 14 -10 C 18 -5, 18 5, 14 10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 20 -16 C 27 -8, 27 8, 20 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="800" y="612" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Communications lead:</text>
    <text x="800" y="656" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">updates on a fixed cadence</text>
  </g>

  
  <g id="node-plan">
    <rect x="1070" y="480" width="460" height="220" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1300, 535)">
      <rect x="-18" y="-22" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="-8" y1="-10" x2="10" y2="-10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-8" y1="0" x2="10" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-8" y1="10" x2="10" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="-12" cy="-10" r="2" fill="#207448" />
      <circle cx="-12" cy="0" r="2" fill="#207448" />
      <circle cx="-12" cy="10" r="2" fill="#207448" />
    </g>
    <text x="1300" y="612" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Planning:</text>
    <text x="1300" y="656" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">bugs, handoff, revert list</text>
  </g>

  
  <g id="node-doc">
    <rect x="490" y="820" width="620" height="170" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(800, 868)">
      <path d="M -16 -22 L 6 -22 L 18 -10 L 18 22 L -16 22 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 6 -22 L 6 -10 L 18 -10" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="-8" y1="-2" x2="10" y2="-2" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-8" y1="7" x2="10" y2="7" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="800" y="945" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Shared incident document</text>
  </g>
</svg>