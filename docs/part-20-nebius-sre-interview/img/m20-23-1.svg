    <path d="M 949 838 v 8 M 949 874 v 8 M 927 860 h 8 M 963 860 h 8 M 933 844 l 6 6 M 959 870 l 6 6 M 933 876 l 6 -6 M 959 850 l 6 -6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="1000" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">container runtime</text>
