    <line x1="156" y1="850" x2="174" y2="850" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="156" y1="862" x2="174" y2="862" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="156" y1="872" x2="168" y2="872" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="210" y="870" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">kubelet journal</text>
