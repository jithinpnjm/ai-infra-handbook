<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Debug in a fixed order, from the object outward</title>
  <desc>Flowchart depicting Kubernetes troubleshooting in a fixed order from the object outward across 10 sequential steps.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Debug in a fixed order, from the object outward</text>

  
  
  <path d="M 770 200 H 830" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1195 280 v 16 q 0 14 -14 14 H 419 q -14 0 -14 14 v 16" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 770 420 H 830" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1195 500 v 16 q 0 14 -14 14 H 419 q -14 0 -14 14 v 16" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 770 640 H 830" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1195 720 v 16 q 0 14 -14 14 H 419 q -14 0 -14 14 v 16" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 770 860 H 830" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1195 940 v 16 q 0 14 -14 14 H 419 q -14 0 -14 14 v 16" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 770 1080 H 830" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <g id="step-1">
    <rect x="40" y="120" width="730" height="160" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    <circle cx="88" cy="200" r="24" fill="#db8129" />
    <text x="88" y="200" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
