      <tspan x="1000" dy="38" font-family="system-ui, -apple-system, sans-serif">Conditions, Taints</tspan>
    </text>
  </g>

  
  
  <g id="step-7">
    <rect x="40" y="780" width="730" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="88" cy="860" r="24" fill="#207448" />
    <text x="88" y="860" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    
    <rect x="138" y="836" width="46" height="48" rx="5" fill="none" stroke="#207448" stroke-width="4" />
