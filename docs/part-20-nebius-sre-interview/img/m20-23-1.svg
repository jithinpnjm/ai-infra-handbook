    <line x1="156" y1="1068" x2="148" y2="1086" stroke="#207448" stroke-width="3" />
    <line x1="164" y1="1068" x2="172" y2="1086" stroke="#207448" stroke-width="3" />
    <line x1="151" y1="1092" x2="169" y2="1092" stroke="#207448" stroke-width="3" />
    
    <text x="210" y="1090" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">CNI and pod network</text>
