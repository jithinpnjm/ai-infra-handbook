    <text x="210" y="650" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="bold" fill="#303a36">exec <tspan font-family="system-ui, -apple-system, sans-serif">into container</tspan></text>
  </g>

  
  <g id="step-6">
    <rect x="830" y="560" width="730" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="878" cy="640" r="24" fill="#207448" />
    <text x="878" y="640" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    <rect x="924" y="616" width="50" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="932" y1="630" x2="956" y2="630" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="932" y1="642" x2="956" y2="642" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="932" y1="654" x2="956" y2="654" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="963" cy="630" r="2" fill="#207448" />
    <circle cx="963" cy="642" r="2" fill="#207448" />
    <circle cx="963" cy="654" r="2" fill="#207448" />
    
    <text x="1000" y="630" font-size="30" font-weight="bold" fill="#303a36">
