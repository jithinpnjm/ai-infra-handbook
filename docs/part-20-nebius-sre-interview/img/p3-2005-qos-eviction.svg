<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>QoS classes decide who is evicted first under node memory pressure</title>
  <desc>Visual infographic explaining Kubernetes QoS eviction order under node memory pressure and comparing kubelet eviction with kernel OOM kills.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#303a36">QoS classes decide who is evicted first</text>
  <text x="800" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#303a36">under node memory pressure</text>

  
  
  <rect x="60" y="180" width="466" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="267" y="202" width="52" height="52" rx="8" stroke="#207448" stroke-width="4" fill="none" />
  <path d="M 267 218 L 319 218" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <circle cx="279" cy="210" r="3" fill="#207448" />
  <circle cx="291" cy="210" r="3" fill="#207448" />
  <path d="M 283 238 L 303 238" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />

  <text x="293" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#207448">BestEffort</text>
  <text x="293" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">No requests or limits</text>

  
  <rect x="173" y="410" width="240" height="64" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <text x="293" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#db8129">Evicted first</text>

  
  <rect x="566" y="180" width="466" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="775" y="234" width="12" height="20" rx="2" stroke="#207448" stroke-width="4" fill="none" />
  <rect x="793" y="218" width="12" height="36" rx="2" stroke="#207448" stroke-width="4" fill="none" />
  <rect x="811" y="202" width="12" height="52" rx="2" stroke="#207448" stroke-width="4" fill="none" />
  <path d="M 769 214 L 829 214" stroke="#207448" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" />

  <text x="799" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#207448">Burstable</text>
  <text x="799" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">Some request or limit,</text>
  <text x="799" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">not Guaranteed</text>

  
  <rect x="589" y="410" width="420" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="799" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">Evicted after BestEffort,</text>
  <text x="799" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">only if above requests</text>

  
  <rect x="1072" y="180" width="466" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <path d="M 1305 202 L 1329 212 C 1329 236 1305 250 1305 254 C 1305 250 1281 236 1281 212 Z" stroke="#207448" stroke-width="4" stroke-linejoin="round" fill="none" />
  <path d="M 1297 227 L 1303 233 L 1315 220" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <text x="1305" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#207448">Guaranteed</text>
  <text x="1305" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">Request equals limit</text>
  <text x="1305" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">for CPU and memory</text>
  <text x="1305" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">in every container</text>

  
  <rect x="1185" y="425" width="240" height="64" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1305" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">Evicted last</text>

  
  <path d="M 591 548 L 787 548 L 799 530 L 811 548 L 1007 548 Q 1019 548 1019 560 L 1019 610 Q 1019 622 1007 622 L 591 622 Q 579 622 579 610 L 579 560 Q 579 548 591 548 Z" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="799" y="576" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">A high limit alone gives</text>
  <text x="799" y="606" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">Burstable, not Guaranteed</text>

  
  <path d="M 80 665 L 1515 665" stroke="#207448" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)" />
  <text x="800" y="702" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">eviction order under node memory pressure: first to last</text>

  
  
  <rect x="60" y="745" width="530" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="325" cy="793" r="10" stroke="#207448" stroke-width="4" fill="none" />
  <circle cx="325" cy="793" r="20" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" fill="none" />
  <path d="M 325 768 L 325 776 M 325 810 L 325 818 M 300 793 L 308 793 M 342 793 L 350 793" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  <text x="325" y="865" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">kubelet eviction:</text>
  <text x="325" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#303a36">node pressure, different evidence</text>

  
  <line x1="590" y1="860" x2="610" y2="860" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="990" y1="860" x2="1010" y2="860" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />

  
  <rect x="610" y="812" width="380" height="96" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="852" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">different events,</text>
  <text x="800" y="888" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#303a36">do not use the same fix</text>

  
  <rect x="1010" y="745" width="530" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1255" y="773" width="40" height="40" rx="6" stroke="#207448" stroke-width="4" fill="none" />
  <rect x="1265" y="783" width="20" height="20" rx="2" stroke="#207448" stroke-width="3" fill="none" />
  <path d="M 1263 767 L 1263 773 M 1275 767 L 1275 773 M 1287 767 L 1287 773" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 1263 813 L 1263 819 M 1275 813 L 1275 819 M 1287 813 L 1287 819" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 1249 781 L 1255 781 M 1249 793 L 1255 793 M 1249 805 L 1255 805" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 1295 781 L 1301 781 M 1295 793 L 1301 793 M 1295 805 L 1301 805" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  <text x="1275" y="855" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">kernel OOM kill:</text>
  <text x="1275" y="895" text-anchor="middle">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the cgroup hit </tspan>
    <tspan font-family="monospace, ui-monospace" font-size="24" font-weight="bold" fill="#207448">memory.max,</tspan>
  </text>
  <text x="1275" y="935" text-anchor="middle">
    <tspan font-family="monospace, ui-monospace" font-size="24" font-weight="bold" fill="#207448">memory.events oom_kill</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"> rises</tspan>
  </text>

  
  <rect x="60" y="1020" width="1480" height="80" rx="12" fill="#207448" />
  <text x="800" y="1070" text-anchor="middle">
    <tspan font-family="monospace, ui-monospace" font-size="24" font-weight="bold" fill="#ffffff">memory.current</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff"> includes page cache; alert on the working set against the limit</tspan>
  </text>
</svg>