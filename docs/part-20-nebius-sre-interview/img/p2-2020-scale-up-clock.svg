<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Scale-up latency: the clock from crossing the line to serving</title>
  <desc>Timeline showing the stages of scale-up latency from metric trigger to serving requests, highlighting the node provisioning bottleneck and cure bypasses.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-down-green" markerWidth="14" markerHeight="14" refX="7" refY="10" orient="auto">
      <path d="M 2 1 L 7 11 L 12 1 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#303a36">Scale-up latency:</text>
  <text x="800" y="115" font-family="sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#303a36">the clock from crossing the line to serving</text>

  

  
  <rect x="35" y="160" width="190" height="120" rx="14" fill="#207448" />
  <text x="130" y="202" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <tspan x="130" dy="0">Metric</tspan>
    <tspan x="130" dy="28">crosses</tspan>
    <tspan x="130" dy="28">the target</tspan>
  </text>
  <line x1="130" y1="280" x2="130" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  
  <rect x="250" y="160" width="310" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="405" y="215" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">
    <tspan x="405" dy="0">Warm node pool,</tspan>
    <tspan x="405" dy="30">placeholder pods</tspan>
  </text>
  <line x1="405" y1="280" x2="405" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  
  <rect x="585" y="160" width="205" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="687" y="202" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">
    <tspan x="687" dy="0">Pre-pulled</tspan>
    <tspan x="687" dy="28">image,</tspan>
    <tspan x="687" dy="28">smaller image</tspan>
  </text>
  <line x1="687" y1="280" x2="687" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  
  <rect x="815" y="160" width="240" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="935" y="202" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">
    <tspan x="935" dy="0">Local volume</tspan>
    <tspan x="935" dy="28">cache,</tspan>
    <tspan x="935" dy="28">fast storage</tspan>
  </text>
  <line x1="935" y1="280" x2="935" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  
  <rect x="1080" y="160" width="240" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1200" y="202" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">
    <tspan x="1200" dy="0">Warm-up</tspan>
    <tspan x="1200" dy="28">request in the</tspan>
    <tspan x="1200" dy="28">startup probe</tspan>
  </text>
  <line x1="1200" y1="280" x2="1200" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  
  <rect x="1345" y="160" width="215" height="120" rx="14" fill="#207448" />
  <text x="1452" y="215" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <tspan x="1452" dy="0">Stream</tspan>
    <tspan x="1452" dy="30">is served</tspan>
  </text>
  <line x1="1452" y1="280" x2="1452" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down-green)" />

  

  
  <rect x="30" y="320" width="200" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="130" cy="360" r="22" fill="#207448" />
  <text x="130" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  
  <circle cx="130" cy="415" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
  <polyline points="130,402 130,415 142,415" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 148 402 A 26 26 0 0 1 154 425" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="130" y="475" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">Decision:</text>
  <text x="130" y="525" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="130" dy="0">scrape,</tspan>
    <tspan x="130" dy="32">polling</tspan>
    <tspan x="130" dy="32">and 15 s</tspan>
    <tspan x="130" dy="32">sync</tspan>
  </text>

  
  <rect x="240" y="320" width="330" height="460" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4.5" />
  
  <circle cx="405" cy="360" r="22" fill="#db8129" />
  <text x="405" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  
  <rect x="380" y="400" width="50" height="30" rx="5" fill="none" stroke="#db8129" stroke-width="3.5" />
  <line x1="388" y1="415" x2="394" y2="415" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  <line x1="400" y1="415" x2="406" y2="415" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  <line x1="420" y1="407" x2="420" y2="423" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  <line x1="412" y1="415" x2="428" y2="415" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
  
  <text x="405" y="475" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#db8129">Node provision</text>
  <text x="405" y="525" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="405" dy="0">by the cluster</tspan>
    <tspan x="405" dy="34">autoscaler</tspan>
  </text>

  
  <rect x="580" y="320" width="215" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="687" cy="360" r="22" fill="#207448" />
  <text x="687" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
  
  <text x="687" y="420" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">Image pull</text>
  
  
  <rect x="612" y="455" width="150" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="632" cy="476" r="6" fill="#207448" />
  <line x1="648" y1="471" x2="742" y2="471" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <line x1="648" y1="481" x2="715" y2="481" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  
  <line x1="687" y1="504" x2="687" y2="528" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow-down-green)" />
  
  <rect x="612" y="540" width="150" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <line x1="626" y1="563" x2="650" y2="563" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="660" y1="563" x2="746" y2="563" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  
  <rect x="612" y="600" width="150" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <line x1="626" y1="623" x2="650" y2="623" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="660" y1="623" x2="746" y2="623" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  
  <rect x="612" y="660" width="150" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <polyline points="628,683 636,690 648,677" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="660" y1="683" x2="746" y2="683" stroke="#207448" stroke-width="2" stroke-linecap="round" />

  
  <rect x="805" y="320" width="260" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="935" cy="360" r="22" fill="#207448" />
  <text x="935" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
  
  <path d="M 910 405 C 910 400 922 400 928 400 C 934 400 946 400 946 405 L 946 425 C 946 430 934 430 928 430 C 922 430 910 430 910 425 Z" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 910 412 C 910 417 922 417 928 417 C 934 417 946 417 946 412" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 910 419 C 910 424 922 424 928 424 C 934 424 946 424 946 419" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="952" y1="415" x2="964" y2="415" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  
  <text x="935" y="475" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">Weight load</text>
  <text x="935" y="525" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="935" dy="0">from storage to</tspan>
    <tspan x="935" dy="34">GPU memory</tspan>
  </text>

  
  <rect x="1075" y="320" width="250" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="1200" cy="360" r="22" fill="#207448" />
  <text x="1200" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
  
  <circle cx="1185" cy="410" r="5" fill="#207448" />
  <circle cx="1215" cy="405" r="5" fill="#207448" />
  <circle cx="1200" cy="425" r="5" fill="#207448" />
  <line x1="1185" y1="410" x2="1215" y2="405" stroke="#207448" stroke-width="2.5" />
  <line x1="1185" y1="410" x2="1200" y2="425" stroke="#207448" stroke-width="2.5" />
  <line x1="1215" y1="405" x2="1200" y2="425" stroke="#207448" stroke-width="2.5" />
  
  <text x="1200" y="475" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">Warm-up:</text>
  <text x="1200" y="525" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="1200" dy="0">first requests,</tspan>
    <tspan x="1200" dy="34">graph capture,</tspan>
    <tspan x="1200" dy="34">caches</tspan>
  </text>

  
  <rect x="1335" y="320" width="235" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="1452" cy="360" r="22" fill="#207448" />
  <text x="1452" y="368" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
  
  <rect x="1430" y="405" width="44" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="1440" cy="417" r="3" fill="#207448" />
  <circle cx="1452" cy="417" r="3" fill="#207448" />
  <polyline points="1460,417 1464,420 1470,413" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="1452" y="475" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#207448">Registration:</text>
  <text x="1452" y="525" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
    <tspan x="1452" dy="0">readiness</tspan>
    <tspan x="1452" dy="34">passes, router</tspan>
    <tspan x="1452" dy="34">adds it</tspan>
  </text>

  
  
  <path d="M 210 780 L 210 882 L 236 882" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 574 882 L 600 882 L 600 788" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="236" y="842" width="338" height="80" rx="20" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="405" y="874" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">
    <tspan x="405" dy="0">Warm node: the pod</tspan>
    <tspan x="405" dy="30">skips provisioning</tspan>
  </text>

  
  <text x="800" y="1055" font-family="sans-serif" font-size="26" font-style="italic" text-anchor="middle" fill="#6b7770">The values are assumptions, not measurements.</text>

</svg>