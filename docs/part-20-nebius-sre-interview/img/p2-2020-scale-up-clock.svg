<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Scale-up latency: the clock from crossing the line to serving</title>
  <desc>Visual explanation of the six stages in scale-up latency and optimization cures.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="60" y="68" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Scale-up latency: the clock from crossing the line to serving</text>

  
  <g>
    <rect x="60" y="112" width="360" height="48" rx="24" fill="#207448" />
    <circle cx="86" cy="136" r="12" fill="#ffffff" />
    <circle cx="86" cy="136" r="6" fill="#207448" />
    <text x="114" y="144" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Metric crosses the target</text>
    <path d="M 240 160 L 240 200" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  

  
  <g>
    <rect x="580" y="132" width="440" height="44" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Warm node pool, placeholder pods</text>
    <path d="M 800 176 L 800 202" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  
  <g>
    <rect x="1100" y="132" width="440" height="44" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1320" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Pre-pulled image, smaller image</text>
    <path d="M 1320 176 L 1320 202" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  
  <g>
    <rect x="60" y="210" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="104" cy="254" r="22" fill="#207448" />
    <text x="104" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <circle cx="440" cy="254" r="20" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 440 242 L 440 254 L 450 254" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="145" y="262" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Decision:</text>
    <text x="90" y="322" font-family="sans-serif" font-size="25" fill="#303a36">scrape, polling</text>
    <text x="90" y="362" font-family="sans-serif" font-size="25" fill="#303a36">and 15 s sync</text>
  </g>

  
  <path d="M 500 325 L 568 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="580" y="210" width="440" height="230" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="5" />
    <circle cx="624" cy="254" r="22" fill="#db8129" />
    <text x="624" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <rect x="930" y="238" width="40" height="12" rx="3" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="930" y="256" width="40" height="12" rx="3" fill="none" stroke="#db8129" stroke-width="3" />
    <circle cx="960" cy="244" r="2" fill="#db8129" />
    <circle cx="960" cy="262" r="2" fill="#db8129" />
    
    <text x="665" y="262" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node provision</text>
    <text x="610" y="322" font-family="sans-serif" font-size="25" fill="#303a36">by the cluster</text>
    <text x="610" y="362" font-family="sans-serif" font-size="25" fill="#303a36">autoscaler</text>
  </g>

  
  <path d="M 1020 325 L 1088 325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="1100" y="210" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1144" cy="254" r="22" fill="#207448" />
    <text x="1144" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="1450" y="244" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1468 234 L 1468 256 M 1462 250 L 1468 256 L 1474 250" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="1185" y="262" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Image pull</text>
  </g>

  

  
  
  <path d="M 110 440 L 110 514" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" />
  
  <g>
    <rect x="40" y="514" width="350" height="76" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="215" y="546" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Warm node:</text>
    <text x="215" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the pod skips provisioning</text>
  </g>
  
  <path d="M 110 590 L 110 748" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-orange)" />

  
  <path d="M 1320 440 L 1320 648 L 470 648 L 470 748" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  

  
  <g>
    <rect x="150" y="694" width="290" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="295" y="720" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Local volume cache,</text>
    <text x="295" y="740" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">fast storage</text>
  </g>

  
  <g>
    <rect x="630" y="694" width="340" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="720" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Warm-up request in</text>
    <text x="800" y="740" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">the startup probe</text>
  </g>

  
  <g>
    <rect x="60" y="760" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="104" cy="804" r="22" fill="#207448" />
    <text x="104" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <ellipse cx="440" cy="796" rx="18" ry="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 422 796 L 422 818 A 18 7 0 0 0 458 818 L 458 796" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="145" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Weight load</text>
    <text x="90" y="872" font-family="sans-serif" font-size="25" fill="#303a36">from storage to</text>
    <text x="90" y="912" font-family="sans-serif" font-size="25" fill="#303a36">GPU memory</text>
  </g>

  
  <path d="M 500 875 L 568 875" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="580" y="760" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="624" cy="804" r="22" fill="#207448" />
    <text x="624" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    
    <path d="M 950 820 C 938 820 932 810 938 798 C 942 790 948 786 950 780 C 952 786 958 790 962 798 C 968 810 962 820 950 820 Z" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="665" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Warm-up:</text>
    <text x="610" y="872" font-family="sans-serif" font-size="25" fill="#303a36">first requests,</text>
    <text x="610" y="912" font-family="sans-serif" font-size="25" fill="#303a36">graph capture, caches</text>
  </g>

  
  <path d="M 1020 875 L 1088 875" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="1100" y="760" width="440" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1144" cy="804" r="22" fill="#207448" />
    <text x="1144" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    
    <rect x="1446" y="800" width="40" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1454 792 L 1454 800 M 1466 792 L 1466 800 M 1478 792 L 1478 800" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="1456" cy="810" r="2" fill="#207448" />
    <circle cx="1466" cy="810" r="2" fill="#207448" />
    <circle cx="1476" cy="810" r="2" fill="#207448" />
    
    <text x="1185" y="812" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Registration:</text>
    <text x="1130" y="872" font-family="sans-serif" font-size="25" fill="#303a36">readiness passes,</text>
    <text x="1130" y="912" font-family="sans-serif" font-size="25" fill="#303a36">router adds it</text>
  </g>

  

  
  <path d="M 1320 990 L 1320 1028" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  <g>
    <rect x="1180" y="1040" width="280" height="48" rx="24" fill="#207448" />
    
    <circle cx="1206" cy="1064" r="12" fill="#ffffff" />
    <path d="M 1200 1064 L 1204 1068 L 1212 1060" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1230" y="1072" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Stream is served</text>
  </g>

  
  <text x="60" y="1072" font-family="sans-serif" font-size="24" font-style="italic" fill="#505e58">The values are assumptions, not measurements.</text>

</svg>