<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Incident 9: a backup on the leader's disk slows the whole control plane</title>
  <desc>Visual infographic detailing how a nightly backup job on member 2 saturates shared disk I/O, spiking etcd wal_fsync latency to 180 ms, triggering repeated leader elections and 8-second API server response times while data plane pods continue serving.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Incident 9: a backup on the leader's disk</text>
  <text x="800" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">slows the whole control plane</text>
  <text x="800" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#506059" text-anchor="middle">Drill numbers are invented.</text>

  

  
  <rect x="40" y="170" width="735" height="180" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="72" cy="204" r="20" fill="#207448" />
  <text x="72" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="106" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1</text>
  
  <g transform="translate(695, 184)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="20" cy="10" rx="18" ry="6" />
    <path d="M 2 10 v 18 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -18" />
    <circle cx="28" cy="28" r="11" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <polyline points="28,21 28,28 33,28" stroke="#207448" stroke-width="2.5" />
  </g>
  
  <text x="64" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">nightly backup job starts 02:00, writes a 40 GB</tspan>
    <tspan x="64" dy="32">copy to the device shared with API server logs</tspan>
    <tspan x="64" dy="32">on member 2</tspan>
  </text>

  
  <line x1="407" y1="350" x2="407" y2="370" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="374" width="735" height="154" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="72" cy="408" r="20" fill="#207448" />
  <text x="72" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="106" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2</text>
  
  <g transform="translate(695, 388)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="20" cy="10" rx="18" ry="6" />
    <path d="M 2 10 v 12 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -12" />
    <path d="M 2 22 v 12 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -12" />
    <line x1="14" y1="28" x2="26" y2="28" stroke="#207448" stroke-width="3" />
  </g>
  
  <text x="64" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0"><tspan font-family="ui-monospace, monospace">iostat</tspan> on member 2: device at 100 percent</tspan>
    <tspan x="64" dy="32">utilisation, high write await</tspan>
  </text>

  
  <line x1="407" y1="528" x2="407" y2="548" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="552" width="735" height="180" rx="12" ry="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
  
  <circle cx="72" cy="586" r="20" fill="#db8129" />
  <text x="72" y="594" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="106" y="596" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Step 3</text>
  
  <g transform="translate(695, 566)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 32 A 16 16 0 1 1 34 32" />
    <line x1="20" y1="22" x2="30" y2="14" stroke-width="4" />
    <circle cx="20" cy="22" r="3" fill="#db8129" />
  </g>
  
  <text x="64" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0"><tspan font-family="ui-monospace, monospace">wal_fsync_duration_seconds</tspan> p99 is 180 ms</tspan>
    <tspan x="64" dy="32">on member 2 against about 6 ms on the others;</tspan>
    <tspan x="64" dy="32">target under 10 ms</tspan>
  </text>

  
  <line x1="407" y1="732" x2="407" y2="752" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="756" width="735" height="210" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="72" cy="790" r="20" fill="#207448" />
  <text x="72" y="798" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="106" y="800" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4</text>
  
  <g transform="translate(695, 770)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 2 22 L 10 22 L 15 10 L 22 34 L 28 16 L 33 22 L 40 22" />
    <circle cx="36" cy="10" r="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  </g>
  
  <text x="64" y="840" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">leader is slow to confirm changes,</tspan>
    <tspan x="64" dy="32">heartbeats late, etcd logs:</tspan>
    <tspan x="64" dy="32" font-family="ui-monospace, monospace">failed to send out heartbeat on time,</tspan>
    <tspan x="64" dy="32" font-family="ui-monospace, monospace">apply entries took too long</tspan>
  </text>

  
  <line x1="407" y1="966" x2="407" y2="986" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="40" y="990" width="735" height="180" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="72" cy="1024" r="20" fill="#207448" />
  <text x="72" y="1032" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="106" y="1034" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 5</text>
  
  <g transform="translate(695, 1004)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="21" r="16" stroke-dasharray="8 4" />
    <polyline points="21,5 29,11 21,17" />
    <polyline points="21,37 13,31 21,25" />
  </g>
  
  <text x="64" y="1074" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">6 leader changes in 30 minutes; API server</tspan>
    <tspan x="64" dy="32">p99 request latency 8 s; <tspan font-family="ui-monospace, monospace">kubectl get</tspan></tspan>
    <tspan x="64" dy="32">takes eight seconds</tspan>
  </text>

  

  
  <rect x="825" y="170" width="735" height="240" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="849" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Right facts</text>
  
  <g transform="translate(1485, 184)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="16" height="12" rx="2" />
    <rect x="22" y="4" width="16" height="12" rx="2" />
    <rect x="12" y="24" width="16" height="12" rx="2" />
    <line x1="10" y1="16" x2="16" y2="24" />
    <line x1="30" y1="16" x2="24" y2="24" />
  </g>
  
  <text x="849" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="849" dy="0">three members, all healthy, quorum intact;</tspan>
    <tspan x="849" dy="32">round trip under 1 ms; database 3.1 GB against</tspan>
    <tspan x="849" dy="32">an 8 GB quota, no alarms; etcd colocated with</tspan>
    <tspan x="849" dy="32">the API server on three control-plane VMs;</tspan>
    <tspan x="849" dy="32">incident began 02:05</tspan>
  </text>

  
  <rect x="825" y="430" width="735" height="270" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="849" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Impact</text>
  
  <g transform="translate(1485, 444)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="34" height="24" rx="4" />
    <path d="M 12 16 l 5 5 l 12 -12" />
    <path d="M 10 34 h 22" />
  </g>
  
  <text x="849" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="849" dy="0">running pods keep serving;</tspan>
    <tspan x="849" dy="30">new pods are not created;</tspan>
    <tspan x="849" dy="30">autoscaling decisions late; node status lags;</tspan>
    <tspan x="849" dy="30">if traffic spikes the cluster cannot add</tspan>
    <tspan x="849" dy="30">capacity: the data plane works while the</tspan>
    <tspan x="849" dy="30">control plane cannot record new decisions</tspan>
  </text>

  
  <rect x="825" y="720" width="735" height="180" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="849" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Fix</text>
  
  <g transform="translate(1485, 734)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 A 10 10 0 0 0 16 18 L 6 28 A 4 4 0 0 0 12 34 L 22 24 A 10 10 0 0 0 34 12 L 28 12 L 28 6 Z" />
  </g>
  
  <text x="849" y="804" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="849" dy="0">stop the backup; confirm fsync p99 and leader</tspan>
    <tspan x="849" dy="32">changes settle; then give the backup its own</tspan>
    <tspan x="849" dy="32">disk or throttle it</tspan>
  </text>

  
  <rect x="825" y="920" width="735" height="250" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="849" y="960" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Do not</text>
  
  <g transform="translate(1485, 934)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16" />
    <line x1="9" y1="9" x2="31" y2="31" />
  </g>
  
  <text x="849" y="1010" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="849" dy="0">defragment a live member</tspan>
    <tspan x="849" dy="35">(blocks reads and writes) or restart or</tspan>
    <tspan x="849" dy="35">remove members (adds another leader change)</tspan>
  </text>
</svg>