<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title></title>
  <desc></desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Binary search on the answer:</tspan>
    <tspan x="800" dy="56">find where no turns into yes</tspan>
  </text>

  
  <text x="800" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">at this timeout, do at least 99 percent of requests succeed?</text>

  
  <line x1="380" y1="225" x2="1220" y2="225" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="800" y="217" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">timeout, small to large</text>

  
  <text x="445" y="275" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">lo</text>
  <line x1="445" y1="283" x2="445" y2="302" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="1155" y="275" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">hi</text>
  <line x1="1155" y1="283" x2="1155" y2="302" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  <line x1="490" y1="268" x2="590" y2="268" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="800" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">each check halves the range</text>
  <line x1="1110" y1="268" x2="1010" y2="268" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <rect x="380" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="445" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">no</text>

  
  <rect x="522" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="587" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">no</text>

  
  <rect x="664" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="729" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">no</text>

  
  <rect x="806" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="871" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">yes</text>

  
  <rect x="948" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1013" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">yes</text>

  
  <rect x="1090" y="310" width="130" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1155" y="356" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">yes</text>

  
  <path d="M 730 395 L 790 395 Q 800 395 800 410 Q 800 395 810 395 L 870 395" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="800" y="440" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">smallest x with ok(x) True</text>

  
  
  <rect x="80" y="470" width="660" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(100, 482)">
    <rect x="0" y="0" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="10" y1="22" x2="34" y2="22" stroke="#207448" stroke-width="3"/>
    <line x1="22" y1="10" x2="22" y2="34" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="165" y="513" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">1 mid = (lo + hi) // 2</text>

  <line x1="410" y1="538" x2="410" y2="556" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="80" y="558" width="660" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(100, 570)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 12 22 L 18 28 L 32 14" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="165" y="601" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">2 ok(mid)? yes: hi = mid - 1</text>

  <line x1="410" y1="626" x2="410" y2="644" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="80" y="646" width="660" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(100, 658)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="14" x2="30" y2="30" stroke="#207448" stroke-width="3"/>
    <line x1="30" y1="14" x2="14" y2="30" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="165" y="689" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">3 no: lo = mid + 1</text>

  <line x1="410" y1="714" x2="410" y2="732" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="80" y="734" width="660" height="88" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(100, 752)">
    <circle cx="22" cy="26" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 22 14 L 30 26 L 14 26 Z" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="165" y="770" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">4 repeat while lo &lt;= hi,</tspan>
    <tspan x="165" dy="34">the answer is lo</tspan>
  </text>

  
  <path d="M 80 778 L 45 778 L 45 504 L 72 504" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="80" y="845" width="660" height="135" rx="10" fill="#fffaf4" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(105, 885)">
    <polygon points="26,6 50,48 2,48" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="26" y1="20" x2="26" y2="34" stroke="#db8129" stroke-width="4"/>
    <circle cx="26" cy="41" r="2.5" fill="#db8129"/>
  </g>
  <text x="180" y="902" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="180" dy="0">Returns hi + 1 when nothing passes,</tspan>
    <tspan x="180" dy="36">so the caller must test for that</tspan>
  </text>

  
  
  <rect x="780" y="470" width="740" height="108" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(805, 498)">
    <rect x="0" y="0" width="50" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="18" width="50" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="0" y="36" width="50" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="7" r="2" fill="#207448"/>
    <circle cx="10" cy="25" r="2" fill="#207448"/>
    <circle cx="10" cy="43" r="2" fill="#207448"/>
  </g>
  <text x="875" y="518" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="875" dy="0" font-family="monospace" font-weight="bold" fill="#207448">min_replicas: </tspan><tspan font-family="sans-serif">fewest replicas</tspan>
    <tspan x="875" dy="34">covering peak traffic</tspan>
  </text>

  
  <rect x="780" y="594" width="740" height="108" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(805, 622)">
    <circle cx="25" cy="28" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="25" y1="28" x2="25" y2="16" stroke="#207448" stroke-width="3"/>
    <line x1="25" y1="28" x2="35" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="4" x2="30" y2="4" stroke="#207448" stroke-width="3"/>
    <line x1="25" y1="4" x2="25" y2="8" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="875" y="642" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="875" dy="0" font-family="monospace" font-weight="bold" fill="#207448">min_timeout_ms: </tspan><tspan font-family="sans-serif">smallest timeout</tspan>
    <tspan x="875" dy="34">letting the target fraction finish</tspan>
  </text>

  
  <rect x="780" y="718" width="740" height="128" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(805, 754)">
    <rect x="0" y="4" width="50" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="18" x2="50" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="0" x2="12" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="3"/>
    <circle cx="15" cy="30" r="3" fill="#207448"/>
    <circle cx="25" cy="30" r="3" fill="#207448"/>
    <circle cx="35" cy="30" r="3" fill="#207448"/>
    <circle cx="15" cy="40" r="3" fill="#207448"/>
    <circle cx="25" cy="40" r="3" fill="#207448"/>
  </g>
  <text x="875" y="756" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="875" dy="0" font-family="monospace" font-weight="bold" fill="#207448">min_window_hours: </tspan><tspan font-family="sans-serif">shortest maintenance</tspan>
    <tspan x="875" dy="32">window for a fixed job order on a</tspan>
    <tspan x="875" dy="32">given number of nodes</tspan>
  </text>

  
  <rect x="780" y="862" width="740" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(805, 896)">
    <circle cx="25" cy="25" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 12 25 C 12 16 18 10 27 10" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M 38 25 C 38 34 32 40 23 40" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>
  <text x="875" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="875" dy="0" font-family="monospace" font-weight="bold" fill="#207448">float_search: </tspan><tspan font-family="sans-serif">fixed 60 iterations,</tspan>
    <tspan x="875" dy="34">never loop until equal</tspan>
  </text>

  
  <rect x="80" y="1010" width="1440" height="120" rx="12" fill="#207448"/>
  <text x="800" y="1058" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">Bigger never hurts: that phrase tells you the pattern applies.</tspan>
    <tspan x="800" dy="38">Cost is O(log range) checks times the cost of one check.</tspan>
  </text>
</svg>