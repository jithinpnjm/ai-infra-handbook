<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Drill 9: an HPA with no denominator</title>
  <desc>Infographic explaining Horizontal Pod Autoscaler denominator issues, metrics pipeline status, GPU signal mismatches, fix steps, behaviour, and prevention.</desc>

  
  <rect width="1600" height="1360" fill="#f5f8f5"/>

  
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Drill 9: an HPA with no denominator</text>

  

  
  <rect x="60" y="110" width="940" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="90" y="140" width="880" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="530" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#303a36">CPU utilisation = usage divided by the container CPU request</text>

  
  
  <rect x="110" y="230" width="460" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="340" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">usage</text>

  
  <line x1="110" y1="294" x2="570" y2="294" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="110" y="308" width="460" height="64" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="340" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">CPU requests missing, only limits set</text>

  
  <text x="605" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42px" font-weight="bold" fill="#207448">=</text>

  
  <rect x="640" y="250" width="330" height="80" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="805" y="301" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30px" font-weight="bold" fill="#db8129">&lt;unknown&gt;/70%</text>

  
  <rect x="90" y="400" width="880" height="106" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(120, 425)">
    <polygon points="28,2 54,48 2,48" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="40" r="2.5" fill="#207448"/>
  </g>

  
  <text x="195" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">HPA cannot compute a metric</text>

  
  <rect x="1030" y="110" width="510" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1065, 145)">
    <rect x="4" y="4" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="16" x2="24" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="26" x2="12" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="36" x2="42" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="1065" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="25px" fill="#303a36">
    <tspan x="1065" dy="0">metrics-server is running and</tspan>
    <tspan x="1065" dy="48">kubectl top pods returns values,</tspan>
    <tspan x="1065" dy="48">so the pipeline is fine</tspan>
  </text>

  

  
  <rect x="60" y="560" width="690" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(95, 595)">
    <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4"/>
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4"/>
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4"/>
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="6" fill="none" stroke="#207448" stroke-width="4"/>
  </g>

  
  <text x="95" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="26px" fill="#303a36">
    <tspan x="95" dy="0">GPU inference: CPU about 40 percent busy</tspan>
    <tspan x="95" dy="46">while the GPU is saturated,</tspan>
    <tspan x="95" dy="46">the wrong signal</tspan>
  </text>

  
  <rect x="780" y="560" width="760" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(815, 595)">
    <path d="M38,6 C32,6 27,9 25,14 L10,29 C7,32 7,37 10,40 L16,46 C19,49 24,49 27,46 L42,31 C47,29 50,24 50,18 C50,15 42,18 38,14 C34,10 37,2 34,2 C35,3 37,4 38,6 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  </g>

  
  <text x="815" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="815" dy="0">1 set requests; 2 move the signal to queue</tspan>
    <tspan x="815" dy="42">depth or running requests per replica;</tspan>
    <tspan x="815" dy="42">Metrics Server gives CPU and memory only,</tspan>
    <tspan x="815" dy="42">use custom application metrics for other signals</tspan>
  </text>

  

  
  <rect x="60" y="950" width="860" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(95, 980)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,14 28,28 38,34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>

  
  <text x="95" y="1070" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
    <tspan x="95" dy="0">10 percent tolerance by default;</tspan>
    <tspan x="95" dy="40">downscale stabilization window 300 seconds;</tspan>
    <tspan x="95" dy="40">scale-up has none;</tspan>
    <tspan x="95" dy="40">new GPU pods may still be Pending, which</tspan>
    <tspan x="95" dy="40">sends you back to the Pending GPU drill and</tspan>
    <tspan x="95" dy="40">the cluster autoscaler</tspan>
  </text>

  
  <rect x="950" y="950" width="590" height="370" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(985, 980)">
    <path d="M28,6 L48,14 C48,34 38,46 28,52 C18,46 8,34 8,14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="20,28 26,34 38,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <text x="985" y="1080" font-family="system-ui, -apple-system, sans-serif" font-size="25px" fill="#303a36">
    <tspan x="985" dy="0">an alert on unknown HPA targets;</tspan>
    <tspan x="985" dy="48">inference scales on queue depth,</tspan>
    <tspan x="985" dy="48">not CPU</tspan>
  </text>

</svg>