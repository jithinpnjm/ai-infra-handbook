<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Drill 9: an HPA with no denominator</title>
  <desc>Visual breakdown of Kubernetes Horizontal Pod Autoscaler failure when CPU requests are missing, HPA target shows unknown, metrics pipeline health, GPU inference metrics mismatch, fix steps, behaviour timings, and prevention.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Drill 9: an HPA with no denominator</text>

  
  <g transform="translate(80, 105)">
    
    <rect width="1440" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <g transform="translate(30, 24)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 14 20 L 42 20 M 14 36 L 42 36 M 28 12 L 28 44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">CPU utilisation = usage divided by the container CPU request</text>
    </g>

    
    
    <rect x="50" y="105" width="490" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="295" y="147" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">usage</text>

    
    <line x1="40" y1="185" x2="550" y2="185" stroke="#303a36" stroke-width="5" stroke-linecap="round"/>

    
    <rect x="50" y="200" width="490" height="115" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="295" y="250" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="295" dy="0">CPU requests missing,</tspan>
      <tspan x="295" dy="34">only limits set</tspan>
    </text>

    
    <text x="595" y="195" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36" text-anchor="middle">=</text>

    
    <rect x="640" y="105" width="230" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(660, 125)">
      
      <path d="M 18 42 L 36 10 L 54 42 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="36" y1="23" x2="36" y2="31" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="36" cy="37" r="2.5" fill="#207448"/>
    </g>
    <text x="755" y="225" font-family="monospace" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">&lt;unknown&gt;/70%</text>

    
    <rect x="900" y="105" width="505" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <g transform="translate(925, 125)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="14,28 24,38 42,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1000" y="152" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">condition</text>
    <text x="925" y="200" font-family="sans-serif" font-size="24px" fill="#303a36">HPA cannot compute a metric</text>
    <text x="925" y="245" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="925" dy="0">metrics-server is running and</tspan>
      <tspan x="925" dy="32">kubectl top pods returns values,</tspan>
      <tspan x="925" dy="32">so the pipeline is fine</tspan>
    </text>
  </g>

  

  
  <g transform="translate(80, 480)">
    <rect width="690" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(30, 24)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="14" y="14" width="28" height="28" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="22" x2="14" y2="22" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="34" x2="14" y2="34" stroke="#207448" stroke-width="3"/>
      <line x1="42" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="3"/>
      <line x1="42" y1="34" x2="48" y2="34" stroke="#207448" stroke-width="3"/>
      <text x="76" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Second problem</text>
    </g>

    
    <rect x="30" y="105" width="630" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="55" y="165" font-family="sans-serif" font-size="26px" fill="#303a36">
      <tspan x="55" dy="0">GPU inference: CPU about 40 percent</tspan>
      <tspan x="55" dy="42">busy while the GPU is saturated,</tspan>
      <tspan x="55" dy="42">the wrong signal</tspan>
    </text>
  </g>

  
  <g transform="translate(810, 480)">
    <rect width="710" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(30, 24)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 38 18 L 44 24 L 26 42 L 20 36 Z" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 35 15 C 38 12 43 12 46 15 C 49 18 49 23 46 26" fill="none" stroke="#207448" stroke-width="3"/>
      <text x="76" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Fix steps</text>
    </g>

    
    <rect x="30" y="95" width="650" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="60" cy="125" r="16" fill="#207448"/>
    <text x="60" y="133" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="95" y="134" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">1 set requests</text>

    <rect x="30" y="165" width="650" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="60" cy="207" r="16" fill="#207448"/>
    <text x="60" y="215" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="95" y="200" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">2 move the signal to queue depth</tspan>
      <tspan x="95" dy="32">or running requests per replica</tspan>
    </text>

    
    <rect x="30" y="260" width="650" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="50" y="295" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="50" dy="0">Metrics Server gives CPU and memory only,</tspan>
      <tspan x="50" dy="34">use custom application metrics for other signals</tspan>
    </text>
  </g>

  

  
  <g transform="translate(80, 890)">
    <rect width="790" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(30, 20)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="3"/>
      <polyline points="28,16 28,28 36,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Behaviour box</text>
    </g>

    <rect x="30" y="90" width="730" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="50" y="125" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="50" dy="0">• 10 percent tolerance by default</tspan>
      <tspan x="50" dy="34">• downscale stabilization window 300 seconds; scale-up has none</tspan>
      <tspan x="50" dy="34">• new GPU pods may still be Pending, which sends you back</tspan>
      <tspan x="70" dy="32">to the Pending GPU drill and the cluster autoscaler</tspan>
    </text>
  </g>

  
  <g transform="translate(910, 890)">
    <rect width="610" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(30, 20)">
      
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 12 L 44 18 C 44 32 28 42 28 42 C 28 42 12 32 12 18 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <text x="76" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Prevention</text>
    </g>

    <rect x="30" y="90" width="550" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="50" y="145" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="50" dy="0">• an alert on unknown HPA targets</tspan>
      <tspan x="50" dy="48">• inference scales on queue depth, not CPU</tspan>
    </text>
  </g>
</svg>