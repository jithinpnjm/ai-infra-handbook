<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>A restart loop hits the start limit</title>
  <desc>An infographic illustrating a systemd service restart loop hitting start rate limits and transitioning to a failed state.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 15 8 L 1 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A restart loop hits the start limit</text>

  
  <rect x="40" y="140" width="690" height="600" rx="16" fill="#e8f1ea" fill-opacity="0.5" stroke="#207448" stroke-width="2" stroke-dasharray="8 8"/>

  
  <g id="box1">
    <rect x="65" y="155" width="310" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(195, 175)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="25" cy="25" r="12"/>
      <path d="M25 5 v6 M25 39 v6 M5 25 h6 M39 25 h6 M11 11 l4 4 M35 35 l4 4 M11 39 l4-4 M35 11 l4-4"/>
    </g>
    <text x="220" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Process starts</text>
    <text x="220" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">and does its setup</text>
  </g>

  
  <g id="box2">
    <rect x="400" y="155" width="310" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(530, 175)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 6 L45 42 H5 Z"/>
      <path d="M25 20 v10 M25 36 v2"/>
    </g>
    <text x="555" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Setup fails:</text>
    <text x="555" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36" text-anchor="middle">exit status</text>
  </g>

  
  <g id="box3">
    <rect x="400" y="485" width="310" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(530, 505)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="25" cy="25" r="20"/>
      <polyline points="25,13 25,25 35,25"/>
    </g>
    <text x="555" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">systemd waits</text>
    <text x="555" y="660" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">RestartSec=100ms</text>
  </g>

  
  <g id="box4">
    <rect x="65" y="485" width="310" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(195, 505)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 25 A 15 15 0 1 1 38 32"/>
      <polyline points="32,32 40,32 40,24"/>
      <path d="M22 18 v12 M16 24 h12"/>
    </g>
    <text x="220" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Restart counter</text>
    <text x="220" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">goes up by one</text>
  </g>

  
  
  <line x1="375" y1="272" x2="398" y2="272" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <line x1="555" y1="390" x2="555" y2="483" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <line x1="400" y1="602" x2="377" y2="602" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <line x1="220" y1="485" x2="220" y2="392" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>


  
  
  <line x1="730" y1="272" x2="788" y2="272" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="gate">
    
    <rect x="790" y="140" width="380" height="255" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g fill="#d3e4d7" stroke="#207448" stroke-width="2">
      
      <path d="M 810 200 L 820 180 L 830 200 V 380 H 810 Z"/>
      
      <path d="M 855 200 L 865 180 L 875 200 V 380 H 855 Z"/>
      
      <path d="M 900 200 L 910 180 L 920 200 V 380 H 900 Z"/>
      
      <path d="M 945 200 L 955 180 L 965 200 V 380 H 945 Z"/>
      
      <path d="M 990 200 L 1000 180 L 1010 200 V 380 H 990 Z"/>
      
      <path d="M 1035 200 L 1045 180 L 1055 200 V 380 H 1035 Z"/>
      
      <path d="M 1080 200 L 1090 180 L 1100 200 V 380 H 1080 Z"/>
      
      <path d="M 1125 200 L 1135 180 L 1145 200 V 380 H 1125 Z"/>
      
      <rect x="800" y="210" width="360" height="12" rx="3"/>
      <rect x="800" y="340" width="360" height="12" rx="3"/>
    </g>

    
    <rect x="808" y="222" width="344" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="980" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">StartLimitIntervalSec and</text>
    <text x="980" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">StartLimitBurst:</text>
    <text x="980" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">too many tries too fast</text>
  </g>


  
  
  <line x1="980" y1="395" x2="980" y2="443" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="failed_box">
    <rect x="790" y="445" width="380" height="175" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(955, 465)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 6 L43 14 V28 C43 38 25 45 25 45 C25 45 7 38 7 28 V14 Z"/>
      <line x1="17" y1="21" x2="33" y2="33"/>
      <line x1="33" y1="21" x2="17" y2="33"/>
    </g>
    <text x="980" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">Unit marked failed,</text>
    <text x="980" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">not restarted any more</text>
  </g>

  
  <g id="command_chip">
    <rect x="800" y="665" width="360" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="980" y="701" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">systemctl reset-failed</text>
  </g>


  
  <g id="read_order_card">
    <rect x="1220" y="140" width="340" height="600" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(1250, 168)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="28" height="34" rx="3"/>
      <line x1="10" y1="12" x2="26" y2="12"/>
      <line x1="10" y1="20" x2="26" y2="20"/>
      <line x1="10" y1="28" x2="20" y2="28"/>
    </g>
    <text x="1395" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Read in order</text>

    
    <rect x="1235" y="235" width="310" height="75" rx="10" fill="#e8f1ea"/>
    <text x="1390" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1. exit status line</text>

    
    <rect x="1235" y="335" width="310" height="75" rx="10" fill="#e8f1ea"/>
    <text x="1390" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">2. restart counter</text>

    
    <rect x="1235" y="435" width="310" height="75" rx="10" fill="#e8f1ea"/>
    <text x="1390" y="481" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">3. the limit</text>

    
    <rect x="1235" y="535" width="310" height="100" rx="10" fill="#e8f1ea"/>
    <text x="1390" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1390" dy="0">4. only then</tspan>
      <tspan x="1390" dy="34">change Restart=</tspan>
    </text>
  </g>


  
  <rect x="40" y="785" width="1520" height="70" rx="12" fill="#207448"/>
  <text x="800" y="829" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Changing the restart policy first hides the crash you need to understand.</text>
</svg>