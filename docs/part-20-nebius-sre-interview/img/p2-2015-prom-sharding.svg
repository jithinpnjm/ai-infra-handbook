<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Shard Prometheus by function, federate only aggregates</title>
  <desc>Architecture infographic illustrating how to split an overloaded Prometheus server into functional shards and federate only aggregated metrics to a global instance.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#d32f2f" />
    </marker>
    <marker id="arrow-split" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  
  <rect width="1600" height="1350" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Shard Prometheus by function, federate only aggregates</text>

  
  
  
  <g filter="url(#card-shadow)">
    <rect x="200" y="110" width="1200" height="190" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  </g>

  
  <g transform="translate(240, 145)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="34" rx="4" />
    <line x1="12" y1="17" x2="16" y2="17" />
    <line x1="24" y1="17" x2="28" y2="17" />
    <rect x="0" y="44" width="56" height="34" rx="4" />
    <line x1="12" y1="61" x2="16" y2="61" />
    <line x1="24" y1="61" x2="28" y2="61" />
    
    <path d="M 44 26 L 44 6" stroke="#db8129" stroke-width="4" />
    <circle cx="44" cy="2" r="1.5" fill="#db8129" />
  </g>

  
  <text x="325" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">One server holds all active series in memory</text>

  
  <rect x="325" y="200" width="580" height="36" rx="8" fill="#fcede0" stroke="#db8129" stroke-width="2" />
  
  <rect x="329" y="204" width="545" height="28" rx="6" fill="#db8129" />
  
  <line x1="445" y1="200" x2="445" y2="236" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="565" y1="200" x2="565" y2="236" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="685" y1="200" x2="685" y2="236" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="805" y1="200" x2="805" y2="236" stroke="#ffffff" stroke-width="2" opacity="0.4" />

  
  <rect x="940" y="197" width="220" height="42" rx="8" fill="#db8129" />
  <text x="1050" y="227" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">query timeout</text>

  
  
  
  <path d="M 800 300 L 800 345" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" fill="none" />
  <path d="M 310 345 L 1290 345" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" fill="none" />
  <path d="M 310 345 L 310 380" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-split)" />
  <path d="M 800 345 L 800 380" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-split)" />
  <path d="M 1290 345 L 1290 380" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-split)" />

  
  
  

  
  <g filter="url(#card-shadow)">
    <rect x="100" y="390" width="420" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  </g>
  
  <g transform="translate(282, 412)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <line x1="4" y1="20" x2="52" y2="20" />
    <circle cx="14" cy="13" r="2" fill="#207448" />
    <circle cx="22" cy="13" r="2" fill="#207448" />
    <path d="M 16 34 L 24 42 L 40 28" />
  </g>
  
  <text x="310" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="310" dy="0">Shard 1:</tspan>
    <tspan x="310" dy="36">platform</tspan>
  </text>

  
  <g filter="url(#card-shadow)">
    <rect x="590" y="390" width="420" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  </g>
  
  <g transform="translate(772, 412)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="22" height="20" rx="3" />
    <rect x="32" y="4" width="22" height="20" rx="3" />
    <rect x="2" y="32" width="22" height="20" rx="3" />
    <rect x="32" y="32" width="22" height="20" rx="3" />
    <circle cx="13" cy="14" r="3" />
    <circle cx="43" cy="14" r="3" />
    <circle cx="13" cy="42" r="3" />
    <circle cx="43" cy="42" r="3" />
  </g>
  
  <text x="800" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Shard 2:</tspan>
    <tspan x="800" dy="36">tenant workloads</tspan>
  </text>

  
  <g filter="url(#card-shadow)">
    <rect x="1080" y="390" width="420" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  </g>
  
  <g transform="translate(1262, 412)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4" />
    
    <rect x="18" y="18" width="8" height="8" fill="#207448" />
    <rect x="30" y="18" width="8" height="8" fill="#207448" />
    <rect x="18" y="30" width="8" height="8" fill="#207448" />
    <rect x="30" y="30" width="8" height="8" fill="#207448" />
    
    <line x1="18" y1="2" x2="18" y2="10" />
    <line x1="28" y1="2" x2="28" y2="10" />
    <line x1="38" y1="2" x2="38" y2="10" />
    <line x1="18" y1="46" x2="18" y2="54" />
    <line x1="28" y1="46" x2="28" y2="54" />
    <line x1="38" y1="46" x2="38" y2="54" />
    
    <line x1="2" y1="18" x2="10" y2="18" />
    <line x1="2" y1="28" x2="10" y2="28" />
    <line x1="2" y1="38" x2="10" y2="38" />
    <line x1="46" y1="18" x2="54" y2="18" />
    <line x1="46" y1="28" x2="54" y2="28" />
    <line x1="46" y1="38" x2="54" y2="38" />
  </g>
  
  <text x="1290" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1290" dy="0">Shard 3:</tspan>
    <tspan x="1290" dy="36">GPU and node exporters</tspan>
  </text>

  
  
  

  
  <path d="M 260 610 L 260 950" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 680 610 L 680 950" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 1200 610 L 1200 680 L 860 680 L 860 950" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g filter="url(#card-shadow)">
    <rect x="360" y="700" width="560" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="640" y="732" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Only aggregates and SLI series upward</text>

  
  <path d="M 940 610 L 940 880" stroke="#d32f2f" stroke-width="4" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow-red)" />
  
  
  <circle cx="940" cy="740" r="22" fill="#ffffff" stroke="#d32f2f" stroke-width="3" />
  <line x1="925" y1="725" x2="955" y2="755" stroke="#d32f2f" stroke-width="4" stroke-linecap="round" />
  <line x1="955" y1="725" x2="925" y2="755" stroke="#d32f2f" stroke-width="4" stroke-linecap="round" />

  
  <g filter="url(#card-shadow)">
    <rect x="990" y="795" width="460" height="46" rx="8" fill="#fde8e8" stroke="#d32f2f" stroke-width="2.5" />
  </g>
  <text x="1220" y="827" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#c5221f">Never federate raw per-pod series</text>

  
  
  

  
  <g filter="url(#card-shadow)">
    <rect x="100" y="960" width="880" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="4" />
  </g>

  
  <g transform="translate(140, 1030)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <rect x="0" y="0" width="64" height="34" rx="4" />
    <circle cx="14" cy="17" r="3" fill="#207448" />
    <line x1="26" y1="17" x2="52" y2="17" />
    <rect x="0" y="44" width="64" height="34" rx="4" />
    <circle cx="14" cy="61" r="3" fill="#207448" />
    <line x1="26" y1="61" x2="52" y2="61" />
  </g>

  
  <g transform="translate(240, 1015)">
    
    <path d="M 0 50 Q 80 10, 160 50 T 320 50 T 480 50 T 640 50" fill="none" stroke="#207448" stroke-width="4" opacity="0.8" />
    <path d="M 0 75 Q 80 45, 160 75 T 320 75 T 480 75 T 640 75" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" opacity="0.5" />
    
    <rect x="40" y="10" width="80" height="12" rx="3" fill="#207448" opacity="0.3" />
    <rect x="140" y="10" width="110" height="12" rx="3" fill="#207448" opacity="0.5" />
    <rect x="270" y="10" width="70" height="12" rx="3" fill="#207448" opacity="0.4" />
    <rect x="360" y="10" width="130" height="12" rx="3" fill="#207448" opacity="0.6" />
    <rect x="510" y="10" width="90" height="12" rx="3" fill="#207448" opacity="0.3" />
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1040" y="960" width="460" height="220" rx="16" fill="#ffffff" stroke="#708078" stroke-width="2.5" />
  </g>
  
  <g transform="translate(1075, 995)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 2 L 34 32 L 2 32 Z" />
    <line x1="18" y1="13" x2="18" y2="20" stroke-width="3" />
    <circle cx="18" cy="26" r="1.5" fill="#db8129" />
  </g>
  
  <text x="1075" y="1065" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1075" dy="0">Cost: fragmented data,</tspan>
    <tspan x="1075" dy="36">a question across shards</tspan>
    <tspan x="1075" dy="36">needs two queries and a join</tspan>
  </text>

  
  
  
  <g filter="url(#card-shadow)">
    <rect x="100" y="1230" width="1400" height="70" rx="12" fill="#207448" />
  </g>
  <text x="800" y="1274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Shard by function or region first, aggregate with recording rules.</text>
</svg>