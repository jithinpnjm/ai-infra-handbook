<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Diagnosing DNS problems</title>
  <desc>A visual decision flowchart for diagnosing DNS resolution problems, tracing symptoms through getent hosts and dig query results to identify application, local path, resolver reachability, missing record, or upstream server failures.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Diagnosing DNS problems</text>

  

  
  <line x1="320" y1="205" x2="320" y2="235" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="220" y1="365" x2="220" y2="435" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="185" y="383" width="70" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="220" y="408" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no</text>

  
  <line x1="580" y1="300" x2="960" y2="300" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="645" y="278" width="250" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="770" y="309" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">yes but app fails</text>

  
  <line x1="580" y1="500" x2="960" y2="500" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="730" y="478" width="80" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="770" y="509" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">yes</text>

  
  <line x1="295" y1="565" x2="295" y2="730" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="200" y="628" width="190" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="295" y="659" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no: timeout</text>

  
  <path d="M 450 565 L 450 675 L 800 675 L 800 730" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="525" y="653" width="200" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="625" y="684" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no: NXDOMAIN</text>

  
  <path d="M 530 565 L 530 620 L 1305 620 L 1305 730" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="940" y="598" width="200" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1040" y="629" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no: SERVFAIL</text>


  
  <rect x="60" y="105" width="520" height="100" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="3.5" />
  
  <g transform="translate(85, 127)">
    <circle cx="26" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <line x1="26" y1="14" x2="26" y2="30" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="26" cy="40" r="2.5" fill="#db8129"/>
  </g>
  <text x="160" y="167" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Name doesn't resolve / slow</text>


  
  <rect x="60" y="235" width="520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(85, 272)">
    <rect x="0" y="0" width="54" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="12,14 22,22 12,30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="30" x2="42" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="160" y="295" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">getent hosts NAME</text>
  <text x="160" y="335" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">works?</text>


  
  <rect x="60" y="435" width="520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(85, 472)">
    <circle cx="27" cy="27" r="23" fill="none" stroke="#207448" stroke-width="3.5"/>
    <ellipse cx="27" cy="27" rx="10" ry="23" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="4" y1="27" x2="50" y2="27" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="160" y="495" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">dig NAME @resolver</text>
  <text x="160" y="535" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">works?</text>


  
  <rect x="960" y="230" width="580" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(985, 255)">
    <rect x="0" y="0" width="52" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="13" x2="52" y2="13" stroke="#207448" stroke-width="2.5"/>
    <circle cx="10" cy="7" r="2.5" fill="#207448"/>
    <circle cx="19" cy="7" r="2.5" fill="#207448"/>
    <circle cx="28" cy="7" r="2.5" fill="#207448"/>
  </g>
  <text x="1058" y="266" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1058" dy="0" font-weight="bold">App-level: own resolver/cache</tspan>
    <tspan x="1058" dy="32">(JVM, nginx), IPv6-first AAAA failing,</tspan>
    <tspan x="1058" dy="32">proxy settings, search path</tspan>
  </text>


  
  <rect x="960" y="430" width="580" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(985, 455)">
    <path d="M 6 0 L 34 0 L 48 14 L 48 50 L 6 50 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="16" y1="18" x2="30" y2="18" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="38" x2="32" y2="38" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="1058" y="462" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1058" dy="0" font-weight="bold">Local path issue: nsswitch.conf</tspan>
    <tspan x="1058" dy="32">order, /etc/hosts override, search/ndots</tspan>
    <tspan x="1058" dy="32">expansion, systemd-resolved link config</tspan>
  </text>


  
  <rect x="60" y="730" width="470" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(267, 755)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="85" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-size="26" font-weight="bold">Resolver unreachable:</tspan>
    <tspan x="85" dy="40">routing, firewall UDP/TCP 53,</tspan>
    <tspan x="85" dy="36">wrong nameserver,</tspan>
    <tspan x="85" dy="36">MTU/fragmentation,</tspan>
    <tspan x="85" dy="36">overloaded resolver</tspan>
  </text>


  
  <rect x="565" y="730" width="470" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(772, 755)">
    <path d="M 6 0 L 32 0 L 46 14 L 46 50 L 6 50 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="24" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="30" y1="34" x2="38" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="590" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="590" dy="0" font-size="26" font-weight="bold">Record missing/typo/</tspan>
    <tspan x="590" dy="40">negative cache/wrong zone/</tspan>
    <tspan x="590" dy="36">split-horizon view;</tspan>
    <tspan x="590" dy="40" font-family="monospace" font-size="26" font-weight="bold">dig +trace</tspan>
  </text>


  
  <rect x="1070" y="730" width="470" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1277, 755)">
    <rect x="4" y="2" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="4" y="28" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="14" cy="11" r="2.5" fill="#207448"/>
    <circle cx="22" cy="11" r="2.5" fill="#207448"/>
    <circle cx="14" cy="37" r="2.5" fill="#207448"/>
    <circle cx="22" cy="37" r="2.5" fill="#207448"/>
    <line x1="38" y1="11" x2="44" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="37" x2="44" y2="37" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1095" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" dy="0" font-size="26" font-weight="bold">Upstream/auth server broken,</tspan>
    <tspan x="1095" dy="40">lame delegation,</tspan>
    <tspan x="1095" dy="36">DNSSEC failure (try +cd),</tspan>
    <tspan x="1095" dy="36">forwarder down</tspan>
  </text>

</svg>