<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Anatomy of a bpftrace one-liner</title>
  <desc>Visual explanation of bpftrace syntax, structure, components, and examples.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Anatomy of a bpftrace one-liner</text>

  
  <rect x="40" y="80" width="1520" height="400" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="64" y="98" width="1472" height="62" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(85, 111)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="42" height="34" rx="4"/>
    <path d="M8 12 L16 17 L8 22"/>
    <line x1="20" y1="24" x2="32" y2="24"/>
  </g>
  <text x="145" y="139" font-family="'SFMono-Regular', Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">sudo bpftrace -e &quot;tracepoint:tcp:tcp_retransmit_skb { @[ntop(args-&gt;daddr)] = count(); }&quot;</text>

  
  
  <rect x="64" y="175" width="720" height="105" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(85, 207)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="18"/>
    <path d="M4 20 L12 20 L16 10 L22 30 L27 15 L31 20 L36 20"/>
  </g>
  <text x="145" y="208" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">tracepoint:tcp:tcp_retransmit_skb:</text>
  <text x="145" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the event, the moment the kernel</text>
  <text x="145" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">resends a segment</text>

  
  <rect x="64" y="290" width="720" height="105" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(85, 322)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="40" rx="6"/>
    <path d="M14 12 C10 12 10 16 10 18 C10 20 8 20 6 20 C8 20 10 20 10 22 C10 24 10 28 14 28"/>
    <path d="M26 12 C30 12 30 16 30 18 C30 20 32 20 34 20 C32 20 30 20 30 22 C30 24 30 28 26 28"/>
  </g>
  <text x="145" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#207448">{ ... }:</tspan> the action block</text>

  
  
  <rect x="816" y="175" width="720" height="62" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(835, 187)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="18" r="8"/>
    <line x1="22" y1="18" x2="36" y2="18"/>
    <line x1="30" y1="18" x2="30" y2="24"/>
    <line x1="35" y1="18" x2="35" y2="24"/>
  </g>
  <text x="888" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#207448">@[...]:</tspan> a map keyed by</text>

  
  <rect x="816" y="247" width="720" height="76" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(835, 263)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16"/>
    <path d="M4 20 L36 20"/>
    <path d="M20 4 C26 10 26 30 20 36"/>
    <path d="M20 4 C14 10 14 30 20 36"/>
  </g>
  <text x="888" y="280" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">ntop(args-&gt;daddr): <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal" fill="#303a36">the destination address</tspan></text>
  <text x="888" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">converted to readable text</text>

  
  <rect x="816" y="333" width="720" height="62" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(835, 345)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="32" height="26" rx="4"/>
    <line x1="14" y1="19" x2="26" y2="19"/>
    <line x1="20" y1="13" x2="20" y2="25"/>
  </g>
  <text x="888" y="372" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">= count(): <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal" fill="#303a36">add one each time the event fires</tspan></text>

  
  <rect x="64" y="410" width="1472" height="54" rx="10" fill="#fef6ed" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(85, 419)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="32" x2="36" y2="32"/>
    <rect x="8" y="16" width="6" height="16" fill="#db8129"/>
    <rect x="18" y="6" width="6" height="26" fill="#db8129"/>
    <rect x="28" y="22" width="6" height="10" fill="#db8129"/>
  </g>
  <text x="800" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">On stop, the map shows which destinations suffered the most retransmits</text>

  
  <rect x="40" y="495" width="1520" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="64" y="510" width="1472" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="542" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="30" font-weight="bold" fill="#207448">probe /filter/ { action }</text>

  
  
  <rect x="64" y="570" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(84, 597)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16"/>
    <circle cx="20" cy="20" r="8"/>
    <line x1="20" y1="0" x2="20" y2="8"/>
    <line x1="20" y1="32" x2="20" y2="40"/>
    <line x1="0" y1="20" x2="8" y2="20"/>
    <line x1="32" y1="20" x2="40" y2="20"/>
  </g>
  <text x="145" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">probe says what to watch</text>

  
  <rect x="563" y="570" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(583, 597)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="6,6 34,6 22,22 22,34 18,32 18,22"/>
  </g>
  <text x="645" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">optional filter in</text>
  <text x="645" y="654" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">slashes narrows it</text>

  
  <rect x="1062" y="570" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(1082, 597)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="24" height="24" rx="3"/>
    <line x1="14" y1="2" x2="14" y2="8"/>
    <line x1="26" y1="2" x2="26" y2="8"/>
    <line x1="14" y1="32" x2="14" y2="38"/>
    <line x1="26" y1="32" x2="26" y2="38"/>
    <line x1="2" y1="14" x2="8" y2="14"/>
    <line x1="2" y1="26" x2="8" y2="26"/>
    <line x1="32" y1="14" x2="38" y2="14"/>
    <line x1="32" y1="26" x2="38" y2="26"/>
  </g>
  <text x="1140" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">action uses pid, tid,</text>
  <text x="1140" y="637" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">comm, nsecs, arg0..argN,</text>
  <text x="1140" y="669" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">retval, args-&gt;field</text>

  
  
  <rect x="64" y="698" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(84, 725)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16"/>
    <polyline points="20,10 20,20 28,24"/>
  </g>
  <text x="145" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">BEGIN, END and interval</text>
  <text x="145" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">probes for setup, teardown</text>
  <text x="145" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">and periodic output</text>

  
  <rect x="563" y="698" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(583, 725)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 6 C24 3 16 6 14 12 L4 28 L12 36 L28 26 C34 24 37 16 34 10 L26 18 L22 14 Z"/>
  </g>
  <text x="645" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">helpers printf, ntop(),</text>
  <text x="645" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">ksym(), usym(),</text>
  <text x="645" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">kstack, ustack</text>

  
  <rect x="1062" y="698" width="474" height="114" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(1082, 725)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="36" x2="36" y2="36"/>
    <rect x="6" y="24" width="6" height="12"/>
    <rect x="14" y="16" width="6" height="20"/>
    <rect x="22" y="8" width="6" height="28"/>
    <rect x="30" y="20" width="6" height="16"/>
  </g>
  <text x="1140" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">maps hold count(), sum(),</text>
  <text x="1140" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">avg(), min(), max(),</text>
  <text x="1140" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">hist(), lhist(), stats()</text>

  
  <rect x="40" y="840" width="1520" height="255" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="64" y="855" width="1472" height="68" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(84, 871)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="16"/>
    <line x1="10" y1="18" x2="26" y2="18"/>
    <polyline points="20,12 26,18 20,24"/>
  </g>
  <text x="140" y="897" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">kprobe:tcp_sendmsg { @send_bytes[comm] = hist(arg2); }</text>
  <text x="960" y="897" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">is the send size distribution</text>

  
  <rect x="64" y="935" width="1472" height="68" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(84, 951)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="16"/>
    <line x1="26" y1="18" x2="10" y2="18"/>
    <polyline points="16,12 10,18 16,24"/>
  </g>
  <text x="140" y="977" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">kretprobe:tcp_recvmsg /retval &gt; 0/ { @recv[comm] = sum(retval); }</text>
  <text x="1100" y="977" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">is bytes received per process</text>

  
  <rect x="64" y="1015" width="1472" height="70" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  
  <g transform="translate(84, 1032)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 4 L32 9 L32 18 C32 28 18 34 18 34 C18 34 4 28 4 18 L4 9 Z"/>
  </g>
  <text x="140" y="1045" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">uprobe:/usr/lib/x86_64-linux-gnu/libssl.so.3:SSL_write</text>
  <text x="140" y="1073" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">{ @[comm] = count(); } <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="normal" fill="#303a36">is TLS writes per process</tspan></text>

  
  <rect x="40" y="1115" width="1520" height="60" rx="12" fill="#207448"/>
  <text x="800" y="1153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">You can read the whole thing in one breath</text>
</svg>