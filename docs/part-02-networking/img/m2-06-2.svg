<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The handshake, data transfer and teardown</title>
  <desc>Sequence diagram illustrating TCP handshake, data transfer, and connection teardown between Client and Server.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 13 7 L 1 12 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The handshake, data transfer and teardown</text>

  
  <line x1="250" y1="170" x2="250" y2="1165" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1350" y1="170" x2="1350" y2="1165" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

  
  <g>
    <rect x="70" y="55" width="360" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="222" y="67" width="56" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="222" y1="79" x2="278" y2="79" stroke="#207448" stroke-width="3" />
    <circle cx="231" cy="73" r="2" fill="#207448" />
    <circle cx="238" cy="73" r="2" fill="#207448" />
    <circle cx="245" cy="73" r="2" fill="#207448" />
    <line x1="250" y1="105" x2="250" y2="113" stroke="#207448" stroke-width="4" />
    <line x1="238" y1="113" x2="262" y2="113" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="250" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Client (CLOSED)</text>
  </g>

  
  <g>
    <rect x="1170" y="55" width="360" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1322" y="67" width="56" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="1333" cy="76" r="2.5" fill="#207448" />
    <line x1="1344" y1="76" x2="1368" y2="76" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <rect x="1322" y="89" width="56" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="1333" cy="98" r="2.5" fill="#207448" />
    <line x1="1344" y1="98" x2="1368" y2="98" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="1350" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Server (LISTEN)</text>
  </g>

  
  <g>
    <rect x="290" y="180" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="225" r="24" fill="#207448" />
    <text x="335" y="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="835" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">SYN seq=x, MSS, WS, SACK-perm, TS</text>
    <text x="835" y="247" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(client → SYN_SENT)</text>
    <circle cx="250" cy="286" r="5" fill="#207448" />
    <line x1="250" y1="286" x2="1350" y2="286" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="290" y="304" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="349" r="24" fill="#207448" />
    <text x="335" y="349" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="835" y="339" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">SYN+ACK seq=y ack=x+1, options</text>
    <text x="835" y="371" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(server → SYN_RCVD)</text>
    <circle cx="1350" cy="410" r="5" fill="#207448" />
    <line x1="1350" y1="410" x2="250" y2="410" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="290" y="428" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="473" r="24" fill="#207448" />
    <text x="335" y="473" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="835" y="463" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">ACK ack=y+1</text>
    <text x="835" y="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(client → ESTABLISHED, server → ESTABLISHED)</text>
    <circle cx="250" cy="534" r="5" fill="#207448" />
    <line x1="250" y1="534" x2="1350" y2="534" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="220" y="552" width="1160" height="90" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <text x="800" y="605" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">data: segments with seq, ACKs cumulative / selective</text>
  </g>

  
  <g>
    <rect x="290" y="660" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="705" r="24" fill="#207448" />
    <text x="335" y="705" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="835" y="695" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">FIN seq=m</text>
    <text x="835" y="727" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(client → FIN_WAIT_1)</text>
    <circle cx="250" cy="766" r="5" fill="#207448" />
    <line x1="250" y1="766" x2="1350" y2="766" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="290" y="784" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="829" r="24" fill="#207448" />
    <text x="335" y="829" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="835" y="819" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">ACK</text>
    <text x="835" y="851" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(client → FIN_WAIT_2, server → CLOSE_WAIT)</text>
    <circle cx="1350" cy="890" r="5" fill="#207448" />
    <line x1="1350" y1="890" x2="250" y2="890" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="290" y="908" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="953" r="24" fill="#207448" />
    <text x="335" y="953" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    <text x="835" y="943" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">FIN</text>
    <text x="835" y="975" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(server → LAST_ACK)</text>
    <circle cx="1350" cy="1014" r="5" fill="#207448" />
    <line x1="1350" y1="1014" x2="250" y2="1014" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>

  
  <g>
    <rect x="290" y="1032" width="1020" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="335" cy="1077" r="24" fill="#207448" />
    <text x="335" y="1077" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    <text x="835" y="1067" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">ACK</text>
    <text x="835" y="1099" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(client → TIME_WAIT for 2×MSL = 60 s on Linux, server → CLOSED)</text>
    <circle cx="250" cy="1138" r="5" fill="#207448" />
    <line x1="250" y1="1138" x2="1350" y2="1138" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  </g>
</svg>