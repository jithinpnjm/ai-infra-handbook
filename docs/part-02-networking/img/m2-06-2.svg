<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The handshake, data transfer and teardown</title>
  <desc>Sequence diagram illustrating TCP connection handshake, data transfer, and connection teardown between Client and Server with state transitions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">The handshake, data transfer and teardown</text>

  
  <rect x="120" y="95" width="400" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <rect x="140" y="108" width="46" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="163" y1="140" x2="163" y2="148" stroke="#207448" stroke-width="3.5" />
  <line x1="151" y1="148" x2="175" y2="148" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <line x1="148" y1="124" x2="167" y2="124" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <text x="345" y="143" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Client (CLOSED)</text>

  
  <rect x="1080" y="95" width="400" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <rect x="1100" y="108" width="46" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="1100" y1="128" x2="1146" y2="128" stroke="#207448" stroke-width="3" />
  <line x1="1108" y1="118" x2="1128" y2="118" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="1136" cy="118" r="2.5" fill="#207448" />
  <line x1="1108" y1="138" x2="1128" y2="138" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="1136" cy="138" r="2.5" fill="#207448" />
  <text x="1305" y="143" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Server (LISTEN)</text>

  
  <line x1="320" y1="170" x2="320" y2="1165" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 8" stroke-opacity="0.35" />
  <line x1="1280" y1="170" x2="1280" y2="1165" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 8" stroke-opacity="0.35" />

  
  <circle cx="320" cy="215" r="24" fill="#207448" />
  <text x="320" y="215" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">1</text>
  <line x1="344" y1="215" x2="1280" y2="215" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="228" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="256" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">SYN seq=x, MSS, WS, SACK-perm, TS</text>
  <text x="800" y="286" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(client → SYN_SENT)</text>

  
  <circle cx="1280" cy="335" r="24" fill="#207448" />
  <text x="1280" y="335" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">2</text>
  <line x1="1256" y1="335" x2="320" y2="335" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="348" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="376" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">SYN+ACK seq=y ack=x+1, options</text>
  <text x="800" y="406" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(server → SYN_RCVD)</text>

  
  <circle cx="320" cy="455" r="24" fill="#207448" />
  <text x="320" y="455" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">3</text>
  <line x1="344" y1="455" x2="1280" y2="455" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="468" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="496" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">ACK ack=y+1</text>
  <text x="800" y="526" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(client → ESTABLISHED, server → ESTABLISHED)</text>

  
  <rect x="240" y="565" width="1120" height="76" rx="10" fill="#fffdfa" stroke="#db8129" stroke-width="3" />
  <text x="800" y="613" text-anchor="middle" font-size="30" font-weight="bold" fill="#db8129" font-family="sans-serif">data: segments with seq, ACKs cumulative / selective</text>

  
  <circle cx="320" cy="680" r="24" fill="#207448" />
  <text x="320" y="680" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">4</text>
  <line x1="344" y1="680" x2="1280" y2="680" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="693" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="721" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">FIN seq=m</text>
  <text x="800" y="751" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(client → FIN_WAIT_1)</text>

  
  <circle cx="1280" cy="800" r="24" fill="#207448" />
  <text x="1280" y="800" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">5</text>
  <line x1="1256" y1="800" x2="320" y2="800" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="813" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="841" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">ACK</text>
  <text x="800" y="871" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(client → FIN_WAIT_2, server → CLOSE_WAIT)</text>

  
  <circle cx="1280" cy="920" r="24" fill="#207448" />
  <text x="1280" y="920" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">6</text>
  <line x1="1256" y1="920" x2="320" y2="920" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="400" y="933" width="800" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="961" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">FIN</text>
  <text x="800" y="991" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(server → LAST_ACK)</text>

  
  <circle cx="320" cy="1040" r="24" fill="#207448" />
  <text x="320" y="1040" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">7</text>
  <line x1="344" y1="1040" x2="1280" y2="1040" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="360" y="1053" width="880" height="102" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="1081" text-anchor="middle" font-size="24" fill="#303a36" font-family="monospace">ACK</text>
  <text x="800" y="1111" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">(client → TIME_WAIT for 2×MSL = 60 s on Linux,</text>
  <text x="800" y="1141" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">server → CLOSED)</text>
</svg>