<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Why web load balancing assumptions fail for LLM serving: five differences</title>
  <desc>Infographic comparing five fundamental differences between web and LLM load balancing, illustrating failure modes and modern architectural responses.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#207448">Why web load balancing assumptions fail for LLM serving: five differences</text>

  
  
  <rect x="40" y="100" width="740" height="310" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(60, 114)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14" />
    <polyline points="16 8 16 16 22 16" />
    <path d="M 34 10 Q 38 16 34 22" />
  </g>

  
  <text x="112" y="138" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">1 Requests are long, variable and somewhat stateful</text>

  
  <rect x="64" y="160" width="692" height="78" rx="8" fill="#fff6ed" stroke="#db8129" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="84" y="193">every health check green, average latency fine, one replica</tspan>
    <tspan x="84" y="223">buried under long generations while the others sit idle</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" y="272">a request may stream tokens for minutes; cost varies by</tspan>
    <tspan x="64" y="302">orders of magnitude with prompt and output length; the</tspan>
    <tspan x="64" y="332">real load is queue depth, running sequences and</tspan>
    <tspan x="64" y="362">KV-cache occupancy, not connection count</tspan>
  </text>

  
  <line x1="780" y1="255" x2="856" y2="255" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="860" y="100" width="700" height="310" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="892" y="180">Balance per request, not per connection</tspan>
    <tspan x="892" y="214">(Envoy, HAProxy, nginx grpc_pass,</tspan>
    <tspan x="892" y="248">Gateway API inference extensions,</tspan>
    <tspan x="892" y="282">or client-side)</tspan>
  </text>

  
  
  <rect x="40" y="425" width="740" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(60, 442)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="14" r="6" />
    <circle cx="30" cy="14" r="6" />
    <line x1="14" y1="14" x2="24" y2="14" />
    <path d="M 8 20 L 8 28 M 30 20 L 30 28" />
  </g>

  
  <text x="112" y="466" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">2 Connections are long-lived</text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" y="512">HTTP/2 and gRPC streams and SSE hold resources; reloads,</tspan>
    <tspan x="64" y="546">scale-in and deploys must drain gracefully; an idle</tspan>
    <tspan x="64" y="580">timeout at any hop can cut a slow generation</tspan>
  </text>

  
  <line x1="780" y1="532" x2="856" y2="532" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="860" y="425" width="700" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="892" y="466">load signal: least-outstanding-requests baseline,</tspan>
    <tspan x="892" y="498">better backend-reported running and waiting</tspan>
    <tspan x="892" y="530">requests, KV-cache usage and estimated tokens</tspan>
    <tspan x="892" y="562">(Prometheus, headers, ORCA-style load</tspan>
    <tspan x="892" y="594">reports), P2C over load</tspan>
  </text>

  
  
  <rect x="40" y="655" width="740" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(60, 672)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="12" height="12" rx="2" />
    <rect x="20" y="4" width="12" height="12" rx="2" />
    <rect x="4" y="20" width="12" height="12" rx="2" fill="#207448" fill-opacity="0.3" />
    <rect x="20" y="20" width="12" height="12" rx="2" />
  </g>

  
  <text x="112" y="696" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">3 Cache locality matters</text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" y="736">prefix caching for system prompts, RAG context and</tspan>
    <tspan x="64" y="766">multi-turn chat makes a request cheaper on the replica</tspan>
    <tspan x="64" y="796">that already holds its prefix KV blocks; same session or</tspan>
    <tspan x="64" y="826">prefix to the same replica raises hit rates,</tspan>
    <tspan x="64" y="856">pure affinity creates hot spots</tspan>
  </text>

  
  <line x1="780" y1="770" x2="856" y2="770" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="860" y="655" width="700" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="892" y="730">cache-aware: consistent hashing on session ID</tspan>
    <tspan x="892" y="766">or prefix hash with bounded loads, or a router</tspan>
    <tspan x="892" y="802">tracking which replica holds which prefix blocks</tspan>
  </text>

  
  
  <rect x="40" y="900" width="740" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(60, 917)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="22" height="22" rx="3" />
    <rect x="13" y="13" width="12" height="12" />
    <line x1="14" y1="3" x2="14" y2="8" />
    <line x1="24" y1="3" x2="24" y2="8" />
    <line x1="14" y1="30" x2="14" y2="35" />
    <line x1="24" y1="30" x2="24" y2="35" />
    <line x1="3" y1="14" x2="8" y2="14" />
    <line x1="3" y1="24" x2="8" y2="24" />
    <line x1="30" y1="14" x2="35" y2="14" />
    <line x1="30" y1="24" x2="35" y2="24" />
  </g>

  
  <text x="112" y="941" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">4 Backends are expensive and heterogeneous</text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" y="985">GPU types, tensor-parallel group sizes,</tspan>
    <tspan x="64" y="1020">disaggregated prefill and decode pools,</tspan>
    <tspan x="64" y="1055">LoRA adapters per replica, quantised variants</tspan>
  </text>

  
  <line x1="780" y1="1007" x2="856" y2="1007" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="860" y="900" width="700" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="892" y="975">disaggregated: route prefill and decode to</tspan>
    <tspan x="892" y="1012">separate pools, handle the KV transfer,</tspan>
    <tspan x="892" y="1049">couple the autoscaling and admission</tspan>
  </text>

  
  
  <rect x="40" y="1130" width="740" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(60, 1147)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 26 A 14 14 0 1 1 30 26" />
    <line x1="18" y1="18" x2="26" y2="12" />
    <circle cx="18" cy="18" r="2" fill="#207448" />
  </g>

  
  <text x="112" y="1171" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">5 Autoscaling is slow</text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="64" y="1225">GPU nodes and model loads take minutes, so the</tspan>
    <tspan x="64" y="1265">router must absorb bursts by queueing or shedding</tspan>
  </text>

  
  <line x1="780" y1="1240" x2="856" y2="1240" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="860" y="1130" width="700" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="892" y="1176">overload: per-tenant concurrency and</tspan>
    <tspan x="892" y="1210">token-rate limits, priority queues separating</tspan>
    <tspan x="892" y="1244">interactive from batch, 429 or 503 early,</tspan>
    <tspan x="892" y="1278">KV-cache headroom in admission control</tspan>
  </text>

  
  <rect x="40" y="1375" width="1520" height="70" rx="10" fill="#207448" />
  <text x="800" y="1419" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Measure first, and choose the load signal before you choose the algorithm</text>
</svg>