<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The incident workflow</title>
  <desc>Seven-step incident workflow with side notes on troubleshooting strategy.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="60" y="78" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The incident workflow</text>

  
  <rect x="60" y="120" width="1000" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="182" r="24" fill="#207448"/>
  <text x="104" y="191" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(152, 154)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 6 L 44 6 C 44 26 36 44 28 50 C 20 44 12 26 12 6 Z"/>
    <line x1="28" y1="18" x2="28" y2="34"/>
    <line x1="20" y1="26" x2="36" y2="26"/>
  </g>
  <text x="236" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">stabilise and scope</text>
  <text x="236" y="196" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="236" dy="0">(who is affected, since when, what changed,</tspan>
    <tspan x="236" dy="28">name an incident lead)</tspan>
  </text>

  
  <line x1="104" y1="245" x2="104" y2="270" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="270" width="1000" height="145" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  <circle cx="104" cy="342" r="24" fill="#db8129"/>
  <text x="104" y="351" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(152, 314)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="8,10 8,46 48,46"/>
    <polyline points="8,40 20,36 32,16 48,16"/>
    <circle cx="32" cy="16" r="3" fill="#db8129"/>
  </g>
  <text x="236" y="315" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">define the symptom in measurable terms</text>
  <text x="236" y="352" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="236" dy="0">(example: rank 37 to rank 112 all-reduce latency</tspan>
    <tspan x="236" dy="32">rose from 1.2 ms to 40 ms starting 02:13)</tspan>
  </text>

  
  <line x1="104" y1="415" x2="104" y2="440" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="440" width="1000" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="497" r="24" fill="#207448"/>
  <text x="104" y="506" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(152, 469)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="28" r="4" fill="#207448"/>
    <line x1="16" y1="28" x2="28" y2="28"/>
    <path d="M 28 28 L 44 14"/>
    <path d="M 28 28 L 44 28"/>
    <path d="M 28 28 L 44 42"/>
    <circle cx="44" cy="14" r="3" fill="#207448"/>
    <circle cx="44" cy="28" r="3" fill="#207448"/>
    <circle cx="44" cy="42" r="3" fill="#207448"/>
  </g>
  <text x="236" y="482" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="236" dy="0">form hypotheses,</tspan>
    <tspan x="236" dy="38">rank by likelihood and cost of testing</tspan>
  </text>

  
  <line x1="104" y1="555" x2="104" y2="580" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="580" width="1000" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="637" r="24" fill="#207448"/>
  <text x="104" y="646" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(152, 609)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="28" x2="50" y2="28"/>
    <line x1="28" y1="12" x2="28" y2="44"/>
    <polyline points="20,20 28,12 36,20"/>
    <polyline points="20,36 28,44 36,36"/>
    <circle cx="14" cy="28" r="3" fill="#207448"/>
    <circle cx="42" cy="28" r="3" fill="#207448"/>
  </g>
  <text x="236" y="622" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="236" dy="0">half-split along the signal path</tspan>
    <tspan x="236" dy="38">and collect evidence</tspan>
  </text>

  
  <line x1="104" y1="695" x2="104" y2="720" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="720" width="1000" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="777" r="24" fill="#207448"/>
  <text x="104" y="786" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <g transform="translate(152, 749)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="10" y1="16" x2="46" y2="16"/>
    <line x1="10" y1="28" x2="46" y2="28"/>
    <line x1="10" y1="40" x2="46" y2="40"/>
    <circle cx="34" cy="16" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="20" cy="28" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="38" cy="40" r="4.5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="236" y="762" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="236" dy="0">manipulate to confirm the cause,</tspan>
    <tspan x="236" dy="38">simplify</tspan>
  </text>

  
  <line x1="104" y1="835" x2="104" y2="860" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="860" width="1000" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="917" r="24" fill="#207448"/>
  <text x="104" y="926" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <g transform="translate(152, 889)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 14 42 L 30 26"/>
    <path d="M 28 20 C 27 15 31 10 36 10 C 38 12 38 16 36 18 L 38 20 L 44 20 C 44 24 40 28 36 28 C 34 28 32 27 30 26"/>
    <polyline points="24,40 32,48 48,32"/>
  </g>
  <text x="236" y="902" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="236" dy="0">apply the immediate fix,</tspan>
    <tspan x="236" dy="38">verify with the purpose metric</tspan>
  </text>

  
  <line x1="104" y1="975" x2="104" y2="1000" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="60" y="1000" width="1000" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="104" cy="1050" r="24" fill="#207448"/>
  <text x="104" y="1059" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <g transform="translate(152, 1022)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="28,14 48,24 28,34 8,24"/>
    <path d="M 16 28 L 16 38 C 16 44 40 44 40 38 L 40 28"/>
    <path d="M 44 24 L 44 38"/>
  </g>
  <text x="236" y="1060" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">permanent fix and learning</text>

  
  <rect x="1090" y="475" width="450" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1115, 522)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="14" x2="32" y2="14"/>
    <line x1="8" y1="28" x2="32" y2="28"/>
    <line x1="8" y1="42" x2="32" y2="42"/>
    <line x1="44" y1="12" x2="44" y2="44"/>
    <polyline points="38,36 44,44 50,36"/>
  </g>
  <text x="1195" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1195" dy="0">top-down when only</tspan>
    <tspan x="1195" dy="32">one application</tspan>
    <tspan x="1195" dy="32">misbehaves</tspan>
  </text>

  
  <rect x="1090" y="655" width="450" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1115, 702)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="14" x2="32" y2="14"/>
    <line x1="8" y1="28" x2="32" y2="28"/>
    <line x1="8" y1="42" x2="32" y2="42"/>
    <line x1="44" y1="44" x2="44" y2="12"/>
    <polyline points="38,20 44,12 50,20"/>
  </g>
  <text x="1195" y="710" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1195" dy="0">bottom-up when many</tspan>
    <tspan x="1195" dy="32">things fail or after</tspan>
    <tspan x="1195" dy="32">a hardware change</tspan>
  </text>
</svg>