<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Read the first line of ip addr: flags, MTU and qdisc, then the address lines</title>
  <desc>Visual breakdown of ip addr output showing interface flags, MTU, queueing discipline, operational state, MAC address, IPv4 address, and address lease lifetime.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <marker id="dot-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#207448" />
    </marker>
    <marker id="dot-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Read the first line of ip addr:</tspan>
    <tspan x="800" dy="54">flags, MTU and qdisc, then the address lines</tspan>
  </text>

  
  <rect x="60" y="145" width="1480" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(75, 153)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="46" height="54" rx="6" fill="#e8f1ea"/>
    <path d="M 10 18 L 22 27 L 10 36"/>
    <line x1="24" y1="36" x2="36" y2="36"/>
  </g>

  
  <text x="140" y="189" font-family="monospace" font-size="24" fill="#303a36" xml:space="preserve">2: enp0s31f6: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc fq_codel state UP</text>

  
  <rect x="655" y="160" width="36" height="38" rx="4" fill="#207448" fill-opacity="0.12" stroke="#207448" stroke-width="1.5"/>
  <rect x="697" y="160" width="126" height="38" rx="4" fill="#db8129" fill-opacity="0.15" stroke="#db8129" stroke-width="2"/>
  <rect x="846" y="160" width="128" height="38" rx="4" fill="#207448" fill-opacity="0.12" stroke="#207448" stroke-width="1.5"/>
  <rect x="980" y="160" width="216" height="38" rx="4" fill="#207448" fill-opacity="0.12" stroke="#207448" stroke-width="1.5"/>
  <rect x="1205" y="160" width="128" height="38" rx="4" fill="#207448" fill-opacity="0.12" stroke="#207448" stroke-width="1.5"/>

  
  
  <path d="M 673 198 L 673 240 L 270 240 L 270 265" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  <path d="M 715 198 L 715 445" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" marker-start="url(#dot-orange)" marker-end="url(#arrow-orange)"/>

  
  <path d="M 910 198 L 910 265" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  <path d="M 1110 198 L 1110 445" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  <path d="M 1269 198 L 1269 265" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  
  <g>
    <rect x="60" y="265" width="420" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(75, 307)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="16"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="28" y1="44" x2="28" y2="52"/>
      <line x1="4" y1="28" x2="12" y2="28"/>
      <line x1="44" y1="28" x2="52" y2="28"/>
      <line x1="11" y1="11" x2="17" y2="17"/>
      <line x1="39" y1="39" x2="45" y2="45"/>
      <line x1="11" y1="45" x2="17" y2="39"/>
      <line x1="39" y1="17" x2="45" y2="11"/>
    </g>
    <text x="146" y="325" font-family="sans-serif" fill="#303a36">
      <tspan x="146" dy="0" font-size="30" font-weight="bold">UP: </tspan>
      <tspan font-size="24">enabled in</tspan>
      <tspan x="146" dy="36" font-size="24">software (admin)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="750" y="265" width="320" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(882, 274)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="6" y="6" width="44" height="28" rx="4"/>
      <line x1="2" y1="20" x2="54" y2="20"/>
      <polyline points="8,15 2,20 8,25"/>
      <polyline points="48,15 54,20 48,25"/>
    </g>
    <text x="780" y="332" font-family="sans-serif" fill="#303a36">
      <tspan x="780" dy="0" font-size="30" font-weight="bold">mtu 1500:</tspan>
      <tspan x="780" dy="30" font-size="24">largest packet the</tspan>
      <tspan x="780" dy="28" font-size="24">interface accepts</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1150" y="265" width="390" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1165, 307)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="12,28 20,28 25,16 31,40 36,28 44,28"/>
    </g>
    <text x="1234" y="325" font-family="sans-serif" fill="#303a36">
      <tspan x="1234" dy="0" font-size="30" font-weight="bold">state UP: </tspan>
      <tspan font-size="24">the</tspan>
      <tspan x="1234" dy="36" font-size="24">operational state</tspan>
    </text>
  </g>

  
  
  <g>
    <rect x="60" y="445" width="860" height="120" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <g transform="translate(75, 477)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4"/>
      <path d="M 16 48 L 16 36 L 40 36 L 40 48"/>
      <line x1="22" y1="18" x2="22" y2="28"/>
      <line x1="28" y1="18" x2="28" y2="28"/>
      <line x1="34" y1="18" x2="34" y2="28"/>
    </g>
    <text x="148" y="480" font-family="sans-serif" fill="#303a36">
      <tspan x="148" dy="0" font-size="30" font-weight="bold" fill="#db8129">LOWER_UP: </tspan>
      <tspan font-size="24">carrier detected,</tspan>
      <tspan x="148" dy="32" font-size="24">the cable and switch are live.</tspan>
      <tspan x="148" dy="32" font-size="24">NO-CARRIER means no link</tspan>
    </text>
  </g>

  
  <g>
    <rect x="980" y="445" width="560" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(995, 477)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="36" height="10" rx="2"/>
      <rect x="6" y="24" width="36" height="10" rx="2"/>
      <rect x="6" y="38" width="36" height="10" rx="2"/>
      <path d="M 46 29 L 54 29"/>
      <polyline points="50,23 56,29 50,35"/>
    </g>
    <text x="1068" y="495" font-family="sans-serif" fill="#303a36">
      <tspan x="1068" dy="0" font-size="30" font-weight="bold">qdisc fq_codel: </tspan>
      <tspan font-size="24">egress scheduler</tspan>
    </text>
  </g>

  
  
  <g>
    <rect x="60" y="605" width="500" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <rect x="75" y="620" width="470" height="95" rx="6" fill="#e8f1ea"/>
    <text x="80" y="675" font-family="monospace" font-size="24" fill="#303a36">link/ether 40:8d:5c:fc:24:1f</text>

    <rect x="75" y="750" width="470" height="95" rx="6" fill="#e8f1ea"/>
    <text x="80" y="805" font-family="monospace" font-size="24" fill="#303a36">inet 10.23.2.4/24 scope global</text>
  </g>

  
  <line x1="560" y1="667" x2="600" y2="667" stroke="#207448" stroke-width="3" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>
  <line x1="560" y1="797" x2="600" y2="797" stroke="#207448" stroke-width="3" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  <g>
    <rect x="600" y="605" width="430" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(615, 632)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="4"/>
      <circle cx="28" cy="28" r="8"/>
      <line x1="18" y1="4" x2="18" y2="10"/>
      <line x1="38" y1="4" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="52"/>
      <line x1="38" y1="46" x2="38" y2="52"/>
    </g>
    <text x="688" y="672" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">MAC address</text>
  </g>

  
  <g>
    <rect x="600" y="755" width="430" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(615, 782)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="22"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <ellipse cx="28" cy="28" rx="11" ry="22"/>
    </g>
    <text x="688" y="792" font-family="sans-serif" fill="#303a36">
      <tspan x="688" dy="0" font-size="30" font-weight="bold">IPv4 address</tspan>
      <tspan x="688" dy="28" font-size="24">and prefix length,</tspan>
      <tspan x="688" dy="28" font-size="24">scope global</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="905" width="500" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <rect x="75" y="920" width="470" height="100" rx="6" fill="#e8f1ea"/>
    <text x="80" y="980" font-family="monospace" font-size="24" fill="#303a36">valid_lft 86054sec</text>
  </g>

  
  <line x1="560" y1="970" x2="600" y2="970" stroke="#207448" stroke-width="3" marker-start="url(#dot-green)" marker-end="url(#arrow-green)"/>

  
  <g>
    <rect x="600" y="905" width="430" height="130" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(615, 942)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28,14 28,28 38,28"/>
    </g>
    <text x="688" y="948" font-family="sans-serif" fill="#303a36">
      <tspan x="688" dy="0" font-size="30" font-weight="bold">lifetime: </tspan>
      <tspan x="688" dy="30" font-size="24">DHCP and SLAAC</tspan>
      <tspan x="688" dy="30" font-size="24">addresses expire</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1080" y="605" width="460" height="430" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1110, 635)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4"/>
      <line x1="16" y1="48" x2="16" y2="36"/>
      <line x1="40" y1="48" x2="40" y2="36"/>
      <line x1="14" y1="14" x2="42" y2="42"/>
    </g>
    <text x="1110" y="750" font-family="sans-serif" fill="#303a36">
      <tspan x="1110" dy="0" font-size="30" font-weight="bold">UP without LOWER_UP:</tspan>
      <tspan x="1110" dy="44" font-size="24">the port is enabled, but</tspan>
      <tspan x="1110" dy="44" font-size="24">no cable or far-side</tspan>
      <tspan x="1110" dy="44" font-size="24">link is live.</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="1075" width="1480" height="80" rx="10" fill="#207448"/>
    <text x="800" y="1125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Read the link line first, then the address lines.</text>
  </g>

</svg>