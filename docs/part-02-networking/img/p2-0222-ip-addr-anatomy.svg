<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Read the first line of ip addr: flags, MTU and qdisc, then the address lines</title>
  <desc>Visual anatomy of ip addr command output showing flags, MTU, qdisc, operational state, MAC address, IPv4 address, and address lifetimes.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#61756c" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    Read the first line of ip addr: flags, MTU and qdisc,
  </text>
  <text x="800" y="110" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">
    then the address lines
  </text>

  
  
  <rect x="60" y="160" width="1480" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

  <text x="110" y="208" font-family="monospace" font-size="25" fill="#303a36" textLength="1380" lengthAdjust="spacing">
    2: enp0s31f6: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc fq_codel state UP
  </text>

  
  
  <path d="M 746 236 L 746 252 L 165 252 L 165 284" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <path d="M 854 236 L 854 266 L 510 266 L 510 284" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <path d="M 1033 236 L 1033 278 L 890 278 L 890 284" fill="none" stroke="#61756c" stroke-width="2" marker-end="url(#arrow-gray)" />

  
  <path d="M 1248 236 L 1248 266 L 1160 266 L 1160 284" fill="none" stroke="#61756c" stroke-width="2" marker-end="url(#arrow-gray)" />

  
  <path d="M 1463 236 L 1463 252 L 1415 252 L 1415 284" fill="none" stroke="#61756c" stroke-width="2" marker-end="url(#arrow-gray)" />

  
  
  <rect x="60" y="290" width="210" height="150" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="80" y="352" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">UP: enabled in</text>
  <text x="80" y="388" font-family="sans-serif" font-size="24" fill="#303a36">software (admin)</text>

  
  <rect x="285" y="290" width="450" height="150" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="305" y="338" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">LOWER_UP: carrier detected,</text>
  <text x="305" y="372" font-family="sans-serif" font-size="24" fill="#303a36">the cable and switch are live.</text>
  <text x="305" y="406" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NO-CARRIER means no link</text>

  
  <rect x="750" y="290" width="280" height="150" rx="8" fill="#e8f1ea" stroke="#b2ccb9" stroke-width="2" />
  <text x="772" y="338" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">mtu 1500: largest</text>
  <text x="772" y="372" font-family="sans-serif" font-size="24" fill="#303a36">packet the</text>
  <text x="772" y="406" font-family="sans-serif" font-size="24" fill="#303a36">interface accepts</text>

  
  <rect x="1045" y="290" width="230" height="150" rx="8" fill="#e8f1ea" stroke="#b2ccb9" stroke-width="2" />
  <text x="1065" y="352" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">qdisc fq_codel:</text>
  <text x="1065" y="388" font-family="sans-serif" font-size="24" fill="#303a36">egress scheduler</text>

  
  <rect x="1290" y="290" width="250" height="150" rx="8" fill="#e8f1ea" stroke="#b2ccb9" stroke-width="2" />
  <text x="1310" y="352" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">state UP: the</text>
  <text x="1310" y="388" font-family="sans-serif" font-size="24" fill="#303a36">operational state</text>

  
  <rect x="60" y="475" width="1480" height="75" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="2" stroke-dasharray="8 5" />
  <circle cx="100" cy="512" r="18" fill="#db8129" />
  <path d="M 100 500 L 100 514 M 100 520 L 100 524" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="135" y="521" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    UP without LOWER_UP: the port is enabled, but no cable or far-side link is live.
  </text>

  
  
  <rect x="60" y="585" width="640" height="195" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

  <text x="90" y="648" font-family="monospace" font-size="26" fill="#303a36">link/ether 40:8d:5c:fc:24:1f</text>
  <line x1="80" y1="682" x2="680" y2="682" stroke="#e8f1ea" stroke-width="2" />
  <text x="90" y="742" font-family="monospace" font-size="26" fill="#303a36">inet 10.23.2.4/24 scope global</text>

  
  
  <path d="M 700 640 L 774 640" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="780" y="605" width="760" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="810" y="649" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">MAC address</text>

  
  <path d="M 700 735 L 774 735" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="780" y="700" width="760" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="810" y="744" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">IPv4 address and prefix length, scope global</text>

  
  <rect x="60" y="815" width="640" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="90" y="868" font-family="monospace" font-size="26" fill="#303a36">valid_lft 86054sec</text>

  
  <path d="M 700 857 L 774 857" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="780" y="815" width="760" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="810" y="867" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">lifetime: DHCP and SLAAC addresses expire</text>

  
  <rect x="60" y="940" width="1480" height="80" rx="10" fill="#207448" />
  <text x="800" y="991" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
    Read the link line first, then the address lines.
  </text>
</svg>