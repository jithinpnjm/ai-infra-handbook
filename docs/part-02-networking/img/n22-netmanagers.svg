<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Who configures the network</title>
  <desc>Visual architecture diagram illustrating network configuration flows from cloud-init and Netplan to NetworkManager and systemd-networkd, alongside legacy ifupdown and udev interface naming rules.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Who configures the network</text>

  

  
  <rect x="60" y="120" width="940" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <path d="M 100 190 A 18 18 0 0 1 114 166 A 24 24 0 0 1 156 163 A 20 20 0 0 1 174 190 A 16 16 0 0 1 168 212 L 106 212 A 16 16 0 0 1 100 190 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  
  
  <text x="195" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">cloud-init</text>
  <text x="195" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">generates Netplan, NM or networkd config from metadata</text>

  
  <path d="M 530 260 L 530 326" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="330" width="940" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <path d="M 110 375 L 146 375 L 166 395 L 166 445 L 110 445 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <path d="M 146 375 L 146 395 L 166 395" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <line x1="122" y1="408" x2="140" y2="408" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="130" y1="420" x2="154" y2="420" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="130" y1="432" x2="148" y2="432" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <text x="195" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Netplan</text>
  <text x="195" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">YAML in <tspan font-family="monospace">/etc/netplan/*.yaml;</tspan></text>
  <text x="195" y="460" font-family="monospace" font-size="24" fill="#303a36">netplan try/apply/generate</text>

  
  <line x1="530" y1="490" x2="530" y2="512" stroke="#207448" stroke-width="4" />
  <text x="530" y="534" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">renders to</text>
  <line x1="530" y1="544" x2="530" y2="560" stroke="#207448" stroke-width="4" />
  <path d="M 530 560 L 285 560 L 285 616" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 530 560 L 775 560 L 775 616" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="620" width="450" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="85" y="650" width="56" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="93" y="668" width="9" height="9" rx="1" fill="#207448" />
  <rect x="109" y="668" width="9" height="9" rx="1" fill="#207448" />
  <rect x="124" y="668" width="9" height="9" rx="1" fill="#207448" />
  <circle cx="97" cy="659" r="2.5" fill="#207448" />
  <circle cx="113" cy="659" r="2.5" fill="#207448" />
  <circle cx="128" cy="659" r="2.5" fill="#207448" />

  
  <text x="155" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">NetworkManager</text>
  <text x="85" y="748" font-family="monospace" font-size="24" fill="#303a36">/etc/NetworkManager/</text>
  <text x="85" y="788" font-family="monospace" font-size="24" fill="#303a36">system-connections/,</text>
  <text x="85" y="828" font-family="monospace" font-size="24" fill="#303a36">nmcli</text>

  
  <rect x="550" y="620" width="450" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="605" cy="668" r="12" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 605 644 L 605 650 M 605 686 L 605 692 M 581 668 L 587 668 M 623 668 L 629 668 M 588 651 L 592 655 M 618 681 L 622 685 M 588 685 L 592 681 M 618 655 L 622 651" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="645" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">systemd-networkd</text>
  <text x="580" y="748" font-family="monospace" font-size="24" fill="#303a36">/etc/systemd/network/</text>
  <text x="580" y="788" font-family="monospace" font-size="24" fill="#303a36">*.network,</text>
  <text x="580" y="828" font-family="monospace" font-size="24" fill="#303a36">networkctl</text>

  

  
  <rect x="1050" y="120" width="490" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="1075" y="150" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1094" y1="192" x2="1094" y2="164" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <polyline points="1087,173 1094,164 1101,173" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="1112" y1="164" x2="1112" y2="192" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <polyline points="1105,183 1112,192 1119,183" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  
  <text x="1145" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ifupdown</text>
  <text x="1075" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace">/etc/network/interfaces</tspan>)</text>
  <text x="1075" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">on older Debian</text>

  
  <rect x="1050" y="370" width="490" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="1075" y="405" width="56" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1085" y1="445" x2="1085" y2="453" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1093" y1="445" x2="1093" y2="453" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1101" y1="445" x2="1101" y2="453" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1109" y1="445" x2="1109" y2="453" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1117" y1="445" x2="1117" y2="453" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <rect x="1087" y="417" width="18" height="15" fill="none" stroke="#207448" stroke-width="3" />

  
  <text x="1145" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">udev <tspan font-family="monospace">.link</tspan> files</text>
  <text x="1075" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">pin interface names</text>
  <text x="1075" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace">net.ifnames=0</tspan>)</text>

  
  <rect x="1050" y="620" width="490" height="320" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
  
  
  <path d="M 1113 655 L 1141 705 L 1085 705 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
  <line x1="1113" y1="673" x2="1113" y2="687" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <circle cx="1113" cy="697" r="2.5" fill="#db8129" />

  
  <text x="1155" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">Manual ip changes</text>
  <text x="1085" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">are not persisted:</text>
  <text x="1085" y="815" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">after reboot config lost</text>

</svg>