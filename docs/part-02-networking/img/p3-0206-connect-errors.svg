<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What the client sees when a connection fails, and where to look</title>
  <desc>Infographic explaining connection errors seen by clients, wire reality, and troubleshooting locations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="73" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">
    <tspan x="800" dy="0">What the client sees when a connection fails,</tspan>
    <tspan x="800" dy="54">and where to look</tspan>
  </text>

  
  <g id="left-timeline">
    
    <rect x="40" y="165" width="290" height="285" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="75" y="185" width="30" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <path d="M 70 205 L 110 205 L 105 210 L 75 210 Z" fill="#207448" />
    <line x1="90" y1="215" x2="90" y2="430" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

    <rect x="250" y="185" width="30" height="22" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="255" y1="192" x2="275" y2="192" stroke="#207448" stroke-width="2" />
    <line x1="255" y1="199" x2="275" y2="199" stroke="#207448" stroke-width="2" />
    <line x1="265" y1="215" x2="265" y2="430" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

    
    <line x1="92" y1="380" x2="263" y2="380" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    
    <rect x="65" y="285" width="240" height="60" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="185" y="320" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">SYN then RST</text>

    
    <rect x="40" y="465" width="290" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="75" y="485" width="30" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <path d="M 70 505 L 110 505 L 105 510 L 75 510 Z" fill="#207448" />
    <line x1="90" y1="515" x2="90" y2="1025" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

    <rect x="250" y="485" width="30" height="22" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="255" y1="492" x2="275" y2="492" stroke="#207448" stroke-width="2" />
    <line x1="255" y1="499" x2="275" y2="499" stroke="#207448" stroke-width="2" />
    <line x1="265" y1="515" x2="265" y2="1025" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

    
    <line x1="92" y1="565" x2="263" y2="565" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="92" y1="640" x2="263" y2="640" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    
    <rect x="75" y="693" width="220" height="60" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="185" y="728" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">SYN retried</text>
    <line x1="92" y1="795" x2="263" y2="795" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="92" y1="990" x2="263" y2="990" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  </g>

  
  
  <g id="col1-header">
    <rect x="350" y="165" width="350" height="90" rx="8" fill="#207448" />
    <text x="525" y="202" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">
      <tspan x="525" dy="0">Error the</tspan>
      <tspan x="525" dy="28">client sees</tspan>
    </text>
  </g>

  <g id="col2-header">
    <rect x="720" y="165" width="460" height="90" rx="8" fill="#207448" />
    <text x="950" y="202" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">
      <tspan x="950" dy="0">What actually happened</tspan>
      <tspan x="950" dy="28">on the wire</tspan>
    </text>
  </g>

  <g id="col3-header">
    <rect x="1200" y="165" width="360" height="90" rx="8" fill="#207448" />
    <text x="1380" y="216" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">Where to look</text>
  </g>

  
  <g id="row-1">
    <rect x="350" y="270" width="350" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 505 288 L 545 288 C 545 313, 525 329, 525 331 C 525 329, 505 313, 505 288 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="517" y1="301" x2="533" y2="317" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="533" y1="301" x2="517" y2="317" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="525" y="380" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="525" dy="0">Connection refused</tspan>
      <tspan x="525" dy="32">(ECONNREFUSED)</tspan>
    </text>

    <rect x="720" y="270" width="460" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="950" y="318" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="950" dy="0">a RST came back: host</tspan>
      <tspan x="950" dy="30">reachable, nobody listening</tspan>
      <tspan x="950" dy="30">on that port, or a firewall</tspan>
      <tspan x="950" dy="30">using reject --tcp-reset</tspan>
    </text>

    <rect x="1200" y="270" width="360" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1380" y="348" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="1380" dy="0">the listener: somebody</tspan>
      <tspan x="1380" dy="34">was home and said no</tspan>
    </text>
  </g>

  
  <g id="row-2">
    <rect x="350" y="465" width="350" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="525" cy="507" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="525,493 525,507 537,507" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="525" y="575" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="525" dy="0">Connection timed out</tspan>
      <tspan x="525" dy="32">(ETIMEDOUT)</tspan>
    </text>

    <rect x="720" y="465" width="460" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="950" y="502" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="950" dy="0">no reply to the SYNs, retried</tspan>
      <tspan x="950" dy="28">with exponential backoff</tspan>
      <tspan x="950" dy="28">1, 2, 4 seconds and so on;</tspan>
      <tspan x="950" dy="28">tcp_syn_retries=6 gives</tspan>
      <tspan x="950" dy="28">about 127 seconds</tspan>
    </text>

    
    <rect x="1200" y="465" width="360" height="180" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="3" />
    <text x="1380" y="502" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="1380" dy="0">route and firewall</tspan>
      <tspan x="1380" dy="28">or security group,</tspan>
      <tspan x="1380" dy="28">host down: nobody</tspan>
      <tspan x="1380" dy="28">answered the door</tspan>
      <tspan x="1380" dy="28">at all</tspan>
    </text>
  </g>

  
  <g id="row-3">
    <rect x="350" y="660" width="350" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="505" y="682" width="40" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="515" cy="694" r="3" fill="#207448" />
    <circle cx="525" cy="694" r="3" fill="#207448" />
    <circle cx="535" cy="694" r="3" fill="#207448" />
    <line x1="513" y1="682" x2="513" y2="674" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="537" y1="682" x2="537" y2="674" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="525" y="755" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="525" dy="0">No route to host</tspan>
      <tspan x="525" dy="28">or Network is</tspan>
      <tspan x="525" dy="28">unreachable</tspan>
    </text>

    <rect x="720" y="660" width="460" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="950" y="738" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="950" dy="0">ICMP unreachable from a</tspan>
      <tspan x="950" dy="34">router, or no local route</tspan>
    </text>

    <rect x="1200" y="660" width="360" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1380" y="738" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="1380" dy="0">the routing table</tspan>
      <tspan x="1380" dy="34">(chapter 2.5)</tspan>
    </text>
  </g>

  
  <g id="row-4">
    <rect x="350" y="855" width="350" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="525" cy="897" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 525 875 L 525 881 M 525 913 L 525 919 M 503 897 L 509 897 M 541 897 L 547 897 M 509.5 881.5 L 513.7 885.7 M 536.3 908.3 L 540.5 912.5 M 509.5 912.5 L 513.7 908.3 M 536.3 885.7 L 540.5 881.5" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="525" y="968" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="525" dy="0">Connection reset</tspan>
      <tspan x="525" dy="32">by peer</tspan>
    </text>

    <rect x="720" y="855" width="460" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="950" y="933" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="950" dy="0">a RST during an</tspan>
      <tspan x="950" dy="34">established connection</tspan>
    </text>

    <rect x="1200" y="855" width="360" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1380" y="892" text-anchor="middle" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="1380" dy="0">peer crashed, app</tspan>
      <tspan x="1380" dy="28">closed with unread</tspan>
      <tspan x="1380" dy="28">data, firewall or NAT</tspan>
      <tspan x="1380" dy="28">state expired, load</tspan>
      <tspan x="1380" dy="28">balancer idle timeout</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway">
    <rect x="40" y="1070" width="1520" height="95" rx="12" fill="#207448" />
    <text x="800" y="1108" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="sans-serif">
      <tspan x="800" dy="0">A refusal means the host answered, so look at the listener;</tspan>
      <tspan x="800" dy="32">a timeout means the SYNs never got a reply, so look at the route and firewall</tspan>
    </text>
  </g>
</svg>