<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Draining a backend during a deploy: the order of events and the timers that must agree</title>
  <desc>Infographic illustrating backend drain timelines, Kubernetes termination order, critical timers, and proxy worker management during deploys.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="58" font-size="44" font-weight="bold" fill="#303a36" font-family="sans-serif">Draining a backend during a deploy:</text>
  <text x="40" y="108" font-size="44" font-weight="bold" fill="#303a36" font-family="sans-serif">the order of events and the timers that must agree</text>

  
  <rect x="40" y="135" width="1520" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="60" y="170" font-size="28" font-weight="bold" fill="#207448" font-family="sans-serif">the long video generation example</text>
  <text x="500" y="170" font-size="24" fill="#666666" font-family="sans-serif">— Two timelines for backend 2</text>

  
  <g stroke="#207448" stroke-width="3" fill="none" transform="translate(1480, 145)">
    <rect x="0" y="4" width="44" height="28" rx="4"/>
    <polygon points="44,12 56,4 56,32 44,24"/>
    <circle cx="14" cy="18" r="4"/>
    <circle cx="30" cy="18" r="4"/>
  </g>

  
  <g>
    
    <rect x="60" y="195" width="175" height="85" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
    <text x="147" y="247" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle" font-family="sans-serif">Without drain</text>

    
    <rect x="260" y="195" width="270" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="395" y="247" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">the generation runs</text>

    
    <line x1="530" y1="237" x2="574" y2="237" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

    
    <rect x="580" y="195" width="450" height="85" rx="8" fill="#db8129" stroke="#b86214" stroke-width="2"/>
    <text x="805" y="232" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">the deploy stops</text>
    <text x="805" y="264" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">backend 2 at its midpoint</text>

    
    <line x1="1030" y1="237" x2="1074" y2="237" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>

    
    <rect x="1080" y="195" width="450" height="85" rx="8" fill="#fdf2e9" stroke="#db8129" stroke-width="2"/>
    <text x="1305" y="232" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle" font-family="sans-serif">the user sees an error</text>
    <text x="1305" y="264" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle" font-family="sans-serif">after waiting minutes</text>
  </g>

  
  <g>
    
    <rect x="60" y="300" width="175" height="125" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="147" y="372" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">With drain</text>

    
    <rect x="260" y="300" width="340" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="430" y="336" font-size="24" fill="#303a36" text-anchor="middle" font-family="sans-serif">balancer marks backend 2 draining</text>

    
    <line x1="600" y1="329" x2="618" y2="329" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="625" y="300" width="355" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="802" y="336" font-size="24" fill="#303a36" text-anchor="middle" font-family="sans-serif">new requests go to the others</text>

    
    <rect x="260" y="367" width="340" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="278" y="403" font-size="24" fill="#303a36" font-family="sans-serif">the generation keeps running on backend 2</text>

    
    <line x1="600" y1="396" x2="618" y2="396" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="625" y="367" width="355" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="639" y="403" font-size="24" fill="#303a36" font-family="sans-serif">finishes, or the drain deadline arrives</text>

    
    <path d="M 980 329 L 995 329 L 995 362 L 1008 362" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 980 396 L 995 396 L 995 362 L 1008 362" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    
    <rect x="1015" y="300" width="230" height="125" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1130" y="372" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">backend 2 stops</text>

    
    <line x1="1245" y1="362" x2="1273" y2="362" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="1280" y="300" width="250" height="125" rx="8" fill="#207448" stroke="#207448" stroke-width="2"/>
    <text x="1405" y="372" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">no user loses an answer</text>
  </g>

  
  <rect x="40" y="460" width="940" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="60" y="496" font-size="28" font-weight="bold" fill="#207448" font-family="sans-serif">the Kubernetes order</text>

  
  <g stroke="#207448" stroke-width="3" fill="none" transform="translate(900, 468)">
    <polygon points="25,4 46,15 46,38 25,49 4,38 4,15"/>
    <circle cx="25" cy="26" r="6"/>
    <line x1="25" y1="4" x2="25" y2="20"/>
    <line x1="46" y1="15" x2="31" y2="23"/>
    <line x1="46" y1="38" x2="31" y2="29"/>
    <line x1="25" y1="49" x2="25" y2="32"/>
    <line x1="4" y1="38" x2="19" y2="29"/>
    <line x1="4" y1="15" x2="19" y2="23"/>
  </g>

  
  <g>
    <rect x="60" y="520" width="400" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="100" cy="567" r="24" fill="#207448"/>
    <text x="100" y="575" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">1</text>
    <text x="140" y="575" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">readiness turns false</text>
  </g>

  
  <line x1="460" y1="567" x2="494" y2="567" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="500" y="520" width="460" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="540" cy="567" r="24" fill="#207448"/>
    <text x="540" y="575" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">2</text>
    <text x="580" y="575" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">stop new requests</text>
  </g>

  
  <line x1="730" y1="615" x2="730" y2="634" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="360" y="640" width="600" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="400" cy="687" r="24" fill="#207448"/>
    <text x="400" y="695" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">3</text>
    <text x="440" y="675" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">wait for in-flight streams</text>
    <text x="440" y="707" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">up to the grace period</text>
  </g>

  
  <line x1="360" y1="687" x2="336" y2="687" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="60" y="640" width="270" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="100" cy="687" r="24" fill="#207448"/>
    <text x="100" y="695" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">4</text>
    <text x="140" y="695" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">terminate</text>
  </g>

  
  <rect x="40" y="775" width="940" height="315" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="60" y="812" font-size="28" font-weight="bold" fill="#207448" font-family="sans-serif">Timers that must align</text>

  
  <g stroke="#207448" stroke-width="3" fill="none" transform="translate(900, 785)">
    <circle cx="24" cy="26" r="18"/>
    <polyline points="24,14 24,26 33,26"/>
    <line x1="24" y1="3" x2="24" y2="8"/>
    <line x1="19" y1="3" x2="29" y2="3"/>
  </g>

  
  <g>
    <rect x="60" y="835" width="460" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="895" font-size="24" font-weight="bold" fill="#207448" font-family="monospace">terminationGracePeriodSeconds</text>
  </g>

  
  <g>
    <rect x="540" y="835" width="420" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="880" font-size="24" fill="#303a36" font-family="sans-serif">deregistration delay</text>
    <text x="560" y="912" font-size="24" fill="#303a36" font-family="sans-serif">of the load balancer</text>
  </g>

  
  <g>
    <rect x="60" y="960" width="460" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="80" y="1020" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif"><tspan font-family="monospace" fill="#207448">preStop</tspan> hook</text>
  </g>

  
  <g>
    <rect x="540" y="960" width="420" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="560" y="1005" font-size="24" fill="#303a36" font-family="sans-serif">shutdown timeouts</text>
    <text x="560" y="1037" font-size="24" fill="#303a36" font-family="sans-serif">of the proxy</text>
  </g>

  
  <rect x="1005" y="460" width="555" height="630" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1025" y="496" font-size="28" font-weight="bold" fill="#207448" font-family="sans-serif">Proxies and old workers</text>

  
  <g stroke="#207448" stroke-width="3" fill="none" transform="translate(1485, 470)">
    <rect x="2" y="4" width="40" height="14" rx="2"/>
    <rect x="2" y="24" width="40" height="14" rx="2"/>
    <circle cx="8" cy="11" r="2" fill="#207448"/>
    <circle cx="8" cy="31" r="2" fill="#207448"/>
    <path d="M 42 11 L 50 11 L 50 31 L 42 31"/>
  </g>

  
  <rect x="1025" y="520" width="515" height="240" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1045" y="556" font-size="24" fill="#303a36" font-family="sans-serif">nginx and HAProxy keep old</text>
  <text x="1045" y="590" font-size="24" fill="#303a36" font-family="sans-serif">workers alive until their</text>
  <text x="1045" y="624" font-size="24" fill="#303a36" font-family="sans-serif">connections end; for long streams</text>
  <text x="1045" y="658" font-size="24" fill="#303a36" font-family="sans-serif">a worker can live for hours;</text>
  <text x="1045" y="692" font-size="24" fill="#207448" font-family="monospace">worker_shutdown_timeout<tspan font-family="sans-serif" fill="#303a36"> caps</tspan></text>
  <text x="1045" y="726" font-size="24" fill="#303a36" font-family="sans-serif">them but cuts streams short</text>

  
  <rect x="1025" y="780" width="515" height="285" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1045" y="818" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">Dynamic configuration avoids it:</text>
  <text x="1045" y="854" font-size="24" fill="#303a36" font-family="sans-serif">Envoy xDS, the HAProxy runtime API</text>
  <text x="1045" y="894" font-size="24" fill="#207448" font-family="monospace">(echo set server be_infer/triton1</text>
  <text x="1045" y="930" font-size="24" fill="#207448" font-family="monospace">state drain | socat stdio</text>
  <text x="1045" y="966" font-size="24" fill="#207448" font-family="monospace">/var/run/haproxy.sock),</text>
  <text x="1045" y="1006" font-size="24" fill="#303a36" font-family="sans-serif">nginx Plus or resolver variables</text>

  
  <rect x="40" y="1110" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1149" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">Set the drain deadline with your longest stream in mind</text>
</svg>