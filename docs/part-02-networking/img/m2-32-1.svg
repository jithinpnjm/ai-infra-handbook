<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Global resources and the VPC model</title>
  <desc>Architectural infographic illustrating Google Cloud Platform global resources and VPC networking model with multi-region deployment and on-premises hybrid connectivity.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Global resources and the VPC model</text>

  
  <g id="node-glb">
    <rect x="420" y="95" width="760" height="120" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(445, 127)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="26" />
      <ellipse cx="28" cy="28" rx="13" ry="26" />
      <line x1="2" y1="28" x2="54" y2="28" />
      <line x1="8" y1="14" x2="48" y2="14" />
      <line x1="8" y1="42" x2="48" y2="42" />
    </g>
    <text x="525" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Global External Application LB</text>
    <text x="525" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(Anycast VIP + Cloud Armor)</text>
  </g>

  
  <g id="subgraph-vpc">
    <rect x="60" y="260" width="1480" height="540" rx="20" fill="#f0f5f1" stroke="#207448" stroke-width="3" stroke-dasharray="10,6" />
    <rect x="60" y="260" width="1480" height="56" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <rect x="60" y="296" width="1480" height="20" fill="#e8f1ea" />
    <line x1="60" y1="316" x2="1540" y2="316" stroke="#207448" stroke-width="3" />
    <text x="800" y="299" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Global GCP VPC (custom mode, MTU 8896, global BGP)</text>

    
    <g id="subgraph-rega">
      <rect x="90" y="340" width="670" height="435" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <text x="730" y="375" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" fill="#207448">
        <tspan x="730" dy="0" font-size="26" font-weight="bold">Region: us-central1</tspan>
        <tspan x="730" dy="32" font-size="24">(Subnet 10.100.0.0/20)</tspan>
      </text>

      
      <g id="node-gke">
        <rect x="120" y="425" width="610" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
        
        <g transform="translate(145, 477)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="28" cy="28" r="24" />
          <circle cx="28" cy="28" r="8" fill="#207448" />
          <line x1="28" y1="4" x2="28" y2="20" />
          <line x1="28" y1="36" x2="28" y2="52" />
          <line x1="7" y1="16" x2="21" y2="24" />
          <line x1="35" y1="32" x2="49" y2="40" />
          <line x1="7" y1="40" x2="21" y2="32" />
          <line x1="35" y1="24" x2="49" y2="16" />
        </g>
        <text x="225" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">VPC-Native GKE Cluster</text>
        <text x="225" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Pods: 10.104.0.0/14</text>
        <text x="225" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Services: 10.108.0.0/20</text>
      </g>

      
      <g id="node-nat">
        <rect x="120" y="615" width="610" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
        
        <g transform="translate(145, 657)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="18" width="48" height="26" rx="6" />
          <line x1="14" y1="18" x2="10" y2="6" />
          <line x1="42" y1="18" x2="46" y2="6" />
          <circle cx="16" cy="31" r="3" fill="#207448" />
          <circle cx="28" cy="31" r="3" fill="#207448" />
          <circle cx="40" cy="31" r="3" fill="#207448" />
        </g>
        <text x="225" y="662" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud Router + Cloud NAT</text>
        <text x="225" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">+ Private Google Access / PSC</text>
      </g>
    </g>

    
    <g id="subgraph-regb">
      <rect x="840" y="340" width="670" height="435" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <text x="870" y="375" font-family="system-ui, -apple-system, sans-serif" fill="#207448">
        <tspan x="870" dy="0" font-size="26" font-weight="bold">Region: europe-west1</tspan>
        <tspan x="870" dy="32" font-size="24">(Subnet 10.101.0.0/20)</tspan>
      </text>

      
      <g id="node-vm2">
        <rect x="870" y="475" width="610" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
        
        <g transform="translate(895, 537)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="6" width="48" height="20" rx="4" />
          <rect x="4" y="30" width="48" height="20" rx="4" />
          <line x1="12" y1="16" x2="28" y2="16" />
          <line x1="12" y1="40" x2="28" y2="40" />
          <circle cx="42" cy="16" r="2.5" fill="#207448" />
          <circle cx="42" cy="40" r="2.5" fill="#207448" />
        </g>
        <text x="975" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Inference VMs / NEG</text>
      </g>
    </g>
  </g>

  
  <g id="node-onprem">
    <rect x="120" y="950" width="610" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(145, 982)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 50 L 6 18 L 28 4 L 50 18 L 50 50 Z" />
      <rect x="20" y="30" width="16" height="20" rx="2" />
      <line x1="14" y1="20" x2="42" y2="20" />
    </g>
    <text x="225" y="1022" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">On-Premises Data Center</text>
  </g>

   GKE -->
  <path d="M 460 215 L 460 240 L 250 240 L 250 425" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

   VM2 -->
  <path d="M 1140 215 L 1140 240 L 1350 240 L 1350 475" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow)" />

  
  <g id="connection-onprem-nat">
    <line x1="425" y1="755" x2="425" y2="820" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" />
    <rect x="135" y="820" width="580" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="425" y="852" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">HA VPN / Dedicated Interconnect</text>
    <text x="425" y="880" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">(eBGP + BFD)</text>
    <line x1="425" y1="894" x2="425" y2="950" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" />
  </g>
</svg>