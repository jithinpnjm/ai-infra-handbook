<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>PXE boot of a bare-metal GPU node</title>
  <desc>Visual infographic explaining the four-step PXE boot process of a bare-metal GPU node, from NIC firmware DHCP discover to OS installer provisioning.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">PXE boot of a bare-metal GPU node</text>

  
  <rect x="36" y="140" width="340" height="540" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="76" cy="180" r="24" fill="#207448" />
  <text x="76" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="114" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1</text>
  
  <g transform="translate(300, 155)">
    <rect x="0" y="5" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 10 39 L 10 47 M 19 39 L 19 47 M 28 39 L 28 47 M 37 39 L 37 47" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="23" cy="22" r="7" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <line x1="56" y1="225" x2="356" y2="225" stroke="#c8dcd0" stroke-width="2" />
  
  <text x="60" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">NIC firmware</tspan>
    <tspan x="60" dy="35">(PXE ROM or</tspan>
    <tspan x="60" dy="35">UEFI HTTP boot):</tspan>
    <tspan x="60" dy="35">DHCP DISCOVER,</tspan>
    <tspan x="60" dy="35">vendor class</tspan>
    <tspan x="60" dy="35" font-family="monospace">PXEClient</tspan><tspan font-family="sans-serif">, </tspan>
    <tspan x="60" dy="35">option 93</tspan>
    <tspan x="60" dy="35">architecture</tspan>
  </text>

  
  <line x1="376" y1="410" x2="430" y2="410" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="432" y="140" width="340" height="540" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="472" cy="180" r="24" fill="#207448" />
  <text x="472" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="510" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2</text>
  
  <g transform="translate(696, 155)">
    <rect x="0" y="3" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="0" y="25" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="11" cy="12" r="2.5" fill="#207448" />
    <circle cx="11" cy="34" r="2.5" fill="#207448" />
    <line x1="24" y1="12" x2="38" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="34" x2="38" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <line x1="452" y1="225" x2="752" y2="225" stroke="#c8dcd0" stroke-width="2" />
  
  <text x="456" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="456" dy="0">DHCP server</tspan>
    <tspan x="456" dy="35">replies: address</tspan>
    <tspan x="456" dy="35">+ next-server</tspan>
    <tspan x="456" dy="35">(TFTP) + filename</tspan>
    <tspan x="456" dy="35">(for example</tspan>
    <tspan x="456" dy="35" font-family="monospace">ipxe.efi</tspan><tspan font-family="sans-serif">)</tspan>
  </text>

  
  <line x1="772" y1="410" x2="826" y2="410" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="828" y="140" width="340" height="540" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="868" cy="180" r="24" fill="#207448" />
  <text x="868" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="906" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3</text>
  
  <g transform="translate(1092, 155)">
    <path d="M 2 11 C 2 5, 46 5, 46 11 C 46 17, 2 17, 2 11 Z" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 2 11 L 2 37 C 2 43, 46 43, 46 37 L 46 11" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 24 19 L 24 33 M 17 27 L 24 34 L 31 27" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <line x1="848" y1="225" x2="1148" y2="225" stroke="#c8dcd0" stroke-width="2" />
  
  <text x="852" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="852" dy="0">firmware downloads</tspan>
    <tspan x="852" dy="35">bootloader iPXE;</tspan>
    <tspan x="852" dy="35">script over HTTP</tspan>
    <tspan x="852" dy="35">fetches kernel,</tspan>
    <tspan x="852" dy="35">initrd,</tspan>
    <tspan x="852" dy="35">kickstart/</tspan>
    <tspan x="852" dy="35">autoinstall/</tspan>
    <tspan x="852" dy="35">cloud-init seed</tspan>
  </text>

  
  <line x1="1168" y1="410" x2="1222" y2="410" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1224" y="140" width="340" height="540" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="1264" cy="180" r="24" fill="#207448" />
  <text x="1264" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1302" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4</text>
  
  <g transform="translate(1488, 155)">
    <rect x="0" y="4" width="48" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="48" y2="16" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="10" r="2" fill="#207448" />
    <circle cx="15" cy="10" r="2" fill="#207448" />
    <path d="M 14 29 L 22 36 L 35 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <line x1="1244" y1="225" x2="1544" y2="225" stroke="#c8dcd0" stroke-width="2" />
  
  <text x="1248" y="265" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1248" dy="0">OS installer or</tspan>
    <tspan x="1248" dy="35">provisioner</tspan>
    <tspan x="1248" dy="35">(BCM, MAAS,</tspan>
    <tspan x="1248" dy="35">Ironic)</tspan>
    <tspan x="1248" dy="35">configures the</tspan>
    <tspan x="1248" dy="35">node; then</tspan>
    <tspan x="1248" dy="35">node's own DHCP</tspan>
    <tspan x="1248" dy="35">client runs</tspan>
  </text>

  
  <rect x="36" y="720" width="736" height="90" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(62, 742)">
    <path d="M 18 2 L 34 32 L 2 32 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="18" y1="13" x2="18" y2="21" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="18" cy="27" r="1.5" fill="#db8129" />
  </g>
  <text x="115" y="774" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Only one DHCP server may answer a subnet</text>
</svg>