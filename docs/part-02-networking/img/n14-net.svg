<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
  <title>IS-IS NET address anatomy</title>
  <desc>Visual breakdown of the IS-IS Network Entity Title structure, area hierarchy, routing levels, and data-centre best practices.</desc>

  
  <rect width="1600" height="990" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">IS-IS NET address anatomy</text>

  
  <rect x="60" y="125" width="1480" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <text x="800" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="bold" fill="#207448">49.0001 . 1921.6800.1001 . 00</text>

  
  
  <rect x="60" y="245" width="460" height="245" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(262, 265)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="28" cy="28" rx="13" ry="26" fill="none" stroke="#207448" stroke-width="4" />
  </g>
  <text x="290" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="290" dy="0" font-weight="bold">49.0001 = AFI + area </tspan>
    <tspan x="290" dy="36">(49 is the private AFI, </tspan>
    <tspan x="290" dy="36">0001 is the area)</tspan>
  </text>

  
  <rect x="550" y="245" width="500" height="245" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(772, 265)">
    <rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="19" y="19" width="18" height="18" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    
    <line x1="2" y1="20" x2="10" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="36" x2="10" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="46" y1="20" x2="54" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="36" x2="54" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="20" y1="2" x2="20" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="2" x2="36" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="20" y1="46" x2="20" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="46" x2="36" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="800" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="800" dy="0" font-weight="bold">1921.6800.1001 = System ID </tspan>
    <tspan x="800" dy="36">(6 bytes, unique within </tspan>
    <tspan x="800" dy="36">the domain)</tspan>
  </text>

  
  <rect x="1080" y="245" width="460" height="245" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1282, 265)">
    <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="28" r="21" fill="none" stroke="#207448" stroke-width="6" stroke-dasharray="9 7.49" />
  </g>
  <text x="1310" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1310" dy="0" font-weight="bold">00 = N-selector </tspan>
    <tspan x="1310" dy="36">(always 00 for a router)</tspan>
  </text>

  
  
  <rect x="60" y="515" width="460" height="165" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(265, 532)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="25" cy="25" r="9" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="290" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="290" dy="0" font-weight="bold">Level 1: </tspan>
    <tspan x="290" dy="34">knows its own area</tspan>
  </text>

  
  <rect x="550" y="515" width="500" height="165" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(775, 532)">
    <circle cx="14" cy="25" r="11" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="36" cy="25" r="11" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="25" y1="25" x2="25" y2="25" stroke="#207448" stroke-width="3.5" />
  </g>
  <text x="800" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="800" dy="0" font-weight="bold">Level 2: </tspan>
    <tspan x="800" dy="34">backbone between areas</tspan>
  </text>

  
  <rect x="1080" y="515" width="460" height="165" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1285, 532)">
    <rect x="6" y="8" width="38" height="34" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="25" y1="8" x2="25" y2="42" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
  </g>
  <text x="1310" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1310" dy="0" font-weight="bold">L1/L2: </tspan>
    <tspan x="1310" dy="34">connects both (default)</tspan>
  </text>

  
  <rect x="60" y="705" width="1480" height="120" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(100, 737)">
    <circle cx="26" cy="26" r="24" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="26" y1="14" x2="26" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="37" r="2.5" fill="#db8129" />
  </g>
  <text x="175" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="175" dy="0">Same area address means same area and flooding domain; </tspan>
    <tspan x="175" dy="36">mismatched areas form only Level 2 adjacencies</tspan>
  </text>

  
  <rect x="60" y="850" width="1480" height="85" rx="16" fill="#207448" />
  <text x="800" y="903" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">For a single-area data-centre underlay run everything as Level 2 only</text>
</svg>