<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Ways to get a copy of the wire: SPAN, RSPAN, ERSPAN, sFlow, TAP and tc mirror</title>
  <desc>Visual comparison of packet capture and mirroring methods: SPAN, RSPAN, ERSPAN, sFlow and IPFIX, optical TAP, and Linux tc mirror, with operational cautions, intermittent fault trigger rings, and capture privacy rules.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    Ways to get a copy of the wire:
    <tspan x="40" dy="58">SPAN, RSPAN, ERSPAN, sFlow, TAP and tc mirror</tspan>
  </text>

  
  <rect x="40" y="165" width="1010" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="58" y="177" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <circle cx="72" cy="195" r="3" fill="#207448"/>
  <circle cx="82" cy="195" r="3" fill="#207448"/>
  <path d="M 88 186 C 96 186 96 204 88 204" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="125" y="206" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">SPAN: </tspan>
    <tspan font-size="26">mirrors locally on the switch</tspan>
  </text>

  
  <rect x="40" y="237" width="1010" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="58" y="249" width="34" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 94 257 L 104 257 L 109 267 L 104 277 L 94 277 Z" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="125" y="278" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">RSPAN: </tspan>
    <tspan font-size="26">carries the mirror over a VLAN</tspan>
  </text>

  
  <rect x="40" y="309" width="1010" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="58" y="323" width="50" height="32" rx="16" fill="none" stroke="#207448" stroke-width="3.5"/>
  <circle cx="74" cy="339" r="4" fill="#207448"/>
  <path d="M 84 339 L 98 339" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="125" y="350" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">ERSPAN: </tspan>
    <tspan font-size="26">wraps the mirror in GRE and sends it to a remote IP</tspan>
  </text>

  
  <rect x="40" y="381" width="1010" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 58 417 L 68 417 L 74 397 L 82 427 L 88 417 L 108 417" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="397" r="3.5" fill="#207448"/>
  <circle cx="82" cy="427" r="3.5" fill="#207448"/>
  <text x="125" y="422" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">sFlow and IPFIX: </tspan>
    <tspan font-size="26">sample the traffic</tspan>
  </text>

  
  <rect x="40" y="453" width="1010" height="62" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  
  <polygon points="60,497 83,463 106,497" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 68 485 L 83 480 M 83 480 L 102 475 M 83 480 L 98 493" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linecap="round"/>
  <text x="125" y="494" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold" fill="#db8129">TAP: </tspan>
    <tspan font-size="26">optical splitter, lossless and passive</tspan>
  </text>

  
  <rect x="40" y="525" width="1010" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="58" y="543" width="50" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="58" y1="555" x2="108" y2="555" stroke="#207448" stroke-width="2"/>
  <path d="M 68 565 L 75 571 L 68 577 M 80 577 L 88 577" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="563" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold">Linux tc mirror: </tspan>
    <tspan font-family="ui-monospace, monospace" font-size="24">tc qdisc add dev eth0 ingress;</tspan>
    <tspan x="125" dy="34" font-family="ui-monospace, monospace" font-size="24">tc filter add dev eth0 parent ffff: protocol all matchall</tspan>
    <tspan x="125" dy="34" font-family="ui-monospace, monospace" font-size="24">action mirred egress mirror dev dummy0, </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">then capture on</tspan>
    <tspan x="125" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">dummy0 or send the copy elsewhere</tspan>
  </text>

  
  <rect x="1080" y="165" width="480" height="165" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <polygon points="1128,183 1104,227 1152,227" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="1128" y1="197" x2="1128" y2="211" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="1128" cy="219" r="2" fill="#207448"/>
  <text x="1104" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1104" dy="0">Mirror ports can drop packets</tspan>
    <tspan x="1104" dy="34">when oversubscribed</tspan>
  </text>

  
  <rect x="1080" y="345" width="480" height="165" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="1106" y="362" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="1148" y1="366" x2="1148" y2="376" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="1143" y1="371" x2="1153" y2="371" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="1143" y1="384" x2="1153" y2="384" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="1104" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1104" dy="0">mirrored frames may have</tspan>
    <tspan x="1104" dy="34">VLAN tags stripped or added</tspan>
  </text>

  
  <rect x="1080" y="525" width="480" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1106 555 L 1146 555 M 1136 547 L 1146 555 L 1136 563" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1146 575 L 1106 575 M 1116 567 L 1106 575 L 1116 583" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1104" y="635" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    mirror both directions
  </text>

  
  <rect x="40" y="720" width="1520" height="150" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="795" r="26" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M 86 777 L 86 795 L 98 795" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="145" y="767" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold">Trigger ring for an intermittent fault: </tspan>
    <tspan font-family="ui-monospace, monospace" font-size="24">tcpdump -C 10 -W 5</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="25"> plus a</tspan>
    <tspan x="145" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="25">script or inotify that kills tcpdump when an alert fires; stop on the</tspan>
    <tspan x="145" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="25">event so the packets from before the fault stay on disk</tspan>
  </text>

  
  <rect x="40" y="890" width="1520" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 66 942 L 86 933 L 106 942 C 106 962 86 978 86 978 C 86 978 66 962 66 942 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="86" cy="951" r="3" fill="#207448"/>
  <line x1="86" y1="954" x2="86" y2="963" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="940" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="25">captures can hold credentials, tokens, personal data and model prompts;</tspan>
    <tspan x="145" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="25">capture only on systems you are authorised to monitor; prefer header-only captures;</tspan>
    <tspan x="145" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="25">scrub with </tspan>
    <tspan font-family="ui-monospace, monospace" font-size="24">tcprewrite</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="25">, </tspan>
    <tspan font-family="ui-monospace, monospace" font-size="24">editcap</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif" font-size="25"> and Wireshark masks; never post a raw capture publicly</tspan>
  </text>

  
  <rect x="40" y="1070" width="1520" height="75" rx="8" fill="#207448"/>
  <text x="800" y="1118" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Climb only as far as the question requires
  </text>
</svg>