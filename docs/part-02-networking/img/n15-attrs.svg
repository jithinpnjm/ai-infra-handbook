<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>BGP path attribute categories</title>
  <desc>Visual categorization of BGP path attributes into Well-known mandatory, Well-known discretionary, Optional transitive, and Optional non-transitive with meanings, examples, and operational note chips.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="60" y="85" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">BGP path attribute categories</text>

  
  <g id="row-well-known-mandatory">
    <rect x="60" y="130" width="1020" height="210" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(90, 165)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 V 30 C 50 44 28 54 28 54 C 28 54 6 44 6 30 V 14 Z"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2" fill="#db8129"/>
    </g>
    
    <text x="170" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Well-known mandatory</text>
    
    <text x="170" y="212" font-family="sans-serif" font-size="24" fill="#303a36">must be understood and present in every UPDATE</text>
    
    <g transform="translate(170, 245)">
      <rect x="0" y="0" width="135" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="67" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">ORIGIN</text>

      <rect x="155" y="0" width="160" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="235" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">AS_PATH</text>

      <rect x="335" y="0" width="175" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="422" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">NEXT_HOP</text>
    </g>
  </g>

  
  <g id="row-well-known-discretionary">
    <rect x="60" y="370" width="1020" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 405)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="44" rx="8"/>
      <path d="M 16 30 L 25 39 L 40 18"/>
    </g>
    
    <text x="170" y="412" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Well-known discretionary</text>
    
    <text x="170" y="452" font-family="sans-serif" font-size="24" fill="#303a36">understood, may be omitted</text>
    
    <g transform="translate(170, 485)">
      <rect x="0" y="0" width="200" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="100" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">LOCAL_PREF</text>

      <rect x="220" y="0" width="290" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="365" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">ATOMIC_AGGREGATE</text>
    </g>
  </g>

  
  <g id="note-local-pref">
    <rect x="1120" y="370" width="420" height="210" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1144" y="425" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">LOCAL_PREF</tspan><tspan>: higher wins,</tspan>
      <tspan x="1144" dy="44">default 100,</tspan>
      <tspan x="1144" dy="44">travels only inside an AS</tspan>
    </text>
  </g>

  
  <g id="row-optional-transitive">
    <rect x="60" y="610" width="1020" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 645)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="14"/>
      <line x1="28" y1="6" x2="28" y2="12"/>
      <line x1="28" y1="48" x2="28" y2="54"/>
      <line x1="6" y1="30" x2="12" y2="30"/>
      <line x1="44" y1="30" x2="50" y2="30"/>
    </g>
    
    <text x="170" y="652" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Optional transitive</text>
    
    <text x="170" y="692" font-family="sans-serif" font-size="24" fill="#303a36">passed along if unknown</text>
    
    <g transform="translate(170, 725)">
      <rect x="0" y="0" width="180" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="90" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">COMMUNITY</text>

      <rect x="200" y="0" width="195" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="297" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">AGGREGATOR</text>

      <rect x="415" y="0" width="270" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="550" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">Large Community</text>
    </g>
  </g>

  
  <g id="row-optional-non-transitive">
    <rect x="60" y="850" width="1020" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 885)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 12 L 48 12 L 34 32 V 48 L 22 42 V 32 Z"/>
    </g>
    
    <text x="170" y="892" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Optional non-transitive</text>
    
    <text x="170" y="932" font-family="sans-serif" font-size="24" fill="#303a36">dropped if not understood</text>
    
    <g transform="translate(170, 965)">
      <rect x="0" y="0" width="100" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="50" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">MED</text>

      <rect x="120" y="0" width="245" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="242" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">ORIGINATOR_ID</text>

      <rect x="385" y="0" width="225" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="497" y="34" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">CLUSTER_LIST</text>
    </g>
  </g>

  
  <g id="note-med">
    <rect x="1120" y="850" width="420" height="210" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1144" y="960" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">MED</tspan><tspan>: lower wins</tspan>
    </text>
  </g>
</svg>