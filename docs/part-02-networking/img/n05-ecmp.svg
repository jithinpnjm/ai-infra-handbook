<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>ECMP route on a host</title>
  <desc>Visual infographic explaining host-level ECMP routing across two network interfaces to destination prefix 10.200.0.0/16, the net.ipv4.fib_multipath_hash_policy sysctl setting, and the lack of port entropy under L3-only hashing.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">ECMP route on a host</text>

  

  
  <rect x="60" y="130" width="340" height="340" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <rect x="60" y="130" width="340" height="70" rx="16" fill="#e8f1ea" />
  <rect x="60" y="184" width="340" height="16" fill="#e8f1ea" />

  
  <g transform="translate(202, 225)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="46" rx="6" />
    <line x1="12" y1="16" x2="28" y2="16" />
    <line x1="12" y1="30" x2="28" y2="30" />
    <circle cx="44" cy="16" r="3" fill="#207448" />
    <circle cx="44" cy="30" r="3" fill="#207448" />
  </g>

  
  <text x="230" y="325" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Host</text>

  
  <rect x="470" y="162" width="660" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="196" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">via 10.100.0.1 dev ens1f0 weight 1</text>

  
  <line x1="400" y1="235" x2="1205" y2="235" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="470" y="292" width="660" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="326" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">via 10.100.1.1 dev ens2f0 weight 1</text>

  
  <line x1="400" y1="365" x2="1205" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1270,390
           A 55,55 0 0,1 1215,285
           A 65,65 0 0,1 1305,200
           A 75,75 0 0,1 1445,215
           A 60,60 0 0,1 1525,290
           A 55,55 0 0,1 1500,390
           A 50,50 0 0,1 1270,390 Z"
        fill="#e8f1ea" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

  
  <g transform="translate(1342, 238)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <line x1="4" y1="28" x2="52" y2="28" />
    <path d="M 28 4 A 24 24 0 0 1 28 52" />
    <path d="M 28 4 A 24 24 0 0 0 28 52" />
  </g>

  
  <text x="1370" y="345" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">10.200.0.0/16</text>


  

  
  <rect x="60" y="520" width="880" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <path d="M 60,536 A 16,16 0 0,1 76,520 L 924,520 A 16,16 0 0,1 940,536 L 940,590 L 60,590 Z" fill="#e8f1ea" />
  <line x1="60" y1="590" x2="940" y2="590" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(85, 537)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="46" height="36" rx="4" />
    <line x1="0" y1="12" x2="46" y2="12" stroke-width="2.5" />
    <line x1="0" y1="24" x2="46" y2="24" stroke-width="2.5" />
    <line x1="16" y1="0" x2="16" y2="36" stroke-width="2.5" />
  </g>

  
  <text x="520" y="565" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">net.ipv4.fib_multipath_hash_policy</text>

  
  <rect x="62" y="591" width="876" height="96" fill="#ffffff" />
  <text x="110" y="650" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">0 = L3 (src/dst IP)</text>
  <line x1="60" y1="688" x2="940" y2="688" stroke="#e8f1ea" stroke-width="2" />

  
  <rect x="62" y="689" width="876" height="96" fill="#f5f8f5" />
  <text x="110" y="748" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">1 = L4 (5-tuple)</text>
  <line x1="60" y1="785" x2="940" y2="785" stroke="#e8f1ea" stroke-width="2" />

  
  <rect x="62" y="786" width="876" height="96" fill="#ffffff" />
  <text x="110" y="845" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">2 = inner L3 for encapsulated</text>
  <line x1="60" y1="882" x2="940" y2="882" stroke="#e8f1ea" stroke-width="2" />

  
  <path d="M 62,883 L 938,883 L 938,964 A 16,16 0 0,1 924,978 L 76,978 A 16,16 0 0,1 62,964 Z" fill="#f5f8f5" />
  <text x="110" y="942" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">3 = custom fields</text>


  
  <rect x="980" y="520" width="560" height="460" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <path d="M 980,536 A 16,16 0 0,1 996,520 L 1524,520 A 16,16 0 0,1 1540,536 L 1540,580 L 980,580 Z" fill="#fff7ed" />

  
  <g transform="translate(1232, 558)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <line x1="28" y1="16" x2="28" y2="30" />
    <circle cx="28" cy="40" r="2.5" fill="#db8129" />
  </g>

  
  <text x="1260" y="665" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="1260" dy="0" font-weight="bold" fill="#db8129">L3-only hashing:</tspan>
    <tspan x="1260" dy="48">every connection between</tspan>
    <tspan x="1260" dy="48">the same two hosts takes</tspan>
    <tspan x="1260" dy="48">the same path</tspan>
    <tspan x="1260" dy="48">(no port entropy)</tspan>
  </text>
</svg>