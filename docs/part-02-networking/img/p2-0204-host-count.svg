<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>A /24 has 256 addresses, but two are reserved, so 254 hosts can use it</title>
  <desc>Visual explanation of /24 subnet address allocation, reserved network and broadcast addresses, /31 and /32 exceptions, and cloud address reservation policies.</desc>

  <defs>
    
    <pattern id="cellStrip" width="8" height="100" patternUnits="userSpaceOnUse">
      <line x1="8" y1="0" x2="8" y2="100" stroke="#b6d8c0" stroke-width="1.2" />
    </pattern>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">A /24 has 256 addresses, but two are reserved,</tspan>
    <tspan x="800" dy="56">so 254 hosts can use it</tspan>
  </text>

  
  
  <g transform="translate(80, 160)">
    <rect width="1440" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 30,26 L 56,26 M 34,20 L 26,26 L 34,32 M 52,20 L 60,26 L 52,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="34" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/31: 2 usable addresses, no network or broadcast</text>
  </g>

  
  <g transform="translate(80, 222)">
    <rect width="1440" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 34,26 A 10,10 0 1,1 48,34 L 40,34 M 46,28 L 48,34 L 54,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="34" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/32: one host route, used for loopbacks</text>
  </g>

  
  <text x="800" y="318" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">usable hosts: 2^8 - 2 = 254</text>

  
  <path d="M 215,346 L 215,334 L 790,334 L 800,324 L 810,334 L 1385,334 L 1385,346" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  
  
  <rect x="80" y="356" width="130" height="96" rx="6" fill="#c4cec7" stroke="#707e77" stroke-width="2.5" />

  
  <rect x="215" y="356" width="1170" height="96" fill="#dcedde" stroke="#207448" stroke-width="2.5" />
  <rect x="215" y="356" width="1170" height="96" fill="url(#cellStrip)" />

  
  <rect x="1390" y="356" width="130" height="96" rx="6" fill="#c4cec7" stroke="#707e77" stroke-width="2.5" />

  
  <line x1="145" y1="452" x2="145" y2="480" stroke="#707e77" stroke-width="2.5" stroke-dasharray="4 4" />
  <line x1="1455" y1="452" x2="1455" y2="480" stroke="#707e77" stroke-width="2.5" stroke-dasharray="4 4" />

  
  <g transform="translate(80, 480)">
    <rect width="650" height="106" rx="8" fill="#e4ebe6" stroke="#707e77" stroke-width="2.5" />
    
    <g transform="translate(24, 26)">
      <rect x="0" y="14" width="20" height="20" rx="3" fill="none" stroke="#707e77" stroke-width="3" />
      <rect x="36" y="0" width="20" height="20" rx="3" fill="none" stroke="#707e77" stroke-width="3" />
      <rect x="36" y="28" width="20" height="20" rx="3" fill="none" stroke="#707e77" stroke-width="3" />
      <path d="M 20,24 L 36,10 M 20,24 L 36,38" fill="none" stroke="#707e77" stroke-width="2.5" />
    </g>
    <text font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="98" y="44" font-weight="bold">network address: 10.23.2.0</tspan>
      <tspan x="98" y="80">(name of the subnet)</tspan>
    </text>
  </g>

  
  <g transform="translate(870, 480)">
    <rect width="650" height="106" rx="8" fill="#e4ebe6" stroke="#707e77" stroke-width="2.5" />
    
    <g transform="translate(26, 26)">
      <circle cx="28" cy="24" r="5" fill="#707e77" />
      <path d="M 28,29 L 28,48 M 20,48 L 36,48" fill="none" stroke="#707e77" stroke-width="3" stroke-linecap="round" />
      <path d="M 18,14 A 14,14 0 0,0 18,34 M 38,14 A 14,14 0 0,1 38,34" fill="none" stroke="#707e77" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 11,7 A 24,24 0 0,0 11,41 M 45,7 A 24,24 0 0,1 45,41" fill="none" stroke="#707e77" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="98" y="44" font-weight="bold">broadcast: 10.23.2.255</tspan>
      <tspan x="98" y="80">(everyone in this subnet)</tspan>
    </text>
  </g>

  
  <g transform="translate(80, 618)">
    <rect width="1440" height="114" rx="10" fill="#fdfaf6" stroke="#db8129" stroke-width="3" />
    
    <path d="M 40,68 L 74,68 A 15,15 0 0,0 74,38 A 20,20 0 0,0 36,44 A 14,14 0 0,0 40,68 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
    <text font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="100" y="47" font-weight="bold">Clouds reserve extra addresses.</tspan>
      <tspan x="100" y="87">GCP reserves the first two and the last two of each primary range.</tspan>
    </text>
  </g>

  
  <g transform="translate(80, 762)">
    <rect width="1440" height="76" rx="10" fill="#207448" />
    <text x="720" y="47" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Usable hosts are 2 to the power of the host bits, minus 2.</text>
  </g>
</svg>