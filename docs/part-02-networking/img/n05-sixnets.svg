<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>A GPU server with six networks</title>
  <desc>Network architecture of a GPU server showing management, storage, and RoCE rails routing configurations.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">A GPU server with six networks</text>

  
  <rect x="60" y="115" width="710" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(92, 138)">
    <path d="M 28 4 L 52 14 C 52 44 28 60 28 60 C 28 60 4 44 4 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 18 31 L 26 39 L 40 23" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="175" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">management 10.20.0.0/24</text>
  
  <rect x="80" y="235" width="670" height="85" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="415" y="287" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">exactly one default route, on management</text>

  
  <rect x="830" y="115" width="710" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(862, 138)">
    <ellipse cx="28" cy="14" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 2 14 V 31 C 2 37 14 40 28 40 C 42 40 54 37 54 31 V 14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 2 31 V 48 C 2 54 14 57 28 57 C 42 57 54 54 54 48 V 31" fill="none" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="945" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">storage 10.30.4.0/24</text>
  
  <rect x="850" y="235" width="670" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="268" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">reaching NFS and Lustre servers</text>
  <text x="1185" y="300" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">at 10.30.0.0/16</text>

  
  <rect x="350" y="460" width="900" height="250" rx="16" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  
  <g transform="translate(772, 490)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="10" y1="-6" x2="10" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="-6" x2="28" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="46" y1="-6" x2="46" y2="0" stroke="#207448" stroke-width="3"/>
    <line x1="10" y1="56" x2="10" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="56" x2="28" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="46" y1="56" x2="46" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="10" x2="0" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="28" x2="0" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="-6" y1="46" x2="0" y2="46" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="10" x2="62" y2="10" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="28" x2="62" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="46" x2="62" y2="46" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="800" y="585" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36" text-anchor="middle">Server</text>

  
  
  <rect x="460" y="438" width="120" height="42" rx="6" fill="#207448"/>
  <text x="520" y="467" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">eno1</text>

  
  <rect x="860" y="438" width="120" height="42" rx="6" fill="#207448"/>
  <text x="920" y="467" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">eno2</text>

  
  <rect x="650" y="685" width="300" height="46" rx="6" fill="#207448"/>
  <text x="800" y="717" font-family="monospace" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">ens1f0..ens8f0</text>

  
  
  <line x1="520" y1="438" x2="520" y2="352" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  
  <rect x="85" y="380" width="410" height="50" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="290" y="413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">carries the default route</text>

  
  <line x1="920" y1="438" x2="920" y2="352" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="965" y="380" width="560" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1245" y="413" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">10.30.0.0/16 via 10.30.4.1 dev eno2</text>

  
  <line x1="800" y1="731" x2="800" y2="788" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="60" y="790" width="1480" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(95, 835)">
    <line x1="0" y1="12" x2="56" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="56" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="52" x2="56" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="14" cy="12" r="5" fill="#207448"/>
    <circle cx="42" cy="32" r="5" fill="#207448"/>
    <circle cx="24" cy="52" r="5" fill="#207448"/>
    <line x1="14" y1="12" x2="42" y2="32" stroke="#207448" stroke-width="2.5"/>
    <line x1="42" y1="32" x2="24" y2="52" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="185" y="880" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">eight RoCE rails each on 10.100.R.0/24 with no gateway</text>

  
  <rect x="60" y="980" width="1480" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1024" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Audit with ip route get &lt;dst&gt; from &lt;src&gt; in CI after provisioning</text>
</svg>