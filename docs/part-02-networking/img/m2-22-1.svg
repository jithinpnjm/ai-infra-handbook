<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The kernel's view: network interfaces</title>
  <desc>Flowchart illustrating the Linux network stack layers from applications and sockets, through transport, Internet layer, netdev network interface, driver and NIC, down to the physical link.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The kernel's view: network interfaces</text>

  
  <line x1="800" y1="250" x2="800" y2="310" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="800" y1="420" x2="800" y2="480" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="800" y1="590" x2="800" y2="650" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="800" y1="760" x2="800" y2="820" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <line x1="800" y1="930" x2="800" y2="990" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g>
    <rect x="170" y="140" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(230, 195)">
      <rect x="-26" y="-24" width="52" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="-26" y1="-11" x2="26" y2="-11" stroke="#207448" stroke-width="2.5" />
      <circle cx="-16" cy="-17.5" r="2.5" fill="#207448" />
      <circle cx="-8" cy="-17.5" r="2.5" fill="#207448" />
      <circle cx="0" cy="-17.5" r="2.5" fill="#207448" />
      <path d="M-14 2 L-6 8 L-14 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-2" y1="14" x2="12" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="290" y="186" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">Applications </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">(sockets)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="170" y="310" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(230, 365)">
      <rect x="-26" y="-26" width="52" height="52" rx="8" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
      <path d="M-20 -10 L16 -10 M8 -18 L18 -10 L8 -2" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M20 10 L-16 10 M-8 2 L-18 10 L-8 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="290" y="356" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">Transport: </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">TCP / UDP / SCTP / QUIC-in-userspace</tspan>
    </text>
  </g>

  
  <g>
    <rect x="170" y="480" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(230, 535)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="-18" x2="0" y2="-6" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <polyline points="-5 -11 0 -5 5 -11" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="0" y1="6" x2="0" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <polyline points="-5 12 0 18 5 12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-18" y1="0" x2="-6" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <polyline points="-12 -5 -6 0 -12 5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="6" y1="0" x2="18" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <polyline points="12 -5 18 0 12 5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="290" y="526" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">Internet layer: </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">IPv4 / IPv6, routing, netfilter, conntrack</tspan>
    </text>
  </g>

  
  <g>
    <rect x="170" y="650" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(230, 705)">
      <path d="M-24 -20 H24 V20 H11 V12 H-11 V20 H-24 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="-9" y1="-14" x2="-9" y2="0" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <line x1="-3" y1="-14" x2="-3" y2="0" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <line x1="3" y1="-14" x2="3" y2="0" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <line x1="9" y1="-14" x2="9" y2="0" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <circle cx="-18" cy="12" r="2.5" fill="#db8129" />
      <circle cx="18" cy="12" r="2.5" fill="#db8129" />
    </g>
    
    <text x="290" y="696" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">Network interface (netdev): </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">addresses, MTU, qdisc, features</tspan>
    </text>
  </g>

  
  <g>
    <rect x="170" y="820" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(230, 875)">
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="-10" y1="-25" x2="-10" y2="-19" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-25" x2="0" y2="-19" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="10" y1="-25" x2="10" y2="-19" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-10" y1="19" x2="-10" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="19" x2="0" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="10" y1="19" x2="10" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-25" y1="-10" x2="-19" y2="-10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-25" y1="0" x2="-19" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="-25" y1="10" x2="-19" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="19" y1="-10" x2="25" y2="-10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="19" y1="0" x2="25" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="19" y1="10" x2="25" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="-10" cy="-10" r="2" fill="#207448" />
    </g>
    
    <text x="290" y="866" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">Driver + NIC: </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">rings, queues, offloads, IRQs, DMA</tspan>
    </text>
  </g>

  
  <g>
    <rect x="170" y="990" width="1260" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(230, 1045)">
      <rect x="-24" y="-14" width="20" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-24" y1="0" x2="-4" y2="0" stroke="#207448" stroke-width="2.5" />
      <path d="M4 -12 C8 -6, 8 6, 4 12" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M13 -18 C19 -9, 19 9, 13 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <path d="M22 -24 C30 -12, 30 12, 22 24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    
    <text x="290" y="1036" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan font-size="30" font-weight="bold">PHY / link: </tspan>
      <tspan x="290" dy="36" font-size="25" fill="#404c47">negotiation, speed, FEC, optics</tspan>
    </text>
  </g>
</svg>