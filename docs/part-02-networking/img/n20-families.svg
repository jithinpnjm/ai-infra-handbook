<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Load balancing families by layer</title>
  <desc>Infographic explaining load balancing families organized by layer, decisions, examples, and trade-offs.</desc>

