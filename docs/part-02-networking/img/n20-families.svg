<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Load balancing families by layer</title>
  <desc>Infographic illustrating load balancing families from coarse to fine: DNS / GSLB, L3 ECMP / anycast, L4, L7, Client-side, and In-cluster / mesh.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Load balancing families by layer</text>

  
  <line x1="1480" y1="1060" x2="1480" y2="162" stroke="#207448" stroke-width="4"/>
  <polygon points="1480,142 1471,162 1489,162" fill="#207448"/>
  <text x="-605" y="1525" transform="rotate(-90)" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Lower layers decide faster but see less</text>

  
  <rect x="60" y="115" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="113" cy="188" r="24"/>
    <line x1="89" y1="188" x2="137" y2="188"/>
    <ellipse cx="113" cy="188" rx="12" ry="24"/>
    <line x1="113" y1="164" x2="113" y2="212"/>
  </g>
  <text x="160" y="198" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">DNS / GSLB</text>
  <line x1="490" y1="135" x2="490" y2="240" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="175" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">name resolution</text>
  <text x="520" y="217" font-family="sans-serif" font-size="24" fill="#303a36">(Route 53, Cloud DNS routing policies)</text>

  
  <rect x="60" y="282" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="113" cy="355" r="24"/>
    <line x1="96" y1="338" x2="130" y2="372"/>
    <line x1="130" y1="338" x2="96" y2="372"/>
  </g>
  <text x="160" y="365" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">L3 ECMP / anycast</text>
  <line x1="490" y1="302" x2="490" y2="407" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="342" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">flow hash across equal-cost next hops</text>
  <text x="520" y="384" font-family="sans-serif" font-size="24" fill="#303a36">(router ECMP, BGP-announced VIPs)</text>

  
  <rect x="60" y="449" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="97" cy="522" r="9"/>
    <circle cx="129" cy="522" r="9"/>
    <line x1="106" y1="516" x2="120" y2="516"/>
    <line x1="106" y1="528" x2="120" y2="528"/>
  </g>
  <text x="160" y="532" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">L4</text>
  <line x1="490" y1="469" x2="490" y2="574" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="494" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">TCP/UDP connections, 5-tuple</text>
  <text x="520" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="520" dy="0">(IPVS/LVS, Maglev, Katran,</tspan>
    <tspan x="520" dy="28">HAProxy mode tcp)</tspan>
  </text>
  
  <rect x="940" y="479" width="460" height="85" rx="12" fill="#fef4eb" stroke="#db8129" stroke-width="3"/>
  <text x="1170" y="512" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1170" dy="0">cannot see requests</tspan>
    <tspan x="1170" dy="30">inside a connection</tspan>
  </text>

  
  <rect x="60" y="616" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="88" y="666" width="50" height="46" rx="6"/>
    <line x1="88" y1="680" x2="138" y2="680"/>
  </g>
  <circle cx="97" cy="673" r="2.5" fill="#207448"/>
  <circle cx="104" cy="673" r="2.5" fill="#207448"/>
  <circle cx="111" cy="673" r="2.5" fill="#207448"/>
  <line x1="97" y1="693" x2="123" y2="693" stroke="#207448" stroke-width="3"/>
  <line x1="97" y1="702" x2="115" y2="702" stroke="#207448" stroke-width="3"/>
  <text x="160" y="699" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">L7</text>
  <line x1="490" y1="636" x2="490" y2="741" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="676" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">HTTP/gRPC requests, headers, paths</text>
  <text x="520" y="718" font-family="sans-serif" font-size="24" fill="#303a36">(HAProxy mode http, nginx, Envoy, ALB)</text>

  
  <rect x="60" y="783" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <rect x="88" y="834" width="50" height="34" rx="4"/>
    <line x1="113" y1="868" x2="113" y2="878"/>
    <line x1="101" y1="878" x2="125" y2="878"/>
  </g>
  <text x="160" y="866" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Client-side</text>
  <line x1="490" y1="803" x2="490" y2="908" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="866" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">gRPC round_robin with xDS</text>

  
  <rect x="60" y="950" width="1370" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="4" fill="none">
    <circle cx="113" cy="1006" r="7"/>
    <circle cx="97" cy="1036" r="7"/>
    <circle cx="129" cy="1036" r="7"/>
    <line x1="108" y1="1012" x2="102" y2="1030" stroke-width="3"/>
    <line x1="118" y1="1012" x2="124" y2="1030" stroke-width="3"/>
    <line x1="104" y1="1036" x2="122" y2="1036" stroke-width="3"/>
  </g>
  <text x="160" y="1033" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">In-cluster / mesh</text>
  <line x1="490" y1="970" x2="490" y2="1075" stroke="#b8d5c2" stroke-width="2"/>
  <text x="520" y="1033" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">kube-proxy, Cilium eBPF, Envoy sidecar</text>
</svg>