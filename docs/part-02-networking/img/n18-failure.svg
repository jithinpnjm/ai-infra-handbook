<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" width="1600" height="970">
  <title>Capacity left after a spine fails</title>
  <desc>Visual infographic explaining network fabric capacity retention when a spine switch fails, showing mathematical formula, leaf uplink failure topology, and comparison between 32-spine and 4-spine architectures.</desc>

  <rect width="1600" height="970" fill="#f5f8f5"/>

  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Capacity left after a spine fails</text>

  <g id="formula-banner">
    <rect x="50" y="105" width="1500" height="75" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(85, 115)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff"/>
      <line x1="14" y1="20" x2="42" y2="20"/>
      <line x1="14" y1="36" x2="42" y2="36"/>
      <line x1="28" y1="10" x2="28" y2="46"/>
    </g>
    <text x="800" y="152" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">capacity kept = (S-1)/S of uplink capacity</text>
  </g>

  <g id="leaf-topology-card">
    <rect x="50" y="205" width="600" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <g transform="translate(80, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff"/>
      <path d="M 14 28 L 42 28"/>
      <path d="M 34 20 L 42 28 L 34 36"/>
      <circle cx="20" cy="18" r="4" fill="#207448"/>
      <circle cx="20" cy="38" r="4" fill="#207448"/>
    </g>

    <g transform="translate(80, 320)">
      <rect x="0" y="0" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <circle cx="24" cy="28" r="4" fill="#207448"/>
      <circle cx="44" cy="28" r="4" fill="#207448"/>
      <circle cx="66" cy="28" r="4" fill="#207448"/>
      <circle cx="86" cy="28" r="4" fill="#207448"/>
    </g>

    <g transform="translate(225, 320)">
      <rect x="0" y="0" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <circle cx="24" cy="28" r="4" fill="#207448"/>
      <circle cx="44" cy="28" r="4" fill="#207448"/>
      <circle cx="66" cy="28" r="4" fill="#207448"/>
      <circle cx="86" cy="28" r="4" fill="#207448"/>
    </g>

    <g transform="translate(370, 320)">
      <rect x="0" y="0" width="110" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <circle cx="24" cy="28" r="4" fill="#207448"/>
      <circle cx="44" cy="28" r="4" fill="#207448"/>
      <circle cx="66" cy="28" r="4" fill="#207448"/>
      <circle cx="86" cy="28" r="4" fill="#207448"/>
    </g>

    <g transform="translate(515, 320)">
      <rect x="0" y="0" width="110" height="56" rx="8" fill="#f0f3f1" stroke="#a0aca5" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="24" cy="28" r="4" fill="#a0aca5"/>
      <circle cx="44" cy="28" r="4" fill="#a0aca5"/>
      <circle cx="66" cy="28" r="4" fill="#a0aca5"/>
      <circle cx="86" cy="28" r="4" fill="#a0aca5"/>
    </g>

    <line x1="135" y1="550" x2="135" y2="376" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
    <line x1="280" y1="550" x2="280" y2="376" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
    <line x1="425" y1="550" x2="425" y2="376" stroke="#207448" stroke-width="6" stroke-linecap="round"/>

    <line x1="570" y1="550" x2="570" y2="376" stroke="#a0aca5" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8"/>

    <circle cx="570" cy="463" r="18" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <path d="M 561 454 L 579 472 M 579 454 L 561 472" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>

    <g transform="translate(85, 550)">
      <rect x="0" y="0" width="530" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

      <circle cx="50" cy="24" r="6" fill="#207448"/>
      <circle cx="195" cy="24" r="6" fill="#207448"/>
      <circle cx="340" cy="24" r="6" fill="#207448"/>
      <circle cx="485" cy="24" r="6" fill="#a0aca5"/>

      <line x1="20" y1="46" x2="510" y2="46" stroke="#e8f1ea" stroke-width="2"/>

      <circle cx="45" cy="66" r="4" fill="#207448"/>
      <circle cx="85" cy="66" r="4" fill="#207448"/>
      <circle cx="125" cy="66" r="4" fill="#207448"/>
      <circle cx="165" cy="66" r="4" fill="#207448"/>
      <circle cx="365" cy="66" r="4" fill="#207448"/>
      <circle cx="405" cy="66" r="4" fill="#207448"/>
      <circle cx="445" cy="66" r="4" fill="#207448"/>
      <circle cx="485" cy="66" r="4" fill="#207448"/>
    </g>

    <g stroke="#207448" stroke-width="3" stroke-linecap="round">
      <line x1="130" y1="640" x2="130" y2="675"/>
      <line x1="170" y1="640" x2="170" y2="675"/>
      <line x1="210" y1="640" x2="210" y2="675"/>
      <line x1="250" y1="640" x2="250" y2="675"/>
      <line x1="450" y1="640" x2="450" y2="675"/>
      <line x1="490" y1="640" x2="490" y2="675"/>
      <line x1="530" y1="640" x2="530" y2="675"/>
      <line x1="570" y1="640" x2="570" y2="675"/>
    </g>
  </g>

  <g id="bar-comparison-card">
    <rect x="690" y="205" width="860" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <g transform="translate(725, 230)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff"/>
      <line x1="14" y1="44" x2="14" y2="32"/>
      <line x1="28" y1="44" x2="28" y2="18"/>
      <line x1="42" y1="44" x2="42" y2="24"/>
    </g>

    <text x="795" y="268" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Bar comparison</text>

    <g transform="translate(725, 315)">
      <rect x="0" y="0" width="790" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

      <text x="30" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">S = 32 spines, one down: 96.9%</text>

      <rect x="30" y="72" width="730" height="56" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      <rect x="30" y="72" width="707" height="56" rx="10" fill="#207448"/>
    </g>

    <g transform="translate(725, 505)">
      <rect x="0" y="0" width="790" height="160" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>

      <text x="30" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">S = 4 spines, one down: 75%</text>

      <rect x="30" y="72" width="730" height="56" rx="10" fill="#fff7f0" stroke="#db8129" stroke-width="2"/>
      <rect x="30" y="72" width="548" height="56" rx="10" fill="#db8129"/>
    </g>
  </g>

  <g id="footer-banner">
    <rect x="50" y="760" width="1500" height="72" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="805" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">A 1:1 design stays oversubscribed until the failure is repaired</text>
  </g>

  <g id="takeaway-bar">
    <rect x="50" y="855" width="1500" height="75" rx="14" fill="#207448"/>
    <text x="800" y="902" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Work out what survives losing one spine, one leaf and one rail group</text>
  </g>
</svg>