<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Fixing a PMTU black hole: four options and the ping arithmetic that finds it</title>
  <desc>Visual guide comparing four ways to resolve PMTU black holes, the arithmetic behind ICMP ping sizing at MTU 1500, fragmentation costs, and diagnostic commands.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36" text-anchor="middle">Fixing a PMTU black hole: four options and the ping arithmetic that finds it</text>

  
  <g id="left-panel">
    
    <rect x="40" y="105" width="740" height="865" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 128)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 48 12 L 48 28 C 48 42 28 52 28 52 C 28 52 8 42 8 28 L 8 12 Z" />
      <path d="M 20 28 L 26 34 L 38 20" />
    </g>

    
    <text x="135" y="165" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Four ways to fix a black hole</text>

    
    <g transform="translate(65, 205)">
      <rect width="690" height="150" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <circle cx="44" cy="44" r="22" fill="#207448" />
      <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="82" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">1 allow the required ICMP messages</text>
      <text x="82" y="86" font-family="sans-serif" font-size="24" fill="#303a36">(IPv4 type 3 code 4 Fragmentation Needed,</text>
      <text x="82" y="122" font-family="sans-serif" font-size="24" fill="#303a36">IPv6 type 2 Packet Too Big)</text>
    </g>

    
    <g transform="translate(65, 375)">
      <rect width="690" height="225" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <circle cx="44" cy="44" r="22" fill="#207448" />
      <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="82" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 clamp the TCP MSS on tunnels:</text>
      <rect x="82" y="66" width="588" height="135" rx="8" fill="#f5f8f5" stroke="#d0dfd4" stroke-width="1.5" />
      <text x="96" y="102" font-family="monospace" font-size="24" fill="#207448">iptables -t mangle -A FORWARD -p tcp</text>
      <text x="96" y="138" font-family="monospace" font-size="24" fill="#207448">--tcp-flags SYN,RST SYN -j TCPMSS</text>
      <text x="96" y="174" font-family="monospace" font-size="24" fill="#207448">--clamp-mss-to-pmtu</text>
    </g>

    
    <g transform="translate(65, 620)">
      <rect width="690" height="110" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <circle cx="44" cy="55" r="22" fill="#207448" />
      <text x="44" y="63" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="82" y="63" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">3 use a consistent MTU across the path</text>
    </g>

    
    <g transform="translate(65, 750)">
      <rect width="690" height="195" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <circle cx="44" cy="44" r="22" fill="#207448" />
      <text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="82" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">4 enable PLPMTUD with</text>
      <rect x="82" y="70" width="588" height="100" rx="8" fill="#f5f8f5" stroke="#d0dfd4" stroke-width="1.5" />
      <text x="96" y="128" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">net.ipv4.tcp_mtu_probing</text>
    </g>
  </g>

  
  <g id="right-panel">
    
    <rect x="820" y="105" width="740" height="865" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(845, 128)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="20" y1="22" x2="20" y2="48" />
      <line x1="36" y1="22" x2="36" y2="48" />
    </g>

    
    <text x="915" y="165" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Ping sizes add up to 1500</text>

    
    <g transform="translate(845, 205)">
      <rect width="690" height="150" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      
      <g transform="translate(24, 20)">
        <rect x="0" y="0" width="410" height="42" fill="#207448" rx="6" />
        <text x="205" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">1472</text>
        <rect x="416" y="0" width="90" height="42" fill="#4d9b6f" rx="6" />
        <text x="461" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">8</text>
        <rect x="512" y="0" width="130" height="42" fill="#7ab895" rx="6" />
        <text x="577" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">20</text>
      </g>
      <text x="24" y="96" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">payload 1472 + ICMP 8 + IPv4 20 = 1500</text>
      <text x="24" y="132" font-family="monospace" font-size="24" fill="#207448">(ping -M do -s 1472)</text>
    </g>

    
    <g transform="translate(845, 375)">
      <rect width="690" height="150" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      
      <g transform="translate(24, 20)">
        <rect x="0" y="0" width="370" height="42" fill="#207448" rx="6" />
        <text x="185" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">1452</text>
        <rect x="376" y="0" width="90" height="42" fill="#4d9b6f" rx="6" />
        <text x="421" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">8</text>
        <rect x="472" y="0" width="170" height="42" fill="#7ab895" rx="6" />
        <text x="557" y="29" font-family="sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">40</text>
      </g>
      <text x="24" y="96" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">payload 1452 + ICMP 8 + IPv6 40 = 1500</text>
      <text x="24" y="132" font-family="monospace" font-size="24" fill="#207448">(ping -6 -M do -s 1452)</text>
    </g>

    
    <g transform="translate(845, 545)">
      <rect width="690" height="135" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <text x="24" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">MSS at MTU 1500: IPv4 1500 - 20 - 20 = 1460;</text>
      <text x="24" y="96" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        IPv6 1500 - 40 - 20 = <tspan fill="#db8129">1440</tspan>
      </text>
    </g>

    
    <g transform="translate(845, 700)">
      <rect width="690" height="245" rx="12" fill="#ffffff" stroke="#c4d9cb" stroke-width="2" />
      <text x="24" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Fragmentation costs: each fragment carries an ID,</text>
      <text x="24" y="84" font-family="sans-serif" font-size="24" fill="#303a36">an offset in 8-byte units and the MF flag; lose one</text>
      <text x="24" y="124" font-family="sans-serif" font-size="24" fill="#303a36">fragment and you lose the whole packet; firewalls</text>
      <text x="24" y="164" font-family="sans-serif" font-size="24" fill="#303a36">often drop fragments; some hardware paths send</text>
      <text x="24" y="204" font-family="sans-serif" font-size="24" fill="#303a36">them to the CPU</text>
    </g>
  </g>

  
  <g id="bottom-strip" transform="translate(40, 995)">
    <rect width="1520" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(24, 15)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="14" />
      <line x1="30" y1="30" x2="44" y2="44" />
      <line x1="12" y1="20" x2="28" y2="20" />
    </g>
    <text x="86" y="50" font-family="monospace" font-size="24" fill="#303a36">tracepath target, ip route get target, ss -ti dst target | grep mss pmtu: find the narrow door</text>
  </g>

  
  <g id="bottom-bar" transform="translate(40, 1095)">
    <rect width="1520" height="75" rx="12" fill="#207448" />
    <text x="760" y="47" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">If the largest working size is smaller than you expected, you have found a narrow door</text>
  </g>
</svg>