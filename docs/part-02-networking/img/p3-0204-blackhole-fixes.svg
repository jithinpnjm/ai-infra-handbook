<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Fixing a PMTU black hole: four fixes and the ping arithmetic</title>
  <desc>Infographic explaining four options to fix a PMTU black hole, ping arithmetic for MTU 1500 in IPv4 and IPv6, fragmentation costs, and diagnostic commands.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Fixing a PMTU black hole: four fixes and the ping arithmetic</text>

  
  <g id="left-panel">
    <rect x="50" y="105" width="720" height="885" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(80, 130)">
      <path d="M28 8 L38 18 C43 14 50 15 54 19 C59 24 59 32 54 36 L43 25 L36 32 L47 43 C43 47 35 47 31 43 C26 38 26 31 30 26 Z M12 44 L26 30 L34 38 L20 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="155" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Four ways to fix a black hole</text>

    
    <rect x="75" y="200" width="670" height="145" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="95" y="240" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">1 allow the required ICMP messages</tspan>
      <tspan x="95" dy="34">(IPv4 type 3 code 4 Fragmentation Needed,</tspan>
      <tspan x="95" dy="34">IPv6 type 2 Packet Too Big)</tspan>
    </text>

    
    <rect x="75" y="365" width="670" height="230" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="95" y="405" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">2 clamp the TCP MSS on tunnels:</tspan>
    </text>
    <text x="95" y="445" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="95" dy="0">iptables -t mangle -A FORWARD</tspan>
      <tspan x="95" dy="34">-p tcp --tcp-flags SYN,RST SYN</tspan>
      <tspan x="95" dy="34">-j TCPMSS</tspan>
      <tspan x="95" dy="34">--clamp-mss-to-pmtu</tspan>
    </text>

    
    <rect x="75" y="615" width="670" height="105" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="95" y="675" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">3 use a consistent MTU across the path</tspan>
    </text>

    
    <rect x="75" y="740" width="670" height="120" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="95" y="785" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">4 enable PLPMTUD with</tspan>
    </text>
    <text x="95" y="825" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="95" dy="0">net.ipv4.tcp_mtu_probing</tspan>
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="830" y="105" width="720" height="885" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(860, 130)">
      <rect x="8" y="15" width="46" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="20" y1="15" x2="20" y2="27" stroke="#207448" stroke-width="3"/>
      <line x1="31" y1="15" x2="31" y2="23" stroke="#207448" stroke-width="3"/>
      <line x1="42" y1="15" x2="42" y2="27" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="935" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ping sizes add up to 1500</text>

    
    <rect x="855" y="200" width="670" height="145" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="875" y="250" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="875" dy="0">payload 1472 + ICMP 8 + IPv4 20 = 1500</tspan>
    </text>
    <text x="875" y="295" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="875" dy="0">(ping -M do -s 1472)</tspan>
    </text>

    
    <rect x="855" y="365" width="670" height="145" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="875" y="415" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="875" dy="0">payload 1452 + ICMP 8 + IPv6 40 = 1500</tspan>
    </text>
    <text x="875" y="460" font-family="monospace" font-size="24" fill="#207448">
      <tspan x="875" dy="0">(ping -6 -M do -s 1452)</tspan>
    </text>

    
    <rect x="855" y="530" width="670" height="150" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="875" y="575" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="875" dy="0">MSS at MTU 1500:</tspan>
    </text>
    <text x="875" y="615" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="875" dy="0">IPv4 1500 - 20 - 20 = 1460;</tspan>
    </text>
    <text x="875" y="655" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="875" dy="0">IPv6 1500 - 40 - 20 = </tspan><tspan fill="#db8129" font-weight="bold">1440</tspan>
    </text>

    
    <rect x="855" y="700" width="670" height="265" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="875" y="740" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="875" dy="0">Fragmentation costs:</tspan>
    </text>
    <text x="875" y="780" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="875" dy="0">each fragment carries an ID,</tspan>
      <tspan x="875" dy="34">an offset in 8-byte units and the MF flag;</tspan>
      <tspan x="875" dy="34">lose one fragment and you lose the whole packet;</tspan>
      <tspan x="875" dy="34">firewalls often drop fragments;</tspan>
      <tspan x="875" dy="34">some hardware paths send them to the CPU</tspan>
    </text>
  </g>

  
  <g id="bottom-strip">
    <rect x="50" y="1020" width="1500" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(80, 1070)">
      <rect x="5" y="10" width="50" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M16 22 L26 30 L16 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="38" x2="44" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="160" y="1080" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="160" dy="0">tracepath target,</tspan>
      <tspan x="160" dy="34">ip route get target,</tspan>
      <tspan x="160" dy="34">ss -ti dst target | grep mss pmtu</tspan><tspan font-family="sans-serif" font-weight="bold" fill="#303a36">: find the narrow door</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1220" width="1500" height="85" rx="12" fill="#207448"/>
    <text x="800" y="1272" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">If the largest working size is smaller than you expected, you have found a narrow door</text>
  </g>
</svg>