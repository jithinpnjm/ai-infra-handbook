<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Learning, forwarding and flooding</title>
  <desc>Sequence diagram illustrating Ethernet switch learning, forwarding, and flooding across hosts A, B, and C.</desc>

  <defs>
    <marker id="arrow-right" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 14 14" refX="2" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 12 2 L 2 7 L 12 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Learning, forwarding and flooding</text>

  
  <line x1="200" y1="235" x2="200" y2="1130" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="580" y1="235" x2="580" y2="1130" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="1000" y1="235" x2="1000" y2="1130" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="1400" y1="235" x2="1400" y2="1130" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  
  <rect x="50" y="95" width="300" height="140" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="172" y="108" width="56" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="200" y1="146" x2="200" y2="156" stroke="#207448" stroke-width="4"/>
  <line x1="186" y1="156" x2="214" y2="156" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="188" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="200" font-size="30" font-weight="bold">Host A</tspan>
    <tspan x="200" dy="32" font-size="24">(MAC a, port 1)</tspan>
  </text>

  
  <rect x="460" y="95" width="240" height="140" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="552" y="112" width="56" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="552" y1="130" x2="608" y2="130" stroke="#207448" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="566" cy="122" r="3" fill="#207448"/>
  <circle cx="576" cy="122" r="3" fill="#207448"/>
  <circle cx="586" cy="122" r="3" fill="#207448"/>
  <circle cx="596" cy="122" r="3" fill="#207448"/>
  <circle cx="566" cy="138" r="3" fill="#207448"/>
  <circle cx="576" cy="138" r="3" fill="#207448"/>
  <circle cx="586" cy="138" r="3" fill="#207448"/>
  <circle cx="596" cy="138" r="3" fill="#207448"/>
  <text x="580" y="202" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Switch</text>

  
  <rect x="850" y="95" width="300" height="140" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="972" y="108" width="56" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="1000" y1="146" x2="1000" y2="156" stroke="#207448" stroke-width="4"/>
  <line x1="986" y1="156" x2="1014" y2="156" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="188" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1000" font-size="30" font-weight="bold">Host B</tspan>
    <tspan x="1000" dy="32" font-size="24">(MAC b, port 2)</tspan>
  </text>

  
  <rect x="1250" y="95" width="300" height="140" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="1372" y="108" width="56" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="1400" y1="146" x2="1400" y2="156" stroke="#207448" stroke-width="4"/>
  <line x1="1386" y1="156" x2="1414" y2="156" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="1400" y="188" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1400" font-size="30" font-weight="bold">Host C</tspan>
    <tspan x="1400" dy="32" font-size="24">(MAC c, port 3)</tspan>
  </text>

  
  <circle cx="150" cy="315" r="24" fill="#207448"/>
  <text x="150" y="323" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="390" y="275" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="390" font-size="24" font-weight="bold">frame src=a dst=b</tspan>
    <tspan x="390" dy="28" font-size="24">(b unknown)</tspan>
  </text>
  <line x1="200" y1="315" x2="568" y2="315" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  <rect x="290" y="360" width="580" height="84" rx="8" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <text x="580" y="394" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="580" font-size="24" font-weight="bold">learn a→port1, unknown unicast:</tspan>
    <tspan x="580" dy="30" font-size="24" font-weight="bold" fill="#db8129">FLOOD to ports 2,3</tspan>
  </text>

  
  <circle cx="535" cy="485" r="24" fill="#207448"/>
  <text x="535" y="493" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="790" y="473" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">frame (accepted)</text>
  <line x1="580" y1="485" x2="988" y2="485" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  <circle cx="535" cy="560" r="24" fill="#207448"/>
  <text x="535" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1200" y="520" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="1200" font-size="24" font-weight="bold">frame</tspan>
    <tspan x="1200" dy="28" font-size="24">(ignored: not its MAC)</tspan>
  </text>
  <line x1="580" y1="560" x2="1388" y2="560" stroke="#f5f8f5" stroke-width="10"/>
  <line x1="580" y1="560" x2="1388" y2="560" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  <circle cx="1045" cy="650" r="24" fill="#207448"/>
  <text x="1045" y="658" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="790" y="638" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">reply src=b dst=a</text>
  <line x1="1000" y1="650" x2="592" y2="650" stroke="#207448" stroke-width="3" marker-end="url(#arrow-left)"/>

  
  <rect x="300" y="695" width="560" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="580" y="729" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="580" font-size="24" font-weight="bold">learn b→port2, a known:</tspan>
    <tspan x="580" dy="30" font-size="24" font-weight="bold">forward only to port 1</tspan>
  </text>

  
  <circle cx="535" cy="825" r="24" fill="#207448"/>
  <text x="535" y="833" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="390" y="813" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">reply</text>
  <line x1="580" y1="825" x2="212" y2="825" stroke="#207448" stroke-width="3" marker-end="url(#arrow-left)"/>

  
  <circle cx="150" cy="905" r="24" fill="#207448"/>
  <text x="150" y="913" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <text x="390" y="893" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">next frame src=a dst=b</text>
  <line x1="200" y1="905" x2="568" y2="905" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>

  
  <rect x="330" y="950" width="500" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="580" y="984" text-anchor="middle" font-family="sans-serif" fill="#303a36">
    <tspan x="580" font-size="24" font-weight="bold">both known:</tspan>
    <tspan x="580" dy="30" font-size="24" font-weight="bold">forward only to port 2</tspan>
  </text>

  
  <circle cx="535" cy="1080" r="24" fill="#207448"/>
  <text x="535" y="1088" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
  <text x="790" y="1068" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">frame</text>
  <line x1="580" y1="1080" x2="988" y2="1080" stroke="#207448" stroke-width="3" marker-end="url(#arrow-right)"/>
</svg>