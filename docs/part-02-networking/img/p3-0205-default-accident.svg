<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Two default routes: which one wins, and what happens on failover</title>
  <desc>Visual infographic explaining Linux kernel default route selection, metric priority, link failover sequence, and routing best practices.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <g transform="translate(50, 40)">
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Two default routes: which one wins, and what happens on failover</text>
  </g>

  
  <g transform="translate(50, 110)">
    
    <rect width="470" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    
    <g transform="translate(24, 24)">
      
      <rect x="0" y="4" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="15" x2="16" y2="15" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="27" x2="16" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="15" r="2.5" fill="#207448"/>
      <circle cx="36" cy="27" r="2.5" fill="#207448"/>
      <text x="58" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Dual-NIC Host</text>
    </g>

    
    <g transform="translate(24, 80)">
      <rect width="422" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(20, 20)">
        <rect width="180" height="100" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
        <text x="90" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">eno1</text>
        <rect x="25" y="55" width="130" height="30" rx="4" fill="#e8f1ea"/>
        <text x="90" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DHCP lease</text>
      </g>

      
      <g transform="translate(222, 20)">
        <rect width="180" height="100" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
        <text x="90" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">ens1f0</text>
        <rect x="25" y="55" width="130" height="30" rx="4" fill="#e8f1ea"/>
        <text x="90" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DHCP lease</text>
      </g>
    </g>

    
    <g transform="translate(24, 246)">
      
      <g transform="translate(0, 0)">
        <line x1="110" y1="0" x2="110" y2="40" stroke="#207448" stroke-width="4"/>
        <path d="M 30 70 L 190 70 L 190 120 L 30 120 L 5 95 Z" fill="#207448"/>
        <text x="105" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">everywhere else</text>
      </g>

      
      <g transform="translate(212, 0)">
        <line x1="100" y1="0" x2="100" y2="40" stroke="#207448" stroke-width="4"/>
        <path d="M 20 70 L 180 70 L 205 95 L 180 120 L 20 120 Z" fill="#207448"/>
        <text x="105" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">everywhere else</text>
      </g>
    </g>

    
    <g transform="translate(24, 400)">
      
      <g transform="translate(0, 0)">
        <rect width="422" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
        <circle cx="44" cy="46" r="20" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <text x="44" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">=</text>
        <text x="76" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tie condition</text>
        
        <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
          <tspan x="24" dy="0">equal metrics: the kernel</tspan>
          <tspan x="24" dy="32">uses the first one</tspan>
        </text>
      </g>

      
      <g transform="translate(0, 174)">
        <rect width="422" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
        <circle cx="44" cy="46" r="20" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <text x="44" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">&lt;</text>
        <text x="76" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Priority rule</text>
        
        <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
          <tspan x="24" dy="0">different metrics: the</tspan>
          <tspan x="24" dy="32">lowest wins</tspan>
        </text>
      </g>
    </g>
  </g>

  
  <g transform="translate(550, 110)">
    
    <rect width="500" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <g transform="translate(24, 24)">
      
      <path d="M 4 24 L 14 24 L 20 10 L 28 36 L 36 18 L 42 24 L 50 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Failover Sequence</text>
    </g>

    
    <g transform="translate(24, 76)">
      <rect width="452" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="40" cy="36" r="18" fill="#207448"/>
      <text x="40" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="70" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Normal State</text>
      <text x="24" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">Step 1: preferred route metric</tspan>
        <tspan x="24" dy="30">100 carries traffic</tspan>
      </text>
    </g>

    
    <line x1="250" y1="206" x2="250" y2="228" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>

    
    <g transform="translate(24, 230)">
      <rect width="452" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="40" cy="36" r="18" fill="#207448"/>
      <text x="40" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="70" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Link Disconnect</text>
      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">Step 2: its interface loses</tspan>
        <tspan x="24" dy="28">carrier, the route stops</tspan>
        <tspan x="24" dy="28">being usable</tspan>
      </text>
    </g>

    
    <line x1="250" y1="380" x2="250" y2="402" stroke="#207448" stroke-width="3" marker-end="url(#arrow-down)"/>

    
    <g transform="translate(24, 404)">
      <rect width="452" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="40" cy="36" r="18" fill="#207448"/>
      <text x="40" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="70" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Automatic Backup</text>
      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">Step 3: the metric 200 route</tspan>
        <tspan x="24" dy="28">takes over without anyone</tspan>
        <tspan x="24" dy="28">touching the table</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 582)">
      <rect width="452" height="164" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
      
      <g transform="translate(20, 16)">
        <polygon points="18,4 34,32 2,32" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
        <line x1="18" y1="14" x2="18" y2="22" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
        <circle cx="18" cy="27" r="1.5" fill="#db8129"/>
        <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">Routing Caveat</text>
      </g>
      <text x="24" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">replies that arrive on the</tspan>
        <tspan x="24" dy="28">wrong NIC may then be</tspan>
        <tspan x="24" dy="28">dropped by rp_filter</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(1080, 110)">
    
    <rect width="470" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    
    <g transform="translate(24, 24)">
      
      <path d="M 6 10 L 24 2 L 42 10 L 42 24 C 42 36 24 44 24 44 C 24 44 6 36 6 24 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 16 22 L 22 28 L 32 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Recommended Fix</text>
    </g>

    
    <g transform="translate(24, 80)">
      <rect width="422" height="660" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

      
      <g transform="translate(24, 30)">
        <rect width="374" height="150" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
        <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
          <tspan x="20" dy="0" font-weight="bold" fill="#207448">Architecture Rule:</tspan>
          <tspan x="20" dy="32">Keep exactly one default</tspan>
          <tspan x="20" dy="30">route per routing table;</tspan>
        </text>
      </g>

      
      <g transform="translate(24, 202)">
        <rect width="374" height="160" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
        <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
          <tspan x="20" dy="0" font-weight="bold" fill="#207448">Auxiliary Paths:</tspan>
          <tspan x="20" dy="32">reach other networks with</tspan>
          <tspan x="20" dy="30">specific routes or</tspan>
          <tspan x="20" dy="30">policy routing;</tspan>
        </text>
      </g>

      
      <g transform="translate(24, 384)">
        <rect width="374" height="246" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
        <text x="20" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Interface Configuration:</text>
        <text x="20" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#207448">
          <tspan x="20" dy="0">nmcli connection modify</tspan>
          <tspan x="20" dy="30">&lt;rail NIC&gt;</tspan>
          <tspan x="20" dy="30">ipv4.never-default yes</tspan>
        </text>
        <text x="20" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
          <tspan x="20" dy="0">keeps a NIC from installing</tspan>
          <tspan x="20" dy="30">a default route</tspan>
        </text>
      </g>
    </g>
  </g>

  
  
  <g transform="translate(50, 910)">
    <rect width="520" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <g transform="translate(24, 24)">
      
      <path d="M 24 6 L 24 38 M 12 14 L 36 14 M 6 26 L 18 26 L 12 14 Z M 30 26 L 42 26 L 36 14 Z M 16 38 L 32 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Prefix Tie Example</text>
    </g>

    <g transform="translate(24, 76)">
      <rect width="472" height="256" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
        <tspan x="24" dy="0">two routes to the same /24,</tspan>
        <tspan x="24" dy="38">metric 100 and metric 200:</tspan>
        <tspan x="24" dy="38" font-weight="bold" fill="#207448">the kernel uses 100</tspan>
      </text>

      <g transform="translate(24, 160)">
        <rect width="190" height="64" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <text x="95" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Metric 100 (Wins)</text>

        <rect x="220" y="0" width="190" height="64" rx="6" fill="#f5f8f5" stroke="#8cb89c" stroke-width="1.5"/>
        <text x="315" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#7a8880">Metric 200</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(600, 910)">
    <rect width="950" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(24, 24)">
      
      <rect x="4" y="6" width="42" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 12 18 L 18 23 L 12 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Idempotent Replacement</text>
    </g>

    <g transform="translate(24, 76)">
      <rect width="902" height="256" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      
      <g transform="translate(20, 20)">
        <rect width="862" height="80" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
        <text x="20" y="38" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="25" font-weight="bold" fill="#207448">
          <tspan x="20" dy="0">ip route replace default via 10.20.0.1 dev eno1</tspan>
          <tspan x="20" dy="30">metric 100</tspan>
        </text>
      </g>

      
      <text x="24" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">is idempotent: running it twice leaves the same result as once,</tspan>
        <tspan x="24" dy="34">which makes it safe in a script that may be run again after</tspan>
        <tspan x="24" dy="34">a failure</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(50, 1300)">
    <rect width="1500" height="80" rx="10" fill="#207448" filter="url(#shadow)"/>
    <circle cx="45" cy="40" r="16" fill="#ffffff" fill-opacity="0.2"/>
    <text x="45" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">i</text>
    <text x="80" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Metrics are the usual way to describe primary and backup paths on a host</text>
  </g>
</svg>