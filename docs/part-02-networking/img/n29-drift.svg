<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Terraform and configuration drift</title>
  <desc>Visual infographic explaining configuration drift in cloud infrastructure managed by Terraform, showing how unrecorded console changes cause rebuild failures and how terraform plan detects drift.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 3 L 9 6 L 2 9 z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="#f5f8f5"/>

  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Terraform and configuration drift</text>

  <g id="panel-1">
    <rect x="40" y="115" width="470" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    <circle cx="275" cy="160" r="24" fill="#207448"/>
    <text x="275" y="169" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

    <g transform="translate(247, 198)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 4 L 34 4 L 48 18 L 48 52 L 8 52 Z"/>
      <path d="M 34 4 L 34 18 L 48 18"/>
      <path d="M 20 31 L 14 36 L 20 41"/>
      <path d="M 36 31 L 42 36 L 36 41"/>
      <line x1="29" y1="29" x2="27" y2="43"/>
    </g>

    <text x="275" y="295" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Code says</text>

    <rect x="55" y="325" width="440" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="275" y="365" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Terraform resources</text>

    <rect x="68" y="385" width="414" height="48" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="275" y="418" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">google_compute_network</text>

    <rect x="68" y="445" width="414" height="48" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="275" y="478" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">google_compute_subnetwork</text>

    <rect x="68" y="505" width="414" height="48" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="275" y="538" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">google_compute_firewall</text>

    <rect x="55" y="615" width="440" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="275" y="658" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="275" dy="0">declarative,</tspan>
      <tspan x="275" dy="34">state recorded</tspan>
    </text>
  </g>

  <line x1="510" y1="430" x2="556" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="panel-2">
    <rect x="565" y="115" width="470" height="630" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    <circle cx="800" cy="160" r="24" fill="#207448"/>
    <text x="800" y="169" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

    <g transform="translate(772, 198)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18" stroke-width="3"/>
      <circle cx="12" cy="11" r="2.5" fill="#207448"/>
      <circle cx="20" cy="11" r="2.5" fill="#207448"/>
      <circle cx="28" cy="11" r="2.5" fill="#207448"/>
      <path d="M 14 30 L 22 36 L 14 42" stroke-width="3"/>
      <line x1="26" y1="42" x2="38" y2="42" stroke-width="3"/>
    </g>

    <text x="800" y="292" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Someone adds a</tspan>
      <tspan x="800" dy="38">firewall rule in the</tspan>
      <tspan x="800" dy="38">console to fix</tspan>
      <tspan x="800" dy="38">something urgent</tspan>
    </text>

    <rect x="585" y="455" width="430" height="105" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(605, 485)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 4 H 28 L 36 12 V 44 H 4 Z"/>
      <line x1="10" y1="20" x2="30" y2="20"/>
      <line x1="10" y1="28" x2="24" y2="28"/>
      <line x1="6" y1="38" x2="34" y2="10" stroke-width="3.5"/>
    </g>
    <text x="815" y="518" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">nobody writes it down</text>

    <rect x="585" y="580" width="430" height="140" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(605, 628)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 36 L 20 20 L 38 20"/>
      <path d="M 20 20 L 38 4"/>
      <circle cx="38" cy="20" r="3" fill="#207448"/>
      <circle cx="38" cy="4" r="3" fill="#db8129"/>
    </g>
    <text x="815" y="660" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">reality has drifted</text>
  </g>

  <line x1="1035" y1="430" x2="1081" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g id="panel-3">
    <rect x="1090" y="115" width="470" height="630" rx="16" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>

    <circle cx="1325" cy="160" r="24" fill="#207448"/>
    <text x="1325" y="169" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>

    <g transform="translate(1297, 198)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28 14 28 28 38 28"/>
      <path d="M 48 16 A 26 26 0 0 1 52 38" stroke-width="3"/>
      <polyline points="46 42 52 38 56 44" stroke-width="3"/>
    </g>

    <text x="1325" y="292" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1325" dy="0">Months later a rebuild</tspan>
      <tspan x="1325" dy="38">recreates the network</tspan>
      <tspan x="1325" dy="38">from code and the</tspan>
      <tspan x="1325" dy="38">rule is missing</tspan>
    </text>

    <rect x="1110" y="455" width="430" height="265" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>

    <g transform="translate(1325, 525)">
      <path d="M 0 -42 L 38 28 L -38 28 Z" fill="#fff8f2" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
      <line x1="0" y1="-18" x2="0" y2="6" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="3.5" fill="#db8129"/>
    </g>

    <rect x="1135" y="585" width="380" height="52" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="2.5" stroke-dasharray="8 6"/>
    <line x1="1160" y1="611" x2="1350" y2="611" stroke="#db8129" stroke-width="3" stroke-dasharray="6 6"/>
    <g transform="translate(1470, 611)" stroke="#db8129" stroke-width="4" stroke-linecap="round">
      <line x1="-10" y1="-10" x2="10" y2="10"/>
      <line x1="10" y1="-10" x2="-10" y2="10"/>
    </g>

    <g transform="translate(1325, 675)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="-110" y1="0" x2="-20" y2="0"/>
      <line x1="20" y1="0" x2="110" y2="0"/>
      <line x1="-20" y1="-8" x2="-8" y2="8"/>
      <line x1="8" y1="-8" x2="20" y2="8"/>
    </g>
  </g>

  <g id="terraform-bar">
    <rect x="40" y="775" width="1520" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(80, 797)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18"/>
      <line x1="38" y1="38" x2="50" y2="50"/>
      <line x1="16" y1="24" x2="32" y2="24"/>
      <line x1="24" y1="16" x2="24" y2="32"/>
    </g>
    <text x="800" y="836" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">plan shows where reality has drifted from the code</text>
  </g>

  <g id="footer-takeaway">
    <rect x="40" y="900" width="1520" height="95" rx="14" fill="#207448"/>
    <g transform="translate(80, 947)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
      <path d="M -10 0 L -2 8 L 12 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="800" y="958" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">make no console-only changes</text>
  </g>
</svg>