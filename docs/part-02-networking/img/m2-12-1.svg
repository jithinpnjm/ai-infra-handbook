<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The problem: many parallel links, one conversation</title>
  <desc>Flowchart showing packet hash calculation and modulo mapping to member links in link aggregation</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The problem: many parallel links, one conversation</text>

  
  <g id="node-frame">
    <rect x="60" y="280" width="320" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(192, 310)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="4"/>
      <line x1="18" y1="0" x2="18" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="0" x2="38" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="34" x2="44" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="44" x2="32" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="220" y="415" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Frame / packet</text>
    
    <text x="220" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="220" dy="0">src MAC, dst MAC,</tspan>
      <tspan x="220" dy="42">src IP, dst IP,</tspan>
      <tspan x="220" dy="42">proto, src port,</tspan>
      <tspan x="220" dy="42">dst port</tspan>
    </text>
  </g>

  
  <g id="node-hash">
    <rect x="440" y="350" width="290" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(557, 385)">
      <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="38" x2="52" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="4" x2="14" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="42" y1="4" x2="36" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="585" y="485" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Hash</text>
    <text x="585" y="535" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(selected fields)</text>
  </g>

  
  <g id="node-mod">
    <rect x="790" y="330" width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(927, 365)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="38" x2="56" y2="38" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="0" x2="28" y2="56" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="955" y="470" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">hash mod N</text>
    <text x="955" y="525" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="955" dy="0">(or consistent/</tspan>
      <tspan x="955" dy="40">resilient table)</tspan>
    </text>
  </g>

  
  <g id="node-link1">
    <rect x="1240" y="180" width="290" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(1357, 205)">
      <rect x="4" y="0" width="48" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 16 32 v -8 h 24 v 8" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="1385" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Member link 1</text>
  </g>

  
  <g id="node-link2">
    <rect x="1240" y="425" width="290" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(1357, 450)">
      <rect x="4" y="0" width="48" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 16 32 v -8 h 24 v 8" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="1385" y="540" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Member link 2</text>
  </g>

  
  <g id="node-link3">
    <rect x="1240" y="670" width="290" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <g transform="translate(1357, 695)">
      <rect x="4" y="0" width="48" height="32" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="16" x2="40" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 16 32 v -8 h 24 v 8" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="1385" y="785" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Member link N</text>
  </g>

  
  <line x1="380" y1="500" x2="440" y2="500" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="730" y1="500" x2="790" y2="500" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1120 460 h 50 a 16 16 0 0 0 16 -16 V 271 a 16 16 0 0 1 16 -16 h 38" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1120" y1="500" x2="1240" y2="500" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <path d="M 1120 540 h 50 a 16 16 0 0 1 16 16 V 729 a 16 16 0 0 0 16 16 h 38" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
</svg>