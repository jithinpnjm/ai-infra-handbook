<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How a Linux host resolves names</title>
  <desc>Visual flowchart illustrating how a Linux host resolves names through getaddrinfo, nsswitch.conf, hosts, resolv.conf, systemd-resolved, recursive resolver, and the authoritative internet.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How a Linux host resolves names</text>

  
  <rect x="480" y="110" width="640" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(506, 133)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="50" height="42" rx="6" />
    <line x1="0" y1="12" x2="50" y2="12" />
    <circle cx="9" cy="6" r="2" fill="#207448" />
    <circle cx="17" cy="6" r="2" fill="#207448" />
    <circle cx="25" cy="6" r="2" fill="#207448" />
    <polyline points="14,24 21,30 14,36" />
    <line x1="26" y1="36" x2="38" y2="36" />
  </g>
  <text x="576" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Application: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">getaddrinfo()</tspan></text>

  
  <line x1="800" y1="200" x2="800" y2="255" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="300" y="255" width="1000" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(328, 296)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 0 L 32 0 L 44 12 L 44 52 L 6 52 Z" />
    <path d="M 32 0 L 32 12 L 44 12" />
    <line x1="14" y1="24" x2="36" y2="24" />
    <circle cx="20" cy="24" r="3.5" fill="#207448" />
    <line x1="14" y1="38" x2="36" y2="38" />
    <circle cx="30" cy="38" r="3.5" fill="#207448" />
  </g>
  <text x="395" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="bold" fill="#303a36">/etc/nsswitch.conf</text>
  <text x="395" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">hosts: files mdns4_minimal [NOTFOUND=return] dns</text>

  
  <path d="M 400 390 V 425 H 260 V 460" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="330" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#303a36">files</text>

  
  <line x1="810" y1="390" x2="810" y2="460" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="826" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#303a36">dns</text>

  
  <rect x="70" y="460" width="380" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(96, 488)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 0 L 32 0 L 44 12 L 44 52 L 6 52 Z" />
    <path d="M 32 0 L 32 12 L 44 12" />
    <line x1="14" y1="22" x2="28" y2="22" />
    <line x1="14" y1="32" x2="36" y2="32" />
    <line x1="14" y1="42" x2="24" y2="42" />
  </g>
  <text x="162" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="bold" fill="#303a36">/etc/hosts</text>

  
  <rect x="560" y="460" width="500" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(586, 488)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 0 L 32 0 L 44 12 L 44 52 L 6 52 Z" />
    <path d="M 32 0 L 32 12 L 44 12" />
    <circle cx="23" cy="34" r="7" />
    <path d="M 23 21 L 23 25" />
    <path d="M 23 43 L 23 47" />
    <path d="M 10 34 L 14 34" />
    <path d="M 32 34 L 36 34" />
  </g>
  <text x="654" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="bold" fill="#303a36">/etc/resolv.conf</text>

  
  <line x1="720" y1="570" x2="720" y2="640" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="736" y="612" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">nameserver 127.0.0.53</text>

  
  <rect x="450" y="640" width="720" height="140" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
  <g transform="translate(480, 684)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="26" r="10" />
    <path d="M 26 6 L 26 12 M 26 40 L 26 46 M 6 26 L 12 26 M 40 26 L 46 26 M 12 12 L 16 16 M 36 36 L 40 40 M 12 40 L 16 36 M 36 16 L 40 12" />
  </g>
  <text x="555" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">systemd-resolved stub</text>
  <text x="555" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(per-link DNS, caching, DNSSEC, split DNS)</text>

  
  <path d="M 1060 515 H 1270 V 910 H 1070" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="1295" y="695" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#303a36">nameserver 10.0.0.2<tspan x="1295" dy="32">(direct)</tspan></text>

  
  <line x1="810" y1="780" x2="810" y2="855" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="550" y="855" width="520" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(578, 883)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="52" height="18" rx="4" />
    <circle cx="10" cy="11" r="2.5" fill="#207448" />
    <line x1="20" y1="11" x2="42" y2="11" />
    <rect x="0" y="26" width="52" height="18" rx="4" />
    <circle cx="10" cy="35" r="2.5" fill="#207448" />
    <line x1="20" y1="35" x2="42" y2="35" />
  </g>
  <text x="650" y="922" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Recursive resolver</text>

  
  <line x1="810" y1="965" x2="810" y2="1030" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="550" y="1030" width="520" height="105" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(578, 1056)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="26" r="23" />
    <ellipse cx="26" cy="26" rx="11" ry="23" />
    <line x1="3" y1="26" x2="49" y2="26" />
  </g>
  <text x="650" y="1095" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Internet / authoritative</text>
</svg>