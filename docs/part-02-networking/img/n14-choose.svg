<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>OSPF or IS-IS</title>
  <desc>Comparison table of OSPF and IS-IS across operational and technical considerations.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5"/>

  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">OSPF or IS-IS</text>

  <g id="table-headers">
    <rect x="40" y="92" width="480" height="65" rx="10" fill="#207448"/>
    <text x="280" y="136" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Consideration</text>

    <rect x="560" y="92" width="460" height="65" rx="10" fill="#207448"/>
    <text x="790" y="136" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Prefer OSPF</text>

    <rect x="1060" y="92" width="500" height="65" rx="10" fill="#207448"/>
    <text x="1310" y="136" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Prefer IS-IS</text>
  </g>

  <g id="row-1">
    <rect x="40" y="182" width="480" height="114" rx="10" fill="#fff7f0" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(62, 214)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="18" r="8"/>
      <path d="M 6 44 C 6 34 12 30 20 30 C 28 30 34 34 34 44"/>
      <circle cx="36" cy="14" r="6"/>
      <path d="M 32 26 C 37 27 46 30 46 40"/>
    </g>
    <text x="140" y="250" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Familiarity</text>

    <rect x="560" y="182" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="249" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">everywhere</text>

    <rect x="1060" y="182" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="233" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="1310" dy="0">strong in carriers,</tspan>
      <tspan x="1310" dy="32">less in enterprise</tspan>
    </text>
  </g>

  <g id="row-2">
    <rect x="40" y="314" width="480" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 346)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="6" width="30" height="24" rx="4"/>
      <rect x="6" y="18" width="30" height="24" rx="4" fill="#e8f1ea"/>
      <line x1="12" y1="26" x2="24" y2="26"/>
      <line x1="12" y1="34" x2="30" y2="34"/>
    </g>
    <text x="140" y="382" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">IPv4+IPv6</text>

    <rect x="560" y="314" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="381" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">v2+v3 or AFs</text>

    <rect x="1060" y="314" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="381" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">one process carries both</text>
  </g>

  <g id="row-3">
    <rect x="40" y="446" width="480" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 478)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="12" r="6"/>
      <circle cx="12" cy="38" r="5"/>
      <circle cx="40" cy="38" r="5"/>
      <line x1="26" y1="18" x2="26" y2="26"/>
      <line x1="12" y1="26" x2="40" y2="26"/>
      <line x1="12" y1="26" x2="12" y2="33"/>
      <line x1="40" y1="26" x2="40" y2="33"/>
    </g>
    <text x="140" y="514" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Hierarchy</text>

    <rect x="560" y="446" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="513" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">areas with ABRs</text>

    <rect x="1060" y="446" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="513" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">levels, boundary on links</text>
  </g>

  <g id="row-4">
    <rect x="40" y="578" width="480" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 610)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="28" height="28" rx="4"/>
      <path d="M 34 22 L 44 22 L 44 34 L 34 34"/>
      <line x1="20" y1="22" x2="20" y2="34"/>
      <line x1="14" y1="28" x2="26" y2="28"/>
    </g>
    <text x="140" y="646" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Extensibility</text>

    <rect x="560" y="578" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="645" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">LSA types</text>

    <rect x="1060" y="578" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="645" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">TLVs, easy</text>
  </g>

  <g id="row-5">
    <rect x="40" y="710" width="480" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 742)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="14" height="20" rx="3"/>
      <rect x="32" y="16" width="14" height="20" rx="3"/>
      <line x1="20" y1="26" x2="32" y2="26"/>
      <line x1="26" y1="10" x2="26" y2="16"/>
    </g>
    <text x="140" y="759" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="140" dy="0">Adjacency independence</tspan>
      <tspan x="140" dy="32">from IP</tspan>
    </text>

    <rect x="560" y="710" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="777" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">needs IP</text>

    <rect x="1060" y="710" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="777" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">doesn't</text>
  </g>

  <g id="row-6">
    <rect x="40" y="842" width="480" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 874)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="38" r="5"/>
      <circle cx="26" cy="14" r="5"/>
      <circle cx="42" cy="34" r="5"/>
      <path d="M 14 34 Q 26 14 26 14 Q 26 14 38 31"/>
      <polyline points="32,29 39,32 37,25"/>
    </g>
    <text x="140" y="910" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">MPLS TE and SR</text>

    <rect x="560" y="842" width="460" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="790" y="909" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">supported</text>

    <rect x="1060" y="842" width="500" height="114" rx="10" fill="#e8f1ea" stroke="#c2dbca" stroke-width="1.5"/>
    <text x="1310" y="909" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">strong heritage</text>
  </g>

  <g id="takeaway-bar">
    <rect x="40" y="980" width="1520" height="76" rx="10" fill="#207448"/>
    <g transform="translate(68, 995)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 6 L 40 12 L 40 24 C 40 35 24 43 24 43 C 24 43 8 35 8 24 L 8 12 Z"/>
      <polyline points="16,24 21,29 32,18"/>
    </g>
    <text x="800" y="1027" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Choose the one your organisation can operate</text>
  </g>
</svg>