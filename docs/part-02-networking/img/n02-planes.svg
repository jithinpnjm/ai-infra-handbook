<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>The three planes</title>
  <desc>Infographic illustrating the three architectural planes of networking: Management plane, Control plane, and Data (forwarding) plane, including their responsibilities, protocol chips, and route transfer.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The three planes</text>

  
  <g>
    <rect x="80" y="110" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="108" y="128" width="50" height="42" rx="6"/>
      <line x1="118" y1="142" x2="148" y2="142"/>
      <line x1="126" y1="137" x2="126" y2="147"/>
      <line x1="118" y1="156" x2="148" y2="156"/>
      <line x1="140" y1="151" x2="140" y2="161"/>
    </g>

    <text x="180" y="150" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Management plane</text>
    <text x="180" y="184" font-family="sans-serif" font-size="24" fill="#303a36">configures and monitors</text>

    
    <g>
      <rect x="180" y="214" width="90" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="225" y="249" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">SSH</text>

      <rect x="294" y="214" width="180" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="384" y="249" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">REST APIs</text>

      <rect x="498" y="214" width="340" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="668" y="249" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Prometheus exporters</text>

      <rect x="862" y="214" width="230" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="977" y="249" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">NETCONF/gNMI</text>

      <rect x="1116" y="214" width="130" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="1181" y="249" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">syslog</text>
    </g>
  </g>

  
  <g>
    <rect x="80" y="365" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g stroke="#207448" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="133" y1="138" x2="117" y2="162" stroke-width="4" transform="translate(0, 255)"/>
      <line x1="133" y1="138" x2="149" y2="162" stroke-width="4" transform="translate(0, 255)"/>
      <line x1="120" y1="165" x2="146" y2="165" stroke-width="4" transform="translate(0, 255)"/>
      <circle cx="133" cy="390" r="7" stroke-width="4"/>
      <circle cx="115" cy="420" r="7" stroke-width="4"/>
      <circle cx="151" cy="420" r="7" stroke-width="4"/>
    </g>

    <text x="180" y="405" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Control plane</text>
    <text x="180" y="439" font-family="sans-serif" font-size="24" fill="#303a36">builds the tables</text>

    
    <g>
      <rect x="180" y="469" width="110" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="235" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">OSPF</text>

      <rect x="314" y="469" width="120" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="374" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">IS-IS</text>

      <rect x="458" y="469" width="100" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="508" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">BGP</text>

      <rect x="582" y="469" width="100" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="632" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">STP</text>

      <rect x="706" y="469" width="140" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="776" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ARP/ND</text>

      <rect x="870" y="469" width="110" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="925" y="504" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">LACP</text>
    </g>
  </g>

  
  <g>
    <line x1="500" y1="575" x2="500" y2="675" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>
    <rect x="540" y="604" width="380" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="730" y="639" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">RIB best routes -&gt; FIB</text>
  </g>

  
  <g>
    <rect x="80" y="685" width="1440" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g stroke="#207448" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="108" y="703" width="50" height="42" rx="6" stroke-width="4"/>
      <path d="M 120 717 L 144 717 M 138 712 L 144 717 L 138 722" stroke-width="3"/>
      <path d="M 146 731 L 122 731 M 128 726 L 122 731 L 128 736" stroke-width="3"/>
    </g>

    <text x="180" y="725" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Data (forwarding) plane</text>
    <text x="180" y="759" font-family="sans-serif" font-size="24" fill="#303a36">moves packets at line rate: parse, lookup FIB, rewrite, queue, transmit</text>

    
    <g>
      <rect x="180" y="789" width="180" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="270" y="824" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">switching</text>

      <rect x="384" y="789" width="100" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="434" y="824" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">NAT</text>

      <rect x="508" y="789" width="220" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="618" y="824" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ACL matching</text>
    </g>
  </g>

  
  <g>
    <rect x="80" y="945" width="1440" height="85" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="2.5"/>
    <circle cx="130" cy="987" r="20" fill="none" stroke="#db8129" stroke-width="3"/>
    <text x="130" y="996" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">?</text>
    <text x="175" y="996" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">What happens to traffic when the control plane fails?</text>
  </g>
</svg>