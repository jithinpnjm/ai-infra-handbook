<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Life cycle of a TCP server socket</title>
  <desc>Visual explanation of the life cycle of a TCP server socket from socket, bind, and listen calls to the accept loop, read, write, and close operations, including socket types and configuration side notes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <polygon points="0,2 16,9 0,16" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Life cycle of a TCP server socket</text>

  

  
  <g id="step-socket">
    <rect x="50" y="115" width="490" height="85" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="88" cy="157" r="24" fill="#207448" />
    <text x="88" y="166" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(126, 131)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="44" height="40" rx="6" />
      <path d="M 14 26 L 14 36 M 26 26 L 26 36 M 38 26 L 38 36" />
      <line x1="16" y1="6" x2="36" y2="6" stroke-width="6" />
    </g>
    <text x="196" y="167" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">socket()</text>
  </g>

  
  <line x1="295" y1="200" x2="295" y2="241" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="step-bind">
    <rect x="50" y="243" width="490" height="85" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="88" cy="285" r="24" fill="#207448" />
    <text x="88" y="294" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(126, 259)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 26 6 C 16 6 8 14 8 24 C 8 38 26 50 26 50 C 26 50 44 38 44 24 C 44 14 36 6 26 6 Z" />
      <circle cx="26" cy="24" r="6" />
    </g>
    <text x="196" y="295" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">bind(addr:port)</text>
  </g>

  
  <line x1="295" y1="328" x2="295" y2="369" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="step-listen">
    <rect x="50" y="371" width="490" height="85" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="88" cy="413" r="24" fill="#207448" />
    <text x="88" y="422" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(126, 387)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 14 C 18 8 34 8 40 14" />
      <path d="M 18 22 C 22 18 30 18 34 22" />
      <circle cx="26" cy="30" r="4" fill="#207448" />
      <line x1="26" y1="34" x2="26" y2="48" />
      <line x1="16" y1="48" x2="36" y2="48" />
    </g>
    <text x="196" y="423" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">listen(backlog)</text>
  </g>

  
  <line x1="295" y1="456" x2="295" y2="522" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="container-loop">
    <rect x="40" y="495" width="510" height="485" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
    
    <text x="65" y="525" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">loop:</text>

    
    <g id="step-accept">
      <rect x="52" y="540" width="486" height="115" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
      <circle cx="90" cy="597" r="24" fill="#207448" />
      <text x="90" y="606" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(126, 571)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="26" cy="26" r="20" />
        <polyline points="18 26 24 32 36 20" />
      </g>
      <text x="196" y="583" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">accept()</text>
      
      <text x="196" y="626" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">returns a new socket</text>
    </g>

    
    <line x1="295" y1="655" x2="295" y2="691" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="step-read-write">
      <rect x="52" y="693" width="486" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="90" cy="760" r="24" fill="#207448" />
      <text x="90" y="769" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
      
      <g transform="translate(126, 734)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="8" y1="18" x2="44" y2="18" />
        <polyline points="32 10 44 18 32 26" />
        <line x1="44" y1="36" x2="8" y2="36" />
        <polyline points="20 28 8 36 20 44" />
      </g>
      <text x="196" y="738" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="196" dy="0">read/recv</tspan>
        <tspan x="196" dy="34"><tspan font-family="sans-serif" font-size="24" font-weight="normal">and </tspan>write/send</tspan>
        <tspan x="196" dy="32" font-family="sans-serif" font-size="24" font-weight="normal">on it</tspan>
      </text>
    </g>

    
    <line x1="295" y1="828" x2="295" y2="861" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="step-close">
      <rect x="52" y="863" width="486" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <circle cx="90" cy="905" r="24" fill="#207448" />
      <text x="90" y="914" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
      
      <g transform="translate(126, 879)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="10" y="20" width="32" height="26" rx="4" />
        <path d="M 18 20 V 12 C 18 7 34 7 34 12 V 20" />
      </g>
      <text x="196" y="915" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">close</text>
    </g>
  </g>

  

  
  <g id="side-note-1">
    <rect x="580" y="115" width="520" height="235" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(610, 137)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 8 L 34 8 L 46 20 L 46 48 L 12 48 Z" />
      <polyline points="34 8 34 20 46 20" />
      <line x1="20" y1="28" x2="38" y2="28" />
      <line x1="20" y1="38" x2="38" y2="38" />
    </g>
    <text x="610" y="218" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0" font-weight="bold">Sockets are file descriptors:</tspan>
      <tspan x="610" dy="36" font-family="monospace" font-weight="bold" fill="#207448">/proc/&lt;pid&gt;/fd,</tspan>
      <tspan x="610" dy="36">limited by <tspan font-family="monospace" font-weight="bold" fill="#207448">ulimit -n</tspan></tspan>
      <tspan x="610" dy="36">and <tspan font-family="monospace" font-weight="bold" fill="#207448">fs.file-max</tspan></tspan>
    </text>
  </g>

  
  <g id="side-note-2">
    <rect x="580" y="385" width="520" height="300" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(610, 407)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="26" cy="26" r="20" />
      <ellipse cx="26" cy="26" rx="9" ry="20" />
      <line x1="6" y1="26" x2="46" y2="26" />
    </g>
    <text x="610" y="488" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0" font-weight="bold">Binding to <tspan font-family="monospace" fill="#207448">0.0.0.0</tspan> or <tspan font-family="monospace" fill="#207448">::</tspan></tspan>
      <tspan x="610" dy="36">listens on all addresses;</tspan>
      <tspan x="610" dy="36">the address you bind</tspan>
      <tspan x="610" dy="36">decides who can reach the service</tspan>
    </text>
  </g>

  

  <g id="panel-socket-types">
    <rect x="1130" y="115" width="420" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(1158, 137)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="40" height="38" rx="6" />
      <line x1="16" y1="20" x2="36" y2="20" />
      <line x1="16" y1="30" x2="36" y2="30" />
      <line x1="16" y1="40" x2="28" y2="40" />
    </g>
    <text x="1225" y="174" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">socket types</text>

    
    <g id="chip-stream">
      <rect x="1150" y="210" width="380" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1150" y="210" width="10" height="95" rx="5" fill="#207448" />
      <text x="1178" y="267" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SOCK_STREAM <tspan font-family="sans-serif" font-weight="normal">(TCP)</tspan></text>
    </g>

    
    <g id="chip-dgram">
      <rect x="1150" y="325" width="380" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1150" y="325" width="10" height="95" rx="5" fill="#207448" />
      <text x="1178" y="382" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SOCK_DGRAM <tspan font-family="sans-serif" font-weight="normal">(UDP)</tspan></text>
    </g>

    
    <g id="chip-raw">
      <rect x="1150" y="440" width="380" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1150" y="440" width="10" height="95" rx="5" fill="#207448" />
      <text x="1178" y="497" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SOCK_RAW <tspan font-family="sans-serif" font-weight="normal">(ICMP tools)</tspan></text>
    </g>

    
    <g id="chip-packet">
      <rect x="1150" y="555" width="380" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1150" y="555" width="10" height="95" rx="5" fill="#207448" />
      <text x="1178" y="612" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">AF_PACKET <tspan font-family="sans-serif" font-weight="normal">(tcpdump)</tspan></text>
    </g>
  </g>
</svg>