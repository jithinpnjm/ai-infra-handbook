<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Where TCP limits each AI workload</title>
  <desc>Matrix showing how TCP affects NCCL, data loading, inference serving, Kubernetes, and incast tail latency across AI workloads.</desc>

  <rect width="1600" height="1360" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#207448">Where TCP limits each AI workload</text>

  
  
  <rect x="365" y="85" width="310" height="52" rx="8" fill="#207448"/>
  <text x="520" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">How it uses TCP</text>

  
  <rect x="690" y="85" width="600" height="52" rx="8" fill="#207448"/>
  <text x="990" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">What limits it</text>

  
  <rect x="1305" y="85" width="255" height="52" rx="8" fill="#207448"/>
  <text x="1432" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Usual fixes</text>

  
  
  
  
  <rect x="40" y="150" width="310" height="280" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="167" y="180" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="181" y="194" width="28" height="28" fill="#207448"/>
  <line x1="179" y1="172" x2="179" y2="180" stroke="#207448" stroke-width="3"/>
  <line x1="195" y1="172" x2="195" y2="180" stroke="#207448" stroke-width="3"/>
  <line x1="211" y1="172" x2="211" y2="180" stroke="#207448" stroke-width="3"/>
  <line x1="179" y1="236" x2="179" y2="244" stroke="#207448" stroke-width="3"/>
  <line x1="195" y1="236" x2="195" y2="244" stroke="#207448" stroke-width="3"/>
  <line x1="211" y1="236" x2="211" y2="244" stroke="#207448" stroke-width="3"/>
  <line x1="159" y1="192" x2="167" y2="192" stroke="#207448" stroke-width="3"/>
  <line x1="159" y1="208" x2="167" y2="208" stroke="#207448" stroke-width="3"/>
  <line x1="159" y1="224" x2="167" y2="224" stroke="#207448" stroke-width="3"/>
  <line x1="223" y1="192" x2="231" y2="192" stroke="#207448" stroke-width="3"/>
  <line x1="223" y1="208" x2="231" y2="208" stroke="#207448" stroke-width="3"/>
  <line x1="223" y1="224" x2="231" y2="224" stroke="#207448" stroke-width="3"/>
  
  <text x="195" y="295" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">NCCL</text>

  
  <rect x="365" y="150" width="310" height="280" rx="10" fill="#ffffff" stroke="#c0d7c5" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="385" y="220">bootstrap (rank exchange)</tspan>
    <tspan x="385" y="258">and a fallback transport</tspan>
    <tspan x="385" y="296">when no IB or RoCE is</tspan>
    <tspan x="385" y="334">available</tspan>
  </text>

  
  <rect x="690" y="150" width="600" height="280" rx="10" fill="#ffffff" stroke="#c0d7c5" stroke-width="2"/>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="712" y="188">NCCL_SOCKET_IFNAME, sockets per</tspan>
    <tspan x="712" y="222">connection (NCCL_SOCKET_NTHREADS,</tspan>
    <tspan x="712" y="256">NCCL_NSOCKS_PERTHREAD), TCP_NODELAY,</tspan>
    <tspan x="712" y="290">buffer sizes, IRQ affinity, MTU;</tspan>
    <tspan x="712" y="324" font-family="sans-serif">throughput far below RDMA because every</tspan>
    <tspan x="712" y="358" font-family="sans-serif">byte passes through kernel copies and</tspan>
    <tspan x="712" y="392" font-family="sans-serif">costs CPU</tspan>
  </text>

  
  <rect x="1305" y="150" width="255" height="280" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1325" y="275">GPUDirect RDMA</tspan>
    <tspan x="1325" y="310">(Part 11)</tspan>
  </text>

  
  
  
  
  <rect x="40" y="445" width="310" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <ellipse cx="195" cy="478" rx="28" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 167 478 v 28 c 0 6 12 10 28 10 s 28 -4 28 -10 v -28" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 167 492 c 0 6 12 10 28 10 s 28 -4 28 -10" fill="none" stroke="#207448" stroke-width="3"/>
  
  <text font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="60" y="548">Data loading and</tspan>
    <tspan x="60" y="582">checkpoint I/O over</tspan>
    <tspan x="60" y="616">NFS, S3 or HTTP</tspan>
  </text>

  
  <rect x="365" y="445" width="925" height="210" rx="10" fill="#ffffff" stroke="#c0d7c5" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="395" y="535">window and BDP on long paths; CPU on 100G+ links without offloads</tspan>
  </text>

  
  <rect x="1305" y="445" width="255" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#207448">
    <tspan x="1325" y="515">parallel streams,</tspan>
    <tspan x="1325" y="550">large MTU on</tspan>
    <tspan x="1325" y="585">internal networks,</tspan>
    <tspan x="1325" y="620">tuned buffers</tspan>
  </text>

  
  
  
  
  <rect x="40" y="670" width="310" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="167" y="694" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="167" y1="708" x2="223" y2="708" stroke="#207448" stroke-width="3"/>
  <circle cx="178" cy="701" r="2.5" fill="#207448"/>
  <circle cx="188" cy="701" r="2.5" fill="#207448"/>
  <circle cx="198" cy="701" r="2.5" fill="#207448"/>
  
  <text font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="60" y="775">Inference serving</tspan>
    <tspan x="60" y="808">over HTTP/2 and gRPC</tspan>
  </text>

  
  <rect x="365" y="670" width="1195" height="170" rx="10" fill="#ffffff" stroke="#c0d7c5" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="395" y="742">connection reuse, keepalive settings, load balancer idle timeouts, Nagle with delayed ACK,</tspan>
    <tspan x="395" y="780">and head-of-line blocking: a lost packet stalls every stream on the connection</tspan>
  </text>

  
  
  
  
  <rect x="40" y="855" width="310" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="195" cy="898" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="195" cy="898" r="6" fill="#207448"/>
  <line x1="195" y1="876" x2="195" y2="870" stroke="#207448" stroke-width="4"/>
  <line x1="195" y1="920" x2="195" y2="926" stroke="#207448" stroke-width="4"/>
  <line x1="173" y1="898" x2="167" y2="898" stroke="#207448" stroke-width="4"/>
  <line x1="217" y1="898" x2="223" y2="898" stroke="#207448" stroke-width="4"/>
  
  <text x="195" y="970" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kubernetes</text>

  
  <rect x="365" y="855" width="1195" height="160" rx="10" fill="#ffffff" stroke="#c0d7c5" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="395" y="924">overlays can shrink the MTU, conntrack and kube-proxy NAT keep state and timeouts,</tspan>
    <tspan x="395" y="962">service load balancing can reset long-lived connections when endpoints change</tspan>
  </text>

  
  
  
  
  <rect x="40" y="1030" width="310" height="200" rx="10" fill="#fdf4eb" stroke="#db8129" stroke-width="3"/>
  
  <circle cx="195" cy="1075" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
  <polyline points="181,1078 190,1065 197,1085 204,1072 211,1078" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  
  <text font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
    <tspan x="60" y="1150">Incast and</tspan>
    <tspan x="60" y="1185">tail latency</tspan>
  </text>

  
  <rect x="365" y="1030" width="310" height="200" rx="10" fill="#ffffff" stroke="#f0c294" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="385" y="1090">many-to-one bursts</tspan>
    <tspan x="385" y="1126">and synchronized</tspan>
    <tspan x="385" y="1162">all-reduce barrier</tspan>
    <tspan x="385" y="1198">waits</tspan>
  </text>

  
  <rect x="690" y="1030" width="600" height="200" rx="10" fill="#ffffff" stroke="#f0c294" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="712" y="1118">a single 200 ms RTO costs hundreds of</tspan>
    <tspan x="712" y="1156">milliseconds of GPU idle per step</tspan>
  </text>

  
  <rect x="1305" y="1030" width="255" height="200" rx="10" fill="#fdf4eb" stroke="#db8129" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1325" y="1122">see the incast</tspan>
    <tspan x="1325" y="1158">figure</tspan>
  </text>

  
  
  
  <rect x="40" y="1255" width="1520" height="70" rx="10" fill="#207448"/>
  <text x="800" y="1298" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Capture TCPTimeouts and retransmit rates during any training job that uses socket transports</text>
</svg>