<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Segment routing and SD-WAN in brief</title>
  <desc>Infographic illustrating segment routing from ingress node A pushing SIDs 103 and 104 to transit and destination nodes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="95" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Segment routing and SD-WAN in brief</text>

  
  
  <path d="M 520 440 C 600 440, 620 300, 700 300" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 520 560 C 570 560, 570 700, 620 700" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 940 300 C 1020 300, 1050 440, 1130 440" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1020 700 C 1070 700, 1080 560, 1130 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-A">
    <rect x="70" y="360" width="450" height="280" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(267, 395)" stroke="#db8129" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3.5" />
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="3" />
      <polyline points="36,22 42,28 36,34" stroke-width="3" />
      <polyline points="20,22 14,28 20,34" stroke-width="3" />
      <line x1="28" y1="14" x2="28" y2="42" stroke-width="3" />
      <polyline points="22,20 28,14 34,20" stroke-width="3" />
      <polyline points="22,36 28,42 34,36" stroke-width="3" />
    </g>
    
    <text x="295" y="510" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="295" dy="0">A: ingress, pushes</tspan>
      <tspan x="295" dy="42">SIDs 103 then 104</tspan>
    </text>
  </g>

  
  <g id="node-B">
    <rect x="700" y="200" width="240" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(792, 230)" stroke="#207448" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3.5" />
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="3" />
      <polyline points="36,22 42,28 36,34" stroke-width="3" />
      <polyline points="20,22 14,28 20,34" stroke-width="3" />
      <line x1="28" y1="14" x2="28" y2="42" stroke-width="3" />
      <polyline points="22,20 28,14 34,20" stroke-width="3" />
      <polyline points="22,36 28,42 34,36" stroke-width="3" />
    </g>
    
    <text x="820" y="350" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#303a36">B</text>
  </g>

  
  <g id="node-C">
    <rect x="620" y="600" width="400" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(792, 630)" stroke="#207448" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3.5" />
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="3" />
      <polyline points="36,22 42,28 36,34" stroke-width="3" />
      <polyline points="20,22 14,28 20,34" stroke-width="3" />
      <line x1="28" y1="14" x2="28" y2="42" stroke-width="3" />
      <polyline points="22,20 28,14 34,20" stroke-width="3" />
      <polyline points="22,36 28,42 34,36" stroke-width="3" />
    </g>
    
    <text x="820" y="750" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">C: node SID 103</text>
  </g>

  
  <g id="node-D">
    <rect x="1130" y="390" width="400" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1302, 420)" stroke="#207448" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3.5" />
      <line x1="14" y1="28" x2="42" y2="28" stroke-width="3" />
      <polyline points="36,22 42,28 36,34" stroke-width="3" />
      <polyline points="20,22 14,28 20,34" stroke-width="3" />
      <line x1="28" y1="14" x2="28" y2="42" stroke-width="3" />
      <polyline points="22,20 28,14 34,20" stroke-width="3" />
      <polyline points="22,36 28,42 34,36" stroke-width="3" />
    </g>
    
    <text x="1330" y="540" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">D: node SID 104</text>
  </g>
</svg>