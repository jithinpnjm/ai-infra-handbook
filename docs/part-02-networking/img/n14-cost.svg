<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>OSPF cost and reference bandwidth</title>
  <desc>Visual comparison of OSPF interface cost calculations under default reference bandwidth versus raised reference bandwidth, with SPF throttling timers.</desc>

  <rect width="1600" height="920" fill="#f5f8f5"/>

  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">OSPF cost and reference bandwidth</text>

  <g id="formula">
    <rect x="60" y="110" width="1480" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(85, 119)" stroke="#207448" stroke-width="4" stroke-linecap="round" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="10"/>
      <line x1="14" y1="28" x2="42" y2="28"/>
      <circle cx="28" cy="18" r="3.5" fill="#207448" stroke="none"/>
      <circle cx="28" cy="38" r="3.5" fill="#207448" stroke="none"/>
    </g>
    <text x="165" y="157" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">cost = reference bandwidth / interface bandwidth (minimum 1)</text>
  </g>

  <g id="row-default">
    <rect x="60" y="225" width="1480" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="90" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Default reference 100 Mb/s</text>
    <line x1="60" y1="285" x2="1540" y2="285" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25"/>

    <rect x="90" y="300" width="400" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(110, 339)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="14" width="44" height="32" rx="6"/>
      <path d="M 18 14 L 18 6 L 38 6 L 38 14"/>
      <line x1="22" y1="26" x2="22" y2="36" stroke-width="3"/>
      <line x1="28" y1="26" x2="28" y2="36" stroke-width="3"/>
      <line x1="34" y1="26" x2="34" y2="36" stroke-width="3"/>
    </g>
    <text x="185" y="378" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">1G link cost 1</text>

    <rect x="530" y="300" width="400" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(550, 339)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="10" width="44" height="36" rx="6"/>
      <circle cx="20" cy="28" r="6" stroke-width="3"/>
      <circle cx="36" cy="28" r="6" stroke-width="3"/>
      <line x1="16" y1="46" x2="40" y2="46"/>
    </g>
    <text x="625" y="378" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">100G link cost 1</text>

    <rect x="970" y="300" width="540" height="135" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="2.5"/>
    <g transform="translate(990, 339)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="28,6 52,48 4,48"/>
      <line x1="28" y1="22" x2="28" y2="34"/>
      <circle cx="28" cy="42" r="2.5" fill="#db8129" stroke="none"/>
    </g>
    <text x="1065" y="360" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1065" dy="0">both look identical,</tspan>
      <tspan x="1065" dy="34">SPF cannot tell them apart</tspan>
    </text>
  </g>

  <g id="row-raised">
    <rect x="60" y="495" width="1480" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="90" y="535" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Reference raised to 400000 Mb/s</text>
    <line x1="60" y1="555" x2="1540" y2="555" stroke="#207448" stroke-width="1.5" stroke-opacity="0.25"/>

    <rect x="90" y="570" width="1420" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(120, 607)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="18,28 25,35 38,20"/>
    </g>
    <text x="205" y="628" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="205" dy="0">the two links get clearly different costs</tspan>
      <tspan x="205" dy="38">and SPF prefers the fast one</tspan>
    </text>
  </g>

  <g id="side-note">
    <rect x="60" y="760" width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(85, 787)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28,14 28,28 38,28"/>
      <line x1="24" y1="4" x2="32" y2="4" stroke-width="3"/>
    </g>
    <text x="165" y="827" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side note:</text>
    <text x="340" y="827">
      <tspan font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">timers throttle spf 50 100 5000</tspan>
      <tspan font-family="sans-serif" font-size="25" fill="#303a36"> = initial delay, hold time, maximum</tspan>
    </text>
  </g>
</svg>