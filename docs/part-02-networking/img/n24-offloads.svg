<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>NIC offloads: which to keep</title>
  <desc>Comparison table of NIC offload features including Checksum offload, TSO/GSO, GRO, LRO, and Flow control, with advice and ethtool commands.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="40" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">NIC offloads: which to keep</text>

  
  <g>
    <rect x="40" y="135" width="340" height="65" rx="8" fill="#207448"/>
    <text x="65" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Offload</text>

    <rect x="390" y="135" width="510" height="65" rx="8" fill="#207448"/>
    <text x="415" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">What it does</text>

    <rect x="910" y="135" width="650" height="65" rx="8" fill="#207448"/>
    <text x="935" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Advice</text>
  </g>

  
  <g>
    <rect x="40" y="215" width="340" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <path d="M 62 258 Q 82 252 102 258 Q 102 286 82 302 Q 62 286 62 258 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 72 278 L 79 285 L 93 270" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">Checksum</tspan>
      <tspan x="120" dy="36">offload</tspan>
    </text>

    <rect x="390" y="215" width="510" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="415" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="415" dy="0">NIC computes/validates</tspan>
      <tspan x="415" dy="34">L4 checksums</tspan>
    </text>

    <rect x="910" y="215" width="650" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="935" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="935" dy="0">capture on sender shows</tspan>
      <tspan x="935" dy="34">'bad cksum' (benign)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="360" width="340" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="62" y="398" width="40" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="82" y1="416" x2="82" y2="426" stroke="#207448" stroke-width="3.5"/>
    <rect x="62" y="426" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="86" y="426" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <text x="120" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">TSO/GSO</text>

    <rect x="390" y="360" width="510" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="415" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="415" dy="0">send 64 KB buffers, segmented</tspan>
      <tspan x="415" dy="34">into MTU-sized frames</tspan>
    </text>

    <rect x="910" y="360" width="650" height="130" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="930" y="388" width="360" height="74" rx="8" fill="#207448" fill-opacity="0.12" stroke="#207448" stroke-width="2"/>
    <text x="955" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">big CPU saver, enable</text>
  </g>

  
  <g>
    <rect x="40" y="505" width="340" height="145" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="62" y="545" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="86" y="545" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="82" y1="561" x2="82" y2="571" stroke="#207448" stroke-width="3.5"/>
    <rect x="62" y="571" width="40" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <text x="120" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">GRO</text>

    <rect x="390" y="505" width="510" height="145" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="415" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="415" dy="0">merge received packets</tspan>
      <tspan x="415" dy="34">into larger skbs</tspan>
    </text>

    <rect x="910" y="505" width="650" height="145" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="925" y="522" width="620" height="110" rx="8" fill="#db8129" fill-opacity="0.10" stroke="#db8129" stroke-width="2"/>
    <text x="940" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">may hurt forwarding, bridges, latency;</tspan>
      <tspan x="940" dy="34">disable on routers and VXLAN gateways</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="665" width="340" height="135" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="66" y="717" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="66" y1="725" x2="58" y2="725" stroke="#207448" stroke-width="3"/>
    <line x1="66" y1="741" x2="58" y2="741" stroke="#207448" stroke-width="3"/>
    <line x1="98" y1="725" x2="106" y2="725" stroke="#207448" stroke-width="3"/>
    <line x1="98" y1="741" x2="106" y2="741" stroke="#207448" stroke-width="3"/>
    <line x1="74" y1="717" x2="74" y2="709" stroke="#207448" stroke-width="3"/>
    <line x1="90" y1="717" x2="90" y2="709" stroke="#207448" stroke-width="3"/>
    <line x1="74" y1="749" x2="74" y2="757" stroke="#207448" stroke-width="3"/>
    <line x1="90" y1="749" x2="90" y2="757" stroke="#207448" stroke-width="3"/>
    <circle cx="82" cy="733" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <text x="120" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">LRO</text>

    <rect x="390" y="665" width="510" height="135" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="415" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">hardware merge on receive</text>

    <rect x="910" y="665" width="650" height="135" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <rect x="925" y="680" width="620" height="105" rx="8" fill="#db8129" fill-opacity="0.14" stroke="#db8129" stroke-width="2.5"/>
    <text x="940" y="726" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">breaks forwarding, avoid on</tspan>
      <tspan x="940" dy="34">routers, bridges, hypervisors</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="815" width="340" height="120" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    
    <circle cx="82" cy="875" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="76" y1="865" x2="76" y2="885" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="88" y1="865" x2="88" y2="885" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="120" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="120" dy="0">Flow control</tspan>
      <tspan x="120" dy="34">(802.3x pause)</tspan>
    </text>

    <rect x="390" y="815" width="510" height="120" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>

    <rect x="910" y="815" width="650" height="120" rx="8" fill="#ffffff" stroke="#d5ded7" stroke-width="1.5"/>
    <text x="935" y="882" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">usually off in modern DCs, PFC instead</text>
  </g>

  
  <g>
    <rect x="40" y="955" width="1520" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="65" y="975" width="310" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="85" y="1018" font-family="monospace, Courier, ui-monospace" font-size="24" font-weight="bold" fill="#207448">ethtool -k eth0</text>

    <rect x="395" y="975" width="1140" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="420" y="1018" font-family="monospace, Courier, ui-monospace" font-size="24" font-weight="bold" fill="#207448">ethtool -K eth0 tso on gso on gro on lro off</text>
  </g>
</svg>