<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>NIC offloads: which to keep</title>
  <desc>Visual comparison table of NIC offload mechanisms, their functions, and operational advice.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="60" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">NIC offloads: which to keep</text>

  
  <rect x="60" y="125" width="1480" height="64" rx="8" fill="#207448"/>
  <text x="85" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Offload</text>
  <text x="475" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">What it does</text>
  <text x="865" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Advice</text>

  
  <g transform="translate(0, 205)">
    <rect x="60" y="0" width="1480" height="116" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="116" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="840" y1="0" x2="840" y2="116" stroke="#e8f1ea" stroke-width="2"/>
    
    <g transform="translate(76, 30)">
      <path d="M 8 10 L 28 4 L 48 10 C 48 30 28 50 28 52 C 28 50 8 30 8 10 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 18 26 L 25 33 L 38 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="148" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="148" dy="0">Checksum</tspan>
      <tspan x="148" dy="34">offload</tspan>
    </text>
    
    <text x="475" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">NIC computes/validates</tspan>
      <tspan x="475" dy="32">L4 checksums</tspan>
    </text>
    
    <text x="865" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">capture on sender shows</tspan>
      <tspan x="865" dy="32">'bad cksum' (benign)</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 335)">
    <rect x="60" y="0" width="1480" height="126" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="126" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="840" y1="0" x2="840" y2="126" stroke="#e8f1ea" stroke-width="2"/>
    
    <g transform="translate(76, 35)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
      <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="4" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <rect x="22" y="22" width="12" height="12" rx="2" fill="#207448"/>
    </g>
    
    <text x="148" y="72" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TSO/GSO</text>
    
    <text x="475" y="42" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">send 64 KB buffers,</tspan>
      <tspan x="475" dy="32">segmented into</tspan>
      <tspan x="475" dy="32">MTU-sized frames</tspan>
    </text>
    
    <rect x="855" y="34" width="310" height="58" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="875" y="71" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">big CPU saver, enable</text>
  </g>

  
  <g transform="translate(0, 475)">
    <rect x="60" y="0" width="1480" height="136" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="136" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="840" y1="0" x2="840" y2="136" stroke="#e8f1ea" stroke-width="2"/>
    
    <g transform="translate(76, 40)">
      <rect x="6" y="8" width="14" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="23" width="14" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="38" width="14" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 23 13 L 29 24 L 23 35" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="23" y1="28" x2="31" y2="28" stroke="#207448" stroke-width="3"/>
      <rect x="34" y="10" width="16" height="36" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    </g>
    
    <text x="148" y="77" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">GRO</text>
    
    <text x="475" y="56" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">merge received packets</tspan>
      <tspan x="475" dy="32">into larger skbs</tspan>
    </text>
    
    <text x="865" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">may hurt forwarding, bridges,</tspan>
      <tspan x="865" dy="32">latency; disable on routers</tspan>
      <tspan x="865" dy="32">and VXLAN gateways</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 625)">
    <rect x="60" y="0" width="1480" height="116" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="116" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="840" y1="0" x2="840" y2="116" stroke="#e8f1ea" stroke-width="2"/>
    
    <g transform="translate(76, 30)">
      <rect x="8" y="12" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="20" x2="48" y2="20" stroke="#207448" stroke-width="3"/>
      <circle cx="16" cy="28" r="2.5" fill="#207448"/>
      <circle cx="26" cy="28" r="2.5" fill="#207448"/>
      <circle cx="36" cy="28" r="2.5" fill="#207448"/>
      <path d="M 14 42 L 14 48 M 20 42 L 20 48 M 26 42 L 26 48 M 32 42 L 32 48 M 38 42 L 38 48" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="148" y="67" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">LRO</text>
    
    <text x="475" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">hardware merge</tspan>
      <tspan x="475" dy="32">on receive</tspan>
    </text>
    
    <rect x="855" y="18" width="655" height="80" rx="6" fill="#fdf6ee" stroke="#db8129" stroke-width="2"/>
    <text x="875" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="875" dy="0">breaks forwarding, avoid on</tspan>
      <tspan x="875" dy="32">routers, bridges, hypervisors</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 755)">
    <rect x="60" y="0" width="1480" height="106" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="106" stroke="#e8f1ea" stroke-width="2"/>
    
    <g transform="translate(76, 25)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="22" y1="18" x2="22" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="34" y1="18" x2="34" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="148" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="148" dy="0">Flow control</tspan>
      <tspan x="148" dy="34" font-size="24" font-weight="normal">(802.3x pause)</tspan>
    </text>
    
    <text x="475" y="62" font-family="sans-serif" font-size="24" fill="#303a36">usually off in modern DCs, PFC instead</text>
  </g>

  
  <g transform="translate(0, 875)">
    <rect x="60" y="0" width="1480" height="96" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="96" stroke="#207448" stroke-width="2"/>
    <line x1="840" y1="0" x2="840" y2="96" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(76, 20)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 14 22 L 22 28 L 14 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="34" x2="36" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="148" y="57" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Command row</text>
    
    <text x="475" y="56" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ethtool -k eth0</text>
    
    <text x="865" y="56" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ethtool -K eth0 tso on gso on gro on lro off</text>
  </g>
</svg>