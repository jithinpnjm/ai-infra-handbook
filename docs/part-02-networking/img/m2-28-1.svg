    <text x="210" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Batfish, unit tests)</text>
  </g>

  
  <g transform="translate(1110, 710)">
    <rect width="420" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="42" cy="42" r="24" fill="#207448" />
    <text x="42" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(182, 18)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="22" width="48" height="30" rx="6" />
      <circle cx="16" cy="37" r="3" fill="#207448" />
      <circle cx="28" cy="37" r="3" fill="#207448" />
      <circle cx="40" cy="37" r="3" fill="#207448" />
      <path d="M 28 22 L 28 6 M 20 14 L 28 6 L 36 14" />
