    <text x="210" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">pydantic)</text>
  </g>

  
  <g transform="translate(1110, 110)">
    <rect width="420" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="42" cy="42" r="24" fill="#207448" />
    <text x="42" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
