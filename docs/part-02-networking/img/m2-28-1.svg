<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Putting it together: a minimal automation pipeline</title>
  <desc>Visual infographic of a network automation pipeline detailing Source of truth, Validate, Render, Test, Deliver, Verify, with a failure branch to Rollback / alert and a passing loop through Monitor and detect drift.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Putting it together: a minimal automation pipeline</text>

  

  
  <path d="M 490 215 L 590 215" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 1010 215 L 1110 215" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 1320 320 L 1320 410" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 1320 620 L 1320 710" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 1110 815 L 1010 815" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <path d="M 800 710 L 800 620" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />
  
  <g transform="translate(820, 646)">
    <rect width="80" height="38" rx="8" fill="#fdf5ec" stroke="#db8129" stroke-width="2" />
    <text x="40" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">fail</text>
  </g>

  
  <path d="M 590 815 L 490 815" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
  
  <g transform="translate(498, 746)">
