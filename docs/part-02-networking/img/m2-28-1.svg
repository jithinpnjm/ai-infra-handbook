<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <title>Putting it together: a minimal automation pipeline</title>
  <desc>Infographic illustrating a minimal network automation pipeline lifecycle from source of truth through validation, rendering, testing, delivery, verification, rollback or monitoring and drift detection.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1040" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Putting it together:</text>
  <text x="800" y="120" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">a minimal automation pipeline</text>

  

  
  <line x1="490" y1="270" x2="590" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1010" y1="270" x2="1110" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1320" y1="380" x2="1320" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1320" y1="680" x2="1320" y2="760" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1110" y1="870" x2="1010" y2="870" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="800" y1="760" x2="800" y2="680" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="816" y="704" width="70" height="34" rx="6" fill="#fdf4eb" stroke="#db8129" stroke-width="2"/>
  <text x="851" y="728" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">fail</text>

  
  <line x1="590" y1="870" x2="490" y2="870" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="505" y="820" width="70" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="540" y="844" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">pass</text>

  
  <line x1="280" y1="760" x2="280" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  

  
  <g id="node-sot">
    <rect x="70" y="160" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="110" cy="200" r="24" fill="#207448"/>
    <text x="110" y="208" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="268" cy="226" r="6"/>
      <circle cx="268" cy="186" r="6"/>
      <circle cx="296" cy="196" r="6"/>
      <line x1="268" y1="192" x2="268" y2="220"/>
      <path d="M 268 214 C 280 214 296 208 296 202"/>
    </g>
    
    <text x="280" y="268" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Source of truth</text>
    <text x="280" y="312" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(Git YAML / NetBox)</text>
  </g>

  
  <g id="node-validate">
    <rect x="590" y="160" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="630" cy="200" r="24" fill="#207448"/>
    <text x="630" y="208" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 780 186 L 800 178 L 820 186 C 820 208 800 224 800 224 C 800 224 780 208 780 186 Z"/>
      <path d="M 792 201 L 798 207 L 809 195"/>
    </g>
    
    <text x="800" y="268" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Validate</text>
    <text x="800" y="312" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(JSON Schema, pydantic)</text>
  </g>

  
  <g id="node-render">
    <rect x="1110" y="160" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1150" cy="200" r="24" fill="#207448"/>
    <text x="1150" y="208" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 1306 178 L 1324 178 L 1334 188 L 1334 224 L 1306 224 Z"/>
      <path d="M 1324 178 L 1324 188 L 1334 188"/>
      <path d="M 1314 204 L 1311 207 L 1314 210"/>
      <path d="M 1326 204 L 1329 207 L 1326 210"/>
    </g>
    
    <text x="1320" y="268" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Render</text>
    <text x="1320" y="312" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(Jinja2 templates)</text>
  </g>

  
  <g id="node-test">
    <rect x="1110" y="460" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1150" cy="500" r="24" fill="#207448"/>
    <text x="1150" y="508" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="1313" y1="478" x2="1327" y2="478"/>
      <path d="M 1316 478 L 1316 490 L 1304 516 C 1301 522 1305 528 1312 528 L 1328 528 C 1335 528 1339 522 1336 516 L 1324 490 L 1324 478"/>
      <line x1="1310" y1="514" x2="1330" y2="514" stroke-width="3"/>
    </g>
    
    <text x="1320" y="562" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Test</text>
    <text x="1320" y="604" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">(emulation: containerlab,</tspan>
      <tspan x="1320" dy="32">Batfish, unit tests)</tspan>
    </text>
  </g>

  
  <g id="node-deliver">
    <rect x="1110" y="760" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1150" cy="800" r="24" fill="#207448"/>
    <text x="1150" y="808" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1302" y="790" width="36" height="24" rx="4"/>
      <circle cx="1311" cy="802" r="2" fill="#207448"/>
      <circle cx="1320" cy="802" r="2" fill="#207448"/>
      <circle cx="1329" cy="802" r="2" fill="#207448"/>
      <path d="M 1308 782 L 1320 774 L 1332 782" stroke-width="3"/>
    </g>
    
    <text x="1320" y="862" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Deliver</text>
    <text x="1320" y="904" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">(NETCONF/gNMI/REST/CLI,</tspan>
      <tspan x="1320" dy="32">staged)</tspan>
    </text>
  </g>

  
  <g id="node-verify">
    <rect x="590" y="760" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="630" cy="800" r="24" fill="#207448"/>
    <text x="630" y="808" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="794" cy="798" r="16"/>
      <line x1="806" y1="810" x2="818" y2="822"/>
      <path d="M 788 798 L 793 803 L 801 793" stroke-width="3"/>
    </g>
    
    <text x="800" y="862" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Verify</text>
    <text x="800" y="904" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">(state assertions,</tspan>
      <tspan x="800" dy="32">telemetry)</tspan>
    </text>
  </g>

  
  <g id="node-rollback">
    <rect x="590" y="460" width="420" height="220" rx="16" fill="#fdf4eb" stroke="#db8129" stroke-width="3"/>
    
    <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 800 480 L 826 524 C 828 528 825 532 820 532 L 780 532 C 775 532 772 528 774 524 Z"/>
      <line x1="800" y1="496" x2="800" y2="512"/>
      <circle cx="800" cy="522" r="2" fill="#db8129"/>
    </g>
    
    <text x="800" y="580" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">Rollback / alert</text>
  </g>

  
  <g id="node-monitor">
    <rect x="70" y="760" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="110" cy="800" r="24" fill="#207448"/>
    <text x="110" y="808" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="280" cy="802" r="20"/>
      <path d="M 268 802 L 274 802 L 278 792 L 283 812 L 287 802 L 292 802" stroke-width="3"/>
    </g>
    
    <text x="280" y="872" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">Monitor and</tspan>
      <tspan x="280" dy="38">detect drift</tspan>
    </text>
  </g>
</svg>