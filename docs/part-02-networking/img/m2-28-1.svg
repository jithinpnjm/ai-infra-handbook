    <text x="210" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Deliver</text>
    <text x="210" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(NETCONF/gNMI/</text>
    <text x="210" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">REST/CLI, staged)</text>
  </g>

  
  <g transform="translate(590, 710)">
    <rect width="420" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="42" cy="42" r="24" fill="#207448" />
    <text x="42" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g transform="translate(182, 18)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
