    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">pass</text>
  </g>

  
  <path d="M 280 710 L 280 320" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />


  

  
  <g transform="translate(70, 110)">
