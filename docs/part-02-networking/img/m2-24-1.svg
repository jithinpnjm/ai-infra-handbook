<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The packet path and where to tune it</title>
  <desc>Visual infographic showing the Linux network packet receive (RX) and transmit (TX) paths and tuning points from wire to application.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The packet path and where to tune it</text>

  
  
  <path d="M 410 275 L 410 315" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 410 485 L 410 525" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 410 695 L 410 735" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 410 905 L 410 945" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 770 1030 L 788 1030 Q 800 1030 800 1018 L 800 202 Q 800 190 812 190 L 830 190" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1190 275 L 1190 315" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 1190 485 L 1190 525" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 1190 695 L 1190 735" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <path d="M 1190 905 L 1190 945" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-orange)"/>
  <text x="1220" y="933" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">TX path</text>

  

  
  <g transform="translate(50, 105)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="96" width="44" height="34" rx="4"/>
      <path d="M 34 116 L 34 126 M 42 116 L 42 126 M 50 116 L 50 126 M 58 116 L 58 126"/>
      <path d="M 46 82 L 46 96"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Wire → NIC PHY/MAC</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(FCS check, RSS hash, flow steering)</text>
  </g>

  
  <g transform="translate(50, 315)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="46" cy="114" r="22"/>
      <circle cx="46" cy="114" r="10"/>
      <path d="M 46 92 L 46 104 M 46 124 L 46 136 M 24 114 L 36 114 M 56 114 L 68 114"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">DMA into RX ring</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(host RAM)</text>
  </g>

  
  <g transform="translate(50, 525)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 48 92 L 32 114 L 46 114 L 44 136 L 60 110 L 46 110 Z"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Hard IRQ (per queue, MSI-X)</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ NAPI scheduled</text>
  </g>

  
  <g transform="translate(50, 735)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 46 94 A 20 20 0 0 1 66 114 M 66 106 L 66 114 L 58 114"/>
      <path d="M 46 134 A 20 20 0 0 1 26 114 M 26 122 L 26 114 L 34 114"/>
    </g>
    
    <text x="98" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">NET_RX softirq:</text>
    <text x="98" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">driver poll() up to</text>
    <text x="98" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">netdev_budget packets</text>
  </g>

  
  <g transform="translate(50, 945)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 46 94 L 64 102 C 64 122 46 136 46 136 C 46 136 28 122 28 102 Z"/>
      <path d="M 38 114 L 44 120 L 54 108"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">XDP program</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(optional, before skb)</text>
  </g>

  

  
  <g transform="translate(830, 105)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="96" width="44" height="16" rx="3"/>
      <rect x="24" y="118" width="44" height="16" rx="3"/>
      <path d="M 36 96 L 36 112 M 56 96 L 56 112 M 36 118 L 36 134 M 56 118 L 56 134"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Build sk_buff, GRO merge, RPS</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(optional steering to other CPUs)</text>
  </g>

  
  <g transform="translate(830, 315)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="46" cy="114" r="8"/>
      <path d="M 46 106 L 46 94 M 42 98 L 46 92 L 50 98"/>
      <path d="M 46 122 L 46 134 M 42 130 L 46 136 L 50 130"/>
      <path d="M 38 114 L 26 114 M 30 110 L 24 114 L 30 118"/>
      <path d="M 54 114 L 66 114 M 62 110 L 68 114 L 62 118"/>
    </g>
    
    <text x="98" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">tc ingress</text>
    <text x="98" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ netfilter prerouting</text>
    <text x="98" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ routing</text>
  </g>

  
  <g transform="translate(830, 525)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">8</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="100" width="36" height="34" rx="4"/>
      <circle cx="39" cy="117" r="3" fill="#207448"/>
      <circle cx="53" cy="117" r="3" fill="#207448"/>
      <path d="M 46 90 L 46 100"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Local: netfilter input</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ TCP/UDP → socket receive buffer</text>
  </g>

  
  <g transform="translate(830, 735)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">9</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="96" width="44" height="36" rx="4"/>
      <line x1="24" y1="108" x2="68" y2="108"/>
      <circle cx="32" cy="102" r="2" fill="#207448"/>
      <circle cx="38" cy="102" r="2" fill="#207448"/>
    </g>
    
    <text x="98" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Application wakeup (epoll)</text>
    <text x="98" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ copy_to_user</text>
  </g>

  
  <g transform="translate(830, 945)">
    <rect width="720" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#207448"/>
    <text x="46" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">10</text>
    
    <g fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="24" y="102" width="30" height="24" rx="3"/>
      <path d="M 54 114 L 68 114 M 62 108 L 68 114 L 62 120"/>
    </g>
    
    <text x="98" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">send() → socket send buffer</text>
    <text x="98" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ TCP segmentation (TSO/GSO)</text>
    <text x="98" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ qdisc (fq/pacing) → driver TX ring</text>
    <text x="98" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">→ DMA → wire (XPS selects queue)</text>
  </g>
</svg>