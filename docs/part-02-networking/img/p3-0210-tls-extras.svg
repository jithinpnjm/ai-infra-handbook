<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>SNI, ALPN, resumption, stapling and mTLS: what each handshake extra does</title>
  <desc>Visual infographic explaining TLS handshake extensions and extras: SNI, ALPN, Session resumption, OCSP stapling, and Mutual TLS.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">SNI, ALPN, resumption, stapling and mTLS: what each handshake extra does</text>

  

  
  <g id="card-sni">
    <rect x="40" y="85" width="740" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 105)">
      <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="0" y1="25" x2="56" y2="25" stroke="#207448" stroke-width="2.5"/>
      <circle cx="12" cy="12" r="3" fill="#207448"/>
      <line x1="22" y1="12" x2="44" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="12" cy="37" r="3" fill="#207448"/>
      <line x1="22" y1="37" x2="44" y2="37" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">SNI (Server Name Indication)</text>
    
    <text x="65" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">the client names the host in ClientHello so one</tspan>
      <tspan x="65" dy="31">IP address can serve many certificates (virtual hosting)</tspan>
      <tspan x="65" dy="31">and load balancers route on that name; testing an</tspan>
      <tspan x="65" dy="31">IP address without SNI often returns a default</tspan>
      <tspan x="65" dy="31">certificate; use <tspan font-family="ui-monospace, monospace">curl --resolve</tspan> or</tspan>
      <tspan x="65" dy="31"><tspan font-family="ui-monospace, monospace">openssl -servername</tspan>; Encrypted ClientHello can hide it</tspan>
    </text>
  </g>

  
  <g id="card-mtls">
    <rect x="820" y="85" width="740" height="340" rx="14" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(845, 105)">
      
      <path d="M 8 18 L 8 10 C 8 4 18 4 18 10 L 18 18" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <rect x="2" y="18" width="22" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="3"/>
      
      <path d="M 38 18 L 38 10 C 38 4 48 4 48 10 L 48 18" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <rect x="32" y="18" width="22" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="3"/>
      
      <line x1="24" y1="31" x2="32" y2="31" stroke="#db8129" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
    
    <text x="920" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Mutual TLS (mTLS)</text>
    
    <text x="845" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">in ordinary TLS only the server proves who it is;</tspan>
      <tspan x="845" dy="31">here the server also requests and verifies a client</tspan>
      <tspan x="845" dy="31">certificate; used by service meshes, the Kubernetes</tspan>
      <tspan x="845" dy="31">API and kubelet, etcd, Prometheus targets;</tspan>
      <tspan x="845" dy="31">client certificate has</tspan>
      <tspan x="845" dy="31" font-family="ui-monospace, monospace">extendedKeyUsage=clientAuth</tspan>
    </text>
  </g>

  

  
  <g id="card-alpn">
    <rect x="40" y="450" width="480" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 470)">
      <rect x="0" y="0" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="2.5"/>
      <circle cx="10" cy="8" r="2.5" fill="#207448"/>
      <circle cx="18" cy="8" r="2.5" fill="#207448"/>
      <line x1="14" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="38" x2="32" y2="38" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    
    <text x="140" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ALPN</text>
    
    <text x="65" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">negotiates the application</tspan>
      <tspan x="65" dy="34">protocol inside the handshake:</tspan>
      <tspan x="65" dy="36"><tspan font-family="ui-monospace, monospace">h2</tspan>, <tspan font-family="ui-monospace, monospace">http/1.1</tspan> or <tspan font-family="ui-monospace, monospace">h3</tspan></tspan>
    </text>
  </g>

  
  <g id="card-resumption">
    <rect x="560" y="450" width="480" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(585, 470)">
      <path d="M 0 6 C 0 3 3 0 6 0 L 50 0 C 53 0 56 3 56 6 L 56 18 C 51 18 47 22 47 26 C 47 30 51 34 56 34 L 56 46 C 56 49 53 52 50 52 L 6 52 C 3 52 0 49 0 46 L 0 34 C 5 34 9 30 9 26 C 9 22 5 18 0 18 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="28" y1="10" x2="28" y2="42" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    
    <text x="660" y="494" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Session tickets</text>
    <text x="660" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">or PSKs</text>
    
    <text x="585" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">a returning client skips the full</tspan>
      <tspan x="585" dy="29">handshake, lowering latency and CPU;</tspan>
      <tspan x="585" dy="29">0-RTT early data can be replayed, so</tspan>
      <tspan x="585" dy="29">use it only for idempotent requests;</tspan>
      <tspan x="585" dy="29">check with <tspan font-family="ui-monospace, monospace">openssl s_client</tspan></tspan>
      <tspan x="585" dy="29"><tspan font-family="ui-monospace, monospace">-reconnect</tspan> (Reused or New)</tspan>
    </text>
  </g>

  
  <g id="card-ocsp">
    <rect x="1080" y="450" width="480" height="340" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1105, 470)">
      <path d="M 6 4 L 42 4 C 45 4 48 7 48 10 L 48 44 C 48 47 45 50 42 50 L 6 50 C 3 50 0 47 0 44 L 0 10 C 0 7 3 4 6 4 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="14" x2="32" y2="14" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      
      <circle cx="38" cy="36" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <path d="M 32 36 L 36 40 L 44 32" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="1180" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">OCSP stapling</text>
    
    <text x="1105" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">the server attaches a signed, recent</tspan>
      <tspan x="1105" dy="34">revocation status to the handshake;</tspan>
      <tspan x="1105" dy="34">check with <tspan font-family="ui-monospace, monospace">s_client -status</tspan></tspan>
    </text>
  </g>

  
  <g id="round-trips-strip">
    <rect x="40" y="815" width="1520" height="65" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="856" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">TCP + TLS 1.2 = 3 RTTs, TCP + TLS 1.3 = 2 RTTs, QUIC 1 or 0</text>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="900" width="1520" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="70" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0"><tspan font-weight="bold" fill="#207448">Cost:</tspan> CPU mainly at the handshake where public-key operations run, per byte small because AES-NI;</tspan>
      <tspan x="70" dy="34">terminating at load balancers concentrates the handshakes; disable TLS 1.0, 1.1 and SSLv3,</tspan>
      <tspan x="70" dy="34">prefer TLS 1.3 with TLS 1.2 fallback, Mozilla intermediate profile, enable HSTS,</tspan>
      <tspan x="70" dy="34">re-check with <tspan font-family="ui-monospace, monospace">testssl.sh</tspan> or <tspan font-family="ui-monospace, monospace">nmap --script ssl-enum-ciphers</tspan></tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1110" width="1520" height="60" rx="10" fill="#207448"/>
    <text x="800" y="1148" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Start with <tspan font-family="ui-monospace, monospace">openssl s_client</tspan> against your own endpoint</text>
  </g>
</svg>