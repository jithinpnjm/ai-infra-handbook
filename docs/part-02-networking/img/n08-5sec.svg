<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The random 5-second delay</title>
  <desc>Visual explanation of the random 5-second DNS delay caused by conntrack UDP race condition during simultaneous A and AAAA queries in Kubernetes, along with side fixes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">The random 5-second delay</text>

  
  <rect x="60" y="110" width="1040" height="830" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <line x1="200" y1="240" x2="200" y2="900" stroke="#303a36" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />
  <line x1="550" y1="240" x2="550" y2="900" stroke="#303a36" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />
  <line x1="920" y1="240" x2="920" y2="900" stroke="#303a36" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />

  
  <rect x="100" y="130" width="200" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="176" y="145" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="176" y1="157" x2="224" y2="157" stroke="#207448" stroke-width="3" />
  <circle cx="186" cy="151" r="2.5" fill="#207448" />
  <circle cx="194" cy="151" r="2.5" fill="#207448" />
  <text x="200" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">pod</text>

  
  <rect x="415" y="130" width="270" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="526" y="145" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="538" cy="162" r="4" fill="#207448" />
  <circle cx="550" cy="162" r="4" fill="#207448" />
  <circle cx="562" cy="162" r="4" fill="#207448" />
  <line x1="538" y1="162" x2="562" y2="162" stroke="#207448" stroke-width="2" />
  <text x="550" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">node conntrack</text>

  
  <rect x="820" y="130" width="200" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="920" cy="150" rx="24" ry="7" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 896 150 v 14 c 0 4 10.7 7 24 7 s 24 -3 24 -7 v -14" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 896 164 v 14 c 0 4 10.7 7 24 7 s 24 -3 24 -7 v -14" fill="none" stroke="#207448" stroke-width="4" />
  <text x="920" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">CoreDNS</text>

  
  <circle cx="95" cy="320" r="24" fill="#207448" />
  <text x="95" y="329" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <rect x="180" y="275" width="760" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="560" y="306" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="560" dy="0">pod sends two UDP queries, A and AAAA,</tspan>
    <tspan x="560" dy="30">from the same source port within microseconds</tspan>
  </text>

  
  <line x1="200" y1="380" x2="910" y2="380" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="95" cy="490" r="24" fill="#207448" />
  <text x="95" y="499" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  
  <line x1="200" y1="490" x2="310" y2="490" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="320" y="420" width="680" height="150" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  
  <circle cx="375" cy="495" r="30" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <line x1="360" y1="480" x2="390" y2="510" stroke="#db8129" stroke-width="5" stroke-linecap="round" />
  <line x1="390" y1="480" x2="360" y2="510" stroke="#db8129" stroke-width="5" stroke-linecap="round" />

  <text x="430" y="475" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">the AAAA query is lost in conntrack</text>
  <text x="430" y="520" font-family="sans-serif" font-size="24" fill="#303a36">race on same-5-tuple UDP flows through NAT</text>

  
  <circle cx="95" cy="690" r="24" fill="#207448" />
  <text x="95" y="699" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <rect x="140" y="640" width="640" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="195" cy="730" r="28" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <polyline points="195,714 195,730 207,730" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  <text x="245" y="715" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">resolver waits 5 s (glibc timeout)</text>
  <text x="245" y="760" font-family="sans-serif" font-size="24" fill="#303a36">then retries and the call stalls</text>

  
  <path d="M 200 820 C 120 840, 120 890, 190 890" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-green)" />

  
  <rect x="1140" y="110" width="400" height="830" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="1140" y="110" width="400" height="75" rx="16" fill="#207448" />
  <text x="1340" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Side fixes</text>

  
  <rect x="1165" y="215" width="350" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <rect x="1185" y="235" width="36" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 1192 243 L 1198 249 L 1192 255" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="1202" y1="255" x2="1212" y2="255" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="1340" y="305" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">single-request-reopen</text>

  
  <rect x="1165" y="380" width="350" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <rect x="1185" y="400" width="36" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1191" y1="414" x2="1215" y2="414" stroke="#207448" stroke-width="3" />
  <line x1="1191" y1="420" x2="1207" y2="420" stroke="#207448" stroke-width="3" />
  <text x="1340" y="470" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">use-vc</text>

  
  <rect x="1165" y="545" width="350" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <rect x="1185" y="565" width="36" height="30" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1193" y1="560" x2="1193" y2="565" stroke="#207448" stroke-width="3" />
  <line x1="1203" y1="560" x2="1203" y2="565" stroke="#207448" stroke-width="3" />
  <line x1="1213" y1="560" x2="1213" y2="565" stroke="#207448" stroke-width="3" />
  <line x1="1193" y1="595" x2="1193" y2="600" stroke="#207448" stroke-width="3" />
  <line x1="1203" y1="595" x2="1203" y2="600" stroke="#207448" stroke-width="3" />
  <line x1="1213" y1="595" x2="1213" y2="600" stroke="#207448" stroke-width="3" />
  <text x="1340" y="635" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">NodeLocal DNSCache</text>

  
  <rect x="1165" y="710" width="350" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <path d="M 1203 728 L 1219 734 V 748 C 1219 758 1203 766 1203 766 C 1203 766 1187 758 1187 748 V 734 Z" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 1203 754 V 738 M 1197 744 L 1203 738 L 1209 744" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1340" y="800" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">kernel upgrade</text>

  
  <rect x="60" y="975" width="1480" height="85" rx="14" fill="#207448" />
  <text x="800" y="1028" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Match the number of seconds to a timer and you will find the layer</text>
</svg>