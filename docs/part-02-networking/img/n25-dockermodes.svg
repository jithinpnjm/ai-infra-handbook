<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Docker network modes</title>
  <desc>Visual comparison table of Docker network modes showing Mode, Behaviour, and Use across bridge, host, none, container:NAME, overlay, and macvlan / ipvlan.</desc>

  <rect width="1600" height="1050" fill="#f5f8f5"/>

  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Docker network modes</text>

  <rect x="40" y="96" width="1520" height="54" rx="10" fill="#207448"/>
  <text x="70" y="134" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Mode</text>
  <text x="460" y="134" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Behaviour</text>
  <text x="1100" y="134" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Use</text>

  <g id="row-bridge">
    <rect x="40" y="166" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 201)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 22 L 50 22"/>
      <path d="M 12 22 L 12 44 M 44 22 L 44 44"/>
      <path d="M 12 36 Q 28 22 44 36"/>
      <circle cx="18" cy="14" r="3" fill="#207448"/>
      <circle cx="38" cy="14" r="3" fill="#207448"/>
    </g>
    <text x="140" y="218" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">bridge</text>
    <text x="140" y="256" font-family="sans-serif" font-size="24" fill="#303a36">(default <tspan font-family="monospace">docker0</tspan>)</text>
    <text x="460" y="222" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="460" dy="0">private subnet, veth per container,</tspan>
      <tspan x="460" dy="36">NAT outbound, <tspan font-family="monospace">-p</tspan> publishes via DNAT</tspan>
    </text>
  </g>

  <g id="row-host">
    <rect x="40" y="306" width="1520" height="126" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3.5"/>
    <g transform="translate(62, 341)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="6"/>
      <line x1="16" y1="20" x2="28" y2="20"/>
      <line x1="16" y1="28" x2="28" y2="28"/>
      <circle cx="38" cy="24" r="3" fill="#db8129"/>
      <path d="M 20 46 L 28 38 L 36 46"/>
    </g>
    <text x="140" y="358" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">host</text>
    <text x="140" y="396" font-family="monospace" font-size="24" fill="#303a36">(--network host)</text>
    <text x="460" y="362" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="460" dy="0">shares the host namespace, no isolation,</tspan>
      <tspan x="460" dy="36">no NAT, best performance, ports conflict</tspan>
    </text>
    <text x="1100" y="380" font-family="sans-serif" font-size="24" fill="#303a36">(use: NCCL/HPC containers)</text>
  </g>

  <g id="row-none">
    <rect x="40" y="446" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 481)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="22" width="32" height="26" rx="4"/>
      <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22"/>
      <circle cx="28" cy="34" r="3" fill="#207448"/>
    </g>
    <text x="140" y="519" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">none</text>
    <text x="460" y="519" font-family="sans-serif" font-size="24" fill="#303a36">only loopback</text>
  </g>

  <g id="row-container">
    <rect x="40" y="586" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 621)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="26" height="30" rx="4"/>
      <rect x="24" y="10" width="26" height="30" rx="4"/>
      <line x1="16" y1="28" x2="34" y2="28" stroke-dasharray="2 3"/>
    </g>
    <text x="140" y="659" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">container:NAME</text>
    <text x="460" y="659" font-family="sans-serif" font-size="24" fill="#303a36">shares another container's namespace</text>
    <text x="1100" y="641" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1100" dy="0">(sidecars;</tspan>
      <tspan x="1100" dy="36">how a Kubernetes pod works)</tspan>
    </text>
  </g>

  <g id="row-overlay">
    <rect x="40" y="726" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 761)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 38 A 12 12 0 0 1 20 18 A 16 16 0 0 1 42 22 A 10 10 0 0 1 44 38 Z"/>
      <line x1="8" y1="46" x2="48" y2="46"/>
      <circle cx="16" cy="46" r="2.5" fill="#207448"/>
      <circle cx="40" cy="46" r="2.5" fill="#207448"/>
    </g>
    <text x="140" y="799" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">overlay</text>
    <text x="460" y="799" font-family="sans-serif" font-size="24" fill="#303a36">VXLAN across Docker hosts</text>
    <text x="1100" y="799" font-family="sans-serif" font-size="24" fill="#303a36">(Swarm)</text>
  </g>

  <g id="row-macvlan">
    <rect x="40" y="866" width="1520" height="126" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <g transform="translate(62, 901)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="36" height="26" rx="4"/>
      <line x1="14" y1="36" x2="14" y2="42"/>
      <line x1="22" y1="36" x2="22" y2="42"/>
      <line x1="30" y1="36" x2="30" y2="42"/>
      <line x1="38" y1="36" x2="38" y2="42"/>
      <rect x="36" y="18" width="12" height="10" rx="2"/>
    </g>
    <text x="140" y="939" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">macvlan / ipvlan</text>
    <text x="460" y="939" font-family="sans-serif" font-size="24" fill="#303a36">container on the physical network</text>
  </g>
</svg>