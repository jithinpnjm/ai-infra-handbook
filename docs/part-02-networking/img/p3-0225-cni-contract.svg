<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The CNI contract: environment variables in, JSON in on stdin, JSON out</title>
  <desc>Visual infographic explaining the CNI execution model, plugin inputs and outputs, execution pipeline, plugin chaining, families, and execution commands.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="48px" fill="#303a36" text-anchor="middle">
    <text x="800" y="52">
      <tspan x="800" dy="0">The CNI contract: environment variables in,</tspan>
      <tspan x="800" dy="50">JSON in on stdin, JSON out</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="40" y="125" width="440" height="235" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 142)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="36" height="36" rx="4"/>
      <line x1="8" y1="12" x2="28" y2="12"/>
      <circle cx="14" cy="12" r="3" fill="#207448"/>
      <line x1="8" y1="24" x2="28" y2="24"/>
      <circle cx="22" cy="24" r="3" fill="#207448"/>
    </g>
    <text x="110" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Environment variables:</text>
    <text x="60" y="202" font-family="monospace, monospace" font-size="24px" fill="#303a36">
      <tspan x="60" dy="0">CNI_COMMAND (ADD, DEL,</tspan>
      <tspan x="60" dy="28">CHECK, VERSION),</tspan>
      <tspan x="60" dy="28">CNI_CONTAINERID, CNI_NETNS</tspan>
      <tspan x="60" dy="28" font-family="system-ui, -apple-system, sans-serif">(the path of the namespace),</tspan>
      <tspan x="60" dy="28">CNI_IFNAME (such as eth0),</tspan>
      <tspan x="60" dy="28">CNI_ARGS, CNI_PATH</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="375" width="440" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 400)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="36" height="46" rx="4"/>
      <line x1="8" y1="14" x2="28" y2="14"/>
      <line x1="8" y1="24" x2="28" y2="24"/>
      <line x1="8" y1="34" x2="20" y2="34"/>
    </g>
    <text x="112" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Network config on stdin from</text>
    <text x="112" y="440" font-family="monospace, monospace" font-size="24px" fill="#303a36">/etc/cni/net.d/*.conf</text>
    <text x="112" y="466" font-family="monospace, monospace" font-size="24px" fill="#303a36">or *.conflist</text>
  </g>

  
  <line x1="480" y1="242" x2="520" y2="242" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <line x1="480" y1="425" x2="520" y2="425" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="520" y="125" width="670" height="350" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(555, 142)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="18" cy="18" r="9"/>
      <path d="M 18 2 L 18 7 M 18 29 L 18 34 M 2 18 L 7 18 M 29 18 L 34 18 M 6.7 6.7 L 10.2 10.2 M 25.8 25.8 L 29.3 29.3 M 6.7 29.3 L 10.2 25.8 M 25.8 10.2 L 29.3 6.7"/>
    </g>
    <text x="605" y="168" font-family="monospace, monospace" font-size="30px" font-weight="bold" fill="#303a36">/opt/cni/bin/bridge</text>

    <line x1="540" y1="190" x2="1170" y2="190" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,4"/>

    
    <circle cx="568" cy="228" r="20" fill="#207448"/>
    <text x="568" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="605" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="605" dy="0">creates interfaces such as veth or macvlan</tspan>
      <tspan x="605" dy="28">and moves one end into the namespace</tspan>
    </text>

    
    <circle cx="568" cy="308" r="20" fill="#207448"/>
    <text x="568" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="605" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="605" dy="0">calls an IPAM plugin for an address</tspan>
      <tspan x="605" dy="28">(host-local, dhcp, static,</tspan>
      <tspan x="605" dy="28">or a CNI-specific allocator)</tspan>
    </text>

    
    <circle cx="568" cy="402" r="20" fill="#207448"/>
    <text x="568" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="605" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">sets routes</text>
  </g>

  
  <line x1="1190" y1="300" x2="1230" y2="300" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="1230" y="200" width="330" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1372, 222)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="38" height="46" rx="4"/>
      <path d="M 12 16 Q 8 23 12 30"/>
      <path d="M 26 16 Q 30 23 26 30"/>
      <circle cx="19" cy="23" r="2" fill="#207448"/>
    </g>
    <text x="1395" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36" text-anchor="middle">JSON result:</text>
    <text x="1395" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">the IPs, routes and DNS</text>
  </g>

  

  
  <g>
    <rect x="40" y="495" width="880" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 532)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="8" width="46" height="30" rx="4"/>
      <line x1="10" y1="23" x2="36" y2="23"/>
      <line x1="23" y1="0" x2="23" y2="8"/>
      <line x1="12" y1="38" x2="12" y2="46"/>
      <line x1="34" y1="38" x2="34" y2="46"/>
    </g>
    <text x="130" y="545" font-family="monospace, monospace" font-size="24px" fill="#303a36">
      <tspan x="130" dy="0">bridge: cni0, isGateway, ipMasq, mtu 1450,</tspan>
      <tspan x="130" dy="35">ipam host-local subnet 10.244.1.0/24</tspan>
    </text>
  </g>

  
  <line x1="920" y1="555" x2="970" y2="555" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="970" y="495" width="270" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1085, 515)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="4" width="40" height="26" rx="4"/>
      <line x1="8" y1="17" x2="16" y2="17"/>
      <line x1="24" y1="17" x2="32" y2="17"/>
    </g>
    <text x="1105" y="582" font-family="monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36" text-anchor="middle">portmap</text>
  </g>

  
  <line x1="1240" y1="555" x2="1290" y2="555" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="1290" y="495" width="270" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1405, 515)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 4 30 A 18 18 0 1 1 36 30"/>
      <line x1="20" y1="20" x2="28" y2="12"/>
    </g>
    <text x="1425" y="582" font-family="monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36" text-anchor="middle">bandwidth</text>
  </g>

  

  
  <g>
    <rect x="40" y="635" width="560" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 652)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="6" width="38" height="26" rx="3"/>
      <line x1="6" y1="32" x2="6" y2="40"/>
      <line x1="14" y1="32" x2="14" y2="40"/>
      <line x1="22" y1="32" x2="22" y2="40"/>
    </g>
    <text x="115" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">main plugins create interfaces:</text>
    <text x="115" y="710" font-family="monospace, monospace" font-size="24px" fill="#303a36">bridge, ptp, macvlan, ipvlan,</text>
    <text x="115" y="744" font-family="monospace, monospace" font-size="24px" fill="#303a36">host-device, vlan, loopback, dummy</text>
  </g>

  
  <g>
    <rect x="620" y="635" width="360" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(642, 652)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="4" width="36" height="30" rx="4"/>
      <circle cx="10" cy="19" r="2" fill="#207448"/>
      <circle cx="18" cy="19" r="2" fill="#207448"/>
      <circle cx="26" cy="19" r="2" fill="#207448"/>
    </g>
    <text x="692" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">IPAM:</text>
    <text x="692" y="715" font-family="monospace, monospace" font-size="24px" fill="#303a36">host-local, dhcp,</text>
    <text x="692" y="748" font-family="monospace, monospace" font-size="24px" fill="#303a36">static</text>
  </g>

  
  <g>
    <rect x="1000" y="635" width="560" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1022, 652)" stroke="#207448" stroke-width="3" fill="none">
      <polygon points="18,4 34,12 18,20 2,12"/>
      <path d="M 2 18 L 18 26 L 34 18"/>
      <path d="M 2 24 L 18 32 L 34 24"/>
    </g>
    <text x="1072" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">meta: <tspan font-weight="normal" font-family="monospace, monospace">tuning (sysctls), portmap,</tspan></text>
    <text x="1072" y="710" font-family="monospace, monospace" font-size="24px" fill="#303a36">bandwidth, firewall,</text>
    <text x="1072" y="744" font-family="monospace, monospace" font-size="24px" fill="#303a36">sbr (source-based routing), vrf</text>
  </g>

  

  
  <g>
    <rect x="40" y="805" width="1520" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 843)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="46" height="42" rx="4"/>
      <path d="M 10 12 L 18 21 L 10 30"/>
      <line x1="22" y1="30" x2="34" y2="30"/>
    </g>
    <text x="130" y="842" font-family="monospace, monospace" font-size="24px" fill="#303a36">
      <tspan x="130" dy="0">CNI_COMMAND=ADD CNI_CONTAINERID=x CNI_NETNS=/run/netns/test CNI_IFNAME=eth0</tspan>
      <tspan x="130" dy="32">CNI_PATH=/opt/cni/bin /opt/cni/bin/bridge &lt; config.json,</tspan>
      <tspan x="130" dy="32" font-family="system-ui, -apple-system, sans-serif">or cnitool; ADD first, then DEL to check cleanup</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="945" width="1520" height="120" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(65, 982)" stroke="#db8129" stroke-width="3" fill="none">
      <polygon points="23,4 44,40 2,40"/>
      <line x1="23" y1="16" x2="23" y2="27" stroke-width="3.5"/>
      <circle cx="23" cy="34" r="1.5" fill="#db8129"/>
    </g>
    <text x="130" y="996" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="130" dy="0">stale /etc/cni/net.d files from an old CNI: the lexically first file wins;</tspan>
      <tspan x="130" dy="36">keep /opt/cni/bin and /etc/cni/net.d consistent across nodes</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1090" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="800" y="1138" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">
      When a container starts, the runtime runs the plugin with ADD, and when it ends, with DEL
    </text>
  </g>
</svg>