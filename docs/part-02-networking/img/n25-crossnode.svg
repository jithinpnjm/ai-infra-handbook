<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pod to pod across nodes</title>
  <desc>Visual infographic showing cross-node pod-to-pod networking in Kubernetes comparing overlay tunneling with routed native encapsulation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pod to pod across nodes</text>

  <rect x="880" y="46" width="670" height="54" rx="12" fill="#db8129"/>
  <text x="1215" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Kubernetes: pods reach all pods without NAT</text>

  
  
  <rect x="50" y="125" width="720" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(75, 145)">
    <rect x="4" y="6" width="46" height="32" rx="4"/>
    <line x1="4" y1="22" x2="50" y2="22"/>
    <circle cx="12" cy="14" r="2.5" fill="#207448"/>
    <circle cx="20" cy="14" r="2.5" fill="#207448"/>
    <circle cx="12" cy="30" r="2.5" fill="#207448"/>
    <circle cx="20" cy="30" r="2.5" fill="#207448"/>
  </g>
  <text x="145" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">node 1</text>
  <rect x="75" y="195" width="670" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(95, 206)">
    <rect x="4" y="4" width="34" height="34" rx="6"/>
    <circle cx="21" cy="21" r="7"/>
  </g>
  <text x="150" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">pod A <tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">10.244.1.5</tspan></text>

  
  <rect x="830" y="125" width="720" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(855, 145)">
    <rect x="4" y="6" width="46" height="32" rx="4"/>
    <line x1="4" y1="22" x2="50" y2="22"/>
    <circle cx="12" cy="14" r="2.5" fill="#207448"/>
    <circle cx="20" cy="14" r="2.5" fill="#207448"/>
    <circle cx="12" cy="30" r="2.5" fill="#207448"/>
    <circle cx="20" cy="30" r="2.5" fill="#207448"/>
  </g>
  <text x="925" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">node 2</text>
  <rect x="855" y="195" width="670" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(875, 206)">
    <rect x="4" y="4" width="34" height="34" rx="6"/>
    <circle cx="21" cy="21" r="7"/>
  </g>
  <text x="930" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">pod B in <tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">10.244.2.0/24</tspan></text>

  
  <rect x="50" y="305" width="1500" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(80, 325)">
    <rect x="4" y="8" width="46" height="28" rx="6"/>
    <rect x="12" y="14" width="30" height="16" rx="3"/>
  </g>
  <text x="145" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Overlay (VXLAN, IPIP, Geneve)</text>

  
  <rect x="80" y="380" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="120" cy="422" r="22" fill="#207448"/>
  <text x="120" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(165, 402)">
    <path d="M 6 22 L 20 22 M 34 22 L 48 22"/>
    <circle cx="27" cy="22" r="7"/>
  </g>
  <text x="105" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">packet leaves</tspan>
    <tspan x="105" dy="36">pod A through its veth</tspan>
  </text>

  
  <line x1="520" y1="520" x2="576" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="580" y="380" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="620" cy="422" r="22" fill="#207448"/>
  <text x="620" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(665, 402)">
    <rect x="6" y="8" width="42" height="28" rx="4"/>
    <path d="M 16 22 L 38 22 M 30 16 L 38 22 L 30 28"/>
  </g>
  <text x="605" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" dy="0">node route says</tspan>
    <tspan x="605" dy="34"><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">10.244.2.0/24</tspan> goes via</tspan>
    <tspan x="605" dy="34">a tunnel device</tspan>
    <tspan x="605" dy="34"><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">(flannel.1, tunl0</tspan></tspan>
    <tspan x="605" dy="34"><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">or vxlan.calico)</tspan></tspan>
  </text>

  
  <line x1="1020" y1="520" x2="1076" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1080" y="380" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1120" cy="422" r="22" fill="#207448"/>
  <text x="1120" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1165, 402)">
    <rect x="4" y="6" width="46" height="32" rx="4"/>
    <path d="M 14 14 L 40 14 L 40 30 L 14 30 Z"/>
    <path d="M 4 22 L 14 22 M 40 22 L 50 22"/>
  </g>
  <text x="1105" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1105" dy="0">the packet is wrapped</tspan>
    <tspan x="1105" dy="36">in an outer packet to</tspan>
    <tspan x="1105" dy="36">node 2 which</tspan>
    <tspan x="1105" dy="36">unwraps it</tspan>
  </text>

  
  <rect x="50" y="715" width="1500" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(80, 735)">
    <line x1="6" y1="22" x2="48" y2="22"/>
    <polyline points="36,12 48,22 36,32"/>
  </g>
  <text x="145" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Routed (no encapsulation)</text>

  
  <rect x="80" y="790" width="680" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(110, 810)">
    <rect x="6" y="6" width="42" height="32" rx="4"/>
    <line x1="6" y1="18" x2="48" y2="18"/>
    <line x1="20" y1="18" x2="20" y2="38"/>
    <circle cx="13" cy="12" r="2.5" fill="#207448"/>
  </g>
  <text x="180" y="835" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="180" dy="0">node 1 holds route</tspan>
    <tspan x="180" dy="36"><tspan font-family="'SF Mono', Monaco, Menlo, Consolas, monospace">'10.244.2.0/24 via &lt;node2 IP&gt;'</tspan></tspan>
    <tspan x="180" dy="36">installed by static config,</tspan>
    <tspan x="180" dy="36">BIRD or the CNI daemon</tspan>
  </text>

  
  <line x1="760" y1="905" x2="836" y2="905" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="840" y="790" width="680" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(870, 810)">
    <rect x="6" y="8" width="42" height="18" rx="3"/>
    <line x1="14" y1="26" x2="14" y2="38"/>
    <line x1="40" y1="26" x2="40" y2="38"/>
    <line x1="6" y1="38" x2="48" y2="38"/>
  </g>
  <text x="940" y="855" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">needs L2 adjacency for</tspan>
    <tspan x="940" dy="38">host-gw or BGP-learned</tspan>
    <tspan x="940" dy="38">pod prefixes</tspan>
  </text>

  
  <rect x="80" y="1045" width="1440" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(110, 1064)">
    <path d="M 12 30 A 8 8 0 0 1 10 18 A 12 12 0 0 1 30 12 A 10 10 0 0 1 42 22 A 8 8 0 0 1 40 30 Z"/>
  </g>
  <text x="180" y="1098" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan font-weight="bold" fill="#207448">Note:</tspan> cloud CNIs use VPC subnet addresses routed natively
  </text>
</svg>