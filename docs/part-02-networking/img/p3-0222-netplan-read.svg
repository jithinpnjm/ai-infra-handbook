<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1440" width="1600" height="1440">
  <title>Reading a Netplan file with three kinds of interface</title>
  <desc>Visual guide comparing Netplan multi-interface YAML configuration with NetworkManager and systemd-networkd equivalents.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title { font-family: sans-serif; font-size: 44px; font-weight: bold; fill: #303a36; }
      .section-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .sans-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .sans-bold { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #207448; }
      .mono-text { font-family: monospace; font-size: 24px; fill: #1c2722; }
      .mono-bold { font-family: monospace; font-size: 24px; font-weight: bold; fill: #1c2722; }
      .banner-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #207448; }
      .orange-mono { font-family: monospace; font-size: 24px; font-weight: bold; fill: #b85d10; }
      .orange-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #db8129; }
      .bottom-text { font-family: sans-serif; font-size: 25px; font-weight: bold; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #207448; stroke-width: 2; rx: 12px; }
      .card-light { fill: #e8f1ea; stroke: #207448; stroke-width: 2; rx: 10px; }
      .card-orange { fill: #fffaf5; stroke: #db8129; stroke-width: 3; rx: 10px; }
      .cmd-box { fill: #f0f5f1; stroke: #b2ceb9; stroke-width: 1.5; rx: 8px; }
      .icon-stroke { fill: none; stroke: #207448; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { fill: none; stroke: #db8129; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1440" class="bg"/>

  
  <text x="50" y="62" class="title">Reading a Netplan file with three kinds of interface</text>

  
  <g transform="translate(40, 85)">
    <rect width="1520" height="70" class="card-light"/>
    
    <path class="icon-stroke" d="M 32 35 C 32 26 40 20 50 20 C 60 20 68 26 68 35 C 68 44 60 50 50 50 C 40 50 32 44 32 35 Z M 50 14 L 50 20 M 50 50 L 50 56 M 29 35 L 35 35 M 65 35 L 71 35"/>
    <text x="85" y="44" class="banner-text">Netplan does not manage the network itself: it renders files for NetworkManager or systemd-networkd</text>
  </g>

  
  <g transform="translate(40, 180)">
    
    <rect width="820" height="1130" class="card"/>

    
    <rect width="820" height="60" rx="12" fill="#207448"/>
    
    <rect y="45" width="820" height="15" fill="#207448"/>
    <text x="25" y="39" class="mono-bold" fill="#ffffff"># /etc/netplan/50-gpu.yaml  (apply with: sudo netplan try)</text>

    
    <g transform="translate(25, 80)">
      <rect width="770" height="120" class="cmd-box"/>
      <text x="25" y="44" class="mono-bold">version: 2</text>
      <text x="25" y="86" class="mono-bold">renderer: networkd</text>
      
      
      <g transform="translate(320, 52)">
        <rect width="425" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
        <text x="18" y="32" class="sans-text">who turns this into real configuration</text>
      </g>
      
      <path d="M 320 76 L 275 76" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    </g>

    
    <g transform="translate(25, 225)">
      <rect width="770" height="215" class="cmd-box"/>
      
      <g transform="translate(25, 24)">
        <rect x="0" y="0" width="46" height="38" rx="6" class="icon-stroke"/>
        <path d="M 12 38 L 12 24 M 23 38 L 23 24 M 34 38 L 34 24" class="icon-stroke" stroke-width="3"/>
      </g>
      <text x="90" y="50" class="sans-bold">a DHCP link that also takes routes from DHCP</text>
      
      <rect x="25" y="85" width="720" height="105" rx="6" fill="#ffffff" stroke="#b2ceb9" stroke-width="1"/>
      <text x="45" y="128" class="mono-text">eno1: { dhcp4: true,</text>
      <text x="65" y="166" class="mono-text">dhcp4-overrides: { use-routes: true } }</text>
    </g>

    
    <g transform="translate(25, 465)">
      <rect width="770" height="375" class="card-orange"/>
      
      <g transform="translate(25, 24)">
        <rect x="0" y="0" width="46" height="38" rx="6" class="icon-orange"/>
        <path d="M 10 19 L 36 19 M 26 10 L 36 19 L 26 28" class="icon-orange" stroke-width="3"/>
      </g>
      
      
      <text x="90" y="50" class="orange-text">a static fabric NIC with jumbo MTU; optional</text>
      <text x="90" y="86" class="orange-text">so boot does not wait for the link</text>

      
      <rect x="25" y="115" width="720" height="235" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
      <text x="45" y="160" class="orange-mono">ens1f0:</text>
      <text x="75" y="204" class="orange-mono">addresses [10.100.0.45/24],</text>
      <text x="75" y="248" class="orange-mono">mtu 9000,</text>
      <text x="75" y="292" class="orange-mono">dhcp4 false, optional true</text>
    </g>

    
    <g transform="translate(25, 865)">
      <rect width="770" height="235" class="cmd-box"/>
      
      <g transform="translate(25, 24)">
        <rect x="0" y="0" width="46" height="38" rx="6" class="icon-stroke"/>
        <path d="M 10 14 L 36 14 M 10 24 L 26 24" class="icon-stroke" stroke-width="3"/>
      </g>
      <text x="90" y="50" class="sans-bold">a VLAN on top of the first link</text>

      <rect x="25" y="85" width="720" height="125" rx="6" fill="#ffffff" stroke="#b2ceb9" stroke-width="1"/>
      <text x="45" y="126" class="mono-text">vlans: vlan200: { id: 200, link: eno1,</text>
      <text x="65" y="170" class="mono-text">addresses: [10.200.0.45/24] }</text>
    </g>
  </g>

  
  <g transform="translate(890, 180)">
    
    
    <rect width="670" height="695" class="card"/>
    <text x="35" y="52" class="section-title">Same job with other tools</text>

    
    <g transform="translate(25, 75)">
      <rect width="620" height="210" class="cmd-box"/>
      <text x="20" y="44" class="mono-bold">
        <tspan x="20" dy="0">nmcli connection add type ethernet</tspan>
        <tspan x="20" dy="38">ifname ens1f0 con-name fabric0</tspan>
        <tspan x="20" dy="38">ipv4.method manual ipv4.never-default yes</tspan>
        <tspan x="20" dy="38">ipv4.addresses 10.100.0.45/24 802-3-ethernet.mtu 9000</tspan>
      </text>
    </g>

    
    <g transform="translate(25, 305)">
      <rect width="620" height="105" class="cmd-box"/>
      <text x="20" y="44" class="mono-bold">
        <tspan x="20" dy="0">nmcli connection up fabric0;</tspan>
        <tspan x="20" dy="38">nmcli device reapply ens1f0</tspan>
      </text>
    </g>

    
    <g transform="translate(25, 430)">
      <rect width="620" height="120" class="cmd-box"/>
      <text x="20" y="44" class="mono-bold">
        <tspan x="20" dy="0">nm-online -q &amp;&amp; echo network-up:</tspan>
      </text>
      <text x="20" y="88" class="sans-text">
        <tspan x="20" dy="0">exit code 0 when the network is up,</tspan>
        <tspan x="20" dy="30">usable in scripts</tspan>
      </text>
    </g>

    
    <g transform="translate(25, 570)">
      <rect width="620" height="100" class="cmd-box"/>
      <text x="20" y="44" class="mono-bold">
        <tspan x="20" dy="0">networkctl status; networkctl list;</tspan>
        <tspan x="20" dy="38">networkctl reload</tspan>
      </text>
    </g>

    
    <g transform="translate(0, 720)">
      <rect width="670" height="410" class="card-light"/>

      
      <g transform="translate(25, 25)">
        <rect width="620" height="215" class="card"/>
        <text x="20" y="42" class="mono-bold" fill="#207448">
          <tspan x="20" dy="0">ifupdown plug-in: managed=false</tspan>
          <tspan x="30" dy="34">in NetworkManager.conf;</tspan>
          <tspan x="20" dy="38">ifcfg-rh plug-in: NM_CONTROLLED=no;</tspan>
          <tspan x="20" dy="38">unmanaged-devices=mac:...</tspan>
          <tspan x="30" dy="34">in the keyfile section</tspan>
        </text>
      </g>

      
      <g transform="translate(25, 260)">
        <rect width="620" height="125" class="card"/>
        
        <g transform="translate(20, 25)">
          <rect x="0" y="0" width="36" height="44" rx="4" class="icon-stroke" stroke-width="3"/>
          <path d="M 8 14 L 28 14 M 8 24 L 24 24 M 8 34 L 20 34" class="icon-stroke" stroke-width="2.5"/>
        </g>
        <text x="75" y="52" class="sans-text">
          <tspan x="75" dy="0">dispatcher scripts in</tspan>
          <tspan x="75" dy="34">/etc/NetworkManager/dispatcher.d</tspan>
          <tspan x="75" dy="34">run on up and down</tspan>
        </text>
      </g>
    </g>
  </g>

  
  <g transform="translate(40, 1335)">
    <rect width="1520" height="75" rx="12" fill="#207448"/>
    
    <g transform="translate(30, 16)">
      <path d="M 22 4 L 40 38 L 4 38 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 22 17 L 22 27 M 22 32 L 22 34" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="90" y="47" class="bottom-text">Manual ip changes vanish on reboot; move the result into the manager that owns the interface</text>
  </g>

</svg>