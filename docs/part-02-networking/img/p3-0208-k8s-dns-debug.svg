<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Debugging DNS in Kubernetes: the pod, CoreDNS and the fixes</title>
  <desc>Visual infographic explaining Kubernetes DNS architecture, pod resolver configuration, CoreDNS troubleshooting steps, and architectural fixes.</desc>

  
  <rect width="1600" height="1170" fill="#f5f8f5" />

  
  <text x="50" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Debugging DNS in Kubernetes: the pod, CoreDNS and the fixes</text>

  
  
  <g id="pod-resolver-container">
    <rect x="40" y="95" width="430" height="495" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(64, 115)">
      <path d="M 6 0 L 32 0 L 46 14 L 46 52 L 6 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 32 0 L 32 14 L 46 14" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <line x1="14" y1="24" x2="38" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="14" y1="34" x2="38" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="14" y1="44" x2="28" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="130" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pod resolver file</text>

    
    <rect x="60" y="185" width="390" height="320" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <text x="76" y="220" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">search</tspan>
      <tspan x="76" dy="28">my-ns.svc.cluster.local</tspan>
      <tspan x="76" dy="28">svc.cluster.local</tspan>
      <tspan x="76" dy="28">cluster.local</tspan>
      <tspan x="76" dy="28">dc1.example.com</tspan>
    </text>

    
    <text x="76" y="380" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">nameserver 10.96.0.10</tspan>
      <tspan x="76" dy="28" font-family="sans-serif">(CoreDNS service kube-dns)</tspan>
    </text>

    
    <text x="76" y="458" font-family="monospace" font-size="24" fill="#303a36">options ndots:5</text>

    
    <text x="64" y="545" font-family="sans-serif" font-size="24" fill="#303a36">the kubelet generates it</text>
  </g>

  
  <g id="docker-podman-container">
    <rect x="40" y="610" width="430" height="255" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(64, 630)">
      <rect x="4" y="6" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="6" x2="16" y2="40" stroke="#207448" stroke-width="4" />
      <line x1="26" y1="6" x2="26" y2="40" stroke="#207448" stroke-width="4" />
      <line x1="36" y1="6" x2="36" y2="40" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="4" />
    </g>

    <text x="130" y="667" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Docker and Podman</text>

    <rect x="60" y="705" width="390" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="745" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">custom networks have an</tspan>
      <tspan x="76" dy="32">embedded DNS at</tspan>
      <tspan x="76" dy="32" font-family="monospace">127.0.0.11</tspan>
    </text>
  </g>

  
  
  <g id="middle-ladder-container">
    <rect x="495" y="95" width="610" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(520, 115)">
      <line x1="10" y1="4" x2="10" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="4" x2="42" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="10" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="26" x2="42" y2="26" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="38" x2="42" y2="38" stroke="#207448" stroke-width="4" />
    </g>

    <text x="585" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ladder of debugging steps</text>

    
    <g id="debug-step-1">
      <rect x="515" y="175" width="570" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="205" r="24" fill="#207448" />
      <text x="548" y="213" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">1</tspan>
        <tspan x="585" fill="#303a36" font-family="monospace"> kubectl exec pod -- cat /etc/resolv.conf</tspan>
      </text>
    </g>

    
    <g id="debug-step-2">
      <rect x="515" y="247" width="570" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="280" r="24" fill="#207448" />
      <text x="548" y="288" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">2</tspan>
        <tspan x="585" fill="#303a36" font-family="monospace"> helper pod: kubectl run -it</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">--rm dnsutils --image=</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">registry.k8s.io/e2e-test-images/</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">jessie-dnsutils -- sh</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">then dig or nslookup</tspan>
      </text>
    </g>

    
    <g id="debug-step-3">
      <rect x="515" y="434" width="570" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="467" r="24" fill="#207448" />
      <text x="548" y="475" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">3</tspan>
        <tspan x="585" fill="#303a36" font-family="monospace"> CoreDNS logs:</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">kubectl logs -n kube-system</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">-l k8s-app=kube-dns</tspan>
      </text>
    </g>

    
    <g id="debug-step-4">
      <rect x="515" y="561" width="570" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="594" r="24" fill="#207448" />
      <text x="548" y="602" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">4</tspan>
        <tspan x="585" fill="#303a36" font-family="monospace"> Corefile:</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">kubectl -n kube-system</tspan>
        <tspan x="585" dy="30" fill="#303a36" font-family="monospace">get cm coredns -o yaml</tspan>
      </text>
    </g>

    
    <g id="debug-step-5">
      <rect x="515" y="688" width="570" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="721" r="24" fill="#207448" />
      <text x="548" y="729" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">5</tspan>
        <tspan x="585" fill="#303a36" font-family="monospace"> metrics: coredns_dns_requests_total,</tspan>
        <tspan x="585" dy="28" fill="#303a36" font-family="monospace">coredns_dns_responses_total{rcode},</tspan>
        <tspan x="585" dy="28" fill="#303a36" font-family="monospace">latency histograms</tspan>
      </text>
    </g>

    
    <g id="debug-step-6">
      <rect x="515" y="810" width="570" height="45" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <circle cx="548" cy="832" r="18" fill="#207448" />
      <text x="548" y="840" font-size="24">
        <tspan text-anchor="middle" fill="#ffffff" font-weight="bold">6</tspan>
        <tspan x="585" fill="#303a36" font-family="sans-serif"> confirm the nodes' own resolvers work</tspan>
      </text>
    </g>
  </g>

  
  
  <g id="fixes-container">
    <rect x="1130" y="95" width="430" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1155, 115)">
      <path d="M 32 4 C 24 4 18 9 16 16 L 4 28 C 1 31 1 36 4 39 C 7 42 12 42 15 39 L 27 27 C 34 29 41 25 44 18 L 34 18 L 30 12 L 36 6 C 35 5 33 4 32 4 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>

    <text x="1225" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Fixes</text>

    
    <g id="fix-1">
      <rect x="1150" y="175" width="390" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="1168" y="212" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1168" dy="0">FQDNs with a trailing</tspan>
        <tspan x="1168" dy="30">dot in hot paths</tspan>
      </text>
    </g>

    
    <g id="fix-2">
      <rect x="1150" y="272" width="390" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="1168" y="309" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1168" dy="0" font-family="monospace">dnsConfig.options</tspan>
        <tspan x="1168" dy="30">ndots 1 or 2 per pod</tspan>
      </text>
    </g>

    
    <g id="fix-3-nodelocal">
      <rect x="1150" y="369" width="390" height="235" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
      <text x="1168" y="408" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1168" dy="0" font-weight="bold" fill="#db8129">NodeLocal DNSCache: </tspan>
        <tspan x="1168" dy="34">a per-node cache on a</tspan>
        <tspan x="1168" dy="32">link-local IP avoiding</tspan>
        <tspan x="1168" dy="32">conntrack and</tspan>
        <tspan x="1168" dy="32">cross-node hops</tspan>
      </text>
    </g>

    
    <g id="fix-4">
      <rect x="1150" y="616" width="390" height="235" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="1168" y="656" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1168" dy="0">scale CoreDNS with an</tspan>
        <tspan x="1168" dy="32">autoscaler or more</tspan>
        <tspan x="1168" dy="32">replicas, tune its cache</tspan>
        <tspan x="1168" dy="32">and forward plugins</tspan>
      </text>
    </g>
  </g>

  
  <g id="resolution-facts-container">
    <rect x="40" y="885" width="1520" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(64, 902)">
      <circle cx="12" cy="14" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="44" cy="14" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="42" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="18" x2="38" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="20" x2="24" y2="36" stroke="#207448" stroke-width="3" />
      <line x1="40" y1="20" x2="32" y2="36" stroke="#207448" stroke-width="3" />
    </g>

    <text x="135" y="938" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Name resolution facts</text>

    <rect x="60" y="965" width="1480" height="75" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="76" y="995" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="76" dy="0">service.namespace.svc.cluster.local resolves to ClusterIPs; headless services return pod IPs,</tspan>
      <tspan x="76" dy="30">e.g. worker-0.trainer.ns.svc.cluster.local; everything else is forwarded to the node's upstream resolvers</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1075" width="1520" height="75" rx="10" fill="#207448" />
    <text x="800" y="1122" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Run your DNS tests inside the same image the pod uses</text>
  </g>
</svg>