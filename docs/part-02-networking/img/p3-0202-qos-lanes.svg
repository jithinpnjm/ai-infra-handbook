<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Quality of service: label, queue, schedule</title>
  <desc>Visual infographic explaining Quality of Service network packet classification, queuing, rate shaping and policing, congestion signaling, and scheduling.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="60" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Quality of service: label, queue, schedule</text>

  
  <rect x="410" y="130" width="570" height="115" rx="8" fill="#e8f1ea"/>
  <line x1="410" y1="130" x2="410" y2="245" stroke="#207448" stroke-width="8"/>
  <text x="435" y="165" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="435" dy="0" font-weight="bold">Real-time traffic cares about</tspan>
    <tspan x="435" dy="32">delay and jitter, the</tspan>
    <tspan x="435" dy="32">variation in delay</tspan>
  </text>

  
  <rect x="1030" y="130" width="310" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1060 195 A 20 20 0 1 1 1096 195" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1078" y1="195" x2="1092" y2="180" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1205" y="175" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1205" dy="0">shape or</tspan>
    <tspan x="1205" dy="30">police rates</tspan>
  </text>

  
  <rect x="1030" y="265" width="310" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1060 340 Q 1072 320 1084 340 T 1108 340" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="1084" cy="365" r="5" fill="#207448"/>
  <text x="1210" y="312" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1210" dy="0" font-weight="bold" fill="#207448">ECN and early drop</tspan>
    <tspan x="1210" dy="32">signal congestion</tspan>
    <tspan x="1210" dy="32">to the sender</tspan>
  </text>

  
  <rect x="60" y="270" width="300" height="470" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <path d="M 188 335 L 208 315 L 232 315 C 235 315, 237 317, 237 320 L 237 355 C 237 358, 235 360, 232 360 L 200 360 C 197 360, 195 358, 193 355 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="225" cy="327" r="4" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="210" y="395" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Classify</text>
  <text x="210" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="210" dy="0">DSCP or IP</tspan>
    <tspan x="210" dy="34">precedence,</tspan>
    <tspan x="210" dy="34">or 802.1p PCP:</tspan>
    <tspan x="210" dy="34">a label on each</tspan>
    <tspan x="210" dy="34">packet saying</tspan>
    <tspan x="210" dy="34">how urgent it is</tspan>
  </text>

  
  <line x1="360" y1="505" x2="408" y2="505" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="410" y="270" width="570" height="470" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="425" y="285" width="540" height="70" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="445" y="328" font-family="sans-serif" font-size="25" fill="#303a36">class 1: voice, video, real-time</text>

  
  <rect x="425" y="365" width="540" height="70" rx="8" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <text x="445" y="408" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">class 2: lossless RDMA (PFC and ECN)</text>

  
  <rect x="425" y="445" width="540" height="70" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="445" y="488" font-family="sans-serif" font-size="25" fill="#303a36">class 3: storage</text>

  
  <rect x="425" y="525" width="540" height="70" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="445" y="568" font-family="sans-serif" font-size="25" fill="#303a36">class 4: management and other</text>

  
  <rect x="425" y="610" width="540" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="695" y="645" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="695" dy="0">like separate checkout lanes</tspan>
    <tspan x="695" dy="32">in a shop; four to eight</tspan>
    <tspan x="695" dy="32">queues usually suffice</tspan>
  </text>

  
  <line x1="980" y1="590" x2="1028" y2="590" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1030" y="440" width="310" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="1185" cy="495" r="26" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 1185 477 L 1185 495 L 1198 503" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1215 487 A 28 28 0 0 1 1210 515" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="1185" y="565" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    <tspan x="1185" dy="0">Scheduler:</tspan>
  </text>
  <text x="1185" y="615" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="1185" dy="0">strict priority or</tspan>
    <tspan x="1185" dy="34">weighted round robin</tspan>
  </text>

  
  <line x1="1340" y1="590" x2="1418" y2="590" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1420" y="440" width="120" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="1455" y="510" width="50" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 1465 550 L 1465 540 L 1495 540 L 1495 550" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="1473" y1="520" x2="1473" y2="528" stroke="#207448" stroke-width="3"/>
  <line x1="1480" y1="520" x2="1480" y2="528" stroke="#207448" stroke-width="3"/>
  <line x1="1487" y1="520" x2="1487" y2="528" stroke="#207448" stroke-width="3"/>
  <text x="1480" y="605" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Link</text>

  
  <rect x="60" y="800" width="1480" height="90" rx="12" fill="#207448"/>
  <text x="800" y="855" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Before you add a queue, decide which traffic needs a lossless class and which does not</text>
</svg>