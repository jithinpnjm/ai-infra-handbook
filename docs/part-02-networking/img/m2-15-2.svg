<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Session establishment</title>
  <desc>BGP session establishment finite state machine showing transitions between Idle, Connect, Active, OpenSent, OpenConfirm, and Established states.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#587063" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#143322" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="80" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Session establishment</text>

  

  
  
  <circle cx="80" cy="210" r="22" fill="#207448" stroke="#175635" stroke-width="4" />

  
  
  <g filter="url(#card-shadow)">
    <rect x="190" y="145" width="240" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="236" cy="210" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="228" y1="198" x2="228" y2="222" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="244" y1="198" x2="244" y2="222" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="282" y="221" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Idle</text>
  </g>

  
  
  <g filter="url(#card-shadow)">
    <rect x="580" y="145" width="250" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="614" y="200" width="20" height="20" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="610" y1="205" x2="602" y2="205" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="610" y1="215" x2="602" y2="215" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 634 210 L 648 210" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="662" y="221" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Connect</text>
  </g>

  
  
  <g filter="url(#card-shadow)">
    <rect x="580" y="435" width="250" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="628" cy="500" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="628,488 628,500 638,500" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="668" y="511" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Active</text>
  </g>

  
  
  <g filter="url(#card-shadow)">
    <rect x="1010" y="290" width="250" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1038" y="342" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="1038,345 1055,357 1072,345" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    
    <text x="1084" y="366" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">OpenSent</text>
  </g>

  
  
  <g filter="url(#card-shadow)">
    <rect x="1010" y="585" width="275" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="1048" cy="650" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="1038,650 1045,658 1060,642" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="1082" y="661" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">OpenConfirm</text>
  </g>

  
  
  <g filter="url(#card-shadow)">
    <rect x="1010" y="880" width="275" height="130" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="1048" cy="945" r="22" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 1036 945 L 1045 953 L 1060 937" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="1082" y="956" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Established</text>
  </g>

  

   Idle -->
  <path d="M 102 210 L 190 210" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

   Connect -->
  <path d="M 430 210 L 580 210" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <text x="505" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="505" dy="0">start event,</tspan>
    <tspan x="505" dy="30" font-family="monospace">TCP SYN to peer:179</tspan>
  </text>

   Active -->
  
  <path d="M 640 275 L 640 435" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <text x="625" y="360" text-anchor="end" font-family="sans-serif" font-size="24" fill="#303a36">TCP failed, retry</text>

   Connect -->
  
  <path d="M 770 435 L 770 275" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <text x="785" y="360" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">retry timer</text>

   OpenSent -->
  <path d="M 830 210 L 930 210 L 930 335 L 1010 335" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

   OpenSent -->
  <path d="M 830 500 L 930 500 L 930 375 L 1010 375" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <text x="880" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">TCP up, send OPEN</text>

   OpenConfirm -->
  <path d="M 1147 420 L 1147 585" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <text x="1165" y="508" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">OPEN received, send KEEPALIVE</text>

   Established (Key transition into Established) -->
  <path d="M 1147 715 L 1147 880" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <text x="1165" y="803" text-anchor="start" font-family="sans-serif" font-size="24" fill="#303a36">KEEPALIVE received</text>

   Idle -->
  
  <path d="M 1010 945 L 310 945 L 310 275" fill="none" stroke="#587063" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrow-muted)" />
  
  <text x="640" y="990" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">NOTIFICATION / hold timer expiry / TCP reset</text>

</svg>