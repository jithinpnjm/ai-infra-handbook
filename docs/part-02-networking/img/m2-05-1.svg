<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The routing decision</title>
  <desc>Visual flowchart of the Linux network packet routing decision process, policy rules, routing table lookup, and destination route types.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The routing decision</text>

  
  
  

  
  <line x1="290" y1="225" x2="290" y2="255" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="290" y1="395" x2="290" y2="425" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="130" y1="565" x2="130" y2="760" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="520" y1="485" x2="980" y2="485" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="610" y="445" width="280" height="34" rx="6" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="750" y="470" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no match in any table</text>

  
  <path d="M 520,780 L 570,780 L 570,600 L 980,600" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="670" y="560" width="210" height="34" rx="6" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="775" y="585" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">local/broadcast</text>

  
  <path d="M 520,805 L 630,805 L 630,715 L 980,715" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="680" y="675" width="250" height="34" rx="6" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="805" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">unicast, scope link (connected)</text>

  
  <line x1="520" y1="832" x2="980" y2="832" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <rect x="670" y="792" width="210" height="34" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="775" y="817" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">unicast via G</text>

  
  <path d="M 520,865 L 630,865 L 630,950 L 980,950" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="715" y="910" width="180" height="34" rx="6" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="805" y="935" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">blackhole</text>

  
  <path d="M 520,885 L 570,885 L 570,1067 L 980,1067" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="650" y="1027" width="250" height="34" rx="6" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="775" y="1052" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">unreachable / prohibit</text>

  
  <rect x="165" y="595" width="335" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="185" y="635" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">match</text>
  <text x="185" y="670" font-family="sans-serif" font-size="24" fill="#303a36">(longest prefix,</text>
  <text x="185" y="705" font-family="sans-serif" font-size="24" fill="#303a36">then lowest metric)</text>

  
  
  

  
  <g id="node-p">
    <rect x="60" y="105" width="460" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="95" cy="142" r="22" fill="#207448" />
    <text x="95" y="150" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(130, 118)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="40" height="30" rx="4" />
      <path d="M 4 14 L 24 28 L 44 14" />
      <line x1="24" y1="28" x2="24" y2="38" />
    </g>
    
    <text x="190" y="148" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Packet to dst D</text>
    <text x="90" y="196" font-family="sans-serif" font-size="24" fill="#303a36">(locally generated or received)</text>
  </g>

  
  <g id="node-r">
    <rect x="60" y="255" width="460" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="95" cy="292" r="22" fill="#207448" />
    <text x="95" y="300" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(130, 268)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 42 12 V 26 C 42 36 24 44 24 44 C 24 44 6 36 6 26 V 12 Z" />
      <line x1="16" y1="20" x2="32" y2="20" />
      <line x1="16" y1="28" x2="28" y2="28" />
    </g>
    
    <text x="190" y="292" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Policy rules <tspan font-family="monospace" font-size="24" font-weight="normal">(ip rule)</tspan></text>
    <text x="90" y="348" font-family="sans-serif" font-size="24" fill="#303a36">select table(s) in priority order</text>
  </g>

  
  <g id="node-l">
    <rect x="60" y="425" width="460" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="95" cy="462" r="22" fill="#207448" />
    <text x="95" y="470" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(130, 438)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="38" height="34" rx="4" />
      <line x1="4" y1="16" x2="42" y2="16" />
      <line x1="4" y1="26" x2="42" y2="26" />
      <line x1="16" y1="6" x2="16" y2="40" />
    </g>
    
    <text x="190" y="465" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Lookup D in table:</text>
    <text x="90" y="520" font-family="sans-serif" font-size="24" fill="#303a36">local → main → default (per rules)</text>
  </g>

  
  <g id="node-t">
    <rect x="60" y="760" width="460" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="95" cy="800" r="22" fill="#207448" />
    <text x="95" y="808" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(130, 778)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <path d="M 14 24 H 34" />
      <path d="M 28 16 L 34 24 L 28 32" />
      <path d="M 24 14 V 34" />
    </g>
    
    <text x="190" y="836" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Route type</text>
  </g>

  
  
  

  
  <g id="node-n">
    <rect x="980" y="440" width="560" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1010, 460)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 6 L 44 42 H 4 Z" />
      <line x1="24" y1="18" x2="24" y2="28" />
      <circle cx="24" cy="35" r="1.5" fill="#207448" />
    </g>
    
    <text x="1075" y="495" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ENETUNREACH / ICMP net unreachable</text>
  </g>

  
  <g id="node-d1">
    <rect x="980" y="555" width="560" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1010, 575)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="12" rx="3" />
      <rect x="6" y="24" width="36" height="12" rx="3" />
      <circle cx="12" cy="14" r="1.5" fill="#207448" />
      <circle cx="12" cy="30" r="1.5" fill="#207448" />
      <line x1="32" y1="14" x2="36" y2="14" />
      <line x1="32" y1="30" x2="36" y2="30" />
    </g>
    
    <text x="1075" y="612" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Deliver to this host</text>
  </g>

  
  <g id="node-d2">
    <rect x="980" y="670" width="560" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1010, 690)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="20" height="24" rx="3" />
      <rect x="26" y="14" width="16" height="16" rx="2" />
      <line x1="2" y1="22" x2="6" y2="22" />
      <circle cx="16" cy="22" r="3" />
    </g>
    
    <text x="1075" y="725" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ARP/NDP for D itself on dev; send frame</text>
  </g>

  
  <g id="node-d3">
    <rect x="980" y="785" width="560" height="95" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(1010, 807)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <path d="M 12 20 L 8 24 L 12 28" />
      <path d="M 36 20 L 40 24 L 36 28" />
      <path d="M 8 24 H 40" />
      <path d="M 20 12 L 24 8 L 28 12" />
      <path d="M 20 36 L 24 40 L 28 36" />
      <path d="M 24 8 V 40" />
    </g>
    
    <text x="1075" y="828" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ARP/NDP for G on dev;</text>
    <text x="1075" y="862" font-family="sans-serif" font-size="24" fill="#303a36">send frame to G's MAC</text>
  </g>

  
  <g id="node-d4">
    <rect x="980" y="905" width="560" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1010, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <circle cx="24" cy="24" r="9" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    
    <text x="1075" y="962" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Drop silently</text>
  </g>

  
  <g id="node-d5">
    <rect x="980" y="1020" width="560" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1010, 1042)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="11" y1="11" x2="37" y2="37" />
    </g>
    
    <text x="1075" y="1062" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Drop + ICMP unreachable /</text>
    <text x="1075" y="1096" font-family="sans-serif" font-size="24" fill="#303a36">admin prohibited</text>
  </g>
</svg>