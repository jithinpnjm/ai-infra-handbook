<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1375" width="1600" height="1375">
  <title>The dead first nameserver: where 5 and 10 second delays come from</title>
  <desc>Infographic explaining resolver timeouts, glibc retry behavior, and 5 to 10 second DNS lookup delays</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#c02010" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1375" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#207448">The dead first nameserver:</text>
  <text x="800" y="102" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">where 5 and 10 second delays come from</text>

  
  <rect x="50" y="130" width="1500" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="80" y="145" width="690" height="60" rx="8" fill="#feebe8" stroke="#c02010" stroke-width="2" />
  <circle cx="120" cy="175" r="14" fill="#c02010" />
  <line x1="113" y1="168" x2="127" y2="182" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="127" y1="168" x2="113" y2="182" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <text x="440" y="184" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#c02010">nameserver 10.32.45.23 (dead)</text>

  
  <rect x="830" y="145" width="690" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="870" cy="175" r="14" fill="#207448" />
  <polyline points="863,175 868,180 878,170" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1190" y="184" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">nameserver 10.3.2.3 (alive)</text>

  

  
  <rect x="50" y="245" width="990" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="80" y="283" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">glibc default: 5 s per attempt, 2 attempts per nameserver;</text>
  <text x="80" y="318" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">up to 3 nameserver lines used</text>

  
  <rect x="50" y="360" width="990" height="335" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="75" y="385" width="435" height="105" rx="8" fill="#feebe8" stroke="#c02010" stroke-width="2" />
  <text x="292" y="430" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">attempt 1 to the first server</text>
  <text x="292" y="465" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c02010">waits 5 s</text>

  
  <line x1="510" y1="437" x2="545" y2="437" stroke="#c02010" stroke-width="3" marker-end="url(#arrow-red)" />

  
  <rect x="550" y="385" width="465" height="105" rx="8" fill="#feebe8" stroke="#c02010" stroke-width="2" />
  <text x="782" y="430" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">attempt 2</text>
  <text x="782" y="465" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#c02010">waits another 5 s</text>

  
  <path d="M 782 490 L 782 505 L 340 505 L 340 515" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="75" y="520" width="530" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="340" y="582" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">falls to the second server</text>
  <text x="340" y="622" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">and gets an answer</text>

  
  <line x1="605" y1="592" x2="640" y2="592" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="645" y="520" width="370" height="145" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
  <text x="830" y="582" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">stalled 5 to 10 s</text>
  <text x="830" y="622" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">on every lookup</text>

  
  <rect x="50" y="720" width="990" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="80" y="745" width="930" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="545" y="794" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">options timeout:1 attempts:2 rotate</text>
  
  <rect x="80" y="845" width="930" height="80" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="545" y="894" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">showing 1 s waits and rotation across servers</text>

  
  <rect x="50" y="975" width="990" height="260" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="80" y="1005" width="930" height="200" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="545" y="1065" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">local caching resolver</text>
  <text x="545" y="1115" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(systemd-resolved, dnsmasq, unbound):</text>
  <text x="545" y="1165" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">fails over quickly</text>

  

  
  <rect x="1070" y="245" width="480" height="450" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="1115" cy="285" r="20" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="1115,273 1115,285 1125,285" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="1150" y="278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Exactly N seconds</text>
  <text x="1150" y="310" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">means a timer:</text>

  <text x="1100" y="365" font-family="sans-serif" font-size="24" fill="#303a36">DNS problems often show up</text>
  <text x="1100" y="403" font-family="sans-serif" font-size="24" fill="#303a36">as delays of a fixed number</text>
  <text x="1100" y="441" font-family="sans-serif" font-size="24" fill="#303a36">of seconds; match the number</text>
  <text x="1100" y="479" font-family="sans-serif" font-size="24" fill="#303a36">to a resolver timeout (here 5 s</text>
  <text x="1100" y="517" font-family="sans-serif" font-size="24" fill="#303a36">from glibc, multiplied by</text>
  <text x="1100" y="555" font-family="sans-serif" font-size="24" fill="#303a36">retries) and you find the layer</text>

  
  <rect x="1070" y="720" width="480" height="515" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="1115" cy="760" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="1115" cy="760" r="6" fill="#207448" />
  
  <text x="1145" y="768" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolv.conf options:</text>

  <text x="1100" y="815" font-family="monospace" font-size="24" fill="#207448">ndots:N, timeout:, attempts:,</text>
  <text x="1100" y="853" font-family="monospace" font-size="24" fill="#207448">rotate, edns0;</text>

  <text x="1100" y="898" font-family="sans-serif" font-size="24" fill="#303a36">the file is often a symlink</text>
  <text x="1100" y="936" font-family="sans-serif" font-size="24" fill="#303a36">managed by systemd-resolved,</text>
  <text x="1100" y="974" font-family="sans-serif" font-size="24" fill="#303a36">NetworkManager, resolvconf</text>
  <text x="1100" y="1012" font-family="sans-serif" font-size="24" fill="#303a36">or cloud-init, hand edits are</text>
  <text x="1100" y="1050" font-family="sans-serif" font-size="24" fill="#303a36">overwritten, configure the</text>
  <text x="1100" y="1088" font-family="sans-serif" font-size="24" fill="#303a36">manager instead:</text>

  <text x="1100" y="1135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">netplan nameservers,</text>
  <text x="1100" y="1173" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">nmcli or resolved.conf</text>

  
  <rect x="50" y="1260" width="1500" height="80" rx="10" fill="#207448" />
  <text x="800" y="1310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A dead resolver at the front of the list stalls every lookup</text>
</svg>