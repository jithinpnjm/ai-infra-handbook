<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>DORA</title>
  <desc>DHCP DORA sequence diagram illustrating address acquisition, renewal, rebind, and release between client and DHCP server.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">DORA</text>

  
  <line x1="295" y1="225" x2="295" y2="1135" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>
  <line x1="1305" y1="225" x2="1305" y2="1135" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>

  
  <rect x="40" y="85" width="510" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="271" y="103" width="48" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M260 143 L330 143 L324 149 L266 149 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <text x="295" y="196" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client (0.0.0.0, UDP 68)</text>

  
  <rect x="1050" y="85" width="510" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="1281" y="103" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="1291" cy="112" r="2.5" fill="#207448"/>
  <line x1="1301" y1="112" x2="1321" y2="112" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <rect x="1281" y="127" width="48" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="1291" cy="136" r="2.5" fill="#207448"/>
  <line x1="1301" y1="136" x2="1321" y2="136" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="1305" y="196" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DHCP server (UDP 67)</text>

  
  <rect x="350" y="243" width="900" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="275" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DISCOVER (broadcast 255.255.255.255) &quot;any DHCP server out there?&quot;</text>
  <circle cx="295" cy="297" r="24" fill="#207448"/>
  <text x="295" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <line x1="319" y1="297" x2="1290" y2="297" stroke="#207448" stroke-width="3"/>
  <polygon points="1290,289 1305,297 1290,305" fill="#207448"/>

  
  <rect x="460" y="348" width="680" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">OFFER  yiaddr=10.20.0.45, lease 12h, options</text>
  <circle cx="1305" cy="402" r="24" fill="#207448"/>
  <text x="1305" y="410" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <line x1="1281" y1="402" x2="310" y2="402" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="310,394 295,402 310,410" fill="#207448"/>

  
  <rect x="380" y="453" width="840" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="485" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">REQUEST (broadcast) &quot;I accept 10.20.0.45 from server X&quot;</text>
  <circle cx="295" cy="507" r="24" fill="#207448"/>
  <text x="295" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <line x1="319" y1="507" x2="1290" y2="507" stroke="#207448" stroke-width="3"/>
  <polygon points="1290,499 1305,507 1290,515" fill="#207448"/>

  
  <rect x="600" y="558" width="400" height="46" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2.5"/>
  <text x="800" y="590" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ACK  (lease confirmed)</text>
  <circle cx="1305" cy="612" r="24" fill="#db8129"/>
  <text x="1305" y="620" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <line x1="1281" y1="612" x2="310" y2="612" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="310,604 295,612 310,620" fill="#db8129"/>

  
  <rect x="40" y="678" width="510" height="54" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="295" y="713" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">configures address, routes, DNS</text>

  
  <rect x="450" y="753" width="700" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="785" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(at T1 = 50% of lease) REQUEST unicast: renew</text>
  <circle cx="295" cy="807" r="24" fill="#207448"/>
  <text x="295" y="815" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <line x1="319" y1="807" x2="1290" y2="807" stroke="#207448" stroke-width="3"/>
  <polygon points="1290,799 1305,807 1290,815" fill="#207448"/>

  
  <rect x="630" y="848" width="340" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="880" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ACK (new lease)</text>
  <circle cx="1305" cy="902" r="24" fill="#207448"/>
  <text x="1305" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <line x1="1281" y1="902" x2="310" y2="902" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="310,894 295,902 310,910" fill="#207448"/>

  
  <rect x="360" y="943" width="880" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="975" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(at T2 = 87.5%) REQUEST broadcast: rebind to any server</text>
  <circle cx="295" cy="997" r="24" fill="#207448"/>
  <text x="295" y="1005" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
  <line x1="319" y1="997" x2="1290" y2="997" stroke="#207448" stroke-width="3"/>
  <polygon points="1290,989 1305,997 1290,1005" fill="#207448"/>

  
  <rect x="590" y="1038" width="420" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1070" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(before leaving) RELEASE</text>
  <circle cx="295" cy="1092" r="24" fill="#207448"/>
  <text x="295" y="1100" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
  <line x1="319" y1="1092" x2="1290" y2="1092" stroke="#207448" stroke-width="3"/>
  <polygon points="1290,1084 1305,1092 1290,1100" fill="#207448"/>
</svg>