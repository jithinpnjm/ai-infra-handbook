<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Inter-VLAN routing</title>
  <desc>Visual comparison of Inter-VLAN routing architectures: Router-on-a-stick, SVI / IRB, and Data centre leaf routing.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Inter-VLAN routing</text>

  
  <g id="orange-note">
    <rect x="50" y="85" width="1500" height="64" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(75, 99)">
      <circle cx="18" cy="18" r="16" fill="none" stroke="#db8129" stroke-width="3"/>
      <line x1="18" y1="15" x2="18" y2="26" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="10" r="2" fill="#db8129"/>
    </g>
    <text x="125" y="126" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">A VLAN is a closed broadcast domain, so different VLANs need an L3 gateway</text>
  </g>

  
  <g id="panel-a">
    
    <rect x="50" y="175" width="476" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(260, 195)">
      <circle cx="28" cy="28" r="25" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="14" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="14" x2="28" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="6" fill="#207448"/>
    </g>

    
    <rect x="228" y="265" width="120" height="34" rx="6" fill="#207448"/>
    <text x="288" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Panel A</text>

    
    <text x="288" y="335" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Router-on-a-stick</text>

    
    <rect x="75" y="365" width="426" height="235" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    
    <rect x="148" y="385" width="280" height="50" rx="8" fill="#f0f6f2" stroke="#207448" stroke-width="3"/>
    <circle cx="178" cy="410" r="10" fill="#207448"/>
    <line x1="205" y1="410" x2="400" y2="410" stroke="#207448" stroke-width="3" stroke-dasharray="6,4"/>

    
    <rect x="218" y="425" width="45" height="15" rx="3" fill="#207448"/>
    <rect x="313" y="425" width="45" height="15" rx="3" fill="#207448"/>

    
    <line x1="288" y1="435" x2="288" y2="525" stroke="#207448" stroke-width="8"/>
    <line x1="284" y1="445" x2="284" y2="515" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4"/>

    
    <rect x="148" y="525" width="280" height="55" rx="8" fill="#f0f6f2" stroke="#207448" stroke-width="3"/>
    <rect x="170" y="542" width="20" height="20" rx="3" fill="#207448"/>
    <rect x="200" y="542" width="20" height="20" rx="3" fill="#207448"/>
    <rect x="230" y="542" width="20" height="20" rx="3" fill="#207448"/>
    <rect x="326" y="542" width="20" height="20" rx="3" fill="#207448"/>
    <rect x="356" y="542" width="20" height="20" rx="3" fill="#207448"/>
    <rect x="386" y="542" width="20" height="20" rx="3" fill="#207448"/>

    
    <rect x="75" y="620" width="426" height="315" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>
    <text x="288" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="288" dy="0">one trunk from a switch</tspan>
      <tspan x="288" dy="38">to a router with</tspan>
      <tspan x="288" dy="38">sub-interfaces</tspan>
      <tspan x="288" dy="38"><tspan font-family="monospace" font-weight="bold" fill="#207448">eth0.10</tspan> and <tspan font-family="monospace" font-weight="bold" fill="#207448">eth0.20,</tspan></tspan>
      <tspan x="288" dy="38">each holding the</tspan>
      <tspan x="288" dy="38">gateway IP of its VLAN.</tspan>
    </text>
  </g>

  
  <g id="panel-b">
    
    <rect x="562" y="175" width="476" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(772, 195)">
      <rect x="3" y="3" width="50" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <rect x="12" y="12" width="32" height="12" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="20" cy="38" r="4" fill="#207448"/>
      <circle cx="36" cy="38" r="4" fill="#207448"/>
    </g>

    
    <rect x="740" y="265" width="120" height="34" rx="6" fill="#207448"/>
    <text x="800" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Panel B</text>

    
    <text x="800" y="335" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">SVI / IRB</text>

    
    <rect x="587" y="365" width="426" height="235" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    
    <rect x="640" y="385" width="320" height="195" rx="10" fill="#f0f6f2" stroke="#207448" stroke-width="3"/>

    
    <rect x="660" y="400" width="280" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="690" cy="430" r="14" fill="#207448"/>
    <line x1="720" y1="430" x2="910" y2="430" stroke="#207448" stroke-width="3" stroke-dasharray="6,4"/>

    
    <line x1="720" y1="460" x2="720" y2="500" stroke="#207448" stroke-width="4"/>
    <line x1="880" y1="460" x2="880" y2="500" stroke="#207448" stroke-width="4"/>

    
    <rect x="660" y="500" width="280" height="65" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="680" y="520" width="22" height="25" rx="3" fill="#207448"/>
    <rect x="715" y="520" width="22" height="25" rx="3" fill="#207448"/>
    <rect x="750" y="520" width="22" height="25" rx="3" fill="#207448"/>
    <rect x="850" y="520" width="22" height="25" rx="3" fill="#207448"/>
    <rect x="885" y="520" width="22" height="25" rx="3" fill="#207448"/>

    
    <rect x="587" y="620" width="426" height="315" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>
    <text x="800" y="755" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">an interface per VLAN</tspan>
      <tspan x="800" dy="42">on an L3 switch.</tspan>
    </text>
  </g>

  
  <g id="panel-c">
    
    <rect x="1074" y="175" width="476" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1284, 195)">
      <rect x="6" y="3" width="44" height="50" rx="5" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="6" y1="18" x2="50" y2="18" stroke="#207448" stroke-width="2"/>
      <line x1="6" y1="34" x2="50" y2="34" stroke="#207448" stroke-width="2"/>
      <circle cx="14" cy="11" r="2.5" fill="#207448"/>
      <circle cx="14" cy="26" r="2.5" fill="#207448"/>
      <circle cx="14" cy="42" r="2.5" fill="#207448"/>
    </g>

    
    <rect x="1252" y="265" width="120" height="34" rx="6" fill="#207448"/>
    <text x="1312" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Panel C</text>

    
    <text x="1312" y="335" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Data centre</text>

    
    <rect x="1099" y="365" width="426" height="235" rx="12" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>

    
    <rect x="1140" y="385" width="155" height="42" rx="6" fill="#f0f6f2" stroke="#207448" stroke-width="2.5"/>
    <rect x="1330" y="385" width="155" height="42" rx="6" fill="#f0f6f2" stroke="#207448" stroke-width="2.5"/>
    <line x1="1295" y1="406" x2="1330" y2="406" stroke="#207448" stroke-width="3" stroke-dasharray="4,2"/>
    <circle cx="1160" cy="406" r="4" fill="#207448"/>
    <circle cx="1465" cy="406" r="4" fill="#207448"/>

    
    <rect x="1135" y="442" width="354" height="140" rx="8" fill="#f0f6f2" stroke="#207448" stroke-width="2"/>

    
    <rect x="1150" y="455" width="324" height="32" rx="4" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1170" cy="471" r="3" fill="#207448"/>
    <line x1="1190" y1="471" x2="440" y2="471" stroke="#c2d9c8" stroke-width="2"/>

    <rect x="1150" y="495" width="324" height="32" rx="4" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1170" cy="511" r="3" fill="#207448"/>

    <rect x="1150" y="535" width="324" height="32" rx="4" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="1170" cy="551" r="3" fill="#207448"/>

    
    
    <rect x="1099" y="620" width="426" height="95" rx="10" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>
    <text x="1312" y="658" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1312" dy="0">VLAN gateway moves</tspan>
      <tspan x="1312" dy="34">to the leaf switch;</tspan>
    </text>

    
    <rect x="1099" y="730" width="426" height="95" rx="10" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>
    <text x="1312" y="768" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1312" dy="0">VLANs rarely extend beyond</tspan>
      <tspan x="1312" dy="34">a rack or pair of leaves;</tspan>
    </text>

    
    <rect x="1099" y="840" width="426" height="95" rx="10" fill="#ffffff" stroke="#c2d9c8" stroke-width="2"/>
    <text x="1312" y="878" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1312" dy="0">stretch with EVPN/VXLAN</tspan>
      <tspan x="1312" dy="34">(chapter 2.17).</tspan>
    </text>
  </g>
</svg>