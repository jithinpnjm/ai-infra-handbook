<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Network automation architecture</title>
  <desc>Visual architecture diagram showing User interactions, Orchestration, Automation engine, Source of truth, Network infrastructure, and Telemetry and observability in a closed automation loop.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Network automation architecture</text>

  

  
  <path d="M 510 270 L 556 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 800 400 L 800 456" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1090 550 L 1044 550" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1030 650 L 1076 650" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 800 730 L 800 786" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 570 930 L 300 930 Q 280 930 280 910 L 280 744" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 280 470 L 280 414" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 510 600 L 556 600" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />


  
  <g id="node-ui">
    <rect x="50" y="140" width="460" height="260" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="254" y="160" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 270 198 L 270 214 M 290 198 L 290 214 M 260 214 L 300 214" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="280" cy="176" r="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 268 192 Q 280 184 292 192" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="280" y="248" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">User interactions</text>
    
    <text x="280" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">GUI, ITSM tickets,</tspan>
      <tspan x="280" dy="34">dashboards, ChatOps,</tspan>
      <tspan x="280" dy="34">docs/reports</tspan>
    </text>
  </g>

  
  <g id="node-orch">
    <rect x="570" y="140" width="460" height="260" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="776" cy="182" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="824" cy="182" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="800" cy="208" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 788 182 L 810 182 M 784 194 L 794 202 M 816 194 L 806 202" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="800" y="254" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Orchestration</text>
    
    <text x="800" y="308" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">workflows, approvals,</tspan>
      <tspan x="800" dy="36">ordering across domains</tspan>
    </text>
  </g>

  
  <g id="node-sot">
    <rect x="1090" y="470" width="460" height="260" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <ellipse cx="1320" cy="498" rx="26" ry="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1294 498 L 1294 518 A 26 10 0 0 0 1346 518 L 1346 498" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1294 518 L 1294 538 A 26 10 0 0 0 1346 538 L 1346 518" fill="none" stroke="#207448" stroke-width="4" />
    
    <text x="1320" y="584" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Source of truth</text>
    
    <text x="1320" y="638" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1320" dy="0">inventory + intent</tspan>
      <tspan x="1320" dy="36">(NetBox/Nautobot/Git)</tspan>
    </text>
  </g>

  
  <g id="node-eng">
    <rect x="570" y="470" width="460" height="260" rx="16" ry="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <circle cx="800" cy="522" r="14" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 800 496 L 800 504 M 800 540 L 800 548 M 774 522 L 782 522 M 818 522 L 826 522 M 782 504 L 788 510 M 812 534 L 818 540 M 782 540 L 788 534 M 812 510 L 818 504" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    
    <text x="800" y="584" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Automation engine</text>
    
    <text x="800" y="638" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">backup, render, compliance,</tspan>
      <tspan x="800" dy="36">deploy, operations</tspan>
    </text>
  </g>

  
  <g id="node-net">
    <rect x="570" y="800" width="460" height="260" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="768" y="822" width="64" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="784" cy="835" r="3" fill="#207448" />
    <circle cx="796" cy="835" r="3" fill="#207448" />
    <circle cx="808" cy="835" r="3" fill="#207448" />
    <circle cx="820" cy="835" r="3" fill="#207448" />
    <path d="M 776 848 L 766 866 M 800 848 L 800 866 M 824 848 L 834 866" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="764" cy="868" r="4" fill="#207448" />
    <circle cx="800" cy="868" r="4" fill="#207448" />
    <circle cx="836" cy="868" r="4" fill="#207448" />
    
    <text x="800" y="914" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Network infrastructure</text>
    
    <text x="800" y="968" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">switches, routers, firewalls,</tspan>
      <tspan x="800" dy="36">hosts, controllers</tspan>
    </text>
  </g>

  
  <g id="node-tel">
    <rect x="50" y="470" width="460" height="260" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 254 522 Q 280 496 306 522 Q 280 548 254 522 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <circle cx="280" cy="522" r="7" fill="none" stroke="#207448" stroke-width="4" />
    
    <text x="280" y="580" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="280" dy="0">Telemetry and</tspan>
      <tspan x="280" dy="36">observability</tspan>
    </text>
    
    <text x="280" y="662" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">metrics, logs,</tspan>
      <tspan x="280" dy="36">flows, traces</tspan>
    </text>
  </g>

</svg>