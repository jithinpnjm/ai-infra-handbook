<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Policer versus shaper</title>
  <desc>Visual comparison showing a policer dropping excess burst traffic versus a shaper buffering and delaying excess traffic to smooth the output curve.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Policer versus shaper</text>

  
  <rect x="40" y="125" width="720" height="760" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(70, 150)">
    <path d="M 28 6 L 50 16 C 50 38 40 52 28 58 C 16 52 6 38 6 16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="145" y="192" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Policer (the bouncer)</text>

  
  <g transform="translate(70, 230)">
    <rect width="660" height="280" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>

    
    <line x1="40" y1="140" x2="620" y2="140" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>

    
    <line x1="40" y1="240" x2="620" y2="240" stroke="#303a36" stroke-width="2"/>

    
    <path d="M 40 240 L 100 240 Q 140 240 170 190 T 240 140 L 420 140 Q 450 140 480 190 T 550 240 L 620 240 Z" fill="#207448" fill-opacity="0.15"/>
    <path d="M 40 240 L 100 240 Q 140 240 170 190 T 240 140 L 420 140 Q 450 140 480 190 T 550 240 L 620 240" fill="none" stroke="#207448" stroke-width="4"/>

    
    <path d="M 240 140 Q 280 80 330 40 Q 380 80 420 140 Z" fill="#db8129" fill-opacity="0.25" stroke="#db8129" stroke-width="4" stroke-dasharray="6 4"/>
  </g>

  
  <rect x="70" y="535" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="600" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="100" dy="0">traffic above the committed rate</tspan>
    <tspan x="100" dy="42">is dropped or remarked</tspan>
  </text>

  
  <rect x="70" y="715" width="660" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="100" y="780" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="100" dy="0">token bucket measures CIR</tspan>
    <tspan x="100" dy="42">and burst size</tspan>
  </text>

  
  <rect x="840" y="125" width="720" height="760" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(870, 150)">
    <circle cx="28" cy="30" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="28,16 28,30 40,38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="945" y="192" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Shaper (the queue marshal)</text>

  
  <g transform="translate(870, 230)">
    <rect width="660" height="280" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>

    
    <line x1="40" y1="140" x2="620" y2="140" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>

    
    <line x1="40" y1="240" x2="620" y2="240" stroke="#303a36" stroke-width="2"/>

    
    <path d="M 240 140 Q 280 80 330 40 Q 380 80 420 140" fill="none" stroke="#c2d6c7" stroke-width="3" stroke-dasharray="5 5"/>

    
    <path d="M 40 240 L 100 240 Q 140 240 170 190 T 240 140 L 530 140 Q 560 140 580 190 T 610 240 L 620 240 Z" fill="#207448" fill-opacity="0.15"/>
    <path d="M 40 240 L 100 240 Q 140 240 170 190 T 240 140 L 530 140 Q 560 140 580 190 T 610 240 L 620 240" fill="none" stroke="#207448" stroke-width="4"/>
  </g>

  
  <rect x="870" y="535" width="660" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="900" y="600" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="900" dy="0">excess is buffered and released</tspan>
    <tspan x="900" dy="42">at the configured rate</tspan>
  </text>

  
  <rect x="870" y="715" width="660" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="900" y="780" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="900" dy="0">smooths bursts but adds delay</tspan>
    <tspan x="900" dy="42">and needs buffer space</tspan>
  </text>

  
  <rect x="40" y="915" width="1520" height="110" rx="14" fill="#207448"/>
  <text x="800" y="958" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
    <tspan x="800" dy="0">The burst size, the bucket depth, matters as much as the rate:</tspan>
    <tspan x="800" dy="36">a deep bucket lets a short burst through, a shallow one clips it</tspan>
  </text>
</svg>