<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Structure of an IPv6 address</title>
  <desc>Infographic explaining the structure of an IPv6 address including site prefix, subnet ID, interface ID, and subnet hierarchy.</desc>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Structure of an IPv6 address</text>

  
  <text x="440" y="160" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">first 64 bits = the /64 subnet prefix</text>
  <path d="M 85 208 Q 85 188 105 188 L 428 188 Q 440 188 440 172 Q 440 188 452 188 L 775 188 Q 795 188 795 208" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <g id="address-bar">
    
    <rect x="80" y="218" width="1440" height="94" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <line x1="580" y1="218" x2="580" y2="312" stroke="#207448" stroke-width="3"/>
    <line x1="800" y1="218" x2="800" y2="312" stroke="#207448" stroke-width="3"/>

    
    <text x="330" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">site prefix 48 bits</text>

    
    <text x="690" y="254" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="690" dy="0">subnet ID</tspan>
      <tspan x="690" dy="32">16 bits</tspan>
    </text>

    
    <text x="1160" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">interface ID 64 bits</text>
  </g>

  
  <g id="example-segments">
    
    <rect x="80" y="332" width="500" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="330" y="380" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">2001:0db8:0a0b</text>

    
    <rect x="580" y="332" width="220" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="690" y="380" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">12f0</text>

    
    <rect x="800" y="332" width="720" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1160" y="380" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">0000:0000:0000:8b6e</text>
  </g>

  
  <g id="nested-boxes">
    
    <rect x="80" y="458" width="960" height="440" rx="18" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <path d="M 120 522 H 168 A 16 16 0 0 0 168 490 A 20 20 0 0 0 134 482 A 16 16 0 0 0 118 502 A 12 12 0 0 0 120 522 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="194" y="513" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">ISP/cloud /32</text>

    
    <rect x="115" y="548" width="890" height="320" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <g transform="translate(145, 574)">
      <rect x="0" y="0" width="44" height="48" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="11" y1="12" x2="17" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="27" y1="12" x2="33" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="11" y1="24" x2="17" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="27" y1="24" x2="33" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <rect x="16" y="34" width="12" height="14" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="210" y="610" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">site /48</text>

    
    <rect x="145" y="646" width="830" height="192" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(180, 715)">
      <circle cx="16" cy="27" r="12" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="56" cy="11" r="9" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="56" cy="43" r="9" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="26" y1="21" x2="48" y2="14" stroke="#207448" stroke-width="3.5"/>
      <line x1="26" y1="33" x2="48" y2="40" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="268" y="753" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">65,536 /64 subnets</text>
  </g>

  
  <g id="orange-note">
    <rect x="1080" y="458" width="440" height="440" rx="18" fill="#fffbf5" stroke="#db8129" stroke-width="3.5"/>

    
    <g transform="translate(1300, 560)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#db8129" stroke-width="4"/>
      <line x1="0" y1="-15" x2="0" y2="5" stroke="#db8129" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="16" r="3" fill="#db8129"/>
    </g>

    
    <text x="1300" y="662" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      <tspan x="1300" dy="0">Almost every</tspan>
      <tspan x="1300" dy="42">subnet is a /64</tspan>
    </text>
  </g>
</svg>