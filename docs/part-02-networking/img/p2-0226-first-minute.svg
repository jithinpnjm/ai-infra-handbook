<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1070" width="1600" height="1070">
  <title>The first minute of a training node carries a dozen protocols in a fixed order</title>
  <desc>Horizontal timeline of training node network protocols from DNS and DHCP to RoCEv2 data flow</desc>

  <defs>
    <marker id="arrow-axis" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1070" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The first minute of a training node</tspan>
    <tspan x="800" dy="58">carries a dozen protocols in a fixed order</tspan>
  </text>

  
  <text x="800" y="172" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">first minute of a training node</text>

  
  <line x1="80" y1="208" x2="1520" y2="208" stroke="#207448" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-axis)" />

  
  
  <circle cx="158" cy="208" r="24" fill="#207448" />
  <text x="158" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

  
  <circle cx="415" cy="208" r="24" fill="#207448" />
  <text x="415" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

  
  <circle cx="672" cy="208" r="24" fill="#207448" />
  <text x="672" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

  
  <circle cx="929" cy="208" r="24" fill="#207448" />
  <text x="929" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>

  
  <circle cx="1186" cy="208" r="24" fill="#207448" />
  <text x="1186" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>

  
  <circle cx="1443" cy="208" r="24" fill="#207448" stroke="#db8129" stroke-width="4" />
  <text x="1443" y="209" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>

  
  <rect x="51" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(130, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <ellipse cx="28" cy="28" rx="11" ry="24" />
    <line x1="4" y1="28" x2="52" y2="28" />
  </g>
  
  <text x="158" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DNS:</text>
  <text x="158" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="158" dy="0">udp port 53,</tspan>
    <tspan x="158" dy="32">resolves the</tspan>
    <tspan x="158" dy="32">registry</tspan>
    <tspan x="158" dy="32">name</tspan>
  </text>

  
  <rect x="308" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(387, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="40" r="6" fill="#207448" />
    <path d="M 16 28 A 18 18 0 0 1 40 28" />
    <path d="M 9 19 A 28 28 0 0 1 47 19" />
    <path d="M 2 10 A 38 38 0 0 1 54 10" />
  </g>
  
  <text x="415" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DHCP:</text>
  <text x="415" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="415" dy="0">udp ports</tspan>
    <tspan x="415" dy="32">67 and 68,</tspan>
    <tspan x="415" dy="32">DORA</tspan>
    <tspan x="415" dy="32">sequence</tspan>
  </text>

  
  <rect x="565" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(644, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="36" rx="4" />
    <line x1="16" y1="22" x2="40" y2="22" />
    <polyline points="32 16 40 22 32 28" />
    <line x1="40" y1="34" x2="16" y2="34" />
    <polyline points="24 28 16 34 24 40" />
  </g>
  
  <text x="672" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ARP:</text>
  <text x="672" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="672" dy="0">who-has the</tspan>
    <tspan x="672" dy="32">gateway,</tspan>
    <tspan x="672" dy="32">is-at reply</tspan>
  </text>

  
  <rect x="822" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(901, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="22" width="36" height="28" rx="5" />
    <path d="M 17 22 V 15 A 11 11 0 0 1 39 15 V 22" />
    <circle cx="28" cy="34" r="3" fill="#207448" />
    <line x1="28" y1="37" x2="28" y2="42" />
  </g>
  
  <text x="929" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TLS:</text>
  <text x="929" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="929" dy="0">ClientHello</tspan>
    <tspan x="929" dy="32">with SNI</tspan>
    <tspan x="929" dy="32">and ALPN,</tspan>
    <tspan x="929" dy="32">to the</tspan>
    <tspan x="929" dy="32">registry</tspan>
  </text>

  
  <rect x="1079" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1158, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="8" />
    <circle cx="42" cy="14" r="8" />
    <circle cx="14" cy="42" r="8" />
    <circle cx="42" cy="42" r="8" />
    <line x1="22" y1="14" x2="34" y2="14" />
    <line x1="22" y1="42" x2="34" y2="42" />
    <line x1="14" y1="22" x2="14" y2="34" />
    <line x1="42" y1="22" x2="42" y2="34" />
    <line x1="20" y1="20" x2="36" y2="36" />
  </g>
  
  <text x="1186" y="360" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1186" dy="0">NCCL</tspan>
    <tspan x="1186" dy="34">bootstrap:</tspan>
  </text>
  <text x="1186" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1186" dy="0">TCP between</tspan>
    <tspan x="1186" dy="32">ranks</tspan>
  </text>

  
  <rect x="1336" y="255" width="214" height="390" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(1415, 275)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="36" rx="4" />
    <path d="M 30 14 L 20 28 L 32 28 L 24 42" stroke="#db8129" stroke-width="4" fill="none" />
  </g>
  
  <text x="1443" y="360" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1443" dy="0">RoCEv2</tspan>
    <tspan x="1443" dy="34">data:</tspan>
  </text>
  <text x="1443" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1443" dy="0">udp port</tspan>
    <tspan x="1443" dy="28">4791,</tspan>
    <tspan x="1443" dy="28">bypasses</tspan>
    <tspan x="1443" dy="28">the kernel,</tspan>
    <tspan x="1443" dy="28">needs a NIC</tspan>
    <tspan x="1443" dy="28">or switch</tspan>
    <tspan x="1443" dy="28">capture</tspan>
  </text>

  
  
  <rect x="60" y="675" width="196" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="158" y="709" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">udp port 53</text>

  
  <rect x="296" y="675" width="298" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="445" y="709" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">udp port 67 or 68</text>

  
  <rect x="644" y="675" width="96" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="692" y="709" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">arp</text>

  
  <rect x="1008" y="675" width="96" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1056" y="709" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">tcp</text>

  
  <rect x="1264" y="675" width="286" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1407" y="709" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">udp dst port 4791</text>

  
  <rect x="1290" y="755" width="260" height="162" rx="10" fill="#eef2ef" stroke="#98a49c" stroke-width="2" />
  <text x="1420" y="792" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4d5952">
    <tspan x="1420" dy="0">tcpdump on</tspan>
    <tspan x="1420" dy="28">the host</tspan>
    <tspan x="1420" dy="28">does not</tspan>
    <tspan x="1420" dy="28">see RoCE</tspan>
    <tspan x="1420" dy="28">traffic.</tspan>
  </text>

  
  <rect x="50" y="955" width="1500" height="70" rx="10" fill="#207448" />
  <text x="800" y="999" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Know the protocol and its first check before you read the packet.</text>
</svg>