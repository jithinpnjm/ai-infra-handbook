<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Ways to connect networks on GCP</title>
  <desc>Visual diagram illustrating six network connectivity options radiating from a central VPC on Google Cloud Platform, including VPC Network Peering, Shared VPC, Cloud VPN / HA VPN, Cloud Interconnect, Cross-Cloud Interconnect, and Network Connectivity Center.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 1 2 L 15 8 L 1 14 L 4.5 8 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 1 2 L 15 8 L 1 14 L 4.5 8 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ways to connect networks on GCP</text>

  
  
  <path d="M 730 380 V 240 Q 730 225 715 225 H 590" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 670 495 H 590" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 730 610 V 750 Q 730 765 715 765 H 590" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 870 380 V 240 Q 870 225 885 225 H 1010" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 930 495 H 1010" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <path d="M 870 610 V 750 Q 870 765 885 765 H 1010" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>

  
  <g id="node-central-vpc">
    <rect x="670" y="380" width="260" height="230" rx="16" fill="#207448" stroke="#207448" stroke-width="2"/>
    
    <path d="M 780 436 C 772 436 766 430 766 422 C 766 415 771 409 778 408 C 780 399 788 392 798 392 C 808 392 816 399 818 408 C 825 409 830 415 830 422 C 830 430 824 436 816 436 Z" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <circle cx="784" cy="452" r="4.5" fill="#ffffff"/>
    <circle cx="800" cy="452" r="4.5" fill="#ffffff"/>
    <circle cx="816" cy="452" r="4.5" fill="#ffffff"/>
    <line x1="784" y1="436" x2="784" y2="452" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="800" y1="436" x2="800" y2="452" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="816" y1="436" x2="816" y2="452" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="784" y1="452" x2="816" y2="452" stroke="#ffffff" stroke-width="2.5"/>
    <text x="800" y="520" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Central VPC</text>
  </g>

  
  <g id="node-vpc-peering">
    <rect x="40" y="110" width="550" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="72" y="142" width="20" height="20" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <rect x="110" y="142" width="20" height="20" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M 94 148 L 108 148 M 104 144 L 108 148 L 104 152" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 156 L 94 156 M 98 152 L 94 156 L 98 160" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 82 164 V 174 M 120 164 V 174 M 76 174 H 126" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="144" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">VPC Network Peering</text>
    <text x="72" y="240" font-family="sans-serif" font-size="24" fill="#303a36">private, non-transitive,</text>
    <text x="72" y="274" font-family="sans-serif" font-size="24" fill="#303a36">no overlapping ranges</text>
  </g>

  
  <g id="node-shared-vpc">
    <rect x="40" y="380" width="550" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="91" y="412" width="22" height="18" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <rect x="73" y="446" width="18" height="15" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
    <rect x="113" y="446" width="18" height="15" rx="3" stroke="#207448" stroke-width="2.5" fill="none"/>
    <path d="M 102 430 V 438 M 82 446 V 438 H 122 V 446" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="144" y="442" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shared VPC</text>
    <text x="72" y="510" font-family="sans-serif" font-size="24" fill="#303a36">host project shares subnets</text>
    <text x="72" y="544" font-family="sans-serif" font-size="24" fill="#303a36">with service projects</text>
  </g>

  
  <g id="node-cloud-vpn">
    <rect x="40" y="650" width="550" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="88" y="694" width="28" height="22" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M 94 694 V 688 C 94 682 98 678 102 678 C 106 678 110 682 110 688 V 694" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="102" cy="705" r="2.5" fill="#207448"/>
    <path d="M 72 705 H 84 M 120 705 H 132" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="144" y="712" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud VPN / HA VPN</text>
    <text x="72" y="776" font-family="sans-serif" font-size="24" fill="#303a36">IPsec over the Internet,</text>
    <text x="72" y="808" font-family="sans-serif" font-size="24" fill="#303a36">99.99% SLA with proper topology,</text>
    <text x="72" y="840" font-family="sans-serif" font-size="24" fill="#303a36">BGP via Cloud Router</text>
  </g>

  
  <g id="node-cloud-interconnect">
    <rect x="1010" y="110" width="550" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="1046" y="146" width="38" height="26" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M 1054 155 H 1076 M 1054 163 H 1076" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1084 159 H 1098 M 1032 159 H 1046" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1065" cy="159" r="8" stroke="#207448" stroke-width="2" fill="none"/>
    
    <text x="1114" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud Interconnect</text>
    <text x="1042" y="240" font-family="sans-serif" font-size="24" fill="#303a36">Dedicated 10/100 Gb/s or</text>
    <text x="1042" y="272" font-family="sans-serif" font-size="24" fill="#303a36">Partner 50 Mb/s to 50 Gb/s,</text>
    <text x="1042" y="304" font-family="sans-serif" font-size="24" fill="#303a36">VLAN attachments</text>
  </g>

  
  <g id="node-cross-cloud">
    <rect x="1010" y="380" width="550" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 1054 424 C 1048 424 1044 420 1044 414 C 1044 409 1048 404 1053 404 C 1055 397 1061 392 1069 392 C 1077 392 1083 397 1085 404 C 1090 404 1094 409 1094 414 C 1094 420 1090 424 1084 424 Z" stroke="#207448" stroke-width="2.5" fill="none"/>
    <path d="M 1050 448 C 1046 448 1042 445 1042 441 C 1042 437 1045 433 1049 433 C 1051 428 1055 424 1061 424 C 1067 424 1071 428 1073 433 C 1077 433 1080 437 1080 441 C 1080 445 1077 448 1072 448 Z" stroke="#207448" stroke-width="2" fill="none"/>
    <line x1="1062" y1="424" x2="1062" y2="430" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="1114" y="442" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cross-Cloud Interconnect</text>
    <text x="1042" y="525" font-family="sans-serif" font-size="24" fill="#303a36">link to AWS, Azure, OCI</text>
  </g>

  
  <g id="node-ncc">
    <rect x="1010" y="650" width="550" height="230" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="1066" cy="704" r="8" stroke="#db8129" stroke-width="3" fill="none"/>
    <circle cx="1044" cy="690" r="4" stroke="#db8129" stroke-width="2.5" fill="none"/>
    <circle cx="1088" cy="690" r="4" stroke="#db8129" stroke-width="2.5" fill="none"/>
    <circle cx="1050" cy="722" r="4" stroke="#db8129" stroke-width="2.5" fill="none"/>
    <circle cx="1082" cy="722" r="4" stroke="#db8129" stroke-width="2.5" fill="none"/>
    <circle cx="1066" cy="682" r="4" stroke="#db8129" stroke-width="2.5" fill="none"/>
    <line x1="1066" y1="696" x2="1066" y2="686" stroke="#db8129" stroke-width="2"/>
    <line x1="1060" y1="699" x2="1048" y2="692" stroke="#db8129" stroke-width="2"/>
    <line x1="1072" y1="699" x2="1084" y2="692" stroke="#db8129" stroke-width="2"/>
    <line x1="1061" y1="709" x2="1053" y2="719" stroke="#db8129" stroke-width="2"/>
    <line x1="1071" y1="709" x2="1079" y2="719" stroke="#db8129" stroke-width="2"/>
    
    <text x="1114" y="698" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Network Connectivity</text>
    <text x="1114" y="734" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Center</text>
    <text x="1042" y="796" font-family="sans-serif" font-size="24" fill="#303a36">hub-and-spoke,</text>
    <text x="1042" y="828" font-family="sans-serif" font-size="24" fill="#303a36">transitive connectivity</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="920" width="1520" height="90" rx="14" fill="#207448"/>
    <text x="800" y="974" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Peering adds no gateways but does not carry traffic through a middle network; NCC solves that</text>
  </g>
</svg>