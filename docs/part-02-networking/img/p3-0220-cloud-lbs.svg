<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Cloud load balancers by layer, and the differences that matter</title>
  <desc>Comparison of GCP, AWS, and Azure load balancers across L7, L4, and other layers, key operational differences, and idle timeout implications.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Cloud load balancers by layer, and the differences that matter</text>

  
  
  <rect x="210" y="110" width="440" height="45" rx="6" fill="#e8f1ea" />
  <text x="430" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">L7</text>

  <rect x="660" y="110" width="440" height="45" rx="6" fill="#e8f1ea" />
  <text x="880" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">L4</text>

  <rect x="1110" y="110" width="450" height="45" rx="6" fill="#e8f1ea" />
  <text x="1335" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Other</text>

  
  
  <rect x="40" y="165" width="160" height="135" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(92, 180)">
    <path d="M 8 32 A 12 12 0 0 1 12 14 A 18 18 0 0 1 38 10 A 14 14 0 0 1 48 24 L 48 32 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="120" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">GCP</text>

  
  <rect x="210" y="165" width="440" height="135" rx="8" fill="#e8f1ea" />
  <text x="230" y="198" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="230" dy="0">external and internal Application LBs,</tspan>
    <tspan x="230" dy="28">L7 HTTP(S), global or regional,</tspan>
    <tspan x="230" dy="28">built on Envoy and GFE</tspan>
  </text>

  
  <rect x="660" y="165" width="440" height="135" rx="8" fill="#e8f1ea" />
  <text x="680" y="212" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="680" dy="0">Network LBs, L4 pass-through</tspan>
    <tspan x="680" dy="30">or proxy, and internal TCP/UDP LBs</tspan>
  </text>

  
  <rect x="1110" y="165" width="450" height="135" rx="8" fill="#e8f1ea" />

  
  
  <rect x="40" y="310" width="160" height="100" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(92, 320)">
    <path d="M 8 26 A 10 10 0 0 1 12 12 A 16 16 0 0 1 36 8 A 12 12 0 0 1 44 20 L 44 26 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="120" y="388" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">AWS</text>

  
  <rect x="210" y="310" width="440" height="100" rx="8" fill="#e8f1ea" />
  <text x="230" y="368" font-family="sans-serif" font-size="24" fill="#303a36">ALB</text>

  
  <rect x="660" y="310" width="440" height="100" rx="8" fill="#e8f1ea" />
  <text x="680" y="368" font-family="sans-serif" font-size="24" fill="#303a36">NLB</text>

  
  <rect x="1110" y="310" width="450" height="100" rx="8" fill="#e8f1ea" />
  <text x="1130" y="352" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1130" dy="0">GLB (L3 gateway for appliances),</tspan>
    <tspan x="1130" dy="30">CLB (legacy)</tspan>
  </text>

  
  
  <rect x="40" y="420" width="160" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(92, 426)">
    <path d="M 8 22 A 8 8 0 0 1 12 10 A 14 14 0 0 1 34 6 A 10 10 0 0 1 42 16 L 42 22 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="120" y="482" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Azure</text>

  
  <rect x="210" y="420" width="440" height="85" rx="8" fill="#e8f1ea" />
  <text x="230" y="455" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="230" dy="0">Application Gateway and Front Door</tspan>
  </text>

  
  <rect x="660" y="420" width="440" height="85" rx="8" fill="#e8f1ea" />
  <text x="680" y="470" font-family="sans-serif" font-size="24" fill="#303a36">Load Balancer</text>

  
  <rect x="1110" y="420" width="450" height="85" rx="8" fill="#e8f1ea" />

  
  <rect x="40" y="520" width="1520" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(60, 532)">
    <line x1="6" y1="12" x2="46" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="18" cy="12" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="24" x2="46" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="34" cy="24" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="36" x2="46" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="22" cy="36" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  </g>
  <text x="125" y="565" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Differences that matter</text>

  
  
  <circle cx="75" cy="605" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="71,605 74,608 80,601" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="96" y="613" font-family="sans-serif" font-size="24" fill="#303a36">source IP preservation</text>

  
  <rect x="62" y="632" width="718" height="66" rx="6" fill="#fff5ea" stroke="#db8129" stroke-width="2" />
  <rect x="70" y="643" width="18" height="18" rx="4" fill="#db8129" />
  <polyline points="74,652 77,656 84,648" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="96" y="658" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="96" dy="0">idle timeouts (often 60 s for HTTP LBs,</tspan>
    <tspan x="96" dy="28">350 s on some L4 services)</tspan>
  </text>

  
  <circle cx="75" cy="723" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="71,723 74,726 80,719" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="96" y="723" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="96" dy="0">supported protocols such as gRPC, WebSockets</tspan>
    <tspan x="96" dy="28">and HTTP/2 end to end</tspan>
  </text>

  
  <circle cx="75" cy="772" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="71,772 74,775 80,768" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="96" y="780" font-family="sans-serif" font-size="24" fill="#303a36">connection draining</text>

  
  
  <circle cx="820" cy="605" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="816,605 819,608 825,601" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="842" y="613" font-family="sans-serif" font-size="24" fill="#303a36">health check semantics</text>

  
  <circle cx="820" cy="655" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="816,655 819,658 825,651" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="842" y="663" font-family="sans-serif" font-size="24" fill="#303a36">quotas</text>

  
  <circle cx="820" cy="710" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="816,710 819,713 825,706" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="842" y="718" font-family="sans-serif" font-size="24" fill="#303a36">cross-zone behaviour</text>

  
  <circle cx="820" cy="762" r="9" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="816,762 819,765 825,758" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="842" y="770" font-family="sans-serif" font-size="24" fill="#303a36">cost per GB</text>

  
  <rect x="40" y="805" width="1520" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(60, 827)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="135" y="848" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">a team chose a cloud LB because its defaults suit a website; an LLM generation quiet for</tspan>
    <tspan x="135" dy="32">longer than the idle timeout gets cut and the client sees a reset</tspan>
  </text>

  
  <rect x="40" y="920" width="1520" height="155" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(60, 968)">
    <rect x="6" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="36" x2="50" y2="36" stroke="#207448" stroke-width="3" />
    <circle cx="14" cy="13" r="2.5" fill="#207448" />
    <circle cx="22" cy="13" r="2.5" fill="#207448" />
    <circle cx="14" cy="28" r="2.5" fill="#207448" />
    <circle cx="22" cy="28" r="2.5" fill="#207448" />
    <circle cx="14" cy="44" r="2.5" fill="#207448" />
    <circle cx="22" cy="44" r="2.5" fill="#207448" />
  </g>
  <text x="135" y="962" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">appliance or software ADCs such as VMware Avi, F5 or Citrix scale out service engines behind</tspan>
    <tspan x="135" dy="32">BGP or ECMP VIPs, understand HTTP/2 and gRPC at L7 and support custom health monitors;</tspan>
    <tspan x="135" dy="32">validate product-specific claims against vendor documentation and a load test</tspan>
  </text>

  
  <rect x="40" y="1095" width="1520" height="75" rx="10" fill="#207448" />
  <g transform="translate(60, 1105)">
    <circle cx="28" cy="28" r="18" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <polyline points="21,28 26,33 35,23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="135" y="1142" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Read the idle timeout first, because that single default decides whether your streams survive</text>
</svg>