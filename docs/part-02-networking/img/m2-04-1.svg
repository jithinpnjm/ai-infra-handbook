<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" width="1600" height="990">
  <title>VLSM, supernetting and summarisation</title>
  <desc>Visual breakdown of Variable Length Subnet Masking (VLSM), supernetting, and subnet summarisation from parent block 10.50.0.0/22 to subnets A, B, C, D, and point-to-point links.</desc>

  <defs>
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#303a36" flood-opacity="0.07" />
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="990" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">VLSM, supernetting and summarisation</text>

  
  
  <path d="M 500 240 V 280 H 415 V 320" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1100 240 V 280 H 1185 V 320" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 950 450 V 490 H 415 V 530" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1185 450 V 530" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 950 660 V 700 H 415 V 740" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1185 660 V 740" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <g transform="translate(380, 110)">
    <rect width="840" height="130" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 37)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="12" width="32" height="32" rx="8" />
      <circle cx="28" cy="28" r="5" />
      <line x1="28" y1="2" x2="28" y2="12" />
      <line x1="28" y1="44" x2="28" y2="54" />
      <line x1="2" y1="28" x2="12" y2="28" />
      <line x1="44" y1="28" x2="54" y2="28" />
      <circle cx="28" cy="2" r="2" fill="#db8129" />
      <circle cx="28" cy="54" r="2" fill="#db8129" />
      <circle cx="2" cy="28" r="2" fill="#db8129" />
      <circle cx="54" cy="28" r="2" fill="#db8129" />
    </g>
    <text x="120" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Parent block: 10.50.0.0/22</text>
    <text x="120" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#303a36">(1,024 IPs: 10.50.0.0 - 10.50.3.255)</text>
  </g>

  
  <g transform="translate(70, 320)">
