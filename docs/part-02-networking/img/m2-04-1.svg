      <rect x="4" y="14" width="48" height="28" rx="6" />
      <line x1="14" y1="28" x2="14" y2="34" />
      <line x1="23" y1="28" x2="23" y2="34" />
      <line x1="33" y1="28" x2="33" y2="34" />
      <line x1="42" y1="28" x2="42" y2="34" />
      <circle cx="14" cy="21" r="1.5" fill="#207448" />
      <circle cx="23" cy="21" r="1.5" fill="#207448" />
      <circle cx="33" cy="21" r="1.5" fill="#207448" />
      <circle cx="42" cy="21" r="1.5" fill="#207448" />
    </g>
    <text x="120" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Subnet A (400 hosts)</text>
    <text x="120" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#303a36">10.50.0.0/23 (512 IPs)</text>
  </g>

  
  <g transform="translate(840, 320)">
    <rect width="690" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 37)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="28" y1="8" x2="28" y2="48" stroke-dasharray="4 4" />
      <path d="M 16 28 h 24" />
      <path d="M 34 22 l 6 6 l -6 6" />
    </g>
    <text x="120" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Remainder: 10.50.2.0/23</text>
  </g>

  
  <g transform="translate(70, 530)">
    <rect width="690" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 37)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="16" rx="4" />
      <rect x="6" y="32" width="44" height="16" rx="4" />
      <circle cx="14" cy="16" r="2" fill="#207448" />
      <circle cx="22" cy="16" r="2" fill="#207448" />
      <line x1="32" y1="16" x2="42" y2="16" />
      <circle cx="14" cy="40" r="2" fill="#207448" />
      <circle cx="22" cy="40" r="2" fill="#207448" />
      <line x1="32" y1="40" x2="42" y2="40" />
    </g>
    <text x="120" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Subnet B (200 hosts)</text>
    <text x="120" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#303a36">10.50.2.0/24 (256 IPs)</text>
  </g>

  
  <g transform="translate(840, 530)">
    <rect width="690" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 37)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="28" y1="8" x2="28" y2="48" stroke-dasharray="4 4" />
      <path d="M 16 28 h 24" />
      <path d="M 34 22 l 6 6 l -6 6" />
    </g>
    <text x="120" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Remainder: 10.50.3.0/24</text>
  </g>

  
  <g transform="translate(70, 740)">
    <rect width="690" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 57)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="30" rx="5" />
      <line x1="28" y1="38" x2="28" y2="48" />
      <line x1="18" y1="48" x2="38" y2="48" />
      <line x1="16" y1="22" x2="40" y2="22" stroke-dasharray="3 3" />
    </g>
    <text x="120" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Subnet C (100 hosts)</text>
    <text x="120" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#303a36">10.50.3.0/25 (128 IPs)</text>
  </g>

  
  <g transform="translate(840, 740)">
    <rect width="690" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(35, 57)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="12" cy="28" r="8" />
      <circle cx="44" cy="28" r="8" />
      <path d="M 20 28 h 16" />
      <path d="M 23 20 l 5 -6 l 5 6" />
      <path d="M 23 36 l 5 6 l 5 -6" />
    </g>
    <text x="120" y="52" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="120" dy="0" font-size="28" font-weight="bold">Subnet D (50 hosts) -&gt;</tspan>
      <tspan x="120" dy="36" font-size="28" font-weight="bold">10.50.3.128/26 (64 IPs)</tspan>
      <tspan x="120" dy="42" font-size="25" font-weight="500">+ P2P /31s: 10.50.3.192/31, 10.50.3.194/31</tspan>
    </text>
