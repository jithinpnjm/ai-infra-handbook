<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>VLSM, supernetting and summarisation</title>
  <desc>Hierarchical decomposition of parent block 10.50.0.0/22 into subnets A, B, C, D and point-to-point links using VLSM.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">VLSM, supernetting and summarisation</text>

  
  
  <path d="M 600 220 L 600 250 L 410 250 L 410 280" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1000 220 L 1000 250 L 1190 250 L 1190 280" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 980 410 L 980 450 L 410 450 L 410 490" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1190 410 L 1190 490" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 980 620 L 980 660 L 410 660 L 410 700" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <path d="M 1190 620 L 1190 700" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />

  
  <g id="node-P">
    <rect x="440" y="95" width="720" height="125" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(470, 130)">
      <rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#db8129" stroke-width="4" />
      <circle cx="28" cy="28" r="7" fill="#db8129" />
      <line x1="28" y1="2" x2="28" y2="21" stroke="#db8129" stroke-width="3.5" />
      <line x1="28" y1="35" x2="28" y2="54" stroke="#db8129" stroke-width="3.5" />
      <line x1="2" y1="28" x2="21" y2="28" stroke="#db8129" stroke-width="3.5" />
      <line x1="35" y1="28" x2="54" y2="28" stroke="#db8129" stroke-width="3.5" />
    </g>
    <text x="550" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Parent block: 10.50.0.0/22</text>
    <text x="550" y="185" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(1,024 IPs: 10.50.0.0 - 10.50.3.255)</text>
  </g>

  
  <g id="node-A">
    <rect x="60" y="280" width="700" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(92, 317)">
      <rect x="2" y="4" width="52" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="10.5" r="2.5" fill="#207448" />
      <rect x="2" y="21" width="52" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="27.5" r="2.5" fill="#207448" />
      <rect x="2" y="38" width="52" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="44.5" r="2.5" fill="#207448" />
    </g>
    <text x="175" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Subnet A (400 hosts)</text>
    <text x="175" y="378" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">10.50.0.0/23 (512 IPs)</text>
  </g>

  
  <g id="node-R1">
    <rect x="840" y="280" width="700" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(872, 317)">
      <rect x="2" y="4" width="52" height="48" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="28" y1="4" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
      <circle cx="15" cy="28" r="3.5" fill="#207448" />
      <circle cx="41" cy="28" r="3.5" fill="#207448" />
    </g>
    <text x="955" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Remainder: 10.50.2.0/23</text>
  </g>

  
  <g id="node-B">
    <rect x="60" y="490" width="700" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(92, 527)">
      <rect x="2" y="8" width="52" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="16" r="2.5" fill="#207448" />
      <rect x="2" y="32" width="52" height="16" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="40" r="2.5" fill="#207448" />
    </g>
    <text x="175" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Subnet B (200 hosts)</text>
    <text x="175" y="588" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">10.50.2.0/24 (256 IPs)</text>
  </g>

  
  <g id="node-R2">
    <rect x="840" y="490" width="700" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(872, 527)">
      <rect x="2" y="4" width="52" height="48" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="28" y1="4" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
      <line x1="2" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
      <circle cx="41" cy="40" r="4" fill="#207448" />
    </g>
    <text x="955" y="563" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Remainder: 10.50.3.0/24</text>
  </g>

  
  <g id="node-C">
    <rect x="60" y="700" width="700" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(92, 737)">
      <rect x="2" y="10" width="52" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="44" cy="23" r="2.5" fill="#207448" />
      <line x1="12" y1="23" x2="32" y2="23" stroke="#207448" stroke-width="3" />
      <rect x="18" y="36" width="20" height="10" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="8" y1="46" x2="48" y2="46" stroke="#207448" stroke-width="3" />
    </g>
    <text x="175" y="768" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Subnet C (100 hosts)</text>
    <text x="175" y="818" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">10.50.3.0/25 (128 IPs)</text>
  </g>

  
  <g id="node-D">
    <rect x="840" y="700" width="700" height="220" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(872, 737)">
      <circle cx="16" cy="28" r="13" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="10" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="2.5" />
      <circle cx="40" cy="28" r="13" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="34" y1="28" x2="46" y2="28" stroke="#207448" stroke-width="2.5" />
      <line x1="2" y1="8" x2="54" y2="8" stroke="#207448" stroke-width="2" stroke-dasharray="3 2" />
      <line x1="2" y1="48" x2="54" y2="48" stroke="#207448" stroke-width="2" stroke-dasharray="3 2" />
    </g>
    <text x="955" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="955" dy="0">Subnet D (50 hosts) -&gt;</tspan>
      <tspan x="955" dy="36">10.50.3.128/26 (64 IPs)</tspan>
    </text>
    <text x="872" y="865" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">+ P2P /31s: 10.50.3.192/31, 10.50.3.194/31</text>
  </g>
</svg>