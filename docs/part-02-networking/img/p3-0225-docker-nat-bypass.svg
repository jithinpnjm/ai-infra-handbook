<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Why a published Docker port ignores your firewall rule</title>
  <desc>Visual explanation of how Docker inserts NAT and FORWARD rules ahead of ufw or firewalld rules in netfilter chains, bypassing host firewall settings for published container ports.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why a published Docker port</text>
  <text x="40" y="115" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">ignores your firewall rule</text>

  

  
  <rect x="40" y="135" width="380" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="68" cy="163" r="16" fill="#207448" />
  <text x="68" y="171" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">1</text>
  
  <rect x="94" y="148" width="30" height="20" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="104" y1="168" x2="114" y2="168" stroke="#207448" stroke-width="3" />
  <line x1="90" y1="172" x2="128" y2="172" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="140" y="165" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="140" dy="0">Client on the</tspan>
    <tspan x="140" dy="28">office network</tspan>
    <tspan x="140" dy="28">or anywhere</tspan>
  </text>

  
  <path d="M 420 187 L 452 187" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="460" y="135" width="200" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="488" cy="163" r="16" fill="#207448" />
  <text x="488" y="171" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">2</text>
  
  <rect x="512" y="152" width="22" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="518" y1="176" x2="518" y2="182" stroke="#207448" stroke-width="2" />
  <line x1="524" y1="176" x2="524" y2="182" stroke="#207448" stroke-width="2" />
  <line x1="528" y1="176" x2="528" y2="182" stroke="#207448" stroke-width="2" />
  
  <text x="545" y="195" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Host NIC</text>

  
  <path d="M 660 187 L 692 187" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="700" y="135" width="220" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="728" cy="163" r="16" fill="#207448" />
  <text x="728" y="171" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">3</text>
  
  <circle cx="754" cy="164" r="7" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="766" cy="164" r="7" fill="none" stroke="#207448" stroke-width="3" />
  
  <text x="782" y="176" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="782" dy="0">netfilter</tspan>
    <tspan x="782" dy="28">chains</tspan>
  </text>

  
  <path d="M 810 240 L 810 255 L 285 255 L 285 267" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="40" y="275" width="530" height="185" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="70" cy="305" r="16" fill="#207448" />
  <text x="70" y="313" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">4</text>
  
  <rect x="98" y="293" width="24" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="98" y1="301" x2="122" y2="301" stroke="#207448" stroke-width="2" />
  <line x1="98" y1="309" x2="122" y2="309" stroke="#207448" stroke-width="2" />
  <line x1="106" y1="293" x2="106" y2="317" stroke="#207448" stroke-width="2" />
  <line x1="114" y1="293" x2="114" y2="317" stroke="#207448" stroke-width="2" />
  
  <text x="60" y="348" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">Docker's own NAT and FORWARD rules</tspan>
    <tspan x="60" dy="28">(DOCKER chain) are inserted ahead</tspan>
    <tspan x="60" dy="28">of the rules managed by</tspan>
    <tspan x="60" dy="28">ufw or firewalld</tspan>
  </text>

  
  <rect x="590" y="275" width="330" height="185" rx="8" fill="#edf3ef" stroke="#8fa397" stroke-width="2" stroke-dasharray="6,6" />
  
  <path d="M 755 290 L 775 298 L 775 314 C 775 326 755 334 755 334 C 755 334 735 326 735 314 L 735 298 Z" fill="none" stroke="#8fa397" stroke-width="3" />
  <line x1="733" y1="334" x2="777" y2="290" stroke="#8fa397" stroke-width="3" />
  
  <text x="625" y="360" font-family="sans-serif" font-size="24" fill="#66776f">
    <tspan x="625" dy="0">ufw or firewalld</tspan>
    <tspan x="625" dy="28">rule that should</tspan>
    <tspan x="625" dy="28">block the port</tspan>
  </text>

  
  <path d="M 160 460 L 160 520" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  
  <text x="185" y="485" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="185" dy="0">published port 8080</tspan>
    <tspan x="185" dy="28">answers from anywhere</tspan>
  </text>

  
  <rect x="40" y="530" width="410" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="68" cy="565" r="16" fill="#207448" />
  <text x="68" y="573" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">5</text>
  
  <rect x="96" y="551" width="26" height="26" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  
  <text x="135" y="573" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">container port 80</text>

  
  <rect x="40" y="620" width="880" height="180" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="62" y="640" width="24" height="20" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 68 640 L 68 632 C 68 626 80 626 80 632 L 80 640" fill="none" stroke="#207448" stroke-width="3" />
  
  <text x="105" y="650" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="105" dy="0">restrict a port with the DOCKER-USER chain</tspan>
    <tspan x="105" dy="28">bind the port to a specific address</tspan>
    <tspan x="105" dy="24">(for example 127.0.0.1:8080:80)</tspan>
    <tspan x="105" dy="28">if a published port must stay private</tspan>
    <tspan x="105" dy="24">on a shared host, restrict it in</tspan>
    <tspan x="105" dy="24">DOCKER-USER before you publish it</tspan>
  </text>

  
  <rect x="960" y="135" width="600" height="665" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="990" y="175" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Docker network modes</text>

  
  <text x="990" y="212" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="990" dy="0" font-weight="bold">bridge:</tspan>
    <tspan font-weight="normal"> private subnet, veth per</tspan>
    <tspan x="990" dy="25">container, NAT outbound,</tspan>
    <tspan x="990" dy="25">-p publishes via DNAT; user-defined</tspan>
    <tspan x="990" dy="25">bridges add DNS-based name</tspan>
    <tspan x="990" dy="25">resolution and isolation</tspan>

    <tspan x="990" dy="35" font-weight="bold">host:</tspan>
    <tspan font-weight="normal"> shares the host namespace,</tspan>
    <tspan x="990" dy="25">no isolation, no NAT, best</tspan>
    <tspan x="990" dy="25">performance, ports conflict with</tspan>
    <tspan x="990" dy="25">host: NCCL or HPC containers</tspan>

    <tspan x="990" dy="35" font-weight="bold">none:</tspan>
    <tspan font-weight="normal"> only loopback</tspan>

    <tspan x="990" dy="35" font-weight="bold">container:NAME:</tspan>
    <tspan font-weight="normal"> shares another</tspan>
    <tspan x="990" dy="25">container's namespace</tspan>
    <tspan x="990" dy="25">(how a Kubernetes pod works)</tspan>

    <tspan x="990" dy="35" font-weight="bold">overlay:</tspan>
    <tspan font-weight="normal"> VXLAN across Docker</tspan>
    <tspan x="990" dy="25">hosts (Swarm)</tspan>

    <tspan x="990" dy="35" font-weight="bold">macvlan or ipvlan:</tspan>
    <tspan font-weight="normal"> container</tspan>
    <tspan x="990" dy="25">on the physical network</tspan>
  </text>

  
  <rect x="40" y="815" width="1520" height="98" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="60" y="843" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">CNM: sandbox (the namespace config), endpoint (the attachment, typically a veth),</tspan>
    <tspan x="60" dy="28">network (a group of endpoints); local drivers bridge, host, none, macvlan, ipvlan;</tspan>
    <tspan x="60" dy="28">global driver overlay needs a key-value store</tspan>
  </text>

  
  <rect x="40" y="923" width="1520" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="60" y="951" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">default subnet 172.17.0.0/16 may overlap corporate or VPN ranges:</tspan>
    <tspan x="60" dy="28">set default-address-pools in </tspan><tspan font-family="monospace, Courier">/etc/docker/daemon.json</tspan>
  </text>

  
  <rect x="40" y="1005" width="1520" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="60" y="1035" font-family="monospace, Courier" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">docker network ls; docker network inspect bridge;</tspan>
    <tspan x="60" dy="28">iptables -t nat -S DOCKER; bridge fdb show br docker0</tspan>
  </text>

  
  <rect x="40" y="1092" width="1520" height="68" rx="8" fill="#207448" />
  <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Docker inserts its own rules ahead of the firewall's rules</text>
</svg>