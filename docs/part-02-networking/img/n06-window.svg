<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>The sliding window</title>
  <desc>Visual explanation of the TCP sliding window mechanism in three steps.</desc>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="40" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The sliding window</text>

  <g id="legend">
    <rect x="850" y="44" width="710" height="52" rx="8" fill="#e8f1ea" stroke="#c5dcce" stroke-width="1.5"/>
    
    <rect x="868" y="55" width="30" height="30" rx="4" fill="#207448" stroke="#175635" stroke-width="2"/>
    <text x="908" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">acknowledged</text>
    
    <rect x="1092" y="55" width="30" height="30" rx="4" fill="#a3d9b5" stroke="#207448" stroke-width="2"/>
    <text x="1132" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">in flight</text>
    
    <rect x="1265" y="55" width="30" height="30" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text x="1305" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">may send</text>
  </g>

  
  <g id="step1">
    <rect x="40" y="140" width="1520" height="210" rx="12" fill="#e8f1ea" stroke="#c5dcce" stroke-width="1.5"/>

    
    <circle cx="72" cy="180" r="24" fill="#207448"/>
    <text x="72" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="112" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1</text>

    
    <rect x="230" y="152" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="230" y1="168" x2="286" y2="168" stroke="#207448" stroke-width="3"/>
    <line x1="258" y1="168" x2="258" y2="198" stroke="#207448" stroke-width="3"/>

    
    <text x="310" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">receiver advertises window 20; sender sends bytes 1 to 10</text>

    
    
    <g fill="#a3d9b5" stroke="#207448" stroke-width="2">
      <rect x="60" y="270" width="37" height="50" rx="3"/><rect x="97" y="270" width="37" height="50" rx="3"/><rect x="134" y="270" width="37" height="50" rx="3"/><rect x="171" y="270" width="37" height="50" rx="3"/><rect x="208" y="270" width="37" height="50" rx="3"/>
      <rect x="245" y="270" width="37" height="50" rx="3"/><rect x="282" y="270" width="37" height="50" rx="3"/><rect x="319" y="270" width="37" height="50" rx="3"/><rect x="356" y="270" width="37" height="50" rx="3"/><rect x="393" y="270" width="37" height="50" rx="3"/>
    </g>
    
    <g fill="#ffffff" stroke="#207448" stroke-width="2">
      <rect x="430" y="270" width="37" height="50" rx="3"/><rect x="467" y="270" width="37" height="50" rx="3"/><rect x="504" y="270" width="37" height="50" rx="3"/><rect x="541" y="270" width="37" height="50" rx="3"/><rect x="578" y="270" width="37" height="50" rx="3"/>
      <rect x="615" y="270" width="37" height="50" rx="3"/><rect x="652" y="270" width="37" height="50" rx="3"/><rect x="689" y="270" width="37" height="50" rx="3"/><rect x="726" y="270" width="37" height="50" rx="3"/><rect x="763" y="270" width="37" height="50" rx="3"/>
    </g>
    
    <g fill="#f0f4f1" stroke="#d3ded6" stroke-width="1.5">
      <rect x="800" y="270" width="37" height="50" rx="3"/><rect x="837" y="270" width="37" height="50" rx="3"/><rect x="874" y="270" width="37" height="50" rx="3"/><rect x="911" y="270" width="37" height="50" rx="3"/><rect x="948" y="270" width="37" height="50" rx="3"/>
      <rect x="985" y="270" width="37" height="50" rx="3"/><rect x="1022" y="270" width="37" height="50" rx="3"/><rect x="1059" y="270" width="37" height="50" rx="3"/><rect x="1096" y="270" width="37" height="50" rx="3"/><rect x="1133" y="270" width="37" height="50" rx="3"/>
      <rect x="1170" y="270" width="37" height="50" rx="3"/><rect x="1207" y="270" width="37" height="50" rx="3"/><rect x="1244" y="270" width="37" height="50" rx="3"/><rect x="1281" y="270" width="37" height="50" rx="3"/><rect x="1318" y="270" width="37" height="50" rx="3"/>
      <rect x="1355" y="270" width="37" height="50" rx="3"/><rect x="1392" y="270" width="37" height="50" rx="3"/><rect x="1429" y="270" width="37" height="50" rx="3"/><rect x="1466" y="270" width="37" height="50" rx="3"/><rect x="1503" y="270" width="37" height="50" rx="3"/>
    </g>
    
    <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="-0.5px">
      
      <g fill="#1a3b2b">
        <text x="78.5" y="304">1</text><text x="115.5" y="304">2</text><text x="152.5" y="304">3</text><text x="189.5" y="304">4</text><text x="226.5" y="304">5</text>
        <text x="263.5" y="304">6</text><text x="300.5" y="304">7</text><text x="337.5" y="304">8</text><text x="374.5" y="304">9</text><text x="411.5" y="304">10</text>
      </g>
      
      <g fill="#303a36">
        <text x="448.5" y="304">11</text><text x="485.5" y="304">12</text><text x="522.5" y="304">13</text><text x="559.5" y="304">14</text><text x="596.5" y="304">15</text>
        <text x="633.5" y="304">16</text><text x="670.5" y="304">17</text><text x="707.5" y="304">18</text><text x="744.5" y="304">19</text><text x="781.5" y="304">20</text>
      </g>
      
      <g fill="#9eada4">
