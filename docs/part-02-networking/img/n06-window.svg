        <text x="1003.5" y="304">26</text><text x="1040.5" y="304">27</text><text x="1077.5" y="304">28</text><text x="1114.5" y="304">29</text><text x="1151.5" y="304">30</text>
        <text x="1188.5" y="304">31</text><text x="1225.5" y="304">32</text><text x="1262.5" y="304">33</text><text x="1299.5" y="304">34</text><text x="1336.5" y="304">35</text>
        <text x="1373.5" y="304">36</text><text x="1410.5" y="304">37</text><text x="1447.5" y="304">38</text><text x="1484.5" y="304">39</text><text x="1521.5" y="304">40</text>
      </g>
    </g>
    
    <rect x="56" y="266" width="748" height="58" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  </g>

  
  <g id="step2">
    <rect x="40" y="390" width="1520" height="210" rx="12" fill="#e8f1ea" stroke="#c5dcce" stroke-width="1.5"/>

    
    <circle cx="72" cy="430" r="24" fill="#207448"/>
    <text x="72" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="112" y="439" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2</text>

    
    <rect x="230" y="402" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="230" y1="418" x2="286" y2="418" stroke="#207448" stroke-width="3"/>
    <line x1="248" y1="418" x2="248" y2="448" stroke="#207448" stroke-width="3"/>

    
    <text x="310" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">receiver acknowledges 10 and advertises 30; sender may send up to byte 40, sends bytes 11 to 15</text>

    
    
    <g fill="#207448" stroke="#175635" stroke-width="2">
      <rect x="60" y="520" width="37" height="50" rx="3"/><rect x="97" y="520" width="37" height="50" rx="3"/><rect x="134" y="520" width="37" height="50" rx="3"/><rect x="171" y="520" width="37" height="50" rx="3"/><rect x="208" y="520" width="37" height="50" rx="3"/>
      <rect x="245" y="520" width="37" height="50" rx="3"/><rect x="282" y="520" width="37" height="50" rx="3"/><rect x="319" y="520" width="37" height="50" rx="3"/><rect x="356" y="520" width="37" height="50" rx="3"/><rect x="393" y="520" width="37" height="50" rx="3"/>
    </g>
    
    <g fill="#a3d9b5" stroke="#207448" stroke-width="2">
      <rect x="430" y="520" width="37" height="50" rx="3"/><rect x="467" y="520" width="37" height="50" rx="3"/><rect x="504" y="520" width="37" height="50" rx="3"/><rect x="541" y="520" width="37" height="50" rx="3"/><rect x="578" y="520" width="37" height="50" rx="3"/>
    </g>
    
    <g fill="#ffffff" stroke="#207448" stroke-width="2">
      <rect x="615" y="520" width="37" height="50" rx="3"/><rect x="652" y="520" width="37" height="50" rx="3"/><rect x="689" y="520" width="37" height="50" rx="3"/><rect x="726" y="520" width="37" height="50" rx="3"/><rect x="763" y="520" width="37" height="50" rx="3"/>
      <rect x="800" y="520" width="37" height="50" rx="3"/><rect x="837" y="520" width="37" height="50" rx="3"/><rect x="874" y="520" width="37" height="50" rx="3"/><rect x="911" y="520" width="37" height="50" rx="3"/><rect x="948" y="520" width="37" height="50" rx="3"/>
      <rect x="985" y="520" width="37" height="50" rx="3"/><rect x="1022" y="520" width="37" height="50" rx="3"/><rect x="1059" y="520" width="37" height="50" rx="3"/><rect x="1096" y="520" width="37" height="50" rx="3"/><rect x="1133" y="520" width="37" height="50" rx="3"/>
      <rect x="1170" y="520" width="37" height="50" rx="3"/><rect x="1207" y="520" width="37" height="50" rx="3"/><rect x="1244" y="520" width="37" height="50" rx="3"/><rect x="1281" y="520" width="37" height="50" rx="3"/><rect x="1318" y="520" width="37" height="50" rx="3"/>
      <rect x="1355" y="520" width="37" height="50" rx="3"/><rect x="1392" y="520" width="37" height="50" rx="3"/><rect x="1429" y="520" width="37" height="50" rx="3"/><rect x="1466" y="520" width="37" height="50" rx="3"/><rect x="1503" y="520" width="37" height="50" rx="3"/>
    </g>
    
    <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="-0.5px">
      
      <g fill="#ffffff">
        <text x="78.5" y="554">1</text><text x="115.5" y="554">2</text><text x="152.5" y="554">3</text><text x="189.5" y="554">4</text><text x="226.5" y="554">5</text>
        <text x="263.5" y="554">6</text><text x="300.5" y="554">7</text><text x="337.5" y="554">8</text><text x="374.5" y="554">9</text><text x="411.5" y="554">10</text>
      </g>
      
      <g fill="#1a3b2b">
        <text x="448.5" y="554">11</text><text x="485.5" y="554">12</text><text x="522.5" y="554">13</text><text x="559.5" y="554">14</text><text x="596.5" y="554">15</text>
      </g>
      
      <g fill="#303a36">
        <text x="633.5" y="554">16</text><text x="670.5" y="554">17</text><text x="707.5" y="554">18</text><text x="744.5" y="554">19</text><text x="781.5" y="554">20</text>
        <text x="818.5" y="554">21</text><text x="855.5" y="554">22</text><text x="892.5" y="554">23</text><text x="929.5" y="554">24</text><text x="966.5" y="554">25</text>
        <text x="1003.5" y="554">26</text><text x="1040.5" y="554">27</text><text x="1077.5" y="554">28</text><text x="1114.5" y="554">29</text><text x="1151.5" y="554">30</text>
        <text x="1188.5" y="554">31</text><text x="1225.5" y="554">32</text><text x="1262.5" y="554">33</text><text x="1299.5" y="554">34</text><text x="1336.5" y="554">35</text>
        <text x="1373.5" y="554">36</text><text x="1410.5" y="554">37</text><text x="1447.5" y="554">38</text><text x="1484.5" y="554">39</text><text x="1521.5" y="554">40</text>
      </g>
    </g>
    
    <rect x="426" y="516" width="1118" height="58" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  </g>

  
  <g id="step3">
    <rect x="40" y="640" width="1520" height="210" rx="12" fill="#e8f1ea" stroke="#c5dcce" stroke-width="1.5"/>

    
    <circle cx="72" cy="680" r="24" fill="#207448"/>
    <text x="72" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="112" y="689" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3</text>

    
    <rect x="230" y="652" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="230" y1="668" x2="286" y2="668" stroke="#207448" stroke-width="3"/>
    <line x1="268" y1="668" x2="268" y2="698" stroke="#207448" stroke-width="3"/>

    
    <text x="310" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#303a36">receiver acknowledges 15 and advertises 40</text>

    
    
    <g fill="#207448" stroke="#175635" stroke-width="2">
      <rect x="60" y="770" width="37" height="50" rx="3"/><rect x="97" y="770" width="37" height="50" rx="3"/><rect x="134" y="770" width="37" height="50" rx="3"/><rect x="171" y="770" width="37" height="50" rx="3"/><rect x="208" y="770" width="37" height="50" rx="3"/>
      <rect x="245" y="770" width="37" height="50" rx="3"/><rect x="282" y="770" width="37" height="50" rx="3"/><rect x="319" y="770" width="37" height="50" rx="3"/><rect x="356" y="770" width="37" height="50" rx="3"/><rect x="393" y="770" width="37" height="50" rx="3"/>
      <rect x="430" y="770" width="37" height="50" rx="3"/><rect x="467" y="770" width="37" height="50" rx="3"/><rect x="504" y="770" width="37" height="50" rx="3"/><rect x="541" y="770" width="37" height="50" rx="3"/><rect x="578" y="770" width="37" height="50" rx="3"/>
    </g>
    
    <g fill="#ffffff" stroke="#207448" stroke-width="2">
      <rect x="615" y="770" width="37" height="50" rx="3"/><rect x="652" y="770" width="37" height="50" rx="3"/><rect x="689" y="770" width="37" height="50" rx="3"/><rect x="726" y="770" width="37" height="50" rx="3"/><rect x="763" y="770" width="37" height="50" rx="3"/>
      <rect x="800" y="770" width="37" height="50" rx="3"/><rect x="837" y="770" width="37" height="50" rx="3"/><rect x="874" y="770" width="37" height="50" rx="3"/><rect x="911" y="770" width="37" height="50" rx="3"/><rect x="948" y="770" width="37" height="50" rx="3"/>
      <rect x="985" y="770" width="37" height="50" rx="3"/><rect x="1022" y="770" width="37" height="50" rx="3"/><rect x="1059" y="770" width="37" height="50" rx="3"/><rect x="1096" y="770" width="37" height="50" rx="3"/><rect x="1133" y="770" width="37" height="50" rx="3"/>
      <rect x="1170" y="770" width="37" height="50" rx="3"/><rect x="1207" y="770" width="37" height="50" rx="3"/><rect x="1244" y="770" width="37" height="50" rx="3"/><rect x="1281" y="770" width="37" height="50" rx="3"/><rect x="1318" y="770" width="37" height="50" rx="3"/>
      <rect x="1355" y="770" width="37" height="50" rx="3"/><rect x="1392" y="770" width="37" height="50" rx="3"/><rect x="1429" y="770" width="37" height="50" rx="3"/><rect x="1466" y="770" width="37" height="50" rx="3"/><rect x="1503" y="770" width="37" height="50" rx="3"/>
    </g>
    
    <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="-0.5px">
      
      <g fill="#ffffff">
        <text x="78.5" y="804">1</text><text x="115.5" y="804">2</text><text x="152.5" y="804">3</text><text x="189.5" y="804">4</text><text x="226.5" y="804">5</text>
        <text x="263.5" y="804">6</text><text x="300.5" y="804">7</text><text x="337.5" y="804">8</text><text x="374.5" y="804">9</text><text x="411.5" y="804">10</text>
        <text x="448.5" y="804">11</text><text x="485.5" y="804">12</text><text x="522.5" y="804">13</text><text x="559.5" y="804">14</text><text x="596.5" y="804">15</text>
      </g>
      
      <g fill="#303a36">
        <text x="633.5" y="804">16</text><text x="670.5" y="804">17</text><text x="707.5" y="804">18</text><text x="744.5" y="804">19</text><text x="781.5" y="804">20</text>
        <text x="818.5" y="804">21</text><text x="855.5" y="804">22</text><text x="892.5" y="804">23</text><text x="929.5" y="804">24</text><text x="966.5" y="804">25</text>
        <text x="1003.5" y="804">26</text><text x="1040.5" y="804">27</text><text x="1077.5" y="804">28</text><text x="1114.5" y="804">29</text><text x="1151.5" y="804">30</text>
        <text x="1188.5" y="804">31</text><text x="1225.5" y="804">32</text><text x="1262.5" y="804">33</text><text x="1299.5" y="804">34</text><text x="1336.5" y="804">35</text>
        <text x="1373.5" y="804">36</text><text x="1410.5" y="804">37</text><text x="1447.5" y="804">38</text><text x="1484.5" y="804">39</text><text x="1521.5" y="804">40</text>
      </g>
    </g>
    
    <rect x="611" y="766" width="933" height="58" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  </g>

  
  <g id="orange-note">
    <rect x="40" y="890" width="1520" height="90" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="80" cy="935" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="80" y1="921" x2="80" y2="938" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="948" r="2.5" fill="#db8129"/>
    
    <text x="125" y="943" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">If the application reads slowly the window shrinks to zero; sender sends window probes</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1020" width="1520" height="64" rx="10" fill="#207448"/>
    <text x="800" y="1060" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">sender may have at most <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">min(rwnd, cwnd)</tspan> in flight</text>
  </g>
</svg>