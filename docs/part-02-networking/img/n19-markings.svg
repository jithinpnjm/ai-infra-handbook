<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where QoS markings live</title>
  <desc>Visual infographic explaining packet QoS fields across Ethernet 802.1Q, MPLS, IPv4/IPv6, and Layer 4 with an example mapping plan and edge policy.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="78" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where QoS markings live</text>

  
  <rect x="60" y="120" width="880" height="910" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="90" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Stack of header strips each showing its QoS field</text>

  
  <g id="strip-l2">
    <rect x="90" y="200" width="820" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(115, 239)">
      <rect x="2" y="2" width="52" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="42" x2="12" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="42" x2="28" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="42" x2="44" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="16" cy="22" r="4" fill="#207448" />
      <circle cx="28" cy="22" r="4" fill="#207448" />
      <circle cx="40" cy="22" r="4" fill="#207448" />
    </g>
    <text x="195" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ethernet 802.1Q tag</text>
    <text x="195" y="298" font-family="sans-serif" font-size="26" fill="#303a36">PCP (3 bits, 0 to 7) + DEI</text>
  </g>

  
  <g id="strip-mpls">
    <rect x="90" y="355" width="820" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(115, 394)">
      <path d="M 4 28 L 24 6 L 48 6 L 48 30 L 26 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="38" cy="16" r="4" fill="#207448" />
    </g>
    <text x="195" y="403" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">MPLS</text>
    <text x="195" y="453" font-family="sans-serif" font-size="26" fill="#303a36">traffic class (3 bits)</text>
  </g>

  
  <g id="strip-ip">
    <rect x="90" y="510" width="820" height="315" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(115, 545)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <ellipse cx="28" cy="28" rx="12" ry="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" />
    </g>
    <text x="195" y="555" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">IPv4/IPv6 header</text>
    <text x="195" y="605" font-family="sans-serif" font-size="25" fill="#303a36">ToS or Traffic Class byte = DSCP</text>
    <text x="195" y="650" font-family="sans-serif" font-size="25" fill="#303a36">(6 bits, 64 values:</text>
    <text x="195" y="700" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">CS0..CS7, AF11..AF43, EF=46, DF=0</text>
    <text x="195" y="745" font-family="sans-serif" font-size="25" fill="#303a36">) + ECN (2 bits)</text>
  </g>

  
  <g id="strip-l4">
    <rect x="90" y="845" width="820" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(115, 894)">
      <rect x="4" y="8" width="48" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="18" cy="27" r="5" fill="#207448" />
      <circle cx="38" cy="27" r="5" fill="#207448" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="4" />
    </g>
    <text x="195" y="898" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Layer 4</text>
    <text x="195" y="955" font-family="sans-serif" font-size="26" fill="#303a36">ports, RoCEv2 on <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">UDP 4791</tspan></text>
  </g>

  
  <path d="M 940 667 L 1008 667" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)" />

  
  <g id="example-plan">
    <rect x="1020" y="120" width="520" height="910" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <rect x="1020" y="120" width="520" height="85" rx="16" fill="#db8129" />
    
    <g transform="translate(1050, 134)">
      <rect x="8" y="12" width="38" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
      <path d="M 18 12 L 18 6 L 36 6 L 36 12 Z" fill="#ffffff" />
      <line x1="16" y1="24" x2="38" y2="24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="34" x2="32" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1125" y="176" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Example plan</text>

    
    <g id="plan-card-1">
      <rect x="1050" y="240" width="460" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="1080" y="305" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">RoCE data class</text>
      <text x="1080" y="375" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#db8129">DSCP 26</text>
      <text x="1080" y="445" font-family="sans-serif" font-size="26" fill="#303a36">mapped to priority 3</text>
    </g>

    
    <g id="plan-card-2">
      <rect x="1050" y="555" width="460" height="425" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="1080" y="625" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">CNP class</text>
      <text x="1080" y="695" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#db8129">DSCP 48</text>
      <text x="1080" y="765" font-family="sans-serif" font-size="26" fill="#303a36">to strict-priority or</text>
      <text x="1080" y="815" font-family="sans-serif" font-size="26" fill="#303a36">high-weight queue</text>
    </g>
  </g>

  
  <g id="footer-takeaway">
    <rect x="60" y="1070" width="1480" height="75" rx="12" fill="#207448" />
    
    <g transform="translate(85, 1080)">
      <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
      <path d="M 20 28 L 26 34 L 38 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="160" y="1118" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">re-mark untrusted markings at the edge</text>
  </g>
</svg>