<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading ss -ti: which field points at which limit</title>
  <desc>Visual breakdown of ss -ti output fields, TCP flow limit diagnosis patterns, and socket monitoring commands.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading ss -ti: which field points at which limit</text>

  
  <g id="top-panel">
    <rect x="40" y="115" width="1520" height="240" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <text x="210" y="170" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">rtt: smoothed value / variance</text>
    <text x="590" y="170" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">cwnd: congestion window</text>
    <text x="1055" y="170" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">retrans: current / total</text>

    
    
    <path d="M 65 218 L 65 198 L 135 198 L 135 180 M 135 198 L 206 198 L 206 218" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <path d="M 348 218 L 348 198 L 397 198 L 397 186 L 590 186 L 590 180 M 397 198 L 447 198 L 447 218" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <path d="M 970 218 L 970 198 L 1055 198 L 1055 180 M 1055 198 L 1140 198 L 1140 218" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <rect x="55" y="222" width="1490" height="38" rx="6" fill="#e8f1ea"/>

    
    <text x="65" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36" textLength="1470" lengthAdjust="spacingAndGlyphs">rtt:12.5/3 mss:1448 cwnd:10 ssthresh:7 bytes_sent bytes_retrans retrans:0/12 delivery_rate pacing_rate send rcv_space</text>

    
    
    <path d="M 220 264 L 220 284 L 277 284 L 277 298 M 277 284 L 334 284 L 334 264" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <path d="M 461 264 L 461 284 L 531 284 L 531 298 M 531 284 L 602 284 L 602 264" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <path d="M 1408 264 L 1408 284 L 1471 284 L 1471 298 M 1471 284 L 1535 284 L 1535 264" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <text x="277" y="326" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">mss</text>
    <text x="531" y="326" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">ssthresh</text>
    <text x="1471" y="326" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">rcv_space</text>
  </g>

  
  <g id="reading-patterns">
    
    <g id="pattern-1">
      <rect x="40" y="380" width="960" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(58, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="16" width="34" height="24" rx="4"/>
        <line x1="15" y1="16" x2="15" y2="40"/>
        <line x1="26" y1="16" x2="26" y2="40"/>
        <path d="M38 28 L50 28 M44 22 L50 28 L44 34"/>
      </g>
      <text x="135" y="430" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="135" dy="0" font-weight="bold">Persistent non-zero Send-Q with growing retrans:</tspan>
        <tspan x="135" dy="35">loss or a stalled receiver</tspan>
      </text>
    </g>

    
    <g id="pattern-2">
      <rect x="40" y="515" width="960" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(58, 545)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="46" height="42" rx="5"/>
        <line x1="4" y1="18" x2="50" y2="18"/>
        <circle cx="12" cy="12" r="2" fill="#207448"/>
        <circle cx="18" cy="12" r="2" fill="#207448"/>
        <line x1="22" y1="26" x2="22" y2="40"/>
        <line x1="32" y1="26" x2="32" y2="40"/>
      </g>
      <text x="135" y="565" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="135" dy="0" font-weight="bold">High Recv-Q on an established socket:</tspan>
        <tspan x="135" dy="35">the local application is not reading</tspan>
      </text>
    </g>

    
    <g id="pattern-3">
      <rect x="40" y="650" width="960" height="115" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(58, 680)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12 L18 24 L18 32 L4 44 M50 12 L36 24 L36 32 L50 44"/>
        <line x1="27" y1="18" x2="27" y2="38"/>
        <line x1="27" y1="22" x2="27" y2="28" stroke-width="5"/>
      </g>
      <text x="135" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="135" dy="0" font-weight="bold">Small cwnd with high retrans:</tspan>
        <tspan x="135" dy="35">congestion or loss</tspan>
      </text>
    </g>

    
    <g id="pattern-4">
      <rect x="40" y="785" width="960" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(58, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 40 A21 21 0 1 1 48 40"/>
        <line x1="27" y1="36" x2="38" y2="20"/>
        <circle cx="27" cy="36" r="3" fill="#207448"/>
        <line x1="12" y1="24" x2="16" y2="27"/>
        <line x1="27" y1="15" x2="27" y2="20"/>
        <line x1="42" y1="24" x2="38" y2="27"/>
      </g>
      <text x="135" y="820" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="135" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">rwnd_limited, sndbuf_limited, cwnd_limited</tspan>
        <tspan x="135" dy="30">together with rcv_space:</tspan>
        <tspan x="135" dy="30">which limit constrains the flow</tspan>
      </text>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="1020" y="380" width="540" height="520" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g id="command-1">
      <rect x="1040" y="395" width="500" height="110" rx="8" fill="#e8f1ea"/>
      <g transform="translate(1480, 427)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="14" width="28" height="20" rx="4"/>
        <line x1="14" y1="34" x2="14" y2="42"/>
        <line x1="26" y1="34" x2="26" y2="42"/>
        <line x1="20" y1="6" x2="20" y2="14"/>
      </g>
      <text x="1060" y="440" font-size="24" fill="#303a36">
        <tspan x="1060" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">ss -tan:</tspan>
        <tspan x="1060" dy="35" font-family="sans-serif">all TCP sockets numeric</tspan>
      </text>
    </g>

    
    <g id="command-2">
      <rect x="1040" y="520" width="500" height="110" rx="8" fill="#e8f1ea"/>
      <g transform="translate(1480, 552)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="24" r="9"/>
        <path d="M20 7 L20 12 M20 36 L20 41 M7 24 L12 24 M36 24 L41 24 M11 15 L15 19 M29 33 L33 37 M11 33 L15 29 M29 15 L33 19"/>
      </g>
      <text x="1060" y="565" font-size="24" fill="#303a36">
        <tspan x="1060" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">ss -tlnp:</tspan>
        <tspan x="1060" dy="35" font-family="sans-serif">listeners with owning process</tspan>
      </text>
    </g>

    
    <g id="command-3">
      <rect x="1040" y="645" width="500" height="125" rx="8" fill="#e8f1ea"/>
      <g transform="translate(1480, 683)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="24" height="28" rx="3"/>
        <line x1="4" y1="16" x2="10" y2="16"/>
        <line x1="4" y1="24" x2="10" y2="24"/>
        <line x1="4" y1="32" x2="10" y2="32"/>
        <line x1="34" y1="16" x2="40" y2="16"/>
        <line x1="34" y1="24" x2="40" y2="24"/>
        <line x1="34" y1="32" x2="40" y2="32"/>
      </g>
      <text x="1060" y="685" font-size="24" fill="#303a36">
        <tspan x="1060" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">ss -tm:</tspan>
        <tspan font-family="sans-serif" font-weight="normal" fill="#303a36"> memory skmem</tspan>
        <tspan x="1060" dy="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#303a36">(rb, tb, f, w, o, bl, d)</tspan>
      </text>
    </g>

    
    <g id="command-4">
      <rect x="1040" y="785" width="500" height="100" rx="8" fill="#e8f1ea"/>
      <g transform="translate(1480, 812)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="32" height="32" rx="4"/>
        <line x1="12" y1="32" x2="12" y2="24"/>
        <line x1="18" y1="32" x2="18" y2="16"/>
        <line x1="24" y1="32" x2="24" y2="20"/>
        <line x1="30" y1="32" x2="30" y2="28"/>
      </g>
      <text x="1060" y="828" font-size="24" fill="#303a36">
        <tspan x="1060" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#207448">ss -s:</tspan>
        <tspan x="1060" dy="35" font-family="sans-serif">summary by state</tspan>
      </text>
    </g>
  </g>

  
  <g id="footer">
    <rect x="40" y="915" width="1520" height="155" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="960" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Flow control protects the receiver, congestion control protects the network;</tspan>
      <tspan x="800" dy="38">the sender never has more in flight than the smaller of the two windows;</tspan>
      <tspan x="800" dy="38">when a flow is slow, first ask whether the receiver or the network is the limit</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1090" width="1520" height="70" rx="10" fill="#207448"/>
    <text x="800" y="1134" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">ss asks the kernel directly instead of guessing from the outside</text>
  </g>
</svg>