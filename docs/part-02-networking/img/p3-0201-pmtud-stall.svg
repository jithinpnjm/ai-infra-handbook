<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>Works for small requests, stalls for big downloads: the blocked ICMP trap</title>
  <desc>Infographic explaining Path MTU Discovery failure when ICMP messages are filtered by a firewall, leading to a blackhole state.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Works for small requests, stalls for big downloads:</tspan>
    <tspan x="800" dy="54">the blocked ICMP trap</tspan>
  </text>

  
  
  <rect x="40" y="150" width="280" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(60, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="52" height="34" rx="4"/>
    <line x1="28" y1="36" x2="28" y2="52"/>
    <line x1="14" y1="52" x2="42" y2="52"/>
  </g>
  <text x="140" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client</text>

  
  <line x1="320" y1="200" x2="396" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="410" y="150" width="480" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(430, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <line x1="12" y1="28" x2="44" y2="28"/>
    <line x1="28" y1="12" x2="28" y2="44"/>
    <path d="M 22 18 L 28 12 L 34 18"/>
    <path d="M 22 38 L 28 44 L 34 38"/>
    <path d="M 18 22 L 12 28 L 18 34"/>
    <path d="M 38 22 L 44 28 L 38 34"/>
  </g>
  <text x="506" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="506" dy="0">Router with</tspan>
    <tspan x="506" dy="36">smaller egress MTU</tspan>
  </text>

  
  <line x1="890" y1="200" x2="946" y2="200" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="960" y="150" width="200" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(976, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="48" height="20" rx="3"/>
    <rect x="4" y="30" width="48" height="20" rx="3"/>
    <line x1="12" y1="14" x2="24" y2="14"/>
    <line x1="12" y1="40" x2="24" y2="40"/>
    <circle cx="42" cy="14" r="2" fill="#207448"/>
    <circle cx="42" cy="40" r="2" fill="#207448"/>
  </g>
  <text x="1046" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server</text>

  
  <rect x="1190" y="150" width="370" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1347, 180)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 6 16 C 6 36 28 50 28 50 C 28 50 50 36 50 16 Z"/>
    <path d="M 18 26 L 25 33 L 38 19"/>
  </g>
  <text x="1375" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1375" dy="0">Why small</tspan>
    <tspan x="1375" dy="38">things still work</tspan>
  </text>
  <text x="1375" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1375" dy="0">the handshake and</tspan>
    <tspan x="1375" dy="44">tiny responses fit</tspan>
    <tspan x="1375" dy="44">under the MTU;</tspan>
    <tspan x="1375" dy="44">container layer</tspan>
    <tspan x="1375" dy="44">downloads are large</tspan>
    <tspan x="1375" dy="44">and stall</tspan>
  </text>

  
  <rect x="40" y="280" width="1120" height="245" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(64, 300)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="18"/>
    <path d="M 12 20 L 18 26 L 28 14"/>
  </g>
  <text x="116" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ICMP allowed</text>

  
  <rect x="180" y="350" width="860" height="48" rx="8" fill="#e8f1ea"/>
  <line x1="90" y1="374" x2="166" y2="374" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="196" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a large packet with DF set reaches the router, the router drops it and sends back</text>

  
  <rect x="360" y="412" width="580" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <line x1="954" y1="435" x2="940" y2="435" stroke="#207448" stroke-width="3"/>
  <line x1="360" y1="435" x2="194" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="650" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">ICMP Fragmentation Needed or Packet Too Big</text>

  
  <rect x="64" y="470" width="1070" height="42" rx="8" fill="#f5f8f5"/>
  <text x="599" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">the client lowers its packet size and the transfer continues (Path MTU Discovery works)</text>

  
  <rect x="40" y="555" width="1120" height="245" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  
  <g transform="translate(64, 575)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 4 L 4 11 C 4 25 20 35 20 35 C 20 35 36 25 36 11 Z"/>
    <line x1="8" y1="8" x2="32" y2="32"/>
  </g>
  <text x="116" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">ICMP filtered by a firewall</text>

  
  <rect x="70" y="640" width="820" height="120" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="1.5"/>
  <text x="96" y="692" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="96" dy="0">the same large packet is dropped, the ICMP message</tspan>
    <tspan x="96" dy="38">never reaches the client, and the transfer stalls</tspan>
  </text>

  
  <rect x="920" y="640" width="215" height="120" rx="12" fill="#db8129"/>
  
  <g transform="translate(1002, 655)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="25" cy="25" r="20" stroke-dasharray="8 4"/>
    <circle cx="25" cy="25" r="10"/>
    <circle cx="25" cy="25" r="3" fill="#ffffff"/>
  </g>
  <text x="1027" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">blackhole</text>

  
  
  <rect x="40" y="830" width="670" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="64" y="872" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="64" dy="0">ping -M do -s 1472 host</tspan>
    <tspan x="64" dy="36">(DF set, payload sized to the MTU)</tspan>
  </text>

  
  <rect x="730" y="830" width="260" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="860" y="890" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" text-anchor="middle">tracepath host</text>

  
  <rect x="1010" y="830" width="240" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1130" y="890" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" text-anchor="middle">ss -ti</text>

  
  <rect x="1270" y="830" width="290" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1415" y="890" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" text-anchor="middle">tcpdump</text>

  
  <rect x="40" y="955" width="1520" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">MSS is typically the MTU minus 40, for example 1460</text>

  
  <rect x="40" y="1050" width="1520" height="80" rx="12" fill="#207448"/>
  <text x="800" y="1100" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">The MTU is the largest packet a link will carry, and blocked ICMP breaks the discovery of it</text>
</svg>