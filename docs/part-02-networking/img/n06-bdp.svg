<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>Bandwidth-delay product</title>
  <desc>Visual explanation of Bandwidth-delay product (BDP) comparing a pipe model with network path BDP values.</desc>

  
  <rect width="1600" height="950" fill="#f5f8f5"/>

  
  <text x="50" y="78" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Bandwidth-delay product</text>

  
  <rect x="40" y="130" width="660" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(70, 160)">
    <ellipse cx="20" cy="28" rx="12" ry="24" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 20 4 L 48 4 C 58 4 64 14 64 28 C 64 42 58 52 48 52 L 20 52" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 48 4 C 40 4 34 14 34 28 C 34 42 40 52 48 52" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="4 4"/>
  </g>

  
  <rect x="250" y="305" width="410" height="220" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <line x1="275" y1="305" x2="275" y2="525" stroke="#207448" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="635" y1="305" x2="635" y2="525" stroke="#207448" stroke-width="2" stroke-dasharray="6 6"/>

  
  <text x="455" y="424" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">BDP = bandwidth x RTT</text>

  
  <line x1="250" y1="265" x2="660" y2="265" stroke="#207448" stroke-width="2.5"/>
  <polygon points="250,265 264,259 264,271" fill="#207448"/>
  <polygon points="660,265 646,259 646,271" fill="#207448"/>
  <line x1="250" y1="252" x2="250" y2="295" stroke="#207448" stroke-width="2"/>
  <line x1="660" y1="252" x2="660" y2="295" stroke="#207448" stroke-width="2"/>
  <text x="455" y="248" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">RTT</text>

  
  <line x1="215" y1="305" x2="215" y2="525" stroke="#207448" stroke-width="2.5"/>
  <polygon points="215,305 209,319 221,319" fill="#207448"/>
  <polygon points="215,525 209,511 221,511" fill="#207448"/>
  <line x1="202" y1="305" x2="240" y2="305" stroke="#207448" stroke-width="2"/>
  <line x1="202" y1="525" x2="240" y2="525" stroke="#207448" stroke-width="2"/>
  <text x="125" y="423" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">bandwidth</text>

  
  <rect x="740" y="130" width="820" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(770, 158)">
    <rect x="0" y="0" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="16" x2="28" y2="46" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="760" y="225" width="780" height="60" rx="8" fill="#207448"/>
  <text x="785" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Path</text>
  <text x="1050" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Bandwidth</text>
  <text x="1225" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">RTT</text>
  <text x="1365" y="265" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">BDP</text>

  
  <rect x="760" y="297" width="780" height="62" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
  <text x="785" y="338" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Same rack</text>
  <text x="1050" y="338" font-family="sans-serif" font-size="25" fill="#303a36">100 Gb/s</text>
  <text x="1225" y="338" font-family="sans-serif" font-size="25" fill="#303a36">20 us</text>
  <text x="1365" y="338" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">250 KB</text>

  
  <rect x="760" y="369" width="780" height="62" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
  <text x="785" y="410" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Same DC</text>
  <text x="1050" y="410" font-family="sans-serif" font-size="25" fill="#303a36">100 Gb/s</text>
  <text x="1225" y="410" font-family="sans-serif" font-size="25" fill="#303a36">100 us</text>
  <text x="1365" y="410" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">1.25 MB</text>

  
  <rect x="760" y="441" width="780" height="62" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
  <text x="785" y="482" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Metro</text>
  <text x="1050" y="482" font-family="sans-serif" font-size="25" fill="#303a36">10 Gb/s</text>
  <text x="1225" y="482" font-family="sans-serif" font-size="25" fill="#303a36">2 ms</text>
  <text x="1365" y="482" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">2.5 MB</text>

  
  <rect x="760" y="513" width="780" height="66" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <text x="785" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">Cross-continent</text>
  <text x="1050" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">10 Gb/s</text>
  <text x="1225" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">70 ms</text>
  <text x="1365" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">87.5 MB</text>

  
  <rect x="760" y="589" width="780" height="62" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5"/>
  <text x="785" y="630" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Intercontinental</text>
  <text x="1050" y="630" font-family="sans-serif" font-size="25" fill="#303a36">10 Gb/s</text>
  <text x="1225" y="630" font-family="sans-serif" font-size="25" fill="#303a36">180 ms</text>
  <text x="1365" y="630" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">225 MB</text>

  
  <rect x="40" y="735" width="1520" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="782" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">a 4 MB window over a 70 ms RTT tops out at about 457 Mb/s on a 10 Gb/s path</text>

  
  <rect x="40" y="830" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="877" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">A window that fills a rack-local path falls far short on a long one</text>
</svg>