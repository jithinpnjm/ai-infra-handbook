<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>AS_PATH loop prevention</title>
  <desc>Visual infographic explaining BGP AS_PATH loop prevention in a triangle-plus-one topology where a router rejects any route that already contains its own ASN.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">AS_PATH loop prevention</text>

  
  <g id="top-note">
    <rect x="360" y="105" width="880" height="56" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="800" y="142" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">BGP has no split horizon; loops are still prevented</text>
  </g>

  
  <g id="node-c">
    <rect x="60" y="210" width="340" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(90, 235)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
      <line x1="12" y1="28" x2="44" y2="28" stroke-width="3.5" />
      <polyline points="18,22 12,28 18,34" stroke-width="3.5" />
      <polyline points="38,22 44,28 38,34" stroke-width="3.5" />
      <line x1="28" y1="12" x2="28" y2="44" stroke-width="3.5" />
      <polyline points="22,18 28,12 34,18" stroke-width="3.5" />
      <polyline points="22,38 28,44 34,38" stroke-width="3.5" />
    </g>
    <text x="175" y="275" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">C</text>
    
    <rect x="90" y="325" width="280" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="230" y="363" text-anchor="middle" font-family="monospace" font-size="26" fill="#303a36">[65000]</text>
  </g>

  
  <g id="node-a">
    <rect x="560" y="210" width="420" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(590, 235)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
      <line x1="12" y1="28" x2="44" y2="28" stroke-width="3.5" />
      <polyline points="18,22 12,28 18,34" stroke-width="3.5" />
      <polyline points="38,22 44,28 38,34" stroke-width="3.5" />
      <line x1="28" y1="12" x2="28" y2="44" stroke-width="3.5" />
      <polyline points="22,18 28,12 34,18" stroke-width="3.5" />
      <polyline points="22,38 28,44 34,38" stroke-width="3.5" />
    </g>
    <text x="670" y="274" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">A (AS65000)</text>
    
    <rect x="590" y="325" width="360" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="770" y="363" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">2001:db8:100::/64</text>
  </g>

  
  <g id="node-b">
    <rect x="1120" y="210" width="420" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1150, 235)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
      <line x1="12" y1="28" x2="44" y2="28" stroke-width="3.5" />
      <polyline points="18,22 12,28 18,34" stroke-width="3.5" />
      <polyline points="38,22 44,28 38,34" stroke-width="3.5" />
      <line x1="28" y1="12" x2="28" y2="44" stroke-width="3.5" />
      <polyline points="22,18 28,12 34,18" stroke-width="3.5" />
      <polyline points="22,38 28,44 34,38" stroke-width="3.5" />
    </g>
    <text x="1230" y="274" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">B (AS65001)</text>
    
    <rect x="1150" y="325" width="360" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1330" y="363" text-anchor="middle" font-family="monospace" font-size="25" fill="#303a36">[65001, 65000]</text>
  </g>

  
  <g id="node-d">
    <rect x="1120" y="660" width="420" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1150, 685)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" fill="#e8f1ea" />
      <line x1="12" y1="28" x2="44" y2="28" stroke-width="3.5" />
      <polyline points="18,22 12,28 18,34" stroke-width="3.5" />
      <polyline points="38,22 44,28 38,34" stroke-width="3.5" />
      <line x1="28" y1="12" x2="28" y2="44" stroke-width="3.5" />
      <polyline points="22,18 28,12 34,18" stroke-width="3.5" />
      <polyline points="22,38 28,44 34,38" stroke-width="3.5" />
    </g>
    <text x="1230" y="724" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">D (AS65003)</text>
    
    <rect x="1140" y="775" width="380" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1330" y="813" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">[65003, 65001, 65000]</text>
  </g>

  
  <line x1="980" y1="325" x2="1118" y2="325" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <circle cx="1050" cy="280" r="22" fill="#207448" />
  <text x="1050" y="288" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

  
  <line x1="560" y1="325" x2="402" y2="325" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1330" y1="440" x2="1330" y2="658" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <circle cx="1380" cy="550" r="22" fill="#207448" />
  <text x="1380" y="558" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

  
  <path d="M 1120 775 L 620 775 L 620 460" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <circle cx="870" cy="825" r="22" fill="#db8129" />
  <text x="870" y="833" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

  
  <circle cx="620" cy="440" r="18" fill="#db8129" />
  <path d="M 612 432 L 628 448 M 628 432 L 612 448" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  
  <g id="orange-note">
    <rect x="680" y="505" width="400" height="160" rx="14" fill="#fff6ee" stroke="#db8129" stroke-width="3" />
    <text x="880" y="552" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      <tspan x="880" dy="0">a router rejects</tspan>
      <tspan x="880" dy="38">any route that already</tspan>
      <tspan x="880" dy="38">contains its own ASN</tspan>
    </text>
  </g>
</svg>