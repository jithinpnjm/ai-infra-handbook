<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1145" width="1600" height="1145">
  <title>A lossless Ethernet class needs every piece set the same, end to end</title>
  <desc>Visual infographic explaining the strict end-to-end requirements for lossless Ethernet (RoCEv2), including checklist configuration across NICs and switches, failure modes, InfiniBand contrast, and rail-optimized fabric considerations.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#303a36"/>
    </marker>
    
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1145" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    A lossless Ethernet class needs every piece
    <tspan x="800" dy="55">set the same, end to end</tspan>
  </text>

  

  
  <rect x="60" y="145" width="990" height="368" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(75, 155)">
    <rect x="0" y="0" width="960" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#207448"/>
    <path d="M 21 32 L 26 37 L 35 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="sans-serif" font-size="24" fill="#303a36">
      PFC (802.1Qbb) for the RoCE priority,
      <tspan x="56" dy="28">on the NIC and on every switch</tspan>
    </text>
  </g>

  
  <g transform="translate(75, 227)">
    <rect x="0" y="0" width="960" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="28" cy="22" r="14" fill="#207448"/>
    <path d="M 21 22 L 26 27 L 35 17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="sans-serif" font-size="24" fill="#303a36">ECN marking with DCQCN or similar rate control</text>
  </g>

  
  <g transform="translate(75, 279)">
    <rect x="0" y="0" width="960" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="28" cy="22" r="14" fill="#207448"/>
    <path d="M 21 22 L 26 27 L 35 17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="sans-serif" font-size="24" fill="#303a36">DSCP and PCP trust and mapping set correctly</text>
  </g>

  
  <g transform="translate(75, 331)">
    <rect x="0" y="0" width="960" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#207448"/>
    <path d="M 21 32 L 26 37 L 35 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="sans-serif" font-size="24" fill="#303a36">
      buffer allocation and headroom sized
      <tspan x="56" dy="28">for each port speed and cable length</tspan>
    </text>
  </g>

  
  <g transform="translate(75, 403)">
    <rect x="0" y="0" width="960" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="28" cy="50" r="14" fill="#207448"/>
    <path d="M 21 50 L 26 55 L 35 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="sans-serif" font-size="24" fill="#303a36">
      per-port counters watched: CRC, FEC uncorrected, symbol errors,
      <tspan x="56" dy="25">PFC pause counts per priority, ECN-marked packets,</tspan>
      <tspan x="56" dy="25">buffer occupancy, link flaps, optical power (DOM)</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 532)">
    
    <circle cx="135" cy="0" r="13" fill="#207448"/>
    <path d="M 129 0 L 133 4 L 141 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="335" cy="0" r="13" fill="#207448"/>
    <path d="M 329 0 L 333 4 L 341 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="555" cy="0" r="13" fill="#207448"/>
    <path d="M 549 0 L 553 4 L 561 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="775" cy="0" r="13" fill="#207448"/>
    <path d="M 769 0 L 773 4 L 781 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="975" cy="0" r="13" fill="#207448"/>
    <path d="M 969 0 L 973 4 L 981 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  

  
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="150" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(47, 18)">
      <rect x="0" y="0" width="56" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="36" x2="48" y2="36" stroke="#207448" stroke-width="4" stroke-dasharray="6,4"/>
      <rect x="14" y="8" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="8" x2="8" y2="8" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="75" y="108" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">NIC</text>
  </g>

  
  <line x1="210" y1="638" x2="238" y2="638" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(240, 560)">
    <rect x="0" y="0" width="190" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(67, 14)">
      <rect x="0" y="0" width="56" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="8" y="10" width="10" height="12" rx="1" fill="#207448"/>
      <rect x="23" y="10" width="10" height="12" rx="1" fill="#207448"/>
      <rect x="38" y="10" width="10" height="12" rx="1" fill="#207448"/>
    </g>
    <text x="95" y="80" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      Leaf
      <tspan x="95" dy="34">switch</tspan>
      <tspan x="95" dy="34">port</tspan>
    </text>
  </g>

  
  <line x1="430" y1="638" x2="458" y2="638" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(460, 560)">
    <rect x="0" y="0" width="190" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(67, 14)">
      <rect x="0" y="0" width="56" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="8" x2="44" y2="24" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="24" x2="44" y2="8" stroke="#207448" stroke-width="3"/>
      <circle cx="28" cy="16" r="4" fill="#207448"/>
    </g>
    <text x="95" y="80" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      Spine
      <tspan x="95" dy="34">switch</tspan>
      <tspan x="95" dy="34">port</tspan>
    </text>
  </g>

  
  <line x1="650" y1="638" x2="678" y2="638" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(680, 560)">
    <rect x="0" y="0" width="190" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(67, 14)">
      <rect x="0" y="0" width="56" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="8" y="10" width="10" height="12" rx="1" fill="#207448"/>
      <rect x="23" y="10" width="10" height="12" rx="1" fill="#207448"/>
      <rect x="38" y="10" width="10" height="12" rx="1" fill="#207448"/>
    </g>
    <text x="95" y="80" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      Leaf
      <tspan x="95" dy="34">switch</tspan>
      <tspan x="95" dy="34">port</tspan>
    </text>
  </g>

  
  <line x1="870" y1="638" x2="898" y2="638" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g transform="translate(900, 560)">
    <rect x="0" y="0" width="150" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(47, 18)">
      <rect x="0" y="0" width="56" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="36" x2="48" y2="36" stroke="#207448" stroke-width="4" stroke-dasharray="6,4"/>
      <rect x="14" y="8" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="8" x2="8" y2="8" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="75" y="108" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">NIC</text>
  </g>

  
  <rect x="60" y="735" width="990" height="60" rx="8" fill="#207448"/>
  <text x="555" y="774" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    the lossless class works only end to end
  </text>

  

  <rect x="1080" y="145" width="480" height="368" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <line x1="1320" y1="162" x2="1320" y2="198" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-dark)"/>

  
  <g transform="translate(1105, 202)">
    <rect x="0" y="0" width="430" height="114" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
    <text x="215" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      PFC missing on one switch
      <tspan x="215" dy="30">port: drops, and RDMA</tspan>
      <tspan x="215" dy="30">retransmits are costly</tspan>
    </text>
  </g>

  
  <line x1="1320" y1="334" x2="1320" y2="370" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g transform="translate(1105, 374)">
    <rect x="0" y="0" width="430" height="114" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="215" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
      misconfigured the other
      <tspan x="215" dy="30">way: pause storms</tspan>
      <tspan x="215" dy="30">and deadlocks</tspan>
    </text>
  </g>

  

  <g transform="translate(1080, 535)">
    <rect x="0" y="0" width="480" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(404, 20)">
      <rect x="0" y="0" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 8 21 L 20 8 L 36 34 L 48 21" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="8" cy="21" r="3" fill="#207448"/>
      <circle cx="48" cy="21" r="3" fill="#207448"/>
    </g>
    <text x="26" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
      InfiniBand: credit-based flow
      <tspan x="26" dy="31">control per virtual lane,</tspan>
      <tspan x="26" dy="31">lossless by construction;</tspan>
      <tspan x="26" dy="31">LIDs and GIDs replace</tspan>
      <tspan x="26" dy="31">MACs and IPs; the Subnet</tspan>
      <tspan x="26" dy="31">Manager programs</tspan>
      <tspan x="26" dy="31">forwarding tables</tspan>
    </text>
  </g>

  

  <g transform="translate(60, 825)">
    <rect x="0" y="0" width="1500" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="14" y="14" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="0" x2="8" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="48" y1="0" x2="48" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="8" y1="48" x2="8" y2="56" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="3"/>
      <line x1="48" y1="48" x2="48" y2="56" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="116" y="52" font-family="sans-serif" font-size="24" fill="#303a36">
      Rail-optimised: one NIC per GPU, often its own subnet, VLAN or VRF; 8 x 400G back end;
      <tspan x="116" dy="40">a single x4 link at 100G instead of 400G slows the whole job because collectives move</tspan>
      <tspan x="116" dy="40">at the speed of the slowest participant</tspan>
    </text>
  </g>

  

  <rect x="60" y="1015" width="1500" height="90" rx="10" fill="#207448"/>
  <text x="810" y="1070" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Treat a PFC change on one switch as a change to the whole fabric
  </text>
</svg>