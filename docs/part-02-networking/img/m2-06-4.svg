<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>A diagnostic flow</title>
  <desc>Flowchart diagram for diagnosing TCP network symptoms and performance limits</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 7 L 1 12 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 7 L 1 12 z" fill="#db8129" />
    </marker>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#207448" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1260" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A diagnostic flow</text>

  
  
  
  <g transform="translate(630, 80)">
    <rect width="340" height="65" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <path d="M 24 33 L 38 33 L 44 20 L 52 46 L 58 28 L 64 36 L 76 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="43" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">TCP symptom</text>
  </g>

  
  <path d="M 800 145 L 800 196" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  
  
  <g transform="translate(620, 200)">
    <rect width="360" height="75" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3.5" filter="url(#shadow)"/>
    
    <circle cx="45" cy="37" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 39 37 L 51 37 M 45 31 L 45 43" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="200" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Can connect?</text>
  </g>

  
  
  

  
  <path d="M 620 237 L 290 237 L 290 336" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(400, 218)">
    <rect width="120" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="60" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">refused</text>
  </g>

  
  <path d="M 980 237 L 1310 237 L 1310 336" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080, 218)">
    <rect width="120" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="60" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">timeout</text>
  </g>

  
  <path d="M 800 275 L 800 361" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <g transform="translate(735, 300)">
    <rect width="130" height="38" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <text x="65" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">connects</text>
  </g>

  
  
  

  
  <g transform="translate(50, 340)">
    <rect width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="20" y="24" width="40" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="38" x2="36" y2="38" stroke="#207448" stroke-width="3"/>
    <circle cx="50" cy="38" r="3" fill="#207448"/>
    <line x1="16" y1="60" x2="64" y2="60" stroke="#207448" stroke-width="3"/>
    <line x1="40" y1="52" x2="40" y2="68" stroke="#207448" stroke-width="3"/>
    
    <text x="75" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No listener / reject rule:</text>
    <text x="75" y="80" font-family="monospace" font-size="24" fill="#303a36">ss -tlnp on server;</text>
    <text x="75" y="114" font-family="sans-serif" font-size="24" fill="#303a36">check bind address</text>
    <text x="75" y="142" font-family="monospace" font-size="24" fill="#303a36">(127.0.0.1 vs 0.0.0.0)</text>
  </g>

  
  <g transform="translate(600, 365)">
    <rect width="400" height="90" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3.5" filter="url(#shadow)"/>
    
    <path d="M 25 55 A 22 22 0 1 1 65 55" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="45" y1="55" x2="35" y2="40" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <text x="225" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Throughput low?</text>
  </g>

  
  <g transform="translate(1070, 340)">
    <rect width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="42" cy="42" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="42,28 42,42 52,42" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="75" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">SYN dropped:</text>
    <text x="240" y="42" font-family="monospace" font-size="24" fill="#303a36">tcpdump</text>
    <text x="345" y="42" font-family="sans-serif" font-size="24" fill="#303a36">both ends;</text>
    <text x="75" y="78" font-family="sans-serif" font-size="24" fill="#303a36">routing, SG/NSG/firewall,</text>
    <text x="75" y="114" font-family="monospace" font-size="24" fill="#303a36">rp_filter</text>
    <text x="195" y="114" font-family="sans-serif" font-size="24" fill="#303a36">, listen queue</text>
    <text x="75" y="142" font-family="monospace" font-size="24" fill="#303a36">(nstat)</text>
  </g>

  
  
  

  
  <path d="M 600 410 L 290 410 L 290 546" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(385, 391)">
    <rect width="110" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="55" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">resets</text>
  </g>

  
  <path d="M 1000 410 L 1310 410 L 1310 546" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1015, 391)">
    <rect width="280" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no, but latency spikes</text>
  </g>

  
  <path d="M 800 455 L 800 556" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <g transform="translate(755, 485)">
    <rect width="90" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="45" y="26" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">yes</text>
  </g>

  
  
  

  
  <g transform="translate(50, 550)">
    <rect width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 22 40 A 18 18 0 1 1 45 55" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="18,30 22,42 34,40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="25" x2="45" y2="40" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="75" y="42" font-family="sans-serif" font-size="24" fill="#303a36">Idle timeouts on LB/NAT/firewall;</text>
    <text x="75" y="78" font-family="sans-serif" font-size="24" fill="#303a36">app crash; keepalives;</text>
    <text x="75" y="114" font-family="sans-serif" font-size="24" fill="#303a36">RST source IP/TTL in</text>
    <text x="75" y="142" font-family="monospace" font-size="24" fill="#303a36">tcpdump</text>
  </g>

  
  <g transform="translate(580, 560)">
    <rect width="440" height="90" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3.5" filter="url(#shadow)"/>
    
    <rect x="22" y="24" width="44" height="42" rx="6" fill="#207448"/>
    <polyline points="32,38 40,45 32,52" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="52" x2="55" y2="52" stroke="#ffffff" stroke-width="2.5"/>
    <text x="245" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan font-family="monospace">ss -ti:</tspan> which limit?</text>
  </g>

  
  <g transform="translate(1070, 550)">
    <rect width="480" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <polyline points="18,65 30,65 38,25 46,72 54,65 66,65" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="75" y="40" font-family="sans-serif" font-size="24" fill="#303a36">Nagle+delayed ACK, RTO events,</text>
    <text x="75" y="74" font-family="sans-serif" font-size="24" fill="#303a36">accept queue, GC pauses,</text>
    <text x="75" y="108" font-family="sans-serif" font-size="24" fill="#303a36">conntrack, bufferbloat</text>
    <text x="75" y="140" font-family="monospace" font-size="24" fill="#303a36">(tcp_notsent_lowat)</text>
  </g>

  
  
  

  
  <path d="M 580 605 L 320 605 L 320 826" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(145, 715)">
    <rect width="350" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cwnd_limited / retrans</text>
  </g>

  
  <path d="M 1020 605 L 1280 605 L 1280 826" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1085, 715)">
    <rect width="390" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="195" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">rwnd_limited / zero window</text>
  </g>

  
  
  <path d="M 760 650 L 760 1005 L 400 1005 L 400 1046" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(470, 984)">
    <rect width="220" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sndbuf_limited</text>
  </g>

  
  <path d="M 840 650 L 840 1005 L 1200 1005 L 1200 1046" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(910, 984)">
    <rect width="180" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="28" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">app_limited</text>
  </g>

  
  
  

  
  <g transform="translate(60, 830)">
    <rect width="680" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 38 30 L 58 66 L 18 66 Z" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="38" y1="44" x2="38" y2="54" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="60" r="1.5" fill="#db8129"/>
    
    <text x="75" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Loss/congestion:</text>
    <text x="275" y="44" font-family="sans-serif" font-size="24" fill="#303a36">path counters,</text>
    <text x="75" y="80" font-family="sans-serif" font-size="24" fill="#303a36">drops at NIC/switch, CC algorithm, ECN</text>
  </g>

  
  <g transform="translate(860, 830)">
    <rect width="680" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="22" y="32" width="38" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="22" y1="44" x2="60" y2="44" stroke="#207448" stroke-width="2"/>
    <circle cx="41" cy="56" r="6" fill="none" stroke="#db8129" stroke-width="2.5"/>
    
    <text x="75" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Receiver app slow or buffer too small:</text>
    <text x="75" y="80" font-family="sans-serif" font-size="24" fill="#303a36">app profile,</text>
    <text x="215" y="80" font-family="monospace" font-size="24" fill="#303a36">rmem</text>
  </g>

  
  <g transform="translate(60, 1050)">
    <rect width="680" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="20" y="38" width="42" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="50" x2="44" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <polyline points="40,44 46,50 40,56" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="75" y="55" font-family="sans-serif" font-size="24" fill="#303a36">Increase</text>
    <text x="180" y="55" font-family="monospace" font-size="24" fill="#303a36">wmem</text>
    <text x="245" y="55" font-family="sans-serif" font-size="24" fill="#303a36">or fix app write pattern</text>
  </g>

  
  <g transform="translate(860, 1050)">
    <rect width="680" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="22" y="36" width="38" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="31" cy="44" r="2" fill="#207448"/>
    <circle cx="39" cy="44" r="2" fill="#207448"/>
    <circle cx="47" cy="44" r="2" fill="#207448"/>
    
    <text x="75" y="55" font-family="sans-serif" font-size="24" fill="#303a36">Application not sending enough: look at the app</text>
  </g>
</svg>