<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Inside an X.509 certificate: the fields that matter and what each is checked for</title>
  <desc>Infographic showing the structure of an X.509 certificate card, its key fields, the corresponding validation checks, command strip, analogy, and failure takeaway.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Inside an X.509 certificate:</text>
  <text x="800" y="96" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">the fields that matter and what each is checked for</text>

  
  <g transform="translate(40, 116)">
    <rect x="0" y="0" width="1520" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(20, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="24" height="28" rx="3" />
      <circle cx="14" cy="14" r="5" />
      <line x1="8" y1="23" x2="20" y2="23" />
    </g>
    <text x="64" y="32" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">a passport: a trusted office vouches that this photograph belongs to this name</text>
  </g>

  
  <g transform="translate(40, 178)">
    <rect x="0" y="0" width="640" height="716" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="10" r="6" />
        <path d="M 6 26 C 6 19 11 18 16 18 C 21 18 26 19 26 26" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Subject: who it is for</text>
    </g>

    
    <g transform="translate(14, 66)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="16" r="6" />
        <path d="M 16 16 L 28 16 M 24 16 L 24 22 M 28 16 L 28 20" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Public key</text>
    </g>

    
    <g transform="translate(14, 120)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="12" r="8" />
        <path d="M 11 19 L 8 28 L 16 24 L 24 28 L 21 19" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Issuer: the CA that signed it</text>
    </g>

    
    <g transform="translate(14, 174)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="24" height="24" rx="4" />
        <line x1="10" y1="12" x2="22" y2="12" />
        <line x1="10" y1="18" x2="18" y2="18" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Authority and subject key identifiers</text>
    </g>

    
    <g transform="translate(14, 228)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 24 L 20 10 L 26 16 L 12 30 L 6 30 Z" />
        <line x1="18" y1="12" x2="24" y2="18" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Issuer's signature</text>
    </g>

    
    <g transform="translate(14, 282)">
      <rect x="0" y="0" width="612" height="74" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 20)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="28" height="24" rx="3" />
        <line x1="2" y1="11" x2="30" y2="11" />
        <line x1="8" y1="1" x2="8" y2="5" />
        <line x1="24" y1="1" x2="24" y2="5" />
      </g>
      <text x="56" y="30" font-family="sans-serif" font-size="24" fill="#303a36">Validity: notBefore and notAfter,</text>
      <text x="56" y="58" font-family="sans-serif" font-size="24" fill="#303a36">checked against the client's own clock</text>
    </g>

    
    <g transform="translate(14, 362)">
      <rect x="0" y="0" width="612" height="74" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 20)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="8" x2="28" y2="8" />
        <circle cx="12" cy="8" r="3" fill="#207448" />
        <line x1="4" y1="22" x2="28" y2="22" />
        <circle cx="20" cy="22" r="3" fill="#207448" />
      </g>
      <text x="56" y="30" font-family="sans-serif" font-size="24" fill="#303a36">Key usage and extended key usage:</text>
      <text x="56" y="58" font-family="sans-serif" font-size="24" fill="#303a36">serverAuth, clientAuth</text>
    </g>

    
    <g transform="translate(14, 442)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="3" width="8" height="8" rx="1" />
        <line x1="16" y1="11" x2="16" y2="18" />
        <line x1="8" y1="18" x2="24" y2="18" />
        <rect x="4" y="18" width="8" height="8" rx="1" />
        <rect x="20" y="18" width="8" height="8" rx="1" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">Basic constraints: whether this is a CA</text>
    </g>

    
    <g transform="translate(14, 496)">
      <rect x="0" y="0" width="612" height="152" rx="6" fill="#fff7ed" stroke="#db8129" stroke-width="2.5" />
      
      <g transform="translate(12, 58)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="13" />
        <line x1="3" y1="16" x2="29" y2="16" />
        <path d="M 16 3 C 21 8 23 12 23 16 C 23 20 21 24 16 29 C 11 24 9 20 9 16 C 9 12 11 8 16 3 Z" />
      </g>
      <text x="56" y="30" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Subject Alternative Names (SAN):</text>
      <text x="56" y="60" font-family="sans-serif" font-size="24" fill="#303a36">the DNS names or IPs the certificate is</text>
      <text x="56" y="90" font-family="sans-serif" font-size="24" fill="#303a36">valid for; browsers and modern libraries</text>
      <text x="56" y="120" font-family="sans-serif" font-size="24" fill="#303a36">ignore the old CN field</text>
    </g>

    
    <g transform="translate(14, 654)">
      <rect x="0" y="0" width="612" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
      
      <g transform="translate(12, 8)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="16" cy="7" rx="10" ry="4" />
        <path d="M 6 7 L 6 17 C 6 20 10 21 16 21 C 22 21 26 20 26 17 L 26 7" />
        <path d="M 6 12 C 6 15 10 16 16 16 C 22 16 26 15 26 12" />
      </g>
      <text x="56" y="32" font-family="sans-serif" font-size="24" fill="#303a36">CRL and OCSP URLs</text>
    </g>
  </g>

  
  
  <path d="M 680 325 L 848 325" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 680 430 L 848 430" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 680 497 L 848 497" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 680 577 L 848 577" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 680 750 L 848 750" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 680 856 L 848 856" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(850, 0)">
    
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="710" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 27)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="16" width="24" height="14" rx="7" transform="rotate(-45 16 23)" />
        <rect x="24" y="36" width="24" height="14" rx="7" transform="rotate(-45 36 43)" />
        <line x1="22" y1="29" x2="30" y2="37" />
      </g>
      <text x="96" y="36" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">chain built from leaf to trusted root</text>
      <text x="96" y="68" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">using the intermediates</text>
      <text x="96" y="98" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the server presents</text>
    </g>

    
    <g transform="translate(0, 396)">
      <rect x="0" y="0" width="710" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 42 L 32 18 L 44 30 L 20 54 L 8 54 Z" />
        <line x1="28" y1="22" x2="40" y2="34" />
      </g>
      <text x="96" y="44" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">each signature</text>
    </g>

    
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="710" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="10" width="44" height="40" rx="5" />
        <line x1="6" y1="22" x2="50" y2="22" />
        <line x1="18" y1="4" x2="18" y2="14" />
        <line x1="38" y1="4" x2="38" y2="14" />
      </g>
      <text x="96" y="44" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">validity dates</text>
    </g>

    
    <g transform="translate(0, 564)">
      <rect x="0" y="0" width="710" height="74" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 9)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="16" x2="50" y2="16" />
        <circle cx="20" cy="16" r="6" fill="#207448" />
        <line x1="6" y1="40" x2="50" y2="40" />
        <circle cx="36" cy="40" r="6" fill="#207448" />
      </g>
      <text x="96" y="46" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">key usage and basic constraints</text>
    </g>

    
    <g transform="translate(0, 705)">
      <rect x="0" y="0" width="710" height="90" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="2.5" />
      
      <g transform="translate(24, 17)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="22" />
        <line x1="6" y1="28" x2="50" y2="28" />
        <path d="M 28 6 C 37 14 41 21 41 28 C 41 35 37 42 28 50 C 19 42 15 35 15 28 C 15 21 19 14 28 6 Z" />
      </g>
      <text x="96" y="54" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">name against the SAN</text>
    </g>

    
    <g transform="translate(0, 822)">
      <rect x="0" y="0" width="710" height="68" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(24, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 48 14 L 48 28 C 48 42 38 50 28 54 C 18 50 8 42 8 28 L 8 14 Z" />
        <polyline points="20 28 26 34 38 20" />
      </g>
      <text x="96" y="44" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">revocation status if enabled</text>
    </g>
  </g>

  
  <g transform="translate(40, 912)">
    <rect x="0" y="0" width="1520" height="194" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="732" height="74" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(14, 18)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="34" height="34" rx="4" />
        <polyline points="9 14 16 19 9 24" />
        <line x1="19" y1="26" x2="29" y2="26" />
      </g>
      <text x="64" y="45" font-family="monospace" font-size="24" fill="#303a36">openssl x509 -in cert.pem -noout -text</text>
    </g>

    
    <g transform="translate(768, 14)">
      <rect x="0" y="0" width="734" height="110" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(14, 36)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="34" height="34" rx="4" />
        <polyline points="9 14 16 19 9 24" />
        <line x1="19" y1="26" x2="29" y2="26" />
      </g>
      <text x="64" y="36" font-family="monospace" font-size="24" fill="#303a36">openssl x509 -noout -subject -issuer -dates</text>
      <text x="64" y="66" font-family="monospace" font-size="24" fill="#303a36">-ext subjectAltName,basicConstraints,</text>
      <text x="64" y="96" font-family="monospace" font-size="24" fill="#303a36">keyUsage,extendedKeyUsage</text>
    </g>

    
    <g transform="translate(18, 102)">
      <rect x="0" y="0" width="732" height="78" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(14, 20)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="34" height="34" rx="4" />
        <polyline points="9 14 16 19 9 24" />
        <line x1="19" y1="26" x2="29" y2="26" />
      </g>
      <text x="64" y="34" font-family="monospace" font-size="24" fill="#303a36">openssl x509 -noout -checkend 2592000</text>
      <text x="64" y="64" font-family="monospace" font-size="24" fill="#303a36">(non-zero exit if it expires within 30 days)</text>
    </g>

    
    <g transform="translate(768, 134)">
      <rect x="0" y="0" width="734" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      
      <g transform="translate(14, 5)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="34" height="34" rx="4" />
        <polyline points="9 14 16 19 9 24" />
        <line x1="19" y1="26" x2="29" y2="26" />
      </g>
      <text x="64" y="32" font-family="monospace" font-size="24" fill="#303a36">openssl verify -CAfile ca.pem -untrusted intermediate.pem leaf.pem</text>
    </g>
  </g>

  
  <g transform="translate(40, 1122)">
    <rect x="0" y="0" width="1520" height="52" rx="8" fill="#207448" />
    <text x="760" y="35" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each validation step can fail for a different reason</text>
  </g>
</svg>