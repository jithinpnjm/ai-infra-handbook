<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Inside an X.509 certificate: the fields that matter and what each is checked for</title>
  <desc>Visual explanation of X.509 certificate fields, verification checks, and OpenSSL validation commands.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="bold" fill="#303a36" text-anchor="middle">Inside an X.509 certificate: the fields that matter</text>
  <text x="800" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="bold" fill="#303a36" text-anchor="middle">and what each is checked for</text>

  
  <rect x="230" y="120" width="1140" height="46" rx="23" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-style="italic" fill="#207448" text-anchor="middle">a passport: a trusted office vouches that this photograph belongs to this name</text>

  
  <rect x="50" y="190" width="820" height="840" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="65" y="205" width="790" height="60" rx="8" fill="#f9fbf9" stroke="#ccdccd" stroke-width="1.5"/>
  <text x="85" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Subject: who it is for</text>

  
  <rect x="65" y="275" width="790" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Issuer: the CA that signed it</text>

  
  <rect x="65" y="345" width="790" height="82" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">Validity: notBefore and notAfter, checked against the</tspan>
    <tspan x="85" dy="32">client's own clock</tspan>
  </text>

  
  <rect x="65" y="437" width="790" height="55" rx="8" fill="#f9fbf9" stroke="#ccdccd" stroke-width="1.5"/>
  <text x="85" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Public key</text>

  
  <rect x="65" y="502" width="790" height="135" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <text x="85" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-weight="bold" fill="#db8129">Subject Alternative Names (SAN): the DNS names or IPs</tspan>
    <tspan x="85" dy="34">the certificate is valid for; browsers and modern libraries</tspan>
    <tspan x="85" dy="34">ignore the old CN field</tspan>
  </text>

  
  <rect x="65" y="647" width="790" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0">Key usage and extended key usage: serverAuth,</tspan>
    <tspan x="85" dy="32">clientAuth</tspan>
  </text>

  
  <rect x="65" y="735" width="790" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="773" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Basic constraints: whether this is a CA</text>

  
  <rect x="65" y="805" width="790" height="60" rx="8" fill="#f9fbf9" stroke="#ccdccd" stroke-width="1.5"/>
  <text x="85" y="843" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Authority and subject key identifiers</text>

  
  <rect x="65" y="875" width="790" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="913" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">CRL and OCSP URLs</text>

  
  <rect x="65" y="945" width="790" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="85" y="983" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Issuer's signature</text>

  
  
  <rect x="1030" y="255" width="520" height="98" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1050" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1050" dy="0">chain built from leaf to trusted root</tspan>
    <tspan x="1050" dy="32">using the intermediates the server presents</tspan>
  </text>

  
  <rect x="1030" y="365" width="520" height="62" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1050" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">validity dates</text>

  
  <rect x="1030" y="535" width="520" height="70" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <text x="1050" y="579" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">name against the SAN</text>

  
  <rect x="1030" y="695" width="520" height="62" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1050" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">key usage and basic constraints</text>

  
  <rect x="1030" y="874" width="520" height="62" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1050" y="914" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">revocation status if enabled</text>

  
  <rect x="1030" y="944" width="520" height="62" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="1050" y="984" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">each signature</text>

  
  
  <line x1="855" y1="304" x2="1016" y2="304" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <line x1="855" y1="396" x2="1016" y2="396" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <line x1="855" y1="570" x2="1016" y2="570" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>

  
  <line x1="855" y1="726" x2="1016" y2="726" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <line x1="855" y1="905" x2="1016" y2="905" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <line x1="855" y1="975" x2="1016" y2="975" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  
  <rect x="50" y="1065" width="620" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="75" y="1110" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">openssl x509 -in cert.pem</tspan>
    <tspan x="75" dy="38">-noout -text</tspan>
  </text>

  
  <rect x="690" y="1065" width="860" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="715" y="1110" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="715" dy="0">openssl x509 -noout -subject -issuer -dates -ext</tspan>
    <tspan x="715" dy="38">subjectAltName,basicConstraints,keyUsage,extendedKeyUsage</tspan>
  </text>

  
  <rect x="50" y="1195" width="620" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="75" y="1240" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">openssl x509 -noout -checkend 2592000</tspan>
    <tspan x="75" dy="38" font-family="system-ui, -apple-system, sans-serif">(non-zero exit if it expires within 30 days)</tspan>
  </text>

  
  <rect x="690" y="1195" width="860" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="715" y="1240" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="715" dy="0">openssl verify -CAfile ca.pem</tspan>
    <tspan x="715" dy="38">-untrusted intermediate.pem leaf.pem</tspan>
  </text>

  
  <rect x="50" y="1340" width="1500" height="74" rx="12" fill="#207448"/>
  <text x="800" y="1386" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Each validation step can fail for a different reason</text>
</svg>