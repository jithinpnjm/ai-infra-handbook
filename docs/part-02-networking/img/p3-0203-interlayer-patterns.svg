<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
  <title>Four ways to map one identifier to another between layers</title>
  <desc>Visual explanation of four patterns for identifier mapping between network layers: well-known mapping, mapping database, direct peer advertisement, and identifier calculation.</desc>

  
  <rect width="1600" height="1010" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Four ways to map one identifier</text>
  <text x="800" y="125" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">to another between layers</text>

  
  <g>
    <rect x="40" y="165" width="370" height="565" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <circle cx="225" cy="225" r="28" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="225" y1="211" x2="225" y2="231" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="225" cy="241" r="3" fill="#207448"/>

    
    <text x="225" y="300" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">The problem:</text>
    <text x="225" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">your program says</text>
    <text x="225" y="388" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">send this to</text>
    <text x="225" y="432" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">203.0.113.12,</text>
    <text x="225" y="476" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">but the wire only</text>
    <text x="225" y="516" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">understands</text>
    <text x="225" y="560" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">MAC addresses</text>
  </g>

  
  <g>
    <rect x="440" y="165" width="540" height="265" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <rect x="470" y="195" width="42" height="52" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="480" y1="210" x2="502" y2="210" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="480" y1="222" x2="502" y2="222" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="480" y1="234" x2="496" y2="234" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

    
    <text x="532" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Well-known or</text>
    <text x="532" y="253" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">manual mapping</text>

    
    <text x="470" y="325" font-family="sans-serif" font-size="24" fill="#303a36">port numbers in</text>
    <text x="470" y="365" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">/etc/services</text>
  </g>

  
  <g>
    <rect x="1010" y="165" width="550" height="265" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <ellipse cx="1045" cy="205" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 1023 205 v 32 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -32" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 1023 221 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8" fill="none" stroke="#207448" stroke-width="4"/>

    
    <text x="1085" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Mapping database</text>
    <text x="1085" y="253" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">with a query protocol</text>

    
    <text x="1035" y="315" font-family="sans-serif" font-size="24" fill="#303a36">DNS for names,</text>
    <text x="1035" y="352" font-family="sans-serif" font-size="24" fill="#303a36">DHCP for assignment</text>
    <text x="1035" y="389" font-family="sans-serif" font-size="24" fill="#303a36">(chapters 2.8 and 2.9)</text>
  </g>

  
  <g>
    <rect x="440" y="465" width="540" height="265" rx="14" fill="#fdf7f0" stroke="#db8129" stroke-width="4"/>

    
    <circle cx="468" cy="520" r="10" fill="none" stroke="#db8129" stroke-width="4"/>
    <circle cx="512" cy="520" r="10" fill="none" stroke="#db8129" stroke-width="4"/>
    <path d="M 482 512 a 10 10 0 0 1 0 16" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <path d="M 498 512 a 10 10 0 0 0 0 16" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>

    
    <text x="532" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Peers advertise the</text>
    <text x="532" y="553" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">mapping directly</text>

    
    <text x="470" y="625" font-family="sans-serif" font-size="24" fill="#303a36">ARP and IPv6 Neighbor</text>
    <text x="470" y="665" font-family="sans-serif" font-size="24" fill="#303a36">Discovery; this chapter</text>
  </g>

  
  <g>
    <rect x="1010" y="465" width="550" height="265" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <rect x="1025" y="495" width="40" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1033" y1="507" x2="1057" y2="507" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1035" cy="521" r="2.5" fill="#207448"/>
    <circle cx="1045" cy="521" r="2.5" fill="#207448"/>
    <circle cx="1055" cy="521" r="2.5" fill="#207448"/>
    <circle cx="1035" cy="533" r="2.5" fill="#207448"/>
    <circle cx="1045" cy="533" r="2.5" fill="#207448"/>
    <circle cx="1055" cy="533" r="2.5" fill="#207448"/>

    
    <text x="1085" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Calculate one identifier</text>
    <text x="1085" y="553" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">from the other</text>

    
    <text x="1035" y="615" font-family="sans-serif" font-size="24" fill="#303a36">an IPv6 link-local address</text>
    <text x="1035" y="652" font-family="sans-serif" font-size="24" fill="#303a36">derived from a MAC; SLAAC;</text>
    <text x="1035" y="689" font-family="sans-serif" font-size="24" fill="#303a36">this chapter</text>
  </g>

  
  <g>
    <rect x="40" y="760" width="1520" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <circle cx="85" cy="815" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 75 808 h 20 l -6 -6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 95 822 h -20 l 6 6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    
    <text x="135" y="805" font-family="sans-serif" font-size="24" fill="#303a36">RARP turns a MAC back into an IP address; some diskless workstations used it;</text>
    <text x="135" y="843" font-family="sans-serif" font-size="24" fill="#303a36">DHCP replaced most of that job, so RARP is rare today</text>
  </g>

  
  <g>
    <rect x="40" y="895" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="800" y="942" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">This chapter covers the third and fourth patterns at the boundary of layers 2 and 3</text>
  </g>
</svg>