<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110">
  <title>Socket state counts as symptoms</title>
  <desc>Infographic explaining socket state counts, diagnostic readings, TIME_WAIT details, and protocol hygiene.</desc>

  
  <rect width="1600" height="1110" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Socket state counts as symptoms</text>

  
  <rect x="40" y="105" width="1520" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="141" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">LISTEN, SYN-SENT, SYN-RECV, ESTAB, FIN-WAIT-1/2, CLOSE-WAIT, LAST-ACK, TIME-WAIT, CLOSING</text>

  
  <rect x="40" y="180" width="960" height="795" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="40" y="180" width="960" height="65" rx="12" fill="#d8e8dc" stroke="#207448" stroke-width="2"/>
  <rect x="65" y="198" width="38" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M73 207 L80 212 L73 217" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="84" y1="217" x2="94" y2="217" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="120" y="222" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ss -tan state &lt;state&gt;</text>
  <text x="680" y="222" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ss -s</text>

  
  <rect x="55" y="260" width="930" height="85" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="75" y="312" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">many SYN-SENT</text>
  <g transform="translate(340, 282)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#207448"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#207448"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#207448"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#207448"/>
  </g>
  <text x="410" y="312" font-family="sans-serif" font-size="24" fill="#303a36">you cannot reach the remote service</text>

  
  <rect x="55" y="355" width="930" height="85" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="75" y="407" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">many SYN-RECV</text>
  <g transform="translate(340, 377)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#207448"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#207448"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#207448"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#207448"/>
  </g>
  <text x="410" y="407" font-family="sans-serif" font-size="24" fill="#303a36">a SYN flood or a slow handshake</text>

  
  <rect x="55" y="450" width="930" height="95" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="75" y="490" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="75" dy="0">many ESTAB</tspan>
    <tspan x="75" dy="32">with high Recv-Q</tspan>
  </text>
  <g transform="translate(340, 477)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#207448"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#207448"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#207448"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#207448"/>
  </g>
  <text x="410" y="507" font-family="sans-serif" font-size="24" fill="#303a36">the local application is not reading</text>

  
  <rect x="55" y="555" width="930" height="205" rx="8" fill="#fff6ee" stroke="#db8129" stroke-width="3"/>
  <text x="75" y="662" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">many CLOSE-WAIT</text>
  <g transform="translate(340, 637)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#db8129"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#db8129"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#db8129"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#db8129"/>
  </g>
  <text x="410" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="410" dy="0">a leak in your application: the peer</tspan>
    <tspan x="410" dy="32">has closed but your code never called</tspan>
    <tspan x="410" dy="32">close(); look at the application code</tspan>
    <tspan x="410" dy="32">before you touch any kernel setting</tspan>
  </text>

  
  <rect x="55" y="770" width="930" height="85" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="75" y="822" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">many FIN-WAIT-2</text>
  <g transform="translate(340, 792)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#207448"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#207448"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#207448"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#207448"/>
  </g>
  <text x="410" y="822" font-family="sans-serif" font-size="24" fill="#303a36">the remote side is not closing its end</text>

  
  <rect x="55" y="865" width="930" height="85" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="75" y="917" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">many TIME-WAIT</text>
  <g transform="translate(340, 887)">
    <rect x="0" y="24" width="7" height="16" rx="2" fill="#207448"/>
    <rect x="11" y="14" width="7" height="26" rx="2" fill="#207448"/>
    <rect x="22" y="4" width="7" height="36" rx="2" fill="#207448"/>
    <rect x="33" y="18" width="7" height="22" rx="2" fill="#207448"/>
  </g>
  <text x="410" y="917" font-family="sans-serif" font-size="24" fill="#303a36">normal churn from short connections</text>

  
  <rect x="1030" y="180" width="530" height="795" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1060, 195)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="20,10 20,20 28,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1115" y="223" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">TIME_WAIT in detail</text>

  
  <rect x="1050" y="260" width="490" height="110" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="1075" y="297" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">the active closer waits</tspan>
    <tspan x="1075" dy="30">2 x MSL, 60 seconds on Linux,</tspan>
    <tspan x="1075" dy="30">hard-coded</tspan>
  </text>

  
  <rect x="1050" y="385" width="490" height="110" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="1075" y="422" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">absorbs delayed duplicates</tspan>
    <tspan x="1075" dy="30">and lets the closer resend</tspan>
    <tspan x="1075" dy="30">its last ACK</tspan>
  </text>

  
  <rect x="1050" y="510" width="490" height="145" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="1075" y="545" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">a problem only for a client</tspan>
    <tspan x="1075" dy="30">making many short connections</tspan>
    <tspan x="1075" dy="30">to one destination (ports run</tspan>
    <tspan x="1075" dy="30">out) or clients behind NAT</tspan>
  </text>

  
  <rect x="1050" y="670" width="490" height="120" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="1075" y="705" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">half-close: shutdown(SHUT_WR)</tspan>
    <tspan x="1075" dy="30">sends a FIN but the side</tspan>
    <tspan x="1075" dy="30">can still read</tspan>
  </text>

  
  <rect x="1050" y="805" width="490" height="120" rx="8" fill="#ffffff" stroke="#c3dac8" stroke-width="1.5"/>
  <text x="1075" y="705">
  </text>
  <text x="1075" y="842" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1075" dy="0">a RST ends the connection at</tspan>
    <tspan x="1075" dy="30">once and throws away</tspan>
    <tspan x="1075" dy="30">unsent data</tspan>
  </text>

  
  <rect x="40" y="995" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="1042" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">TIME_WAIT is protocol hygiene, and CLOSE_WAIT that keeps growing is a leak</text>
</svg>