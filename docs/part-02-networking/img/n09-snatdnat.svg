<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>SNAT versus DNAT</title>
  <desc>Visual comparison of SNAT/PAT outbound translation and DNAT inbound translation flows, including static NAT and key rules.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="50" y="86" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">SNAT versus DNAT</text>

  
  <rect x="1055" y="42" width="495" height="64" rx="10" fill="#db8129"/>
  
  <path d="M 1076 58 L 1092 50 L 1108 58 C 1108 73 1092 84 1092 84 C 1092 84 1076 73 1076 58 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <line x1="1092" y1="60" x2="1092" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1092" cy="76" r="1.5" fill="#ffffff"/>
  <text x="1122" y="84" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">NAT is not a firewall</text>

  
  <rect x="50" y="125" width="1500" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="80" y="168" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">SNAT / PAT (outbound)</text>

  
  <rect x="80" y="190" width="330" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="221" y="210" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 237 244 L 237 254 M 227 254 L 263 254" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="229" y1="236" x2="261" y2="236" stroke="#207448" stroke-width="2"/>
  <text x="245" y="315" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">private host</text>

  
  <line x1="410" y1="300" x2="488" y2="300" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="490" y="190" width="620" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="772" y="206" width="56" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 784 224 L 816 224 M 810 218 L 816 224 L 810 230" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="786" cy="214" r="2" fill="#207448"/>
  <circle cx="794" cy="214" r="2" fill="#207448"/>
  <circle cx="802" cy="214" r="2" fill="#207448"/>
  <text x="800" y="290" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NAT box</text>
  <text x="800" y="338" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the NAT box rewrites the SOURCE address</text>
  <text x="800" y="375" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(and translated source port for PAT)</text>

  
  <line x1="1110" y1="300" x2="1188" y2="300" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1190" y="190" width="330" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1332 248 C 1324 248 1318 242 1318 234 C 1318 227 1323 222 1330 221 C 1332 213 1340 208 1348 208 C 1356 208 1362 212 1365 218 C 1368 216 1372 215 1376 215 C 1384 215 1391 221 1391 230 C 1391 232 1390 233 1389 235 C 1393 238 1395 242 1395 248 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="1355" y="315" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Internet</text>

  
  <rect x="80" y="425" width="1440" height="48" rx="8" fill="#ffffff" stroke="#b0d2be" stroke-width="1.5"/>
  <text x="110" y="457" font-family="sans-serif" font-size="24" fill="#303a36">use: egress to the Internet, <tspan font-family="monospace, sans-serif">MASQUERADE</tspan>, Cloud NAT</text>

  
  <rect x="50" y="510" width="1500" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="80" y="553" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">DNAT (inbound)</text>

  
  <rect x="80" y="575" width="330" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="223" y="595" width="44" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 215 623 L 275 623" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="245" y="682" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">client from</text>
  <text x="245" y="722" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Internet</text>

  
  <line x1="410" y1="685" x2="488" y2="685" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="490" y="575" width="620" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="772" y="591" width="56" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
  <path d="M 784 609 L 816 609 M 810 603 L 816 609 L 810 615" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="786" cy="599" r="2" fill="#207448"/>
  <circle cx="794" cy="599" r="2" fill="#207448"/>
  <circle cx="802" cy="599" r="2" fill="#207448"/>
  <text x="800" y="675" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NAT box</text>
  <text x="800" y="735" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the NAT box rewrites the DESTINATION</text>

  
  <line x1="1110" y1="685" x2="1188" y2="685" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1190" y="575" width="330" height="220" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="1331" y="593" width="48" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
  <line x1="1331" y1="608" x2="1379" y2="608" stroke="#207448" stroke-width="2.5"/>
  <line x1="1331" y1="624" x2="1379" y2="624" stroke="#207448" stroke-width="2.5"/>
  <circle cx="1341" cy="601" r="2" fill="#207448"/>
  <circle cx="1341" cy="616" r="2" fill="#207448"/>
  <circle cx="1341" cy="632" r="2" fill="#207448"/>
  <text x="1355" y="700" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">inside server</text>

  
  <rect x="80" y="810" width="1440" height="48" rx="8" fill="#ffffff" stroke="#b0d2be" stroke-width="1.5"/>
  <text x="110" y="842" font-family="sans-serif" font-size="24" fill="#303a36">use: port forwarding, Kubernetes Services, <tspan font-family="monospace, sans-serif">Docker -p</tspan></text>

  
  <rect x="50" y="895" width="1500" height="74" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="70" y="909" width="250" height="46" rx="8" fill="#207448"/>
  <text x="195" y="941" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">static NAT (1:1)</text>
  <text x="345" y="941" font-family="sans-serif" font-size="24" fill="#303a36">fixed inside address to fixed outside address, elastic IPs</text>

  
  <rect x="50" y="989" width="1500" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1033" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">If you see <tspan font-family="monospace, sans-serif">MASQUERADE</tspan> in a rule, you are looking at PAT</text>
</svg>