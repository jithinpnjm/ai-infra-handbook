<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>DNS record types</title>
  <desc>Table of DNS record types, the questions they answer, and example records.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">DNS record types</text>

  
  <rect x="60" y="125" width="1480" height="65" rx="8" fill="#207448"/>
  <text x="165" y="168" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Type</text>
  <text x="505" y="168" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Question it answers</text>
  <text x="1140" y="168" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Example</text>

  
  <rect x="60" y="205" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <rect x="82" y="232" width="36" height="24" rx="3" stroke="#207448" stroke-width="3" fill="none"/>
  <line x1="94" y1="256" x2="106" y2="256" stroke="#207448" stroke-width="3"/>
  <line x1="88" y1="262" x2="112" y2="262" stroke="#207448" stroke-width="3"/>
  <circle cx="90" cy="244" r="2" fill="#207448"/>
  <text x="145" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">A</text>
  <text x="285" y="256" font-family="sans-serif" font-size="26" fill="#303a36">IPv4 address</text>
  <rect x="760" y="219" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="255" font-family="monospace" font-size="24" fill="#303a36">gpu01 IN A 10.20.0.45</text>

  
  <rect x="60" y="300" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <rect x="82" y="324" width="36" height="36" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
  <line x1="82" y1="342" x2="118" y2="342" stroke="#207448" stroke-width="3"/>
  <circle cx="90" cy="333" r="2" fill="#207448"/>
  <circle cx="90" cy="351" r="2" fill="#207448"/>
  <line x1="98" y1="333" x2="110" y2="333" stroke="#207448" stroke-width="2.5"/>
  <line x1="98" y1="351" x2="110" y2="351" stroke="#207448" stroke-width="2.5"/>
  <text x="145" y="353" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">AAAA</text>
  <text x="285" y="351" font-family="sans-serif" font-size="26" fill="#303a36">IPv6 address</text>
  <rect x="760" y="314" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="350" font-family="monospace" font-size="24" fill="#303a36">gpu01 IN AAAA 2001:db8::45</text>

  
  <rect x="60" y="395" width="1480" height="125" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <rect x="82" y="443" width="20" height="24" rx="2" stroke="#207448" stroke-width="2.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 86,471 A 14,14 0 0,1 106,455 L 114,455" stroke="#207448" stroke-width="3" fill="none"/>
  <polyline points="107,448 115,455 107,462" stroke="#207448" stroke-width="3" fill="none"/>
  <text x="145" y="468" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">CNAME</text>
  <text x="285" y="438" font-family="sans-serif" font-size="26" fill="#303a36">alias</text>
  
  <rect x="285" y="458" width="430" height="44" rx="6" fill="#fdf3e8" stroke="#db8129" stroke-width="2"/>
  <text x="500" y="488" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">not allowed at the zone apex</text>
  <rect x="760" y="429" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="465" font-family="monospace" font-size="24" fill="#303a36">www IN CNAME lb.example.com.</text>

  
  <rect x="60" y="530" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <rect x="90" y="552" width="20" height="16" rx="2" stroke="#207448" stroke-width="3" fill="none"/>
  <line x1="100" y1="568" x2="100" y2="578" stroke="#207448" stroke-width="2.5"/>
  <line x1="86" y1="578" x2="114" y2="578" stroke="#207448" stroke-width="2.5"/>
  <line x1="86" y1="578" x2="86" y2="584" stroke="#207448" stroke-width="2.5"/>
  <line x1="114" y1="578" x2="114" y2="584" stroke="#207448" stroke-width="2.5"/>
  <rect x="80" y="584" width="12" height="10" rx="1.5" stroke="#207448" stroke-width="2.5" fill="none"/>
  <rect x="108" y="584" width="12" height="10" rx="1.5" stroke="#207448" stroke-width="2.5" fill="none"/>
  <text x="145" y="583" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">NS</text>
  <text x="285" y="581" font-family="sans-serif" font-size="26" fill="#303a36">name servers</text>
  <rect x="760" y="544" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="580" font-family="monospace" font-size="24" fill="#303a36">example.com. IN NS ns1.example.com.</text>

  
  <rect x="60" y="625" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <rect x="82" y="654" width="36" height="26" rx="3" stroke="#207448" stroke-width="3" fill="none"/>
  <polyline points="83,656 100,669 117,656" stroke="#207448" stroke-width="3" fill="none"/>
  <text x="145" y="678" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">MX</text>
  <text x="285" y="676" font-family="sans-serif" font-size="26" fill="#303a36">mail exchanger</text>
  <rect x="760" y="639" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="675" font-family="monospace" font-size="24" fill="#303a36">IN MX 10 mail.example.com.</text>

  
  <rect x="60" y="720" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <path d="M 112,754 A 14,14 0 0,0 88,758" stroke="#207448" stroke-width="3" fill="none"/>
  <polyline points="86,751 88,758 95,756" stroke="#207448" stroke-width="3" fill="none"/>
  <path d="M 88,770 A 14,14 0 0,0 112,766" stroke="#207448" stroke-width="3" fill="none"/>
  <polyline points="114,773 112,766 105,768" stroke="#207448" stroke-width="3" fill="none"/>
  <text x="145" y="773" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">PTR</text>
  <text x="285" y="771" font-family="sans-serif" font-size="26" fill="#303a36">reverse mapping</text>
  <rect x="760" y="734" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="770" font-family="monospace" font-size="24" fill="#303a36">45.0.20.10.in-addr.arpa. IN PTR gpu01.example.com.</text>

  
  <rect x="60" y="815" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <circle cx="100" cy="857" r="6" stroke="#207448" stroke-width="3" fill="none"/>
  <circle cx="100" cy="857" r="12" stroke="#207448" stroke-width="2" fill="none"/>
  <line x1="100" y1="841" x2="100" y2="845" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="869" x2="100" y2="873" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="84" y1="857" x2="88" y2="857" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="112" y1="857" x2="116" y2="857" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="89" y1="846" x2="92" y2="849" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="108" y1="865" x2="111" y2="868" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="89" y1="868" x2="92" y2="865" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="108" y1="849" x2="111" y2="846" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <text x="145" y="868" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">SRV</text>
  <text x="285" y="866" font-family="sans-serif" font-size="26" fill="#303a36">service location</text>
  <rect x="760" y="829" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="865" font-family="monospace" font-size="24" fill="#303a36">_etcd-server-ssl._tcp IN SRV 0 5 2380 etcd1</text>

  
  <rect x="60" y="910" width="1480" height="85" rx="8" fill="#e8f1ea" stroke="#c8decb" stroke-width="1.5"/>
  
  <path d="M 86,940 L 100,935 L 114,940 C 114,957 100,969 100,969 C 100,969 86,957 86,940 Z" stroke="#207448" stroke-width="3" fill="none"/>
  <path d="M 94,951 L 98,956 L 106,947" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="963" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">CAA</text>
  <text x="285" y="961" font-family="sans-serif" font-size="26" fill="#303a36">which CAs may issue</text>
  <rect x="760" y="924" width="760" height="57" rx="6" fill="#ffffff" stroke="#c8decb" stroke-width="1.5"/>
  <text x="785" y="960" font-family="monospace" font-size="24" fill="#303a36">IN CAA 0 issue &quot;letsencrypt.org&quot;</text>
</svg>