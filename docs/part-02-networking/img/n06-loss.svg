<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Two ways TCP notices loss</title>
  <desc>Visual comparison between TCP RTO slow path and fast retransmit loss recovery mechanisms</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two ways TCP notices loss</text>

  
  <rect x="60" y="100" width="710" height="820" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(90, 120)">
    <circle cx="28" cy="28" r="22" stroke="#207448" stroke-width="4" fill="none"/>
    <polyline points="28,14 28,28 38,28" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="160" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">RTO (slow path)</text>

  
  <rect x="90" y="195" width="650" height="75" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="130" cy="232" r="22" fill="#207448"/>
  <text x="130" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(165, 208)">
    <rect x="2" y="8" width="32" height="24" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M24 20 L38 20 M32 15 L38 20 L32 25" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="225" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">sender sends segment</text>

  
  <line x1="415" y1="270" x2="415" y2="293" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="90" y="295" width="650" height="75" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="130" cy="332" r="22" fill="#207448"/>
  <text x="130" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(165, 308)">
    <circle cx="18" cy="22" r="14" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M18 8 L18 4 M14 4 L22 4 M18 16 L18 22 L23 22" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="225" y="341" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">timer runs</text>

  
  <line x1="415" y1="370" x2="415" y2="393" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="90" y="395" width="650" height="75" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="130" cy="432" r="22" fill="#207448"/>
  <text x="130" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(165, 408)">
    <rect x="4" y="6" width="30" height="26" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M10 12 L28 26 M28 12 L10 26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="225" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">no ACK</text>

  
  <line x1="415" y1="470" x2="415" y2="493" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="90" y="495" width="650" height="115" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="130" cy="552" r="22" fill="#207448"/>
  <text x="130" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(165, 528)">
    <path d="M28 8 A14 14 0 1 0 32 24" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M28 2 L28 10 L36 10" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="225" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="225" dy="0">retransmit and the RTO doubles</tspan>
    <tspan x="225" dy="34">(exponential backoff)</tspan>
  </text>

  
  <rect x="90" y="635" width="650" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(115, 668)">
    <rect x="4" y="4" width="40" height="40" rx="6" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M14 16 L32 16 M14 16 L24 24 L14 32 M14 32 L32 32" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="430" y="702" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">RTO = SRTT + 4 x RTTVAR</text>

  
  <rect x="90" y="775" width="650" height="95" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  
  <g transform="translate(115, 798)">
    <circle cx="24" cy="24" r="20" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M12 28 L36 28 M24 28 L24 14" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="430" y="832" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">minimum 200 ms</text>


  
  <rect x="830" y="100" width="710" height="820" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(860, 120)">
    <path d="M10 14 L24 28 L10 42" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M24 14 L38 28 L24 42" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="920" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Fast retransmit (cheap)</text>

  
  <rect x="860" y="195" width="650" height="175" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="900" cy="282" r="22" fill="#207448"/>
  <text x="900" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(935, 256)">
    <rect x="4" y="14" width="30" height="24" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <path d="M12 8 L38 8 L38 30" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polyline points="12,26 18,32 28,20" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="1000" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1000" dy="0">receiver repeats ACK for</tspan>
    <tspan x="1000" dy="34">last in-order byte</tspan>
    <tspan x="1000" dy="34">(duplicate ACKs)</tspan>
  </text>

  
  <line x1="1185" y1="370" x2="1185" y2="408" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="860" y="410" width="650" height="200" rx="12" fill="#ffffff" stroke="#c4dbc9" stroke-width="2"/>
  <circle cx="900" cy="510" r="22" fill="#207448"/>
  <text x="900" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(935, 484)">
    <rect x="4" y="6" width="38" height="36" rx="4" stroke="#207448" stroke-width="3" fill="none"/>
    <line x1="23" y1="6" x2="23" y2="42" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
    <path d="M8 24 L16 16 L16 32 Z" fill="#207448"/>
  </g>
  <text x="1000" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
    <tspan x="1000" dy="0">after three duplicate ACKs sender</tspan>
    <tspan x="1000" dy="34">retransmits at once and enters</tspan>
    <tspan x="1000" dy="34">fast recovery (halves its window)</tspan>
  </text>

  
  <rect x="860" y="660" width="650" height="180" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(900, 725)">
    <path d="M25 6 L46 42 L4 42 Z" stroke="#db8129" stroke-width="3" stroke-linejoin="round" fill="none"/>
    <line x1="25" y1="20" x2="25" y2="29" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="25" cy="36" r="2" fill="#db8129"/>
  </g>
  <text x="975" y="738" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">
    <tspan x="975" dy="0">Reordering looks like loss:</tspan>
    <tspan x="975" dy="36">duplicate ACKs</tspan>
  </text>


  
  <rect x="60" y="950" width="1480" height="75" rx="12" fill="#207448"/>
  
  <g transform="translate(100, 965)">
    <rect x="4" y="6" width="38" height="32" rx="4" stroke="#ffffff" stroke-width="3" fill="none"/>
    <polyline points="12,22 18,28 32,14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="800" y="997" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">SACK tells the sender exactly what arrived</text>
</svg>