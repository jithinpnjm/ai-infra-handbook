<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480" style="background-color: #f5f8f5;">
  <title>Runtime versus persistent address changes, and the three checks after any change</title>
  <desc>Infographic comparing runtime network commands with persistent Netplan configuration, alternatives, and three critical checks after changes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#303a36">
    Runtime versus persistent address changes, and the three checks after any change
  </text>

  
  <g id="lane-runtime" filter="url(#shadow)">
    <rect x="40" y="90" width="460" height="1160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 40 104 Q 40 90 54 90 L 486 90 Q 500 90 500 104 L 500 170 L 40 170 Z" fill="#e8f1ea" />
    
    
    <rect x="60" y="110" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 72 122 L 80 130 L 72 138 M 84 138 L 94 138" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="124" y="142" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
      Runtime change (lost on reboot)
    </text>

    
    <g transform="translate(60, 195)">
      <rect x="0" y="0" width="420" height="110" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="46" font-family="monospace" font-size="24" fill="#303a36">ip addr add</text>
      <text x="20" y="82" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">10.23.2.4/24 dev ens4</text>
    </g>

    
    <g transform="translate(60, 325)">
      <rect x="0" y="0" width="420" height="90" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="54" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ip link set ens4 up</text>
    </g>

    
    <g transform="translate(60, 435)">
      <rect x="0" y="0" width="420" height="135" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="46" font-family="monospace" font-size="24" fill="#303a36">ip route add default</text>
      <text x="20" y="82" font-family="monospace" font-size="24" fill="#303a36">via 10.23.2.1</text>
      <text x="20" y="116" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">dev ens4</text>
    </g>

    
    <g transform="translate(60, 590)">
      <rect x="0" y="0" width="420" height="110" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="46" font-family="monospace" font-size="24" fill="#303a36">ip addr del</text>
      <text x="20" y="82" font-family="monospace" font-size="24" fill="#303a36">10.23.2.4/24 dev ens4</text>
    </g>

    
    <g transform="translate(60, 720)">
      <rect x="0" y="0" width="420" height="230" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">second address with a label:</text>
      <text x="20" y="86" font-family="monospace" font-size="24" fill="#303a36">ip addr add</text>
      <text x="20" y="126" font-family="monospace" font-size="24" fill="#303a36">10.23.2.5/24 dev ens4</text>
      <text x="20" y="166" font-family="monospace" font-size="24" fill="#303a36">label ens4:vip</text>
    </g>
  </g>

  
  <g id="lane-persistent" filter="url(#shadow)">
    <rect x="520" y="90" width="520" height="1160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 520 104 Q 520 90 534 90 L 1026 90 Q 1040 90 1040 104 L 1040 170 L 520 170 Z" fill="#e8f1ea" />
    
    
    <ellipse cx="558" cy="120" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 538 120 L 538 142 A 20 8 0 0 0 578 142 L 578 120" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 538 131 A 20 8 0 0 0 578 131" fill="none" stroke="#207448" stroke-width="3" />

    <text x="592" y="142" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
      Persistent (survives reboot)
    </text>

    
    <g transform="translate(540, 195)">
      <rect x="0" y="0" width="480" height="425" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <rect x="0" y="0" width="480" height="52" rx="10" fill="#e8f1ea" />
      <text x="20" y="36" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">/etc/netplan/60-fabric.yaml</text>
      
      
      <text x="24" y="95" font-family="monospace" font-size="24" fill="#303a36">addresses:</text>
      <text x="44" y="135" font-family="monospace" font-size="24" fill="#303a36">[10.23.2.4/24,</text>
      <text x="44" y="175" font-family="monospace" font-size="24" fill="#303a36"> 2001:db8:100:1::4/64]</text>
      
      <text x="24" y="235" font-family="monospace" font-size="24" fill="#303a36">routes:</text>
      <text x="44" y="275" font-family="monospace" font-size="24" fill="#303a36">to default via 10.23.2.1</text>
      
      <text x="24" y="335" font-family="monospace" font-size="24" fill="#303a36">nameservers 10.23.0.2</text>
      <text x="24" y="385" font-family="monospace" font-size="24" fill="#303a36">mtu: 9000</text>
    </g>

    
    <g transform="translate(540, 645)">
      <rect x="0" y="0" width="480" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
      
      
      <rect x="25" y="25" width="180" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="115" y="63" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">netplan try</text>
      
      
      <line x1="215" y1="55" x2="265" y2="55" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
      
      
      <rect x="275" y="25" width="185" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="367" y="63" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">netplan apply</text>

      <text x="240" y="125" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">apply with netplan try then netplan apply</text>
    </g>

    
    <g transform="translate(540, 820)">
      <rect x="0" y="0" width="480" height="305" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <text x="20" y="42" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">alternatives</text>
      
      
      <rect x="15" y="60" width="450" height="120" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1" />
      <text x="28" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NetworkManager</text>
      <text x="28" y="128" font-family="monospace" font-size="24" fill="#303a36">(nmcli connection modify ...</text>
      <text x="28" y="160" font-family="monospace" font-size="24" fill="#303a36">ipv4.method manual, then nmcli connection up)</text>

      
      <rect x="15" y="195" width="215" height="90" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1" />
      <text x="122" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">systemd-networkd</text>

      
      <rect x="245" y="195" width="220" height="90" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1" />
      <text x="355" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">distribution files</text>
    </g>
  </g>

  
  <g id="right-panel" filter="url(#shadow)">
    <rect x="1060" y="90" width="500" height="1160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 1060 104 Q 1060 90 1074 90 L 1546 90 Q 1560 90 1560 104 L 1560 210 L 1060 210 Z" fill="#e8f1ea" />
    
    
    <path d="M 1090 120 L 1115 110 L 1140 120 L 1140 150 C 1140 170 1115 185 1115 185 C 1115 185 1090 170 1090 150 Z" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1105 145 L 1113 153 L 1128 135" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />

    <text x="1155" y="142" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
      <tspan x="1155" dy="0">Check three things after</tspan>
      <tspan x="1155" dy="32">any change</tspan>
    </text>
    <text x="1155" y="196" font-family="sans-serif" font-size="24" font-style="italic" fill="#db8129">
      (each fails quietly)
    </text>

    
    <g transform="translate(1080, 235)">
      <rect x="0" y="0" width="460" height="280" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <circle cx="45" cy="45" r="24" fill="#207448" />
      <text x="45" y="53" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      <text x="85" y="53" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Subnets overlap</text>
      
      <text x="25" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="25" dy="0">subnets must not overlap</tspan>
        <tspan x="25" dy="34">on the host:</tspan>
      </text>
      <text x="25" y="185" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">overlapping prefixes on two</tspan>
        <tspan x="25" dy="34">interfaces lead to ambiguous</tspan>
        <tspan x="25" dy="34">routing</tspan>
      </text>
    </g>

    
    <g transform="translate(1080, 545)">
      <rect x="0" y="0" width="460" height="290" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <circle cx="45" cy="45" r="24" fill="#207448" />
      <text x="45" y="53" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      <text x="85" y="53" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Mask match</text>
      
      <text x="25" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="25" dy="0">the mask must match</tspan>
        <tspan x="25" dy="34">the network's:</tspan>
      </text>
      <text x="25" y="185" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" dy="0">a /16 on a /24 network makes</tspan>
        <tspan x="25" dy="34">the host ARP for off-link</tspan>
        <tspan x="25" dy="34">addresses</tspan>
      </text>
    </g>

    
    <g transform="translate(1080, 865)">
      <rect x="0" y="0" width="460" height="235" rx="10" fill="#f5f8f5" stroke="#d0ded2" stroke-width="1.5" />
      <circle cx="45" cy="45" r="24" fill="#207448" />
      <text x="45" y="53" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      <text x="85" y="53" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">DHCP scope</text>
      
      <text x="25" y="115" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="25" dy="0">only one DHCP server</tspan>
        <tspan x="25" dy="34">should answer per subnet</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 1275)" filter="url(#shadow)">
    <rect x="0" y="0" width="1520" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="45" cy="37" r="18" fill="#207448" />
    <text x="45" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">i</text>
    <text x="80" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      Several interfaces may coexist: the kernel picks by longest prefix match, then by metric
    </text>
  </g>

  
  <g transform="translate(40, 1370)">
    <rect x="0" y="0" width="1520" height="75" rx="12" fill="#db8129" />
    <text x="760" y="47" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      Runtime changes apply now but are lost on reboot
    </text>
  </g>
</svg>