<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Runtime versus persistent address changes, and the three checks after any change</title>
  <desc>Visual comparison between non-persistent runtime Linux network changes and persistent Netplan configuration, followed by the three silent failure checks after any network change.</desc>

  <defs>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Runtime versus persistent address changes,</text>
  <text x="800" y="106" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">and the three checks after any change</text>

  
  <rect x="40" y="135" width="460" height="875" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 155)">
    
    <circle cx="28" cy="28" r="24" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 28 14 L 28 28 L 38 28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="135" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Runtime change</text>
  <text x="135" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(lost on reboot)</text>
  <line x1="60" y1="230" x2="480" y2="230" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <rect x="60" y="250" width="420" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="78" y="290" font-family="monospace" font-size="24" fill="#303a36">ip addr add 10.23.2.4/24</text>
  <text x="78" y="324" font-family="monospace" font-size="24" fill="#303a36">  dev ens4</text>

  
  <rect x="60" y="365" width="420" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="78" y="411" font-family="monospace" font-size="24" fill="#303a36">ip link set ens4 up</text>

  
  <rect x="60" y="456" width="420" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="78" y="496" font-family="monospace" font-size="24" fill="#303a36">ip route add default</text>
  <text x="78" y="530" font-family="monospace" font-size="24" fill="#303a36">  via 10.23.2.1 dev ens4</text>

  
  <rect x="60" y="571" width="420" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="78" y="611" font-family="monospace" font-size="24" fill="#303a36">ip addr del 10.23.2.4/24</text>
  <text x="78" y="645" font-family="monospace" font-size="24" fill="#303a36">  dev ens4</text>

  
  <rect x="60" y="686" width="420" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="78" y="722" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">second address with a label:</text>
  <text x="78" y="764" font-family="monospace" font-size="24" fill="#303a36">ip addr add 10.23.2.5/24</text>
  <text x="78" y="802" font-family="monospace" font-size="24" fill="#303a36">  dev ens4 label ens4:vip</text>


  
  <rect x="520" y="135" width="510" height="875" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(545, 155)">
    
    <ellipse cx="28" cy="12" rx="22" ry="8" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 6 12 L 6 42 A 22 8 0 0 0 50 42 L 50 12" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 6 27 A 22 8 0 0 0 50 27" stroke="#207448" stroke-width="3" fill="none" />
  </g>
  <text x="615" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Persistent</text>
  <text x="615" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(survives reboot)</text>
  <line x1="540" y1="230" x2="1010" y2="230" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <rect x="540" y="250" width="470" height="305" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="560" y="286" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">/etc/netplan/60-fabric.yaml</text>
  <line x1="550" y1="300" x2="1000" y2="300" stroke="#e8f1ea" stroke-width="2" />
  <text x="560" y="336" font-family="monospace" font-size="24" fill="#303a36">addresses: [10.23.2.4/24,</text>
  <text x="580" y="370" font-family="monospace" font-size="24" fill="#303a36">2001:db8:100:1::4/64]</text>
  <text x="560" y="412" font-family="monospace" font-size="24" fill="#303a36">routes: to default via 10.23.2.1</text>
  <text x="560" y="454" font-family="monospace" font-size="24" fill="#303a36">nameservers 10.23.0.2</text>
  <text x="560" y="496" font-family="monospace" font-size="24" fill="#303a36">mtu: 9000</text>

  
  
  <rect x="540" y="575" width="200" height="70" rx="8" fill="#fdf3e9" stroke="#db8129" stroke-width="2.5" />
  <text x="640" y="619" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">netplan try</text>

  <line x1="745" y1="610" x2="805" y2="610" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  <rect x="815" y="575" width="195" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="912" y="619" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">netplan apply</text>

  
  <rect x="540" y="665" width="470" height="325" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="560" y="700" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">alternatives</text>

  <rect x="555" y="715" width="440" height="135" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
  <text x="570" y="746" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NetworkManager</text>
  <text x="570" y="778" font-family="monospace" font-size="24" fill="#303a36">(nmcli connection modify ...</text>
  <text x="570" y="810" font-family="monospace" font-size="24" fill="#303a36"> ipv4.method manual,</text>
  <text x="570" y="838" font-family="monospace" font-size="24" fill="#303a36"> then nmcli connection up)</text>

  <rect x="555" y="862" width="440" height="54" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
  <text x="570" y="897" font-family="monospace" font-size="24" fill="#303a36">systemd-networkd</text>

  <rect x="555" y="924" width="440" height="54" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1" />
  <text x="570" y="959" font-family="sans-serif" font-size="24" fill="#303a36">distribution files</text>


  
  <rect x="1050" y="135" width="510" height="875" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1075, 155)">
    
    <path d="M 28 6 L 48 14 L 48 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 L 8 14 Z" stroke="#207448" stroke-width="3.5" fill="none" />
    <path d="M 20 27 L 26 33 L 37 20" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="1145" y="174" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Check three things</text>
  <text x="1145" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">after any change</text>
  <text x="1145" y="230" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">(each fails quietly)</text>
  <line x1="1070" y1="245" x2="1540" y2="245" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />

  
  <rect x="1070" y="260" width="470" height="235" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1090" y="298" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">1 subnets must not overlap</text>
  <text x="1090" y="332" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">   on the host:</text>
  <text x="1090" y="380" font-family="sans-serif" font-size="24" fill="#303a36">overlapping prefixes on two</text>
  <text x="1090" y="416" font-family="sans-serif" font-size="24" fill="#303a36">interfaces lead to ambiguous</text>
  <text x="1090" y="452" font-family="sans-serif" font-size="24" fill="#303a36">routing</text>

  
  <rect x="1070" y="515" width="470" height="235" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1090" y="553" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">2 the mask must match</text>
  <text x="1090" y="587" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">   the network's:</text>
  <text x="1090" y="635" font-family="sans-serif" font-size="24" fill="#303a36">a /16 on a /24 network</text>
  <text x="1090" y="671" font-family="sans-serif" font-size="24" fill="#303a36">makes the host ARP for</text>
  <text x="1090" y="707" font-family="sans-serif" font-size="24" fill="#303a36">off-link addresses</text>

  
  <rect x="1070" y="770" width="470" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1090" y="828" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">3 only one DHCP server</text>
  <text x="1090" y="868" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">   should answer per subnet</text>


  
  <rect x="40" y="1030" width="1520" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="1069" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Several interfaces may coexist: the kernel picks by longest prefix match, then by metric</text>


  
  <rect x="40" y="1110" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="1149" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Runtime changes apply now but are lost on reboot</text>

</svg>