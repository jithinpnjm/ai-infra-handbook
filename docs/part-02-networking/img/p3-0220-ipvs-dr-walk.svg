<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>IPVS direct routing: one request in, a reply that skips the balancer</title>
  <desc>Visual infographic explaining Linux IPVS Direct Routing (DSR) mode where client requests pass through the router and balancer, but replies return directly from real servers.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b3323" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#175333" text-anchor="middle">IPVS direct routing: one request in,</text>
    <text x="800" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#175333" text-anchor="middle">a reply that skips the balancer</text>
  </g>

  
  
  <rect x="40" y="145" width="1520" height="440" rx="16" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" filter="url(#soft-shadow)" />

  
  <g id="node-client">
    <rect x="65" y="175" width="220" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(145, 195)">
      <rect x="5" y="5" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="43" x2="60" y2="43" stroke="#207448" stroke-width="5" stroke-linecap="round" />
    </g>
    <text x="175" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">Client</text>
  </g>

  
  <path d="M 285 275 L 430 275" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <g id="step-1">
    <rect x="255" y="180" width="190" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="280" cy="213" r="16" fill="#207448" />
    <text x="280" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="305" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">step 1:</text>
    <text x="305" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">packet to the</text>
    
    <rect x="260" y="250" width="180" height="28" rx="4" fill="#f5f8f5" />
    <text x="350" y="271" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">VIP 10.0.0.100:443</text>
  </g>

  
  <g id="node-router">
    <rect x="445" y="175" width="220" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(525, 195)">
      <circle cx="30" cy="24" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 24 L 42 24 M 30 12 L 30 36 M 22 16 L 38 32 M 38 16 L 22 32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="555" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">Router</text>
  </g>

  
  <path d="M 665 275 L 795 275" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <g id="step-2">
    <rect x="670" y="160" width="130" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="735" cy="186" r="16" fill="#207448" />
    <text x="735" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="735" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">step 2:</text>
    <text x="735" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">delivers</text>
    
    <rect x="635" y="305" width="200" height="60" rx="6" fill="#e8f1ea" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="735" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">to the balancer host</text>
    <text x="735" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">because the VIP is announced there</text>
  </g>

  
  <g id="node-balancer">
    <rect x="810" y="175" width="260" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(910, 195)">
      <rect x="5" y="6" width="50" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="5" y="28" width="50" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="16" cy="13" r="2.5" fill="#207448" />
      <circle cx="26" cy="13" r="2.5" fill="#207448" />
      <circle cx="16" cy="35" r="2.5" fill="#207448" />
      <circle cx="26" cy="35" r="2.5" fill="#207448" />
    </g>
    <text x="940" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">IPVS balancer</text>
  </g>

  
  <path d="M 1070 275 L 1175 275" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <g id="step-3">
    <rect x="1065" y="160" width="115" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="1122" cy="186" r="16" fill="#207448" />
    <text x="1122" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="1122" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36" text-anchor="middle">step 3:</text>
    <text x="1122" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">forwards</text>
    
    <rect x="1005" y="305" width="220" height="92" rx="6" fill="#e8f1ea" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="1115" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">picks a real server and</text>
    <text x="1115" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">rewrites only the destination MAC;</text>
    <text x="1115" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">the packet still says VIP as destination</text>
  </g>

  
  <g id="node-realserver">
    <rect x="1185" y="165" width="360" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1335, 175)">
      <rect x="5" y="4" width="50" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="5" y="20" width="50" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="15" cy="10" r="2" fill="#207448" />
      <circle cx="15" cy="26" r="2" fill="#207448" />
    </g>
    
    <text x="1365" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">Real server</text>
    <text x="1365" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#207448" text-anchor="middle">(holds 10.0.0.100/32 on lo)</text>

    
    <rect x="1200" y="280" width="330" height="60" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="1225" cy="310" r="14" fill="#207448" />
    <text x="1225" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="1248" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">step 4:</text>
    <text x="1318" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">sees it owns the VIP</text>
    <text x="1248" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">and accepts</text>

    
    <rect x="1200" y="350" width="330" height="68" rx="6" fill="#ffffff" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="1225" cy="384" r="14" fill="#207448" />
    <text x="1225" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1248" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">step 5: builds the reply</text>
    <text x="1248" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">with the VIP as source and the client as destination</text>
  </g>

  
  
  <path d="M 1365 430 L 1365 480 L 175 480 L 175 385" fill="none" stroke="#db8129" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow-orange)" />

  
  <g id="return-pill">
    <rect x="520" y="455" width="560" height="48" rx="24" fill="#fff4e8" stroke="#db8129" stroke-width="2.5" />
    <text x="800" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#db8129" text-anchor="middle">straight out through its own default gateway</text>
  </g>

  
  <g id="under-summary">
    <rect x="360" y="525" width="880" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="556" font-family="system-ui, -apple-system, sans-serif" font-size="25px" font-weight="bold" fill="#175333" text-anchor="middle">Only the small request crossed the balancer; the large reply went around it</text>
  </g>

  

  
  <g id="panel-facts">
    <rect x="40" y="615" width="730" height="575" rx="16" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" filter="url(#soft-shadow)" />
    
    <rect x="40" y="615" width="730" height="60" rx="16" fill="#e8f1ea" />
    <rect x="40" y="655" width="730" height="20" fill="#e8f1ea" />
    
    <g transform="translate(65, 627)">
      <path d="M 15 4 L 32 10 L 32 24 C 32 35 24 42 15 46 C 6 42 -2 35 -2 24 L -2 10 Z" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="110" y="657" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#175333">Facts</text>

    
    <rect x="65" y="695" width="680" height="96" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="95" cy="743" r="8" fill="#207448" />
    <text x="120" y="736" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">schedulers: rr, wrr, lc, wlc, sh, dh, mh</text>
    <text x="120" y="768" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">(Maglev), sed, nq</text>

    
    <rect x="65" y="806" width="680" height="96" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="95" cy="854" r="8" fill="#207448" />
    <text x="120" y="847" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">keepalived adds VRRP active or passive VIP</text>
    <text x="120" y="879" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">failover plus health checks</text>

    
    <rect x="65" y="917" width="680" height="96" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="95" cy="965" r="8" fill="#207448" />
    <text x="120" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">NAT-mode IPVS depends on conntrack capped</text>
    <text x="120" y="987" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">by nf_conntrack_max, DR mode does not</text>

    
    <rect x="65" y="1028" width="680" height="142" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <circle cx="95" cy="1070" r="8" fill="#207448" />
    <text x="120" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">DSR limits: L2 adjacency or tunnels, no L7</text>
    <text x="120" y="1094" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">features, health checking needs care,</text>
    <text x="120" y="1126" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">asymmetric flows complicate firewalls</text>
  </g>

  
  <g id="panel-setup">
    <rect x="830" y="615" width="730" height="575" rx="16" fill="#ffffff" stroke="#c2d6c7" stroke-width="2" filter="url(#soft-shadow)" />
    
    <rect x="830" y="615" width="730" height="60" rx="16" fill="#e8f1ea" />
    <rect x="830" y="655" width="730" height="20" fill="#e8f1ea" />
    
    <g transform="translate(855, 627)">
      <rect x="0" y="6" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 8 16 L 16 20 L 8 24 M 20 25 L 28 25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="905" y="657" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#175333">Setup</text>

    
    <rect x="855" y="690" width="680" height="54" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="875" y="725" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipvsadm -A -t 10.0.0.100:443 -s wlc</text>

    
    <rect x="855" y="756" width="680" height="74" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="875" y="787" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipvsadm -a -t ... -r 10.1.0.11:443</text>
    <text x="875" y="818" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">-g -w 1</text>

    
    <rect x="855" y="842" width="680" height="66" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="875" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">-g direct routing (DSR), -m masquerade (NAT),</text>
    <text x="875" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">-i tunnel</text>

    
    <rect x="855" y="920" width="680" height="96" rx="8" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1.5" />
    <text x="875" y="948" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">on each real server: ip addr add 10.0.0.100/32</text>
    <text x="875" y="976" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">dev lo; sysctl arp_ignore=1 arp_announce=2</text>

    
    <rect x="855" y="1028" width="680" height="142" rx="8" fill="#fff4e8" stroke="#db8129" stroke-width="1.5" />
    <text x="875" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">reason:</text>
    <text x="875" y="1094" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">if real servers answered ARP for the VIP, traffic</text>
    <text x="875" y="1126" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">would go to them directly and the balancer</text>
    <text x="875" y="1158" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">would be skipped</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1225" width="1520" height="74" rx="12" fill="#207448" filter="url(#soft-shadow)" />
    <text x="800" y="1272" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">Pick the mode by asking whether replies skip the balancer</text>
  </g>
</svg>