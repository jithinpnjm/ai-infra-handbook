<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which source address does the packet carry? The kernel's order of checks</title>
  <desc>Visual decision flow and practical rules explaining how the Linux kernel selects the source IP address for outgoing packets.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="48" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Which source address does the packet carry?</text>
    <text x="800" y="88" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">The kernel's order of checks</text>
    <line x1="50" y1="112" x2="1550" y2="112" stroke="#c5d8cb" stroke-width="1.5" />
  </g>

  

  
  <g id="step-1">
    
    <circle cx="60" cy="180" r="24" fill="#207448" />
    <text x="60" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

    
    <rect x="32" y="215" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="32" y1="230" x2="88" y2="230" stroke="#207448" stroke-width="2" />
    <circle cx="43" cy="223" r="2.5" fill="#207448" />
    <circle cx="51" cy="223" r="2.5" fill="#207448" />
    <circle cx="59" cy="223" r="2.5" fill="#207448" />

    
    <polygon points="310,155 520,220 310,285 100,220" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="310" y="212" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Did the application bind</text>
    <text x="310" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">a specific address?</text>

    
    <line x1="520" y1="220" x2="600" y2="220" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="560" y="206" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

    
    <rect x="612" y="175" width="323" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="773" y="228" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">use that address</text>
  </g>

  
  <line x1="310" y1="285" x2="310" y2="375" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-2">
    
    <circle cx="60" cy="410" r="24" fill="#207448" />
    <text x="60" y="418" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

    
    <path d="M 45 470 L 45 450 Q 45 440 60 440 L 75 440" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 45 450 Q 45 440 35 440 L 35 435" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="45" cy="470" r="4" fill="#207448" />
    <circle cx="75" cy="440" r="4" fill="#207448" />
    <circle cx="35" cy="435" r="4" fill="#207448" />

    
    <polygon points="310,375 520,445 310,515 100,445" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="310" y="438" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Does the route have</text>
    <text x="310" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">a src set?</text>

    
    <line x1="520" y1="445" x2="600" y2="445" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="560" y="431" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

    
    <rect x="612" y="355" width="323" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="630" y="388" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">use the route's src</text>
    <text x="630" y="419" font-family="sans-serif" font-size="24" fill="#303a36">(for example</text>
    <text x="630" y="450" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ip route add</text>
    <text x="630" y="482" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">10.30.0.0/16 via ...</text>
    <text x="630" y="514" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">src 10.20.0.45)</text>
  </g>

  
  <line x1="310" y1="515" x2="310" y2="620" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-3">
    
    <rect x="50" y="620" width="885" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <circle cx="100" cy="675" r="24" fill="#207448" />
    <text x="100" y="683" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

    
    <rect x="72" y="725" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="85" y="745" width="30" height="20" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="93" y1="745" x2="93" y2="755" stroke="#207448" stroke-width="2" />
    <line x1="100" y1="745" x2="100" y2="755" stroke="#207448" stroke-width="2" />
    <line x1="107" y1="745" x2="107" y2="755" stroke="#207448" stroke-width="2" />

    
    <text x="150" y="670" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Otherwise: the primary address</text>
    <text x="150" y="708" font-family="sans-serif" font-size="24" fill="#303a36">of the output interface, in the same subnet</text>
    <text x="150" y="746" font-family="sans-serif" font-size="24" fill="#303a36">as the next hop</text>
    <text x="150" y="784" font-family="sans-serif" font-size="24" fill="#5a6862">(<tspan font-family="monospace" font-weight="bold">ip addr</tspan> labels the others secondary)</text>
  </g>

  
  <g id="right-panel">
    
    <rect x="965" y="135" width="585" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="995" y="180" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">What follows in practice</text>

    
    <circle cx="1515" cy="172" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1515 150 L 1515 154 M 1515 190 L 1515 194 M 1493 172 L 1497 172 M 1533 172 L 1537 172" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <rect x="985" y="205" width="545" height="108" rx="10" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5" />
    <text x="1005" y="238" font-family="sans-serif" font-size="24" fill="#303a36">a packet to the Internet leaves</text>
    <text x="1005" y="268" font-family="sans-serif" font-size="24" fill="#303a36">through the default-gateway NIC</text>
    <text x="1005" y="298" font-family="sans-serif" font-size="24" fill="#303a36">with that NIC's address</text>

    
    <rect x="985" y="328" width="545" height="96" rx="10" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5" />
    <text x="1005" y="365" font-family="sans-serif" font-size="24" fill="#303a36">traffic to a connected subnet uses</text>
    <text x="1005" y="398" font-family="sans-serif" font-size="24" fill="#303a36">the address on that subnet</text>

    
    <rect x="985" y="439" width="545" height="96" rx="10" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5" />
    <text x="1005" y="476" font-family="sans-serif" font-size="24" fill="#303a36">two NICs on one subnet</text>
    <text x="1005" y="509" font-family="sans-serif" font-size="24" fill="#303a36">(bad practice): either may be used</text>

    
    <rect x="985" y="550" width="545" height="108" rx="10" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5" />
    <text x="1005" y="583" font-family="sans-serif" font-size="24" fill="#303a36">an application bound to <tspan font-family="monospace" font-weight="bold">0.0.0.0</tspan></text>
    <text x="1005" y="613" font-family="sans-serif" font-size="24" fill="#303a36">gets the chosen source</text>
    <text x="1005" y="643" font-family="sans-serif" font-size="24" fill="#303a36">per destination</text>

    
    <rect x="985" y="673" width="545" height="115" rx="10" fill="#ffffff" stroke="#c5d8cb" stroke-width="1.5" />
    <text x="1005" y="706" font-family="sans-serif" font-size="24" fill="#303a36">a service that must answer from</text>
    <text x="1005" y="736" font-family="sans-serif" font-size="24" fill="#303a36">one address has to bind to it,</text>
    <text x="1005" y="766" font-family="sans-serif" font-size="24" fill="#303a36">or you need policy routing</text>
  </g>

  

  
  <g id="ipv6-strip">
    <rect x="50" y="875" width="1500" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <circle cx="95" cy="923" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <ellipse cx="95" cy="923" rx="10" ry="22" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="73" y1="923" x2="117" y2="923" stroke="#207448" stroke-width="2" />

    
    <text x="145" y="915" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">RFC 6724 rules choose among candidates: match scope,</text>
    <text x="145" y="949" font-family="sans-serif" font-size="24" fill="#303a36">prefer public over temporary addresses by <tspan font-family="monospace" font-weight="bold">use_tempaddr</tspan>, longest common prefix</text>
  </g>

  
  <g id="debug-line">
    <rect x="50" y="990" width="1500" height="80" rx="12" fill="#fef7ee" stroke="#db8129" stroke-width="2.5" />

    
    <path d="M 85 1018 L 92 1025 L 78 1045 L 72 1045 L 70 1043 L 70 1037 Z" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 91 1016 C 96 1012 103 1014 107 1018 C 111 1022 110 1028 106 1032 L 98 1024 Z" fill="none" stroke="#db8129" stroke-width="3" />

    
    <text x="135" y="1039" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Replies leave with the wrong source? Check the bound address first, then the route's src</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1090" width="1500" height="70" rx="12" fill="#207448" />

    
    <circle cx="85" cy="1125" r="14" fill="none" stroke="#ffffff" stroke-width="3" />
    <line x1="99" y1="1125" x2="120" y2="1125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="112" y1="1125" x2="112" y2="1132" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="118" y1="1125" x2="118" y2="1132" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    
    <text x="145" y="1134" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">The receiver replies to the source address, so a wrong choice means the reply may never come back</text>
  </g>
</svg>