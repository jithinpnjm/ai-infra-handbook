<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Four kinds of denial of service</title>
  <desc>Visual comparison table of four denial of service types: Volumetric, Protocol/state exhaustion, Application layer, and Control-plane, detailing mechanisms and mitigations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Four kinds of denial of service</text>

  
  <rect x="50" y="110" width="400" height="50" rx="8" fill="#e8f1ea" />
  <text x="74" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Type</text>

  <rect x="480" y="110" width="500" height="50" rx="8" fill="#e8f1ea" />
  <text x="504" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Mechanism</text>

  <rect x="1070" y="110" width="480" height="50" rx="8" fill="#e8f1ea" />
  <text x="1094" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Mitigation</text>

  
  
  <rect x="50" y="180" width="400" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(76, 222)">
    <path d="M 4 36 Q 16 18 28 36 T 52 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 4 24 Q 16 6 28 24 T 52 24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 4 48 Q 16 30 28 48 T 52 48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="156" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Volumetric</text>

  
  <rect x="480" y="180" width="500" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="504" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="504" dy="0">saturate bandwidth</tspan>
    <tspan x="504" dy="34">(UDP floods, DNS/NTP/</tspan>
    <tspan x="504" dy="34">memcached reflection)</tspan>
  </text>

  
  <line x1="995" y1="250" x2="1055" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1070" y="180" width="480" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="1094" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1094" dy="0">upstream scrubbing or anycast,</tspan>
    <tspan x="1094" dy="36">BCP38, RTBH</tspan>
  </text>

  
  
  <rect x="50" y="344" width="400" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(76, 386)">
    <rect x="6" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="21" x2="50" y2="21" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="35" x2="50" y2="35" stroke="#207448" stroke-width="3" />
    <line x1="28" y1="6" x2="28" y2="50" stroke="#207448" stroke-width="3" />
  </g>
  <text x="156" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="156" dy="0">Protocol/state</tspan>
    <tspan x="156" dy="38">exhaustion</tspan>
  </text>

  
  <rect x="480" y="344" width="500" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="504" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="504" dy="0">SYN floods, connection table</tspan>
    <tspan x="504" dy="36">exhaustion, fragment attacks</tspan>
  </text>

  
  <line x1="995" y1="414" x2="1055" y2="414" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1070" y="344" width="480" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="1094" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1094" dy="0">SYN cookies, connection limits,</tspan>
    <tspan x="1094" dy="36">bigger tables, proxies</tspan>
  </text>

  
  
  <rect x="50" y="508" width="400" height="196" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(76, 578)">
    <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="6" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="14" r="2.5" fill="#207448" />
    <circle cx="22" cy="14" r="2.5" fill="#207448" />
    <circle cx="30" cy="14" r="2.5" fill="#207448" />
  </g>
  <text x="156" y="595" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="156" dy="0">Application</tspan>
    <tspan x="156" dy="38">layer</tspan>
  </text>

  
  <rect x="480" y="508" width="500" height="120" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="504" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="504" dy="0">HTTP floods, slow-loris,</tspan>
    <tspan x="504" dy="36">expensive queries</tspan>
  </text>

  
  <line x1="995" y1="568" x2="1055" y2="568" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1070" y="508" width="480" height="120" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="1094" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1094" dy="0">rate limiting, WAF, caching,</tspan>
    <tspan x="1094" dy="36">request cost limits</tspan>
  </text>

  
  <rect x="480" y="644" width="1070" height="60" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="2.5" />
  <text x="504" y="682" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Inference APIs: one expensive prompt costs GPU seconds</text>

  
  
  <rect x="50" y="732" width="400" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(76, 774)">
    <rect x="14" y="14" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="21" y1="6" x2="21" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="6" x2="28" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="6" x2="35" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="21" y1="42" x2="21" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="42" x2="28" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="42" x2="35" y2="50" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="21" x2="14" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="28" x2="14" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="35" x2="14" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="21" x2="50" y2="21" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="35" x2="50" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <rect x="23" y="23" width="10" height="10" fill="#207448" />
  </g>
  <text x="156" y="814" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Control-plane</text>

  
  <rect x="480" y="732" width="500" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="504" y="792" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="504" dy="0">flood router CPUs with</tspan>
    <tspan x="504" dy="36">ICMP/ARP/routing packets</tspan>
  </text>

  
  <line x1="995" y1="802" x2="1055" y2="802" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1070" y="732" width="480" height="140" rx="10" fill="#ffffff" stroke="#e8f1ea" stroke-width="2" />
  <text x="1094" y="792" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1094" dy="0">CoPP, ICMP rate limiting,</tspan>
    <tspan x="1094" dy="36">routing protocol authentication</tspan>
  </text>

  
  <rect x="50" y="902" width="1500" height="68" rx="8" fill="#207448" />
  <text x="800" y="944" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Set your rate limits and quotas before traffic spikes, not during an attack</text>
</svg>