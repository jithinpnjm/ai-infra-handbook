<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" width="1600" height="1370">
  <title>Revocation is hard, so shorten lifetimes and watch expiry</title>
  <desc>Infographic explaining revocation mechanisms, automated short lifetimes, certificate monitoring strategies, and cluster security practices.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1370" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Revocation is hard, so shorten lifetimes and watch expiry</text>

  
  <rect x="40" y="110" width="425" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(60, 130)">
    <path d="M 20 4 L 4 10 L 4 24 C 4 34 11 43 20 46 C 29 43 36 34 36 24 L 36 10 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 14 24 L 26 24" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="115" y="165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Revocation mechanisms</text>

  
  <rect x="65" y="200" width="375" height="135" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="85" y="255" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-weight="bold" fill="#207448">CRL:</tspan><tspan fill="#303a36"> large lists of</tspan>
    <tspan x="85" dy="34">cancelled certificates</tspan>
  </text>

  
  <rect x="65" y="355" width="375" height="170" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="85" y="405" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-weight="bold" fill="#207448">OCSP:</tspan><tspan fill="#303a36"> online status checks,</tspan>
    <tspan x="85" dy="34">raises privacy and</tspan>
    <tspan x="85" dy="34">availability problems</tspan>
  </text>

  
  <rect x="65" y="545" width="375" height="210" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="85" y="595" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-weight="bold" fill="#207448">OCSP stapling:</tspan><tspan fill="#303a36"> the server</tspan>
    <tspan x="85" dy="34">attaches a signed recent</tspan>
    <tspan x="85" dy="34">status, helps with those</tspan>
    <tspan x="85" dy="34">problems</tspan>
  </text>

  
  <rect x="65" y="775" width="375" height="135" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="85" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="85" dy="0" font-weight="bold" fill="#207448">CRLite</tspan><tspan fill="#303a36"> and pushed sets</tspan>
    <tspan x="85" dy="34">in browsers</tspan>
  </text>

  
  <path d="M 465 220 L 500 220" stroke="#db8129" stroke-width="5" fill="none" marker-end="url(#arrow-orange)"/>
  
  <rect x="505" y="115" width="435" height="215" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
  <text x="525" y="160" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="525" dy="0" font-weight="bold" fill="#db8129">The modern answer:</tspan>
    <tspan x="525" dy="35">short-lived certificates with</tspan>
    <tspan x="525" dy="35">automated renewal, so</tspan>
    <tspan x="525" dy="35">revocation matters less</tspan>
  </text>

  <path d="M 722 330 L 722 355" stroke="#db8129" stroke-width="5" fill="none" marker-end="url(#arrow-orange)"/>

  
  <rect x="490" y="360" width="465" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(510, 378)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 20 10 L 20 20 L 27 25" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="565" y="410" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Lifetimes</text>

  
  <rect x="510" y="445" width="425" height="90" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="530" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan fill="#303a36">Let's Encrypt 90 days</tspan>
  </text>

  
  <rect x="510" y="555" width="425" height="150" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="530" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="530" dy="0">the industry is moving toward</tspan>
    <tspan x="530" dy="34">even shorter lifetimes, so</tspan>
    <tspan x="530" dy="34">automation is mandatory</tspan>
  </text>

  
  <rect x="510" y="725" width="425" height="265" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="530" y="775" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="530" dy="0">kubeadm cluster certificates</tspan>
    <tspan x="530" dy="34">mostly 1 year: a cluster that</tspan>
    <tspan x="530" dy="34">ran a year can stop answering</tspan>
    <tspan x="530" dy="34">on the anniversary of</tspan>
    <tspan x="530" dy="34">installation</tspan>
  </text>

  
  <rect x="980" y="110" width="580" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1005, 130)">
    <rect x="2" y="4" width="38" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 6 22 L 14 22 L 18 12 L 24 30 L 28 22 L 36 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1060" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Monitoring panel</text>

  
  <rect x="1005" y="195" width="530" height="85" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1025" y="232" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="1025" dy="0">Prometheus</tspan>
    <tspan x="1025" dy="32">x509-certificate-exporter</tspan>
  </text>

  
  <rect x="1005" y="295" width="530" height="85" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1025" y="332" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">blackbox exporter</tspan>
    <tspan x="1025" dy="32" font-family="monospace" fill="#207448">probe_ssl_earliest_cert_expiry</tspan>
  </text>

  
  <rect x="1005" y="395" width="530" height="125" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1025" y="435" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">alert at 21, 7 and 3 days: the first</tspan>
    <tspan x="1025" dy="34">alert at 21 days leaves three weeks</tspan>
    <tspan x="1025" dy="34">to renew</tspan>
  </text>

  
  <rect x="1005" y="535" width="258" height="85" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1018" y="570" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="1018" dy="0">kubeadm certs</tspan>
    <tspan x="1018" dy="32">check-expiration</tspan>
  </text>

  <rect x="1277" y="535" width="258" height="85" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1292" y="570" font-family="monospace" font-size="24" fill="#207448">
    <tspan x="1292" dy="0">kubeadm certs</tspan>
    <tspan x="1292" dy="32">renew all</tspan>
  </text>

  
  <rect x="1005" y="635" width="530" height="125" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1025" y="675" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">kubelet client certificates rotate</tspan>
    <tspan x="1025" dy="34">automatically if rotateCertificates</tspan>
    <tspan x="1025" dy="34">is enabled and CSRs are approved</tspan>
  </text>

  
  <rect x="1005" y="775" width="530" height="125" rx="10" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="1025" y="815" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1025" dy="0">cron or shell loop with</tspan>
    <tspan x="1025" dy="34" font-family="monospace" fill="#207448">openssl x509 -checkend</tspan>
    <tspan x="1025" dy="34">and a threshold</tspan>
  </text>

  
  <rect x="40" y="1040" width="1520" height="195" rx="12" fill="#ffffff" stroke="#c0d8c6" stroke-width="1.5"/>
  <text x="65" y="1080" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">Clock skew also breaks certificates: a node a day ahead may call a good certificate expired;</tspan>
    <tspan x="65" dy="36">install and monitor NTP or chrony (chapter 1.16); BMC, Redfish and switch certificates often ship self-signed:</tspan>
    <tspan x="65" dy="36">replace with CA-issued certificates or pin fingerprints, avoid blanket verify=False;</tspan>
    <tspan x="65" dy="36">Kubernetes Secrets are only base64: use encryption at rest, Vault or cloud KMS, short lifetimes and RBAC</tspan>
  </text>

  
  <rect x="40" y="1255" width="1520" height="70" rx="10" fill="#207448"/>
  <text x="800" y="1300" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Check the expiry dates of the cluster certificates now</text>
</svg>