<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Two hosts share a subnet when the mask strips them to the same network</title>
  <desc>Visual comparison showing how subnet masking determines whether Address A and Address B belong to the local network or must be sent to the gateway.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Two hosts share a subnet when the mask</tspan>
    <tspan x="800" dy="56">strips them to the same network</tspan>
  </text>

  
  
  <rect x="70" y="160" width="430" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(100, 192)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="46" height="32" rx="4" />
    <line x1="15" y1="32" x2="11" y2="44" />
    <line x1="31" y1="32" x2="35" y2="44" />
    <line x1="7" y1="44" x2="39" y2="44" />
    <circle cx="23" cy="16" r="3" fill="#207448" />
  </g>
  <text x="300" y="226" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
    Address A: 10.20.37.130
  </text>

  
  <rect x="540" y="160" width="430" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(565, 192)" stroke="#207448" stroke-width="3" fill="none">
    <polygon points="4,2 42,2 28,24 28,42 18,36 18,24" />
    <line x1="10" y1="9" x2="36" y2="9" />
  </g>
  <text x="765" y="226" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
    Mask: /22 (third octet 252)
  </text>

  
  <line x1="520" y1="270" x2="520" y2="316" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="320" width="800" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(155, 338)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="20" />
    <path d="M 16 28 L 24 16 L 32 28" />
    <line x1="19" y1="24" x2="29" y2="24" />
  </g>
  <text x="540" y="374" font-family="monospace" font-size="28px" font-weight="bold" fill="#207448" text-anchor="middle">
    A AND mask = 10.20.36.0 network
  </text>

  
  
  <rect x="305" y="445" width="430" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(335, 477)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="46" height="32" rx="4" />
    <line x1="15" y1="32" x2="11" y2="44" />
    <line x1="31" y1="32" x2="35" y2="44" />
    <line x1="7" y1="44" x2="39" y2="44" />
    <circle cx="23" cy="16" r="3" fill="#207448" />
  </g>
  <text x="535" y="511" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36" text-anchor="middle">
    Address B: 10.20.40.1
  </text>

  
  <line x1="520" y1="555" x2="520" y2="601" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="120" y="605" width="800" height="85" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(155, 623)" stroke="#db8129" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="20" />
    <path d="M 16 28 L 24 16 L 32 28" />
    <line x1="19" y1="24" x2="29" y2="24" />
  </g>
  <text x="540" y="659" font-family="monospace" font-size="28px" font-weight="bold" fill="#db8129" text-anchor="middle">
    B AND mask = 10.20.40.0 network
  </text>

  
  <rect x="1010" y="160" width="520" height="530" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1245, 205)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="8" width="50" height="34" rx="4" />
    <line x1="12" y1="8" x2="12" y2="42" />
    <line x1="25" y1="8" x2="25" y2="42" />
    <line x1="38" y1="8" x2="38" y2="42" />
    <circle cx="25" cy="0" r="4" fill="#207448" />
    <line x1="25" y1="4" x2="25" y2="8" />
  </g>
  <text x="1270" y="320" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1270" dy="0">10.20.36.0/22 covers</tspan>
    <tspan x="1270" dy="48">third octets 36 to 39,</tspan>
    <tspan x="1270" dy="48">so 10.20.36.0</tspan>
    <tspan x="1270" dy="48">to 10.20.39.255</tspan>
  </text>
  
  <g transform="translate(1060, 560)">
    <rect x="0" y="0" width="95" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="47" y="28" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">.36</text>
    <rect x="105" y="0" width="95" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="152" y="28" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">.37</text>
    <rect x="210" y="0" width="95" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="257" y="28" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">.38</text>
    <rect x="315" y="0" width="95" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="362" y="28" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">.39</text>
  </g>

  
  
  <rect x="70" y="730" width="715" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(110, 780)">
    <circle cx="25" cy="25" r="25" fill="#207448" />
    <path d="M 14 25 L 22 33 L 36 17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="180" y="792" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448" text-anchor="start">
    <tspan x="180" dy="0">Same network as 10.20.36.0/22:</tspan>
    <tspan x="180" dy="44">direct on the link (ARP)</tspan>
  </text>

  
  <rect x="815" y="730" width="715" height="150" rx="14" fill="#fdf0ed" stroke="#c83232" stroke-width="3" />
  
  <g transform="translate(855, 780)">
    <circle cx="25" cy="25" r="25" fill="#c83232" />
    <line x1="16" y1="16" x2="34" y2="34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="34" y1="16" x2="16" y2="34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>
  <text x="925" y="792" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#c83232" text-anchor="start">
    <tspan x="925" dy="0">Different network:</tspan>
    <tspan x="925" dy="44">send to the gateway</tspan>
  </text>

  
  <rect x="70" y="920" width="1460" height="80" rx="12" fill="#207448" />
  <text x="800" y="970" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Every host runs this check for every packet it sends.
  </text>
</svg>