<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Two hosts share a subnet when the mask strips them to the same network</title>
  <desc>Visual comparison showing how applying a subnet mask determines whether two hosts share the same network or must route through a gateway.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <g text-anchor="middle" font-family="sans-serif">
    <text x="800" y="65" font-size="44" font-weight="bold" fill="#303a36">Two hosts share a subnet when the mask</text>
    <text x="800" y="118" font-size="44" font-weight="bold" fill="#303a36">strips them to the same network</text>
  </g>

  
  
  <rect x="60" y="160" width="470" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="85" y="188" width="50" height="34" rx="4"/>
    <line x1="110" y1="222" x2="110" y2="234"/>
    <line x1="96" y1="234" x2="124" y2="234"/>
    <circle cx="110" cy="205" r="2.5" fill="#207448"/>
  </g>
  <text x="160" y="226" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Address A: 10.20.37.130</text>

  
  <rect x="560" y="160" width="470" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="585,190 631,190 614,215 614,234 602,230 602,215"/>
  </g>
  <text x="655" y="226" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Mask: /22 (third octet 252)</text>

  
  <line x1="545" y1="270" x2="545" y2="318" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="180" y="322" width="730" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="545" y="377" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">A AND mask = 10.20.36.0 network</text>

  
  
  <rect x="60" y="460" width="470" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="85" y="488" width="50" height="34" rx="4"/>
    <line x1="110" y1="522" x2="110" y2="534"/>
    <line x1="96" y1="534" x2="124" y2="534"/>
    <circle cx="110" cy="505" r="2.5" fill="#207448"/>
  </g>
  <text x="160" y="526" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Address B: 10.20.40.1</text>

  
  <path d="M 795 270 L 795 430 L 545 430 L 545 618" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 6"/>
  
  <line x1="295" y1="570" x2="295" y2="600" stroke="#207448" stroke-width="3"/>
  <line x1="295" y1="600" x2="545" y2="600" stroke="#207448" stroke-width="3"/>
  <line x1="545" y1="600" x2="545" y2="618" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="180" y="622" width="730" height="90" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="545" y="677" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">B AND mask = 10.20.40.0 network</text>

  
  
  <rect x="1080" y="160" width="460" height="552" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 1120 220 L 1140 220 L 1140 330 L 1155 330 L 1140 330 L 1140 440 L 1120 440"/>
  </g>
  <text x="1175" y="270" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1175" dy="0">10.20.36.0/22 covers</tspan>
    <tspan x="1175" dy="48">third octets 36 to 39,</tspan>
    <tspan x="1175" dy="48">so 10.20.36.0 to</tspan>
    <tspan x="1175" dy="48">10.20.39.255</tspan>
  </text>

  
  
  <rect x="60" y="760" width="710" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="120" cy="830" r="30" fill="#207448"/>
  <path d="M 107 830 L 117 840 L 133 822" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="175" y="816" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="175" dy="0">Same network as 10.20.36.0/22:</tspan>
    <tspan x="175" dy="38">direct on the link (ARP)</tspan>
  </text>

  
  <rect x="830" y="760" width="710" height="140" rx="12" fill="#ffffff" stroke="#c53030" stroke-width="3"/>
  
  <circle cx="890" cy="830" r="30" fill="#c53030"/>
  <path d="M 879 819 L 901 841 M 901 819 L 879 841" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  
  <text x="945" y="816" font-family="sans-serif" font-size="25" font-weight="bold" fill="#c53030">
    <tspan x="945" dy="0">Different network:</tspan>
    <tspan x="945" dy="38">send to the gateway</tspan>
  </text>

  
  <rect x="60" y="950" width="1480" height="70" rx="10" fill="#207448"/>
  <text x="800" y="994" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Every host runs this check for every packet it sends.</text>
</svg>