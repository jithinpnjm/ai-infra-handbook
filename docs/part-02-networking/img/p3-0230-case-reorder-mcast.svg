<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Case 11 and 12: two ways an overlay or a second path changes what the network carries</title>
  <desc>Visual comparison showing asymmetric ECMP packet reordering versus overlay multicast blackholing, with root causes and fixes for each case.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Case 11 and 12: two ways an overlay or</tspan>
    <tspan x="800" dy="58">a second path changes what the network carries</tspan>
  </text>

  
  <rect x="40" y="160" width="740" height="860" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(68, 178)">
    <circle cx="22" cy="18" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="44" cy="38" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="10" cy="44" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 26 24 L 38 32 M 18 25 L 12 38" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="140" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="140" dy="0">Case 11: asymmetric ECMP</tspan>
    <tspan x="140" dy="36">and reordering</tspan>
  </text>

  
  <rect x="65" y="265" width="690" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 285)">
    <rect x="0" y="5" width="50" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="8" y1="18" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="32" x2="32" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="40" cy="18" r="3" fill="#207448" />
    <circle cx="40" cy="32" r="3" fill="#207448" />
  </g>
  <text x="160" y="308" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">a host advertises its loopback</tspan>
    <tspan x="160" dy="32">to two ToRs</tspan>
  </text>

  
  
  <path d="M 200 365 L 200 475" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />
  
  <path d="M 620 365 L 620 400 Q 645 420 620 440 L 620 475" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="250" y="395" width="320" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="410" y="428" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">splits across both paths</text>

  
  <rect x="65" y="475" width="690" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 525)">
    <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="26,12 26,26 36,26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="160" y="515" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">paths differ in delay, so one flow arrives</tspan>
    <tspan x="160" dy="32">out of sequence; TCP treats that as loss,</tspan>
    <tspan x="160" dy="32">slows down, and reacts with duplicate</tspan>
    <tspan x="160" dy="32">ACKs and SACK</tspan>
  </text>

  
  <path d="M 410 640 L 410 665" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="665" width="690" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 705)">
    <polygon points="26,4 50,46 2,46" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <line x1="26" y1="18" x2="26" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="40" r="2.5" fill="#207448" />
  </g>
  <text x="160" y="707" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">unequal path latency, per-packet or</tspan>
    <tspan x="160" dy="32">poorly keyed load balancing, bond</tspan>
    <tspan x="160" dy="32">misconfiguration on the host</tspan>
  </text>

  
  <path d="M 410 800 L 410 825" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="825" width="690" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 875)">
    <path d="M 6 8 L 46 8 C 46 32 26 48 26 48 C 26 48 6 32 6 8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <polyline points="16,24 23,31 36,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="160" y="865" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="160" dy="0">consistent per-flow hashing keeps each flow</tspan>
    <tspan x="160" dy="32">on one path while the paths stay in use;</tspan>
    <tspan x="160" dy="32">correct bonding and ECMP policy;</tspan>
    <tspan x="160" dy="32">equal-length paths</tspan>
  </text>

  
  <rect x="820" y="160" width="740" height="860" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(848, 178)">
    <path d="M 12 36 A 14 14 0 0 1 36 22 A 16 16 0 0 1 50 36 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <circle cx="31" cy="40" r="4" fill="#db8129" />
    <line x1="16" y1="16" x2="46" y2="46" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="920" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
    <tspan x="920" dy="0">Case 12: multicast</tspan>
    <tspan x="920" dy="36">blackhole in an overlay</tspan>
  </text>

  
  <rect x="845" y="265" width="690" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 305)">
    <rect x="4" y="6" width="44" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="4" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="12" r="2.5" fill="#207448" />
    <circle cx="20" cy="12" r="2.5" fill="#207448" />
  </g>
  <text x="940" y="307" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">a UDP multicast application works on</tspan>
    <tspan x="940" dy="32">physical hosts but fails on a</tspan>
    <tspan x="940" dy="32">Kubernetes overlay</tspan>
  </text>

  
  <path d="M 1190 400 L 1190 440" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="845" y="440" width="690" height="330" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 575)">
    <path d="M 6 14 C 18 8, 34 8, 46 14 L 46 38 C 34 44, 18 44, 6 38 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <circle cx="26" cy="26" r="10" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="19" y1="19" x2="33" y2="33" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="940" y="490" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">VXLAN overlays and clouds usually do not</tspan>
    <tspan x="940" dy="32">carry L2 multicast because they run no</tspan>
    <tspan x="940" dy="32">IGMP snooping or PIM; the physical switch</tspan>
    <tspan x="940" dy="32">floods multicast so it works there; without</tspan>
    <tspan x="940" dy="32">a replication plan the frame stops at the</tspan>
    <tspan x="940" dy="32">first tunnel endpoint</tspan>
  </text>

  
  <path d="M 1190 770 L 1190 825" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="845" y="825" width="690" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 875)">
    <path d="M 6 8 L 46 8 C 46 32 26 48 26 48 C 26 48 6 32 6 8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <polyline points="16,24 23,31 36,18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="940" y="877" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="940" dy="0">unicast replication in the overlay,</tspan>
    <tspan x="940" dy="32">EVPN multicast support, or</tspan>
    <tspan x="940" dy="32">refactor the application</tspan>
  </text>

  
  <rect x="40" y="1060" width="1520" height="80" rx="12" fill="#207448" />
  <text x="800" y="1110" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Reordering looks like loss to TCP, and overlays change what the network can carry</text>
</svg>