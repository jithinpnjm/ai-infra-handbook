<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>BCC and bpftrace tools by question</title>
  <desc>Infographic organizing BCC and bpftrace network diagnostic tools by questions, one-liners, side notes, and perf inspection.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">BCC and bpftrace tools by question</text>

  
  <rect x="40" y="100" width="1520" height="500" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <line x1="530" y1="100" x2="530" y2="600" stroke="#207448" stroke-width="2"/>

  
  <rect x="41" y="101" width="1518" height="83" fill="#ffffff"/>
  <line x1="40" y1="184" x2="1560" y2="184" stroke="#e8f1ea" stroke-width="2"/>
  <text x="60" y="136" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="60" dy="0">Which sessions exist,</tspan>
    <tspan x="60" dy="30">how long, how much?</tspan>
  </text>
  <text x="555" y="136" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="555" dy="0"><tspan font-family="monospace" font-weight="bold">tcplife:</tspan> one line per TCP session with PID, comm,</tspan>
    <tspan x="555" dy="30">addresses, TX_KB, RX_KB, duration</tspan>
  </text>

  
  <rect x="41" y="185" width="1518" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="240" x2="1560" y2="240" stroke="#d5e5d8" stroke-width="2"/>
  <text x="60" y="221" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Who sends and receives most?</text>
  <text x="555" y="221" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">tcptop:</tspan> top TCP senders and receivers by process
  </text>

  
  <rect x="41" y="241" width="1518" height="54" fill="#ffffff"/>
  <line x1="40" y1="296" x2="1560" y2="296" stroke="#e8f1ea" stroke-width="2"/>
  <text x="60" y="277" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Who connects where?</text>
  <text x="555" y="277" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">tcpconnect</tspan> (outbound connect), <tspan font-family="monospace" font-weight="bold">tcpaccept</tspan> (inbound accept)
  </text>

  
  <rect x="41" y="297" width="1518" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="352" x2="1560" y2="352" stroke="#d5e5d8" stroke-width="2"/>
  <text x="60" y="333" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">How slow is the handshake?</text>
  <text x="555" y="333" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">tcpconnlat:</tspan> time from connect() to established by process
  </text>

  
  <rect x="41" y="353" width="1518" height="54" fill="#ffffff"/>
  <line x1="40" y1="408" x2="1560" y2="408" stroke="#e8f1ea" stroke-width="2"/>
  <text x="60" y="389" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Which flows retransmit?</text>
  <text x="555" y="389" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">tcpretrans:</tspan> flow, state, type RETRANS or TLP
  </text>

  
  <rect x="41" y="409" width="1518" height="78" fill="#fff7ed"/>
  <rect x="40" y="408" width="10" height="80" fill="#db8129"/>
  <line x1="40" y1="488" x2="1560" y2="488" stroke="#fcd9bd" stroke-width="2"/>
  
  <g transform="translate(60, 423)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="0" y="0" width="46" height="34" rx="4"/>
    <line x1="14" y1="34" x2="32" y2="50"/>
    <line x1="32" y1="34" x2="14" y2="50"/>
  </g>
  <text x="120" y="457" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Why were packets dropped?</text>
  <text x="555" y="444" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="555" dy="0"><tspan font-family="monospace" font-weight="bold" fill="#db8129">tcpdrop:</tspan> packets dropped by the kernel TCP stack</tspan>
    <tspan x="555" dy="30">with a stack trace</tspan>
  </text>

  
  <rect x="41" y="489" width="1518" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="544" x2="1560" y2="544" stroke="#d5e5d8" stroke-width="2"/>
  <text x="60" y="525" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">How long in each state?</text>
  <text x="555" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold">tcpstates:</tspan> TCP state transitions with durations
  </text>

  
  <rect x="41" y="545" width="1518" height="54" rx="0 0 10 10" fill="#ffffff"/>
  <text x="60" y="581" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Other</text>
  <text x="555" y="581" font-family="monospace" font-size="24" fill="#303a36">sockstat, solisten, udpconnect, softirqs, hardirqs, runqlat</text>

  

  
  <rect x="40" y="620" width="745" height="300" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 634)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="42" rx="6"/>
    <polyline points="14,14 24,21 14,28"/>
    <line x1="28" y1="28" x2="42" y2="28"/>
  </g>
  <text x="132" y="666" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">One-liners</text>

  <text x="60" y="704" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0" font-family="monospace">bpftrace tracepoint:tcp:tcp_retransmit_skb</tspan>
    <tspan x="80" dy="28">counts by comm and daddr</tspan>
    <tspan x="60" dy="34" font-family="monospace">kprobe:tcp_sendmsg</tspan>
    <tspan x="80" dy="28">histogram of send size per process</tspan>
    <tspan x="60" dy="34" font-family="monospace">tracepoint:skb:kfree_skb</tspan>
    <tspan x="80" dy="28">counts by location: where packets are dropped (use ksym)</tspan>
    <tspan x="60" dy="34" font-family="monospace">kprobe:__dev_queue_xmit counts per comm</tspan>
  </text>

  
  <rect x="815" y="620" width="745" height="300" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(835, 634)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28,4 L52,14 L52,28 C52,42 28,52 28,52 C28,52 4,42 4,28 L4,14 Z"/>
    <line x1="28" y1="20" x2="28" y2="24"/>
    <line x1="28" y1="32" x2="28" y2="40"/>
  </g>
  <text x="907" y="666" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side notes</text>

  <text x="835" y="708" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="835" dy="0">eBPF programs run small verified programs inside</tspan>
    <tspan x="835" dy="34">the kernel with low overhead; install <tspan font-family="monospace">bcc-tools</tspan> or</tspan>
    <tspan x="835" dy="34"><tspan font-family="monospace">bpftrace</tspan>, run as root, kernel with BTF for CO-RE</tspan>
    <tspan x="835" dy="34">tools; the <tspan font-family="monospace">kfree_skb</tspan> tracepoint reports drop</tspan>
    <tspan x="835" dy="34">reasons on newer kernels, tcpdump-like visibility</tspan>
    <tspan x="835" dy="34">without a capture</tspan>
  </text>

  
  <rect x="40" y="940" width="1520" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(60, 954)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="4"/>
    <line x1="18" y1="2" x2="18" y2="10"/>
    <line x1="28" y1="2" x2="28" y2="10"/>
    <line x1="38" y1="2" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="54"/>
    <line x1="28" y1="46" x2="28" y2="54"/>
    <line x1="38" y1="46" x2="38" y2="54"/>
    <line x1="2" y1="18" x2="10" y2="18"/>
    <line x1="2" y1="28" x2="10" y2="28"/>
    <line x1="2" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="54" y2="18"/>
    <line x1="46" y1="28" x2="54" y2="28"/>
    <line x1="46" y1="38" x2="54" y2="38"/>
  </g>
  <text x="132" y="986" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">perf strip</text>

  <text x="60" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0"><tspan font-family="monospace">perf record -g -a -- sleep 10</tspan> with flame graphs shows CPU time in the network stack</tspan>
    <tspan x="60" dy="32">(net_rx_action, tcp_v4_rcv, the driver poll); <tspan font-family="monospace">perf trace -e net:*,skb:*;</tspan> at line rate filter narrowly,</tspan>
    <tspan x="60" dy="32">truncate with -s 128, ring buffers (-C, -W), hardware timestamps, or sample with sFlow, IPFIX</tspan>
  </text>

  
  <rect x="40" y="1115" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1153" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    These tools answer questions that counters cannot
  </text>
</svg>