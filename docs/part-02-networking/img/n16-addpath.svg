<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>ADD-PATH</title>
  <desc>Visual comparison between Default BGP announcing only one winner and BGP ADD-PATH advertising every working path.</desc>

  
  <rect width="1600" height="950" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">ADD-PATH</text>

  
  <g id="panel-default">
    <rect x="40" y="110" width="740" height="675" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(68, 136)">
      <rect x="0" y="0" width="56" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="14" cy="24" r="3.5" fill="#207448"/>
      <circle cx="28" cy="24" r="3.5" fill="#207448"/>
      <circle cx="42" cy="24" r="3.5" fill="#207448"/>
      <line x1="8" y1="12" x2="48" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="145" y="172" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">Default</text>

    
    <g id="node-default-1">
      <rect x="70" y="215" width="680" height="155" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(95, 265)">
        <rect x="0" y="28" width="22" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="34" y="28" width="22" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <rect x="17" y="0" width="22" height="18" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="11" y1="28" x2="24" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="45" y1="28" x2="32" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="180" y="280" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        two border leaves announce
        <tspan x="180" dy="36">the same destination to a spine</tspan>
      </text>
    </g>

    
    <g id="node-default-2">
      <rect x="70" y="395" width="680" height="180" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(95, 455)">
        <path d="M28 2 L50 12 V30 C50 43 28 52 28 52 C28 52 6 43 6 30 V12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
        <path d="M19 26 L25 32 L37 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="180" y="460" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        the spine's best-path rule
        <tspan x="180" dy="35">picks one winner and tells</tspan>
        <tspan x="180" dy="35">the leaf only about that one</tspan>
      </text>
    </g>

    
    <g id="node-default-3">
      <rect x="70" y="600" width="680" height="155" rx="16" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(95, 650)">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
        <line x1="21" y1="16" x2="21" y2="40" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <line x1="35" y1="16" x2="35" y2="40" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="180" y="675" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">the second path sits idle</text>
      
      <g transform="translate(180, 705)">
        <rect x="0" y="0" width="240" height="20" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="12" cy="10" r="4" fill="#207448"/>
        <line x1="24" y1="10" x2="228" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <rect x="270" y="0" width="240" height="20" rx="6" fill="#fdf2e9" stroke="#db8129" stroke-width="2" stroke-dasharray="6 4"/>
        <circle cx="282" cy="10" r="4" fill="#db8129"/>
        <line x1="294" y1="10" x2="498" y2="10" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
      </g>
    </g>
  </g>

  
  <g id="panel-addpath">
    <rect x="820" y="110" width="740" height="675" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <g transform="translate(848, 136)">
      <rect x="0" y="0" width="56" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M14 24 h28 M28 10 v28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="925" y="172" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">ADD-PATH</text>

    
    <g id="node-addpath-main">
      <rect x="850" y="215" width="680" height="540" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      
      <g transform="translate(875, 275)">
        <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M10 20 l7 7 l14 -14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 38 l7 7 l14 -14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="36" y1="17" x2="46" y2="17" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="36" y1="35" x2="46" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="955" y="275" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
        the spine advertises every
        <tspan x="955" dy="38">working path to the leaf,</tspan>
        <tspan x="955" dy="38">so the leaf can use both</tspan>
      </text>

      
      <g transform="translate(880, 420)">
        <rect x="0" y="0" width="620" height="305" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
        
        
        <rect x="80" y="25" width="130" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
        <circle cx="105" cy="50" r="4" fill="#207448"/>
        <circle cx="125" cy="50" r="4" fill="#207448"/>
        <circle cx="145" cy="50" r="4" fill="#207448"/>
        <circle cx="165" cy="50" r="4" fill="#207448"/>
        <circle cx="185" cy="50" r="4" fill="#207448"/>

        <rect x="410" y="25" width="130" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
        <circle cx="435" cy="50" r="4" fill="#207448"/>
        <circle cx="455" cy="50" r="4" fill="#207448"/>
        <circle cx="475" cy="50" r="4" fill="#207448"/>
        <circle cx="495" cy="50" r="4" fill="#207448"/>
        <circle cx="515" cy="50" r="4" fill="#207448"/>

        
        <rect x="225" y="125" width="170" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
        <circle cx="255" cy="152" r="4" fill="#207448"/>
        <circle cx="275" cy="152" r="4" fill="#207448"/>
        <circle cx="295" cy="152" r="4" fill="#207448"/>
        <circle cx="325" cy="152" r="4" fill="#207448"/>
        <circle cx="345" cy="152" r="4" fill="#207448"/>
        <circle cx="365" cy="152" r="4" fill="#207448"/>

        
        <rect x="225" y="230" width="170" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3.5"/>
        <circle cx="255" cy="255" r="4" fill="#207448"/>
        <circle cx="275" cy="255" r="4" fill="#207448"/>
        <circle cx="295" cy="255" r="4" fill="#207448"/>
        <circle cx="325" cy="255" r="4" fill="#207448"/>
        <circle cx="345" cy="255" r="4" fill="#207448"/>
        <circle cx="365" cy="255" r="4" fill="#207448"/>

        
        <line x1="145" y1="75" x2="260" y2="125" stroke="#207448" stroke-width="4"/>
        <line x1="475" y1="75" x2="360" y2="125" stroke="#207448" stroke-width="4"/>
        <line x1="280" y1="180" x2="280" y2="230" stroke="#207448" stroke-width="5"/>
        <line x1="340" y1="180" x2="340" y2="230" stroke="#207448" stroke-width="5"/>

        
        <circle cx="280" cy="205" r="13" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <path d="M275 205 l3 3 l7 -7" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <circle cx="340" cy="205" r="13" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <path d="M335 205 l3 3 l7 -7" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  
  <g id="side-analogy-chip">
    <rect x="40" y="815" width="1520" height="85" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    
    <g transform="translate(70, 831)">
      <rect x="0" y="8" width="46" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M14 8 V3 a3 3 0 0 1 3 -3 h12 a3 3 0 0 1 3 3 V8" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="10" y1="22" x2="36" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="32" x2="36" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="42" x2="26" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="145" y="868" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">dispatch board lists only the fastest route</text>
  </g>
</svg>