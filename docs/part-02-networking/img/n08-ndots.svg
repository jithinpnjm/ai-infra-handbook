<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>ndots and search domain expansion</title>
  <desc>Visual infographic explaining Kubernetes ndots and search domain expansion from resolv.conf, tried names order, and fixes.</desc>

  <rect width="1600" height="1020" fill="#f5f8f5" />

  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">ndots and search domain expansion</text>

  <rect x="60" y="110" width="640" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(95, 132)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 6 4 L 34 4 L 46 16 L 46 52 L 6 52 Z" />
    <path d="M 34 4 L 34 16 L 46 16" />
    <line x1="14" y1="26" x2="28" y2="26" />
    <line x1="14" y1="35" x2="38" y2="35" />
    <line x1="14" y1="44" x2="32" y2="44" />
  </g>
  <text x="165" y="172" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">a pod's resolv.conf</text>

  <rect x="90" y="215" width="580" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="115" y="264" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">search my-ns.svc.cluster.local </tspan>
    <tspan x="115" dy="38">svc.cluster.local cluster.local </tspan>
    <tspan x="115" dy="38">dc1.example.com</tspan>
  </text>

  <rect x="90" y="405" width="580" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="115" y="457" font-family="monospace" font-size="24" fill="#303a36">nameserver 10.96.0.10</text>

  <rect x="90" y="515" width="580" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="115" y="567" font-family="monospace" font-size="24" fill="#303a36">options ndots:5</text>

  <rect x="740" y="110" width="800" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  <g transform="translate(775, 132)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="22" cy="22" r="16" />
    <line x1="34" y1="34" x2="48" y2="48" />
  </g>
  <text x="845" y="154" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="845" dy="0">a lookup of api.example.com </tspan>
    <tspan x="845" dy="36">(2 dots, fewer than 5)</tspan>
  </text>

  <rect x="770" y="215" width="740" height="62" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
  <circle cx="805" cy="246" r="24" fill="#db8129" />
  <text x="805" y="254" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="845" y="255" font-family="monospace" font-size="24" fill="#303a36">api.example.com.my-ns.svc.cluster.local</text>

  <rect x="770" y="293" width="740" height="62" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
  <circle cx="805" cy="324" r="24" fill="#db8129" />
  <text x="805" y="332" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="845" y="333" font-family="monospace" font-size="24" fill="#303a36">...svc.cluster.local</text>

  <rect x="770" y="371" width="740" height="62" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
  <circle cx="805" cy="402" r="24" fill="#db8129" />
  <text x="805" y="410" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="845" y="411" font-family="monospace" font-size="24" fill="#303a36">...cluster.local</text>

  <rect x="770" y="449" width="740" height="62" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
  <circle cx="805" cy="480" r="24" fill="#db8129" />
  <text x="805" y="488" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="845" y="489" font-family="monospace" font-size="24" fill="#303a36">...dc1.example.com</text>

  <rect x="770" y="527" width="740" height="62" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <circle cx="805" cy="558" r="24" fill="#207448" />
  <text x="805" y="566" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="845" y="567" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">finally the name itself</text>

  <rect x="60" y="710" width="466" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(265, 745)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="24" />
    <ellipse cx="28" cy="28" rx="12" ry="24" />
    <line x1="4" y1="28" x2="52" y2="28" />
    <circle cx="46" cy="28" r="3.5" fill="#207448" />
  </g>
  <text x="293" y="860" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="293" dy="0">FQDN with </tspan>
    <tspan x="293" dy="38">trailing dot</tspan>
  </text>

  <rect x="566" y="710" width="468" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(772, 745)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="6" y1="16" x2="50" y2="16" />
    <line x1="6" y1="28" x2="50" y2="28" />
    <line x1="6" y1="40" x2="50" y2="40" />
    <circle cx="20" cy="16" r="5" fill="#e8f1ea" />
    <circle cx="38" cy="28" r="5" fill="#e8f1ea" />
    <circle cx="16" cy="40" r="5" fill="#e8f1ea" />
  </g>
  <text x="800" y="860" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">dnsConfig.options </tspan>
    <tspan x="800" dy="38">ndots: 1 or 2</tspan>
  </text>

  <rect x="1074" y="710" width="466" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1279, 745)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="28" cy="14" rx="22" ry="9" />
    <path d="M 6 14 L 6 42 A 22 9 0 0 0 50 42 L 50 14" />
    <path d="M 6 28 A 22 9 0 0 0 50 28" />
    <path d="M 28 22 L 23 33 L 29 33 L 27 43 L 34 31 L 28 31 Z" fill="#207448" />
  </g>
  <text x="1307" y="875" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">NodeLocal DNSCache</text>
</svg>