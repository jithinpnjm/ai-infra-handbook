<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The name resolution chain</title>
  <desc>Visual infographic explaining the seven-step Linux name resolution chain from nsswitch.conf and hosts to stub resolver, search domains, DNS query, recursive resolver, and RFC 6724 answer selection.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="11" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The name resolution chain</text>

  
  <line x1="570" y1="215" x2="570" y2="257" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="570" y1="357" x2="570" y2="399" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="570" y1="499" x2="570" y2="541" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="570" y1="641" x2="570" y2="683" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="570" y1="783" x2="570" y2="825" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="570" y1="925" x2="570" y2="967" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="1030" y1="318" x2="1256" y2="318" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <text x="1145" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1145" dy="0">answer found:</tspan>
    <tspan x="1145" dy="26">stop here</tspan>
  </text>

  
  <rect x="1260" y="267" width="270" height="80" rx="12" fill="#db8129" />
  <text x="1395" y="301" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    <tspan x="1395" dy="0">a match ends</tspan>
    <tspan x="1395" dy="28">the lookup</tspan>
  </text>

  
  <rect x="110" y="115" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="165" r="24" fill="#207448" />
  <text x="165" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 226 142 L 252 142 L 264 154 L 264 188 L 226 188 Z" />
    <path d="M 252 142 L 252 154 L 264 154" />
    <line x1="234" y1="166" x2="256" y2="166" />
    <circle cx="241" cy="166" r="3" fill="#207448" />
    <line x1="234" y1="177" x2="256" y2="177" />
    <circle cx="249" cy="177" r="3" fill="#207448" />
  </g>
  
  <text x="295" y="156" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">/etc/nsswitch.conf</text>
  <text x="295" y="191" font-family="sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace">hosts:</tspan> line sets the order)</text>

  
  <rect x="110" y="257" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="307" r="24" fill="#207448" />
  <text x="165" y="316" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="224" y="285" width="42" height="30" rx="4" />
    <line x1="245" y1="315" x2="245" y2="328" />
    <line x1="234" y1="328" x2="256" y2="328" />
    <circle cx="236" cy="300" r="2.5" fill="#207448" />
    <circle cx="245" cy="300" r="2.5" fill="#207448" />
    <circle cx="254" cy="300" r="2.5" fill="#207448" />
  </g>
  
  <text x="295" y="298" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">/etc/hosts</text>
  <text x="295" y="333" font-family="sans-serif" font-size="24" fill="#303a36">(static overrides, no network traffic)</text>

  
  <rect x="110" y="399" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="449" r="24" fill="#207448" />
  <text x="165" y="458" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="245" cy="449" r="10" />
    <path d="M 245 427 L 245 433 M 245 465 L 245 471 M 223 449 L 229 449 M 261 449 L 267 449 M 229 433 L 234 438 M 256 460 L 261 465 M 229 465 L 234 460 M 256 438 L 261 433" />
  </g>
  
  <text x="295" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">stub resolver / local cache</text>
  <text x="295" y="475" font-family="monospace" font-size="24" fill="#303a36">(127.0.0.53, systemd-resolved)</text>

  
  <rect x="110" y="541" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="591" r="24" fill="#207448" />
  <text x="165" y="600" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="240" cy="585" r="16" />
    <line x1="252" y1="597" x2="266" y2="611" stroke-width="5" />
    <circle cx="233" cy="585" r="2" fill="#207448" />
    <circle cx="240" cy="585" r="2" fill="#207448" />
    <circle cx="247" cy="585" r="2" fill="#207448" />
  </g>
  
  <text x="295" y="599" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">search domains and ndots</text>

  
  <rect x="110" y="683" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="733" r="24" fill="#207448" />
  <text x="165" y="742" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="245" cy="733" r="21" />
    <ellipse cx="245" cy="733" rx="10" ry="21" />
    <line x1="224" y1="733" x2="266" y2="733" />
  </g>
  
  <text x="295" y="724" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DNS query: <tspan font-family="monospace">UDP port 53</tspan></text>
  <text x="295" y="759" font-family="sans-serif" font-size="24" fill="#303a36">(<tspan font-family="monospace">TCP</tspan> if truncated), <tspan font-family="monospace">A</tspan> and <tspan font-family="monospace">AAAA</tspan></text>

  
  <rect x="110" y="825" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="875" r="24" fill="#207448" />
  <text x="165" y="884" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="245" cy="857" r="4" fill="#207448" />
    <line x1="245" y1="861" x2="234" y2="875" />
    <line x1="245" y1="861" x2="256" y2="875" />
    <circle cx="234" cy="877" r="3.5" fill="#207448" />
    <circle cx="256" cy="877" r="3.5" fill="#207448" />
    <line x1="256" y1="881" x2="249" y2="893" />
    <line x1="256" y1="881" x2="263" y2="893" />
    <circle cx="249" cy="894" r="2.5" fill="#207448" />
    <circle cx="263" cy="894" r="2.5" fill="#207448" />
  </g>
  
  <text x="295" y="866" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">recursive resolver:</text>
  <text x="295" y="901" font-family="sans-serif" font-size="24" fill="#303a36">root, then <tspan font-family="monospace">.com</tspan>, then <tspan font-family="monospace">example.com</tspan> authoritative</text>

  
  <rect x="110" y="967" width="920" height="100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="165" cy="1017" r="24" fill="#207448" />
  <text x="165" y="1026" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="225" y="996" width="40" height="42" rx="4" />
    <path d="M 232 1009 L 237 1014 L 246 1004" />
    <line x1="250" y1="1008" x2="258" y2="1008" />
    <circle cx="236" cy="1024" r="2.5" fill="#207448" />
    <line x1="244" y1="1024" x2="258" y2="1024" />
  </g>
  
  <text x="295" y="1008" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">choose among answers:</text>
  <text x="295" y="1043" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">RFC 6724</tspan> order, Happy Eyeballs</text>

  
  <rect x="110" y="1105" width="1380" height="65" rx="12" fill="#207448" />
  <text x="800" y="1146" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each door can be locked and each fails differently</text>
</svg>