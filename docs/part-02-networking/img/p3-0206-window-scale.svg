<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>The 16-bit window problem and the window-scale fix</title>
  <desc>Infographic explaining the 16-bit TCP window limit, window-scale option, bandwidth-delay product math, throughput consequences, middlebox failures, and operating system settings.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The 16-bit window problem and the window-scale fix</text>

  
  
  <rect x="40" y="110" width="480" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(65, 135)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="8" r="3" fill="#207448" />
    <circle cx="20" cy="8" r="3" fill="#207448" />
    <circle cx="30" cy="8" r="3" fill="#207448" />
    <line x1="40" y1="16" x2="40" y2="56" stroke="#db8129" stroke-width="3" stroke-dasharray="4 3" />
  </g>

  <text x="65" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="65" dy="0">Window field: 16 bits,</tspan>
    <tspan x="65" dy="36" font-size="28" fill="#303a36">tops out at 65,535 bytes</tspan>
  </text>

  
  <rect x="65" y="278" width="430" height="42" rx="8" fill="#fbeae5" stroke="#db8129" stroke-width="2" />
  <text x="280" y="307" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">far too small for modern paths</text>

  
  <line x1="280" y1="340" x2="280" y2="426" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="40" y="430" width="480" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(65, 455)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 38 L 44 18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 32 18 L 44 18 L 44 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="16" cy="20" r="4" fill="#207448" />
    <circle cx="40" cy="36" r="4" fill="#207448" />
  </g>

  <text x="135" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Window-scale option:</text>
  
  <text x="65" y="542" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0">multiplies the field by 2^shift,</tspan>
    <tspan x="65" dy="32">shift 0 to 14, windows up to</tspan>
    <tspan x="65" dy="32">about 1 GiB; negotiated</tspan>
    <tspan x="65" dy="32">only in the SYN</tspan>
  </text>

  
  <rect x="560" y="110" width="480" height="580" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(585, 135)">
    <path d="M 4 42 A 24 24 0 1 1 52 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="42" x2="42" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="5" fill="#207448" />
  </g>

  <text x="655" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="655" dy="0">A 100 Gb/s link</tspan>
    <tspan x="655" dy="36">with a 1 ms RTT:</tspan>
  </text>

  <text x="585" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="585" dy="0" font-weight="bold">bandwidth-delay product</tspan>
    <tspan x="585" dy="34" font-weight="bold">12.5 MB; needs a scale</tspan>
    <tspan x="585" dy="34">factor of at least 8</tspan>
  </text>

  
  <rect x="585" y="380" width="430" height="280" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

  
  <g transform="translate(610, 410)">
    <path d="M 18 4 L 18 16 L 6 38 A 4 4 0 0 0 10 44 L 38 44 A 4 4 0 0 0 42 38 L 30 16 L 30 4 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="14" y1="4" x2="34" y2="4" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="34" x2="36" y2="34" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <text x="670" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">lab checks:</text>

  <text x="610" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="610" dy="0">12.5 MB needs shift 8;</tspan>
    <tspan x="610" dy="48">87.5 MB; 125.0 MB</tspan>
  </text>

  
  
  <rect x="1080" y="110" width="480" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="170" r="24" fill="#207448" />
  <text x="1120" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="1165" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1165" dy="0">Throughput of one</tspan>
    <tspan x="1165" dy="30">connection is about</tspan>
    <tspan x="1165" dy="30">window / RTT</tspan>
  </text>

  
  <rect x="1080" y="245" width="480" height="175" rx="10" fill="#fdf4eb" stroke="#db8129" stroke-width="3" />
  <circle cx="1120" cy="332" r="24" fill="#db8129" />
  <text x="1120" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="1165" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1165" dy="0">A 4 MB window over a 70 ms</tspan>
    <tspan x="1165" dy="30">RTT on a 10 Gb/s link tops</tspan>
    <tspan x="1165" dy="30" fill="#db8129">out at about 457 Mb/s, no</tspan>
    <tspan x="1165" dy="30">matter how fast the NIC is</tspan>
  </text>

  
  <rect x="1080" y="435" width="480" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="492" r="24" fill="#207448" />
  <text x="1120" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1165" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1165" dy="0">The sender runs out of</tspan>
    <tspan x="1165" dy="30">permitted data and</tspan>
    <tspan x="1165" dy="30">waits for ACKs</tspan>
  </text>

  
  <rect x="1080" y="565" width="480" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1120" cy="627" r="24" fill="#207448" />
  <text x="1120" y="635" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1165" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1165" dy="0">That is why rclone,</tspan>
    <tspan x="1165" dy="30">aws s3 cp and gsutil open</tspan>
    <tspan x="1165" dy="30">many parallel connections</tspan>
  </text>

  
  <rect x="40" y="715" width="1520" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(65, 735)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="3" />
    <line x1="28" y1="0" x2="28" y2="18" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="18" x2="14" y2="36" stroke="#207448" stroke-width="3" />
    <line x1="42" y1="18" x2="42" y2="36" stroke="#207448" stroke-width="3" />
    <line x1="28" y1="36" x2="28" y2="56" stroke="#207448" stroke-width="3" />
  </g>

  <text x="145" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="145" dy="0">a middlebox that strips options on the SYN cripples every connection through it:</tspan>
    <tspan x="145" dy="32" fill="#db8129">the classic slow only through the firewall ticket</tspan>
  </text>

  
  <rect x="40" y="830" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 855)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 16 L 24 28 L 12 40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="30" y1="40" x2="44" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  <text x="145" y="872" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0" font-weight="bold" fill="#207448">tcp_window_scaling=1; ss -ti shows rcv_space;</tspan>
    <tspan x="145" dy="34">Wireshark zero window means the receiving application is the bottleneck, not the network</tspan>
  </text>

  
  <rect x="40" y="955" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1002" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep window scaling on and watch for middleboxes that strip the option</text>
</svg>