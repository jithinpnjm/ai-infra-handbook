<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Rail-optimised design (ROD)</title>
  <desc>Rail-optimised network topology connecting 8-GPU servers to rail-optimised leaf switches and spine switches.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="80" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Rail-optimised design (ROD)</text>

  
  <rect x="80" y="85" width="1440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="110" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Spine tier (connects across rails)</text>

  
  <g id="node-SP1">
    <rect x="580" y="145" width="440" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(602, 155)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="10" width="56" height="34" rx="4"/>
      <line x1="12" y1="22" x2="30" y2="22"/>
      <polyline points="24,17 30,22 24,27"/>
      <line x1="44" y1="32" x2="26" y2="32"/>
      <polyline points="32,27 26,32 32,37"/>
      <circle cx="42" cy="22" r="1.5" fill="#207448"/>
      <circle cx="14" cy="32" r="1.5" fill="#207448"/>
    </g>
    <text x="680" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Spine 1</text>
  </g>

  
  <g id="node-SP2">
    <rect x="580" y="255" width="440" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(602, 265)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="10" width="56" height="34" rx="4"/>
      <line x1="12" y1="22" x2="30" y2="22"/>
      <polyline points="24,17 30,22 24,27"/>
      <line x1="44" y1="32" x2="26" y2="32"/>
      <polyline points="32,27 26,32 32,37"/>
      <circle cx="42" cy="22" r="1.5" fill="#207448"/>
      <circle cx="14" cy="32" r="1.5" fill="#207448"/>
    </g>
    <text x="680" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Spine 2</text>
  </g>

  
  <rect x="80" y="385" width="1440" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="110" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Rail-optimised leaf stripe (1 leaf per GPU index)</text>

  
  <g id="node-LR0">
    <rect x="120" y="445" width="450" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(144, 477)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="10" width="56" height="34" rx="4"/>
      <line x1="12" y1="22" x2="30" y2="22"/>
      <polyline points="24,17 30,22 24,27"/>
      <line x1="44" y1="32" x2="26" y2="32"/>
      <polyline points="32,27 26,32 32,37"/>
      <circle cx="42" cy="22" r="1.5" fill="#db8129"/>
      <circle cx="14" cy="32" r="1.5" fill="#db8129"/>
    </g>
    <text x="224" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Leaf Rail 0</text>
    <text x="224" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(all GPU 0s: 1 hop)</text>
  </g>

  
  <g id="node-LR1">
    <rect x="1030" y="445" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1054, 477)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="10" width="56" height="34" rx="4"/>
      <line x1="12" y1="22" x2="30" y2="22"/>
      <polyline points="24,17 30,22 24,27"/>
      <line x1="44" y1="32" x2="26" y2="32"/>
      <polyline points="32,27 26,32 32,37"/>
      <circle cx="42" cy="22" r="1.5" fill="#207448"/>
      <circle cx="14" cy="32" r="1.5" fill="#207448"/>
    </g>
    <text x="1134" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Leaf Rail 1</text>
    <text x="1134" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(all GPU 1s: 1 hop)</text>
  </g>

  
  <rect x="80" y="630" width="1440" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="110" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">8-GPU servers (internal NVSwitch)</text>

  
  <g id="node-S1">
    <rect x="560" y="705" width="480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(584, 732)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="6" width="56" height="20" rx="3"/>
      <line x1="10" y1="16" x2="14" y2="16"/>
      <line x1="20" y1="16" x2="24" y2="16"/>
      <line x1="30" y1="16" x2="34" y2="16"/>
      <circle cx="46" cy="16" r="2" fill="#207448"/>
      <rect x="0" y="30" width="56" height="20" rx="3"/>
      <line x1="10" y1="40" x2="14" y2="40"/>
      <line x1="20" y1="40" x2="24" y2="40"/>
      <line x1="30" y1="40" x2="34" y2="40"/>
      <circle cx="46" cy="40" r="2" fill="#207448"/>
    </g>
    <text x="664" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server 1</text>
    <text x="664" y="787" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas" font-size="24" fill="#303a36">GPU0 | GPU1 ...</text>
  </g>

  
  <g id="node-S2">
    <rect x="560" y="845" width="480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(584, 872)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="6" width="56" height="20" rx="3"/>
      <line x1="10" y1="16" x2="14" y2="16"/>
      <line x1="20" y1="16" x2="24" y2="16"/>
      <line x1="30" y1="16" x2="34" y2="16"/>
      <circle cx="46" cy="16" r="2" fill="#207448"/>
      <rect x="0" y="30" width="56" height="20" rx="3"/>
      <line x1="10" y1="40" x2="14" y2="40"/>
      <line x1="20" y1="40" x2="24" y2="40"/>
      <line x1="30" y1="40" x2="34" y2="40"/>
      <circle cx="46" cy="40" r="2" fill="#207448"/>
    </g>
    <text x="664" y="887" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server 2</text>
    <text x="664" y="927" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas" font-size="24" fill="#303a36">GPU0 | GPU1 ...</text>
  </g>

  

  
  
  <path d="M 450 445 L 450 292.5 L 580 292.5" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 320 445 L 320 182.5 L 580 182.5" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 1150 445 L 1150 292.5 L 1020 292.5" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 1280 445 L 1280 182.5 L 1020 182.5" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  
  <path d="M 560 760 L 450 760 L 450 565" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 560 900 L 320 900 L 320 565" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 1040 760 L 1150 760 L 1150 565" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  <path d="M 1040 900 L 1280 900 L 1280 565" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>

  
  
  <g transform="translate(468, 610)">
    <rect x="0" y="0" width="82" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="41" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">NIC0</text>
  </g>

  
  <g transform="translate(1050, 610)">
    <rect x="0" y="0" width="82" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="41" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">NIC1</text>
  </g>
</svg>