    <path d="M 1180 240 L 1200 240 M 1195 235 L 1200 240 L 1195 245 M 1190 230 L 1190 250 M 1185 235 L 1190 230 L 1195 235" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
