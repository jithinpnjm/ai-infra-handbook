    <line x1="40" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1225" y="168" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">Route reflector</text>

  
