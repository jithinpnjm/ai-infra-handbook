    <path d="M 1041 480 L 1061 480 M 1056 475 L 1061 480 L 1056 485 M 1051 470 L 1051 490 M 1046 475 L 1051 470 L 1056 475" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <circle cx="1051" cy="320" r="28" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <path d="M 1041 320 L 1061 320 M 1056 315 L 1061 320 L 1056 325 M 1051 310 L 1051 330 M 1046 315 L 1051 310 L 1056 315" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  
  <circle cx="1190" cy="400" r="42" fill="#ffffff" stroke="#207448" stroke-width="5"/>
  <circle cx="1190" cy="400" r="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <path d="M 1162 400 L 1218 400 M 1210 393 L 1218 400 L 1210 407 M 1170 393 L 1162 400 L 1170 407" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1190 372 L 1190 428 M 1183 380 L 1190 372 L 1197 380 M 1183 420 L 1190 428 L 1197 420" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="860" y="640" width="660" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1190" y="682" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="1190" dy="0">two route reflectors serving the same</tspan>
    <tspan x="1190" dy="36">hundred routers: 197 sessions</tspan>
  </text>


  
  <rect x="50" y="805" width="1500" height="95" rx="14" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(80, 824)">
    <polygon points="28,4 52,48 4,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="41" r="2.5" fill="#db8129"/>
  </g>
  <text x="835" y="862" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">RR picks best paths from its own IGP-cost view, which can hide path diversity</text>


  
  
  <rect x="50" y="925" width="720" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(85, 954)">
