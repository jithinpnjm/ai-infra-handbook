  <rect x="80" y="640" width="660" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="410" y="705" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">100 routers need 4,950 iBGP sessions</text>


  
  <rect x="830" y="105" width="720" height="675" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
