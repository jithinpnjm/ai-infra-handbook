  <text x="445" y="992" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">neighbor X next-hop-self</text>

  
  <rect x="830" y="925" width="720" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(865, 954)">
