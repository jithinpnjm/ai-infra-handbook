    <line x1="410" y1="240" x2="410" y2="560"/>
    <line x1="410" y1="240" x2="271" y2="480"/>
    <line x1="410" y1="240" x2="271" y2="320"/>
    <line x1="549" y1="320" x2="549" y2="480"/>
    <line x1="549" y1="320" x2="410" y2="560"/>
    <line x1="549" y1="320" x2="271" y2="480"/>
    <line x1="549" y1="320" x2="271" y2="320"/>
    <line x1="549" y1="480" x2="410" y2="560"/>
