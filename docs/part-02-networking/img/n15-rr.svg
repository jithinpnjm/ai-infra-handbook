<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Full mesh versus route reflector</title>
  <desc>Visual comparison between iBGP full mesh scaling requirements and route reflector hub-and-spoke topology with operational commands and path diversity caveat.</desc>

  
