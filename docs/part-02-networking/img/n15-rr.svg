    <path d="M 261 320 L 281 320 M 276 315 L 281 320 L 276 325 M 271 310 L 271 330 M 266 315 L 271 310 L 276 315" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
