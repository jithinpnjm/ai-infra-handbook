<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Capture-driven troubleshooting workflow</title>
  <desc>Seven-step capture-driven troubleshooting workflow arranged in a loop with diagnostic example and key takeaway.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Capture-driven troubleshooting workflow</text>

  
  
  <line x1="510" y1="245" x2="570" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1030" y1="245" x2="1090" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1320" y1="380" x2="1320" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1320" y1="700" x2="1320" y2="750" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1090" y1="885" x2="510" y2="885" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="280" y1="750" x2="280" y2="700" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="280" y1="430" x2="280" y2="380" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />


  
  <g id="step-1">
    <rect x="50" y="110" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="100" cy="160" r="24" fill="#207448" />
    <text x="100" y="160" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(400, 132)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="24" />
      <circle cx="28" cy="28" r="12" />
      <line x1="28" y1="0" x2="28" y2="10" />
      <line x1="28" y1="46" x2="28" y2="56" />
      <line x1="0" y1="28" x2="10" y2="28" />
      <line x1="46" y1="28" x2="56" y2="28" />
    </g>
    
    <text x="280" y="245" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">state the question</tspan>
      <tspan x="280" dy="42">precisely</tspan>
    </text>
  </g>


  
  <g id="step-2">
    <rect x="570" y="110" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="620" cy="160" r="24" fill="#207448" />
    <text x="620" y="160" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g transform="translate(920, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="44" r="8" />
      <circle cx="44" cy="44" r="8" />
      <circle cx="28" cy="14" r="8" />
      <line x1="18" y1="38" x2="24" y2="21" />
      <line x1="38" y1="38" x2="32" y2="21" />
      <line x1="20" y1="44" x2="36" y2="44" />
    </g>
    
    <text x="800" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">choose capture points</text>
    <text x="800" y="255" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">(client, server,</tspan>
      <tspan x="800" dy="30">both sides of a firewall,</tspan>
      <tspan x="800" dy="30">NAT or load balancer,</tspan>
      <tspan x="800" dy="30">switch mirror)</tspan>
    </text>
  </g>


  
  <g id="step-3">
    <rect x="1090" y="110" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1140" cy="160" r="24" fill="#207448" />
    <text x="1140" y="160" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(1440, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,8 50,8 34,30 34,50 22,44 22,30" />
    </g>
    
    <text x="1320" y="220" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">write the narrowest</tspan>
      <tspan x="1320" dy="38">filter</tspan>
    </text>
    <text x="1320" y="300" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">(ring buffer if</tspan>
      <tspan x="1320" dy="30">intermittent)</tspan>
    </text>
  </g>


  
  <g id="step-4">
    <rect x="1090" y="430" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1140" cy="480" r="24" fill="#207448" />
    <text x="1140" y="480" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(1440, 452)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="22" />
      <line x1="28" y1="4" x2="28" y2="8" />
      <line x1="22" y1="4" x2="34" y2="4" />
      <polyline points="28,18 28,30 38,30" />
    </g>
    
    <text x="1320" y="565" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">reproduce the problem</tspan>
      <tspan x="1320" dy="44">and note times</tspan>
    </text>
  </g>


  
  <g id="step-5">
    <rect x="1090" y="750" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1140" cy="800" r="24" fill="#207448" />
    <text x="1140" y="800" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g transform="translate(1440, 772)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="18" height="26" rx="2" />
      <rect x="32" y="8" width="18" height="26" rx="2" />
      <line x1="10" y1="46" x2="46" y2="46" />
      <polyline points="40,40 46,46 40,52" />
    </g>
    
    <text x="1320" y="855" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">open the files together</text>
    <text x="1320" y="895" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">and align by time,</tspan>
      <tspan x="1320" dy="32">compare what left A</tspan>
      <tspan x="1320" dy="32">with what arrived at B</tspan>
    </text>
  </g>


  
  <g id="step-6">
    <rect x="50" y="750" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="100" cy="800" r="24" fill="#207448" />
    <text x="100" y="800" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    
    <g transform="translate(400, 772)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 46 A 24 24 0 1 1 48 46" />
      <line x1="28" y1="34" x2="40" y2="20" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
    </g>
    
    <text x="280" y="845" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">confirm with counters</tspan>
      <tspan x="280" dy="36">and BPF tools</tspan>
    </text>
    <text x="280" y="925" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">(nstat, ss -ti,</tspan>
      <tspan x="280" dy="30">tcpretrans, tcpdrop,</tspan>
      <tspan x="280" dy="30">conntrack)</tspan>
    </text>
  </g>


  
  <g id="step-7">
    <rect x="50" y="430" width="460" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="100" cy="480" r="24" fill="#207448" />
    <text x="100" y="480" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
    
    <g transform="translate(400, 452)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="16,28 24,36 40,18" />
    </g>
    
    <text x="280" y="565" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">fix and capture again</tspan>
      <tspan x="280" dy="44">to verify</tspan>
    </text>
  </g>


  
  <g id="orange-example-chip">
    <rect x="570" y="430" width="460" height="270" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(772, 452)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 50,28 28,50 6,28" />
      <line x1="28" y1="18" x2="28" y2="30" />
      <circle cx="28" cy="38" r="2" fill="#db8129" />
    </g>
    
    <text x="800" y="540" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">SYN at the server with no</tspan>
      <tspan x="800" dy="36">SYN-ACK back suggests a</tspan>
      <tspan x="800" dy="36">server firewall or a</tspan>
      <tspan x="800" dy="36">full listen queue</tspan>
    </text>
  </g>


  
  <g id="green-takeaway-bar">
    <rect x="50" y="1055" width="1500" height="90" rx="16" fill="#207448" />
    <text x="800" y="1112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">A capture aimed at one question often answers it in a minute</text>
  </g>

</svg>