<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pick the algorithm by the unit of work it counts</title>
  <desc>Visual decision guide matching workload units to load balancing algorithms, pitfalls, and four core balancing principles.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Pick the algorithm by the unit of work it counts</text>

  
  <rect x="1130" y="75" width="430" height="1035" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1155" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Four principles</text>

  
  <rect x="1150" y="135" width="390" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1170" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1170" dy="0">choose the metric that</tspan>
    <tspan x="1170" dy="28">represents work: connections,</tspan>
    <tspan x="1170" dy="28">requests, tokens and</tspan>
    <tspan x="1170" dy="28">GPU-seconds differ</tspan>
  </text>

  
  <rect x="1150" y="325" width="390" height="285" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1170" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1170" dy="0">many LB instances each</tspan>
    <tspan x="1170" dy="28">doing local least connections</tspan>
    <tspan x="1170" dy="28">herd onto the same backend,</tspan>
    <tspan x="1170" dy="28">like drivers following one</tspan>
    <tspan x="1170" dy="28">satnav to one empty car</tspan>
    <tspan x="1170" dy="28">park; a randomised pick</tspan>
    <tspan x="1170" dy="28">breaks it up</tspan>
  </text>

  
  <rect x="1150" y="625" width="390" height="230" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1170" y="662" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1170" dy="0">hash affinity serves cache</tspan>
    <tspan x="1170" dy="28">locality and state but</tspan>
    <tspan x="1170" dy="28">accepts uneven load: plan</tspan>
    <tspan x="1170" dy="28">for reshuffling with</tspan>
    <tspan x="1170" dy="28">consistent or resilient</tspan>
    <tspan x="1170" dy="28">hashing</tspan>
  </text>

  
  <rect x="1150" y="870" width="390" height="225" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1170" y="907" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1170" dy="0">slow start ramps up the</tspan>
    <tspan x="1170" dy="28">weight of a new or</tspan>
    <tspan x="1170" dy="28">recovered backend while</tspan>
    <tspan x="1170" dy="28">its JIT, caches and GPU</tspan>
    <tspan x="1170" dy="28">warm up</tspan>
  </text>

  

  
  <rect x="40" y="75" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Short stateless</tspan>
    <tspan x="56" dy="28">equal requests</tspan>
  </text>

  <line x1="330" y1="115" x2="354" y2="115" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="75" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 91)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 24 6 A 18 18 0 1 1 6 24"/>
    <polyline points="18,6 24,6 24,12"/>
    <circle cx="24" cy="24" r="5"/>
  </g>
  <text x="432" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">round robin or</tspan>
    <tspan x="432" dy="28">weighted round robin</tspan>
  </text>

  <line x1="730" y1="115" x2="754" y2="115" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="75" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">ignores request cost</tspan>
    <tspan x="776" dy="28">and backend load</tspan>
  </text>

  
  <rect x="40" y="161" width="290" height="132" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Long-lived</tspan>
    <tspan x="56" dy="26">connections or</tspan>
    <tspan x="56" dy="26">variable-length</tspan>
    <tspan x="56" dy="26">requests</tspan>
  </text>

  <line x1="330" y1="227" x2="354" y2="227" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="161" width="370" height="132" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 203)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="8" cy="24" r="5"/>
    <circle cx="40" cy="12" r="5"/>
    <circle cx="40" cy="36" r="5"/>
    <line x1="13" y1="22" x2="35" y2="14"/>
    <line x1="13" y1="26" x2="35" y2="34"/>
  </g>
  <text x="432" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">least connections</text>

  <line x1="730" y1="227" x2="754" y2="227" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="161" width="340" height="132" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">counts connections,</tspan>
    <tspan x="776" dy="26">not work; needs</tspan>
    <tspan x="776" dy="26">shared state across</tspan>
    <tspan x="776" dy="26">LB instances</tspan>
  </text>

  
  <rect x="40" y="299" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">HTTP or gRPC</tspan>
    <tspan x="56" dy="28">requests</tspan>
  </text>

  <line x1="330" y1="339" x2="354" y2="339" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="299" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 315)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="8" width="40" height="8" rx="2"/>
    <rect x="4" y="20" width="40" height="8" rx="2"/>
    <rect x="4" y="32" width="40" height="8" rx="2"/>
  </g>
  <text x="432" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">least outstanding</tspan>
    <tspan x="432" dy="28">requests</tspan>
  </text>

  <line x1="730" y1="339" x2="754" y2="339" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="299" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">same, request-granular</text>

  
  <rect x="40" y="385" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Heterogeneous</tspan>
    <tspan x="56" dy="28">backends</tspan>
  </text>

  <line x1="330" y1="425" x2="354" y2="425" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="385" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 401)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="18"/>
    <polyline points="24,12 24,24 33,24"/>
  </g>
  <text x="432" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">least response time,</tspan>
    <tspan x="432" dy="28">EWMA, peak-EWMA</tspan>
  </text>

  <line x1="730" y1="425" x2="754" y2="425" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="385" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">needs measurement; can</tspan>
    <tspan x="776" dy="28">oscillate (herding)</tspan>
  </text>

  
  <rect x="40" y="471" width="290" height="80" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="56" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Large pools with</tspan>
    <tspan x="56" dy="28">imperfect load info</tspan>
  </text>

  <line x1="330" y1="511" x2="354" y2="511" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <rect x="360" y="471" width="370" height="80" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2.5"/>
  
  <g transform="translate(376, 487)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="4" y="4" width="40" height="40" rx="6"/>
    <circle cx="16" cy="16" r="3" fill="#db8129"/>
    <circle cx="32" cy="32" r="3" fill="#db8129"/>
  </g>
  <text x="432" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">power of two random choices</text>

  <line x1="730" y1="511" x2="754" y2="511" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <rect x="760" y="471" width="340" height="80" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="2"/>
  <text x="776" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">needs load info per backend</text>

  
  <rect x="40" y="557" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Session affinity or</tspan>
    <tspan x="56" dy="28">cache locality</tspan>
  </text>

  <line x1="330" y1="597" x2="354" y2="597" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="557" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 573)" stroke="#207448" stroke-width="3" fill="none">
    <line x1="16" y1="6" x2="12" y2="42"/>
    <line x1="32" y1="6" x2="28" y2="42"/>
    <line x1="6" y1="18" x2="42" y2="18"/>
    <line x1="6" y1="30" x2="42" y2="30"/>
  </g>
  <text x="432" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">source, URL or</tspan>
    <tspan x="432" dy="28">header hash</tspan>
  </text>

  <line x1="730" y1="597" x2="754" y2="597" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="557" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">remaps most keys</tspan>
    <tspan x="776" dy="28">when N changes</tspan>
  </text>

  
  <rect x="40" y="643" width="290" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="677" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">Caches, sticky</tspan>
    <tspan x="56" dy="26">sessions, sharded</tspan>
    <tspan x="56" dy="26">stores</tspan>
  </text>

  <line x1="330" y1="696" x2="354" y2="696" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="643" width="370" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 672)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="18"/>
    <circle cx="24" cy="6" r="3" fill="#207448"/>
    <circle cx="39" cy="33" r="3" fill="#207448"/>
    <circle cx="9" cy="33" r="3" fill="#207448"/>
  </g>
  <text x="432" y="677" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">consistent hashing</tspan>
    <tspan x="432" dy="26">(ring, rendezvous,</tspan>
    <tspan x="432" dy="26">jump hash)</tspan>
  </text>

  <line x1="730" y1="696" x2="754" y2="696" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="643" width="340" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">load imbalance; virtual</tspan>
    <tspan x="776" dy="28">nodes help; hot keys</tspan>
  </text>

  
  <rect x="40" y="755" width="290" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">L4 LBs behind ECMP</text>

  <line x1="330" y1="808" x2="354" y2="808" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="755" width="370" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 784)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="40" height="36" rx="3"/>
    <line x1="4" y1="18" x2="44" y2="18"/>
    <line x1="4" y1="30" x2="44" y2="30"/>
    <line x1="24" y1="6" x2="24" y2="42"/>
  </g>
  <text x="432" y="814" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Maglev hashing</text>

  <line x1="730" y1="808" x2="754" y2="808" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="755" width="340" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="790" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">table rebuild cost;</tspan>
    <tspan x="776" dy="26">small disruption</tspan>
    <tspan x="776" dy="26">on change</tspan>
  </text>

  
  <rect x="40" y="867" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Cost and latency</text>

  <line x1="330" y1="907" x2="354" y2="907" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="867" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 883)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="18"/>
    <ellipse cx="24" cy="24" rx="8" ry="18"/>
    <line x1="6" y1="24" x2="42" y2="24"/>
  </g>
  <text x="432" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">locality or zone-aware</text>

  <line x1="730" y1="907" x2="754" y2="907" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="867" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="902" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">capacity imbalance</tspan>
    <tspan x="776" dy="28">across zones</tspan>
  </text>

  
  <rect x="40" y="953" width="290" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="1001" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DR and spillover</text>

  <line x1="330" y1="993" x2="354" y2="993" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="953" width="370" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 969)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 24 6 L 40 12 L 40 24 C 40 34 24 42 24 42 C 24 42 8 34 8 24 L 8 12 Z"/>
    <polyline points="18,24 22,28 30,18"/>
  </g>
  <text x="432" y="988" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">priority or</tspan>
    <tspan x="432" dy="28">failover groups</tspan>
  </text>

  <line x1="730" y1="993" x2="754" y2="993" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="953" width="340" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="1001" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">cold backups</text>

  
  <rect x="40" y="1039" width="290" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="56" y="1098" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">LLM inference</text>

  <line x1="330" y1="1092" x2="354" y2="1092" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="1039" width="370" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(376, 1068)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="10" width="28" height="28" rx="4"/>
    <rect x="17" y="17" width="14" height="14"/>
    <line x1="17" y1="4" x2="17" y2="10"/>
    <line x1="31" y1="4" x2="31" y2="10"/>
    <line x1="17" y1="38" x2="17" y2="44"/>
    <line x1="31" y1="38" x2="31" y2="44"/>
    <line x1="4" y1="17" x2="10" y2="17"/>
    <line x1="4" y1="31" x2="10" y2="31"/>
    <line x1="38" y1="17" x2="44" y2="17"/>
    <line x1="38" y1="31" x2="44" y2="31"/>
  </g>
  <text x="432" y="1073" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="432" dy="0">load-aware custom:</tspan>
    <tspan x="432" dy="26">GPU, queue,</tspan>
    <tspan x="432" dy="26">KV-cache</tspan>
  </text>

  <line x1="730" y1="1092" x2="754" y2="1092" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="760" y="1039" width="340" height="106" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="776" y="1086" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="776" dy="0">needs telemetry;</tspan>
    <tspan x="776" dy="28">careful staleness</tspan>
    <tspan x="776" dy="28">handling</tspan>
  </text>

  
  <rect x="40" y="1155" width="1520" height="35" rx="6" fill="#207448"/>
  <text x="800" y="1180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Name the unit of work first, then pick the algorithm that counts it</text>
</svg>