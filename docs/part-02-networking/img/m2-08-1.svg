<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>The structure of DNS</title>
  <desc>Hierarchical structure of the Domain Name System showing delegation from the root down to a host record.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The structure of DNS</text>

  
  
  <path d="M 640 225 C 640 262, 330 248, 330 283" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="800" y1="225" x2="800" y2="283" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 960 225 C 960 262, 1270 248, 1270 283" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="800" y1="390" x2="800" y2="448" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="800" y1="565" x2="800" y2="623" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <line x1="800" y1="740" x2="800" y2="798" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  

  
  <g id="node-root">
    <rect x="240" y="110" width="1120" height="115" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(295, 167)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#207448" stroke-width="4" />
      <ellipse cx="0" cy="0" rx="12" ry="25" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#207448" stroke-width="3" />
      <circle cx="0" cy="0" r="3.5" fill="#207448" />
    </g>
    
    <text x="350" y="152" font-family="sans-serif">
      <tspan x="350" dy="0" font-size="34" font-weight="bold" fill="#207448">.</tspan>
      <tspan x="350" dy="36" font-size="24" fill="#303a36">(root: 13 server identities, hundreds of anycast instances)</tspan>
    </text>
  </g>

  
  
  <g id="node-org">
    <rect x="180" y="285" width="300" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(235, 337)">
      <circle cx="0" cy="-14" r="7.5" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="-13" cy="12" r="6.5" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="13" cy="12" r="6.5" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="-5" y1="-7" x2="-10" y2="6" stroke="#207448" stroke-width="3" />
      <line x1="5" y1="-7" x2="10" y2="6" stroke="#207448" stroke-width="3" />
    </g>
    <text x="290" y="348" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">org</text>
  </g>

  
  <g id="node-com">
    <rect x="560" y="285" width="480" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(615, 337)">
      <rect x="-24" y="-22" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="-24" y1="-3" x2="24" y2="-3" stroke="#207448" stroke-width="2.5" />
      <circle cx="-12" cy="-12" r="3" fill="#207448" />
      <circle cx="0" cy="-12" r="3" fill="#207448" />
      <circle cx="-12" cy="9" r="3" fill="#207448" />
      <circle cx="0" cy="9" r="3" fill="#207448" />
    </g>
    <text x="670" y="331" font-family="sans-serif">
      <tspan x="670" dy="0" font-size="32" font-weight="bold" fill="#207448">com</tspan>
      <tspan x="670" dy="34" font-size="24" fill="#303a36">(TLD)</tspan>
    </text>
  </g>

  
  <g id="node-io">
    <rect x="1120" y="285" width="300" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1175, 337)">
      <circle cx="-9" cy="0" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="15" y1="-14" x2="15" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1230" y="348" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">io</text>
  </g>

  
  <g id="node-ex">
    <rect x="480" y="450" width="640" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(540, 507)">
      <path d="M 0 -24 L 22 -14 L 22 7 C 22 20 0 28 0 28 C 0 28 -22 20 -22 7 L -22 -14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M -8 1 L -2 7 L 10 -5" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="595" y="493" font-family="sans-serif">
      <tspan x="595" dy="0" font-size="30" font-weight="bold" fill="#207448">example.com zone</tspan>
      <tspan x="595" dy="36" font-size="24" fill="#303a36">(delegated to its own NS)</tspan>
    </text>
  </g>

  
  <g id="node-dc1">
    <rect x="480" y="625" width="640" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(540, 682)">
      <rect x="-22" y="-22" width="44" height="44" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="-22" y1="-7" x2="22" y2="-7" stroke="#207448" stroke-width="2.5" />
      <line x1="-22" y1="8" x2="22" y2="8" stroke="#207448" stroke-width="2.5" />
      <circle cx="12" cy="-14" r="2.5" fill="#207448" />
      <circle cx="12" cy="0" r="2.5" fill="#207448" />
      <circle cx="12" cy="15" r="2.5" fill="#207448" />
      <line x1="-14" y1="-14" x2="-2" y2="-14" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      <line x1="-14" y1="0" x2="-2" y2="0" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      <line x1="-14" y1="15" x2="-2" y2="15" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="595" y="668" font-family="sans-serif">
      <tspan x="595" dy="0" font-size="30" font-weight="bold" fill="#207448">dc1.example.com</tspan>
      <tspan x="595" dy="36" font-size="24" fill="#303a36">(optionally delegated again)</tspan>
    </text>
  </g>

  
  <g id="node-h">
    <rect x="480" y="800" width="640" height="120" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(540, 860)">
      <rect x="-20" y="-20" width="40" height="40" rx="5" fill="none" stroke="#db8129" stroke-width="3.5" />
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#db8129" stroke-width="2.5" />
      
      <line x1="-12" y1="-26" x2="-12" y2="-20" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-26" x2="0" y2="-20" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="-26" x2="12" y2="-20" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-12" y1="20" x2="-12" y2="26" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="20" x2="0" y2="26" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="12" y1="20" x2="12" y2="26" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-26" y1="-12" x2="-20" y2="-12" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-26" y1="0" x2="-20" y2="0" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-26" y1="12" x2="-20" y2="12" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="-12" x2="26" y2="-12" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="0" x2="26" y2="0" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <line x1="20" y1="12" x2="26" y2="12" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="595" y="843">
      <tspan x="595" dy="0" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">gpu01.dc1.example.com</tspan>
      <tspan x="595" dy="36" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">A 10.20.0.45</tspan>
    </text>
  </g>
</svg>