<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Store-and-forward versus cut-through: when the first bit leaves</title>
  <desc>Two horizontal timelines for one 1500-byte frame crossing a switch.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Store-and-forward versus cut-through: when the first bit leaves</text>

  
  
  
  <g id="store-and-forward-panel">
    <rect x="40" y="110" width="1010" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="65" y="130" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="75" y1="145" x2="111" y2="145" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="161" x2="111" y2="161" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="57" y1="143" x2="65" y2="143" stroke="#207448" stroke-width="3"/>
    <line x1="57" y1="163" x2="65" y2="163" stroke="#207448" stroke-width="3"/>
    <line x1="121" y1="143" x2="129" y2="143" stroke="#207448" stroke-width="3"/>
    <line x1="121" y1="163" x2="129" y2="163" stroke="#207448" stroke-width="3"/>

    
    <text x="135" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Store-and-forward</text>

    
    <line x1="530" y1="200" x2="530" y2="350" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="435" y="185" width="190" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="530" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">FCS checked</text>

    
    <rect x="180" y="235" width="350" height="52" rx="8" fill="#207448"/>
    <text x="355" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ingress port</text>

    
    <path d="M 530 287 L 530 321 L 540 321" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="550" y="295" width="350" height="52" rx="8" fill="#207448"/>
    <text x="725" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">egress port</text>

    
    <rect x="70" y="380" width="950" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="545" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">latency grows with frame size, errors are filtered out</text>
  </g>

  
  
  
  <g id="cut-through-panel">
    <rect x="40" y="530" width="1010" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="65" y="550" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 73 573 L 110 573 M 104 565 L 113 573 L 104 581" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="57" y1="563" x2="65" y2="563" stroke="#207448" stroke-width="3"/>
    <line x1="57" y1="583" x2="65" y2="583" stroke="#207448" stroke-width="3"/>
    <line x1="121" y1="563" x2="129" y2="563" stroke="#207448" stroke-width="3"/>
    <line x1="121" y1="583" x2="129" y2="583" stroke="#207448" stroke-width="3"/>

    
    <text x="135" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Cut-through</text>

    
    <rect x="180" y="588" width="580" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="470" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">first 14 to 24 bytes (destination MAC read)</text>
    <path d="M 225 630 L 225 640" stroke="#207448" stroke-width="2" marker-end="url(#arrow)"/>

    
    <rect x="180" y="642" width="350" height="52" rx="8" fill="#207448"/>
    <rect x="180" y="642" width="70" height="52" rx="8" fill="#3da36d"/>

    
    <path d="M 250 694 L 250 710" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="250" y="715" width="350" height="52" rx="8" fill="#207448"/>

    
    <line x1="530" y1="642" x2="530" y2="775" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6 4"/>

    
    <rect x="55" y="795" width="980" height="110" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
    <text x="75" y="826" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">latency stays at a few hundred nanoseconds whatever the frame size;</tspan>
      <tspan x="75" dy="32" font-weight="bold" fill="#db8129">a corrupted frame may already be on its way before the FCS is checked,</tspan>
      <tspan x="75" dy="32">though some designs poison such frames at egress</tspan>
    </text>
  </g>

  
  
  
  <g id="right-panel">
    <rect x="1090" y="110" width="470" height="810" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <circle cx="1325" cy="155" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="1325,139 1325,155 1339,155" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1321" y1="125" x2="1329" y2="125" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1325" y1="125" x2="1325" y2="131" stroke="#207448" stroke-width="4"/>

    
    <text x="1325" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1325" dy="0">Serialisation delay =</tspan>
      <tspan x="1325" dy="38">frame size / link rate</tspan>
    </text>

    
    <rect x="1115" y="300" width="420" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1325" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1325" dy="0">1500-byte frame</tspan>
      <tspan x="1325" dy="34">at 100 Gb/s: 120 ns</tspan>
    </text>

    
    <path d="M 1325 440 L 1325 470" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="1115" y="480" width="420" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1325" y="535" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1325" dy="0">same frame at 1 Gb/s:</tspan>
      <tspan x="1325" dy="34">12 microseconds</tspan>
    </text>

    
    <path d="M 1325 620 L 1325 650" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

    
    <rect x="1115" y="660" width="420" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1325" y="710" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1325" dy="0">about a hundred</tspan>
      <tspan x="1325" dy="34">times longer</tspan>
    </text>
  </g>

  
  
  
  <g id="footer-panel">
    <rect x="40" y="960" width="1520" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1000" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">Data-centre switch port-to-port latency: about 300 ns to 1 microsecond with cut-through;</tspan>
      <tspan x="800" dy="34">a multi-hop collective may cross 3 to 5 hops in a Clos fabric</tspan>
    </text>
  </g>

  
  
  
  <g id="bottom-bar">
    <rect x="40" y="1090" width="1520" height="70" rx="12" fill="#207448"/>
    <text x="800" y="1134" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">A store-and-forward hop adds the serialisation delay every time</text>
  </g>
</svg>