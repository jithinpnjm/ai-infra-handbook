<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Keeping the client address behind a proxy: forwarded headers and the PROXY protocol</title>
  <desc>Visual explanation of preserving client source IP addresses using L7 forwarded headers versus the L4 PROXY protocol, along with alternative approaches.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">Keeping the client address behind a proxy: forwarded headers and the PROXY protocol</text>

  
  <rect x="40" y="100" width="1110" height="350" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="145" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">L7: forwarded headers</text>

  
  <rect x="65" y="170" width="150" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="115" y="185" width="50" height="34" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="140" y1="219" x2="140" y2="231" stroke="#207448" stroke-width="3" />
  <line x1="125" y1="231" x2="155" y2="231" stroke="#207448" stroke-width="3" />
  <text x="140" y="265" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">client</text>

  
  <line x1="215" y1="225" x2="257" y2="225" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="265" y="170" width="150" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="315" y="185" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 327 202 L 353 202 M 345 195 L 353 202 L 345 209" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="340" y="265" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">proxy</text>

  
  <line x1="415" y1="225" x2="452" y2="225" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="460" y="165" width="460" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="690" y="200" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the proxy adds</text>
  <text x="690" y="235" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">'X-Forwarded-For: client IP'</text>
  <text x="690" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">or 'Forwarded'</text>

  
  <line x1="920" y1="225" x2="957" y2="225" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="965" y="170" width="155" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1017" y="182" width="50" height="38" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1025" y1="195" x2="1059" y2="195" stroke="#207448" stroke-width="2" />
  <line x1="1025" y1="207" x2="1059" y2="207" stroke="#207448" stroke-width="2" />
  <circle cx="1032" cy="189" r="2" fill="#207448" />
  <circle cx="1032" cy="201" r="2" fill="#207448" />
  <text x="1042" y="265" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">backend</text>

  
  <rect x="65" y="305" width="1055" height="120" rx="8" fill="#fdf6ee" stroke="#db8129" stroke-width="2.5" />
  
  <path d="M 105 375 L 125 335 L 145 375 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
  <line x1="125" y1="350" x2="125" y2="361" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <circle cx="125" cy="368" r="2" fill="#db8129" />
  <text x="165" y="353" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">trust them only from known proxies: anyone can type a header,</text>
  <text x="165" y="390" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">so a header from the open Internet proves nothing</text>

  
  <rect x="40" y="475" width="1110" height="615" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">L4 with the PROXY protocol (v1 or v2)</text>

  
  <rect x="65" y="535" width="1055" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="581" r="24" fill="#207448" />
  <text x="115" y="590" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="165" y="572" font-family="sans-serif" font-size="24" fill="#303a36">client opens a TCP connection to the proxy with its real address</text>
  <text x="165" y="602" font-family="sans-serif" font-size="24" fill="#303a36">as source</text>

  
  <rect x="65" y="642" width="1055" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="688" r="24" fill="#207448" />
  <text x="115" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="165" y="679" font-family="sans-serif" font-size="24" fill="#303a36">proxy opens a second connection to the backend, which carries the proxy's</text>
  <text x="165" y="709" font-family="sans-serif" font-size="24" fill="#303a36">own address as source, hiding the client</text>

  
  <rect x="65" y="749" width="1055" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="795" r="24" fill="#207448" />
  <text x="115" y="804" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="165" y="786" font-family="sans-serif" font-size="24" fill="#303a36">before any application bytes the proxy writes a short PROXY header naming</text>
  <text x="165" y="816" font-family="sans-serif" font-size="24" fill="#303a36">the client address and port (and TLS information)</text>

  
  <rect x="65" y="856" width="1055" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <circle cx="115" cy="902" r="24" fill="#207448" />
  <text x="115" y="911" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="165" y="893" font-family="sans-serif" font-size="24" fill="#303a36">backend reads that header first, records the client as the true source,</text>
  <text x="165" y="923" font-family="sans-serif" font-size="24" fill="#303a36">then reads the application data</text>

  
  <rect x="65" y="963" width="1055" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
  
  <path d="M 115 995 L 135 1005 L 135 1025 C 135 1038 115 1048 115 1048 C 115 1048 95 1038 95 1025 L 95 1005 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
  <line x1="115" y1="1010" x2="115" y2="1025" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="115" cy="1033" r="1.5" fill="#207448" />
  <text x="165" y="1008" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the backend must be configured to expect the header;</text>
  <text x="165" y="1042" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">otherwise it treats it as garbage</text>

  
  <rect x="1180" y="100" width="380" height="990" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1370" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Other ways</text>

  
  <rect x="1205" y="170" width="330" height="135" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1225" y="215" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">DSR:</text>
  <text x="1225" y="250" font-family="sans-serif" font-size="24" fill="#303a36">the backend sees</text>
  <text x="1225" y="282" font-family="sans-serif" font-size="24" fill="#303a36">the real client IP</text>

  
  <rect x="1205" y="325" width="330" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1225" y="365" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">externalTrafficPolicy:</text>
  <text x="1225" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Local</text>
  <text x="1295" y="400" font-family="sans-serif" font-size="24" fill="#303a36">in Kubernetes</text>
  <text x="1225" y="435" font-family="sans-serif" font-size="24" fill="#303a36">avoids SNAT</text>

  
  <rect x="1205" y="525" width="330" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1225" y="575" font-family="sans-serif" font-size="24" fill="#303a36">cloud load balancers</text>
  <text x="1225" y="615" font-family="sans-serif" font-size="24" fill="#303a36">differ on preserving</text>
  <text x="1225" y="655" font-family="sans-serif" font-size="24" fill="#303a36">source IP</text>

  
  <rect x="1205" y="725" width="330" height="340" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1225" y="775" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">NAT mode:</text>
  <text x="1225" y="815" font-family="sans-serif" font-size="24" fill="#303a36">replies must return</text>
  <text x="1225" y="855" font-family="sans-serif" font-size="24" fill="#303a36">through the balancer,</text>
  <text x="1225" y="895" font-family="sans-serif" font-size="24" fill="#303a36">so SNAT hides</text>
  <text x="1225" y="935" font-family="sans-serif" font-size="24" fill="#303a36">the client IP</text>

  
  <rect x="40" y="1115" width="1520" height="65" rx="8" fill="#207448" />
  <text x="800" y="1157" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">In proxy mode the backend sees the balancer's address, so preserve the client IP deliberately</text>
</svg>