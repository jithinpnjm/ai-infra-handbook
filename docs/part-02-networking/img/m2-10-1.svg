<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>The handshake (TLS 1.3)</title>
  <desc>Sequence diagram illustrating the TLS 1.3 handshake between Client and Server, showing key exchange, encrypted extensions, authentication, and application data flow in 1-RTT.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The handshake (TLS 1.3)</text>

  
  <line x1="260" y1="180" x2="260" y2="1095" stroke="#207448" stroke-width="3" stroke-dasharray="6,6" />
  <line x1="1340" y1="180" x2="1340" y2="1095" stroke="#207448" stroke-width="3" stroke-dasharray="6,6" />

  
  <rect x="160" y="100" width="200" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="180" y="116" width="36" height="26" rx="3" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="174" y1="146" x2="222" y2="146" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="236" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Client</text>

  
  <rect x="1240" y="100" width="200" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="1258" y="114" width="38" height="16" rx="2" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="1258" y="136" width="38" height="16" rx="2" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="1268" cy="122" r="2.5" fill="#207448" />
  <circle cx="1268" cy="144" r="2.5" fill="#207448" />
  <text x="1314" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Server</text>

  
  <rect x="300" y="210" width="1000" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="340" cy="265" r="24" fill="#207448" />
  <text x="340" y="265" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="380" y="248" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="26">ClientHello:</tspan> versions, random, cipher suites,
    <tspan x="380" dy="32">key_share (X25519 public), SNI, ALPN (h2, http/1.1),</tspan>
    <tspan x="380" dy="32">supported_groups, signature_algorithms</tspan>
  </text>
  
  <line x1="260" y1="335" x2="1340" y2="335" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="300" y="365" width="1000" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="340" cy="405" r="24" fill="#207448" />
  <text x="340" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="380" y="400" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="26">ServerHello:</tspan> chosen cipher suite +
    <tspan x="380" dy="32">key_share (server public)</tspan>
  </text>
  
  <line x1="1340" y1="460" x2="260" y2="460" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="200" y="490" width="1200" height="90" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
  
  <rect x="236" y="526" width="34" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="4" />
  <path d="M 243 526 V 516 A 10 10 0 0 1 263 516 V 526" fill="none" stroke="#db8129" stroke-width="4" />
  <circle cx="253" cy="537" r="2.5" fill="#db8129" />
  <line x1="253" y1="539" x2="253" y2="545" stroke="#db8129" stroke-width="3" />
  <text x="300" y="530" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="26">both derive handshake keys via ECDHE →</tspan>
    <tspan x="300" dy="32" font-weight="bold" fill="#db8129">everything after this is encrypted</tspan>
  </text>

  
  <rect x="300" y="610" width="1000" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="340" cy="668" r="24" fill="#207448" />
  <text x="340" y="668" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="380" y="644" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold" font-size="26">EncryptedExtensions (ALPN result),</tspan> Certificate (chain),
    <tspan x="380" dy="32">CertificateVerify (signature over transcript),</tspan>
    <tspan x="380" dy="32">Finished</tspan>
  </text>
  
  <line x1="1340" y1="740" x2="260" y2="740" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="300" y="770" width="1000" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="340" cy="810" r="24" fill="#207448" />
  <text x="340" y="810" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="380" y="805" font-family="sans-serif" font-size="24" fill="#303a36">
    (Certificate + CertificateVerify if mutual TLS)
    <tspan x="380" dy="32" font-weight="bold" font-size="26">Finished</tspan>
  </text>
  
  <line x1="260" y1="865" x2="1340" y2="865" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="200" y="895" width="1200" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <path d="M 235 910 L 253 903 L 271 910 C 271 928 253 942 253 942 C 253 942 235 928 235 910 Z" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 244 923 L 250 929 L 263 916" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="300" y="942" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">application keys derived, app data flows (1-RTT total)</text>

  
  <rect x="300" y="1000" width="1000" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="340" cy="1028" r="24" fill="#207448" />
  <text x="340" y="1028" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="380" y="1036" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">HTTP request</text>
  
  <line x1="260" y1="1070" x2="1340" y2="1070" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
</svg>