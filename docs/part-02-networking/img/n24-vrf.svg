<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>VRF on Linux</title>
  <desc>Visual infographic explaining Linux Virtual Routing and Forwarding (VRF) with stacked routing tables, isolated interface lanes, configuration commands, and operational caveats.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="50" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">VRF on Linux</text>

  
  <rect x="50" y="110" width="800" height="665" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(75, 128)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="21" x2="56" y2="21" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="11" r="3" fill="#207448"/>
    <circle cx="26" cy="11" r="3" fill="#207448"/>
    <line x1="12" y1="32" x2="44" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="145" y="160" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Linux host</text>

  
  <rect x="75" y="195" width="750" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(95, 215)">
    <rect x="0" y="0" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="26" y1="18" x2="26" y2="46" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="165" y="248" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">main table</text>

  
  <rect x="95" y="280" width="710" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(120, 304)">
    <path d="M 0 0 h 44 v 28 h -10 v 12 h -24 v -12 h -10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="16" y1="8" x2="16" y2="18" stroke="#207448" stroke-width="2.5"/>
    <line x1="22" y1="8" x2="22" y2="18" stroke="#207448" stroke-width="2.5"/>
    <line x1="28" y1="8" x2="28" y2="18" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="195" y="342" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">eth0</text>

  
  <rect x="75" y="425" width="750" height="330" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(95, 445)">
    <rect x="0" y="0" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 10 23 h 32 M 26 8 v 30" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="165" y="478" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">vrf-blue (table 10)</text>

  
  <rect x="95" y="505" width="710" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(120, 532)">
    <path d="M 0 0 h 44 v 28 h -10 v 12 h -24 v -12 h -10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="16" y1="8" x2="16" y2="18" stroke="#207448" stroke-width="2.5"/>
    <line x1="22" y1="8" x2="22" y2="18" stroke="#207448" stroke-width="2.5"/>
    <line x1="28" y1="8" x2="28" y2="18" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="195" y="568" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">eth2</text>
  <text x="290" y="568" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="26" font-weight="bold" fill="#207448">10.9.0.5/24</text>

  
  <rect x="95" y="625" width="710" height="110" rx="10" fill="#eef2f0" stroke="#8a9690" stroke-width="2" stroke-dasharray="6,4"/>
  <g transform="translate(122, 653)">
    <path d="M 8 18 v -8 a 14 14 0 0 1 28 0 v 8 M 0 18 h 44 v 30 h -44 Z" fill="none" stroke="#8a9690" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="22" cy="32" r="3" fill="#8a9690"/>
  </g>
  <text x="195" y="670" font-family="sans-serif" font-size="24" font-weight="bold" fill="#606c66">
    <tspan x="195" dy="0">two VRFs can both use</tspan>
    <tspan x="195" dy="32">10.9.0.0/24 without mixing</tspan>
  </text>

  
  
  <rect x="890" y="110" width="660" height="205" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="935" cy="155" r="24" fill="#207448"/>
  <text x="935" y="155" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <g transform="translate(980, 134)">
    <rect x="0" y="0" width="54" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 12 14 l 8 7 l -8 7 M 28 28 h 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="915" y="210" width="610" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="935" y="258" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" font-weight="bold" fill="#207448">ip link add vrf-blue type vrf table 10</text>

  
  <rect x="890" y="340" width="660" height="205" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="935" cy="385" r="24" fill="#207448"/>
  <text x="935" y="385" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <g transform="translate(980, 364)">
    <rect x="0" y="0" width="54" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 12 14 l 8 7 l -8 7 M 28 28 h 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="915" y="440" width="610" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="935" y="488" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" font-weight="bold" fill="#207448">ip link set eth2 master vrf-blue</text>

  
  <rect x="890" y="570" width="660" height="205" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="935" cy="615" r="24" fill="#207448"/>
  <text x="935" y="615" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <g transform="translate(980, 594)">
    <rect x="0" y="0" width="54" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 12 14 l 8 7 l -8 7 M 28 28 h 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="915" y="670" width="610" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="935" y="718" font-family="monospace, ui-monospace, Menlo, Consolas" font-size="24" font-weight="bold" fill="#207448">ip vrf exec vrf-blue ping 10.9.0.1</text>

  
  <rect x="50" y="815" width="1500" height="240" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(80, 907)">
    <path d="M 28 0 L 56 50 H 0 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="40" r="2.5" fill="#db8129"/>
  </g>

  
  <rect x="160" y="835" width="1360" height="100" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <text x="190" y="876" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="190" dy="0">services must start inside the VRF or be VRF-aware </tspan>
    <tspan x="190" dy="32">(tcp_l3mdev_accept, udp_l3mdev_accept, ip vrf exec)</tspan>
  </text>

  
  <rect x="160" y="950" width="1360" height="80" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="1.5"/>
  <text x="190" y="998" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DNS and NTP resolvers must be reachable in the VRF</text>
</svg>