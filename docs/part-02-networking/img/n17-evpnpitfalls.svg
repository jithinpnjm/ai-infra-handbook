<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>Common EVPN and VXLAN pitfalls</title>
  <desc>Checklist of ten common EVPN and VXLAN pitfalls with a key takeaway bar</desc>

  <defs>
    <g id="warning-green">
      <path d="M 22 4 L 42 38 L 2 38 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="22" y1="16" x2="22" y2="26" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="22" cy="33" r="2.2" fill="#207448" />
    </g>
    <g id="warning-orange">
      <path d="M 22 4 L 42 38 L 2 38 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="22" y1="16" x2="22" y2="26" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="22" cy="33" r="2.2" fill="#db8129" />
    </g>
  </defs>

  
  <rect width="1600" height="950" fill="#f5f8f5" />

  
  <text x="50" y="75" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold">Common EVPN and VXLAN pitfalls</text>

  
  <rect x="50" y="115" width="1500" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  
  <rect x="75" y="140" width="710" height="110" rx="10" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
  <use href="#warning-orange" x="99" y="174" />
  <text x="163" y="203" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold">underlay MTU too small</text>

  
  <rect x="75" y="270" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="99" y="304" />
  <text x="163" y="333" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">VTEP loopbacks not advertised</text>

  
  <rect x="75" y="400" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="99" y="434" />
  <text x="163" y="448" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="163" dy="0">route targets mismatched</tspan>
    <tspan x="163" dy="32">(routes arrive, never imported)</tspan>
  </text>

  
  <rect x="75" y="530" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="99" y="564" />
  <text x="163" y="578" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="163" dy="0">duplicate anycast gateway MAC</tspan>
    <tspan x="163" dy="32">on two leaves</tspan>
  </text>

  
  <rect x="75" y="660" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="99" y="694" />
  <text x="163" y="723" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">a spine rewrites next hops</text>

  
  
  <rect x="815" y="140" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="839" y="174" />
  <text x="903" y="188" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="903" dy="0">asymmetric IRB forces every leaf</tspan>
    <tspan x="903" dy="32">to carry every VNI</tspan>
  </text>

  
  <rect x="815" y="270" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="839" y="304" />
  <text x="903" y="318" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="903" dy="0">ARP suppression disabled</tspan>
    <tspan x="903" dy="32">(BUM storms)</tspan>
  </text>

  
  <rect x="815" y="400" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="839" y="434" />
  <text x="903" y="448" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="903" dy="0">ECMP polarization when the hash</tspan>
    <tspan x="903" dy="32">ignores the outer UDP source port</tspan>
  </text>

  
  <rect x="815" y="530" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="839" y="564" />
  <text x="903" y="578" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="903" dy="0">missing resilient hashing or MLAG</tspan>
    <tspan x="903" dy="32">mixed with EVPN multihoming</tspan>
  </text>

  
  <rect x="815" y="660" width="710" height="110" rx="10" fill="#ffffff" stroke="#9bc4ad" stroke-width="2" />
  <use href="#warning-green" x="839" y="694" />
  <text x="903" y="708" fill="#303a36" font-family="system-ui, -apple-system, sans-serif" font-size="24">
    <tspan x="903" dy="0">default import of any lets</tspan>
    <tspan x="903" dy="32">tenant routes leak</tspan>
  </text>

  
  <rect x="50" y="825" width="1500" height="85" rx="12" fill="#207448" />
  <text x="800" y="877" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" text-anchor="middle">Before you turn on EVPN, check route targets match and the underlay MTU is large enough</text>
</svg>