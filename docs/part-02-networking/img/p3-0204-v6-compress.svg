<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Writing an IPv6 address short: two rules, one worked example</title>
  <desc>Visual infographic explaining IPv6 compression rules with worked examples and usage contexts.</desc>

  <rect width="1600" height="1320" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Writing an IPv6 address short: two rules, one worked example</text>

  

  
  <g transform="translate(40, 110)">
    <rect width="890" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="30" y="26" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="58" cy="54" r="12" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M40 72 L76 36" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="106" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Original Form</text>
    <rect x="30" y="98" width="830" height="58" rx="8" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
    <text x="50" y="137" font-family="ui-monospace, monospace" font-size="25" fill="#303a36">Full: 2001:0db8:0a0b:12f0:0000:0000:0000:8b6e</text>
    
    <rect x="30" y="168" width="830" height="42" rx="6" fill="#f5f8f5"/>
    <text x="445" y="197" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">hextets, 16 bits each, four hex digits</text>
  </g>

  
  <path d="M485 340 L485 370" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <polygon points="485,376 477,364 493,364" fill="#207448"/>

  
  <g transform="translate(40, 380)">
    <rect width="890" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="30" y="26" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="48" cy="46" r="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="48" cy="62" r="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M54 50 L74 66 M54 58 L74 42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

    <text x="106" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">First Rule</text>
    
    
    <rect x="30" y="98" width="830" height="108" rx="8" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
    
    
    <rect x="585" y="152" width="16" height="34" rx="4" fill="#e2e8e5"/>
    <rect x="643" y="152" width="16" height="34" rx="4" fill="#e2e8e5"/>
    
    <text x="45" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Rule 1: drop leading zeros in each group: 2001:db8:a0b:12f0:0:0:0:8b6e</text>
    <text x="45" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#207448">(dropped zeros: 0db8 → db8 and 0a0b → a0b; single 0 remains 0)</text>
  </g>

  
  <path d="M485 610 L485 640" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <polygon points="485,646 477,634 493,634" fill="#207448"/>

  
  <g transform="translate(40, 650)">
    <rect width="890" height="240" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <rect x="30" y="26" width="56" height="56" rx="10" fill="none" stroke="#db8129" stroke-width="4"/>
    <circle cx="50" cy="46" r="4" fill="#db8129"/>
    <circle cx="50" cy="62" r="4" fill="#db8129"/>
    <circle cx="66" cy="46" r="4" fill="#db8129"/>
    <circle cx="66" cy="62" r="4" fill="#db8129"/>

    <text x="106" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Second Rule</text>

    
    <rect x="30" y="98" width="830" height="118" rx="8" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
    <rect x="42" y="106" width="806" height="100" rx="6" fill="#fff5ec" stroke="#db8129" stroke-width="1.5"/>
    
    <text x="56" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="56" dy="0">Rule 2: replace the one longest run of all-zero groups with :: </tspan>
      <tspan x="56" dy="38" font-family="ui-monospace, monospace" font-weight="bold" fill="#db8129">gives 2001:db8:a0b:12f0::8b6e</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 915)">
    <rect width="890" height="135" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    
    <path d="M58 35 L86 85 L30 85 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="58" y1="52" x2="58" y2="68" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="58" cy="76" r="2.5" fill="#db8129"/>

    <text x="106" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="106" dy="0">Use :: only once per address; otherwise nobody</tspan>
      <tspan x="106" dy="36">could tell how many zero groups each one stood for</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 1075)">
    <rect width="890" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="30" y="24" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M42 52 L52 62 L74 40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="106" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Another Example</text>
    <rect x="30" y="78" width="830" height="46" rx="6" fill="#ffffff" stroke="#c0d4c4" stroke-width="1"/>
    <text x="445" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Compress 2001:0db8:0000:0000:0000:ff00:0042:8329 gives 2001:db8::ff00:42:8329</text>
  </g>


  
  <g transform="translate(950, 110)">
    
    <rect width="610" height="1100" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="30" y="28" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M44 42 H72 M44 56 H72 M44 70 H62" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Writing it in other places</text>

    
    <g transform="translate(30, 110)">
      <rect width="550" height="130" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <text x="36" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448">1</text>
      <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Subnet Routing Prefix</text>
      <rect x="20" y="64" width="510" height="50" rx="6" fill="#f5f8f5"/>
      <text x="35" y="98" font-family="ui-monospace, monospace" font-size="25" fill="#303a36">prefix: 2001:db8:a0b:12f0::/64</text>
    </g>

    
    <g transform="translate(30, 265)">
      <rect width="550" height="240" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <text x="36" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448">2</text>
      <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Web Addresses</text>
      
      <text x="24" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">in a URL wrap it in brackets:</tspan>
      </text>
      <rect x="20" y="102" width="510" height="52" rx="6" fill="#f5f8f5"/>
      <text x="35" y="137" font-family="ui-monospace, monospace" font-size="24" fill="#207448">http://[2001:db8::10]:8080/</text>
      <text x="24" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="24" dy="0">because colons would be read as</tspan>
        <tspan x="24" dy="34">the port separator</tspan>
      </text>
    </g>

    
    <g transform="translate(30, 530)">
      <rect width="550" height="150" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <text x="36" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448">3</text>
      <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Link-Local Scope</text>
      
      <rect x="20" y="66" width="510" height="66" rx="6" fill="#f5f8f5"/>
      <text x="35" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">link-local needs an interface scope: fe80::1%eth0</text>
    </g>

    
    <g transform="translate(30, 705)">
      <rect width="550" height="365" rx="12" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <text x="36" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#207448">4</text>
      <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Command Line Expansion</text>
      
      <rect x="20" y="66" width="510" height="275" rx="8" fill="#f5f8f5" stroke="#d5dfd7" stroke-width="1"/>
      <text x="38" y="112" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
        <tspan x="38" dy="0">expand with python3 -c</tspan>
        <tspan x="38" dy="50">import ipaddress as i;</tspan>
        <tspan x="38" dy="50">print(i.ip_address</tspan>
        <tspan x="38" dy="50">of 2001:db8::1 .exploded)</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 1235)">
    <rect width="1520" height="60" rx="10" fill="#207448"/>
    <text x="760" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Eight groups of 16 bits, two compression rules</text>
  </g>
</svg>