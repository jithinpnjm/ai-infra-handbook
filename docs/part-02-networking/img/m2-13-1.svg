<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Convergence timeline</title>
  <desc>Five-stage timeline of network routing convergence from failure detection to FIB programming.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Convergence timeline</text>

  
  <rect x="46" y="200" width="268" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="180" cy="260" r="24" fill="#207448" />
  <text x="180" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(180, 345)">
    <circle cx="0" cy="0" r="26" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M -18 0 L -8 0 L -3 -14 L 3 14 L 8 0 L 18 0" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="180" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="180" dy="0">1. Detect</tspan>
    <tspan x="180" dy="38">failure</tspan>
  </text>
  <line x1="90" y1="520" x2="270" y2="520" stroke="#c8dcd0" stroke-width="2" />
  <text x="180" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="180" dy="0">(carrier ~10ms /</tspan>
    <tspan x="180" dy="36">BFD 150-300ms)</tspan>
  </text>

  
  <line x1="314" y1="480" x2="356" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="356" y="200" width="268" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="490" cy="260" r="24" fill="#207448" />
  <text x="490" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(490, 345)">
    <circle cx="0" cy="0" r="26" stroke="#207448" stroke-width="4" fill="none" />
    <polyline points="0 -16 0 0 12 0" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M -12 -31 L -6 -25 M 12 -31 L 6 -25" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="490" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="490" dy="0">2. Originate</tspan>
    <tspan x="490" dy="38">update</tspan>
  </text>
  <line x1="400" y1="520" x2="580" y2="520" stroke="#c8dcd0" stroke-width="2" />
  <text x="490" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="490" dy="0">(LSA/update</tspan>
    <tspan x="490" dy="36">throttle</tspan>
    <tspan x="490" dy="36">50-500ms)</tspan>
  </text>

  
  <line x1="624" y1="480" x2="666" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="666" y="200" width="268" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="800" cy="260" r="24" fill="#207448" />
  <text x="800" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(800, 345)">
    <circle cx="0" cy="-14" r="6" fill="#207448" />
    <circle cx="-20" cy="18" r="6" fill="#207448" />
    <circle cx="0" cy="18" r="6" fill="#207448" />
    <circle cx="20" cy="18" r="6" fill="#207448" />
    <line x1="0" y1="-8" x2="-20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-8" x2="0" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-8" x2="20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M -28 -2 Q -35 8 -28 18 M 28 -2 Q 35 8 28 18" stroke="#207448" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  <text x="800" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">3. Propagate</tspan>
    <tspan x="800" dy="38">/ flood</tspan>
  </text>
  <line x1="710" y1="520" x2="890" y2="520" stroke="#c8dcd0" stroke-width="2" />
  <text x="800" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">(area flooding /</tspan>
    <tspan x="800" dy="36">hop-by-hop)</tspan>
  </text>

  
  <line x1="934" y1="480" x2="976" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="976" y="200" width="268" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1110" cy="260" r="24" fill="#207448" />
  <text x="1110" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1110, 345)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" stroke="#207448" stroke-width="4" fill="none" />
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#207448" />
    <line x1="-14" y1="-31" x2="-14" y2="-24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-31" x2="0" y2="-24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="14" y1="-31" x2="14" y2="-24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="24" x2="-14" y2="31" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="24" x2="0" y2="31" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="14" y1="24" x2="14" y2="31" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-31" y1="-14" x2="-24" y2="-14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-31" y1="0" x2="-24" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="-31" y1="14" x2="-24" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="-14" x2="31" y2="-14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="0" x2="31" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="14" x2="31" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1110" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1110" dy="0">4. Compute</tspan>
    <tspan x="1110" dy="38">paths</tspan>
  </text>
  <line x1="1020" y1="520" x2="1200" y2="520" stroke="#c8dcd0" stroke-width="2" />
  <text x="1110" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1110" dy="0">(Dijkstra SPF /</tspan>
    <tspan x="1110" dy="36">BGP best-path)</tspan>
  </text>

  
  <line x1="1244" y1="480" x2="1286" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1286" y="200" width="268" height="560" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  <circle cx="1420" cy="260" r="24" fill="#db8129" />
  <text x="1420" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(1420, 345)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" stroke="#db8129" stroke-width="4" fill="none" />
    <line x1="-16" y1="-12" x2="16" y2="-12" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="-16" y1="12" x2="16" y2="12" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <polyline points="4 -2 11 6 22 -6" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <text x="1420" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1420" dy="0">5. Program</tspan>
    <tspan x="1420" dy="38">FIB</tspan>
  </text>
  <line x1="1330" y1="520" x2="1510" y2="520" stroke="#f0cbb0" stroke-width="2" />
  <text x="1420" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1420" dy="0">(kernel / ASIC</tspan>
    <tspan x="1420" dy="36">TCAM, PIC)</tspan>
  </text>
</svg>