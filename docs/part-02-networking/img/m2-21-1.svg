<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Defense in depth</title>
  <desc>Defense in depth architecture illustrating layered network security from Internet to Data protection, observed by telemetry across all layers.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <polygon points="0,3 16,9 0,15" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Defense in depth</text>

  
  
  <line x1="505" y1="160" x2="505" y2="205" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="505" y1="350" x2="505" y2="395" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="505" y1="540" x2="505" y2="585" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="505" y1="730" x2="505" y2="775" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="505" y1="920" x2="505" y2="965" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="277.5" x2="950" y2="277.5" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="467.5" x2="950" y2="467.5" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="657.5" x2="1140" y2="657.5" stroke="#207448" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="990" y1="657.5" x2="950" y2="657.5" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="847.5" x2="950" y2="847.5" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>

  
  <line x1="1180" y1="1040" x2="950" y2="1040" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#arrow-green)"/>

  
  <rect x="990" y="630.5" width="150" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1065" y="666" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">observes</text>

  

  
  <g id="node-I">
    <rect x="60" y="85" width="890" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="112" cy="122.5" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <ellipse cx="112" cy="122.5" rx="11" ry="24" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="122.5" x2="136" y2="122.5" stroke="#207448" stroke-width="3"/>
    
    <text x="168" y="133" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Internet / untrusted</text>
  </g>

  
  <g id="node-E">
    <rect x="60" y="205" width="890" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 88,255 L 112,243 L 136,255 L 136,280 C 136,298 112,311 112,311 C 112,311 88,298 88,280 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 100,277 L 109,286 L 125,268" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="168" y="262" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Edge: </tspan>
      <tspan font-size="24">packet filters, rate limits,</tspan>
      <tspan x="168" dy="36" font-size="24">route validation (BCP38/RPKI), DDoS protection</tspan>
    </text>
  </g>

  
  <g id="node-F">
    <rect x="60" y="395" width="890" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="86" y="443" width="52" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="86" y1="459" x2="138" y2="459" stroke="#207448" stroke-width="3"/>
    <line x1="86" y1="475" x2="138" y2="475" stroke="#207448" stroke-width="3"/>
    <line x1="112" y1="443" x2="112" y2="459" stroke="#207448" stroke-width="3"/>
    <line x1="99" y1="459" x2="99" y2="475" stroke="#207448" stroke-width="3"/>
    <line x1="125" y1="459" x2="125" y2="475" stroke="#207448" stroke-width="3"/>
    <line x1="112" y1="475" x2="112" y2="491" stroke="#207448" stroke-width="3"/>
    
    <text x="168" y="452" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Stateful firewall / NGFW / WAF:</tspan>
      <tspan x="168" dy="36" font-size="24">only established or permitted flows</tspan>
    </text>
  </g>

  
  <g id="node-S">
    <rect x="60" y="585" width="890" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="88" y="633" width="21" height="21" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="115" y="633" width="21" height="21" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="88" y="660" width="21" height="21" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="115" y="660" width="21" height="21" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="112" y1="629" x2="112" y2="685" stroke="#207448" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="84" y1="657" x2="140" y2="657" stroke="#207448" stroke-width="2" stroke-dasharray="3,3"/>
    
    <text x="168" y="638" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Segmentation:</tspan>
      <tspan x="168" dy="34" font-size="24">VLAN/VRF/VXLAN zones,</tspan>
      <tspan x="168" dy="30" font-size="24">microsegmentation, NetworkPolicy</tspan>
    </text>
  </g>

  
  <g id="node-A">
    <rect x="60" y="775" width="890" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="89" y="828" width="46" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 98,828 L 98,815 C 98,804 126,804 126,815 L 126,828" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="112" cy="844" r="3.5" fill="#207448"/>
    <line x1="112" y1="847.5" x2="112" y2="856" stroke="#207448" stroke-width="3"/>
    
    <text x="168" y="832" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Per-service access control:</tspan>
      <tspan x="168" dy="36" font-size="24">authN/authZ, mTLS, RBAC</tspan>
    </text>
  </g>

  
  <g id="node-D">
    <rect x="60" y="965" width="890" height="150" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <ellipse cx="112" cy="1015" rx="24" ry="10" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <path d="M 88,1015 L 88,1060 C 88,1068 136,1068 136,1060 L 136,1015" fill="none" stroke="#db8129" stroke-width="3.5"/>
    <path d="M 88,1037 C 88,1045 136,1045 136,1037" fill="none" stroke="#db8129" stroke-width="3"/>
    <circle cx="112" cy="1052" r="3.5" fill="#db8129"/>
    <line x1="112" y1="1055.5" x2="112" y2="1062.5" stroke="#db8129" stroke-width="2.5"/>
    
    <text x="168" y="1022" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold">Data protection:</tspan>
      <tspan x="168" dy="34" font-size="24">encryption at rest and in transit,</tspan>
      <tspan x="168" dy="30" font-size="24">key management</tspan>
    </text>
  </g>

  
  <g id="node-T">
    <rect x="1180" y="205" width="370" height="910" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1365" cy="500" r="28" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="1365" cy="500" r="16" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="1365" y1="472" x2="1365" y2="528" stroke="#207448" stroke-width="2.5"/>
    <line x1="1337" y1="500" x2="1393" y2="500" stroke="#207448" stroke-width="2.5"/>
    <line x1="1365" y1="500" x2="1384" y2="481" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="1365" y="580" font-family="sans-serif" fill="#303a36" text-anchor="middle">
      <tspan font-size="30" font-weight="bold">Telemetry across</tspan>
      <tspan x="1365" dy="40" font-size="30" font-weight="bold">all layers:</tspan>
      <tspan x="1365" dy="55" font-size="24">flows, logs, IDS/IPS,</tspan>
      <tspan x="1365" dy="38" font-size="24">exfiltration monitoring</tspan>
    </text>
  </g>
</svg>