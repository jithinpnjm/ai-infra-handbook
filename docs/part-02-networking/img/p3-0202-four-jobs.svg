  <text x="542" y="1071" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">UDP/IP/Ethernet</text>

  
  <rect x="685" y="975" width="255" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="812" y="1029" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">UDP port 4791,</text>
  <text x="812" y="1059" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">QP numbers</text>

  
  <rect x="950" y="975" width="290" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1095" y="1029" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">ICRC and</text>
