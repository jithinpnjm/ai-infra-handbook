  <text x="1095" y="660" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">checksum</text>

  
  <rect x="1250" y="576" width="310" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1405" y="644" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">None</text>


  
  
  <rect x="410" y="709" width="265" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="542" y="763" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Reliable</text>
  <text x="542" y="793" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">byte stream</text>

  
  <rect x="685" y="709" width="255" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="812" y="777" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Ports</text>

  
  <rect x="950" y="709" width="290" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1095" y="749" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Checksum,</text>
  <text x="1095" y="777" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">sequence numbers,</text>
  <text x="1095" y="805" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">ACK, retransmit</text>

  
  <rect x="1250" y="709" width="310" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1405" y="763" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Receive window,</text>
  <text x="1405" y="793" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">congestion window</text>


  
  
  <rect x="410" y="842" width="265" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
