  <text x="542" y="926" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">over UDP</text>

  
  <rect x="685" y="842" width="255" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="812" y="896" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Connection IDs,</text>
  <text x="812" y="926" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">streams</text>

  
  <rect x="950" y="842" width="290" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1095" y="896" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Own ACKs and</text>
  <text x="1095" y="926" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">retransmit</text>

  
  <rect x="1250" y="842" width="310" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1405" y="882" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Own congestion</text>
  <text x="1405" y="910" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">control, stream</text>
  <text x="1405" y="938" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">windows</text>


  
  
  <rect x="410" y="975" width="265" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="542" y="1015" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">InfiniBand</text>
