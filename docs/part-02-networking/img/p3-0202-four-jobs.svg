  <text x="120" y="424" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">link</text>

  
  <rect x="40" y="443" width="160" height="125" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="94" cy="485" r="8" stroke="#207448" stroke-width="4" fill="none"/>
