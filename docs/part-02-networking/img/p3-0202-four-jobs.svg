  <rect x="950" y="310" width="290" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1095" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">FCS (CRC32)</text>

  
  <rect x="1250" y="310" width="310" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1405" y="350" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">None originally;</text>
  <text x="1405" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">PAUSE and PFC</text>
  <text x="1405" y="406" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">optional</text>


  
  
  <rect x="410" y="443" width="265" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="542" y="483" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Network-wide</text>
