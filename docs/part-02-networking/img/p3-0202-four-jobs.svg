  <rect x="1250" y="975" width="310" height="125" rx="8" fill="#fff8f0" stroke="#db8129" stroke-width="2.5"/>
  <text x="1405" y="1015" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Needs PFC and ECN</text>
