<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The four jobs of a protocol, and the scope each protocol does them at</title>
  <desc>A comprehensive grid infographic categorizing networking protocols by scope and detailing their implementation of transport, multiplexing, error control, and flow and congestion control.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The four jobs of a protocol, and</text>
  <text x="800" y="115" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">the scope each protocol does them at</text>

  
  
  <text x="675" y="160" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">getting data to the right place</text>
  <text x="675" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">and keeping conversations apart</text>
  <path d="M 410 206 L 665 206 Q 675 206 675 214 Q 675 206 685 206 L 940 206" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <text x="1255" y="160" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">getting it there intact</text>
  <text x="1255" y="188" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">and at a sensible speed</text>
  <path d="M 950 206 L 1245 206 Q 1255 206 1255 214 Q 1255 206 1265 206 L 1560 206" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  
  <rect x="410" y="222" width="265" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="542" y="271" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Transport</text>

  
  <rect x="685" y="222" width="255" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="812" y="271" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Multiplexing</text>

  
  <rect x="950" y="222" width="290" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1095" y="271" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Error control</text>

  
  <rect x="1250" y="222" width="310" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1405" y="254" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Flow and</text>
  <text x="1405" y="286" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">congestion control</text>

  

  
  <rect x="40" y="310" width="160" height="125" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
