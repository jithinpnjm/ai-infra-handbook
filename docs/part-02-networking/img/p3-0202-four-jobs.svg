  <rect x="40" y="576" width="160" height="391" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="94" y="728" width="20" height="26" rx="3" stroke="#207448" stroke-width="4" fill="none"/>
