  <circle cx="120" cy="1010" r="7" stroke="#207448" stroke-width="4" fill="none"/>
  <text x="120" y="1061" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">AI</text>
  <text x="120" y="1089" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">fabrics</text>

  

  
