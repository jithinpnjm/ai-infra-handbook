  <text x="542" y="539" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">routing</text>

  
  <rect x="685" y="443" width="255" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="812" y="497" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Protocol</text>
  <text x="812" y="527" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">number</text>

  
  <rect x="950" y="443" width="290" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1095" y="497" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Header checksum</text>
  <text x="1095" y="527" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(IPv4) only</text>

  
  <rect x="1250" y="443" width="310" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="1405" y="497" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">None</text>
  <text x="1405" y="527" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(ICMP signals)</text>


  
  
  <rect x="410" y="576" width="265" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
  <text x="542" y="630" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Datagrams</text>
  <text x="542" y="660" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">between ports</text>

  
  <rect x="685" y="576" width="255" height="125" rx="8" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5"/>
