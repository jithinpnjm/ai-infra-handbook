  <text x="120" y="836" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">end</text>

  
  <rect x="40" y="975" width="160" height="125" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
