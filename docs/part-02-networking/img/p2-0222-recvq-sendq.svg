<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130">
  <title>Recv-Q and Send-Q mean different things on a listening socket and a connected socket</title>
  <desc>Visual comparison of Recv-Q and Send-Q semantics between LISTEN sockets and ESTABLISHED sockets in Linux networking.</desc>

  
  <rect width="1600" height="1130" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">
    Recv-Q and Send-Q mean different things
  </text>
  <text x="800" y="102" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36">
    on a listening socket and a connected socket
  </text>

  
  <rect x="50" y="140" width="730" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="415" y="195" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    LISTEN socket <tspan font-family="monospace">(ss -ltn)</tspan>
  </text>

  
  <rect x="85" y="225" width="660" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(110, 237)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="28" cy="38" r="6" fill="#207448"/>
    <path d="M16 26 A 18 18 0 0 1 40 26"/>
    <path d="M8 18 A 28 28 0 0 1 48 18"/>
    <path d="M1 10 A 38 38 0 0 1 55 10"/>
  </g>
  <text x="430" y="275" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    listening socket on port 443
  </text>

  
  <path d="M 415 305 L 415 338" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <polygon points="415,348 408,334 422,334" fill="#207448"/>

  
  <rect x="85" y="350" width="660" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="115" y="385" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    accept queue
  </text>

  
  <text x="270" y="416" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="270" dy="0">Recv-Q:</tspan>
    <tspan x="270" dy="28">completed connections</tspan>
    <tspan x="270" dy="28">waiting for accept()</tspan>
  </text>

  
  <path d="M 130 484 L 130 476 L 270 476 L 270 472 L 270 476 L 405 476 L 405 484" fill="none" stroke="#207448" stroke-width="2"/>

  
  
  <rect x="130" y="492" width="85" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="172" cy="522" r="14" fill="#207448"/>
  <circle cx="172" cy="522" r="6" fill="#ffffff"/>

  
  <rect x="225" y="492" width="85" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="267" cy="522" r="14" fill="#207448"/>
  <circle cx="267" cy="522" r="6" fill="#ffffff"/>

  
  <rect x="320" y="492" width="85" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="362" cy="522" r="14" fill="#207448"/>
  <circle cx="362" cy="522" r="6" fill="#ffffff"/>

  
  <rect x="415" y="492" width="85" height="60" rx="8" fill="#ffffff" stroke="#9bb3a4" stroke-width="2" stroke-dasharray="6 4"/>

  
  <rect x="510" y="492" width="85" height="60" rx="8" fill="#ffffff" stroke="#9bb3a4" stroke-width="2" stroke-dasharray="6 4"/>

  
  <rect x="605" y="492" width="85" height="60" rx="8" fill="#ffffff" stroke="#9bb3a4" stroke-width="2" stroke-dasharray="6 4"/>

  
  <path d="M 130 560 L 130 568 L 415 568 L 415 572 L 415 568 L 690 568 L 690 560" fill="none" stroke="#207448" stroke-width="2"/>

  
  <text x="415" y="602" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="415" dy="0">Send-Q: queue capacity,</tspan>
    <tspan x="415" dy="30" font-family="monospace">min(backlog, somaxconn)</tspan>
  </text>

  
  <rect x="85" y="710" width="660" height="175" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <text x="415" y="760" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="415" dy="0">When Recv-Q reaches Send-Q,</tspan>
    <tspan x="415" dy="36">new connections are dropped and</tspan>
    <tspan x="415" dy="36">counted as ListenOverflows.</tspan>
  </text>

  
  <rect x="820" y="140" width="730" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="1185" y="195" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
    ESTAB socket <tspan font-family="monospace">(ss -tn)</tspan>
  </text>

  
  <rect x="855" y="225" width="660" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(880, 237)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="16" cy="28" r="10" fill="#e8f1ea"/>
    <circle cx="44" cy="28" r="10" fill="#e8f1ea"/>
    <line x1="26" y1="28" x2="34" y2="28"/>
  </g>
  <text x="1200" y="275" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    connected socket
  </text>

  
  <rect x="855" y="340" width="660" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="885" y="385" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    receive buffer: Recv-Q =
  </text>
  <text x="885" y="420" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    bytes not yet read by the application
  </text>
  
  <g transform="translate(885, 442)">
    <rect x="0" y="0" width="600" height="38" rx="6" fill="#f5f8f5" stroke="#9bb3a4" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="38" rx="6" fill="#207448" opacity="0.3"/>
    <line x1="220" y1="0" x2="220" y2="38" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="855" y="525" width="660" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="885" y="570" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    send buffer: Send-Q =
  </text>
  <text x="885" y="605" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    bytes not yet acknowledged by the peer
  </text>
  
  <g transform="translate(885, 627)">
    <rect x="0" y="0" width="600" height="38" rx="6" fill="#f5f8f5" stroke="#9bb3a4" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="38" rx="6" fill="#207448" opacity="0.3"/>
    <line x1="310" y1="0" x2="310" y2="38" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="855" y="710" width="660" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="780" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1185" dy="0">Recv-Q that stays above zero</tspan>
    <tspan x="1185" dy="40">means the application is not reading.</tspan>
  </text>

  
  <rect x="50" y="1035" width="1500" height="65" rx="10" fill="#207448"/>
  <text x="800" y="1077" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Read Recv-Q and Send-Q together with the socket state.
  </text>
</svg>