<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>An exact five-second delay is a timer: A and AAAA queries race on one socket</title>
  <desc>Infographic illustrating how A and AAAA queries race for a single NAT entry, causing a dropped response and triggering a five-second resolver timeout.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#697a72" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    An exact five-second delay is a timer: A and AAAA queries race on one socket
  </text>

  
  <rect x="50" y="110" width="1500" height="340" rx="16" fill="#e8f1ea" stroke="#c2d9c6" stroke-width="2" />
  
  
  <g transform="translate(75, 130)">
    <rect x="0" y="0" width="230" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="20" y="25" width="45" height="45" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 30 47 L 55 47 M 42.5 35 L 42.5 60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="80" y="70" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pod resolver</text>
  </g>

  
  <rect x="330" y="130" width="370" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="365" cy="165" r="20" fill="#207448" />
  <text x="365" y="173" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="350" y="215" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="350" dy="0">A and AAAA queries sent in</tspan>
    <tspan x="350" dy="34">parallel from one source port</tspan>
  </text>

  
  <g transform="translate(730, 130)">
    
    <path d="M 0 30 L 10 10 L 220 10 L 230 0 L 240 10 L 450 10 L 460 30" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="15" y="25" width="430" height="110" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <circle cx="50" cy="55" r="20" fill="#db8129" />
    <text x="50" y="63" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <circle cx="95" cy="55" r="16" fill="none" stroke="#db8129" stroke-width="3" />
    <polyline points="95,45 95,55 104,55" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="40" y="95" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="40" dy="0">Resolver waits out its</tspan>
      <tspan x="40" dy="30">5-second default timeout</tspan>
    </text>
  </g>

  
  <rect x="1220" y="130" width="310" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="1255" cy="165" r="20" fill="#207448" />
  <text x="1255" y="173" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  
  <circle cx="1295" cy="165" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="1288,165 1293,171 1303,159" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1245" y="215" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1245" dy="0">Lookup finally</tspan>
    <tspan x="1245" dy="34">succeeds after 5 s</tspan>
  </text>

  
  <g transform="translate(330, 310)">
    <rect x="0" y="0" width="850" height="90" rx="10" fill="#f7fbf8" stroke="#a4caa9" stroke-width="2" stroke-dasharray="6 4" />
    <text x="30" y="54" font-family="sans-serif" font-size="24" fill="#303a36">
      ndots:5 multiplies the number of queries for short names.
    </text>
  </g>


  
  <rect x="50" y="480" width="1500" height="230" rx="16" fill="#fcfdfc" stroke="#c2d9c6" stroke-width="2" />

  
  <g transform="translate(75, 530)">
    <rect x="0" y="0" width="270" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="18" y="32" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="24" x2="28" y2="32" stroke="#207448" stroke-width="4" />
    <line x1="48" y1="24" x2="48" y2="32" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="72" x2="28" y2="80" stroke="#207448" stroke-width="4" />
    <line x1="48" y1="72" x2="48" y2="80" stroke="#207448" stroke-width="4" />
    <text x="75" y="58" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">conntrack</text>
    <text x="75" y="92" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">and NAT</text>
  </g>

  
  <rect x="390" y="515" width="550" height="155" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="4" />
  <circle cx="430" cy="555" r="20" fill="#db8129" />
  <text x="430" y="563" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="420" y="605" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="420" dy="0">Both queries race for one NAT entry,</tspan>
    <tspan x="420" dy="34">and one reply is lost</tspan>
  </text>


  
  <rect x="50" y="740" width="1500" height="210" rx="16" fill="#e8f1ea" stroke="#c2d9c6" stroke-width="2" />

  
  <g transform="translate(75, 785)">
    <rect x="0" y="0" width="230" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="20" y="24" width="42" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="20" y="52" width="42" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="52" cy="35" r="3" fill="#207448" />
    <circle cx="52" cy="63" r="3" fill="#207448" />
    <text x="75" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">CoreDNS</text>
  </g>

  
  <rect x="630" y="770" width="490" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="665" cy="810" r="20" fill="#207448" />
  <text x="665" y="818" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="650" y="855" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="650" dy="0">Replies come back, one is</tspan>
    <tspan x="650" dy="34">dropped in the race</tspan>
  </text>


  
  
  <path d="M 515 270 L 515 510" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <path d="M 740 670 L 740 765" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 920 770 L 920 275" fill="none" stroke="#697a72" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-dashed)" />

  
  <path d="M 1190 200 L 1215 200" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />


  
  <g transform="translate(50, 980)">
    <rect x="0" y="0" width="1500" height="100" rx="14" fill="#207448" />
    
    <g transform="translate(30, 26)">
      <path d="M 24 4 L 42 12 L 42 26 C 42 38 24 46 24 46 C 24 46 6 38 6 26 L 6 12 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    </g>
    <text x="95" y="60" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      single-request-reopen, NodeLocal DNSCache, lower ndots, or a newer kernel
    </text>
  </g>


  
  <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="26" font-style="italic" fill="#303a36">
    An exact N-second delay points to a timer, so match it to a default.
  </text>
</svg>