<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The TCP header and options</title>
  <desc>Visual diagram of the TCP header structure including 20 bytes of standard fields and variable length options.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="80" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The TCP header and options</text>

  
  <rect x="80" y="110" width="1440" height="930" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="110" y="125" width="670" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <g stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="126" y="138" width="30" height="24" rx="3"/>
    <line x1="126" y1="146" x2="156" y2="146"/>
  </g>
  <text x="172" y="161" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TCP header (20 bytes + options)</text>

  
  <rect x="120" y="195" width="1360" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="147" y="222" width="24" height="40" rx="4"/>
    <rect x="179" y="222" width="24" height="40" rx="4"/>
    <line x1="159" y1="242" x2="179" y2="242"/>
    <line x1="155" y1="232" x2="155" y2="238"/>
    <line x1="195" y1="232" x2="195" y2="238"/>
  </g>
  <text x="230" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Source port (16) | Destination port (16)</text>

  
  <rect x="120" y="315" width="1360" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="147" y="337" width="56" height="12" rx="3"/>
    <rect x="147" y="356" width="42" height="12" rx="3"/>
    <rect x="147" y="375" width="28" height="12" rx="3"/>
  </g>
  <text x="230" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Sequence number (32)</text>

  
  <rect x="120" y="435" width="1360" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M147 462 L175 452 L203 462 C203 490 175 510 175 510 C175 510 147 490 147 462 Z"/>
    <polyline points="161,482 171,492 189,472"/>
  </g>
  <text x="230" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Acknowledgement number (32)</text>

  
  <rect x="120" y="555" width="1360" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="150" y1="592" x2="150" y2="648"/>
    <path d="M150 594 L198 608 L150 622 Z"/>
    <line x1="162" y1="638" x2="202" y2="638"/>
    <circle cx="178" cy="638" r="4" fill="#207448"/>
  </g>
  <text x="230" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="230" dy="0">Data offset (4) | Reserved |</tspan>
    <tspan x="230" dy="44">Flags: CWR ECE URG ACK PSH RST SYN FIN | Window (16)</tspan>
  </text>

  
  <rect x="120" y="710" width="1360" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="175" cy="757" r="26"/>
    <line x1="175" y1="743" x2="175" y2="761"/>
    <circle cx="175" cy="770" r="2" fill="#207448"/>
    <polyline points="163,747 175,735 187,747"/>
  </g>
  <text x="230" y="767" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Checksum (16) | Urgent pointer (16)</text>

  
  <rect x="120" y="830" width="1360" height="180" rx="12" fill="#fef7f0" stroke="#db8129" stroke-width="3.5"/>
  <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 895 H166 C166 887 176 887 176 895 H200 V911 C208 911 208 921 200 921 V945 H184 C184 937 174 937 174 945 H150 V929 C158 929 158 919 150 919 Z"/>
  </g>
  <text x="230" y="878" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="230" dy="0" font-size="30" font-weight="bold">Options (TLV, up to 40 bytes):</tspan>
    <tspan x="230" dy="44" font-size="26" font-weight="bold">MSS, window scale, SACK-permitted,</tspan>
    <tspan x="230" dy="38" font-size="26" font-weight="bold">SACK blocks, timestamps, fast open</tspan>
  </text>
</svg>