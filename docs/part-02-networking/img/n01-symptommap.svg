<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>From symptom to layer</title>
  <desc>Ladder of network layers from Routing to Application with curl symptom chips and exit codes.</desc>

  <defs>
    <marker id="ladder-arrow" viewBox="0 0 18 18" refX="9" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M9 2 L16 16 L9 12 L2 16 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">From symptom to layer</text>

  
  <rect x="440" y="96" width="720" height="52" rx="26" fill="#db8129"/>
  <text x="800" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">start with the layer the message points to</text>

  
  <line x1="55" y1="1040" x2="55" y2="200" stroke="#207448" stroke-width="6" stroke-linecap="round" marker-end="url(#ladder-arrow)"/>
  <line x1="55" y1="1040" x2="105" y2="1040" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="890" x2="105" y2="890" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="717" x2="105" y2="717" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="545" x2="105" y2="545" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="395" x2="105" y2="395" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="245" x2="105" y2="245" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <g id="layer-application">
    <rect x="105" y="180" width="1425" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="190" width="390" height="110" rx="12" fill="#e8f1ea"/>
    
    <rect x="135" y="217" width="56" height="56" rx="8" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="135" y1="235" x2="191" y2="235" stroke="#207448" stroke-width="4"/>
    <circle cx="147" cy="226" r="3" fill="#207448"/>
    <circle cx="157" cy="226" r="3" fill="#207448"/>
    <circle cx="167" cy="226" r="3" fill="#207448"/>
    <line x1="147" y1="249" x2="179" y2="249" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="147" y1="259" x2="169" y2="259" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="215" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Application</text>
    
    <rect x="525" y="200" width="485" height="90" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">HTTP 4xx/5xx</text>
    
    <rect x="1030" y="200" width="485" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">(22 with -f)</text>
  </g>

  
  <g id="layer-tls-pki">
    <rect x="105" y="330" width="1425" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="340" width="390" height="110" rx="12" fill="#e8f1ea"/>
    
    <rect x="141" y="380" width="44" height="34" rx="6" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M149 380 V373 C149 365 177 365 177 373 V380" stroke="#207448" stroke-width="4" fill="none"/>
    <circle cx="163" cy="394" r="3.5" fill="#207448"/>
    <line x1="163" y1="397" x2="163" y2="405" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="215" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TLS/PKI</text>
    
    <rect x="525" y="350" width="485" height="90" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="545" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">certificate verify failed</text>
    
    <rect x="1030" y="350" width="485" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">(60)</text>
  </g>

  
  <g id="layer-name-resolution">
    <rect x="105" y="480" width="1425" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="490" width="390" height="110" rx="12" fill="#e8f1ea"/>
    
    <circle cx="163" cy="545" r="24" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="139" y1="545" x2="187" y2="545" stroke="#207448" stroke-width="3"/>
    <ellipse cx="163" cy="545" rx="12" ry="24" stroke="#207448" stroke-width="3" fill="none"/>
    <line x1="163" y1="521" x2="163" y2="569" stroke="#207448" stroke-width="3"/>
    <text x="215" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Name resolution</text>
    
    <rect x="525" y="500" width="485" height="90" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">Could not resolve host</text>
    
    <rect x="1030" y="500" width="485" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">(exit 6)</text>
  </g>

  
  <g id="layer-transport">
    <rect x="105" y="630" width="1425" height="175" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="640" width="390" height="155" rx="12" fill="#e8f1ea"/>
    
    <circle cx="147" cy="717" r="10" stroke="#207448" stroke-width="4" fill="none"/>
    <circle cx="179" cy="717" r="10" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M157 711 H169" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M169 723 H157" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M141 702 V732" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M185 702 V732" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="215" y="727" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Transport</text>

    
    <rect x="525" y="642" width="485" height="70" rx="10" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="686" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">Connection refused</text>
    <rect x="1030" y="642" width="485" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="686" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">(exit 7, no listener)</text>

    
    <rect x="525" y="723" width="485" height="70" rx="10" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="767" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">Connection timed out</text>
    <rect x="1030" y="723" width="485" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="767" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">(28/7, loss or firewall DROP)</text>
  </g>

  
  <g id="layer-arp-nd">
    <rect x="105" y="825" width="1425" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="835" width="390" height="110" rx="12" fill="#e8f1ea"/>
    
    <circle cx="163" cy="890" r="12" stroke="#207448" stroke-width="4" fill="none"/>
    <line x1="146" y1="875" x2="153" y2="881" stroke="#207448" stroke-width="3"/>
    <circle cx="143" cy="873" r="5" fill="#207448"/>
    <line x1="180" y1="875" x2="173" y2="881" stroke="#207448" stroke-width="3"/>
    <circle cx="183" cy="873" r="5" fill="#207448"/>
    <line x1="163" y1="902" x2="163" y2="911" stroke="#207448" stroke-width="3"/>
    <circle cx="163" cy="914" r="5" fill="#207448"/>
    <text x="215" y="900" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ARP/ND</text>
    
    <rect x="525" y="845" width="485" height="90" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="899" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">No route to host</text>
    
    <rect x="1030" y="845" width="485" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="899" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">(exit 7)</text>
  </g>

  
  <g id="layer-routing">
    <rect x="105" y="975" width="1425" height="130" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="115" y="985" width="390" height="110" rx="12" fill="#e8f1ea"/>
    
    <rect x="139" y="1024" width="48" height="32" rx="16" stroke="#207448" stroke-width="4" fill="none"/>
    <path d="M153 1040 H173" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M163 1032 V1048" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M149 1037 L146 1040 L149 1043" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M177 1037 L180 1040 L177 1043" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="1050" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Routing</text>
    
    <rect x="525" y="995" width="485" height="90" rx="12" fill="#f5f8f5" stroke="#303a36" stroke-width="2"/>
    <text x="550" y="1049" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36">Network is unreachable</text>
    
    <rect x="1030" y="995" width="485" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="1049" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">(exit 7)</text>
  </g>
</svg>