<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>From symptom to layer</title>
  <desc>Infographic mapping curl error symptoms and exit codes to network troubleshooting layers from Routing up to Application.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">From symptom to layer</text>

  
  <rect x="470" y="90" width="660" height="48" rx="24" fill="#db8129" />
  <text x="800" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">start with the layer the message points to</text>

  
  <path d="M 120 985 L 60 985 L 60 235 L 118 235" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="120" y="175" width="1440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="145" y="211" width="56" height="48" rx="6" stroke="#207448" stroke-width="4" fill="none" />
    <line x1="145" y1="225" x2="201" y2="225" stroke="#207448" stroke-width="3" />
    <circle cx="155" cy="218" r="2" fill="#207448" />
    <circle cx="163" cy="218" r="2" fill="#207448" />
    <circle cx="171" cy="218" r="2" fill="#207448" />
    <line x1="155" y1="237" x2="175" y2="237" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="155" y1="247" x2="191" y2="247" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="220" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Application</text>
    
    <rect x="510" y="195" width="1025" height="80" rx="12" fill="#ffffff" stroke="#c2d8c9" stroke-width="2" />
    <text x="540" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'HTTP 4xx/5xx'</text>
    
    <rect x="1270" y="209" width="240" height="52" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1390" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(22 with -f)</text>
  </g>

  
  <g>
    <rect x="120" y="315" width="1440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="151" y="353" width="44" height="34" rx="5" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M 161 353 v -12 a 12 12 0 0 1 24 0 v 12" stroke="#207448" stroke-width="4" fill="none" />
    <circle cx="173" cy="368" r="3" fill="#207448" />
    <line x1="173" y1="371" x2="173" y2="377" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="220" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TLS/PKI</text>
    
    <rect x="510" y="335" width="1025" height="80" rx="12" fill="#ffffff" stroke="#c2d8c9" stroke-width="2" />
    <text x="540" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'certificate verify failed'</text>
    
    <rect x="1350" y="349" width="160" height="52" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1430" y="384" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(60)</text>
  </g>

  
  <g>
    <rect x="120" y="455" width="1440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="173" cy="515" r="24" stroke="#207448" stroke-width="4" fill="none" />
    <ellipse cx="173" cy="515" rx="12" ry="24" stroke="#207448" stroke-width="3" fill="none" />
    <line x1="149" y1="515" x2="197" y2="515" stroke="#207448" stroke-width="3" />
    
    <text x="220" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Name resolution</text>
    
    <rect x="510" y="475" width="1025" height="80" rx="12" fill="#ffffff" stroke="#c2d8c9" stroke-width="2" />
    <text x="540" y="525" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'Could not resolve host'</text>
    
    <rect x="1310" y="489" width="200" height="52" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1410" y="524" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(exit 6)</text>
  </g>

  
  <g>
    <rect x="120" y="595" width="1440" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="151" y="660" width="18" height="40" rx="4" stroke="#207448" stroke-width="3" fill="none" />
    <rect x="177" y="660" width="18" height="40" rx="4" stroke="#207448" stroke-width="3" fill="none" />
    <path d="M 173 672 h -10" stroke="#207448" stroke-width="3" />
    <polyline points="167,668 173,672 167,676" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 173 688 h -10" stroke="#207448" stroke-width="3" />
    <polyline points="169,684 163,688 169,692" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="220" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Transport</text>
    
    <rect x="510" y="610" width="1025" height="64" rx="10" fill="#ffffff" stroke="#c2d8c9" stroke-width="1.5" />
    <text x="540" y="652" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'Connection refused'</text>
    <rect x="1170" y="618" width="340" height="48" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1340" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(exit 7, no listener)</text>
    
    <rect x="510" y="686" width="1025" height="64" rx="10" fill="#ffffff" stroke="#c2d8c9" stroke-width="1.5" />
    <text x="540" y="728" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'Connection timed out'</text>
    <rect x="1050" y="694" width="460" height="48" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1280" y="726" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(28/7, loss or firewall DROP)</text>
  </g>

  
  <g>
    <rect x="120" y="785" width="1440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="173" cy="827" r="7" stroke="#207448" stroke-width="3" fill="none" />
    <circle cx="153" cy="860" r="7" stroke="#207448" stroke-width="3" fill="none" />
    <circle cx="173" cy="860" r="7" stroke="#207448" stroke-width="3" fill="none" />
    <circle cx="193" cy="860" r="7" stroke="#207448" stroke-width="3" fill="none" />
    <path d="M 173 834 v 19 M 153 853 l 15 -14 M 193 853 l -15 -14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="220" y="855" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">ARP/ND</text>
    
    <rect x="510" y="805" width="1025" height="80" rx="12" fill="#ffffff" stroke="#c2d8c9" stroke-width="2" />
    <text x="540" y="855" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'No route to host'</text>
    
    <rect x="1310" y="819" width="200" height="52" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1410" y="854" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(exit 7)</text>
  </g>

  
  <g>
    <rect x="120" y="925" width="1440" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="173" cy="985" r="24" stroke="#207448" stroke-width="4" fill="none" />
    <path d="M 161 985 h 24 M 173 973 v 24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <polyline points="180,981 185,985 180,989" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="166,981 161,985 166,989" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="169,978 173,973 177,978" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="169,992 173,997 177,992" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="220" y="995" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Routing</text>
    
    <rect x="510" y="945" width="1025" height="80" rx="12" fill="#ffffff" stroke="#c2d8c9" stroke-width="2" />
    <text x="540" y="995" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">'Network is unreachable'</text>
    
    <rect x="1310" y="959" width="200" height="52" rx="8" fill="#eef4f0" stroke="#9cbfa8" stroke-width="1.5" />
    <text x="1410" y="994" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#303a36">(exit 7)</text>
  </g>
</svg>