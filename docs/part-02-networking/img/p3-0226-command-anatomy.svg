<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Anatomy of one tcpdump command</title>
  <desc>Visual explanation of the components of a standard tcpdump command, its options, and common variation flags.</desc>

  <rect width="1600" height="1300" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Anatomy of one tcpdump command</text>

  
  <g id="main-command">
    <rect x="50" y="105" width="1500" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <text x="800" y="165" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">sudo tcpdump -nni eth0 -s 96 -w /tmp/c.pcap &quot;host 10.0.0.5 and tcp&quot;</text>
  </g>

  

  
  <g id="piece-sudo">
    <rect x="50" y="225" width="730" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 68 245 L 56 245 L 56 340 L 68 340" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(80, 265)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 28 6 L 8 16 L 8 32 C 8 44 28 52 28 52 C 28 52 48 44 48 32 L 48 16 Z"/>
      <path d="M 28 22 L 28 36"/>
      <circle cx="28" cy="22" r="3" fill="#207448"/>
    </g>
    
    <text x="155" y="303" font-size="26" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">sudo: </tspan>
      <tspan font-family="sans-serif">the right to open a raw socket</tspan>
    </text>
  </g>

  
  <g id="piece-nn">
    <rect x="820" y="225" width="730" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 838 245 L 826 245 L 826 340 L 838 340" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(850, 265)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 6 28 C 14 16 38 16 46 28 C 38 40 14 40 6 28 Z"/>
      <circle cx="26" cy="28" r="7"/>
      <line x1="8" y1="46" x2="44" y2="10"/>
    </g>
    
    <text x="925" y="303" font-size="26" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-nn: </tspan>
      <tspan font-family="sans-serif">no name lookups, no port names</tspan>
    </text>
  </g>

  
  <g id="piece-i">
    <rect x="50" y="380" width="730" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 68 400 L 56 400 L 56 495 L 68 495" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(80, 420)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="6" y="10" width="44" height="28" rx="4"/>
      <line x1="16" y1="38" x2="16" y2="48"/>
      <line x1="28" y1="38" x2="28" y2="48"/>
      <line x1="40" y1="38" x2="40" y2="48"/>
      <circle cx="16" cy="22" r="3" fill="#207448"/>
      <circle cx="28" cy="22" r="3" fill="#207448"/>
    </g>
    
    <text x="155" y="458" font-size="26" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-i eth0: </tspan>
      <tspan font-family="sans-serif">listen on the eth0 interface</tspan>
    </text>
  </g>

  
  <g id="piece-s">
    <rect x="820" y="380" width="730" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 838 400 L 826 400 L 826 495 L 838 495" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(850, 420)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="16" cy="18" r="8"/>
      <circle cx="16" cy="40" r="8"/>
      <line x1="23" y1="23" x2="46" y2="44"/>
      <line x1="23" y1="35" x2="46" y2="14"/>
    </g>
    
    <text x="925" y="440" font-size="25" fill="#303a36">
      <tspan x="925" dy="0" font-family="monospace" font-weight="bold" fill="#207448">-s 96: </tspan>
      <tspan x="925" dy="34" font-family="sans-serif">keep the first 96 bytes of each packet</tspan>
    </text>
  </g>

  
  <g id="piece-w">
    <rect x="50" y="535" width="730" height="155" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 68 555 L 56 555 L 56 670 L 68 670" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(80, 585)" stroke="#db8129" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="28" cy="14" rx="20" ry="8"/>
      <path d="M 8 14 L 8 42 C 8 47 17 50 28 50 C 39 50 48 47 48 42 L 48 14"/>
      <path d="M 8 28 C 8 33 17 36 28 36 C 39 36 48 33 48 28"/>
    </g>
    
    <text x="155" y="582" font-size="25" fill="#303a36">
      <tspan x="155" dy="0" font-family="monospace" font-weight="bold" fill="#db8129">-w /tmp/c.pcap: </tspan>
      <tspan x="155" dy="36" font-family="sans-serif">write packets to a file rather than the screen,</tspan>
      <tspan x="155" dy="34" font-family="sans-serif">safer than reading live</tspan>
    </text>
  </g>

  
  <g id="piece-filter">
    <rect x="820" y="535" width="730" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 838 555 L 826 555 L 826 670 L 838 670" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(850, 585)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="8,10 48,10 32,32 32,48 24,52 24,32"/>
    </g>
    
    <text x="925" y="582" font-size="24" fill="#303a36">
      <tspan x="925" dy="0" font-family="sans-serif" font-weight="bold" fill="#207448">quoted filter: host 10.0.0.5 and tcp; </tspan>
      <tspan x="925" dy="36" font-family="sans-serif">single quotes stop the shell from reading</tspan>
      <tspan x="925" dy="34" font-family="sans-serif">the spaces and the ampersand</tspan>
    </text>
  </g>

  
  <g id="variations-strip">
    <rect x="50" y="715" width="1500" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    
    <rect x="52" y="717" width="1496" height="52" fill="#e8f1ea"/>
    <circle cx="80" cy="743" r="6" fill="#207448"/>
    <text x="105" y="751" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-c 100 </tspan>
      <tspan font-family="sans-serif">stops after 100 packets</tspan>
    </text>

    
    <rect x="52" y="771" width="1496" height="52" fill="#ffffff"/>
    <circle cx="80" cy="797" r="6" fill="#207448"/>
    <text x="105" y="805" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-C 100 -W 10 </tspan>
      <tspan font-family="sans-serif">ring buffer of 10 files of 100 MB</tspan>
    </text>

    
    <rect x="52" y="825" width="1496" height="52" fill="#e8f1ea"/>
    <circle cx="80" cy="851" r="6" fill="#207448"/>
    <text x="105" y="859" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-G 300 </tspan>
      <tspan font-family="sans-serif">rotates every 300 seconds</tspan>
    </text>

    
    <rect x="52" y="879" width="1496" height="52" fill="#ffffff"/>
    <circle cx="80" cy="905" r="6" fill="#207448"/>
    <text x="105" y="913" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-B 4096 </tspan>
      <tspan font-family="sans-serif">kernel buffer 4096 KiB</tspan>
    </text>

    
    <rect x="52" y="933" width="1496" height="52" fill="#e8f1ea"/>
    <circle cx="80" cy="959" r="6" fill="#207448"/>
    <text x="105" y="967" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-Z tcpdump </tspan>
      <tspan font-family="sans-serif">drops privileges after opening</tspan>
    </text>

    
    <rect x="52" y="987" width="1496" height="52" fill="#ffffff"/>
    <circle cx="80" cy="1013" r="6" fill="#207448"/>
    <text x="105" y="1021" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-d </tspan>
      <tspan font-family="sans-serif">shows the compiled BPF bytecode</tspan>
    </text>

    
    <rect x="52" y="1041" width="1496" height="52" fill="#e8f1ea"/>
    <circle cx="80" cy="1067" r="6" fill="#207448"/>
    <text x="105" y="1075" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-tttt </tspan>
      <tspan font-family="sans-serif">date and time, </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-ttt </tspan>
      <tspan font-family="sans-serif">delta, </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-e </tspan>
      <tspan font-family="sans-serif">link layer, </tspan>
      <tspan font-family="monospace" font-weight="bold" fill="#207448">-X </tspan>
      <tspan font-family="sans-serif">hex plus ASCII</tspan>
    </text>

    
    <rect x="52" y="1095" width="1496" height="52" fill="#ffffff"/>
    <circle cx="80" cy="1121" r="6" fill="#207448"/>
    <text x="105" y="1129" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">--time-stamp-precision nano -j adapter_unsynced </tspan>
      <tspan font-family="sans-serif">NIC hardware timestamps</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1175" width="1500" height="80" rx="10" fill="#207448"/>
    <text x="800" y="1225" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Each piece has one job, so change one piece without touching the others</text>
  </g>
</svg>