<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>One slow node among twenty, and a throughput test that narrows the cause</title>
  <desc>Visual infographic explaining static fleet configuration checks and sequential throughput testing on a 100G link.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <text x="800" y="55">One slow node among twenty,</text>
    <text x="800" y="108">and a throughput test that narrows the cause</text>
  </g>

  
  <rect x="40" y="135" width="740" height="825" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 148)">
    <rect x="0" y="2" width="48" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="8" r="1.5" fill="#207448" />
    <line x1="16" y1="8" x2="36" y2="8" stroke="#207448" stroke-width="2" />
    <rect x="0" y="18" width="48" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="24" r="1.5" fill="#207448" />
    <line x1="16" y1="24" x2="36" y2="24" stroke="#207448" stroke-width="2" />
    <rect x="0" y="34" width="48" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="8" cy="40" r="1.5" fill="#207448" />
    <line x1="16" y1="40" x2="36" y2="40" stroke="#207448" stroke-width="2" />
  </g>
  <text x="130" y="184" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Static check across the fleet</text>

  
