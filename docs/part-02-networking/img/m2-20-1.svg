<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Packet paths</title>
  <desc>Visual comparison of Proxy / NAT mode load balancing and Direct Server Return (DSR) packet paths.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Packet paths</text>

  
  <rect x="60" y="95" width="1480" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="90" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Proxy / NAT mode (reply returns via LB)</text>

  
  <rect x="90" y="185" width="280" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(205, 204)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="44" height="30" rx="4" />
    <line x1="25" y1="33" x2="25" y2="42" />
    <line x1="14" y1="42" x2="36" y2="42" />
    <line x1="10" y1="14" x2="20" y2="14" />
  </g>
  <text x="230" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Client</text>

  
  <rect x="570" y="185" width="460" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(775, 204)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="44" height="32" rx="6" />
    <path d="M 12 21 L 22 21 M 22 21 L 34 14 M 22 21 L 34 28" />
    <circle cx="12" cy="21" r="2.5" fill="#207448" />
    <circle cx="34" cy="14" r="2.5" fill="#207448" />
    <circle cx="34" cy="28" r="2.5" fill="#207448" />
  </g>
  <text x="800" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">LB (VIP)</text>
  <text x="800" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">terminates or DNATs</text>

  
  <rect x="1210" y="185" width="300" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1335, 204)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="44" height="15" rx="3" />
    <circle cx="11" cy="11.5" r="2" fill="#207448" />
    <line x1="20" y1="11.5" x2="40" y2="11.5" stroke-width="2.5" />
    <rect x="3" y="23" width="44" height="15" rx="3" />
    <circle cx="11" cy="30.5" r="2" fill="#207448" />
    <line x1="20" y1="30.5" x2="40" y2="30.5" stroke-width="2.5" />
  </g>
  <text x="1360" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Backend</text>

  
  <line x1="370" y1="245" x2="570" y2="245" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />
  <line x1="1030" y1="245" x2="1210" y2="245" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />
  <line x1="1210" y1="315" x2="1030" y2="315" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />
  <line x1="570" y1="315" x2="370" y2="315" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="525" width="1480" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="90" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Direct Server Return (reply bypasses LB)</text>

  
  <rect x="90" y="615" width="280" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(205, 634)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="44" height="30" rx="4" />
    <line x1="25" y1="33" x2="25" y2="42" />
    <line x1="14" y1="42" x2="36" y2="42" />
    <line x1="10" y1="14" x2="20" y2="14" />
  </g>
  <text x="230" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Client</text>

  
  <rect x="570" y="615" width="460" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(775, 634)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="44" height="32" rx="6" />
    <path d="M 12 21 L 22 21 M 22 21 L 34 14 M 22 21 L 34 28" />
    <circle cx="12" cy="21" r="2.5" fill="#207448" />
    <circle cx="34" cy="14" r="2.5" fill="#207448" />
    <circle cx="34" cy="28" r="2.5" fill="#207448" />
  </g>
  <text x="800" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">LB (VIP)</text>
  <text x="800" y="758" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">rewrites L2 dst / tunnels</text>

  
  <rect x="1210" y="615" width="300" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1335, 634)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="44" height="15" rx="3" />
    <circle cx="11" cy="11.5" r="2" fill="#207448" />
    <line x1="20" y1="11.5" x2="40" y2="11.5" stroke-width="2.5" />
    <rect x="3" y="23" width="44" height="15" rx="3" />
    <circle cx="11" cy="30.5" r="2" fill="#207448" />
    <line x1="20" y1="30.5" x2="40" y2="30.5" stroke-width="2.5" />
  </g>
  <text x="1360" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Backend</text>
  <text x="1360" y="758" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(VIP on loopback)</text>

  
  <line x1="370" y1="705" x2="570" y2="705" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />
  <line x1="1030" y1="705" x2="1210" y2="705" stroke="#207448" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-green)" />

  
  <path d="M 1360 795 V 870 Q 1360 890 1340 890 H 250 Q 230 890 230 870 V 795" fill="none" stroke="#db8129" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />

  
  <rect x="640" y="825" width="320" height="44" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="800" y="856" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">reply with src=VIP</text>
</svg>