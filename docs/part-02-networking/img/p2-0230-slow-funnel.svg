<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Slowness is a funnel: measure it, find the limit, find the segment, then split loss from delay</title>
  <desc>Visual infographic explaining performance troubleshooting as a five-step narrowing funnel with healthy node comparison.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" y="55">Slowness is a funnel: measure it, find the limit,</tspan>
    <tspan x="800" y="112">find the segment, then split loss from delay</tspan>
  </text>

  
  
  <polygon points="70,145 1130,145 1090,285 110,285" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-linejoin="round" />
  
  
  <circle cx="160" cy="215" r="24" fill="#207448" />
  <text x="160" y="224" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

  
  <g transform="translate(205, 187)">
    <path d="M 6 42 A 24 24 0 1 1 50 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="28" x2="43" y2="15" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="28" r="4" fill="#207448" />
    <line x1="12" y1="36" x2="16" y2="33" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="8" x2="28" y2="13" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="36" x2="40" y2="33" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="285" y="188" font-size="30" font-weight="bold">Quantify:</tspan>
    <tspan x="285" y="224" font-size="24">throughput, latency percentiles, retransmit rate,</tspan>
    <tspan x="285" y="258" font-size="24">against baseline and line rate or BDP</tspan>
  </text>

  
  
  <polygon points="115,299 1085,299 1045,439 155,439" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-linejoin="round" />

  
  <circle cx="205" cy="369" r="24" fill="#207448" />
  <text x="205" y="378" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

  
  <g transform="translate(252, 341)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="18" y="18" width="20" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="330" y="342" font-size="30" font-weight="bold">Find the limit:</tspan>
    <tspan x="330" y="378" font-size="24"><tspan font-family="monospace" font-weight="bold">ss -ti</tspan> limiter flags, CPU and softirq,</tspan>
    <tspan x="330" y="412" font-size="24">NIC drops, PFC, ECN, MTU</tspan>
  </text>

  
  
  <polygon points="160,453 1040,453 1000,593 200,593" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-linejoin="round" />

  
  <circle cx="250" cy="523" r="24" fill="#207448" />
  <text x="250" y="532" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  
  <g transform="translate(296, 495)">
    <circle cx="8" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="48" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="4" />
    <line x1="28" y1="12" x2="28" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="23" y1="17" x2="33" y2="17" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="23" y1="39" x2="33" y2="39" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="375" y="496" font-size="30" font-weight="bold">Find the segment:</tspan>
    <tspan x="375" y="532" font-size="24"><tspan font-family="monospace" font-weight="bold">iperf3</tspan> or <tspan font-family="monospace" font-weight="bold">ib_write_bw</tspan> between pairs,</tspan>
    <tspan x="375" y="566" font-size="24">halving the path</tspan>
  </text>

  
  
  <polygon points="205,607 995,607 955,747 245,747" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-linejoin="round" />

  
  <circle cx="295" cy="677" r="24" fill="#207448" />
  <text x="295" y="686" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

  
  <g transform="translate(342, 649)">
    <circle cx="28" cy="30" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,18 28,30 38,30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="22" y1="3" x2="34" y2="3" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="3" x2="28" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="420" y="650" font-size="30" font-weight="bold">Loss or latency:</tspan>
    <tspan x="420" y="686" font-size="24"><tspan font-family="monospace" font-weight="bold">nstat</tspan> and <tspan font-family="monospace" font-weight="bold">tcpretrans</tspan> for loss,</tspan>
    <tspan x="420" y="720" font-size="24"><tspan font-family="monospace" font-weight="bold">ss -ti</tspan> and <tspan font-family="monospace" font-weight="bold">ping</tspan> for RTT</tspan>
  </text>

  
  
  
  <polygon points="250,761 950,761 910,921 290,921" fill="#e8f1ea" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />

  
  <circle cx="335" cy="841" r="24" fill="#207448" />
  <text x="335" y="850" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>

  
  <g transform="translate(382, 813)">
    <line x1="4" y1="28" x2="22" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="22" cy="28" r="4" fill="#207448" />
    <path d="M 22 28 Q 36 12 50 12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="22" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 22 28 Q 36 44 50 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="455" y="802" font-size="30" font-weight="bold">One flow or all flows:</tspan>
    <tspan x="455" y="836" font-size="24">ECMP hash collisions,</tspan>
    <tspan x="455" y="868" font-size="24">elephant flows,</tspan>
    <tspan x="455" y="900" font-size="24">single-core limits</tspan>
  </text>

  
  
  <rect x="1170" y="260" width="370" height="600" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="1225" cy="318" r="24" fill="#207448" />
  <text x="1225" y="327" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  
  <text font-family="sans-serif" fill="#303a36">
    <tspan x="1265" y="327" font-size="30" font-weight="bold">Step 6:</tspan>
    <tspan x="1205" y="380" font-size="26" font-weight="bold">compare with a</tspan>
    <tspan x="1205" y="415" font-size="26" font-weight="bold">healthy node</tspan>
  </text>

  
  
  <rect x="1205" y="465" width="300" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <line x1="1225" y1="495" x2="1375" y2="495" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1225" y1="515" x2="1375" y2="515" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1225" y1="535" x2="1375" y2="535" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <rect x="1400" y="488" width="85" height="58" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1425" cy="517" r="5" fill="#207448" />
  <circle cx="1445" cy="517" r="5" fill="#207448" />
  <circle cx="1465" cy="517" r="5" fill="#207448" />

  
  <line x1="1355" y1="585" x2="1355" y2="675" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="1355" cy="630" r="18" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <line x1="1346" y1="626" x2="1364" y2="626" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <line x1="1346" y1="634" x2="1364" y2="634" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  <line x1="1348" y1="639" x2="1362" y2="621" stroke="#207448" stroke-width="2" stroke-linecap="round" />

  
  <rect x="1205" y="685" width="300" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <line x1="1225" y1="715" x2="1375" y2="715" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1225" y1="735" x2="1375" y2="735" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1225" y1="755" x2="1375" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <rect x="1400" y="708" width="85" height="58" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="1442" cy="737" r="16" fill="#207448" />
  <polyline points="1434,737 1440,743 1451,731" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  
  
  <rect x="160" y="965" width="1280" height="74" rx="12" fill="#207448" />
  <text x="800" y="1011" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each step removes part of the search space before the next one starts.</text>
</svg>