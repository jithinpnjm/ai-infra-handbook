<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Overhead and goodput</title>
  <desc>Visual breakdown of packet overhead, wire time calculations, MTU goodput efficiency, and line-rate frame rates.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Overhead and goodput</text>

  
  <g>
    <rect x="340" y="125" width="920" height="62" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="167" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">1460 + 20 + 20 + 14 + 4 + 20 = 1538 byte times</text>
  </g>

  
  <g id="stacked-bar">
    
    <g id="seg-preamble">
      <rect x="60" y="225" width="212" height="220" rx="10" fill="#dbe2dd" stroke="#7a8a83" stroke-width="2"/>
      
      <g transform="translate(144, 245)" stroke="#7a8a83" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="20"/>
        <polyline points="22,10 22,22 30,22"/>
      </g>
      <text x="166" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="166" dy="0">Preamble+gap</tspan>
        <tspan x="166" dy="32" font-family="monospace">20 B</tspan>
      </text>
    </g>

    
    <g id="seg-ethernet">
      <rect x="276" y="225" width="236" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(372, 245)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="36" height="32" rx="4"/>
        <line x1="14" y1="38" x2="14" y2="28"/>
        <line x1="22" y1="38" x2="22" y2="28"/>
        <line x1="30" y1="38" x2="30" y2="28"/>
      </g>
      <text x="394" y="335" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="394" dy="0">Ethernet</tspan>
        <tspan x="394" dy="30">header</tspan>
        <tspan x="394" dy="30" font-family="monospace">14 B</tspan>
      </text>
    </g>

    
    <g id="seg-ip">
      <rect x="516" y="225" width="172" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(580, 245)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="20"/>
        <ellipse cx="22" cy="22" rx="9" ry="20"/>
        <line x1="2" y1="22" x2="42" y2="22"/>
      </g>
      <text x="602" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="602" dy="0">IP header</tspan>
        <tspan x="602" dy="32" font-family="monospace">20 B</tspan>
      </text>
    </g>

    
    <g id="seg-tcp">
      <rect x="692" y="225" width="182" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(761, 245)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="14" width="20" height="14" rx="4"/>
        <rect x="18" y="18" width="20" height="14" rx="4"/>
      </g>
      <text x="783" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="783" dy="0">TCP header</tspan>
        <tspan x="783" dy="32" font-family="monospace">20 B</tspan>
      </text>
    </g>

    
    <g id="seg-data">
      <rect x="878" y="225" width="550" height="220" rx="10" fill="#207448" stroke="#165333" stroke-width="2"/>
      
      <g transform="translate(1129, 245)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="36" height="36" rx="5"/>
        <line x1="14" y1="14" x2="34" y2="14"/>
        <line x1="14" y1="22" x2="34" y2="22"/>
        <line x1="14" y1="30" x2="26" y2="30"/>
      </g>
      <text x="1153" y="345" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
        <tspan x="1153" dy="0">data</tspan>
        <tspan x="1153" dy="38" font-family="monospace" font-size="30">1460 B</tspan>
      </text>
    </g>

    
    <g id="seg-fcs">
      <rect x="1432" y="225" width="108" height="220" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(1464, 245)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22,4 L38,10 L38,22 C38,32 22,40 22,40 C22,40 6,32 6,22 L6,10 Z"/>
      </g>
      <text x="1486" y="345" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1486" dy="0">FCS</tspan>
        <tspan x="1486" dy="32" font-family="monospace">4 B</tspan>
      </text>
    </g>
  </g>

  
  <g id="results-row-1">
    
    <g id="chip-mtu-1500">
      <rect x="60" y="485" width="720" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(90, 532)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="48" height="40" rx="6"/>
        <line x1="18" y1="8" x2="18" y2="48"/>
      </g>
      <text x="175" y="546" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
        <tspan x="175" dy="0">MTU 1500:</tspan>
        <tspan x="175" dy="44" font-family="monospace" font-size="30" fill="#207448">1460 / 1538 = 94.9%</tspan>
      </text>
    </g>

    
    <g id="chip-mtu-9000">
      <rect x="820" y="485" width="720" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(850, 532)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="6" width="48" height="44" rx="6"/>
        <line x1="14" y1="6" x2="14" y2="50"/>
        <line x1="42" y1="6" x2="42" y2="50"/>
      </g>
      <text x="935" y="546" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
        <tspan x="935" dy="0">MTU 9000 (jumbo):</tspan>
        <tspan x="935" dy="44" font-family="monospace" font-size="30" fill="#207448">8960 / 9038 = 99.1%</tspan>
      </text>
    </g>
  </g>

  
  <g id="results-row-2">
    
    <g id="chip-tiny-frame">
      <rect x="60" y="675" width="1480" height="165" rx="16" fill="#fef8f2" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(90, 729)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6,44 A24,24 0 1,1 50,44"/>
        <polyline points="28,28 42,16"/>
        <circle cx="28" cy="28" r="4" fill="#db8129"/>
      </g>
      <text x="175" y="738" font-family="sans-serif">
        <tspan x="175" dy="0" font-size="32" font-weight="bold" fill="#db8129">Tiny 64-byte frame:</tspan>
        <tspan x="175" dy="42" font-size="26" font-weight="bold" fill="#303a36">84 byte times on the wire, up to 148.8 million frames per second at 100 Gb/s</tspan>
      </text>
    </g>
  </g>
</svg>