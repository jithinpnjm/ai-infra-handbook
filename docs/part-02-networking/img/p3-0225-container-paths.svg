<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three paths from a container: to a neighbour, to the Internet, and from outside to a published port</title>
  <desc>Technical infographic illustrating the three container networking paths: c1 to c2 over a bridge, c1 to the Internet with NAT masquerading, and inbound traffic to a published port with DNAT.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three paths from a container: to a neighbour,</text>
  <text x="800" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">to the Internet, and to a published port</text>

  
  <rect id="box-host" x="40" y="156" width="1520" height="780" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="10 8"/>

  
  <rect id="box-host-header" x="56" y="168" width="1488" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>

  
  <g transform="translate(68, 176)">
    <rect x="0" y="0" width="146" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(10, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="46" height="18" rx="3"/>
      <rect x="2" y="30" width="46" height="18" rx="3"/>
      <circle cx="10" cy="15" r="2" fill="#207448"/>
      <circle cx="18" cy="15" r="2" fill="#207448"/>
      <circle cx="10" cy="39" r="2" fill="#207448"/>
      <circle cx="18" cy="39" r="2" fill="#207448"/>
      <line x1="30" y1="15" x2="42" y2="15"/>
      <line x1="30" y1="39" x2="42" y2="39"/>
    </g>
    
    <text x="74" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">host</text>
  </g>

  
  <g transform="translate(228, 176)">
    <rect x="0" y="0" width="304" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(10, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="46" height="48" rx="4"/>
      <line x1="2" y1="16" x2="48" y2="16"/>
      <circle cx="10" cy="9" r="2.5" fill="#207448"/>
      <circle cx="19" cy="9" r="2.5" fill="#207448"/>
    </g>
    <text x="70" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">c1 (10.10.0.11)</text>
  </g>

  
  <g transform="translate(548, 176)">
    <rect x="0" y="0" width="336" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(10, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="46" height="34" rx="4"/>
      <line x1="14" y1="20" x2="14" y2="30"/>
      <line x1="25" y1="20" x2="25" y2="30"/>
      <line x1="36" y1="20" x2="36" y2="30"/>
    </g>
    <text x="70" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">br0 (10.10.0.1/24)</text>
  </g>

  
  <g transform="translate(900, 176)">
    <rect x="0" y="0" width="304" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(10, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="46" height="48" rx="4"/>
      <line x1="2" y1="16" x2="48" y2="16"/>
      <circle cx="10" cy="9" r="2.5" fill="#207448"/>
      <circle cx="19" cy="9" r="2.5" fill="#207448"/>
    </g>
    <text x="70" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">c2 (10.10.0.12)</text>
  </g>

  
  <g transform="translate(1220, 176)">
    <rect x="0" y="0" width="310" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(12, 6)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="46" height="38" rx="3"/>
      <line x1="10" y1="42" x2="10" y2="50"/>
      <line x1="20" y1="42" x2="20" y2="50"/>
      <line x1="30" y1="42" x2="30" y2="50"/>
      <line x1="40" y1="42" x2="40" y2="50"/>
      <circle cx="14" cy="18" r="3" fill="#207448"/>
    </g>
    <text x="74" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">uplink NIC</text>
  </g>

  
  <g id="lane-1">
    <rect id="box-lane-1" x="56" y="262" width="1488" height="224" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    
    <circle cx="96" cy="302" r="24" fill="#207448"/>
    <text x="96" y="311" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(136, 274)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="28" r="8"/>
      <circle cx="42" cy="28" r="8"/>
      <path d="M 22 28 L 34 28"/>
    </g>
    
    
    <text x="208" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">c1 to c2 on the same bridge</text>

    
    <line x1="680" y1="302" x2="1520" y2="302" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="84" y="350">c1's own stack routes the packet because both share a subnet, ARP finds c2,</tspan>
      <tspan x="84" y="378">the packet leaves c1's eth0 (veth peer), enters the host-side veth, the bridge learns</tspan>
      <tspan x="84" y="406">the MAC and forwards the frame to c2's veth and eth0</tspan>
      <tspan x="84" y="436">br_netfilter and net.bridge.bridge-nf-call-iptables=1 let iptables see bridged traffic;</tspan>
      <tspan x="84" y="464">Kubernetes requires it so kube-proxy rules apply</tspan>
    </text>
  </g>

  
  <g id="lane-2">
    <rect id="box-lane-2" x="56" y="496" width="1488" height="276" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    
    <circle cx="96" cy="534" r="24" fill="#207448"/>
    <text x="96" y="543" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(136, 506)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <ellipse cx="28" cy="28" rx="10" ry="22"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
    </g>

    
    <text x="208" y="544" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">c1 to the Internet</text>

    
    <line x1="530" y1="534" x2="1520" y2="534" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="84" y="582">default route points at the bridge IP 10.10.0.1; the packet enters the host IP stack,</tspan>
      <tspan x="84" y="608">passes FORWARD then POSTROUTING masquerade, leaves through the NIC with the host's</tspan>
      <tspan x="84" y="634">address; return traffic is un-NATed by conntrack and delivered back through the bridge;</tspan>
      <tspan x="84" y="660">the outside world only talks to the host</tspan>
    </text>

    
    <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="84" y="692">sysctl -w net.ipv4.ip_forward=1</tspan>
      <tspan x="620" y="692">iptables -I FORWARD -i br0 -j ACCEPT</tspan>
      <tspan x="84" y="720">iptables -t nat -A POSTROUTING -s 10.10.0.0/24 ! -o br0 -j MASQUERADE</tspan>
      <tspan x="84" y="748">iptables -I FORWARD -o br0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT</tspan>
    </text>
  </g>

  
  <g id="lane-3">
    <rect id="box-lane-3" x="56" y="782" width="1488" height="142" rx="10" fill="#fdf8f3" stroke="#db8129" stroke-width="2.5"/>
    
    
    <circle cx="96" cy="820" r="24" fill="#db8129"/>
    <text x="96" y="829" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(136, 792)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="4"/>
      <path d="M 18 28 L 38 28"/>
      <polyline points="26,20 18,28 26,36"/>
    </g>

    
    <text x="208" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">host:8080 to c1:80</text>

    
    <line x1="1520" y1="820" x2="520" y2="820" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

    
    <text font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="84" y="868">iptables -t nat -A PREROUTING -p tcp --dport 8080 -j DNAT --to-destination 10.10.0.11:80</tspan>
      <tspan x="84" y="898">iptables -t nat -A OUTPUT -p tcp -d 127.0.0.1 --dport 8080 -j DNAT ... for local clients</tspan>
    </text>
  </g>

  
  <g id="footer-notes">
    <rect id="box-footer" x="40" y="944" width="1520" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="64" y="982">DNS inside: mkdir /etc/netns/c1 and write nameserver 1.1.1.1 to /etc/netns/c1/resolv.conf</text>
    
    
    <line x1="64" y1="998" x2="1536" y2="998" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" y="1024">almost literally what the default bridge network does: docker0, a veth per container,</tspan>
      <tspan x="64" y="1048">an IPAM address from a private pool, a default route via the bridge, masquerade,</tspan>
      <tspan x="64" y="1072">DNAT for published ports, a bind-mounted /etc/resolv.conf</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect id="box-takeaway" x="40" y="1100" width="1520" height="60" rx="8" fill="#207448"/>
    <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">A container is only a namespace plus a cable</text>
  </g>
</svg>