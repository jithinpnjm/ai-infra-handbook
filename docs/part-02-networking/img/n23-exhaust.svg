<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <title>Conntrack table full</title>
  <desc>Infographic explaining conntrack table saturation, dmesg failure indicators, and five ordered remedies.</desc>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Conntrack table full</text>

  

  
  <g id="conntrack-table-box">
    <rect x="40" y="110" width="630" height="505" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="70" y="135" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="70" y1="154" x2="126" y2="154" stroke="#207448" stroke-width="4" />
    <line x1="70" y1="173" x2="126" y2="173" stroke="#207448" stroke-width="4" />
    <line x1="98" y1="135" x2="98" y2="191" stroke="#207448" stroke-width="4" />

    
    <text x="145" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">conntrack table:</tspan>
      <tspan x="145" dy="38">nf_conntrack_buckets (hash)</tspan>
      <tspan x="145" dy="38">and nf_conntrack_max (cap)</tspan>
    </text>

    
    <g transform="translate(70, 265)">
      
      <rect x="0" y="0" width="105" height="48" rx="6" fill="#207448" />
      <rect x="115" y="0" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="230" y="0" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="345" y="0" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="460" y="0" width="110" height="48" rx="6" fill="#db8129" />

      
      <rect x="0" y="58" width="105" height="48" rx="6" fill="#207448" />
      <rect x="115" y="58" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="230" y="58" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="345" y="58" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="460" y="58" width="110" height="48" rx="6" fill="#db8129" />

      
      <rect x="0" y="116" width="105" height="48" rx="6" fill="#207448" />
      <rect x="115" y="116" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="230" y="116" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="345" y="116" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="460" y="116" width="110" height="48" rx="6" fill="#db8129" />

      
      <rect x="0" y="174" width="105" height="48" rx="6" fill="#207448" />
      <rect x="115" y="174" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="230" y="174" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="345" y="174" width="105" height="48" rx="6" fill="#303a36" />
      <rect x="460" y="174" width="110" height="48" rx="6" fill="#db8129" />

      
      <rect x="0" y="238" width="570" height="38" rx="6" fill="#db8129" />
    </g>
  </g>

  
  <g id="table-full-alert-box">
    <rect x="40" y="645" width="630" height="350" rx="16" fill="#fff5eb" stroke="#db8129" stroke-width="3" />

    
    <path d="M 98 670 L 126 726 L 70 726 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="98" y1="688" x2="98" y2="708" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="98" cy="718" r="2.5" fill="#db8129" />

    
    <text x="75" y="770" font-family="system-ui, -apple-system, sans-serif" fill="#db8129">
      <tspan x="75" dy="0" font-size="30" font-weight="bold">table full:</tspan>
      <tspan x="75" dy="40" font-size="28" font-weight="bold">new connections dropped silently;</tspan>
      <tspan x="75" dy="52" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">dmesg: nf_conntrack: table full,</tspan>
      <tspan x="75" dy="36" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">dropping packet;</tspan>
      <tspan x="75" dy="48" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#303a36">conntrack -S counts insert_failed</tspan>
    </text>
  </g>

  

  
  <g id="remedy-1">
    <rect x="710" y="110" width="850" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="760" cy="187" r="24" fill="#207448" />
    <text x="760" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <circle cx="828" cy="181" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="840" y1="193" x2="856" y2="209" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="880" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">find who creates the flows</text>
    <text x="880" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#207448">conntrack -L, conntrack -E</text>
  </g>

  
  <g id="remedy-2">
    <rect x="710" y="295" width="850" height="165" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="760" cy="377" r="24" fill="#207448" />
    <text x="760" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <circle cx="830" cy="377" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="830" y1="377" x2="830" y2="363" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="830" y1="377" x2="844" y2="377" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="880" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">shorten timeouts</text>
    <text x="880" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="880" dy="0">established default 5 days = 432,000 s,</tspan>
      <tspan x="880" dy="34">example 3600 s; time_wait 30 s</tspan>
    </text>
  </g>

  
  <g id="remedy-3">
    <rect x="710" y="490" width="850" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="760" cy="567" r="24" fill="#207448" />
    <text x="760" y="576" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <rect x="806" y="543" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="816" y1="577" x2="816" y2="569" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="830" y1="577" x2="830" y2="559" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="844" y1="577" x2="844" y2="549" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="880" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="880" dy="0">raise nf_conntrack_max,</tspan>
      <tspan x="880" dy="38">buckets max/4 to max/8</tspan>
    </text>
  </g>

  
  <g id="remedy-4">
    <rect x="710" y="675" width="850" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="760" cy="747" r="24" fill="#207448" />
    <text x="760" y="756" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <path d="M 810 727 L 830 720 L 850 727 L 850 748 C 850 763 830 774 830 774 C 830 774 810 763 810 748 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

    
    <text x="880" y="757" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">bypass with notrack in the raw hook</text>
  </g>

  
  <g id="remedy-5">
    <rect x="710" y="850" width="850" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="760" cy="922" r="24" fill="#207448" />
    <text x="760" y="931" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>

    
    <rect x="814" y="906" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="822" y1="898" x2="822" y2="906" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="838" y1="898" x2="838" y2="906" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="822" y1="938" x2="822" y2="946" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="838" y1="938" x2="838" y2="946" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="806" y1="914" x2="814" y2="914" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="806" y1="930" x2="814" y2="930" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="846" y1="914" x2="854" y2="914" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="846" y1="930" x2="854" y2="930" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="880" y="932" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">move to an eBPF datapath</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1030" width="1520" height="80" rx="14" fill="#207448" />
    <text x="800" y="1080" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Start with the first remedy, because it addresses the cause</text>
  </g>
</svg>