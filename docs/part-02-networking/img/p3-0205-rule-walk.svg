<svg width="1600" height="1320" viewBox="0 0 1600 1320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Two replies, one machine, two roads: following the ip rule list</title>
  <desc>Visualization of Linux ip rule policy routing directing packets to different routing tables based on source IP.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">Two replies, one machine, two roads: following the ip rule list</text>

  
  
  <g transform="translate(60, 95)">
    <rect width="1480" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="40" y="42" font-size="24" fill="#303a36">
      <tspan font-weight="bold">Tables: local 255 (kernel-maintained, consulted first), main 254 (ordinary routes),</tspan>
      <tspan x="40" dy="32">default 253 (usually empty), custom 1 to 252 and 256 up (one per NIC, tenant or VRF)</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 210)">
    <rect width="1480" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 30 35 L 45 47 L 30 59 M 52 59 L 68 59" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="90" y="45" font-family="monospace" font-size="24" fill="#303a36">ip rule add from 10.100.1.45/32 table 101</text>
    <text x="90" y="80" font-family="monospace" font-size="24" fill="#303a36">ip route add default via 10.100.1.1 dev ens2f0 table 101</text>
    <text x="90" y="115" font-family="monospace" font-size="24" fill="#207448" font-weight="bold">ip route get 8.8.8.8 from 10.100.0.45 iif lo</text>
  </g>

  
  
  <g transform="translate(60, 480)">
    <rect width="380" height="130" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <rect x="25" y="40" width="50" height="50" rx="6" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
    <path d="M 35 65 L 65 65 M 53 53 L 65 65 L 53 77" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="55" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">reply sourced</tspan>
      <tspan x="95" dy="34">from 10.100.1.45</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 780)">
    <rect width="380" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="25" y="40" width="50" height="50" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
    <path d="M 35 65 L 65 65 M 53 53 L 65 65 L 53 77" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="55" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">reply from any</tspan>
      <tspan x="95" dy="34">other source</tspan>
    </text>
  </g>

  
  <g transform="translate(500, 365)">
    
    <rect width="520" height="665" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="25" y="25" width="470" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="260" y="76" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">0: from all lookup local</text>

    
    <rect x="25" y="145" width="470" height="110" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    <text x="260" y="193" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="260" dy="0">from 10.100.1.45/32</tspan>
      <tspan x="260" dy="34">lookup table 101</tspan>
    </text>

    
    <path d="M 260 255 L 260 385" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>

    
    <rect x="25" y="385" width="470" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="260" y="448" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">32766: from all lookup main</text>

    
    <rect x="25" y="525" width="470" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="260" y="576" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">32767: from all lookup default</text>
  </g>

  
  
  <g transform="translate(1080, 480)">
    <rect width="460" height="120" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="230" y="50" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="230" dy="0">table 101: default via</tspan>
      <tspan x="230" dy="34">10.100.1.1 dev ens2f0</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 635)">
    <rect width="460" height="90" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <rect x="25" y="25" width="40" height="40" rx="4" fill="#f5f8f5" stroke="#db8129" stroke-width="3"/>
    <path d="M 33 25 L 33 17 M 45 25 L 45 17 M 57 25 L 57 17" stroke="#db8129" stroke-width="3"/>
    <text x="85" y="45" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="85" dy="0">out ens2f0 with</tspan>
      <tspan x="85" dy="30">its own gateway</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 780)">
    <rect width="460" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="230" y="50" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="230" dy="0">main: default via</tspan>
      <tspan x="230" dy="34">10.20.0.1 dev eno1</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 935)">
    <rect width="460" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="25" y="25" width="40" height="40" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>
    <path d="M 33 25 L 33 17 M 45 25 L 45 17 M 57 25 L 57 17" stroke="#207448" stroke-width="3"/>
    <text x="85" y="45" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="85" dy="0">out eno1,</tspan>
      <tspan x="85" dy="30">the ordinary default route</tspan>
    </text>
  </g>

  
  
  <path d="M 440 545 L 525 545" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <path d="M 995 545 L 1080 545" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <path d="M 1310 600 L 1310 635" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <path d="M 440 845 L 525 845" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <path d="M 995 845 L 1080 845" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <path d="M 1310 900 L 1310 935" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <text x="800" y="1160" text-anchor="middle" font-size="24" fill="#303a36">rules can match source, destination, incoming interface, TOS, fwmark and uid; the routing cache was removed in kernel 3.6, lookups use the FIB trie</text>

  
  <g transform="translate(60, 1195)">
    <rect width="1480" height="75" rx="12" fill="#207448"/>
    <text x="740" y="47" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Same machine, same destination, two different roads, decided by who the packet says it is from</text>
  </g>
</svg>