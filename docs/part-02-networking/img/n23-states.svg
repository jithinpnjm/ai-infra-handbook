<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Conntrack states</title>
  <desc>Visual explanation of conntrack connection tracking states, showing the primary journey from NEW to ESTABLISHED and side branches for RELATED, INVALID, and UNTRACKED flows.</desc>

  <defs>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="60" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Conntrack states</text>

  
  <rect x="60" y="110" width="1480" height="330" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="95" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">A small state journey</text>

  
  <rect x="95" y="180" width="530" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="130" cy="222" r="24" fill="#207448" />
  <text x="130" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="170" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">A new visitor arrives</text>

  
  <g transform="translate(545, 198)">
    <rect x="4" y="10" width="48" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 4 22 L 28 34 L 52 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 4 L 28 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>

  
  <text x="125" y="295" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#207448">NEW</text>

  
  <text x="125" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" dy="0">first packet of a flow,</tspan>
    <tspan x="125" dy="34">no reply seen</tspan>
  </text>

  
  <text x="800" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">reply comes back</text>
  <line x1="625" y1="295" x2="975" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#green-arrow)" />

  
  <rect x="975" y="180" width="530" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="1010" cy="222" r="24" fill="#207448" />
  <text x="1010" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

  
  <g transform="translate(1425, 198)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 16 22 L 38 22 M 32 16 L 38 22 L 32 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40 34 L 18 34 M 24 28 L 18 34 L 24 40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="1005" y="295" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#207448">ESTABLISHED</text>

  
  <text x="1005" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">traffic seen in both directions</text>

  
  <rect x="60" y="470" width="1480" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="95" y="516" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Side branches</text>

  
  <rect x="95" y="545" width="450" height="335" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(465, 565)">
    <path d="M 14 14 L 14 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 14 28 C 24 28 32 20 42 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="14" cy="14" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="42" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    <circle cx="42" cy="20" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  </g>

  <text x="125" y="605" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">RELATED</text>
  <text x="125" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" dy="0">new flow related to an</tspan>
    <tspan x="125" dy="38">existing one, FTP data</tspan>
    <tspan x="125" dy="38">connection or ICMP error</tspan>
  </text>

  
  <rect x="575" y="545" width="450" height="335" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(945, 565)">
    <polygon points="28,6 52,48 4,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="41" r="2.5" fill="#db8129" />
  </g>

  <text x="605" y="605" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#db8129">INVALID</text>
  <text x="605" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="605" dy="0">violates the state machine,</tspan>
    <tspan x="605" dy="36">out-of-window TCP,</tspan>
    <tspan x="605" dy="36">unsolicited ACK;</tspan>
    <tspan x="605" dy="36" fill="#db8129" font-weight="bold">usually drop</tspan>
  </text>

  
  <rect x="1055" y="545" width="450" height="335" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1425, 565)">
    <path d="M 6 42 L 18 42 C 26 42 26 14 36 14 L 50 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 42 8 L 50 14 L 42 20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="14" y="26" width="24" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
  </g>

  <text x="1085" y="605" font-family="ui-monospace, monospace" font-size="32" font-weight="bold" fill="#207448">UNTRACKED</text>
  <text x="1085" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1085" dy="0">exempted via</tspan>
    <tspan x="1085" dy="38" font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">raw/NOTRACK</tspan>
  </text>

  
  <rect x="60" y="940" width="1480" height="80" rx="12" fill="#207448" />
  <text x="800" y="990" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">With conntrack, a rule that says allow established is enough</text>
</svg>