<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880">
  <title>Round trips: TCP plus TLS</title>
  <desc>Visual comparison of connection setup latency between TCP with TLS 1.2 and TCP with TLS 1.3</desc>

  <defs>
    <marker id="orange-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="880" fill="#f5f8f5" />

  
  <text x="70" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Round trips: TCP plus TLS</text>

  
  
  <rect x="70" y="150" width="260" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 188 198 V 186 A 12 12 0 0 1 212 186 V 198" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <rect x="182" y="198" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TCP + TLS 1.2</text>

  
  <rect x="360" y="150" width="300" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="510" y="240" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TCP 1 RTT</text>

  
  <rect x="680" y="150" width="620" height="160" rx="14" fill="#dcebe0" stroke="#207448" stroke-width="2" />
  
  <line x1="990" y1="165" x2="990" y2="295" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4" />
  <text x="990" y="240" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TLS 2 RTT</text>

  
  <rect x="1330" y="150" width="190" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="1425" y="242" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">3 RTTs</text>


  
  
  <rect x="70" y="350" width="260" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 200 380 L 218 388 V 406 C 218 420 200 430 200 430 C 200 430 182 420 182 406 V 388 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <text x="200" y="470" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">TCP + TLS 1.3</text>

  
  <rect x="360" y="350" width="300" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="510" y="440" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TCP 1 RTT</text>

  
  <rect x="680" y="350" width="300" height="160" rx="14" fill="#c8e3d1" stroke="#207448" stroke-width="2" />
  <text x="830" y="440" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">TLS 1 RTT</text>

  
  <rect x="1000" y="350" width="300" height="160" rx="14" fill="#fffbf5" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" />

  
  <rect x="1030" y="380" width="240" height="46" rx="8" fill="#db8129" />
  <text x="1150" y="412" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Saved round trip</text>

  
  <line x1="1040" y1="465" x2="1040" y2="485" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="1040" y1="475" x2="1255" y2="475" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)" />

  
  <rect x="1330" y="350" width="190" height="160" rx="14" fill="#207448" stroke="#207448" stroke-width="3" />
  <text x="1425" y="442" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">2 RTTs</text>


  
  <rect x="70" y="560" width="1450" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="120" cy="615" r="14" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 134 615 H 168 V 625 M 156 615 V 625" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="195" y="624" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">TLS 1.3 client sends its key share in the first message</text>


  
  <rect x="70" y="710" width="1450" height="100" rx="14" fill="#207448" />
  
  <rect x="110" y="742" width="48" height="34" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
  <line x1="130" y1="742" x2="130" y2="776" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" />
  
  <text x="185" y="769" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Session tickets or PSKs let a returning client skip the full handshake</text>
</svg>