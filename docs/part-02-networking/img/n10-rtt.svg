<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Round trips: TCP plus TLS</title>
  <desc>Two horizontal bars comparing connection setup cost before the first request.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#f5f8f5" />

  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Round trips: TCP plus TLS</text>

  <g id="top-bar-panel">
    <rect x="60" y="110" width="1480" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <g transform="translate(90, 142)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 26 L 18 18 C 18 12.5 22.5 8 28 8 C 33.5 8 38 12.5 38 18 L 38 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="38" r="4" fill="#207448" />
      <path d="M 28 42 L 28 48" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="165" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">TCP + TLS 1.2</text>

    <g transform="translate(450, 140)">
      <rect x="0" y="0" width="260" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <text x="130" y="85" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TCP 1 RTT</text>
    </g>

    <g transform="translate(730, 140)">
      <rect x="0" y="0" width="540" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <line x1="270" y1="15" x2="270" y2="135" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
      <text x="270" y="85" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TLS 2 RTT</text>
    </g>

    <g transform="translate(1290, 140)">
      <rect x="0" y="0" width="220" height="150" rx="12" fill="#207448" />
      <text x="110" y="85" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">= 3 RTTs</text>
    </g>
  </g>

  <g id="bottom-bar-panel">
    <rect x="60" y="370" width="1480" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <g transform="translate(90, 402)">
      <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 18 26 L 18 18 C 18 12.5 22.5 8 28 8 C 33.5 8 38 12.5 38 18 L 38 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 28 32 L 28 48 M 24 40 L 32 40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="165" y="440" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">TCP + TLS 1.3</text>

    <g transform="translate(450, 400)">
      <rect x="0" y="0" width="260" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <text x="130" y="85" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TCP 1 RTT</text>
    </g>

    <g transform="translate(730, 400)">
      <rect x="0" y="0" width="260" height="150" rx="12" fill="#207448" stroke="#165333" stroke-width="2.5" />
      <text x="130" y="85" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">TLS 1 RTT</text>
    </g>

    <g transform="translate(1010, 400)">
      <rect x="0" y="0" width="260" height="150" rx="12" fill="#fdf3e7" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6 6" />
      <line x1="25" y1="52" x2="225" y2="52" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
      <text x="130" y="105" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">saved round trip</text>
    </g>

    <g transform="translate(1290, 400)">
      <rect x="0" y="0" width="220" height="150" rx="12" fill="#207448" />
      <text x="110" y="85" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">= 2 RTTs</text>
    </g>
  </g>

  <g id="side-note-panel" transform="translate(60, 630)">
    <rect width="1480" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(30, 22)">
      <circle cx="22" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="36" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="28" x2="44" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="50" y1="28" x2="50" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="110" y="60" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">TLS 1.3 client sends its key share in the first message</text>
  </g>

  <g id="footer-panel" transform="translate(60, 760)">
    <rect width="1480" height="90" rx="14" fill="#207448" />
    <g transform="translate(30, 17)">
      <rect x="4" y="10" width="48" height="36" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5" />
      <line x1="16" y1="10" x2="16" y2="46" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" />
      <circle cx="32" cy="28" r="5" fill="#ffffff" />
    </g>
    <text x="110" y="54" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Session tickets or PSKs let a returning client skip the full handshake</text>
  </g>
</svg>