<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>AI fabric signals and alert rules</title>
  <desc>Table comparing AI fabric monitoring signals, why they matter, and alert rules across throughput, queue occupancy, drops, PFC pause frames, ECN marks, physical layer quality, and job-level metrics.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">AI fabric signals and alert rules</text>

  <rect x="40" y="98" width="1520" height="54" rx="10" fill="#207448"/>
  <line x1="560" y1="98" x2="560" y2="152" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="1010" y1="98" x2="1010" y2="152" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <text x="70" y="136" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Signal</text>
  <text x="590" y="136" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Why it matters</text>
  <text x="1040" y="136" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Alert logic</text>

  <g id="row-throughput">
    <rect x="40" y="168" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="168" x2="560" y2="286" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="168" x2="1010" y2="286" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 199)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8"/>
      <path d="M 20 38 V 18 M 14 24 L 20 18 L 26 24"/>
      <path d="M 36 18 V 38 M 30 32 L 36 38 L 42 32"/>
    </g>
    <text x="136" y="236" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">per-port throughput</text>
    <text x="1040" y="236" font-family="sans-serif" font-size="24" fill="#303a36">sustained over 85% on uplinks</text>
  </g>

  <g id="row-queue-occupancy">
    <rect x="40" y="300" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="300" x2="560" y2="418" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="300" x2="1010" y2="418" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 331)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 14 H 50 V 42 H 6"/>
      <rect x="38" y="20" width="7" height="16" rx="2" fill="#207448"/>
      <rect x="26" y="20" width="7" height="16" rx="2" fill="#207448"/>
      <line x1="14" y1="8" x2="14" y2="48" stroke="#207448" stroke-dasharray="3 3"/>
    </g>
    <text x="136" y="368" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">egress queue occupancy</text>
    <text x="1040" y="352" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1040" dy="0">high-water mark approaching</tspan>
      <tspan x="1040" dy="32">ECN/PFC thresholds</tspan>
    </text>
  </g>

  <g id="row-drops-lossless">
    <rect x="40" y="432" width="1520" height="118" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3.5"/>
    <line x1="560" y1="432" x2="560" y2="550" stroke="#f4cfab" stroke-width="1.5"/>
    <line x1="1010" y1="432" x2="1010" y2="550" stroke="#f4cfab" stroke-width="1.5"/>
    <g transform="translate(62, 463)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="24" height="18" rx="3"/>
      <path d="M 20 28 V 44 M 14 38 L 20 44 L 26 38"/>
      <line x1="36" y1="32" x2="48" y2="44"/>
      <line x1="48" y1="32" x2="36" y2="44"/>
    </g>
    <text x="136" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">drops per queue</text>
    <text x="1040" y="500" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">any drop on the lossless priority</text>
  </g>

  <g id="row-pfc-pause">
    <rect x="40" y="564" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="564" x2="560" y2="682" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="564" x2="1010" y2="682" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 595)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20"/>
      <line x1="22" y1="18" x2="22" y2="38"/>
      <line x1="34" y1="18" x2="34" y2="38"/>
      <line x1="42" y1="14" x2="48" y2="8"/>
    </g>
    <text x="136" y="616" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="136" dy="0">PFC pause frames and</tspan>
      <tspan x="136" dy="36">watchdog events</tspan>
    </text>
    <text x="1040" y="616" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1040" dy="0">pause rate above baseline,</tspan>
      <tspan x="1040" dy="32">any watchdog trigger</tspan>
    </text>
  </g>

  <g id="row-ecn-cnp">
    <rect x="40" y="696" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="696" x2="560" y2="814" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="696" x2="1010" y2="814" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 727)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="12" width="44" height="32" rx="6"/>
      <polygon points="28,18 36,24 28,30" fill="#207448"/>
      <line x1="20" y1="18" x2="20" y2="38"/>
    </g>
    <text x="136" y="764" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ECN marks and CNPs</text>
    <text x="1040" y="748" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1040" dy="0">persistent high CNP rate =</tspan>
      <tspan x="1040" dy="32">chronic congestion</tspan>
    </text>
  </g>

  <g id="row-physical-layer">
    <rect x="40" y="828" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="828" x2="560" y2="946" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="828" x2="1010" y2="946" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 859)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="24" height="28" rx="3"/>
      <path d="M 6 22 H 2 V 34 H 6"/>
      <path d="M 34 20 Q 42 12 50 20"/>
      <path d="M 34 34 Q 42 26 50 34"/>
    </g>
    <text x="136" y="866" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="136" dy="0">physical layer</tspan>
      <tspan x="136" dy="32" font-size="24" font-weight="normal">(FEC, CRC/FCS,</tspan>
      <tspan x="136" dy="28" font-size="24" font-weight="normal">optics DOM)</tspan>
    </text>
    <text x="590" y="880" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="590" dy="0">predicts failing optics</tspan>
      <tspan x="590" dy="32">before link-down</tspan>
    </text>
  </g>

  <g id="row-job-level">
    <rect x="40" y="960" width="1520" height="118" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <line x1="560" y1="960" x2="560" y2="1078" stroke="#c8dcd0" stroke-width="1.5"/>
    <line x1="1010" y1="960" x2="1010" y2="1078" stroke="#c8dcd0" stroke-width="1.5"/>
    <g transform="translate(62, 991)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="18"/>
      <line x1="28" y1="4" x2="28" y2="12"/>
      <line x1="22" y1="4" x2="34" y2="4"/>
      <line x1="28" y1="30" x2="28" y2="20"/>
      <line x1="28" y1="30" x2="36" y2="30"/>
    </g>
    <text x="136" y="998" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="136" dy="0">job-level</tspan>
      <tspan x="136" dy="32" font-size="24" font-weight="normal">(NCCL timeouts,</tspan>
      <tspan x="136" dy="28" font-size="24" font-weight="normal">step time)</tspan>
    </text>
    <text x="1040" y="1028" font-family="sans-serif" font-size="24" fill="#303a36">step time over baseline x 1.2</text>
  </g>

  <rect x="40" y="1100" width="1520" height="64" rx="10" fill="#207448"/>
  <text x="800" y="1141" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">group by rail, pod, tenant and device role, compare peers.</text>
</svg>