<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The PMTU black hole</title>
  <desc>Visual infographic explaining the Path MTU black hole phenomenon and step-down testing</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The PMTU black hole</text>

  
  <rect x="40" y="120" width="740" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <circle cx="95" cy="172" r="22" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="95,158 95,172 107,172" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  
  <text x="135" y="181" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Timeline between client and server</text>

  
  <rect x="80" y="225" width="240" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="100" y="243" width="46" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="94" y1="279" x2="152" y2="279" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="165" y="278" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client</text>

  
  <rect x="500" y="225" width="240" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="522" y="240" width="44" height="48" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="530" y1="254" x2="550" y2="254" stroke="#207448" stroke-width="3" />
  <line x1="530" y1="268" x2="550" y2="268" stroke="#207448" stroke-width="3" />
  <circle cx="558" cy="254" r="2" fill="#207448" />
  <circle cx="558" cy="268" r="2" fill="#207448" />
  <text x="585" y="278" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server</text>

  
  <line x1="200" y1="310" x2="200" y2="980" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.5" />
  <line x1="620" y1="310" x2="620" y2="980" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.5" />

  
  <circle cx="90" cy="380" r="24" fill="#207448" />
  <text x="90" y="388" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="130" y="348" width="560" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="410" y="388" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">TCP handshake succeeds (tiny packets)</text>
  <line x1="200" y1="435" x2="610" y2="435" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <circle cx="90" cy="535" r="24" fill="#207448" />
  <text x="90" y="543" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="190" y="503" width="440" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="410" y="543" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">small requests work</text>
  <line x1="200" y1="590" x2="610" y2="590" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <circle cx="90" cy="705" r="24" fill="#db8129" />
  <text x="90" y="713" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="200" y1="710" x2="400" y2="710" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
  
  <circle cx="430" cy="710" r="18" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <line x1="420" y1="700" x2="440" y2="720" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="440" y1="700" x2="420" y2="720" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="460" y1="710" x2="610" y2="710" stroke="#db8129" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />

  
  <rect x="65" y="785" width="690" height="185" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text font-family="sans-serif" font-size="24" text-anchor="middle">
    <tspan x="410" y="835" font-weight="bold" fill="#db8129">large transfer stalls: big packet dropped,</tspan>
    <tspan x="410" y="885" fill="#303a36">ICMP error blocked,</tspan>
    <tspan x="410" y="930" fill="#303a36">sender never learns the limit</tspan>
  </text>


  
  <rect x="820" y="120" width="740" height="900" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="850" y="145" width="56" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="860,163 868,171 860,179" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="874" y1="179" x2="888" y2="179" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="925" y="180" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">step-down test</text>

  
  <rect x="850" y="220" width="680" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="245" width="640" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="890" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ping -M do -s 1472 host</text>
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="890" y="348">step down 1472, 1452, 1432, 1400</tspan>
    <tspan x="890" y="392">until one passes</tspan>
  </text>

  
  <rect x="850" y="465" width="680" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="490" width="640" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="890" y="525" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">tracepath -n host</text>

  
  <rect x="850" y="595" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="620" width="640" height="125" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="890" y="662">tcpdump -ni any</tspan>
    <tspan x="890" y="708">icmp[icmptype]==3 and icmp[icmpcode]==4</tspan>
  </text>

  
  <rect x="850" y="800" width="680" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="870" y="825" width="640" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="890" y="860" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">sysctl net.ipv4.tcp_mtu_probing</text>


  
  <rect x="40" y="1050" width="1520" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 95 1068 L 118 1076 L 118 1096 C 118 1110 95 1119 95 1119 C 95 1119 72 1110 72 1096 L 72 1076 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  <text x="140" y="1103" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">seen in VPNs, GRE, IPsec, WireGuard, VXLAN, Geneve, GCP default VPC MTU 1460</text>
</svg>