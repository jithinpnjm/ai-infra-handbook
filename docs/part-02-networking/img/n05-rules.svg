<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Which table gets consulted</title>
  <desc>Infographic illustrating the Linux policy routing lookup order through rule priorities and routing tables.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 3 L 15 9 L 1 15 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which table gets consulted</text>

  
  
  <rect x="35" y="175" width="500" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(257, 195)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="12,14 22,21 12,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="285" y="295" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">0: from all lookup local</text>

  
  <rect x="35" y="465" width="500" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(257, 485)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="12,14 22,21 12,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="285" y="585" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">32766: from all lookup main</text>

  
  <rect x="35" y="755" width="500" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(257, 775)">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="12,14 22,21 12,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="285" y="875" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">32767: from all lookup default</text>

  
  <line x1="535" y1="255" x2="580" y2="255" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="535" y1="545" x2="580" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="535" y1="835" x2="580" y2="835" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  
  <rect x="580" y="140" width="510" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <path d="M580,156 A16,16 0 0,1 596,140 L1074,140 A16,16 0 0,1 1090,156 L1090,210 L580,210 Z" fill="#e8f1ea"/>
  
  <circle cx="615" cy="175" r="24" fill="#207448"/>
  <text x="615" y="184" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(650, 147)">
    <path d="M28,6 L48,14 C48,36 28,48 28,48 C28,48 8,36 8,14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M23,24 A5,5 0 0,1 33,24 L33,28 L23,28 Z M21,28 L35,28 L35,36 L21,36 Z" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="715" y="186" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">table local (255)</text>
  <text x="835" y="252" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="835" dy="0">local and broadcast addresses,</tspan>
    <tspan x="835" dy="36">kernel maintained,</tspan>
    <tspan x="835" dy="36">consulted first</tspan>
  </text>

  
  <rect x="580" y="430" width="510" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <path d="M580,446 A16,16 0 0,1 596,430 L1074,430 A16,16 0 0,1 1090,446 L1090,500 L580,500 Z" fill="#e8f1ea"/>
  
  <circle cx="615" cy="465" r="24" fill="#207448"/>
  <text x="615" y="474" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(650, 437)">
    <circle cx="28" cy="14" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="14" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="42" cy="40" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="24" y1="20" x2="18" y2="34" stroke="#207448" stroke-width="3"/>
    <line x1="32" y1="20" x2="38" y2="34" stroke="#207448" stroke-width="3"/>
    <line x1="21" y1="40" x2="35" y2="40" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="715" y="476" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">table main (254)</text>
  <text x="835" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="835" dy="0">what ip route shows,</tspan>
    <tspan x="835" dy="38">connected, static, DHCP routes</tspan>
  </text>

  
  <rect x="580" y="720" width="510" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <path d="M580,736 A16,16 0 0,1 596,720 L1074,720 A16,16 0 0,1 1090,736 L1090,790 L580,790 Z" fill="#e8f1ea"/>
  
  <circle cx="615" cy="755" r="24" fill="#207448"/>
  <text x="615" y="764" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(650, 727)">
    <path d="M8,18 L48,18 L44,46 L12,46 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="36" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,4"/>
  </g>
  <text x="715" y="766" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">table default (253)</text>
  <text x="835" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">usually empty</text>

  
  <rect x="1125" y="140" width="440" height="810" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <path d="M1125,156 A16,16 0 0,1 1141,140 L1549,140 A16,16 0 0,1 1565,156 L1565,340 L1125,340 Z" fill="#fff5ea"/>
  
  <g transform="translate(1317, 175)">
    <line x1="12" y1="6" x2="12" y2="50" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="6" x2="28" y2="50" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="6" x2="44" y2="50" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12" cy="18" r="6" fill="#db8129"/>
    <circle cx="28" cy="38" r="6" fill="#db8129"/>
    <circle cx="44" cy="24" r="6" fill="#db8129"/>
  </g>
  <text x="1345" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
    <tspan x="1345" dy="0">custom tables</tspan>
    <tspan x="1345" dy="40">(1-252, 256+)</tspan>
  </text>
  <line x1="1165" y1="365" x2="1525" y2="365" stroke="#db8129" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="1345" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1345" dy="0">one per NIC,</tspan>
    <tspan x="1345" dy="40">tenant or VRF;</tspan>
    <tspan x="1345" dy="65">a lower rule number</tspan>
    <tspan x="1345" dy="40">means higher priority,</tspan>
    <tspan x="1345" dy="65">and rules can match</tspan>
    <tspan x="1345" dy="40">the source address</tspan>
  </text>
</svg>