<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Two captures, one verdict: where did the packet go?</title>
  <desc>Visual guide comparing client and server packet captures to localize drops, middlebox resets, stripped options, and MTU black holes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two captures, one verdict: where did the packet go?</text>

  
  
  <g id="node-client">
    <rect x="40" y="96" width="380" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(60, 116)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="28" rx="3" />
      <line x1="2" y1="42" x2="54" y2="42" stroke-width="4.5" />
      <line x1="22" y1="42" x2="34" y2="42" stroke-width="3" />
      <circle cx="28" cy="20" r="4" fill="#207448" />
    </g>
    <text x="136" y="154" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">client capture</text>
  </g>

  
  <line x1="420" y1="130" x2="480" y2="130" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="480" y1="160" x2="420" y2="160" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="node-middle">
    <rect x="480" y="96" width="640" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(502, 116)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 V 28 C 50 40 28 50 28 50 C 28 50 6 40 6 28 V 14 Z" />
      <line x1="16" y1="28" x2="40" y2="28" stroke-width="3" />
      <line x1="28" y1="16" x2="28" y2="40" stroke-width="3" />
    </g>
    <text x="580" y="137" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="580" dy="0">path, firewall,</tspan>
      <tspan x="580" dy="30">NAT, load balancer</tspan>
    </text>
  </g>

  
  <line x1="1120" y1="130" x2="1180" y2="130" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <line x1="1180" y1="160" x2="1120" y2="160" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="node-server">
    <rect x="1180" y="96" width="380" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1200, 116)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="18" rx="3" />
      <circle cx="16" cy="15" r="3" fill="#207448" />
      <line x1="26" y1="15" x2="42" y2="15" stroke-width="3" />
      <rect x="6" y="30" width="44" height="18" rx="3" />
      <circle cx="16" cy="39" r="3" fill="#207448" />
      <line x1="26" y1="39" x2="42" y2="39" stroke-width="3" />
    </g>
    <text x="1276" y="154" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">server capture</text>
  </g>

  
  
  <g id="case-a">
    <rect x="40" y="216" width="720" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="65" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">a: SYN at the client and</tspan>
      <tspan x="65" dy="30" font-weight="normal">at the server, no SYN-ACK</tspan>
    </text>

    <line x1="760" y1="262" x2="840" y2="262" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <rect x="840" y="216" width="720" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="865" y="266" font-family="sans-serif" font-size="24" fill="#303a36">server firewall or a full listen queue</text>
  </g>

  
  <g id="case-b">
    <rect x="40" y="318" width="720" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="65" y="352" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">b: SYN-ACK leaves the server</tspan>
      <tspan x="65" dy="30" font-weight="normal">but never reaches the client</tspan>
    </text>

    <line x1="760" y1="364" x2="840" y2="364" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <rect x="840" y="318" width="720" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="865" y="368" font-family="sans-serif" font-size="24" fill="#303a36">return path, asymmetric route or NAT</text>
  </g>

  
  <g id="case-c">
    <rect x="40" y="420" width="720" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="65" y="454" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">c: RST reaches the client with a TTL</tspan>
      <tspan x="65" dy="30" font-weight="normal">different from the server's normal packets</tspan>
    </text>

    <line x1="760" y1="466" x2="840" y2="466" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <rect x="840" y="420" width="720" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="865" y="470" font-family="sans-serif" font-size="24" fill="#303a36">a middlebox injected it</text>
  </g>

  
  <g id="case-d">
    <rect x="40" y="522" width="720" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="65" y="570" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">d: SYN-ACK with no wscale option</text>

    <line x1="760" y1="568" x2="840" y2="568" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <rect x="840" y="522" width="720" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="865" y="556" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">a middlebox stripping options;</tspan>
      <tspan x="865" dy="30">throughput limited to 64 KB per RTT</tspan>
    </text>
  </g>

  
  <g id="case-e">
    <rect x="40" y="624" width="720" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="65" y="658" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="65" dy="0">e: full-size segments retransmitted</tspan>
      <tspan x="65" dy="30" font-weight="normal">repeatedly, no ICMP 3/4 replies</tspan>
    </text>

    <line x1="760" y1="670" x2="840" y2="670" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    <rect x="840" y="624" width="720" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="865" y="658" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">MTU black hole or a stateful device</tspan>
      <tspan x="865" dy="30">dropping the packets</tspan>
    </text>
  </g>

  
  <g id="example-pairing">
    <rect x="40" y="730" width="1520" height="130" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
    
    <rect x="40" y="730" width="12" height="130" rx="4" fill="#db8129" />
    <text x="75" y="768" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">the client capture shows a SYN-ACK arriving and the server capture shows</tspan>
      <tspan x="75" dy="32">the same SYN-ACK leaving with the same sequence numbers: the packet is gone</tspan>
      <tspan x="75" dy="32">between the two hosts, not inside the server; check route and NAT next</tspan>
    </text>
  </g>

  
  <g id="clock-note">
    <rect x="40" y="876" width="1520" height="132" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 914)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>
    <text x="145" y="914" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">if the two captures disagree on order, check clocks first, then match</tspan>
      <tspan x="145" dy="32">by sequence number or IP ID, not by time; PTP with hardware timestamps</tspan>
      <tspan x="145" dy="32">is precise, NTP is good to about a millisecond; merge with <tspan font-family="monospace">mergecap -a</tspan></tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1024" width="1520" height="64" rx="10" fill="#207448" />
    <text x="800" y="1064" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Any difference between what left A and what arrived at B points to the device between them</text>
  </g>
</svg>