<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Streaming answers: where a proxy can hold the words back</title>
  <desc>Visual explanation of token streaming through proxies showing direct passthrough, response buffering delays, and timeout failures alongside connection guidelines.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="68" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">Streaming answers: where a proxy can hold the words back</text>

  
  <g id="path-headers">
    
    <rect x="50" y="105" width="260" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <rect x="66" y="118" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="76" y="128" width="24" height="24" rx="3" fill="#207448" opacity="0.25"/>
    <line x1="77" y1="113" x2="77" y2="118" stroke="#207448" stroke-width="3"/>
    <line x1="99" y1="113" x2="99" y2="118" stroke="#207448" stroke-width="3"/>
    <line x1="77" y1="162" x2="77" y2="167" stroke="#207448" stroke-width="3"/>
    <line x1="99" y1="162" x2="99" y2="167" stroke="#207448" stroke-width="3"/>
    <text x="126" y="152" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Model server</text>

    
    <line x1="310" y1="142" x2="400" y2="142" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    
    <rect x="410" y="105" width="290" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <rect x="426" y="118" width="46" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="440" cy="140" r="4" fill="#207448"/>
    <circle cx="458" cy="140" r="4" fill="#207448"/>
    <line x1="440" y1="140" x2="458" y2="140" stroke="#207448" stroke-width="3"/>
    <text x="488" y="152" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Proxy or ingress</text>

    
    <line x1="700" y1="142" x2="770" y2="142" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    
    <rect x="780" y="105" width="240" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <rect x="796" y="118" width="46" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="796" y1="130" x2="842" y2="130" stroke="#207448" stroke-width="2.5"/>
    <line x1="812" y1="156" x2="826" y2="156" stroke="#207448" stroke-width="4"/>
    <line x1="804" y1="164" x2="834" y2="164" stroke="#207448" stroke-width="4"/>
    <text x="858" y="152" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Client</text>
  </g>

  
  
  <g id="lane-1">
    <rect x="50" y="205" width="970" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="245" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">Proxy does not buffer, read timeout raised</text>

    
    <rect x="75" y="275" width="120" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="135" cy="307" r="14" fill="#207448" opacity="0.2"/>

    
    <line x1="195" y1="307" x2="235" y2="307" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="235" y="287" width="115" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="292" y="315" font-size="24" font-weight="bold" fill="#207448" font-family="monospace" text-anchor="middle">word 1</text>
    <line x1="350" y1="307" x2="440" y2="307" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    
    <rect x="440" y="275" width="160" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="455" y1="307" x2="585" y2="307" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,4"/>

    
    <line x1="600" y1="307" x2="630" y2="307" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="630" y="287" width="115" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="687" y="315" font-size="24" font-weight="bold" fill="#207448" font-family="monospace" text-anchor="middle">word 2</text>
    <line x1="745" y1="307" x2="760" y2="307" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="760" y="287" width="115" height="40" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="817" y="315" font-size="24" font-weight="bold" fill="#207448" font-family="monospace" text-anchor="middle">word 3</text>
    <line x1="875" y1="307" x2="895" y2="307" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    
    <rect x="895" y="275" width="105" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="947" cy="307" r="14" fill="#207448" opacity="0.2"/>

    
    <polyline points="370,307 375,307 380,297 385,317 390,307 395,307" fill="none" stroke="#207448" stroke-width="2"/>

    
    <text x="75" y="390" font-size="24" fill="#303a36" font-family="sans-serif">the client sees each word as it is produced,</text>
    <text x="75" y="425" font-size="24" fill="#303a36" font-family="sans-serif">plus heartbeats between messages</text>
  </g>

  
  <g id="lane-2">
    <rect x="50" y="485" width="970" height="270" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <text x="75" y="525" font-size="30" font-weight="bold" fill="#db8129" font-family="sans-serif">Proxy buffers the response</text>

    
    <rect x="75" y="555" width="120" height="65" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
    <circle cx="135" cy="587" r="14" fill="#db8129" opacity="0.2"/>

    
    <line x1="195" y1="587" x2="430" y2="587" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

    
    <rect x="430" y="545" width="200" height="85" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <rect x="445" y="557" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
    <rect x="505" y="557" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
    <rect x="565" y="557" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
    <rect x="445" y="593" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
    <rect x="505" y="593" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>
    <rect x="565" y="593" width="50" height="26" rx="4" fill="#fff2e5" stroke="#db8129" stroke-width="1.5"/>

    
    <line x1="630" y1="587" x2="745" y2="587" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6,6"/>
    
    <circle cx="765" cy="587" r="16" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
    <line x1="758" y1="587" x2="772" y2="587" stroke="#db8129" stroke-width="3"/>

    
    <rect x="895" y="555" width="105" height="65" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
    <circle cx="947" cy="587" r="14" fill="#db8129" opacity="0.2"/>

    
    <text x="75" y="675" font-size="24" fill="#303a36" font-family="sans-serif">words pile up inside the proxy box, the client sees nothing</text>
    <text x="75" y="710" font-size="24" fill="#303a36" font-family="sans-serif">for a long time and then everything at once</text>
  </g>

  
  <g id="lane-3">
    <rect x="50" y="775" width="970" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="815" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">Proxy read timeout shorter than the generation</text>

    
    <rect x="75" y="845" width="120" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="135" cy="877" r="14" fill="#207448" opacity="0.2"/>

    
    <line x1="195" y1="877" x2="440" y2="877" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    
    <rect x="440" y="845" width="160" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="520" cy="877" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="520,865 520,877 528,877" fill="none" stroke="#207448" stroke-width="2.5"/>

    
    <line x1="600" y1="877" x2="700" y2="877" stroke="#303a36" stroke-width="2.5"/>
    <g transform="translate(720, 877)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#db8129" stroke-width="4"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#db8129" stroke-width="4"/>
    </g>
    <line x1="740" y1="877" x2="895" y2="877" stroke="#303a36" stroke-width="2.5" stroke-dasharray="4,4"/>

    
    <rect x="895" y="845" width="105" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="947" cy="877" r="14" fill="#207448" opacity="0.2"/>

    
    <text x="75" y="970" font-size="24" fill="#303a36" font-family="sans-serif">the connection is cut with</text>
    <text x="75" y="1005" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">a 504 on long generations</text>
  </g>

  
  <g id="panel-long-lived">
    <rect x="1050" y="105" width="500" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <circle cx="1090" cy="148" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="1078,148 1084,148 1088,138 1092,158 1096,148 1102,148" fill="none" stroke="#207448" stroke-width="2.5"/>

    <text x="1125" y="156" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">Long-lived connections</text>
    <line x1="1075" y1="180" x2="1525" y2="180" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <circle cx="1085" cy="216" r="6" fill="#207448"/>
    <text x="1105" y="222" font-size="24" fill="#303a36" font-family="sans-serif">WebSocket, Server-Sent Events</text>
    <text x="1105" y="254" font-size="24" fill="#303a36" font-family="sans-serif">(SSE) and token streams need care</text>

    
    <circle cx="1085" cy="304" r="6" fill="#207448"/>
    <text x="1105" y="310" font-size="24" fill="#303a36" font-family="sans-serif">proxies must not buffer the stream</text>

    
    <circle cx="1085" cy="360" r="6" fill="#207448"/>
    <text x="1105" y="366" font-size="24" fill="#303a36" font-family="sans-serif">raise their read timeouts</text>

    
    <circle cx="1085" cy="416" r="6" fill="#207448"/>
    <text x="1105" y="422" font-size="24" fill="#303a36" font-family="sans-serif">heartbeats keep the connection</text>
    <text x="1105" y="454" font-size="24" fill="#303a36" font-family="sans-serif">alive between messages</text>

    
    <circle cx="1085" cy="504" r="6" fill="#207448"/>
    <text x="1105" y="510" font-size="24" fill="#303a36" font-family="sans-serif">chunked transfer encoding or</text>
    <text x="1105" y="542" font-size="24" fill="#303a36" font-family="sans-serif">SSE for token streams</text>
  </g>

  
  <g id="panel-checklist">
    <rect x="1050" y="590" width="500" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <path d="M 1076 630 L 1092 622 L 1108 630 L 1108 646 C 1108 658 1092 666 1092 666 C 1092 666 1076 658 1076 646 Z" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="1084,644 1090,650 1100,638" fill="none" stroke="#207448" stroke-width="2.5"/>

    <text x="1125" y="642" font-size="30" font-weight="bold" fill="#207448" font-family="sans-serif">Inference checklist</text>
    <line x1="1075" y1="665" x2="1525" y2="665" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <rect x="1075" y="688" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,697 1083,702 1089,692" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="705" font-size="24" fill="#303a36" font-family="sans-serif">terminate TLS at the gateway;</text>

    
    <rect x="1075" y="744" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,753 1083,758 1089,748" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="750" font-size="24" fill="#303a36" font-family="sans-serif">keep HTTP/2 or gRPC</text>
    <text x="1105" y="780" font-size="24" fill="#303a36" font-family="sans-serif">connections warm;</text>

    
    <rect x="1075" y="818" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,827 1083,832 1089,822" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="824" font-size="24" fill="#303a36" font-family="sans-serif">align idle timeouts</text>
    <text x="1105" y="854" font-size="24" fill="#303a36" font-family="sans-serif">across the path;</text>

    
    <rect x="1075" y="892" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,901 1083,906 1089,896" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="908" font-size="24" fill="#303a36" font-family="sans-serif">generous read timeouts;</text>

    
    <rect x="1075" y="946" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,955 1083,960 1089,950" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="952" font-size="24" fill="#303a36" font-family="sans-serif">disable response buffering</text>
    <text x="1105" y="982" font-size="24" fill="#303a36" font-family="sans-serif">for streaming;</text>

    
    <rect x="1075" y="1018" width="18" height="18" rx="4" fill="#207448"/>
    <polyline points="1079,1027 1083,1032 1089,1022" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1105" y="1016" font-size="24" fill="#303a36" font-family="sans-serif">authenticate with API keys or JWT</text>
    <text x="1105" y="1046" font-size="24" fill="#303a36" font-family="sans-serif">and OIDC in addition to TLS</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="50" y="1090" width="1500" height="75" rx="12" fill="#207448"/>
    <text x="800" y="1138" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A chatbot that streams word by word looks frozen if a proxy holds the words back</text>
  </g>
</svg>