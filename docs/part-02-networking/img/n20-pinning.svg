<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Connection pinning with gRPC</title>
  <desc>Visual comparison between L4 connection pinning where multiplexed gRPC streams overload few backends while others sit idle, versus L7 per-request load balancing where requests spread evenly.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="2,4 16,9 2,14" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="2,4 16,9 2,14" fill="#db8129" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="#f5f8f5" />

  <!-- Diagram Title -->
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Connection pinning with gRPC</text>

  <!-- ==================== LEFT PANEL: L4 PER CONNECTION ==================== -->
  <g id="panel-l4">
    <!-- Panel Container -->
    <rect x="60" y="100" width="710" height="860" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Panel Title -->
    <text x="415" y="152" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="415" dy="0">L4 rule in front of gRPC port</tspan>
      <tspan x="415" dy="38">(per connection)</tspan>
    </text>

    <!-- Subtext / Description Card -->
    <rect x="85" y="212" width="660" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="415" y="252" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="415" dy="0">every client opened one long connection,</tspan>
      <tspan x="415" dy="34">so all its streams go to one backend</tspan>
    </text>

    <!-- Client 1 Node -->
    <g id="l4-client-1">
      <rect x="90" y="360" width="120" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Window / Application Icon -->
      <g transform="translate(122, 385)">
        <rect x="0" y="0" width="56" height="46" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
        <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2.5" />
        <circle cx="10" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="30" cy="7" r="2.5" fill="#207448" />
        <rect x="10" y="22" width="36" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      </g>
    </g>

    <!-- Client 2 Node -->
    <g id="l4-client-2">
      <rect x="90" y="690" width="120" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Window / Application Icon -->
      <g transform="translate(122, 715)">
        <rect x="0" y="0" width="56" height="46" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
        <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2.5" />
        <circle cx="10" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="30" cy="7" r="2.5" fill="#207448" />
        <rect x="10" y="22" width="36" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      </g>
    </g>

    <!-- L4 Balancer Node (middle) -->
    <g id="l4-lb-node">
      <rect x="290" y="506" width="200" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <!-- L4 Network Switch / Balancer Icon -->
      <g transform="translate(362, 548)">
        <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5" />
        <!-- 4 routing arrows -->
        <path d="M 12 28 L 44 28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <polyline points="20,22 12,28 20,34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="36,22 44,28 36,34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 28 12 L 28 44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <polyline points="22,20 28,12 34,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="22,36 28,44 34,36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 5 Backend Servers on the Right -->
    <!-- Server 1 (Overloaded, Orange) -->
    <g id="l4-server-1">
      <rect x="570" y="340" width="170" height="72" rx="10" fill="#fef5ed" stroke="#db8129" stroke-width="3" />
      <g transform="translate(628, 354)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#db8129" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#db8129" />
        <circle cx="16" cy="9.5" r="2.5" fill="#db8129" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#db8129" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#db8129" />
        <circle cx="16" cy="32.5" r="2.5" fill="#db8129" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 2 (Overloaded, Orange) -->
    <g id="l4-server-2">
      <rect x="570" y="440" width="170" height="72" rx="10" fill="#fef5ed" stroke="#db8129" stroke-width="3" />
      <g transform="translate(628, 454)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#db8129" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#db8129" />
        <circle cx="16" cy="9.5" r="2.5" fill="#db8129" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#db8129" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#db8129" />
        <circle cx="16" cy="32.5" r="2.5" fill="#db8129" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 3 (Idle) -->
    <g id="l4-server-3">
      <rect x="570" y="540" width="170" height="72" rx="10" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="2" stroke-dasharray="6,4" />
      <g transform="translate(628, 554)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="9.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="9.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="32.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="32.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 4 (Idle) -->
    <g id="l4-server-4">
      <rect x="570" y="640" width="170" height="72" rx="10" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="2" stroke-dasharray="6,4" />
      <g transform="translate(628, 654)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="9.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="9.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="32.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="32.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 5 (Idle) -->
    <g id="l4-server-5">
      <rect x="570" y="740" width="170" height="72" rx="10" fill="#f5f8f5" stroke="#b0c4b8" stroke-width="2" stroke-dasharray="6,4" />
      <g transform="translate(628, 754)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="9.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="9.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#b0c4b8" stroke-width="2" />
        <circle cx="8" cy="32.5" r="2.5" fill="#b0c4b8" />
        <circle cx="16" cy="32.5" r="2.5" fill="#b0c4b8" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#b0c4b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Arrows: Clients to L4 Balancer -->
    <path d="M 210,410 C 240,410 260,546 270,546 L 290,546" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <path d="M 210,740 C 240,740 260,606 270,606 L 290,606" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Arrows: L4 Balancer to Server 1 & Server 2 (Orange, Overloaded) -->
    <path d="M 490,546 C 520,546 530,376 550,376 L 570,376" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    <path d="M 490,606 C 520,606 530,476 550,476 L 570,476" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    <!-- Status Card: servers 1 and 2 are overloaded while 3 to 5 sit idle -->
    <rect x="85" y="855" width="660" height="85" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
    <text x="415" y="890" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">
      <tspan x="415" dy="0" fill="#db8129">servers 1 and 2 are overloaded</tspan>
      <tspan x="415" dy="32" fill="#303a36">while 3 to 5 sit idle</tspan>
    </text>
  </g>

  <!-- ==================== RIGHT PANEL: L7 PROXY / BALANCING ==================== -->
  <g id="panel-l7">
    <!-- Panel Container -->
    <rect x="830" y="100" width="710" height="860" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    <!-- Panel Title -->
    <text x="1185" y="152" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1185" dy="0">L7 proxy or client-side balancing</tspan>
      <tspan x="1185" dy="38">(per request)</tspan>
    </text>

    <!-- Client 1 Node -->
    <g id="l7-client-1">
      <rect x="860" y="360" width="120" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Window / Application Icon -->
      <g transform="translate(892, 385)">
        <rect x="0" y="0" width="56" height="46" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
        <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2.5" />
        <circle cx="10" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="30" cy="7" r="2.5" fill="#207448" />
        <rect x="10" y="22" width="36" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      </g>
    </g>

    <!-- Client 2 Node -->
    <g id="l7-client-2">
      <rect x="860" y="690" width="120" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <!-- Window / Application Icon -->
      <g transform="translate(892, 715)">
        <rect x="0" y="0" width="56" height="46" rx="5" fill="none" stroke="#207448" stroke-width="3.5" />
        <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="2.5" />
        <circle cx="10" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="30" cy="7" r="2.5" fill="#207448" />
        <rect x="10" y="22" width="36" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2" />
      </g>
    </g>

    <!-- L7 Proxy Node (middle) with grpc_pass -->
    <g id="l7-proxy-node">
      <rect x="1060" y="506" width="200" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <!-- Service / Gear Icon -->
      <g transform="translate(1136, 524)">
        <circle cx="24" cy="24" r="14" fill="none" stroke="#207448" stroke-width="3.5" />
        <circle cx="24" cy="24" r="6" fill="#207448" />
        <path d="M 24 4 L 24 10 M 24 38 L 24 44 M 4 24 L 10 24 M 38 24 L 44 24 M 10 10 L 14 14 M 34 34 L 38 38 M 10 38 L 14 34 M 34 14 L 38 10" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      </g>
      <!-- grpc_pass in Monospace -->
      <text x="1160" y="614" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">grpc_pass</text>
    </g>

    <!-- 5 Backend Servers on the Right -->
    <!-- Server 1 -->
    <g id="l7-server-1">
      <rect x="1340" y="340" width="170" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(1398, 354)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="9.5" r="2.5" fill="#207448" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="32.5" r="2.5" fill="#207448" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 2 -->
    <g id="l7-server-2">
      <rect x="1340" y="440" width="170" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(1398, 454)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="9.5" r="2.5" fill="#207448" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="32.5" r="2.5" fill="#207448" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 3 -->
    <g id="l7-server-3">
      <rect x="1340" y="540" width="170" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(1398, 554)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="9.5" r="2.5" fill="#207448" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="32.5" r="2.5" fill="#207448" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 4 -->
    <g id="l7-server-4">
      <rect x="1340" y="640" width="170" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(1398, 654)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="9.5" r="2.5" fill="#207448" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="32.5" r="2.5" fill="#207448" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Server 5 -->
    <g id="l7-server-5">
      <rect x="1340" y="740" width="170" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <g transform="translate(1398, 754)">
        <rect x="0" y="0" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="9.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="9.5" r="2.5" fill="#207448" />
        <line x1="28" y1="9.5" x2="46" y2="9.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
        <rect x="0" y="23" width="54" height="19" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
        <circle cx="8" cy="32.5" r="2.5" fill="#207448" />
        <circle cx="16" cy="32.5" r="2.5" fill="#207448" />
        <line x1="28" y1="32.5" x2="46" y2="32.5" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Arrows: Clients to L7 Proxy -->
    <path d="M 980,410 C 1010,410 1030,546 1040,546 L 1060,546" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <path d="M 980,740 C 1010,740 1030,606 1040,606 L 1060,606" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- Arrows: L7 Proxy to 5 Backend Servers (spread evenly) -->
    <path d="M 1260,526 C 1290,526 1300,376 1320,376 L 1340,376" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 1260,551 C 1290,551 1300,476 1320,476 L 1340,476" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="1260" y1="576" x2="1340" y2="576" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 1260,601 C 1290,601 1300,676 1320,676 L 1340,676" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 1260,626 C 1290,626 1300,776 1320,776 L 1340,776" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    <!-- Status Card: requests spread evenly -->
    <rect x="855" y="855" width="660" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1185" y="907" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">requests spread evenly</text>
  </g>

  <!-- ==================== FOOTER TAKEAWAY BAR ==================== -->
  <g id="footer-bar">
    <rect x="60" y="995" width="1480" height="65" rx="12" fill="#207448" />
    <text x="800" y="1037" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Balance per request, not per connection; avoid pure L4 for multiplexed gRPC</text>
  </g>
</svg>