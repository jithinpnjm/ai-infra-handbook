<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>DNSSEC chain of trust, and the other DNS security controls</title>
  <desc>Visual infographic explaining the DNSSEC authentication chain from root trust anchor to the answer, validating resolver behavior, and a table of DNS threats and controls.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">DNSSEC chain of trust, and the other DNS security controls</text>
  <rect x="40" y="95" width="740" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="65" y="115" width="395" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 134)">
    <circle cx="17" cy="8" r="5" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="17" y1="13" x2="17" y2="28" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="9" y1="17" x2="25" y2="17" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 5 22 C 8 32, 26 32, 29 22" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="124" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="124" dy="0">Root trust anchor</tspan>
  </text>
  <rect x="65" y="207" width="395" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 238)">
    <line x1="12" y1="5" x2="9" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="5" x2="19" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="12" x2="27" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="124" y="248" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="124" dy="0">DS record in the root</tspan>
    <tspan x="124" dy="30">for com</tspan>
  </text>
  <rect x="65" y="323" width="395" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 342)">
    <circle cx="12" cy="14" r="7" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="18" y1="18" x2="29" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="23" x2="27" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="27" y1="25" x2="30" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="124" y="368" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="124" dy="0">com zone DNSKEY</tspan>
  </text>
  <rect x="65" y="415" width="395" height="126" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 461)">
    <line x1="12" y1="5" x2="9" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="5" x2="19" y2="29" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="12" x2="27" y2="12" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="124" y="455" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="124" dy="0">DS record for</tspan>
    <tspan x="124" dy="30">example.com published</tspan>
    <tspan x="124" dy="30">by the parent</tspan>
  </text>
  <rect x="65" y="561" width="395" height="108" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 598)">
    <circle cx="12" cy="14" r="7" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="18" y1="18" x2="29" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="23" x2="27" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="27" y1="25" x2="30" y2="22" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="124" y="606" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="124" dy="0">example.com zone</tspan>
    <tspan x="124" dy="38">DNSKEY</tspan>
  </text>
  <rect x="65" y="689" width="395" height="68" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 706)">
    <circle cx="17" cy="15" r="10" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 12 25 L 14 31 L 17 28 L 20 31 L 22 25" fill="none" stroke="#207448" stroke-width="2" stroke-linejoin="round" />
    <path d="M 12 15 L 16 19 L 23 11" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="124" y="730" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="124" dy="0">RRSIG over each RRset</tspan>
  </text>
  <rect x="65" y="777" width="395" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(78, 796)">
    <rect x="5" y="3" width="24" height="28" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 10 15 L 15 20 L 24 10" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="124" y="822" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="124" dy="0">the answer</tspan>
  </text>
  <line x1="260" y1="187" x2="260" y2="207" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="260" y1="303" x2="260" y2="323" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="260" y1="395" x2="260" y2="415" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="260" y1="541" x2="260" y2="561" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="260" y1="669" x2="260" y2="689" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="260" y1="757" x2="260" y2="777" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <!-- Validating resolver side inspection bus -->
  <path d="M 460 197 L 472 197 M 460 313 L 472 313 M 460 405 L 472 405 M 460 551 L 472 551 M 460 679 L 472 679 M 460 767 L 472 767" stroke="#207448" stroke-width="2" />
  <line x1="472" y1="197" x2="472" y2="767" stroke="#207448" stroke-width="2" />
  <path d="M 472 481 L 483 481" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <g stroke="currentColor" color="#db8129">
    <rect x="485" y="435" width="270" height="92" rx="12" fill="#fff7f0" stroke-width="3" />
    <g transform="translate(502, 464)" fill="none" stroke-width="2.5">
      <path d="M 17 3 L 32 29 L 2 29 Z" stroke-linejoin="round" />
      <line x1="17" y1="13" x2="17" y2="20" stroke-linecap="round" />
      <circle cx="17" cy="24" r="1.5" fill="currentColor" stroke="none" />
    </g>
  </g>
  <text x="548" y="473" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="548" dy="0">SERVFAIL on</tspan>
    <tspan x="548" dy="28">failure</tspan>
  </text>
  <path d="M 472 767 L 483 767" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="485" y="745" width="270" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(502, 774)">
    <path d="M 17 3 L 30 8 L 30 18 C 30 25 17 30 17 30 C 17 30 4 25 4 18 L 4 8 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 10 16 L 15 20 L 24 11" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="548" y="783" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="548" dy="0">ad flag on</tspan>
    <tspan x="548" dy="28">verified answers</tspan>
  </text>
  <rect x="65" y="872" width="690" height="176" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(85, 940)">
    <circle cx="18" cy="18" r="14" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="18" y1="16" x2="18" y2="25" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="18" cy="11" r="2" fill="#207448" />
  </g>
  <text x="135" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">DNSSEC does not encrypt anything;</tspan>
    <tspan x="135" dy="26">expired signatures or DS and key mismatches</tspan>
    <tspan x="135" dy="26">during a rollover cause outages for validating</tspan>
    <tspan x="135" dy="26">users; automate signing and rollovers</tspan>
  </text>
  <rect x="820" y="95" width="740" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(845, 112)">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="0" y1="14" x2="40" y2="14" stroke="#207448" stroke-width="2" />
    <line x1="14" y1="14" x2="14" y2="40" stroke="#207448" stroke-width="2" />
  </g>
  <text x="898" y="142" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Threat to control</text>
  <rect x="845" y="160" width="252" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="160" width="428" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="200" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Forged answers,</tspan>
    <tspan x="865" dy="26">cache poisoning</tspan>
  </text>
  <text x="1125" y="200" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">DNSSEC, source-port and</tspan>
    <tspan x="1125" dy="26">query-ID randomisation</tspan>
  </text>
  <rect x="845" y="256" width="252" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="256" width="428" height="114" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="296" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Open resolvers,</tspan>
    <tspan x="865" dy="26">amplification</tspan>
    <tspan x="865" dy="26">DDoS</tspan>
  </text>
  <text x="1125" y="309" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">restrict recursion to your own</tspan>
    <tspan x="1125" dy="26">networks, rate-limit responses</tspan>
  </text>
  <rect x="845" y="378" width="252" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="378" width="428" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="418" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">DNS tunnelling</tspan>
    <tspan x="865" dy="26">exfiltrating data</tspan>
  </text>
  <text x="1125" y="418" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">monitor volume, long labels</tspan>
    <tspan x="1125" dy="26">and TXT records</tspan>
  </text>
  <rect x="845" y="474" width="252" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="474" width="428" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="527" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Dangling CNAMEs</tspan>
  </text>
  <text x="1125" y="514" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">subdomain takeover,</tspan>
    <tspan x="1125" dy="26">clean up records</tspan>
  </text>
  <rect x="845" y="570" width="252" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="570" width="428" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="611" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">DNS rebinding</tspan>
  </text>
  <text x="1125" y="611" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">filter private answers</tspan>
  </text>
  <rect x="845" y="642" width="252" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="642" width="428" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="721" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Zone data</tspan>
  </text>
  <text x="1125" y="682" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">restrict AXFR to secondaries and</tspan>
    <tspan x="1125" dy="26">authenticate with TSIG; keep</tspan>
    <tspan x="1125" dy="26">authoritative and recursive roles</tspan>
    <tspan x="1125" dy="26">on separate servers</tspan>
  </text>
  <rect x="845" y="790" width="252" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="1107" y="790" width="428" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="865" y="856" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="865" dy="0">Untrusted</tspan>
    <tspan x="865" dy="26">network hop</tspan>
  </text>
  <text x="1125" y="830" font-family="sans-serif" font-size="24" font-weight="normal" fill="#303a36">
    <tspan x="1125" dy="0">DoT over TCP/853 and DoH over</tspan>
    <tspan x="1125" dy="26">HTTPS encrypt the stub to resolver</tspan>
    <tspan x="1125" dy="26">hop; mostly unnecessary inside</tspan>
    <tspan x="1125" dy="26">a data centre</tspan>
  </text>
  <rect x="845" y="938" width="690" height="88" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
  <g transform="translate(865, 965)">
    <path d="M 17 3 L 30 8 L 30 18 C 30 25 17 30 17 30 C 17 30 4 25 4 18 L 4 8 Z" fill="none" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="915" y="977" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="915" dy="0">RPZ response policy zones or</tspan>
    <tspan x="915" dy="26">provider threat-blocking</tspan>
  </text>
  <rect x="40" y="1100" width="1520" height="62" rx="10" fill="#207448" />
  <text x="800" y="1140" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Restrict who can use each resolver before you open it to a network</text>
</svg>