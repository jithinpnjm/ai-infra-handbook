    <circle cx="25" cy="42" r="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="48" cy="18" r="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 25 38 C 25 26 48 34 48 22" fill="none" stroke="#207448" stroke-width="3" />
    <text x="130" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">route</text>
  </g>
  <line x1="255" y1="426" x2="255" y2="444" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(60, 444)">
    <rect width="390" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="20" y="17" width="16" height="26" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 36 30 L 44 30 M 41 26 L 45 30 L 41 34" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="51" cy="30" r="3" fill="#207448" />
    <text x="130" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">ARP</text>
  </g>
  <line x1="255" y1="504" x2="255" y2="522" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(60, 522)">
    <rect width="390" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="24" cy="30" r="4" fill="#207448" />
    <path d="M 31 23 A 10 10 0 0 1 31 37 M 37 17 A 18 18 0 0 1 37 43" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
