<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Two ways to find the broken layer: bottom up, or bisect from the middle</title>
  <desc>Visual comparison between bottom-up layer testing and bisection troubleshooting methods.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Two ways to find the broken layer:</tspan>
    <tspan x="800" dy="54">bottom up, or bisect from the middle</tspan>
  </text>

  
  <rect x="40" y="135" width="630" height="905" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="355" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Test bottom up</text>

  
  
  <g transform="translate(60, 210)">
    <rect width="390" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 24 35 L 34 25 M 31 22 L 37 16 C 41 12 47 12 51 16 C 55 20 55 26 51 30 L 45 36 M 27 24 L 21 30 C 17 34 17 40 21 44 C 25 48 31 48 35 44 L 41 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="130" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">link</text>
  </g>
  <line x1="255" y1="270" x2="255" y2="288" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(60, 288)">
    <rect width="390" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="20" y="16" width="34" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="30" cy="26" r="3" fill="#207448" />
    <line x1="25" y1="36" x2="48" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
