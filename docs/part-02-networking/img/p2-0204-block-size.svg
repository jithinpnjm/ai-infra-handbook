<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Block size finds the network: 77 falls in the 64 block for a /27</title>
  <desc>Infographic explaining how block size locates the network, broadcast, and usable host range for an IP address octet.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Block size finds the network:</tspan>
    <tspan x="800" dy="54">77 falls in the 64 block for a /27</tspan>
  </text>

  
  <g transform="translate(60, 160)">
    <rect width="540" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 80 182 h 24 v 24 h -24 z M 86 176 v 6 M 98 176 v 6 M 86 206 v 6 M 98 206 v 6 M 74 188 h 6 M 74 200 h 6 M 104 188 h 6 M 104 200 h 6" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <text x="126" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">block size = 256 - 224 = 32</text>
  </g>

  
  <g transform="translate(404, 246)">
    <rect width="250" height="58" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="529" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">host octet 77</text>
  </g>

  
  <line x1="529" y1="304" x2="529" y2="506" stroke="#db8129" stroke-width="3" />
  <polygon points="529,520 522,504 536,504" fill="#db8129" />

  
  <g transform="translate(40, 368)">
    <rect width="410" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="70" cy="398" r="7" fill="none" stroke="#207448" stroke-width="2.5" />
    <circle cx="56" cy="410" r="5" fill="none" stroke="#207448" stroke-width="2" />
    <circle cx="84" cy="410" r="5" fill="none" stroke="#207448" stroke-width="2" />
    <line x1="65" y1="403" x2="60" y2="406" stroke="#207448" stroke-width="2" />
    <line x1="75" y1="403" x2="80" y2="406" stroke="#207448" stroke-width="2" />
    <text x="100" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">network 192.168.10.64</text>
  </g>
  
  <path d="M 450 398 H 460 V 506" fill="none" stroke="#207448" stroke-width="2.5" />
  <polygon points="460,520 454,506 466,506" fill="#207448" />

  
  <g transform="translate(650, 368)">
    <rect width="560" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 680 414 l 6 -24 l 6 24 M 683 404 h 6 M 675 394 a 14 14 0 0 1 22 0 M 671 388 a 20 20 0 0 1 30 0" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <text x="715" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">broadcast 192.168.10.95 = 96 - 1</text>
  </g>
  
  <path d="M 650 398 H 625 V 506" fill="none" stroke="#207448" stroke-width="2.5" />
  <polygon points="625,520 619,506 631,506" fill="#207448" />

  
  
  <rect x="120" y="520" width="1360" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="460" y="520" width="170" height="60" fill="#bce1c7" stroke="#207448" stroke-width="3" />
  <text x="545" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">64 block</text>

  
  <line x1="529" y1="520" x2="529" y2="538" stroke="#db8129" stroke-width="3" />

  
  <line x1="120" y1="520" x2="120" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="290" y1="520" x2="290" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="460" y1="520" x2="460" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="630" y1="520" x2="630" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="800" y1="520" x2="800" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="970" y1="520" x2="970" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="1140" y1="520" x2="1140" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="1310" y1="520" x2="1310" y2="595" stroke="#207448" stroke-width="3" />
  <line x1="1480" y1="520" x2="1480" y2="595" stroke="#207448" stroke-width="3" />

  
  <text x="120" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">0</text>
  <text x="290" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">32</text>
  <text x="460" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">64</text>
  <text x="630" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">96</text>
  <text x="800" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">128</text>
  <text x="970" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">160</text>
  <text x="1140" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">192</text>
  <text x="1310" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">224</text>
  <text x="1480" y="622" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">255</text>

  
  <path d="M 465 642 V 662 H 545 V 678 V 662 H 620 V 642" fill="none" stroke="#207448" stroke-width="2.5" />

  
  <g transform="translate(260, 684)">
    <rect width="570" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="545" y="728" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="545" dy="0">usable 192.168.10.65 to .94,</tspan>
      <tspan x="545" dy="36">which gives 30 hosts</tspan>
    </text>
  </g>

  
  <g transform="translate(80, 860)">
    <rect width="1440" height="70" rx="12" fill="#207448" />
    
    <circle cx="120" cy="895" r="16" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 112 895 l 6 6 l 10 -12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="800" y="904" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The network is the largest multiple of the block size at or below the host octet.</text>
  </g>
</svg>