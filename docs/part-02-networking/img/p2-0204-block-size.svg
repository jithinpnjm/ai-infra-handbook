<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Block size finds the network: 77 falls in the 64 block for a /27</title>
  <desc>Visual demonstration of how subnet block size 32 identifies the network 192.168.10.64 for host IP octet 77 on a /27 subnet mask.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Block size finds the network: 77 falls in the 64 block for a /27</text>

  
  <g id="step-box">
    <rect x="70" y="105" width="480" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 96 130 h 20 v 20 h -20 z M 106 130 v 20 M 96 140 h 20" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <text x="330" y="150" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">block size = 256 - 224 = 32</text>
  </g>

  

  
  <g id="network-callout">
    <path d="M 550 515 L 550 315 L 500 315" fill="none" stroke="#207448" stroke-width="2.5" />
    <polygon points="550,520 544,505 556,505" fill="#207448" />
    <rect x="290" y="235" width="420" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="500" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">network 192.168.10.64</text>
  </g>

  
  <g id="broadcast-callout">
    <path d="M 1034 515 L 1034 315 L 1100 315" fill="none" stroke="#207448" stroke-width="2.5" />
    <polygon points="1034,520 1028,505 1040,505" fill="#207448" />
    <rect x="940" y="235" width="530" height="72" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1205" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">broadcast 192.168.10.95 = 96 - 1</text>
  </g>

  
  <g id="host-octet-callout">
    <line x1="753" y1="416" x2="753" y2="520" stroke="#db8129" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="753" cy="542" r="10" fill="#db8129" stroke="#ffffff" stroke-width="2.5" />
    <rect x="630" y="348" width="246" height="68" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="3" />
    <text x="753" y="391" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">host octet 77</text>
  </g>

  
  <rect x="120" y="524" width="1220" height="36" rx="6" fill="#e8f1ea" stroke="#9dbbb0" stroke-width="2" />

  
  <line x1="1340" y1="542" x2="1480" y2="542" stroke="#9dbbb0" stroke-width="4" stroke-dasharray="8,8" />

  
  <rect x="550" y="520" width="500" height="44" rx="6" fill="#cde6d5" stroke="#207448" stroke-width="3" />
  <text x="910" y="552" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">64 block</text>

  
  
  <line x1="150" y1="514" x2="150" y2="570" stroke="#62756d" stroke-width="2.5" />
  <text x="150" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">0</text>

  
  <line x1="350" y1="514" x2="350" y2="570" stroke="#62756d" stroke-width="2.5" />
  <text x="350" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">32</text>

  
  <line x1="550" y1="508" x2="550" y2="576" stroke="#207448" stroke-width="3.5" />
  <text x="550" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">64</text>

  
  <line x1="1050" y1="508" x2="1050" y2="576" stroke="#207448" stroke-width="3.5" />
  <text x="1050" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">96</text>

  
  <line x1="1250" y1="514" x2="1250" y2="570" stroke="#62756d" stroke-width="2.5" />
  <text x="1250" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">128</text>

  
  <text x="1410" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#62756d">and so on</text>

  
  <g id="usable-range-callout">
    
    <path d="M 566 648 L 566 675 L 800 675 L 800 706 L 800 675 L 1034 675 L 1034 648" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="800,714 794,702 806,702" fill="#207448" />

    <rect x="420" y="714" width="760" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">usable 192.168.10.65 to .94, which gives 30 hosts</text>
  </g>

  
  <g id="takeaway-banner">
    <rect x="70" y="845" width="1460" height="82" rx="10" fill="#207448" />
    <text x="800" y="896" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The network is the largest multiple of the block size at or below the host octet.</text>
  </g>
</svg>