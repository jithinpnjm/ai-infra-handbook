<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Refused and timed out look alike, but the handshake shows the difference</title>
  <desc>Visual comparison of TCP three-way handshake and connection failure modes: Connection refused via RST versus Connection timed out via firewall drop.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Refused and timed out look alike,</tspan>
    <tspan x="800" dy="55">but the handshake shows the difference</tspan>
  </text>

  
  <rect x="40" y="160" width="1520" height="420" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="70" y="202" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Three-way handshake</text>

  
  <rect x="100" y="220" width="340" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="118" y="232" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="118" y1="246" x2="164" y2="246" stroke="#207448" stroke-width="3" />
  <polyline points="128,255 134,261 128,267" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="138" y1="267" x2="152" y2="267" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="180" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Client (curl)</text>

  
  <rect x="1160" y="220" width="340" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="1178" y="232" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1178" y1="250" x2="1224" y2="250" stroke="#207448" stroke-width="3" />
  <circle cx="1192" cy="241" r="3" fill="#207448" />
  <circle cx="1192" cy="259" r="3" fill="#207448" />
  <line x1="1204" y1="259" x2="1216" y2="259" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="1240" y="265" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Server (port 443)</text>

  
  <line x1="270" y1="290" x2="270" y2="550" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="1330" y1="290" x2="1330" y2="550" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

  
  <circle cx="310" cy="340" r="24" fill="#207448" />
  <text x="310" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <line x1="334" y1="340" x2="1320" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="350" y="325" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">SYN: sequence number, MSS, window scale, SACK, timestamps</text>

  
  <circle cx="1290" cy="425" r="24" fill="#207448" />
  <text x="1290" y="433" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <line x1="1266" y1="425" x2="280" y2="425" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="350" y="410" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">SYN-ACK: server sequence number and its options</text>

  
  <circle cx="310" cy="510" r="24" fill="#207448" />
  <text x="310" y="518" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <line x1="334" y1="510" x2="1320" y2="510" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="350" y="495" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">ACK: both sides ESTABLISHED</text>

  
  <text x="40" y="630" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">When the SYN does not get a clean answer</text>

  
  <rect x="40" y="655" width="740" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(70, 755)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="12" y1="12" x2="44" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="44" y1="12" x2="12" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="150" y="725" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="150" dy="0" font-weight="bold">No listener on the port:</tspan>
    <tspan x="150" dy="48">server replies RST at once,</tspan>
    <tspan x="150" dy="48">client sees Connection refused</tspan>
  </text>

  
  <rect x="820" y="655" width="740" height="270" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(850, 755)">
    <path d="M 28 4 L 52 14 L 52 32 C 52 46 28 54 28 54 C 28 54 4 46 4 32 L 4 14 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="18" x2="28" y2="34" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="42" r="2.5" fill="#db8129" />
  </g>
  <text x="930" y="725" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan x="930" dy="0" font-weight="bold">Firewall drops the SYN:</tspan>
    <tspan x="930" dy="48">no answer, retries after 1 s, 2 s and 4 s,</tspan>
    <tspan x="930" dy="48">then Connection timed out</tspan>
  </text>

  
  <rect x="40" y="960" width="1520" height="80" rx="12" fill="#207448" />
  
  <g transform="translate(70, 972)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#ffffff" stroke-width="4" />
    <polyline points="28,16 28,28 38,34" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="140" y="1010" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">time_connect is about one round trip when the handshake works.</text>
</svg>