<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Debug pod-to-pod traffic in eight checks, from the pod's own routes out to the capture</title>
  <desc>Visual ladder showing eight sequential troubleshooting steps for Kubernetes pod-to-pod network connectivity issues, from local pod routing out to full packet capture.</desc>

  <defs>
    
    <marker id="arrow-grey" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#687771" />
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-side" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 1 1 L 9 6 L 1 11 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1360" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Debug pod-to-pod traffic in eight checks,</text>
  <text x="800" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">from the pod's own routes out to the capture</text>

  
  <g id="top-problem">
    <rect x="520" y="146" width="460" height="48" rx="24" fill="#e2e7e4" stroke="#8a9993" stroke-width="2" />
    <text x="750" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#586762">Pod A cannot reach pod B</text>
  </g>

  
  <line x1="750" y1="194" x2="750" y2="231" stroke="#687771" stroke-width="3" marker-end="url(#arrow-grey)" />

  

  
  <g id="step-1">
    <rect x="100" y="235" width="1020" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="277" r="24" fill="#207448" />
    <text x="150" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(196, 255)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="38" height="42" rx="4" />
      <line x1="8" y1="12" x2="30" y2="12" />
      <line x1="8" y1="21" x2="22" y2="21" />
      <line x1="8" y1="30" x2="26" y2="30" />
    </g>

    
    <text x="255" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Both pods have IPs and routes: <tspan font-family="monospace" font-size="24" font-weight="normal">ip route in each namespace</tspan></text>
  </g>

  
  <g id="side-note">
    
    <line x1="1120" y1="277" x2="1156" y2="277" stroke="#207448" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-side)" />
    <rect x="1160" y="235" width="410" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1365" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">nsenter -t PID -n ip route</text>
  </g>

  
  <line x1="610" y1="320" x2="610" y2="346" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-2">
    <rect x="100" y="350" width="1020" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="397" r="24" fill="#207448" />
    <text x="150" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(196, 375)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="36" height="20" rx="3" />
      <circle cx="10" cy="12" r="2" fill="#207448" />
      <circle cx="20" cy="12" r="2" fill="#207448" />
      <circle cx="30" cy="12" r="2" fill="#207448" />
      <path d="M 20 22 L 20 40 M 8 40 L 32 40" />
    </g>

    <text x="255" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">Pod A reaches its gateway and the host:</tspan>
      <tspan x="255" dy="32">ARP resolves, veth and host-side interface are up</tspan>
    </text>
  </g>

  
  <line x1="610" y1="445" x2="610" y2="471" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-3">
    <rect x="100" y="475" width="1020" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="522" r="24" fill="#207448" />
    <text x="150" y="531" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(196, 500)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="22" r="18" />
      <path d="M 12 22 L 28 22 M 22 16 L 28 22 L 22 28" />
    </g>

    <text x="255" y="513" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">Node forwarding:</tspan>
      <tspan x="255" dy="32">ip_forward, rp_filter, bridge-nf-call-iptables</tspan>
    </text>
  </g>

  
  <line x1="610" y1="570" x2="610" y2="596" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-4">
    <rect x="100" y="600" width="1020" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="652" r="24" fill="#207448" />
    <text x="150" y="661" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(196, 630)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="14" height="34" rx="2" />
      <rect x="26" y="4" width="14" height="34" rx="2" />
      <path d="M 16 14 L 26 14 M 16 28 L 26 28" stroke-dasharray="2,3" />
    </g>

    <text x="255" y="642" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">Cross-node path: route or tunnel to node B, underlay ping,</tspan>
      <tspan x="255" dy="32">MTU, UDP 8472 or 4789, BGP TCP 179</tspan>
    </text>
  </g>

  
  <line x1="610" y1="705" x2="610" y2="731" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-5">
    <rect x="100" y="735" width="1020" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="782" r="24" fill="#207448" />
    <text x="150" y="791" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    
    <g transform="translate(196, 760)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 4 L 5 10 L 5 24 C 5 34 20 42 20 42 C 20 42 35 34 35 24 L 35 10 Z" />
      <line x1="20" y1="14" x2="20" y2="28" />
      <line x1="13" y1="21" x2="27" y2="21" />
    </g>

    <text x="255" y="773" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">NetworkPolicy and iptables:</tspan>
      <tspan x="255" dy="32">counters and conntrack -L</tspan>
    </text>
  </g>

  
  <line x1="610" y1="830" x2="610" y2="856" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-6">
    <rect x="100" y="860" width="1020" height="95" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="907" r="24" fill="#207448" />
    <text x="150" y="916" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    
    <g transform="translate(196, 885)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="22" r="17" />
      <circle cx="20" cy="22" r="7" />
      <line x1="20" y1="5" x2="20" y2="10" />
      <line x1="20" y1="34" x2="20" y2="39" />
      <line x1="5" y1="22" x2="10" y2="22" />
      <line x1="34" y1="22" x2="39" y2="22" />
    </g>

    <text x="255" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">Destination listens on the right address:</tspan>
      <tspan x="255" dy="32">ss -tulpn inside pod B</tspan>
    </text>
  </g>

  
  <line x1="610" y1="955" x2="610" y2="981" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-7">
    <rect x="100" y="985" width="1020" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="150" cy="1027" r="24" fill="#207448" />
    <text x="150" y="1036" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
    
    
    <g transform="translate(196, 1006)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 8 C 12 4 20 6 20 6 C 20 6 28 4 36 8 L 36 36 C 28 32 20 34 20 34 C 20 34 12 32 4 36 Z" />
      <line x1="20" y1="6" x2="20" y2="34" />
    </g>

    <text x="255" y="1036" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Names involved: check DNS</text>
  </g>

  
  <line x1="610" y1="1070" x2="610" y2="1096" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-8">
    <rect x="100" y="1100" width="1020" height="105" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />
    <circle cx="150" cy="1152" r="24" fill="#db8129" />
    <text x="150" y="1161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">8</text>
    
    
    <g transform="translate(196, 1130)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="16" r="13" />
      <line x1="26" y1="26" x2="38" y2="38" stroke-width="4" />
      <path d="M 10 16 L 14 20 L 22 12" />
    </g>

    <text x="255" y="1142" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan font-weight="bold">Capture on the veth of A, the uplink of node 1,</tspan>
      <tspan x="255" dy="32" font-weight="bold">the uplink of node 2 and the veth of B</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="100" y="1245" width="1020" height="70" rx="12" fill="#207448" />
    <text x="610" y="1289" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Each check removes one layer from the suspect list.</text>
  </g>

</svg>