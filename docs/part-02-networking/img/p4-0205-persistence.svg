<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Ephemeral Kernel FIB vs Persistent Network Managers</title>
  <desc>Visual comparison contrasting persistent disk configuration files with ephemeral Linux kernel Forwarding Information Base memory.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
    
    
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="0" dy="3" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Ephemeral Kernel FIB vs Persistent Network Managers</text>

  
  
  
  <g transform="translate(60, 90)">
    
    <rect width="1480" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(40, 24)">
      
      <path d="M 0 12 C 0 5 16 0 36 0 C 56 0 72 5 72 12 L 72 38 C 72 45 56 50 36 50 C 16 50 0 45 0 38 Z" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 12 C 0 19 16 24 36 24 C 56 24 72 19 72 12" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 25 C 0 32 16 37 36 37 C 56 37 72 32 72 25" fill="none" stroke="#207448" stroke-width="3" />
      <text x="96" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32px" font-weight="bold" fill="#207448">Disk Configuration Files</text>
    </g>

    
    <g transform="translate(40, 85)" filter="url(#soft-shadow)">
      <rect width="440" height="155" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
      
      <path d="M 28 24 L 52 24 L 64 36 L 64 64 L 28 64 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <path d="M 52 24 L 52 36 L 64 36" fill="none" stroke="#207448" stroke-width="3" />
      <text x="80" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Netplan YAML</text>
      
      <rect x="24" y="80" width="392" height="52" rx="6" fill="#f0f5f1" />
      <text x="40" y="114" font-family="ui-monospace, monospace" font-size="24px" fill="#207448">/etc/netplan/60-routes.yaml</text>
    </g>

    
    <g transform="translate(520, 85)" filter="url(#soft-shadow)">
      <rect width="440" height="155" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
      
      <circle cx="46" cy="44" r="16" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 46 20 L 46 28 M 46 60 L 46 68 M 22 44 L 30 44 M 62 44 L 70 44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <text x="80" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">NetworkManager keyfiles</text>
      
      <rect x="24" y="74" width="392" height="64" rx="6" fill="#f0f5f1" />
      <text x="36" y="100" font-family="ui-monospace, monospace" font-size="24px" fill="#207448">/etc/NetworkManager/</text>
      <text x="36" y="128" font-family="ui-monospace, monospace" font-size="24px" fill="#207448">system-connections/</text>
    </g>

    
    <g transform="translate(1000, 85)" filter="url(#soft-shadow)">
      <rect width="440" height="155" rx="10" fill="#ffffff" stroke="#c0d4c4" stroke-width="1.5" />
      
      <path d="M 28 26 L 64 26 L 64 62 L 28 62 Z" fill="none" stroke="#207448" stroke-width="3" rx="4" />
      <path d="M 36 36 L 56 36 M 36 46 L 48 46 M 36 54 L 52 54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <text x="80" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">systemd-networkd INI</text>
      
      <rect x="24" y="74" width="392" height="64" rx="6" fill="#f0f5f1" />
      <text x="40" y="100" font-family="ui-monospace, monospace" font-size="24px" fill="#207448">/etc/systemd/network/</text>
      <text x="40" y="128" font-family="ui-monospace, monospace" font-size="24px" fill="#207448">*.network</text>
    </g>
  </g>

  
  
  

  
  <g transform="translate(100, 410)">
    
    <rect width="610" height="110" rx="12" fill="#fff8f2" stroke="#db8129" stroke-width="2" filter="url(#soft-shadow)" />
    
    <path d="M 24 35 L 42 55 L 24 75" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 48 75 L 70 75" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    
    <text x="88" y="64" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#303a36">ip route add 10.30.0.0/16 via 10.20.0.254</text>

    
    <g transform="translate(110, 130)">
      <rect x="0" y="0" width="390" height="52" rx="26" fill="#fff1e5" stroke="#db8129" stroke-width="2" />
      
      <path d="M 30 38 L 44 14 L 58 38 Z" fill="none" stroke="#db8129" stroke-width="2.5" stroke-linejoin="round" />
      <line x1="44" y1="24" x2="44" y2="30" stroke="#db8129" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="44" cy="34" r="1.5" fill="#db8129" />
      <text x="72" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">Lost on reboot or link restart</text>
    </g>
  </g>

  
  <path d="M 405 605 L 405 770" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-orange)" />

  
  
  <path d="M 1220 360 L 1220 445" fill="none" stroke="#207448" stroke-width="4" />
  
  
  <g transform="translate(860, 420)">
    <rect width="640" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#soft-shadow)" />
    <text x="320" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448">persistent daemons re-applying routes on boot from disk</text>
  </g>

  <path d="M 1220 472 L 1220 520" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(870, 525)" filter="url(#soft-shadow)">
    <rect width="620" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="28" y="32" width="48" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="38" y1="46" x2="38" y2="64" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="40" x2="50" y2="64" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="62" y1="46" x2="62" y2="64" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="96" y="68" font-family="ui-monospace, monospace" font-size="26px" font-weight="bold" fill="#207448">Netlink AF_NETLINK (RTM_NEWROUTE)</text>
  </g>

  
  <path d="M 1220 635 L 1220 770" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />


  
  
  
  <g transform="translate(60, 780)">
    
    <rect width="1480" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(40, 24)">
      
      <rect x="0" y="6" width="60" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="0" x2="12" y2="6" stroke="#207448" stroke-width="3" />
      <line x1="30" y1="0" x2="30" y2="6" stroke="#207448" stroke-width="3" />
      <line x1="48" y1="0" x2="48" y2="6" stroke="#207448" stroke-width="3" />
      <line x1="12" y1="48" x2="12" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="30" y1="48" x2="30" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="48" y1="48" x2="48" y2="54" stroke="#207448" stroke-width="3" />
      <circle cx="30" cy="27" r="7" fill="none" stroke="#207448" stroke-width="2.5" />
      <text x="84" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32px" font-weight="bold" fill="#207448">Linux Kernel RAM</text>
    </g>

    
    <g transform="translate(40, 85)" filter="url(#soft-shadow)">
      <rect width="1400" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(36, 44)">
        <circle cx="20" cy="20" r="14" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="64" cy="52" r="12" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="64" cy="-12" r="12" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 32 14 L 54 -4 M 32 26 L 54 44" stroke="#207448" stroke-width="3" />
      </g>

      
      <text x="140" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">Forwarding Information Base (FIB) containing active routes</text>
    </g>
  </g>

</svg>