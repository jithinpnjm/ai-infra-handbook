<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Path MTU discovery: a too-big packet is dropped, and the ICMP reply sets a smaller size</title>
  <desc>Visual explanation of Path MTU Discovery (PMTUD) sequence across Sender, Router, and Receiver.</desc>

  <defs>
    
    <marker id="arrow-right" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448"/>
    </marker>

    
    <marker id="arrow-left" viewBox="0 0 16 16" refX="1" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 16 2 L 0 8 L 16 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Path MTU discovery: a too-big packet is dropped,</tspan>
    <tspan x="800" dy="56">and the ICMP reply sets a smaller size</tspan>
  </text>

  
  <rect x="40" y="170" width="360" height="690" rx="12" fill="#e8f1ea"/>
  <rect x="620" y="170" width="360" height="690" rx="12" fill="#e8f1ea"/>
  <rect x="1200" y="170" width="360" height="690" rx="12" fill="#e8f1ea"/>

  
  <line x1="220" y1="310" x2="220" y2="850" stroke="#a0b8a5" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="800" y1="310" x2="800" y2="850" stroke="#a0b8a5" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="1380" y1="310" x2="1380" y2="850" stroke="#a0b8a5" stroke-width="3" stroke-dasharray="8 8"/>

  
  <rect x="55" y="180" width="330" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <rect x="195" y="194" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="205" y1="205" x2="225" y2="205" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="216" x2="225" y2="216" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="235" cy="205" r="2.5" fill="#207448"/>
  <circle cx="235" cy="216" r="2.5" fill="#207448"/>
  <text x="220" y="264" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="220" dy="0">Sender</tspan>
    <tspan x="220" dy="34">(TCP, DF set)</tspan>
  </text>

  
  <rect x="635" y="180" width="330" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <circle cx="800" cy="211" r="20" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M789 206 L811 206 M806 201 L811 206 L806 211" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M811 216 L789 216 M794 211 L789 216 L794 221" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="264" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">Router with</tspan>
    <tspan x="800" dy="34">smaller MTU</tspan>
  </text>

  
  <rect x="1215" y="180" width="330" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <rect x="1355" y="194" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="1365" y1="205" x2="1385" y2="205" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="1365" y1="216" x2="1385" y2="216" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1395" cy="205" r="2.5" fill="#207448"/>
  <circle cx="1395" cy="216" r="2.5" fill="#207448"/>
  <text x="1380" y="280" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Receiver</text>

  
  <rect x="370" y="325" width="340" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="540" y="354" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">large packet, DF set</text>
  <line x1="305" y1="375" x2="785" y2="375" stroke="#207448" stroke-width="4" marker-end="url(#arrow-right)"/>
  <circle cx="270" cy="375" r="24" fill="#207448"/>
  <text x="270" y="384" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <rect x="520" y="430" width="560" height="95" rx="8" fill="#ffffff" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="565" cy="477" r="24" fill="#207448"/>
  <text x="565" y="486" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <circle cx="630" cy="477" r="24" fill="#fdeeed" stroke="#d32f2f" stroke-width="4"/>
  <line x1="616" y1="463" x2="644" y2="491" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <line x1="644" y1="463" x2="616" y2="491" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <text x="675" y="465" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="675" dy="0">Too big for the next link:</tspan>
    <tspan x="675" dy="30">drops the packet</tspan>
  </text>

  
  <rect x="250" y="555" width="510" height="60" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="505" y="580" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="505" dy="0">ICMP Fragmentation Needed</tspan>
    <tspan x="505" dy="26">(type 3, code 4) with next-hop MTU</tspan>
  </text>
  <line x1="720" y1="625" x2="235" y2="625" stroke="#207448" stroke-width="4" marker-end="url(#arrow-left)"/>
  <circle cx="755" cy="625" r="24" fill="#207448"/>
  <text x="755" y="634" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <rect x="25" y="675" width="415" height="85" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <circle cx="65" cy="717" r="24" fill="#207448"/>
  <text x="65" y="726" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="105" y="707" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="105" dy="0">Lowers the path MTU and</tspan>
    <tspan x="105" dy="28">sends smaller segments</tspan>
  </text>

  
  <rect x="610" y="776" width="380" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="805" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">smaller packets get through</text>
  <line x1="305" y1="825" x2="1365" y2="825" stroke="#207448" stroke-width="4" marker-end="url(#arrow-right)"/>
  <circle cx="270" cy="825" r="24" fill="#207448"/>
  <text x="270" y="834" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  
  <rect x="40" y="885" width="1520" height="92" rx="8" fill="#eef1ef" stroke="#8a9990" stroke-width="2"/>
  
  <path d="M 80 913 L 102 951 L 58 951 Z" fill="#ffffff" stroke="#7a8a82" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="80" y1="926" x2="80" y2="938" stroke="#7a8a82" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="80" cy="945" r="2" fill="#7a8a82"/>
  <text x="125" y="922" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="125" dy="0">PMTU black hole: if this ICMP is blocked,</tspan>
    <tspan x="125" dy="32">large transfers stall while small requests still work.</tspan>
  </text>

  
  <rect x="40" y="1000" width="1520" height="80" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="60" y="1012" width="520" height="56" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="320" y="1049" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">ping -M do -s 1472 target</text>
  <text x="630" y="1048" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">tests a 1500-byte path</text>
</svg>