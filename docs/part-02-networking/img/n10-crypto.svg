<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>What each crypto building block does</title>
  <desc>Infographic explaining six cryptographic building blocks: symmetric encryption, key exchange, public-key signatures, hashes, HMAC, and key derivation with their jobs and examples.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">What each crypto building block does</text>

  
  <g>
    <rect x="50" y="110" width="1500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 91 163 V 155 A 12 12 0 0 1 115 155 V 163"/>
      <rect x="85" y="163" width="36" height="26" rx="6"/>
      <circle cx="103" cy="173" r="3"/>
      <path d="M 103 176 V 182"/>
    </g>
    
    <text x="145" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Symmetric encryption</text>
    
    <rect x="550" y="126" width="470" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">fast bulk confidentiality</text>
    
    <rect x="1040" y="126" width="490" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="167" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">
      <tspan x="1285" dy="0">AES-128/256-GCM,</tspan>
      <tspan x="1285" dy="32">ChaCha20-Poly1305</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="260" width="1500" height="185" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="93" cy="296" r="6"/>
      <path d="M 99 296 H 123 M 115 296 V 302 M 121 296 V 302"/>
      <circle cx="117" cy="320" r="6"/>
      <path d="M 111 320 H 87 M 95 320 V 314 M 89 320 V 314"/>
    </g>
    
    <text x="145" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Key exchange</text>
    
    <rect x="550" y="268" width="470" height="92" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="303" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="785" dy="0">agree a shared secret</tspan>
      <tspan x="785" dy="32">over an insecure channel</tspan>
    </text>
    
    <rect x="1040" y="268" width="490" height="92" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="323" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">(EC)DHE X25519, P-256</text>
    
    <rect x="200" y="372" width="1200" height="60" rx="10" fill="#fff7ef" stroke="#db8129" stroke-width="2"/>
    <text x="800" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">ephemeral keys give forward secrecy</text>
  </g>

  
  <g>
    <rect x="50" y="460" width="1500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 87 498 H 111 L 123 510 V 542 H 87 Z"/>
      <path d="M 111 498 V 510 H 123"/>
      <path d="M 94 528 C 98 522 103 534 108 526 L 115 530"/>
    </g>
    
    <text x="145" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Public-key signatures</text>
    
    <rect x="550" y="476" width="470" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="785" dy="0">prove possession of</tspan>
      <tspan x="785" dy="32">a private key</tspan>
    </text>
    
    <rect x="1040" y="476" width="490" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="536" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">RSA, ECDSA, Ed25519</text>
  </g>

  
  <g>
    <rect x="50" y="610" width="1500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 99 655 L 93 699"/>
      <path d="M 113 655 L 107 699"/>
      <path d="M 87 668 H 121"/>
      <path d="M 85 686 H 119"/>
    </g>
    
    <text x="145" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Hashes</text>
    
    <rect x="550" y="626" width="470" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="686" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">fixed-size fingerprint</text>
    
    <rect x="1040" y="626" width="490" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="686" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">SHA-256, SHA-384</text>
  </g>

  
  <g>
    <rect x="50" y="760" width="1500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 103 800 L 121 808 V 824 C 121 836 103 844 103 844 C 103 844 85 836 85 824 V 808 Z"/>
      <circle cx="103" cy="818" r="3"/>
      <path d="M 103 821 V 830 M 103 826 H 107"/>
    </g>
    
    <text x="145" y="837" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">HMAC</text>
    
    <rect x="550" y="776" width="470" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="825" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="785" dy="0">authenticate with</tspan>
      <tspan x="785" dy="32">a shared key</tspan>
    </text>
    
    <rect x="1040" y="776" width="490" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="836" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">HMAC-SHA256</text>
  </g>

  
  <g>
    <rect x="50" y="910" width="1500" height="135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="92" cy="977" r="6"/>
      <path d="M 98 977 H 108"/>
      <path d="M 108 977 C 114 977 114 964 120 964"/>
      <path d="M 108 977 C 114 977 114 990 120 990"/>
      <circle cx="123" cy="964" r="2.5" fill="#207448"/>
      <circle cx="123" cy="990" r="2.5" fill="#207448"/>
    </g>
    
    <text x="145" y="987" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#207448">Key derivation</text>
    
    <rect x="550" y="926" width="470" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="785" y="986" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">secrets into session keys</text>
    
    <rect x="1040" y="926" width="490" height="103" rx="10" fill="#ffffff" stroke="#c4dcc8" stroke-width="1.5"/>
    <text x="1285" y="986" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="24px" fill="#303a36">HKDF</text>
  </g>

  
  <g>
    <rect x="50" y="1065" width="1500" height="90" rx="16" fill="#207448"/>
    <text x="800" y="1122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">No single tool does everything; TLS combines them</text>
  </g>
</svg>