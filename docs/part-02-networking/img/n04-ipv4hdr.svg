<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>The IPv4 header</title>
  <desc>Visual diagram of the 32-bit-wide IPv4 packet header structure with four columns of 8 bits and annotated side notes.</desc>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <g id="header-group">
    
    <rect x="70" y="44" width="56" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <line x1="70" y1="64" x2="126" y2="64" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="44" x2="88" y2="64" stroke="#207448" stroke-width="3"/>
    <line x1="108" y1="44" x2="108" y2="64" stroke="#207448" stroke-width="3"/>
    <line x1="84" y1="80" x2="112" y2="80" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="146" y="88" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The IPv4 header</text>
  </g>

  
  <g id="grid-group">
    
    <rect x="70" y="140" width="1080" height="660" rx="8" fill="none" stroke="#207448" stroke-width="4"/>

    
    
    <rect x="70" y="140" width="142" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="141" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Version</text>

    
    <rect x="212" y="140" width="128" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="276" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">IHL</text>

    
    <rect x="340" y="140" width="180" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="430" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">DSCP</text>

    
    <rect x="520" y="140" width="90" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="565" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">ECN</text>

    
    <rect x="610" y="140" width="540" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="880" y="203" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Total Length</text>

    
    
    <rect x="70" y="250" width="540" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="340" y="313" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Identification</text>

    
    <rect x="610" y="250" width="120" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="670" y="313" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Flags</text>

    
    <rect x="730" y="250" width="420" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="940" y="313" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Fragment Offset</text>

    
    
    <rect x="70" y="360" width="270" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="205" y="423" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">TTL</text>

    
    <rect x="340" y="360" width="270" height="110" fill="#fdf3e7" stroke="#db8129" stroke-width="4"/>
    <text x="475" y="423" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">Protocol</text>

    
    <rect x="610" y="360" width="540" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="880" y="423" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Header Checksum</text>

    
    <rect x="70" y="470" width="1080" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="610" y="533" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Source Address</text>

    
    <rect x="70" y="580" width="1080" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="610" y="643" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Destination Address</text>

    
    <rect x="70" y="690" width="1080" height="110" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="610" y="753" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Options (rare)</text>
  </g>

  
  <g id="side-notes-group">
    
    <rect x="1190" y="140" width="350" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="1208" y="165" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1218" y1="165" x2="1218" y2="177" stroke="#207448" stroke-width="3"/>
    <line x1="1230" y1="165" x2="1230" y2="183" stroke="#207448" stroke-width="3"/>
    <line x1="1242" y1="165" x2="1242" y2="177" stroke="#207448" stroke-width="3"/>
    <text x="1268" y="196" font-family="sans-serif" font-size="24" fill="#303a36">IHL 5 = 20 bytes</text>

    
    <rect x="1190" y="250" width="350" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <line x1="1218" y1="168" x2="1218" y2="216" stroke="#207448" stroke-width="4" stroke-linecap="round" transform="translate(0, 107)"/>
    <path d="M 1218 276 L 1248 288 L 1218 300 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="1268" y="306" font-family="sans-serif" font-size="24" fill="#303a36">Flags: DF and MF</text>

    
    <rect x="1190" y="360" width="350" height="95" rx="8" fill="#fdf3e7" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 1230 380 L 1248 388 C 1248 406 1230 420 1230 420 C 1230 420 1212 406 1212 388 Z" fill="#fdf3e7" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="1230" cy="397" r="3" fill="#db8129"/>
    <line x1="1230" y1="400" x2="1230" y2="408" stroke="#db8129" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1268" y="416" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">6 = TCP</text>

    
    <rect x="1190" y="475" width="350" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1230" cy="535" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="1230,522 1230,535 1242,535" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1268" y="525" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1268" dy="0">TTL drops by one</tspan>
      <tspan x="1268" dy="32">at each router</tspan>
    </text>
  </g>
</svg>