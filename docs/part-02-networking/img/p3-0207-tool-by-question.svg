<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Pick the probe by the question when ping and traceroute are blocked</title>
  <desc>A two-column decision guide mapping diagnostic network questions to specific probing tools when ICMP is blocked, with an orange ladder showing progression from port reachability to full stack verification.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Pick the probe by the question</tspan>
    <tspan x="800" dy="54">when ping and traceroute are blocked</tspan>
  </text>

  
  
  <rect x="35" y="130" width="205" height="55" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="137" y="167" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#db8129">full stack</text>

  
  <rect x="35" y="1030" width="205" height="72" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="137" y="1060" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="137" dy="0">port</tspan>
    <tspan x="137" dy="28">reachability</tspan>
  </text>

  
  <line x1="85" y1="195" x2="85" y2="1020" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="195" x2="190" y2="1020" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>

  
  <line x1="85" y1="240" x2="190" y2="240" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="366" x2="190" y2="366" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="507" x2="190" y2="507" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="623" x2="190" y2="623" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="739" x2="190" y2="739" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="855" x2="190" y2="855" stroke="#db8129" stroke-width="3.5"/>
  <line x1="85" y1="971" x2="190" y2="971" stroke="#db8129" stroke-width="3.5"/>

  
  <path d="M 137,202 L 123,222 L 131,222 L 131,232 L 143,232 L 143,222 L 151,222 Z" fill="#db8129"/>
  <polyline points="127,310 137,298 147,310" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="127,440 137,428 147,440" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="127,570 137,558 147,570" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="127,685 137,673 147,685" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="127,800 137,788 147,800" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="127,915 137,903 147,915" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  

  
  <g>
    
    <rect x="270" y="130" width="550" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="286" y="163" width="44" height="44" rx="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="286" y1="175" x2="330" y2="175" stroke="#207448" stroke-width="3"/>
    <circle cx="295" cy="169" r="2" fill="#207448"/>
    <circle cx="303" cy="169" r="2" fill="#207448"/>
    <line x1="295" y1="188" x2="321" y2="188" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="295" y1="197" x2="313" y2="197" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="345" y="176" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="345" dy="0">Does the whole stack work:</tspan>
      <tspan x="345" dy="30">DNS, TCP, TLS, HTTP?</tspan>
    </text>

    
    <rect x="840" y="130" width="730" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">curl -v --connect-timeout 3 https://host/</text>
  </g>

  
  <g>
    
    <rect x="270" y="251" width="550" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 288,290 L 328,290 L 328,312 C 328,324 308,330 308,330 C 308,330 288,324 288,312 Z" stroke="#207448" stroke-width="3.5" fill="none"/>
    <path d="M 298,308 L 308,318 L 322,298" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="345" y="291" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="345" dy="0">Where does the path stop</tspan>
      <tspan x="345" dy="28">through a firewall that</tspan>
      <tspan x="345" dy="28">blocks ICMP?</tspan>
    </text>

    
    <rect x="840" y="251" width="730" height="115" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">traceroute -T -p 443 or mtr -T -P 443</text>
  </g>

  
  <g>
    
    <rect x="270" y="377" width="550" height="130" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <line x1="292" y1="464" x2="292" y2="422" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 292,424 L 324,436 L 292,448 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
    <circle cx="316" cy="458" r="5" stroke="#207448" stroke-width="3" fill="none"/>
    
    <text x="345" y="421" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="345" dy="0">Does a TCP port answer,</tspan>
      <tspan x="345" dy="30">bypassing ICMP blocks?</tspan>
      <tspan x="345" dy="30">(SYN probes with RTT and flags)</tspan>
    </text>

    
    <rect x="840" y="377" width="730" height="130" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="407" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="865" dy="0">sudo hping3 -S -p 443 -c 5 host, or</tspan>
      <tspan x="865" dy="28">sudo nping --tcp -p 443 --flags syn host</tspan>
      <tspan x="865" dy="28">(use only on networks you own or</tspan>
      <tspan x="865" dy="28">are authorised to test)</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="270" y="518" width="550" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="290" y="555" width="36" height="28" rx="5" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="300" y1="547" x2="300" y2="555" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="316" y1="547" x2="316" y2="555" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="308" y1="583" x2="308" y2="593" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="345" y="579" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Is the port open, TCP or UDP?</text>

    
    <rect x="840" y="518" width="730" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="579" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">nc -zv host 22 443; nc -zvu host 53</text>
  </g>

  
  <g>
    
    <rect x="270" y="634" width="550" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="308" cy="672" r="6" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="308" y1="678" x2="308" y2="692" stroke="#207448" stroke-width="3"/>
    <line x1="294" y1="692" x2="322" y2="692" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="294" y1="692" x2="294" y2="698" stroke="#207448" stroke-width="3"/>
    <line x1="308" y1="692" x2="308" y2="698" stroke="#207448" stroke-width="3"/>
    <line x1="322" y1="692" x2="322" y2="698" stroke="#207448" stroke-width="3"/>
    <circle cx="294" cy="703" r="5" stroke="#207448" stroke-width="3" fill="none"/>
    <circle cx="308" cy="703" r="5" stroke="#207448" stroke-width="3" fill="none"/>
    <circle cx="322" cy="703" r="5" stroke="#207448" stroke-width="3" fill="none"/>
    
    <text x="345" y="695" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Which nodes in a range answer?</text>

    
    <rect x="840" y="634" width="730" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="695" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">fping -c3 -g 10.0.0.0/24</text>
  </g>

  
  <g>
    
    <rect x="270" y="750" width="550" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="288" y="792" width="18" height="20" rx="3" stroke="#207448" stroke-width="3.5" fill="none"/>
    <rect x="310" y="792" width="18" height="20" rx="3" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="297" y1="802" x2="310" y2="802" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="297" y1="783" x2="297" y2="792" stroke="#207448" stroke-width="3"/>
    <line x1="319" y1="783" x2="319" y2="792" stroke="#207448" stroke-width="3"/>
    
    <text x="345" y="796" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="345" dy="0">Is the neighbour reachable</tspan>
      <tspan x="345" dy="30">at layer 2?</tspan>
    </text>

    
    <rect x="840" y="750" width="730" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="811" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">arping -I eth0 10.0.0.5</text>
  </g>

  
  <g>
    
    <rect x="270" y="866" width="550" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <line x1="286" y1="918" x2="330" y2="918" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="308" cy="903" r="8" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="308" y1="911" x2="308" y2="928" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="296,932 308,924 320,932" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="345" y="912" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="345" dy="0">What ICMP is crossing</tspan>
      <tspan x="345" dy="30">the wire?</tspan>
    </text>

    
    <rect x="840" y="866" width="730" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="927" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">sudo tcpdump -ni any icmp or icmp6</text>
  </g>

  
  <g>
    
    <rect x="270" y="982" width="550" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 288,1050 A 20,20 0 1,1 328,1050 Z" stroke="#207448" stroke-width="3.5" fill="none"/>
    <line x1="308" y1="1050" x2="320" y2="1038" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="308" cy="1050" r="3" fill="#207448"/>
    
    <text x="345" y="1051" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36">What do the ICMP counters say?</text>

    
    <rect x="840" y="982" width="730" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="865" y="1022" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="865" dy="0">ip -s -s neigh; nstat -az |</tspan>
      <tspan x="865" dy="30">grep -i icmp (InDestUnreachs,</tspan>
      <tspan x="865" dy="30">OutTimeExcds, InEchoReps)</tspan>
    </text>
  </g>

  
  <rect x="40" y="1122" width="1520" height="58" rx="8" fill="#207448"/>
  <text x="800" y="1159" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Pick the tool that matches the question you need answered, and keep probing to networks you control</text>
</svg>