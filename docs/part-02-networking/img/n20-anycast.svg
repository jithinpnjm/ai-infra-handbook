<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Scaling the L4 tier with ECMP and anycast</title>
  <desc>Visual infographic showing how ECMP and anycast VIP scale the L4 tier with sub-second BFD failover and Maglev consistent hashing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Scaling the L4 tier with ECMP and anycast</text>

  
  <rect x="60" y="130" width="620" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="105" cy="175" r="24" fill="#207448"/>
  <text x="105" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="145" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 1</text>
  
  
  <g transform="translate(618, 175)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="4" fill="#207448"/>
    <line x1="-22" y1="0" x2="-14" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="22" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-22" x2="0" y2="-14" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="22" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <line x1="90" y1="220" x2="650" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2"/>

  
  <text x="90" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">each L4 node announces the VIP</tspan>
    <tspan x="90" dy="36">over BGP (FRR, BIRD or ExaBGP);</tspan>
    <tspan x="90" dy="36">the router sees N equal-cost</tspan>
    <tspan x="90" dy="36">next hops and spreads flows</tspan>
    <tspan x="90" dy="36">by 5-tuple hash</tspan>
  </text>

  
  <rect x="920" y="130" width="620" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="965" cy="175" r="24" fill="#207448"/>
  <text x="965" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="1005" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 2</text>

  
  <g transform="translate(1478, 175)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="-12" x2="0" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-24" x2="0" y2="-20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <line x1="950" y1="220" x2="1510" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2"/>

  
  <text x="950" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="950" dy="0">a node fails or drains, BGP session</tspan>
    <tspan x="950" dy="36">drops (BFD under a second), router</tspan>
    <tspan x="950" dy="36">removes it, its flows are remapped</tspan>
  </text>

  
  <rect x="950" y="380" width="560" height="135" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="2.5"/>
  <g transform="translate(982, 422)">
    <path d="M 0 35 L 20 0 L 40 35 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="20" y1="12" x2="20" y2="24" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="29" r="1.5" fill="#db8129"/>
  </g>
  <text x="1040" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1040" dy="0">plain modulo hashing</tspan>
    <tspan x="1040" dy="34">may rehash all flows</tspan>
  </text>

  
  <rect x="700" y="500" width="200" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g transform="translate(800, 550)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#207448"/>
  </g>
  <text x="800" y="628" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">VIP</text>

  
  <rect x="920" y="670" width="620" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="965" cy="715" r="24" fill="#207448"/>
  <text x="965" y="723" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1005" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 3</text>

  
  <g transform="translate(1478, 715)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="0" cy="-20" r="3.5" fill="#207448"/>
    <circle cx="20" cy="0" r="3.5" fill="#207448"/>
    <circle cx="0" cy="20" r="3.5" fill="#207448"/>
    <circle cx="-20" cy="0" r="3.5" fill="#207448"/>
    <circle cx="14" cy="-14" r="2.5" fill="#207448"/>
    <circle cx="14" cy="14" r="2.5" fill="#207448"/>
    <circle cx="-14" cy="14" r="2.5" fill="#207448"/>
    <circle cx="-14" cy="-14" r="2.5" fill="#207448"/>
  </g>

  <line x1="950" y1="760" x2="1510" y2="760" stroke="#207448" stroke-opacity="0.25" stroke-width="2"/>

  
  <text x="950" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="950" dy="0">surviving nodes get flows they hold</tspan>
    <tspan x="950" dy="36">no state for, so L4 balancers use</tspan>
    <tspan x="950" dy="36">Maglev-style consistent hashing</tspan>
    <tspan x="950" dy="36">on the 5-tuple</tspan>
  </text>

  
  <rect x="60" y="670" width="620" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="105" cy="715" r="24" fill="#207448"/>
  <text x="105" y="723" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="145" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 4</text>

  
  <g transform="translate(618, 715)">
    <rect x="-22" y="-18" width="44" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="-14" cy="-10.5" r="2" fill="#207448"/>
    <rect x="-22" y="3" width="44" height="15" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="-14" cy="10.5" r="2" fill="#207448"/>
  </g>

  <line x1="90" y1="760" x2="650" y2="760" stroke="#207448" stroke-opacity="0.25" stroke-width="2"/>

  
  <text x="90" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">L4 node forwards to backend by</tspan>
    <tspan x="90" dy="38">DSR, encapsulation, or proxying</tspan>
  </text>

  
  
  <line x1="680" y1="240" x2="914" y2="240" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  
  <line x1="1230" y1="550" x2="1230" y2="664" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  
  <line x1="920" y1="840" x2="686" y2="840" stroke="#207448" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  
  <rect x="60" y="1060" width="1480" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Decide your failover budget first: BGP convergence sets how fast traffic moves</text>
</svg>