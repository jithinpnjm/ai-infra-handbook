<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>What happens when a pod starts: CNI ADD</title>
  <desc>Visual infographic explaining the four steps of CNI ADD when a pod starts, from pod sandbox creation to runtime configuration, plugin execution with IPAM, and teardown chaining.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="800" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">What happens when a pod starts: CNI ADD</text>

  
  <rect x="50" y="150" width="330" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="120" cy="220" r="24" fill="#207448"/>
  <text x="120" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="200" y="192" width="56" height="56" rx="8"/>
    <path d="M 212 208 L 244 208"/>
    <path d="M 212 220 L 244 220"/>
    <path d="M 212 232 L 244 232"/>
  </g>

  
  <text x="74" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="74" dy="0"><tspan font-family="ui-monospace, monospace">containerd</tspan> or</tspan>
    <tspan x="74" dy="38"><tspan font-family="ui-monospace, monospace">CRI-O</tspan> creates the</tspan>
    <tspan x="74" dy="38">pod sandbox: a</tspan>
    <tspan x="74" dy="38">network namespace,</tspan>
    <tspan x="74" dy="38">usually held by the</tspan>
    <tspan x="74" dy="38"><tspan font-family="ui-monospace, monospace">pause</tspan> container</tspan>
  </text>

  
  <line x1="380" y1="220" x2="438" y2="220" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="440" y="150" width="330" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="510" cy="220" r="24" fill="#207448"/>
  <text x="510" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 590 194 L 622 194 L 638 210 L 638 246 L 590 246 Z"/>
    <path d="M 622 194 L 622 210 L 638 210"/>
    <path d="M 602 222 L 626 222"/>
    <path d="M 602 234 L 620 234"/>
  </g>

  
  <text x="464" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="464" dy="0">runtime reads</tspan>
    <tspan x="464" dy="38" font-family="ui-monospace, monospace">/etc/cni/net.d/</tspan>
    <tspan x="464" dy="38" font-family="ui-monospace, monospace">*.conflist</tspan>
    <tspan x="464" dy="38">and runs the plugin</tspan>
    <tspan x="464" dy="38">from</tspan>
    <tspan x="464" dy="38" font-family="ui-monospace, monospace">/opt/cni/bin/</tspan>
    <tspan x="464" dy="38">with</tspan>
    <tspan x="464" dy="38" font-family="ui-monospace, monospace">CNI_COMMAND=ADD</tspan>
  </text>

  
  <line x1="770" y1="220" x2="828" y2="220" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="830" y="150" width="330" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="900" cy="220" r="24" fill="#207448"/>
  <text x="900" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="990" cy="206" r="10"/>
    <circle cx="1024" cy="234" r="10"/>
    <path d="M 997 213 L 1017 227"/>
    <path d="M 978 234 L 990 234"/>
    <path d="M 1024 206 L 1036 206"/>
  </g>

  
  <text x="854" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="854" dy="0">plugin creates a</tspan>
    <tspan x="854" dy="38"><tspan font-family="ui-monospace, monospace">veth</tspan> or <tspan font-family="ui-monospace, monospace">macvlan</tspan>,</tspan>
    <tspan x="854" dy="38">moves one end into</tspan>
    <tspan x="854" dy="38">the namespace,</tspan>
  </text>

  
  <rect x="846" y="480" width="298" height="230" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3.5"/>

  
  <text x="862" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="862" dy="0">calls an IPAM</tspan>
    <tspan x="862" dy="38">plugin for an</tspan>
    <tspan x="862" dy="38">address</tspan>
    <tspan x="862" dy="38" font-family="ui-monospace, monospace">(host-local, dhcp)</tspan>
  </text>

  
  <line x1="1160" y1="220" x2="1218" y2="220" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1220" y="150" width="330" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <circle cx="1290" cy="220" r="24" fill="#207448"/>
  <text x="1290" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1362" y="200" width="26" height="18" rx="8" transform="rotate(-30 1375 209)"/>
    <rect x="1382" y="212" width="26" height="18" rx="8" transform="rotate(-30 1395 221)"/>
    <circle cx="1406" cy="198" r="4" fill="#207448"/>
  </g>

  
  <text x="1244" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1244" dy="0">on pod delete the</tspan>
    <tspan x="1244" dy="38">runtime calls <tspan font-family="ui-monospace, monospace">DEL</tspan>;</tspan>
    <tspan x="1244" dy="38"><tspan font-family="ui-monospace, monospace">.conflist</tspan> chains</tspan>
    <tspan x="1244" dy="38">plugins in order:</tspan>
    <tspan x="1244" dy="38" font-family="ui-monospace, monospace">bridge, portmap,</tspan>
    <tspan x="1244" dy="38" font-family="ui-monospace, monospace">bandwidth, tuning</tspan>
  </text>
</svg>