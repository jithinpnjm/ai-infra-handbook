<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Finding and fixing a PMTU black hole: the step-down test and the order of fixes</title>
  <desc>Visual infographic explaining PMTU black hole symptoms, the step-down ping test, detection commands, ordered fixes, and common failure points.</desc>

  <style>
    text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      fill: #303a36;
    }
    .mono {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Monaco, monospace;
    }
  </style>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Finding and fixing a PMTU black hole:</tspan>
    <tspan x="800" dy="52">the step-down test and the order of fixes</tspan>
  </text>

  
  <rect x="40" y="135" width="460" height="850" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="56" y="155" width="428" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="185" width="48" height="42" rx="4"/>
    <path d="M74 199 h48"/>
    <path d="M82 214 l6 -6 -6 -6"/>
    <path d="M94 214 h10"/>
  </g>
  <text x="138" y="193" font-size="24">
    <tspan x="138" dy="0">ssh connects but</tspan>
    <tspan x="138" dy="30">hangs after</tspan>
    <tspan x="138" dy="30" class="mono">SSH2_MSG_KEXINIT</tspan>
  </text>

  
  <rect x="56" y="285" width="428" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="76" y="330" width="44" height="34" rx="4"/>
    <path d="M84 330 v-12 a14 14 0 0 1 28 0 v12"/>
    <circle cx="98" cy="347" r="3" fill="#207448"/>
  </g>
  <text x="138" y="331" font-size="24">
    <tspan x="138" dy="0">curl https hangs</tspan>
    <tspan x="138" dy="30">after Connected</tspan>
  </text>

  
  <rect x="56" y="405" width="428" height="105" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="435" width="48" height="42" rx="4"/>
    <path d="M74 449 h48"/>
    <rect x="80" y="455" width="18" height="16" fill="#207448" stroke="none"/>
    <path d="M104 457 h12 M104 465 h8"/>
  </g>
  <text x="138" y="451" font-size="24">
    <tspan x="138" dy="0">a website loads</tspan>
    <tspan x="138" dy="30">only partly</tspan>
  </text>

  
  <rect x="56" y="525" width="428" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="84" cy="552" r="5"/>
    <circle cx="84" cy="590" r="5"/>
    <circle cx="110" cy="564" r="5"/>
    <path d="M84 557 v28 M84 576 a14 14 0 0 1 14 -12 h7"/>
  </g>
  <text x="138" y="582" font-size="24">
    <tspan x="138" dy="0">git clone stalls</tspan>
  </text>

  
  <rect x="56" y="635" width="428" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="74" y="675" width="48" height="36" rx="4"/>
    <path d="M80 693 h8 l5 -12 7 24 5 -12 h9"/>
  </g>
  <text x="138" y="675" font-size="24">
    <tspan x="138" dy="0">a small ping works while</tspan>
    <tspan x="138" dy="30" class="mono">ping -s 1472 -M</tspan>
    <tspan x="138" dy="30" class="mono">do fails</tspan>
  </text>

  
  <rect x="56" y="780" width="428" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M78 830 v60 h40 v-46 l-14 -14 h-26 z"/>
    <path d="M104 830 v14 h14"/>
    <circle cx="98" cy="870" r="8"/>
    <path d="M98 878 l-4 8 M98 878 l4 8"/>
  </g>
  <text x="138" y="818" font-size="24">
    <tspan x="138" dy="0">TLS handshakes with</tspan>
    <tspan x="138" dy="30">big certificates (the</tspan>
    <tspan x="138" dy="30">ServerHello flight) and</tspan>
    <tspan x="138" dy="30">scp of big files hang</tspan>
  </text>

  
  <rect x="530" y="135" width="480" height="850" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="550" y="155" width="440" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="570" y="191" font-size="24" class="mono">ping -M do -s 1472</text>

  
  <rect x="580" y="220" width="410" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="600" y="254" font-size="24" font-weight="bold" class="mono">1452</text>

  
  <rect x="610" y="280" width="380" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="630" y="314" font-size="24" font-weight="bold" class="mono">1432</text>

  
  <rect x="640" y="340" width="350" height="110" rx="8" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <text x="660" y="375" font-size="30" font-weight="bold" fill="#db8129" class="mono">1400</text>
  <text x="660" y="410" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="660" dy="0">largest that passes:</tspan>
    <tspan x="660" dy="28">the doorway width</tspan>
  </text>

  
  <rect x="550" y="465" width="440" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="572" cy="495" r="5"/>
    <circle cx="588" cy="525" r="5"/>
    <circle cx="604" cy="495" r="5"/>
    <path d="M576 499 l8 22 M592 521 l8 -22"/>
  </g>
  <text x="622" y="498" font-size="24">
    <tspan x="622" dy="0" class="mono">tracepath -n host</tspan>
    <tspan x="622" dy="28">shows pmtu per hop</tspan>
  </text>

  
  <rect x="550" y="565" width="440" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="586" cy="610" r="18"/>
    <path d="M586 596 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#207448"/>
  </g>
  <text x="622" y="598" font-size="24">
    <tspan x="622" dy="0" class="mono">ip route get host</tspan>
    <tspan x="622" dy="28">shows a cached PMTU</tspan>
  </text>

  
  <rect x="550" y="665" width="440" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="582" cy="695" r="13"/>
    <path d="M592 705 l12 12"/>
    <path d="M576 695 h12"/>
  </g>
  <text x="616" y="700" font-size="24">
    <tspan x="616" dy="0" class="mono">tcpdump -ni any</tspan>
    <tspan x="566" dy="30" class="mono">icmp[icmptype]==3 and</tspan>
    <tspan x="566" dy="30" class="mono">icmp[icmpcode]==4</tspan>
    <tspan x="566" dy="30">shows whether need-frag</tspan>
    <tspan x="566" dy="28">messages arrive</tspan>
  </text>

  
  <rect x="550" y="850" width="440" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M568 915 a20 20 0 0 1 36 0"/>
    <path d="M586 915 l8 -12"/>
    <circle cx="586" cy="915" r="3" fill="#207448"/>
  </g>
  <text x="616" y="880" font-size="24">
    <tspan x="616" dy="0" class="mono">tcp_mtu_probing:</tspan>
    <tspan x="566" dy="28">0 off, 1 on after a</tspan>
    <tspan x="566" dy="28">black hole is detected,</tspan>
    <tspan x="566" dy="28">2 always</tspan>
  </text>

  
  <rect x="1040" y="135" width="520" height="850" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="1056" y="155" width="488" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1072" y="180" width="44" height="24" rx="3"/>
    <path d="M1082 180 v8 M1094 180 v12 M1106 180 v8"/>
  </g>
  <text x="1130" y="190" font-size="24">
    <tspan x="1130" dy="0" font-weight="bold">1 make MTUs consistent</tspan>
    <tspan x="1130" dy="28">end to end, overlay MTU =</tspan>
    <tspan x="1130" dy="28">underlay minus overhead</tspan>
  </text>

  
  <rect x="1056" y="275" width="488" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1074 300 h40 M1074 316 h40 M1074 332 h40"/>
    <path d="M1084 300 v16 M1104 300 v16 M1094 316 v16"/>
  </g>
  <text x="1130" y="310" font-size="24">
    <tspan x="1130" dy="0" font-weight="bold">2 allow ICMP type 3 code 4</tspan>
    <tspan x="1130" dy="28">and ICMPv6 type 2 through</tspan>
    <tspan x="1130" dy="28">every firewall</tspan>
  </text>

  
  <rect x="1056" y="395" width="488" height="245" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1074" y="415" width="40" height="30" rx="4"/>
    <path d="M1084 445 v8 M1104 445 v8"/>
    <path d="M1074 430 h40"/>
  </g>
  <text x="1130" y="425" font-size="24">
    <tspan x="1130" dy="0" font-weight="bold">3 clamp MSS at the tunnel</tspan>
    <tspan x="1130" dy="28">or NAT gateway:</tspan>
    <tspan x="1072" dy="32" class="mono">iptables -t mangle -A FORWARD</tspan>
    <tspan x="1072" dy="28" class="mono">-p tcp --tcp-flags SYN,RST SYN</tspan>
    <tspan x="1072" dy="28" class="mono">-j TCPMSS --clamp-mss-to-pmtu,</tspan>
    <tspan x="1072" dy="30">or nftables tcp option maxseg</tspan>
    <tspan x="1072" dy="28">size set rt mtu</tspan>
  </text>

  
  <rect x="1056" y="650" width="488" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="1094" cy="680" r="18"/>
    <circle cx="1094" cy="680" r="8"/>
    <path d="M1094 662 v10 M1094 688 v10 M1076 680 h10 M1102 680 h10"/>
  </g>
  <text x="1130" y="682" font-size="24">
    <tspan x="1130" dy="0" font-weight="bold">4 tcp_mtu_probing=1 on</tspan>
    <tspan x="1130" dy="28">the client as a safety net</tspan>
    <tspan x="1072" dy="32">(Packetization-Layer</tspan>
    <tspan x="1072" dy="28">PMTUD, RFC 4821)</tspan>
  </text>

  
  <rect x="1056" y="810" width="488" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1094 832 v36"/>
    <rect x="1084" y="852" width="20" height="10" rx="2" fill="#207448"/>
  </g>
  <text x="1130" y="845" font-size="24">
    <tspan x="1130" dy="0" font-weight="bold">5 lower the interface MTU,</tspan>
    <tspan x="1130" dy="28">last resort</tspan>
  </text>

  
  <rect x="40" y="1005" width="1520" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="65" y="1048" font-size="24">
    <tspan x="65" dy="0" font-weight="bold">Where black holes appear:</tspan>
    <tspan dy="0"> VPNs, GRE, IPsec and WireGuard tunnels, VXLAN and Geneve overlays,</tspan>
    <tspan x="65" dy="34">cloud interconnects such as the GCP default VPC MTU of 1460, PPPoE, any firewall that drops ICMP</tspan>
  </text>

  
  <rect x="40" y="1130" width="1520" height="50" rx="8" fill="#207448"/>
  <text x="800" y="1163" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">
    A black hole costs nothing for small packets and everything for big ones
  </text>
</svg>