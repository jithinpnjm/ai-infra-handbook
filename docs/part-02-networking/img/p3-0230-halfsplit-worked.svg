<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" width="1600" height="1220">
  <title>Half-split on the 5-hop Clos path: which hops get probed</title>
  <desc>Infographic illustrating half-split bisection troubleshooting across a 5-hop Clos network path.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1220" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Half-split on the 5-hop Clos path: which hops get probed</text>

  
  <rect x="50" y="85" width="1500" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="132" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">split the path roughly in half; test the signal at the midpoint; incorrect means</text>
  <text x="800" y="172" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">move toward the source, correct means move toward the destination; repeat on the remaining half</text>

  
  
  <rect x="50" y="230" width="220" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(136, 245)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="34" rx="4"/>
    <line x1="8" y1="24" x2="14" y2="24"/>
    <line x1="20" y1="24" x2="26" y2="24"/>
    <line x1="14" y1="34" x2="8" y2="44"/>
    <line x1="34" y1="34" x2="40" y2="44"/>
    <line x1="4" y1="44" x2="44" y2="44"/>
  </g>
  <text x="160" y="336" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">src_host</text>

  
  <line x1="270" y1="295" x2="358" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="370" y="230" width="220" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(456, 246)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="36" rx="4"/>
    <path d="M 10 18 L 38 18 M 30 11 L 38 18 L 30 25"/>
    <circle cx="10" cy="18" r="3" fill="#207448"/>
  </g>
  <text x="480" y="336" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">leaf_a</text>

  
  <line x1="590" y1="295" x2="678" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="690" y="230" width="220" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(776, 246)" stroke="#207448" stroke-width="3" fill="none">
    <polygon points="24,2 48,18 48,34 24,46 0,34 0,18"/>
    <line x1="12" y1="24" x2="36" y2="24"/>
    <line x1="24" y1="12" x2="24" y2="36"/>
  </g>
  <text x="800" y="336" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">spine</text>

  
  <line x1="910" y1="295" x2="998" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1010" y="230" width="220" height="130" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(1096, 246)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="36" rx="4"/>
    <path d="M 10 18 L 38 18 M 30 11 L 38 18 L 30 25"/>
    <circle cx="10" cy="18" r="3" fill="#db8129"/>
  </g>
  <text x="1120" y="336" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">leaf_b</text>

  
  <line x1="1230" y1="295" x2="1318" y2="295" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="1330" y="230" width="220" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <g transform="translate(1416, 245)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="48" height="34" rx="4"/>
    <line x1="8" y1="24" x2="14" y2="24"/>
    <line x1="20" y1="24" x2="26" y2="24"/>
    <line x1="14" y1="34" x2="8" y2="44"/>
    <line x1="34" y1="34" x2="40" y2="44"/>
    <line x1="4" y1="44" x2="44" y2="44"/>
  </g>
  <text x="1440" y="336" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">dst_host</text>

  
  <rect x="50" y="390" width="730" height="280" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="75" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">leaf_b is the first failing hop</text>
  <text x="75" y="480" font-family="sans-serif" font-size="24" fill="#303a36">probe 1 at spine (correct) so move</text>
  <text x="75" y="518" font-family="sans-serif" font-size="24" fill="#303a36">toward the destination; probe 2 at</text>
  <text x="75" y="556" font-family="sans-serif" font-size="24" fill="#303a36">leaf_b (incorrect) so the fault is at or</text>
  <text x="75" y="594" font-family="sans-serif" font-size="24" fill="#303a36">before leaf_b, and leaf_b's predecessor</text>
  <text x="75" y="632" font-family="sans-serif" font-size="24" fill="#303a36">spine was correct, which isolates leaf_b</text>

  
  <rect x="820" y="390" width="730" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="845" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">leaf_a is the first failing hop</text>
  <text x="845" y="488" font-family="sans-serif" font-size="24" fill="#303a36">probe 1 at spine (incorrect) so move</text>
  <text x="845" y="534" font-family="sans-serif" font-size="24" fill="#303a36">toward the source; probe 2 at leaf_a</text>
  <text x="845" y="580" font-family="sans-serif" font-size="24" fill="#303a36">(incorrect) and src_host (correct)</text>
  <text x="845" y="626" font-family="sans-serif" font-size="24" fill="#303a36">isolates leaf_a</text>

  
  <rect x="50" y="695" width="1500" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="748" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">a flow fails between a spine and a host; the midpoint test is at the leaf; if the leaf's counters</text>
  <text x="800" y="792" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">show the packet arrived and also left, the fault lies past the leaf, so move toward the host;</text>
  <text x="800" y="836" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">if it never left the leaf, the fault lies before it, so move toward the spine</text>

  
  <rect x="50" y="895" width="840" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="75" y="950" font-family="sans-serif" font-size="25" fill="#303a36">choose the path with traceroute, ip route get or an</text>
  <text x="75" y="995" font-family="sans-serif" font-size="25" fill="#303a36">ECMP-aware mtr; capture at the midpoint with a</text>
  <text x="75" y="1040" font-family="sans-serif" font-size="25" fill="#303a36">packet capture or counters, then bisect</text>

  
  <rect x="920" y="895" width="630" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="945" y="944" font-family="sans-serif" font-size="25" fill="#303a36">At each test ask two questions:</text>
  <text x="945" y="984" font-family="sans-serif" font-size="25" fill="#303a36">what is the actual state of the</text>
  <text x="945" y="1024" font-family="sans-serif" font-size="25" fill="#303a36">system and the signal here, and</text>
  <text x="945" y="1064" font-family="sans-serif" font-size="25" fill="#303a36">what should normal look like?</text>

  
  <rect x="50" y="1105" width="1500" height="75" rx="10" fill="#207448"/>
  <text x="800" y="1152" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A long path takes a handful of tests if each test cuts it in half</text>
</svg>