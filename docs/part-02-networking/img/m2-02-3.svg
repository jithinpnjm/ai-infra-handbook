<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Encapsulation and decapsulation</title>
  <desc>Visual flowchart illustrating network protocol encapsulation from application data through TLS, TCP, IP, Ethernet, and onto the physical wire.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 2 L 9 5 L 1 8 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="60" fill="#303a36" font-size="48" font-weight="bold" font-family="sans-serif" text-anchor="middle">Encapsulation and decapsulation</text>

  
  <g id="node-1">
    <rect x="80" y="100" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="135" cy="155" r="24" fill="#207448"/>
    <text x="135" y="155" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1</text>
    
    <rect x="194" y="133" width="48" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="194" y1="145" x2="242" y2="145" stroke="#207448" stroke-width="2.5"/>
    <circle cx="203" cy="139" r="2" fill="#207448"/>
    <circle cx="210" cy="139" r="2" fill="#207448"/>
    <circle cx="217" cy="139" r="2" fill="#207448"/>
    <text x="270" y="164" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">Application data: 'GET / HTTP/1.1 ...' (e.g. 1,000 bytes)</text>
  </g>

  
  <line x1="800" y1="210" x2="800" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-2">
    <rect x="80" y="270" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="135" cy="325" r="24" fill="#207448"/>
    <text x="135" y="325" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2</text>
    
    <path d="M 207 321 V 311 A 11 11 0 0 1 229 311 V 321" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="199" y="321" width="38" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="218" cy="332" r="3" fill="#207448"/>
    <line x1="218" y1="335" x2="218" y2="341" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="270" y="334" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">(TLS record: + 5-byte header + 16-byte tag)</text>
  </g>

  
  <line x1="800" y1="380" x2="800" y2="440" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-3">
    <rect x="80" y="440" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="135" cy="495" r="24" fill="#207448"/>
    <text x="135" y="495" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3</text>
    
    <rect x="196" y="473" width="32" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="208" y="489" width="32" height="22" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="202" y1="484" x2="222" y2="484" stroke="#207448" stroke-width="2.5"/>
    <line x1="214" y1="500" x2="234" y2="500" stroke="#207448" stroke-width="2.5"/>
    <text x="270" y="504" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">TCP segment = TCP header (20-60 B) + payload</text>
  </g>

  
  <line x1="800" y1="550" x2="800" y2="610" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-4">
    <rect x="80" y="610" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="135" cy="665" r="24" fill="#207448"/>
    <text x="135" y="665" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">4</text>
    
    <circle cx="218" cy="665" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="196" y1="665" x2="240" y2="665" stroke="#207448" stroke-width="2.5"/>
    <ellipse cx="218" cy="665" rx="11" ry="22" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="218" y1="643" x2="218" y2="687" stroke="#207448" stroke-width="2.5"/>
    <text x="270" y="674" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">IP packet = IP header (IPv4 20-60 B / IPv6 40 B) + segment</text>
  </g>

  
  <line x1="800" y1="720" x2="800" y2="780" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-5">
    <rect x="80" y="780" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <circle cx="135" cy="835" r="24" fill="#207448"/>
    <text x="135" y="835" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">5</text>
    
    <path d="M 198 815 H 238 V 849 H 229 V 855 H 207 V 849 H 198 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="206" y1="823" x2="206" y2="835" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="214" y1="823" x2="214" y2="835" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="222" y1="823" x2="222" y2="835" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="230" y1="823" x2="230" y2="835" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="270" y="828" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">
      <tspan x="270" dy="0">Ethernet frame = dst MAC (6) + src MAC (6) + [802.1Q tag 4] +</tspan>
      <tspan x="270" dy="34">EtherType (2) + packet + FCS (4)</tspan>
    </text>
  </g>

  
  <line x1="800" y1="890" x2="800" y2="950" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-6">
    <rect x="80" y="950" width="1440" height="110" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5"/>
    <circle cx="135" cy="1005" r="24" fill="#db8129"/>
    <text x="135" y="1005" fill="#ffffff" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">6</text>
    
    <path d="M 196 1005 H 204 V 990 H 216 V 1020 H 228 V 990 H 236 V 1005 H 244" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="270" y="998" fill="#303a36" font-size="26" font-weight="bold" font-family="sans-serif">
      <tspan x="270" dy="0">On the wire: preamble (7) + SFD (1) + frame +</tspan>
      <tspan x="270" dy="34">inter-frame gap (12 byte times)</tspan>
    </text>
  </g>
</svg>