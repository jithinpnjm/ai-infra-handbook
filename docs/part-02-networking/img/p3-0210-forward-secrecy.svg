<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Why forward secrecy matters: static RSA key transport versus ephemeral Diffie-Hellman</title>
  <desc>Comparison of static RSA key exchange vulnerability against historical recording versus ephemeral Diffie-Hellman forward secrecy in TLS.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Why forward secrecy matters:</text>
    <text x="800" y="106" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36" text-anchor="middle">static RSA key transport versus ephemeral Diffie-Hellman</text>
  </g>

  
  
  
  <g id="upper-lane">
    <rect x="40" y="140" width="1080" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="182" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Old RSA key transport (TLS 1.2 option)</text>

    
    <rect x="65" y="205" width="330" height="305" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="105" cy="245" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 117 257 L 135 275 M 127 267 L 133 261 M 131 271 L 137 265" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="85" y="315" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">client picks a random</tspan>
      <tspan x="85" dy="32">pre-master secret,</tspan>
      <tspan x="85" dy="32">encrypts it under the</tspan>
      <tspan x="85" dy="32">server's public key,</tspan>
      <tspan x="85" dy="32">sends it</tspan>
    </text>

    
    <path d="M 395 275 L 435 275" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="445" y="205" width="280" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="480" cy="240" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="510" cy="240" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="480" y1="254" x2="510" y2="254" stroke="#207448" stroke-width="3" />
    <text x="465" y="295" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="465" dy="0">an attacker records</tspan>
      <tspan x="465" dy="30">the traffic</tspan>
    </text>

    
    <path d="M 585 340 L 585 375" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="555" y="345" width="60" height="26" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="585" y="364" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">later</text>

    
    <rect x="445" y="385" width="280" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 470 418 A 12 12 0 0 1 494 418 L 494 426" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="465" y="426" width="34" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <text x="465" y="475" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="465" dy="0">steals the server key</tspan>
    </text>

    
    <path d="M 725 448 L 765 448" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <rect x="775" y="370" width="325" height="140" rx="12" fill="#fdf3e8" stroke="#db8129" stroke-width="3" />
    
    <path d="M 800 405 A 14 14 0 0 1 828 405 L 828 400" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="795" y="415" width="38" height="28" rx="5" fill="none" stroke="#db8129" stroke-width="3" />
    <text x="800" y="465" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="800" dy="0">decrypts recorded</tspan>
      <tspan x="800" dy="30">sessions</tspan>
    </text>
  </g>

  
  
  
  <g id="centre-note">
    <rect x="40" y="550" width="1080" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 75 580 L 95 572 L 115 580 L 115 605 C 115 625 95 638 95 638 C 95 638 75 625 75 605 Z" fill="none" stroke="#207448" stroke-width="3" />
    <text x="135" y="596" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">Hybrid use: slow careful public-key courier delivers the agreement,</tspan>
      <tspan x="135" dy="34">fast symmetric safe (AES-GCM, ChaCha20-Poly1305) carries the data</tspan>
    </text>
  </g>

  
  
  
  <g id="lower-lane">
    <rect x="40" y="680" width="1080" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="722" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ephemeral Diffie-Hellman (TLS 1.3 requires it)</text>

    
    <rect x="65" y="745" width="375" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 85 785 A 18 18 0 1 1 115 805" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="115,795 115,807 103,807" fill="none" stroke="#207448" stroke-width="3" />
    <text x="85" y="830" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">both sides send key</tspan>
      <tspan x="85" dy="32">shares, each session's</tspan>
      <tspan x="85" dy="32">keys are made fresh and</tspan>
      <tspan x="85" dy="32">thrown away, session</tspan>
      <tspan x="85" dy="32">keys cannot be derived</tspan>
      <tspan x="85" dy="32">from the server's</tspan>
      <tspan x="85" dy="32">long-term key</tspan>
    </text>

    
    <path d="M 440 915 L 490 915" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="445" y="875" width="60" height="26" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="475" y="894" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">later</text>

    
    <rect x="500" y="845" width="220" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="535" cy="880" r="15" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="535" y1="872" x2="535" y2="883" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="535" cy="889" r="2" fill="#207448" />
    <text x="520" y="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="520" dy="0">server key leaks</tspan>
    </text>

    
    <path d="M 720 915 L 750 915" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="760" y="830" width="345" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 790 865 L 810 857 L 830 865 L 830 885 C 830 902 810 912 810 912 C 810 912 790 902 790 885 Z" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 802 884 L 808 890 L 819 878" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="785" y="940" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="785" dy="0">recorded traffic</tspan>
      <tspan x="785" dy="32">still cannot be decrypted</tspan>
    </text>
  </g>

  
  
  
  <g id="right-panel">
    <rect x="1145" y="140" width="415" height="965" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1185" cy="180" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="1174" y1="169" x2="1196" y2="191" stroke="#207448" stroke-width="3" />
    <line x1="1196" y1="169" x2="1174" y2="191" stroke="#207448" stroke-width="3" />
    <text x="1215" y="188" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">What TLS 1.3 removed</text>

    
    <rect x="1170" y="225" width="365" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <line x1="1190" y1="267" x2="1208" y2="267" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="1218" y="275" font-family="sans-serif" font-size="24" fill="#303a36">static-RSA key transport</text>

    
    <rect x="1170" y="330" width="365" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <line x1="1190" y1="372" x2="1208" y2="372" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="1218" y="380" font-family="sans-serif" font-size="24" fill="#303a36">compression</text>

    
    <rect x="1170" y="435" width="365" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <line x1="1190" y1="477" x2="1208" y2="477" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="1218" y="485" font-family="sans-serif" font-size="24" fill="#303a36">renegotiation</text>

    
    <rect x="1170" y="540" width="365" height="535" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="1205" cy="580" r="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 1198 580 L 1203 585 L 1212 575" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1195" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1195" dy="0">left a reduced set</tspan>
      <tspan x="1195" dy="36">of strong AEAD cipher</tspan>
      <tspan x="1195" dy="36">suites; certificate and</tspan>
      <tspan x="1195" dy="36">handshake messages</tspan>
      <tspan x="1195" dy="36">after ServerHello</tspan>
      <tspan x="1195" dy="36">are encrypted</tspan>
    </text>
  </g>

  
  
  
  <g id="footer">
    <rect x="40" y="1125" width="1520" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="70" y="1165" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">Hashes alone give integrity only against accidental change; against an active attacker you need a MAC or a signature;</tspan>
      <tspan x="70" dy="34">encryption hides data but does not prove who sent it, a signature proves who sent it but hides nothing, so TLS needs both</tspan>
    </text>
  </g>

  
  
  
  <g id="bottom-bar">
    <rect x="40" y="1280" width="1520" height="65" rx="12" fill="#207448" />
    <text x="800" y="1322" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Ephemeral means fresh keys per session, then thrown away</text>
  </g>
</svg>