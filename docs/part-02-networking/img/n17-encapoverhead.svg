<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Encapsulation overhead and ECMP entropy</title>
  <desc>Horizontal bar chart of overhead in bytes under IPv4 underlay comparing UDP-based encapsulations with ECMP entropy against portless encapsulations that hash to a single path.</desc>

  <defs>
    <pattern id="diagonal-stripe-green" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#207448" stroke-width="4" />
    </pattern>
    <pattern id="diagonal-stripe-orange" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#db8129" stroke-width="4" />
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Encapsulation overhead and ECMP entropy</text>

  <text x="800" y="100" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">overhead in bytes (IPv4 underlay)</text>

  <g id="card-mpls">
    <rect x="60" y="125" width="1480" height="115" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(86, 154)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 28 L 28 6 L 50 6 L 50 28 L 28 50 Z"/>
      <circle cx="38" cy="18" r="4" fill="#207448"/>
    </g>

    <text x="165" y="165" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">MPLS 4 B per label</text>

    <rect x="165" y="180" width="60" height="30" rx="6" fill="#207448"/>
  </g>

  <g id="card-udp">
    <rect x="60" y="265" width="1480" height="400" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    <g transform="translate(86, 285)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="28" r="7"/>
      <circle cx="46" cy="10" r="7"/>
      <circle cx="46" cy="28" r="7"/>
      <circle cx="46" cy="46" r="7"/>
      <path d="M 17 28 L 39 10"/>
      <path d="M 17 28 L 39 28"/>
      <path d="M 17 28 L 39 46"/>
    </g>

    <text x="165" y="322" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">UDP-based: ECMP entropy from outer source port</text>

    <g transform="translate(165, 355)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">VXLAN 50 B (outer Ethernet 14 + IP 20 + UDP 8 + VXLAN 8)</text>
      <rect x="0" y="36" width="750" height="30" rx="6" fill="#207448"/>
      <line x1="210" y1="36" x2="210" y2="66" stroke="#ffffff" stroke-width="2"/>
      <line x1="510" y1="36" x2="510" y2="66" stroke="#ffffff" stroke-width="2"/>
      <line x1="630" y1="36" x2="630" y2="66" stroke="#ffffff" stroke-width="2"/>
    </g>

    <g transform="translate(165, 452)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">GENEVE 50+ B</text>
      <rect x="0" y="36" width="750" height="30" rx="6" fill="#207448"/>
      <rect x="750" y="36" width="150" height="30" rx="6" fill="url(#diagonal-stripe-green)" stroke="#207448" stroke-width="2"/>
    </g>

    <g transform="translate(165, 549)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">WireGuard 60 B</text>
      <rect x="0" y="36" width="900" height="30" rx="6" fill="#207448"/>
    </g>
  </g>

  <g id="card-noports">
    <rect x="60" y="690" width="1480" height="400" rx="18" fill="#fff7f0" stroke="#db8129" stroke-width="3"/>

    <g transform="translate(86, 710)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="6"/>
      <circle cx="10" cy="28" r="6"/>
      <circle cx="10" cy="46" r="6"/>
      <path d="M 16 10 L 34 28"/>
      <path d="M 16 28 L 34 28"/>
      <path d="M 16 46 L 34 28"/>
      <line x1="34" y1="28" x2="50" y2="28"/>
    </g>

    <text x="165" y="747" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">no ports: all traffic between two endpoints hashes to one path</text>

    <g transform="translate(165, 780)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">IPIP 20 B</text>
      <rect x="0" y="36" width="300" height="30" rx="6" fill="#db8129"/>
    </g>

    <g transform="translate(165, 877)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">GRE 24 B</text>
      <rect x="0" y="36" width="360" height="30" rx="6" fill="#db8129"/>
    </g>

    <g transform="translate(165, 974)">
      <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">IPsec ESP about 50 to 73 B</text>
      <rect x="0" y="36" width="750" height="30" rx="6" fill="#db8129"/>
      <rect x="750" y="36" width="345" height="30" rx="6" fill="url(#diagonal-stripe-orange)" stroke="#db8129" stroke-width="2"/>
    </g>
  </g>

  <g id="footer-takeaway">
    <rect x="60" y="1115" width="1480" height="65" rx="14" fill="#207448"/>
    <text x="800" y="1156" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">VXLAN is L2 over UDP/4789, GENEVE UDP/6081</text>
  </g>
</svg>