<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Where TLS ends</title>
  <desc>Visual comparison of TLS termination at the load balancer versus passthrough, methods for client IP preservation, and the primary architectural takeaway.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where TLS ends</text>

  
  <g>
    
    <rect x="80" y="115" width="300" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="230" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Client</text>

    
    <rect x="420" y="115" width="760" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">load balancer</text>

    
    <rect x="1220" y="115" width="300" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1370" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">backends</text>
  </g>

  
  <g>
    <rect x="80" y="195" width="1440" height="355" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="110" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TLS termination at the LB</text>

    
    <rect x="110" y="265" width="240" height="255" rx="12" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="2" />
    
    <rect x="200" y="330" width="60" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="215" y1="372" x2="245" y2="372" stroke="#207448" stroke-width="3" />
    <line x1="205" y1="380" x2="255" y2="380" stroke="#207448" stroke-width="3" />

    
    <path d="M 350 395 L 440 395" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

    
    <rect x="450" y="265" width="700" height="255" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    
    <rect x="490" y="300" width="36" height="26" rx="4" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 498 300 V 288 A 10 10 0 0 1 518 288" fill="none" stroke="#db8129" stroke-width="3" />
    <circle cx="508" cy="313" r="3" fill="#db8129" />

    
    <text x="490" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
      <tspan x="490" dy="0">LB decrypts, can inspect and route at L7</tspan>
      <tspan x="490" dy="38">(headers, WAF), then re-encrypts or</tspan>
      <tspan x="490" dy="38">sends plaintext to the backends.</tspan>
    </text>

    
    <path d="M 1150 395 L 1240 395" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

    
    <rect x="1250" y="265" width="240" height="255" rx="12" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="2" />
    
    <rect x="1335" y="325" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="337" r="3" fill="#207448" />
    <rect x="1335" y="358" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="370" r="3" fill="#207448" />
    <rect x="1335" y="391" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="403" r="3" fill="#207448" />
  </g>

  
  <g>
    <rect x="80" y="575" width="1440" height="355" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="110" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Passthrough</text>

    
    <rect x="110" y="645" width="240" height="255" rx="12" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="2" />
    
    <rect x="200" y="710" width="60" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="215" y1="752" x2="245" y2="752" stroke="#207448" stroke-width="3" />
    <line x1="205" y1="760" x2="255" y2="760" stroke="#207448" stroke-width="3" />

    
    <path d="M 350 775 L 440 775" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

    
    <rect x="450" y="645" width="700" height="255" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    
    <rect x="490" y="680" width="36" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 498 680 V 668 A 10 10 0 0 1 518 668 V 680" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="508" cy="693" r="3" fill="#207448" />

    
    <text x="490" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
      <tspan x="490" dy="0">an L4 balancer routes on SNI and</tspan>
      <tspan x="490" dy="38">keeps the traffic encrypted.</tspan>
    </text>

    
    <path d="M 1150 775 L 1240 775" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />

    
    <rect x="1250" y="645" width="240" height="255" rx="12" fill="#f5f8f5" stroke="#c8d8cc" stroke-width="2" />
    
    <rect x="1335" y="705" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="717" r="3" fill="#207448" />
    <rect x="1335" y="738" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="750" r="3" fill="#207448" />
    <rect x="1335" y="771" width="70" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1390" cy="783" r="3" fill="#207448" />
  </g>

  
  <g>
    <rect x="80" y="955" width="1440" height="305" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="110" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Client IP preservation</text>

    
    <rect x="110" y="1020" width="1380" height="64" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="1060" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">L7: X-Forwarded-For or Forwarded (trust only from known proxies)</text>

    
    <rect x="110" y="1100" width="1380" height="64" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="1140" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">L4: PROXY protocol v1 or v2</text>

    
    <rect x="110" y="1180" width="1380" height="64" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="1220" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DSR and externalTrafficPolicy: Local avoid SNAT</text>
  </g>

  
  <g>
    <rect x="80" y="1285" width="1440" height="75" rx="12" fill="#207448" />
    <text x="800" y="1332" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Decide where TLS ends before anything else: it sets what the balancer can route on</text>
  </g>
</svg>