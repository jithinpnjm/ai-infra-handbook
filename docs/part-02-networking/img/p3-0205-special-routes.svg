<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Special route types: what the sender hears back</title>
  <desc>An infographic table explaining Linux special route types blackhole, unreachable, prohibit, throw, and local, what happens to packets, sender responses, and loopback VIP behavior.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Special route types: what the sender hears back</text>

  
  <g id="table">
    
    <rect x="40" y="120" width="1520" height="60" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <line x1="270" y1="120" x2="270" y2="180" stroke="#207448" stroke-width="1.5"/>
    <line x1="680" y1="120" x2="680" y2="180" stroke="#207448" stroke-width="1.5"/>
    <line x1="950" y1="120" x2="950" y2="180" stroke="#207448" stroke-width="1.5"/>
    <line x1="1220" y1="120" x2="1220" y2="180" stroke="#207448" stroke-width="1.5"/>

    <text x="475" y="158" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Command</text>
    <text x="815" y="145" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">What happens</text>
    <text x="815" y="171" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">to the packet</text>
    <text x="1085" y="145" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">What the</text>
    <text x="1085" y="171" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">sender hears</text>
    <text x="1390" y="158" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Typical use</text>

    
    <rect x="40" y="180" width="1520" height="130" fill="#ffffff" stroke="#c2d6c7" stroke-width="1"/>
    <rect x="40" y="180" width="230" height="130" fill="#fdf6ee" stroke="#db8129" stroke-width="2"/>
    <line x1="270" y1="180" x2="270" y2="310" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="680" y1="180" x2="680" y2="310" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="950" y1="180" x2="950" y2="310" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="1220" y1="180" x2="1220" y2="310" stroke="#c2d6c7" stroke-width="1"/>

    
    <g transform="translate(155, 218)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#db8129" stroke-width="4"/>
      <circle cx="0" cy="0" r="12" fill="#db8129"/>
      <path d="M -16,-16 L -6,-6 M 16,-16 L 6,-6 M -16,16 L -6,6 M 16,16 L 6,6" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="155" y="280" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">blackhole</text>

    
    <text x="290" y="235" font-family="monospace" font-size="24" fill="#303a36">ip route add blackhole</text>
    <text x="290" y="267" font-family="monospace" font-size="24" fill="#303a36">192.0.2.0/24</text>
    <text x="705" y="250" font-family="sans-serif" font-size="24" fill="#303a36">dropped silently</text>
    <text x="975" y="235" font-family="sans-serif" font-size="24" fill="#303a36">nothing,</text>
    <text x="975" y="267" font-family="sans-serif" font-size="24" fill="#303a36">no answer</text>
    <text x="1245" y="215" font-family="sans-serif" font-size="24" fill="#303a36">summary routes,</text>
    <text x="1245" y="243" font-family="sans-serif" font-size="24" fill="#303a36">security,</text>
    <text x="1245" y="271" font-family="sans-serif" font-size="24" fill="#303a36">avoiding loops,</text>
    <text x="1245" y="299" font-family="sans-serif" font-size="24" fill="#303a36">DDoS mitigation</text>

    
    <rect x="40" y="310" width="1520" height="100" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="270" y1="310" x2="270" y2="410" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="680" y1="310" x2="680" y2="410" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="950" y1="310" x2="950" y2="410" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="1220" y1="310" x2="1220" y2="410" stroke="#c2d6c7" stroke-width="1"/>

    
    <g transform="translate(155, 342)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="155" y="390" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">unreachable</text>

    <text x="290" y="352" font-family="monospace" font-size="24" fill="#303a36">ip route add unreachable</text>
    <text x="290" y="384" font-family="monospace" font-size="24" fill="#303a36">198.51.100.0/24</text>
    <text x="975" y="352" font-family="sans-serif" font-size="24" fill="#303a36">ICMP host</text>
    <text x="975" y="384" font-family="sans-serif" font-size="24" fill="#303a36">unreachable</text>

    
    <rect x="40" y="410" width="1520" height="120" fill="#ffffff" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="270" y1="410" x2="270" y2="530" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="680" y1="410" x2="680" y2="530" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="950" y1="410" x2="950" y2="530" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="1220" y1="410" x2="1220" y2="530" stroke="#c2d6c7" stroke-width="1"/>

    
    <g transform="translate(155, 448)">
      <path d="M 0,-18 L 16,-8 L 16,6 C 16,14 0,22 0,22 C 0,22 -16,14 -16,6 L -16,-8 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="155" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">prohibit</text>

    <text x="290" y="458" font-family="monospace" font-size="24" fill="#303a36">ip route add prohibit</text>
    <text x="290" y="490" font-family="monospace" font-size="24" fill="#303a36">203.0.113.0/24</text>
    <text x="975" y="445" font-family="sans-serif" font-size="24" fill="#303a36">ICMP</text>
    <text x="975" y="475" font-family="sans-serif" font-size="24" fill="#303a36">administratively</text>
    <text x="975" y="505" font-family="sans-serif" font-size="24" fill="#303a36">prohibited</text>

    
    <rect x="680" y="310" width="270" height="220" fill="#edf4ee" stroke="#207448" stroke-width="1.5"/>
    <text x="815" y="428" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">dropped</text>

    
    <rect x="40" y="530" width="1520" height="110" fill="#f5f8f5" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="270" y1="530" x2="270" y2="640" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="680" y1="530" x2="680" y2="640" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="950" y1="530" x2="950" y2="640" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="1220" y1="530" x2="1220" y2="640" stroke="#c2d6c7" stroke-width="1"/>

    
    <g transform="translate(155, 565)">
      <path d="M -14,-8 L 6,-8 L 6,10 M 0,4 L 6,10 L 12,4" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-16" y1="12" x2="-4" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="155" y="615" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">throw</text>

    <text x="290" y="572" font-family="monospace" font-size="24" fill="#303a36">ip route add throw</text>
    <text x="290" y="604" font-family="monospace" font-size="24" fill="#303a36">10.9.0.0/16 table 101</text>
    <text x="705" y="562" font-family="sans-serif" font-size="24" fill="#303a36">the lookup stops</text>
    <text x="705" y="590" font-family="sans-serif" font-size="24" fill="#303a36">looking in</text>
    <text x="705" y="618" font-family="sans-serif" font-size="24" fill="#303a36">that table</text>
    <text x="975" y="572" font-family="sans-serif" font-size="24" fill="#303a36">depends on</text>
    <text x="975" y="604" font-family="sans-serif" font-size="24" fill="#303a36">later rules</text>
    <text x="1245" y="590" font-family="sans-serif" font-size="24" fill="#303a36">policy routing</text>

    
    <rect x="40" y="640" width="1520" height="110" fill="#ffffff" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="270" y1="640" x2="270" y2="750" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="680" y1="640" x2="680" y2="750" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="950" y1="640" x2="950" y2="750" stroke="#c2d6c7" stroke-width="1"/>
    <line x1="1220" y1="640" x2="1220" y2="750" stroke="#c2d6c7" stroke-width="1"/>

    
    <g transform="translate(155, 675)">
      <rect x="-16" y="-14" width="32" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="-8" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="16" stroke="#207448" stroke-width="3"/>
      <circle cx="0" cy="-2" r="3" fill="#207448"/>
    </g>
    <text x="155" y="725" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">local</text>

    <text x="290" y="682" font-family="monospace" font-size="24" fill="#303a36">ip route add local</text>
    <text x="290" y="714" font-family="monospace" font-size="24" fill="#303a36">10.200.0.1/32 dev lo</text>
    <text x="705" y="672" font-family="sans-serif" font-size="24" fill="#303a36">the address</text>
    <text x="705" y="700" font-family="sans-serif" font-size="24" fill="#303a36">becomes local</text>
    <text x="705" y="728" font-family="sans-serif" font-size="24" fill="#303a36">to this host</text>
    <text x="975" y="698" font-family="sans-serif" font-size="24" fill="#303a36">it answers</text>
    <text x="1245" y="682" font-family="sans-serif" font-size="24" fill="#303a36">anycast or VIP</text>
    <text x="1245" y="714" font-family="sans-serif" font-size="24" fill="#303a36">on loopback</text>
  </g>

  
  <g id="lower-panels">
    
    <rect x="40" y="780" width="480" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(280, 835)">
      <rect x="-26" y="-20" width="52" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M -16,-6 L -8,0 L -16,6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-4" y1="6" x2="8" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="280" y="920" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">ip route show type blackhole</text>
    <text x="280" y="960" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">lists them</text>

    
    <rect x="560" y="780" width="1000" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(600, 822)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M -6,-10 L 0,-16 L 6,-10" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6,10 L 0,16 L -6,10" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="635" y="830" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Loopback and VIP addresses</text>

    <text x="595" y="872" font-family="sans-serif" font-size="24" fill="#303a36">lo carries 127.0.0.1/8 and ::1 and always stays up;</text>
    <text x="595" y="902" font-family="sans-serif" font-size="24" fill="#303a36">any 127.x.y.z is local; a /32 on lo or on a dummy interface</text>
    <text x="595" y="932" font-family="monospace" font-size="24" fill="#303a36">(ip link add dummy0 type dummy;</text>
    <text x="595" y="962" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">ip addr add 10.255.0.45/32 dev dummy0)</tspan> stays up whatever</text>
    <text x="595" y="992" font-family="sans-serif" font-size="24" fill="#303a36">happens to physical links, so BGP designs advertise them;</text>
    <text x="595" y="1022" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">ip route show table local</tspan> lists the addresses</text>
    <text x="595" y="1052" font-family="sans-serif" font-size="24" fill="#303a36">the kernel treats as local</text>
  </g>

  
  <rect x="40" y="1110" width="1520" height="60" rx="8" fill="#207448"/>
  <text x="800" y="1148" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">A route can be a do-not-go-there sign, not only a direction</text>
</svg>