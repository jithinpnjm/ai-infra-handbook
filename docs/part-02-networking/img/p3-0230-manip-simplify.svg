<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Manipulate and simplify: from a lead to a cause</title>
  <desc>SVG infographic explaining manipulation flow and simplification strategies to identify root causes from leads.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="62" font-size="48" font-weight="bold" fill="#303a36" font-family="sans-serif">Manipulate and simplify: from a lead to a cause</text>

  
  <g id="panel-manipulation">
    <rect x="40" y="95" width="730" height="1015" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="142" font-size="32" font-weight="bold" fill="#207448" font-family="sans-serif">Manipulation</text>

    
    <g id="node-step1">
      <rect x="70" y="165" width="670" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(86, 200)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="2" y="6" width="50" height="42" rx="6" />
        <path d="M 8 30 L 18 30 L 23 16 L 31 40 L 37 24 L 42 30 L 48 30" />
      </g>
      
      <circle cx="170" cy="227" r="22" fill="#207448" />
      <text x="170" y="235" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">1</text>
      
      <text x="210" y="202" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
        Symptom coincides with an event:
        <tspan x="210" dy="34" font-weight="normal">jitter starts every time SPF runs</tspan>
        <tspan x="210" dy="34" font-weight="normal">on router E</tspan>
      </text>
    </g>

    
    <line x1="405" y1="290" x2="405" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="node-step2">
      <rect x="70" y="320" width="670" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(86, 342)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="22" cy="22" r="16" />
        <line x1="34" y1="34" x2="48" y2="48" />
        <circle cx="22" cy="22" r="7" stroke-dasharray="3 3" />
      </g>
      
      <circle cx="170" cy="367" r="22" fill="#207448" />
      <text x="170" y="375" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">2</text>
      
      <text x="210" y="356" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
        correlation is a lead,
        <tspan x="210" dy="32">not a proof</tspan>
      </text>
    </g>

    
    <line x1="405" y1="415" x2="405" y2="443" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="node-step3">
      <rect x="70" y="445" width="670" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(86, 495)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="10" y1="12" x2="44" y2="12" />
        <line x1="10" y1="27" x2="44" y2="27" />
        <line x1="10" y1="42" x2="44" y2="42" />
        <circle cx="20" cy="12" r="5" fill="#e8f1ea" />
        <circle cx="36" cy="27" r="5" fill="#e8f1ea" />
        <circle cx="16" cy="42" r="5" fill="#e8f1ea" />
      </g>
      
      <circle cx="170" cy="522" r="22" fill="#207448" />
      <text x="170" y="530" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">3</text>
      
      <text x="210" y="480" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
        reproduce the trigger on purpose:
        <tspan x="210" dy="34" font-weight="normal">flap the same link, or replay the same</tspan>
        <tspan x="210" dy="34" font-weight="normal">traffic, on a quiet device; change one</tspan>
        <tspan x="210" dy="34" font-weight="normal">variable, hold the others constant</tspan>
      </text>
    </g>

    
    <line x1="405" y1="600" x2="405" y2="628" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="node-decision">
      <rect x="140" y="630" width="530" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(160, 642)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 25 4 L 46 25 L 25 46 L 4 25 Z" />
        <circle cx="25" cy="25" r="4" fill="#207448" />
      </g>
      
      <circle cx="240" cy="667" r="22" fill="#207448" />
      <text x="240" y="675" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">4</text>
      
      <text x="280" y="676" font-size="26" font-weight="bold" fill="#207448" font-family="sans-serif">does the effect follow?</text>
    </g>

    
    <line x1="200" y1="705" x2="200" y2="740" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

    
    <line x1="530" y1="705" x2="530" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="node-yes">
      <rect x="70" y="745" width="245" height="170" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(90, 762)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 6 44 L 46 44" />
        <path d="M 16 44 L 26 26 L 36 44 Z" />
        <line x1="10" y1="34" x2="44" y2="10" />
        <circle cx="44" cy="10" r="4" fill="#db8129" />
      </g>
      
      <text x="90" y="835" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
        yes: you have
        <tspan x="90" dy="32">a lever</tspan>
        <tspan x="90" dy="32">(a cause)</tspan>
      </text>
    </g>

    
    <g id="node-no">
      <rect x="330" y="745" width="410" height="170" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(346, 762)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="26" cy="26" r="20" />
        <line x1="16" y1="16" x2="36" y2="36" />
        <line x1="36" y1="16" x2="16" y2="36" />
      </g>
      
      <text x="346" y="832" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
        no: coincidence, or a
        <tspan x="346" dy="28" font-weight="normal">symptom of a deeper cause;</tspan>
        <tspan x="346" dy="28" font-weight="normal">you saved a change to the</tspan>
        <tspan x="346" dy="28" font-weight="normal">wrong component</tspan>
      </text>
    </g>

    
    <g id="node-note">
      <rect x="70" y="930" width="670" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" />
      
      <g transform="translate(90, 980)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="16" cy="16" r="10" />
        <circle cx="38" cy="16" r="10" />
        <circle cx="27" cy="36" r="10" />
        <line x1="21" y1="24" x2="33" y2="24" />
      </g>
      
      <text x="160" y="970" font-size="24" fill="#303a36" font-family="sans-serif">
        reality is messier: causes interact
        <tspan x="160" dy="32">and some cannot be reproduced; then</tspan>
        <tspan x="160" dy="32">accept a correlation and try changes</tspan>
        <tspan x="160" dy="32">in order of safety and likelihood</tspan>
      </text>
    </g>
  </g>

  
  <g id="panel-simplify">
    <rect x="830" y="95" width="730" height="1015" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="860" y="142" font-size="32" font-weight="bold" fill="#207448" font-family="sans-serif">Simplify before testing</text>

    
    <g id="node-simplify-action">
      <rect x="860" y="165" width="670" height="245" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(880, 255)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 6 8 L 46 8 L 31 28 L 31 46 L 21 40 L 21 28 Z" />
        <line x1="38" y1="36" x2="48" y2="36" stroke-dasharray="3 3" />
      </g>
      
      <text x="955" y="200" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">
        remove components until the problem
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">goes away or only a minimal set</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">remains: disable ECMP to one path,</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">drain a spine, turn off an optional</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">feature, shift traffic to a single</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">rail, bypass the load balancer, test</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">on loopback or a namespace</tspan>
      </text>
    </g>

    
    <g id="node-reading">
      <rect x="860" y="425" width="670" height="245" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(880, 515)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 12 26 A 16 16 0 1 1 28 42" />
        <polyline points="20 42 28 42 28 34" />
        <circle cx="26" cy="26" r="6" />
      </g>
      
      <text x="955" y="460" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">
        problem gone early: two suspects,
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">the removed component or a positive</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">feedback loop or control-plane state</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">velocity; add components back one</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">at a time until the problem returns;</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">that is a built-in manipulation</tspan>
        <tspan x="955" dy="28" font-weight="normal" fill="#303a36">test</tspan>
      </text>
    </g>

    
    <g id="node-rack-example">
      <rect x="860" y="685" width="670" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(880, 770)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="4" y="6" width="44" height="40" rx="4" />
        <line x1="4" y1="18" x2="48" y2="18" />
        <line x1="4" y1="30" x2="48" y2="30" />
        <circle cx="10" cy="12" r="2" fill="#207448" />
        <circle cx="10" cy="24" r="2" fill="#207448" />
        <circle cx="10" cy="36" r="2" fill="#207448" />
      </g>
      
      <text x="955" y="725" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">
        remove the firewall from a path with
        <tspan x="955" dy="32" font-weight="normal" fill="#303a36">several uplinks and a bonded pair:</tspan>
        <tspan x="955" dy="32" font-weight="normal" fill="#303a36">if the problem vanishes the firewall</tspan>
        <tspan x="955" dy="32" font-weight="normal" fill="#303a36">is the suspect; put it back and</tspan>
        <tspan x="955" dy="32" font-weight="normal" fill="#303a36">watch it return</tspan>
      </text>
    </g>

    
    <g id="node-safety-strip">
      <rect x="860" y="930" width="670" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(880, 975)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 26 4 L 46 12 L 46 26 C 46 38 26 46 26 46 C 26 46 6 38 6 26 L 6 12 Z" />
        <polyline points="16 25 23 32 36 18" />
      </g>
      
      <text x="955" y="980" font-size="26" font-weight="bold" fill="#207448" font-family="sans-serif">
        drain rather than cut, under
        <tspan x="955" dy="34">change control, and restore</tspan>
        <tspan x="955" dy="34">what you removed</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="55" rx="8" fill="#207448" />
    <text x="800" y="1161" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">Correlation is cheap and causation costs a test</text>
  </g>
</svg>