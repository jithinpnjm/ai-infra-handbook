<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1390" width="1600" height="1390" style="background-color: #f5f8f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Manipulate and simplify: from a lead to a cause</title>
  <desc>Visual infographic explaining the scientific troubleshooting methodology: manipulation flow and simplification before testing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <text x="800" y="58" text-anchor="middle" font-size="44" font-weight="bold" fill="#303a36">Manipulate and simplify: from a lead to a cause</text>

  
  <rect x="50" y="90" width="730" height="1175" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="80" y="138" font-size="32" font-weight="bold" fill="#207448">Manipulation</text>

  
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="670" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 32)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="8" width="48" height="40" rx="6" />
      <path d="M 8 28 L 18 28 L 24 16 L 30 40 L 36 28 L 40 28" />
    </g>
    <text x="88" y="48" font-size="24" font-weight="bold" fill="#303a36">Symptom coincides with an event:</text>
    <text x="88" y="85" font-size="24" fill="#303a36">jitter starts every time SPF runs on router E</text>
  </g>

  
  <path d="M 415 280 L 415 315" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="670" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(22, 22)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="20" cy="20" r="14" />
      <line x1="30" y1="30" x2="44" y2="44" stroke-linecap="round" stroke-width="4" />
    </g>
    <text x="88" y="56" font-size="24" font-weight="bold" fill="#303a36">correlation is a lead, not a proof</text>
  </g>

  
  <path d="M 415 415 L 415 450" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(80, 455)">
    <rect x="0" y="0" width="670" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 60)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="8" y1="12" x2="44" y2="12" />
      <circle cx="20" cy="12" r="5" fill="#ffffff" />
      <line x1="8" y1="28" x2="44" y2="28" />
      <circle cx="34" cy="28" r="5" fill="#ffffff" />
      <line x1="8" y1="44" x2="44" y2="44" />
      <circle cx="16" cy="44" r="5" fill="#ffffff" />
    </g>
    <text x="88" y="42" font-size="24" font-weight="bold" fill="#303a36">reproduce the trigger on purpose:</text>
    <text x="88" y="78" font-size="24" fill="#303a36">flap the same link, or replay the same traffic, on a</text>
    <text x="88" y="114" font-size="24" fill="#303a36">quiet device; change one variable, hold the others</text>
    <text x="88" y="150" font-size="24" fill="#303a36">constant</text>
  </g>

  
  <path d="M 415 640 L 415 675" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(210, 680)">
    <rect x="0" y="0" width="410" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="205" y="40" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">does the effect follow?</text>
  </g>

  
  <path d="M 310 740 L 310 765 L 235 765 L 235 790" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <path d="M 520 740 L 520 765 L 595 765 L 595 790" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(80, 795)">
    <rect x="0" y="0" width="310" height="235" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(20, 24)" stroke="#db8129" stroke-width="3" fill="none">
      <line x1="10" y1="44" x2="38" y2="12" stroke-linecap="round" stroke-width="4" />
      <circle cx="38" cy="12" r="6" fill="#db8129" />
      <path d="M 6 46 C 14 40, 24 40, 32 46" />
    </g>
    <text x="75" y="56" font-size="24" font-weight="bold" fill="#db8129">yes:</text>
    <text x="24" y="115" font-size="24" font-weight="bold" fill="#303a36">you have a lever</text>
    <text x="24" y="155" font-size="24" font-weight="bold" fill="#303a36">(a cause)</text>
  </g>

  
  <g transform="translate(410, 795)">
    <rect x="0" y="0" width="340" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="20" y="38" font-size="24" font-weight="bold" fill="#303a36">no:</text>
    <text x="62" y="38" font-size="24" fill="#303a36">coincidence, or a</text>
    <text x="20" y="74" font-size="24" fill="#303a36">symptom of a deeper</text>
    <text x="20" y="110" font-size="24" fill="#303a36">cause; you saved a</text>
    <text x="20" y="146" font-size="24" fill="#303a36">change to the wrong</text>
    <text x="20" y="182" font-size="24" fill="#303a36">component</text>
  </g>

  
  <path d="M 415 1030 L 415 1060" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(80, 1065)">
    <rect x="0" y="0" width="670" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
    <text x="24" y="40" font-size="24" font-weight="bold" fill="#303a36">reality is messier:</text>
    <text x="235" y="40" font-size="24" fill="#303a36">causes interact and some</text>
    <text x="24" y="78" font-size="24" fill="#303a36">cannot be reproduced; then accept a correlation and</text>
    <text x="24" y="116" font-size="24" fill="#303a36">try changes in order of safety and likelihood</text>
  </g>

  
  <rect x="820" y="90" width="730" height="1175" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="850" y="138" font-size="32" font-weight="bold" fill="#207448">Simplify before testing</text>

  
  <g transform="translate(850, 160)">
    <rect x="0" y="0" width="670" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 30)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="8" width="40" height="10" rx="2" />
      <rect x="10" y="24" width="28" height="10" rx="2" />
      <rect x="16" y="40" width="16" height="10" rx="2" />
    </g>
    <text x="80" y="44" font-size="24" font-weight="bold" fill="#303a36">remove components until the problem</text>
    <text x="80" y="80" font-size="24" font-weight="bold" fill="#303a36">goes away or only a minimal set remains:</text>
    <text x="30" y="130" font-size="24" fill="#303a36">disable ECMP to one path, drain a spine,</text>
    <text x="30" y="168" font-size="24" fill="#303a36">turn off an optional feature, shift traffic to a single rail,</text>
    <text x="30" y="206" font-size="24" fill="#303a36">bypass the load balancer, test on loopback or a</text>
    <text x="30" y="244" font-size="24" fill="#303a36">namespace</text>
  </g>

  
  <path d="M 1185 440 L 1185 475" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(850, 480)">
    <rect x="0" y="0" width="670" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 30)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 10 28 A 18 18 0 1 1 28 46" />
      <polyline points="28 36 28 46 18 46" />
    </g>
    <text x="80" y="44" font-size="24" font-weight="bold" fill="#303a36">problem gone early:</text>
    <text x="315" y="44" font-size="24" fill="#303a36">two suspects, the removed</text>
    <text x="30" y="86" font-size="24" fill="#303a36">component or a positive feedback loop or control-plane</text>
    <text x="30" y="124" font-size="24" fill="#303a36">state velocity; add components back one at a time</text>
    <text x="30" y="162" font-size="24" fill="#303a36">until the problem returns; that is a built-in</text>
    <text x="30" y="200" font-size="24" fill="#303a36">manipulation test</text>
  </g>

  
  <g transform="translate(850, 795)">
    <rect x="0" y="0" width="670" height="95" rx="12" fill="#207448" />
    
    <g transform="translate(24, 22)" stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 22 4 L 4 12 L 4 28 C 4 38 22 48 22 48 C 22 48 40 38 40 28 L 40 12 Z" />
    </g>
    <text x="75" y="42" font-size="24" font-weight="bold" fill="#ffffff">drain rather than cut, under change control,</text>
    <text x="75" y="76" font-size="24" font-weight="bold" fill="#ffffff">and restore what you removed</text>
  </g>

  
  <g transform="translate(850, 920)">
    <rect x="0" y="0" width="670" height="320" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 30)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="6" y="8" width="40" height="36" rx="4" />
      <line x1="6" y1="20" x2="46" y2="20" />
      <line x1="6" y1="32" x2="46" y2="32" />
      <line x1="26" y1="8" x2="26" y2="20" />
      <line x1="16" y1="20" x2="16" y2="32" />
      <line x1="36" y1="20" x2="36" y2="32" />
    </g>
    <text x="80" y="44" font-size="24" font-weight="bold" fill="#303a36">remove the firewall from a path with</text>
    <text x="80" y="82" font-size="24" font-weight="bold" fill="#303a36">several uplinks and a bonded pair:</text>
    <text x="30" y="140" font-size="24" fill="#303a36">if the problem vanishes the firewall is the</text>
    <text x="30" y="182" font-size="24" fill="#303a36">suspect; put it back and watch it return</text>
  </g>

  
  <g transform="translate(50, 1290)">
    <rect x="0" y="0" width="1500" height="65" rx="12" fill="#207448" />
    <text x="750" y="42" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Correlation is cheap and causation costs a test</text>
  </g>
</svg>