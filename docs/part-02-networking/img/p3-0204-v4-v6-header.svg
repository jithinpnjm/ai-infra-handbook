<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>IPv4 and IPv6 headers side by side: what moved, what went away</title>
  <desc>A side-by-side technical comparison of IPv4 and IPv6 header fields, mapped transitions, and removed elements.</desc>

  <defs>
    <style>
      .bg { fill: #f5f8f5; }
      .title { font-family: sans-serif; font-size: 48px; font-weight: bold; fill: #207448; }
      .col-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #ffffff; }
      .box-bg { fill: #ffffff; stroke: #207448; stroke-width: 2.5; rx: 8px; }
      .box-bg-light { fill: #e8f1ea; stroke: #207448; stroke-width: 2; rx: 8px; }
      .box-crossed { fill: #fff7f0; stroke: #db8129; stroke-width: 2.5; stroke-dasharray: 6 4; rx: 8px; }
      .text-reg { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .text-orange { font-family: sans-serif; font-size: 24px; fill: #db8129; }
      .arrow-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #207448; text-anchor: middle; }
      .arrow-line { stroke: #207448; stroke-width: 3.5; fill: none; }
      .pill-bg { fill: #ffffff; stroke: #207448; stroke-width: 2; rx: 12px; }
      .strike-line { stroke: #db8129; stroke-width: 3; }
      .bottom-text { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1480" class="bg" />

  
  <text x="800" y="65" class="title" text-anchor="middle">IPv4 and IPv6 headers side by side: what moved, what went away</text>

  
  <rect x="40" y="95" width="600" height="60" rx="8" fill="#207448" />
  <text x="340" y="137" class="col-title" text-anchor="middle">IPv4 header, 20 bytes minimum</text>

  
  <rect x="960" y="95" width="600" height="60" rx="8" fill="#207448" />
  <text x="1260" y="137" class="col-title" text-anchor="middle">IPv6 header, 40 bytes fixed</text>

  
  <rect x="40" y="175" width="600" height="64" class="box-bg" />
  <path d="M 60 195 h 24 v 24 h -24 z" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="215" class="text-reg">Version 4</text>

  
  <rect x="960" y="175" width="600" height="64" class="box-bg" />
  <path d="M 980 195 h 24 v 24 h -24 z" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1016" y="215" class="text-reg">Version 4 bits</text>

  
  <rect x="40" y="255" width="600" height="74" class="box-bg" />
  <path d="M 60 278 l 12 -12 l 12 12 m -12 -12 v 28" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="301" class="text-reg">IHL: header length in 32-bit words, 5 means 20 bytes</text>

  
  <rect x="40" y="345" width="600" height="64" class="box-bg" id="ipv4-dscp" />
  <circle cx="72" cy="377" r="12" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="385" class="text-reg">DSCP (6 bits) and ECN (2 bits)</text>

  
  <rect x="960" y="345" width="600" height="64" class="box-bg" id="ipv6-tc" />
  <circle cx="992" cy="377" r="12" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1016" y="385" class="text-reg">Traffic Class 8 bits = DSCP 6 + ECN 2</text>

  
  <rect x="40" y="425" width="600" height="64" class="box-bg" />
  <path d="M 60 457 h 24 m -24 -8 v 16 m 24 -16 v 16" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="465" class="text-reg">Total Length up to 65,535</text>

  
  <rect x="960" y="425" width="600" height="106" class="box-bg" />
  <path d="M 60 457 h 24" fill="none" stroke="none" />
  <path d="M 980 460 c 8 -16 16 16 24 0" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1016" y="460" class="text-reg">
    <tspan x="1016" dy="0">Flow Label 20 bits: helps routers keep a flow</tspan>
    <tspan x="1016" dy="34">on one path when ECMP spreads traffic</tspan>
  </text>

  
  <rect x="40" y="505" width="600" height="136" class="box-bg" />
  <path d="M 60 550 l 8 -8 l 8 8 l 8 -8" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="542" class="text-reg">
    <tspan x="96" dy="0">Identification, Flags (DF, MF), Fragment Offset:</tspan>
    <tspan x="96" dy="34">fragmentation lives in the base header; routers</tspan>
    <tspan x="96" dy="34">may fragment unless DF is set</tspan>
  </text>

  
  <rect x="960" y="547" width="600" height="64" class="box-bg" />
  <path d="M 980 579 h 24 m -24 -8 v 16 m 24 -16 v 16" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1016" y="587" class="text-reg">Payload Length 16</text>

  
  <rect x="40" y="657" width="600" height="106" class="box-bg" id="ipv4-ttl" />
  <circle cx="72" cy="700" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 72 692 v 8 l 6 4" fill="none" stroke="#207448" stroke-width="2.5" />
  <text x="96" y="694" class="text-reg">
    <tspan x="96" dy="0">TTL: drops by one per router, at 0 the router</tspan>
    <tspan x="96" dy="34">drops the packet and sends ICMP Time Exceeded</tspan>
  </text>

  
  <rect x="960" y="657" width="600" height="84" class="box-bg" id="ipv6-hoplimit" />
  <circle cx="992" cy="699" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 992 691 v 8 l 6 4" fill="none" stroke="#207448" stroke-width="2.5" />
  <text x="1016" y="707" class="text-reg">Hop Limit 8: plays the role of the TTL</text>

  
  <rect x="40" y="779" width="600" height="84" class="box-bg" id="ipv4-protocol" />
  <path d="M 60 821 h 24 m -12 -12 v 24" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="821" class="text-reg">
    <tspan x="96" dy="0">Protocol: 6 TCP, 17 UDP, 1 ICMP, 47 GRE,</tspan>
    <tspan x="96" dy="32">50 ESP, 89 OSPF</tspan>
  </text>

  
  <rect x="960" y="779" width="600" height="106" class="box-bg" id="ipv6-nextheader" />
  <path d="M 980 832 h 20 m -6 -6 l 6 6 l -6 6" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1016" y="816" class="text-reg">
    <tspan x="1016" dy="0">Next Header 8: extension headers chained</tspan>
    <tspan x="1016" dy="34">(hop-by-hop, routing, fragment,</tspan>
    <tspan x="1016" dy="34">destination options, AH, ESP)</tspan>
  </text>

  
  <rect x="40" y="879" width="600" height="84" class="box-bg" />
  <path d="M 62 921 l 7 7 l 15 -15" fill="none" stroke="#207448" stroke-width="3" />
  <text x="96" y="913" class="text-reg">
    <tspan x="96" dy="0">Header checksum: recomputed at every hop</tspan>
    <tspan x="96" dy="32">because the TTL changes</tspan>
  </text>

  
  <rect x="40" y="979" width="600" height="74" class="box-bg" />
  <circle cx="68" cy="1016" r="6" fill="#207448" />
  <circle cx="84" cy="1016" r="6" fill="#207448" />
  <text x="96" y="1025" class="text-reg">source and destination 32-bit addresses</text>

  
  <rect x="960" y="901" width="600" height="74" class="box-bg" />
  <circle cx="984" cy="938" r="6" fill="#207448" />
  <circle cx="1000" cy="938" r="6" fill="#207448" />
  <text x="1016" y="947" class="text-reg">source and destination 128-bit addresses</text>

  
  <rect x="40" y="1069" width="600" height="64" class="box-bg" />
  <text x="96" y="1109" class="text-reg">options (rare)</text>

  
  <g id="crossed-checksum">
    <rect x="960" y="991" width="600" height="96" class="box-crossed" />
    <path d="M 975 1005 l 18 18 m 0 -18 l -18 18" stroke="#db8129" stroke-width="3" />
    <text x="1010" y="1031" class="text-orange">
      <tspan x="1010" dy="0">no header checksum (link and transport</tspan>
      <tspan x="1010" dy="34">layers cover errors)</tspan>
    </text>
    <line x1="964" y1="1083" x2="1556" y2="995" class="strike-line" />
  </g>

  
  <g id="crossed-fragmentation">
    <rect x="960" y="1103" width="600" height="136" class="box-crossed" />
    <path d="M 975 1120 l 18 18 m 0 -18 l -18 18" stroke="#db8129" stroke-width="3" />
    <text x="1010" y="1143" class="text-orange">
      <tspan x="1010" dy="0">no fragmentation fields in the base header:</tspan>
      <tspan x="1010" dy="34">only the source host may fragment, through</tspan>
      <tspan x="1010" dy="34">an extension header; routers never do</tspan>
    </text>
    <line x1="964" y1="1235" x2="1556" y2="1107" class="strike-line" />
  </g>

  

  
  <path d="M 640 377 L 960 377" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="682" y="353" width="276" height="46" class="pill-bg" />
  <text x="820" y="384" class="arrow-text">DSCP+ECN to Traffic Class</text>

  
  <path d="M 640 699 L 960 699" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="715" y="675" width="210" height="46" class="pill-bg" />
  <text x="820" y="706" class="arrow-text">TTL to Hop Limit</text>

  
  <path d="M 640 821 L 960 821" class="arrow-line" marker-end="url(#arrow)" />
  <rect x="680" y="797" width="280" height="46" class="pill-bg" />
  <text x="820" y="828" class="arrow-text">Protocol to Next Header</text>

  
  <rect x="40" y="1370" width="1520" height="74" rx="8" fill="#207448" />
  <text x="800" y="1416" class="bottom-text">A fixed header keeps hardware parsing simple, and extension headers keep the design flexible</text>
</svg>