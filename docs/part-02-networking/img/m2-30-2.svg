<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>Connectivity: "A cannot reach B"</title>
  <desc>Troubleshooting flowchart for diagnosing network connectivity issues when host A cannot reach host B.</desc>

  <defs>
    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14281e" flood-opacity="0.08" />
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1280" fill="#f5f8f5" />

  
  <text x="800" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Connectivity: "A cannot reach B"</text>

  

  
  <g filter="url(#card-shadow)">
    <rect x="530" y="80" width="540" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="575" cy="117" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 575 104 L 575 120 M 575 126 L 575 128" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <text x="615" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A cannot reach B (service X)</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="540" y="200" width="520" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="585" cy="248" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <text x="585" y="257" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">?</text>
    <text x="625" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Same on all clients,</text>
    <text x="625" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">or only A?</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="50" y="196" width="410" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="95" cy="240" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 95 216 L 95 222 M 95 258 L 95 264 M 71 240 L 77 240 M 113 240 L 119 240" stroke="#207448" stroke-width="3" />
    <text x="125" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">A's local config:</text>
    <text x="72" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">IP, mask, gateway, DNS, proxy,</text>
    <text x="72" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">firewall, VPN, route (<tspan font-family="ui-monospace, monospace">ip route get</tspan>)</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="530" y="340" width="540" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="555" y="364" width="42" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="563" y1="380" x2="589" y2="380" stroke="#207448" stroke-width="2.5" />
    <line x1="563" y1="394" x2="577" y2="394" stroke="#207448" stroke-width="2.5" />
    <text x="615" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">B up and listening?</text>
    <text x="615" y="412" font-family="ui-monospace, monospace" font-size="24" fill="#207448">ss -tlnp on B; local curl</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1140" y="332" width="410" height="126" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <circle cx="1180" cy="372" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1180 362 L 1180 374 M 1180 380 L 1180 382" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="1210" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Service/host problem:</text>
    <text x="1162" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">process, bind address,</text>
    <text x="1162" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">resources, logs</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="540" y="482" width="520" height="92" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="582" cy="528" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 570 528 L 576 528 L 580 518 L 585 538 L 590 528 L 595 528" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="618" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">ping/nc from A</text>
    <text x="618" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">to B:port</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="50" y="480" width="410" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <rect x="74" y="504" width="38" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="74" y1="514" x2="112" y2="514" stroke="#207448" stroke-width="2.5" />
    <text x="124" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Layer 7:</text>
    <text x="72" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">DNS, TLS, auth, app config,</text>
    <text x="72" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">proxy, MTU for large payloads</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1140" y="482" width="410" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 1180 508 L 1198 516 L 1198 534 C 1198 546 1180 554 1180 554 C 1180 554 1162 546 1162 534 L 1162 516 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="1173" y1="524" x2="1187" y2="538" stroke="#207448" stroke-width="2.5" />
    <text x="1215" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Firewall reject or</text>
    <text x="1215" y="557" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">wrong port/address</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="360" y="640" width="880" height="106" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="405" cy="693" r="22" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 395 693 L 415 693 M 407 685 L 415 693 L 407 701" fill="none" stroke="#db8129" stroke-width="3" />
    <text x="445" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Half-split the path: traceroute/mtr;</text>
    <text x="445" y="718" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">capture at midpoint and both ends</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="630" y="796" width="340" height="84" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="670" cy="838" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <text x="670" y="846" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">?</text>
    <text x="702" y="848" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">SYN reaches B?</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="50" y="990" width="460" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <rect x="80" y="1016" width="38" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="88" y1="1046" x2="110" y2="1024" stroke="#207448" stroke-width="3" />
    <text x="130" y="1042" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Drop between:</text>
    <text x="80" y="1084" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">ACL, security group,</text>
    <text x="80" y="1120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">routing, VLAN, ARP,</text>
    <text x="80" y="1156" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">MTU of the SYN</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="570" y="990" width="460" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <rect x="600" y="1016" width="38" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 610 1016 L 610 1008 C 610 1002 628 1002 628 1008 L 628 1016" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="650" y="1042" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">B-side firewall/</text>
    <text x="600" y="1084" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">listen queue/</text>
    <text x="600" y="1120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">conntrack/</text>
    <text x="600" y="1156" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rp_filter</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1090" y="990" width="460" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <path d="M 1120 1044 C 1120 1022 1146 1022 1146 1044 C 1146 1060 1128 1060 1128 1048" fill="none" stroke="#207448" stroke-width="3" />
    <text x="1165" y="1042" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Return path:</text>
    <text x="1120" y="1084" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">asymmetric route, NAT,</text>
    <text x="1120" y="1120" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">stateful FW,</text>
    <text x="1120" y="1156" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">policy routing</text>
  </g>

  

  
  <path d="M 800 154 L 800 198" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 540 248 L 462 248" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="470" y="222" width="62" height="32" rx="6" fill="#e8f1ea" />
  <text x="501" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">only A</text>

  
  <path d="M 800 296 L 800 338" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="808" y="302" width="46" height="30" rx="6" fill="#e8f1ea" />
  <text x="831" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">all</text>

  
  <path d="M 1070 388 L 1138 388" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1080" y="362" width="46" height="32" rx="6" fill="#e8f1ea" />
  <text x="1103" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <path d="M 800 436 L 800 480" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="808" y="444" width="54" height="30" rx="6" fill="#e8f1ea" />
  <text x="835" y="466" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

  
  <path d="M 540 528 L 462 528" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="466" y="502" width="70" height="32" rx="6" fill="#e8f1ea" />
  <text x="501" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">works</text>

  
  <path d="M 1060 528 L 1138 528" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1066" y="492" width="168" height="32" rx="6" fill="#e8f1ea" />
  <text x="1150" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">refused (RST)</text>

  
  <path d="M 800 574 L 800 638" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <rect x="810" y="590" width="102" height="32" rx="6" fill="#fdf0e6" stroke="#db8129" stroke-width="1.5" />
  <text x="861" y="613" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">timeout</text>

  
  <path d="M 800 746 L 800 794" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 630 838 L 280 838 L 280 988" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="256" y="890" width="48" height="32" rx="6" fill="#e8f1ea" />
  <text x="280" y="913" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no</text>

  
  <path d="M 800 880 L 800 988" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="670" y="920" width="260" height="32" rx="6" fill="#e8f1ea" />
  <text x="800" y="943" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes, no SYN-ACK back</text>

  
  <path d="M 970 838 L 1320 838 L 1320 988" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="1120" y="890" width="400" height="32" rx="6" fill="#e8f1ea" />
  <text x="1320" y="913" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">SYN-ACK leaves B, not seen by A</text>

</svg>