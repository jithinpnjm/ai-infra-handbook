<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The OSI model (7 layers)</title>
  <desc>Visual diagram of the 7-layer OSI model from Application to Physical layer, showing protocol functions and groupings.</desc>

  <rect width="1600" height="1100" fill="#f5f8f5"/>

  <text x="80" y="72" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The OSI model (7 layers)</text>

  
  <rect x="80" y="130" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 147)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="6" width="48" height="44" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="12" r="2" fill="#207448" stroke="none"/>
    <circle cx="19" cy="12" r="2" fill="#207448" stroke="none"/>
    <circle cx="26" cy="12" r="2" fill="#207448" stroke="none"/>
    <path d="M14 28 h16 M14 38 h24"/>
  </g>
  <text x="195" y="186" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">7 Application: </tspan><tspan font-size="24">user-facing protocols</tspan></text>

  
  <line x1="800" y1="220" x2="800" y2="265" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="265" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 282)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 24 V16 C18 10 38 10 38 16 V24"/>
    <rect x="10" y="24" width="36" height="26" rx="5"/>
    <circle cx="28" cy="34" r="3" fill="#207448" stroke="none"/>
    <line x1="28" y1="36" x2="28" y2="43"/>
  </g>
  <text x="195" y="321" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">6 Presentation: </tspan><tspan font-size="24">encoding, encryption, compression</tspan></text>

  
  <line x1="800" y1="355" x2="800" y2="400" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="400" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 417)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M8 10 h24 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-10 l-8 6 v-6 h-6 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z"/>
    <path d="M26 32 h16 a4 4 0 0 0 4 -4 v-8 M46 32 l4 4 v-4"/>
  </g>
  <text x="195" y="456" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">5 Session: </tspan><tspan font-size="24">dialogue/session management</tspan></text>

  
  <line x1="800" y1="490" x2="800" y2="535" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="535" width="1440" height="90" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(110, 552)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="14" width="14" height="28" rx="3"/>
    <rect x="38" y="14" width="14" height="28" rx="3"/>
    <path d="M22 23 h10 m-3 -3 l3 3 l-3 3"/>
    <path d="M34 33 h-10 m3 -3 l-3 3 l3 3"/>
  </g>
  <text x="195" y="591" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold" fill="#db8129">4 Transport: </tspan><tspan font-size="24">end-to-end delivery (TCP, UDP)</tspan></text>

  
  <line x1="800" y1="625" x2="800" y2="670" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="670" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 687)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="28" r="22"/>
    <line x1="16" y1="28" x2="40" y2="28"/>
    <path d="M35 23 l5 5 l-5 5"/>
    <path d="M21 33 l-5 -5 l5 -5"/>
    <line x1="28" y1="16" x2="28" y2="40"/>
    <path d="M23 21 l5 -5 l5 5"/>
    <path d="M33 35 l-5 5 l-5 -5"/>
  </g>
  <text x="195" y="726" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">3 Network: </tspan><tspan font-size="24">addressing and routing (IP)</tspan></text>

  
  <line x1="800" y1="760" x2="800" y2="805" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="805" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 822)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="12" width="44" height="32" rx="6"/>
    <line x1="14" y1="22" x2="36" y2="22"/>
    <path d="M31 18 l5 4 l-5 4"/>
    <line x1="36" y1="34" x2="14" y2="34"/>
    <path d="M19 30 l-5 4 l5 4"/>
  </g>
  <text x="195" y="861" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">2 Data link: </tspan><tspan font-size="24">frames on one link, MAC addresses (Ethernet)</tspan></text>

  
  <line x1="800" y1="895" x2="800" y2="940" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="80" y="940" width="1440" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(110, 957)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M6 28 h6 l5 -14 l8 28 l8 -28 l8 28 l5 -14 h6"/>
    <line x1="4" y1="46" x2="52" y2="46" stroke-dasharray="4,4"/>
  </g>
  <text x="195" y="996" font-family="sans-serif" fill="#303a36"><tspan font-size="30" font-weight="bold">1 Physical: </tspan><tspan font-size="24">signals on the medium (cables, optics, radio)</tspan></text>
</svg>