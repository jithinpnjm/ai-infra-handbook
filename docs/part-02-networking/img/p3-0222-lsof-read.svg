<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading lsof -i: who is listening and who is connected</title>
  <desc>Visual explanation of lsof -i output rows, network socket states, listening services, client connections, and fast lookup flags.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading lsof -i: who is listening and who is connected</text>

  

  
  <g id="row-rpcbind">
    <rect x="40" y="100" width="940" height="180" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(62, 162)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 4 L 48 12 C 48 34 28 50 28 50 C 28 50 8 34 8 12 Z"/>
      <line x1="28" y1="20" x2="28" y2="30"/>
      <circle cx="28" cy="38" r="2" fill="#db8129" stroke="none"/>
    </g>
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#db8129" x="140" y="142">rpcbind 700 root 8u IPv4 TCP *:sunrpc (LISTEN)</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="178">
      <tspan x="140" dy="0">an old-style RPC service on TCP and UDP 111, a common</tspan>
      <tspan x="140" dy="32">unwanted exposure, disable it if you do not need NFS v3</tspan>
      <tspan x="140" dy="32">or NIS</tspan>
    </text>
  </g>

  
  <g id="row-avahi">
    <rect x="40" y="305" width="940" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 345)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="28" y1="24" x2="28" y2="50"/>
      <circle cx="28" cy="20" r="4"/>
      <path d="M 16 12 A 18 18 0 0 1 40 12"/>
      <path d="M 8 4 A 28 28 0 0 1 48 4"/>
      <line x1="16" y1="50" x2="40" y2="50"/>
    </g>
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="140" y="355">avahi-dae 872 avahi 13u IPv4 UDP *:mdns</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="398">multicast DNS</text>
  </g>

  
  <g id="row-cupsd">
    <rect x="40" y="465" width="940" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 510)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 14 20 L 14 6 L 42 6 L 42 20"/>
      <rect x="8" y="20" width="40" height="20" rx="3"/>
      <path d="M 14 32 L 14 48 L 42 48 L 42 32"/>
      <circle cx="38" cy="26" r="2" fill="#207448" stroke="none"/>
    </g>
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="140" y="515">cupsd 1010 root 9u IPv6 TCP ip6-localhost:ipp (LISTEN)</text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="565">an IPv6-ready printer service on the local host only</text>
  </g>

  
  <g id="row-ssh">
    <rect x="40" y="635" width="940" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 700)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="8" width="44" height="38" rx="4"/>
      <polyline points="14,20 22,27 14,34"/>
      <line x1="26" y1="34" x2="38" y2="34"/>
    </g>
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="140" y="675">
      <tspan x="140" dy="0">ssh 14366 juser 3u IPv4 TCP thishost.local:55457-&gt;</tspan>
      <tspan x="140" dy="30">somehost.example.com:ssh (ESTABLISHED)</tspan>
    </text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="750">
      <tspan x="140" dy="0">a client connection: local ephemeral port to a well-known</tspan>
      <tspan x="140" dy="30">remote port</tspan>
    </text>
  </g>

  
  <g id="row-chromium">
    <rect x="40" y="845" width="940" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 895)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="22"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <ellipse cx="28" cy="28" rx="12" ry="22"/>
    </g>
    
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="140" y="885">
      <tspan x="140" dy="0">chromium- 26534 juser 8r IPv4 TCP thishost.local:41551-&gt;</tspan>
      <tspan x="140" dy="30">anotherhost.example.com:https (ESTABLISHED)</tspan>
    </text>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="960">a secure web connection</text>
  </g>

  
  <g id="right-panel">
    
    <rect x="1000" y="100" width="560" height="900" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1025, 115)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="26,6 10,28 24,28 18,48 38,22 24,22"/>
    </g>
    
    <text x="1080" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Making it fast and useful</text>

    
    <rect x="1020" y="175" width="520" height="58" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text x="1040" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">-n skips hostname lookups</text>

    
    <rect x="1020" y="247" width="520" height="86" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text x="1040" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1040" dy="0">-P skips port-name lookups</tspan>
      <tspan x="1040" dy="30">in /etc/services</tspan>
    </text>

    
    <rect x="1020" y="347" width="520" height="58" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text x="1040" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">sudo lsof -n -i on a busy host</text>

    
    <rect x="1020" y="419" width="520" height="114" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text font-size="24" fill="#303a36" x="1040" y="452">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448" x="1040" dy="0">sudo lsof -iTCP -sTCP:LISTEN -nP:</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="30">which process listens</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="28">on which port</tspan>
    </text>

    
    <rect x="1020" y="547" width="520" height="86" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text font-size="24" fill="#303a36" x="1040" y="582">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448" x="1040" dy="0">sudo lsof -i :443 -nP:</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="30">who uses port 443</tspan>
    </text>

    
    <rect x="1020" y="647" width="520" height="86" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text font-size="24" fill="#303a36" x="1040" y="682">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448" x="1040" dy="0">sudo lsof -p &lt;pid&gt; -a -i -nP:</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="30">a process's network sockets</tspan>
    </text>

    
    <rect x="1020" y="747" width="520" height="114" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text font-size="24" fill="#303a36" x="1040" y="780">
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448" x="1040" dy="0">ss -tulpn:</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="30">listening TCP and UDP</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" x="1040" dy="28">with owning processes</tspan>
    </text>

    
    <rect x="1020" y="875" width="520" height="114" rx="8" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="1040" y="908">
      <tspan x="1040" dy="0">as a regular user you see</tspan>
      <tspan x="1040" dy="30">only your own processes, as root</tspan>
      <tspan x="1040" dy="28">the whole system</tspan>
    </text>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="1020" width="1520" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(62, 1038)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="8" y="14" width="40" height="26" rx="4"/>
      <line x1="16" y1="27" x2="22" y2="27"/>
      <line x1="28" y1="27" x2="34" y2="27"/>
      <circle cx="40" cy="27" r="2" fill="#207448" stroke="none"/>
    </g>
    
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="140" y="1056">
      <tspan font-weight="bold" fill="#207448">Rpcbind: the portmapper on TCP/UDP 111 maps RPC program numbers to ports;</tspan>
    </text>
    <text font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" x="140" y="1090">rpcinfo -p host lists the services</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="55" rx="8" fill="#207448"/>
    
    <g transform="translate(425, 1133)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polygon points="6,8 34,8 24,22 24,34 16,30 16,22"/>
    </g>
    <text x="475" y="1162" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Filter the output when you know the port you want</text>
  </g>
</svg>