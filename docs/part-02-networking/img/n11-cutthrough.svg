<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Store-and-forward versus cut-through</title>
  <desc>Two timelines of one frame through a switch</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#7ba389" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Store-and-forward versus cut-through</text>
  <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">Two timelines of one frame through a switch</text>

  
  <g id="store-and-forward-panel">
    <rect x="60" y="140" width="1480" height="360" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(90, 160)">
      <rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="28" x2="44" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="12" y1="38" x2="28" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <path d="M 34 37 L 39 42 L 48 31" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <text x="165" y="200" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Store-and-forward</text>

    
    <rect x="520" y="160" width="980" height="56" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="545" y="196" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">receive the whole frame, verify FCS, then forward</text>

    
    <g transform="translate(0, 0)">
      
      <line x1="180" y1="240" x2="1480" y2="240" stroke="#7ba389" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#axis-arrow)" />

      
      <rect x="180" y="255" width="110" height="36" rx="4" fill="#207448" stroke="#207448" />
      <rect x="294" y="255" width="410" height="36" rx="4" fill="#c3ded0" stroke="#207448" stroke-width="1.5" />
      <rect x="708" y="255" width="92" height="36" rx="4" fill="#88c09a" stroke="#207448" stroke-width="1.5" />

      
      <line x1="800" y1="245" x2="800" y2="385" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />

      
      <path d="M 800 273 C 815 273, 835 300, 835 330 L 835 338" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

      
      <rect x="850" y="322" width="110" height="36" rx="4" fill="#207448" stroke="#207448" />
      <rect x="964" y="322" width="410" height="36" rx="4" fill="#c3ded0" stroke="#207448" stroke-width="1.5" />
      <rect x="1378" y="322" width="92" height="36" rx="4" fill="#88c09a" stroke="#207448" stroke-width="1.5" />

      
      <line x1="180" y1="380" x2="850" y2="380" stroke="#207448" stroke-width="2" />
      <line x1="180" y1="372" x2="180" y2="388" stroke="#207448" stroke-width="2" />
      <line x1="850" y1="372" x2="850" y2="388" stroke="#207448" stroke-width="2" />
    </g>

    
    <rect x="90" y="420" width="1410" height="56" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="795" y="456" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">latency grows with frame size (9000-byte jumbo on 10 Gb/s needs 7.2 us to serialise)</text>
  </g>

  
  <g id="cut-through-panel">
    <rect x="60" y="540" width="1480" height="370" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(90, 560)">
      <rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 28 L 38 28 M 28 18 L 38 28 L 28 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="16" x2="26" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="16" y1="40" x2="26" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="165" y="600" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Cut-through</text>

    
    <rect x="390" y="560" width="1110" height="56" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="415" y="596" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">starts forwarding as soon as the destination header is read</text>

    
    <g transform="translate(0, 0)">
      
      <line x1="180" y1="635" x2="1480" y2="635" stroke="#7ba389" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#axis-arrow)" />

      
      <rect x="180" y="650" width="110" height="36" rx="4" fill="#207448" stroke="#207448" />
      <rect x="294" y="650" width="410" height="36" rx="4" fill="#c3ded0" stroke="#207448" stroke-width="1.5" />
      <rect x="708" y="650" width="92" height="36" rx="4" fill="#88c09a" stroke="#207448" stroke-width="1.5" />

      
      <line x1="290" y1="640" x2="290" y2="760" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />

      
      <path d="M 290 668 C 300 668, 308 685, 308 705 L 308 712" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

      
      <rect x="315" y="700" width="110" height="36" rx="4" fill="#207448" stroke="#207448" />
      <rect x="429" y="700" width="410" height="36" rx="4" fill="#c3ded0" stroke="#207448" stroke-width="1.5" />
      <rect x="843" y="700" width="92" height="36" rx="4" fill="#88c09a" stroke="#207448" stroke-width="1.5" />

      
      <line x1="180" y1="755" x2="315" y2="755" stroke="#207448" stroke-width="2" />
      <line x1="180" y1="748" x2="180" y2="762" stroke="#207448" stroke-width="2" />
      <line x1="315" y1="748" x2="315" y2="762" stroke="#207448" stroke-width="2" />
    </g>

    
    
    <rect x="90" y="805" width="620" height="84" rx="8" ry="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="120" y="840" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="120" dy="0">latency roughly constant,</tspan>
      <tspan x="120" dy="30">hundreds of nanoseconds</tspan>
    </text>

    
    <rect x="740" y="805" width="760" height="84" rx="8" ry="8" fill="#fff7f0" stroke="#db8129" stroke-width="2" />
    <g transform="translate(760, 827)">
      <path d="M 18 2 L 34 32 L 2 32 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
      <line x1="18" y1="12" x2="18" y2="21" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <circle cx="18" cy="27" r="1.5" fill="#db8129" />
    </g>
    <text x="815" y="840" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="815" dy="0">cost: corrupt frames may get through,</tspan>
      <tspan x="815" dy="30">the last hop's FCS check drops them</tspan>
    </text>
  </g>

  
  <g id="footer-section">
    <rect x="60" y="950" width="1480" height="140" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="1000" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">Serialization delay = frame bits / link rate</text>
    <text x="800" y="1052" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Note: port-to-port latency typically 300 ns to 1 us</text>
  </g>
</svg>