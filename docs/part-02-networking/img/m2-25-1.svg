    <path d="M 72 26 L 108 26 L 108 48 L 102 48 L 102 54 L 78 54 L 78 48 L 72 48 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="83" y1="32" x2="83" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="32" x2="90" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="97" y1="32" x2="97" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="98" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">eth0</text>
  </g>

  
  <g transform="translate(95, 530)" filter="url(#shadow)">
    <rect width="180" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <path d="M 72 26 L 108 26 L 108 48 L 102 48 L 102 54 L 78 54 L 78 48 L 72 48 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="83" y1="32" x2="83" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
