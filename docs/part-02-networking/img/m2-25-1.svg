    <text x="85" y="98" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">veth-c2</text>
  </g>

  
  <g transform="translate(625, 300)" filter="url(#shadow)">
    <rect width="290" height="200" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <path d="M 120 48 L 170 48 M 125 48 C 125 32, 145 32, 145 48 C 145 32, 165 32, 165 48" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="120" y1="48" x2="120" y2="56" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="145" y1="48" x2="145" y2="56" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="170" y1="48" x2="170" y2="56" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <text x="145" y="96" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">br0 10.10.0.1</text>
    <text x="145" y="136" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">(L2 bridge +</tspan>
      <tspan x="145" dy="30">L3 gateway)</tspan>
    </text>
  </g>

  
  <g transform="translate(975, 210)" filter="url(#shadow)">
    <rect width="360" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <path d="M 180 24 L 204 34 C 204 50, 194 62, 180 68 C 166 62, 156 50, 156 34 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 172 44 L 188 44 M 184 40 L 188 44 L 184 48" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="106" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
