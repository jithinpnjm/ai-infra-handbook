    <tspan x="150" y="206" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">netns c1</tspan>
    <tspan x="150" y="240" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">(10.10.0.11)</tspan>
  </text>

  
  <rect x="65" y="265" width="170" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  
