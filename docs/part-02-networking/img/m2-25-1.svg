<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>DNS inside: per-namespace resolv.conf under /etc/netns/&lt;ns&gt;/resolv.con</title>
  <desc>Visual explanation of container network namespaces c1 and c2 connecting via veth pairs into host netns bridge br0, routing and netfilter stack, host eth0, and outward to Network.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#303a36" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">DNS inside: per-namespace resolv.conf under /etc/netns/&lt;ns&gt;/resolv.con</text>

  

  
  <rect x="50" y="130" width="270" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="185" y="172" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="185" dy="0">netns c1</tspan>
    <tspan x="185" dy="30">(10.10.0.11)</tspan>
  </text>

  
  <rect x="50" y="440" width="270" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="185" y="482" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="185" dy="0">netns c2</tspan>
    <tspan x="185" dy="30">(10.10.0.12)</tspan>
  </text>

  
  <rect x="355" y="130" width="1005" height="570" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
  <text x="390" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">host netns</text>

  

  
  <g transform="translate(95, 220)" filter="url(#shadow)">
