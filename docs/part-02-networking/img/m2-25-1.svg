      <tspan x="180" dy="34">netfilter</tspan>
    </text>
    <text x="180" y="176" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(FORWARD, MASQUERADE)</text>
  </g>

  
  <g transform="translate(1015, 490)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <rect x="115" y="24" width="50" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="123" y1="56" x2="123" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="131" y1="56" x2="131" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="149" y1="56" x2="149" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="157" y1="56" x2="157" y2="62" stroke="#207448" stroke-width="3"/>
    <line x1="108" y1="20" x2="108" y2="64" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <text x="140" y="104" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">eth0 (host IP)</text>
  </g>

  
  <g transform="translate(1405, 490)" filter="url(#shadow)">
    <rect width="165" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <path d="M 64 54 C 54 54, 48 46, 52 38 C 54 30, 64 28, 68 32 C 72 24, 86 22, 94 28 C 102 24, 114 30, 112 38 C 118 42, 116 54, 104 54 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="82" y="104" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Network</text>
  </g>

  

  
  <line x1="275" y1="290" x2="395" y2="290" stroke="#207448" stroke-width="3.5"/>

  
  <line x1="275" y1="600" x2="395" y2="600" stroke="#207448" stroke-width="3.5"/>

  
  <path d="M 565 290 L 595 290 L 595 365 L 625 365" fill="none" stroke="#207448" stroke-width="3.5"/>

  
