  <text x="150" y="390" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">eth0</text>

  
  <rect x="40" y="525" width="220" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text text-anchor="middle">
    <tspan x="150" y="571" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">netns c2</tspan>
    <tspan x="150" y="605" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">(10.10.0.12)</tspan>
  </text>

  
