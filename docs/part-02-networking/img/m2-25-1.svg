<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>DNS inside: per-namespace resolv.conf under /etc/netns/&lt;ns&gt;/resolv.con</title>
  <desc>Architecture flowchart showing container network namespaces netns c1 and netns c2 connected via veth pairs to host bridge br0, routing through the host IP stack to the physical interface and network.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">DNS inside: per-namespace resolv.conf</text>
  <text x="800" y="112" font-family="monospace" font-size="34" font-weight="bold" fill="#207448" text-anchor="middle">under /etc/netns/&lt;ns&gt;/resolv.con</text>

  
  <rect x="40" y="160" width="220" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8,5"/>
