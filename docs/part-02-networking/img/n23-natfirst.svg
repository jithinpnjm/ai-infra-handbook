<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>NAT applies to the first packet only</title>
  <desc>Timeline of a flow through a Linux NAT gateway showing NAT rule matching for packet 1 and conntrack bypass for subsequent packets.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5" />

  
  <text x="70" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">NAT applies to the first packet only</text>
  <text x="70" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline of a flow through a Linux NAT gateway</text>

  
  <rect x="70" y="180" width="840" height="310" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="120" cy="235" r="24" fill="#207448" />
  <text x="120" y="235" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="830" y="205" width="56" height="56" rx="8" />
    <line x1="830" y1="225" x2="886" y2="225" />
    <line x1="858" y1="225" x2="858" y2="261" />
    <circle cx="844" cy="243" r="3" fill="#207448" />
    <circle cx="872" cy="243" r="3" fill="#207448" />
  </g>

  <text x="170" y="245" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Packet 1 goes through the nat table</text>
  <text x="170" y="315" font-family="sans-serif" font-size="26" fill="#303a36">where the <tspan font-family="monospace">SNAT</tspan> or <tspan font-family="monospace">DNAT</tspan> rule matches,</text>
  <text x="170" y="375" font-family="sans-serif" font-size="26" fill="#303a36">and the translation is written into conntrack</text>

  
  <line x1="490" y1="490" x2="490" y2="528" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="530" width="840" height="320" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="120" cy="585" r="24" fill="#207448" />
  <text x="120" y="585" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="830" y="555" width="56" height="56" rx="8" />
    <path d="M 842 575 L 872 575 M 864 567 L 872 575 L 864 583" />
    <path d="M 872 593 L 842 593 M 850 585 L 842 593 L 850 601" />
  </g>

  <text x="170" y="595" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Packets 2..n skip the nat table:</text>
  <text x="170" y="665" font-family="sans-serif" font-size="26" fill="#303a36">conntrack applies the stored translation</text>
  <text x="170" y="725" font-family="sans-serif" font-size="26" fill="#303a36">automatically in both directions</text>

  
  <rect x="950" y="180" width="580" height="270" rx="16" ry="16" fill="#fef8f2" stroke="#db8129" stroke-width="3.5" />

  
  <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1450" y="205" width="56" height="56" rx="8" />
    <path d="M 1464 245 L 1484 225 L 1491 232 L 1471 252 L 1462 254 Z" />
    <line x1="1480" y1="229" x2="1487" y2="236" />
  </g>

  <text x="990" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Edit the NAT rule:</text>
  <text x="990" y="295" font-family="sans-serif" font-size="25" fill="#303a36">existing flows keep the old</text>
  <text x="990" y="345" font-family="sans-serif" font-size="25" fill="#303a36">translation until their entries</text>
  <text x="990" y="395" font-family="sans-serif" font-size="25" fill="#303a36">are deleted or expire</text>

  
  <rect x="950" y="490" width="580" height="360" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1450" y="510" width="56" height="56" rx="8" />
    <line x1="1462" y1="526" x2="1494" y2="526" />
    <line x1="1462" y1="538" x2="1494" y2="538" />
    <line x1="1462" y1="550" x2="1482" y2="550" />
  </g>

  <text x="990" y="540" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Notes</text>

  
  <circle cx="1000" cy="590" r="5" fill="#207448" />
  <text x="1020" y="595" font-family="monospace" font-size="24" fill="#303a36">snat to 203.0.113.9</text>
  <text x="1020" y="627" font-family="sans-serif" font-size="24" fill="#303a36">= static address</text>

  
  <circle cx="1000" cy="672" r="5" fill="#207448" />
  <text x="1020" y="675" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">masquerade</tspan> = interface address,</text>
  <text x="1020" y="707" font-family="sans-serif" font-size="24" fill="#303a36">flushes entries when the</text>
  <text x="1020" y="739" font-family="sans-serif" font-size="24" fill="#303a36">interface goes down</text>

  
  <circle cx="1000" cy="782" r="5" fill="#207448" />
  <text x="1020" y="785" font-family="sans-serif" font-size="24" fill="#303a36">about 64k ports per destination</text>
  <text x="1020" y="817" font-family="sans-serif" font-size="24" fill="#303a36">address and port: port exhaustion</text>
</svg>