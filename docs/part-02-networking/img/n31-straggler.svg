<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Straggler hunt across layers</title>
  <desc>A vertical drill-down chain from telemetry flagging a slow rank down to spine uplinks, with peer comparison metrics at each level, an orange pattern callout for ECMP collisions, and a footer on joining datasets by time and identity.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Straggler hunt across layers</text>

  
  
  <rect x="60" y="130" width="560" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="106" cy="195" r="24" fill="#207448" />
  <text x="106" y="204" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(148, 167)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 48 A 24 24 0 0 1 50 48" />
    <path d="M 28 48 L 42 22" />
    <circle cx="28" cy="48" r="4" fill="#207448" />
  </g>
  
  <text x="220" y="186" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NCCL or step-time</text>
  <text x="220" y="226" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">telemetry flags rank 112 as slow</text>

  
  <rect x="670" y="157" width="310" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="825" y="204" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">TX and RX rates</text>

  
  <line x1="340" y1="260" x2="340" y2="310" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <rect x="60" y="318" width="560" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="106" cy="383" r="24" fill="#207448" />
  <text x="106" y="392" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(148, 355)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <line x1="4" y1="28" x2="52" y2="28" />
    <circle cx="16" cy="17" r="3" fill="#207448" />
    <circle cx="16" cy="39" r="3" fill="#207448" />
    <line x1="32" y1="17" x2="44" y2="17" />
    <line x1="32" y1="39" x2="44" y2="39" />
  </g>
  
  <text x="220" y="393" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">its node</text>

  
  <rect x="670" y="345" width="310" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="825" y="392" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">retransmissions</text>

  
  <line x1="340" y1="448" x2="340" y2="498" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <rect x="60" y="506" width="560" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="106" cy="571" r="24" fill="#207448" />
  <text x="106" y="580" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(148, 543)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="28" rx="4" />
    <line x1="12" y1="38" x2="12" y2="48" />
    <line x1="20" y1="38" x2="20" y2="48" />
    <line x1="28" y1="38" x2="28" y2="48" />
    <line x1="50" y1="16" x2="50" y2="32" stroke-width="6" />
  </g>
  
  <text x="220" y="581" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">its NIC and rail</text>

  
  <rect x="670" y="533" width="310" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="825" y="580" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">CNP counts</text>

  
  <line x1="340" y1="636" x2="340" y2="686" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <rect x="60" y="694" width="560" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="106" cy="759" r="24" fill="#207448" />
  <text x="106" y="768" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(148, 731)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="40" rx="8" />
    <rect x="14" y="16" width="28" height="22" rx="4" />
    <line x1="20" y1="38" x2="36" y2="38" />
  </g>
  
  <text x="220" y="769" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">leaf port</text>

  
  <rect x="670" y="721" width="310" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="825" y="768" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">PFC pauses</text>

  
  <line x1="340" y1="824" x2="340" y2="874" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  
  <rect x="60" y="882" width="560" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="106" cy="947" r="24" fill="#207448" />
  <text x="106" y="956" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(148, 919)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="24" rx="4" />
    <circle cx="16" cy="18" r="3" fill="#207448" />
    <circle cx="28" cy="18" r="3" fill="#207448" />
    <circle cx="40" cy="18" r="3" fill="#207448" />
    <line x1="16" y1="30" x2="16" y2="50" />
    <line x1="28" y1="30" x2="28" y2="50" />
    <line x1="40" y1="30" x2="40" y2="50" />
  </g>
  
  <text x="220" y="957" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spine uplinks</text>

  
  <rect x="670" y="909" width="310" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <text x="825" y="956" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">FEC errors</text>

  
  <rect x="1040" y="130" width="500" height="882" rx="24" fill="#fffaf5" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(1085, 175)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 52 48 L 4 48 Z" />
    <line x1="28" y1="22" x2="28" y2="34" />
    <circle cx="28" cy="42" r="2.5" fill="#db8129" />
  </g>
  
  <text x="1085" y="275" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="1085" dy="0">ECN and CNP rise on many NICs</tspan>
    <tspan x="1085" dy="48">while a spine uplink shows high</tspan>
    <tspan x="1085" dy="48">utilisation and a growing egress</tspan>
    <tspan x="1085" dy="48">queue: ECMP collision or</tspan>
    <tspan x="1085" dy="48">oversubscribed tier</tspan>
  </text>

  
  <rect x="60" y="1055" width="1480" height="90" rx="16" fill="#207448" />
  <text x="800" y="1111" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Join datasets by time and identity using consistent labels from the source of truth</text>
</svg>