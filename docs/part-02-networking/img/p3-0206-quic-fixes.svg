<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What QUIC fixes compared with TCP plus TLS</title>
  <desc>A comparison table contrasting TCP plus TLS with QUIC across execution layer, setup latency, head-of-line blocking, connection identity, encryption, and congestion control, with costs and AI infrastructure context.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">What QUIC fixes compared with TCP plus TLS</text>

  
  <rect x="396" y="63" width="560" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="676" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TCP + TLS</text>

  <rect x="972" y="63" width="588" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1266" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">QUIC (RFC 9000, under HTTP/3)</text>

  
  <rect x="40" y="135" width="340" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <rect x="54" y="169" width="44" height="44" rx="6" stroke-width="3.5"/>
    <rect x="64" y="179" width="24" height="24" rx="2" stroke-width="2.5"/>
    <line x1="62" y1="163" x2="62" y2="169" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="163" x2="76" y2="169" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="163" x2="90" y2="169" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="213" x2="62" y2="219" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="213" x2="76" y2="219" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="213" x2="90" y2="219" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="177" x2="54" y2="177" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="191" x2="54" y2="191" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="205" x2="54" y2="205" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="177" x2="104" y2="177" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="191" x2="104" y2="191" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="205" x2="104" y2="205" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="118" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="118" dy="0">Where</tspan>
    <tspan x="118" dy="32">it runs</tspan>
  </text>

  <rect x="396" y="135" width="560" height="112" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="424" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">kernel</text>

  <rect x="972" y="135" width="588" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="169" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">over UDP, in user space, so changing</tspan>
    <tspan x="998" dy="27">a library is far easier than changing</tspan>
    <tspan x="998" dy="27">every operating system</tspan>
  </text>

  
  <rect x="40" y="254" width="340" height="138" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <circle cx="76" cy="323" r="22" stroke-width="3.5"/>
    <polyline points="76,309 76,323 89,323" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="118" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="118" dy="0">Setup</tspan>
    <tspan x="118" dy="32">cost</tspan>
  </text>

  <rect x="396" y="254" width="560" height="138" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="424" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="424" dy="0">transport handshake then TLS,</tspan>
    <tspan x="424" dy="30">2 to 3 RTTs</tspan>
  </text>

  <rect x="972" y="254" width="588" height="138" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">transport and TLS 1.3 combined,</tspan>
    <tspan x="998" dy="26">1 RTT for a new connection,</tspan>
    <tspan x="998" dy="26">0-RTT data on resumption which</tspan>
    <tspan x="998" dy="26">must be safe to replay</tspan>
  </text>

  
  <rect x="40" y="399" width="340" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" stroke-linecap="round">
    <line x1="56" y1="441" x2="96" y2="441" stroke-width="3.5"/>
    <line x1="56" y1="455" x2="96" y2="455" stroke-width="3.5"/>
    <line x1="56" y1="469" x2="96" y2="469" stroke-width="3.5"/>
    <line x1="84" y1="433" x2="84" y2="477" stroke-width="4"/>
  </g>
  <text x="118" y="439" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="118" dy="0">Head-of-line</tspan>
    <tspan x="118" dy="32">blocking</tspan>
  </text>

  
  <rect x="396" y="399" width="560" height="112" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  <text x="424" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="424" dy="0">one loss stalls every stream</tspan>
    <tspan x="424" dy="30">on the connection</tspan>
  </text>

  <rect x="972" y="399" width="588" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">streams are independent lanes;</tspan>
    <tspan x="998" dy="27">a loss stalls only the stream</tspan>
    <tspan x="998" dy="27">or streams it carried</tspan>
  </text>

  
  <rect x="40" y="518" width="340" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <rect x="54" y="557" width="46" height="34" rx="4" stroke-width="3.5"/>
    <circle cx="68" cy="571" r="5" stroke-width="2.5"/>
    <line x1="78" y1="568" x2="92" y2="568" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="576" x2="90" y2="576" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="118" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="118" dy="0">Connection</tspan>
    <tspan x="118" dy="32">identity</tspan>
  </text>

  <rect x="396" y="518" width="560" height="112" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="424" y="567" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="424" dy="0">4-tuple, a change of IP</tspan>
    <tspan x="424" dy="30">breaks it</tspan>
  </text>

  <rect x="972" y="518" width="588" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">connection IDs let a connection</tspan>
    <tspan x="998" dy="27">survive a change of IP address,</tspan>
    <tspan x="998" dy="27">such as Wi-Fi to cellular</tspan>
  </text>

  
  <rect x="40" y="637" width="340" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <rect x="60" y="683" width="32" height="24" rx="4" stroke-width="3.5"/>
    <path d="M66,683 V674 A10,10 0 0,1 86,674 V683" stroke-width="3.5"/>
    <circle cx="76" cy="694" r="2.5" fill="#207448"/>
    <line x1="76" y1="696" x2="76" y2="701" stroke-width="2.5"/>
  </g>
  <text x="118" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Encryption</text>

  <rect x="396" y="637" width="560" height="112" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="424" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">optional TLS on top</text>

  <rect x="972" y="637" width="588" height="112" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="671" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">mandatory, covers most of the</tspan>
    <tspan x="998" dy="27">transport header, so middleboxes</tspan>
    <tspan x="998" dy="27">cannot meddle or optimise</tspan>
  </text>

  
  <rect x="40" y="756" width="340" height="138" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <path d="M56,833 A22,22 0 1,1 96,833" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="76" y1="823" x2="88" y2="811" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="76" cy="823" r="3" fill="#207448"/>
  </g>
  <text x="118" y="797" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="118" dy="0">Congestion</tspan>
    <tspan x="118" dy="32">control</tspan>
  </text>

  <rect x="396" y="756" width="560" height="138" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
  <text x="424" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">kernel choice</text>

  <rect x="972" y="756" width="588" height="138" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="998" y="790" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="998" dy="0">each application picks its own,</tspan>
    <tspan x="998" dy="26">such as CUBIC or BBR; monotonic</tspan>
    <tspan x="998" dy="26">packet numbers avoid retransmission</tspan>
    <tspan x="998" dy="26">ambiguity; ACK ranges</tspan>
  </text>

  
  <rect x="40" y="903" width="1520" height="114" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <path d="M76,938 L98,978 L54,978 Z" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="76" y1="952" x2="76" y2="964" stroke-width="3" stroke-linecap="round"/>
    <circle cx="76" cy="971" r="1.8" fill="#207448"/>
  </g>
  <text x="118" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="118" dy="0">more CPU because crypto and packetisation run in user space (UDP GSO helps),</tspan>
    <tspan x="118" dy="27">some networks block or rate-limit UDP, harder to observe: encrypted headers limit</tspan>
    <tspan x="118" dy="27">what you can see, use qlog and endpoint metrics</tspan>
  </text>

  
  <rect x="40" y="1025" width="1520" height="86" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g stroke="#207448" fill="none">
    <circle cx="76" cy="1068" r="18" stroke-width="3"/>
    <ellipse cx="76" cy="1068" rx="8" ry="18" stroke-width="2.5"/>
    <line x1="58" y1="1068" x2="94" y2="1068" stroke-width="2.5"/>
  </g>
  <text x="118" y="1060" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="118" dy="0">In AI infrastructure QUIC mostly appears at the edge, such as HTTP/3 to inference APIs</tspan>
    <tspan x="118" dy="28">and CDNs, rather than inside clusters</tspan>
  </text>

  
  <rect x="40" y="1119" width="1520" height="58" rx="8" fill="#207448"/>
  <text x="800" y="1154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ICMP, with ping, traceroute and PMTUD, is covered in chapter 2.7</text>
</svg>