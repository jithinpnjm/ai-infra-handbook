<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading a ping reply line: size, sequence, TTL and time</title>
  <desc>Visual explanation of ping reply breakdown, sequence gaps, TTL hop calculation, round-trip time, mdev queueing, and diagnostic command options.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading a ping reply line: size, sequence, TTL and time</text>

  
  <rect x="40" y="105" width="1520" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="125" width="52" height="46" rx="6" />
    <line x1="60" y1="141" x2="112" y2="141" />
    <polyline points="72,151 78,157 72,163" />
    <line x1="84" y1="163" x2="96" y2="163" />
  </g>

  
  <rect x="130" y="120" width="1410" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="170">64 bytes</tspan>
    <tspan x="360" fill="#606d67">from 10.0.0.5:</tspan>
    <tspan x="640">icmp_seq=1</tspan>
    <tspan x="990">ttl=62</tspan>
    <tspan x="1270">time=0.31 ms</tspan>
  </text>

  
  <g stroke="#207448" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M 165 184 L 165 196 L 230 196 L 230 215 M 230 196 L 325 196 L 325 184" />
    
    <path d="M 635 184 L 635 196 L 650 196 L 650 215 M 650 196 L 840 196 L 840 184" />
    
    <path d="M 985 184 L 985 196 L 1055 196 L 1055 215 M 1055 196 L 1100 196 L 1100 184" />
    
    <path d="M 1265 184 L 1265 196 L 1385 196 L 1385 215 M 1385 196 L 1510 196 L 1510 184" />
  </g>

  
  
  <rect x="60" y="215" width="340" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="80" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">size: the request size</tspan>
    <tspan x="80" dy="32">plus 8 bytes of ICMP</tspan>
    <tspan x="80" dy="32">header</tspan>
  </text>

  
  <rect x="420" y="215" width="460" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="440" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="440" dy="0">icmp_seq: sequence number,</tspan>
    <tspan x="440" dy="32">a gap such as 2 then 4 means</tspan>
    <tspan x="440" dy="32">a request or reply went missing</tspan>
  </text>

  
  <rect x="900" y="215" width="310" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="920" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="920" dy="0">ttl: how many hops</tspan>
    <tspan x="920" dy="32">away</tspan>
  </text>

  
  <rect x="1230" y="215" width="310" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1250" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1250" dy="0">time: round trip</tspan>
  </text>

  
  
  <rect x="40" y="410" width="740" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="88" cy="455" r="22" />
    <line x1="72" y1="455" x2="104" y2="455" />
    <line x1="88" y1="439" x2="88" y2="471" />
    <polyline points="76,451 72,455 76,459" />
    <polyline points="100,451 104,455 100,459" />
  </g>
  <text x="135" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">Linux starts at 64, Windows at 128,</tspan>
    <tspan x="135" dy="34">network gear at 255. TTL 62 on a</tspan>
    <tspan x="135" dy="34">Linux host means 64 minus 62 = 2 routers</tspan>
  </text>

  
  <rect x="820" y="410" width="740" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="844" y="433" width="46" height="50" rx="6" />
    <line x1="844" y1="450" x2="890" y2="450" />
    <line x1="854" y1="462" x2="880" y2="462" />
    <line x1="854" y1="472" x2="874" y2="472" />
  </g>
  <text x="915" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="915" dy="0">First line: PING 10.23.2.1 (10.23.2.1)</tspan>
    <tspan x="915" dy="34">56(84) bytes of data: 56 bytes of data,</tspan>
    <tspan x="915" dy="34">84 with headers</tspan>
  </text>

  
  
  <rect x="40" y="600" width="740" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="622" width="46" height="50" rx="6" />
    <line x1="74" y1="636" x2="100" y2="636" />
    <line x1="74" y1="648" x2="100" y2="648" />
    <line x1="74" y1="660" x2="88" y2="660" stroke-dasharray="2 3" />
    <line x1="74" y1="672" x2="100" y2="672" />
  </g>

  
  <text x="145" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">icmp_seq=1 time=1.76 ms</text>
  <text x="145" y="677" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">icmp_seq=2 time=2.35 ms</text>

  
  <rect x="135" y="694" width="440" height="38" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="145" y="721" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#db8129">icmp_seq=3 missing</text>

  <text x="145" y="767" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">icmp_seq=4 time=1.69 ms</text>
  <text x="145" y="804" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">icmp_seq=5 time=1.61 ms</text>

  
  <rect x="820" y="600" width="740" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="868" cy="650" r="22" />
    <polyline points="868,638 868,650 878,656" />
    <path d="M 885 633 A 22 22 0 0 1 892 658" />
  </g>
  <text x="915" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="915" dy="0">mdev, the variation in round trip time,</tspan>
    <tspan x="915" dy="36">hints at queueing: packets waiting in</tspan>
    <tspan x="915" dy="36">line inside a device</tspan>
  </text>

  
  <g stroke="#207448" stroke-width="2" fill="none">
    <rect x="915" y="750" width="260" height="50" rx="6" fill="#ffffff" />
    <line x1="975" y1="750" x2="975" y2="800" />
    <line x1="1035" y1="750" x2="1035" y2="800" />
    <line x1="1095" y1="750" x2="1095" y2="800" />
    <path d="M 1195 775 L 1235 775" stroke-width="3" stroke-linecap="round" />
    <polyline points="1225,767 1235,775 1225,783" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <rect x="40" y="865" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="88" cy="915" r="22" />
    <polyline points="88,903 88,915 98,915" />
  </g>
  <text x="135" y="907" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">ping sends only one packet per second by default, so packets should not arrive out of order;</tspan>
    <tspan x="135" dy="34">a reply over 1000 ms means an extremely slow link</tspan>
  </text>

  
  <rect x="40" y="985" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="68" y1="1020" x2="108" y2="1020" />
    <circle cx="78" cy="1020" r="4" fill="#207448" />
    <line x1="68" y1="1035" x2="108" y2="1035" />
    <circle cx="98" cy="1035" r="4" fill="#207448" />
    <line x1="68" y1="1050" x2="108" y2="1050" />
    <circle cx="86" cy="1050" r="4" fill="#207448" />
  </g>
  <text x="135" y="1027" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="135" dy="0">ping -s 1472 -M do: payload 1472 + 8 ICMP + 20 IP = 1500 with DF set;</tspan>
    <tspan x="135" dy="34">-I eth1 forces the source interface; -6 for IPv6, link-local needs -I eth0</tspan>
  </text>

  
  <rect x="40" y="1110" width="1520" height="65" rx="10" fill="#207448" />
  <text x="800" y="1152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Ping answers only one narrow question: whether ICMP echo gets through</text>
</svg>