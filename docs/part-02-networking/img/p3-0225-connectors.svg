<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How a namespace reaches the network: veth, bridge, macvlan, ipvlan and SR-IOV</title>
  <desc>Visual infographic explaining Linux networking devices, namespace connectivity, trade-offs, and bypass models.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  <text x="800" y="66" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">How a namespace reaches the network:</tspan>
    <tspan x="800" dy="52">veth, bridge, macvlan, ipvlan and SR-IOV</tspan>
  </text>

  
  <g id="row-veth">
    <rect x="40" y="146" width="1520" height="126" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(60, 181)">
      <rect x="0" y="4" width="22" height="48" rx="3" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <rect x="34" y="4" width="22" height="48" rx="3" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M22 28 L34 28" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="11" cy="16" r="3" fill="#207448" />
      <circle cx="45" cy="40" r="3" fill="#207448" />
    </g>
    
    <g transform="translate(135, 156)">
      <rect x="0" y="0" width="280" height="106" rx="6" fill="#f0f6f1" stroke="#bcd4c0" stroke-width="1" />
      <line x1="140" y1="8" x2="140" y2="98" stroke="#8ba58f" stroke-width="2" stroke-dasharray="5 4" />
      <rect x="18" y="24" width="56" height="58" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="206" y="24" width="56" height="58" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <path d="M74 53 C105 53, 115 53, 140 53 C165 53, 175 53, 206 53" fill="none" stroke="#207448" stroke-width="5" />
      <rect x="68" y="47" width="12" height="12" rx="2" fill="#207448" />
      <rect x="200" y="47" width="12" height="12" rx="2" fill="#207448" />
      <circle cx="115" cy="53" r="4" fill="#207448" />
      <circle cx="165" cy="53" r="4" fill="#207448" />
    </g>
    
    <line x1="430" y1="158" x2="430" y2="260" stroke="#cbd5cb" stroke-width="1.5" />
    
    <text x="445" y="175" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">veth pair: </tspan><tspan>two linked virtual NICs, what goes in one end comes out</tspan>
      <tspan x="445" dy="28">the other, even across namespaces; a virtual patch cable with a plug in each</tspan>
      <tspan x="445" dy="28">room; one end becomes the container's eth0, the other stays on the host</tspan>
      <tspan x="445" dy="28">(ip link set X netns Y moves an end)</tspan>
    </text>
  </g>

  
  <g id="row-bridge">
    <rect x="40" y="281" width="1520" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(60, 291)">
      <rect x="0" y="10" width="56" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="14" cy="28" r="4" fill="#207448" />
      <circle cx="28" cy="28" r="4" fill="#207448" />
      <circle cx="42" cy="28" r="4" fill="#207448" />
    </g>
    
    <g transform="translate(135, 287)">
      <rect x="0" y="0" width="280" height="64" rx="6" fill="#f0f6f1" stroke="#bcd4c0" stroke-width="1" />
      <rect x="65" y="12" width="150" height="40" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <line x1="20" y1="32" x2="65" y2="32" stroke="#207448" stroke-width="3" />
      <line x1="215" y1="24" x2="260" y2="24" stroke="#207448" stroke-width="3" />
      <line x1="215" y1="40" x2="260" y2="40" stroke="#207448" stroke-width="3" />
      <circle cx="95" cy="32" r="5" fill="#207448" />
      <circle cx="140" cy="32" r="5" fill="#207448" />
      <circle cx="185" cy="32" r="5" fill="#207448" />
      <path d="M95 32 L140 32 L185 32" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />
    </g>
    
    <line x1="430" y1="291" x2="430" y2="347" stroke="#cbd5cb" stroke-width="1.5" />
    
    <text x="445" y="312" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">bridge: </tspan><tspan>software L2 switch joining veths, physical NICs</tspan>
      <tspan x="445" dy="28">and VXLAN devices</tspan>
    </text>
  </g>

  
  <g id="row-macvlan">
    <rect x="40" y="366" width="1520" height="128" rx="8" fill="#fffdfa" stroke="#db8129" stroke-width="2.5" />
    
    <g transform="translate(60, 402)">
      <rect x="0" y="4" width="56" height="48" rx="4" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      <path d="M12 4 L12 0 L44 0 L44 4" fill="none" stroke="#db8129" stroke-width="3" />
      <circle cx="18" cy="22" r="5" fill="#db8129" />
      <circle cx="38" cy="22" r="5" fill="#db8129" />
      <path d="M18 36 L38 36" stroke="#db8129" stroke-width="3" />
    </g>
    
    <g transform="translate(135, 376)">
      <rect x="0" y="0" width="280" height="108" rx="6" fill="#fff9f3" stroke="#f2c89f" stroke-width="1" />
      <rect x="30" y="16" width="90" height="34" rx="3" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <rect x="160" y="16" width="90" height="34" rx="3" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <rect x="50" y="72" width="180" height="24" rx="3" fill="#ffffff" stroke="#303a36" stroke-width="2" />
      <path d="M75 50 L75 72" stroke="#db8129" stroke-width="3" />
      <path d="M205 50 L205 72" stroke="#db8129" stroke-width="3" />
      <path d="M245 33 L265 33 L265 92 L230 92" fill="none" stroke="#db8129" stroke-width="2.5" stroke-dasharray="4 3" />
      <circle cx="75" cy="33" r="4" fill="#db8129" />
      <circle cx="205" cy="33" r="4" fill="#db8129" />
    </g>
    
    <line x1="430" y1="378" x2="430" y2="482" stroke="#f2c89f" stroke-width="1.5" />
    
    <text x="445" y="394" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#db8129">macvlan: </tspan><tspan>sub-interface of a parent NIC with its own MAC; packets go straight</tspan>
      <tspan x="445" dy="28">to the wire; the container appears as a separate host on the parent's LAN;</tspan>
      <tspan x="445" dy="28">host-to-container traffic on the same parent does not work unless the host</tspan>
      <tspan x="445" dy="28">has a macvlan sub-interface too</tspan>
    </text>
  </g>

  
  <g id="row-ipvlan">
    <rect x="40" y="503" width="1520" height="104" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(60, 527)">
      <rect x="0" y="4" width="56" height="48" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M12 4 L12 0 L44 0 L44 4" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="16" x2="28" y2="40" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="28" x2="40" y2="28" stroke="#207448" stroke-width="3" />
    </g>
    
    <g transform="translate(135, 511)">
      <rect x="0" y="0" width="280" height="88" rx="6" fill="#f0f6f1" stroke="#bcd4c0" stroke-width="1" />
      <rect x="35" y="12" width="85" height="28" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="160" y="12" width="85" height="28" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="50" y="56" width="180" height="22" rx="3" fill="#ffffff" stroke="#303a36" stroke-width="2" />
      <path d="M77 40 L77 56" stroke="#207448" stroke-width="3" />
      <path d="M202 40 L202 56" stroke="#207448" stroke-width="3" />
      <circle cx="140" cy="67" r="4" fill="#207448" />
    </g>
    
    <line x1="430" y1="513" x2="430" y2="597" stroke="#cbd5cb" stroke-width="1.5" />
    
    <text x="445" y="533" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">ipvlan: </tspan><tspan>sub-interface sharing the parent's MAC with its own IP, L2 or L3 mode;</tspan>
      <tspan x="445" dy="29">good when switches limit MACs per port; L3 mode routes container IPs through</tspan>
      <tspan x="445" dy="29">the parent so there is no MAC explosion</tspan>
    </text>
  </g>

  
  <g id="row-dummy-tun">
    <rect x="40" y="616" width="1520" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(60, 626)">
      <path d="M28 6 L50 16 L50 36 C50 48 28 54 28 54 C28 54 6 48 6 36 L6 16 Z" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="28" cy="28" r="6" fill="#207448" />
    </g>
    
    <g transform="translate(135, 622)">
      <rect x="0" y="0" width="280" height="64" rx="6" fill="#f0f6f1" stroke="#bcd4c0" stroke-width="1" />
      <path d="M30 32 L80 32" stroke="#207448" stroke-width="3" />
      <rect x="80" y="16" width="120" height="32" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="110" y="24" width="60" height="16" rx="2" fill="#207448" />
      <path d="M200 32 L250 32" stroke="#207448" stroke-width="3" />
      <circle cx="55" cy="32" r="4" fill="#207448" />
      <circle cx="225" cy="32" r="4" fill="#207448" />
    </g>
    
    <line x1="430" y1="626" x2="430" y2="682" stroke="#cbd5cb" stroke-width="1.5" />
    
    <text x="445" y="647" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">dummy, tun, tap, wireguard, vxlan, vrf: </tspan><tspan>special devices for VPNs, overlays,</tspan>
      <tspan x="445" dy="29">VMs, routing isolation</tspan>
    </text>
  </g>

  
  <g id="row-sriov">
    <rect x="40" y="701" width="1520" height="76" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(60, 711)">
      <rect x="8" y="8" width="40" height="40" rx="3" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="40" y1="2" x2="40" y2="8" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="48" x2="16" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="40" y1="48" x2="40" y2="54" stroke="#207448" stroke-width="3" />
    </g>
    
    <g transform="translate(135, 707)">
      <rect x="0" y="0" width="280" height="64" rx="6" fill="#f0f6f1" stroke="#bcd4c0" stroke-width="1" />
      <rect x="25" y="16" width="130" height="32" rx="3" fill="#ffffff" stroke="#303a36" stroke-width="2" />
      <rect x="175" y="16" width="80" height="32" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <path d="M155 32 L175 32" stroke="#207448" stroke-width="3" />
      <path d="M215 16 L215 4 L265 4" fill="none" stroke="#207448" stroke-width="2.5" />
      <circle cx="215" cy="32" r="4" fill="#207448" />
    </g>
    
    <line x1="430" y1="711" x2="430" y2="767" stroke="#cbd5cb" stroke-width="1.5" />
    
    <text x="445" y="746" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">SR-IOV VF: </tspan><tspan>hardware virtual function placed directly into a namespace</tspan>
    </text>
  </g>

  
  <g id="lower-strip">
    <rect x="40" y="788" width="1520" height="48" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="820" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">A physical NIC lives in exactly one namespace; a virtual interface can be moved</text>
  </g>

  
  <g id="commands-panel">
    <rect x="40" y="848" width="1520" height="80" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="65" y="879" font-family="monospace" font-size="24" fill="#303a36">ip link add mv0 link eth0 type macvlan mode bridge; ip link set mv0 netns c1</text>
    <text x="65" y="911" font-family="monospace" font-size="24" fill="#303a36">ip link add ipv0 link eth0 type ipvlan mode l3; ip link set ipv0 netns c2</text>
  </g>

  
  <g id="footer-panel">
    <rect x="40" y="940" width="1520" height="128" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="65" y="972" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">Other models: a routed veth has no bridge, one /32 route per container pointing at the host end with</tspan>
      <tspan x="65" dy="32">proxy ARP or a routing protocol (Calico); host networking skips the namespace; SR-IOV and DPDK bypass</tspan>
      <tspan x="65" dy="32">the kernel; macvlan and ipvlan may not work on cloud networks that filter MACs or IPs</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1082" width="1520" height="56" rx="6" fill="#207448" />
    <text x="800" y="1118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Choose the model that matches what the workload needs: a NAT path, a LAN address, or a bypass</text>
  </g>
</svg>