<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>DNS over UDP and TCP, EDNS, and what each response code means</title>
  <desc>Visual explanation of DNS transport protocols, truncation and fallback, EDNS payload size, response status codes, and query latency considerations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">DNS over UDP and TCP, EDNS, and what each response code means</text>

  
  <g id="transport-panel">
    <rect x="40" y="110" width="740" height="725" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 132)">
      
      <rect x="0" y="0" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 24 L 36 24 M 24 12 L 24 36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="24" cy="24" r="5" fill="#207448" />
    </g>
    <text x="130" y="168" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Transport</text>

    
    <rect x="65" y="195" width="690" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="102" cy="242" r="22" fill="#207448" />
    <text x="102" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(138, 220)">
      <rect x="0" y="0" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 8 14 L 36 14 M 8 22 L 28 22 M 8 30 L 22 30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="200" y="236" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="200" dy="0">UDP port 53 by default, most questions</tspan>
      <tspan x="200" dy="30">and answers are tiny</tspan>
    </text>

    
    <line x1="410" y1="290" x2="410" y2="316" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="65" y="322" width="690" height="78" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="102" cy="361" r="22" fill="#207448" />
    <text x="102" y="369" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(138, 339)">
      <path d="M 6 12 L 38 12 M 6 22 L 38 22 M 6 32 L 24 32" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3" />
      <path d="M 32 28 L 38 34 M 38 28 L 32 34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="200" y="369" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TC truncation bit</text>

    
    <line x1="410" y1="400" x2="410" y2="420" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <rect x="65" y="426" width="690" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="102" cy="466" r="22" fill="#207448" />
    <text x="102" y="474" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(138, 444)">
      <circle cx="10" cy="22" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="34" cy="22" r="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 16 22 L 28 22" stroke="#207448" stroke-width="3" />
    </g>
    <text x="200" y="474" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">TCP port 53</text>

    
    <rect x="200" y="492" width="220" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="218" y="525" font-family="sans-serif" font-size="24" fill="#303a36">zone transfers</text>

    <rect x="435" y="492" width="300" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="450" y="525" font-family="sans-serif" font-size="24" fill="#303a36">DoT and DoH variants</text>

    
    <rect x="65" y="570" width="690" height="116" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 606)">
      <rect x="0" y="0" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 12 23 L 34 23 M 28 17 L 34 23 L 28 29" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="150" y="605" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" dy="0">EDNS(0) advertises larger UDP payloads,</tspan>
      <tspan x="150" dy="30">commonly 1232 bytes, to avoid fragmentation,</tspan>
      <tspan x="150" dy="30">and carries DNSSEC flags</tspan>
    </text>

    
    <rect x="65" y="700" width="690" height="118" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(85, 735)">
      <path d="M 23 4 L 44 40 L 2 40 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
      <line x1="23" y1="16" x2="23" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
      <circle cx="23" cy="34" r="2" fill="#db8129" />
    </g>
    <text x="150" y="736" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="150" dy="0">firewalls that block TCP/53 or fragments</tspan>
      <tspan x="150" dy="30">break big answers, such as DNSSEC responses</tspan>
      <tspan x="150" dy="30">and long TXT records</tspan>
    </text>
  </g>

  
  <g id="response-codes-panel">
    <rect x="820" y="110" width="740" height="725" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(845, 132)">
      
      <rect x="0" y="0" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 16 L 36 16 M 12 24 L 36 24 M 12 32 L 36 32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="910" y="168" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Response codes</text>

    
    <rect x="845" y="195" width="690" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(865, 218)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 14 24 L 21 31 L 34 17" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="930" y="236" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0">NOERROR: the query succeeded,</tspan>
      <tspan x="930" dy="30">with or without data</tspan>
    </text>

    
    <rect x="845" y="305" width="690" height="82" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(865, 322)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 16 16 L 32 32 M 32 16 L 16 32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="930" y="355" font-family="sans-serif" font-size="24" fill="#303a36">NXDOMAIN: the name does not exist</text>

    
    <rect x="845" y="402" width="690" height="126" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(865, 440)">
      <rect x="4" y="6" width="40" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <rect x="4" y="26" width="40" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="13" r="2" fill="#207448" />
      <circle cx="12" cy="33" r="2" fill="#207448" />
      <path d="M 32 10 L 38 16 M 38 10 L 32 16" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="930" y="440" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0">SERVFAIL: the resolver could not get an answer:</tspan>
      <tspan x="930" dy="30">upstream timeout, DNSSEC failure,</tspan>
      <tspan x="930" dy="30">lame delegation</tspan>
    </text>

    
    <rect x="845" y="543" width="690" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(865, 565)">
      <path d="M 24 6 L 40 12 L 40 24 C 40 34 24 42 24 42 C 24 42 8 34 8 24 L 8 12 Z" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="24" x2="32" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="930" y="582" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0">REFUSED: the server refused</tspan>
      <tspan x="930" dy="30">for policy reasons</tspan>
    </text>

    
    <rect x="845" y="650" width="690" height="82" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(865, 667)">
      <rect x="6" y="4" width="36" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 14 14 L 20 20 L 14 26 M 24 26 L 34 26" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="930" y="700" font-family="sans-serif" font-size="24" fill="#303a36">FORMERR: format error</text>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="855" width="1520" height="115" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 888)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 12 16 L 22 24 L 12 32 M 26 32 L 36 32" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="135" y="903" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">dig +tcp example.com TXT forces TCP; dig +bufsize=512 against 1232 tests EDNS size;</tspan>
      <tspan x="135" dy="36">the tc flag in a dig header means retry over TCP</tspan>
    </text>
  </g>

  
  <g id="latency-note">
    <rect x="40" y="985" width="1520" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(65, 1022)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3" />
      <ellipse cx="24" cy="24" rx="9" ry="20" fill="none" stroke="#207448" stroke-width="2" />
      <line x1="4" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="2" />
    </g>
    <text x="135" y="1025" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">Public resolvers and root servers are anycast; your latency to your own resolver,</tspan>
      <tspan x="135" dy="32">often the cloud one at 169.254.169.254 or the VPC resolver, dominates the DNS cost:</tspan>
      <tspan x="135" dy="32">1 ms away adds almost nothing</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1125" width="1520" height="55" rx="10" fill="#207448" />
    <text x="800" y="1161" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Check the latency to your own resolver first</text>
  </g>
</svg>