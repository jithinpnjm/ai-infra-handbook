  <path d="M 410,620 C 525,620 525,820 640,820" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 960,320 C 1075,320 1075,520 1190,520" fill="none" stroke="#207448" stroke-width="4" />

  
  <path d="M 960,820 C 1075,820 1075,620 1190,620" fill="none" stroke="#207448" stroke-width="4" />

  
  <line x1="800" y1="410" x2="800" y2="730" stroke="#207448" stroke-width="4" />

  

  
  <g id="badge-ab">
