<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Autonomous systems and why BGP exists</title>
  <desc>Visual infographic showing Autonomous Systems peering via eBGP sessions between an enterprise AI cluster, transit providers, and content cloud.</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Autonomous systems and why BGP exists</text>

  

  
  <g id="as65000">
    <rect x="50" y="360" width="400" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="250" y="405" text-anchor="middle" font-family="sans-serif" fill="#303a36">
      <tspan x="250" dy="0" font-size="30" font-weight="bold">AS 65000</tspan>
      <tspan x="250" dy="36" font-size="24" font-weight="bold">(enterprise / AI cluster)</tspan>
    </text>
  </g>

  
  <g id="as65001">
    <rect x="600" y="110" width="400" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="155" text-anchor="middle" font-family="sans-serif" fill="#303a36">
      <tspan x="800" dy="0" font-size="30" font-weight="bold">AS 65001</tspan>
      <tspan x="800" dy="36" font-size="24" font-weight="bold">(transit provider)</tspan>
    </text>
  </g>

  
  <g id="as65003">
    <rect x="600" y="610" width="400" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="655" text-anchor="middle" font-family="sans-serif" fill="#303a36">
      <tspan x="800" dy="0" font-size="30" font-weight="bold">AS 65003</tspan>
      <tspan x="800" dy="36" font-size="24" font-weight="bold">(transit provider 2)</tspan>
    </text>
  </g>

  
  <g id="as65002">
    <rect x="1150" y="360" width="400" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1350" y="405" text-anchor="middle" font-family="sans-serif" fill="#303a36">
      <tspan x="1350" dy="0" font-size="30" font-weight="bold">AS 65002</tspan>
      <tspan x="1350" dy="36" font-size="24" font-weight="bold">(content / cloud)</tspan>
    </text>
  </g>

  

  
