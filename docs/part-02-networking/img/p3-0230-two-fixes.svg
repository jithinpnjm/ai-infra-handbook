<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1105" width="1600" height="1105">
  <title>Immediate fix and permanent fix: the tourniquet and the surgery</title>
  <desc>Visual comparison between immediate temporary fixes and permanent architectural surgery, tracking incident debt and the post-incident learning loop.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1105" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Immediate fix and permanent fix: the tourniquet and the surgery</text>

  
  
  

  
  <g id="stage-1">
    <rect x="40" y="115" width="480" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="80" cy="160" r="24" fill="#207448"/>
    <text x="80" y="169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <text x="120" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Immediate fix</text>
    <text x="120" y="183" font-family="sans-serif" font-size="24" fill="#303a36">(restores service)</text>
    
    
    <g transform="translate(440, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="52" height="52" rx="10"/>
      <path d="M 28 14 L 28 42 M 14 28 L 42 28"/>
    </g>

    
    <line x1="65" y1="210" x2="495" y2="210" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <text x="65" y="244" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">reroute, restart,</tspan>
      <tspan x="65" dy="34">roll back a config,</tspan>
      <tspan x="65" dy="34">or replace a part</tspan>
    </text>

    
    <line x1="65" y1="345" x2="495" y2="345" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <text x="65" y="380" font-family="sans-serif" font-size="24" font-style="italic" fill="#303a36">
      <tspan x="65" dy="0">tourniquet:</tspan>
      <tspan x="65" dy="34">stops the bleeding,</tspan>
      <tspan x="65" dy="34">nobody calls it a cure</tspan>
    </text>
  </g>

  
  <line x1="520" y1="315" x2="560" y2="315" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g id="debt-transition">
    <rect x="560" y="150" width="480" height="330" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(772, 185)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="44" rx="8"/>
      <path d="M 16 2 L 16 12 M 40 2 L 40 12 M 6 20 L 50 20"/>
      <circle cx="28" cy="34" r="5" fill="#db8129"/>
    </g>

    
    <text x="800" y="295" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">record the temporary fix</tspan>
      <tspan x="800" dy="38">as debt, with an owner</tspan>
      <tspan x="800" dy="38">and a date</tspan>
    </text>
  </g>

  
  <line x1="1040" y1="315" x2="1080" y2="315" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g id="stage-2">
    <rect x="1080" y="115" width="480" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="1120" cy="160" r="24" fill="#207448"/>
    <text x="1120" y="169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <text x="1160" y="153" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Permanent fix</text>
    <text x="1160" y="183" font-family="sans-serif" font-size="24" fill="#303a36">(removes the cause)</text>
    
    
    <g transform="translate(1480, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 46 8 L 22 32 L 8 46 L 6 42 L 18 28 L 42 4 Z"/>
      <circle cx="38" cy="16" r="3" fill="#207448"/>
    </g>

    
    <line x1="1105" y1="210" x2="1535" y2="210" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <text x="1105" y="244" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">correct design, automation,</tspan>
      <tspan x="1105" dy="34">monitoring and documentation</tspan>
    </text>

    
    <text x="1105" y="322" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">a bad optic, a wrong MTU</tspan>
    </text>

    
    <line x1="1105" y1="350" x2="1535" y2="350" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3"/>

    
    <text x="1105" y="385" font-family="sans-serif" font-size="24" font-style="italic" fill="#303a36">
      <tspan x="1105" dy="0">surgery:</tspan>
      <tspan x="1105" dy="34">scheduled, not skipped</tspan>
    </text>
  </g>

  
  
  

  
  <g id="review-node">
    <rect x="40" y="545" width="720" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(680, 565)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="14"/>
      <path d="M 32 32 L 48 48 M 16 22 L 28 22 M 22 16 L 22 28"/>
    </g>

    
    <text x="70" y="585" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="70" dy="0">blameless post-incident review:</tspan>
    </text>
    <text x="70" y="625" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="70" dy="0">the timeline, what you knew and when,</tspan>
      <tspan x="70" dy="34">what misled you,</tspan>
      <tspan x="70" dy="34">what detection or tooling was missing,</tspan>
      <tspan x="70" dy="34">what to change (alerts, runbooks,</tspan>
      <tspan x="70" dy="34">tests in CI, design)</tspan>
    </text>
  </g>

  
  <line x1="760" y1="645" x2="840" y2="645" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <line x1="840" y1="725" x2="760" y2="725" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="model-node">
    <rect x="840" y="545" width="720" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1172, 575)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="12" r="6"/>
      <circle cx="12" cy="40" r="6"/>
      <circle cx="44" cy="40" r="6"/>
      <circle cx="28" cy="30" r="4" fill="#207448"/>
      <path d="M 28 18 L 28 26 M 25 33 L 16 37 M 31 33 L 40 37"/>
    </g>

    
    <text x="1200" y="675" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1200" dy="0">add the failure to your what model</tspan>
      <tspan x="1200" dy="38">so the next occurrence</tspan>
      <tspan x="1200" dy="38">is recognised at once</tspan>
    </text>
  </g>

  
  
  

  <g id="warning-box">
    <rect x="40" y="855" width="1520" height="105" rx="12" fill="#ffffff" stroke="#303a36" stroke-width="2"/>
    
    
    <g transform="translate(70, 882)" stroke="#303a36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 46 42 L 2 42 Z"/>
      <line x1="24" y1="16" x2="24" y2="28"/>
      <circle cx="24" cy="35" r="2" fill="#303a36"/>
    </g>

    
    <text x="145" y="898" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">unfixed root causes build up as technical debt:</tspan>
    </text>
    <text x="145" y="934" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">workarounds that stay, undocumented exceptions, manual steps</tspan>
    </text>
  </g>

  
  
  

  <g id="bottom-bar">
    <rect x="40" y="985" width="1520" height="80" rx="12" fill="#207448"/>
    <text x="800" y="1035" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Before you call an incident closed, record the temporary fix as debt and schedule the permanent one</text>
  </g>
</svg>