<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Case 8: the PFC storm</title>
  <desc>Visual infographic explaining Case 8: the PFC storm, illustrating backward pause frame propagation across switches or ports, throughput collapse timeline, diagnostic facts, and four-part resolution.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <polygon points="0,2 14,8 0,14" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Case 8: the PFC storm</text>

  
  <g id="chain-container">
    <rect x="60" y="110" width="1480" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="90" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">chain of four switches or ports</text>

    
    <text x="800" y="218" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">pause frames</text>

    
    
    <line x1="1300" y1="242" x2="1111" y2="242" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    <line x1="895" y1="242" x2="711" y2="242" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    <line x1="495" y1="242" x2="306" y2="242" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <g id="node-1" transform="translate(90, 180)">
      <rect width="210" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="45" cy="55" r="24" fill="#207448"/>
      <text x="45" y="64" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(105, 27)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="52" height="42" rx="6"/>
        <line x1="2" y1="22" x2="54" y2="22" stroke-width="3"/>
        <circle cx="14" cy="35" r="3" fill="#207448"/>
        <circle cx="28" cy="35" r="3" fill="#207448"/>
        <circle cx="42" cy="35" r="3" fill="#207448"/>
      </g>
    </g>

    
    <g id="node-2" transform="translate(495, 180)">
      <rect width="210" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="45" cy="55" r="24" fill="#207448"/>
      <text x="45" y="64" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      
      <g transform="translate(105, 27)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="52" height="42" rx="6"/>
        <line x1="2" y1="22" x2="54" y2="22" stroke-width="3"/>
        <circle cx="14" cy="35" r="3" fill="#207448"/>
        <circle cx="28" cy="35" r="3" fill="#207448"/>
        <circle cx="42" cy="35" r="3" fill="#207448"/>
      </g>
    </g>

    
    <g id="node-3" transform="translate(895, 180)">
      <rect width="210" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="45" cy="55" r="24" fill="#207448"/>
      <text x="45" y="64" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(105, 27)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="52" height="42" rx="6"/>
        <line x1="2" y1="22" x2="54" y2="22" stroke-width="3"/>
        <circle cx="14" cy="35" r="3" fill="#207448"/>
        <circle cx="28" cy="35" r="3" fill="#207448"/>
        <circle cx="42" cy="35" r="3" fill="#207448"/>
      </g>
    </g>

    
    <g id="node-4" transform="translate(1300, 180)">
      <rect width="210" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="45" cy="55" r="24" fill="#207448"/>
      <text x="45" y="64" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(105, 27)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="52" height="42" rx="6"/>
        <line x1="2" y1="22" x2="54" y2="22" stroke-width="3"/>
        <circle cx="14" cy="35" r="3" fill="#207448"/>
        <circle cx="28" cy="35" r="3" fill="#207448"/>
        <circle cx="42" cy="35" r="3" fill="#207448"/>
      </g>
    </g>
  </g>

  
  <g id="timeline-container">
    <rect x="60" y="345" width="1480" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 372)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="28 14, 28 28, 40 28"/>
    </g>
    <text x="165" y="410" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline strip</text>

    
    <rect x="420" y="365" width="1090" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="965" y="409" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">job runs fine for five minutes, then throughput falls to zero</text>
  </g>

  
  <g id="facts-container">
    <rect x="60" y="480" width="1480" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 502)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 4 L 34 4 L 48 18 L 48 52 L 8 52 Z"/>
      <path d="M 34 4 L 34 18 L 48 18"/>
      <line x1="16" y1="28" x2="36" y2="28" stroke-width="3"/>
      <line x1="16" y1="38" x2="36" y2="38" stroke-width="3"/>
    </g>
    <text x="165" y="540" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Facts</text>

    
    <g id="fact-1" transform="translate(90, 565)">
      <rect width="390" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(24, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="52" height="42" rx="6"/>
        <polyline points="12 22, 20 27, 12 32"/>
        <line x1="24" y1="32" x2="36" y2="32" stroke-width="3"/>
      </g>
      <text x="95" y="62" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">ib_write_bw</text>
      <text x="95" y="105" font-family="sans-serif" font-size="24" fill="#303a36">passes when idle</text>
    </g>

    
    <g id="fact-2" transform="translate(510, 565)">
      <rect width="450" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(24, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24"/>
        <polyline points="28 28, 42 18"/>
        <circle cx="28" cy="28" r="4" fill="#207448"/>
      </g>
      <text x="95" y="55" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ethtool -S</tspan> shows
      </text>
      <text x="95" y="94" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="monospace" font-size="24" font-weight="bold" fill="#207448">rx_pause</tspan> rising
      </text>
      <text x="95" y="133" font-family="sans-serif" font-size="24" fill="#303a36">by millions per second</text>
    </g>

    
    <g id="fact-3" transform="translate(990, 565)">
      <rect width="520" height="170" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
      <g transform="translate(24, 22)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 52 48 L 4 48 Z"/>
        <line x1="28" y1="20" x2="28" y2="34"/>
        <circle cx="28" cy="41" r="2.5" fill="#db8129"/>
      </g>
      <text x="92" y="44" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="92" dy="0" font-weight="bold" fill="#db8129">ECN thresholds were set</tspan>
        <tspan x="92" dy="32">too high, so buffers filled</tspan>
        <tspan x="92" dy="32">before ECN or CNP could</tspan>
        <tspan x="92" dy="32">slow the sender</tspan>
      </text>
    </g>
  </g>

  
  <g id="resolution-container">
    <rect x="60" y="785" width="1480" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 804)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 V 30 C 50 42 39 50 28 54 C 17 50 6 42 6 30 V 14 Z"/>
      <path d="M 18 28 L 25 35 L 38 22"/>
    </g>
    <text x="165" y="842" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Resolution</text>

    
    <g id="res-1" transform="translate(90, 865)">
      <rect width="690" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="26" cy="26" r="22"/>
        <polyline points="17 27, 23 33, 35 19"/>
      </g>
      <text x="85" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">lower ECN thresholds below the PFC threshold</text>
    </g>

    
    <g id="res-2" transform="translate(820, 865)">
      <rect width="690" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="26" cy="26" r="22"/>
        <polyline points="17 27, 23 33, 35 19"/>
      </g>
      <text x="85" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">verify DCQCN on the NICs</text>
    </g>

    
    <g id="res-3" transform="translate(90, 965)">
      <rect width="690" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="26" cy="26" r="22"/>
        <polyline points="17 27, 23 33, 35 19"/>
      </g>
      <text x="85" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">enable the PFC watchdog</text>
    </g>

    
    <g id="res-4" transform="translate(820, 965)">
      <rect width="690" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="26" cy="26" r="22"/>
        <polyline points="17 27, 23 33, 35 19"/>
      </g>
      <text x="85" y="52" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">find any stuck endpoint</text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="1090" width="1480" height="75" rx="14" fill="#207448"/>
    
    <g transform="translate(90, 1102)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 26 6 L 46 14 V 28 C 46 38 36 46 26 50 C 16 46 6 38 6 28 V 14 Z"/>
      <polyline points="17 26, 23 32, 35 18"/>
    </g>
    <text x="800" y="1137" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">ECN must act well before PFC</text>
  </g>
</svg>