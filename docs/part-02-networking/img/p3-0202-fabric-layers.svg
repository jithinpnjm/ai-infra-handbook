<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Five AI fabrics against the layers: which one carries what</title>
  <desc>Visual comparison grid of five AI networking fabrics across OSI layers L1/L2, L3, and L4/transport, alongside the NCCL collective hierarchy.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Five AI fabrics against the layers: which one carries what</text>

  
  <g>
    
    <rect x="352" y="110" width="250" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="477" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">L1/L2</text>

    
    <rect x="614" y="110" width="250" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="739" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">L3</text>

    
    <rect x="876" y="110" width="340" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1046" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">L4 and transport</text>

    
    <rect x="1252" y="110" width="308" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1406" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">NCCL hierarchy</text>
  </g>

  
  <g>
    
    <rect x="40" y="180" width="300" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(56, 196)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="44" height="24" rx="4"/>
      <line x1="10" y1="20" x2="14" y2="20"/>
      <line x1="22" y1="20" x2="26" y2="20"/>
      <line x1="34" y1="20" x2="38" y2="20"/>
    </g>
    <text x="56" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="56" dy="0">Ethernet with TCP</tspan>
      <tspan x="56" dy="30">(front end, storage,</tspan>
      <tspan x="56" dy="30">control plane)</tspan>
    </text>

    
    <rect x="352" y="180" width="250" height="160" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="372" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="372" dy="0">Ethernet</tspan>
      <tspan x="372" dy="30">25/100/400 GbE</tspan>
    </text>

    
    <rect x="614" y="180" width="250" height="160" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="634" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="634" dy="0">IP (BGP/ECMP</tspan>
      <tspan x="634" dy="30">in Clos)</tspan>
    </text>

    
    <rect x="876" y="180" width="340" height="160" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="896" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" dy="0">TCP and UDP</tspan>
      <tspan x="896" dy="30">in the kernel;</tspan>
      <tspan x="896" dy="30">CUBIC or BBR</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="356" width="300" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(56, 374)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="44" height="28" rx="4"/>
      <path d="M12 20 L22 12 L26 22 L36 14"/>
    </g>
    <text x="56" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">RoCE v2</text>

    
    <rect x="352" y="356" width="250" height="175" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="372" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="372" dy="0">Lossless</tspan>
      <tspan x="372" dy="30">Ethernet</tspan>
      <tspan x="372" dy="30">(PFC, ECN, DCB)</tspan>
    </text>

    
    <rect x="614" y="356" width="250" height="175" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="634" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">IP, routable</text>

    
    <rect x="876" y="356" width="340" height="175" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
    <text x="896" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" dy="0">UDP 4791 plus</tspan>
      <tspan x="896" dy="28">IB transport (BTH)</tspan>
      <tspan x="896" dy="28">in the NIC;</tspan>
      <tspan x="896" dy="28">RDMA verbs bypass</tspan>
      <tspan x="896" dy="28">the kernel stack</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="547" width="300" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(56, 565)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <circle cx="36" cy="12" r="5"/>
      <circle cx="24" cy="30" r="5"/>
      <line x1="16" y1="14" x2="32" y2="14"/>
      <line x1="14" y1="16" x2="21" y2="26"/>
      <line x1="34" y1="16" x2="27" y2="26"/>
    </g>
    <text x="56" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">InfiniBand</text>

    
    <rect x="352" y="547" width="250" height="175" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="372" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="372" dy="0">IB link layer,</tspan>
      <tspan x="372" dy="30">credit-based,</tspan>
      <tspan x="372" dy="30">virtual lanes</tspan>
    </text>

    
    <rect x="614" y="547" width="250" height="175" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="634" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="634" dy="0">IB network</tspan>
      <tspan x="634" dy="28">layer, GIDs,</tspan>
      <tspan x="634" dy="28">LIDs inside</tspan>
      <tspan x="634" dy="28">subnets,</tspan>
      <tspan x="634" dy="28">GRH across</tspan>
    </text>

    
    <rect x="876" y="547" width="340" height="175" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="896" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" dy="0">IB transport RC/UD</tspan>
      <tspan x="896" dy="28">in the NIC;</tspan>
      <tspan x="896" dy="28">Subnet Manager</tspan>
      <tspan x="896" dy="28">computes forwarding</tspan>
      <tspan x="896" dy="28">tables</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="738" width="300" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(56, 754)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="16" height="16" rx="2"/>
      <rect x="28" y="6" width="16" height="16" rx="2"/>
      <line x1="20" y1="14" x2="28" y2="14"/>
      <line x1="12" y1="22" x2="12" y2="28"/>
      <line x1="36" y1="22" x2="36" y2="28"/>
      <line x1="12" y1="28" x2="36" y2="28"/>
    </g>
    <text x="56" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="56" dy="0">NVLink /</tspan>
      <tspan x="56" dy="34">NVSwitch</tspan>
    </text>

    
    <rect x="352" y="738" width="250" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="372" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="372" dy="0">proprietary</tspan>
      <tspan x="372" dy="30">GPU-to-GPU</tspan>
      <tspan x="372" dy="30">links</tspan>
    </text>

    
    <rect x="614" y="738" width="250" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="634" y="806" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="634" dy="0">no IP,</tspan>
      <tspan x="634" dy="30">memory-semantic</tspan>
    </text>

    
    <rect x="876" y="738" width="340" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="896" y="806" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" dy="0">load/store and DMA</tspan>
      <tspan x="896" dy="30">between GPUs</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="899" width="300" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(56, 915)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="20" rx="3"/>
      <line x1="8" y1="26" x2="8" y2="34"/>
      <line x1="16" y1="26" x2="16" y2="34"/>
      <line x1="24" y1="26" x2="24" y2="34"/>
      <line x1="32" y1="26" x2="32" y2="34"/>
      <line x1="40" y1="26" x2="40" y2="34"/>
    </g>
    <text x="56" y="990" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">PCIe</text>

    
    <rect x="352" y="899" width="250" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="372" y="965" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="372" dy="0">serial links,</tspan>
      <tspan x="372" dy="30">TLPs</tspan>
    </text>

    
    <rect x="614" y="899" width="250" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="634" y="978" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a bus</text>

    
    <rect x="876" y="899" width="340" height="145" rx="8" fill="#ffffff" stroke="#e8f1ea" stroke-width="2"/>
    <text x="896" y="965" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="896" dy="0">GPU-NIC-CPU paths;</tspan>
      <tspan x="896" dy="30">locality matters</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1252" y="180" width="308" height="864" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1268, 204)">
      <rect x="0" y="0" width="276" height="248" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(110, 24)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="48" height="48" rx="6"/>
        <circle cx="28" cy="28" r="10"/>
        <line x1="28" y1="4" x2="28" y2="12"/>
        <line x1="28" y1="44" x2="28" y2="52"/>
        <line x1="4" y1="28" x2="12" y2="28"/>
        <line x1="44" y1="28" x2="52" y2="28"/>
      </g>
      <text x="138" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="138" dy="0">NVLink inside</tspan>
        <tspan x="138" dy="32">the node</tspan>
      </text>
    </g>

    
    <g transform="translate(1268, 488)">
      <rect x="0" y="0" width="276" height="248" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(110, 24)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="20" rx="3"/>
        <rect x="34" y="6" width="20" height="20" rx="3"/>
        <rect x="18" y="32" width="20" height="20" rx="3"/>
        <line x1="22" y1="16" x2="34" y2="16"/>
        <line x1="16" y1="26" x2="24" y2="32"/>
        <line x1="40" y1="26" x2="32" y2="32"/>
      </g>
      <text x="138" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="138" dy="0">NIC and fabric</tspan>
        <tspan x="138" dy="32">between nodes</tspan>
      </text>
    </g>

    
    <g transform="translate(1268, 772)">
      <rect x="0" y="0" width="276" height="252" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(110, 22)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="40" height="34" rx="5"/>
        <path d="M18 40 L18 48 L38 48 L38 40"/>
        <line x1="20" y1="18" x2="20" y2="28"/>
        <line x1="28" y1="18" x2="28" y2="28"/>
        <line x1="36" y1="18" x2="36" y2="28"/>
      </g>
      <text x="138" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="138" dy="0">TCP sockets as</tspan>
        <tspan x="138" dy="32">the fallback and</tspan>
        <tspan x="138" dy="32">for bootstrap</tspan>
      </text>
    </g>
  </g>

  
  <g>
    <rect x="40" y="1064" width="1520" height="76" rx="10" fill="#207448"/>
    <text x="800" y="1112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">When a collective runs slowly, first find out which link in this hierarchy it is using</text>
  </g>
</svg>