<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From a file of thousands of packets to one event in Wireshark</title>
  <desc>Visual infographic showing the five-step process to locate a specific network issue from a packet capture, alongside alternative CLI tools and TLS decryption setup.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">From a file of thousands of packets to one event in Wireshark</text>

  

  
  <g id="step-1">
    <rect x="40" y="115" width="840" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="85" cy="172" r="24" fill="#207448" />
    <text x="85" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <g transform="translate(130, 144)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 4 L 34 4 L 46 16 L 46 50 L 8 50 Z" />
      <polyline points="34,4 34,16 46,16" />
      <line x1="16" y1="26" x2="38" y2="26" />
      <line x1="16" y1="34" x2="38" y2="34" />
      <line x1="16" y1="42" x2="28" y2="42" />
    </g>
    <text x="210" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Open the file</text>
  </g>

  
  <line x1="85" y1="230" x2="85" y2="258" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="step-2">
    <rect x="40" y="260" width="840" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="85" cy="337" r="24" fill="#207448" />
    <text x="85" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <g transform="translate(130, 309)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="4" />
      <line x1="16" y1="40" x2="16" y2="28" stroke-width="4.5" />
      <line x1="28" y1="40" x2="28" y2="16" stroke-width="4.5" />
      <line x1="40" y1="40" x2="40" y2="24" stroke-width="4.5" />
    </g>
    <text x="210" y="325" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="210" dy="0" font-size="30" font-weight="bold">Statistics, then Conversations:</tspan>
      <tspan x="210" dy="38" font-size="24">which pair of hosts carried the most bytes</tspan>
    </text>
  </g>

  
  <line x1="85" y1="415" x2="85" y2="443" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="step-3">
    <rect x="40" y="445" width="840" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="85" cy="510" r="24" fill="#207448" />
    <text x="85" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <g transform="translate(130, 482)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="6,8 50,8 32,28 32,46 24,50 24,28" />
    </g>
    <text x="210" y="500" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="210" dy="0" font-size="30" font-weight="bold">Filter on the conversation</tspan>
      <tspan x="210" dy="36" font-size="30" font-weight="bold">that matters</tspan>
    </text>
  </g>

  
  <line x1="85" y1="575" x2="85" y2="603" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <g id="step-4">
    <rect x="40" y="605" width="840" height="270" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />
    <circle cx="85" cy="740" r="24" fill="#db8129" />
    <text x="85" y="748" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <g transform="translate(130, 712)" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 52,48 4,48" />
      <line x1="28" y1="18" x2="28" y2="34" stroke-width="4" />
      <circle cx="28" cy="42" r="2" fill="#db8129" stroke="none" />
    </g>
    <text x="210" y="662" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="210" dy="0" font-size="30" font-weight="bold" fill="#db8129">Analyze, then Expert Information:</tspan>
      <tspan x="210" dy="38" font-size="24">retransmissions, duplicate ACKs, zero windows,</tspan>
      <tspan x="210" dy="34" font-size="24">out-of-order segments, full windows and resets</tspan>
      <tspan x="210" dy="34" font-size="24" font-weight="bold" fill="#db8129">as coloured entries</tspan>
    </text>
  </g>

  
  <line x1="85" y1="875" x2="85" y2="903" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="step-5">
    <rect x="40" y="905" width="840" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="85" cy="985" r="24" fill="#207448" />
    <text x="85" y="993" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <g transform="translate(130, 957)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20" />
      <circle cx="28" cy="28" r="8" />
      <line x1="28" y1="4" x2="28" y2="14" />
      <line x1="28" y1="42" x2="28" y2="52" />
      <line x1="4" y1="28" x2="14" y2="28" />
      <line x1="42" y1="28" x2="52" y2="28" />
    </g>
    <text x="210" y="972" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="210" dy="0" font-size="30" font-weight="bold">Click one entry and</tspan>
      <tspan x="210" dy="38" font-size="30" font-weight="bold">Wireshark jumps to that packet</tspan>
    </text>
  </g>

  

  
  <g id="side-panel-other-tools">
    <rect x="910" y="115" width="650" height="465" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(935, 130)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="44" height="32" rx="4" />
      <path d="M 20 16 L 20 10 L 36 10 L 36 16" />
      <line x1="6" y1="28" x2="50" y2="28" />
      <circle cx="28" cy="38" r="4" />
    </g>
    <text x="1005" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Other tools</text>
    <line x1="935" y1="198" x2="1535" y2="198" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />

    
    <circle cx="945" cy="238" r="5" fill="#207448" />
    <text x="965" y="226" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="965" dy="0" font-size="24">Follow TCP, UDP or TLS stream</tspan>
      <tspan x="965" dy="28" font-size="24">reassembles a conversation</tspan>
    </text>

    
    <circle cx="945" cy="322" r="5" fill="#207448" />
    <text x="965" y="296" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="965" dy="0" font-size="24">Decode As maps a port to a dissector,</tspan>
      <tspan x="965" dy="28" font-size="24">e.g. UDP 4791 as RoCE, or a custom port</tspan>
      <tspan x="965" dy="28" font-size="24">as VXLAN or GENEVE</tspan>
    </text>

    
    <circle cx="945" cy="406" r="5" fill="#207448" />
    <text x="965" y="394" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="965" dy="0" font-size="24">TCP stream graphs: time-sequence,</tspan>
      <tspan x="965" dy="28" font-size="24">throughput, RTT, window scaling</tspan>
    </text>

    
    <circle cx="945" cy="476" r="5" fill="#207448" />
    <text x="965" y="464" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="965" dy="0" font-size="24">time display since the previous</tspan>
      <tspan x="965" dy="28" font-size="24">displayed packet reveals gaps</tspan>
    </text>

    
    <circle cx="945" cy="546" r="5" fill="#207448" />
    <text x="965" y="534" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="965" dy="0" font-size="24">File, Export Specified Packets shares</tspan>
      <tspan x="965" dy="28" font-size="24">only the evidence you need</tspan>
    </text>
  </g>

  
  <g id="headless-alternative">
    <rect x="910" y="600" width="650" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(935, 615)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="38" rx="4" />
      <polyline points="14,20 22,27 14,34" />
      <line x1="26" y1="34" x2="38" y2="34" />
    </g>
    <text x="1005" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Headless alternative</text>
    <line x1="935" y1="675" x2="1535" y2="675" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />

    <rect x="930" y="690" width="610" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="945" y="722" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="945" dy="0">tshark -r c.pcap -q -z io,stat,1;</tspan>
      <tspan x="945" dy="32">-z conv,tcp; -z endpoints,ip;</tspan>
      <tspan x="945" dy="32">-z expert; -qz follow,tcp,ascii,5</tspan>
    </text>
  </g>

  
  <g id="tls-lab">
    <rect x="910" y="835" width="650" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(935, 848)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="22" width="36" height="28" rx="4" />
      <path d="M 18 22 L 18 14 A 10 10 0 0 1 38 14 L 38 22" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
      <line x1="28" y1="37" x2="28" y2="43" />
    </g>
    <text x="1005" y="885" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TLS lab</text>
    <line x1="935" y1="910" x2="1535" y2="910" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />

    <rect x="930" y="925" width="610" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="945" y="955" fill="#303a36">
      <tspan x="945" dy="0" font-family="ui-monospace, monospace" font-size="24">SSLKEYLOGFILE=/tmp/keys.log curl ...</tspan>
      <tspan x="945" dy="32" font-family="system-ui, -apple-system, sans-serif" font-size="24">then point Edit, Preferences, Protocols,</tspan>
      <tspan x="945" dy="32" font-family="system-ui, -apple-system, sans-serif" font-size="24">TLS, (Pre)-Master-Secret log filename</tspan>
      <tspan x="945" dy="32" font-family="system-ui, -apple-system, sans-serif" font-size="24">at the file</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1120" width="1520" height="60" rx="10" fill="#207448" />
    <text x="800" y="1157" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">You move from thousands of packets to one event</text>
  </g>
</svg>