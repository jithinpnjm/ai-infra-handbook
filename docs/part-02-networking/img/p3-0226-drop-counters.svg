<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Reading the two drop counters before you trust a capture</title>
  <desc>A decision ladder showing how to read kernel and interface drop counters after a capture to determine if packet loss occurred or if the trace is complete.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="50" y="60" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading the two drop counters before you trust a capture</text>

  
  <g id="root-node">
    <rect x="50" y="100" width="1050" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <rect x="75" y="115" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="87" y1="130" x2="109" y2="130" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="87" y1="140" x2="101" y2="140" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="87" y1="150" x2="105" y2="150" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="145" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Capture finished: read the summary</text>
  </g>

  
  <path d="M 120 175 L 120 645" fill="none" stroke="#207448" stroke-width="3" />

  
  <g id="branch-1">
    <path d="M 120 230 L 430 230" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="270" y="194" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="270" dy="0">N packets dropped</tspan>
      <tspan x="270" dy="28">by kernel</tspan>
    </text>

    
    <rect x="430" y="195" width="670" height="230" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <path d="M 458 214 v 32 h 44 v -32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <rect x="465" y="230" width="30" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="468" y="212" width="30" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" transform="rotate(-15 468 212)" />

    <text x="525" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">the capture socket's buffer overflowed</text>

    
    <rect x="450" y="265" width="630" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    
    
    <circle cx="475" cy="296" r="5" fill="#207448" />
    <text x="495" y="303" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">raise -B</text>

    
    <circle cx="475" cy="331" r="5" fill="#207448" />
    <text x="495" y="338" font-family="sans-serif" font-size="24" fill="#303a36">narrow the filter</text>

    
    <circle cx="475" cy="366" r="5" fill="#207448" />
    <text x="495" y="373" font-family="sans-serif" font-size="24" fill="#303a36">write to fast storage</text>

    
    <circle cx="475" cy="401" r="5" fill="#207448" />
    <text x="495" y="408" font-family="monospace" font-size="24" fill="#303a36">truncate with -s 96 or -s 128</text>
  </g>

  
  <g id="branch-2">
    <path d="M 120 515 L 430 515" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="270" y="478" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="270" dy="0">N packets dropped</tspan>
      <tspan x="270" dy="28">by interface</tspan>
    </text>

    
    <rect x="430" y="465" width="670" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="455" y="488" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="463" y1="522" x2="463" y2="530" stroke="#207448" stroke-width="3" />
    <line x1="471" y1="522" x2="471" y2="530" stroke="#207448" stroke-width="3" />
    <line x1="479" y1="522" x2="479" y2="530" stroke="#207448" stroke-width="3" />
    <path d="M 455 497 h -8 v 16 h 8" fill="none" stroke="#207448" stroke-width="3" />

    <text x="525" y="508" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="525" dy="0">the NIC dropped them</tspan>
      <tspan x="525" dy="32">before the capture saw them</tspan>
    </text>
  </g>

  
  <g id="branch-3">
    <path d="M 120 645 L 430 645" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
    <text x="270" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="270" dy="0">0 dropped</tspan>
      <tspan x="270" dy="28">by kernel</tspan>
    </text>

    
    <rect x="430" y="605" width="670" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="478" cy="635" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 467 635 l 7 8 l 16 -16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <text x="525" y="643" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">the picture is complete</text>

    
    <rect x="455" y="668" width="625" height="64" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="475" y="694" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="475" dy="0">9 packets received by filter,</tspan>
      <tspan x="475" dy="28">0 packets dropped by kernel</tspan>
    </text>
  </g>

  
  <g id="side-worked-example">
    <rect x="1140" y="100" width="410" height="645" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="1165" y="125" width="360" height="80" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="1165" y="125" width="130" height="80" rx="6" fill="#207448" stroke="#207448" stroke-width="2" />
    <text x="1230" y="172" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">-s 96</text>
    
    <line x1="1295" y1="120" x2="1295" y2="210" stroke="#db8129" stroke-width="3" stroke-dasharray="6 4" />
    <text x="1405" y="172" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#75827b">1500 B</text>

    
    <text x="1165" y="255" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1165" dy="0">a full 1500 byte web</tspan>
      <tspan x="1165" dy="36">response with -s 96 keeps</tspan>
      <tspan x="1165" dy="36">the Ethernet, IP and TCP</tspan>
      <tspan x="1165" dy="36">headers and a few bytes</tspan>
      <tspan x="1165" dy="36">of payload; the rest is</tspan>
      <tspan x="1165" dy="36">discarded before it</tspan>
      <tspan x="1165" dy="36">reaches the file; you give</tspan>
      <tspan x="1165" dy="36">up the body and the</tspan>
      <tspan x="1165" dy="36">file stays small</tspan>
    </text>
  </g>

  
  <g id="warning-box">
    <rect x="50" y="785" width="1500" height="170" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <rect x="50" y="785" width="12" height="170" rx="4" fill="#db8129" />
    
    
    <path d="M 100 890 L 125 840 L 150 890 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="125" y1="856" x2="125" y2="872" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="125" cy="881" r="2.5" fill="#db8129" />

    
    <text x="180" y="836" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="180" dy="0">A capture that lost packets can look like a healthy network;</tspan>
      <tspan x="180" dy="38">stop, reduce the snaplen, narrow the filter and capture again</tspan>
      <tspan x="180" dy="38">before you read anything into the first file</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="995" width="1500" height="80" rx="10" fill="#207448" />
    <text x="800" y="1046" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Never trust a drop-free result from an overloaded host without checking dropped by kernel</text>
  </g>
</svg>