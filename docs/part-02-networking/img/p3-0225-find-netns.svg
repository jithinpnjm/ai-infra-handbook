<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Finding a container's network namespace from the node</title>
  <desc>Visual infographic explaining how to find a container or pod network namespace from a Linux host node, distinguishing between named namespaces under /run/netns and anonymous namespaces managed by container runtimes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Finding a container's network namespace from the node</text>
  <line x1="40" y1="95" x2="1560" y2="95" stroke="#b8d5c0" stroke-width="2"/>

  
  <path d="M 310 470 L 335 470 L 335 305 L 360 305" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M 310 650 L 335 650 L 335 810 L 360 810" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <g id="left-start">
    <rect x="40" y="380" width="270" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 175 425 L 203 440 L 203 475 L 175 490 L 147 475 L 147 440 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 175 425 L 175 490 M 175 455 L 203 440 M 175 455 L 147 440" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    
    <text x="175" y="535" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="175" dy="0">You have a</tspan>
      <tspan x="175" dy="38">container or pod</tspan>
      <tspan x="175" dy="38">and need its</tspan>
      <tspan x="175" dy="38">namespace</tspan>
    </text>
  </g>

  
  <g id="route-a">
    <rect x="360" y="110" width="710" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    
    <path d="M 385 145 L 405 125 L 425 125 L 435 135 L 435 155 L 415 175 L 385 145 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="418" cy="142" r="4" fill="#207448"/>
    
    
    <text x="450" y="157" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">named namespace</text>
    
    
    <text x="385" y="210" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">ip netns add red</tspan>
      <tspan font-family="sans-serif"> creates </tspan>
      <tspan font-family="monospace">/run/netns/red</tspan>
      <tspan x="385" dy="32" font-family="sans-serif"> (a bind mount to the namespace)</tspan>
    </text>

    
    <text x="385" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ip netns list</text>

    
    <text x="385" y="322" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ip netns exec red ip link</text>

    
    <text x="385" y="364" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">ip -n red link set lo up</tspan>
      <tspan font-family="sans-serif"> (-n is shorthand)</tspan>
    </text>

    
    <text x="385" y="415" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">lsns -t net</tspan>
      <tspan font-family="sans-serif"> lists all network namespaces</tspan>
      <tspan x="385" dy="32" font-family="sans-serif">and their processes</tspan>
    </text>
  </g>

  
  <g id="route-b">
    <rect x="360" y="525" width="710" height="565" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>

    
    <rect x="382" y="546" width="50" height="40" rx="6" fill="none" stroke="#db8129" stroke-width="4"/>
    <path d="M 392 566 L 402 566 M 392 574 L 418 574" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>

    
    <text x="445" y="562" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      <tspan x="445" dy="0">anonymous namespace made by</tspan>
      <tspan x="445" dy="36">a container runtime</tspan>
      <tspan x="445" dy="36">(not under /run/netns)</tspan>
    </text>

    
    <circle cx="395" cy="710" r="24" fill="#207448"/>
    <text x="395" y="710" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="435" y="675" font-size="24" fill="#303a36">
      <tspan x="435" dy="0" font-family="sans-serif" font-weight="bold">find the PID:</tspan>
      <tspan x="435" dy="30" font-family="monospace">docker inspect -f {{.State.Pid}},</tspan>
      <tspan x="435" dy="30" font-family="monospace">crictl inspectp &lt;pod-id&gt; | jq .info.pid,</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">or kubectl plus access to the node</tspan>
    </text>

    
    <circle cx="395" cy="830" r="24" fill="#207448"/>
    <text x="395" y="830" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="435" y="795" font-size="24" fill="#303a36">
      <tspan x="435" dy="0" font-family="monospace" font-weight="bold">sudo nsenter -t &lt;pid&gt; -n ip addr:</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">runs host tools inside the namespace,</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">so ip, ss and tcpdump work in a pod</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">that ships without them</tspan>
    </text>

    
    <circle cx="395" cy="970" r="24" fill="#207448"/>
    <text x="395" y="970" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="435" y="945" font-size="24" fill="#303a36">
      <tspan x="435" dy="0" font-family="monospace" font-weight="bold">ls -l /proc/&lt;pid&gt;/ns/net:</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">compare inode numbers to see whether</tspan>
      <tspan x="435" dy="30" font-family="sans-serif">two processes share a namespace</tspan>
    </text>
  </g>

  
  <g id="right-panel-top">
    <rect x="1110" y="110" width="450" height="425" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <circle cx="1145" cy="145" r="9" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="1125" cy="172" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="1165" cy="172" r="7" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1139" y1="152" x2="1130" y2="166" stroke="#207448" stroke-width="3"/>
    <line x1="1151" y1="152" x2="1160" y2="166" stroke="#207448" stroke-width="3"/>

    
    <text x="1185" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">What a namespace holds</text>
    <line x1="1130" y1="190" x2="1540" y2="190" stroke="#b8d5c0" stroke-width="2"/>

    
    <text x="1135" y="225" font-size="24" fill="#303a36">
      <tspan x="1135" dy="0" font-family="sans-serif">its own network interfaces,</tspan>
      <tspan x="1135" dy="34" font-family="sans-serif">IP addresses,</tspan>
      <tspan x="1135" dy="34" font-family="sans-serif">routing tables, ARP and ND</tspan>
      <tspan x="1135" dy="34" font-family="sans-serif">neighbour tables, netfilter</tspan>
      <tspan x="1135" dy="34" font-family="sans-serif">rules, conntrack table,</tspan>
      <tspan x="1135" dy="34" font-family="monospace">/proc/net</tspan><tspan font-family="sans-serif">, sockets,</tspan>
      <tspan x="1135" dy="34" font-family="sans-serif">port numbers, and</tspan>
      <tspan x="1135" dy="34" font-family="monospace">net.*</tspan><tspan font-family="sans-serif"> sysctls</tspan>
    </text>
  </g>

  
  <g id="right-panel-bottom">
    <rect x="1110" y="565" width="450" height="525" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

    
    <circle cx="1145" cy="610" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="1137" cy="610" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="1153" cy="610" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 1131 624 Q 1145 618 1159 624" fill="none" stroke="#207448" stroke-width="3"/>

    
    <text x="1135" y="665" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1135" dy="0">a Kubernetes pod shares</tspan>
      <tspan x="1135" dy="36">one namespace among its</tspan>
      <tspan x="1135" dy="36">containers; the pause</tspan>
      <tspan x="1135" dy="36">container (sandbox)</tspan>
      <tspan x="1135" dy="36">creates it, so containers</tspan>
      <tspan x="1135" dy="36">in a pod talk over</tspan>
      <tspan x="1135" dy="36">localhost; it also keeps</tspan>
      <tspan x="1135" dy="36">the namespace alive across</tspan>
      <tspan x="1135" dy="36">container restarts</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="60" rx="12" fill="#207448"/>
    <text x="800" y="1152" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Find the namespace before you run any network command, because host tools only see the stack of the host</text>
  </g>
</svg>