<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Spreading a flow across queues and cores</title>
  <desc>Visual infographic explaining network flow hashing across NIC receive queues, interrupts, and CPU cores with RSS, RPS, and XPS mechanisms.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="50" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Spreading a flow across queues and cores</text>

  
  <g transform="translate(1000, 38)">
    <rect x="0" y="0" width="550" height="64" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    
    <path d="M 30 46 L 46 18 L 62 46 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="46" y1="28" x2="46" y2="36" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="46" cy="41" r="2" fill="#db8129" />
    <text x="76" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">One core cannot process 100 Gb/s on its own</text>
  </g>

  
  <rect x="50" y="130" width="1500" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="410" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 24)">
      <rect x="0" y="8" width="56" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 28 L 44 28" stroke="#207448" stroke-width="4" stroke-dasharray="4 4" />
      <path d="M 36 20 L 44 28 L 36 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="96" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Network Flow</text>

    
    <text x="24" y="130" font-family="sans-serif" font-size="24" fill="#303a36" line-height="36">
      <tspan x="24" dy="0">A flow's addresses and</tspan>
      <tspan x="24" dy="36">ports are hashed (Toeplitz)</tspan>
      <tspan x="24" dy="36">to pick one queue, so each</tspan>
      <tspan x="24" dy="36">flow stays on one core,</tspan>
      <tspan x="24" dy="36">keeping packet order</tspan>
      <tspan x="24" dy="36">and cache.</tspan>
    </text>

    
    <rect x="24" y="370" width="362" height="66" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="40" y="412" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Toeplitz Hash(5-tuple)</text>
  </g>

  
  <line x1="490" y1="390" x2="576" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="370" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(24, 24)">
      <rect x="0" y="10" width="56" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="14" y1="48" x2="14" y2="56" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="4" />
      <line x1="42" y1="48" x2="42" y2="56" stroke="#207448" stroke-width="4" />
      <circle cx="16" cy="24" r="4" fill="#207448" />
      <circle cx="30" cy="24" r="4" fill="#207448" />
    </g>

    <text x="96" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NIC</text>
    <text x="96" y="88" font-family="sans-serif" font-size="24" fill="#303a36">receive queues Q0 to Q3</text>

    
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Receive Queue Q0</text>
    </g>
    <g transform="translate(24, 194)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Receive Queue Q1</text>
    </g>
    <g transform="translate(24, 278)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Receive Queue Q2</text>
    </g>
    <g transform="translate(24, 362)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Receive Queue Q3</text>
    </g>
  </g>

  
  
  <line x1="926" y1="303" x2="1144" y2="303" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="956" y="278" width="160" height="34" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="968" y="303" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">IRQ 0</text>

  
  <line x1="926" y1="387" x2="1144" y2="387" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="956" y="362" width="160" height="34" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="968" y="387" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">IRQ 1</text>

  
  <line x1="926" y1="471" x2="1144" y2="471" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="956" y="446" width="160" height="34" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="968" y="471" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">IRQ 2</text>

  
  <line x1="926" y1="555" x2="1144" y2="555" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="956" y="530" width="160" height="34" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="968" y="555" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">IRQ 3</text>

  
  <g transform="translate(1150, 160)">
    <rect x="0" y="0" width="370" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(24, 24)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" fill="#207448" />
      
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" />
    </g>

    <text x="96" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU Cores</text>
    <text x="96" y="88" font-family="sans-serif" font-size="24" fill="#303a36">core 0 to 3</text>

    
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">CPU Core 0</text>
    </g>
    <g transform="translate(24, 194)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">CPU Core 1</text>
    </g>
    <g transform="translate(24, 278)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">CPU Core 2</text>
    </g>
    <g transform="translate(24, 362)">
      <rect x="0" y="0" width="322" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">CPU Core 3</text>
    </g>
  </g>

  
  
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="470" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(28, 24)">
      <rect x="4" y="10" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="27" r="7" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 28 14 L 28 20 M 28 34 L 28 40 M 15 27 L 21 27 M 35 27 L 41 27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="100" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">RSS: hardware</text>

    
    <text x="28" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">NIC hashes to N receive</tspan>
      <tspan x="28" dy="36">queues</tspan>
    </text>

    
    <rect x="24" y="230" width="422" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="44" y="272" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ethtool -l eth0</text>
  </g>

  
  <g transform="translate(565, 680)">
    <rect x="0" y="0" width="470" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(28, 24)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="6" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="3" />
      <circle cx="16" cy="14" r="2" fill="#207448" />
      <circle cx="24" cy="14" r="2" fill="#207448" />
      <path d="M 18 36 L 26 28 L 18 24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="100" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">RPS: software</text>

    
    <text x="28" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">Steers to other CPUs after</tspan>
      <tspan x="28" dy="36">the interrupt</tspan>
    </text>

    
    <rect x="24" y="230" width="422" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="44" y="272" font-family="sans-serif" font-size="24" fill="#303a36">Software packet steering</text>
  </g>

  
  <g transform="translate(1080, 680)">
    <rect x="0" y="0" width="470" height="330" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(28, 24)">
      <path d="M 28 8 L 48 16 L 48 32 C 48 42 28 50 28 50 C 28 50 8 42 8 32 L 8 16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <path d="M 20 28 L 26 34 L 38 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="100" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">XPS: TX steering</text>

    
    <text x="28" y="125" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">Maps CPUs to TX queues,</tspan>
      <tspan x="28" dy="36">avoids lock contention</tspan>
      <tspan x="28" dy="36">and cross-NUMA transmit</tspan>
    </text>

    
    <rect x="24" y="230" width="422" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="44" y="272" font-family="sans-serif" font-size="24" fill="#303a36">NUMA-local transmission</text>
  </g>

  
  <g transform="translate(50, 1040)">
    <rect x="0" y="0" width="1500" height="76" rx="12" fill="#207448" />
    
    
    <g transform="translate(28, 16)">
      <rect x="0" y="0" width="50" height="44" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
      <path d="M 10 16 L 20 22 L 10 28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="28" x2="38" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="100" y="47" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">mpstat -P ALL 1: <tspan font-family="sans-serif" font-weight="normal">is one core at 100%?</tspan></text>
  </g>
</svg>