<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Linux bonding modes</title>
  <desc>Comparison table of Linux network bonding modes 0 through 6 detailing behavior, switch support requirements, and practical choices for servers.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="60" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Linux bonding modes</text>

  
  <rect x="60" y="112" width="1480" height="56" rx="8" fill="#207448" />
  <text x="125" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Mode</text>
  <text x="210" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Name</text>
  <text x="540" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Behaviour</text>
  <text x="1070" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Switch support</text>

  
  <g id="row-mode-0">
    <rect x="60" y="180" width="1480" height="96" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <circle cx="125" cy="228" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="125" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">0</text>
    
    
    <g transform="translate(208, 205)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 23 4 A 19 19 0 0 1 42 23" />
      <polyline points="35,23 42,23 42,16" />
      <path d="M 23 42 A 19 19 0 0 1 4 23" />
      <polyline points="11,23 4,23 4,30" />
      <circle cx="23" cy="23" r="4" fill="#207448" stroke="none" />
    </g>
    <text x="270" y="237" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">balance-rr</text>
    <text x="540" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">per-packet round robin</text>
    <text x="1070" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1070" dy="0">static bundle,</tspan>
      <tspan x="1070" dy="30">reordering risk</tspan>
    </text>
  </g>

  
  <g id="row-mode-1">
    <rect x="60" y="288" width="1480" height="96" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <circle cx="125" cy="336" r="24" fill="#db8129" />
    <text x="125" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <g transform="translate(208, 313)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 23 4 L 39 10 L 39 23 C 39 34 23 42 23 42 C 23 42 7 34 7 23 L 7 10 Z" />
      <polyline points="16,23 21,28 31,17" />
    </g>
    <text x="270" y="345" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#db8129">active-backup</text>
    <text x="540" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">one active member</text>
    <text x="1070" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">none needed</text>
  </g>

  
  <g id="row-mode-2">
    <rect x="60" y="396" width="1480" height="96" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <circle cx="125" cy="444" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="125" y="453" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">2</text>
    
    
    <g transform="translate(208, 421)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="38" y2="16" />
      <line x1="8" y1="30" x2="38" y2="30" />
      <line x1="17" y1="7" x2="13" y2="39" />
      <line x1="31" y1="7" x2="27" y2="39" />
    </g>
    <text x="270" y="453" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">balance-xor</text>
    <text x="540" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">hash of MAC or xmit_hash_policy</text>
    <text x="1070" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">static bundle</text>
  </g>

  
  <g id="row-mode-3">
    <rect x="60" y="504" width="1480" height="96" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <circle cx="125" cy="552" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="125" y="561" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">3</text>
    
    
    <g transform="translate(208, 529)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="23" cy="27" r="4" fill="#207448" />
      <path d="M 15 19 A 12 12 0 0 1 31 19" />
      <path d="M 9 13 A 20 20 0 0 1 37 13" />
      <line x1="23" y1="31" x2="23" y2="41" />
      <line x1="17" y1="41" x2="29" y2="41" />
    </g>
    <text x="270" y="561" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">broadcast</text>
    <text x="540" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">all members</text>
    <text x="1070" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rare</text>
  </g>

  
  <g id="row-mode-4">
    <rect x="60" y="612" width="1480" height="96" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    <circle cx="125" cy="660" r="24" fill="#db8129" />
    <text x="125" y="669" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <g transform="translate(208, 637)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="14" x2="40" y2="14" />
      <line x1="6" y1="24" x2="40" y2="24" />
      <line x1="6" y1="34" x2="40" y2="34" />
      <path d="M 17 8 L 29 8 L 29 40 L 17 40 Z" stroke-width="2.5" fill="#fffaf5" />
    </g>
    <text x="270" y="669" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#db8129">802.3ad</text>
    <text x="540" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">LACP</text>
    <text x="1070" y="668" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">LACP on the switch</text>
  </g>

  
  <g id="row-mode-5">
    <rect x="60" y="720" width="1480" height="96" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <circle cx="125" cy="768" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="125" y="777" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">5</text>
    
    
    <g transform="translate(208, 745)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="38" y2="16" />
      <polyline points="28,9 38,16 28,23" />
      <line x1="8" y1="32" x2="38" y2="32" />
      <polyline points="28,25 38,32 28,39" />
    </g>
    <text x="270" y="777" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">balance-tlb</text>
    <text x="540" y="776" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"></text>
    <text x="1070" y="776" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">none</text>
  </g>

  
  <g id="row-mode-6">
    <rect x="60" y="828" width="1480" height="96" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
    <circle cx="125" cy="876" r="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="125" y="885" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">6</text>
    
    
    <g transform="translate(208, 853)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="16" x2="38" y2="16" />
      <polyline points="28,9 38,16 28,23" />
      <line x1="38" y1="32" x2="8" y2="32" />
      <polyline points="18,25 8,32 18,39" />
    </g>
    <text x="270" y="885" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448">balance-alb</text>
    <text x="540" y="884" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"></text>
    <text x="1070" y="884" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">none</text>
  </g>

  
  <rect x="60" y="944" width="1480" height="76" rx="10" fill="#207448" />
  <text x="800" y="991" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">For servers two modes are practical: active-backup and LACP</text>
</svg>