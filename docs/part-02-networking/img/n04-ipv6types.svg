<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Reading IPv6 address prefixes</title>
  <desc>Visual reference table of standard IPv6 address prefixes, their meanings, and the absence of broadcast in IPv6.</desc>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="80" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading IPv6 address prefixes</text>

  
  <rect x="80" y="140" width="1440" height="64" rx="8" fill="#207448"/>
  <text x="180" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">prefix</text>
  <text x="550" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">meaning</text>

  
  <rect x="80" y="216" width="1440" height="84" rx="8" fill="#ffffff" stroke="#d0ddd3" stroke-width="2"/>
  <line x1="520" y1="216" x2="520" y2="300" stroke="#d0ddd3" stroke-width="1.5"/>
  
  <path d="M 144,244 A 18 18 0 1 0 148,264" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <path d="M 142,236 L 152,244 L 140,250" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="268" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">::1/128</text>
  <text x="550" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">loopback</text>

  
  <rect x="80" y="312" width="1440" height="84" rx="8" fill="#e8f1ea" stroke="#c2d5c7" stroke-width="2"/>
  <line x1="520" y1="312" x2="520" y2="396" stroke="#c2d5c7" stroke-width="1.5"/>
  
  <circle cx="132" cy="354" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="110" y1="354" x2="154" y2="354" stroke="#207448" stroke-width="4"/>
  <ellipse cx="132" cy="354" rx="11" ry="22" fill="none" stroke="#207448" stroke-width="4"/>
  <text x="180" y="364" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">2000::/3</text>
  <text x="550" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">global unicast (begins with 2 or 3)</text>

  
  <rect x="80" y="408" width="1440" height="84" rx="8" fill="#ffffff" stroke="#d0ddd3" stroke-width="2"/>
  <line x1="520" y1="408" x2="520" y2="492" stroke="#d0ddd3" stroke-width="1.5"/>
  
  <rect x="117" y="444" width="30" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 124,444 V 434 A 8 8 0 0 1 140,434 V 444" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="132" cy="457" r="3" fill="#207448"/>
  <text x="180" y="460" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">fd00::/8</text>
  <text x="550" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">unique local (ULA, private)</text>

  
  <rect x="80" y="504" width="1440" height="84" rx="8" fill="#e8f1ea" stroke="#c2d5c7" stroke-width="2"/>
  <line x1="520" y1="504" x2="520" y2="588" stroke="#c2d5c7" stroke-width="1.5"/>
  
  <rect x="114" y="532" width="22" height="14" rx="7" fill="none" stroke="#207448" stroke-width="4" transform="rotate(-30 125 539)"/>
  <rect x="128" y="546" width="22" height="14" rx="7" fill="none" stroke="#207448" stroke-width="4" transform="rotate(-30 139 553)"/>
  <text x="180" y="556" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">fe80::/10</text>
  <text x="550" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">link-local, valid on one link only</text>

  
  <rect x="80" y="600" width="1440" height="84" rx="8" fill="#ffffff" stroke="#d0ddd3" stroke-width="2"/>
  <line x1="520" y1="600" x2="520" y2="684" stroke="#d0ddd3" stroke-width="1.5"/>
  
  <circle cx="132" cy="628" r="5" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="116" cy="656" r="5" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="132" cy="656" r="5" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="148" cy="656" r="5" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 132,633 V 643 M 116,651 L 132,643 L 148,651" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="652" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">ff00::/8</text>
  <text x="550" y="651" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">multicast (ff02::1 all nodes, ff02::2 all routers)</text>

  
  <rect x="80" y="696" width="1440" height="84" rx="8" fill="#e8f1ea" stroke="#c2d5c7" stroke-width="2"/>
  <line x1="520" y1="696" x2="520" y2="780" stroke="#c2d5c7" stroke-width="1.5"/>
  
  <path d="M 119,716 H 137 L 145,724 V 760 H 119 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="137,716 137,724 145,724" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="125" y1="736" x2="139" y2="736" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="746" x2="139" y2="746" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="748" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">2001:db8::/32</text>
  <text x="550" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">documentation</text>

  
  <rect x="80" y="792" width="1440" height="84" rx="8" fill="#ffffff" stroke="#d0ddd3" stroke-width="2"/>
  <line x1="520" y1="792" x2="520" y2="876" stroke="#d0ddd3" stroke-width="1.5"/>
  
  <rect x="114" y="818" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <rect x="126" y="826" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <text x="180" y="844" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">::ffff:0:0/96</text>
  <text x="550" y="843" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">IPv4-mapped</text>

  
  <rect x="80" y="888" width="1440" height="84" rx="8" fill="#e8f1ea" stroke="#c2d5c7" stroke-width="2"/>
  <line x1="520" y1="888" x2="520" y2="972" stroke="#c2d5c7" stroke-width="1.5"/>
  
  <path d="M 114,922 H 150 M 142,914 L 150,922 L 142,930" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 150,938 H 114 M 122,930 L 114,938 L 122,946" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="940" font-family="monospace, Courier New, Courier" font-size="28" font-weight="bold" fill="#303a36">64:ff9b::/96</text>
  <text x="550" y="939" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">NAT64</text>

  
  <rect x="80" y="1004" width="1440" height="96" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <rect x="80" y="1004" width="16" height="96" rx="6" fill="#db8129"/>
  
  <circle cx="136" cy="1052" r="22" fill="none" stroke="#db8129" stroke-width="4"/>
  <line x1="120" y1="1036" x2="152" y2="1068" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  <text x="190" y="1063" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#db8129">There is no broadcast in IPv6</text>
</svg>