<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>ARP and NDP: turning the next hop's IP address into a MAC address</title>
  <desc>Visual infographic explaining IPv4 ARP broadcast and unicast reply, IPv6 NDP solicitation and advertisement, ip neigh states, and key diagnostic commands.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-left" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 11 2 L 1 7 L 11 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-down" markerWidth="14" markerHeight="14" refX="7" refY="10" orient="auto">
      <path d="M 2 1 L 7 11 L 12 1 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">ARP and NDP: turning the next hop's IP address into a MAC address</text>

  
  
  
  <rect x="40" y="100" width="1020" height="400" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="145" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">IPv4: ARP</text>

  
  <rect x="70" y="165" width="220" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 178)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="0" y="0" width="46" height="32" rx="4" />
    <line x1="23" y1="32" x2="23" y2="44" />
    <line x1="10" y1="44" x2="36" y2="44" />
  </g>
  <text x="145" y="215" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">10.0.0.15</text>

  
  <rect x="360" y="165" width="370" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(375, 178)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="0" y="2" width="22" height="16" rx="2" />
    <rect x="26" y="2" width="22" height="16" rx="2" />
    <line x1="11" y1="18" x2="11" y2="34" />
    <line x1="37" y1="18" x2="37" y2="34" />
    <line x1="0" y1="34" x2="48" y2="34" />
    <circle cx="24" cy="42" r="3" fill="#207448" />
  </g>
  <text x="560" y="215" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">other hosts on the segment</text>

  
  <rect x="800" y="165" width="230" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(815, 178)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round">
    <circle cx="24" cy="24" r="22" />
    <line x1="10" y1="24" x2="38" y2="24" />
    <polyline points="16,18 10,24 16,30" />
    <polyline points="32,18 38,24 32,30" />
    <line x1="24" y1="10" x2="24" y2="38" />
    <polyline points="18,16 24,10 30,16" />
    <polyline points="18,32 24,38 30,32" />
  </g>
  <text x="875" y="215" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">10.0.0.1</text>

  
  <line x1="180" y1="245" x2="180" y2="400" stroke="#a5c4b0" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="545" y1="245" x2="545" y2="400" stroke="#a5c4b0" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="915" y1="245" x2="915" y2="400" stroke="#a5c4b0" stroke-width="2" stroke-dasharray="6 6" />

  
  <circle cx="180" cy="285" r="20" fill="#207448" />
  <text x="180" y="293" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="545" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">broadcast to ff:ff:ff:ff:ff:ff: who has 10.0.0.1? tell 10.0.0.15</text>
  
  <line x1="205" y1="285" x2="540" y2="285" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="550" y1="285" x2="910" y2="285" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <circle cx="915" cy="350" r="20" fill="#207448" />
  <text x="915" y="358" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="545" y="342" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the owner replies with its MAC</text>
  <line x1="890" y1="350" x2="185" y2="350" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />

  
  <rect x="70" y="415" width="960" height="68" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 426)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="0" y="0" width="38" height="44" rx="4" />
    <line x1="0" y1="14" x2="38" y2="14" />
    <line x1="0" y1="28" x2="38" y2="28" />
    <line x1="18" y1="0" x2="18" y2="44" />
  </g>
  <text x="555" y="458" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">stored in the neighbour table (ip neigh) so the shout is not repeated for every packet</text>

  
  
  
  <rect x="40" y="520" width="1020" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="562" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">IPv6: NDP</text>

  
  <rect x="70" y="580" width="120" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(104, 630)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <rect x="0" y="0" width="52" height="38" rx="4" />
    <line x1="26" y1="38" x2="26" y2="52" />
    <line x1="12" y1="52" x2="40" y2="52" />
  </g>

  
  <rect x="910" y="580" width="120" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(944, 630)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <circle cx="26" cy="26" r="24" />
    <line x1="10" y1="26" x2="42" y2="26" />
    <polyline points="18,18 10,26 18,34" />
    <polyline points="34,18 42,26 34,34" />
    <line x1="26" y1="10" x2="26" y2="42" />
    <polyline points="18,18 26,10 34,18" />
    <polyline points="18,34 26,42 34,34" />
  </g>

  
  <text x="550" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">neighbour solicitation to a solicited-node multicast address</text>
  <line x1="195" y1="630" x2="905" y2="630" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <text x="550" y="692" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">neighbour advertisement from the owner</text>
  <line x1="905" y1="702" x2="195" y2="702" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)" />

  
  
  
  <rect x="1090" y="100" width="470" height="660" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1325" y="145" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Neighbour states in ip neigh</text>

  
  <rect x="1120" y="165" width="410" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1325" y="198" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">REACHABLE</text>
  <line x1="1325" y1="213" x2="1325" y2="231" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green-down)" />

  
  <rect x="1120" y="233" width="410" height="48" rx="8" fill="#ffffff" stroke="#70857a" stroke-width="1.5" />
  <text x="1325" y="266" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">STALE</text>
  <line x1="1325" y1="281" x2="1325" y2="299" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green-down)" />

  
  <rect x="1120" y="301" width="410" height="48" rx="8" fill="#ffffff" stroke="#70857a" stroke-width="1.5" />
  <text x="1325" y="334" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DELAY</text>
  <line x1="1325" y1="349" x2="1325" y2="367" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green-down)" />

  
  <rect x="1120" y="369" width="410" height="48" rx="8" fill="#ffffff" stroke="#70857a" stroke-width="1.5" />
  <text x="1325" y="402" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">PROBE</text>
  <line x1="1325" y1="417" x2="1325" y2="435" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green-down)" />

  
  <rect x="1120" y="437" width="410" height="54" rx="8" fill="#fff3e6" stroke="#db8129" stroke-width="3" />
  <text x="1325" y="473" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">FAILED</text>

  
  <rect x="1120" y="515" width="410" height="220" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <rect x="1120" y="515" width="10" height="220" rx="4" fill="#db8129" />
  
  <g transform="translate(1300, 532)" stroke="#db8129" stroke-width="3" fill="none" stroke-linejoin="round">
    <polygon points="24,4 46,42 2,42" />
    <line x1="24" y1="18" x2="24" y2="28" />
    <circle cx="24" cy="35" r="1.5" fill="#db8129" stroke="none" />
  </g>
  <text x="1325" y="610" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1330" dy="0">the shout got no answer:</tspan>
    <tspan x="1330" dy="38">a very different problem</tspan>
    <tspan x="1330" dy="38">from a bad route</tspan>
  </text>

  
  
  
  <rect x="40" y="780" width="1520" height="275" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="798" width="1470" height="52" rx="6" fill="#ffffff" stroke="#b2c9bb" stroke-width="1.5" />
  <text x="90" y="833" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">&gt;_</text>
  <text x="135" y="833" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">ip neigh show</text>

  
  <rect x="65" y="858" width="1470" height="52" rx="6" fill="#ffffff" stroke="#b2c9bb" stroke-width="1.5" />
  <text x="90" y="893" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">&gt;_</text>
  <text x="135" y="893" font-size="24">
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">ip neigh flush dev ens4</tspan>
    <tspan font-family="sans-serif" font-weight="normal" fill="#506056"> (careful on production hosts)</tspan>
  </text>

  
  <rect x="65" y="918" width="1470" height="52" rx="6" fill="#ffffff" stroke="#b2c9bb" stroke-width="1.5" />
  <text x="90" y="953" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">&gt;_</text>
  <text x="135" y="953" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">sudo tcpdump -nn -e -i ens4 arp or icmp6</text>

  
  <rect x="65" y="978" width="1470" height="52" rx="6" fill="#ffffff" stroke="#b2c9bb" stroke-width="1.5" />
  <text x="90" y="1013" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">&gt;_</text>
  <text x="135" y="1013" font-size="24">
    <tspan font-family="monospace" font-weight="bold" fill="#303a36">arping -I ens4 10.0.0.1</tspan>
    <tspan font-family="sans-serif" font-weight="normal" fill="#506056"> (also detects duplicate addresses)</tspan>
  </text>

  
  
  
  <rect x="40" y="1075" width="1520" height="70" rx="10" fill="#207448" />
  <text x="800" y="1119" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">When a host cannot reach its gateway, check ip neigh show before you look anywhere else</text>
</svg>