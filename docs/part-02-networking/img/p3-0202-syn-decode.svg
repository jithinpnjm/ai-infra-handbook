<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading a captured SYN one layer at a time</title>
  <desc>Visual breakdown of a captured TCP SYN packet across network layers L2, L3, and L4.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Reading a captured SYN one layer at a time</text>

  
  <rect x="50" y="95" width="1500" height="280" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="2"/>

  
  <g>
    <rect x="65" y="110" width="12" height="60" rx="4" fill="#207448"/>
    <rect x="77" y="110" width="1458" height="60" rx="4" fill="#e8f1ea"/>
    <text x="100" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">ethertype IPv4 (0x0800), length 74</text>
  </g>

  
  <g>
    <rect x="65" y="180" width="12" height="100" rx="4" fill="#207448"/>
    <rect x="77" y="180" width="1458" height="100" rx="4" fill="#e8f1ea"/>
    <text x="100" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="100" dy="0">10.0.0.15.51234 &gt; 93.184.216.34.443: Flags [S], seq 1, win 64240,</tspan>
      <tspan x="100" dy="36">options [mss 1460,sackOK,TS val 1 ecr 0,nop,wscale 7], length 0</tspan>
    </text>
  </g>

  
  <g>
    <rect x="65" y="290" width="12" height="60" rx="4" fill="#207448"/>
    <rect x="77" y="290" width="1458" height="60" rx="4" fill="#e8f1ea"/>
    <text x="100" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">tos 0x0, ttl 64, id 12345, offset 0, flags [DF], proto TCP (6), length 60</text>
  </g>

  
  <g>
    <rect x="50" y="415" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="50" y="415" width="12" height="210" rx="4" fill="#207448"/>
    
    <g transform="translate(80, 435)">
      <rect x="4" y="8" width="48" height="34" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 18 42 L 18 48 L 38 48 L 38 42" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="20" x2="16" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="20" x2="28" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="20" x2="40" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="155" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">L2</text>
    <text x="155" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">source MAC 52:54:00:12:34:56, destination MAC 52:54:00:ab:cd:ef;</tspan>
      <tspan x="155" dy="34">EtherType 0x0800 says the next header is IPv4;</tspan>
      <tspan x="155" dy="34">frame length 74 = 14 Ethernet + 60 IP</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="650" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="50" y="650" width="12" height="210" rx="4" fill="#207448"/>
    
    <g transform="translate(80, 670)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 14 28 L 42 28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 28 14 L 28 42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="20,24 14,28 20,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <polyline points="36,24 42,28 36,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="155" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">L3</text>
    <text x="155" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">source 10.0.0.15, destination 93.184.216.34; TTL 64; DF set;</tspan>
      <tspan x="155" dy="34">protocol 6 says the next header is TCP;</tspan>
      <tspan x="155" dy="34">IP total length 60 = 20 IP header + 40 TCP with options</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="885" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="50" y="885" width="12" height="210" rx="4" fill="#207448"/>
    
    <g transform="translate(80, 905)">
      <circle cx="16" cy="18" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="40" cy="38" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 22 23 C 28 28, 28 28, 34 33" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 8 18 L 4 18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 48 38 L 52 38" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="155" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">L4</text>
    <text x="155" y="995" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">source port 51234 (ephemeral), destination port 443; <tspan fill="#db8129" font-weight="bold">S flag means SYN;</tspan></tspan>
      <tspan x="155" dy="34">options MSS 1460, SACK, timestamps, window scale 7;</tspan>
      <tspan x="155" dy="34">payload length 0, so the first packet of the handshake</tspan>
    </text>
  </g>

  
  <g>
    <rect x="50" y="1120" width="1500" height="60" rx="10" fill="#207448"/>
    <text x="800" y="1158" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">When you open a capture, label each layer before you read the flags</text>
  </g>
</svg>