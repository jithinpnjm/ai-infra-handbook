<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 40px; font-weight: bold; fill: #207448; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; }
      .step-head { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: bold; fill: #303a36; }
      .body-sans { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; fill: #303a36; }
      .body-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; fill: #1c5236; }
      .panel-title { font-family: system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: bold; fill: #db8129; }
      .strip-title { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: bold; fill: #207448; }
      .takeaway { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  <title>Building a private CA by hand: the seven steps and why each is there</title>
  <desc>Seven-step technical workflow for creating and deploying a private certificate authority, accompanied by production guidance and public CA comparison.</desc>

  
  <rect width="1600" height="1500" fill="#f5f8f5"/>

  
  <rect x="40" y="32" width="1520" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="82" text-anchor="middle" class="title">Building a private CA by hand: the seven steps and why each is there</text>

  

  
  <g id="step1">
    <rect x="40" y="126" width="980" height="136" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="168" r="24" fill="#207448"/>
    <text x="82" y="177" text-anchor="middle" class="step-num">1</text>
    <text x="126" y="166" class="step-head">Make the CA key and self-signed root:</text>
    <text x="126" y="202" class="body-mono">openssl req -x509 ... -subj /CN=Lab Root CA -keyout ca.key -out ca.pem (10 years)</text>
    <text x="126" y="238" class="body-mono">-addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign</text>
  </g>

  
  <path d="M 530 262 L 530 274" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step2">
    <rect x="40" y="278" width="980" height="162" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="320" r="24" fill="#207448"/>
    <text x="82" y="329" text-anchor="middle" class="step-num">2</text>
    <text x="126" y="318" class="step-head">Make the server key and CSR:</text>
    <text x="126" y="354" class="body-mono">openssl req -newkey ec ... -subj /CN=api.lab.internal -keyout srv.key -out srv.csr;</text>
    <text x="126" y="392" class="body-sans">a CSR carries only the public key and the requested names,</text>
    <text x="126" y="424" class="body-sans">the application form you send to the CA, never the secret</text>
  </g>

  
  <path d="M 530 440 L 530 452" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step3">
    <rect x="40" y="456" width="980" height="142" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="498" r="24" fill="#207448"/>
    <text x="82" y="507" text-anchor="middle" class="step-num">3</text>
    <text x="126" y="496" class="step-head">Write the extension file srv.ext:</text>
    <text x="126" y="534" class="body-mono">subjectAltName=DNS:api.lab.internal,DNS:*.lab.internal,IP:10.0.0.5;</text>
    <text x="126" y="572" class="body-mono">extendedKeyUsage=serverAuth; basicConstraints=CA:FALSE</text>
  </g>

  
  <path d="M 530 598 L 530 610" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step4">
    <rect x="40" y="614" width="980" height="136" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="656" r="24" fill="#207448"/>
    <text x="82" y="665" text-anchor="middle" class="step-num">4</text>
    <text x="126" y="654" class="step-head">Sign:</text>
    <text x="126" y="692" class="body-mono">openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key</text>
    <text x="126" y="728" class="body-mono">-CAcreateserial -days 90 -extfile srv.ext -out srv.pem</text>
  </g>

  
  <path d="M 530 750 L 530 762" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step5">
    <rect x="40" y="766" width="980" height="106" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="808" r="24" fill="#207448"/>
    <text x="82" y="817" text-anchor="middle" class="step-num">5</text>
    <text x="126" y="806" class="step-head">Verify:</text>
    <text x="126" y="844" class="body-mono">openssl verify -CAfile ca.pem srv.pem</text>
  </g>

  
  <path d="M 530 872 L 530 884" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step6">
    <rect x="40" y="888" width="980" height="98" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="937" r="24" fill="#207448"/>
    <text x="82" y="946" text-anchor="middle" class="step-num">6</text>
    <text x="126" y="945" class="step-head">Trust the CA on the client (update-ca-certificates)</text>
  </g>

  
  <path d="M 530 986 L 530 998" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  
  <g id="step7">
    <rect x="40" y="1002" width="980" height="144" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="82" cy="1044" r="24" fill="#207448"/>
    <text x="82" y="1053" text-anchor="middle" class="step-num">7</text>
    <text x="126" y="1042" class="step-head">Serve it with nginx:</text>
    <text x="126" y="1080" class="body-mono">ssl_certificate, ssl_certificate_key,</text>
    <text x="126" y="1118" class="body-mono">ssl_protocols TLSv1.2 TLSv1.3, http2 on</text>
  </g>

  
  <g id="real-use-panel">
    <rect x="1050" y="126" width="510" height="1020" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <rect x="1050" y="126" width="510" height="66" rx="14" fill="#fff5ec"/>
    
    <path d="M 1080 148 L 1098 140 L 1116 148 L 1116 166 C 1116 178 1098 188 1098 188 C 1098 188 1080 178 1080 166 Z" fill="none" stroke="#db8129" stroke-width="3"/>
    <text x="1132" y="172" class="panel-title">Real use</text>

    
    <circle cx="1082" cy="232" r="6" fill="#db8129"/>
    <text x="1104" y="238" class="body-sans">prefer step-ca or Vault PKI;</text>

    
    <circle cx="1082" cy="296" r="6" fill="#db8129"/>
    <text x="1104" y="302" class="body-sans">keep the root offline and issue</text>
    <text x="1104" y="334" class="body-sans">from intermediates;</text>

    
    <circle cx="1082" cy="392" r="6" fill="#db8129"/>
    <text x="1104" y="398" class="body-sans">name constraints, short lifetimes,</text>
    <text x="1104" y="430" class="body-sans">automated rotation;</text>

    
    <circle cx="1082" cy="492" r="6" fill="#db8129"/>
    <text x="1104" y="498" class="body-sans">distribute the root to all trust stores</text>
    <text x="1104" y="530" class="body-sans">through configuration</text>
    <text x="1104" y="562" class="body-sans">management;</text>

    
    <circle cx="1082" cy="626" r="6" fill="#db8129"/>
    <text x="1104" y="632" class="body-sans">keys generated on the server or</text>
    <text x="1104" y="664" class="body-sans">in an HSM, TPM or KMS,</text>
    <text x="1104" y="696" class="body-sans">never emailed, mode 0600,</text>
    <text x="1104" y="728" class="body-sans">one machine per key;</text>

    
    <circle cx="1082" cy="792" r="6" fill="#db8129"/>
    <text x="1104" y="798" class="body-sans">a client certificate is built</text>
    <text x="1104" y="830" class="body-sans">the same way with</text>
    <text x="1104" y="866" class="body-mono">extendedKeyUsage=clientAuth</text>
  </g>

  
  <g id="public-ca-strip">
    <rect x="40" y="1170" width="1520" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="40" y="1170" width="1520" height="48" rx="12" fill="#e8f1ea"/>
    
    <circle cx="72" cy="1194" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
    <ellipse cx="72" cy="1194" rx="7" ry="14" fill="none" stroke="#207448" stroke-width="2"/>
    <line x1="58" y1="1194" x2="86" y2="1194" stroke="#207448" stroke-width="2"/>
    <text x="98" y="1203" class="strip-title">Public CA</text>

    <text x="70" y="1252" class="body-sans">Let's Encrypt, DigiCert, Google Trust Services check control of the domain (DV) with a DNS or HTTP challenge;</text>
    <text x="70" y="1288" class="body-sans">OV and EV add organisation checks; ACME (RFC 8555) automates renewal through certbot, acme.sh, Caddy, cert-manager;</text>
    <text x="70" y="1324" class="body-sans">Let's Encrypt lasts 90 days; CT logs every public certificate; CAA records restrict which CAs may issue</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1382" width="1520" height="76" rx="12" fill="#207448"/>
    <text x="800" y="1430" text-anchor="middle" class="takeaway">Building one by hand once is the best way to understand what the tools do for you</text>
  </g>
</svg>