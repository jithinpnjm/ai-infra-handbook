<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading one ss -ti line as a story: why the connection is slower than it could be</title>
  <desc>Visual explanation of reading a Linux ss -ti socket statistics output to diagnose connection performance bottlenecks.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="40" dy="0">Reading one ss -ti line as a story:</tspan>
    <tspan x="40" dy="54">why the connection is slower than it could be</tspan>
  </text>

  
  <rect x="40" y="160" width="1520" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="65" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">ESTAB 0 0 10.0.0.2:51234 10.0.0.5:443</text>
  <text x="65" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36" textLength="1440" lengthAdjust="spacing">cubic wscale:7,7 rto:204 rtt:0.31/0.12 mss:1448 pmtu:1500 cwnd:10 ssthresh:7 bytes_sent:2.1M bytes_acked:2.1M</text>
  <text x="65" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">bytes_retrans:12K segs_out:1500 segs_in:900 send 373Mbps pacing_rate 746Mbps delivery_rate 330Mbps</text>
  <text x="65" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">busy:2300ms rwnd_limited:100ms(4.3%) app_limited retrans:0/9 reordering:3 rcv_space:14480</text>

  
  <rect x="40" y="370" width="960" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="85" cy="410" r="24" fill="#207448"/>
  <text x="85" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <g transform="translate(125, 382)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="16" cy="28" r="10"/>
    <circle cx="40" cy="28" r="10"/>
    <line x1="26" y1="28" x2="30" y2="28"/>
    <path d="M16 18 V10 H40 V18"/>
  </g>
  <text x="205" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">1 established, cubic congestion control</text>

  
  <rect x="40" y="490" width="960" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="85" cy="530" r="24" fill="#207448"/>
  <text x="85" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <g transform="translate(125, 502)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="30" r="20"/>
    <line x1="28" y1="30" x2="28" y2="18"/>
    <line x1="28" y1="30" x2="38" y2="30"/>
    <line x1="24" y1="4" x2="32" y2="4"/>
    <line x1="28" y1="4" x2="28" y2="10"/>
  </g>
  <text x="205" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">2 rtt about 0.31 ms</text>

  
  <rect x="40" y="610" width="960" height="100" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="85" cy="660" r="24" fill="#207448"/>
  <text x="85" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <g transform="translate(125, 632)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="10" width="44" height="36" rx="4"/>
    <line x1="6" y1="22" x2="50" y2="22"/>
    <line x1="22" y1="22" x2="22" y2="46"/>
    <line x1="36" y1="22" x2="36" y2="46"/>
  </g>
  <text x="205" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="205" dy="0">3 cwnd 10 segments; about 2 MB sent with almost</tspan>
    <tspan x="205" dy="34">no retransmits</tspan>
  </text>

  
  <rect x="40" y="750" width="960" height="115" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <circle cx="85" cy="807" r="24" fill="#db8129"/>
  <text x="85" y="807" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <g transform="translate(125, 779)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10 40 A20 20 0 1 1 46 40"/>
    <line x1="28" y1="36" x2="20" y2="22"/>
    <circle cx="28" cy="36" r="3" fill="#db8129"/>
    <line x1="28" y1="16" x2="28" y2="20"/>
  </g>
  <text x="205" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="205" dy="0">4 delivery_rate 330 Mbps is well below pacing_rate</tspan>
    <tspan x="205" dy="34">746 Mbps: the connection is not using all it is allowed</tspan>
  </text>

  
  <rect x="40" y="905" width="960" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="85" cy="977" r="24" fill="#207448"/>
  <text x="85" y="977" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <g transform="translate(125, 949)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="6" y="8" width="44" height="40" rx="4"/>
    <line x1="6" y1="18" x2="50" y2="18"/>
    <circle cx="14" cy="13" r="2" fill="#207448"/>
    <circle cx="22" cy="13" r="2" fill="#207448"/>
    <path d="M28 26 L28 36"/>
    <circle cx="28" cy="41" r="1.5" fill="#207448"/>
  </g>
  <text x="205" y="946" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="205" dy="0">5 limiter: rwnd_limited for a small share of the time</tspan>
    <tspan x="205" dy="32">(4.3 percent), and app_limited is flagged: the application</tspan>
    <tspan x="205" dy="32">is not providing data fast enough</tspan>
  </text>

  
  <rect x="1040" y="370" width="520" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1065, 390)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="8" y="6" width="40" height="44" rx="4"/>
    <line x1="16" y1="16" x2="36" y2="16"/>
    <line x1="16" y1="26" x2="36" y2="26"/>
    <line x1="16" y1="36" x2="28" y2="36"/>
  </g>
  <text x="1135" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Field meanings</text>
  <line x1="1065" y1="460" x2="1535" y2="460" stroke="#207448" stroke-width="2" stroke-opacity="0.25"/>

  
  <rect x="1065" y="475" width="470" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="511" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">rtt:avg/var</text>

  
  <rect x="1065" y="545" width="470" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1085" dy="0">cwnd and ssthresh:</tspan>
    <tspan x="1085" dy="32">congestion window state</tspan>
  </text>

  
  <rect x="1065" y="639" width="470" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="675" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">retrans:current/total</text>

  
  <rect x="1065" y="709" width="470" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="742" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1085" dy="0">delivery_rate is what the connection</tspan>
    <tspan x="1085" dy="32">actually achieves, pacing_rate is</tspan>
    <tspan x="1085" dy="32">what it aims for</tspan>
  </text>

  
  <rect x="1065" y="841" width="470" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1085" dy="0">busy, rwnd_limited, sndbuf_limited,</tspan>
    <tspan x="1085" dy="32">cwnd_limited limiter times as</tspan>
    <tspan x="1085" dy="32">percentages</tspan>
  </text>

  
  <rect x="1065" y="973" width="470" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1085" y="1009" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">reordering and minrtt</text>

  
  <rect x="40" y="1100" width="1520" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1139" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Each field answers one question, and reading them in order gives the full picture</text>
</svg>