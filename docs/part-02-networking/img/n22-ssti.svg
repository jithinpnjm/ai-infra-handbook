<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Reading ss -ti output</title>
  <desc>Visual guide explaining socket statistics and TCP info output fields including congestion control, RTT, cwnd, retransmits, and pacing rates.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading ss -ti output</text>

  

  
  <rect x="50" y="110" width="440" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="72" y1="150" x2="114" y2="150" />
    <circle cx="86" cy="150" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="72" y1="175" x2="114" y2="175" />
    <circle cx="102" cy="175" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <line x1="72" y1="200" x2="114" y2="200" />
    <circle cx="80" cy="200" r="6" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  </g>
  <text x="135" y="190" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">cubic = congestion control</text>

  
  <rect x="520" y="110" width="470" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="560" cy="182" r="24" />
    <polyline points="560,168 560,182 574,182" />
    <line x1="560" y1="152" x2="560" y2="158" />
  </g>
  <text x="605" y="190" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">rtt:avg/var = round-trip time</text>

  
  <rect x="1020" y="110" width="530" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="1045" y="160" width="48" height="42" rx="4" />
    <line x1="1045" y1="174" x2="1093" y2="174" />
    <circle cx="1054" cy="167" r="1.5" fill="#207448" />
    <circle cx="1062" cy="167" r="1.5" fill="#207448" />
  </g>
  <text x="1110" y="172" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1110" dy="0">cwnd and ssthresh </tspan>
    <tspan x="1110" dy="34">= congestion window state</tspan>
  </text>

  

  
  <rect x="30" y="320" width="1540" height="340" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <rect x="215" y="580" width="375" height="42" rx="8" fill="#fdeee0" stroke="#db8129" stroke-width="3" />

  
  <rect x="44" y="434" width="76" height="34" rx="6" fill="#e8f1ea" fill-opacity="0.6" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="442" y="434" width="168" height="34" rx="6" fill="#e8f1ea" fill-opacity="0.6" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="850" y="434" width="248" height="34" rx="6" fill="#e8f1ea" fill-opacity="0.6" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="735" y="584" width="145" height="34" rx="6" fill="#e8f1ea" fill-opacity="0.6" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 2" />
  <rect x="770" y="509" width="650" height="34" rx="6" fill="#e8f1ea" fill-opacity="0.6" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 2" />

  
  <text x="50" y="385" font-family="'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="24" font-weight="bold" fill="#207448">ESTAB 0 0 10.0.0.2:51234 10.0.0.5:443</text>
  <text x="50" y="460" font-family="'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="24" fill="#303a36" textLength="1475" lengthAdjust="spacingAndGlyphs">cubic wscale:7,7 rto:204 rtt:0.31/0.12 mss:1448 pmtu:1500 cwnd:10 ssthresh:7 bytes_sent:2.1M bytes_acked:2.1M</text>
  <text x="50" y="535" font-family="'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="24" fill="#303a36" textLength="1360" lengthAdjust="spacingAndGlyphs">bytes_retrans:12K segs_out:1500 segs_in:900 send 373Mbps pacing_rate 746Mbps delivery_rate 330Mbps</text>
  <text x="50" y="610" font-family="'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace" font-size="24" fill="#303a36" textLength="1200" lengthAdjust="spacingAndGlyphs">busy:2300ms rwnd_limited:100ms(4.3%) app_limited retrans:0/9 reordering:3 rcv_space:14480</text>

  

  
  <rect x="60" y="745" width="620" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 120 812 A 20 20 0 1 1 110 795" />
    <polyline points="105,785 110,795 122,793" />
  </g>
  <text x="155" y="818" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="155" dy="0">retrans:current/total </tspan>
    <tspan x="155" dy="34">= retransmits</tspan>
  </text>

  
  <rect x="720" y="745" width="830" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 750 830 A 24 24 0 1 1 794 830" />
    <line x1="772" y1="820" x2="784" y2="805" />
  </g>
  <text x="820" y="818" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="820" dy="0">delivery_rate = what the connection actually achieves, </tspan>
    <tspan x="820" dy="34">pacing_rate = what it is allowed</tspan>
  </text>

  

  
  <path d="M 80 255 V 300 H 40 V 445 H 42" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 610 255 V 415 H 520 V 430" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 975 255 V 430" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 500 745 V 680 H 800 V 622" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <path d="M 1320 745 V 547" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

</svg>