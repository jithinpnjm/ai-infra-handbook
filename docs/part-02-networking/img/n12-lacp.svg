<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>LACP modes and timers</title>
  <desc>Visual infographic explaining LACP mode pairings between end A and end B, fast and slow timer configurations, static on mode constraints, and frame forwarding conditions.</desc>

  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="80" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">LACP modes and timers</text>

  
  <rect x="50" y="130" width="920" height="700" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="420" y="155" width="260" height="50" rx="8" fill="#e8f1ea"/>
  <text x="550" y="190" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">end B</text>

  
  <rect x="70" y="445" width="60" height="150" rx="8" fill="#e8f1ea"/>
  <text x="100" y="528" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 100 528)">end A</text>

  
  <rect x="160" y="230" width="780" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(185, 287)">
    <rect x="0" y="0" width="22" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="34" y="0" width="22" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="22" y1="10" x2="34" y2="10" stroke="#207448" stroke-width="4"/>
    <line x1="22" y1="20" x2="34" y2="20" stroke="#207448" stroke-width="4"/>
    <polyline points="18,44 26,52 40,38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="270" y="285" font-size="32" font-weight="bold" fill="#207448" font-family="sans-serif">active/active</text>
  <text x="270" y="340" font-size="26" fill="#303a36" font-family="sans-serif">bundle forms quickly</text>

  
  <rect x="160" y="425" width="780" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(185, 482)">
    <rect x="0" y="0" width="22" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="34" y="0" width="22" height="30" rx="4" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="4 3"/>
    <path d="M 16,42 Q 28,34 40,42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 12,50 Q 28,38 44,50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="15" x2="34" y2="15" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="270" y="480" font-size="32" font-weight="bold" fill="#207448" font-family="sans-serif">active/passive</text>
  <text x="270" y="535" font-size="26" fill="#303a36" font-family="sans-serif">bundle forms, active speaks first</text>

  
  <rect x="160" y="620" width="780" height="170" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(185, 677)">
    <rect x="0" y="0" width="22" height="30" rx="4" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="4 3"/>
    <rect x="34" y="0" width="22" height="30" rx="4" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="4 3"/>
    <line x1="18" y1="42" x2="18" y2="54" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="42" x2="38" y2="54" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="15" r="4" fill="#db8129"/>
  </g>
  <text x="270" y="670" font-size="32" font-weight="bold" fill="#db8129" font-family="sans-serif">passive/passive</text>
  <text x="270" y="715" font-size="26" fill="#303a36" font-family="sans-serif">
    <tspan x="270" dy="0">nothing negotiates,</tspan>
    <tspan x="270" dy="36">each waits for the other</tspan>
  </text>

  
  <rect x="1010" y="130" width="540" height="700" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="1040" y="180" width="480" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1075, 215)">
    <circle cx="28" cy="30" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="6" x2="28" y2="1" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="28" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="40" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1155" y="255" font-size="34" font-weight="bold" fill="#207448" font-family="sans-serif">slow</text>
  <line x1="1070" y1="295" x2="1490" y2="295" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1075" y="348" font-size="26" fill="#303a36" font-family="sans-serif">
    <tspan x="1075" dy="0">hello every 30 s,</tspan>
    <tspan x="1075" dy="40">timeout after 90 s</tspan>
  </text>

  
  <rect x="1040" y="505" width="480" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1075, 540)">
    <circle cx="28" cy="30" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="6" x2="28" y2="1" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="12" x2="49" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1155" y="580" font-size="34" font-weight="bold" fill="#207448" font-family="sans-serif">fast</text>
  <line x1="1070" y1="620" x2="1490" y2="620" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1075" y="673" font-size="26" fill="#303a36" font-family="sans-serif">
    <tspan x="1075" dy="0">hello every 1 s,</tspan>
    <tspan x="1075" dy="40">timeout after 3 s</tspan>
  </text>

  
  <rect x="50" y="855" width="1500" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(80, 875)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="22" cy="14" r="2.5" fill="#207448"/>
    <line x1="22" y1="20" x2="22" y2="31" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="140" y="908" font-size="26" fill="#303a36" font-family="sans-serif">
    <tspan font-weight="bold" fill="#207448">Note: </tspan>
    <tspan>static on mode creates a bundle without LACP</tspan>
  </text>

  
  <rect x="50" y="965" width="1500" height="80" rx="12" fill="#207448"/>
  <text x="800" y="1015" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">frames flow only on members in the 'collecting/distributing' state</text>
</svg>