<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Lab 1 topology: three namespaces and a router</title>
  <desc>Visual topology of three Linux network namespaces hA, r, and hB connected by veth pairs with IP addresses and default routes.</desc>

  <defs>
    <marker id="arrow-end" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="2,2 12,7 2,12" fill="#207448" />
    </marker>
    <marker id="arrow-start" markerWidth="14" markerHeight="14" refX="4" refY="7" orient="auto">
      <polygon points="12,2 2,7 12,12" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Lab 1 topology: three namespaces and a router</text>

  
  <g id="orange-note">
    <path d="M 370 125 L 785 125 L 800 245 L 815 125 L 1230 125 A 12 12 0 0 1 1242 137 L 1242 223 A 12 12 0 0 1 1230 235 L 370 235 A 12 12 0 0 1 358 223 L 358 137 A 12 12 0 0 1 370 125 Z" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <rect x="360" y="125" width="880" height="110" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <polygon points="785,234 815,234 800,256" fill="#fff9f2" />
    <polyline points="785,234 800,256 815,234" stroke="#db8129" stroke-width="3" fill="none" stroke-linejoin="round" />

    
    <circle cx="410" cy="180" r="24" fill="none" stroke="#db8129" stroke-width="3.5" />
    <path d="M 402 170 C 402 163 406 159 411 159 C 416 159 420 163 420 168 C 420 174 411 176 411 183" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="411" cy="193" r="2.5" fill="#db8129" />

    
    <text x="456" y="167" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      <tspan x="456" dy="0">Why would a router refuse to pass packets</tspan>
      <tspan x="456" dy="36">even when its interfaces look correct?</tspan>
    </text>
  </g>

  
  <g id="namespace-hA">
    <rect x="60" y="275" width="410" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <rect x="237" y="305" width="56" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="265" y1="345" x2="265" y2="355" stroke="#207448" stroke-width="4" />
    <line x1="250" y1="355" x2="280" y2="355" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="249" cy="317" r="2" fill="#207448" />
    <circle cx="257" cy="317" r="2" fill="#207448" />

    <text x="265" y="405" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">hA</text>

    
    <rect x="85" y="460" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="265" y="515" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">vA 10.1.0.2/24</text>

    
    <rect x="85" y="690" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="265" y="745" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">default via 10.1.0.1</text>
  </g>

  
  <g id="namespace-r">
    <rect x="595" y="275" width="410" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="800" cy="330" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 786 330 L 814 330 M 792 324 L 786 330 L 792 336 M 808 324 L 814 330 L 808 336" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 800 316 L 800 344 M 794 322 L 800 316 L 806 322 M 794 338 L 800 344 L 806 338" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <text x="800" y="405" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">r</text>

    
    <rect x="620" y="460" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="515" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">rA 10.1.0.1/24</text>

    
    <rect x="620" y="575" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="630" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">rB 10.2.0.1/24</text>
  </g>

  
  <g id="namespace-hB">
    <rect x="1130" y="275" width="410" height="600" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <rect x="1307" y="305" width="56" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1335" y1="345" x2="1335" y2="355" stroke="#207448" stroke-width="4" />
    <line x1="1320" y1="355" x2="1350" y2="355" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1319" cy="317" r="2" fill="#207448" />
    <circle cx="1327" cy="317" r="2" fill="#207448" />

    <text x="1335" y="405" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#303a36">hB</text>

    
    <rect x="1155" y="575" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1335" y="630" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">vB 10.2.0.2/24</text>

    
    <rect x="1155" y="690" width="360" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1335" y="745" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">default via 10.2.0.1</text>
  </g>

  
  <g id="link-vA-rA">
    <text x="532" y="482" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">vA-rA</text>
    <line x1="478" y1="505" x2="587" y2="505" stroke="#207448" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  </g>

  
  <g id="link-vB-rB">
    <text x="1067" y="597" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">vB-rB</text>
    <line x1="1013" y1="620" x2="1122" y2="620" stroke="#207448" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  </g>
</svg>