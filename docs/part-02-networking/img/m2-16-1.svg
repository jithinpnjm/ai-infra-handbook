<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>The standard design: eBGP in a Clos</title>
  <desc>Architecture diagram showing eBGP in a Clos network with a Spine tier sharing AS 65001, a Leaf tier with one ASN per rack, and connected server subnets.</desc>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The standard design: eBGP in a Clos</text>

  
  <rect x="60" y="115" width="1480" height="215" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="90" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Spine tier: AS 65001 (same ASN at every spine)</text>

  
  <rect x="60" y="525" width="1480" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="90" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Leaf tier: one ASN per rack</text>

  
  
