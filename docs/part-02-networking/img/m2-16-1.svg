  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The standard design: eBGP in a Clos</text>

  
  <rect x="80" y="105" width="1440" height="235" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
  <text x="800" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Spine tier: AS 65001 (same ASN at every spine)</text>

  
  <rect x="80" y="570" width="1440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Leaf tier: </tspan>
    <tspan x="800" dy="34">one ASN per rack</tspan>
  </text>

  
