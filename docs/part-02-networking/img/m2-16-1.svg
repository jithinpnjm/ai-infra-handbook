<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>The standard design: eBGP in a Clos</title>
  <desc>eBGP Clos leaf-spine architecture showing 4 spines sharing AS 65001 fully connected to 4 leaves each with a unique ASN, and attached server subnets.</desc>

  
