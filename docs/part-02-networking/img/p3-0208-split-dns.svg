<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Split DNS with systemd-resolved routing domains</title>
  <desc>Visual explanation of split-horizon DNS routing using systemd-resolved routing domains to direct specific queries to a VPN resolver while routing all other queries to the default resolver.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Split DNS with systemd-resolved routing domains</text>

  

  
  <g id="step1-lookups">
    
    <circle cx="68" cy="138" r="24" fill="#207448" />
    <text x="68" y="147" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <rect x="40" y="180" width="340" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(182, 195)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="42" rx="6" />
      <line x1="0" y1="14" x2="56" y2="14" />
      <circle cx="12" cy="7" r="2.5" fill="#207448" />
      <circle cx="22" cy="7" r="2.5" fill="#207448" />
    </g>
    <text x="210" y="285" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">git.corp.example.com</text>

    
    <rect x="40" y="345" width="340" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(182, 360)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="42" rx="6" />
      <line x1="0" y1="14" x2="56" y2="14" />
      <circle cx="28" cy="28" r="9" />
      <path d="M 28 19 C 24 23 24 33 28 37 C 32 33 32 23 28 19 Z" />
    </g>
    <text x="210" y="450" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">www.example.org</text>
  </g>

  
  <path d="M 380 247 L 410 247 L 410 330 L 440 330" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 380 412 L 410 412 L 410 330 L 440 330" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="step2-host-container">
    <rect x="440" y="105" width="350" height="395" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="472" cy="138" r="24" fill="#207448" />
    <text x="472" y="147" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(587, 120)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
    </g>

    
    <text x="615" y="202" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">stub 127.0.0.53</text>
    <text x="615" y="234" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(systemd-resolved: cache,</text>
    <text x="615" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">per-interface DNS servers</text>
    <text x="615" y="294" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">and routing domains)</text>

    
    <rect x="460" y="325" width="310" height="155" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(587, 340)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="28" r="6" />
      <path d="M 20 28 L 34 28 L 44 16 M 34 28 L 44 40" />
      <circle cx="48" cy="14" r="5" />
      <circle cx="48" cy="42" r="5" />
    </g>
    <text x="615" y="425" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">match the name</text>
    <text x="615" y="458" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">against routing domains</text>
  </g>

  
  
  <path d="M 770 375 L 810 375 L 810 245 L 830 245" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="830" y="165" width="410" height="160" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="1035" y="202" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">corp.example.com matches</text>
  <text x="1035" y="234" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">the routing domain</text>
  <text x="1035" y="270" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">~corp.example.com</text>
  <text x="1035" y="304" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">on the VPN interface</text>

  
  <path d="M 1240 245 L 1290 245" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="vpn-resolver">
    <rect x="1290" y="165" width="270" height="160" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(1397, 180)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 14 Z" />
      <path d="M 28 20 L 28 34 M 22 28 L 34 28" />
    </g>
    <text x="1425" y="275" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">the VPN's</text>
    <text x="1425" y="308" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">resolver</text>
  </g>

  
  
  <path d="M 770 435 L 810 435 L 810 425 L 830 425" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="830" y="365" width="410" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="1035" y="435" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">everything else</text>

  
  <path d="M 1240 425 L 1290 425" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="default-resolver">
    <rect x="1290" y="345" width="270" height="155" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1397, 360)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <line x1="6" y1="28" x2="50" y2="28" />
      <path d="M 28 6 C 20 14 20 42 28 50 C 36 42 36 14 28 6 Z" />
    </g>
    <text x="1425" y="445" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">the default</text>
    <text x="1425" y="478" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">resolver</text>
  </g>

  
  <g id="clue-strip">
    <rect x="40" y="525" width="1520" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(68, 542)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="14" />
      <line x1="32" y1="32" x2="48" y2="48" />
      <line x1="42" y1="42" x2="48" y2="36" />
    </g>
    <text x="145" y="563" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold" fill="#207448">127.0.0.53</tspan> or <tspan font-family="monospace" font-weight="bold" fill="#207448">127.0.0.1</tspan> in <tspan font-family="monospace" font-weight="bold" fill="#207448">/etc/resolv.conf</tspan> means a caching daemon
    </text>
    <text x="145" y="595" font-family="sans-serif" font-size="24" fill="#303a36">sits between programs and the name server</text>
  </g>

  

  
  <g id="commands-panel">
    <rect x="40" y="635" width="740" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(65, 655)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="42" rx="6" />
      <path d="M 12 14 L 22 21 L 12 28" />
      <line x1="26" y1="28" x2="38" y2="28" />
    </g>

    
    <text x="140" y="683" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolvectl dns eth0 &lt;servers&gt;</text>

    
    <text x="65" y="740" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolvectl domain eth0 ~corp.example.com</text>

    
    <text x="65" y="798" font-family="monospace" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">resolvectl query name</tspan> verifies the routing
    </text>

    
    <text x="65" y="855" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolvectl status</text>
    <text x="65" y="888" font-family="sans-serif" font-size="24" fill="#303a36">shows global settings then one block</text>
    <text x="65" y="918" font-family="sans-serif" font-size="24" fill="#303a36">per interface</text>

    
    <text x="65" y="978" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">resolvectl statistics / flush-caches</text>

    
    <text x="65" y="1038" font-family="monospace" font-size="24" fill="#303a36">
      config in <tspan font-weight="bold" fill="#207448">/etc/systemd/resolved.conf</tspan>
    </text>
  </g>

  
  <g id="related-panel">
    <rect x="820" y="635" width="740" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(850, 655)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="32" r="8" />
      <circle cx="44" cy="16" r="8" />
      <circle cx="44" cy="40" r="6" />
      <line x1="23" y1="28" x2="37" y2="20" />
      <line x1="24" y1="34" x2="38" y2="38" />
    </g>

    
    <text x="925" y="685" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Split-horizon DNS:</text>
    <text x="850" y="735" font-family="sans-serif" font-size="24" fill="#303a36">internal names return private addresses</text>
    <text x="850" y="770" font-family="sans-serif" font-size="24" fill="#303a36">inside the network and public addresses</text>
    <text x="850" y="805" font-family="sans-serif" font-size="24" fill="#303a36">outside it, through separate views or zones;</text>
    <text x="850" y="840" font-family="sans-serif" font-size="24" fill="#303a36">common in cloud and VPN setups</text>

    
    <line x1="850" y1="885" x2="1530" y2="885" stroke="#e8f1ea" stroke-width="3" />

    
    
    <g transform="translate(850, 925)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 14 Z" />
      <polyline points="20 28 26 34 38 22" />
    </g>
    <text x="925" y="955" font-family="sans-serif" font-size="24" fill="#303a36">resolved handles LLMNR and mDNS,</text>
    <text x="925" y="990" font-family="sans-serif" font-size="24" fill="#303a36">supports DNSSEC and DoT (DNSOverTLS=)</text>
  </g>

  
  <rect x="40" y="1115" width="1520" height="60" rx="10" fill="#207448" />
  <text x="800" y="1155" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Routing domains send each name to the right resolver</text>
</svg>