<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>A failed ping: the message and its source tell you where to look</title>
  <desc>Visual decision tree diagnosing ping failures by source address and message type, with cluster usage and ICMP limits.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1360" fill="#f5f8f5" />

  
  <text x="50" y="80" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">A failed ping: the message and its source tell you where to look</text>

  

  
  <rect x="60" y="140" width="300" height="75" rx="12" fill="#207448" />
  <g transform="translate(80, 150)">
    <circle cx="25" cy="27" r="18" fill="none" stroke="#ffffff" stroke-width="3" />
    <line x1="16" y1="18" x2="34" y2="36" stroke="#ffffff" stroke-width="3" />
    <line x1="34" y1="18" x2="16" y2="36" stroke="#ffffff" stroke-width="3" />
  </g>
  <text x="225" y="188" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">ping fails</text>

  
  <path d="M 210 215 L 210 240 Q 210 250 200 250 L 100 250 Q 90 250 90 260 L 90 742" fill="none" stroke="#207448" stroke-width="3" />

  
  <path d="M 90 320 L 140 320" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 90 472 L 140 472" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 90 607 L 140 607" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 90 742 L 140 742" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="140" y="245" width="410" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="165" y="295" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Destination Host Unreachable,</text>
  <text x="165" y="330" font-family="sans-serif" font-size="24" fill="#303a36">with your own address</text>
  <text x="165" y="365" font-family="sans-serif" font-size="24" fill="#303a36">as the source</text>

  
  <path d="M 550 320 L 608 320" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <rect x="610" y="245" width="410" height="150" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3" />
  <text x="635" y="280" font-family="sans-serif" font-size="24" font-weight="bold" fill="#944908">your host gave up asking for</text>
  <text x="635" y="312" font-family="sans-serif" font-size="24" font-weight="bold" fill="#944908">the neighbour's MAC: ARP or</text>
  <text x="635" y="344" font-family="sans-serif" font-size="24" font-weight="bold" fill="#944908">NDP failed on the local link,</text>
  <text x="635" y="376" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">not routing</text>

  
  
  <rect x="140" y="415" width="410" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="165" y="462" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Destination Host Unreachable</text>
  <text x="165" y="498" font-family="sans-serif" font-size="24" fill="#303a36">from a router's address</text>

  
  <path d="M 550 472 L 608 472" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="610" y="415" width="410" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="635" y="480" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">that router had no route</text>

  
  
  <rect x="140" y="550" width="410" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="165" y="597" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Destination Net Unreachable</text>
  <text x="165" y="633" font-family="sans-serif" font-size="24" fill="#303a36">or Packet filtered</text>

  
  <path d="M 550 607 L 608 607" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="610" y="550" width="410" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="635" y="616" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">routing or a filter</text>

  
  
  <rect x="140" y="685" width="410" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="165" y="732" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Request timeout,</text>
  <text x="165" y="768" font-family="sans-serif" font-size="24" fill="#303a36">or no output at all</text>

  
  <path d="M 550 742 L 608 742" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="610" y="685" width="410" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="635" y="751" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">dropped silently somewhere</text>

  
  <rect x="1050" y="140" width="510" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1075, 160)">
    <path d="M 20 5 L 38 12 L 38 28 C 38 38 20 45 20 45 C 20 45 2 38 2 28 L 2 12 Z" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="1135" y="195" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ping has limits</text>

  
  <rect x="1070" y="225" width="470" height="155" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="1090" y="260" font-family="sans-serif" font-size="24" fill="#303a36">ICMP can be treated differently from</text>
  <text x="1090" y="294" font-family="sans-serif" font-size="24" fill="#303a36">real traffic: low priority, blocked,</text>
  <text x="1090" y="328" font-family="sans-serif" font-size="24" fill="#303a36">rate limited, or hashed on to</text>
  <text x="1090" y="362" font-family="sans-serif" font-size="24" fill="#303a36">a different ECMP path</text>

  
  <rect x="1070" y="395" width="470" height="130" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="1090" y="432" font-family="sans-serif" font-size="24" fill="#303a36">success does not prove an application</text>
  <text x="1090" y="466" font-family="sans-serif" font-size="24" fill="#303a36">can connect; test the port with</text>
  <text x="1090" y="502" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">nc -zv host 443 or curl -v</text>

  
  <rect x="1070" y="540" width="470" height="90" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="1090" y="578" font-family="sans-serif" font-size="24" fill="#303a36">failure does not prove</text>
  <text x="1090" y="612" font-family="sans-serif" font-size="24" fill="#303a36">the host is down</text>

  
  <rect x="1070" y="645" width="470" height="135" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="1090" y="682" font-family="sans-serif" font-size="24" fill="#303a36">some internet hosts disable echo</text>
  <text x="1090" y="718" font-family="sans-serif" font-size="24" fill="#303a36">replies so a site can load while</text>
  <text x="1090" y="754" font-family="sans-serif" font-size="24" fill="#303a36">ping gets no answer</text>

  
  <rect x="40" y="830" width="1520" height="385" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 850)">
    <rect x="2" y="4" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 12 15 L 20 21 L 12 27" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="24" y1="27" x2="36" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="130" y="880" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Practical jobs on a cluster</text>

  
  <rect x="65" y="905" width="1470" height="85" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="95" y="956" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">fping -a -g 10.0.0.0/24 or fping -f hosts</tspan>
    <tspan font-family="sans-serif"> to sweep nodes</tspan>
  </text>

  
  <rect x="65" y="1005" width="1470" height="85" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="95" y="1056" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">ping -c 3 &lt;peer rail IP&gt; -I &lt;rail NIC&gt;</tspan>
    <tspan font-family="sans-serif"> proves each rail works</tspan>
  </text>

  
  <rect x="65" y="1105" width="1470" height="85" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
  <text x="95" y="1156" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace" font-weight="bold" fill="#207448">ping -M do -s 8972 &lt;peer&gt;</tspan>
    <tspan font-family="sans-serif"> verifies 9000-byte jumbo paths end to end</tspan>
  </text>

  
  <rect x="40" y="1245" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1292" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The source of the message matters as much as the message</text>

</svg>