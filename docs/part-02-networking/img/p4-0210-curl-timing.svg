<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>curl -w Connection Timing Waterfall and Stage Breakdown</title>
  <desc>Horizontal waterfall and timeline diagram illustrating the exact stages of an HTTPS request as measured by curl -w.</desc>

  <defs>
    
    <marker id="axis-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">curl -w Connection Timing Waterfall and Stage Breakdown</text>

  
  <rect x="60" y="85" width="1480" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="84" y="126" font-family="monospace" font-size="24" fill="#303a36">curl -sS -o /dev/null -w 'dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect}</text>
  <text x="84" y="160" font-family="monospace" font-size="24" fill="#303a36">ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\n' https://api.example.com/</text>

  
  <line x1="150" y1="360" x2="1540" y2="360" stroke="#207448" stroke-width="4" marker-end="url(#axis-arrow)" />

  
  <rect x="50" y="338" width="92" height="44" rx="8" fill="#207448" />
  <text x="96" y="369" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">0.000s</text>

  
  <line x1="330" y1="330" x2="330" y2="360" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="330" cy="360" r="7" fill="#207448" />
  <rect x="160" y="202" width="340" height="128" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="196" cy="236" r="24" fill="#207448" />
  <text x="196" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="234" y="244" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">time_namelookup:</text>
  <text x="180" y="280" font-family="sans-serif" font-size="24" fill="#303a36">end of DNS resolution</text>
  <text x="180" y="312" font-family="sans-serif" font-size="24" fill="#303a36">(domain name to IP lookup).</text>

  
  <line x1="530" y1="360" x2="530" y2="390" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="530" cy="360" r="7" fill="#207448" />
  <rect x="340" y="390" width="380" height="128" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="376" cy="424" r="24" fill="#207448" />
  <text x="376" y="433" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="414" y="432" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">time_connect:</text>
  <text x="360" y="468" font-family="sans-serif" font-size="24" fill="#303a36">end of TCP 3-way handshake</text>
  <text x="360" y="500" font-family="sans-serif" font-size="24" fill="#303a36">with remote host IP.</text>

  
  <line x1="840" y1="330" x2="840" y2="360" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="840" cy="360" r="7" fill="#207448" />
  <rect x="600" y="194" width="460" height="136" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="636" cy="228" r="24" fill="#207448" />
  <text x="636" y="237" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="674" y="236" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">time_appconnect:</text>
  <text x="620" y="268" font-family="sans-serif" font-size="24" fill="#303a36">end of TLS handshake</text>
  <text x="620" y="296" font-family="sans-serif" font-size="24" fill="#303a36">(cipher negotiation, cert</text>
  <text x="620" y="322" font-family="sans-serif" font-size="24" fill="#303a36">verification, key exchange).</text>

  
  <line x1="1110" y1="360" x2="1110" y2="390" stroke="#db8129" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="1110" cy="360" r="8" fill="#db8129" />
  <rect x="860" y="390" width="480" height="128" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  <circle cx="896" cy="424" r="24" fill="#db8129" />
  <text x="896" y="433" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="934" y="432" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">time_starttransfer:</text>
  <text x="880" y="468" font-family="sans-serif" font-size="24" fill="#303a36">first byte of HTTP response received</text>
  <text x="880" y="500" font-family="sans-serif" font-size="24" fill="#303a36">(TTFB, time to first byte).</text>

  
  <line x1="1400" y1="330" x2="1400" y2="360" stroke="#207448" stroke-width="3" stroke-dasharray="4,4" />
  <circle cx="1400" cy="360" r="7" fill="#207448" />
  <rect x="1200" y="202" width="350" height="128" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1236" cy="236" r="24" fill="#207448" />
  <text x="1236" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1274" y="244" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">time_total:</text>
  <text x="1220" y="280" font-family="sans-serif" font-size="24" fill="#303a36">last byte received and</text>
  <text x="1220" y="312" font-family="sans-serif" font-size="24" fill="#303a36">transaction completed.</text>

  

  
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="1480" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="0" y="0" width="16" height="106" rx="6" fill="#207448" />
    
    <circle cx="56" cy="53" r="24" fill="#207448" />
    <text x="56" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(100, 25)" stroke="#207448" stroke-width="4" fill="none">
      <circle cx="28" cy="28" r="22" />
      <ellipse cx="28" cy="28" rx="10" ry="22" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>
    
    <text x="180" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Phase 1: DNS Resolution = time_namelookup</text>
    <text x="180" y="82" font-family="sans-serif" font-size="24" fill="#303a36">Annotation: A long time points to DNS server latency or recursion</text>
  </g>

  
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="1480" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="0" y="0" width="16" height="106" rx="6" fill="#207448" />
    
    <circle cx="56" cy="53" r="24" fill="#207448" />
    <text x="56" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(100, 25)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="14" cy="28" r="8" />
      <circle cx="42" cy="28" r="8" />
      <path d="M 22 24 L 34 24" />
      <path d="M 34 32 L 22 32" />
    </g>
    
    <text x="180" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Phase 2: TCP Handshake = time_connect - time_namelookup</text>
    <text x="180" y="82" font-family="sans-serif" font-size="24" fill="#303a36">Annotation: 1 RTT to establish TCP connection</text>
  </g>

  
  <g transform="translate(60, 800)">
    <rect x="0" y="0" width="1480" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="0" y="0" width="16" height="106" rx="6" fill="#207448" />
    
    <circle cx="56" cy="53" r="24" fill="#207448" />
    <text x="56" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(100, 25)" stroke="#207448" stroke-width="4" fill="none">
      <rect x="14" y="24" width="28" height="24" rx="4" />
      <path d="M 20 24 V 16 A 8 8 0 0 1 36 16 V 24" />
    </g>
    
    <text x="180" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Phase 3: TLS Handshake = time_appconnect - time_connect</text>
    <text x="180" y="82" font-family="sans-serif" font-size="24" fill="#303a36">Annotation: 1 RTT for TLS 1.3 or 2 RTT for TLS 1.2 crypto exchange</text>
  </g>

  
  <g transform="translate(60, 920)">
    <rect x="0" y="0" width="1480" height="106" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    <rect x="0" y="0" width="16" height="106" rx="6" fill="#db8129" />
    
    <circle cx="56" cy="53" r="24" fill="#db8129" />
    <text x="56" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(100, 25)" stroke="#db8129" stroke-width="4" fill="none">
      <rect x="14" y="14" width="28" height="28" rx="4" />
      <line x1="20" y1="6" x2="20" y2="14" />
      <line x1="28" y1="6" x2="28" y2="14" />
      <line x1="36" y1="6" x2="36" y2="14" />
      <line x1="20" y1="42" x2="20" y2="50" />
      <line x1="28" y1="42" x2="28" y2="50" />
      <line x1="36" y1="42" x2="36" y2="50" />
      <circle cx="28" cy="28" r="4" fill="#db8129" />
    </g>
    
    <text x="180" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Phase 4: Server Processing / Model Latency = time_starttransfer - time_appconnect</text>
    <text x="180" y="82" font-family="sans-serif" font-size="24" fill="#303a36">Annotation: Request travel, queueing, and model inference computation time before first token/byte</text>
  </g>

  
  <g transform="translate(60, 1040)">
    <rect x="0" y="0" width="1480" height="106" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="0" y="0" width="16" height="106" rx="6" fill="#207448" />
    
    <circle cx="56" cy="53" r="24" fill="#207448" />
    <text x="56" y="62" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(100, 25)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 12 36 V 46 H 44 V 36" />
      <line x1="28" y1="10" x2="28" y2="34" />
      <path d="M 18 24 L 28 34 L 38 24" />
    </g>
    
    <text x="180" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Phase 5: Content Transfer = time_total - time_starttransfer</text>
    <text x="180" y="82" font-family="sans-serif" font-size="24" fill="#303a36">Annotation: Response payload download over the network</text>
  </g>
</svg>