<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1065" width="1600" height="1065">
  <title>One from element is AND, two elements are OR</title>
  <desc>Visual comparison showing that a single from element in a Kubernetes NetworkPolicy acts as an AND condition while two elements act as an OR condition.</desc>

  
  <rect width="1600" height="1065" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">One from element is AND, two elements are OR</text>

  
  <rect x="50" y="105" width="725" height="800" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="94" cy="148" r="24" fill="#207448"/>
  <text x="94" y="156" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <g transform="translate(136, 120)">
    <path d="M 6 4 L 46 4 C 46 36 26 48 26 48 C 26 48 6 36 6 4 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <rect x="20" y="24" width="12" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 23 24 V 19 C 23 17 29 17 29 19 V 24" fill="none" stroke="#207448" stroke-width="3"/>
  </g>

  <text x="208" y="158" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">One list element (AND)</text>

  
  <rect x="85" y="195" width="655" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 125 215 L 105 215 L 105 325 L 125 325" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="246" x2="140" y2="246" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
  <text x="156" y="254" font-family="monospace" font-size="25" fill="#303a36">namespaceSelector edge</text>
  <text x="156" y="296" font-family="monospace" font-size="25" fill="#303a36">podSelector app gateway</text>

  
  <rect x="85" y="375" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="110" y="424" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">pod labelled app gateway</tspan>
    <tspan x="110" dy="32">in namespace edge</tspan>
  </text>
  <rect x="525" y="408" width="190" height="50" rx="25" fill="#207448"/>
  <circle cx="552" cy="433" r="14" fill="#ffffff"/>
  <path d="M 545 433 L 550 438 L 560 427" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="576" y="441" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ALLOWED</text>

  
  <rect x="85" y="505" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="110" y="554" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">pod labelled app gateway</tspan>
    <tspan x="110" dy="32">in namespace serving</tspan>
  </text>
  <rect x="525" y="538" width="190" height="50" rx="25" fill="#d32f2f"/>
  <circle cx="552" cy="563" r="14" fill="#ffffff"/>
  <path d="M 546 557 L 558 569 M 558 557 L 546 569" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="576" y="571" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">REFUSED</text>

  
  <rect x="85" y="635" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="110" y="684" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">pod labelled app debug</tspan>
    <tspan x="110" dy="32">in namespace edge</tspan>
  </text>
  <rect x="525" y="668" width="190" height="50" rx="25" fill="#d32f2f"/>
  <circle cx="552" cy="693" r="14" fill="#ffffff"/>
  <path d="M 546 687 L 558 699 M 558 687 L 546 699" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="576" y="701" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">REFUSED</text>

  
  <rect x="85" y="765" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="110" y="814" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="110" dy="0">pod labelled app gateway</tspan>
    <tspan x="110" dy="32">in another namespace</tspan>
  </text>
  <rect x="525" y="798" width="190" height="50" rx="25" fill="#d32f2f"/>
  <circle cx="552" cy="823" r="14" fill="#ffffff"/>
  <path d="M 546 817 L 558 829 M 558 817 L 546 829" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="576" y="831" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">REFUSED</text>

  
  <rect x="825" y="105" width="725" height="800" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <circle cx="869" cy="148" r="24" fill="#207448"/>
  <text x="869" y="156" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  
  <g transform="translate(911, 120)">
    <path d="M 6 4 L 46 4 C 46 36 26 48 26 48 C 26 48 6 36 6 4 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 26 12 V 38" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="5 3"/>
  </g>

  <text x="983" y="158" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Two list elements (OR)</text>

  
  <rect x="860" y="195" width="655" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 900 207 L 880 207 L 880 243 L 900 243" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="895" y1="225" x2="915" y2="225" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
  <text x="930" y="233" font-family="monospace" font-size="25" fill="#303a36">namespaceSelector edge</text>

  
  <rect x="860" y="265" width="655" height="85" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <path d="M 900 277 L 880 277 L 880 313 L 900 313" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="895" y1="295" x2="915" y2="295" stroke="#db8129" stroke-width="6" stroke-linecap="round"/>
  <text x="930" y="303" font-family="monospace" font-size="25" fill="#303a36">podSelector app gateway</text>
  <text x="930" y="336" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">the missing dash that widens the door</text>

  
  <rect x="860" y="375" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="885" y="424" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="885" dy="0">edge namespace pod</tspan>
    <tspan x="885" dy="32">app debug</tspan>
  </text>
  <rect x="1300" y="408" width="190" height="50" rx="25" fill="#207448"/>
  <circle cx="1327" cy="433" r="14" fill="#ffffff"/>
  <path d="M 1320 433 L 1325 438 L 1335 427" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1351" y="441" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ALLOWED</text>

  
  <rect x="860" y="505" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="885" y="554" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="885" dy="0">serving namespace pod</tspan>
    <tspan x="885" dy="32">app gateway</tspan>
  </text>
  <rect x="1300" y="538" width="190" height="50" rx="25" fill="#207448"/>
  <circle cx="1327" cy="563" r="14" fill="#ffffff"/>
  <path d="M 1320 563 L 1325 568 L 1335 557" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1351" y="571" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ALLOWED</text>

  
  <rect x="860" y="635" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="885" y="684" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="885" dy="0">edge pod</tspan>
    <tspan x="885" dy="32">app gateway</tspan>
  </text>
  <rect x="1300" y="668" width="190" height="50" rx="25" fill="#207448"/>
  <circle cx="1327" cy="693" r="14" fill="#ffffff"/>
  <path d="M 1320 693 L 1325 698 L 1335 687" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1351" y="701" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ALLOWED</text>

  
  <rect x="860" y="765" width="655" height="115" rx="8" fill="#ffffff" stroke="#b8d0c0" stroke-width="1.5"/>
  <text x="885" y="830" font-family="sans-serif" font-size="24" fill="#303a36">other namespace pod</text>
  <rect x="1300" y="798" width="190" height="50" rx="25" fill="#d32f2f"/>
  <circle cx="1327" cy="823" r="14" fill="#ffffff"/>
  <path d="M 1321 817 L 1333 829 M 1333 817 L 1321 829" fill="none" stroke="#d32f2f" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1351" y="831" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">REFUSED</text>

  
  <rect x="50" y="950" width="1500" height="70" rx="12" ry="12" fill="#207448"/>
  <text x="800" y="994" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">a missing dash turns an AND into an OR, so check the dashes before you ship a policy</text>
</svg>