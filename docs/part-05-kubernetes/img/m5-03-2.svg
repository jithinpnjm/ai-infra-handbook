<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From kubectl apply to a running container</title>
  <desc>Sequence diagram illustrating the Kubernetes deployment workflow from kubectl apply to a running container across control plane components, kubelet, and container runtime.</desc>

