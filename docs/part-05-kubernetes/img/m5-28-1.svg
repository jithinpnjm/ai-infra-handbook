<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>Concepts</title>
  <desc>Service mesh architecture diagram showing the control plane with CA, config distribution, and policy, and data plane with Pod A and Pod B sidecar proxies communicating over mTLS.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-green-start" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Concepts</text>

  
  <rect x="50" y="95" width="1500" height="375" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="85" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Control plane</text>

  
  <g>
    <rect x="85" y="195" width="430" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(272, 215)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 8 12 C 8 36 28 50 28 50 C 28 50 48 36 48 12 Z" />
      <circle cx="28" cy="23" r="5" />
      <path d="M 28 28 L 28 36" />
    </g>
    <text x="300" y="318" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <tspan x="300" dy="0" font-size="28" font-weight="bold" fill="#303a36">CA / identity</tspan>
      <tspan x="300" dy="36" font-size="24" fill="#303a36">(SPIFFE IDs)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="585" y="195" width="430" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(772, 215)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="13" r="7" />
      <circle cx="12" cy="41" r="7" />
      <circle cx="44" cy="41" r="7" />
      <path d="M 24 19 L 16 35" />
      <path d="M 32 19 L 40 35" />
    </g>
    <text x="800" y="318" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <tspan x="800" dy="0" font-size="28" font-weight="bold" fill="#303a36">Config distribution</tspan>
      <tspan x="800" dy="36" font-size="24" fill="#303a36">(xDS / gRPC)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1085" y="195" width="430" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1272, 215)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="5" width="36" height="46" rx="4" />
      <line x1="18" y1="16" x2="38" y2="16" />
      <line x1="18" y1="24" x2="38" y2="24" />
      <line x1="18" y1="32" x2="28" y2="32" />
      <path d="M 32 35 L 36 39 L 43 31" />
    </g>
    <text x="1300" y="318" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <tspan x="1300" dy="0" font-size="28" font-weight="bold" fill="#303a36">Policy &amp; telemetry</tspan>
      <tspan x="1300" dy="36" font-size="28" font-weight="bold" fill="#303a36">config</tspan>
    </text>
  </g>

  
  <rect x="50" y="535" width="670" height="480" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="85" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Pod A</text>

  
  <g>
    <rect x="80" y="620" width="275" height="355" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(190, 680)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="5" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <circle cx="12" cy="12" r="2" fill="#207448" />
      <circle cx="18" cy="12" r="2" fill="#207448" />
      <circle cx="24" cy="12" r="2" fill="#207448" />
    </g>
    <text x="218" y="795" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">App container</text>
  </g>

  
  <g>
    <rect x="395" y="620" width="295" height="355" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(514, 665)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8" />
      <path d="M 16 22 L 38 22 M 30 15 L 38 22 L 30 29" />
      <path d="M 40 34 L 18 34 M 26 27 L 18 34 L 26 41" />
    </g>
    <text x="542" y="765" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <tspan x="542" dy="0" font-size="28" font-weight="bold" fill="#303a36">Sidecar proxy</tspan>
      <tspan x="542" dy="38" font-size="24" fill="#303a36">(Envoy /</tspan>
      <tspan x="542" dy="32" font-size="24" fill="#303a36">linkerd2-proxy)</tspan>
    </text>
  </g>

   Sidecar proxy (in Pod A) -->
  <line x1="355" y1="795" x2="395" y2="795" stroke="#207448" stroke-width="3.5" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)" />

  
  <rect x="880" y="535" width="670" height="480" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="915" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Pod B</text>

  
  <g>
    <rect x="910" y="620" width="295" height="355" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1030, 680)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8" />
      <path d="M 16 22 L 38 22 M 30 15 L 38 22 L 30 29" />
      <path d="M 40 34 L 18 34 M 26 27 L 18 34 L 26 41" />
    </g>
    <text x="1058" y="795" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Sidecar proxy</text>
  </g>

  
  <g>
    <rect x="1245" y="620" width="275" height="355" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1354, 680)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="5" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <circle cx="12" cy="12" r="2" fill="#207448" />
      <circle cx="18" cy="12" r="2" fill="#207448" />
      <circle cx="24" cy="12" r="2" fill="#207448" />
    </g>
    <text x="1382" y="795" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">App container</text>
  </g>

   App container (in Pod B) -->
  <line x1="1205" y1="795" x2="1245" y2="795" stroke="#207448" stroke-width="3.5" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)" />

  
   PX1 -->
  <path d="M 475,430 L 475,620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   PX1 -->
  <path d="M 610,430 L 610,620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   PX2 -->
  <path d="M 980,430 L 980,620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   PX2 (routes through top clearance and between CFG and POL gap) -->
  <path d="M 340,195 L 340,155 L 1050,155 L 1050,620" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
   PX2 -->
  <line x1="690" y1="795" x2="910" y2="795" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <g>
    <rect x="705" y="722" width="190" height="58" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="800" y="747" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <tspan x="800" dy="0" font-size="24" font-weight="bold" fill="#db8129">mTLS</tspan>
      <tspan x="800" dy="25" font-size="24" font-weight="bold" fill="#303a36">(HTTP/2, TCP)</tspan>
    </text>
  </g>
</svg>