<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Resource budgeting and cgroup memory allocation for an HGX 8-GPU node</title>
  <desc>Architecture infographic illustrating node reservation, Guaranteed pod trainer-0 specifications, and memory cgroup breakdown with /dev/shm IPC buffer sizing on an HGX server.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#303a36">
    Resource budgeting and cgroup memory allocation for an HGX 8-GPU node
  </text>
  <rect x="250" y="74" width="1100" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="103" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    8-GPU HGX server (e.g. 8x H100 80GB, 128 CPU cores, 1 TiB host RAM)
  </text>

  
  
  
  <rect x="40" y="140" width="460" height="960" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(64, 160)">
    
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 12 L 44 18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="74" y="38" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Host Reservation
    </text>
  </g>

  
  <rect x="64" y="240" width="412" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="64" y="240" width="412" height="88" rx="12" fill="#e8f1ea" />
  <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="88" y="276">kube-reserved /</tspan>
    <tspan x="88" y="308">system-reserved</tspan>
  </text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="88" y="364">allocating 8 CPU cores</tspan>
    <tspan x="88" y="400">and 32 GiB RAM</tspan>
    <tspan x="88" y="436">for OS, kubelet, and</tspan>
    <tspan x="88" y="472">container runtime</tspan>
  </text>

  
  <rect x="64" y="610" width="412" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="64" y="610" width="412" height="88" rx="12" fill="#e8f1ea" />
  <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="88" y="646">DaemonSet slice</tspan>
  </text>
  <text font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="88" y="678">dcgm-exporter</tspan>
  </text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="88" y="736">allocating 100m CPU</tspan>
    <tspan x="88" y="772">and 128Mi RAM with</tspan>
    <tspan x="88" y="808">SYS_ADMIN capability</tspan>
  </text>

  
  
  
  <rect x="530" y="140" width="510" height="960" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(554, 160)">
    
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <rect x="10" y="18" width="36" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="16" cy="11" r="2.5" fill="#207448" />
    <circle cx="24" cy="11" r="2.5" fill="#207448" />
    <circle cx="32" cy="11" r="2.5" fill="#207448" />
    <text x="74" y="38" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Guaranteed Pod 'trainer-0'
    </text>
  </g>

  
  <rect x="554" y="240" width="462" height="420" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="554" y="240" width="462" height="52" rx="12" fill="#e8f1ea" />
  <text x="576" y="276" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    Resource requests equal limits:
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="330" font-weight="bold" fill="#207448">8 GPUs</tspan>
    <tspan x="660" y="330">(all 8 devices claimed,</tspan>
    <tspan x="576" y="362">preventing fragmenting)</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="426" font-weight="bold" fill="#207448">64 CPU cores</tspan>
    <tspan x="724" y="426">(matched to</tspan>
    <tspan x="576" y="458">multi-worker DataLoader</tspan>
    <tspan x="576" y="490">augmentation)</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="556" font-weight="bold" fill="#207448">800 GiB memory</tspan>
  </text>

  
  <rect x="554" y="690" width="462" height="380" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(574, 710)">
    
    <ellipse cx="20" cy="12" rx="16" ry="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 12 L 4 32 A 16 6 0 0 0 36 32 L 36 12" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4 22 A 16 6 0 0 0 36 22" fill="none" stroke="#207448" stroke-width="3" />
    <text x="50" y="28" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      Attached volumes
    </text>
  </g>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="792">read-only dataset PVC at '/data'</tspan>
  </text>
  
  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="872">atomic checkpoint PVC at '/ckpt'</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="576" y="952">local NVMe scratch at '/work'</tspan>
  </text>

  
  <path d="M 785 690 L 785 668" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  
  <rect x="1070" y="140" width="490" height="960" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(1094, 160)">
    
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <rect x="14" y="14" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="8" y1="22" x2="14" y2="22" stroke="#207448" stroke-width="3" />
    <line x1="8" y1="34" x2="14" y2="34" stroke="#207448" stroke-width="3" />
    <line x1="42" y1="22" x2="48" y2="22" stroke="#207448" stroke-width="3" />
    <line x1="42" y1="34" x2="48" y2="34" stroke="#207448" stroke-width="3" />
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="74" y="24">Container Memory Cgroup</tspan>
      <tspan x="74" y="54">breakdown (800 GiB total limit)</tspan>
    </text>
  </g>

  
  <path d="M 1016 550 L 1062 550" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1094" y="240" width="442" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="1094" y="240" width="442" height="50" rx="12" fill="#e8f1ea" />
  <text x="1118" y="275" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    Process Heap and
  </text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1118" y="326">PyTorch pinned tensors</tspan>
    <tspan x="1118" y="366">(~736 GiB)</tspan>
  </text>

  
  
  <rect x="1094" y="490" width="442" height="580" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <rect x="1094" y="490" width="442" height="66" rx="12" fill="#fcf2e9" />
  
  <text x="1118" y="534" font-family="monospace" font-size="28" font-weight="bold" fill="#db8129">
    /dev/shm
  </text>

  <text x="1118" y="594" font-family="sans-serif" font-size="24" fill="#303a36">
    backed by
  </text>

  
  <rect x="1114" y="614" width="402" height="136" rx="8" fill="#fdf8f4" stroke="#db8129" stroke-width="2" stroke-dasharray="6 4" />
  <text font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1128" y="650">emptyDir:</tspan>
    <tspan x="1148" y="684">{ medium: Memory,</tspan>
    <tspan x="1164" y="718">sizeLimit: 64Gi }</tspan>
  </text>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1118" y="792">holding IPC and NCCL buffers,</tspan>
    <tspan x="1118" y="828">explicitly counted inside the</tspan>
    <tspan x="1118" y="864">800 GiB limit to prevent</tspan>
    <tspan x="1118" y="904" font-weight="bold" fill="#db8129">OOMKilled exit 137</tspan>
  </text>
</svg>