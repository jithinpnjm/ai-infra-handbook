<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What kubeadm init did (phases)</title>
  <desc>Step-by-step visual infographic of Kubernetes kubeadm init phases from preflight and certs to node join</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">What kubeadm init did (phases)</text>

  
  
  <path d="M 755 262 L 845 262" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 1200 415 L 1200 432 Q 1200 448 1184 448 L 416 448 Q 400 448 400 464 L 400 480" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 755 632 L 845 632" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 1200 785 L 1200 802 Q 1200 818 1184 818 L 416 818 Q 400 818 400 834 L 400 850" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <path d="M 755 1002 L 845 1002" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g id="phase-1">
    <rect x="45" y="110" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="95" cy="156" r="24" fill="#207448"/>
    <text x="95" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(135, 128)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 4 C 42 4 50 9 50 19 C 50 37 36 49 28 53 C 20 49 6 37 6 19 C 6 9 14 4 28 4 Z"/>
      <path d="M 18 27 L 25 34 L 38 20"/>
    </g>

    <text x="80" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">1. preflight &amp; certs</text>
    <text x="80" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Validate swap/modules/ports;</text>
    <text x="80" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">generate CAs, certs &amp; SA keys in</text>
    <text x="80" y="334" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">/etc/kubernetes/pki</text>
  </g>

  
  <g id="phase-2">
    <rect x="845" y="110" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="895" cy="156" r="24" fill="#207448"/>
    <text x="895" y="156" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(935, 128)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 10 6 L 34 6 L 46 18 L 46 50 L 10 50 Z"/>
      <path d="M 34 6 L 34 18 L 46 18"/>
      <circle cx="28" cy="34" r="6"/>
      <path d="M 28 24 L 28 28 M 28 40 L 28 44 M 18 34 L 22 34 M 34 34 L 38 34"/>
    </g>

    <text x="880" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">2. kubeconfig &amp; kubelet-start</text>
    <text x="880" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Write <tspan font-family="ui-monospace, monospace" font-weight="bold">admin.conf, kubelet.conf,</tspan></text>
    <text x="880" y="296" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">controller-manager.conf, scheduler.conf;</text>
    <text x="880" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">start local kubelet</text>
  </g>

  
  <g id="phase-3">
    <rect x="45" y="480" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="95" cy="526" r="24" fill="#207448"/>
    <text x="95" y="526" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(135, 498)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="28" cy="12" rx="20" ry="6"/>
      <path d="M 8 12 L 8 26 C 8 30 17 33 28 33 C 39 33 48 30 48 26 L 48 12"/>
      <path d="M 8 26 L 8 40 C 8 44 17 47 28 47 C 39 47 48 44 48 40 L 48 26"/>
    </g>

    <text x="80" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">3. control-plane &amp; etcd</text>
    <text x="80" y="628" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Write static pod YAML manifests in</text>
    <text x="80" y="666" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">/etc/kubernetes/manifests;</text>
    <text x="80" y="704" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">kubelet boots etcd &amp; kube-apiserver</text>
  </g>

  
  <g id="phase-4">
    <rect x="845" y="480" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="895" cy="526" r="24" fill="#207448"/>
    <text x="895" y="526" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(935, 498)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 14 38 C 9 38 5 34 5 29 C 5 24 9 20 14 20 C 16 12 23 7 31 7 C 40 7 47 13 48 21 C 52 22 55 26 55 30 C 55 35 51 38 46 38 Z"/>
      <path d="M 31 49 L 31 29 M 23 37 L 31 29 L 39 37"/>
    </g>

    <text x="880" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="880" dy="0">4. upload-config/certs,</tspan>
      <tspan x="880" dy="38">mark-control-plane,</tspan>
    </text>
    <text x="880" y="666" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">bootstrap-token, addon</text>
    <text x="880" y="704" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Taint NoSchedule; CoreDNS &amp; kube-proxy</text>
  </g>

  
  <g id="phase-5">
    <rect x="45" y="850" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    <circle cx="95" cy="896" r="24" fill="#db8129"/>
    <text x="95" y="896" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    
    <g transform="translate(135, 868)" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="12" r="7"/>
      <circle cx="12" cy="42" r="7"/>
      <circle cx="44" cy="42" r="7"/>
      <path d="M 28 19 L 16 35 M 28 19 L 40 35 M 19 42 L 37 42"/>
    </g>

    <text x="80" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">5. Install CNI (Calico / Cilium)</text>
    <text x="80" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Configures <tspan font-family="ui-monospace, monospace" font-weight="bold">/etc/cni/net.d;</tspan></text>
    <text x="80" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">CoreDNS starts; cp1 becomes Ready</text>
  </g>

  
  <g id="phase-6">
    <rect x="845" y="850" width="710" height="305" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="895" cy="896" r="24" fill="#207448"/>
    <text x="895" y="896" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    
    
    <g transform="translate(935, 868)" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="20" y="8" width="30" height="40" rx="4"/>
      <path d="M 26 18 H 44 M 26 28 H 44"/>
      <circle cx="8" cy="28" r="4"/>
      <path d="M 12 28 L 20 28 M 16 24 L 20 28 L 16 32"/>
    </g>

    <text x="880" y="958" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">6. kubeadm join (workers &amp; cp2/cp3)</text>
    <text x="880" y="1000" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Verify CA hash, TLS bootstrap CSR,</text>
    <text x="880" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">write <tspan font-family="ui-monospace, monospace" font-weight="bold">/etc/kubernetes/kubelet.conf</tspan></text>
  </g>
</svg>