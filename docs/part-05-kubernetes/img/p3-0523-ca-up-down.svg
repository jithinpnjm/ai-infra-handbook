<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Cluster Autoscaler: what triggers a node and what blocks its removal</title>
  <desc>Cluster Autoscaler: what triggers a node and what blocks its removal</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">Cluster Autoscaler: what triggers a node </tspan><tspan x="800" dy="54">and what blocks its removal</tspan></text>

  
  
  
  <g id="lane-scale-up">
    
    <rect x="40" y="128" width="740" height="802" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(68, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="24" width="22" height="26" rx="4" />
      <rect x="34" y="8" width="22" height="42" rx="4" />
      <polyline points="12,16 17,10 22,16" />
      <line x1="17" y1="10" x2="17" y2="22" />
      <polyline points="40,4 45,-2 50,4" />
    </g>

    
    <text x="142" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scale-up lane</text>

    
    <g id="scale-up-step-1">
      <rect x="65" y="194" width="690" height="118" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="102" cy="253" r="24" fill="#207448" />
      <text x="102" y="262" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(144, 229)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="19" />
        <polyline points="24,12 24,24 33,24" />
        <line x1="24" y1="2" x2="24" y2="5" />
      </g>
      
      <text x="212" y="232" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="212" dy="0" font-weight="bold">1 pods Pending with </tspan><tspan x="212" dy="28">FailedScheduling for </tspan><tspan x="212" dy="28">insufficient resources</tspan></text>
    </g>

    
    <line x1="410" y1="312" x2="410" y2="330" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="scale-up-step-2">
      <rect x="65" y="330" width="690" height="118" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="102" cy="389" r="24" fill="#207448" />
      <text x="102" y="398" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      
      <g transform="translate(144, 365)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="36" height="36" rx="5" stroke-dasharray="5 3" />
        <path d="M 16 24 L 22 30 L 32 18" />
      </g>
      
      <text x="212" y="368" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="212" dy="0" font-weight="bold">2 for each node group, simulate </tspan><tspan x="212" dy="28">adding a node from its template: </tspan><tspan x="212" dy="28">would the pod fit</tspan></text>
    </g>

    
    <line x1="410" y1="448" x2="410" y2="466" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="scale-up-step-3">
      <rect x="65" y="466" width="690" height="174" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="102" cy="553" r="24" fill="#207448" />
      <text x="102" y="562" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(144, 529)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="24" y1="8" x2="24" y2="40" />
        <line x1="8" y1="16" x2="40" y2="16" />
        <polygon points="8,16 3,30 13,30" />
        <polygon points="40,16 35,30 45,30" />
        <line x1="14" y1="40" x2="34" y2="40" />
      </g>
      
      <text x="212" y="504" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="212" dy="0" font-weight="bold">3 expander picks among groups: </tspan><tspan x="212" dy="28">random picks any, least-waste </tspan><tspan x="212" dy="28">leaves the fewest empty seats, </tspan><tspan x="212" dy="28">most-pods carries the most waiting </tspan><tspan x="212" dy="28">pods</tspan></text>
    </g>

    
    <line x1="410" y1="640" x2="410" y2="658" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="scale-up-step-4">
      <rect x="65" y="658" width="690" height="132" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="102" cy="696" r="24" fill="#207448" />
      <text x="102" y="705" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(144, 672)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="24" x2="42" y2="24" />
        <line x1="6" y1="14" x2="6" y2="34" />
        <line x1="42" y1="14" x2="42" y2="34" />
        <circle cx="24" cy="24" r="7" fill="#e8f1ea" />
      </g>
      
      <text x="212" y="697" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="212" dy="0" font-weight="bold">4 group size raised within its min </tspan><tspan x="212" dy="28">and max, for example </tspan><tspan x="95" dy="36" font-family="monospace">--nodes=1:10:worker-auto-scaling-group</tspan></text>
    </g>

    
    <line x1="410" y1="790" x2="410" y2="808" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="scale-up-step-5">
      <rect x="65" y="808" width="690" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="102" cy="856" r="24" fill="#207448" />
      <text x="102" y="865" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
      
      <g transform="translate(144, 832)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="10" width="36" height="30" rx="4" />
        <circle cx="15" cy="20" r="2.5" fill="#207448" />
        <polyline points="24,23 29,28 38,18" />
      </g>
      
      <text x="212" y="847" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="212" dy="0" font-weight="bold">5 node joins, scheduler places </tspan><tspan x="212" dy="28">pods</tspan></text>
    </g>
  </g>

  
  
  
  <g id="lane-scale-down">
    
    <rect x="820" y="128" width="740" height="802" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(848, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="22" height="40" rx="4" />
      <rect x="34" y="26" width="22" height="24" rx="4" />
      <polyline points="40,16 45,22 50,16" />
      <line x1="45" y1="10" x2="45" y2="22" />
    </g>

    
    <text x="922" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scale-down lane</text>

    
    <g id="scale-down-condition-box">
      <rect x="845" y="194" width="690" height="174" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(866, 214)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 38 A 20 20 0 1 1 44 38" />
        <line x1="28" y1="28" x2="18" y2="18" />
        <circle cx="28" cy="28" r="3" fill="#207448" />
        <line x1="8" y1="46" x2="48" y2="46" />
      </g>
      
      <text x="936" y="232" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="936" dy="0">node utilisation (requests against </tspan><tspan x="936" dy="28">allocatable) below </tspan><tspan x="936" dy="28" font-family="monospace">--scale-down-utilization-threshold 0.5 </tspan><tspan x="936" dy="28">for </tspan><tspan font-family="monospace">--scale-down-unneeded-time 10 min, </tspan><tspan x="936" dy="28">then drain and remove</tspan></text>
    </g>

    
    <g id="blockers-container">
      <rect x="845" y="384" width="690" height="534" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(866, 396)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 24 6 L 42 14 V 28 C 42 38 24 45 24 45 C 24 45 6 38 6 28 V 14 Z" />
        <line x1="16" y1="25" x2="32" y2="25" />
      </g>

      
      <text x="926" y="430" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Blockers list</text>

      
      <g id="blocker-1">
        <rect x="862" y="444" width="656" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        
        <g transform="translate(876, 455)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="18" r="13" />
          <line x1="18" y1="10" x2="18" y2="26" />
          <line x1="10" y1="18" x2="26" y2="18" />
        </g>
        <text x="926" y="480" font-family="sans-serif" font-size="24" fill="#303a36">pods without controllers</text>
      </g>

      
      <g id="blocker-2">
        <rect x="862" y="508" width="656" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        
        <g transform="translate(876, 519)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="18" cy="10" rx="12" ry="5" />
          <path d="M 6 10 v 16 c 0 3 5 5 12 5 s 12 -2 12 -5 v -16" />
          <path d="M 6 18 c 0 3 5 5 12 5 s 12 -2 12 -5" />
        </g>
        <text x="926" y="544" font-family="sans-serif" font-size="24" fill="#303a36">emptyDir local storage unless annotated</text>
      </g>

      
      <g id="blocker-3">
        <rect x="862" y="572" width="656" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        
        <g transform="translate(876, 583)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 6 22 a 12 12 0 0 1 24 0 Z" />
          <line x1="18" y1="22" x2="18" y2="30" />
          <path d="M 18 30 a 3 3 0 0 1 -6 0" />
        </g>
        <text x="926" y="608" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">PDBs</text>
      </g>

      
      <g id="blocker-4">
        <rect x="862" y="636" width="656" height="58" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        
        <g transform="translate(876, 647)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="18" r="6" />
          <path d="M 18 4 v 4 M 18 28 v 4 M 4 18 h 4 M 28 18 h 4 M 8 8 l 3 3 M 25 25 l 3 3 M 8 28 l 3 -3 M 25 11 l 3 -3" />
        </g>
        <text x="926" y="672" font-family="sans-serif" font-size="24" fill="#303a36">kube-system pods</text>
      </g>

      
      <g id="blocker-5-orange">
        <rect x="862" y="700" width="656" height="114" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="2.5" />
        
        <g transform="translate(876, 736)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="14" width="24" height="18" rx="3" />
          <path d="M 11 14 V 9 C 11 5 25 5 25 9 V 14" />
          <circle cx="18" cy="23" r="2" fill="#db8129" />
        </g>
        <text x="926" y="736" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="926" dy="0">annotation </tspan><tspan x="926" dy="28" font-family="monospace">cluster-autoscaler.kubernetes.io/</tspan><tspan x="926" dy="28" font-family="monospace" fill="#db8129">safe-to-evict false</tspan></text>
      </g>

      
      <g id="blocker-6">
        <rect x="862" y="820" width="656" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        
        <g transform="translate(876, 845)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="18" r="14" />
          <polyline points="18,10 18,18 24,18" />
        </g>
        <text x="926" y="856" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="926" dy="0">recently added node </tspan><tspan x="926" dy="28" font-family="monospace">(scale-down-delay-after-add)</tspan></text>
      </g>
    </g>
  </g>

  
  
  

  
  <g id="panel-limits">
    <rect x="40" y="970" width="740" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(68, 982)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="16,4 32,4 44,16 44,32 32,44 16,44 4,32 4,16" />
      <line x1="24" y1="14" x2="24" y2="26" />
      <circle cx="24" cy="33" r="1.5" fill="#207448" />
    </g>

    
    <text x="134" y="1016" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Limits</text>

    
    <g id="limits-card">
      <rect x="65" y="1030" width="690" height="118" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="95" y="1068" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="95" dy="0">reacts only to Pending pods; assumes </tspan><tspan x="95" dy="28">homogeneous node groups; does not </tspan><tspan x="95" dy="28">understand gang all-or-nothing needs</tspan></text>
    </g>
  </g>

  
  <g id="panel-gpu-settings">
    <rect x="820" y="970" width="740" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(848, 982)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="28" height="28" rx="4" />
      <rect x="16" y="16" width="16" height="16" rx="2" fill="#207448" fill-opacity="0.1" />
      <line x1="16" y1="4" x2="16" y2="10" />
      <line x1="24" y1="4" x2="24" y2="10" />
      <line x1="32" y1="4" x2="32" y2="10" />
      <line x1="16" y1="38" x2="16" y2="44" />
      <line x1="24" y1="38" x2="24" y2="44" />
      <line x1="32" y1="38" x2="32" y2="44" />
      <line x1="4" y1="16" x2="10" y2="16" />
      <line x1="4" y1="24" x2="10" y2="24" />
      <line x1="4" y1="32" x2="10" y2="32" />
      <line x1="38" y1="16" x2="44" y2="16" />
      <line x1="38" y1="24" x2="44" y2="24" />
      <line x1="38" y1="32" x2="44" y2="32" />
    </g>

    
    <text x="914" y="1016" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">GPU settings</text>

    
    <g id="gpu-card">
      <rect x="845" y="1030" width="690" height="118" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="875" y="1080" font-family="monospace" font-size="24" fill="#303a36"><tspan x="875" dy="0">--gpu-total, burst pools min 0, </tspan><tspan x="875" dy="32">--balance-similar-node-groups</tspan></text>
    </g>
  </g>

</svg>