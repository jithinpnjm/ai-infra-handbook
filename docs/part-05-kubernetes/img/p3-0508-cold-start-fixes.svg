<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Cutting a 12 minute cold start to under 90 seconds</title>
  <desc>Visual infographic detailing six architecture fixes to reduce 64 GPU node cold start from 12 minutes to under 90 seconds by moving work out of the critical path.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Cutting a 12 minute cold start to under 90 seconds</text>

  
  <rect x="50" y="128" width="1500" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="143" width="640" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="390" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">cold start of 64 GPU nodes: 12 minutes</text>

  
  <line x1="730" y1="173" x2="868" y2="173" stroke="#db8129" stroke-width="6" stroke-linecap="round" />
  <polygon points="868,161 888,173 868,185" fill="#db8129" />

  
  <rect x="890" y="143" width="640" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1210" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">under 90 seconds</text>

  

  
  <g transform="translate(50, 258)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="110" cy="30" r="8" />
      <circle cx="94" cy="56" r="7" />
      <circle cx="126" cy="56" r="7" />
      <line x1="104" y1="36" x2="98" y2="50" />
      <line x1="116" y1="36" x2="122" y2="50" />
      <line x1="101" y1="56" x2="119" y2="56" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">removes registry pull storms</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">local pull-through cache with P2P distribution</tspan>
      <tspan x="24" dy="36">(Spegel or Dragonfly), lazy-pulling snapshotter</tspan>
      <tspan x="24" dy="36">(SOCI or eStargz), pre-pull with a DaemonSet</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 258)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="88" y="24" width="44" height="40" rx="4" />
      <line x1="98" y1="32" x2="98" y2="56" />
      <line x1="110" y1="32" x2="110" y2="56" />
      <line x1="122" y1="32" x2="122" y2="56" />
      <line x1="82" y1="34" x2="88" y2="34" stroke-width="3" />
      <line x1="82" y1="50" x2="88" y2="50" stroke-width="3" />
      <line x1="132" y1="34" x2="138" y2="34" stroke-width="3" />
      <line x1="132" y1="50" x2="138" y2="50" stroke-width="3" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">removes serialized pulls</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">serializeImagePulls false,</tspan>
      <tspan x="24" dy="36">maxParallelImagePulls 4,</tspan>
      <tspan x="24" dy="36">containerd on dedicated NVMe</tspan>
    </text>
  </g>

  

  
  <g transform="translate(50, 538)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="110" cy="28" rx="22" ry="8" />
      <path d="M 88,28 v 15 c 0,4.4 9.9,8 22,8 c 12.1,0 22,-3.6 22,-8 v -15" />
      <path d="M 88,43 v 15 c 0,4.4 9.9,8 22,8 c 12.1,0 22,-3.6 22,-8 v -15" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">removes FailedAttachVolume waits</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">weights from a pre-mounted parallel filesystem</tspan>
      <tspan x="24" dy="36">(Lustre, WEKA, VAST) or local NVMe emptyDir,</tspan>
      <tspan x="24" dy="36">not 64 cloud volume attaches</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 538)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="92" y="36" width="36" height="28" rx="4" />
      <path d="M 100,36 v -10 c 0,-5.5 4.5,-10 10,-10 c 5.5,0 10,4.5 10,10 v 10" />
      <circle cx="110" cy="48" r="3" fill="#207448" />
      <line x1="110" y1="51" x2="110" y2="56" stroke-width="3" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">removes recursive chown</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">fsGroupChangePolicy OnRootMismatch</text>
  </g>

  

  
  <g transform="translate(50, 818)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="88" y="24" width="44" height="40" rx="4" />
      <line x1="99" y1="24" x2="99" y2="64" />
      <line x1="110" y1="24" x2="110" y2="64" />
      <line x1="121" y1="24" x2="121" y2="64" />
      <rect x="100" y="38" width="20" height="12" rx="2" stroke-width="2.5" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">removes init delay</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">light initContainers, never download</tspan>
      <tspan x="24" dy="36">100 GB per boot</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 818)">
    <rect width="730" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="110" cy="44" r="22" />
      <line x1="110" y1="16" x2="110" y2="22" stroke-width="4" />
      <polyline points="110,30 110,44 122,44" />
    </g>
    
    <text x="152" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">makes readiness show up sooner</text>
    
    <line x1="24" y1="82" x2="706" y2="82" stroke="#207448" stroke-opacity="0.25" stroke-width="1.5" />
    
    <text x="24" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">startupProbe periodSeconds 2 to 5 s</text>
  </g>

  
  <rect x="50" y="1098" width="1500" height="62" rx="12" fill="#207448" />
  <text x="800" y="1138" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Theme: move work out of the critical path of each pod start</text>
</svg>