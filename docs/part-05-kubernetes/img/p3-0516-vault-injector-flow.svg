<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" width="1600" height="1360">
  <title>Vault Agent Injector: from annotation to a file in the pod</title>
  <desc>Visual explanation of how Vault Agent Injector modifies pod templates to authenticate with Vault and render secrets as local files.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1360" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#207448" text-anchor="middle">Vault Agent Injector: from annotation to a file in the pod</text>

  
  <g id="setup-box">
    <rect x="60" y="85" width="1480" height="145" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(85, 100)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="16" cy="16" r="8" />
      <path d="M16 2 v4 M16 26 v4 M2 16 h4 M26 16 h4 M6 6 l3 3 M23 23 l3 3 M6 26 l3 -3 M23 9 l3 -3" />
    </g>
    
    <text x="130" y="125" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault auth enable kubernetes</text>
    <text x="130" y="195" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault policy write team-a</text>

    <text x="560" y="125" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault write auth/kubernetes/config with</text>
    <text x="560" y="158" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">kubernetes_host, kubernetes_ca_cert, token_reviewer_jwt</text>

    <text x="960" y="195" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault write auth/kubernetes/role/database</text>
  </g>

  
  <g id="step-1">
    <rect x="60" y="255" width="710" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="295" r="22" fill="#207448" />
    <text x="100" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="140" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Deployment pod template carries annotations</text>
    <text x="90" y="345" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault.hashicorp.com/agent-inject true,</text>
    <text x="90" y="380" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">agent-inject-status update, role database,</text>
    <text x="90" y="415" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">agent-inject-secret-db-creds secrets/db/creds,</text>
    <text x="90" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">and an agent-inject-template-db-creds Go template</text>
    <text x="90" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">that formats a JDBC string</text>
  </g>

  
  <path d="M 415 520 L 415 558" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-2">
    <rect x="60" y="560" width="710" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="600" r="22" fill="#207448" />
    <text x="100" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="140" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Webhook runs on every Pod CREATE or UPDATE</text>
    <text x="90" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">but changes only pods with the annotations; it injects the</text>
    <text x="90" y="688" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault-agent-init init container and, because status</text>
    <text x="90" y="726" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">is update, the long-running</text>
    <text x="90" y="764" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault-agent sidecar</text>
  </g>

  
  <path d="M 770 695 L 800 695 L 800 335 L 828 335" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-3">
    <rect x="830" y="255" width="710" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="295" r="22" fill="#207448" />
    <text x="870" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="910" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Agent sends the pod ServiceAccount token</text>
    <text x="860" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">to Vault Kubernetes auth</text>
  </g>

  
  <path d="M 1185 415 L 1185 453" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-4">
    <rect x="830" y="455" width="710" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="495" r="22" fill="#207448" />
    <text x="870" y="503" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="910" y="503" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Vault calls the Kubernetes TokenReview API</text>
    <text x="860" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">to validate the token</text>
  </g>

  
  <path d="M 1185 615 L 1185 653" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-5">
    <rect x="830" y="655" width="710" height="275" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="695" r="22" fill="#207448" />
    <text x="870" y="703" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="910" y="703" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Vault matches a role:</text>
    <text x="860" y="745" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">vault write auth/kubernetes/role/database</text>
    <text x="860" y="785" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">bound_service_account_names=webapp</text>
    <text x="860" y="825" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">bound_service_account_namespaces=team-a</text>
    <text x="860" y="865" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">policies=team-a ttl=20m</text>
  </g>

  
  <path d="M 1185 930 L 1185 968" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-6">
    <rect x="830" y="970" width="710" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="1010" r="22" fill="#207448" />
    <text x="870" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="910" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Policy team-a:</text>
    <text x="860" y="1070" font-family="ui-monospace, monospace" font-size="24px" fill="#303a36">path secret/data/team-a/* capabilities read</text>
  </g>

  
  <path d="M 830 1050 L 772 1050" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="step-7">
    <rect x="60" y="870" width="710" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="910" r="22" fill="#207448" />
    <text x="100" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="140" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Agent renders the secret to</text>
    <text x="90" y="968" font-family="ui-monospace, monospace" font-size="24px" font-weight="bold" fill="#207448">/vault/secrets/db-creds;</text>
    <text x="90" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">the sidecar refreshes leased or rotated secrets</text>
  </g>

  
  <path d="M 415 1130 L 415 1178" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#arrow-orange)" />

  
  <g id="note-banner">
    <rect x="60" y="1180" width="1480" height="120" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(100, 1220)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 20 5 L 35 12 V 25 C 35 34 20 40 20 40 C 20 40 5 34 5 25 V 12 Z" />
      <path d="M 14 22 L 18 26 L 27 17" />
    </g>
    <text x="160" y="1252" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">the application sees only a file and never talks to Vault</text>
  </g>
</svg>