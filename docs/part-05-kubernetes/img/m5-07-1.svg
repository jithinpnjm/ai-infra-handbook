<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The pod</title>
  <desc>Visual explanation of the Kubernetes pod sandbox, initContainers, native sidecars, app containers, and termination sequence.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The pod</text>

  
  <g id="node-pod">
    <rect x="250" y="110" width="1100" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(312, 162)">
      <polygon points="28,4 52,16 28,28 4,16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <polygon points="4,16 4,40 28,52 28,28" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <polygon points="52,16 52,40 28,52 28,28" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    
    <text x="430" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Pod Sandbox (pause container)</text>
    <text x="430" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Shared NetNS (eth0, Pod IP), IPC (/dev/shm),</text>
    <text x="430" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Volumes (emptyDir, PVC, projected), Pod cgroup slice</text>
  </g>

  
  <line x1="800" y1="270" x2="800" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-init">
    <rect x="250" y="330" width="1100" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="295" cy="410" r="24" fill="#207448" />
    <text x="295" y="410" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(345, 382)">
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M25,5 L31,5 L32,11 L37,13 L42,9 L47,14 L43,19 L45,24 L51,25 L51,31 L45,32 L43,37 L47,42 L42,47 L37,43 L32,45 L31,51 L25,51 L24,45 L19,43 L14,47 L9,42 L13,37 L11,32 L5,31 L5,25 L11,24 L13,19 L9,14 L14,9 L19,13 L24,11 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    
    <text x="430" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">1. initContainers (sequential)</text>
    <text x="430" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">fetch-config, wait-for-rdma</text>
    <text x="430" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Effective req = max(max_init, sum_app)</text>
  </g>

  
  <line x1="800" y1="490" x2="800" y2="550" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-sidecars">
    <rect x="250" y="550" width="1100" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="295" cy="630" r="24" fill="#207448" />
    <text x="295" y="630" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(345, 602)">
      <rect x="4" y="8" width="22" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="18" x2="20" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="10" y1="26" x2="20" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <rect x="30" y="14" width="22" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="36" y1="24" x2="46" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="36" y1="32" x2="46" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="26" y1="31" x2="30" y2="31" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="430" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">2. Native Sidecars</text>
    <text x="430" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">(initContainers with restartPolicy: Always)</text>
    <text x="430" y="678" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Start before app, stop after app exits</text>
  </g>

  
  <line x1="800" y1="710" x2="800" y2="770" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-app">
    <rect x="250" y="770" width="1100" height="160" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="295" cy="850" r="24" fill="#207448" />
    <text x="295" y="850" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(345, 822)">
      <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="4" />
      <circle cx="11" cy="12" r="2" fill="#207448" />
      <circle cx="18" cy="12" r="2" fill="#207448" />
      <path d="M14,28 L21,34 L14,40 M25,40 L36,40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="430" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">3. App Containers (parallel)</text>
    <text x="430" y="860" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">trainer / vllm-openai</text>
    <text x="430" y="898" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">startupProbe -&gt; readinessProbe / livenessProbe</text>
  </g>

  
  <line x1="800" y1="930" x2="800" y2="990" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="node-term">
    <rect x="250" y="990" width="1100" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="295" cy="1070" r="24" fill="#207448" />
    <text x="295" y="1070" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(345, 1042)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M28,14 L28,28 L38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="430" y="1038" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">4. Termination sequence</text>
    <text x="430" y="1080" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">deletionTimestamp + EndpointSlice removal ||</text>
    <text x="430" y="1118" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">preStop hook -&gt; SIGTERM -&gt; gracePeriod -&gt; SIGKILL</text>
  </g>
</svg>