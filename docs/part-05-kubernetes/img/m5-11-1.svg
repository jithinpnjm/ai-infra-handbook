<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>CoreDNS architecture</title>
  <desc>Architecture infographic illustrating DNS resolution flow from Pod resolver through NodeLocal DNSCache and CoreDNS to Kubernetes and upstream plugins.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">CoreDNS architecture</text>

  
  <g id="node-pod">
    <rect x="60" y="130" width="620" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="90" y="152" width="52" height="42" rx="5"/>
      <line x1="90" y1="166" x2="142" y2="166"/>
      <circle cx="101" cy="159" r="2" fill="#207448"/>
      <circle cx="109" cy="159" r="2" fill="#207448"/>
      <path d="M 101 180 L 108 185 L 101 190"/>
      <line x1="113" y1="190" x2="125" y2="190"/>
    </g>
    <text x="160" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod Resolver</text>
    <text x="160" y="210" font-family="monospace" font-size="24" fill="#303a36">(/etc/resolv.conf)</text>
    <text x="90" y="260" font-family="monospace" font-size="24" fill="#303a36">nameserver 169.254.20.10<tspan x="90" dy="35">(or 10.96.0.10)</tspan></text>
    <text x="90" y="340" font-family="monospace" font-size="24" fill="#303a36">search &lt;ns&gt;.svc.cluster.local ...</text>
    <text x="90" y="385" font-family="monospace" font-size="24" fill="#303a36">options ndots:5</text>
  </g>

  
  <g id="node-nld">
    <rect x="1040" y="130" width="500" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1092 152 L 1114 160 C 1114 182 1104 198 1092 204 C 1080 198 1070 182 1070 160 Z"/>
      <path d="M 1084 176 L 1090 182 L 1100 170"/>
    </g>
    <text x="1135" y="185" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NodeLocal DNSCache</text>
    <text x="1070" y="260" font-family="sans-serif" font-size="24" fill="#303a36">(per-node DaemonSet</text>
    <text x="1070" y="300" font-family="monospace" font-size="24" fill="#303a36">169.254.20.10)</text>
  </g>

  
  <g id="arrow-pod-to-nld">
    <line x1="680" y1="270" x2="1040" y2="270" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="705" y="248" width="310" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="860" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">UDP/TCP 53 (NOTRACK)</text>
  </g>

  
  <g id="node-cdns">
    <rect x="360" y="560" width="880" height="170" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="415" cy="610" r="10"/>
      <path d="M 415 592 V 597 M 415 623 V 628 M 397 610 H 402 M 428 610 H 433 M 402 597 L 406 601 M 424 619 L 428 623 M 402 623 L 406 619 M 424 601 L 428 597"/>
    </g>
    <text x="460" y="612" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CoreDNS Deployment</text>
    <text x="460" y="648" font-family="monospace" font-size="24" fill="#303a36">(kube-system/coredns)</text>
    <text x="390" y="695" font-family="monospace" font-size="24" fill="#303a36">errors -&gt; health/ready -&gt; rewrite/hosts -&gt;</text>
  </g>

  
  <g id="arrow-nld-to-cdns">
    <path d="M 1290 425 V 490 H 800 V 560" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
    <rect x="870" y="468" width="350" height="44" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <text x="1045" y="498" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Cache miss over TCP 53</text>
  </g>

  
  <g id="node-k8s">
    <rect x="60" y="840" width="740" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="115" cy="890" r="18"/>
      <circle cx="115" cy="890" r="6"/>
      <line x1="115" y1="872" x2="115" y2="884"/>
      <line x1="115" y1="896" x2="115" y2="908"/>
      <line x1="97" y1="890" x2="109" y2="890"/>
      <line x1="121" y1="890" x2="133" y2="890"/>
    </g>
    <text x="160" y="895" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">kubernetes plugin</text>
    <text x="90" y="948" font-family="sans-serif" font-size="24" fill="#303a36">(*.cluster.local via Informers</text>
    <text x="90" y="988" font-family="sans-serif" font-size="24" fill="#303a36">Services &amp; EndpointSlices)</text>
  </g>

  
  <g id="node-fwd">
    <rect x="840" y="840" width="700" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="895" cy="890" r="18"/>
      <line x1="877" y1="890" x2="913" y2="890"/>
      <ellipse cx="895" cy="890" rx="9" ry="18"/>
    </g>
    <text x="940" y="895" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">cache 30 -&gt; forward plugin</text>
    <text x="870" y="948" font-family="sans-serif" font-size="24" fill="#303a36">(External queries to</text>
    <text x="870" y="988" font-family="monospace" font-size="24" fill="#303a36">upstream /etc/resolv.conf)</text>
  </g>

  
  <g id="arrow-cdns-to-k8s">
    <path d="M 500 730 V 785 H 430 V 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  </g>

  
  <g id="arrow-cdns-to-fwd">
    <path d="M 1100 730 V 785 H 1190 V 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  </g>
</svg>