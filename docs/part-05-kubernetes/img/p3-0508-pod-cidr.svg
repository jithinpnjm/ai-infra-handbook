<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Where a pod IP comes from: node CIDR then CNI IPAM</title>
  <desc>Visual explanation of Kubernetes Pod IP allocation from cluster CIDR through node CIDRs to CNI IPAM allocation</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1350" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">
    Where a pod IP comes from: node CIDR then CNI IPAM
  </text>

  
  <rect x="60" y="105" width="1480" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(90, 145)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="14" />
    <path d="M28,6 L28,14 M28,42 L28,50 M6,28 L14,28 M42,28 L50,28 M12,12 L18,18 M38,38 L44,44 M12,44 L18,38 M38,18 L44,12" stroke-linecap="round" />
  </g>

  <text x="175" y="158" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="175" dy="0">kubeadm init --pod-network-cidr 10.244.0.0/16 sets --cluster-cidr on</tspan>
    <tspan x="175" dy="44">kube-controller-manager with --allocate-node-cidrs=true, RangeAllocator, --node-cidr-mask-size-ipv4=24</tspan>
  </text>

  
  <path d="M 800,260 L 800,325" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)" />

  
  <path d="M 285,325 L 1315,325" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 285,325 L 285,355" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M 800,325 L 800,355" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
  <path d="M 1315,325 L 1315,355" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <rect x="60" y="360" width="460" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="80" y="380" width="420" height="50" rx="8" fill="#e8f1ea" />
  <text x="290" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Node 1</text>
  <text x="80" y="480" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">a /24 slice</tspan>
    <tspan x="80" dy="38">shown in spec.podCIDR and</tspan>
    <tspan x="80" dy="38">spec.podCIDRs</tspan>
  </text>

  
  <rect x="570" y="360" width="460" height="235" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <rect x="590" y="380" width="420" height="50" rx="8" fill="#fff4e8" />
  <text x="800" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">Node 2</text>
  <text x="590" y="480" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="590" dy="0">a /24 slice</tspan>
    <tspan x="590" dy="38">shown in spec.podCIDR and</tspan>
    <tspan x="590" dy="38">spec.podCIDRs</tspan>
  </text>

  
  <rect x="1080" y="360" width="460" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="1100" y="380" width="420" height="50" rx="8" fill="#e8f1ea" />
  <text x="1310" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Node 3</text>
  <text x="1100" y="480" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">a /24 slice</tspan>
    <tspan x="1100" dy="38">shown in spec.podCIDR and</tspan>
    <tspan x="1100" dy="38">spec.podCIDRs</tspan>
  </text>

  
  <path d="M 800,595 L 800,640" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrowhead-orange)" />

  
  <rect x="60" y="645" width="1480" height="150" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(90, 685)" stroke="#db8129" stroke-width="3" fill="none">
    <rect x="4" y="6" width="48" height="42" rx="6" />
    <path d="M16,27 L26,37 L42,19" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="175" y="705" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="175" dy="0">CNI ADD returns JSON: ips address 10.244.1.188/24, gateway 10.244.1.1, routes, dns</tspan>
  </text>
  <text x="175" y="755" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="175" dy="0">Cilium uses CiliumNode spec.ipam.podCIDRs; Calico uses ipPools with blockSize 26</tspan>
  </text>

  
  <g transform="translate(0, 830)">
    
    <rect x="60" y="0" width="715" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(90, 30)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="28" cy="20" rx="22" ry="12" />
      <path d="M6,20 C6,38 50,38 50,20" />
      <path d="M6,34 C6,52 50,52 50,34" />
    </g>
    <text x="175" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Encapsulation Mode</text>
    <text x="90" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">Overlay CNIs: VXLAN, Geneve or</tspan>
      <tspan x="90" dy="40">IP-in-IP tunnels per node</tspan>
    </text>

    <text x="800" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">versus</text>

    
    <rect x="825" y="0" width="715" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(855, 30)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="16" cy="40" r="8" />
      <circle cx="44" cy="40" r="8" />
      <circle cx="30" cy="16" r="8" />
      <path d="M22,34 L26,23 M38,34 L34,23" />
    </g>
    <text x="940" y="65" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Direct Routing Mode</text>
    <text x="855" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="855" dy="0">Routed CNIs: Calico BGP or Cilium</tspan>
      <tspan x="855" dy="40">native routing advertise pod CIDRs</tspan>
    </text>
  </g>

  
  <rect x="60" y="1100" width="1480" height="150" rx="14" fill="#207448" />
  
  <g transform="translate(95, 1145)" stroke="#ffffff" stroke-width="4" fill="none">
    <path d="M28,6 L48,16 L48,32 C48,46 28,56 28,56 C28,56 8,46 8,32 L8,16 Z" />
    <path d="M20,30 L26,36 L38,22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="180" y="1165" font-family="sans-serif" font-size="25" fill="#ffffff" font-weight="bold">
    <tspan x="180" dy="0">CNI must allow the local node IP to reach every pod so kubelet</tspan>
    <tspan x="180" dy="42">httpGet, tcpSocket and grpc probes work</tspan>
  </text>
</svg>