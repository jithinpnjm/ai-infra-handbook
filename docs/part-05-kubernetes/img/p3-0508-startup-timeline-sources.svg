<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Where each startup interval comes from</title>
  <desc>Visual breakdown of Kubernetes pod startup intervals, their diagnostic sources, metric brackets, and comparison between warm and cold nodes.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Where each startup interval comes from</text>

  
  
  <g id="bracket-duration">
    <rect x="60" y="86" width="1480" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 361 170 L 361 162 L 1321 162 L 1321 170" fill="none" stroke="#207448" stroke-width="3" />
    <text x="800" y="118" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubelet_pod_start_duration_seconds:</text>
    <text x="800" y="148" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">from kubelet first seeing the pod until all regular containers run, includes image pull</text>
  </g>

  
  <g id="bracket-sli">
    <rect x="60" y="174" width="1480" height="76" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 601 258 L 601 250 L 1321 250 L 1321 258" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6,4" />
    <text x="800" y="206" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubelet_pod_start_sli_duration_seconds:</text>
    <text x="800" y="236" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">SIG-Scalability SLI, excludes image pull and init container runtime</text>
  </g>

  
  <line x1="356" y1="365" x2="361" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="596" y1="365" x2="601" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="813" y1="365" x2="818" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="1060" y1="365" x2="1065" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <line x1="1321" y1="365" x2="1325" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  

  
  <g id="col-1">
    
    <rect x="40" y="280" width="316" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="78" cy="318" r="24" fill="#207448" />
    <text x="78" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">1</text>
    
    <g transform="translate(286, 296)">
      <rect x="0" y="4" width="46" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="4" />
      <line x1="12" y1="0" x2="12" y2="8" stroke="#207448" stroke-width="4" />
      <line x1="34" y1="0" x2="34" y2="8" stroke="#207448" stroke-width="4" />
    </g>
    <text x="198" y="390" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Created to</text>
    <text x="198" y="425" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduled</text>

    
    <rect x="40" y="460" width="316" height="355" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="198" y="525" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">creationTimestamp</text>
    <text x="198" y="575" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">versus</text>
    <text x="198" y="625" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">PodScheduled</text>
    <text x="198" y="675" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">lastTransitionTime,</text>
    <text x="198" y="745" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">scheduler metrics</text>
  </g>

  
  <g id="col-2">
    
    <rect x="361" y="280" width="235" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="399" cy="318" r="24" fill="#207448" />
    <text x="399" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">2</text>
    
    <g transform="translate(533, 294)">
      <circle cx="24" cy="24" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 24 2 L 24 8 M 24 40 L 24 46 M 2 24 L 8 24 M 40 24 L 46 24 M 8 8 L 13 13 M 35 35 L 40 40 M 8 40 L 13 35 M 35 13 L 40 8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="478" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduled</text>
    <text x="478" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">to</text>
    <text x="478" y="435" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Initialized</text>

    
    <rect x="361" y="460" width="235" height="355" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="478" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">init</text>
    <text x="478" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">containers,</text>
    <text x="478" y="610" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">volume mounts,</text>
    <text x="478" y="650" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">sandbox;</text>
    <text x="478" y="715" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Initialized</text>
    <text x="478" y="755" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">condition</text>
  </g>

  
  <g id="col-3">
    
    <rect x="601" y="280" width="212" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="639" cy="318" r="24" fill="#207448" />
    <text x="639" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">3</text>
    
    <g transform="translate(747, 294)">
      <path d="M 24 4 L 44 12 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    <text x="707" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Sandbox</text>

    
    <rect x="601" y="460" width="212" height="355" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="707" y="570" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubelet_run_</text>
    <text x="707" y="615" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">podsandbox_</text>
    <text x="707" y="660" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">duration_</text>
    <text x="707" y="705" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">seconds</text>
  </g>

  
  <g id="col-4">
    
    <rect x="818" y="280" width="242" height="170" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    <circle cx="856" cy="318" r="24" fill="#db8129" />
    <text x="856" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">4</text>
    
    <g transform="translate(994, 294)">
      <path d="M 8 36 L 40 36 M 24 6 L 24 28 M 14 18 L 24 28 L 34 18" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="939" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Pull</text>

    
    <rect x="818" y="460" width="242" height="355" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="2" />
    <text x="939" y="510" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">event Pulled</text>
    <text x="939" y="548" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">in X,</text>
    <text x="939" y="600" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubelet_image_</text>
    <text x="939" y="642" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">pull_duration_</text>
    <text x="939" y="684" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">seconds,</text>
    <text x="939" y="740" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">containerd logs</text>
  </g>

  
  <g id="col-5">
    
    <rect x="1065" y="280" width="256" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1103" cy="318" r="24" fill="#207448" />
    <text x="1103" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">5</text>
    
    <g transform="translate(1251, 294)">
      <rect x="2" y="6" width="44" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="2" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="4" />
      <circle cx="10" cy="11" r="2" fill="#207448" />
      <circle cx="16" cy="11" r="2" fill="#207448" />
    </g>
    <text x="1193" y="390" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Container</text>
    <text x="1193" y="425" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">start</text>

    
    <rect x="1065" y="460" width="256" height="355" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1193" y="620" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">ContainersReady</text>
    <text x="1193" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">time</text>
  </g>

  
  <g id="col-6">
    
    <rect x="1325" y="280" width="235" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="1363" cy="318" r="24" fill="#207448" />
    <text x="1363" y="326" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f5f8f5">6</text>
    
    <g transform="translate(1495, 294)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 14 24 L 21 31 L 34 16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="1442" y="405" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ready</text>

    
    <rect x="1325" y="460" width="235" height="355" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1442" y="550" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">readiness</text>
    <text x="1442" y="590" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">probe success,</text>
    <text x="1442" y="670" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Ready</text>
    <text x="1442" y="710" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">condition</text>
  </g>

  

  
  <g id="panel-warm-node">
    <rect x="40" y="845" width="745" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(70, 875)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="0" x2="28" y2="4" stroke="#207448" stroke-width="4" />
    </g>
    <text x="145" y="915" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Warm node numbers</text>
    <text x="70" y="975" font-family="sans-serif" font-size="24" fill="#303a36">API and scheduling tens of ms,</text>
    <text x="70" y="1025" font-family="sans-serif" font-size="24" fill="#303a36">sandbox and CNI 100 to 500 ms,</text>
    <text x="70" y="1075" font-family="sans-serif" font-size="24" fill="#303a36">container under 1 s</text>
  </g>

  
  <g id="panel-cold-node">
    <rect x="815" y="845" width="745" height="265" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(845, 875)">
