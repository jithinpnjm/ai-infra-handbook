      <path d="M 6 14 L 6 38 C 6 44 16 48 28 48 C 40 48 50 44 50 38 L 50 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 26 C 6 32 16 36 28 36 C 40 36 50 32 50 26" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="920" y="915" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Cold node</text>
    <text x="845" y="975" font-family="sans-serif" font-size="24" fill="#303a36">pull and unpack minutes,</text>
    <text x="845" y="1025" font-family="sans-serif" font-size="24" fill="#303a36">PVC attach 5 to 60 s,</text>
    <text x="845" y="1075" font-family="sans-serif" font-size="24" fill="#303a36">model load minutes</text>
  </g>
</svg>