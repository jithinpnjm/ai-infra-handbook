<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>A rolling update is a period of two versions</title>
  <desc>Infographic explaining the period of two versions during a rolling update, showing the timeline from version 1 to mixed versions and potential compatibility breaks.</desc>

  <defs>
    <marker id="green-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="orange-arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A rolling update is a period of two versions</text>

  
  <g transform="translate(60, 135)">
    <rect width="460" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="65" cy="65" r="24" fill="#207448"/>
    <text x="65" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">t</text>
    
    <g transform="translate(115, 37)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="26"/>
      <polyline points="28,14 28,28 38,28"/>
    </g>
    
    <line x1="30" y1="120" x2="430" y2="120" stroke="#207448" stroke-width="2" stroke-opacity="0.25"/>
    
    <text x="30" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">user request reaches a</tspan>
      <tspan x="30" dy="38">version 1 server, downloads</tspan>
      <tspan x="30" dy="38">the version 1 client library</tspan>
    </text>
  </g>

  
  <line x1="520" y1="382" x2="566" y2="382" stroke="#207448" stroke-width="4" marker-end="url(#green-arrow)"/>

  
  <g transform="translate(570, 135)">
    <rect width="460" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="65" cy="65" r="24" fill="#207448"/>
    <text x="65" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">t1</text>
    
    <g transform="translate(115, 37)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14"/>
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11"/>
    </g>
    
    <line x1="30" y1="120" x2="430" y2="120" stroke="#207448" stroke-width="2" stroke-opacity="0.25"/>
    
    <text x="30" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">service updated; half the</tspan>
      <tspan x="30" dy="34">servers run version 1,</tspan>
      <tspan x="30" dy="34">half version 2</tspan>
      <tspan x="30" dy="34">(RollingUpdate with</tspan>
      <tspan x="30" dy="34">25 percent max unavailable</tspan>
      <tspan x="30" dy="34">and 25 percent max surge</tspan>
      <tspan x="30" dy="34">both v1 and v2 ReplicaSet</tspan>
      <tspan x="30" dy="34">pods serve traffic)</tspan>
    </text>
  </g>

  
  <line x1="1030" y1="382" x2="1076" y2="382" stroke="#207448" stroke-width="4" marker-end="url(#green-arrow)"/>

  
  <g transform="translate(1080, 135)">
    <rect width="460" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="65" cy="65" r="24" fill="#207448"/>
    <text x="65" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">t2</text>
    
    <g transform="translate(115, 37)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="52" height="44" rx="6"/>
      <line x1="2" y1="18" x2="54" y2="18"/>
      <circle cx="12" cy="12" r="2" fill="#207448"/>
      <circle cx="20" cy="12" r="2" fill="#207448"/>
    </g>
    
    <line x1="30" y1="120" x2="430" y2="120" stroke="#207448" stroke-width="2" stroke-opacity="0.25"/>
    
    <text x="30" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">version 1 client code in the</tspan>
      <tspan x="30" dy="38">browser calls an endpoint on</tspan>
      <tspan x="30" dy="38">a version 2 server</tspan>
    </text>
  </g>

  
  <line x1="1310" y1="630" x2="1310" y2="666" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)"/>

  
  <g transform="translate(60, 670)">
    <rect width="970" height="320" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(40, 40)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 Q 52 4 52 26 Q 52 48 28 54 Q 4 48 4 26 Q 4 4 28 4 Z"/>
      <polyline points="18,27 25,34 38,19"/>
    </g>
    
    <text x="130" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="130" dy="0">Backward and forward compatibility between adjacent versions;</tspan>
      <tspan x="130" dy="42">an API contract and load balancer decouple frontend and</tspan>
      <tspan x="130" dy="42">backend</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 670)">
    <rect width="460" height="320" rx="16" fill="#fdf2f2" stroke="#dc2626" stroke-width="3"/>
    
    <g transform="translate(40, 36)" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,6 52,48 4,48"/>
      <line x1="28" y1="20" x2="28" y2="34"/>
      <circle cx="28" cy="41" r="2.5" fill="#dc2626"/>
    </g>
    
    <text x="40" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="40" dy="0">If the API contract changed</tspan>
      <tspan x="40" dy="40">incompatibly, the call breaks</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 1030)">
    <rect width="1480" height="90" rx="16" fill="#207448"/>
    <text x="740" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Can this version talk to the one before it and the one after it?</text>
  </g>
</svg>