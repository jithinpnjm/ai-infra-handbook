<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Paths a NetworkPolicy does not cover</title>
  <desc>Paths a NetworkPolicy does not cover</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Paths a NetworkPolicy does not cover</text>

  
  <rect x="25" y="415" width="1550" height="640" rx="20" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="8 8" opacity="0.35" />

  

  
  <g>
    <rect x="40" y="115" width="740" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(68, 140)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <ellipse cx="28" cy="28" rx="11" ry="24" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="145" y="176" font-size="30" font-weight="bold" fill="#207448">External traffic: </tspan>
      <tspan x="68" y="235" font-size="24">source IP may be SNATed by load </tspan>
      <tspan x="68" y="275" font-size="24">balancers, breaking ipBlock; use </tspan>
      <tspan x="68" y="315" font-size="24">externalTrafficPolicy Local, PROXY </tspan>
      <tspan x="68" y="355" font-size="24">protocol or L7 auth</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="115" width="740" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(848, 140)">
      <circle cx="28" cy="28" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M28,4 L28,12 M28,44 L28,52 M4,28 L12,28 M44,28 L52,28 M11,11 L17,17 M39,39 L45,45 M11,45 L17,39 M39,17 L45,11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="925" y="176" font-size="30" font-weight="bold" fill="#207448">API server and webhooks: </tspan>
      <tspan x="848" y="235" font-size="24">egress to kubernetes.default is a </tspan>
      <tspan x="848" y="275" font-size="24">control-plane IP, allow ipBlock or </tspan>
      <tspan x="848" y="315" font-size="24">Cilium toEntities kube-apiserver; the </tspan>
      <tspan x="848" y="355" font-size="24">API server must reach webhook pod ports</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="40" y="430" width="740" height="290" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(68, 455)">
      <path d="M28,6 L50,16 L50,30 C50,44 28,52 28,52 C28,52 6,44 6,30 L6,16 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="28" cy="26" r="5" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="28" y1="31" x2="28" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="145" y="492" font-size="30" font-weight="bold" fill="#207448">hostNetwork pods: </tspan>
      <tspan x="68" y="550" font-size="24">share the node identity, not subject to </tspan>
      <tspan x="68" y="590" font-size="24">pod policy; restrict with Pod Security, </tspan>
      <tspan x="68" y="630" font-size="24">use host firewall policies (Calico </tspan>
      <tspan x="68" y="670" font-size="24">HostEndpoints, Cilium host policy)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="430" width="740" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(848, 455)">
      <circle cx="28" cy="28" r="23" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="2" x2="28" y2="5" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="925" y="492" font-size="30" font-weight="bold" fill="#207448">Probes: </tspan>
      <tspan x="848" y="550" font-size="24">kubelet probes originate from the node, </tspan>
      <tspan x="848" y="590" font-size="24">generally allowed by CNIs; with host </tspan>
      <tspan x="848" y="630" font-size="24">firewalls allow node to pod; test after </tspan>
      <tspan x="848" y="670" font-size="24">default deny</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="40" y="750" width="740" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(68, 775)">
      <rect x="6" y="8" width="44" height="40" rx="8" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="18" cy="28" r="4" fill="#207448" />
      <circle cx="38" cy="20" r="4" fill="#207448" />
      <circle cx="38" cy="36" r="4" fill="#207448" />
      <line x1="22" y1="28" x2="34" y2="20" stroke="#207448" stroke-width="3" />
      <line x1="22" y1="28" x2="34" y2="36" stroke="#207448" stroke-width="3" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="145" y="812" font-size="30" font-weight="bold" fill="#207448">Service IPs: </tspan>
      <tspan x="68" y="875" font-size="24">policies see pods post-DNAT, match </tspan>
      <tspan x="68" y="915" font-size="24">backend pods by labels, not ClusterIP</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="750" width="740" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(848, 775)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="20" y1="4" x2="20" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="36" y1="4" x2="36" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="4" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="20" x2="52" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="44" y1="36" x2="52" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="925" y="798" font-size="30" font-weight="bold" fill="#207448">Multus and RDMA secondary </tspan>
      <tspan x="925" y="836" font-size="30" font-weight="bold" fill="#207448">interfaces: </tspan>
      <tspan x="848" y="890" font-size="24">policy applies to the primary CNI interface </tspan>
      <tspan x="848" y="930" font-size="24">only; treat RDMA fabrics as separate </tspan>
      <tspan x="848" y="970" font-size="24">trust domains (VLAN or PKey isolation)</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1080" width="1520" height="80" rx="12" fill="#207448" />
    <text x="800" y="1130" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">no cluster-wide policy, no explicit deny, no L7, no FQDN egress, no logging in the standard API</text>
  </g>
</svg>