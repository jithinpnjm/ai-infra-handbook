<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <title>Odd etcd member counts give the best failure tolerance</title>
  <desc>Infographic comparing failure tolerance across 3, 4, and 5 etcd members, illustrating why odd member counts provide optimal resilience without redundant machines.</desc>

  
  <rect width="1600" height="950" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Odd etcd member counts give the best failure tolerance</text>

  
  <g id="col-3-members">
    
    <rect x="60" y="130" width="460" height="530" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="2" />

    
    <g transform="translate(262, 148)">
      <rect x="0" y="0" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="7" x2="16" y2="7" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="7" r="2" fill="#207448" />

      <rect x="0" y="19" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="26" x2="16" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="26" r="2" fill="#207448" />

      <rect x="0" y="38" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="45" x2="16" y2="45" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="45" r="2" fill="#207448" />
    </g>

    
    <text x="290" y="235" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">3 members</text>

    
    <g id="icons-3">
      <circle cx="226" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="226" cy="300" r="5" fill="#207448" />

      <circle cx="290" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="290" cy="300" r="5" fill="#207448" />

      <circle cx="354" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="354" cy="300" r="5" fill="#207448" />
    </g>

    
    <rect x="90" y="350" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="290" y="394" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">quorum 2</text>

    
    <rect x="90" y="445" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="290" y="489" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">tolerates 1 failure</text>
  </g>

  
  <g id="col-4-members">
    
    <rect x="570" y="130" width="460" height="530" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="2" />

    
    <g transform="translate(772, 148)">
      <rect x="0" y="0" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="7" x2="16" y2="7" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="7" r="2" fill="#207448" />

      <rect x="0" y="19" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="26" x2="16" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="26" r="2" fill="#207448" />

      <rect x="0" y="38" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="45" x2="16" y2="45" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="45" r="2" fill="#207448" />
    </g>

    
    <text x="800" y="235" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">4 members</text>

    
    <g id="icons-4">
      <circle cx="701" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="701" cy="300" r="5" fill="#207448" />

      <circle cx="767" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="767" cy="300" r="5" fill="#207448" />

      <circle cx="833" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="833" cy="300" r="5" fill="#207448" />

      
      <circle cx="899" cy="300" r="22" fill="#fff5ea" stroke="#db8129" stroke-width="4" />
      <circle cx="899" cy="300" r="5" fill="#db8129" />
    </g>

    
    <rect x="600" y="350" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="394" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">quorum 3</text>

    
    <rect x="600" y="445" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="489" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">tolerates 1 failure</text>

    
    <rect x="600" y="540" width="400" height="95" rx="8" fill="#fff5ea" stroke="#db8129" stroke-width="2" />
    <text x="800" y="578" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="800" dy="0">an extra machine</tspan>
      <tspan x="800" dy="32">with no added tolerance</tspan>
    </text>
  </g>

  
  <g id="col-5-members">
    
    <rect x="1080" y="130" width="460" height="530" rx="12" fill="#ffffff" stroke="#d0ded3" stroke-width="2" />

    
    <g transform="translate(1282, 148)">
      <rect x="0" y="0" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="7" x2="16" y2="7" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="7" r="2" fill="#207448" />

      <rect x="0" y="19" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="26" x2="16" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="26" r="2" fill="#207448" />

      <rect x="0" y="38" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="10" y1="45" x2="16" y2="45" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="44" cy="45" r="2" fill="#207448" />
    </g>

    
    <text x="1310" y="235" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">5 members</text>

    
    <g id="icons-5">
      <circle cx="1190" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="1190" cy="300" r="5" fill="#207448" />

      <circle cx="1250" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="1250" cy="300" r="5" fill="#207448" />

      <circle cx="1310" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="1310" cy="300" r="5" fill="#207448" />

      <circle cx="1370" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="1370" cy="300" r="5" fill="#207448" />

      <circle cx="1430" cy="300" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
      <circle cx="1430" cy="300" r="5" fill="#207448" />
    </g>

    
    <rect x="1110" y="350" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="1310" y="394" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">quorum 3</text>

    
    <rect x="1110" y="445" width="400" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="1310" y="489" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">tolerates 2 failures</text>
  </g>

  
  <g id="note-panel">
    <rect x="60" y="710" width="1480" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(95, 726)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="16" y1="13" x2="16" y2="23" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <circle cx="16" cy="8" r="1.5" fill="#207448" />
    </g>
    <text x="815" y="751" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">quorum is the smallest majority of members that must agree before a write counts</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="820" width="1480" height="70" rx="10" fill="#207448" />
    <text x="800" y="864" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">use an odd number of members on fast disks</text>
  </g>
</svg>