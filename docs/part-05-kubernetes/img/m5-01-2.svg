<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Images: layers, content addressing and the OCI formats</title>
  <desc>Visual infographic showing OCI image tag resolution to image index, multi-architecture manifests, config blob, and content-addressed layers.</desc>

