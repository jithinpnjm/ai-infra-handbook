<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>ConfigMaps</title>
  <desc>Secret and config lifecycle with KMS and etcd, and RBAC authorization flow from subject to role</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-orange-start" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">ConfigMaps</text>

  
  <rect x="40" y="110" width="1520" height="435" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Secret &amp; Config Lifecycle</text>

  
  <rect x="70" y="175" width="500" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(320, 215)">
    <rect x="-25" y="-22" width="50" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="0" cy="0" r="3" fill="#207448" />
    <line x1="17" y1="0" x2="22" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="320" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Vault / Cloud Secret Mgr</text>

  
  <rect x="1030" y="175" width="500" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1280, 215)">
    <path d="M -24 -18 L -7 -18 L 0 -11 L 24 -11 A 4 4 0 0 1 28 -7 L 28 17 A 4 4 0 0 1 24 21 L -24 21 A 4 4 0 0 1 -28 17 L -28 -14 A 4 4 0 0 1 -24 -18 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <line x1="-12" y1="5" x2="12" y2="5" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1280" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod tmpfs Volume</text>
  <text x="1280" y="312" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">(/var/run/secrets, 0400)</text>

  
  <rect x="605" y="210" width="390" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">ESO / CSI / Vault Injector</text>
  <line x1="570" y1="270" x2="1030" y2="270" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="355" width="500" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(320, 395)">
    <circle cx="-12" cy="0" r="10" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="-2" y1="0" x2="22" y2="0" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="12" y1="0" x2="12" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="320" y="456" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">KMS v2 / EncryptionConfig</text>
  <text x="320" y="492" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(key-2 write, key-1 read)</text>

  
  <rect x="1030" y="355" width="500" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1280, 395)">
    <ellipse cx="0" cy="-10" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="-22" y1="-10" x2="-22" y2="14" stroke="#207448" stroke-width="3.5" />
    <line x1="22" y1="-10" x2="22" y2="14" stroke="#207448" stroke-width="3.5" />
    <path d="M -22 2 A 22 7 0 0 0 22 2" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M -22 14 A 22 7 0 0 0 22 14" fill="none" stroke="#207448" stroke-width="3.5" />
  </g>
  <text x="1280" y="456" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">etcd</text>
  <text x="1280" y="492" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">/registry/secrets</text>

  
  <rect x="665" y="390" width="270" height="40" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="800" y="418" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">k8s:enc:kms:v2</text>
  <line x1="570" y1="450" x2="1030" y2="450" stroke="#db8129" stroke-width="3.5" marker-start="url(#arrow-orange-start)" marker-end="url(#arrow-orange)" />

  
  <rect x="40" y="580" width="1520" height="380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">RBAC Authorization</text>

  
  <rect x="70" y="645" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(290, 695)">
    <circle cx="-8" cy="-10" r="10" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M -24 17 A 16 16 0 0 1 8 17" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="14" cy="-13" r="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 8 8 A 12 12 0 0 1 26 11" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="290" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Subject</text>
  <text x="290" y="812" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="290" dy="0">User / Group /</tspan>
    <tspan x="290" dy="32">ServiceAccount</tspan>
  </text>

  
  <line x1="510" y1="785" x2="580" y2="785" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="580" y="645" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(800, 695)">
    <rect x="-22" y="-7" width="26" height="14" rx="7" transform="rotate(-30)" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="-4" y="-7" width="26" height="14" rx="7" transform="rotate(-30)" fill="none" stroke="#207448" stroke-width="3.5" />
  </g>
  <text x="800" y="750" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">RoleBinding</tspan>
    <tspan x="800" dy="36">(Namespace)</tspan>
  </text>
  <text x="800" y="830" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">or ClusterRoleBinding</tspan>
    <tspan x="800" dy="32">(Cluster)</tspan>
  </text>

  
  <line x1="1020" y1="785" x2="1090" y2="785" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <rect x="1090" y="645" width="440" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1310, 695)">
    <path d="M -20 -17 L 0 -24 L 20 -17 C 20 3 0 19 0 23 C 0 19 -20 3 -20 -17 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M -10 -1 L -3 6 L 11 -8" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1310" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Role (Namespace)</text>
  <text x="1310" y="818" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1310" dy="0">or ClusterRole</tspan>
    <tspan x="1310" dy="32">(Cluster / Aggregated)</tspan>
  </text>
</svg>