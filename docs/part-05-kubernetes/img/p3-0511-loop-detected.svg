<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>CoreDNS Loop detected on systemd-resolved hosts</title>
  <desc>Infographic explaining the CoreDNS CrashLoopBackOff loop detection caused by forwarding DNS queries to systemd-resolved 127.0.0.53 stub resolver.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d32f2f"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">CoreDNS Loop detected on systemd-resolved hosts</text>

  
  <rect x="60" y="125" width="670" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="110" cy="175" r="24" fill="#207448"/>
  <text x="110" y="184" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="160" y="152" width="48" height="20" rx="4"/>
    <line x1="168" y1="162" x2="182" y2="162"/>
    <circle cx="198" cy="162" r="2.5" fill="#207448"/>
    <rect x="160" y="178" width="48" height="20" rx="4"/>
    <line x1="168" y1="188" x2="182" y2="188"/>
    <circle cx="198" cy="188" r="2.5" fill="#207448"/>
  </g>
  
  <text x="95" y="252" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>Node </tspan><tspan font-family="monospace">resolv.conf</tspan><tspan> points to</tspan>
  </text>
  <text x="95" y="294" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan font-family="monospace">127.0.0.53</tspan><tspan> (systemd-resolved stub)</tspan>
  </text>

  
  <line x1="730" y1="240" x2="870" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="870" y="125" width="670" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="920" cy="175" r="24" fill="#207448"/>
  <text x="920" y="184" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="998" cy="175" r="12"/>
    <path d="M 998 155 L 998 159 M 998 191 L 998 195 M 978 175 L 982 175 M 1014 175 L 1018 175 M 984 161 L 987 164 M 1009 186 L 1012 189 M 984 189 L 987 186 M 1009 164 L 1012 161" stroke-width="4.5"/>
  </g>
  
  <text x="905" y="240" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>CoreDNS </tspan><tspan font-family="monospace">forward . /etc/resolv.conf</tspan>
  </text>
  <text x="905" y="278" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>sends external queries to</tspan>
  </text>
  <text x="905" y="316" font-family="monospace" font-size="25" fill="#303a36">
    <tspan>127.0.0.53</tspan>
  </text>

  
  <line x1="1205" y1="355" x2="1205" y2="415" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="870" y="415" width="670" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="920" cy="465" r="24" fill="#207448"/>
  <text x="920" y="474" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1014 457 A 16 16 0 1 0 1014 473"/>
    <polyline points="1008,449 1014,457 1022,453"/>
  </g>
  
  <text x="905" y="542" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>the stub hands the question</tspan>
  </text>
  <text x="905" y="584" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>back to CoreDNS</tspan>
  </text>

  
  <line x1="870" y1="530" x2="730" y2="530" stroke="#d32f2f" stroke-width="4" marker-end="url(#arrow-red)"/>

  
  <rect x="60" y="415" width="670" height="230" rx="16" fill="#fdf2f2" stroke="#d32f2f" stroke-width="2.5"/>
  
  <circle cx="110" cy="465" r="24" fill="#d32f2f"/>
  <text x="110" y="474" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>
  
  <g stroke="#d32f2f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="188,445 212,485 164,485"/>
    <line x1="188" y1="458" x2="188" y2="471"/>
    <circle cx="188" cy="478" r="1.5" fill="#d32f2f" stroke="none"/>
  </g>
  
  <text x="95" y="530" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>loop plugin detects it and</tspan>
  </text>
  <text x="95" y="568" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>CoreDNS crashes with</tspan>
  </text>
  <text x="95" y="606" font-family="monospace" font-size="25" font-weight="bold" fill="#b91c1c">
    <tspan>Loop detected, CrashLoop</tspan>
  </text>

  
  <rect x="60" y="685" width="1480" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 136 742 C 131 738 123 739 118 744 C 114 748 113 753 115 757 L 105 767 C 103 769 103 773 105 775 L 110 780 C 112 782 116 782 118 780 L 128 770 C 132 772 137 771 141 767 C 146 762 147 754 143 749 L 136 756 L 130 750 Z"/>
  </g>
  
  <text x="180" y="750" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>set kubelet </tspan><tspan font-family="monospace">resolvConf: /run/systemd/resolve/resolv.conf</tspan>
  </text>
  <text x="180" y="792" font-family="sans-serif" font-size="25" fill="#303a36">
    <tspan>to the real upstream file, or </tspan><tspan font-family="monospace">forward . 10.x.x.x</tspan>
  </text>

  
  <rect x="60" y="870" width="1480" height="70" rx="12" fill="#207448"/>
  <text x="800" y="914" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">the question is handed to a resolver that hands it back, so it circles forever</text>
</svg>