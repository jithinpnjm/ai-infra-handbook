<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Node NotReady: confirm the cause before restarting</title>
  <desc>Infographic explaining Kubernetes Node NotReady diagnostics, control plane vs node checks, common causes, warning against premature reboots, and lab drills.</desc>

  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448" text-anchor="middle">Node NotReady: confirm the cause before restarting</text>

  
  <g id="left-half">
    <rect x="50" y="100" width="500" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(240, 135)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="120" height="90" rx="10" />
      <line x1="20" y1="30" x2="100" y2="30" />
      <circle cx="35" cy="60" r="6" fill="#207448" />
      <circle cx="60" cy="60" r="6" fill="#207448" />
      
      <path d="M -40 120 L 20 120 L 35 95 L 50 145 L 65 120 L 160 120" stroke="#db8129" stroke-width="4" />
    </g>

    
    <rect x="80" y="300" width="440" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="110" y="365" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Control plane view:</text>
    <text x="110" y="420" font-family="sans-serif" font-size="25px" fill="#303a36">the heartbeat stopped;</text>

    
    <line x1="300" y1="480" x2="300" y2="528" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)" />

    
    <rect x="80" y="540" width="440" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="110" y="620" font-family="monospace" font-size="25px" font-weight="bold" fill="#207448">kubectl describe node</text>
    <text x="110" y="685" font-family="sans-serif" font-size="25px" fill="#303a36">for reason and message</text>
  </g>

  
  <g id="right-half">
    <rect x="580" y="100" width="970" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <text x="615" y="145" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">On the node, in order:</text>

    
    <rect x="615" y="165" width="900" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="203" r="22" fill="#207448" />
    <text x="655" y="211" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="695" y="211" font-family="monospace" font-size="24px" fill="#303a36">systemctl status kubelet containerd</text>

    
    <rect x="615" y="255" width="900" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="293" r="22" fill="#207448" />
    <text x="655" y="301" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="695" y="301" font-family="monospace" font-size="24px" fill="#303a36">journalctl -u kubelet -n 200</text>

    
    <rect x="615" y="345" width="900" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="393" r="22" fill="#207448" />
    <text x="655" y="401" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="695" y="382" font-family="sans-serif" font-size="24px" fill="#303a36">disk use under <tspan font-family="monospace">/var/lib/kubelet</tspan></text>
    <text x="695" y="418" font-family="sans-serif" font-size="24px" fill="#303a36">and <tspan font-family="monospace">/var/lib/containerd</tspan></text>

    
    <rect x="615" y="455" width="900" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="493" r="22" fill="#207448" />
    <text x="655" y="501" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="695" y="501" font-family="monospace" font-size="24px" fill="#303a36">free -h</text>

    
    <rect x="615" y="545" width="900" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="583" r="22" fill="#207448" />
    <text x="655" y="591" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="695" y="591" font-family="monospace" font-size="24px" fill="#303a36">dmesg -T | tail</text>

    
    <rect x="615" y="635" width="900" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="655" cy="722" r="22" fill="#207448" />
    <text x="655" y="730" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="695" y="675" font-family="sans-serif" font-size="24px" fill="#303a36">kubelet client certificate expiry with</text>
    <text x="695" y="718" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">openssl x509 -in</text>
    <text x="695" y="760" font-family="monospace" font-size="24px" fill="#303a36">/var/lib/kubelet/pki/kubelet client cert</text>
  </g>

  
  <g id="causes-chips">
    
    <rect x="50" y="865" width="390" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="245" y="900" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">kubelet certificate expiry</text>

    <rect x="520" y="865" width="250" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="645" y="900" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">runtime hang</text>

    <rect x="850" y="865" width="230" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="965" y="900" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">full disk</text>

    <rect x="1160" y="865" width="390" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1355" y="900" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">OOM of system daemons</text>

    
    <rect x="310" y="935" width="260" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="440" y="970" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">NIC down</text>

    <rect x="630" y="935" width="260" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="760" y="970" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">time skew</text>

    <rect x="950" y="935" width="340" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1120" y="970" font-family="sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">firewall change</text>
  </g>

  
  <g id="warning-box">
    <rect x="50" y="1015" width="1500" height="135" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    
    <g transform="translate(80, 1047)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 35 5 L 68 65 L 2 65 Z" />
      <line x1="35" y1="28" x2="35" y2="44" stroke-width="5" />
      <circle cx="35" cy="54" r="2.5" fill="#db8129" stroke="none" />
    </g>

    
    <text x="175" y="1065" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">a restart can make the node look healthy for a while and the cause returns on the next busy hour;</text>
    <text x="175" y="1110" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#db8129">confirm each suspect first</text>
  </g>

  
  <g id="lab-drills">
    <rect x="50" y="1175" width="1500" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(80, 1205)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 5 L 42 5" />
      <path d="M 31 5 L 31 22 L 12 58 A 5 5 0 0 0 16 65 L 54 65 A 5 5 0 0 0 58 58 L 39 22 L 39 5" />
      <line x1="20" y1="52" x2="50" y2="52" />
    </g>

    
    <text x="175" y="1225" font-family="monospace" font-size="24px" fill="#303a36">fill the disk, kill containerd, expire a kubelet client certificate,</text>
    <text x="175" y="1268" font-family="monospace" font-size="24px" fill="#303a36">block API access with iptables, skew the clock</text>
  </g>
</svg>