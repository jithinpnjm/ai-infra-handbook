<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Node NotReady: confirm the cause before restarting</title>
  <desc>Visual guide comparing control plane heartbeat failure with ordered node diagnostics, usual root causes, warning on blind restarts, and lab drill scenarios.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Node NotReady: confirm the cause before restarting</text>

  
  <g transform="translate(40, 95)">
    <rect width="1520" height="85" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 45 62 L 65 24 L 85 62 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="65" y1="36" x2="65" y2="48" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="65" cy="55" r="2" fill="#db8129"/>
    
    <text x="105" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="105" dy="0">a restart can make the node look healthy for a while and the cause returns on the next busy hour; </tspan>
      <tspan x="105" dy="32" fill="#db8129">confirm each suspect first</tspan>
    </text>
  </g>

  
  
  <g transform="translate(40, 200)">
    <rect width="540" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(24, 24)">
      <rect x="4" y="6" width="48" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="20" x2="44" y2="20" stroke="#207448" stroke-width="3"/>
      <circle cx="14" cy="36" r="3" fill="#207448"/>
      <circle cx="26" cy="36" r="3" fill="#207448"/>
      <circle cx="38" cy="36" r="3" fill="#207448"/>
    </g>

    
    <text x="96" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Control plane view</text>

    
    <g transform="translate(24, 95)">
      <rect width="492" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="24" y="45" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">: the heartbeat stopped;</text>
      
      
      <path d="M 30 115 L 120 115 L 140 85 L 160 145 L 180 100 L 200 115 L 260 115" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="260" y1="115" x2="460" y2="115" stroke="#207448" stroke-width="4" stroke-dasharray="10 8"/>
      <circle cx="460" cy="115" r="6" fill="#207448"/>
    </g>

    
    <g transform="translate(24, 300)">
      <rect width="492" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      
      <rect width="492" height="42" rx="12" fill="#207448"/>
      <circle cx="24" cy="21" r="5" fill="#ffffff"/>
      <circle cx="42" cy="21" r="5" fill="#ffffff"/>
      <circle cx="60" cy="21" r="5" fill="#ffffff"/>

      
      <text x="24" y="105" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubectl describe node</text>
      <text x="24" y="165" font-family="sans-serif" font-size="24" fill="#303a36">for reason and message</text>
    </g>
  </g>

  
  <g transform="translate(610, 200)">
    <rect width="950" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(24, 20)">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3"/>
      <circle cx="16" cy="18" r="3" fill="#207448"/>
      <circle cx="28" cy="18" r="3" fill="#207448"/>
      <line x1="16" y1="38" x2="40" y2="38" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="96" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">On the node, in order:</text>

    
    <g transform="translate(24, 75)">
      <rect width="902" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="20" fill="#207448"/>
      <text x="36" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      
      <g transform="translate(72, 17)">
        <circle cx="16" cy="16" r="10" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="16" y1="2" x2="16" y2="7" stroke="#207448" stroke-width="3"/>
        <line x1="16" y1="25" x2="16" y2="30" stroke="#207448" stroke-width="3"/>
        <line x1="2" y1="16" x2="7" y2="16" stroke="#207448" stroke-width="3"/>
        <line x1="25" y1="16" x2="30" y2="16" stroke="#207448" stroke-width="3"/>
      </g>
      <text x="125" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">systemctl status kubelet containerd</text>
    </g>

    
    <g transform="translate(24, 153)">
      <rect width="902" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="20" fill="#207448"/>
      <text x="36" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      
      <g transform="translate(72, 17)">
        <rect x="6" y="4" width="20" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="10" y1="10" x2="22" y2="10" stroke="#207448" stroke-width="2"/>
        <line x1="10" y1="16" x2="22" y2="16" stroke="#207448" stroke-width="2"/>
        <line x1="10" y1="22" x2="18" y2="22" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="125" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">journalctl -u kubelet -n 200</text>
    </g>

    
    <g transform="translate(24, 231)">
      <rect width="902" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="20" fill="#207448"/>
      <text x="36" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(72, 17)">
        <ellipse cx="16" cy="9" rx="12" ry="5" fill="none" stroke="#207448" stroke-width="2.5"/>
        <path d="M 4 9 L 4 23 A 12 5 0 0 0 28 23 L 28 9" fill="none" stroke="#207448" stroke-width="2.5"/>
      </g>
      <text x="125" y="42" font-family="sans-serif" font-size="24" fill="#303a36">disk use under <tspan font-family="monospace" font-weight="bold">/var/lib/kubelet</tspan> and <tspan font-family="monospace" font-weight="bold">/var/lib/containerd</tspan></text>
    </g>

    
    <g transform="translate(24, 309)">
      <rect width="902" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="20" fill="#207448"/>
      <text x="36" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(72, 17)">
        <rect x="4" y="8" width="24" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="8" y1="4" x2="8" y2="8" stroke="#207448" stroke-width="2"/>
        <line x1="16" y1="4" x2="16" y2="8" stroke="#207448" stroke-width="2"/>
        <line x1="24" y1="4" x2="24" y2="8" stroke="#207448" stroke-width="2"/>
        <line x1="8" y1="24" x2="8" y2="28" stroke="#207448" stroke-width="2"/>
        <line x1="16" y1="24" x2="16" y2="28" stroke="#207448" stroke-width="2"/>
        <line x1="24" y1="24" x2="24" y2="28" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="125" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">free -h</text>
    </g>

    
    <g transform="translate(24, 387)">
      <rect width="902" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="33" r="20" fill="#207448"/>
      <text x="36" y="41" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
      
      <g transform="translate(72, 17)">
        <rect x="4" y="6" width="24" height="20" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
        <path d="M 9 13 L 14 16 L 9 19" fill="none" stroke="#207448" stroke-width="2"/>
        <line x1="16" y1="21" x2="22" y2="21" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="125" y="42" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">dmesg -T | tail</text>
    </g>

    
    <g transform="translate(24, 465)">
      <rect width="902" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="36" cy="42" r="20" fill="#207448"/>
      <text x="36" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
      
      <g transform="translate(72, 26)">
        <rect x="4" y="4" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5"/>
        <circle cx="16" cy="14" r="5" fill="none" stroke="#207448" stroke-width="2"/>
        <path d="M 13 22 L 16 19 L 19 22" fill="none" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="125" y="36" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="125" dy="0">kubelet client certificate expiry with </tspan>
        <tspan x="125" dy="32" font-family="monospace" font-weight="bold" fill="#207448">openssl x509 -in /var/lib/kubelet/pki/kubelet client cert</tspan>
      </text>
    </g>
  </g>

  
  
  <g transform="translate(40, 795)">
    
    <g transform="translate(20, 0)">
      <rect width="400" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 15)">
        <rect x="2" y="2" width="22" height="26" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
        <circle cx="13" cy="13" r="4" fill="none" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">kubelet certificate expiry</text>
    </g>

    
    <g transform="translate(440, 0)">
      <rect width="240" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 16)">
        <rect x="4" y="4" width="7" height="20" rx="2" fill="#207448"/>
        <rect x="17" y="4" width="7" height="20" rx="2" fill="#207448"/>
      </g>
      <text x="60" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">runtime hang</text>
    </g>

    
    <g transform="translate(700, 0)">
      <rect width="210" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 16)">
        <ellipse cx="14" cy="7" rx="11" ry="4" fill="none" stroke="#207448" stroke-width="2.5"/>
        <path d="M 3 7 L 3 21 A 11 4 0 0 0 25 21 L 25 7" fill="none" stroke="#207448" stroke-width="2.5"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">full disk</text>
    </g>

    
    <g transform="translate(930, 0)">
      <rect width="420" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 16)">
        <rect x="4" y="6" width="20" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="8" y1="2" x2="8" y2="6" stroke="#207448" stroke-width="2"/>
        <line x1="14" y1="2" x2="14" y2="6" stroke="#207448" stroke-width="2"/>
        <line x1="20" y1="2" x2="20" y2="6" stroke="#207448" stroke-width="2"/>
        <line x1="8" y1="22" x2="8" y2="26" stroke="#207448" stroke-width="2"/>
        <line x1="14" y1="22" x2="14" y2="26" stroke="#207448" stroke-width="2"/>
        <line x1="20" y1="22" x2="20" y2="26" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">OOM of system daemons</text>
    </g>
  </g>

  
  <g transform="translate(40, 875)">
    
    <g transform="translate(240, 0)">
      <rect width="210" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 16)">
        <rect x="4" y="6" width="20" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="14" y1="22" x2="14" y2="26" stroke="#207448" stroke-width="2"/>
        <line x1="8" y1="26" x2="20" y2="26" stroke="#207448" stroke-width="2"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NIC down</text>
    </g>

    
    <g transform="translate(480, 0)">
      <rect width="220" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 16)">
        <circle cx="14" cy="14" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
        <polyline points="14,6 14,14 20,14" fill="none" stroke="#207448" stroke-width="2.5"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">time skew</text>
    </g>

    
    <g transform="translate(730, 0)">
      <rect width="280" height="60" rx="30" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(22, 15)">
        <path d="M 14 3 L 4 7 L 4 15 C 4 22 14 27 14 27 C 14 27 24 22 24 15 L 24 7 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
      </g>
      <text x="62" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">firewall change</text>
    </g>
  </g>

  
  <g transform="translate(40, 965)">
    <rect width="1520" height="190" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(30, 25)">
      <path d="M 22 6 L 34 6 M 28 6 L 28 20 L 10 48 C 8 52 12 56 16 56 L 40 56 C 44 56 48 52 46 48 L 28 20" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="16" y1="42" x2="40" y2="42" stroke="#207448" stroke-width="3"/>
    </g>

    
    <text x="110" y="60" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Lab drills:</text>
    
    <text x="110" y="112" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">fill the disk, kill containerd, expire a kubelet client certificate,</tspan>
      <tspan x="110" dy="42">block API access with iptables, skew the clock</tspan>
    </text>
  </g>
</svg>