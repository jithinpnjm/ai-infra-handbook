<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Capacity minus reservations gives Allocatable</title>
  <desc>Visual explanation showing how Kubernetes Node Allocatable is calculated by subtracting kube-reserved, system-reserved, and eviction-threshold from Capacity.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Capacity minus reservations gives Allocatable</text>

  
  <rect x="45" y="125" width="1510" height="325" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>

  
  <g transform="translate(65, 145)">
    <rect width="235" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(117.5, 60)">
      <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
      <rect x="-13" y="-13" width="26" height="26" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M-9 -24 v-6 M0 -24 v-6 M9 -24 v-6 M-9 24 v6 M0 24 v6 M9 24 v6 M-24 -9 h-6 M-24 0 h-6 M-24 9 h-6 M24 -9 h6 M24 0 h6 M24 9 h6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <text x="117.5" y="145" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Capacity</text>
    <text x="117.5" y="195" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="117.5" dy="0">the full</tspan>
      <tspan x="117.5" dy="32">hardware size</tspan>
    </text>
  </g>

  
  <g transform="translate(340, 145)">
    <rect width="270" height="285" rx="12" fill="#e2e8e5" stroke="#7a8c82" stroke-width="3"/>
    
    <g transform="translate(135, 60)">
      <circle cx="0" cy="0" r="18" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
      <circle cx="0" cy="0" r="7" fill="#207448"/>
      <path d="M0 -25 v7 M0 18 v7 M-25 0 h7 M18 0 h7 M-18 -18 l5 5 M13 13 l5 5 M-18 18 l5 -5 M13 -13 l5 -5" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="135" y="145" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">kube-reserved</text>
    <text x="135" y="195" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">(kubelet and</tspan>
      <tspan x="135" dy="32">containerd)</tspan>
    </text>
  </g>

  
  <line x1="610" y1="287" x2="648" y2="287" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g transform="translate(650, 145)">
    <rect width="310" height="285" rx="12" fill="#e2e8e5" stroke="#7a8c82" stroke-width="3"/>
    
    <g transform="translate(155, 60)">
      <path d="M0 -24 L22 -15 C22 13 0 26 0 26 C0 26 -22 13 -22 -15 Z" fill="#f5f8f5" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-8 0 l6 6 l12 -12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="155" y="145" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">system-reserved</text>
    <text x="155" y="195" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="155" dy="0">(sshd, systemd,</tspan>
      <tspan x="155" dy="32">kernel daemons)</tspan>
    </text>
  </g>

  
  <line x1="960" y1="287" x2="998" y2="287" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g transform="translate(1000, 145)">
    <rect width="235" height="285" rx="12" fill="#e2e8e5" stroke="#7a8c82" stroke-width="3"/>
    
    <g transform="translate(117.5, 60)">
      <ellipse cx="0" cy="-14" rx="22" ry="8" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
      <path d="M-22 -14 v28 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8 v-28" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M-22 2 c0 4.4 9.8 8 22 8 s22 -3.6 22 -8" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="4 3"/>
      <path d="M28 2 h-8" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <text x="117.5" y="155" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="117.5" dy="0">eviction-</tspan>
      <tspan x="117.5" dy="38">threshold</tspan>
    </text>
  </g>

  
  <g transform="translate(1275, 145)">
    <rect width="260" height="285" rx="12" fill="#d8eadc" stroke="#207448" stroke-width="4"/>
    
    <g transform="translate(130, 60)">
      <rect x="-24" y="-21" width="48" height="42" rx="5" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <line x1="-24" y1="-9" x2="24" y2="-9" stroke="#207448" stroke-width="3"/>
      <circle cx="-16" cy="-15" r="2" fill="#207448"/>
      <circle cx="-10" cy="-15" r="2" fill="#207448"/>
      <circle cx="-4" cy="-15" r="2" fill="#207448"/>
      <rect x="-16" y="-3" width="13" height="15" rx="2" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <rect x="3" y="-3" width="13" height="15" rx="2" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    </g>
    
    <text x="130" y="145" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Allocatable</text>
    <text x="130" y="188" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">the part the</tspan>
      <tspan x="130" dy="30">scheduler can</tspan>
      <tspan x="130" dy="30">hand to pods</tspan>
    </text>
  </g>

  
  <g transform="translate(45, 480)">
    <rect width="1510" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="755" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="bold" fill="#303a36">Allocatable = Capacity - kube-reserved - system-reserved - eviction-threshold</text>
  </g>

  
  <g transform="translate(45, 580)">
    <rect width="1510" height="120" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    <text x="755" y="52" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#303a36">
      <tspan x="755" dy="0">without the reservations, pods can take all of the host CPU</tspan>
      <tspan x="755" dy="36">and memory, and the node agent starves</tspan>
    </text>
  </g>

  
  <g transform="translate(45, 730)">
    <rect width="1510" height="95" rx="12" fill="#207448"/>
    <text x="755" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Capacity is the dining room, Allocatable is the seats you sell</text>
  </g>
</svg>