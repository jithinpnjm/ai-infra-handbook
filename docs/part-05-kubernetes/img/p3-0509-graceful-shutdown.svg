<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Graceful node shutdown with a 120 second budget</title>
  <desc>Visual infographic explaining Kubernetes graceful node shutdown timeline, inhibitor locks, and pod termination stages.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="60" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Graceful node shutdown with a 120 second budget</text>

  
  <g id="step-1">
    <rect x="60" y="105" width="670" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="95" cy="140" r="24" fill="#207448" />
    <text x="95" y="148" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <text x="135" y="150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Start</text>

    
    <g transform="translate(225, 112)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 42 28 A 18 18 0 1 1 20 14" />
      <polyline points="20 4 20 16 32 16" />
      <line x1="28" y1="20" x2="28" y2="34" />
    </g>

    
    <text x="85" y="195" font-family="sans-serif" font-size="24" fill="#303a36">operator or autoscaler runs</text>
    <text x="85" y="228" font-size="24" fill="#303a36">
      <tspan font-family="monospace">systemctl reboot, poweroff</tspan>
      <tspan font-family="sans-serif"> or a</tspan>
    </text>
    <text x="85" y="261" font-family="sans-serif" font-size="24" fill="#303a36">spot termination signal</text>
  </g>

  
  <line x1="730" y1="195" x2="758" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="step-2">
    <rect x="760" y="105" width="780" height="180" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="795" cy="140" r="24" fill="#207448" />
    <text x="795" y="148" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <g transform="translate(835, 112)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 24 V 16 A 12 12 0 0 1 36 16 V 24" />
      <rect x="6" y="24" width="36" height="26" rx="4" />
      <circle cx="24" cy="35" r="3" fill="#207448" />
      <line x1="24" y1="38" x2="24" y2="44" />
    </g>

    
    <text x="785" y="195" font-family="sans-serif" font-size="24" fill="#303a36">systemd delays shutdown up to 120 s because the</text>
    <text x="785" y="228" font-family="sans-serif" font-size="24" fill="#303a36">kubelet holds a delay inhibitor lock</text>
    <text x="785" y="261" font-family="monospace" font-size="24" fill="#303a36">(systemd-inhibit --list)</text>
  </g>

  
  <line x1="870" y1="285" x2="870" y2="373" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="timeline-container">
    <rect x="60" y="315" width="1480" height="335" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="85" y="352" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline from 0 to 120 s</text>

    
    <g id="stage-1">
      <rect x="85" y="375" width="895" height="255" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <circle cx="120" cy="415" r="24" fill="#207448" />
      <text x="120" y="423" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

      
      <text x="155" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Stage 1 (0 to 90 s, which is</text>
      <text x="155" y="445" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">shutdownGracePeriod 120s minus 30s)</text>

      
      <g transform="translate(895, 390)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="22" />
        <polyline points="28 14 28 28 40 28" />
      </g>

      
      <text x="105" y="490" font-family="sans-serif" font-size="24" fill="#303a36">node marked not-ready with a Shutdown condition;</text>
      <text x="105" y="528" font-family="sans-serif" font-size="24" fill="#303a36">
        regular pods get <tspan font-family="monospace">preStop</tspan> and <tspan font-family="monospace">SIGTERM</tspan> so training
      </text>

      
      <rect x="98" y="550" width="375" height="38" rx="6" fill="#db8129" fill-opacity="0.12" stroke="#db8129" stroke-width="2" />
      <text x="108" y="577" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">jobs flush a final checkpoint</text>
    </g>

    
    <line x1="980" y1="502" x2="1013" y2="502" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <g id="stage-2">
      <rect x="1015" y="375" width="500" height="255" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <circle cx="1050" cy="415" r="24" fill="#207448" />
      <text x="1050" y="423" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

      
      <text x="1085" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Stage 2 (last 30 s,</text>
      <text x="1035" y="448" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">shutdownGracePeriodCriticalPods)</text>

      
      <g transform="translate(1440, 390)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 12 L 28 4 L 50 12 V 32 C 50 44 28 52 28 52 C 28 52 6 44 6 32 Z" />
        <polyline points="18 30 25 36 38 22" />
      </g>

      
      <text x="1035" y="490" font-family="sans-serif" font-size="24" fill="#303a36">system-node-critical and</text>
      <text x="1035" y="526" font-family="sans-serif" font-size="24" fill="#303a36">system-cluster-critical pods</text>
      <text x="1035" y="562" font-family="sans-serif" font-size="24" fill="#303a36">(CNI, CSI, storage flushers)</text>
      <text x="1035" y="598" font-family="sans-serif" font-size="24" fill="#303a36">terminated</text>
    </g>
  </g>

  
  <line x1="1130" y1="650" x2="1130" y2="673" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="step-5">
    <rect x="350" y="675" width="900" height="145" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="390" cy="720" r="24" fill="#207448" />
    <text x="390" y="728" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    
    <text x="430" y="728" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">End</text>

    
    <g transform="translate(500, 700)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 18 A 18 18 0 1 0 38 18" />
      <line x1="23" y1="4" x2="23" y2="22" />
    </g>

    
    <text x="430" y="768" font-family="sans-serif" font-size="24" fill="#303a36">kubelet releases the inhibitor lock,</text>
    <text x="430" y="802" font-family="sans-serif" font-size="24" fill="#303a36">kernel powers off</text>
  </g>

  
  <g id="side-notes">
    <text x="60" y="868" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Side note:</text>

    
    <g id="side-note-1">
      <rect x="60" y="890" width="710" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(695, 905)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="24" rx="4" />
        <circle cx="16" cy="20" r="2" fill="#207448" />
        <line x1="26" y1="20" x2="40" y2="20" />
        <line x1="16" y1="38" x2="38" y2="38" />
        <line x1="27" y1="32" x2="27" y2="44" />
      </g>

      <text x="85" y="935" font-family="sans-serif" font-size="24" fill="#303a36">non-graceful shutdown: after confirming</text>
      <text x="85" y="975" font-family="sans-serif" font-size="24" fill="#303a36">the node is down apply taint</text>
      <text x="85" y="1020" font-family="monospace" font-size="24" fill="#303a36">node.kubernetes.io/out-of-service</text>
      <text x="85" y="1065" font-family="sans-serif" font-size="24" fill="#303a36">so StatefulSet pods and volumes can move</text>
    </g>

    
    <g id="side-note-2">
      <rect x="790" y="890" width="750" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <g transform="translate(1460, 905)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="36" height="36" rx="4" />
        <rect x="18" y="18" width="16" height="16" />
        <line x1="14" y1="2" x2="14" y2="8" /><line x1="26" y1="2" x2="26" y2="8" /><line x1="38" y1="2" x2="38" y2="8" />
        <line x1="14" y1="44" x2="14" y2="50" /><line x1="26" y1="44" x2="26" y2="50" /><line x1="38" y1="44" x2="38" y2="50" />
      </g>

      <text x="815" y="935" font-family="sans-serif" font-size="24" fill="#303a36">a kubelet restart does not restart containers;</text>
      <text x="815" y="980" font-size="24" fill="#303a36">
        <tspan font-family="sans-serif">checkpoints persist: </tspan>
        <tspan font-family="monospace">cpu_manager_state</tspan><tspan font-family="sans-serif">,</tspan>
      </text>
      <text x="815" y="1025" font-family="sans-serif" font-size="24" fill="#303a36">device checkpoint, memory manager state</text>
    </g>
  </g>
</svg>