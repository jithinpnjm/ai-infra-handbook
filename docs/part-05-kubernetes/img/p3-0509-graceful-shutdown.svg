<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Graceful node shutdown with a 120 second budget</title>
  <desc>Visual explanation of the Kubernetes 120-second graceful node shutdown timeline, inhibitor locks, and pod eviction stages.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Graceful node shutdown with a 120 second budget
  </text>

  
  <rect x="620" y="82" width="360" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="111" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    Timeline from 0 to 120 s.
  </text>

  
  
  <rect x="70" y="145" width="690" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="190" r="22" fill="#207448" />
  <text x="115" y="198" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  
  <circle cx="170" cy="190" r="16" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="75 25" />
  <line x1="170" y1="170" x2="170" y2="190" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="210" y="197" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Start:</text>
  <text x="100" y="245" font-family="sans-serif" font-size="24" fill="#303a36">
    operator or autoscaler runs <tspan font-family="monospace">systemctl reboot</tspan>,
  </text>
  <text x="100" y="278" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan font-family="monospace">poweroff</tspan> or a spot termination signal
  </text>

  
  <line x1="760" y1="225" x2="830" y2="225" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="840" y="145" width="690" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="885" cy="190" r="22" fill="#207448" />
  <text x="885" y="198" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

  
  <rect x="930" y="184" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 936 184 V 175 A 8 8 0 0 1 952 175 V 184" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="870" y="245" font-family="sans-serif" font-size="24" fill="#303a36">
    systemd delays shutdown up to 120 s because the kubelet
  </text>
  <text x="870" y="278" font-family="sans-serif" font-size="24" fill="#303a36">
    holds a delay inhibitor lock (<tspan font-family="monospace">systemd-inhibit --list</tspan>)
  </text>

  
  <line x1="800" y1="305" x2="800" y2="330" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="70" y="340" width="1070" height="42" rx="8" fill="#207448" />
  <text x="90" y="369" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">0 s</text>
  <text x="590" y="369" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
    Stage 1: Regular pod termination (90 s budget)
  </text>
  <text x="1120" y="369" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">90 s</text>

  
  <rect x="1155" y="340" width="375" height="42" rx="8" fill="#db8129" />
  <text x="1175" y="369" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">90 s</text>
  <text x="1345" y="369" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Stage 2 (30 s)</text>
  <text x="1515" y="369" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">120 s</text>

  
  <rect x="70" y="405" width="1460" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="445" r="22" fill="#207448" />
  <text x="115" y="453" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

  
  <text x="155" y="453" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
    Stage 1 (0 to 90 s, which is shutdownGracePeriod 120s minus 30s):
  </text>

  
  <text x="115" y="500" font-family="sans-serif" font-size="24" fill="#303a36">
    node marked not-ready with a Shutdown condition; regular pods get preStop and SIGTERM
  </text>
  <text x="115" y="535" font-family="sans-serif" font-size="24" fill="#303a36">
    so training jobs flush a final checkpoint
  </text>

  
  <line x1="800" y1="580" x2="800" y2="602" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="70" y="610" width="1460" height="175" rx="14" fill="#fff9f5" stroke="#db8129" stroke-width="3" />
  
  
  <circle cx="115" cy="650" r="22" fill="#db8129" />
  <text x="115" y="658" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>

  
  <path d="M 160 636 L 175 644 V 658 C 175 667 160 673 160 673 C 160 673 145 667 145 658 V 644 Z" fill="none" stroke="#db8129" stroke-width="3" />

  
  <text x="195" y="658" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">
    Stage 2 (last 30 s, shutdownGracePeriodCriticalPods):
  </text>

  
  <text x="115" y="705" font-family="sans-serif" font-size="24" fill="#303a36">
    system-node-critical and system-cluster-critical pods (CNI, CSI, storage flushers) terminated
  </text>

  
  <line x1="800" y1="785" x2="800" y2="807" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="70" y="815" width="1460" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="870" r="22" fill="#207448" />
  <text x="115" y="878" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>

  
  <circle cx="1470" cy="870" r="18" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="80 30" />
  <line x1="1470" y1="850" x2="1470" y2="870" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="160" y="878" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">End:</text>
  <text x="235" y="878" font-family="sans-serif" font-size="26" fill="#303a36">
    kubelet releases the inhibitor lock, kernel powers off
  </text>

  
  
  <rect x="70" y="955" width="710" height="380" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="1005" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="128" y1="1015" x2="145" y2="1030" stroke="#207448" stroke-width="4" />
  <circle cx="155" cy="1035" r="10" fill="none" stroke="#207448" stroke-width="3" />

  <text x="180" y="1013" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Side note:</text>
  
  <text x="100" y="1065" font-family="sans-serif" font-size="24" fill="#303a36">
    non-graceful shutdown: after confirming
  </text>
  <text x="100" y="1105" font-family="sans-serif" font-size="24" fill="#303a36">
    the node is down apply taint
  </text>
  <text x="100" y="1145" font-family="monospace" font-size="24" fill="#207448">
    node.kubernetes.io/out-of-service
  </text>
  <text x="100" y="1185" font-family="sans-serif" font-size="24" fill="#303a36">
    so StatefulSet pods and volumes can move
  </text>

  
  <rect x="820" y="955" width="710" height="380" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="860" y="990" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="868" y1="982" x2="868" y2="990" stroke="#207448" stroke-width="3" />
  <line x1="884" y1="982" x2="884" y2="990" stroke="#207448" stroke-width="3" />
  <line x1="868" y1="1022" x2="868" y2="1030" stroke="#207448" stroke-width="3" />
  <line x1="884" y1="1022" x2="884" y2="1030" stroke="#207448" stroke-width="3" />

  <text x="915" y="1013" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Side note:</text>

  <text x="850" y="1065" font-family="sans-serif" font-size="24" fill="#303a36">
    a kubelet restart does not restart containers;
  </text>
  <text x="850" y="1105" font-family="sans-serif" font-size="24" fill="#303a36">
    checkpoints persist:
  </text>
  <text x="850" y="1145" font-family="monospace" font-size="24" fill="#207448">
    cpu_manager_state,
  </text>
  <text x="850" y="1185" font-family="monospace" font-size="24" fill="#207448">
    device checkpoint, memory manager state
  </text>
</svg>