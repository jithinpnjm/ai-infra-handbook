<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Cluster Proportional Autoscaler: scale with the cluster, not the load</title>
  <desc>Visual explanation of the Cluster Proportional Autoscaler comparing Linear and Ladder methods with use case and decision guidance.</desc>

  
  <rect width="1600" height="1150" fill="#f5f8f5" />

  
  <g id="title-group">
    <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Cluster Proportional Autoscaler:</text>
    <text x="800" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">scale with the cluster, not the load</text>
  </g>

  
  <g id="common-frame">
    <rect x="40" y="170" width="1520" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="65" y="195" width="1470" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

    
    <g transform="translate(90, 240)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="0" width="48" height="14" rx="3" />
      <circle cx="13" cy="7" r="1.5" fill="#207448" />
      <line x1="22" y1="7" x2="36" y2="7" />
      <rect x="4" y="20" width="48" height="14" rx="3" />
      <circle cx="13" cy="27" r="1.5" fill="#207448" />
      <line x1="22" y1="27" x2="36" y2="27" />
      <rect x="4" y="40" width="48" height="14" rx="3" />
      <circle cx="13" cy="47" r="1.5" fill="#207448" />
      <line x1="22" y1="47" x2="36" y2="47" />
    </g>

    
    <text x="175" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="175" dy="0">scales replicas by the number of nodes or cores; reads no metrics API; no Metrics Server</tspan>
      <tspan x="175" dy="36">or Prometheus Adapter; configured by flags naming the target workload plus a <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace">ConfigMap</tspan></tspan>
      <tspan x="175" dy="36">holding the scaling parameters, not a Kubernetes resource</tspan>
    </text>

    
    <g id="panel-linear">
      <rect x="65" y="365" width="720" height="360" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

      
      <g transform="translate(95, 390)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="4" y1="52" x2="52" y2="52" />
        <line x1="4" y1="4" x2="4" y2="52" />
        <line x1="8" y1="48" x2="48" y2="8" />
      </g>
      <text x="170" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Linear method</text>

      
      <g id="linear-plot">
        <rect x="95" y="465" width="660" height="150" rx="8" fill="#f5f8f5" />
        
        <line x1="145" y1="565" x2="715" y2="565" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="145" y1="515" x2="715" y2="515" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="287" y1="485" x2="287" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="430" y1="485" x2="430" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="572" y1="485" x2="572" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        
        <line x1="145" y1="595" x2="715" y2="595" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="145" y1="485" x2="145" y2="595" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        
        <line x1="160" y1="585" x2="695" y2="495" stroke="#207448" stroke-width="5" stroke-linecap="round" />
        
        <circle cx="160" cy="585" r="5" fill="#207448" />
        <circle cx="293" cy="562" r="5" fill="#207448" />
        <circle cx="427" cy="540" r="5" fill="#207448" />
        <circle cx="561" cy="517" r="5" fill="#207448" />
        <circle cx="695" cy="495" r="5" fill="#207448" />
      </g>

      
      <text x="95" y="658" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="95" dy="0">replicas rise in direct proportion to</tspan>
        <tspan x="95" dy="36">nodes or cores (a straight line)</tspan>
      </text>
    </g>

    
    <g id="panel-ladder">
      <rect x="815" y="365" width="720" height="360" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

      
      <g transform="translate(845, 390)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="4" y1="52" x2="52" y2="52" />
        <line x1="4" y1="4" x2="4" y2="52" />
        <path d="M 8 48 H 20 V 34 H 34 V 20 H 48" />
      </g>
      <text x="920" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Ladder method</text>

      
      <g id="ladder-plot">
        <rect x="845" y="465" width="660" height="150" rx="8" fill="#f5f8f5" />
        
        <line x1="895" y1="565" x2="1465" y2="565" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="895" y1="515" x2="1465" y2="515" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="1037" y1="485" x2="1037" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="1180" y1="485" x2="1180" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        <line x1="1322" y1="485" x2="1322" y2="595" stroke="#207448" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5" />
        
        <line x1="895" y1="595" x2="1465" y2="595" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="895" y1="485" x2="895" y2="595" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        
        <path d="M 910 580 H 1037 V 545 H 1180 V 510 H 1322 V 475 H 1445" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        
        <circle cx="1037" cy="545" r="5" fill="#207448" />
        <circle cx="1180" cy="510" r="5" fill="#207448" />
        <circle cx="1322" cy="475" r="5" fill="#207448" />
      </g>

      
      <text x="845" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
        <tspan x="845" dy="0">a step function sets a ratio of</tspan>
        <tspan x="845" dy="32">nodes to replicas or cores to replicas</tspan>
        <tspan x="845" dy="32">(a staircase)</tspan>
      </text>
    </g>
  </g>

  
  <g id="use-case">
    <rect x="40" y="775" width="1520" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(72, 814)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="24" />
      <ellipse cx="28" cy="28" rx="24" ry="10" />
      <line x1="28" y1="4" x2="28" y2="52" />
      <line x1="4" y1="28" x2="52" y2="28" />
    </g>

    
    <text x="155" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="155" dy="0">cluster DNS: demand at 5 nodes differs a lot from demand at 300 nodes;</tspan>
      <tspan x="155" dy="38">a proportional rule keeps the service sized to match</tspan>
    </text>
  </g>

  
  <g id="decision-note">
    <rect x="40" y="935" width="1520" height="175" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <rect x="40" y="935" width="12" height="175" rx="4" fill="#db8129" />

    
    <g transform="translate(75, 992)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 4 L 48 14 V 32 C 48 46 28 54 28 54 C 28 54 8 46 8 32 V 14 Z" />
      <line x1="28" y1="18" x2="28" y2="34" stroke-width="4" />
      <circle cx="28" cy="42" r="2" fill="#db8129" stroke="none" />
    </g>

    
    <text x="155" y="983" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="155" dy="0">narrow use case for platform services; if HPAs and metrics APIs are already in place</tspan>
      <tspan x="155" dy="38">check whether an HPA fits better; a <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace">CronJob</tspan> that updates the replica count is also</tspan>
      <tspan x="155" dy="38">a valid custom autoscaler, but write down what happens when it fails</tspan>
    </text>
  </g>
</svg>