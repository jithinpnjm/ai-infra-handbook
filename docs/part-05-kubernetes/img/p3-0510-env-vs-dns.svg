<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Environment variables versus DNS for finding a Service</title>
  <desc>Visual comparison between discovering Kubernetes Services via environment variables versus CoreDNS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Environment variables versus DNS</text>
  <text x="800" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">for finding a Service</text>

  
  <rect x="40" y="145" width="1520" height="505" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 165)">
    <rect x="4" y="8" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 24 L 22 28 L 14 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="26" y1="32" x2="38" y2="32" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="140" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Environment variables</text>

  
  <rect x="990" y="168" width="530" height="48" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="1255" y="201" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#991b1b">badge printed at birth, never updated</text>

  
  <rect x="65" y="235" width="410" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="275" r="24" fill="#207448" />
  <text x="105" y="283" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <g transform="translate(145, 247)">
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="270" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Service created at T1</text>

  
  <line x1="475" y1="310" x2="525" y2="310" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="535" y="235" width="985" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="575" cy="275" r="24" fill="#207448" />
  <text x="575" y="283" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <g transform="translate(615, 247)">
    <rect x="6" y="8" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="18" r="3" fill="#207448" />
    <circle cx="26" cy="18" r="3" fill="#207448" />
    <circle cx="36" cy="18" r="3" fill="#207448" />
    <line x1="6" y1="26" x2="50" y2="26" stroke="#207448" stroke-width="3" />
  </g>
  <text x="680" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">pod created at T2 receives</text>
  <text x="680" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">NGINX_SERVICE_HOST=10.110.34.183 and</text>
  <text x="680" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">NGINX_SERVICE_PORT=80 only for</text>
  <text x="680" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Services that existed before the pod</text>

  
  <rect x="65" y="398" width="1455" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <g transform="translate(85, 407)">
    <rect x="6" y="8" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 22 20 L 30 26 L 22 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="145" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a second pod created before the Service has no variables until it restarts</text>

  
  <rect x="65" y="480" width="1455" height="155" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  <g transform="translate(85, 530)">
    <path d="M 28 6 L 50 46 L 6 46 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="28" y1="20" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="40" r="2.5" fill="#db8129" />
  </g>
  <text x="155" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">in a namespace with 2,000 Services kubelet injects 10,000+ variables, which can exceed the</text>
  <text x="155" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Linux execve environment size limit (MAX_ARG_STRLEN) and fail container start;</text>
  <text x="155" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#db8129">set enableServiceLinks false</text>

  
  <rect x="40" y="665" width="1520" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 685)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <ellipse cx="28" cy="28" rx="10" ry="22" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3" />
  </g>
  <text x="140" y="724" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">DNS (CoreDNS)</text>

  
  <rect x="65" y="755" width="770" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(90, 780)">
    <circle cx="22" cy="22" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="32" y1="32" x2="46" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="155" y="818" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">name my-svc.my-ns.svc.cluster.local</text>
  <text x="155" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">resolves as soon as the Service exists;</text>
  <text x="155" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">phone book anyone can look up any time</text>

  
  <rect x="855" y="755" width="665" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(880, 780)">
    <rect x="8" y="6" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="18" x2="36" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="16" y1="38" x2="28" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="945" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">A and AAAA for the ClusterIP,</text>
  <text x="945" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SRV for named ports;</text>
  <text x="945" y="918" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">headless returns pod IPs</text>

  
  <rect x="40" y="1030" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1076" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Kubernetes annotation values must be quoted strings, the text true in quotes, not a bare YAML boolean</text>
</svg>