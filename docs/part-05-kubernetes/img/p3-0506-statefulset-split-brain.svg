<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Dead node: why web-0 is not replaced until the node is fenced</title>
  <desc>Numbered flow showing Kubernetes StatefulSet pod replacement behavior on node failure and out-of-service fencing.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1350" fill="#f5f8f5" />

  
  <text x="60" y="65" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">
    Dead node: why web-0 is not replaced until the node is fenced
  </text>

  

  
  <g transform="translate(60, 110)">
    
    <rect x="0" y="0" width="980" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="50" r="26" fill="#207448" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <rect x="96" y="26" width="48" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="104" y1="40" x2="114" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="62" x2="150" y2="62" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" />
    
    <text x="165" y="58" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      Node crashes or loses network; kubelet is silent
    </text>
  </g>

  
  <path d="M 550 240 L 550 280" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 280)">
    
    <rect x="0" y="0" width="980" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="50" r="26" fill="#207448" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <circle cx="120" cy="50" r="24" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="120,34 120,50 134,50" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="165" y="54" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="165" dy="0" font-weight="bold">After 40 s Ready becomes Unknown, unreachable taint added;</tspan>
      <tspan x="165" dy="36">after 300 s tolerationSeconds pods are deleted</tspan>
    </text>
  </g>

  
  <path d="M 550 435 L 550 475" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 475)">
    
    <rect x="0" y="0" width="980" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="50" r="26" fill="#207448" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <rect x="98" y="28" width="44" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="98" y1="42" x2="142" y2="42" stroke="#207448" stroke-width="2" />
    <circle cx="120" cy="56" r="3" fill="#207448" />
    
    <text x="165" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="165" dy="0" font-weight="bold">web-0 stays Terminating:</tspan>
      <tspan x="165" dy="36">nobody confirms the container stopped</tspan>
    </text>
  </g>

  
  <path d="M 550 615 L 550 655" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(60, 655)">
    
    <rect x="0" y="0" width="980" height="185" rx="12" fill="#fff7f0" stroke="#db8129" stroke-width="3" />
    
    <circle cx="50" cy="50" r="26" fill="#db8129" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <path d="M 120 28 L 142 38 L 142 56 C 142 70 120 80 120 80 C 120 80 98 70 98 56 L 98 38 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    
    <text x="165" y="48" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="165" dy="0" font-weight="bold">StatefulSet guarantees at most one pod per ordinal,</tspan>
      <tspan x="165" dy="36">so it creates no replacement web-0</tspan>
      <tspan x="165" dy="36" fill="#b35900" font-weight="bold">(two writers on one volume would be split-brain)</tspan>
    </text>
  </g>

  
  <path d="M 550 840 L 550 880" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 880)">
    
    <rect x="0" y="0" width="980" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="50" r="26" fill="#207448" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <circle cx="120" cy="50" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="120" y1="36" x2="120" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <text x="165" y="46" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="165" dy="0" font-weight="bold">Admin or fencing automation confirms the host is powered off</tspan>
      <tspan x="165" dy="36">(IPMI, Redfish or cloud API) and applies taint</tspan>
      <tspan x="165" dy="44" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">node.kubernetes.io/out-of-service=nodeshutdown:NoExecute</tspan>
    </text>
  </g>

  
  <path d="M 550 1090 L 550 1130" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 1130)">
    
    <rect x="0" y="0" width="980" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="50" cy="50" r="26" fill="#207448" />
    <text x="50" y="59" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <ellipse cx="120" cy="38" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 100 38 v 20 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -20" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="165" y="50" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="165" dy="0" font-weight="bold">Control plane force-completes pod termination</tspan>
      <tspan x="165" dy="36">and detaches volumes; web-0 reschedules cleanly</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 110)">
    
    <rect x="0" y="0" width="460" height="730" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" />

    
    <rect x="0" y="0" width="460" height="80" rx="12" fill="#e8f1ea" />
    <text x="30" y="52" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Other ways out</text>

    
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="412" height="155" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#207448" />
      <text x="36" y="44" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
      <text x="64" y="44" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Node Recovery</text>
      <text x="24" y="94" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="24" dy="0">kubelet returns and</tspan>
        <tspan x="24" dy="36">confirms;</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 295)">
      <rect x="0" y="0" width="412" height="175" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#207448" />
      <text x="36" y="44" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
      <text x="64" y="44" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Node Deletion</text>
      <text x="24" y="94" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="24" dy="0">node object is deleted</tspan>
        <tspan x="24" dy="36">from the API;</tspan>
      </text>
    </g>

    
    <g transform="translate(24, 500)">
      <rect x="0" y="0" width="412" height="195" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#207448" />
      <text x="36" y="44" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
      <text x="64" y="44" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Manual Override</text>
      <text x="24" y="94" font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="24" dy="0">force delete only when the</tspan>
        <tspan x="24" dy="36">node is certainly down.</tspan>
      </text>
    </g>
  </g>
</svg>