<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Reflector, DeltaFIFO, indexer and work queue</title>
  <desc>Kubernetes client-go controller architecture showing API server, Reflector, DeltaFIFO, Informer with Indexer, Event handler, and Work queue with reconcile workers.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-return" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5" />

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Reflector, DeltaFIFO, indexer and work queue</text>

  
  <g id="box4-side-note-group">
    <rect x="711" y="90" width="320" height="104" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <path d="M 871 194 L 871 226" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" fill="none" />
    <text x="871" y="122" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="871" dy="0">One shared informer</tspan>
      <tspan x="871" dy="30">per resource type</tspan>
      <tspan x="871" dy="30">per process</tspan>
    </text>
  </g>

  
  <g id="box1-container">
    <rect x="35" y="226" width="150" height="474" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(82, 300)">
      <path d="M 10 38 A 16 16 0 0 1 18 14 A 22 22 0 0 1 50 14 A 16 16 0 0 1 58 38 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    
    <text x="110" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="110" dy="0">API</tspan>
      <tspan x="110" dy="38">server</tspan>
    </text>
  </g>

  
  <line x1="185" y1="450" x2="211" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="box2-container">
    <rect x="213" y="226" width="260" height="474" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(315, 248)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 6 A 22 22 0 0 1 50 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="28" r="7" fill="#207448" />
    </g>
    
    <text x="343" y="340" fill="#303a36" text-anchor="middle">
      <tspan x="343" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Reflector:</tspan>
      <tspan x="343" dy="38" font-family="sans-serif" font-size="24">LIST, then</tspan>
      <tspan x="343" dy="34" font-family="sans-serif" font-size="24">WATCH from</tspan>
      <tspan x="343" dy="34" font-family="monospace" font-size="24">resourceVersion</tspan>
    </text>

    
    <rect x="233" y="546" width="220" height="114" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="343" y="594" fill="#303a36" text-anchor="middle">
      <tspan x="343" dy="0" font-family="sans-serif" font-size="24">Relists on</tspan>
      <tspan x="343" dy="34" font-family="monospace" font-size="24">410 Gone</tspan>
    </text>
  </g>

  
  <line x1="473" y1="450" x2="499" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="box3-container">
    <rect x="501" y="226" width="212" height="474" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(579, 250)">
      <polygon points="28,6 50,48 6,48" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    </g>
    
    <text x="607" y="342" fill="#303a36" text-anchor="middle">
      <tspan x="607" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">DeltaFIFO:</tspan>
      <tspan x="607" dy="60" font-family="sans-serif" font-size="24">added,</tspan>
      <tspan x="607" dy="44" font-family="sans-serif" font-size="24">updated,</tspan>
      <tspan x="607" dy="44" font-family="sans-serif" font-size="24">deleted</tspan>
      <tspan x="607" dy="44" font-family="sans-serif" font-size="24">deltas</tspan>
    </text>
  </g>

  
  <line x1="713" y1="450" x2="739" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="box4-container">
    <rect x="741" y="226" width="260" height="474" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(843, 246)">
      <circle cx="28" cy="20" r="9" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 34 A 20 20 0 0 1 44 34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="30" x2="28" y2="50" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="871" y="326" fill="#303a36" text-anchor="middle">
      <tspan x="871" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Informer</tspan>
      <tspan x="871" dy="32" font-family="sans-serif" font-size="24">updates the</tspan>
      <tspan x="871" dy="30" font-family="sans-serif" font-size="24">indexer and</tspan>
      <tspan x="871" dy="30" font-family="sans-serif" font-size="24">calls <tspan font-family="monospace">OnAdd,</tspan></tspan>
      <tspan x="871" dy="30" font-family="monospace" font-size="24">OnUpdate,</tspan>
      <tspan x="871" dy="30" font-family="monospace" font-size="24">OnDelete</tspan>
    </text>

    
    <rect x="759" y="534" width="224" height="150" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="871" y="572" fill="#303a36" text-anchor="middle">
      <tspan x="871" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Indexer:</tspan>
      <tspan x="871" dy="40" font-family="sans-serif" font-size="24">local cache,</tspan>
      <tspan x="871" dy="36" font-family="sans-serif" font-size="24">lister reads</tspan>
    </text>
  </g>

  
  <line x1="1001" y1="450" x2="1027" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="box5-container">
    
    <rect x="1029" y="226" width="242" height="474" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1122, 250)">
      <circle cx="28" cy="18" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 32 L 28 50 M 20 40 L 28 40 M 20 46 L 28 46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="1150" y="342" fill="#303a36" text-anchor="middle">
      <tspan x="1150" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Event</tspan>
      <tspan x="1150" dy="38" font-family="sans-serif" font-size="30" font-weight="bold">handler</tspan>
      <tspan x="1150" dy="50" font-family="sans-serif" font-size="24">enqueues</tspan>
      <tspan x="1150" dy="40" font-family="monospace" font-size="24">namespace/name</tspan>
      <tspan x="1150" dy="38" font-family="sans-serif" font-size="24">key</tspan>
    </text>
  </g>

  
  <line x1="1271" y1="450" x2="1297" y2="450" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="box6-container">
    
    <rect x="1299" y="226" width="266" height="474" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(1404, 246)">
      <rect x="4" y="6" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="4" y="24" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="4" y="42" width="48" height="12" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    
    <text x="1432" y="328" fill="#303a36" text-anchor="middle">
      <tspan x="1432" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Work queue:</tspan>
      <tspan x="1432" dy="38" font-family="sans-serif" font-size="24">deduplicates</tspan>
      <tspan x="1432" dy="32" font-family="sans-serif" font-size="24">keys, one</tspan>
      <tspan x="1432" dy="32" font-family="sans-serif" font-size="24">worker per key</tspan>
    </text>

    
    <circle cx="1372" cy="480" r="20" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
    <circle cx="1432" cy="480" r="20" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
    <circle cx="1492" cy="480" r="20" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
    
    <text x="1432" y="534" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Reconcile</text>

    
    <rect x="1317" y="556" width="230" height="128" rx="8" fill="#f5f8f5" stroke="#db8129" stroke-width="2" />
    <text x="1432" y="594" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1432" dy="0">Event handlers</tspan>
      <tspan x="1432" dy="32">enqueue keys,</tspan>
      <tspan x="1432" dy="32">not objects</tspan>
    </text>
  </g>

  
  
  <g id="return-arrow-group">
    <path d="M 1432 700 L 1432 754 L 110 754 L 110 702" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-return)" />
    
    <rect x="360" y="734" width="770" height="38" rx="6" fill="#f5f8f5" />
    <text x="745" y="761" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Writes directly, conditional on <tspan font-family="monospace">resourceVersion</tspan></text>
  </g>

  
  <g id="bottom-takeaway-group">
    <rect x="35" y="820" width="1530" height="64" rx="12" fill="#207448" />
    <text x="800" y="862" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Read from listers, write to the API server.</text>
  </g>
</svg>