<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Priority classes: floors in a tower</title>
  <desc>Visual infographic explaining Kubernetes priority classes as stacked tower floors with an elevator indicating queue priority and job boxes detailing scheduler roles.</desc>

  
  <rect x="0" y="0" width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Priority classes: floors in a tower</text>
  <line x1="40" y1="105" x2="1560" y2="105" stroke="#207448" stroke-width="3" opacity="0.4"/>

  
  <g id="elevator-column">
    
    <rect x="30" y="140" width="270" height="830" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <line x1="75" y1="160" x2="75" y2="950" stroke="#207448" stroke-width="2" stroke-dasharray="8 8" opacity="0.35"/>
    <line x1="255" y1="160" x2="255" y2="950" stroke="#207448" stroke-width="2" stroke-dasharray="8 8" opacity="0.35"/>

    
    <circle cx="165" cy="180" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="165" cy="180" r="6" fill="#207448"/>
    <line x1="165" y1="202" x2="165" y2="246" stroke="#207448" stroke-width="4"/>

    
    <rect x="52" y="246" width="226" height="420" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    <rect x="75" y="238" width="180" height="8" rx="4" fill="#207448"/>

    
    <g transform="translate(137, 275)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <line x1="28" y1="4" x2="28" y2="52"/>
      <path d="M16 32 L28 18 L40 32"/>
      <line x1="28" y1="18" x2="28" y2="40"/>
    </g>

    
    <text x="165" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="165" dy="0">Higher floors</tspan>
      <tspan x="165" dy="36">win the</tspan>
      <tspan x="165" dy="36">scheduling</tspan>
      <tspan x="165" dy="36">queue</tspan>
    </text>
  </g>

  
  <g id="tower-floors">
    
    <g id="floor-top">
      <rect x="330" y="140" width="760" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

      
      <g transform="translate(360, 155)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M28 6 L48 14 V28 C48 42 28 50 28 50 C28 50 8 42 8 28 V14 Z"/>
        <circle cx="28" cy="24" r="5"/>
        <line x1="28" y1="29" x2="28" y2="36"/>
      </g>

      
      <text x="430" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Reserved for core components</text>

      
      <rect x="360" y="222" width="700" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="710" y="259" text-anchor="middle" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">system-node-critical (2000001000)</text>

      
      <rect x="360" y="294" width="700" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="710" y="331" text-anchor="middle" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">system-cluster-critical (2000000000)</text>
    </g>

    
    <g id="floor-inference">
      <rect x="330" y="390" width="760" height="180" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

      
      <g transform="translate(360, 452)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="10" y="10" width="36" height="36" rx="6"/>
        <circle cx="28" cy="28" r="8"/>
        <line x1="18" y1="4" x2="18" y2="10"/>
        <line x1="28" y1="4" x2="28" y2="10"/>
        <line x1="38" y1="4" x2="38" y2="10"/>
        <line x1="18" y1="46" x2="18" y2="52"/>
        <line x1="28" y1="46" x2="28" y2="52"/>
        <line x1="38" y1="46" x2="38" y2="52"/>
        <line x1="4" y1="18" x2="10" y2="18"/>
        <line x1="4" y1="28" x2="10" y2="28"/>
        <line x1="4" y1="38" x2="10" y2="38"/>
        <line x1="46" y1="18" x2="52" y2="18"/>
        <line x1="46" y1="28" x2="52" y2="28"/>
        <line x1="46" y1="38" x2="52" y2="38"/>
      </g>

      
      <text x="440" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="440" dy="0" font-weight="bold">inference-critical: value 1000000,</tspan>
        <tspan x="440" dy="36">PreemptLowerPriority, may preempt training</tspan>
      </text>
    </g>

    
    <g id="floor-training">
      <rect x="330" y="590" width="760" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

      
      <g transform="translate(360, 652)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="22"/>
        <polyline points="28 14 28 28 38 28"/>
      </g>

      
      <text x="440" y="652" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="440" dy="0" font-weight="bold">training-low: value 1000,</tspan>
        <tspan x="440" dy="34">preemptionPolicy Never,</tspan>
        <tspan x="440" dy="34">waits in the queue, never evicts others</tspan>
      </text>
    </g>

    
    <g id="floor-bottom">
      <rect x="330" y="790" width="760" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

      
      <g transform="translate(360, 852)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M28 6 L48 18 V40 L28 52 L8 40 V18 Z"/>
        <polyline points="28 6 28 52"/>
        <polyline points="8 18 28 30 48 18"/>
      </g>

      
      <text x="440" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Default pods (no class)</text>
    </g>
  </g>

  
  <g id="right-job-boxes">
    
    <g id="job-1">
      <rect x="1120" y="140" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

      
      <g transform="translate(1312, 168)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="18" y1="14" x2="48" y2="14"/>
        <line x1="18" y1="28" x2="48" y2="28"/>
        <line x1="18" y1="42" x2="48" y2="42"/>
        <circle cx="8" cy="14" r="2" fill="#207448"/>
        <circle cx="8" cy="28" r="2" fill="#207448"/>
        <circle cx="8" cy="42" r="2" fill="#207448"/>
      </g>

      
      <text x="1340" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="1340" dy="0">Orders the</tspan>
        <tspan x="1340" dy="38">scheduling queue</tspan>
      </text>
    </g>

    
    <g id="job-2">
      <rect x="1120" y="435" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

      
      <g transform="translate(1312, 463)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="28" y1="8" x2="28" y2="48"/>
        <line x1="12" y1="48" x2="44" y2="48"/>
        <line x1="10" y1="16" x2="46" y2="16"/>
        <path d="M10 16 L4 32 H16 Z"/>
        <path d="M46 16 L40 32 H52 Z"/>
      </g>

      
      <text x="1340" y="573" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="1340" dy="0">Decides</tspan>
        <tspan x="1340" dy="38">preemption victims</tspan>
      </text>
    </g>

    
    <g id="job-3">
      <rect x="1120" y="730" width="440" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

      
      <g transform="translate(1312, 758)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M10 40 A22 22 0 1 1 46 40"/>
        <line x1="28" y1="30" x2="40" y2="18"/>
        <circle cx="28" cy="30" r="3" fill="#207448"/>
        <line x1="10" y1="48" x2="46" y2="48"/>
      </g>

      
      <text x="1340" y="865" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="1340" dy="0">Influences node-pressure</tspan>
        <tspan x="1340" dy="36">eviction order</tspan>
      </text>
    </g>
  </g>

  
  <g id="caption-bar">
    <rect x="30" y="1005" width="1540" height="65" rx="12" fill="#207448"/>
    <text x="800" y="1046" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Priority is an integer, and a larger value means more important.</text>
  </g>
</svg>