<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Proactive Cluster-Proportional Autoscaler vs Reactive HPA During Job Launch Bursts</title>
  <desc>Visual comparison showing how CoreDNS handles a sudden 5,000-pod job startup under Reactive CPU-based HPA versus Proactive Cluster-Proportional Autoscaler (CPA).</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Proactive Cluster-Proportional Autoscaler vs Reactive HPA</text>
  <text x="800" y="110" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">During Job Launch Bursts</text>

  
  
  
  <rect x="40" y="140" width="735" height="1020" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="40" y="140" width="735" height="74" rx="16" fill="#207448" />
  <rect x="40" y="194" width="735" height="20" fill="#207448" />
  <text x="407" y="190" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Reactive CPU-based HPA</text>

  
  <g transform="translate(65, 235)">
    <rect x="0" y="0" width="685" height="265" rx="12" fill="#ffffff" stroke="#c0d5c5" stroke-width="2" />
    
    <circle cx="48" cy="46" r="24" fill="#207448" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 1</text>
    
    
    <g transform="translate(605, 18)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="50" rx="6" />
      <line x1="0" y1="16" x2="56" y2="16" />
      <circle cx="12" cy="8" r="3" fill="#207448" />
      <circle cx="24" cy="8" r="3" fill="#207448" />
      <path d="M 18 36 L 28 24 L 38 36" />
    </g>

    
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">5,000 training pods launch simultaneously; query rate</text>
    <text x="30" y="152" font-family="sans-serif" font-size="24" fill="#303a36">immediately surges to 100k+ QPS due to pod count</text>
    <text x="30" y="189" font-family="sans-serif" font-size="24" fill="#303a36">× lookup rate × ndots:5 amplification.</text>

    
    <path d="M 342 215 L 342 255" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(65, 525)">
    <rect x="0" y="0" width="685" height="265" rx="12" fill="#ffffff" stroke="#c0d5c5" stroke-width="2" />
    
    <circle cx="48" cy="46" r="24" fill="#207448" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 2</text>

    
    <g transform="translate(605, 18)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="10" y="10" width="36" height="36" rx="4" />
      <line x1="18" y1="2" x2="18" y2="10" />
      <line x1="28" y1="2" x2="28" y2="10" />
      <line x1="38" y1="2" x2="38" y2="10" />
      <line x1="18" y1="46" x2="18" y2="54" />
      <line x1="28" y1="46" x2="28" y2="54" />
      <line x1="38" y1="46" x2="38" y2="54" />
      <line x1="2" y1="18" x2="10" y2="18" />
      <line x1="2" y1="28" x2="10" y2="28" />
      <line x1="2" y1="38" x2="10" y2="38" />
      <line x1="46" y1="18" x2="54" y2="18" />
      <line x1="46" y1="28" x2="54" y2="28" />
      <line x1="46" y1="38" x2="54" y2="38" />
    </g>

    
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">The default 2 CoreDNS pods (handling 10k-20k</text>
    <text x="30" y="152" font-family="sans-serif" font-size="24" fill="#303a36">QPS/core) saturate immediately, suffering CPU</text>
    <text x="30" y="189" font-family="sans-serif" font-size="24" fill="#303a36">throttling and packet drops.</text>

    
    <path d="M 342 215 L 342 255" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(65, 815)">
    <rect x="0" y="0" width="685" height="315" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="48" cy="46" r="24" fill="#db8129" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 3</text>

    
    <g transform="translate(605, 18)" stroke="#db8129" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="24" />
      <polyline points="28,14 28,28 38,28" />
    </g>

    
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">HPA evaluation metric lags behind by 15-60</text>
    <text x="30" y="152" font-family="sans-serif" font-size="24" fill="#303a36">seconds; pods experience 5s timeouts and</text>
    <text x="30" y="189" font-family="sans-serif" font-size="24" fill="#303a36">startup crashes before extra replicas become Ready.</text>

    
    <path d="M 50 250 L 635 250" fill="none" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)" />
  </g>

  
  
  
  <rect x="825" y="140" width="735" height="1020" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="825" y="140" width="735" height="74" rx="16" fill="#207448" />
  <rect x="825" y="194" width="735" height="20" fill="#207448" />
  <text x="1192" y="190" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Proactive Cluster-Proportional Autoscaler (CPA)</text>

  
  <g transform="translate(850, 235)">
    <rect x="0" y="0" width="685" height="265" rx="12" fill="#ffffff" stroke="#c0d5c5" stroke-width="2" />
    
    <circle cx="48" cy="46" r="24" fill="#207448" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 1</text>

    
    <g transform="translate(605, 18)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="48" height="14" rx="3" />
      <rect x="4" y="24" width="48" height="14" rx="3" />
      <rect x="4" y="42" width="48" height="14" rx="3" />
      <circle cx="12" cy="13" r="2" fill="#207448" />
      <circle cx="12" cy="31" r="2" fill="#207448" />
      <circle cx="12" cy="49" r="2" fill="#207448" />
    </g>

    
    <text x="30" y="102" font-family="sans-serif" font-size="24" fill="#303a36">CPA watches cluster size (nodesPerReplica: 16,</text>
    <text x="30" y="137" font-family="sans-serif" font-size="24" fill="#303a36">coresPerReplica: 256, min: 3). As cluster scales up to</text>
    <text x="30" y="172" font-family="sans-serif" font-size="24" fill="#303a36">1,000 GPU nodes ahead of the run, CPA scales</text>
    <text x="30" y="207" font-family="sans-serif" font-size="24" fill="#303a36">CoreDNS to 63 replicas before pods start.</text>

    
    <path d="M 342 225 L 342 255" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(850, 525)">
    <rect x="0" y="0" width="685" height="265" rx="12" fill="#ffffff" stroke="#c0d5c5" stroke-width="2" />
    
    <circle cx="48" cy="46" r="24" fill="#207448" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">2</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 2</text>

    
    <g transform="translate(605, 18)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <polyline points="20,26 26,32 36,20" />
    </g>

    
    <text x="30" y="102" font-family="sans-serif" font-size="24" fill="#303a36">Pod anti-affinity spreads replicas across nodes/zones;</text>
    <text x="30" y="137" font-family="sans-serif" font-size="24" fill="#303a36">PodDisruptionBudget (minAvailable: 50%) protects</text>
    <text x="30" y="172" font-family="sans-serif" font-size="24" fill="#303a36">availability; system-cluster-critical priority</text>
    <text x="30" y="207" font-family="sans-serif" font-size="24" fill="#303a36">prevents eviction.</text>

    
    <path d="M 342 225 L 342 255" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(850, 815)">
    <rect x="0" y="0" width="685" height="315" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="48" cy="46" r="24" fill="#207448" />
    <text x="48" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="88" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 3</text>

    
    <g transform="translate(605, 18)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 12 M 28 44 L 28 50 M 6 28 L 12 28 M 44 28 L 50 28 M 12 12 L 17 17 M 39 39 L 44 44 M 12 44 L 17 39 M 39 17 L 44 12" />
    </g>

    
    <text x="30" y="115" font-family="sans-serif" font-size="24" fill="#303a36">5,000 pods launch and the 100k+ QPS burst</text>
    <text x="30" y="152" font-family="sans-serif" font-size="24" fill="#303a36">distributes across the pre-warmed pool without</text>
    <text x="30" y="189" font-family="sans-serif" font-size="24" fill="#303a36">latency spikes or drops.</text>

    
    <path d="M 50 250 L 635 250" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  </g>
</svg>