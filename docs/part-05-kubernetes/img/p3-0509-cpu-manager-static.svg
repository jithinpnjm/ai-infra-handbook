<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190">
  <title>Who gets exclusive cores under the static CPU Manager</title>
  <desc>Infographic explaining Kubernetes static CPU Manager policies, exclusive pinned cores criteria, SMT core allocation, and the full-pcpus-only policy.</desc>

  
  <rect width="1600" height="1190" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#207448">Who gets exclusive cores under the static CPU Manager</text>

  
  <rect x="40" y="130" width="460" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="242" y="148" width="56" height="52" rx="6"/>
    <path d="M258 148 v-6 a4 4 0 0 1 4 -4 h16 a4 4 0 0 1 4 4 v6"/>
    <path d="M254 174 l6 6 l16 -16"/>
  </g>

  
  <rect x="60" y="215" width="420" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="102" cy="255" r="22" fill="#207448"/>
  <text x="102" y="263" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="140" y="262" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">QoS class Guaranteed</text>
  <text x="85" y="315" font-family="sans-serif" font-size="24" fill="#303a36">(CPU and memory</text>
  <text x="85" y="355" font-family="sans-serif" font-size="24" fill="#303a36">requests equal limits)</text>

  
  <rect x="60" y="420" width="420" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="102" cy="460" r="22" fill="#207448"/>
  <text x="102" y="468" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="140" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">integer CPU request</text>
  <text x="85" y="520" font-family="sans-serif" font-size="24" fill="#303a36">such as cpu 8 or 16,</text>
  <text x="85" y="560" font-family="sans-serif" font-size="24" fill="#303a36">not 7500m</text>

  
  <rect x="60" y="625" width="420" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="102" cy="665" r="22" fill="#207448"/>
  <text x="102" y="673" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="140" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">reserved CPUs set</text>
  <text x="85" y="718" font-family="sans-serif" font-size="24" fill="#303a36">through</text>
  <text x="85" y="756" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">reservedSystemCPUs</text>
  <text x="85" y="796" font-family="sans-serif" font-size="24" fill="#303a36">(for example 0-3) or</text>
  <text x="85" y="836" font-family="monospace" font-size="24" fill="#303a36">kubeReserved</text>
  <text x="250" y="836" font-family="sans-serif" font-size="24" fill="#303a36">and</text>
  <text x="85" y="872" font-family="monospace" font-size="24" fill="#303a36">systemReserved</text>

  
  <rect x="525" y="130" width="550" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="772" y="146" width="56" height="48" rx="8"/>
    <rect x="786" y="158" width="28" height="24" rx="4"/>
    <path d="M784 146 v-6 M800 146 v-6 M816 146 v-6"/>
    <path d="M784 194 v6 M800 194 v6 M816 194 v6"/>
    <path d="M772 158 h-6 M772 170 h-6 M772 182 h-6"/>
    <path d="M828 158 h6 M828 170 h6 M828 182 h6"/>
  </g>

  
  <rect x="545" y="206" width="510" height="175" rx="12" fill="#edf0ed" stroke="#8a9990" stroke-width="2"/>
  
  <rect x="560" y="222" width="230" height="78" rx="8" fill="#e0e5e1" stroke="#8a9990" stroke-width="1.5"/>
  <rect x="570" y="234" width="100" height="54" rx="6" fill="#cbd4cf"/>
  <text x="620" y="270" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4a5550">0</text>
  <rect x="680" y="234" width="100" height="54" rx="6" fill="#cbd4cf"/>
  <text x="730" y="270" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4a5550">1</text>
  
  <rect x="810" y="222" width="230" height="78" rx="8" fill="#e0e5e1" stroke="#8a9990" stroke-width="1.5"/>
  <rect x="820" y="234" width="100" height="54" rx="6" fill="#cbd4cf"/>
  <text x="870" y="270" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4a5550">2</text>
  <rect x="930" y="234" width="100" height="54" rx="6" fill="#cbd4cf"/>
  <text x="980" y="270" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#4a5550">3</text>
  
  <text x="800" y="348" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">OS, kubelet, runtime, IRQs</text>

  
  <rect x="545" y="396" width="510" height="215" rx="12" fill="#fdf4eb" stroke="#db8129" stroke-width="3"/>
  
  <rect x="560" y="412" width="230" height="78" rx="8" fill="#fdebd9" stroke="#db8129" stroke-width="2"/>
  <rect x="570" y="424" width="100" height="54" rx="6" fill="#db8129"/>
  <text x="620" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <rect x="680" y="424" width="100" height="54" rx="6" fill="#db8129"/>
  <text x="730" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <rect x="810" y="412" width="230" height="78" rx="8" fill="#fdebd9" stroke="#db8129" stroke-width="2"/>
  <rect x="820" y="424" width="100" height="54" rx="6" fill="#db8129"/>
  <text x="870" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  <rect x="930" y="424" width="100" height="54" rx="6" fill="#db8129"/>
  <text x="980" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
  
  <text x="800" y="545" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">exclusive cpuset for the</text>
  <text x="800" y="580" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Guaranteed pod</text>

  
  <rect x="545" y="626" width="510" height="264" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="560" y="642" width="230" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <rect x="570" y="654" width="100" height="54" rx="6" fill="#207448"/>
  <text x="620" y="690" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">8</text>
  <rect x="680" y="654" width="100" height="54" rx="6" fill="#207448"/>
  <text x="730" y="690" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">9</text>
  
  <rect x="810" y="642" width="230" height="78" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <rect x="820" y="654" width="100" height="54" rx="6" fill="#207448"/>
  <text x="870" y="690" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">10</text>
  <rect x="930" y="654" width="100" height="54" rx="6" fill="#207448"/>
  <text x="980" y="690" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">11</text>
  
  <text x="800" y="770" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">shared pool for Burstable,</text>
  <text x="800" y="810" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">BestEffort and</text>
  <text x="800" y="850" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">non-integer requests</text>

  
  <rect x="1100" y="130" width="460" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1308" y="148" width="20" height="46" rx="4"/>
    <rect x="1336" y="148" width="20" height="46" rx="4"/>
    <path d="M1318 142 h20 a4 4 0 0 1 4 4 v2 M1318 200 h20 a4 4 0 0 0 4 -4 v-2"/>
  </g>

  
  <rect x="1120" y="215" width="420" height="340" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1140" y="265" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">full-pcpus-only true:</text>
  <text x="1140" y="312" font-family="sans-serif" font-size="24" fill="#303a36">request must be a</text>
  <text x="1140" y="354" font-family="sans-serif" font-size="24" fill="#303a36">multiple of 2 vCPUs</text>
  <text x="1140" y="396" font-family="sans-serif" font-size="24" fill="#303a36">(2, 4, 8, 16) so both</text>
  <text x="1140" y="438" font-family="sans-serif" font-size="24" fill="#303a36">hyperthread siblings</text>
  <text x="1140" y="480" font-family="sans-serif" font-size="24" fill="#303a36">go to one container;</text>

  
  <rect x="1120" y="575" width="420" height="315" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1140" y="630" font-family="sans-serif" font-size="24" fill="#303a36">request of 3 is rejected</text>
  <text x="1140" y="675" font-family="sans-serif" font-size="24" fill="#303a36">at node admission with</text>
  <text x="1140" y="720" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">SMTAlignmentError</text>
  
  
  <g transform="translate(1140, 755)">
    
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <rect x="8" y="10" width="50" height="40" rx="4" fill="#207448"/>
    <text x="33" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">1</text>
    <rect x="68" y="10" width="50" height="40" rx="4" fill="#207448"/>
    <text x="93" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">2</text>
    
    <rect x="150" y="0" width="130" height="60" rx="6" fill="#fbebe8" stroke="#a03020" stroke-dasharray="4,4" stroke-width="1.5"/>
    <rect x="158" y="10" width="50" height="40" rx="4" fill="#a03020"/>
    <text x="183" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#ffffff">3</text>
    <path d="M228 15 l30 30 M258 15 l-30 30" stroke="#a03020" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <rect x="40" y="940" width="1520" height="210" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="95" cy="1045" r="22"/>
    <circle cx="95" cy="1045" r="9"/>
    <path d="M95 1015 v8 M95 1067 v8 M65 1045 h8 M117 1045 h8"/>
    <path d="M74 1024 l6 6 M110 1060 l6 6 M74 1066 l6 -6 M110 1030 l6 -6"/>
  </g>

  
  <text x="160" y="995" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">Changing the policy: <tspan font-weight="normal" fill="#303a36">drain node, stop kubelet,</tspan></text>
  <text x="160" y="1044" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">rm /var/lib/kubelet/cpu_manager_state<tspan font-family="sans-serif" font-weight="normal">, start kubelet;</tspan></text>
  <text x="160" y="1092" font-family="sans-serif" font-size="25" fill="#303a36">otherwise the kubelet refuses to start to protect live cpusets</text>
</svg>