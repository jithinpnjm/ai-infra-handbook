<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Who gets exclusive cores under the static CPU Manager</title>
  <desc>Who gets exclusive cores under the static CPU Manager</desc>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Who gets exclusive cores under the static CPU Manager</text>

  
  <g id="left-panel">
    <rect x="40" y="120" width="460" height="635" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(242, 140)">
      <rect x="8" y="12" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M20 8 h16 v8 h-16 z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <path d="M18 28 l6 6 l14 -14" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="42" x2="38" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <g transform="translate(0, 0)">
      <circle cx="80" cy="245" r="24" fill="#207448"/>
      <text x="80" y="254" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      <text x="122" y="235" fill="#303a36">
        <tspan font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">QoS class Guaranteed</tspan>
        <tspan x="122" dy="36" font-family="sans-serif" font-size="24">(CPU and memory requests</tspan>
        <tspan x="122" dy="30" font-family="sans-serif" font-size="24">equal limits)</tspan>
      </text>
    </g>

    <line x1="65" y1="330" x2="475" y2="330" stroke="#e8f1ea" stroke-width="2"/>

    
    <g transform="translate(0, 0)">
      <circle cx="80" cy="395" r="24" fill="#207448"/>
      <text x="80" y="404" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      <text x="122" y="380" fill="#303a36">
        <tspan font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">integer CPU request</tspan>
        <tspan x="122" dy="36" font-family="sans-serif" font-size="24">such as </tspan>
        <tspan font-family="monospace" font-size="24">cpu 8</tspan>
        <tspan font-family="sans-serif" font-size="24"> or </tspan>
        <tspan font-family="monospace" font-size="24">16</tspan>
        <tspan font-family="sans-serif" font-size="24">, </tspan>
        <tspan x="122" dy="30" font-family="sans-serif" font-size="24">not </tspan>
        <tspan font-family="monospace" font-size="24">7500m</tspan>
      </text>
    </g>

    <line x1="65" y1="480" x2="475" y2="480" stroke="#e8f1ea" stroke-width="2"/>

    
    <g transform="translate(0, 0)">
      <circle cx="80" cy="565" r="24" fill="#207448"/>
      <text x="80" y="574" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
      <text x="122" y="525" fill="#303a36">
        <tspan font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">reserved CPUs</tspan>
        <tspan x="122" dy="36" font-family="sans-serif" font-size="24">set through </tspan>
        <tspan font-family="monospace" font-size="24">reservedSystemCPUs</tspan>
        <tspan x="122" dy="32" font-family="sans-serif" font-size="24">(for example </tspan>
        <tspan font-family="monospace" font-size="24">0-3</tspan>
        <tspan font-family="sans-serif" font-size="24">) or </tspan>
        <tspan x="122" dy="32" font-family="monospace" font-size="24">kubeReserved</tspan>
        <tspan font-family="sans-serif" font-size="24"> and </tspan>
        <tspan x="122" dy="32" font-family="monospace" font-size="24">systemReserved</tspan>
      </text>
    </g>
  </g>

  
  <g id="middle-panel">
    <rect x="530" y="120" width="540" height="635" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(772, 138)">
      <rect x="12" y="12" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="20" y="20" width="16" height="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <line x1="20" y1="6" x2="20" y2="12" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="6" x2="36" y2="12" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="44" x2="20" y2="50" stroke="#207448" stroke-width="3"/>
      <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="44" x2="36" y2="50" stroke="#207448" stroke-width="3"/>
      <line x1="6" y1="20" x2="12" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="6" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="3"/>
      <line x1="6" y1="36" x2="12" y2="36" stroke="#207448" stroke-width="3"/>
      <line x1="44" y1="20" x2="50" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="44" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="3"/>
      <line x1="44" y1="36" x2="50" y2="36" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="548" y="200" width="504" height="162" rx="12" fill="#eef2f0" stroke="#8a9a92" stroke-width="2"/>
    <text x="800" y="232" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">OS, kubelet, runtime, IRQs</text>

    
    <g transform="translate(562, 248)">
      
      <rect x="0" y="0" width="112" height="98" rx="6" fill="#dfe5e2" stroke="#8a9a92" stroke-width="1.5"/>
      <rect x="8" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      <rect x="60" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      
      <rect x="122" y="0" width="112" height="98" rx="6" fill="#dfe5e2" stroke="#8a9a92" stroke-width="1.5"/>
      <rect x="130" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      <rect x="182" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      
      <rect x="244" y="0" width="112" height="98" rx="6" fill="#dfe5e2" stroke="#8a9a92" stroke-width="1.5"/>
      <rect x="252" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      <rect x="304" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      
      <rect x="366" y="0" width="112" height="98" rx="6" fill="#dfe5e2" stroke="#8a9a92" stroke-width="1.5"/>
      <rect x="374" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
      <rect x="426" y="10" width="44" height="78" rx="4" fill="#bcc7c1" stroke="#71827a" stroke-width="1.5"/>
    </g>

    
    <rect x="548" y="376" width="504" height="174" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="2.5"/>
    <text x="800" y="408" text-anchor="middle" fill="#db8129">
      <tspan font-family="sans-serif" font-size="26" font-weight="bold">exclusive cpuset for the </tspan>
      <tspan x="800" dy="30" font-family="sans-serif" font-size="26" font-weight="bold">Guaranteed pod</tspan>
    </text>

    
    <g transform="translate(640, 448)">
      
      <rect x="0" y="0" width="150" height="88" rx="6" fill="#fedcc2" stroke="#db8129" stroke-width="2"/>
      <rect x="10" y="10" width="60" height="68" rx="4" fill="#db8129"/>
      <rect x="80" y="10" width="60" height="68" rx="4" fill="#db8129"/>
      
      <rect x="170" y="0" width="150" height="88" rx="6" fill="#fedcc2" stroke="#db8129" stroke-width="2"/>
      <rect x="180" y="10" width="60" height="68" rx="4" fill="#db8129"/>
      <rect x="250" y="10" width="60" height="68" rx="4" fill="#db8129"/>
    </g>

    
    <rect x="548" y="562" width="504" height="174" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="594" text-anchor="middle" fill="#303a36">
      <tspan font-family="sans-serif" font-size="24" font-weight="bold">shared pool for Burstable, </tspan>
      <tspan x="800" dy="30" font-family="sans-serif" font-size="24">BestEffort and non-integer requests</tspan>
    </text>

    
    <g transform="translate(640, 634)">
      
      <rect x="0" y="0" width="150" height="88" rx="6" fill="#cce2d3" stroke="#207448" stroke-width="1.5"/>
      <rect x="10" y="10" width="60" height="68" rx="4" fill="#90be9f" stroke="#207448" stroke-width="1.5"/>
      <rect x="80" y="10" width="60" height="68" rx="4" fill="#90be9f" stroke="#207448" stroke-width="1.5"/>
      
      <rect x="170" y="0" width="150" height="88" rx="6" fill="#cce2d3" stroke="#207448" stroke-width="1.5"/>
      <rect x="180" y="10" width="60" height="68" rx="4" fill="#90be9f" stroke="#207448" stroke-width="1.5"/>
      <rect x="250" y="10" width="60" height="68" rx="4" fill="#90be9f" stroke="#207448" stroke-width="1.5"/>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="1100" y="120" width="460" height="635" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1302, 140)">
      <rect x="6" y="10" width="20" height="36" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <rect x="30" y="10" width="20" height="36" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <path d="M16 4 v6 M36 4 v6 M16 46 v6 M36 46 v6" stroke="#207448" stroke-width="3"/>
      <path d="M26 22 h4 M26 34 h4" stroke="#207448" stroke-width="2.5"/>
    </g>

    
    <text x="1132" y="222" fill="#303a36">
      <tspan font-family="monospace" font-size="28" font-weight="bold" fill="#207448">full-pcpus-only true: </tspan>
      <tspan x="1132" dy="42" font-family="sans-serif" font-size="24">request must be a multiple </tspan>
      <tspan x="1132" dy="32" font-family="sans-serif" font-size="24">of 2 vCPUs (2, 4, 8, 16) </tspan>
      <tspan x="1132" dy="32" font-family="sans-serif" font-size="24">so both hyperthread siblings </tspan>
      <tspan x="1132" dy="32" font-family="sans-serif" font-size="24">go to one container; </tspan>
      <tspan x="1132" dy="32" font-family="sans-serif" font-size="24">request of 3 is rejected </tspan>
      <tspan x="1132" dy="32" font-family="sans-serif" font-size="24">at node admission with </tspan>
      <tspan x="1132" dy="38" font-family="monospace" font-size="26" font-weight="bold" fill="#c2410c">SMTAlignmentError</tspan>
    </text>

    
    <g transform="translate(1132, 490)">
      
      <rect x="0" y="0" width="396" height="100" rx="8" fill="#f5fbf7" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(20, 16)">
        <rect x="0" y="0" width="130" height="68" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
        <rect x="8" y="8" width="52" height="52" rx="4" fill="#207448"/>
        <rect x="70" y="8" width="52" height="52" rx="4" fill="#207448"/>
      </g>
      
      <circle cx="340" cy="50" r="22" fill="#207448"/>
      <path d="M330 50 l7 7 l14 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="396" height="100" rx="8" fill="#fdf5f5" stroke="#dc2626" stroke-width="1.5"/>
        <g transform="translate(20, 16)">
          
          <rect x="0" y="0" width="110" height="68" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
          <rect x="6" y="8" width="44" height="52" rx="4" fill="#dc2626"/>
          <rect x="60" y="8" width="44" height="52" rx="4" fill="#dc2626"/>
          
          <rect x="126" y="0" width="110" height="68" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
          <rect x="132" y="8" width="44" height="52" rx="4" fill="#dc2626"/>
          <rect x="186" y="8" width="44" height="52" rx="4" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>
        </g>
        
        <circle cx="340" cy="50" r="22" fill="#dc2626"/>
        <path d="M330 40 l20 20 M350 40 l-20 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  
  <g id="footer-panel">
    <rect x="40" y="780" width="1520" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(68, 836)">
      <rect x="6" y="6" width="48" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4"/>
      <path d="M16 20 l8 8 l-8 8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="36" x2="44" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="146" y="842" fill="#303a36">
      <tspan font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Changing the policy: </tspan>
      <tspan font-family="monospace" font-size="24">drain node, stop kubelet, </tspan>
      <tspan font-family="monospace" font-size="24">rm /var/lib/kubelet/cpu_manager_state, </tspan>
      <tspan x="146" dy="48" font-family="monospace" font-size="24">start kubelet; </tspan>
      <tspan font-family="sans-serif" font-size="24">otherwise the kubelet refuses to start to protect live cpusets</tspan>
    </text>
  </g>
</svg>