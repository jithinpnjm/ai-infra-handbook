<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>A receiving service checks a pod token with TokenReview</title>
  <desc>Swimlane diagram showing a Pod sending a ServiceAccount token to a receiving service, which validates it against the Kubernetes API server using TokenReview.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 17 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 17 9 L 1 16 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 17 9 L 1 16 Z" fill="#207448" />
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#143622" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    A receiving service checks a pod token with TokenReview
  </text>

  

  
  <rect x="60" y="105" width="450" height="795" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <rect x="60" y="105" width="450" height="115" rx="16" fill="#e8f1ea" />
  <rect x="60" y="200" width="450" height="20" fill="#e8f1ea" />

  
  <rect x="575" y="105" width="450" height="795" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <rect x="575" y="105" width="450" height="115" rx="16" fill="#e8f1ea" />
  <rect x="575" y="200" width="450" height="20" fill="#e8f1ea" />

  
  <rect x="1090" y="105" width="450" height="795" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />
  <rect x="1090" y="105" width="450" height="115" rx="16" fill="#e8f1ea" />
  <rect x="1090" y="200" width="450" height="20" fill="#e8f1ea" />

  
  <line x1="285" y1="230" x2="285" y2="880" stroke="#d5e4d9" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="800" y1="230" x2="800" y2="720" stroke="#d5e4d9" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="1315" y1="230" x2="1315" y2="880" stroke="#d5e4d9" stroke-width="3" stroke-dasharray="8 8" />

  

  
  <g transform="translate(100, 134)">
    <rect x="0" y="0" width="56" height="52" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="8" r="3" fill="#207448" />
    <circle cx="22" cy="8" r="3" fill="#207448" />
  </g>
  <text x="175" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod (caller)</text>

  
  <g transform="translate(605, 134)">
    <path d="M28,6 L33,14 L42,12 L44,21 L53,24 L50,33 L57,39 L51,46 L53,55 L44,55 L39,63 L31,59 L25,66 L18,60 L10,64 L8,55 L0,51 L4,43 L0,35 L8,32 L8,23 L17,23 Z"
          fill="none" stroke="#207448" stroke-width="3" transform="scale(0.8) translate(5, 5)" />
    <circle cx="28" cy="28" r="10" fill="none" stroke="#207448" stroke-width="3.5" />
  </g>
  <text x="680" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Receiving service</text>

  
  <g transform="translate(1115, 132)">
    <rect x="8" y="24" width="40" height="32" rx="5" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 17 24 V 16 A 11 11 0 0 1 39 16 V 24" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="40" r="4" fill="#207448" />
  </g>
  <text x="1190" y="172" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Kubernetes API server</text>

  
  
  <circle cx="285" cy="310" r="24" fill="#207448" />
  <text x="285" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

  
  <rect x="330" y="275" width="430" height="68" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
  <text x="545" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    sends its ServiceAccount token
  </text>

  
  <line x1="285" y1="365" x2="780" y2="365" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  <circle cx="800" cy="455" r="24" fill="#207448" />
  <text x="800" y="463" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

  
  <rect x="845" y="415" width="460" height="84" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />
  <text x="1075" y="449" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
    POST TokenReview
  </text>
  <text x="1075" y="481" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    with the token in spec.token
  </text>

  
  <line x1="800" y1="525" x2="1295" y2="525" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)" />

  
  
  <circle cx="1315" cy="615" r="24" fill="#207448" />
  <text x="1315" y="623" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

  
  <rect x="825" y="575" width="460" height="84" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
  <text x="1055" y="609" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    status authenticated true and user
  </text>
  <text x="1055" y="641" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    system:serviceaccount:default:default
  </text>

  
  <line x1="1315" y1="685" x2="820" y2="685" stroke="#207448" stroke-width="4" marker-end="url(#arrow-return)" />

  
  <rect x="600" y="735" width="400" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
  <text x="800" y="775" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="800" dy="0">the username prefix shows</tspan>
    <tspan x="800" dy="34">a ServiceAccount, then namespace,</tspan>
    <tspan x="800" dy="34">then account name</tspan>
  </text>

  
  <rect x="60" y="930" width="1480" height="96" rx="16" fill="#207448" filter="url(#card-shadow)" />
  <text x="800" y="970" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#ffffff">
    <tspan x="800" dy="0">the receiver does not trust the token blindly, it asks the API server</tspan>
    <tspan x="800" dy="34">whether the token is genuine and whose account it belongs to</tspan>
  </text>

</svg>