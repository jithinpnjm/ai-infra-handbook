<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>API server is slow: a diagnosis ladder</title>
  <desc>Visual troubleshooting ladder for diagnosed Kubernetes API server slowness, from symptoms to client fixes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">API server is slow: a diagnosis ladder</text>

  
  <rect x="50" y="105" width="1020" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="170" r="24" fill="#207448" />
  <text x="95" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <circle cx="163" cy="170" r="24" stroke="#207448" stroke-width="3.5" fill="none" />
  <polyline points="163,154 163,170 175,170" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <text x="215" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">
    <tspan font-weight="bold">Symptom: </tspan>
    <tspan>kubectl slow or timing out, 429s,</tspan>
  </text>
  <text x="215" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#303a36">or Pods Pending with free nodes</text>

  
  <line x1="560" y1="235" x2="560" y2="270" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="270" width="1020" height="170" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="355" r="24" fill="#207448" />
  <text x="95" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <rect x="145" y="337" width="36" height="36" rx="6" stroke="#207448" stroke-width="3.5" fill="none" />
  <rect x="153" y="345" width="20" height="20" rx="3" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2" />
  <line x1="152" y1="327" x2="152" y2="337" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="163" y1="327" x2="163" y2="337" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="174" y1="327" x2="174" y2="337" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="152" y1="373" x2="152" y2="383" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="163" y1="373" x2="163" y2="383" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="174" y1="373" x2="174" y2="383" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="135" y1="346" x2="145" y2="346" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="135" y1="355" x2="145" y2="355" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="135" y1="364" x2="145" y2="364" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="181" y1="346" x2="191" y2="346" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="181" y1="355" x2="191" y2="355" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="181" y1="364" x2="191" y2="364" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="215" y="306" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Check </tspan>
    <tspan font-family="ui-monospace, monospace">apiserver_request_duration_seconds</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> by verb</tspan>
  </text>
  <text x="215" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(LIST high?),</text>
  <text x="215" y="378" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">apiserver_flowcontrol_rejected_requests_total,</text>
  <text x="215" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">API server CPU and memory</text>

  
  <line x1="560" y1="440" x2="560" y2="475" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="475" width="1020" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="545" r="24" fill="#207448" />
  <text x="95" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <ellipse cx="163" cy="527" rx="22" ry="7" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 141 527 v 15 a 22 7 0 0 0 44 0 v -15" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 141 542 v 15 a 22 7 0 0 0 44 0 v -15" stroke="#207448" stroke-width="3.5" fill="none" />
  
  <text x="215" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Check etcd: </tspan>
    <tspan>WAL fsync p99 above 10 ms</tspan>
  </text>
  <text x="215" y="558" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(etcd_disk_wal_fsync_duration_seconds),</text>
  <text x="215" y="596" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">leader changes, DB size</text>

  
  <line x1="560" y1="615" x2="560" y2="650" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="650" width="1020" height="170" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="735" r="24" fill="#207448" />
  <text x="95" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <circle cx="159" cy="730" r="17" stroke="#207448" stroke-width="3.5" fill="none" />
  <line x1="172" y1="743" x2="186" y2="757" stroke="#207448" stroke-width="4.5" stroke-linecap="round" />
  <line x1="151" y1="726" x2="167" y2="726" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  <line x1="151" y1="733" x2="162" y2="733" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
  
  <text x="215" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Find the client: </tspan>
    <tspan>audit log or</tspan>
  </text>
  <text x="215" y="724" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">sum by (client, verb, resource)</text>
  <text x="215" y="760" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">(rate(apiserver_request_total[5m])),</text>
  <text x="215" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">User-Agent and IP</text>

  
  <line x1="560" y1="820" x2="560" y2="855" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="855" width="1020" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="925" r="24" fill="#207448" />
  <text x="95" y="925" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <path d="M 163 901 L 185 910 C 185 927 175 942 163 948 C 151 942 141 927 141 910 Z" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" fill="none" />
  <circle cx="163" cy="921" r="3.5" fill="#207448" />
  <line x1="163" y1="925" x2="163" y2="933" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="215" y="901" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan font-weight="bold">Mitigate: </tspan>
    <tspan>give the noisy ServiceAccount</tspan>
  </text>
  <text x="215" y="939" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif">a low-concurrency level via </tspan>
    <tspan font-family="ui-monospace, monospace">FlowSchema,</tspan>
  </text>
  <text x="215" y="977" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">or restrict with RBAC</text>

  
  <line x1="560" y1="995" x2="560" y2="1030" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <rect x="50" y="1030" width="1020" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <circle cx="95" cy="1100" r="24" fill="#207448" />
  <text x="95" y="1100" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <rect x="139" y="1079" width="48" height="42" rx="6" stroke="#207448" stroke-width="3.5" fill="none" />
  <line x1="139" y1="1091" x2="187" y2="1091" stroke="#207448" stroke-width="2.5" />
  <circle cx="147" cy="1085" r="2" fill="#207448" />
  <circle cx="153" cy="1085" r="2" fill="#207448" />
  <path d="M 153 1100 L 148 1105 L 153 1110" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 173 1100 L 178 1105 L 173 1110" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <text x="215" y="1072" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif" font-weight="bold">Fix the client: </tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif">informers, </tspan>
    <tspan font-family="ui-monospace, monospace">PartialObjectMetadata,</tspan>
  </text>
  <text x="215" y="1110" font-size="24" fill="#303a36">
    <tspan font-family="system-ui, -apple-system, sans-serif">field selectors, </tspan>
    <tspan font-family="ui-monospace, monospace">limit=500</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> pagination,</tspan>
  </text>
  <text x="215" y="1148" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">streaming lists</text>

  
  <rect x="1105" y="420" width="445" height="370" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <ellipse cx="1155" cy="465" rx="18" ry="6" stroke="#db8129" stroke-width="3.5" fill="none" />
  <path d="M 1137 465 v 13 a 18 6 0 0 0 36 0 v -13" stroke="#db8129" stroke-width="3.5" fill="none" />
  <path d="M 1137 478 v 13 a 18 6 0 0 0 36 0 v -13" stroke="#db8129" stroke-width="3.5" fill="none" />
  <circle cx="1182" cy="457" r="12" fill="#db8129" />
  <path d="M 1182 450 v 8 M 1182 461 v 2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

  
  <text x="1140" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">One slow disk can look</text>
  <text x="1140" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">like slow kubectl, leader</text>
  <text x="1140" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">flapping and webhook</text>
  <text x="1140" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">timeouts at once:</text>
  <text x="1140" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">fix the disk first</text>
</svg>