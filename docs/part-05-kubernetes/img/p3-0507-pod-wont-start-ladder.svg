<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>A pod will not start: the order of questions</title>
  <desc>Visual ladder of debugging steps for a Kubernetes pod that will not start, along with common symptoms and fixes.</desc>

  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A pod will not start: the order of questions</text>

  
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="940" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#db8129"/>
    <text x="50" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    
    <rect x="90" y="26" width="46" height="38" rx="5" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="90" y1="38" x2="136" y2="38" stroke="#207448" stroke-width="2"/>
    <path d="M 98 47 L 105 52 L 98 57" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="155" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl get pod: read the status column</text>
    <text x="40" y="105" font-family="sans-serif" font-size="24" fill="#303a36">(Pending, Init:Error, ImagePullBackOff,</text>
    <text x="40" y="145" font-family="sans-serif" font-size="24" fill="#303a36">CrashLoopBackOff, Running but 0/1 Ready)</text>
  </g>

  
  <line x1="510" y1="320" x2="510" y2="355" stroke="#207448" stroke-width="4"/>
  <polygon points="502,355 510,370 518,355" fill="#207448"/>

  
  <g transform="translate(40, 370)">
    <rect x="0" y="0" width="940" height="210" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#207448"/>
    <text x="50" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <rect x="92" y="25" width="38" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="100" y1="37" x2="122" y2="37" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="47" x2="122" y2="47" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="57" x2="116" y2="57" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="150" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl describe pod: read the Events</text>
    <text x="40" y="105" font-family="sans-serif" font-size="24" fill="#303a36">from the bottom up (Scheduled, Pulling, Pulled, Created,</text>
    <text x="40" y="145" font-family="sans-serif" font-size="24" fill="#303a36">Started, FailedScheduling, Unhealthy, OOMKilled)</text>
  </g>

  
  <line x1="510" y1="580" x2="510" y2="615" stroke="#207448" stroke-width="4"/>
  <polygon points="502,615 510,630 518,615" fill="#207448"/>

  
  <g transform="translate(40, 630)">
    <rect x="0" y="0" width="940" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#207448"/>
    <text x="50" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    
    <path d="M 104 28 C 96 28 96 38 96 42 C 96 46 92 48 90 48 C 92 48 96 50 96 54 C 96 58 96 68 104 68" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 124 28 C 132 28 132 38 132 42 C 132 46 136 48 138 48 C 136 48 132 50 132 54 C 132 58 132 68 124 68" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="155" y="48" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl get pod -o jsonpath</text>
    <text x="155" y="82" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">status.containerStatuses lastState:</text>
    <text x="40" y="145" font-family="sans-serif" font-size="24" fill="#303a36">reason and exit code</text>
  </g>

  
  <line x1="510" y1="830" x2="510" y2="865" stroke="#207448" stroke-width="4"/>
  <polygon points="502,865 510,880 518,865" fill="#207448"/>

  
  <g transform="translate(40, 880)">
    <rect x="0" y="0" width="940" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#207448"/>
    <text x="50" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

    
    <circle cx="112" cy="48" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="112,35 112,48 123,54" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="155" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl logs --previous --timestamps:</text>
    <text x="40" y="125" font-family="sans-serif" font-size="24" fill="#303a36">what the app said before it stopped</text>
  </g>

  
  <line x1="510" y1="1060" x2="510" y2="1095" stroke="#207448" stroke-width="4"/>
  <polygon points="502,1095 510,1110 518,1095" fill="#207448"/>

  
  <g transform="translate(40, 1110)">
    <rect x="0" y="0" width="940" height="210" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#207448"/>
    <text x="50" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    
    <path d="M 100 62 L 122 40 M 115 33 A 12 12 0 0 1 129 47 L 123 53 L 111 41 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="62" r="3" fill="#207448"/>

    <text x="150" y="48" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">kubectl debug -it pod</text>
    <text x="40" y="98" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">--image=nicolaka/netshoot --target=container,</text>
    <text x="40" y="150" font-family="sans-serif" font-size="24" fill="#303a36">or kubectl debug node/name</text>
  </g>

  
  <g transform="translate(1020, 120)">
    <rect x="0" y="0" width="540" height="1200" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 524 0 C 532.84 0 540 7.16 540 16 L 540 70 L 0 70 Z" fill="#207448"/>
    <text x="30" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Common Causes &amp; Actions</text>

    
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="492" height="195" rx="10" fill="#e8f1ea"/>
      <text x="20" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Insufficient nvidia.com/gpu</text>
      <text x="20" y="95" font-family="sans-serif" font-size="24" fill="#207448">-&gt; add capacity,</text>
      <text x="20" y="135" font-family="sans-serif" font-size="24" fill="#207448">tolerations, queue</text>
    </g>

    
    <g transform="translate(24, 315)">
      <rect x="0" y="0" width="492" height="165" rx="10" fill="#e8f1ea"/>
      <text x="20" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">untolerated taint</text>
      <text x="20" y="100" font-family="sans-serif" font-size="24" fill="#207448">-&gt; add toleration</text>
    </g>

    
    <g transform="translate(24, 505)">
      <rect x="0" y="0" width="492" height="205" rx="10" fill="#e8f1ea"/>
      <text x="20" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">CreateContainerConfigError</text>
      <text x="20" y="100" font-family="sans-serif" font-size="24" fill="#207448">-&gt; missing ConfigMap</text>
      <text x="20" y="145" font-family="sans-serif" font-size="24" fill="#207448">or Secret key</text>
    </g>

    
    <g transform="translate(24, 735)">
      <rect x="0" y="0" width="492" height="235" rx="10" fill="#e8f1ea"/>
      <text x="20" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">OOMKilled exit 137</text>
      <text x="20" y="95" font-family="sans-serif" font-size="24" fill="#207448">-&gt; raise memory limit,</text>
      <text x="20" y="135" font-family="sans-serif" font-size="24" fill="#207448">fewer dataloader workers,</text>
      <text x="20" y="175" font-family="sans-serif" font-size="24" fill="#207448">shm</text>
    </g>

    
    <g transform="translate(24, 995)">
      <rect x="0" y="0" width="492" height="165" rx="10" fill="#e8f1ea"/>
      <text x="20" y="45" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Running not Ready</text>
      <text x="20" y="100" font-family="sans-serif" font-size="24" fill="#207448">-&gt; readiness probe</text>
    </g>
  </g>
</svg>