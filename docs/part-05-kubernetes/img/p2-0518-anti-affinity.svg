<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" width="1600" height="990">
  <title>Keep replicas off the same node with anti-affinity</title>
  <desc>Visual explanation of Kubernetes pod anti-affinity keeping replicas on separate nodes</desc>

  
  <rect width="1600" height="990" fill="#f5f8f5"/>

  
  <text x="800" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Keep replicas off the same node with anti-affinity</text>

  
  <g id="left-panel">
    <rect x="40" y="130" width="600" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="340" y="185" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Without anti-affinity</text>

    
    <rect x="80" y="225" width="520" height="415" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="110" y="255" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="120" y1="268" x2="142" y2="268" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="278" x2="142" y2="278" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="273" r="3" fill="#207448"/>

    
    <text x="180" y="285" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Node 1</text>

    
    <g id="red-cross">
      
      <line x1="395" y1="250" x2="435" y2="290" stroke="#db8129" stroke-width="14" stroke-linecap="round"/>
      <line x1="435" y1="250" x2="395" y2="290" stroke="#db8129" stroke-width="14" stroke-linecap="round"/>
      
      <line x1="395" y1="250" x2="435" y2="290" stroke="#d32f2f" stroke-width="8" stroke-linecap="round"/>
      <line x1="435" y1="250" x2="395" y2="290" stroke="#d32f2f" stroke-width="8" stroke-linecap="round"/>
      
      <rect x="455" y="250" width="130" height="42" rx="8" fill="#d32f2f" stroke="#db8129" stroke-width="3"/>
      <text x="520" y="279" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Node fails</text>
    </g>

    
    <rect x="110" y="330" width="460" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="340" y="373" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">vLLM replica</text>

    
    <rect x="110" y="425" width="460" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="340" y="468" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">vLLM replica</text>

    
    <rect x="110" y="535" width="460" height="75" rx="8" fill="#ffffff" stroke="#d32f2f" stroke-width="2"/>
    <text x="340" y="581" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Both replicas disappear at once</text>
  </g>

  
  <g id="right-panel">
    <rect x="680" y="130" width="880" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1120" y="185" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">With podAntiAffinity on hostname</text>

    
    <rect x="710" y="215" width="820" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1120" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1120" dy="0">topologyKey: a node label that defines the domain,</tspan>
      <tspan x="1120" dy="32">here the hostname</tspan>
    </text>

    
    <g id="barrier-line">
      
      <line x1="710" y1="350" x2="1530" y2="350" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
      
      <line x1="975" y1="350" x2="975" y2="690" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="1265" y1="350" x2="1265" y2="690" stroke="#207448" stroke-width="3" stroke-dasharray="8 6"/>
      
      <rect x="830" y="325" width="580" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="1120" y="359" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Avoid nodes that already run a replica</text>
    </g>

    
    <g id="right-node-1">
      <rect x="710" y="405" width="240" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="804" y="425" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="814" y1="438" x2="836" y2="438" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="814" y1="448" x2="836" y2="448" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="844" cy="443" r="3" fill="#207448"/>
      <text x="830" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Node 1</text>
      <rect x="726" y="570" width="208" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="830" y="613" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">vLLM replica</text>
    </g>

    
    <g id="right-node-2">
      <rect x="1000" y="405" width="240" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="1094" y="425" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="1104" y1="438" x2="1126" y2="438" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="1104" y1="448" x2="1126" y2="448" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1134" cy="443" r="3" fill="#207448"/>
      <text x="1120" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Node 2</text>
      <rect x="1016" y="570" width="208" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="1120" y="613" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">vLLM replica</text>
    </g>

    
    <g id="right-node-3">
      <rect x="1290" y="405" width="240" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="1384" y="425" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="1394" y1="438" x2="1416" y2="438" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="1394" y1="448" x2="1416" y2="448" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1424" cy="443" r="3" fill="#207448"/>
      <text x="1410" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Node 3</text>
      <rect x="1306" y="570" width="208" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <text x="1410" y="613" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">vLLM replica</text>
    </g>

    
    <rect x="740" y="735" width="760" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1120" y="773" font-family="monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">requiredDuringSchedulingIgnoredDuringExecution</text>
  </g>

  
  <rect x="40" y="870" width="1520" height="75" rx="10" fill="#207448"/>
  <text x="800" y="917" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Anti-affinity expresses the opposite intent: keep the replicas apart.</text>
</svg>