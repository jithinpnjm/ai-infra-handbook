<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350" style="background-color: #f5f8f5;">
  <title>The CNI ADD call: what goes in, what comes out</title>
  <desc>Visual explanation of the Kubernetes CNI ADD operation showing inputs, plugin execution, stdout output, equivalent manual Linux network commands, and failure conditions.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-step" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 1 2 L 9 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    The CNI ADD call: what goes in, what comes out
  </text>

  
  
  

  
  <rect x="40" y="95" width="1520" height="490" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g id="inputs-group">
    
    <rect x="70" y="125" width="56" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 84 143 L 95 153 L 84 163 M 98 163 L 112 163" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="140" y="162" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      Inputs
    </text>

    
    <rect x="70" y="195" width="450" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="90" y="235" font-family="monospace" font-weight="bold" fill="#207448">stdin:</tspan>
      <tspan font-family="sans-serif"> JSON config from </tspan>
      <tspan x="90" y="275" font-family="monospace">/etc/cni/net.d</tspan>
      <tspan font-family="sans-serif"> (05-cilium.conf or</tspan>
      <tspan x="90" y="300" font-size="0" fill="transparent"> </tspan>
    </text>
    
    <text x="90" y="280" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="90" y="280" font-family="sans-serif">(05-cilium.conf or 10-calico.conflist)</tspan>
    </text>

    
    <rect x="70" y="320" width="450" height="245" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="90" y="355" font-family="monospace" font-weight="bold" fill="#207448">env:</tspan>
      <tspan font-family="monospace" font-size="24px"> CNI_COMMAND=ADD</tspan>
      <tspan x="90" y="390" font-family="sans-serif">(DEL on teardown),</tspan>
      <tspan x="90" y="425" font-family="monospace" font-size="24px">CNI_CONTAINERID,</tspan>
      <tspan x="90" y="460" font-family="monospace" font-size="24px">CNI_NETNS=/var/run/netns/cni-uuid,</tspan>
      <tspan x="90" y="495" font-family="monospace" font-size="24px">CNI_IFNAME=eth0, CNI_PATH=/opt/cni/bin,</tspan>
      <tspan x="90" y="530" font-family="monospace" font-size="24px">CNI_ARGS</tspan>
      <tspan font-family="sans-serif"> with </tspan>
      <tspan font-family="monospace" font-size="24px">K8S_POD_NAMESPACE,</tspan>
      <tspan x="90" y="555" font-family="monospace" font-size="0">K8S_POD_NAME, K8S_POD_INFRA_CONTAINER_ID</tspan>
    </text>
  </g>

  
  <path d="M 520 375 L 590 375" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  <g id="center-group">
    <rect x="605" y="125" width="470" height="440" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    
    <g transform="translate(630, 145)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
      <circle cx="28" cy="28" r="12" fill="none" stroke="#db8129" stroke-width="3" />
      <path d="M 28 8 L 28 14 M 28 42 L 28 48 M 8 28 L 14 28 M 42 28 L 48 28 M 14 14 L 18 18 M 38 38 L 42 42 M 14 42 L 18 38 M 38 14 L 42 18" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    </g>

    <text x="705" y="180" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      Runtime Execution
    </text>

    
    <rect x="625" y="225" width="430" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="645" y="265">containerd RunPodSandbox</tspan>
      <tspan x="645" y="302">runs</tspan>
      <tspan x="702" y="302" font-family="monospace" fill="#207448">/opt/cni/bin/plugin</tspan>
    </text>

    
    <rect x="625" y="385" width="430" height="155" rx="10" fill="#207448" />
    <text font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">
      <tspan x="645" y="435">wires veth pair or eBPF,</tspan>
      <tspan x="645" y="475">calls IPAM plugin</tspan>
    </text>
    
    <g transform="translate(645, 495)">
      <circle cx="15" cy="18" r="8" fill="#ffffff" />
      <circle cx="120" cy="18" r="8" fill="#ffffff" />
      <path d="M 23 18 L 112 18" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" />
      <text x="145" y="24" font-family="sans-serif" font-size="24px" fill="#ffffff">veth0 ↔ eth0</text>
    </g>
  </g>

  
  <path d="M 1075 375 L 1145 375" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="output-group">
    <rect x="1160" y="125" width="375" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1185, 145)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M 14 14 L 34 14 L 42 22 L 42 42 L 14 42 Z" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 34 14 L 34 22 L 42 22" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 20 28 L 36 28 M 20 34 L 32 34" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    </g>

    <text x="1258" y="182" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      Output
    </text>

    
    <rect x="1185" y="225" width="325" height="315" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="1205" y="270" font-family="monospace" font-weight="bold" fill="#207448">stdout JSON:</tspan>
      <tspan x="1205" y="320" font-family="monospace">cniVersion,</tspan>
      <tspan x="1205" y="365" font-family="monospace">interfaces,</tspan>
      <tspan x="1205" y="410" font-family="monospace">ips,</tspan>
      <tspan x="1205" y="455" font-family="monospace">routes,</tspan>
      <tspan x="1205" y="500" font-family="monospace">dns</tspan>
    </text>
  </g>

  
  
  

  
  <rect x="40" y="615" width="1520" height="475" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(70, 635)">
    
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 12 18 L 26 28 L 12 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 38 L 44 38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="75" y="38" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      equivalent manual commands:
    </text>
  </g>

  
  
  <rect x="70" y="710" width="440" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="745" r="20" fill="#207448" />
  <text x="105" y="753" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="140" y="752" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Create NetNS</text>
  <text x="95" y="792" font-family="monospace" font-size="24px" fill="#207448">ip netns add</text>

  
  <path d="M 510 762 L 545 762" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-step)" />

  
  
  <rect x="560" y="710" width="470" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="595" cy="745" r="20" fill="#207448" />
  <text x="595" y="753" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="630" y="752" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Create Veth Pair</text>
  <text font-family="monospace" font-size="24px" fill="#207448">
    <tspan x="585" y="792">ip link add veth0</tspan>
    <tspan x="585" y="827">type veth peer name eth0</tspan>
  </text>

  
  <path d="M 1030 762 L 1065 762" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-step)" />

  
  
  <rect x="1080" y="710" width="450" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1115" cy="745" r="20" fill="#207448" />
  <text x="1115" y="753" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1150" y="752" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Move to NetNS</text>
  <text x="1105" y="792" font-family="monospace" font-size="24px" fill="#207448">ip link set eth0 netns</text>

  
  
  
  <rect x="70" y="890" width="440" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="925" r="20" fill="#207448" />
  <text x="105" y="933" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="140" y="932" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Assign Pod IP</text>
  <text font-family="monospace" font-size="24px" fill="#207448">
    <tspan x="90" y="972">ip netns exec ...</tspan>
    <tspan x="90" y="1007">ip addr add</tspan>
    <tspan x="90" y="1040">pod_ip/24 dev eth0</tspan>
  </text>

  
  <path d="M 510 972 L 545 972" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-step)" />

  
  
  <rect x="560" y="890" width="470" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="595" cy="925" r="20" fill="#207448" />
  <text x="595" y="933" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="630" y="932" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Bring Up Link</text>
  <text x="585" y="990" font-family="monospace" font-size="24px" fill="#207448">ip link set dev eth0 up</text>

  
  <path d="M 1030 972 L 1065 972" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-step)" />

  
  
  <rect x="1080" y="890" width="450" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="1115" cy="925" r="20" fill="#207448" />
  <text x="1115" y="933" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1150" y="932" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Default Gateway</text>
  <text font-family="monospace" font-size="24px" fill="#207448">
    <tspan x="1105" y="972">ip route add default</tspan>
    <tspan x="1105" y="1007">via gw_ip</tspan>
  </text>

  
  <g transform="translate(850, 638)">
    <rect x="0" y="0" width="670" height="50" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="20" y="33" font-family="sans-serif" font-size="24px" fill="#303a36">
      needs <tspan font-family="monospace" font-weight="bold" fill="#207448">net.ipv4.ip_forward = 1</tspan>
    </text>
  </g>

  
  
  

  <g id="failure-box">
    
    <rect x="40" y="1115" width="1520" height="195" rx="16" fill="#ffffff" stroke="#c0392b" stroke-width="2" />

    
    <g transform="translate(70, 1135)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#fdeeed" stroke="#c0392b" stroke-width="3" />
      <path d="M 28 12 L 46 44 L 10 44 Z" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" />
      <path d="M 28 25 L 28 33 M 28 38 L 28 40" stroke="#c0392b" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="145" y="1170" font-family="monospace" font-size="28px" font-weight="bold" fill="#c0392b">FailedCreatePodSandBox:</tspan>
      <tspan x="145" y="1215">missing CNI binary or config, exhausted IP pool,</tspan>
      <tspan x="145" y="1255">corrupted IPAM state, MTU or route conflict,</tspan>
      <tspan x="145" y="1295">CNI agent not started (node NotReady)</tspan>
    </text>
  </g>

</svg>