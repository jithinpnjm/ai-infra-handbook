<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>A startup probe holds the other two probes back until the server is up</title>
  <desc>Horizontal timeline illustrating how Kubernetes startupProbe guards slow-starting containers before liveness and readiness probes take over.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    A startup probe holds the other two probes back until the server is up
  </text>

  
  <g transform="translate(1470, 30)">
    <rect x="0" y="0" width="60" height="50" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="60" y2="16" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="8" r="3" fill="#207448" />
    <circle cx="24" cy="8" r="3" fill="#207448" />
    <circle cx="36" cy="8" r="3" fill="#207448" />
  </g>

  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="760" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" />
    <text x="380" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      liveness and readiness probes are not run during this window
    </text>
  </g>

  
  <g transform="translate(60, 200)">
    
    <rect x="0" y="0" width="760" height="420" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />

    
    <g transform="translate(36, 32)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>

    
    <text x="110" y="68" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">
      startupProbe window
    </text>

    
    
    <g transform="translate(40, 130)">
      <rect x="0" y="0" width="680" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="45" cy="45" r="22" fill="#207448" />
      <text x="45" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="90" y="53" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">periodSeconds 10</text>
    </g>

    
    <g transform="translate(40, 245)">
      <rect x="0" y="0" width="680" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="45" cy="45" r="22" fill="#207448" />
      <text x="45" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="90" y="53" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">failureThreshold 30</text>
    </g>

    
    <line x1="40" y1="375" x2="720" y2="375" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="40" cy="375" r="8" fill="#207448" />
    <circle cx="210" cy="375" r="8" fill="#207448" />
    <circle cx="380" cy="375" r="8" fill="#207448" />
    <circle cx="550" cy="375" r="8" fill="#207448" />
    <circle cx="720" cy="375" r="8" fill="#207448" />
  </g>

  
  
  <path d="M 820 330 L 910 330" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />

  
  <g transform="translate(850, 240)">
    <rect x="0" y="0" width="310" height="60" rx="8" fill="#207448" />
    <text x="155" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      startupProbe succeeds
    </text>
  </g>

  
  <path d="M 750 620 L 750 720 L 840 720" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(850, 660)">
    <rect x="0" y="0" width="690" height="120" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    <rect x="0" y="0" width="16" height="120" rx="4" fill="#db8129" />
    <text x="40" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      startupProbe never succeeds, the kubelet kills
    </text>
    <text x="40" y="88" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      the container and restartPolicy decides next
    </text>
  </g>

  
  
  <g transform="translate(930, 310)">
    <rect x="0" y="0" width="610" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <text x="30" y="45" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      livenessProbe, checks every 10 seconds
    </text>
    
    <rect x="30" y="68" width="550" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="50" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      three failures restart the container
    </text>
  </g>

  
  <g transform="translate(930, 480)">
    <rect x="0" y="0" width="610" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <text x="30" y="45" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      readinessProbe, checks every 5 seconds
    </text>
    
    <rect x="30" y="68" width="550" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="50" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      failure removes the pod from Service endpoints
    </text>
  </g>

  
  <path d="M 880 330 L 880 555 L 920 555" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(60, 830)">
    <line x1="0" y1="30" x2="1470" y2="30" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-axis)" />
    
    <line x1="2" y1="18" x2="2" y2="42" stroke="#303a36" stroke-width="4" />
    <line x1="760" y1="18" x2="760" y2="42" stroke="#303a36" stroke-width="4" />
    
    <rect x="470" y="5" width="460" height="50" rx="25" fill="#f5f8f5" stroke="#303a36" stroke-width="2" />
    <text x="700" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      time after container start
    </text>
  </g>

  
  <g transform="translate(60, 960)">
    <rect x="0" y="0" width="1480" height="90" rx="16" fill="#207448" />
    <text x="740" y="54" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
      the startup probe covers the slow start alone and then steps aside.
    </text>
  </g>
</svg>