<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Taint effects and the failover timer</title>
  <desc>Visual explanation of Kubernetes taint effects, commands, toleration examples, system taints, and failover timer configuration.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Taint effects and the failover timer</text>

  
  <rect x="40" y="115" width="1040" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="135" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="65" y1="152" x2="121" y2="152" stroke="#207448" stroke-width="3" />
  <line x1="93" y1="152" x2="93" y2="185" stroke="#207448" stroke-width="3" />

  
  <text x="140" y="172" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Table of taint key=value:effect</text>

  
  <rect x="65" y="200" width="990" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">kubectl taint nodes gpu-node-1 nvidia.com/gpu=present:NoSchedule</text>
  <text x="85" y="282" font-family="sans-serif" font-size="24" fill="#303a36">same with trailing minus to remove</text>
  <text x="85" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">kubectl taint nodes gpu-node-2 maintenance=true:NoExecute</text>

  
  <rect x="65" y="365" width="990" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="406" font-family="sans-serif" font-size="24" fill="#303a36">NoSchedule: stops new pods from being scheduled onto the node</text>

  <rect x="65" y="445" width="990" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="486" font-family="sans-serif" font-size="24" fill="#303a36">PreferNoSchedule: only a soft preference</text>

  <rect x="65" y="525" width="990" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="85" y="566" font-family="sans-serif" font-size="24" fill="#303a36">NoExecute: also evicts running pods that do not tolerate it</text>

  
  <rect x="1105" y="115" width="455" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1135" y="138" width="56" height="20" rx="5" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="1150" cy="148" r="3" fill="#207448" />
  <rect x="1135" y="165" width="56" height="20" rx="5" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="1150" cy="175" r="3" fill="#207448" />

  
  <text x="1135" y="228" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1135" dy="0" font-weight="bold" fill="#207448">system-added taints: </tspan>
    <tspan x="1135" dy="38">not-ready, unreachable, </tspan>
    <tspan x="1135" dy="38">memory-pressure, </tspan>
    <tspan x="1135" dy="38">disk-pressure, pid-pressure, </tspan>
    <tspan x="1135" dy="38">network-unavailable, </tspan>
    <tspan x="1135" dy="38">unschedulable </tspan>
    <tspan x="1135" dy="38">(cordoned node)</tspan>
  </text>

  
  <rect x="40" y="655" width="650" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="685" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
  <rect x="84" y="699" width="28" height="28" rx="4" fill="#207448" />
  <line x1="78" y1="679" x2="78" y2="685" stroke="#207448" stroke-width="4" />
  <line x1="98" y1="679" x2="98" y2="685" stroke="#207448" stroke-width="4" />
  <line x1="118" y1="679" x2="118" y2="685" stroke="#207448" stroke-width="4" />
  <line x1="78" y1="741" x2="78" y2="747" stroke="#207448" stroke-width="4" />
  <line x1="98" y1="741" x2="98" y2="747" stroke="#207448" stroke-width="4" />
  <line x1="118" y1="741" x2="118" y2="747" stroke="#207448" stroke-width="4" />

  <rect x="65" y="765" width="600" height="210" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="90" y="825" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
    <tspan x="90" dy="0">key nvidia.com/gpu </tspan>
    <tspan x="90" dy="46">operator Exists </tspan>
    <tspan x="90" dy="46">effect NoSchedule</tspan>
  </text>

  
  <rect x="715" y="655" width="845" height="345" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />

  
  <circle cx="773" cy="713" r="24" fill="none" stroke="#db8129" stroke-width="4" />
  <line x1="773" y1="713" x2="773" y2="697" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="773" y1="713" x2="787" y2="713" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="773" y1="684" x2="773" y2="689" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

  <rect x="740" y="765" width="795" height="210" rx="10" fill="#fdfaf6" stroke="#db8129" stroke-width="1.5" />
  <text x="765" y="805" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="765" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">key node.kubernetes.io/unreachable </tspan>
    <tspan x="765" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">operator Exists effect NoExecute </tspan>
    <tspan x="765" dy="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold" fill="#db8129">tolerationSeconds 60: </tspan>
    <tspan x="765" dy="38">faster failover than the default 300, at the </tspan>
    <tspan x="765" dy="38">cost of moving pods sooner on a brief network blip</tspan>
  </text>

  
  <rect x="40" y="1025" width="1520" height="145" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <path d="M93 1055 L121 1067 L121 1092 C121 1109 93 1118 93 1118 C93 1118 65 1109 65 1092 L65 1067 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

  
  <text x="145" y="1068" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">ExtendedResourceToleration admission plugin can add the nvidia.com/gpu toleration automatically; </tspan>
    <tspan x="145" dy="36">a dedicated pool still needs a node label and nodeSelector or affinity </tspan>
    <tspan x="145" dy="36">because a toleration only permits</tspan>
  </text>
</svg>