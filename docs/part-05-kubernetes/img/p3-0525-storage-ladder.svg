<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Storage fault ladder on the node</title>
  <desc>Triage ladder for diagnosing node storage faults from broad volume mounts down to narrow stuck processes, including commands and diagnostic notes.</desc>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="70" y="74" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Storage fault ladder on the node</text>
  
  
  <rect x="1200" y="38" width="330" height="48" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1365" y="71" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Ladder, broad to narrow</text>

  
  <line x1="55" y1="120" x2="145" y2="890" stroke="#c8dcd0" stroke-width="8" stroke-linecap="round" />
  <line x1="1545" y1="120" x2="1455" y2="890" stroke="#c8dcd0" stroke-width="8" stroke-linecap="round" />

  
  
  <g id="rung-1">
    <rect x="70" y="115" width="1460" height="195" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    
    
    <circle cx="115" cy="155" r="24" fill="#db8129" />
    <text x="115" y="164" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <text x="155" y="164" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Rung 1</text>
    
    
    <g transform="translate(275, 127)">
      <path d="M 4 12 L 18 12 L 24 18 L 52 18 C 54 18 56 20 56 22 L 56 46 C 56 48 54 50 52 50 L 4 50 C 2 50 0 48 0 46 L 0 16 C 0 14 2 12 4 12 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 28 30 L 28 44 M 21 37 L 28 44 L 35 37" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    
    <text x="350" y="164" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is the volume mounted where the pod expects:</text>
    
    
    <rect x="95" y="185" width="1410" height="110" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
    <text x="120" y="220" font-family="monospace" font-size="24" fill="#303a36">findmnt -T /var/lib/kubelet/pods/UID/volumes/kubernetes.io~csi/PV/mount;</text>
    <text x="120" y="254" font-family="monospace" font-size="24" fill="#303a36">findmnt -R /var/lib/kubelet; kubectl get volumeattachment;</text>
    <text x="120" y="284" font-family="monospace" font-size="24" fill="#303a36">kubectl get pv,pvc -A | grep -v Bound</text>
  </g>

  
  <g id="rung-2">
    <rect x="100" y="325" width="1400" height="185" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="145" cy="365" r="24" fill="#207448" />
    <text x="145" y="374" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <text x="185" y="374" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Rung 2</text>
    
    
    <g transform="translate(305, 337)">
      <ellipse cx="28" cy="14" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 4 14 L 4 42 C 4 46.5 14.7 50 28 50 C 41.3 50 52 46.5 52 42 L 52 14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 4 28 C 4 32.5 14.7 36 28 36 C 41.3 36 52 32.5 52 28" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>
    
    
    <text x="380" y="374" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is the filesystem full, by bytes or by inodes:</text>
    
    
    <rect x="125" y="395" width="1350" height="100" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
    <text x="150" y="432" font-family="monospace" font-size="24" fill="#303a36">df -hT, df -i, lsblk -f, blkid;</text>
    <text x="630" y="432" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">read-only after kernel errors:</text>
    <text x="150" y="472" font-family="monospace" font-size="24" fill="#303a36">dmesg -T | grep ext4 xfs nfs lustre blk_update_request I/O error nvme</text>
  </g>

  
  <g id="rung-3">
    <rect x="130" y="525" width="1340" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="175" cy="565" r="24" fill="#207448" />
    <text x="175" y="574" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <text x="215" y="574" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Rung 3</text>
    
    
    <g transform="translate(335, 537)">
      <path d="M 8 44 A 24 24 0 1 1 48 44" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="28" y1="34" x2="40" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="34" r="4" fill="#207448" />
    </g>
    
    
    <text x="410" y="574" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is I/O slow:</text>
    
    
    <rect x="155" y="595" width="1290" height="90" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
    <text x="180" y="632" font-family="monospace" font-size="24" fill="#303a36">iostat -x 1 5, pidstat -d, cat /proc/pressure/io, iotop, nfsstat -c, mountstats;</text>
    <text x="180" y="666" font-family="monospace" font-size="24" fill="#303a36">measure with fio randread bs 4k iodepth 32 direct</text>
  </g>

  
  <g id="rung-4">
    <rect x="160" y="715" width="1280" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="205" cy="755" r="24" fill="#207448" />
    <text x="205" y="764" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <text x="245" y="764" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Rung 4</text>
    
    
    <g transform="translate(365, 727)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    
    
    <text x="440" y="764" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Is a process stuck:</text>
    
    
    <rect x="185" y="785" width="1230" height="90" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
    <text x="210" y="822" font-family="monospace" font-size="24" fill="#303a36">ps -eo pid,stat,wchan:30,cmd | awk state D (uninterruptible sleep);</text>
    <text x="210" y="856" font-family="monospace" font-size="24" fill="#303a36">cat /proc/PID/stack</text>
  </g>

  
  <g id="notes-container">
    <rect x="70" y="905" width="1460" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(95, 920)">
      <rect x="4" y="4" width="28" height="34" rx="3" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="10" y1="13" x2="26" y2="13" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="10" y1="20" x2="26" y2="20" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      <line x1="10" y1="27" x2="20" y2="27" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    </g>
    
    
    <text x="145" y="948" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Notes:</text>
    
    
    <g id="note-1">
      <rect x="95" y="968" width="415" height="180" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="115" y="1020">a missing, read-only or</tspan>
        <tspan x="115" y="1062">hung mount blocks the app</tspan>
        <tspan x="115" y="1104">before it reads a byte</tspan>
      </text>
    </g>

    
    <g id="note-2">
      <rect x="530" y="968" width="580" height="180" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="550" y="1020">a filesystem can turn read-only after</tspan>
        <tspan x="550" y="1062">the kernel detects errors and the app</tspan>
        <tspan x="550" y="1104">then reports odd write failures</tspan>
      </text>
    </g>

    
    <g id="note-3">
      <rect x="1130" y="968" width="375" height="180" rx="8" fill="#ffffff" stroke="#c8dcd0" stroke-width="1.5" />
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1150" y="1038">NFS and Lustre hangs</tspan>
        <tspan x="1150" y="1084">usually show as D-state</tspan>
      </text>
    </g>
  </g>
</svg>