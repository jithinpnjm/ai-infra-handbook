<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Kueue objects from team quota to a running Job</title>
  <desc>Visual diagram of Kueue architecture from ResourceFlavor and ClusterQueue to LocalQueue, Job admission, Workload creation, and pod scheduling.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448">
    Kueue objects from team quota to a running Job
  </text>

  

  
  <g transform="translate(60, 100)">
    <rect width="700" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="25" y="25" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 15 37 L 25 37 M 15 49 L 25 49 M 15 61 L 25 61" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 73 37 L 83 37 M 73 49 L 83 49 M 73 61 L 83 61" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 37 15 L 37 25 M 49 15 L 49 25 M 61 15 L 61 25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 37 73 L 37 83 M 49 73 L 49 83 M 61 73 L 61 83" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="49" cy="49" r="8" fill="#207448" />

    
    <text x="95" y="58" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      ResourceFlavor h100-ondemand:
    </text>
    <text x="30" y="112" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="30" dy="0">nodeLabels nvidia.com/gpu.product</tspan>
      <tspan x="30" dy="36">NVIDIA-H100-80GB-HBM3 and pool h100-ondemand,</tspan>
      <tspan x="30" dy="36">plus the nvidia.com/gpu toleration,</tspan>
      <tspan x="30" dy="36" font-family="sans-serif">injected into admitted workloads</tspan>
    </text>
  </g>

  
  <g transform="translate(840, 100)">
    <rect width="700" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="50" cy="50" r="18" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 50 20 L 50 32 M 50 68 L 50 80 M 20 50 L 32 50 M 68 50 L 80 50 M 29 29 L 38 38 M 62 62 L 71 71 M 29 71 L 38 62 M 62 38 L 71 29" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="95" y="58" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      ClusterQueue research:
    </text>
    <text x="30" y="116" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="30" dy="0">cohortName gpu-fleet,</tspan>
      <tspan x="30" dy="38">queueingStrategy BestEffortFIFO,</tspan>
      <tspan x="30" dy="38">namespaceSelector team research,</tspan>
      <tspan x="30" dy="38" font-family="sans-serif">quota per flavor</tspan>
    </text>
  </g>

  
  <path d="M 760 215 L 836 215" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(60, 390)">
    <rect width="700" height="250" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    
    <rect x="25" y="25" width="50" height="42" rx="4" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="25" y1="39" x2="75" y2="39" stroke="#db8129" stroke-width="3" />
    <circle cx="34" cy="32" r="2.5" fill="#db8129" />
    <circle cx="42" cy="32" r="2.5" fill="#db8129" />

    
    <text x="90" y="56" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      Job pretrain-llama in research-ns:
    </text>
    <text x="30" y="108" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="30" dy="0">labels kueue.x-k8s.io/queue-name research-gpu</tspan>
      <tspan x="30" dy="36">and priority-class training-normal;</tspan>
      <tspan x="30" dy="36">spec.suspend true, parallelism 8,</tspan>
      <tspan x="30" dy="36">completions 8,</tspan>
      <tspan x="200" dy="0" font-family="sans-serif">8-GPU pods</tspan>
    </text>
  </g>

  
  <g transform="translate(840, 390)">
    <rect width="700" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="25" y="25" width="50" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="25" y="43" width="50" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
    <rect x="25" y="61" width="50" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />

    
    <text x="90" y="56" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      LocalQueue research-gpu
    </text>
    <text x="30" y="125" font-family="monospace" font-size="24px" fill="#303a36">
      <tspan x="30" dy="0">in namespace research-ns,</tspan>
      <tspan x="30" dy="42">clusterQueue research</tspan>
    </text>
  </g>

  
  <path d="M 760 515 L 836 515" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 1190 390 L 1190 334" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  <g transform="translate(60, 680)">
    <rect width="1480" height="450" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="40" y="50" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      Steps:
    </text>

    
    <g transform="translate(40, 75)">
      <circle cx="28" cy="24" r="24" fill="#207448" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">1</text>
      <text x="70" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        Job created suspended, so no pods exist;
      </text>
    </g>

    
    <g transform="translate(40, 145)">
      <circle cx="28" cy="24" r="24" fill="#207448" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">2</text>
      <text x="70" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        Kueue builds a Workload;
      </text>
    </g>

    
    <g transform="translate(40, 215)">
      <circle cx="28" cy="24" r="24" fill="#207448" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">3</text>
      <text x="70" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        quota available in the flavor admits the whole Workload;
      </text>
    </g>

    
    <g transform="translate(40, 285)">
      <circle cx="28" cy="24" r="24" fill="#207448" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">4</text>
      <text x="70" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        Kueue unsuspends the Job and injects node labels and tolerations;
      </text>
    </g>

    
    <g transform="translate(40, 355)">
      <circle cx="28" cy="24" r="24" fill="#207448" />
      <text x="28" y="33" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">5</text>
      <text x="70" y="32" font-family="sans-serif" font-size="24px" fill="#303a36">
        kube-scheduler places the pods
      </text>
    </g>
  </g>

  

  
  <g transform="translate(60, 1160)">
    <rect width="1480" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="35" y="55" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">
      Analogy:
    </text>
    <text x="175" y="55" font-family="sans-serif" font-size="26px" fill="#303a36">
      Kueue is the admissions office, the scheduler is the registrar assigning classrooms
    </text>
  </g>

  
  <g transform="translate(60, 1275)">
    <rect width="1480" height="95" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
    <text x="35" y="58" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#db8129">
      Note:
    </text>
    <text x="130" y="58" font-family="sans-serif" font-size="25px" fill="#303a36">
      for a Pending Kueue job start with <tspan font-family="monospace" font-weight="bold" fill="#207448">kubectl describe workload</tspan>: until admitted, the pods do not exist
    </text>
  </g>

</svg>