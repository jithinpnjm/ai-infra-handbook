<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Kueue objects from team quota to a running Job</title>
  <desc>Architecture infographic illustrating Kueue object relationships between ResourceFlavor, ClusterQueue, LocalQueue, Job, the 5-step admission lifecycle, and the admissions office analogy.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="60" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Kueue objects from team quota to a running Job</text>

  

  
  <g transform="translate(60, 90)">
    <rect width="700" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 24)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="6" />
      <line x1="0" y1="18" x2="56" y2="18" />
      <circle cx="12" cy="9" r="2.5" fill="#207448" />
      <circle cx="22" cy="9" r="2.5" fill="#207448" />
      <path d="M 12 34 L 20 40 L 12 46" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="46" x2="42" y2="46" stroke-linecap="round" />
    </g>
    
    <text x="96" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Job pretrain-llama in research-ns:</text>
    <text x="24" y="94" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">labels <tspan font-family="monospace">kueue.x-k8s.io/queue-name research-gpu</tspan></tspan>
      <tspan x="24" dy="30">and priority-class training-normal;</tspan>
      <tspan x="24" dy="30"><tspan font-family="monospace">spec.suspend true</tspan>, parallelism 8, completions 8, 8-GPU pods</tspan>
    </text>
  </g>

  
  <g transform="translate(840, 90)">
    <rect width="700" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 24)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="10" y="10" width="36" height="36" rx="4" />
      <rect x="19" y="19" width="18" height="18" fill="#207448" fill-opacity="0.15" />
      <line x1="18" y1="0" x2="18" y2="10" />
      <line x1="28" y1="0" x2="28" y2="10" />
      <line x1="38" y1="0" x2="38" y2="10" />
      <line x1="18" y1="46" x2="18" y2="56" />
      <line x1="28" y1="46" x2="28" y2="56" />
      <line x1="38" y1="46" x2="38" y2="56" />
      <line x1="0" y1="18" x2="10" y2="18" />
      <line x1="0" y1="28" x2="10" y2="28" />
      <line x1="0" y1="38" x2="10" y2="38" />
      <line x1="46" y1="18" x2="56" y2="18" />
      <line x1="46" y1="28" x2="56" y2="28" />
      <line x1="46" y1="38" x2="56" y2="38" />
    </g>
    
    <text x="96" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ResourceFlavor h100-ondemand:</text>
    <text x="24" y="94" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">nodeLabels <tspan font-family="monospace">nvidia.com/gpu.product NVIDIA-H100-80GB-HBM3</tspan></tspan>
      <tspan x="24" dy="30">and pool <tspan font-family="monospace">h100-ondemand</tspan>, plus the <tspan font-family="monospace">nvidia.com/gpu</tspan> toleration,</tspan>
      <tspan x="24" dy="30">injected into admitted workloads</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 330)">
    <rect width="700" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 24)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="4" y="6" width="48" height="11" rx="3" />
      <rect x="4" y="22" width="48" height="11" rx="3" />
      <rect x="4" y="38" width="48" height="11" rx="3" />
    </g>
    
    <text x="96" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">LocalQueue research-gpu</text>
    <text x="24" y="104" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">in namespace research-ns,</tspan>
      <tspan x="24" dy="34">clusterQueue research</tspan>
    </text>
  </g>

  
  <g transform="translate(840, 330)">
    <rect width="700" height="190" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(24, 24)" stroke="#db8129" stroke-width="3.5" fill="none">
      <rect x="18" y="4" width="20" height="14" rx="3" />
      <rect x="4" y="38" width="20" height="14" rx="3" />
      <rect x="32" y="38" width="20" height="14" rx="3" />
      <path d="M 28 18 L 28 28 M 14 38 L 14 28 L 42 28 L 42 38" />
    </g>
    
    <text x="96" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ClusterQueue research:</text>
    <text x="24" y="96" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">cohortName gpu-fleet, queueingStrategy BestEffortFIFO,</tspan>
      <tspan x="24" dy="32">namespaceSelector team research, quota per flavor</tspan>
    </text>
  </g>

  
  
  <line x1="1190" y1="280" x2="1190" y2="328" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <line x1="760" y1="425" x2="838" y2="425" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  <g transform="translate(60, 560)">
    <rect width="280" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="44" r="24" fill="#207448" />
    <text x="140" y="53" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="20" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" dy="0">Job created</tspan>
      <tspan x="20" dy="30">suspended, so</tspan>
      <tspan x="20" dy="30">no pods exist</tspan>
    </text>
  </g>

  
  <g transform="translate(360, 560)">
    <rect width="280" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="44" r="24" fill="#207448" />
    <text x="140" y="53" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="20" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" dy="0">Kueue builds</tspan>
      <tspan x="20" dy="30">a Workload</tspan>
    </text>
  </g>

  
  <g transform="translate(660, 560)">
    <rect width="280" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="44" r="24" fill="#207448" />
    <text x="140" y="53" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="20" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" dy="0">quota available</tspan>
      <tspan x="20" dy="30">in the flavor</tspan>
      <tspan x="20" dy="30">admits the</tspan>
      <tspan x="20" dy="30">whole Workload</tspan>
    </text>
  </g>

  
  <g transform="translate(960, 560)">
    <rect width="280" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="44" r="24" fill="#207448" />
    <text x="140" y="53" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="20" y="102" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" dy="0">Kueue unsuspends</tspan>
      <tspan x="20" dy="28">the Job and</tspan>
      <tspan x="20" dy="28">injects node</tspan>
      <tspan x="20" dy="28">labels and</tspan>
      <tspan x="20" dy="28">tolerations</tspan>
    </text>
  </g>

  
  <g transform="translate(1260, 560)">
    <rect width="280" height="260" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="140" cy="44" r="24" fill="#207448" />
    <text x="140" y="53" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="20" y="106" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="20" dy="0" font-family="monospace">kube-scheduler</tspan>
      <tspan x="20" dy="30">places the pods</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 850)">
    <rect width="1480" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(24, 18)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 4 14 L 28 4 L 52 14 Z" />
      <line x1="2" y1="14" x2="54" y2="14" />
      <line x1="10" y1="14" x2="10" y2="44" />
      <line x1="22" y1="14" x2="22" y2="44" />
      <line x1="34" y1="14" x2="34" y2="44" />
      <line x1="46" y1="14" x2="46" y2="44" />
      <line x1="4" y1="44" x2="52" y2="44" />
      <line x1="0" y1="50" x2="56" y2="50" />
    </g>
    <text x="100" y="54" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Kueue is the admissions office, the scheduler is the registrar assigning classrooms</text>
  </g>

  
  <g transform="translate(60, 965)">
    <rect width="1480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(24, 27)" stroke="#207448" stroke-width="3.5" fill="none">
      <circle cx="28" cy="28" r="26" />
      <line x1="28" y1="24" x2="28" y2="42" />
      <circle cx="28" cy="14" r="2.5" fill="#207448" />
    </g>
    <text x="100" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="100" dy="0">for a Pending Kueue job start with <tspan font-family="monospace">kubectl describe workload</tspan>:</tspan>
      <tspan x="100" dy="32">until admitted, the pods do not exist</tspan>
    </text>
  </g>
</svg>