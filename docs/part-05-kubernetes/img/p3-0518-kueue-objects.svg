<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Kueue objects from team quota to a running Job</title>
  <desc>Visual infographic explaining Kueue objects: ResourceFlavor, ClusterQueue, LocalQueue, Job suspension, Workload admission, and pod scheduling.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5"/>

  
  <text x="60" y="58" font-family="system-ui, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Kueue objects from team quota to a running Job</text>

  
  <g>
    <rect x="60" y="85" width="1480" height="56" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M 85 122 L 105 102 L 125 122 Z M 92 122 L 92 130 M 105 122 L 105 130 M 118 122 L 118 130 M 82 130 L 128 130" stroke="#207448" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <text x="145" y="122" font-family="system-ui, sans-serif" font-size="25" font-weight="600" fill="#207448">Kueue is the admissions office, the scheduler is the registrar assigning classrooms</text>
  </g>

  

  
  <g>
    <rect x="60" y="165" width="700" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="85" y="185" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="98" y="198" width="20" height="20" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="85" y1="198" x2="76" y2="198" stroke="#207448" stroke-width="3"/>
    <line x1="85" y1="218" x2="76" y2="218" stroke="#207448" stroke-width="3"/>
    <line x1="131" y1="198" x2="140" y2="198" stroke="#207448" stroke-width="3"/>
    <line x1="131" y1="218" x2="140" y2="218" stroke="#207448" stroke-width="3"/>
    <line x1="98" y1="185" x2="98" y2="176" stroke="#207448" stroke-width="3"/>
    <line x1="118" y1="185" x2="118" y2="176" stroke="#207448" stroke-width="3"/>
    <line x1="98" y1="231" x2="98" y2="240" stroke="#207448" stroke-width="3"/>
    <line x1="118" y1="231" x2="118" y2="240" stroke="#207448" stroke-width="3"/>

    
    <text x="155" y="217" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">ResourceFlavor h100-ondemand:</text>

    
    <text x="85" y="265" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">nodeLabels nvidia.com/gpu.product</tspan>
      <tspan x="85" dy="32">NVIDIA-H100-80GB-HBM3 and pool h100-ondemand,</tspan>
      <tspan x="85" dy="32" font-family="system-ui, sans-serif">plus the nvidia.com/gpu toleration,</tspan>
      <tspan x="85" dy="32" font-family="system-ui, sans-serif">injected into admitted workloads</tspan>
    </text>
  </g>

  
  <line x1="760" y1="282" x2="835" y2="282" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g>
    <rect x="840" y="165" width="700" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="865" y="186" width="46" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="865" y="203" width="46" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="865" y="220" width="46" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="875" cy="192" r="2" fill="#207448"/>
    <circle cx="875" cy="209" r="2" fill="#207448"/>
    <circle cx="875" cy="226" r="2" fill="#207448"/>

    
    <text x="935" y="217" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">ClusterQueue research:</text>

    
    <text x="865" y="265" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="865" dy="0">cohortName gpu-fleet,</tspan>
      <tspan x="865" dy="32">queueingStrategy BestEffortFIFO,</tspan>
      <tspan x="865" dy="32">namespaceSelector team research,</tspan>
      <tspan x="865" dy="32" font-family="system-ui, sans-serif">quota per flavor</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="440" width="700" height="255" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <rect x="85" y="460" width="48" height="42" rx="5" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="85" y1="473" x2="133" y2="473" stroke="#207448" stroke-width="2.5"/>
    <circle cx="95" cy="466" r="2" fill="#207448"/>
    <circle cx="102" cy="466" r="2" fill="#207448"/>
    <path d="M 95 484 L 102 490 L 95 496 M 106 496 L 116 496" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    
    <text x="155" y="492" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">Job pretrain-llama in research-ns:</text>

    
    <text x="85" y="538" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">labels kueue.x-k8s.io/queue-name research-gpu</tspan>
      <tspan x="85" dy="32">and priority-class training-normal;</tspan>
      <tspan x="85" dy="32">spec.suspend true, parallelism 8, completions 8,</tspan>
      <tspan x="85" dy="32" font-family="system-ui, sans-serif">8-GPU pods</tspan>
    </text>
  </g>

  
  <line x1="1190" y1="440" x2="1190" y2="405" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g>
    <rect x="840" y="440" width="700" height="255" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 865 466 L 885 466 L 893 474 L 913 474 L 913 502 L 865 502 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="875" y1="486" x2="903" y2="486" stroke="#207448" stroke-width="2.5"/>
    <line x1="875" y1="493" x2="897" y2="493" stroke="#207448" stroke-width="2.5"/>

    
    <text x="935" y="492" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#207448">LocalQueue research-gpu</text>
    <text x="865" y="546" font-family="system-ui, sans-serif" font-size="25" fill="#303a36">
      <tspan x="865" dy="0">in namespace research-ns,</tspan>
      <tspan x="865" dy="36" font-family="ui-monospace, monospace">clusterQueue research</tspan>
    </text>
  </g>

  

  
  <g>
    <rect x="60" y="730" width="1480" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="102" cy="766" r="24" fill="#207448"/>
    <text y="774" font-family="system-ui, sans-serif" font-size="24">
      <tspan x="102" text-anchor="middle" fill="#ffffff" font-weight="bold">1</tspan>
      <tspan x="145" text-anchor="start" fill="#303a36">Job created suspended, so no pods exist</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="816" width="1480" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="102" cy="852" r="24" fill="#207448"/>
    <text y="860" font-family="system-ui, sans-serif" font-size="24">
      <tspan x="102" text-anchor="middle" fill="#ffffff" font-weight="bold">2</tspan>
      <tspan x="145" text-anchor="start" fill="#303a36">Kueue builds a Workload</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="902" width="1480" height="72" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="2.5"/>
    <circle cx="102" cy="938" r="24" fill="#db8129"/>
    <text y="946" font-family="system-ui, sans-serif" font-size="24">
      <tspan x="102" text-anchor="middle" fill="#ffffff" font-weight="bold">3</tspan>
      <tspan x="145" text-anchor="start" fill="#303a36" font-weight="bold">quota available in the flavor admits the whole Workload</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="988" width="1480" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="102" cy="1024" r="24" fill="#207448"/>
    <text y="1032" font-family="system-ui, sans-serif" font-size="24">
      <tspan x="102" text-anchor="middle" fill="#ffffff" font-weight="bold">4</tspan>
      <tspan x="145" text-anchor="start" fill="#303a36">Kueue unsuspends the Job and injects node labels and tolerations</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="1074" width="1480" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="102" cy="1110" r="24" fill="#207448"/>
    <text y="1118" font-family="system-ui, sans-serif" font-size="24">
      <tspan x="102" text-anchor="middle" fill="#ffffff" font-weight="bold">5</tspan>
      <tspan x="145" text-anchor="start" fill="#303a36">kube-scheduler places the pods</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="1175" width="1480" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="85" y="1195" width="46" height="42" rx="6" fill="#207448"/>
    <path d="M 96 1210 L 104 1216 L 96 1222 M 107 1222 L 118 1222" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="148" y="1228" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan>for a Pending Kueue job start with </tspan>
      <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">kubectl describe workload</tspan>
      <tspan>: until admitted, the pods do not exist</tspan>
    </text>
  </g>
</svg>