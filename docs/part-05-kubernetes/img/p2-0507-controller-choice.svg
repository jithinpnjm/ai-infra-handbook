<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Three questions pick the workload controller</title>
  <desc>A decision tree showing how to choose between Kubernetes Deployment, StatefulSet, Job, and DaemonSet controllers based on replica identity, persistent storage, and completion needs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Three questions pick the workload controller</text>

  

  
  <g id="top-question">
    <rect x="290" y="120" width="600" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(325, 167)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="14" width="36" height="36" rx="6" />
      <rect x="12" y="4" width="36" height="36" rx="6" stroke-dasharray="3 3" />
      <circle cx="10" cy="24" r="3" fill="#207448" />
      <line x1="18" y1="24" x2="28" y2="24" />
      <line x1="10" y1="34" x2="28" y2="34" />
    </g>
    <text x="400" y="182" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Does the program care</text>
    <text x="400" y="226" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">which replica it is?</text>
  </g>

  
  <g id="question-disk">
    <rect x="60" y="360" width="500" height="190" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(282, 380)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="12" rx="26" ry="10" />
      <path d="M 2 12 V 32 C 2 38, 54 38, 54 32 V 12" />
      <path d="M 2 22 C 2 28, 54 28, 54 22" />
      <line x1="42" y1="29" x2="46" y2="29" />
    </g>
    <text x="310" y="474" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Does it need its own disk</text>
    <text x="310" y="518" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">that follows its name?</text>
  </g>

  
  <g id="question-completion">
    <rect x="640" y="360" width="500" height="190" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(862, 380)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="18 28 25 35 38 20" />
    </g>
    <text x="890" y="474" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Should it run once</text>
    <text x="890" y="518" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">to completion?</text>
  </g>

  
  <g id="leaf-statefulset">
    <rect x="60" y="630" width="500" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(85, 682)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="52" height="14" rx="4" />
      <rect x="0" y="20" width="52" height="14" rx="4" />
      <rect x="0" y="40" width="52" height="14" rx="4" />
      <circle cx="10" cy="7" r="2" fill="#207448" />
      <circle cx="10" cy="27" r="2" fill="#207448" />
      <circle cx="10" cy="47" r="2" fill="#207448" />
    </g>
    <text x="160" y="678" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">StatefulSet:</text>
    <text x="160" y="722" font-family="sans-serif" font-size="24" fill="#303a36">stable names x-0 to n,</text>
    <text x="160" y="758" font-family="sans-serif" font-size="24" fill="#303a36">per-pod PVC</text>
  </g>

  
  <g id="leaf-job">
    <rect x="640" y="630" width="500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(668, 677)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="28 14 28 28 38 28" />
    </g>
    <text x="745" y="688" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Job, or CronJob</text>
    <text x="745" y="734" font-family="sans-serif" font-size="24" fill="#303a36">on a schedule</text>
  </g>

  
  <g id="leaf-deployment">
    <rect x="640" y="830" width="500" height="150" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(668, 877)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 4 V 12 M 28 44 V 52 M 4 28 H 12 M 44 28 H 52 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11" />
    </g>
    <text x="745" y="878" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Deployment:</text>
    <text x="745" y="920" font-family="sans-serif" font-size="24" fill="#303a36">interchangeable replicas,</text>
    <text x="745" y="954" font-family="sans-serif" font-size="24" fill="#303a36">rolling updates</text>
  </g>

  
  <g id="separate-section">
    
    <rect x="1180" y="120" width="370" height="860" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />

    
    <rect x="1205" y="320" width="320" height="260" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1337, 345)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="66" height="16" rx="3" />
      <circle cx="10" cy="8" r="2" fill="#207448" />
      <rect x="0" y="22" width="66" height="16" rx="3" />
      <circle cx="10" cy="30" r="2" fill="#207448" />
      <rect x="0" y="44" width="66" height="16" rx="3" />
      <circle cx="10" cy="52" r="2" fill="#207448" />
    </g>
    <text x="1365" y="442" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Different question:</text>
    <text x="1365" y="484" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">should exactly</text>
    <text x="1365" y="518" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">one copy live</text>
    <text x="1365" y="552" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">on every node?</text>

    
    <path d="M 1365 580 V 680" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

    
    <rect x="1205" y="680" width="320" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1225, 727)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 4 L 50 12 V 28 C 50 42, 28 52, 28 52 C 28 52, 6 42, 6 28 V 12 Z" />
      <polyline points="20 28 26 34 36 22" />
    </g>
    <text x="1295" y="736" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">DaemonSet:</text>
    <text x="1295" y="780" font-family="sans-serif" font-size="24" fill="#303a36">one Pod per node</text>
  </g>

  

  
  <path d="M 440 270 V 315 H 310 V 360" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="408" y="295" width="64" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="440" y="320" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>

  
  <path d="M 740 270 V 315 H 890 V 360" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="712" y="295" width="56" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="740" y="320" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">No</text>

  
  <path d="M 560 455 H 640" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="572" y="438" width="56" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="600" y="463" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">No</text>

  
  <path d="M 310 550 V 630" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="278" y="573" width="64" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="310" y="598" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>

  
  <path d="M 890 550 V 630" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  <rect x="858" y="573" width="64" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="890" y="598" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Yes</text>

  
  <path d="M 1140 455 H 1162 V 905 H 1140" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="1134" y="485" width="56" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1162" y="510" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">No</text>

  
  <rect x="60" y="1015" width="1480" height="60" rx="12" fill="#207448" />
  <text x="800" y="1055" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The answers point to Deployment, StatefulSet or Job.</text>
</svg>