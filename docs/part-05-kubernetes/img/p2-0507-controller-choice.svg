<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 970" width="1600" height="970">
  <title>Three questions pick the workload controller</title>
  <desc>Decision tree explaining how to select between Kubernetes Deployment, StatefulSet, Job, or DaemonSet based on workload requirements.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="970" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">Three questions pick the workload controller</text>

  

  
  <path d="M 430 260 V 310 H 300 V 358" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="330" y="292" width="60" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="360" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <path d="M 760 260 V 310 H 915 V 358" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="810" y="292" width="56" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="838" y="318" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  <line x1="540" y1="435" x2="678" y2="435" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="582" y="417" width="56" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="610" y="443" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  <line x1="290" y1="510" x2="290" y2="628" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="260" y="552" width="60" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="290" y="578" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <path d="M 770 510 V 560 H 715 V 628" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="712" y="542" width="60" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="742" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Yes</text>

  
  <path d="M 1030 510 V 560 H 1060 V 628" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="1017" y="542" width="56" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1045" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">No</text>

  
  <line x1="1415" y1="530" x2="1415" y2="628" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>

  

  
  <g>
    <rect x="330" y="120" width="530" height="140" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(355, 162)">
      <rect x="0" y="10" width="34" height="42" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="14" y="0" width="34" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <circle cx="31" cy="21" r="7" fill="none" stroke="#207448" stroke-width="2"/>
    </g>
    <text x="430" y="177" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Does the program care</text>
    <text x="430" y="217" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">which replica it is?</text>
  </g>

  
  <g>
    <rect x="40" y="360" width="500" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(62, 408)">
      <ellipse cx="24" cy="12" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 12 V 38 C 2 44 12 48 24 48 C 36 48 46 44 46 38 V 12" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 25 C 2 31 12 35 24 35 C 36 35 46 31 46 25" fill="none" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="135" y="415" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Does it need</text>
    <text x="135" y="450" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">its own disk that</text>
    <text x="135" y="485" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">follows its name?</text>
  </g>

  
  <g>
    <rect x="680" y="360" width="470" height="150" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(705, 410)">
      <circle cx="25" cy="25" r="23" fill="none" stroke="#207448" stroke-width="3"/>
      <polyline points="25,12 25,25 36,25" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <path d="M 38 38 L 47 47" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="775" y="425" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Should it run once</text>
    <text x="775" y="465" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">to completion?</text>
  </g>

  
  <g>
    <rect x="1230" y="360" width="340" height="170" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1388, 380)">
      <rect x="0" y="0" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="30" y="0" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="0" y="24" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
      <rect x="30" y="24" width="22" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="1400" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Different question:</text>
    <text x="1400" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">should exactly one copy</text>
    <text x="1400" y="512" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">live on every node?</text>
  </g>

  

  
  <g>
    <rect x="40" y="630" width="500" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(62, 690)">
      <ellipse cx="22" cy="10" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 10 V 26 C 2 32 11 36 22 36 C 33 36 42 32 42 26 V 10" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 26 V 42 C 2 48 11 52 22 52 C 33 52 42 48 42 42 V 26" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="125" y="685" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">StatefulSet: stable names</text>
    <text x="125" y="725" font-family="monospace" font-size="24" fill="#303a36">x-0 to n,</text>
    <text x="250" y="725" font-family="sans-serif" font-size="24" fill="#303a36">per-pod PVC</text>
  </g>

  
  <g>
    <rect x="570" y="630" width="290" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(690, 650)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="none" stroke="#207448" stroke-width="3"/>
      <polyline points="12,26 22,36 38,16" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="715" y="738" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Job, or CronJob</text>
    <text x="715" y="775" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">on a schedule</text>
  </g>

  
  <g>
    <rect x="880" y="630" width="330" height="180" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(1022, 650)">
      <path d="M 23 4 A 20 20 0 1 1 5 24" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="23,0 23,8 31,8" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="24" r="7" fill="none" stroke="#db8129" stroke-width="3"/>
    </g>
    <text x="1045" y="722" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Deployment:</text>
    <text x="1045" y="756" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">interchangeable replicas,</text>
    <text x="1045" y="788" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">rolling updates</text>
  </g>

  
  <g>
    <rect x="1230" y="630" width="340" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(1388, 650)">
      <rect x="0" y="16" width="54" height="32" rx="5" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="32" x2="16" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="32" r="3" fill="#207448"/>
      <rect x="15" y="0" width="24" height="16" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    </g>
    <text x="1400" y="735" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">DaemonSet:</text>
    <text x="1400" y="775" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">one Pod per node</text>
  </g>

  
  <g>
    <rect x="40" y="865" width="1530" height="70" rx="14" fill="#207448"/>
    <text x="805" y="910" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The answers point to Deployment, StatefulSet or Job.</text>
  </g>
</svg>