<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <title>Which credential for which caller</title>
  <desc>A visual guide mapping Kubernetes callers to authentication methods and verdicts.</desc>

  <rect width="1600" height="1250" fill="#f5f8f5" />

  
  <text x="800" y="60" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Which credential for which caller</text>

  
  <g id="row-humans">
    <rect x="60" y="95" width="1480" height="175" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <line x1="580" y1="95" x2="580" y2="270" stroke="#b8d5bf" stroke-width="2" />
    
    <circle cx="105" cy="155" r="18" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M 80 205 C 80 185, 130 185, 130 205" fill="none" stroke="#207448" stroke-width="3.5" />
    
    <text x="145" y="188" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Humans</text>
    
    <text x="610" y="136" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">OIDC SSO with MFA and short-lived tokens via an IdP</tspan>
      <tspan x="610" dy="34">such as Dex, Keycloak, Okta or Entra; id_token claims map</tspan>
      <tspan x="610" dy="34">to username and groups; kubelogin or kubectl oidc-login;</tspan>
    </text>
    
    <rect x="610" y="220" width="225" height="38" rx="8" fill="#db8129" />
    <text x="722" y="247" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">RECOMMENDED</text>
  </g>

  
  <g id="row-machines">
    <rect x="60" y="285" width="1480" height="110" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
    <line x1="580" y1="285" x2="580" y2="395" stroke="#cde0d2" stroke-width="1.5" />
    
    <rect x="88" y="323" width="34" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="105" y1="315" x2="105" y2="323" stroke="#207448" stroke-width="3" />
    <line x1="105" y1="357" x2="105" y2="365" stroke="#207448" stroke-width="3" />
    <line x1="80" y1="340" x2="88" y2="340" stroke="#207448" stroke-width="3" />
    <line x1="122" y1="340" x2="130" y2="340" stroke="#207448" stroke-width="3" />
    
    <text x="145" y="350" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Machines in the cluster</text>
    
    <text x="610" y="350" font-family="sans-serif" font-size="24" fill="#303a36">ServiceAccount tokens or workload identities</text>
  </g>

  
  <g id="row-robot-central">
    <rect x="60" y="410" width="1480" height="120" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
    <line x1="580" y1="410" x2="580" y2="530" stroke="#cde0d2" stroke-width="1.5" />
    
    <rect x="88" y="456" width="34" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="105" y1="456" x2="105" y2="446" stroke="#207448" stroke-width="3" />
    <circle cx="105" cy="443" r="3.5" fill="#207448" />
    <circle cx="98" cy="470" r="3" fill="#207448" />
    <circle cx="112" cy="470" r="3" fill="#207448" />
    
    <text x="145" y="460" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="145" dy="0">Robot users tied to</tspan>
      <tspan x="145" dy="32">central accounts</tspan>
    </text>
    
    <text x="610" y="460" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">write a kubectl authentication plug-in; token verified</tspan>
      <tspan x="610" dy="34">by the webhook token authenticator</tspan>
    </text>
  </g>

  
  <g id="row-robot-nocentral">
    <rect x="60" y="545" width="1480" height="125" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
    <line x1="580" y1="545" x2="580" y2="670" stroke="#cde0d2" stroke-width="1.5" />
    
    <rect x="88" y="585" width="30" height="38" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="95" y1="597" x2="111" y2="597" stroke="#207448" stroke-width="2.5" />
    <line x1="95" y1="605" x2="111" y2="605" stroke="#207448" stroke-width="2.5" />
    <circle cx="103" cy="616" r="4" fill="#207448" />
    
    <text x="145" y="598" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="145" dy="0">Robot accounts needing</tspan>
      <tspan x="145" dy="32">no central management</tspan>
    </text>
    
    <text x="610" y="598" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">certificate-based authentication, you manage</tspan>
      <tspan x="610" dy="34">issuance and rotation</tspan>
    </text>
  </g>

  
  <g id="row-robot-simplest">
    <rect x="60" y="685" width="1480" height="120" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
    <line x1="580" y1="685" x2="580" y2="805" stroke="#cde0d2" stroke-width="1.5" />
    
    <circle cx="98" cy="745" r="10" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="108" y1="745" x2="124" y2="745" stroke="#207448" stroke-width="3" />
    <line x1="118" y1="745" x2="118" y2="753" stroke="#207448" stroke-width="3" />
    <line x1="124" y1="745" x2="124" y2="753" stroke="#207448" stroke-width="3" />
    
    <text x="145" y="753" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Simplest robot option</text>
    
    <text x="610" y="736" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">a ServiceAccount token; copy to a secure location</tspan>
      <tspan x="610" dy="34">for tools outside the cluster</tspan>
    </text>
  </g>

  
  <g id="row-cloud-iam">
    <rect x="60" y="820" width="1480" height="120" rx="10" fill="#ffffff" stroke="#cde0d2" stroke-width="1.5" />
    <line x1="580" y1="820" x2="580" y2="940" stroke="#cde0d2" stroke-width="1.5" />
    
    <path d="M 88 886 a 10 10 0 0 1 14 -7 a 13 13 0 0 1 23 2 a 9 9 0 0 1 3 16 l -38 0 a 8 8 0 0 1 -2 -11 z" fill="none" stroke="#207448" stroke-width="3" />
    
    <text x="145" y="888" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Cloud IAM</text>
    
    <text x="610" y="871" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">webhook token authentication such as</tspan>
      <tspan x="610" dy="34">aws-iam-authenticator or gke-gcloud-auth-plugin</tspan>
    </text>
  </g>

  
  <g id="row-avoid">
    <rect x="60" y="955" width="1480" height="120" rx="10" fill="#fff9f9" stroke="#f0b8b8" stroke-width="1.5" />
    <line x1="580" y1="955" x2="580" y2="1075" stroke="#f0b8b8" stroke-width="1.5" />
    
    <circle cx="106" cy="1015" r="16" fill="none" stroke="#ba3c3c" stroke-width="3.5" />
    <line x1="94" y1="1003" x2="118" y2="1027" stroke="#ba3c3c" stroke-width="3.5" />
    
    <text x="145" y="1023" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ba3c3c">Avoid</text>
    
    <text x="610" y="1006" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">static token and password files: plain text, never expire,</tspan>
      <tspan x="610" dy="34">any change needs an API server restart</tspan>
    </text>
  </g>

  
  <g id="footer-facts">
    <rect x="60" y="1095" width="1480" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="1144" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="800" dy="0">Kubernetes has no User or Group object; the authenticating method decides the name;</tspan>
      <tspan x="800" dy="34">certificate CN is the user and O is the group</tspan>
    </text>
  </g>
</svg>