<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>A Deployment rollout shifts replicas from the old ReplicaSet to the new one</title>
  <desc>Visual infographic explaining how a Kubernetes Deployment rollout gradually scales up a new ReplicaSet while scaling down old ReplicaSets across four snapshot steps.</desc>

  <defs>
    <marker id="marker-arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A Deployment rollout shifts replicas</tspan>
    <tspan x="800" dy="54">from the old ReplicaSet to the new one</tspan>
  </text>

  <g id="box-deployment">
    <rect x="360" y="125" width="880" height="82" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(385, 138)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6"/>
      <line x1="4" y1="18" x2="52" y2="18"/>
      <circle cx="12" cy="12" r="2.5" fill="#207448"/>
      <circle cx="20" cy="12" r="2.5" fill="#207448"/>
      <circle cx="28" cy="12" r="2.5" fill="#207448"/>
      <rect x="12" y="26" width="14" height="14" rx="2"/>
      <rect x="30" y="26" width="14" height="14" rx="2"/>
    </g>
    <text x="810" y="176" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Deployment kuard, the desired version</text>
  </g>

  <g id="repeat-label-box">
    <rect x="370" y="226" width="860" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="261" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">repeat until the new ReplicaSet holds every replica</text>
  </g>

  <line x1="365" y1="592" x2="443" y2="592" stroke="#207448" stroke-width="3.5" marker-end="url(#marker-arrow)"/>
  <line x1="760" y1="592" x2="838" y2="592" stroke="#207448" stroke-width="3.5" marker-end="url(#marker-arrow)"/>
  <line x1="1155" y1="592" x2="1233" y2="592" stroke="#207448" stroke-width="3.5" marker-end="url(#marker-arrow)"/>

  <g id="col-1">
    <circle cx="207.5" cy="316" r="24" fill="#207448"/>
    <text x="207.5" y="325" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

    <rect x="50" y="345" width="315" height="495" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g id="col1-new">
      <rect x="65" y="360" width="285" height="225" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <g transform="translate(179.5, 380)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="13"/>
        <line x1="28" y1="5" x2="28" y2="13"/>
        <line x1="28" y1="43" x2="28" y2="51"/>
        <line x1="5" y1="28" x2="13" y2="28"/>
        <line x1="43" y1="28" x2="51" y2="28"/>
        <line x1="12" y1="12" x2="17" y2="17"/>
        <line x1="39" y1="39" x2="44" y2="44"/>
        <line x1="12" y1="44" x2="17" y2="39"/>
        <line x1="39" y1="17" x2="44" y2="12"/>
      </g>
      <text x="207.5" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="207.5" dy="0">NewReplicaSet</tspan>
        <tspan x="207.5" dy="38">has 0 pods</tspan>
      </text>
    </g>

    <g id="col1-old">
      <rect x="65" y="600" width="285" height="225" rx="10" fill="#e2e8e5" stroke="#717a76" stroke-width="2.5"/>
      <g transform="translate(179.5, 620)" stroke="#717a76" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="28" cy="14" rx="22" ry="8"/>
        <path d="M 6 14 v 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -28"/>
        <path d="M 6 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8"/>
      </g>
      <text x="207.5" y="735" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="207.5" dy="0">OldReplicaSets</tspan>
        <tspan x="207.5" dy="38">has 3 pods</tspan>
      </text>
    </g>
  </g>

  <g id="col-2">
    <circle cx="602.5" cy="316" r="24" fill="#207448"/>
    <text x="602.5" y="325" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

    <rect x="445" y="345" width="315" height="495" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g id="col2-new">
      <rect x="460" y="358" width="285" height="152" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <g transform="translate(580.5, 368)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="10"/>
        <line x1="22" y1="4" x2="22" y2="10"/>
        <line x1="22" y1="34" x2="22" y2="40"/>
        <line x1="4" y1="22" x2="10" y2="22"/>
        <line x1="34" y1="22" x2="40" y2="22"/>
        <line x1="9" y1="9" x2="13" y2="13"/>
        <line x1="31" y1="31" x2="35" y2="35"/>
        <line x1="9" y1="35" x2="13" y2="31"/>
        <line x1="31" y1="13" x2="35" y2="9"/>
      </g>
      <text x="602.5" y="450" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="602.5" dy="0">NewReplicaSet</tspan>
        <tspan x="602.5" dy="34">grows to 1 pod</tspan>
      </text>
    </g>

    <g id="col2-wait">
      <rect x="460" y="522" width="285" height="142" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      <g transform="translate(584.5, 536)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="18" r="14"/>
        <polyline points="18,9 18,18 24,22"/>
      </g>
      <text x="602.5" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
        <tspan x="602.5" dy="0">waits for new pod</tspan>
        <tspan x="602.5" dy="32">to report ready</tspan>
      </text>
    </g>

    <g id="col2-old">
      <rect x="460" y="676" width="285" height="152" rx="10" fill="#e2e8e5" stroke="#717a76" stroke-width="2.5"/>
      <g transform="translate(580.5, 686)" stroke="#717a76" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="22" cy="11" rx="17" ry="6"/>
        <path d="M 5 11 v 22 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -22"/>
        <path d="M 5 22 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6"/>
      </g>
      <text x="602.5" y="768" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="602.5" dy="0">OldReplicaSets</tspan>
        <tspan x="602.5" dy="34">drops to 2 pods</tspan>
      </text>
    </g>
  </g>

  <g id="col-3">
    <circle cx="997.5" cy="316" r="24" fill="#207448"/>
    <text x="997.5" y="325" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>

    <rect x="840" y="345" width="315" height="495" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g id="col3-new">
      <rect x="855" y="360" width="285" height="225" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <g transform="translate(969.5, 380)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="13"/>
        <line x1="28" y1="5" x2="28" y2="13"/>
        <line x1="28" y1="43" x2="28" y2="51"/>
        <line x1="5" y1="28" x2="13" y2="28"/>
        <line x1="43" y1="28" x2="51" y2="28"/>
        <line x1="12" y1="12" x2="17" y2="17"/>
        <line x1="39" y1="39" x2="44" y2="44"/>
        <line x1="12" y1="44" x2="17" y2="39"/>
        <line x1="39" y1="17" x2="44" y2="12"/>
      </g>
      <text x="997.5" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="997.5" dy="0">NewReplicaSet</tspan>
        <tspan x="997.5" dy="38">has 2 pods</tspan>
      </text>
    </g>

    <g id="col3-old">
      <rect x="855" y="600" width="285" height="225" rx="10" fill="#e2e8e5" stroke="#717a76" stroke-width="2.5"/>
      <g transform="translate(969.5, 620)" stroke="#717a76" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="28" cy="14" rx="22" ry="8"/>
        <path d="M 6 14 v 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -28"/>
        <path d="M 6 28 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8"/>
      </g>
      <text x="997.5" y="735" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="997.5" dy="0">OldReplicaSets</tspan>
        <tspan x="997.5" dy="38">has 1 pod</tspan>
      </text>
    </g>
  </g>

  <g id="col-4">
    <circle cx="1392.5" cy="316" r="24" fill="#207448"/>
    <text x="1392.5" y="325" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>

    <rect x="1235" y="345" width="315" height="495" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    <g id="col4-new">
      <rect x="1250" y="360" width="285" height="225" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      <g transform="translate(1364.5, 380)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="13"/>
        <line x1="28" y1="5" x2="28" y2="13"/>
        <line x1="28" y1="43" x2="28" y2="51"/>
        <line x1="5" y1="28" x2="13" y2="28"/>
        <line x1="43" y1="28" x2="51" y2="28"/>
        <line x1="12" y1="12" x2="17" y2="17"/>
        <line x1="39" y1="39" x2="44" y2="44"/>
        <line x1="12" y1="44" x2="17" y2="39"/>
        <line x1="39" y1="17" x2="44" y2="12"/>
      </g>
      <text x="1392.5" y="495" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
        <tspan x="1392.5" dy="0">NewReplicaSet</tspan>
        <tspan x="1392.5" dy="38">has 3 pods</tspan>
      </text>
    </g>

    <g id="col4-old">
      <rect x="1250" y="600" width="285" height="225" rx="10" fill="#e2e8e5" stroke="#717a76" stroke-width="2.5"/>
      <g transform="translate(1364.5, 616)" stroke="#717a76" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="40" height="44" rx="5"/>
        <line x1="16" y1="18" x2="40" y2="18"/>
        <line x1="16" y1="28" x2="40" y2="28"/>
        <line x1="16" y1="38" x2="28" y2="38"/>
      </g>
      <text x="1392.5" y="720" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1392.5" dy="0">0 kept at zero</tspan>
        <tspan x="1392.5" dy="32">with its</tspan>
        <tspan x="1392.5" dy="32">template saved</tspan>
      </text>
    </g>
  </g>

  <g id="note-under-col4">
    <rect x="1225" y="855" width="335" height="162" rx="10" fill="#ffffff" stroke="#717a76" stroke-width="2"/>
    <text x="1392.5" y="891" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1392.5" dy="0" font-family="monospace">revisionHistoryLimit</tspan>
      <tspan x="1392.5" dy="26">defaults to 10,</tspan>
      <tspan x="1392.5" dy="26">old ReplicaSets are</tspan>
      <tspan x="1392.5" dy="26">kept at 0 so you</tspan>
      <tspan x="1392.5" dy="26">can roll back</tspan>
    </text>
  </g>

  <g id="takeaway-bar">
    <rect x="40" y="1038" width="1520" height="74" rx="12" fill="#207448"/>
    <text x="800" y="1084" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">each revision is a saved snapshot of the pod template, and undo only changes replica counts.</text>
  </g>
</svg>