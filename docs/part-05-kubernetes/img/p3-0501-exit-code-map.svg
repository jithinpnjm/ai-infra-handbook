<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Reading how a container exited</title>
  <desc>A technical guide and decision table mapping container exit codes to their root causes, first diagnostic checks, and startup failure modes.</desc>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448">Reading how a container exited</text>

  
  <g id="formula-box">
    <rect x="990" y="38" width="570" height="56" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <g transform="translate(1008, 48)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="2" y="2" width="32" height="32" rx="4"/>
      <line x1="8" y1="12" x2="28" y2="12"/>
      <line x1="18" y1="20" x2="18" y2="28"/>
      <line x1="14" y1="24" x2="22" y2="24"/>
    </g>
    <text x="1058" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">exit code = 128 + signal number</text>
  </g>

  
  <g id="table-headers">
    
    <rect x="40" y="120" width="450" height="54" rx="8" fill="#207448"/>
    <g transform="translate(56, 131)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="30" height="26" rx="3"/>
      <polyline points="8,12 14,15 8,18"/>
      <line x1="17" y1="22" x2="24" y2="22"/>
    </g>
    <text x="106" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Exit code</text>

    
    <rect x="505" y="120" width="490" height="54" rx="8" fill="#207448"/>
    <g transform="translate(521, 131)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="16" cy="15" r="7"/>
      <line x1="16" y1="3" x2="16" y2="7"/>
      <line x1="16" y1="23" x2="16" y2="27"/>
      <line x1="4" y1="15" x2="8" y2="15"/>
      <line x1="24" y1="15" x2="28" y2="15"/>
    </g>
    <text x="571" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Meaning</text>

    
    <rect x="1010" y="120" width="550" height="54" rx="8" fill="#207448"/>
    <g transform="translate(1026, 131)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="14" cy="14" r="9"/>
      <line x1="21" y1="21" x2="30" y2="30"/>
    </g>
    <text x="1076" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">First check</text>
  </g>

  
  <g id="row-1">
    <rect x="40" y="185" width="450" height="110" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="60" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="60" dy="0">137 (128 + 9 = SIGKILL) with </tspan>
      <tspan x="60" dy="32">State.OOMKilled true</tspan>
    </text>

    <rect x="505" y="185" width="490" height="110" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="525" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="525" dy="0">the cgroup memory controller </tspan>
      <tspan x="525" dy="32">killed it at memory.max</tspan>
    </text>

    
    <rect x="1010" y="185" width="550" height="110" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <text x="1030" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1030" dy="0">docker inspect .State.OOMKilled, </tspan>
      <tspan x="1030" dy="30">dmesg, raise the limit </tspan>
      <tspan x="1030" dy="30">or fix the leak</tspan>
    </text>
  </g>

  
  <g id="row-2">
    <rect x="40" y="305" width="450" height="75" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="60" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">143 (128 + 15 = SIGTERM)</text>

    <rect x="505" y="305" width="490" height="75" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="525" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="525" dy="0">graceful termination signal, </tspan>
      <tspan x="525" dy="30">no handler</tspan>
    </text>

    <rect x="1010" y="305" width="550" height="75" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="1030" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">handle SIGTERM</text>
  </g>

  
  <g id="row-3">
    <rect x="40" y="390" width="450" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="60" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">139 (128 + 11 = SIGSEGV)</text>

    <rect x="505" y="390" width="490" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="525" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">segmentation fault</text>

    <rect x="1010" y="390" width="550" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="1030" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">docker logs</text>
  </g>

  
  <g id="row-4">
    <rect x="40" y="465" width="450" height="120" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="60" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">135 (128 + 7 = SIGBUS)</text>

    <rect x="505" y="465" width="490" height="120" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="525" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="525" dy="0">bus error, often on /dev/shm </tspan>
      <tspan x="525" dy="30">which is 64 MiB by default </tspan>
      <tspan x="525" dy="30">in Docker</tspan>
    </text>

    <rect x="1010" y="465" width="550" height="120" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="1030" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1030" dy="0">raise --shm-size or --ipc=host, </tspan>
      <tspan x="1030" dy="30">in Kubernetes a memory emptyDir </tspan>
      <tspan x="1030" dy="30">at /dev/shm</tspan>
    </text>
  </g>

  
  <g id="row-5">
    <rect x="40" y="595" width="450" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="60" y="637" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">1 or 2</text>

    <rect x="505" y="595" width="490" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="525" y="637" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">application error or syntax error</text>

    <rect x="1010" y="595" width="550" height="65" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="2"/>
    <text x="1030" y="637" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">docker logs container</text>
  </g>

  
  <g id="startup-failures">
    <rect x="40" y="685" width="1520" height="325" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="40" y="685" width="1520" height="54" rx="8" fill="#207448"/>
    <g transform="translate(56, 695)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="17,3 32,30 2,30"/>
      <line x1="17" y1="12" x2="17" y2="19"/>
      <circle cx="17" cy="24" r="1.5" fill="#ffffff"/>
    </g>
    <text x="106" y="722" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Startup failures</text>

    
    <rect x="60" y="755" width="1480" height="120" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="1.5"/>
    <text x="85" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">exec format error: wrong CPU architecture (arm64 image on amd64) or a script with </tspan>
      <tspan x="85" dy="32">no #! shebang or CRLF line endings; check docker image inspect Architecture </tspan>
      <tspan x="85" dy="32">and crane manifest platforms</tspan>
    </text>

    
    <rect x="60" y="890" width="1480" height="100" rx="8" fill="#ffffff" stroke="#c8dcce" stroke-width="1.5"/>
    <text x="85" y="932" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">container exits immediately: PID 1 finished; docker logs, </tspan>
      <tspan x="85" dy="32">docker inspect .State, run with sh</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1035" width="1520" height="65" rx="10" fill="#207448"/>
    <g transform="translate(62, 1047)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 L13 29 L34 8"/>
    </g>
    <text x="115" y="1077" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Run the check before you change anything.</text>
  </g>
</svg>