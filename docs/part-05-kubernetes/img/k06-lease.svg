<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Lease timings for leader election</title>
  <desc>Visual infographic explaining Kubernetes Lease timings for leader election: retryPeriod 2 s, renewDeadline 10 s, and leaseDuration 15 s along a horizontal timeline axis.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Lease timings for leader election</text>

  
  
  <g id="active-leader-box">
    <rect x="80" y="95" width="1440" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(115, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 42 L 4 16 L 18 26 L 28 8 L 38 26 L 52 16 L 48 42 Z" />
      <circle cx="28" cy="42" r="3" fill="#207448" />
      <line x1="12" y1="48" x2="44" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="825" y="155" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">active leader holds the Lease, updating holderIdentity and renewTime</text>
  </g>

  
  
  <g id="interval-1-card">
    <rect x="80" y="235" width="450" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(277, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <polyline points="28,14 28,28 38,28" />
      <line x1="28" y1="6" x2="28" y2="1" />
      <line x1="22" y1="2" x2="34" y2="2" />
    </g>
    
    <circle cx="160" cy="345" r="24" fill="#207448" />
    <text x="160" y="345" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="200" y="354" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">retryPeriod 2 s</text>
    <line x1="110" y1="385" x2="500" y2="385" stroke="#e8f1ea" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="305" y="440">standby candidates try to</tspan>
      <tspan x="305" y="480">acquire or renew the Lease</tspan>
    </text>
  </g>

  
  <g id="interval-2-card">
    <rect x="575" y="235" width="450" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(772, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="10" y1="8" x2="46" y2="8" />
      <line x1="10" y1="48" x2="46" y2="48" />
      <path d="M 14 8 L 28 28 L 14 48" />
      <path d="M 42 8 L 28 28 L 42 48" />
      <line x1="23" y1="38" x2="33" y2="38" />
    </g>
    
    <circle cx="635" cy="345" r="24" fill="#207448" />
    <text x="635" y="345" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="675" y="354" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">renewDeadline 10 s</text>
    <line x1="605" y1="385" x2="995" y2="385" stroke="#e8f1ea" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="800" y="425">the active leader must</tspan>
      <tspan x="800" y="465">renew by this point</tspan>
      <tspan x="800" y="505">or it gives up</tspan>
    </text>
  </g>

  
  <g id="interval-3-card">
    <rect x="1070" y="235" width="450" height="310" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1267, 252)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="22" width="36" height="28" rx="6" />
      <path d="M 18 22 V 14 C 18 8.5 22.5 4 28 4 C 33.5 4 38 8.5 38 14 V 22" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
      <line x1="28" y1="37" x2="28" y2="43" />
    </g>
    
    <circle cx="1130" cy="345" r="24" fill="#207448" />
    <text x="1130" y="345" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1170" y="354" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">leaseDuration 15 s</text>
    <line x1="1100" y1="385" x2="1490" y2="385" stroke="#e8f1ea" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1295" y="425">after this the Lease</tspan>
      <tspan x="1295" y="465">expires and a standby</tspan>
      <tspan x="1295" y="505">takes over</tspan>
    </text>
  </g>

  
  
  <g id="timeline-axis-group">
    <rect x="80" y="585" width="1440" height="160" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="180" y="605" width="1240" height="22" rx="6" fill="#207448" opacity="0.15" />
    <line x1="180" y1="616" x2="1420" y2="616" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" />
    <line x1="180" y1="607" x2="180" y2="625" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="1420" y1="607" x2="1420" y2="625" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <rect x="180" y="637" width="827" height="22" rx="6" fill="#207448" opacity="0.22" />
    <line x1="180" y1="648" x2="1007" y2="648" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="180" y1="639" x2="180" y2="657" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="1007" y1="639" x2="1007" y2="657" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <rect x="180" y="669" width="165" height="22" rx="6" fill="#207448" opacity="0.3" />
    <line x1="180" y1="680" x2="345" y2="680" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="180" y1="671" x2="180" y2="689" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="345" y1="671" x2="345" y2="689" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <line x1="130" y1="712" x2="1470" y2="712" stroke="#207448" stroke-width="6" stroke-linecap="round" />

    
    
    <line x1="180" y1="698" x2="180" y2="726" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    
    <line x1="345" y1="700" x2="345" y2="724" stroke="#207448" stroke-width="5" stroke-linecap="round" />
    
    <line x1="511" y1="703" x2="511" y2="721" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="676" y1="703" x2="676" y2="721" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="841" y1="703" x2="841" y2="721" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="1007" y1="698" x2="1007" y2="726" stroke="#207448" stroke-width="5" stroke-linecap="round" />
    
    <line x1="1172" y1="703" x2="1172" y2="721" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="1337" y1="703" x2="1337" y2="721" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <line x1="1420" y1="698" x2="1420" y2="726" stroke="#207448" stroke-width="6" stroke-linecap="round" />
  </g>

  
  
  <g id="orange-note-box">
    <rect x="80" y="785" width="1440" height="95" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(115, 805)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 46 L 6 46 Z" />
      <line x1="28" y1="20" x2="28" y2="32" />
      <circle cx="28" cy="40" r="2.5" fill="#db8129" />
    </g>
    <text x="825" y="841" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">a leader that cannot renew exits on purpose, so two leaders never run at once</text>
  </g>

  
  
  <g id="takeaway-bar">
    <rect x="80" y="920" width="1440" height="90" rx="14" fill="#207448" />
    <text x="800" y="975" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">failover takes roughly 15 to 30 seconds</text>
  </g>
</svg>