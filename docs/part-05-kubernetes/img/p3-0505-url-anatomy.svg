<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading an API URL: group, version, resource, subresource</title>
  <desc>Visual breakdown of Kubernetes API URL paths and a filing-cabinet analogy explaining Kind, Resource, and Subresource.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="60" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Reading an API URL: group, version, resource, subresource</text>

  

  
  <rect x="50" y="110" width="980" height="420" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="80" y="135" width="220" height="40" rx="8" fill="#e8f1ea" />
  <text x="190" y="162" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Core API Path</text>

  
  
  <g id="top-seg-api">
    <rect x="80" y="195" width="120" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="140" y="235" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">/api</text>
  </g>
  
  <g id="top-seg-v1">
    <rect x="210" y="195" width="100" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="260" y="235" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">/v1</text>
  </g>
  
  <g id="top-seg-ns">
    <rect x="320" y="195" width="410" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="525" y="235" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">/namespaces/default</text>
  </g>
  
  <g id="top-seg-pods">
    <rect x="740" y="195" width="150" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="815" y="235" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">/pods</text>
  </g>

  
  
  <path d="M 140 255 L 140 330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="70" y="340" width="280" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="210" y="390" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="210" dy="0">core group</tspan>
    <tspan x="210" dy="32">(empty name),</tspan>
    <tspan x="210" dy="32">legacy path</tspan>
  </text>

  
  <path d="M 260 255 L 260 290 L 390 290 L 390 330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="365" y="340" width="150" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="440" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="440" dy="0">version</tspan>
    <tspan x="440" dy="32">v1</tspan>
  </text>

  
  <path d="M 525 255 L 525 330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="530" y="340" width="200" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="630" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="630" dy="0">namespace</tspan>
    <tspan x="630" dy="32">default</tspan>
  </text>

  
  <path d="M 815 255 L 815 330" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="745" y="340" width="260" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="875" y="405" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="875" dy="0">resource pods</tspan>
    <tspan x="875" dy="34">(lowercase plural)</tspan>
  </text>


  
  <rect x="50" y="560" width="980" height="480" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <rect x="80" y="585" width="250" height="40" rx="8" fill="#e8f1ea" />
  <text x="205" y="612" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Named Group API Path</text>

  
  
  <g id="bot-seg-apps">
    <rect x="75" y="645" width="180" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="165" y="685" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">/apis/apps</text>
  </g>
  
  <g id="bot-seg-v1">
    <rect x="265" y="645" width="75" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="302" y="685" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">/v1</text>
  </g>
  
  <g id="bot-seg-ns">
    <rect x="350" y="645" width="155" height="60" rx="8" fill="#f5f8f5" stroke="#a0b8a6" stroke-width="2" />
    <text x="427" y="685" font-family="monospace" font-size="22" fill="#708076" text-anchor="middle">/ns/default</text>
  </g>
  
  <g id="bot-seg-deploy">
    <rect x="515" y="645" width="200" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="615" y="685" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">/deployments</text>
  </g>
  
  <g id="bot-seg-web">
    <rect x="725" y="645" width="115" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="782" y="685" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">/web</text>
  </g>
  
  <g id="bot-seg-status">
    <rect x="850" y="645" width="155" height="60" rx="8" fill="#fff3e6" stroke="#db8129" stroke-width="3" />
    <text x="927" y="685" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129" text-anchor="middle">/status</text>
  </g>

  
  
  <path d="M 165 705 L 165 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="70" y="790" width="190" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="165" y="875" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="165" dy="0">named group</tspan>
    <tspan x="165" dy="32">apps</tspan>
  </text>

  
  <path d="M 302 705 L 302 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="275" y="790" width="140" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="345" y="875" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="345" dy="0">version</tspan>
    <tspan x="345" dy="32">v1</tspan>
  </text>

  
  <path d="M 615 705 L 615 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="430" y="790" width="220" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="540" y="875" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="540" dy="0">resource</tspan>
    <tspan x="540" dy="32">deployments</tspan>
  </text>

  
  <path d="M 782 705 L 782 780" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="665" y="790" width="145" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="737" y="875" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="737" dy="0">object</tspan>
    <tspan x="737" dy="32">web</tspan>
  </text>

  
  <path d="M 927 705 L 927 780" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <rect x="825" y="790" width="190" height="190" rx="10" fill="#fff3e6" stroke="#db8129" stroke-width="2" />
  <text x="920" y="875" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="920" dy="0">subresource</tspan>
    <tspan x="920" dy="32" font-family="monospace" font-weight="bold" fill="#db8129">/status</tspan>
  </text>


  
  <g id="right-analogy">
    
    <rect x="1060" y="110" width="490" height="930" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="1090" y="140" width="430" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1110, 160)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="48" height="60" rx="4" />
      <line x1="0" y1="20" x2="48" y2="20" />
      <line x1="0" y1="40" x2="48" y2="40" />
      <line x1="18" y1="10" x2="30" y2="10" />
      <line x1="18" y1="30" x2="30" y2="30" />
      <line x1="18" y1="50" x2="30" y2="50" />
    </g>
    <text x="1180" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Filing-Cabinet Analogy</text>

    
    <rect x="1090" y="270" width="430" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1115, 305)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="46" height="30" rx="3" />
      <line x1="15" y1="15" x2="31" y2="15" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1180" y="325" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1180" dy="0" font-weight="bold" fill="#207448">Resource =</tspan>
      <tspan x="1180" dy="32">the drawer (deployments)</tspan>
    </text>

    
    <rect x="1090" y="460" width="430" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1115, 500)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 0 8 L 16 8 L 22 16 L 46 16 L 46 40 L 0 40 Z" />
    </g>
    <text x="1180" y="520" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1180" dy="0" font-weight="bold" fill="#207448">Kind =</tspan>
      <tspan x="1180" dy="32">label on a type of folder</tspan>
      <tspan x="1180" dy="32">(Deployment)</tspan>
    </text>

    
    <rect x="1090" y="680" width="430" height="330" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="2" />
    
    <g transform="translate(1115, 715)" stroke="#db8129" stroke-width="3" fill="none">
      <rect x="0" y="0" width="42" height="42" rx="2" />
      <line x1="8" y1="12" x2="34" y2="12" />
      <line x1="8" y1="22" x2="26" y2="22" />
    </g>
    <text x="1180" y="735" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1180" dy="0" font-weight="bold" fill="#db8129">Subresource =</tspan>
      <tspan x="1180" dy="34">sticky note on one folder</tspan>
      <tspan x="1180" dy="34">(/status, /scale, /binding,</tspan>
      <tspan x="1180" dy="34">/eviction, /log, /exec)</tspan>
    </text>
  </g>


  
  <rect x="50" y="1070" width="1500" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1120" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">PUT .../status updates only .status and does not increment metadata.generation</text>

</svg>