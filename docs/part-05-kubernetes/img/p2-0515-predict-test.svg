<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Define, locate, predict, then test the flow</title>
  <desc>A five-step method for testing a network flow: define the flow, find the applicable policies, predict the result, test it, and revise if prediction and test disagree.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Define, locate, predict, then test the flow</text>

  
  <path d="M 1424 200 V 145 H 488 V 200" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="776" y="98" width="360" height="38" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="956" y="125" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Revise and test again</text>

  
  <line x1="312" y1="340" x2="352" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="624" y1="340" x2="664" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="936" y1="340" x2="976" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1248" y1="340" x2="1288" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="step-1">
    <rect x="40" y="200" width="272" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="84" cy="244" r="24" fill="#207448" />
    <text x="84" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(220, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="10" width="18" height="36" rx="4" />
      <rect x="36" y="10" width="18" height="36" rx="4" />
      <path d="M 20 28 H 36" />
      <polyline points="28,22 34,28 28,34" />
    </g>
    <text x="176" y="320" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="176" dy="0">Define the flow:</tspan>
      <tspan x="176" dy="32">source pod,</tspan>
      <tspan x="176" dy="32">destination pod</tspan>
      <tspan x="176" dy="32">or IP, port,</tspan>
      <tspan x="176" dy="32">direction</tspan>
    </text>
  </g>

  
  <g id="step-2">
    <rect x="352" y="200" width="272" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="396" cy="244" r="24" fill="#207448" />
    <text x="396" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(532, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 V 14 Z" />
      <polyline points="20,28 26,34 38,20" />
    </g>
    <text x="488" y="336" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="488" dy="0">Find the</tspan>
      <tspan x="488" dy="32">applicable</tspan>
      <tspan x="488" dy="32">policies at</tspan>
      <tspan x="488" dy="32">both ends</tspan>
    </text>
  </g>

  
  <g id="step-3">
    <rect x="664" y="200" width="272" height="280" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <circle cx="708" cy="244" r="24" fill="#207448" />
    <text x="708" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(844, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 28 C 14 14 42 14 50 28 C 42 42 14 42 6 28 Z" />
      <circle cx="28" cy="28" r="8" />
    </g>
    <text x="800" y="336" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="800" dy="0">Predict the</tspan>
      <tspan x="800" dy="32">result before</tspan>
      <tspan x="800" dy="32">you run</tspan>
      <tspan x="800" dy="32">anything</tspan>
    </text>
  </g>

  
  <g id="step-4">
    <rect x="976" y="200" width="272" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="1020" cy="244" r="24" fill="#207448" />
    <text x="1020" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(1156, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <line x1="6" y1="18" x2="50" y2="18" />
      <polyline points="14,27 20,32 14,37" />
      <line x1="25" y1="37" x2="36" y2="37" />
    </g>
    <text x="1112" y="370" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Test it</text>
  </g>

  
  <g id="step-5">
    <rect x="1288" y="200" width="272" height="280" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="1332" cy="244" r="24" fill="#207448" />
    <text x="1332" y="244" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(1468, 216)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="28" y1="8" x2="28" y2="48" />
      <line x1="16" y1="48" x2="40" y2="48" />
      <line x1="8" y1="16" x2="48" y2="16" />
      <path d="M 8 16 L 3 32 H 17 Z" />
      <path d="M 48 16 L 43 36 H 57 Z" />
    </g>
    <text x="1424" y="320" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1424" dy="0">If the</tspan>
      <tspan x="1424" dy="32">prediction and</tspan>
      <tspan x="1424" dy="32">test disagree,</tspan>
      <tspan x="1424" dy="32">the mental</tspan>
      <tspan x="1424" dy="32">model is wrong</tspan>
    </text>
  </g>

  
  <g id="command-chip">
    <rect x="183" y="525" width="610" height="56" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="488" y="561" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl get netpol -n serving -o wide</text>
  </g>

  
  <g id="worked-example">
    <rect x="40" y="625" width="1208" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(616, 645)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="4" width="40" height="48" rx="6" />
      <line x1="16" y1="16" x2="40" y2="16" />
      <line x1="16" y1="26" x2="40" y2="26" />
      <line x1="16" y1="36" x2="30" y2="36" />
    </g>
    <text x="644" y="746" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="644" dy="0">Tester pod in edge to vLLM pod in serving, TCP port 8000.</tspan>
      <tspan x="644" dy="44">Prediction: tester is not on the list, so it is dropped.</tspan>
    </text>
  </g>
</svg>