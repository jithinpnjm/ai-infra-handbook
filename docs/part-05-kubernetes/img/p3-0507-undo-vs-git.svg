<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>kubectl rollout undo versus reverting in Git</title>
  <desc>Infographic comparing the transient cluster-only effect of kubectl rollout undo with the durable source-controlled approach of reverting in Git and re-applying manifests.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#c53030"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">kubectl rollout undo versus reverting in Git</text>

  
  <rect x="40" y="100" width="840" height="765" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="70" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#207448">rollout undo only</text>

  
  <rect x="65" y="165" width="790" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="205" r="24" fill="#207448"/>
  <text x="105" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <circle cx="165" cy="205" r="20" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="165,193 165,205 175,205" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  
  <text x="205" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Friday</text>
  
  <text x="95" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="95">kubectl rollout undo stops the error rate,</tspan>
    <tspan x="95" dy="32">cluster healthy in minutes (Deployment only changes</tspan>
    <tspan x="95" dy="32">desired replica counts of its ReplicaSets, old</tspan>
    <tspan x="95" dy="32">ReplicaSet scaled back up)</tspan>
  </text>

  
  <line x1="460" y1="405" x2="460" y2="455" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="65" y="460" width="790" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="105" cy="500" r="24" fill="#207448"/>
  <text x="105" y="508" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <rect x="145" y="482" width="38" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="145" y1="494" x2="183" y2="494" stroke="#207448" stroke-width="3"/>
  <line x1="155" y1="476" x2="155" y2="484" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="173" y1="476" x2="173" y2="484" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <text x="205" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Monday</text>
  
  <text x="95" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="95">teammate applies manifests from source control,</tspan>
    <tspan x="95" dy="34">which still describe the broken version</tspan>
  </text>

  
  <line x1="460" y1="635" x2="460" y2="675" stroke="#c53030" stroke-width="4" marker-end="url(#arrow-red)"/>

  
  <rect x="65" y="680" width="790" height="160" rx="12" fill="#fdf2f2" stroke="#c53030" stroke-width="3"/>
  
  <circle cx="105" cy="735" r="24" fill="#c53030"/>
  <text x="105" y="743" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <polygon points="165,712 145,748 185,748" fill="none" stroke="#c53030" stroke-width="4" stroke-linejoin="round"/>
  <line x1="165" y1="724" x2="165" y2="736" stroke="#c53030" stroke-width="3" stroke-linecap="round"/>
  <circle cx="165" cy="742" r="2" fill="#c53030"/>
  
  <text x="205" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#b91c1c">
    <tspan x="205">error comes back,</tspan>
    <tspan x="205" dy="36">the fix lived only in the cluster</tspan>
  </text>

  
  <rect x="900" y="100" width="660" height="345" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <text x="930" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="930">revert the YAML in Git,</tspan>
    <tspan x="930" dy="36">then kubectl apply</tspan>
  </text>

  
  <line x1="1230" y1="190" x2="1230" y2="235" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="925" y="240" width="610" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  
  <path d="M960,300 L985,285 L1010,300 L1010,325 C1010,345 985,358 985,358 C985,358 960,345 960,325 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="973,318 982,327 998,310" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="1030" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="1030">file and cluster</tspan>
    <tspan x="1030" dy="36">stay the same thing</tspan>
  </text>

  
  <rect x="900" y="465" width="660" height="400" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <text x="930" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="930">Side example of</tspan>
    <tspan x="930" dy="34" font-family="ui-monospace, monospace" font-size="25" fill="#207448">kubectl get replicasets -o wide</tspan>
  </text>

  
  <rect x="925" y="560" width="610" height="280" rx="12" fill="#1e2923" stroke="#207448" stroke-width="2"/>
  
  <rect x="925" y="560" width="610" height="36" rx="12" fill="#2c3b33"/>
  <circle cx="947" cy="578" r="6" fill="#e06c75"/>
  <circle cx="967" cy="578" r="6" fill="#e5c07b"/>
  <circle cx="987" cy="578" r="6" fill="#98c379"/>

  
  <text x="955" y="635" font-family="ui-monospace, monospace" font-size="25" fill="#94a3b8">kuard-1128242161 0 0 0</text>
  
  <text x="955" y="695" font-family="ui-monospace, monospace" font-size="25" fill="#94a3b8">kuard-1570155864 0 0 0</text>
  
  <rect x="945" y="725" width="570" height="42" rx="6" fill="#133323"/>
  <text x="955" y="755" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#4ade80">kuard-2738859366 3 3 3</text>

  
  <rect x="40" y="885" width="1520" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  
  <rect x="155" y="915" width="115" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="212" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">status</text>

  
  <rect x="285" y="915" width="105" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="337" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">pause</text>

  
  <rect x="405" y="915" width="115" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="462" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">resume</text>

  
  <rect x="535" y="915" width="125" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="597" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">history</text>

  
  <rect x="675" y="915" width="325" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="837" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">history --revision=2</text>

  
  <rect x="1015" y="915" width="95" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1062" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">undo</text>

  
  <rect x="1125" y="915" width="315" height="54" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1282" y="950" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">undo --to-revision=3</text>

  
  <rect x="240" y="1000" width="1120" height="62" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1039" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">change-cause annotation goes in spec.template.metadata.annotations</text>
</svg>