<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Node gating and the validator chain</title>
  <desc>A sequence diagram showing the step-by-step coordination between the driver pod, validator pod, toolkit pod, device-plugin pod, and Kubelet during GPU node initialization.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Node gating and the validator chain</text>

  
  
  <line x1="140" y1="210" x2="140" y2="1160" stroke="#cbdcd0" stroke-width="3" stroke-dasharray="8 8" />
  
  <line x1="470" y1="210" x2="470" y2="1160" stroke="#cbdcd0" stroke-width="3" stroke-dasharray="8 8" />
  
  <line x1="800" y1="210" x2="800" y2="1160" stroke="#cbdcd0" stroke-width="3" stroke-dasharray="8 8" />
  
  <line x1="1130" y1="210" x2="1130" y2="1160" stroke="#cbdcd0" stroke-width="3" stroke-dasharray="8 8" />
  
  <line x1="1460" y1="210" x2="1460" y2="1160" stroke="#cbdcd0" stroke-width="3" stroke-dasharray="8 8" />

  
  
  <g transform="translate(30, 95)">
    <rect width="220" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(82, 10)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="18" y="18" width="20" height="20" rx="2" fill="#207448" opacity="0.2"/>
      <line x1="18" y1="4" x2="18" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="4" x2="28" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="38" y1="4" x2="38" y2="10" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="46" x2="18" y2="52" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="46" x2="28" y2="52" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="38" y1="46" x2="38" y2="52" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="4" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="4" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="4" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="46" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="46" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="46" y1="38" x2="52" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">driver pod</text>
  </g>

  
  <g transform="translate(360, 95)">
    <rect width="220" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(82, 10)">
      <path d="M 28 6 L 10 14 C 10 32 20 44 28 50 C 36 44 46 32 46 14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 20 26 L 25 32 L 36 20" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">validator pod</text>
  </g>

  
  <g transform="translate(690, 95)">
    <rect width="220" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(82, 10)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 28 16 L 28 28 L 36 34" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="12" y1="44" x2="4" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="44" y1="44" x2="52" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">toolkit pod</text>
  </g>

  
  <g transform="translate(1020, 95)">
    <rect width="220" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(82, 10)">
      <rect x="14" y="20" width="28" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="20" y1="8" x2="20" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="36" y1="8" x2="36" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 28 42 L 28 52" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">device-plugin pod</text>
  </g>

  
  <g transform="translate(1350, 95)">
    <rect width="220" height="115" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" filter="url(#shadow)"/>
    
    <g transform="translate(82, 10)">
      <circle cx="28" cy="28" r="10" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 28 10 L 28 15 M 28 41 L 28 46 M 10 28 L 15 28 M 41 28 L 46 28 M 15 15 L 19 19 M 37 37 L 41 41 M 15 41 L 19 37 M 37 15 L 41 19" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Kubelet</text>
  </g>

  

  
  <g id="step-1">
    
    <circle cx="92" cy="256" r="22" fill="#207448" />
    <text x="92" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 140 236 C 70 236, 70 276, 136 276" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="156" y="226" width="300" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="168" y="250" font-family="sans-serif" font-size="24" fill="#303a36">build and load</text>
    <text x="168" y="276" font-family="monospace" font-size="24" fill="#303a36">nvidia kernel modules</text>
  </g>

  
  <g id="step-2">
    
    <circle cx="422" cy="356" r="22" fill="#207448" />
    <text x="422" y="365" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <path d="M 470 336 C 400 336, 400 376, 466 376" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="486" y="326" width="306" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="498" y="350" font-family="monospace" font-size="24" fill="#303a36">driver-validation</text>
    <text x="498" y="376" font-family="sans-serif" font-size="24" fill="#303a36">init loops until driver works</text>
  </g>

  
  <g id="step-3">
    
    <circle cx="422" cy="456" r="22" fill="#207448" />
    <text x="422" y="465" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <path d="M 470 436 C 400 436, 400 476, 466 476" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="486" y="426" width="316" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="498" y="450" font-family="sans-serif" font-size="24" fill="#303a36">write <tspan font-family="monospace">driver-ready</tspan> in</text>
    <text x="498" y="476" font-family="monospace" font-size="24" fill="#303a36">run-nvidia-validations</text>
  </g>

  
  <g id="step-4">
    
    <circle cx="752" cy="556" r="22" fill="#207448" />
    <text x="752" y="565" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <path d="M 800 536 C 730 536, 730 576, 796 576" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="816" y="534" width="300" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="828" y="566" font-family="sans-serif" font-size="24" fill="#303a36">init waits for <tspan font-family="monospace">driver-ready</tspan></text>
  </g>

  
  <g id="step-5">
    
    <circle cx="752" cy="656" r="22" fill="#207448" />
    <text x="752" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    
    <path d="M 800 636 C 730 636, 730 676, 796 676" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="816" y="626" width="300" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="828" y="650" font-family="sans-serif" font-size="24" fill="#303a36">install container toolkit</text>
    <text x="828" y="676" font-family="sans-serif" font-size="24" fill="#303a36">and configure runtime</text>
  </g>

  
  <g id="step-6">
    
    <circle cx="422" cy="756" r="22" fill="#207448" />
    <text x="422" y="765" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    
    <path d="M 470 736 C 400 736, 400 776, 466 776" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="486" y="734" width="300" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="498" y="766" font-family="sans-serif" font-size="24" fill="#303a36">write <tspan font-family="monospace">toolkit-ready</tspan></text>
  </g>

  
  <g id="step-7">
    
    <circle cx="1082" cy="856" r="22" fill="#207448" />
    <text x="1082" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
    
    <path d="M 1130 836 C 1060 836, 1060 876, 1126 876" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="1146" y="826" width="418" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="1158" y="850" font-family="sans-serif" font-size="24" fill="#303a36">init waits for <tspan font-family="monospace">toolkit-ready</tspan></text>
    <text x="1158" y="876" font-family="sans-serif" font-size="24" fill="#303a36">and live <tspan font-family="monospace">nvidia</tspan> module</text>
  </g>

  
  <g id="step-8">
    
    <circle cx="1200" cy="946" r="22" fill="#db8129" />
    <text x="1200" y="955" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
    
    <line x1="1130" y1="946" x2="1456" y2="946" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
    
    <rect x="1232" y="920" width="206" height="52" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1242" y="954" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">register <tspan font-family="monospace">nvidia.com/gpu</tspan></text>
  </g>

  
  <g id="step-9">
    
    <circle cx="422" cy="1066" r="22" fill="#207448" />
    <text x="422" y="1075" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">9</text>
    
    <path d="M 470 1046 C 400 1046, 400 1086, 466 1086" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    <rect x="486" y="1036" width="480" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <text x="498" y="1060" font-family="sans-serif" font-size="24" fill="#303a36">run CUDA workload validation then write</text>
    <text x="498" y="1086" font-family="monospace" font-size="24" fill="#303a36">plugin-ready <tspan font-family="sans-serif">and</tspan> cuda-ready</text>
  </g>
</svg>