<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Multi-node: how pods on different nodes talk</title>
  <desc>Technical infographic explaining multi-node pod networking across Node A and Node B via overlay, routed, and underlay-native mechanisms.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 15 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 15 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Multi-node: how pods on different nodes talk</text>

  
  <g id="subgraph-a">
    <rect x="40" y="105" width="440" height="1040" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="232" y="125" width="56" height="34" rx="4" />
      <line x1="242" y1="142" x2="264" y2="142" />
      <circle cx="274" cy="142" r="2" fill="#207448" />
      <circle cx="280" cy="142" r="2" fill="#207448" />
    </g>
    
    
    <text x="260" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node A (10.244.1.0/24)</text>

    
    <rect x="60" y="225" width="400" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="232" y="242" width="56" height="40" rx="4" />
      <line x1="232" y1="256" x2="288" y2="256" stroke-width="2" />
      <circle cx="242" cy="249" r="1.5" fill="#207448" />
      <circle cx="248" cy="249" r="1.5" fill="#207448" />
      <circle cx="254" cy="249" r="1.5" fill="#207448" />
    </g>
    <text x="260" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">pod 10.244.1.12 eth0</text>

    
    <line x1="260" y1="360" x2="260" y2="400" stroke="#207448" stroke-width="4" />

    
    <rect x="60" y="400" width="400" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="232" y="415" width="56" height="34" rx="4" />
      <line x1="244" y1="437" x2="244" y2="445" />
      <line x1="252" y1="437" x2="252" y2="445" />
      <line x1="260" y1="437" x2="260" y2="445" />
      <line x1="268" y1="437" x2="268" y2="445" />
      <line x1="276" y1="437" x2="276" y2="445" />
    </g>
    <text x="260" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">veth</text>

    
    <line x1="260" y1="510" x2="260" y2="550" stroke="#207448" stroke-width="4" />

    
    <rect x="60" y="550" width="400" height="575" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="232" y="575" width="56" height="38" rx="4" />
      <path d="M 242 588 L 278 588 M 272 584 L 278 588 L 272 592" />
      <path d="M 278 600 L 242 600 M 248 596 L 242 600 L 248 604" />
    </g>
    <text x="260" y="652" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="260" dy="0">cni0 bridge /</tspan>
      <tspan x="260" dy="36">or routed /32</tspan>
    </text>
  </g>

  
  <g id="subgraph-b">
    <rect x="1120" y="105" width="440" height="1040" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1312" y="125" width="56" height="34" rx="4" />
      <line x1="1322" y1="142" x2="1344" y2="142" />
      <circle cx="1354" cy="142" r="2" fill="#207448" />
      <circle cx="1360" cy="142" r="2" fill="#207448" />
    </g>
    
    
    <text x="1340" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node B (10.244.2.0/24)</text>

    
    <rect x="1140" y="225" width="400" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1312" y="242" width="56" height="40" rx="4" />
      <line x1="1312" y1="256" x2="1368" y2="256" stroke-width="2" />
      <circle cx="1322" cy="249" r="1.5" fill="#207448" />
      <circle cx="1328" cy="249" r="1.5" fill="#207448" />
      <circle cx="1334" cy="249" r="1.5" fill="#207448" />
    </g>
    <text x="1340" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">pod 10.244.2.7 eth0</text>

    
    <line x1="1340" y1="360" x2="1340" y2="400" stroke="#207448" stroke-width="4" />

    
    <rect x="1140" y="400" width="400" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1312" y="415" width="56" height="34" rx="4" />
      <line x1="1324" y1="437" x2="1324" y2="445" />
      <line x1="1332" y1="437" x2="1332" y2="445" />
      <line x1="1340" y1="437" x2="1340" y2="445" />
      <line x1="1348" y1="437" x2="1348" y2="445" />
      <line x1="1356" y1="437" x2="1356" y2="445" />
    </g>
    <text x="1340" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">veth</text>

    
    <line x1="1340" y1="510" x2="1340" y2="550" stroke="#207448" stroke-width="4" />

    
    <rect x="1140" y="550" width="400" height="575" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="1312" y="575" width="56" height="38" rx="4" />
      <path d="M 1322 588 L 1358 588 M 1352 584 L 1358 588 L 1352 592" />
      <path d="M 1358 600 L 1322 600 M 1328 596 L 1322 600 L 1328 604" />
    </g>
    <text x="1340" y="670" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">cni0 / routes</text>
  </g>

  

  
  <g id="connection-overlay">
    <line x1="460" y1="710" x2="1140" y2="710" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    <rect x="520" y="726" width="560" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0" font-weight="bold">1) Overlay: VXLAN/Geneve/IPIP</tspan>
      <tspan x="800" dy="28">encapsulation over node IPs</tspan>
    </text>
  </g>

  
  <g id="connection-routed">
    <line x1="460" y1="835" x2="1140" y2="835" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <rect x="520" y="851" width="560" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="889" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0" font-weight="bold">2) Routed:</tspan>
      <tspan x="800" dy="28">node route 10.244.2.0/24 via nodeB</tspan>
      <tspan x="800" dy="28">(static, BGP, cloud route table)</tspan>
    </text>
  </g>

  
  <g id="connection-underlay">
    <line x1="460" y1="995" x2="1140" y2="995" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <rect x="520" y="1011" width="560" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="800" y="1049" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0" font-weight="bold">3) Underlay-native:</tspan>
      <tspan x="800" dy="28">pod IPs from the VPC/fabric subnet</tspan>
      <tspan x="800" dy="28">(ENI, SR-IOV, macvlan)</tspan>
    </text>
  </g>
</svg>