<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070">
  <title>Warm buffer nodes hidden by negative-priority pause pods</title>
  <desc>Three-stage diagram showing low-priority pause pods holding a warm GPU node in steady state, a production inference pod preempting them with zero wait during a traffic spike, and the Cluster Autoscaler rebuilding the buffer node in the background.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="1070" fill="#f5f8f5" />
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Warm buffer nodes hidden by negative-priority pause pods</text>
  <g id="stage-1">
    <rect x="40" y="120" width="480" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="80" cy="165" r="24" fill="#207448" />
    <text x="80" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="120" y="174" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Steady state</text>
    <g transform="translate(436, 137)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="44" rx="8" />
      <rect x="18" y="18" width="20" height="20" rx="3" />
      <line x1="16" y1="0" x2="16" y2="6" />
      <line x1="28" y1="0" x2="28" y2="6" />
      <line x1="40" y1="0" x2="40" y2="6" />
      <line x1="16" y1="50" x2="16" y2="56" />
      <line x1="28" y1="50" x2="28" y2="56" />
      <line x1="40" y1="50" x2="40" y2="56" />
      <line x1="0" y1="16" x2="6" y2="16" />
      <line x1="0" y1="28" x2="6" y2="28" />
      <line x1="0" y1="40" x2="6" y2="40" />
      <line x1="50" y1="16" x2="56" y2="16" />
      <line x1="50" y1="28" x2="56" y2="28" />
      <line x1="50" y1="40" x2="56" y2="40" />
    </g>
    <rect x="65" y="215" width="430" height="460" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(85, 240)">
      <rect x="0" y="0" width="85" height="55" rx="6" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" />
      <rect x="98" y="0" width="85" height="55" rx="6" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" />
      <rect x="196" y="0" width="85" height="55" rx="6" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" />
      <rect x="294" y="0" width="96" height="55" rx="6" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" />
    </g>
    <text x="280" y="360" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">cluster-overprovisioner</text>
    <text x="280" y="435" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">value -10</text>
    <text x="280" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">reserving nearly all </tspan>
      <tspan x="280" dy="32">of the node</tspan>
    </text>
    <rect x="65" y="700" width="430" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="280" y="750" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">pause pods consume </tspan>
      <tspan x="280" dy="32">no real resources</tspan>
    </text>
  </g>
  <g id="stage-2">
    <rect x="560" y="120" width="480" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="600" cy="165" r="24" fill="#207448" />
    <text x="600" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="640" y="174" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Traffic spike</text>
    <g transform="translate(956, 137)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="32,2 10,32 28,32 22,54 46,24 28,24" />
    </g>
    <rect x="585" y="215" width="430" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="800" y="265" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">production inference pod</text>
    <text x="800" y="308" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">priority 0 or more</text>
    <line x1="620" y1="340" x2="620" y2="515" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
    <circle cx="620" cy="425" r="22" fill="#207448" />
    <text x="620" y="433" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="660" y="405" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="660" dy="0">kube-scheduler preempts </tspan>
      <tspan x="660" dy="30">the pause pods, </tspan>
      <tspan x="660" dy="30">with a 0 s node wait</tspan>
    </text>
    <rect x="585" y="525" width="430" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="605" y="545" width="390" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="640" cy="592" r="14" fill="#207448" />
    <polyline points="632,592 638,598 649,586" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="605" y="655" width="390" height="145" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="3" stroke-dasharray="6 4" />
    <g transform="translate(620, 680)">
      <rect x="0" y="0" width="75" height="48" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2" />
      <rect x="90" y="0" width="75" height="48" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2" />
      <rect x="180" y="0" width="75" height="48" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2" />
      <rect x="270" y="0" width="85" height="48" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="2" />
      <path d="M 370 12 L 382 24 L 370 36" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <g id="stage-3">
    <rect x="1080" y="120" width="480" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="1120" cy="165" r="24" fill="#207448" />
    <text x="1120" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1160" y="174" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Buffer rebuilt</text>
    <g transform="translate(1476, 137)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 48 24 A 20 20 0 1 0 44 38" />
      <polyline points="48,12 48,24 36,24" />
    </g>
    <rect x="1105" y="215" width="430" height="125" rx="12" fill="#ffffff" stroke="#7a8c82" stroke-width="2.5" stroke-dasharray="8 6" />
    <g transform="translate(1125, 235)">
      <rect x="0" y="0" width="85" height="45" rx="4" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="98" y="0" width="85" height="45" rx="4" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="196" y="0" width="85" height="45" rx="4" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="294" y="0" width="96" height="45" rx="4" fill="#f0f3f1" stroke="#7a8c82" stroke-width="2" stroke-dasharray="4 3" />
    </g>
    <text x="1320" y="315" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#7a8c82">Pending</text>
    <line x1="1320" y1="340" x2="1320" y2="425" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
    <rect x="1105" y="435" width="430" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(1130, 475)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
    </g>
    <text x="1340" y="520" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cluster Autoscaler</text>
    <rect x="1105" y="605" width="430" height="215" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
    <g transform="translate(1130, 680)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="0" y="0" width="56" height="42" rx="4" />
      <line x1="10" y1="14" x2="26" y2="14" />
      <line x1="10" y1="28" x2="26" y2="28" />
      <circle cx="44" cy="14" r="3" fill="#207448" />
      <circle cx="44" cy="28" r="3" fill="#207448" />
    </g>
    <text x="1330" y="700" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1330" dy="0">a new node joins </tspan>
      <tspan x="1330" dy="32">in the background</tspan>
    </text>
  </g>
  <rect x="40" y="875" width="1520" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="918" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the real pod starts at once on the warm node, instead of waiting for a new node to boot</text>
  <rect x="40" y="965" width="1520" height="65" rx="12" fill="#207448" />
  <text x="800" y="1007" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">pause pods hold a warm node so the next burst does not wait for a new one to boot</text>
</svg>