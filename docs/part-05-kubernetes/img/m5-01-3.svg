<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <title>GPU containers</title>
  <desc>Visual explanation of GPU container initialization, NVIDIA Container Toolkit hook or CDI spec, host library and device injection, and runtime execution.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 15 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="85" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">GPU containers</text>

  
  <rect x="48" y="150" width="340" height="660" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <rect x="64" y="166" width="308" height="180" rx="12" fill="#e8f1ea" />
  
  
  <circle cx="218" cy="210" r="24" fill="#207448" />
  <text x="218" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  
  <rect x="190" y="262" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="190" y1="276" x2="246" y2="276" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 199 290 L 206 295 L 199 300" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="212" y1="300" x2="223" y2="300" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <rect x="64" y="420" width="308" height="200" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="218" y="500" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="218" dy="0">docker run</tspan>
    <tspan x="218" dy="46">--gpus all / CDI</tspan>
  </text>

  
  <line x1="388" y1="480" x2="436" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="436" y="150" width="340" height="660" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <rect x="452" y="166" width="308" height="180" rx="12" fill="#e8f1ea" />
  
  
  <circle cx="606" cy="210" r="24" fill="#207448" />
  <text x="606" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  
  <circle cx="606" cy="286" r="14" fill="none" stroke="#207448" stroke-width="4" />
  <circle cx="606" cy="286" r="6" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 606 264 L 606 270 M 606 302 L 606 308 M 584 286 L 590 286 M 622 286 L 628 286 M 590 270 L 595 275 M 617 297 L 622 302 M 590 302 L 595 297 M 617 275 L 622 270" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="606" y="440" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="606" dy="0">NVIDIA</tspan>
    <tspan x="606" dy="44">Container Toolkit</tspan>
  </text>
  <rect x="452" y="550" width="308" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="606" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="606" dy="0">(hook or CDI spec)</tspan>
  </text>

  
  <line x1="776" y1="480" x2="824" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="824" y="150" width="340" height="660" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  
  <rect x="840" y="166" width="308" height="180" rx="12" fill="#e8f1ea" />
  
  
  <circle cx="994" cy="210" r="24" fill="#207448" />
  <text x="994" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  
  <rect x="974" y="262" width="40" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="994" y1="254" x2="994" y2="262" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="982" y1="290" x2="982" y2="308" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="994" y1="290" x2="994" y2="314" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="1006" y1="290" x2="1006" y2="308" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
  <text x="994" y="415" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="994" dy="0">Injects</tspan>
    <tspan x="994" dy="40" font-family="monospace" font-size="26">/dev/nvidia*</tspan>
    <tspan x="994" dy="40">and host libs:</tspan>
  </text>
  
  <rect x="840" y="540" width="308" height="190" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="994" y="595" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="994" dy="0">libcuda.so,</tspan>
    <tspan x="994" dy="42">libnvidia-ml.so,</tspan>
    <tspan x="994" dy="42">nvidia-smi</tspan>
  </text>

  
  <line x1="1164" y1="480" x2="1212" y2="480" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1212" y="150" width="340" height="660" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <rect x="1228" y="166" width="308" height="180" rx="12" fill="#e8f1ea" />
  
  
  <circle cx="1382" cy="210" r="24" fill="#207448" />
  <text x="1382" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  
  <rect x="1356" y="262" width="52" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="1369" y="274" width="26" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="1348" y1="274" x2="1356" y2="274" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1348" y1="286" x2="1356" y2="286" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1348" y1="298" x2="1356" y2="298" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1408" y1="274" x2="1416" y2="274" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1408" y1="286" x2="1416" y2="286" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="1408" y1="298" x2="1416" y2="298" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <text x="1382" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1382" dy="0">Container CUDA</tspan>
    <tspan x="1382" dy="44">runtime/cuDNN/</tspan>
    <tspan x="1382" dy="44">NCCL</tspan>
  </text>
  
  <rect x="1228" y="570" width="308" height="150" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1382" y="630" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="1382" dy="0">calls host</tspan>
    <tspan x="1382" dy="42" font-family="monospace" font-weight="bold">libcuda.so</tspan>
  </text>
</svg>