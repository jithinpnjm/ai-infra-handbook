<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Calculating Node Allocatable from Raw Capacity</title>
  <desc>Infographic explaining Kubernetes Node Allocatable resource calculation from Total Node Capacity minus reserved brackets.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Calculating Node Allocatable from Raw Capacity</text>

  
  
  

  
  <rect x="80" y="140" width="340" height="380" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  
  <g transform="translate(222, 160)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="8" width="40" height="40" rx="6" fill="#ffffff"/>
    <rect x="18" y="18" width="20" height="20" rx="3" fill="#e8f1ea"/>
    <line x1="16" y1="2" x2="16" y2="8"/><line x1="28" y1="2" x2="28" y2="8"/><line x1="40" y1="2" x2="40" y2="8"/>
    <line x1="16" y1="48" x2="16" y2="54"/><line x1="28" y1="48" x2="28" y2="54"/><line x1="40" y1="48" x2="40" y2="54"/>
    <line x1="2" y1="16" x2="8" y2="16"/><line x1="2" y1="28" x2="8" y2="28"/><line x1="2" y1="40" x2="8" y2="40"/>
    <line x1="48" y1="16" x2="54" y2="16"/><line x1="48" y1="28" x2="54" y2="28"/><line x1="48" y1="40" x2="54" y2="40"/>
  </g>

  <text x="250" y="250" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Total Node Capacity</text>
  <text x="250" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(e.g., CPU, Memory,</text>
  <text x="250" y="328" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Ephemeral Storage)</text>
  
  
  <rect x="110" y="380" width="280" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="120" y="390" width="260" height="70" rx="6" fill="#207448" opacity="0.2"/>
  <line x1="250" y1="390" x2="250" y2="460" stroke="#207448" stroke-width="2" stroke-dasharray="4,4"/>

  
  <circle cx="445" cy="330" r="22" fill="#207448"/>
  <line x1="433" y1="330" x2="457" y2="330" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  
  
  <rect x="470" y="140" width="655" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(490, 168)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="14"/>
    <path d="M28 6 L28 12 M28 44 L28 50 M6 28 L12 28 M44 28 L50 28 M12 12 L17 17 M39 39 L44 44 M12 44 L17 39 M39 17 L44 12"/>
  </g>
  <text x="560" y="178" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">kube-reserved</text>
  <text x="560" y="210" font-family="sans-serif" font-size="24" fill="#303a36">(for kubelet, containerd, node problem</text>
  <text x="560" y="238" font-family="sans-serif" font-size="24" fill="#303a36">detector; e.g. 4Gi RAM, cores 0-3)</text>

  
  <rect x="470" y="272" width="655" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(490, 300)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="6" y="8" width="44" height="40" rx="6"/>
    <line x1="6" y1="20" x2="50" y2="20"/>
    <circle cx="14" cy="14" r="2" fill="#207448"/>
    <circle cx="22" cy="14" r="2" fill="#207448"/>
    <path d="M16 32 L22 36 L16 40"/>
  </g>
  <text x="560" y="310" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">system-reserved</text>
  <text x="560" y="342" font-family="sans-serif" font-size="24" fill="#303a36">(for sshd, systemd, udev,</text>
  <text x="560" y="370" font-family="sans-serif" font-size="24" fill="#303a36">OS daemons; e.g. 8Gi RAM)</text>

  
  <rect x="470" y="405" width="655" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(490, 433)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M28 8 L46 16 L46 30 C46 42 28 48 28 48 C28 48 10 42 10 30 L10 16 Z"/>
    <line x1="28" y1="20" x2="28" y2="30"/>
    <circle cx="28" cy="37" r="1.5" fill="#207448"/>
  </g>
  <text x="560" y="443" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">eviction-threshold</text>
  <text x="560" y="475" font-family="sans-serif" font-size="24" fill="#303a36">(hard eviction threshold reserve</text>
  <text x="560" y="503" font-family="sans-serif" font-size="24" fill="#303a36">e.g. 2Gi RAM)</text>

  
  <circle cx="1150" cy="330" r="22" fill="#207448"/>
  <line x1="1138" y1="324" x2="1162" y2="324" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="1138" y1="336" x2="1162" y2="336" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="1175" y="140" width="345" height="380" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  
  <g transform="translate(1319, 160)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" fill="#ffffff"/>
    <path d="M14 36 A18 18 0 1 1 42 36"/>
    <line x1="28" y1="28" x2="38" y2="18"/>
  </g>

  <text x="1347" y="250" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Allocatable</text>

  
  <rect x="1205" y="280" width="285" height="190" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="1220" y="295" width="255" height="160" rx="6" fill="#207448" opacity="0.35"/>
  <line x1="1220" y1="375" x2="1475" y2="375" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>

  
  <line x1="1347" y1="520" x2="1347" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  
  

  
  <rect x="80" y="580" width="440" height="540" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(105, 605)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="48" height="46" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <line x1="16" y1="2" x2="16" y2="8"/>
    <line x1="40" y1="2" x2="40" y2="8"/>
    <circle cx="16" cy="30" r="3" fill="#207448"/>
    <circle cx="28" cy="30" r="3" fill="#207448"/>
    <circle cx="40" cy="30" r="3" fill="#207448"/>
    <circle cx="16" cy="42" r="3" fill="#207448"/>
    <circle cx="28" cy="42" r="3" fill="#207448"/>
  </g>
  <text x="175" y="642" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Kubernetes Scheduler</text>

  
  <rect x="105" y="700" width="390" height="240" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
  
  
  <g transform="translate(272, 725)" stroke="#db8129" stroke-width="3" fill="none">
    <path d="M4 26 C14 12 38 12 48 26 C38 40 14 40 4 26 Z"/>
    <circle cx="26" cy="26" r="8"/>
    <circle cx="26" cy="26" r="3" fill="#db8129"/>
  </g>
  
  <text x="300" y="825" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">raw Capacity is never what</text>
  <text x="300" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">the scheduler sees.</text>

  
  <line x1="520" y1="850" x2="560" y2="850" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="560" y="580" width="960" height="540" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>
  
  
  <rect x="585" y="605" width="330" height="46" rx="8" fill="#207448"/>
  <text x="750" y="636" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">enforceNodeAllocatable</text>

  
  <rect x="585" y="670" width="910" height="425" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(615, 692)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="20" height="16" rx="3"/>
    <rect x="28" y="28" width="20" height="16" rx="3"/>
    <path d="M14 22 L14 36 L28 36"/>
  </g>
  <text x="675" y="722" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">pods</text>

  
  <text x="1040" y="722" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Pod Requests must fit entirely inside Allocatable.</text>

  
  <rect x="615" y="760" width="850" height="190" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>

  
  <rect x="625" y="770" width="530" height="170" rx="8" fill="#207448" opacity="0.18"/>

  
  <rect x="645" y="830" width="140" height="90" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="805" y="830" width="150" height="90" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <rect x="975" y="830" width="160" height="90" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <text x="890" y="805" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Allocated Resources</text>

  
  <line x1="1155" y1="770" x2="1155" y2="940" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>

  
  <text x="1040" y="995" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">sum of current pod requests/limits within Allocatable</text>
</svg>