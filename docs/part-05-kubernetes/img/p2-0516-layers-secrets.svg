<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Defence in depth: layers from hardware up</title>
  <desc>Defence in depth security layers visualised as stacked slabs from hardware up with progressive locks, side risk coverage arrow, and host access etcd risk note.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Defence in depth: layers from hardware up</text>

  
  <g id="side-arrow-group">
    
    <path d="M 320 155 L 295 155 L 295 780" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)" />
    
    
    <rect x="46" y="365" width="230" height="204" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="161" y="420" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="161" dy="0">Each layer</tspan>
      <tspan x="161" dy="34">covers a risk</tspan>
      <tspan x="161" dy="34">the layer above</tspan>
      <tspan x="161" dy="34">cannot cover</tspan>
    </text>
  </g>

  
  <g id="stacked-slabs">
    
    <g id="layer-5">
      <rect x="330" y="153" width="760" height="108" rx="12" fill="#d3e4d6" />
      <rect x="330" y="145" width="760" height="108" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      
      <g id="lock-5">
        <path d="M 372 178 V 160 A 23 23 0 0 1 418 160 V 178" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <rect x="357" y="178" width="76" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4" />
        <circle cx="395" cy="198" r="4.5" fill="#207448" />
        <path d="M 395 202 V 214" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      </g>
      <text x="465" y="193" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="465" dy="0">RBAC: least-privilege</tspan>
        <tspan x="465" dy="36">Roles for each workload</tspan>
      </text>
    </g>

    
    <g id="layer-4">
      <rect x="330" y="285" width="760" height="108" rx="12" fill="#d3e4d6" />
      <rect x="330" y="277" width="760" height="108" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      
      <g id="lock-4">
        <path d="M 376 313 V 298 A 19 19 0 0 1 414 298 V 313" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
        <rect x="363" y="313" width="64" height="42" rx="7" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
        <circle cx="395" cy="330" r="3.5" fill="#207448" />
        <path d="M 395 333 V 343" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="465" y="325" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="465" dy="0">Encryption at rest for Secrets</tspan>
        <tspan x="465" dy="36">(KMS or static key)</tspan>
      </text>
    </g>

    
    <g id="layer-3">
      <rect x="330" y="417" width="760" height="108" rx="12" fill="#fcdbbd" />
      <rect x="330" y="409" width="760" height="108" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="4" />
      
      <g id="lock-3">
        <path d="M 380 449 V 437 A 15 15 0 0 1 410 437 V 449" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
        <rect x="369" y="449" width="52" height="35" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
        <circle cx="395" cy="463" r="3" fill="#207448" />
        <path d="M 395 466 V 474" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <text x="465" y="473" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Host and API server access</text>
    </g>

    
    <g id="layer-2">
      <rect x="330" y="549" width="760" height="108" rx="12" fill="#d3e4d6" />
      <rect x="330" y="541" width="760" height="108" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      
      <g id="lock-2">
        <path d="M 383 584 V 574 A 12 12 0 0 1 407 574 V 584" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <rect x="374" y="584" width="42" height="28" rx="5" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <circle cx="395" cy="595" r="2.5" fill="#207448" />
        <path d="M 395 597 V 604" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <text x="465" y="589" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="465" dy="0">Drive retirement: zero out,</tspan>
        <tspan x="465" dy="36">then crush or shred</tspan>
      </text>
    </g>

    
    <g id="layer-1">
      <rect x="330" y="681" width="760" height="108" rx="12" fill="#d3e4d6" />
      <rect x="330" y="673" width="760" height="108" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      
      <g id="lock-1">
        <path d="M 386 719 V 711 A 9 9 0 0 1 404 711 V 719" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
        <rect x="379" y="719" width="32" height="22" rx="4" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
        <circle cx="395" cy="728" r="2" fill="#207448" />
        <path d="M 395 730 V 735" stroke="#207448" stroke-width="2" stroke-linecap="round" />
      </g>
      <text x="465" y="737" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Physical datacenter security</text>
    </g>
  </g>

  
  <g id="right-side-panel">
    
    <rect x="1140" y="145" width="414" height="215" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <g id="house-icon">
      
      <path d="M 1300 215 L 1347 172 L 1394 215" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 1312 215 V 256 H 1382 V 215" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      
      
      <path d="M 1338 256 V 236 H 1356 V 256" fill="none" stroke="#207448" stroke-width="2" />
      
      
      <path d="M 1344 242 V 238 A 3 3 0 0 1 1350 238 V 242" fill="none" stroke="#207448" stroke-width="1.5" />
      <rect x="1342" y="242" width="10" height="8" rx="1.5" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

      
      <rect x="1319" y="224" width="13" height="13" rx="2" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <path d="M 1323 227 V 224 A 2.5 2.5 0 0 1 1328 224 V 227" fill="none" stroke="#207448" stroke-width="1.2" />
      <rect x="1321" y="227" width="9" height="7" rx="1" fill="#e8f1ea" stroke="#207448" stroke-width="1.2" />

      
      <rect x="1362" y="224" width="13" height="13" rx="2" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <path d="M 1366 227 V 224 A 2.5 2.5 0 0 1 1371 224 V 227" fill="none" stroke="#207448" stroke-width="1.2" />
      <rect x="1364" y="227" width="9" height="7" rx="1" fill="#e8f1ea" stroke="#207448" stroke-width="1.2" />

      
      <path d="M 1344 195 V 190 A 3 3 0 0 1 1350 190 V 195" fill="none" stroke="#207448" stroke-width="1.5" />
      <rect x="1342" y="195" width="10" height="8" rx="1.5" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    </g>

    
    <text x="1347" y="284" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1347" dy="0">Several locks,</tspan>
      <tspan x="1347" dy="32">no single lock</tspan>
      <tspan x="1347" dy="32">is the plan</tspan>
    </text>

    
    <path d="M 1140 409 H 1554 A 12 12 0 0 1 1566 421 V 505 A 12 12 0 0 1 1554 517 H 1140 A 12 12 0 0 1 1128 505 V 475 L 1105 463 L 1128 451 V 421 A 12 12 0 0 1 1140 409 Z" fill="#fff9f3" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <text x="1347" y="452" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1347" dy="0">Anyone with root on the</tspan>
      <tspan x="1347" dy="34">host can read etcd</tspan>
    </text>
  </g>

  
  <g id="bottom-caption">
    <rect x="100" y="860" width="1400" height="76" rx="14" fill="#207448" />
    <text x="800" y="907" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Most teams start with safe enough, then harden over time.</text>
  </g>
</svg>