  <text x="955" y="492" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">leaf2 (ASN 65102)</text>

  
  <rect x="1025" y="650" width="325" height="275" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1160, 672)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="54" height="22" rx="4" />
