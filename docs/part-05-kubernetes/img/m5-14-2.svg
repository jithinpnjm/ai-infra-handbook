    <tspan x="587" dy="50" font-family="monospace" font-size="24" font-weight="bold">pods 10.244.1.64/26</tspan>
  </text>

  
  <rect x="820" y="370" width="735" height="585" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="855" y="412" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Rack 2</text>

  
