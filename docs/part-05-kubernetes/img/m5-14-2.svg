  <text x="675" y="203" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spine1</text>

  
  <rect x="575" y="248" width="450" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(595, 259)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
