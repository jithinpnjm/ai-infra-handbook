  <text x="80" y="412" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Rack 1</text>

  
  <rect x="75" y="435" width="675" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
