    <circle cx="42" cy="39" r="2.5" fill="#207448" />
  </g>
  <text x="1187" y="775" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1187" dy="0">node3</tspan>
    <tspan x="1187" dy="50" font-family="monospace" font-size="24" font-weight="bold">pods 10.244.2.0/26</tspan>
  </text>

  
  
  <path d="M 440 435 V 204 Q 440 192 452 192 H 575" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />

  
