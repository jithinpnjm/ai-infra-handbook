<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Routed designs with BGP</title>
  <desc>Architecture diagram illustrating a BGP-routed leaf-spine network topology with dual spines, two racks, leaf switches, and host nodes running eBGP peering for pod CIDRs.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Routed designs with BGP</text>

  
  <rect x="540" y="100" width="520" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="138" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Spine layer</text>

  
