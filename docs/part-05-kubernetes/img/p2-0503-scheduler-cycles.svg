<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>Filter, score and bind: three candidate nodes</title>
  <desc>Visual explanation of the Kubernetes scheduling flow: Filter, Score, and Binding for three candidate nodes.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="920" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Filter, score and bind: three candidate nodes</text>

  
  <g id="top-band">
    <rect x="420" y="80" width="760" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="114" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Filter is yes or no, Score is a ranking</text>
  </g>

  
  <g id="phase-1">
    
    <rect x="45" y="175" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="95" cy="235" r="24" fill="none" stroke="#207448" stroke-width="3.5"/>
    <polyline points="95,219 95,235 107,235" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="140" y="226" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="140" dy="0">Training pod</tspan>
      <tspan x="140" dy="32">asks for GPUs</tspan>
    </text>

    
    <rect x="45" y="325" width="340" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="65" y="362" width="54" height="50" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="72" y1="379" x2="112" y2="379" stroke="#207448" stroke-width="3"/>
    <line x1="72" y1="395" x2="112" y2="395" stroke="#207448" stroke-width="3"/>
    <circle cx="76" cy="371" r="2.5" fill="#207448"/>
    <circle cx="84" cy="371" r="2.5" fill="#207448"/>
    
    <text x="135" y="376" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="135" dy="0">Node A:</tspan>
      <tspan x="135" dy="32">no free GPUs</tspan>
    </text>

    
    <rect x="45" y="480" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="65" y="515" width="54" height="50" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="72" y1="532" x2="112" y2="532" stroke="#207448" stroke-width="3"/>
    <line x1="72" y1="548" x2="112" y2="548" stroke="#207448" stroke-width="3"/>
    <circle cx="76" cy="524" r="2.5" fill="#207448"/>
    <circle cx="84" cy="524" r="2.5" fill="#207448"/>
    
    <text x="135" y="550" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Node B</text>

    
    <rect x="45" y="630" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="65" y="665" width="54" height="50" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="72" y1="682" x2="112" y2="682" stroke="#207448" stroke-width="3"/>
    <line x1="72" y1="698" x2="112" y2="698" stroke="#207448" stroke-width="3"/>
    <circle cx="76" cy="674" r="2.5" fill="#207448"/>
    <circle cx="84" cy="674" r="2.5" fill="#207448"/>
    
    <text x="135" y="700" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Node C</text>
  </g>

  
  <g id="phase-2">
    
    <rect x="433" y="175" width="340" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="603" y="215" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="603" dy="0">Scheduling cycle,</tspan>
      <tspan x="603" dy="34">Filter</tspan>
    </text>

    
    <rect x="433" y="325" width="340" height="125" rx="10" fill="#fdeded" stroke="#d32f2f" stroke-width="2"/>
    
    <circle cx="480" cy="387" r="24" fill="#d32f2f"/>
    <line x1="469" y1="376" x2="491" y2="398" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="491" y1="376" x2="469" y2="398" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    
    <text x="525" y="376" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d32f2f">
      <tspan x="525" dy="0">Filter</tspan>
      <tspan x="525" dy="32">removes it</tspan>
    </text>

    
    <rect x="433" y="480" width="340" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="480" cy="542" r="22" fill="#207448"/>
    <polyline points="471,542 478,549 489,535" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <line x1="480" y1="570" x2="480" y2="664" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 4"/>
    
    <circle cx="480" cy="692" r="22" fill="#207448"/>
    <polyline points="471,692 478,699 489,685" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="610" y="625" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Pass the filter</text>
  </g>

  
  <g id="phase-3">
    
    <rect x="820" y="175" width="340" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="990" y="215" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="990" dy="0">Scheduling cycle,</tspan>
      <tspan x="990" dy="34">Score</tspan>
    </text>

    
    <rect x="820" y="325" width="340" height="125" rx="10" fill="#fbfdfb" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="6 6"/>

    
    <rect x="820" y="480" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="845" y="505" width="290" height="22" rx="5" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="845" y="505" width="235" height="22" rx="5" fill="#78909c"/>
    
    <text x="990" y="556" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="990" dy="0">Fuller memory</tspan>
      <tspan x="990" dy="30">footprint</tspan>
    </text>

    
    <rect x="820" y="630" width="340" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="845" y="655" width="290" height="22" rx="5" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <rect x="845" y="655" width="80" height="22" rx="5" fill="#207448"/>
    
    <text x="990" y="718" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">More room</text>
  </g>

  
  <g id="phase-4">
    
    <rect x="1215" y="175" width="340" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1385" y="217" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Binding cycle</text>

    
    <rect x="1215" y="265" width="340" height="115" rx="10" fill="#fffbf5" stroke="#db8129" stroke-width="3.5"/>
    
    <text x="1385" y="318" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1385" dy="0">Writes a Binding</tspan>
      <tspan x="1385" dy="32">to Node C</tspan>
    </text>

    
    <line x1="1385" y1="380" x2="1385" y2="440" stroke="#207448" stroke-width="3.5" marker-end="url(#arrowhead)"/>

    
    <rect x="1215" y="445" width="340" height="205" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1385" cy="485" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="1385" cy="485" r="8" fill="none" stroke="#207448" stroke-width="2.5"/>
    <line x1="1385" y1="463" x2="1385" y2="477" stroke="#207448" stroke-width="3"/>
    <line x1="1385" y1="493" x2="1385" y2="507" stroke="#207448" stroke-width="3"/>
    <line x1="1363" y1="485" x2="1377" y2="485" stroke="#207448" stroke-width="3"/>
    <line x1="1393" y1="485" x2="1407" y2="485" stroke="#207448" stroke-width="3"/>
    
    <text x="1385" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1385" dy="0">Kubelet on Node C</tspan>
      <tspan x="1385" dy="30">notices and starts</tspan>
      <tspan x="1385" dy="30">the container</tspan>
    </text>

    
    <rect x="1215" y="675" width="340" height="180" rx="10" fill="#ffffff" stroke="#78909c" stroke-width="2" stroke-dasharray="6 6"/>
    
    <text x="1385" y="718" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#546e7a">
      <tspan x="1385" dy="0">The scheduler never</tspan>
      <tspan x="1385" dy="30">starts containers.</tspan>
      <tspan x="1385" dy="30">It does not check</tspan>
      <tspan x="1385" dy="30">the image on Node C.</tspan>
    </text>
  </g>
</svg>