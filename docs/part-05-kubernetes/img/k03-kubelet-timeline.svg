<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A kubelet that stops heartbeating: the timeline</title>
  <desc>Horizontal timeline showing the sequence of events after a kubelet stops heartbeating: lease renewals stop, node becomes Unknown with unreachable taint at 40 seconds triggering an alert, and default toleration expires at 340 seconds marking pods for eviction.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f8f5"/>

  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A kubelet that stops heartbeating: the timeline</text>

  <g id="alert-box">
    <rect x="665" y="125" width="270" height="68" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(685, 139)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 6 C 13 6 9 12 9 21 C 9 28 6 31 6 32 L 34 32 C 34 31 31 28 31 21 C 31 12 27 6 20 6 Z"/>
      <circle cx="20" cy="35" r="2.5" fill="#207448"/>
      <path d="M 17 6 C 17 4 18 3 20 3 C 22 3 23 4 23 6"/>
    </g>
    <text x="815" y="169" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">alert fires</text>
  </g>

  <line x1="800" y1="193" x2="800" y2="285" stroke="#207448" stroke-width="3" stroke-dasharray="4 4"/>

  <g id="shaded-span">
    <rect x="268" y="225" width="500" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="518" y="260" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Lease renewals every 10 s stops</text>
  </g>

  <g id="timeline-axis">
    <line x1="80" y1="300" x2="1540" y2="300" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    <text text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36"><tspan x="1420" y="252">time after</tspan><tspan x="1420" y="282">heartbeats stop</tspan></text>

    <line x1="268" y1="285" x2="268" y2="315" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
    <rect x="173" y="335" width="190" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="268" y="365" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">T plus 0 s</text>

    <line x1="800" y1="285" x2="800" y2="315" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
    <rect x="700" y="335" width="200" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="365" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">T plus 40 s</text>

    <line x1="1332" y1="285" x2="1332" y2="315" stroke="#207448" stroke-width="6" stroke-linecap="round"/>
    <rect x="1222" y="335" width="220" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1332" y="365" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">T plus 340 s</text>
  </g>

  <line x1="268" y1="379" x2="268" y2="415" stroke="#207448" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="800" y1="379" x2="800" y2="415" stroke="#207448" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="1332" y1="379" x2="1332" y2="415" stroke="#207448" stroke-width="3" stroke-dasharray="4 4"/>

  <g id="card-1">
    <rect x="40" y="415" width="456" height="440" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <rect x="70" y="515" width="396" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    <g transform="translate(240, 555)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14"/>
      <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12.5 12.5 L 18.1 18.1 M 37.9 37.9 L 43.5 43.5 M 12.5 43.5 L 18.1 37.9 M 37.9 18.1 L 43.5 12.5"/>
    </g>

    <text x="268" y="675" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">kubelet stops</text>
  </g>

  <g id="card-2">
    <rect x="546" y="415" width="508" height="440" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    <circle cx="590" cy="460" r="24" fill="#207448"/>
    <text x="590" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

    <g transform="translate(772, 432)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <polyline points="28,14 28,28 38,28"/>
    </g>

    <text text-anchor="middle" font-family="sans-serif" font-size="24"><tspan x="800" y="535" font-size="30" font-weight="bold" fill="#303a36">node-monitor-grace-period</tspan><tspan x="800" y="578" font-size="24" fill="#303a36">(40 s): Ready becomes Unknown</tspan><tspan x="800" y="618" font-size="24" fill="#303a36">and the taint</tspan><tspan x="800" y="662" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">node.kubernetes.io/unreachable</tspan><tspan x="800" y="702" font-size="24" fill="#303a36">is added</tspan></text>
  </g>

  <g id="card-3">
    <rect x="1104" y="415" width="456" height="440" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    <circle cx="1148" cy="460" r="24" fill="#207448"/>
    <text x="1148" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

    <g transform="translate(1304, 432)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="6"/>
      <line x1="8" y1="22" x2="48" y2="22"/>
      <circle cx="16" cy="16" r="2" fill="#207448"/>
      <circle cx="24" cy="16" r="2" fill="#207448"/>
      <polyline points="22,34 28,28 34,34"/>
      <line x1="28" y1="28" x2="28" y2="40"/>
    </g>

    <text text-anchor="middle" font-family="sans-serif" font-size="24"><tspan x="1332" y="535" font-size="30" font-weight="bold" fill="#303a36">40 s + 300 s default</tspan><tspan x="1332" y="572" font-size="30" font-weight="bold" fill="#303a36">toleration expires:</tspan><tspan x="1332" y="618" font-size="24" fill="#303a36">pods are marked</tspan><tspan x="1332" y="650" font-size="24" fill="#303a36">for eviction</tspan></text>

    <rect x="1124" y="685" width="416" height="142" rx="10" fill="#fff7ed" stroke="#db8129" stroke-width="2.5"/>
    <text text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="1332" y="725">a pod that opts out of</tspan><tspan x="1332" y="759">the toleration</tspan><tspan x="1332" y="793">is evicted at once</tspan></text>
  </g>

  <rect x="40" y="895" width="1520" height="65" rx="12" fill="#207448"/>
  <text x="800" y="936" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">know the order, so you decide whether to wait for the node or act</text>
</svg>