<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>HPA scales by the ratio of metric to target</title>
  <desc>Visual infographic explaining Horizontal Pod Autoscaler formula, worked scaling examples, tolerance band, multi-metric evaluation, and min/max replica clamping.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">HPA scales by the ratio of metric to target</text>

  
  <g id="formula-strip">
    <rect x="60" y="110" width="1480" height="85" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="95" y="128" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="83" y1="142" x2="95" y2="142" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="83" y1="162" x2="95" y2="162" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="143" y1="142" x2="155" y2="142" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="143" y1="162" x2="155" y2="162" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="109" y1="116" x2="109" y2="128" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="129" y1="116" x2="129" y2="128" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="109" y1="176" x2="109" y2="188" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="129" y1="176" x2="129" y2="188" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="119" cy="152" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    
    <text x="830" y="162" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">desiredReplicas = ceil(currentReplicas x currentMetricValue / targetMetricValue)</text>
  </g>

  

  
  <g id="card-1">
    <rect x="60" y="235" width="467" height="460" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="5"/>
    
    
    <g transform="translate(265.5, 255)">
      <rect x="0" y="14" width="24" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="32" y="0" width="24" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="6" y1="24" x2="18" y2="24" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="12" x2="50" y2="12" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="24" x2="50" y2="24" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="84" y="325" width="419" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="293.5" y="364" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="293.5" dy="0">Metric is twice</tspan>
      <tspan x="293.5" dy="32">its target, 2 replicas</tspan>
    </text>

    
    <line x1="293.5" y1="420" x2="293.5" y2="515" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="84" y="515" width="419" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="293.5" y="567" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Answer: 4 replicas</text>
  </g>

  
  <g id="card-2">
    <rect x="567" y="235" width="466" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(772, 255)">
      <line x1="28" y1="6" x2="28" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="14" x2="50" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polygon points="6,14 0,32 12,32" fill="none" stroke="#207448" stroke-width="3"/>
      <polygon points="50,14 44,32 56,32" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="48" x2="40" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <rect x="591" y="325" width="418" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="364" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Metric at target,</tspan>
      <tspan x="800" dy="32">4 replicas</tspan>
    </text>

    
    <line x1="800" y1="420" x2="800" y2="515" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

    
    <rect x="591" y="515" width="418" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="552" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Answer: 4,</tspan>
      <tspan x="800" dy="32">nothing changes</tspan>
    </text>
  </g>

  
  <g id="card-3">
    <rect x="1073" y="235" width="467" height="460" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1278.5, 255)">
      <path d="M 6 48 L 6 10 L 50 10 L 50 48" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="square"/>
      <line x1="28" y1="38" x2="28" y2="20" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <polyline points="20,28 28,20 36,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <rect x="1097" y="325" width="419" height="95" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1306.5" y="382" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Fraction of a replica</text>

    
    <rect x="1097" y="515" width="419" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1306.5" y="552" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1306.5" dy="0">The ceiling</tspan>
      <tspan x="1306.5" dy="32">always rounds up</tspan>
    </text>
  </g>

  

  
  <g id="tolerance-band">
    <rect x="60" y="735" width="973" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(95, 782)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="28" y1="28" x2="42" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
      <path d="M 14 38 A 18 18 0 0 1 42 38" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
    </g>
    
    <text x="565" y="800" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="565" dy="0">Tolerance band of plus or minus</tspan>
      <tspan x="565" dy="36">10 percent stops jitter</tspan>
    </text>
  </g>

  
  <g id="side-card">
    <rect x="1073" y="735" width="467" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1100, 782)">
      <rect x="0" y="4" width="36" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="0" y="20" width="44" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="0" y="36" width="52" height="10" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="1320" y="784" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">Several metrics:</tspan>
      <tspan x="1320" dy="32">HPA computes each and</tspan>
      <tspan x="1320" dy="32">uses the largest result</tspan>
    </text>
  </g>

  
  <g id="clamp-bar">
    <rect x="60" y="925" width="1480" height="95" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M 130 947 L 105 947 L 105 997 L 130 997" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="90" y1="972" x2="105" y2="972" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

    
    <text x="800" y="983" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Clamped to minReplicas and maxReplicas</text>

    
    <path d="M 1470 947 L 1495 947 L 1495 997 L 1470 997" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1495" y1="972" x2="1510" y2="972" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>