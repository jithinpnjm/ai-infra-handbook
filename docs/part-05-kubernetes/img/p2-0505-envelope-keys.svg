<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <title>Envelope encryption: a KEK wraps each Secret's DEK</title>
  <desc>Infographic illustrating envelope encryption in Kubernetes where KMS manages the KEK outside the cluster, encrypting per-Secret DEKs stored with encrypted Secret objects.</desc>

  
  <rect width="1600" height="980" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Envelope encryption: a KEK wraps each Secret's DEK</text>

  
  <g id="kms-group">
    <rect x="60" y="140" width="440" height="700" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <path d="M 264 195 V 180 A 16 16 0 0 1 296 180 V 195" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <rect x="256" y="195" width="48" height="36" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <circle cx="280" cy="210" r="4" fill="#207448" />
    <path d="M 280 214 V 222" stroke="#207448" stroke-width="3" stroke-linecap="round" />

    <text x="280" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">KMS (outside the cluster)</text>

    
    <rect x="90" y="370" width="380" height="150" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <circle cx="258" cy="415" r="14" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 272 415 H 304" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <path d="M 292 415 V 425 M 302 415 V 427" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

    <text x="280" y="475" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Key encryption key (KEK)</text>
  </g>

  
  <g id="k8s-cluster-group">
    <rect x="580" y="140" width="960" height="700" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="14,10" />
    <text x="620" y="185" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Kubernetes cluster</text>

    
    <rect x="640" y="215" width="840" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="700" cy="262" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="700" cy="262" r="20" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="10 6" />

    <text x="750" y="272" font-family="monospace" font-size="32" font-weight="bold" fill="#303a36">kube-apiserver</text>

    
    <rect x="640" y="370" width="840" height="150" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="700" cy="445" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 714 445 H 746" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 734 445 V 455 M 744 445 V 457" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    <text x="770" y="455" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Data encryption key (DEK), one per Secret</text>

    
    <rect x="640" y="650" width="840" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <path d="M 686 700 H 714 L 726 712 V 748 H 686 Z" fill="#ffffff" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 714 700 V 712 H 726" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="696" y="726" width="18" height="14" rx="2" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 700 726 V 721 A 5 5 0 0 1 710 721 V 726" fill="none" stroke="#207448" stroke-width="2.5" />

    <text x="770" y="735" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Secret object, encrypted with the DEK</text>
  </g>

  
  <g id="arrow-1-group">
    <line x1="470" y1="445" x2="636" y2="445" stroke="#207448" stroke-width="4" />
    <polygon points="638,445 620,436 620,454" fill="#207448" />
    
    
    <circle cx="555" cy="355" r="24" fill="#207448" />
    <text x="555" y="364" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="555" y="415" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="555" dy="0">KEK encrypts</tspan>
      <tspan x="555" dy="28">the DEK</tspan>
    </text>
  </g>

  
  <g id="arrow-2-group">
    <line x1="820" y1="520" x2="820" y2="646" stroke="#207448" stroke-width="4" />
    <polygon points="820,648 811,630 829,630" fill="#207448" />

    
    <circle cx="865" cy="585" r="24" fill="#207448" />
    <text x="865" y="594" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    <text x="905" y="575" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="905" dy="0">DEK encrypts</tspan>
      <tspan x="905" dy="28">the Secret</tspan>
    </text>
  </g>

  
  <g id="arrow-3-group">
    <line x1="1160" y1="520" x2="1160" y2="646" stroke="#207448" stroke-width="4" />
    <polygon points="1160,648 1151,630 1169,630" fill="#207448" />

    
    <circle cx="1205" cy="585" r="24" fill="#207448" />
    <text x="1205" y="594" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    <text x="1245" y="575" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1245" dy="0">Encrypted DEK is</tspan>
      <tspan x="1245" dy="28">stored with the data</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="875" width="1480" height="75" rx="12" fill="#207448" />
    <text x="800" y="922" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The envelope is protected by the outer seal, and the seal is held somewhere else.</text>
  </g>
</svg>