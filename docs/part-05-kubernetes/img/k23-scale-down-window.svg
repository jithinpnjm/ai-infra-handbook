<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The scale-down stabilization window remembers the highest recent recommendation</title>
  <desc>An infographic illustrating how the scale-down stabilization window preserves the highest recommendation through brief dips and only scales down after a sustained quiet period.</desc>

  <defs>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 0 2 L 18 9 L 0 16 Z" fill="#db8129"/>
    </marker>
    
    <marker id="arrow-axis" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 0 2 L 18 9 L 0 16 Z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <g id="header">
    
    <g transform="translate(70, 48)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,12 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="24" y1="2" x2="32" y2="2" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="144" y="66" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The scale-down stabilization window</text>
    <text x="144" y="122" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">remembers the highest recent recommendation</text>
  </g>

  
  <rect x="70" y="150" width="1460" height="715" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g id="rolling-window-band">
    <rect x="250" y="170" width="490" height="550" rx="12" fill="#d7e8db" fill-opacity="0.75" stroke="#207448" stroke-width="2" stroke-dasharray="8 6"/>
    
    
    <rect x="385" y="190" width="220" height="46" rx="8" fill="#207448"/>
    <text x="495" y="222" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">600 seconds</text>
  </g>

  
  <g id="step-line-desired-replicas">
    
    <polyline points="150,570 210,570 210,350 460,350 460,570 580,570 580,350 860,350 860,570 1400,570" fill="none" stroke="#303a36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    
    <rect x="170" y="280" width="260" height="46" rx="8" fill="#303a36"/>
    <text x="300" y="312" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">desired replicas</text>
  </g>

  
  <g id="stabilized-value-line">
    
    <line x1="250" y1="350" x2="1140" y2="350" stroke="#207448" stroke-width="5" stroke-dasharray="14 8"/>
    
    <line x1="1140" y1="570" x2="1400" y2="570" stroke="#207448" stroke-width="5" stroke-dasharray="14 8"/>

    
    <rect x="490" y="280" width="240" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="610" y="312" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">stabilized value</text>
  </g>

  
  <g id="drop-1">
    <circle cx="460" cy="460" r="24" fill="#207448"/>
    <text x="460" y="469" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  
  <g id="drop-2">
    <circle cx="860" cy="460" r="24" fill="#207448"/>
    <text x="860" y="469" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  
  <g id="timeline-markers">
    
    <rect x="435" y="640" width="170" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="520" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">short dip</text>

    
    <rect x="915" y="640" width="250" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1040" y="672" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">sustained quiet</text>
  </g>

  
  <g id="stabilized-step-down">
    
    <line x1="1140" y1="355" x2="1140" y2="560" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)"/>

    
    <rect x="1170" y="405" width="330" height="115" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <text x="1335" y="442" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
      <tspan x="1335" dy="0">sustained quiet</tspan>
      <tspan x="1335" dy="32">period lets the</tspan>
      <tspan x="1335" dy="32">count fall</tspan>
    </text>
  </g>

  
  <g id="timeline-axis">
    <line x1="140" y1="740" x2="1420" y2="740" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-axis)"/>
    <text x="1440" y="749" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">time</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="70" y="890" width="1460" height="74" rx="12" fill="#207448"/>
    <text x="800" y="936" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">a brief dip does not remove replicas, only a sustained quiet period does.</text>
  </g>
</svg>