<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>Reading an IPVS listing: one NodePort, four doors</title>
  <desc>Visual infographic showing how four different IPVS virtual services for a Kubernetes NodePort route to the exact same backend real servers.</desc>

  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <filter id="pill-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.15" />
    </filter>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="60" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Reading an IPVS listing: one NodePort, four doors</text>

  
  <g transform="translate(50, 95)">
    <rect width="1500" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 20)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="5" width="46" height="42" rx="6" />
      <path d="M 10 47 L 10 55 M 23 47 L 23 55 M 36 47 L 36 55" stroke-linecap="round" />
      <circle cx="15" cy="22" r="4" fill="#207448" stroke="none" />
      <circle cx="31" cy="22" r="4" fill="#207448" stroke="none" />
    </g>
    <text x="95" y="42" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="95" dy="0">ip address show dev kube-ipvs0: dummy interface holding /32 addresses</tspan>
      <tspan x="95" dy="32">such as 10.110.34.183, 10.96.0.10, 10.96.0.1</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 215)">
    
    <rect width="520" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <rect x="25" y="20" width="470" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="58" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="45" dy="0">TCP 10.0.99.67:30737 rr</tspan>
      <tspan x="45" dy="30">(node IP)</tspan>
    </text>

    
    <rect x="25" y="130" width="470" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="168" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="45" dy="0">TCP 10.110.34.183:80 rr</tspan>
      <tspan x="45" dy="30">(ClusterIP)</tspan>
    </text>

    
    <rect x="25" y="240" width="470" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="278" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="45" dy="0">TCP 127.0.0.1:30737 rr</tspan>
      <tspan x="45" dy="30">(loopback)</tspan>
    </text>

    
    <rect x="25" y="350" width="470" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="392" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="45" dy="0">TCP 192.168.246.64:30737 rr</tspan>
      <tspan x="45" dy="30">(secondary node interface)</tspan>
    </text>
  </g>

  
  
  <path d="M 570 281 L 620 281
           M 570 391 L 620 391
           M 570 501 L 620 501
           M 570 617 L 620 617
           M 620 281 L 620 617
           M 620 452 L 640 452"
        fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />

  
  <g filter="url(#pill-shadow)">
    <rect x="640" y="417" width="410" height="70" rx="35" fill="#db8129" />
  </g>
  <text x="845" y="461" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">four doors into the same room</text>

  
  <line x1="1050" y1="452" x2="1100" y2="452" stroke="#db8129" stroke-width="4" marker-end="url(#orange-arrow)" />

  
  <g transform="translate(1110, 215)">
    <rect width="440" height="475" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(25, 20)">
      <text x="195" y="28" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">(the Service endpoints, i.e. pods)</text>
    </g>

    
    <rect x="25" y="70" width="390" height="105" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="114" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="45" dy="0">192.168.89.153:80</tspan>
      <tspan x="45" dy="32">Masq weight 1</tspan>
    </text>

    
    <rect x="25" y="195" width="390" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="250" font-family="monospace" font-size="24" fill="#303a36">192.168.89.154:80</text>

    
    <rect x="25" y="307" width="390" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="45" y="362" font-family="monospace" font-size="24" fill="#303a36">192.168.89.155:80</text>

    
    <path d="M 12 122 L 25 122 M 12 241 L 25 241 M 12 353 L 25 353" fill="none" stroke="#207448" stroke-width="2" marker-end="url(#green-arrow)" />
  </g>

  
  <g transform="translate(50, 715)">
    <rect width="1500" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 20)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="18" />
      <path d="M 25 17 L 25 25 M 25 31 L 25 33" stroke-linecap="round" />
    </g>
    <text x="85" y="54" font-family="sans-serif" font-size="24" fill="#303a36">virtual service = TCP line, real server = indented arrow line, scheduler rr, Forward Masq</text>
  </g>

  
  <g transform="translate(50, 825)">
    <rect width="1500" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(25, 22)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="50" height="44" rx="6" />
      <path d="M 12 15 L 22 22 L 12 29 M 26 29 L 38 29" />
    </g>
    <text x="95" y="54" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ipvsadm -Ln, ipvsadm -Lnc, ipset list KUBE-CLUSTER-IP</text>
  </g>
</svg>