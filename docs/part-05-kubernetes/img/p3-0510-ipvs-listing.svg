<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Reading an IPVS listing: one NodePort, four doors</title>
  <desc>Visual explanation of IPVS routing for a Kubernetes NodePort service showing four virtual service doors directing traffic to the same three real server pods.</desc>

  <defs>
    
    <marker id="orange-arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Reading an IPVS listing: one NodePort, four doors</text>
  <text x="800" y="112" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Annotated ipvsadm --list --numeric output</text>

  
  <g id="dummy-interface">
    <rect x="50" y="145" width="1500" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(75, 167)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="46" height="34" rx="4"/>
      <line x1="8" y1="34" x2="8" y2="48"/>
      <line x1="23" y1="34" x2="23" y2="48"/>
      <line x1="38" y1="34" x2="38" y2="48"/>
      <circle cx="12" cy="12" r="3" fill="#207448"/>
      <circle cx="24" cy="12" r="3" fill="#207448"/>
      <circle cx="36" cy="12" r="3" fill="#207448"/>
    </g>
    <text x="145" y="188" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">ip address show dev kube-ipvs0: dummy interface holding /32 addresses </tspan>
      <tspan x="145" dy="34">such as 10.110.34.183, 10.96.0.10, 10.96.0.1</tspan>
    </text>
  </g>

  
  
  <g id="block-node-ip">
    <rect x="50" y="280" width="520" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(72, 317)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="34" height="46" rx="3"/>
      <circle cx="24" cy="24" r="3" fill="#207448"/>
    </g>
    <text x="126" y="350" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TCP 10.0.99.67:30737 rr (node IP)</text>
  </g>

  
  <g id="block-cluster-ip">
    <rect x="50" y="425" width="520" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(72, 462)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="34" height="46" rx="3"/>
      <circle cx="24" cy="24" r="3" fill="#207448"/>
    </g>
    <text x="126" y="495" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TCP 10.110.34.183:80 rr (ClusterIP)</text>
  </g>

  
  <g id="block-loopback">
    <rect x="50" y="570" width="520" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(72, 607)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="34" height="46" rx="3"/>
      <circle cx="24" cy="24" r="3" fill="#207448"/>
    </g>
    <text x="126" y="640" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">TCP 127.0.0.1:30737 rr (loopback)</text>
  </g>

  
  <g id="block-secondary">
    <rect x="50" y="715" width="520" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(72, 765)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="34" height="46" rx="3"/>
      <circle cx="24" cy="24" r="3" fill="#207448"/>
    </g>
    <text x="126" y="776" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="126" dy="0">TCP 192.168.246.64:30737 rr </tspan>
      <tspan x="126" dy="36">(secondary node interface)</tspan>
    </text>
  </g>

  
  
  <path d="M 570 340 L 610 340 L 610 787 L 570 787" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="570" y1="485" x2="610" y2="485" stroke="#207448" stroke-width="4"/>
  <line x1="570" y1="630" x2="610" y2="630" stroke="#207448" stroke-width="4"/>

  
  <line x1="610" y1="575" x2="635" y2="575" stroke="#db8129" stroke-width="5"/>

  
  <rect x="635" y="538" width="345" height="74" rx="37" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <text x="807" y="584" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">four doors into the same room</text>

  
  <line x1="980" y1="575" x2="1010" y2="575" stroke="#db8129" stroke-width="5" marker-end="url(#orange-arrow)"/>

  
  <g id="real-servers-panel">
    <rect x="1010" y="280" width="540" height="580" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="1280" y="332" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Real servers (pods)</text>

    
    <g id="pod-1">
      <rect x="1035" y="365" width="490" height="120" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(1055, 403)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="36" height="42" rx="4"/>
        <line x1="0" y1="14" x2="36" y2="14"/>
        <circle cx="18" cy="28" r="4" fill="#207448"/>
      </g>
      <text x="1110" y="437" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">192.168.89.153:80 Masq weight 1</text>
    </g>

    
    <g id="pod-2">
      <rect x="1035" y="515" width="490" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(1055, 550)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="36" height="42" rx="4"/>
        <line x1="0" y1="14" x2="36" y2="14"/>
        <circle cx="18" cy="28" r="4" fill="#207448"/>
      </g>
      <text x="1110" y="582" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">192.168.89.154:80</text>
    </g>

    
    <g id="pod-3">
      <rect x="1035" y="655" width="490" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(1055, 690)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="36" height="42" rx="4"/>
        <line x1="0" y1="14" x2="36" y2="14"/>
        <circle cx="18" cy="28" r="4" fill="#207448"/>
      </g>
      <text x="1110" y="722" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">192.168.89.155:80</text>
    </g>
  </g>

  
  <g id="legend-panel">
    <rect x="50" y="895" width="1500" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="800" y="950" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">virtual service = TCP line, real server = indented arrow line, scheduler rr, Forward Masq</text>
  </g>

  
  <g id="commands-panel">
    <rect x="50" y="1015" width="1500" height="90" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1070" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ipvsadm -Ln, ipvsadm -Lnc, ipset list KUBE-CLUSTER-IP</text>
  </g>
</svg>