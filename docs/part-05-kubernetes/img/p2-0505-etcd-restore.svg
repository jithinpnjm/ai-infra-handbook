<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Restoring etcd from a snapshot, member by member</title>
  <desc>Visual guide explaining step-by-step procedure to restore an etcd cluster from a snapshot member by member.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Restoring etcd from a snapshot, member by member</text>

  
  <g id="side-panel">
    
    <rect x="1110" y="120" width="430" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <text x="1325" y="175" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Before you restore</text>
    <line x1="1140" y1="202" x2="1510" y2="202" stroke="#207448" stroke-opacity="0.3" stroke-width="1.5" />

    
    <g id="side-panel-box">
      <rect x="1140" y="230" width="370" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      
      <g transform="translate(1297, 255)">
        <path d="M 12 36 A 14 14 0 0 1 26 22 A 18 18 0 0 1 54 26 A 12 12 0 0 1 50 48 H 14 A 12 12 0 0 1 12 36 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
        <path d="M 32 46 V 26 M 24 33 L 32 25 L 40 33" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <text font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="1325" y="365">Save snapshots regularly</tspan>
        <tspan x="1325" y="400">and ship them off</tspan>
        <tspan x="1325" y="435">the cluster</tspan>
      </text>
    </g>

    
    <g id="side-panel-note">
      <rect x="1140" y="500" width="370" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
      
      
      <g transform="translate(1297, 530)">
        
        <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="3.5" />
        <path d="M 6 14 V 38 C 6 44 16 48 28 48 C 40 48 50 44 50 38 V 14" fill="none" stroke="#207448" stroke-width="3.5" />
        
        <circle cx="28" cy="28" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <line x1="28" y1="20" x2="28" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="28" cy="35" r="1.5" fill="#207448" />
      </g>

      <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="1325" y="635">A snapshot kept only on</tspan>
        <tspan x="1325" y="670">the cluster disk is lost</tspan>
        <tspan x="1325" y="705">with the cluster</tspan>
      </text>
    </g>
  </g>

  

  
  <g id="step-1">
    <rect x="220" y="120" width="840" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="270" cy="185" r="24" fill="#207448" />
    <text x="270" y="194" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(315, 157)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="20" y="17" width="5" height="22" rx="2" fill="#207448" />
      <rect x="31" y="17" width="5" height="22" rx="2" fill="#207448" />
    </g>

    
    <text font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="395" y="172">Stop kube-apiserver and etcd</tspan>
      <tspan x="395" y="210">on all control-plane nodes</tspan>
    </text>
  </g>

  
  <path d="M 640 250 V 288" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="step-2">
    <rect x="220" y="290" width="840" height="210" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="270" cy="395" r="24" fill="#207448" />
    <text x="270" y="404" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <g transform="translate(315, 367)">
      <ellipse cx="28" cy="14" rx="22" ry="7" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 6 14 V 42 C 6 48 16 52 28 52 C 40 52 50 48 50 42 V 14" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 6 28 C 6 34 16 38 28 38 C 40 38 50 34 50 28" fill="none" stroke="#207448" stroke-width="3.5" />
    </g>

    
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="395" y="340">Restore the snapshot into a data directory</tspan>
      <tspan x="395" y="380">on each member, with a </tspan>
    </text>

    
    <g id="new-cluster-token-chip">
      <rect x="705" y="352" width="265" height="40" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="2.5" />
      <text x="837" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">new cluster token</text>
    </g>

    
    <g id="etcdutl-command-chip">
      <rect x="395" y="416" width="390" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="415" y="447" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">etcdutl snapshot restore</text>
    </g>
  </g>

  
  <path d="M 640 500 V 538" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="step-3">
    <rect x="220" y="540" width="840" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="270" cy="615" r="24" fill="#207448" />
    <text x="270" y="624" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <g transform="translate(315, 587)">
      <path d="M 10 4 H 36 L 48 16 V 52 H 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 36 4 V 16 H 48" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="18" y1="26" x2="38" y2="26" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="18" y1="36" x2="38" y2="36" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>

    
    <text x="395" y="593" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Point the etcd static pod manifest at</text>

    
    <g id="manifest-path-chip">
      <rect x="395" y="618" width="350" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="415" y="648" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">/var/lib/etcd-restore</text>
    </g>
  </g>

  
  <path d="M 640 690 V 728" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="step-4">
    <rect x="220" y="730" width="840" height="130" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="270" cy="795" r="24" fill="#207448" />
    <text x="270" y="804" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(315, 767)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3.5" />
      <polygon points="23,17 39,28 23,39" fill="#207448" />
    </g>

    
    <text x="395" y="804" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Start etcd and the API server</text>
  </g>

  
  <g id="repeat-loop">
    
    <path d="M 220 615 H 120 A 20 20 0 0 1 100 595 V 545 M 100 465 V 415 A 20 20 0 0 1 120 395 H 218" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
    
    
    <rect x="18" y="468" width="164" height="72" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="100" y="499">Repeat</tspan>
      <tspan x="100" y="527">per member</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="910" width="1480" height="74" rx="12" fill="#207448" />
    <text x="800" y="956" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">A restore rewinds the cluster state to the snapshot time.</text>
  </g>
</svg>