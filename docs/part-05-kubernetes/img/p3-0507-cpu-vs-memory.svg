<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>CPU is compressible, memory is not: a worked example</title>
  <desc>Infographic comparing how Kubernetes handles CPU compression through shares and limits versus non-compressible memory pressure and OOM termination.</desc>

  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">CPU is compressible, memory is not: a worked example</text>

  
  <g id="cpu-panel">
    <rect x="40" y="105" width="740" height="695" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(65, 125)">
      <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="18" y="18" width="20" height="20" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="40" x2="8" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>

    
    <text x="135" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CPU requests share a busy node</text>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" y="215">four steps for a 2-core node and</tspan>
      <tspan x="65" y="247">containers with request 0.5 CPU</tspan>
      <tspan x="65" y="279">that each try to use everything.</tspan>
    </text>

    
    <g transform="translate(65, 305)">
      <rect x="0" y="0" width="690" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="38" cy="38" r="22" fill="#207448"/>
      <text x="38" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="75" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">1 pod alone gets 2.0 cores</text>
      
      <rect x="445" y="24" width="225" height="28" rx="4" fill="#207448"/>
    </g>

    
    <g transform="translate(65, 395)">
      <rect x="0" y="0" width="690" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="38" cy="38" r="22" fill="#207448"/>
      <text x="38" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="75" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 pods get 1.0 each</text>
      
      <rect x="445" y="24" width="109" height="28" rx="4" fill="#207448"/>
      <rect x="561" y="24" width="109" height="28" rx="4" fill="#207448"/>
    </g>

    
    <g transform="translate(65, 485)">
      <rect x="0" y="0" width="690" height="76" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="38" cy="38" r="22" fill="#207448"/>
      <text x="38" y="46" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">3</text>
      <text x="75" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">3 pods about 0.66 each</text>
      
      <rect x="445" y="24" width="71" height="28" rx="4" fill="#207448"/>
      <rect x="522" y="24" width="71" height="28" rx="4" fill="#207448"/>
      <rect x="599" y="24" width="71" height="28" rx="4" fill="#207448"/>
    </g>

    
    <g transform="translate(65, 575)">
      <rect x="0" y="0" width="690" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <circle cx="38" cy="48" r="22" fill="#207448"/>
      <text x="38" y="56" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="75" y="42">4 pods get the 0.5 each requested</tspan>
        <tspan x="75" y="74">and the node is full</tspan>
      </text>
      
      <rect x="500" y="34" width="39" height="28" rx="4" fill="#207448"/>
      <rect x="545" y="34" width="39" height="28" rx="4" fill="#207448"/>
      <rect x="590" y="34" width="39" height="28" rx="4" fill="#207448"/>
      <rect x="635" y="34" width="39" height="28" rx="4" fill="#207448"/>
    </g>

    
    <g transform="translate(65, 695)">
      <rect x="0" y="0" width="690" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="345" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">cpu-shares: share proportional to request</text>
    </g>
  </g>

  
  <g id="memory-panel">
    <rect x="820" y="105" width="740" height="695" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(845, 125)">
      <rect x="4" y="10" width="48" height="34" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="10" y="18" width="8" height="14" rx="1" fill="#207448"/>
      <rect x="24" y="18" width="8" height="14" rx="1" fill="#207448"/>
      <rect x="38" y="18" width="8" height="14" rx="1" fill="#207448"/>
      <line x1="12" y1="44" x2="12" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="44" y1="44" x2="44" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    
    <text x="915" y="162" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Memory</text>

    
    <g transform="translate(845, 205)">
      <rect x="0" y="0" width="690" height="225" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="25" y="48">a process cannot be made to hold less;</tspan>
        <tspan x="25" y="96">when the node runs out the kubelet terminates</tspan>
        <tspan x="25" y="144">containers that use more than they requested;</tspan>
        <tspan x="25" y="192">they restart but the node has less memory</tspan>
      </text>
    </g>

    
    <g transform="translate(845, 455)">
      <rect x="0" y="0" width="690" height="320" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      
      <rect x="35" y="30" width="620" height="258" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
      
      
      <rect x="55" y="55" width="260" height="95" rx="4" fill="#207448" fill-opacity="0.15" stroke="#207448" stroke-width="2"/>
      <circle cx="90" cy="102" r="18" fill="#207448"/>
      <path d="M 82 102 L 88 108 L 100 96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      
      <rect x="345" y="55" width="290" height="95" rx="4" fill="#207448" fill-opacity="0.25" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="490" y1="40" x2="490" y2="165" stroke="#207448" stroke-width="3"/>
      
      
      <g transform="translate(200, 185)">
        <rect x="0" y="0" width="290" height="75" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <path d="M 45 38 A 18 18 0 1 1 63 38" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <polygon points="63,30 63,44 71,37" fill="#207448"/>
        <line x1="225" y1="26" x2="255" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="255" y1="26" x2="225" y2="52" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  
  <g id="limits-row">
    
    <g transform="translate(40, 825)">
      <rect x="0" y="0" width="740" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      
      <g transform="translate(30, 68)">
        <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="28" y1="28" x2="28" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="28" y1="28" x2="42" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <path d="M 12 12 L 4 4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <path d="M 44 12 L 52 4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="105" y="65" font-size="26" font-weight="bold">CPU limit 0.5 cores: only 0.5 cores</tspan>
        <tspan x="105" y="105" font-size="26" font-weight="bold">even if idle</tspan>
        <tspan x="105" y="148" font-family="monospace" font-size="24" fill="#207448">(CFS quota cpu.max)</tspan>
      </text>
    </g>

    
    <g transform="translate(820, 825)">
      <rect x="0" y="0" width="740" height="195" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      
      
      <g transform="translate(30, 68)">
        <polygon points="28,2 54,48 2,48" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
        <line x1="28" y1="18" x2="28" y2="32" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <circle cx="28" cy="40" r="3" fill="#db8129"/>
      </g>
      
      <text font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="105" y="65" font-size="26" font-weight="bold" fill="#db8129">memory limit 256Mi:</tspan>
        <tspan x="105" y="105" font-size="26" font-weight="bold">malloc fails past it,</tspan>
        <tspan x="105" y="148" font-size="26" font-weight="bold" fill="#db8129">container is OOM killed</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-banner" transform="translate(40, 1045)">
    <rect x="0" y="0" width="1520" height="75" rx="10" fill="#207448"/>
    <text x="760" y="47" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">memory requests and limits decide survival, CPU requests mostly decide speed</text>
  </g>
</svg>