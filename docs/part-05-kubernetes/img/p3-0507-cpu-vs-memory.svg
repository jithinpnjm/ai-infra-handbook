<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 44px; font-weight: bold; fill: #303a36; }
      .panel-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .body-bold { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #303a36; }
      .body-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .code-text { font-family: monospace; font-size: 24px; fill: #303a36; }
      .banner-text { font-family: sans-serif; font-size: 28px; font-weight: bold; fill: #ffffff; }
      .badge-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  <title>CPU is compressible, memory is not: a worked example</title>
  <desc>Visual comparison showing how Kubernetes handles CPU compression versus uncompressible memory evictions and limits.</desc>

  
  <rect width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="800" y="70" class="title" text-anchor="middle">CPU is compressible, memory is not: a worked example</text>

  
  <rect x="50" y="110" width="730" height="850" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(80, 135)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="6" y="6" width="38" height="38" rx="4"/>
    <rect x="14" y="14" width="22" height="22"/>
    <line x1="16" y1="0" x2="16" y2="6"/>
    <line x1="25" y1="0" x2="25" y2="6"/>
    <line x1="34" y1="0" x2="34" y2="6"/>
    <line x1="16" y1="44" x2="16" y2="50"/>
    <line x1="25" y1="44" x2="25" y2="50"/>
    <line x1="34" y1="44" x2="34" y2="50"/>
    <line x1="0" y1="16" x2="6" y2="16"/>
    <line x1="0" y1="25" x2="6" y2="25"/>
    <line x1="0" y1="34" x2="6" y2="34"/>
    <line x1="44" y1="16" x2="50" y2="16"/>
    <line x1="44" y1="25" x2="50" y2="25"/>
    <line x1="44" y1="34" x2="50" y2="34"/>
  </g>
  <text x="145" y="172" class="panel-title">CPU requests share a busy node</text>

  
  <rect x="80" y="210" width="670" height="110" rx="12" fill="#ffffff" stroke="#c0d6c6" stroke-width="2"/>
  <circle cx="120" cy="265" r="24" fill="#207448"/>
  <text x="120" y="273" class="badge-text" text-anchor="middle">1</text>
  <text x="165" y="273" class="body-bold">1 pod alone gets 2.0 cores</text>
  <rect x="520" y="240" width="205" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="520" y="240" width="205" height="50" rx="8" fill="#207448"/>
  <text x="622" y="273" class="badge-text" text-anchor="middle">2.0 cores (100%)</text>

  
  <rect x="80" y="340" width="670" height="110" rx="12" fill="#ffffff" stroke="#c0d6c6" stroke-width="2"/>
  <circle cx="120" cy="395" r="24" fill="#207448"/>
  <text x="120" y="403" class="badge-text" text-anchor="middle">2</text>
  <text x="165" y="403" class="body-bold">2 pods get 1.0 each</text>
  <rect x="520" y="370" width="100" height="50" rx="6" fill="#207448"/>
  <text x="570" y="403" class="badge-text" text-anchor="middle">1.0</text>
  <rect x="625" y="370" width="100" height="50" rx="6" fill="#207448"/>
  <text x="675" y="403" class="badge-text" text-anchor="middle">1.0</text>

  
  <rect x="80" y="470" width="670" height="110" rx="12" fill="#ffffff" stroke="#c0d6c6" stroke-width="2"/>
  <circle cx="120" cy="525" r="24" fill="#207448"/>
  <text x="120" y="533" class="badge-text" text-anchor="middle">3</text>
  <text x="165" y="533" class="body-bold">3 pods about 0.66 each</text>
  <rect x="520" y="500" width="65" height="50" rx="6" fill="#207448"/>
  <text x="552" y="533" class="badge-text" text-anchor="middle">.66</text>
  <rect x="590" y="500" width="65" height="50" rx="6" fill="#207448"/>
  <text x="622" y="533" class="badge-text" text-anchor="middle">.66</text>
  <rect x="660" y="500" width="65" height="50" rx="6" fill="#207448"/>
  <text x="692" y="533" class="badge-text" text-anchor="middle">.66</text>

  
  <rect x="80" y="600" width="670" height="150" rx="12" fill="#ffffff" stroke="#c0d6c6" stroke-width="2"/>
  <circle cx="120" cy="675" r="24" fill="#207448"/>
  <text x="120" y="683" class="badge-text" text-anchor="middle">4</text>
  <text x="165" y="660" class="body-bold">4 pods get the 0.5 each requested</text>
  <text x="165" y="700" class="body-bold">and the node is full</text>

  
  <rect x="80" y="800" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="110" y="865" class="body-bold" fill="#207448">cpu-shares: share proportional to request</text>


  
  <rect x="820" y="110" width="730" height="850" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(850, 135)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="10" width="34" height="30" rx="3"/>
    <line x1="8" y1="20" x2="42" y2="20"/>
    <line x1="8" y1="30" x2="42" y2="30"/>
    <circle cx="15" cy="15" r="2" fill="#207448"/>
    <circle cx="15" cy="25" r="2" fill="#207448"/>
    <circle cx="15" cy="35" r="2" fill="#207448"/>
  </g>
  <text x="915" y="172" class="panel-title">Memory</text>

  
  <rect x="850" y="210" width="670" height="240" rx="12" fill="#ffffff" stroke="#c0d6c6" stroke-width="2"/>
  <text x="880" y="255" class="body-text">a process cannot be made to hold less;</text>
  <text x="880" y="300" class="body-text">when the node runs out the kubelet terminates</text>
  <text x="880" y="345" class="body-text">containers that use more than they requested;</text>
  <text x="880" y="390" class="body-text">they restart but the node has less memory</text>

  
  <rect x="850" y="475" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(880, 508)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="22" cy="22" r="20"/>
    <path d="M12 22 L19 29 L32 15"/>
  </g>
  <text x="945" y="540" class="body-bold">pod A holds 200Mi (fits)</text>

  
  <rect x="850" y="610" width="670" height="165" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <g transform="translate(880, 670)" stroke="#db8129" stroke-width="4" fill="none">
    <circle cx="22" cy="22" r="20"/>
    <line x1="14" y1="14" x2="30" y2="30"/>
    <line x1="30" y1="14" x2="14" y2="30"/>
  </g>
  <text x="945" y="665" class="body-bold">pod B asks for more than the node has -&gt;</text>
  <text x="945" y="705" class="body-bold" fill="#db8129">kubelet kills it (OOMKilled)</text>

  
  <path d="M 1185 775 L 1185 815" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1080" y="825" width="210" height="60" rx="30" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="1185" y="864" class="body-bold" text-anchor="middle" fill="#db8129">restarts</text>


  
  
  <rect x="50" y="990" width="730" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(80, 1020)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="20"/>
    <path d="M 12 36 L 24 16 L 36 36"/>
    <line x1="24" y1="26" x2="24" y2="34"/>
  </g>
  <text x="145" y="1055" class="panel-title">CPU limit 0.5 cores:</text>
  <text x="80" y="1120" class="body-text">only 0.5 cores even if idle (CFS quota cpu.max)</text>

  
  <rect x="820" y="990" width="730" height="215" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <g transform="translate(850, 1020)" stroke="#db8129" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="20"/>
    <line x1="24" y1="12" x2="24" y2="28"/>
    <circle cx="24" cy="36" r="2" fill="#db8129"/>
  </g>
  <text x="915" y="1055" class="panel-title" fill="#db8129">memory limit 256Mi:</text>
  <text x="850" y="1120" class="body-text">malloc fails past it, container is OOM killed</text>


  
  <rect x="50" y="1235" width="1500" height="95" rx="14" fill="#207448"/>
  <text x="800" y="1294" class="banner-text" text-anchor="middle">memory requests and limits decide survival, CPU requests mostly decide speed</text>

</svg>