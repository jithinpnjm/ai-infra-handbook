<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Anatomy of a Production GPU KubeletConfiguration</title>
  <desc>Functional breakdown of KubeletConfiguration blocks for production AI and GPU Kubernetes worker nodes.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Anatomy of a Production GPU KubeletConfiguration</text>

  
  <rect x="180" y="76" width="1240" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#207448" text-anchor="middle">Annotations indicate why each block matters for AI inference/training nodes.</text>

  

  
  <g id="group-1">
    <rect x="60" y="145" width="710" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(84, 168)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 4 L44 12 V26 C44 38 24 46 24 46 C24 46 4 38 4 26 V12 Z"/>
      <path d="M16 24 L22 30 L32 18"/>
    </g>
    
    <text x="144" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="144" dy="0">Group 1: Authentication &amp;</tspan>
      <tspan x="144" dy="36">Authorization</tspan>
    </text>

    
    <rect x="84" y="248" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="277" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">anonymous.enabled: false</text>

    
    <rect x="84" y="298" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="327" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">webhook.enabled: true</text>

    
    <rect x="84" y="348" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="377" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">authorization.mode: Webhook</text>

    
    <rect x="84" y="398" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="427" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">serverTLSBootstrap: true</text>
  </g>

  
  <g id="group-2">
    <rect x="60" y="515" width="710" height="395" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(84, 538)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="36" rx="4"/>
      <path d="M12 18 L18 24 L12 30"/>
      <line x1="22" y1="30" x2="32" y2="30"/>
    </g>

    <text x="144" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="144" dy="0">Group 2: Host &amp; Runtime</tspan>
      <tspan x="144" dy="36">Hardening</tspan>
    </text>

    
    <rect x="84" y="618" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="647" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">cgroupDriver: systemd</text>

    
    <rect x="84" y="668" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="697" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">cgroupsPerQOS: true</text>

    
    <rect x="84" y="718" width="662" height="110" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="747" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">
      <tspan x="104" dy="0">protectKernelDefaults: true with checked</tspan>
      <tspan x="104" dy="32">sysctls vm.overcommit_memory=1</tspan>
      <tspan x="104" dy="32">and panic settings</tspan>
    </text>

    
    <rect x="84" y="836" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="865" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">seccompDefault: true</text>
  </g>

  
  <g id="group-3">
    <rect x="60" y="935" width="710" height="365" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(84, 958)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="36" height="10" rx="2"/>
      <rect x="6" y="20" width="36" height="10" rx="2"/>
      <rect x="6" y="34" width="36" height="10" rx="2"/>
      <circle cx="34" cy="11" r="1.5" fill="#207448"/>
      <circle cx="34" cy="25" r="1.5" fill="#207448"/>
      <circle cx="34" cy="39" r="1.5" fill="#207448"/>
    </g>

    <text x="144" y="978" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="144" dy="0">Group 3: Scale &amp; Pull</tspan>
      <tspan x="144" dy="36">Control</tspan>
    </text>

    
    <rect x="84" y="1038" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="1067" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">maxPods: 110</text>

    
    <rect x="84" y="1088" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="1117" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">podPidsLimit: 8192</text>

    
    <rect x="84" y="1138" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="1167" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">serializeImagePulls: false</text>

    
    <rect x="84" y="1188" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="1217" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">maxParallelImagePulls: 3</text>

    
    <rect x="84" y="1238" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="104" y="1267" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">registryPullQPS: 20</text>
  </g>

  

  
  <g id="group-4">
    <rect x="830" y="145" width="710" height="420" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <g transform="translate(854, 168)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="28" height="28" rx="3"/>
      <path d="M18 18 H30 V30 H18 Z"/>
      <path d="M4 17 H10 M4 24 H10 M4 31 H10"/>
      <path d="M38 17 H44 M38 24 H44 M38 31 H44"/>
      <path d="M17 4 V10 M24 4 V10 M31 4 V10"/>
      <path d="M17 38 V44 M24 38 V44 M31 38 V44"/>
    </g>

    <text x="914" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="914" dy="0">Group 4: AI/GPU Resource &amp;</tspan>
      <tspan x="914" dy="36">NUMA Management</tspan>
    </text>

    
    <rect x="854" y="248" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="277" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">cpuManagerPolicy: static</text>

    
    <rect x="854" y="298" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="327" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">full-pcpus-only: true</text>

    
    <rect x="854" y="348" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="377" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">reservedSystemCPUs: 0-3</text>

    
    <rect x="854" y="398" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="427" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">memoryManagerPolicy: Static</text>

    
    <rect x="854" y="448" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="477" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">topologyManagerPolicy: single-numa-node</text>

    
    <rect x="854" y="498" width="662" height="42" rx="6" fill="#ffffff" stroke="#e0cbb6" stroke-width="1.5"/>
    <text x="874" y="527" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">topologyManagerScope: pod</text>
  </g>

  
  <g id="group-5">
    <rect x="830" y="590" width="710" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(854, 613)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="32" rx="3"/>
      <line x1="6" y1="20" x2="42" y2="20"/>
      <line x1="24" y1="20" x2="24" y2="40"/>
    </g>

    <text x="914" y="633" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="914" dy="0">Group 5: Reservations &amp;</tspan>
      <tspan x="914" dy="36">Node Allocatable</tspan>
    </text>

    
    <rect x="854" y="693" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="722" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">kubeReserved: 4Gi/5Gi</text>

    
    <rect x="854" y="743" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="772" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">systemReserved: 8Gi/5Gi</text>

    
    <rect x="854" y="793" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="822" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">enforceNodeAllocatable: [pods]</text>
  </g>

  
  <g id="group-6">
    <rect x="830" y="935" width="710" height="365" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(854, 958)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 36 A18 18 0 1 1 40 36"/>
      <line x1="24" y1="24" x2="34" y2="16"/>
      <circle cx="24" cy="24" r="2" fill="#207448"/>
    </g>

    <text x="914" y="978" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="914" dy="0">Group 6: Node-Pressure</tspan>
      <tspan x="914" dy="36">Eviction Thresholds</tspan>
    </text>

    
    <rect x="854" y="1038" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="1067" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">evictionHard memory.available: 2Gi</text>

    
    <rect x="854" y="1088" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="1117" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">evictionSoft memory.available: 4Gi over 2m</text>

    
    <rect x="854" y="1138" width="662" height="42" rx="6" fill="#ffffff" stroke="#c2d8c6" stroke-width="1.5"/>
    <text x="874" y="1167" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#303a36">evictionMinimumReclaim: 1Gi</text>
  </g>
</svg>