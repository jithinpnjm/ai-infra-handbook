<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Labels cut across the same pods in different slices</title>
  <desc>Worked example with four Deployments, six pods, overlapping selector rings, operator strip, result table, and warning</desc>

  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <g transform="translate(50, 40)">
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">Labels cut across the same pods in different slices</text>
  </g>

  
  <g transform="translate(50, 105)">
    <rect width="1500" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="25" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Operator strip</text>
    
    
    <g transform="translate(260, 16)">
      
      <rect x="0" y="0" width="170" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="85" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">key=value</text>

      
      <rect x="185" y="0" width="185" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="277" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">key!=value</text>

      
      <rect x="385" y="0" width="245" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="507" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">key in (a,b)</text>

      
      <rect x="645" y="0" width="285" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="787" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">key notin (a,b)</text>

      
      <rect x="945" y="0" width="125" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="1007" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">key</text>

      
      <rect x="1085" y="0" width="135" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="1152" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">!key</text>
    </g>
  </g>

  
  <g transform="translate(50, 215)">
    <rect width="1500" height="550" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="860" y="145" width="615" height="385" rx="20" fill="rgba(32, 116, 72, 0.05)" stroke="#207448" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="880" y="125" width="115" height="40" rx="8" fill="#207448"/>
    <text x="937" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#ffffff">ver=2</text>

    
    <rect x="880" y="275" width="575" height="240" rx="16" fill="rgba(32, 116, 72, 0.09)" stroke="#207448" stroke-width="3"/>
    <rect x="900" y="255" width="310" height="40" rx="8" fill="#207448"/>
    <text x="1055" y="283" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#ffffff">app=bandicoot,ver=2</text>
    <text x="1225" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">(comma means AND)</text>

    
    <g transform="translate(25, 25)">
      <rect width="780" height="100" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 24)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="50" height="50" rx="6"/>
        <line x1="12" y1="16" x2="38" y2="16"/>
        <line x1="12" y1="26" x2="38" y2="26"/>
        <line x1="12" y1="36" x2="28" y2="36"/>
      </g>
      <text x="90" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">alpaca-prod (app=alpaca, env=prod, ver=1)</text>

      
      <g transform="translate(865, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>

      
      <g transform="translate(1005, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>
    </g>

    
    <g transform="translate(25, 155)">
      <rect width="780" height="100" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(20, 24)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="50" height="50" rx="6"/>
        <line x1="12" y1="16" x2="38" y2="16"/>
        <line x1="12" y1="26" x2="38" y2="26"/>
        <line x1="12" y1="36" x2="28" y2="36"/>
      </g>
      <text x="90" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">alpaca-test (app=alpaca, env=test, ver=2)</text>

      
      <g transform="translate(865, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>
    </g>

    
    <g transform="translate(25, 285)">
      <rect width="780" height="100" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(20, 24)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="50" height="50" rx="6"/>
        <line x1="12" y1="16" x2="38" y2="16"/>
        <line x1="12" y1="26" x2="38" y2="26"/>
        <line x1="12" y1="36" x2="28" y2="36"/>
      </g>
      <text x="90" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">bandicoot-prod (app=bandicoot, env=prod, ver=2)</text>

      
      <g transform="translate(865, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>

      
      <g transform="translate(1005, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>
    </g>

    
    <g transform="translate(25, 415)">
      <rect width="780" height="100" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(20, 24)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="0" width="50" height="50" rx="6"/>
        <line x1="12" y1="16" x2="38" y2="16"/>
        <line x1="12" y1="26" x2="38" y2="26"/>
        <line x1="12" y1="36" x2="28" y2="36"/>
      </g>
      <text x="90" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">bandicoot-staging (app=bandicoot, env=staging, ver=2)</text>

      
      <g transform="translate(865, 17)">
        <rect width="115" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <polygon points="57,17 77,28 77,50 57,61 37,50 37,28" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
        <circle cx="57" cy="39" r="4" fill="#207448"/>
      </g>
    </g>
  </g>

  
  
  <g transform="translate(50, 790)">
    <rect width="970" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="30" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Result table</text>

    
    <g transform="translate(25, 60)">
      <rect width="920" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="25" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">ver=2 -&gt; 4 pods</text>
    </g>

    
    <g transform="translate(25, 126)">
      <rect width="920" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="25" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">app=bandicoot,ver=2 -&gt; 3 pods</text>
    </g>

    
    <g transform="translate(25, 192)">
      <rect width="920" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="25" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">app in (alpaca,bandicoot) -&gt; all 6</text>
    </g>

    
    <g transform="translate(25, 258)">
      <rect width="920" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="25" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">canary (key is set) -&gt; only alpaca-test after kubectl label</text>
    </g>
  </g>

  
  <g transform="translate(1050, 790)">
    <rect width="500" height="340" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(30, 30)">
      
      <rect width="165" height="46" rx="8" fill="#db8129"/>
      <text x="82" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Warning</text>

      
      <g transform="translate(185, 0)" stroke="#db8129" stroke-width="3" fill="none">
        <polygon points="23,3 43,40 3,40"/>
        <line x1="23" y1="16" x2="23" y2="27"/>
        <circle cx="23" cy="34" r="1.5" fill="#db8129"/>
      </g>
    </g>

    
    <text x="30" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="30" dy="0">kubectl label on a Deployment </tspan>
      <tspan x="30" dy="42">changes only the Deployment, </tspan>
      <tspan x="30" dy="42">not its ReplicaSets or Pods</tspan>
    </text>
  </g>
</svg>