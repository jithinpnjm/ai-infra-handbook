<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>A silent node: from grace period to eviction</title>
  <desc>Visual horizontal timeline illustrating Kubernetes silent node detection, taint application, pod toleration period, eviction, and split-brain safeguards.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-grey" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#788880"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A silent node: from grace period to eviction</text>

  
  <rect x="670" y="130" width="470" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="905" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="905" dy="0">DefaultTolerationSeconds</tspan>
    <tspan x="905" dy="32">adds the toleration</tspan>
  </text>
  
  <line x1="905" y1="220" x2="905" y2="255" stroke="#207448" stroke-width="2" stroke-dasharray="4,4"/>

  
  
  <rect x="500" y="185" width="180" height="46" rx="23" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="590" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">40 seconds</text>

  
  <rect x="1140" y="185" width="260" height="46" rx="23" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1270" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">340 seconds total</text>

  
  <line x1="100" y1="280" x2="1500" y2="280" stroke="#c2d6c8" stroke-width="6" stroke-linecap="round"/>

  
  <rect x="590" y="255" width="680" height="50" rx="12" fill="#d8ebe0" stroke="#207448" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="930" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Pods tolerate the taint for 300 seconds</text>

  
  <circle cx="240" cy="280" r="18" fill="#ffffff" stroke="#207448" stroke-width="5"/>
  <circle cx="240" cy="280" r="8" fill="#207448"/>
  <line x1="240" y1="298" x2="240" y2="350" stroke="#207448" stroke-width="3"/>

  
  <circle cx="590" cy="280" r="20" fill="#ffffff" stroke="#db8129" stroke-width="6"/>
  <circle cx="590" cy="280" r="9" fill="#db8129"/>
  <line x1="590" y1="300" x2="590" y2="350" stroke="#db8129" stroke-width="3"/>

  
  <circle cx="1270" cy="280" r="18" fill="#ffffff" stroke="#207448" stroke-width="5"/>
  <circle cx="1270" cy="280" r="8" fill="#207448"/>
  <line x1="1270" y1="298" x2="1270" y2="350" stroke="#207448" stroke-width="3"/>

  
  <rect x="60" y="350" width="360" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="240" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="240" dy="0">Heartbeats stop:</tspan>
    <tspan x="240" dy="38" font-size="24" font-weight="normal" fill="#505e58">kubelet lease not renewed</tspan>
  </text>

  
  <rect x="450" y="350" width="540" height="200" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="720" y="398" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="720" dy="0" font-size="25" font-weight="bold" fill="#db8129">node-monitor-grace-period:</tspan>
    <tspan x="720" dy="36" font-size="24" fill="#303a36">Ready becomes Unknown, taint</tspan>
    <tspan x="720" dy="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">node.kubernetes.io/</tspan>
    <tspan x="720" dy="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#303a36">unreachable:NoExecute added</tspan>
  </text>

  
  <rect x="1020" y="350" width="500" height="180" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1270" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="26" text-anchor="middle">
    <tspan x="1270" dy="0" font-weight="bold" fill="#207448">tolerationSeconds 300 ends:</tspan>
    <tspan x="1270" dy="38" font-size="24" fill="#303a36">taint-based eviction</tspan>
    <tspan x="1270" dy="34" font-size="24" fill="#303a36">deletes the pods</tspan>
  </text>

  
  <path d="M 1270 530 L 1270 570" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  
  <rect x="1030" y="570" width="480" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1270" y="623" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Controllers recreate pods elsewhere</text>

  
  <path d="M 1020 460 H 800 V 700" stroke="#788880" stroke-width="3" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-grey)"/>

  <rect x="60" y="700" width="1480" height="130" rx="14" fill="#f0f2f1" stroke="#788880" stroke-width="2"/>
  <text x="800" y="754" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#44524c" text-anchor="middle">
    <tspan x="800" dy="0">Pod on a dead node stays Terminating until the kubelet returns,</tspan>
    <tspan x="800" dy="38">the node is deleted, or someone force deletes it</tspan>
  </text>

  
  <rect x="60" y="865" width="1480" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="921" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">StatefulSets do not replace stuck Terminating pods, to avoid split brain.</text>
</svg>