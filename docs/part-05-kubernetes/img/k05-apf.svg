      <tspan x="1265" dy="0">how much room and </tspan>
      <tspan x="1265" dy="28">what happens with no room</tspan>
    </text>
    <text x="1265" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1265" dy="0">with a share of concurrency </tspan>
      <tspan x="1265" dy="28">and a queue count of 64</tspan>
    </text>
  </g>

  
  <line x1="1265" y1="435" x2="1265" y2="468" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="box-4">
