<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>How API Priority and Fairness routes a request</title>
  <desc>Visual infographic explaining how Kubernetes API Priority and Fairness routes client requests through FlowSchema matching, PriorityLevelConfiguration assignment, and shuffle-sharded queues.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How API Priority and Fairness routes a request</text>

  
  <g id="box-1">
    <rect x="50" y="115" width="270" height="320" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(157, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="38" rx="4" />
      <line x1="28" y1="38" x2="28" y2="50" />
      <line x1="14" y1="50" x2="42" y2="50" />
      <line x1="12" y1="18" x2="28" y2="18" />
    </g>
    <text x="185" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">a request</text>
    <text x="185" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">from a client</text>
  </g>

  
  <line x1="320" y1="275" x2="378" y2="275" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="box-2">
    <rect x="380" y="115" width="540" height="320" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <circle cx="418" cy="150" r="22" fill="#207448" />
    <text x="418" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="452" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">match FlowSchema</text>

    
    <g transform="translate(835, 128)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4,4 52,4 34,28 34,50 22,50 22,28" />
    </g>

    
    <text x="650" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">FlowSchema</text>
    <text x="650" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">which requests belong here</text>
    <text x="650" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="650" dy="0">matched by subject, </tspan>
      <tspan x="650" dy="30">verb and resource</tspan>
    </text>
  </g>

  
  <line x1="920" y1="275" x2="978" y2="275" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g id="box-3">
    <rect x="980" y="115" width="570" height="320" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <circle cx="1018" cy="150" r="22" fill="#207448" />
    <text x="1018" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="1052" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">assign PriorityLevel</text>

    
    <g transform="translate(1470, 128)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <line x1="28" y1="28" x2="42" y2="16" />
