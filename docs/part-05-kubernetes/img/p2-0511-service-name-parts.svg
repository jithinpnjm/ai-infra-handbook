      <circle cx="18" cy="7" r="2.5" fill="#207448"/>
      <circle cx="26" cy="7" r="2.5" fill="#207448"/>
      <polyline points="18,34 26,26 18,18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="34" x2="40" y2="34" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="240" y="495" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="240" dy="0">Name of the</tspan>
      <tspan x="240" dy="38">Service</tspan>
