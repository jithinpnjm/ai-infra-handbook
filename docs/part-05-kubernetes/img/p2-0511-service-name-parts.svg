  <rect x="55" y="230" width="370" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="240" y="280" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">alpaca-prod</text>

  
  <text x="442.5" y="280" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36" text-anchor="middle">.</text>

  
  <rect x="460" y="230" width="370" height="80" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="4"/>
  <text x="645" y="280" font-family="monospace" font-size="32" font-weight="bold" fill="#db8129" text-anchor="middle">default</text>

  
  <text x="845" y="280" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36" text-anchor="middle">.</text>

  
  <rect x="860" y="230" width="310" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1015" y="280" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">svc</text>

  
  <text x="1185" y="280" font-family="monospace" font-size="36" font-weight="bold" fill="#303a36" text-anchor="middle">.</text>

  
  <rect x="1200" y="230" width="345" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1372.5" y="280" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">cluster.local.</text>

  
  <line x1="240" y1="310" x2="240" y2="350" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="645" y1="310" x2="645" y2="350" stroke="#db8129" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="1015" y1="310" x2="1015" y2="350" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="1372.5" y1="310" x2="1372.5" y2="350" stroke="#207448" stroke-width="2.5" stroke-dasharray="4 4"/>

  
  
  <g>
