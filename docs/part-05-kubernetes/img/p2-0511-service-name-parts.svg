      <path d="M 28 6 L 28 12 M 28 38 L 28 44 M 9 25 L 15 25 M 41 25 L 47 25 M 15 12 L 19 16 M 37 34 L 41 38 M 15 38 L 19 34 M 37 16 L 41 12" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="1015" y="480" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
