      <tspan x="645" dy="34">Service lives in</tspan>
    </text>
    
    <rect x="475" y="525" width="340" height="110" rx="10" fill="#fff3e6" stroke="#db8129" stroke-width="2"/>
    <text x="645" y="558" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b35b00" text-anchor="middle">
      <tspan x="645" dy="0">Write the namespace</tspan>
      <tspan x="645" dy="30">into every cross-</tspan>
      <tspan x="645" dy="30">namespace reference.</tspan>
    </text>
  </g>

  
  <g>
    <rect x="860" y="350" width="310" height="305" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(987, 372)">
