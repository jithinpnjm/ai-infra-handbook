<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030">
  <title>Anatomy of alpaca-prod.default.svc.cluster.local</title>
  <desc>Visual breakdown of a Kubernetes fully qualified service domain name, namespace scoping, and DNS resolution.</desc>

  
  <rect width="1600" height="1030" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Anatomy of alpaca-prod.default.svc.cluster.local</text>

  
  <g>
    <text x="800" y="112" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">Fully qualified name</text>
    <path d="M 55 145 L 55 128 L 788 128 L 800 118 L 812 128 L 1545 128 L 1545 145" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  
  <g>
    <text x="442.5" y="174" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Short form across namespaces: alpaca-prod.default</text>
    <path d="M 55 212 L 55 192 L 430 192 L 442.5 182 L 455 192 L 830 192 L 830 212" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
