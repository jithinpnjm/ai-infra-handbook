      <tspan x="1015" dy="34">Service, room for</tspan>
      <tspan x="1015" dy="34">other object types</tspan>
    </text>
  </g>

  
  <g>
    <rect x="1200" y="350" width="345" height="305" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1344.5, 372)">
      <circle cx="28" cy="25" r="23" fill="none" stroke="#207448" stroke-width="3.5"/>
      <ellipse cx="28" cy="25" rx="12" ry="23" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="5" y1="25" x2="51" y2="25" stroke="#207448" stroke-width="2"/>
      <line x1="9" y1="15" x2="47" y2="15" stroke="#207448" stroke-width="1.8"/>
      <line x1="9" y1="35" x2="47" y2="35" stroke="#207448" stroke-width="1.8"/>
    </g>
    <text x="1372.5" y="480" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1372.5" dy="0">Base domain, default,</tspan>
      <tspan x="1372.5" dy="34">administrators can</tspan>
      <tspan x="1372.5" dy="34">change it</tspan>
    </text>
  </g>

  
  <g>
    <rect x="180" y="695" width="1240" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="742" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">alpaca-prod.default.svc.cluster.local. 30 IN A 10.115.245.13</text>
  </g>

  
  <g>
    <text x="1171" y="852" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">The Service cluster IP</text>
    <line x1="1171" y1="824" x2="1171" y2="784" stroke="#207448" stroke-width="3.5"/>
    <polygon points="1171,772 1162,786 1180,786" fill="#207448"/>
  </g>

  
  <g>
    <rect x="55" y="905" width="1490" height="75" rx="12" fill="#207448"/>
    <text x="800" y="952" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Inside your own namespace, the short name alpaca-prod is enough.</text>
  </g>
