<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>Secrets Store CSI Driver Architecture and Lifecycle</title>
  <desc>Architecture diagram detailing the interaction between Kubernetes Cluster/Pod, Node Host, and External Secret Store with tmpfs mount lifecycle and zero etcd persistence.</desc>

  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 46px; font-weight: bold; fill: #207448; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: bold; fill: #303a36; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; fill: #303a36; }
      .mono-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 24px; fill: #207448; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 600; fill: #303a36; }
      .num-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .callout-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: bold; fill: #db8129; }
      .callout-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: bold; fill: #303a36; }
    </style>

    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 14 8 L 1 14 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1320" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" class="title-text">Secrets Store CSI Driver Architecture and Lifecycle</text>

  

  
  <rect x="40" y="105" width="460" height="1035" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="60" y="125" width="420" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="270" y="160" text-anchor="middle" class="zone-title">Cluster/Pod</text>

  
  <rect x="530" y="105" width="560" height="1035" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="550" y="125" width="520" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="810" y="160" text-anchor="middle" class="zone-title">Node Host</text>

  
  <rect x="1120" y="105" width="440" height="1035" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="1140" y="125" width="400" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1340" y="160" text-anchor="middle" class="zone-title">External Secret Store</text>

  

  
  <rect x="65" y="205" width="410" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="225" width="52" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="85" y1="241" x2="137" y2="241" stroke="#207448" stroke-width="3"/>
  <circle cx="98" cy="233" r="3" fill="#207448"/>
  <circle cx="108" cy="233" r="3" fill="#207448"/>
  <text x="150" y="255" class="box-title">Pod Spec</text>
  <text x="85" y="300" class="body-text">A Pod spec references volume</text>
  <text x="85" y="332" class="mono-text">'secrets-api'</text>
  <text x="85" y="364" class="body-text">with driver 'secrets-store.csi.k8s.com'</text>
  <text x="85" y="396" class="body-text">and volumeAttributes</text>
  <text x="85" y="426" class="mono-text">'secretProviderClass: apitoken'</text>

  
  <rect x="555" y="205" width="510" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="595" cy="250" r="18" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 595 226 L 595 232 M 595 268 L 595 274 M 571 250 L 577 250 M 613 250 L 619 250" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="630" y="256" class="box-title">Kubelet Volume Manager</text>
  <text x="580" y="310" class="body-text">triggers mount; talks over local gRPC socket</text>

  
  <rect x="555" y="390" width="510" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="575" y="415" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="597" cy="437" r="8" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 597 407 L 597 415 M 597 459 L 597 467 M 567 437 L 575 437 M 619 437 L 627 437" stroke="#207448" stroke-width="3"/>
  <text x="635" y="440" class="box-title">secrets-store-csi-driver</text>
  <text x="635" y="475" class="box-title">DaemonSet Pod</text>

  
  <rect x="555" y="555" width="510" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="575" y="580" width="44" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 587 598 L 599 604 L 587 610" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="601" y1="614" x2="611" y2="614" stroke="#207448" stroke-width="3"/>
  <text x="635" y="605" class="body-text">CSI driver invokes host provider binary:</text>
  <text x="575" y="645" class="mono-text">/etc/kubernetes/secrets-store-</text>
  <text x="575" y="675" class="mono-text">csi-providers/vault/provider-vault</text>

  
  <rect x="1145" y="475" width="390" height="280" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1195 505 L 1220 495 L 1245 505 L 1245 530 C 1245 550 1220 565 1220 565 C 1220 565 1195 550 1195 530 Z" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="1220" cy="525" r="5" fill="#207448"/>
  <text x="1165" y="600" class="box-title">HashiCorp Vault /</text>
  <text x="1165" y="635" class="box-title">Cloud Secret Manager</text>
  <text x="1165" y="680" class="body-text">receives authenticated request</text>
  <text x="1165" y="712" class="body-text">from provider using the Pod</text>
  <text x="1165" y="744" class="body-text">ServiceAccount token</text>

  
  <rect x="555" y="795" width="510" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <ellipse cx="597" cy="830" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 577 830 L 577 855 A 20 8 0 0 0 617 855 L 617 830" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 577 842 A 20 8 0 0 0 617 842" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="635" y="845" class="box-title">tmpfs mount at</text>
  <text x="575" y="885" class="mono-text">/var/lib/kubelet/pods/&lt;uid&gt;/</text>
  <text x="575" y="915" class="mono-text">volumes/kubernetes.io~csi/</text>
  <text x="575" y="945" class="mono-text">secrets-store-inline/mount</text>

  
  <rect x="65" y="875" width="410" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="900" width="48" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 85 914 L 133 914 M 99 914 L 99 944 M 119 914 L 119 944" stroke="#207448" stroke-width="3"/>
  <text x="150" y="930" class="box-title">Container</text>
  <text x="85" y="975" class="body-text">Container consumes mounted file at</text>
  <text x="85" y="1005" class="mono-text">'/etc/secrets/apitoken'</text>


  

  
  <line x1="810" y1="340" x2="810" y2="388" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="825" y="345" width="225" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <circle cx="845" cy="365" r="16" fill="#207448"/>
  <text x="845" y="365" class="num-text">1</text>
  <text x="870" y="372" class="arrow-text">Kubelet calls CSI driver on container start.</text>

  
  <line x1="810" y1="510" x2="810" y2="553" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="825" y="515" width="225" height="40" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <circle cx="845" cy="535" r="16" fill="#207448"/>
  <text x="845" y="535" class="num-text">2</text>
  <text x="870" y="542" class="arrow-text">CSI driver executes provider-vault with parameters from SecretProviderClass.</text>

  
  <path d="M 1065 625 L 1143 625" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="1065" y="570" width="300" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <circle cx="1090" cy="594" r="16" fill="#207448"/>
  <text x="1090" y="594" class="num-text">3</text>
  <text x="1115" y="601" class="arrow-text">Provider fetches secret '/secret/team-a' key 'apitoken' from Vault.</text>

  
  <path d="M 810" y1="715" x2="810" y2="793" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="825" y="735" width="225" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <circle cx="845" cy="757" r="16" fill="#207448"/>
  <text x="845" y="757" class="num-text">4</text>
  <text x="870" y="764" class="arrow-text">Provider writes payload to tmpfs mount at</text>

  
  <path d="M 555 930 L 477 930" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <circle cx="516" cy="905" r="16" fill="#207448"/>
  <text x="516" y="905" class="num-text">5</text>
  <rect x="420" y="855" width="190" height="34" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1"/>
  <text x="515" y="878" text-anchor="middle" class="arrow-text">Container consumes</text>


  
  <rect x="180" y="1170" width="1240" height="110" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <circle cx="230" cy="1225" r="28" fill="#fdf3e7"/>
  <path d="M 230 1205 L 244 1213 L 244 1228 C 244 1238 230 1246 230 1246 C 230 1246 216 1238 216 1228 L 216 1213 Z" fill="none" stroke="#db8129" stroke-width="3.5"/>
  <circle cx="230" cy="1224" r="3.5" fill="#db8129"/>
  
  <text x="275" y="1215" class="callout-title">Security Architecture Guarantee</text>
  <text x="275" y="1252" class="callout-text">Zero persistence in etcd: native Kubernetes Secret is never created</text>
</svg>