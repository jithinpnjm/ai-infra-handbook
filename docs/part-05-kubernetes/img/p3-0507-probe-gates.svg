<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Three probes for a slow model server</title>
  <desc>Visual explanation of startup, readiness, and liveness probe configuration for slow-starting LLM servers like vllm-llama.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three probes for a slow model server</text>

  
  <rect x="50" y="100" width="1500" height="690" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(85, 122)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="18,8 18,18 25,23" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="135" y="148" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Timeline for vllm-llama</text>

  
  <rect x="80" y="175" width="640" height="585" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />

  
  <circle cx="120" cy="215" r="22" fill="#207448" />
  <text x="120" y="223" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  
  <rect x="105" y="255" width="590" height="195" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(130, 275)">
    <rect x="4" y="6" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="13" r="2" fill="#207448" />
    <circle cx="20" cy="13" r="2" fill="#207448" />
    <rect x="4" y="24" width="44" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="31" r="2" fill="#207448" />
    <circle cx="20" cy="31" r="2" fill="#207448" />
    <path d="M 26 38 L 26 48 M 21 44 L 26 49 L 31 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="200" y="305" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="200" dy="0">during loading the server downloads</tspan>
    <tspan x="200" dy="38">or maps weights and captures</tspan>
    <tspan x="200" dy="38">CUDA graphs</tspan>
  </text>

  
  <rect x="105" y="475" width="590" height="260" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(625, 495)">
    <path d="M 24 4 L 44 12 L 44 28 C 44 40 24 48 24 48 C 24 48 4 40 4 28 L 4 12 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <polyline points="14,24 22,32 34,18" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="130" y="520" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="130" dy="0">startupProbe: periodSeconds 10,</tspan>
    <tspan x="130" dy="36">failureThreshold 180,</tspan>
  </text>
  <text x="130" y="595" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" dy="0">up to 30 minutes;</tspan>
    <tspan x="130" dy="36">liveness and readiness are disabled</tspan>
    <tspan x="130" dy="36">until it succeeds once</tspan>
  </text>

  
  <line x1="720" y1="467" x2="815" y2="467" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="820" y="175" width="700" height="585" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />

  
  <circle cx="860" cy="215" r="22" fill="#207448" />
  <text x="860" y="223" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  
  <rect x="845" y="255" width="650" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1425, 275)">
    <circle cx="26" cy="12" r="8" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="38" r="8" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="40" cy="38" r="8" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="22" y1="19" x2="15" y2="31" stroke="#207448" stroke-width="3" />
    <line x1="30" y1="19" x2="37" y2="31" stroke="#207448" stroke-width="3" />
  </g>
  
  <text x="870" y="298" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="870" dy="0">readinessProbe periodSeconds 5:</tspan>
  </text>
  <text x="870" y="340" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">on failure the pod IP leaves</tspan>
    <tspan x="870" dy="38">the EndpointSlices, container</tspan>
    <tspan x="870" dy="38">is NOT restarted</tspan>
  </text>

  
  <rect x="845" y="505" width="650" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1425, 525)">
    <rect x="4" y="6" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="10,28 18,28 22,16 28,40 33,24 37,28 42,28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="870" y="548" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="870" dy="0">livenessProbe periodSeconds 20,</tspan>
    <tspan x="870" dy="36">failureThreshold 6:</tspan>
  </text>
  <text x="870" y="625" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="870" dy="0">restarts only after 2 full</tspan>
    <tspan x="870" dy="38">minutes of no response</tspan>
  </text>

  
  <rect x="50" y="815" width="1500" height="135" rx="12" fill="#fdf2f2" stroke="#d93838" stroke-width="2" />
  
  <g transform="translate(85, 852)">
    <circle cx="30" cy="30" r="28" fill="#d93838" />
    <line x1="18" y1="18" x2="42" y2="42" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="42" y1="18" x2="18" y2="42" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <text x="165" y="893" font-family="sans-serif" font-size="28" font-weight="bold" fill="#a82222">liveness with no startup probe on a slow starter creates a restart loop</text>

  
  <rect x="50" y="980" width="1500" height="85" rx="12" fill="#207448" />
  
  <g transform="translate(85, 998)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#ffffff" stroke-width="3" />
    <polyline points="15,24 22,31 33,18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="150" y="1033" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Never tie liveness to dependencies</text>
</svg>