<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <title>How a headless Service without publishNotReadyAddresses deadlocks a training rendezvous</title>
  <desc>Circular loop diagram showing how Kubernetes CoreDNS omits unready pods from headless service DNS records, deadlocking distributed training rendezvous, and how publishNotReadyAddresses resolves it.</desc>

  <defs>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#7a8c82" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How a headless Service without publishNotReadyAddresses</text>
  <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">deadlocks a training rendezvous</text>

  
  <text x="1100" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">publishes the record</text>
  <text x="1100" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">while not ready, which breaks the loop</text>

  
  <path d="M 1340 250 L 1340 200 L 860 200 L 860 248" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="250" width="440" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(252, 268)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="280" y="360" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">trainer-0 not Ready</text>
  <text x="280" y="405" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">it starts only</text>
  <text x="280" y="437" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">after rendezvous</text>

  
  <rect x="640" y="250" width="440" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(832, 268)">
    <rect x="6" y="8" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="16" r="3" fill="#207448" />
    <line x1="38" y1="16" x2="42" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <rect x="6" y="32" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="16" cy="40" r="3" fill="#207448" />
    <line x1="38" y1="40" x2="42" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="860" y="358" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CoreDNS publishes</text>
  <text x="860" y="398" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">no A record for trainer-0</text>
  <text x="860" y="434" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">while it is not ready</text>

  
  <rect x="640" y="670" width="440" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(832, 688)">
    <rect x="4" y="6" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="4" y1="18" x2="52" y2="18" stroke="#207448" stroke-width="3" />
    <circle cx="12" cy="12" r="2.5" fill="#207448" />
    <circle cx="20" cy="12" r="2.5" fill="#207448" />
    <polyline points="14,28 22,34 14,40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="860" y="776" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">worker ranks</text>
  <text x="860" y="814" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">get NXDOMAIN</text>
  <text x="860" y="856" text-anchor="middle" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">for trainer-0.trainer</text>

  
  <rect x="60" y="670" width="440" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(252, 688)">
    <circle cx="12" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="44" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="20" y1="28" x2="26" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="14" x2="32" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="280" y="776" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">trainer-0</text>
  <text x="280" y="816" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">never receives connections,</text>
  <text x="280" y="854" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">so it never becomes Ready</text>

  
  <rect x="440" y="525" width="260" height="100" rx="12" fill="#ffffff" stroke="#7a8c82" stroke-width="2" />
  <text x="570" y="567" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">deadlock,</text>
  <text x="570" y="602" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">the job hangs</text>

  
  <line x1="500" y1="365" x2="638" y2="365" stroke="#7a8c82" stroke-width="4" marker-end="url(#arrow-grey)" />
  <circle cx="570" cy="365" r="24" fill="#207448" />
  <text x="570" y="374" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

  
  <line x1="860" y1="480" x2="860" y2="668" stroke="#7a8c82" stroke-width="4" marker-end="url(#arrow-grey)" />
  <circle cx="860" cy="575" r="24" fill="#207448" />
  <text x="860" y="584" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

  
  <line x1="640" y1="785" x2="502" y2="785" stroke="#7a8c82" stroke-width="4" marker-end="url(#arrow-grey)" />
  <circle cx="570" cy="785" r="24" fill="#207448" />
  <text x="570" y="794" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  
  <line x1="280" y1="670" x2="280" y2="482" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <circle cx="280" cy="575" r="24" fill="#db8129" />
  <text x="280" y="584" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <text x="236" y="583" text-anchor="end" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">the deadlock</text>

  
  <rect x="1130" y="250" width="420" height="230" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  
  <g transform="translate(1312, 268)">
    <path d="M 28 6 L 48 14 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <polyline points="20,28 26,34 38,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1340" y="358" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">publishNotReadyAddresses:</text>
  <text x="1340" y="394" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">true</text>
  <text x="1340" y="436" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">on the headless Service</text>

  
  <rect x="1130" y="570" width="420" height="130" rx="12" fill="#ffffff" stroke="#7a8c82" stroke-width="2" stroke-dasharray="6 4" />
  <text x="1340" y="618" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">rendezvous endpoint</text>
  <text x="1340" y="660" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">trainer-0.trainer:29500</text>

  
  <rect x="60" y="960" width="1490" height="90" rx="12" fill="#207448" />
  <text x="805" y="998" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">DNS answers only for pods that are ready, so a worker</text>
  <text x="805" y="1032" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">that waits for its peers before it is ready can wait forever.</text>
</svg>