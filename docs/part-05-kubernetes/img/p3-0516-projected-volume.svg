<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>One projected volume, three sources, one directory</title>
  <desc>A pod box with a projected volume named creds fanning in three sources into one directory.</desc>

  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 48px; font-weight: bold; fill: #303a36; }
      .pod-title { font-family: sans-serif; font-size: 34px; font-weight: bold; fill: #207448; }
      .box-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #207448; }
      .orange-highlight { font-family: monospace; font-size: 26px; font-weight: bold; fill: #db8129; }
      .body-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .mono-text { font-family: monospace; font-size: 24px; fill: #303a36; }
    </style>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" class="title">One projected volume, three sources, one directory</text>

  
  <rect x="50" y="105" width="1500" height="930" rx="20" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="46" height="46" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 12 L 34 12 M 12 23 L 34 23 M 12 34 L 24 34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="65" y="35" class="pod-title">Pod</text>
  </g>

  
  <g transform="translate(90, 195)">
    <rect x="0" y="0" width="760" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 24)">
      <circle cx="16" cy="16" r="12" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 26 24 L 46 44 M 36 34 L 42 28 M 41 39 L 47 33" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="95" y="55" class="box-title">Source 1</text>
    <text x="32" y="105" class="mono-text">serviceAccountToken: path sa-token,</text>
    <text x="32" y="140" class="mono-text">audience vault, expirationSeconds 3600;</text>
    <text x="32" y="175" class="body-text">the kubelet refreshes it before expiry;</text>
    <text x="32" y="210" class="body-text">proves who the pod is</text>
  </g>

  
  <g transform="translate(90, 460)">
    <rect x="0" y="0" width="760" height="235" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 24)">
      <path d="M 24 4 L 44 12 L 44 26 C 44 38 24 46 24 46 C 24 46 4 38 4 26 L 4 12 Z" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 16 24 L 22 30 L 32 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="95" y="55" class="box-title">Source 2</text>
    <text x="32" y="108" class="mono-text">configMap ca-bundle,</text>
    <text x="32" y="143" class="mono-text">key ca.crt to path ca.crt;</text>
    <text x="32" y="180" class="body-text">lets the pod trust the server it talks to</text>
  </g>

  
  <g transform="translate(90, 725)">
    <rect x="0" y="0" width="760" height="255" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 24)">
      <rect x="6" y="6" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 14 18 L 34 18 M 14 26 L 28 26 M 14 34 L 22 34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="95" y="55" class="box-title">Source 3</text>
    <text x="32" y="105" class="mono-text">downwardAPI:</text>
    <text x="32" y="140" class="mono-text">path labels from fieldRef metadata.labels;</text>
    <text x="32" y="180" class="body-text">describes the pod itself</text>
  </g>

  
  <g transform="translate(970, 290)">
    <rect x="0" y="0" width="530" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(35, 30)">
      <path d="M 6 12 L 20 12 L 26 18 L 48 18 L 48 42 L 6 42 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    </g>
    <text x="105" y="62" class="box-title">Output</text>
    
    
    <g transform="translate(35, 115)">
      <rect x="-10" y="-2" width="480" height="74" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <text x="10" y="28" class="orange-highlight">volume named creds</text>
      <text x="10" y="60" class="orange-highlight">of type projected</text>
    </g>

    <text x="35" y="245" class="mono-text">files sa-token, ca.crt</text>
    <text x="35" y="280" class="mono-text">and labels in one directory;</text>
    <text x="35" y="340" class="body-text">the application reads</text>
    <text x="35" y="378" class="body-text">everything from one place</text>
  </g>

  
  
  <path d="M 850 312 L 910 312 Q 940 312 950 350 L 968 420" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />
  
  
  <path d="M 850 575 L 966 575" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 850 852 L 910 852 Q 940 852 950 810 L 968 730" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

</svg>