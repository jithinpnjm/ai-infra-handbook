<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Job patterns and restartPolicy</title>
  <desc>Infographic explaining Kubernetes Job execution patterns, Indexed completionMode, restartPolicy behaviors, and podFailurePolicy.</desc>

  <rect width="100%" height="100%" fill="#f5f8f5" />

  
  <g id="header">
    <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Job patterns and restartPolicy</text>
  </g>

  
  <g id="top-panels">
    
    <rect x="40" y="120" width="480" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="90" cy="170" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M90 152 v36 M72 170 h36" stroke="#207448" stroke-width="4" />
    <text x="130" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">One-shot</text>
    
    <text x="65" y="235" font-family="monospace" font-size="24" fill="#303a36">completions 1,</text>
    <text x="65" y="270" font-family="monospace" font-size="24" fill="#303a36">parallelism 1:</text>
    
    <text x="65" y="325" font-family="sans-serif" font-size="24" fill="#303a36">migrations, smoke tests</text>

    
    <rect x="560" y="120" width="480" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="590" y="150" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="636" y1="168" x2="656" y2="168" stroke="#207448" stroke-width="4" />
    <text x="668" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Parallel fixed</text>
    
    <text x="585" y="235" font-family="monospace" font-size="24" fill="#303a36">completions 10,</text>
    <text x="585" y="270" font-family="monospace" font-size="24" fill="#303a36">parallelism 5:</text>
    
    <text x="585" y="325" font-family="sans-serif" font-size="24" fill="#303a36">five pods at a time</text>
    <text x="585" y="360" font-family="sans-serif" font-size="24" fill="#303a36">until 10 succeed</text>

    
    <rect x="1080" y="120" width="480" height="300" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="1110" y="148" width="40" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="1110" y="164" width="40" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="1110" y="180" width="40" height="12" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <text x="1170" y="178" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Work queue</text>
    
    <text x="1105" y="235" font-family="monospace" font-size="24" fill="#303a36">completions unset,</text>
    <text x="1105" y="270" font-family="monospace" font-size="24" fill="#303a36">parallelism 5:</text>
    
    <text x="1105" y="325" font-family="sans-serif" font-size="24" fill="#303a36">workers pull from a queue</text>
    <text x="1105" y="360" font-family="sans-serif" font-size="24" fill="#303a36">service until empty and exit 0</text>
  </g>

  
  <g id="middle-panel">
    <rect x="40" y="450" width="1520" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="70" y="480" width="48" height="48" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <text x="83" y="514" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">#i</text>
    <text x="135" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">completionMode Indexed:</text>
    
    <text x="70" y="575" font-family="sans-serif" font-size="24" fill="#303a36">
      each pod gets <tspan font-family="monospace" fill="#207448">JOB_COMPLETION_INDEX</tspan> 0 to completions minus 1,
      pod hostname <tspan font-family="monospace" fill="#207448">job-index</tspan>,
    </text>
    <text x="70" y="615" font-family="sans-serif" font-size="24" fill="#303a36">
      maps to <tspan font-family="monospace" fill="#207448">RANK</tspan> or <tspan font-family="monospace" fill="#207448">NODE_RANK</tspan>
    </text>
  </g>

  
  <g id="bottom-lanes">
    
    <rect x="40" y="680" width="740" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="85" cy="730" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M97 720 L85 732 L78 725" fill="none" stroke="#207448" stroke-width="4" />
    <text x="125" y="738" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">restartPolicy OnFailure:</text>
    
    <text x="65" y="800" font-family="sans-serif" font-size="24" fill="#303a36">kubelet restarts the container in place on</text>
    <text x="65" y="840" font-family="sans-serif" font-size="24" fill="#303a36">the same node,</text>
    
    <rect x="65" y="880" width="690" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="85" y="935" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" fill="#207448">RESTARTS</tspan> counter increments on the same Pod
    </text>

    
    <rect x="820" y="680" width="740" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="865" cy="730" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M854 719 L876 741 M876 719 L854 741" stroke="#207448" stroke-width="4" />
    <text x="905" y="738" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">restartPolicy Never:</text>
    
    <text x="845" y="800" font-family="sans-serif" font-size="24" fill="#303a36">failed Pod stays with Status Error for logs,</text>
    <text x="845" y="840" font-family="sans-serif" font-size="24" fill="#303a36">Job controller creates a brand-new replacement pod,</text>
    <text x="845" y="880" font-family="sans-serif" font-size="24" fill="#303a36">repeats until backoffLimit</text>
  </g>

  
  <g id="notes-section">
    
    <rect x="40" y="1050" width="740" height="150" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    
    <path d="M80 1130 L100 1090 L120 1130 Z" fill="none" stroke="#db8129" stroke-width="3.5" />
    <line x1="100" y1="1104" x2="100" y2="1118" stroke="#db8129" stroke-width="3.5" />
    <circle cx="100" cy="1124" r="2" fill="#db8129" />
    <text x="140" y="1135" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace" fill="#db8129">restartPolicy Always</tspan> is not allowed in a Job
    </text>

    
    <rect x="820" y="1050" width="740" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M860 1095 L880 1087 L900 1095 L900 1115 C900 1130 880 1140 880 1140 C880 1140 860 1130 860 1115 Z" fill="none" stroke="#207448" stroke-width="3.5" />
    <text x="920" y="1115" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">podFailurePolicy:</text>
    <text x="920" y="1155" font-family="sans-serif" font-size="24" fill="#303a36">
      exit code can FailJob, DisruptionTarget maps to Ignore
    </text>
  </g>
</svg>