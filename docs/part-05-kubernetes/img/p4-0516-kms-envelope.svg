<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>KMS v2 Envelope Encryption in kube-apiserver</title>
  <desc>Flow diagram showing envelope encryption steps for Kubernetes Secrets using external KMS v2 plugin and etcd storage.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">KMS v2 Envelope Encryption in kube-apiserver</text>

  
  <g transform="translate(50, 120)">
    <rect width="320" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="160" cy="70" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 120 125 C 120 100, 200 100, 200 125" fill="none" stroke="#207448" stroke-width="4" />
    
    <text x="160" y="165" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">API Client</text>
    
    
    <rect x="25" y="210" width="270" height="380" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
    <text x="160" y="260" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">submits Secret YAML with</text>
    <text x="160" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">plaintext base64 payload</text>

    
    <rect x="40" y="330" width="240" height="230" rx="8" fill="#f5f8f5" stroke="#d5ded7" stroke-width="1.5" />
    <text x="55" y="375" font-family="monospace" font-size="24" fill="#207448">kind: Secret</text>
    <text x="55" y="420" font-family="monospace" font-size="24" fill="#207448">data:</text>
    <text x="75" y="465" font-family="monospace" font-size="24" fill="#303a36">token: aGVsbG8=</text>
    <text x="55" y="515" font-family="monospace" font-size="24" fill="#888888"># plaintext base64</text>
  </g>

  
  <g transform="translate(420, 120)">
    <rect width="760" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <rect x="360" y="40" width="40" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="370" cy="54" r="3" fill="#207448" />
    <circle cx="380" cy="54" r="3" fill="#207448" />
    
    
    <text x="380" y="105" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#207448">kube-apiserver</text>

    
    <g transform="translate(30, 130)">
      <rect width="700" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="45" cy="50" r="22" fill="#207448" />
      <text x="45" y="58" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="85" y="58" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">DEK Generator</text>
      <text x="45" y="108" font-family="sans-serif" font-size="24" fill="#303a36">producing an ephemeral Data Encryption Key</text>
    </g>

    
    <g transform="translate(30, 295)">
      <rect width="700" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <path d="M 35 48 L 55 48 L 55 62 L 35 62 Z" fill="none" stroke="#207448" stroke-width="2.5" />
      <path d="M 40 48 L 40 38 A 5 5 0 0 1 50 38 L 50 48" fill="none" stroke="#207448" stroke-width="2.5" />
      <text x="75" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">gRPC KMS Client</text>
      <text x="35" y="96" font-family="sans-serif" font-size="24" fill="#303a36">communicating over a Unix domain socket with an</text>
      <text x="35" y="130" font-family="sans-serif" font-size="24" fill="#303a36">external KMS plugin</text>
    </g>

    
    <g transform="translate(30, 475)">
      <rect width="700" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="45" cy="45" r="22" fill="#207448" />
      <text x="45" y="53" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
      <text x="85" y="54" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Local Cipher</text>
      <text x="45" y="104" font-family="sans-serif" font-size="24" fill="#303a36">encrypting the Secret data with DEK</text>
    </g>
  </g>

  
  <g transform="translate(1230, 120)">
    <rect width="320" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <path d="M 160 45 L 185 58 V 85 C 185 105 160 118 160 118 C 160 118 135 105 135 85 V 58 Z" fill="none" stroke="#207448" stroke-width="3" />
    
    
    <text x="160" y="160" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">External KMS Provider</text>
    
    
    <rect x="25" y="195" width="270" height="65" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
    <text x="160" y="236" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(Cloud KMS / Vault Transit)</text>

    
    <rect x="25" y="280" width="270" height="335" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="160" cy="335" r="28" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 152 335 L 168 335 M 160 327 L 160 343" stroke="#db8129" stroke-width="3" />
    
    <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">holding Key Encryption</text>
    <text x="160" y="445" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Key (KEK)</text>

    <text x="160" y="515" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">KEK never leaves</text>
    <text x="160" y="550" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">the secure KMS boundary</text>
  </g>

  
  <g>
    <line x1="370" y1="210" x2="415" y2="210" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    
    <rect x="180" y="190" width="230" height="40" rx="20" fill="#207448" />
    <text x="295" y="217" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Step 1: Client sends POST/PUT Secret.</text>
  </g>

  
  <g>
    <line x1="1150" y1="450" x2="1225" y2="450" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  </g>

  
  <g>
    <line x1="1230" y1="520" x2="1155" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  </g>

  
  <g transform="translate(850, 785)">
    
  </g>

  
  
  
  <g transform="translate(50, 785)">
    
    <rect x="0" y="0" width="470" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="35" cy="35" r="18" fill="#207448" />
    <text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="70" y="43" font-family="sans-serif" font-size="24" fill="#303a36">Step 2: API server generates fresh DEK.</text>
  </g>

  <g transform="translate(550, 785)">
    
    <rect x="0" y="0" width="540" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="35" cy="35" r="18" fill="#207448" />
    <text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="65" y="43" font-family="sans-serif" font-size="24" fill="#303a36">Step 3: API server sends DEK to KMS plugin over gRPC.</text>
  </g>

  <g transform="translate(1120, 785)">
    
    <rect x="0" y="0" width="430" height="70" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="35" cy="35" r="18" fill="#207448" />
    <text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <text x="65" y="43" font-family="sans-serif" font-size="24" fill="#303a36">Step 4: KMS encrypts DEK with KEK and returns ciphertext DEK.</text>
  </g>

  
  <g transform="translate(50, 875)">
    <rect x="0" y="0" width="1500" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <circle cx="35" cy="32" r="18" fill="#207448" />
    <text x="35" y="39" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <text x="70" y="40" font-family="sans-serif" font-size="24" fill="#303a36">Step 5: API server encrypts Secret payload with plaintext DEK, then discards plaintext DEK from memory.</text>
  </g>

  
  
  <g transform="translate(50, 955)">
    
    <rect x="0" y="0" width="1500" height="75" rx="8" fill="#fffaf2" stroke="#db8129" stroke-width="2.5" />
    <circle cx="35" cy="37" r="18" fill="#db8129" />
    <text x="35" y="44" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <text x="70" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Step 6: API server writes combined record to etcd with prefix <tspan font-family="monospace" fill="#db8129">'k8s:enc:kms:v2:&lt;provider-name&gt;:'</tspan></text>
    <text x="70" y="62" font-family="sans-serif" font-size="24" fill="#303a36">containing encrypted DEK and ciphertext Secret payload.</text>
  </g>

  
  <line x1="800" y1="1030" x2="800" y2="1055" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g transform="translate(50, 1060)">
    <rect width="1500" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(35, 25)">
      <ellipse cx="25" cy="18" rx="25" ry="12" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 18 V 44 C 0 50, 50 50, 50 44 V 18" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M 0 31 C 0 37, 50 37, 50 31" fill="none" stroke="#207448" stroke-width="3" />
    </g>

    <text x="115" y="65" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">etcd storage</text>
    
    
    <rect x="330" y="20" width="1140" height="70" rx="8" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
    <text x="350" y="62" font-family="sans-serif" font-size="24" fill="#303a36">showing key <tspan font-family="monospace" font-weight="bold" fill="#207448">'/registry/secrets/ns/name'</tspan> storing only ciphertext.</text>
  </g>

</svg>