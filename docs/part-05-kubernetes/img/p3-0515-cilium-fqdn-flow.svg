<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <title>How Cilium learns an FQDN rule from DNS answers</title>
  <desc>Infographic explaining how Cilium observes DNS lookups to dynamically allow egress traffic to FQDN targets.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">How Cilium learns an FQDN rule from DNS answers</text>

  
  <rect x="50" y="110" width="1500" height="750" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 66 110 L 1534 110 A 16 16 0 0 1 1550 126 L 1550 166 L 50 166 L 50 126 A 16 16 0 0 1 66 110 Z" fill="#207448"/>
  <text x="800" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Sequence for pod app trainer in namespace training under CiliumNetworkPolicy trainer-egress</text>

  
  <g>
    <rect x="90" y="190" width="1420" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="135" cy="240" r="24" fill="#207448"/>
    <text x="135" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(180, 215)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="22"/>
      <ellipse cx="25" cy="25" rx="10" ry="22"/>
      <line x1="3" y1="25" x2="47" y2="25"/>
    </g>
    
    <text x="265" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="265" dy="0">egress rule allows the pod to reach kube-dns pods on port 53 ANY,</tspan>
      <tspan x="265" dy="34">which also gives Cilium visibility into the DNS answers</tspan>
    </text>
  </g>

  
  <line x1="800" y1="290" x2="800" y2="320" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="90" y="320" width="1420" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="135" cy="370" r="24" fill="#207448"/>
    <text x="135" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(180, 345)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="2" y="5" width="46" height="38" rx="4"/>
      <line x1="2" y1="16" x2="48" y2="16"/>
      <circle cx="9" cy="10" r="1.5" fill="#207448"/>
      <circle cx="15" cy="10" r="1.5" fill="#207448"/>
      <circle cx="21" cy="10" r="1.5" fill="#207448"/>
    </g>
    
    <text x="265" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="265" dy="0">pod asks for storage.googleapis.com or a name matching *.huggingface.co;</tspan>
      <tspan x="265" dy="34">Cilium sees the answer addresses</tspan>
    </text>
  </g>

  
  <line x1="800" y1="420" x2="800" y2="450" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="90" y="450" width="1420" height="105" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
    
    <circle cx="135" cy="502" r="24" fill="#207448"/>
    <text x="135" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(180, 477)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 25 4 L 45 12 L 45 28 C 45 39 25 48 25 48 C 25 48 5 39 5 28 L 5 12 Z"/>
      <path d="M 16 26 L 22 32 L 34 18"/>
    </g>
    
    <text x="265" y="493" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="265" dy="0">toFQDNs rule matchName storage.googleapis.com and matchPattern *.huggingface.co</tspan>
      <tspan x="265" dy="34">on TCP 443 now allows those learned addresses</tspan>
    </text>
  </g>

  
  <line x1="800" y1="555" x2="800" y2="585" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="90" y="585" width="1420" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="135" cy="630" r="24" fill="#207448"/>
    <text x="135" y="638" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(180, 607)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="5" y="8" width="40" height="14" rx="2"/>
      <rect x="5" y="26" width="40" height="14" rx="2"/>
      <circle cx="12" cy="15" r="1.5" fill="#207448"/>
      <circle cx="18" cy="15" r="1.5" fill="#207448"/>
      <circle cx="12" cy="33" r="1.5" fill="#207448"/>
      <circle cx="18" cy="33" r="1.5" fill="#207448"/>
    </g>
    
    <text x="265" y="638" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">toEntities kube-apiserver allows API server access</text>
  </g>

  
  <line x1="800" y1="675" x2="800" y2="705" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="90" y="705" width="1420" height="85" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    
    <g transform="translate(180, 722)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="25" cy="25" r="20"/>
      <line x1="11" y1="11" x2="39" y2="39"/>
    </g>
    
    <text x="265" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Anything else denied</text>
  </g>

  
  <g>
    <rect x="50" y="905" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(90, 955)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 8 4 L 32 4 L 42 14 L 42 46 L 8 46 Z"/>
      <path d="M 32 4 L 32 14 L 42 14"/>
      <line x1="16" y1="24" x2="34" y2="24"/>
      <line x1="16" y1="32" x2="34" y2="32"/>
    </g>
    
    <text x="175" y="966" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#303a36">
      <tspan x="175" dy="0" font-weight="bold">standard NetworkPolicy has no FQDN egress:</tspan>
      <tspan x="175" dy="38">ipBlock needs static IPs but SaaS endpoints change</tspan>
    </text>
  </g>
</svg>