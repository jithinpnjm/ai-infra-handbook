<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How Calico compiles a policy into iptables and ipsets</title>
  <desc>Architecture infographic illustrating Calico policy compilation into iptables chains and ipsets, including workload dispatchers, per-policy chains, match rules, ipset updates, and dataplane performance tradeoffs.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#204030" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">How Calico compiles a policy into iptables and ipsets</text>

  
  <g id="flow-of-chains">
    <rect x="40" y="105" width="1020" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)"/>
    <text x="70" y="152" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Flow of chains</text>

    
    <g id="node-cali-forward">
      <rect x="360" y="180" width="380" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(382, 197)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 28 6 L 50 14 V 30 C 50 44 28 54 28 54 C 28 54 6 44 6 30 V 14 Z"/>
        <path d="M 28 18 V 40 M 18 29 H 38"/>
      </g>
      <text x="456" y="236" font-family="monospace" font-size="28px" font-weight="bold" fill="#303a36">cali-FORWARD</text>
    </g>

    
    <path d="M 450 270 L 450 315 L 290 315 L 290 345" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M 650 270 L 650 315 L 810 315 L 810 345" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <g id="node-cali-from-wl-dispatch">
      <rect x="70" y="348" width="440" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(88, 366)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6"/>
        <path d="M 28 20 L 38 28 L 28 36 M 16 28 H 38"/>
      </g>
      <text x="160" y="398" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">cali-from-wl-dispatch</text>
      <text x="94" y="440" font-family="monospace" font-size="24px" fill="#207448">-&gt; cali-fw-iface</text>
      <text x="94" y="475" font-family="sans-serif" font-size="24px" fill="#303a36">(traffic from workload, applies</text>
      <text x="94" y="506" font-family="sans-serif" font-size="24px" fill="#303a36">the pod&apos;s egress policies)</text>
    </g>

    
    <g id="node-cali-to-wl-dispatch">
      <rect x="590" y="348" width="440" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(608, 366)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6"/>
        <path d="M 26 20 L 16 28 L 26 36 M 38 28 H 16"/>
      </g>
      <text x="680" y="398" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">cali-to-wl-dispatch</text>
      <text x="614" y="440" font-family="monospace" font-size="24px" fill="#207448">-&gt; cali-tw-iface</text>
      <text x="614" y="475" font-family="sans-serif" font-size="24px" fill="#303a36">(traffic to workload, applies</text>
      <text x="614" y="506" font-family="sans-serif" font-size="24px" fill="#303a36">ingress policies)</text>
    </g>

    
    <path d="M 290 535 L 290 565 L 470 565 L 470 598" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M 810 535 L 810 565 L 630 565 L 630 598" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <g id="node-per-policy-chains">
      <rect x="70" y="602" width="960" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <g transform="translate(95, 622)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="16" width="22" height="14" rx="7"/>
        <rect x="26" y="26" width="22" height="14" rx="7"/>
        <path d="M 22 26 L 30 26"/>
      </g>
      <text x="165" y="650" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Per-policy chains</text>
      <text x="165" y="694" font-family="monospace" font-size="25px" font-weight="bold" fill="#303a36">cali-pi-policy <tspan font-family="sans-serif" font-weight="normal" fill="#303a36">(ingress rules) and</tspan> cali-po-policy <tspan font-family="sans-serif" font-weight="normal" fill="#303a36">(egress rules)</tspan></text>
      <text x="165" y="728" font-family="sans-serif" font-size="24px" fill="#506259">Evaluated in tiered sequence per policy specification</text>
    </g>

    
    <path d="M 550 752 L 550 788" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

    
    <g id="node-rule-form">
      <rect x="70" y="792" width="960" height="200" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(95, 810)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="24" width="36" height="28" rx="6"/>
        <path d="M 18 24 V 16 C 18 10 38 10 38 16 V 24"/>
        <circle cx="28" cy="38" r="3" fill="#db8129"/>
      </g>
      <text x="165" y="842" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#db8129">Rule form:</text>
      <text x="95" y="890" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">-m set --match-set cali40s:hash src -p tcp --dport 8000</text>
      <text x="95" y="930" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">-j MARK --set-xmark 0x10000/0x10000 <tspan font-family="sans-serif" font-weight="normal" fill="#207448">(allow mark),</tspan></text>
      <text x="95" y="968" font-family="sans-serif" font-size="24px" fill="#303a36">drop at the end of the profile chain</text>
    </g>
  </g>

  
  <g id="side-panel-ipset-update">
    <rect x="1080" y="105" width="480" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)"/>

    
    <g transform="translate(1110, 128)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="20" ry="8"/>
      <path d="M 8 14 V 38 C 8 44 48 44 48 38 V 14"/>
      <path d="M 8 26 C 8 32 48 32 48 26"/>
    </g>
    <text x="1178" y="162" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">ipset update</text>

    
    <rect x="1106" y="196" width="428" height="796" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    
    
    <g transform="translate(1130, 222)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="10"/>
      <path d="M 28 6 V 14 M 28 42 V 50 M 6 28 H 14 M 42 28 H 50 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12"/>
    </g>
    <text x="1196" y="258" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">Felix Controller</text>

    
    <text x="1130" y="316" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Felix agent compiles policy;</text>
    <text x="1130" y="354" font-family="sans-serif" font-size="24px" fill="#303a36">each selector becomes an</text>
    <text x="1130" y="390" font-family="sans-serif" font-size="24px" fill="#303a36">ipset of pod IPs;</text>

    <line x1="1130" y1="424" x2="1504" y2="424" stroke="#e8f1ea" stroke-width="2"/>

    
    <text x="1130" y="468" font-family="sans-serif" font-size="24px" fill="#303a36">a new labelled pod is just</text>
    <rect x="1130" y="484" width="168" height="38" rx="6" fill="#e8f1ea"/>
    <text x="1142" y="512" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipset add</text>
    <text x="1308" y="512" font-family="sans-serif" font-size="24px" fill="#303a36">, a deleted</text>
    <text x="1130" y="556" font-family="sans-serif" font-size="24px" fill="#303a36">pod is</text>
    <rect x="1208" y="528" width="168" height="38" rx="6" fill="#e8f1ea"/>
    <text x="1220" y="556" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipset del</text>
    <text x="1386" y="556" font-family="sans-serif" font-size="24px" fill="#303a36">;</text>

    <line x1="1130" y1="592" x2="1504" y2="592" stroke="#e8f1ea" stroke-width="2"/>

    
    
    <g transform="translate(1130, 620)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="20" r="16"/>
      <path d="M 12 20 L 17 25 L 28 14"/>
    </g>
    <text x="1182" y="648" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448">rules stay unchanged;</text>

    
    <text x="1130" y="704" font-family="sans-serif" font-size="24px" fill="#303a36">rule count grows with</text>
    <text x="1130" y="742" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">policies times ports,</text>
    <text x="1130" y="780" font-family="sans-serif" font-size="24px" fill="#303a36">not with pod count</text>

    
    <rect x="1130" y="824" width="380" height="142" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="1148" y="860" font-family="monospace" font-size="24px" fill="#207448">ipset: cali40s:hash</text>
    <text x="1148" y="896" font-family="monospace" font-size="24px" fill="#303a36">  10.244.0.12</text>
    <text x="1148" y="932" font-family="monospace" font-size="24px" fill="#303a36">  10.244.1.45</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1035" width="1520" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)"/>
    
    <g transform="translate(62, 1056)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6"/>
      <path d="M 4 20 H 10 M 4 36 H 10 M 46 20 H 52 M 46 36 H 52 M 20 4 V 10 M 36 4 V 10 M 20 46 V 52 M 36 46 V 52"/>
      <circle cx="28" cy="28" r="6"/>
    </g>
    
    <text x="134" y="1076" font-family="sans-serif" font-size="24px" fill="#303a36">ipset lookup O(1) per set, but evaluation of rules is O(number of rules) per new connection;</text>
    <text x="134" y="1112" font-family="sans-serif" font-size="24px" fill="#303a36">Calico eBPF dataplane replaces the chains with BPF programs and maps;</text>
    <text x="134" y="1148" font-family="sans-serif" font-size="24px" fill="#303a36">churn (one policy per job) triggers recompiles and CNI agent CPU</text>
  </g>
</svg>