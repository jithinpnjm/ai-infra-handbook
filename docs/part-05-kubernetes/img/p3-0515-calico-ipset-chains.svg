<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>How Calico compiles a policy into iptables and ipsets</title>
  <desc>Visual diagram showing how Calico compiles policies into iptables chains and ipsets, including workload dispatch, per-policy chains, match rules, ipset updates, and dataplane considerations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="800" y="75" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">How Calico compiles a policy into iptables and ipsets</text>

  
  <rect x="40" y="130" width="1010" height="940" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="180" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">Flow of chains</text>

  
  <rect x="320" y="210" width="450" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <path d="M 345 235 L 365 225 L 385 235 L 385 255 C 385 270 365 280 365 280 C 365 280 345 270 345 255 Z" fill="none" stroke="#207448" stroke-width="3" />
  <text x="560" y="260" text-anchor="middle" font-family="monospace" font-size="30px" font-weight="bold" fill="#303a36">cali-FORWARD</text>

  
  <path d="M 435 290 L 435 315 L 295 315 L 295 340" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 655 290 L 655 315 L 785 315 L 785 340" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="340" width="460" height="250" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="100" cy="375" r="16" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 92 375 L 108 375 M 100 367 L 108 375 L 100 383" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="130" y="380" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">cali-from-wl-dispatch -&gt;</text>
  <text x="130" y="415" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">cali-fw-iface</text>
  <text x="90" y="475" font-family="sans-serif" font-size="24px" fill="#303a36">(traffic from workload,</text>
  <text x="90" y="515" font-family="sans-serif" font-size="24px" fill="#303a36">applies the pod's egress policies)</text>

  
  <rect x="555" y="340" width="465" height="250" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="590" cy="375" r="16" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 598 375 L 582 375 M 590 367 L 582 375 L 590 383" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="620" y="380" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">cali-to-wl-dispatch -&gt;</text>
  <text x="620" y="415" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">cali-tw-iface</text>
  <text x="580" y="475" font-family="sans-serif" font-size="24px" fill="#303a36">(traffic to workload,</text>
  <text x="580" y="515" font-family="sans-serif" font-size="24px" fill="#303a36">applies ingress policies)</text>

  
  <path d="M 295 590 L 295 640" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 785 590 L 785 640" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="640" width="955" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="90" y="675" width="30" height="18" rx="9" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="110" y="675" width="30" height="18" rx="9" fill="none" stroke="#207448" stroke-width="3" />
  <text x="160" y="688" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">Per-policy chains <tspan font-family="monospace" fill="#207448">cali-pi-policy</tspan> (ingress rules)</text>
  <text x="160" y="730" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">and <tspan font-family="monospace" fill="#207448">cali-po-policy</tspan> (egress rules)</text>

  
  <path d="M 542 760 L 542 800" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="800" width="955" height="240" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="95" y="845" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129">Rule form:</text>
  <text x="95" y="890" font-family="monospace" font-size="24px" fill="#303a36">-m set --match-set cali40s:hash src</text>
  <text x="95" y="930" font-family="monospace" font-size="24px" fill="#303a36">-p tcp --dport 8000</text>
  <text x="95" y="970" font-family="monospace" font-size="24px" fill="#303a36">-j MARK --set-xmark 0x10000/0x10000 (allow mark),</text>
  <text x="95" y="1010" font-family="sans-serif" font-size="24px" fill="#303a36">drop at the end of the profile chain</text>

  
  <rect x="1080" y="130" width="480" height="940" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1110" y="180" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">ipset update</text>

  <rect x="1105" y="210" width="430" height="830" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <circle cx="1145" cy="255" r="14" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 1145 235 L 1145 241 M 1145 269 L 1145 275 M 1125 255 L 1131 255 M 1159 255 L 1165 255" fill="none" stroke="#207448" stroke-width="3" />

  <text x="1175" y="262" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Felix agent compiles policy;</text>

  <text x="1135" y="335" font-family="sans-serif" font-size="24px" fill="#303a36">each selector becomes an</text>
  <text x="1135" y="375" font-family="sans-serif" font-size="24px" fill="#303a36">ipset of pod IPs;</text>

  <path d="M 1135 415 L 1505 415" stroke="#e8f1ea" stroke-width="2" />

  <text x="1135" y="465" font-family="sans-serif" font-size="24px" fill="#303a36">a new labelled pod is just</text>
  <text x="1135" y="505" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipset add<tspan font-family="sans-serif" font-weight="normal" fill="#303a36">, a deleted pod is</tspan></text>
  <text x="1135" y="545" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">ipset del<tspan font-family="sans-serif" font-weight="normal" fill="#303a36">;</tspan></text>

  <path d="M 1135 595 L 1505 595" stroke="#e8f1ea" stroke-width="2" />

  <text x="1135" y="645" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">rules stay unchanged;</text>

  <text x="1135" y="725" font-family="sans-serif" font-size="24px" fill="#303a36">rule count grows with</text>
  <text x="1135" y="765" font-family="sans-serif" font-size="24px" fill="#303a36">policies times ports,</text>
  <text x="1135" y="805" font-family="sans-serif" font-size="24px" fill="#303a36">not with pod count</text>

  
  <rect x="40" y="1110" width="1520" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="70" y="1145" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 78 1140 L 78 1145 M 88 1140 L 88 1145 M 98 1140 L 98 1145 M 78 1181 L 78 1186 M 88 1181 L 88 1186 M 98 1181 L 98 1186" stroke="#207448" stroke-width="2" />

  <text x="125" y="1170" font-family="sans-serif" font-size="25px" fill="#303a36">ipset lookup O(1) per set, but evaluation of rules is O(number of rules) per new connection;</text>
  <text x="125" y="1225" font-family="sans-serif" font-size="25px" fill="#303a36">Calico eBPF dataplane replaces the chains with BPF programs and maps;</text>
  <text x="125" y="1280" font-family="sans-serif" font-size="25px" fill="#303a36">churn (one policy per job) triggers recompiles and CNI agent CPU</text>
</svg>