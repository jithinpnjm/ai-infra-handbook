<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>JSON, YAML and Kubernetes types</title>
  <desc>Architecture flow from kube-apiserver through Reflector, DeltaFIFO Queue, Indexer Store, WorkQueue, and Worker Goroutines.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="80" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">JSON, YAML and Kubernetes types</text>

  

  
  <line x1="355" y1="320" x2="355" y2="470" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="395" y="380" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Reflector</text>
  <text x="395" y="415" font-family="monospace" font-size="24" fill="#303a36">(List @ rv -&gt; Watch)</text>

  
  <line x1="355" y1="670" x2="355" y2="800" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="395" y="742" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Pop &amp; Index</text>

  
  <line x1="630" y1="570" x2="970" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="800" y="542" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">ResourceEventHandler</text>

  
  <line x1="1260" y1="670" x2="1260" y2="800" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="1220" y="725" text-anchor="end" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">Get() -&gt; Reconcile -&gt; Done()/Forget()</text>
  <text x="1220" y="760" text-anchor="end" font-family="monospace" font-size="24" fill="#303a36">or AddRateLimited() on err</text>

  

  
  <g id="node-api">
    <rect x="80" y="140" width="550" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(108, 202)">
      <rect x="0" y="4" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4"/>
      <circle cx="14" cy="16" r="4" fill="#207448"/>
      <circle cx="28" cy="16" r="4" fill="#207448"/>
      <circle cx="14" cy="40" r="4" fill="#207448"/>
      <circle cx="28" cy="40" r="4" fill="#207448"/>
    </g>
    <text x="188" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">kube-apiserver</text>
    <text x="188" y="265" font-family="monospace" font-size="24" fill="#303a36">(/api &amp; /apis List+Watch)</text>
  </g>

  
  <g id="node-df">
    <rect x="80" y="470" width="550" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(108, 532)">
      <rect x="0" y="8" width="56" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="18" y1="8" x2="18" y2="48" stroke="#207448" stroke-width="4"/>
      <line x1="36" y1="8" x2="36" y2="48" stroke="#207448" stroke-width="4"/>
      <path d="M 28 20 L 32 28 L 24 28 Z" fill="#207448"/>
    </g>
    <text x="188" y="545" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DeltaFIFO Queue</text>
    <text x="188" y="595" font-family="sans-serif" font-size="24" fill="#303a36">(Added / Updated / Deleted)</text>
  </g>

  
  <g id="node-store">
    <rect x="80" y="800" width="550" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(108, 872)">
      <ellipse cx="28" cy="12" rx="24" ry="10" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 4 12 L 4 44 A 24 10 0 0 0 52 44 L 52 12" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 4 28 A 24 10 0 0 0 52 28" fill="none" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="188" y="860" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Indexer &amp; Local</text>
    <text x="188" y="896" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Thread-Safe Store</text>
    <text x="188" y="942" font-family="sans-serif" font-size="24" fill="#303a36">(Lister reads here;</text>
    <text x="188" y="972" font-family="sans-serif" font-size="24" fill="#303a36">DeepCopy before mutate)</text>
  </g>

  
  <g id="node-wq">
    <rect x="970" y="470" width="550" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(998, 542)">
      <rect x="2" y="10" width="52" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="28" cy="29" r="12" fill="none" stroke="#207448" stroke-width="3"/>
      <polyline points="28,21 28,29 34,29" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1075" y="530" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">WorkQueue</text>
    <text x="1075" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">(RateLimitingInterface)</text>
    <text x="1075" y="612" font-family="sans-serif" font-size="24" fill="#303a36">(Enqueue 'namespace/name'</text>
    <text x="1075" y="642" font-family="sans-serif" font-size="24" fill="#303a36">key only)</text>
  </g>

  
  <g id="node-worker">
    <rect x="970" y="800" width="550" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(998, 862)">
      <circle cx="28" cy="28" r="15" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 4 L 28 12 M 28 44 L 28 52 M 4 28 L 12 28 M 44 28 L 52 28 M 11 11 L 17 17 M 39 39 L 45 45 M 11 45 L 17 39 M 39 17 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1075" y="875" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Worker Goroutines</text>
    <text x="1075" y="925" font-family="sans-serif" font-size="24" fill="#303a36">(Apply / Patch via Clientset)</text>
  </g>
</svg>