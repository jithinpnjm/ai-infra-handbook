<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1340" width="1600" height="1340">
  <title>Topology-aware routing keeps requests in the zone</title>
  <desc>Visual comparison showing how Kubernetes topology-aware routing keeps client requests inside the same zone instead of crossing zone boundaries.</desc>

  <defs>
    
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#607068" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1340" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Topology-aware routing keeps requests in the zone</text>

  
  <rect x="40" y="100" width="740" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(70, 125)">
    
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3" />
    <ellipse cx="28" cy="28" rx="12" ry="24" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="4" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="2.5" />
    <text x="75" y="38" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">default</text>
  </g>

  
  <text x="70" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">a client in zone A may land on endpoints</tspan>
    <tspan x="70" dy="32">in any zone, crossing zone boundaries</tspan>
    <tspan x="70" dy="32">(extra latency and cost)</tspan>
  </text>

  
  <rect x="70" y="350" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="95" y="390" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone A</text>
  
  
  <rect x="200" y="385" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="275" y="426" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="540" y="385" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="630" y="426" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <rect x="70" y="500" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="95" y="540" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone B</text>
  
  
  <rect x="200" y="535" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="275" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="540" y="535" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="630" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <rect x="70" y="650" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="95" y="690" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone C</text>
  
  
  <rect x="200" y="685" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="275" y="726" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="540" y="685" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="630" y="726" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <path d="M 350 410 L 532 410" fill="none" stroke="#607068" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-gray)" />
  <path d="M 350 422 C 430 422 450 567 532 567" fill="none" stroke="#607068" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-gray)" />
  <path d="M 350 434 C 410 434 460 717 532 717" fill="none" stroke="#607068" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-gray)" />

  
  <rect x="820" y="100" width="740" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(850, 122)">
    
    <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="2" />
    <circle cx="28" cy="28" r="5" fill="#207448" />
  </g>
  <text x="925" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">trafficDistribution PreferClose</text>

  
  <text x="850" y="194" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="850" dy="0">(earlier: annotation</tspan>
    <tspan x="850" dy="32">service.kubernetes.io/topology-mode Auto)</tspan>
  </text>

  
  <text x="850" y="270" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="850" dy="0">EndpointSlice hints with forZones keep</tspan>
    <tspan x="850" dy="32">the request inside zone A while it has endpoints</tspan>
  </text>

  
  <rect x="850" y="350" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="875" y="390" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone A</text>
  
  
  <rect x="980" y="385" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1055" y="426" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="1320" y="385" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1410" y="426" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <rect x="850" y="500" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="875" y="540" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone B</text>
  
  
  <rect x="980" y="535" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1055" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="1320" y="535" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1410" y="576" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <rect x="850" y="650" width="680" height="130" rx="12" fill="#ffffff" stroke="#9ec5ab" stroke-width="1.5" />
  <text x="875" y="690" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">zone C</text>
  
  
  <rect x="980" y="685" width="150" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1055" y="726" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">client</text>

  
  <rect x="1320" y="685" width="180" height="65" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="1410" y="726" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">endpoints</text>

  
  <path d="M 1130 417 L 1310 417" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />

  
  
  <rect x="40" y="840" width="740" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(70, 865)">
    
    <path d="M 24 4 L 44 14 L 44 32 C 44 42 24 50 24 50 C 24 50 4 42 4 32 L 4 14 Z" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 16 26 L 32 26 M 26 18 L 34 26 L 26 34" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="60" y="36" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Fallback</text>
  </g>
  <text x="70" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="70" dy="0">if a zone has no endpoints or endpoints are unbalanced,</tspan>
    <tspan x="70" dy="34">traffic falls back to cluster-wide routing</tspan>
  </text>

  
  <rect x="820" y="840" width="740" height="185" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(850, 865)">
    
    <rect x="6" y="8" width="36" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 14 22 L 20 28 L 32 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="14" y1="38" x2="34" y2="38" stroke="#207448" stroke-width="2.5" />
    <text x="60" y="36" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Needs</text>
  </g>
  <text x="850" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="850" dy="0">zone labels on nodes and enough endpoints</tspan>
    <tspan x="850" dy="34">in each zone</tspan>
  </text>

  
  <rect x="40" y="1050" width="1520" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(70, 1075)">
    
    <rect x="6" y="10" width="36" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="22" x2="42" y2="22" stroke="#207448" stroke-width="2" />
    <line x1="24" y1="22" x2="24" y2="42" stroke="#207448" stroke-width="2" />
    <text x="56" y="34" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Analogy</text>
  </g>
  <text x="240" y="1119" font-family="sans-serif" font-size="24" fill="#303a36">parcel goes to the depot in the same town until it is empty</text>

  
  <rect x="40" y="1195" width="1520" height="90" rx="14" fill="#207448" />
  <text x="800" y="1251" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">check each zone has endpoints before turning it on, then watch where requests land</text>
</svg>