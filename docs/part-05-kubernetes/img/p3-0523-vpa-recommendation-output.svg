<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Reading a VPA recommendation</title>
  <desc>Annotated kubectl describe vpa Status for container coredns, illustrating lower bound, target baseline for requests, uncapped target, upper bound, CPU safe range from 25m to 427m, workload variability callout, and four steps for right-sizing in Off mode.</desc>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading a VPA recommendation</text>

  
  <g id="vpa-status-panel">
    <rect x="50" y="95" width="970" height="435" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(74, 114)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6" fill="#ffffff" />
      <line x1="4" y1="20" x2="52" y2="20" />
      <circle cx="12" cy="14" r="2" fill="#207448" />
      <circle cx="20" cy="14" r="2" fill="#207448" />
      <polyline points="12,32 18,36 12,40" />
      <line x1="24" y1="40" x2="38" y2="40" />
    </g>

    
    <text x="148" y="136" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="148" dy="0">Annotated kubectl describe vpa</tspan>
      <tspan x="148" dy="38">Status for container coredns</tspan>
    </text>

    
    <rect x="74" y="195" width="922" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(90, 205)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="34" height="34" rx="4" />
      <line x1="12" y1="32" x2="34" y2="32" stroke-width="4" />
      <polyline points="16,22 23,29 30,22" stroke-width="3" />
    </g>
    <text x="156" y="237" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Lower Bound: Cpu 25m, Memory 262144k</text>

    
    <rect x="74" y="271" width="922" height="92" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    <g transform="translate(90, 291)">
      <circle cx="23" cy="26" r="18" fill="#fff5eb" stroke="#db8129" stroke-width="3" />
      <circle cx="23" cy="26" r="10" fill="none" stroke="#db8129" stroke-width="2.5" />
      <circle cx="23" cy="26" r="4" fill="#db8129" />
    </g>
    <text x="156" y="309" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="156" dy="0" font-family="monospace" fill="#db8129">Target: Cpu 25m, Memory 262144k</tspan>
      <tspan x="156" dy="36" fill="#303a36"> (use as the baseline for requests)</tspan>
    </text>

    
    <rect x="74" y="373" width="922" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(90, 383)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 10 L 6 10 L 6 36 L 12 36" />
      <path d="M 34 10 L 40 10 L 40 36 L 34 36" />
      <circle cx="23" cy="23" r="6" fill="#207448" />
    </g>
    <text x="156" y="415" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Uncapped Target: Cpu 25m, Memory 262144k</text>

    
    <rect x="74" y="449" width="922" height="66" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <g transform="translate(90, 459)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="34" height="34" rx="4" />
      <line x1="12" y1="14" x2="34" y2="14" stroke-width="4" />
      <polyline points="16,24 23,17 30,24" stroke-width="3" />
    </g>
    <text x="156" y="491" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">Upper Bound: Cpu 427m, Memory 916943343</text>
  </g>

  
  <g id="callout-panel">
    <rect x="1050" y="95" width="500" height="435" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(1272, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="#e8f1ea" />
      <polyline points="10,32 18,18 26,38 34,22 42,34 46,28" stroke="#207448" />
    </g>

    
    <text x="1300" y="280" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1300" dy="0">a wide gap between</tspan>
      <tspan x="1300" dy="44">lower and upper means</tspan>
      <tspan x="1300" dy="44">the workload varies a lot</tspan>
    </text>
  </g>

  
  <g id="number-line-panel">
    <rect x="50" y="550" width="1500" height="225" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(75, 570)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="32" height="32" rx="6" fill="#e8f1ea" />
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#207448" />
      <line x1="20" y1="4" x2="20" y2="12" />
      <line x1="28" y1="4" x2="28" y2="12" />
      <line x1="36" y1="4" x2="36" y2="12" />
      <line x1="20" y1="44" x2="20" y2="52" />
      <line x1="28" y1="44" x2="28" y2="52" />
      <line x1="36" y1="44" x2="36" y2="52" />
      <line x1="4" y1="20" x2="12" y2="20" />
      <line x1="4" y1="28" x2="12" y2="28" />
      <line x1="4" y1="36" x2="12" y2="36" />
      <line x1="44" y1="20" x2="52" y2="20" />
      <line x1="44" y1="28" x2="52" y2="28" />
      <line x1="44" y1="36" x2="52" y2="36" />
    </g>

    
    <path d="M 320 632 Q 320 610 340 610 L 830 610 Q 850 610 850 590 Q 850 610 870 610 L 1360 610 Q 1380 610 1380 632" fill="none" stroke="#207448" stroke-width="3.5" />
    <text x="850" y="578" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">range the recommender thinks is safe</text>

    
    <line x1="240" y1="665" x2="1440" y2="665" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <line x1="320" y1="645" x2="320" y2="685" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    <circle cx="320" cy="665" r="16" fill="#fff5eb" stroke="#db8129" stroke-width="3.5" />
    <circle cx="320" cy="665" r="5" fill="#db8129" />
    <line x1="320" y1="645" x2="320" y2="685" stroke="#db8129" stroke-width="2" />
    <line x1="300" y1="655" x2="340" y2="655" stroke="#db8129" stroke-width="2" />
    
    <text x="320" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">25m</text>

    
    <line x1="1380" y1="645" x2="1380" y2="685" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="1380" cy="665" r="8" fill="#207448" />
    
    <text x="1380" y="730" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">427m</text>
  </g>

  
  
  <g id="step-1">
    <rect x="50" y="795" width="354" height="285" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="94" cy="839" r="24" fill="#207448" />
    <path d="M 90 833 L 94 829 L 94 849 M 86 849 L 102 849" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <g transform="translate(324, 811)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="16" width="48" height="24" rx="12" fill="#ffffff" />
      <circle cx="16" cy="28" r="7" fill="#207448" />
    </g>
    
    <rect x="66" y="880" width="322" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="86" y="955" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="86" dy="0">1 run VPA in</tspan>
      <tspan x="86" dy="44">Off mode</tspan>
    </text>
  </g>

  
  <g id="step-2">
    <rect x="432" y="795" width="354" height="285" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="476" cy="839" r="24" fill="#207448" />
    <path d="M 468 833 C 468 827 484 827 484 834 C 484 841 468 844 468 849 L 484 849" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <g transform="translate(706, 811)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6" fill="#ffffff" />
      <line x1="4" y1="20" x2="52" y2="20" stroke-width="3" />
      <polyline points="12,32 18,36 12,40" stroke-width="3.5" />
      <line x1="24" y1="40" x2="38" y2="40" stroke-width="3.5" />
    </g>
    
    <rect x="448" y="880" width="322" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="468" y="955" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="468" dy="0">2 describe vpa</tspan>
      <tspan x="468" dy="44">after real traffic</tspan>
    </text>
  </g>

  
  <g id="step-3">
    <rect x="814" y="795" width="354" height="285" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="858" cy="839" r="24" fill="#207448" />
    <path d="M 850 830 L 864 830 L 857 839 C 864 839 865 849 850 849" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <g transform="translate(1088, 811)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="#ffffff" />
      <line x1="16" y1="12" x2="16" y2="44" />
      <line x1="28" y1="12" x2="28" y2="44" />
      <line x1="40" y1="12" x2="40" y2="44" />
      <circle cx="16" cy="34" r="4" fill="#207448" />
      <circle cx="28" cy="20" r="4" fill="#207448" />
      <circle cx="40" cy="36" r="4" fill="#207448" />
    </g>
    
    <rect x="830" y="880" width="322" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="850" y="934" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="850" dy="0">3 engineers set</tspan>
      <tspan x="850" dy="40">requests by hand</tspan>
      <tspan x="850" dy="40">from Target</tspan>
    </text>
  </g>

  
  <g id="step-4">
    <rect x="1196" y="795" width="354" height="285" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1240" cy="839" r="24" fill="#207448" />
    <path d="M 1244 849 L 1244 829 L 1232 842 L 1248 842" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <g transform="translate(1470, 811)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="#ffffff" />
      <path d="M 28 12 L 44 18 C 44 34 36 42 28 46 C 20 42 12 34 12 18 Z" stroke="#207448" />
      <path d="M 20 28 L 26 34 L 36 22" stroke="#207448" stroke-width="3.5" />
    </g>
    
    <rect x="1212" y="880" width="322" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1232" y="955" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="1232" dy="0">4 nothing is</tspan>
      <tspan x="1232" dy="44">evicted at peak</tspan>
    </text>
  </g>
</svg>