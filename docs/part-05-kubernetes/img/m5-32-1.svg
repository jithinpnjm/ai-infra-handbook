<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Architecture</title>
  <desc>Visual architecture of the GPU health operator reconciling node conditions, policies, pods, and events.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Architecture</text>

  
  <rect x="50" y="140" width="340" height="260" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
  <text x="220" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">Detection <tspan font-size="24" font-weight="normal">(not this operator)</tspan></text>

  
  <g id="node-d">
    <rect x="70" y="205" width="300" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(192, 220)">
      <rect x="0" y="8" width="56" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 12 28 L 22 28 L 27 16 L 33 40 L 38 28 L 44 28" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="14" y1="0" x2="14" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="0" x2="42" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    
    <text x="220" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">DCGM exporter</text>
    <text x="220" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">or NPD or</text>
    <text x="220" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">vendor agent</text>
  </g>

  
  <g id="node-n">
    
    <rect x="620" y="160" width="380" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <path d="M 620 195 C 620 180, 1000 180, 1000 195" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    
    <g transform="translate(782, 180)">
      <rect x="0" y="0" width="56" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="10" cy="12" r="3" fill="#207448" />
      <circle cx="20" cy="12" r="3" fill="#207448" />
      <line x1="32" y1="12" x2="48" y2="12" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <rect x="0" y="28" width="56" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="10" cy="40" r="3" fill="#207448" />
      <circle cx="20" cy="40" r="3" fill="#207448" />
      <line x1="32" y1="40" x2="48" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="810" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Node</text>
    <text x="810" y="328" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">status.conditions</text>
  </g>

  
  <g id="node-pods">
    <rect x="1250" y="160" width="300" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <path d="M 1250 195 C 1250 180, 1550 180, 1550 195" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    
    <g transform="translate(1372, 185)">
      <polygon points="28,2 54,16 28,30 2,16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <polygon points="2,16 28,30 28,54 2,40" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <polygon points="54,16 28,30 28,54 54,40" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    </g>
    
    <text x="1400" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pods on node</text>
  </g>

  
  <g id="node-p">
    <rect x="70" y="560" width="320" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <path d="M 70 595 C 70 580, 390 580, 390 595" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    
    <g transform="translate(202, 585)">
      <path d="M 28 2 L 52 12 C 52 34 28 52 28 52 C 28 52 4 34 4 12 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M 16 25 L 25 34 L 40 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="230" y="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPUHealthPolicy</text>
  </g>

  
  <g id="node-r">
    <rect x="620" y="540" width="380" height="240" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(782, 565)">
      <path d="M 28 6 A 22 22 0 0 1 50 28 L 54 24" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <polyline points="52,14 50,28 36,28" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 28 50 A 22 22 0 0 1 6 28 L 2 32" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
      <polyline points="4,42 6,28 20,28" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="810" y="665" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="#db8129">Reconcile</text>
    <text x="810" y="715" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Judge then Plan then Act</text>
  </g>

  
  <g id="node-e">
    <rect x="1250" y="560" width="300" height="220" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1372, 585)">
      <rect x="0" y="0" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3" />
      <circle cx="8" cy="7" r="2" fill="#207448" />
      <circle cx="16" cy="7" r="2" fill="#207448" />
      <path d="M 10 26 L 18 31 L 10 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="36" x2="34" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    
    <text x="1400" y="700" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">kubectl describe</text>
  </g>

  

  
  <path d="M 370 270 L 620 270" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="495" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="495" dy="0">sets node condition</tspan>
    <tspan x="495" dy="28" font-family="ui-monospace, monospace" font-weight="bold">GPUHealthy</tspan>
  </text>

  
  <path d="M 720 380 L 720 540" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 390 630 L 620 630" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 890 540 L 890 380" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="910" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="910" dy="0">patch unschedulable</tspan>
    <tspan x="910" dy="28">plus owner annotation</tspan>
  </text>

  
  <path d="M 1000 600 L 1140 600 L 1140 270 L 1250 270" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-linejoin="round" />
  <text x="1125" y="430" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1125" dy="0">optional eviction</tspan>
    <tspan x="1125" dy="28">subresource</tspan>
  </text>

  
  <path d="M 620 710 L 390 710" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="505" y="670" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="505" dy="0">status and</tspan>
    <tspan x="505" dy="26">conditions</tspan>
  </text>

  
  <path d="M 1000 700 L 1250 700" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <text x="1125" y="685" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">events</text>

  
  <path d="M 750 780 L 750 870 L 870 870 L 870 780" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" stroke-linejoin="round" />
  <text x="810" y="915" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="810" dy="0">RequeueAfter for</tspan>
    <tspan x="810" dy="28">time windows</tspan>
  </text>
</svg>