<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Karpenter versus node groups, and the NodePool rules</title>
  <desc>Visual comparison between Cluster Autoscaler menu-based scaling and Karpenter JIT chef-like provisioning, alongside an annotated NodePool specification for gpu-inference.</desc>

  <rect width="1600" height="1350" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Karpenter versus node groups, and the NodePool rules</text>

  
  <rect x="50" y="100" width="710" height="1200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(80, 130)">
    
    <path d="M 12 40 L 48 40 L 46 48 L 14 48 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 14 40 C 6 36 6 22 18 20 C 16 10 32 8 36 16 C 42 8 54 18 44 28 C 48 34 46 38 46 40" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="44" x2="42" y2="44" stroke="#207448" stroke-width="2"/>
    
    <text x="70" y="38" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">menu versus chef</text>
  </g>

  
  <rect x="80" y="210" width="650" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(106, 236)">
    
    <rect x="0" y="4" width="36" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="8" y1="18" x2="28" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="28" x2="28" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="8" y1="38" x2="22" y2="38" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="160" y="272" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Fixed Node Groups</text>
  <text x="106" y="336" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="106" dy="0">Cluster Autoscaler orders from a fixed</tspan>
    <tspan x="106" dy="38">menu of node groups, each with one shape</tspan>
  </text>

  
  <rect x="80" y="500" width="650" height="520" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(106, 526)">
    
    <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="24" cy="24" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 24 4 L 24 10 M 24 38 L 24 44 M 4 24 L 10 24 M 38 24 L 44 24" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="160" y="562" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#207448">Just-In-Time Provisioning</text>
  <text x="106" y="626" font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="106" dy="0">Karpenter watches Pending pods, batches</tspan>
    <tspan x="106" dy="38">them, computes the best set of instance types</tspan>
    <tspan x="106" dy="38">that satisfy their constraints, and provisions</tspan>
    <tspan x="106" dy="38">just in time; bin-packing, spot handling with</tspan>
    <tspan x="106" dy="38">interruption notices, automatic rotation and</tspan>
    <tspan x="106" dy="38">drift correction</tspan>
  </text>

  
  <rect x="800" y="100" width="750" height="1200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(830, 130)">
    
    <line x1="6" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="14" r="6" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <line x1="6" y1="34" x2="42" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="6" fill="#ffffff" stroke="#207448" stroke-width="4"/>
    <text x="64" y="32" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">NodePool gpu-inference</text>
  </g>

  
  <rect x="830" y="200" width="690" height="740" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(856, 230)">
    
    <text x="0" y="24" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">requirements</text>
    <text x="24" y="62" font-family="monospace" font-size="24px" fill="#303a36">instance-family In g6, g6e, p5</text>
    <text x="24" y="98" font-family="monospace" font-size="24px" fill="#303a36">capacity-type On-demand</text>
    <text x="24" y="134" font-family="monospace" font-size="24px" fill="#303a36">zones us-east-1a and us-east-1b</text>

    
    <text x="0" y="190" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">taints</text>
    <text x="24" y="228" font-family="monospace" font-size="24px" fill="#303a36">nvidia.com/gpu=present NoSchedule</text>
    <text x="24" y="262" font-family="sans-serif" font-size="24px" fill="#303a36">(keeps ordinary pods off)</text>

    
    <text x="0" y="318" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">nodeClassRef</text>
    <text x="210" y="318" font-family="monospace" font-size="24px" fill="#303a36">EC2NodeClass gpu</text>

    <text x="0" y="374" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">expireAfter</text>
    <text x="210" y="374" font-family="monospace" font-size="24px" fill="#303a36">720h</text>

    <text x="0" y="430" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">limits</text>
    <text x="210" y="430" font-family="monospace" font-size="24px" fill="#303a36">nvidia.com/gpu 64</text>
    <text x="210" y="464" font-family="sans-serif" font-size="24px" fill="#303a36">(cap on total GPUs)</text>

    
    <text x="0" y="520" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">disruption</text>
    <text x="24" y="558" font-family="monospace" font-size="24px" fill="#303a36">consolidationPolicy WhenEmptyOrUnderutilized</text>
    <text x="24" y="594" font-family="monospace" font-size="24px" fill="#303a36">consolidateAfter 10m</text>
    <text x="24" y="630" font-family="monospace" font-size="24px" fill="#303a36">budgets nodes 10 percent</text>
  </g>

  
  <rect x="830" y="970" width="690" height="200" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(856, 1000)">
    
    <path d="M 22 2 L 42 38 L 2 38 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="22" y1="16" x2="22" y2="26" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="32" r="2.5" fill="#db8129"/>
    <text x="56" y="30" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129">Warning</text>
    <text x="0" y="80" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="0" dy="0">consolidation can remove a node under a training job:</tspan>
      <tspan x="0" dy="38" font-family="monospace" font-weight="bold">set do-not-disrupt</tspan>
    </text>
  </g>
</svg>