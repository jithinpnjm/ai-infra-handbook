<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Kubelet Observability and Metric Pipeline</title>
  <desc>Architecture diagram illustrating node input subsystems, the core Kubelet daemon, metric endpoints, and critical alert thresholds.</desc>

