<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Replicas as eggs in cartons: spread across failure domains</title>
  <desc>Infographic illustrating Kubernetes failure domains using egg cartons: packing all replicas in one zone versus spreading replicas across zones with pod anti-affinity.</desc>

  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Replicas as eggs in cartons: spread across failure domains</text>

  
  <rect x="60" y="140" width="710" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(90, 168)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="37" x2="56" y2="37" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="9" r="5" fill="#207448"/>
    <circle cx="28" cy="9" r="5" fill="#207448"/>
    <circle cx="42" cy="9" r="5" fill="#207448"/>
  </g>

  
  <text x="165" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="165" dy="0">All three replicas</tspan>
    <tspan x="165" dy="38">in one compartment</tspan>
  </text>

  
  <rect x="180" y="260" width="470" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(205, 270)">
    <rect x="8" y="12" width="36" height="34" rx="4" transform="rotate(-14 26 29)" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <path d="M 6 15 L 2 6 L 16 9" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 38 7 L 48 3 L 42 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 23 20 L 27 28 L 22 35" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="275" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Zone outage</text>

  
  <line x1="415" y1="335" x2="415" y2="367" stroke="#303a36" stroke-width="4"/>
  <polygon points="415,385 406,367 424,367" fill="#303a36"/>

  
  <rect x="90" y="385" width="650" height="140" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

  
  
  <g transform="translate(265, 432)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <g transform="translate(415, 432)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <g transform="translate(565, 432)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>

  
  <text x="415" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">web server replica</text>

  
  <rect x="90" y="540" width="650" height="95" rx="12" fill="#ffffff" stroke="#a0bca8" stroke-width="2" stroke-dasharray="6,6"/>

  
  <rect x="90" y="650" width="650" height="95" rx="12" fill="#ffffff" stroke="#a0bca8" stroke-width="2" stroke-dasharray="6,6"/>


  
  <rect x="830" y="140" width="710" height="640" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(860, 168)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="37" x2="56" y2="37" stroke="#207448" stroke-width="3"/>
    <circle cx="14" cy="9" r="5" fill="#207448"/>
    <circle cx="28" cy="27" r="5" fill="#207448"/>
    <circle cx="42" cy="46" r="5" fill="#207448"/>
  </g>

  
  <text x="935" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="935" dy="0">Spread across zones with</tspan>
    <tspan x="935" dy="38">preferred anti-affinity</tspan>
  </text>

  
  <rect x="955" y="260" width="460" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">zone label on each node</text>

  
  <line x1="1185" y1="310" x2="1185" y2="328" stroke="#207448" stroke-width="2"/>
  <line x1="910" y1="328" x2="1460" y2="328" stroke="#207448" stroke-width="2"/>
  <line x1="910" y1="328" x2="910" y2="350" stroke="#207448" stroke-width="2"/>
  <line x1="1185" y1="328" x2="1185" y2="350" stroke="#207448" stroke-width="2"/>
  <line x1="1460" y1="328" x2="1460" y2="350" stroke="#207448" stroke-width="2"/>

  
  <rect x="860" y="350" width="650" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1185, 407)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="860" y="485" width="650" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1185, 542)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="860" y="620" width="650" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1185, 677)">
    <path d="M 0 -28 C 22 -28, 25 14, 18 27 C 10 34, -10 34, -18 27 C -25 14, -22 -28, 0 -28 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="845" y="820" width="680" height="60" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="857" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">podAntiAffinity, preferredDuringScheduling</text>

  
  <rect x="60" y="920" width="1480" height="70" rx="14" fill="#207448"/>
  <text x="800" y="964" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Running several replicas helps only when they do not share a failure.</text>
</svg>