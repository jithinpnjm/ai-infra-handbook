<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Upgrade planning</title>
  <desc>Kubernetes cluster upgrade planning flowchart from pre-flight backups through control plane, add-ons, canary GPU worker pool, and rolling batch worker upgrades.</desc>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Upgrade planning</text>

  
  <g id="step-0">
    <rect x="120" y="76" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="148" r="24" fill="#207448"/>
    <text x="175" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">0</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 235,132 L 255,124 L 275,132 C 275,152 255,172 255,172 C 255,172 235,152 235,132 Z"/>
      <path d="M 247,148 L 253,154 L 265,142"/>
    </g>
    
    <text x="315" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">0. Pre-Flight &amp; Backups</text>
    <text x="315" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Scan deprecated APIs (<tspan font-family="'SF Mono', Menlo, Consolas, monospace">pluto/kubent</tspan>);</text>
    <text x="315" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">audit PDBs; <tspan font-family="'SF Mono', Menlo, Consolas, monospace">etcdctl snapshot save</tspan> + PKI backup</text>
  </g>

  
  <line x1="800" y1="220" x2="800" y2="246" stroke="#207448" stroke-width="4"/>
  <polygon points="800,264 792,246 808,246" fill="#207448"/>

  
  <g id="step-1">
    <rect x="120" y="264" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="336" r="24" fill="#207448"/>
    <text x="175" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="237" y="318" width="36" height="36" rx="4"/>
      <rect x="247" y="328" width="16" height="16" rx="2"/>
      <line x1="245" y1="310" x2="245" y2="318"/>
      <line x1="255" y1="310" x2="255" y2="318"/>
      <line x1="265" y1="310" x2="265" y2="318"/>
      <line x1="245" y1="354" x2="245" y2="362"/>
      <line x1="255" y1="354" x2="255" y2="362"/>
      <line x1="265" y1="354" x2="265" y2="362"/>
      <line x1="229" y1="326" x2="237" y2="326"/>
      <line x1="229" y1="336" x2="237" y2="336"/>
      <line x1="229" y1="346" x2="237" y2="346"/>
      <line x1="273" y1="326" x2="281" y2="326"/>
      <line x1="273" y1="336" x2="281" y2="336"/>
      <line x1="273" y1="346" x2="281" y2="346"/>
    </g>
    
    <text x="315" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">1. Upgrade First Control Plane (cp1)</text>
    <text x="315" y="342" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">kubeadm upgrade apply v1.31.x;</text>
    <text x="315" y="380" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">drain cp1 -&gt; upgrade kubelet/kubectl -&gt; uncordon</text>
  </g>

  
  <line x1="800" y1="408" x2="800" y2="434" stroke="#207448" stroke-width="4"/>
  <polygon points="800,452 792,434 808,434" fill="#207448"/>

  
  <g id="step-2">
    <rect x="120" y="452" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="524" r="24" fill="#207448"/>
    <text x="175" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="235" y="502" width="40" height="18" rx="3"/>
      <rect x="235" y="528" width="40" height="18" rx="3"/>
      <circle cx="243" cy="511" r="2" fill="#207448"/>
      <line x1="251" y1="511" x2="267" y2="511" stroke-width="3"/>
      <circle cx="243" cy="537" r="2" fill="#207448"/>
      <line x1="251" y1="537" x2="267" y2="537" stroke-width="3"/>
    </g>
    
    <text x="315" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">2. Upgrade Remaining Control Planes (cp2, cp3)</text>
    <text x="315" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">One by one: <tspan font-family="'SF Mono', Menlo, Consolas, monospace">kubeadm upgrade node;</tspan></text>
    <text x="315" y="568" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">verify etcdctl endpoint health --cluster</text>
  </g>

  
  <line x1="800" y1="596" x2="800" y2="622" stroke="#207448" stroke-width="4"/>
  <polygon points="800,640 792,622 808,622" fill="#207448"/>

  
  <g id="step-3">
    <rect x="120" y="640" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="712" r="24" fill="#207448"/>
    <text x="175" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="255" cy="712" r="8"/>
      <path d="M 251,688 L 259,688 L 261,694 L 267,696 L 273,692 L 278,697 L 274,703 L 276,709 L 282,711 L 282,719 L 276,721 L 274,727 L 278,733 L 273,738 L 267,734 L 261,736 L 259,742 L 251,742 L 249,736 L 243,734 L 237,738 L 232,733 L 236,727 L 234,721 L 228,719 L 228,711 L 234,709 L 236,703 L 232,697 L 237,692 L 243,696 L 249,694 Z"/>
    </g>
    
    <text x="315" y="678" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">3. Upgrade CNI / CSI / GPU Operator</text>
    <text x="315" y="718" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Per compatibility matrix;</text>
    <text x="315" y="756" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">ClusterPolicy driver.upgradePolicy</text>
  </g>

  
  <line x1="800" y1="784" x2="800" y2="810" stroke="#207448" stroke-width="4"/>
  <polygon points="800,828 792,810 808,810" fill="#207448"/>

  
  <g id="step-4">
    <rect x="120" y="828" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="175" cy="900" r="24" fill="#db8129"/>
    <text x="175" y="900" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="232" y="882" width="46" height="34" rx="4"/>
      <line x1="232" y1="876" x2="232" y2="922"/>
      <line x1="242" y1="916" x2="266" y2="916"/>
      <circle cx="245" cy="899" r="7" stroke-width="3"/>
      <circle cx="265" cy="899" r="7" stroke-width="3"/>
      <circle cx="245" cy="899" r="2" fill="#db8129"/>
      <circle cx="265" cy="899" r="2" fill="#db8129"/>
      <rect x="264" y="878" width="10" height="4" stroke-width="2"/>
    </g>
    
    <text x="315" y="866" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">4. Canary GPU Worker Pool</text>
    <text x="315" y="906" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">Checkpoint in-flight jobs -&gt; kubectl drain -&gt; </text>
    <text x="315" y="944" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#303a36">kubeadm upgrade node + kubelet -&gt; NCCL smoke test</text>
  </g>

  
  <line x1="800" y1="972" x2="800" y2="998" stroke="#207448" stroke-width="4"/>
  <polygon points="800,1016 792,998 808,998" fill="#207448"/>

  
  <g id="step-5">
    <rect x="120" y="1016" width="1360" height="144" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="175" cy="1088" r="24" fill="#207448"/>
    <text x="175" y="1088" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="235" y="1064" width="40" height="48" rx="4"/>
      <line x1="239" y1="1076" x2="271" y2="1076" stroke-width="3"/>
      <line x1="239" y1="1088" x2="271" y2="1088" stroke-width="3"/>
      <line x1="239" y1="1100" x2="271" y2="1100" stroke-width="3"/>
      <circle cx="243" cy="1070" r="2" fill="#207448"/>
      <circle cx="243" cy="1082" r="2" fill="#207448"/>
      <circle cx="243" cy="1094" r="2" fill="#207448"/>
      <circle cx="243" cy="1106" r="2" fill="#207448"/>
      <line x1="251" y1="1070" x2="267" y2="1070" stroke-width="2"/>
      <line x1="251" y1="1082" x2="267" y2="1082" stroke-width="2"/>
      <line x1="251" y1="1094" x2="267" y2="1094" stroke-width="2"/>
      <line x1="251" y1="1106" x2="267" y2="1106" stroke-width="2"/>
    </g>
    
    <text x="315" y="1064" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">5. Rolling Batch Worker Upgrade</text>
    <text x="315" y="1110" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Rack/pool batches respecting <tspan font-family="'SF Mono', Menlo, Consolas, monospace">maxUnavailable</tspan> &amp; PDBs</text>
  </g>
</svg>