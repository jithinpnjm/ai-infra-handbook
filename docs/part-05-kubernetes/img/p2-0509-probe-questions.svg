<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Three probes ask three different questions</title>
  <desc>Three probes ask three different questions</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three probes ask three different questions</text>

  
  <rect x="70" y="105" width="1460" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <rect x="85" y="115" width="430" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(280, 130)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="20,10 20,20 27,24" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>

  
  <line x1="530" y1="165" x2="855" y2="165" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="692" y="148" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Startup succeeds</text>

  
  <rect x="870" y="115" width="645" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1175, 127)">
    <path d="M 14 18 V 10 A 8 8 0 0 1 30 10" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="8" y="18" width="28" height="20" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="22" cy="28" r="3" fill="#207448"/>
  </g>

  
  <rect x="70" y="220" width="460" height="640" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(272, 245)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="8" r="2.5" fill="#207448"/>
    <circle cx="18" cy="8" r="2.5" fill="#207448"/>
    <polygon points="23,24 37,34 23,44" fill="#207448"/>
  </g>
  <text x="300" y="335" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">startupProbe</text>

  
  <rect x="94" y="365" width="412" height="85" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="300" y="401" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="300" dy="0">Has the app</tspan>
    <tspan x="300" dy="32">finished starting?</tspan>
  </text>

  
  <rect x="94" y="465" width="412" height="70" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="300" dy="0">Disables the other two</tspan>
    <tspan x="300" dy="30">until it succeeds</tspan>
  </text>

  
  <rect x="94" y="550" width="412" height="295" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="300" y="680" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="300" dy="0">Container killed</tspan>
    <tspan x="300" dy="34">and restarted</tspan>
    <tspan x="300" dy="34">after failureThreshold</tspan>
  </text>

  
  <rect x="570" y="220" width="460" height="640" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(772, 245)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="14" cy="26" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="42" cy="15" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="42" cy="37" r="5" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 19 26 L 28 26 L 37 17 M 28 26 L 37 35" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="800" y="335" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">readinessProbe</text>

  
  <rect x="594" y="365" width="412" height="85" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="401" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Can it serve</tspan>
    <tspan x="800" dy="32">traffic now?</tspan>
  </text>

  
  <rect x="594" y="550" width="412" height="295" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="800" y="663" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Pod marked NotReady,</tspan>
    <tspan x="800" dy="34">removed from Service</tspan>
    <tspan x="800" dy="34">endpoints,</tspan>
    <tspan x="800" dy="34">not restarted</tspan>
  </text>

  
  <rect x="1070" y="220" width="460" height="640" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1272, 245)">
    <rect x="0" y="0" width="56" height="52" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 6 26 L 16 26 L 22 13 L 28 39 L 34 20 L 40 26 L 50 26" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1300" y="335" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#207448">livenessProbe</text>

  
  <rect x="1094" y="365" width="412" height="85" rx="24" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1300" y="417" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Is it stuck?</text>

  
  <rect x="1094" y="550" width="412" height="295" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <text x="1300" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1300" dy="0">Container killed</tspan>
    <tspan x="1300" dy="34">and restarted</tspan>
  </text>

  
  <rect x="70" y="885" width="1460" height="75" rx="14" fill="#207448"/>
  <text x="800" y="932" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Picture a container that is up but still loading its model.</text>
</svg>