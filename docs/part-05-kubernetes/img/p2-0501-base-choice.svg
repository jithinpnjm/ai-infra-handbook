<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Choosing a base image: size against debuggability</title>
  <desc>A spectrum comparing container base images from scratch to NVIDIA NGC, balancing image size against debuggability and machine learning compatibility.</desc>

  <defs>
    <marker id="spectrum-arrow" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1,2 L 16,9 L 1,16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Choosing a base image: size against debuggability</text>

  
  <text x="42" y="125" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Smaller, fewer tools, harder to debug</text>
  <text x="1558" y="125" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Larger, more tools, easier to debug</text>

  
  <line x1="42" y1="155" x2="1552" y2="155" stroke="#207448" stroke-width="4" marker-end="url(#spectrum-arrow)" stroke-linecap="round" />

  
  <g id="card-scratch">
    <rect x="42" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="135" y="219" width="50" height="50" rx="8" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="160" cy="244" r="8" fill="none" stroke="#207448" stroke-width="4" />
    
    <text x="160" y="320" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">scratch</text>
    <line x1="62" y1="365" x2="258" y2="365" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="160" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="160" dy="0">Smallest;</tspan>
      <tspan x="160" dy="32">only your</tspan>
      <tspan x="160" dy="32">static binary</tspan>
    </text>
    
    <text x="160" y="600" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#596561">
      <tspan x="160" dy="0">No shell,</tspan>
      <tspan x="160" dy="32">hard to debug</tspan>
    </text>
  </g>

  
  <g id="card-distroless">
    <rect x="298" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <path d="M 416,218 L 439,228 C 439,252 416,268 416,270 C 416,268 393,252 393,228 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    
    <text x="416" y="305" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="416" dy="0">Distroless</tspan>
      <tspan x="416" dy="34" font-size="24" font-weight="normal">(gcr.io/</tspan>
      <tspan x="416" dy="28" font-size="24" font-weight="normal">distroless,</tspan>
      <tspan x="416" dy="28" font-size="24" font-weight="normal">Chainguard</tspan>
      <tspan x="416" dy="28" font-size="24" font-weight="normal">images)</tspan>
    </text>
    <line x1="318" y1="445" x2="514" y2="445" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="416" y="495" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="416" dy="0">No shell or</tspan>
      <tspan x="416" dy="32">package</tspan>
      <tspan x="416" dy="32">manager</tspan>
    </text>
    
    <text x="416" y="650" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#596561">
      <tspan x="416" dy="0">Debug with</tspan>
      <tspan x="416" dy="32">kubectl debug</tspan>
    </text>
  </g>

  
  <g id="card-alpine">
    <rect x="554" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <path d="M 646,270 L 666,224 L 682,252 L 690,238 L 704,270 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    
    <text x="672" y="320" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Alpine</text>
    <line x1="574" y1="365" x2="770" y2="365" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="672" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="672" dy="0">Tiny, fast</tspan>
      <tspan x="672" dy="32">pulls</tspan>
    </text>
    
    <text x="672" y="530" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#596561">
      <tspan x="672" dy="0">musl libc:</tspan>
      <tspan x="672" dy="32">breaks ML</tspan>
      <tspan x="672" dy="32">wheels and</tspan>
      <tspan x="672" dy="32">CUDA</tspan>
      <tspan x="672" dy="32">binaries</tspan>
    </text>
    
    <rect x="568" y="755" width="208" height="150" rx="10" fill="#fdf6ee" stroke="#db8129" stroke-width="2.5" />
    <text x="672" y="805" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
      <tspan x="672" dy="0">Avoid for ML:</tspan>
      <tspan x="672" dy="34">glibc</tspan>
      <tspan x="672" dy="32">mismatch</tspan>
    </text>
  </g>

  
  <g id="card-debian">
    <rect x="810" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="902" y="222" width="52" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="902" y1="236" x2="954" y2="236" stroke="#207448" stroke-width="2.5" />
    <circle cx="912" cy="229" r="2.5" fill="#207448" />
    <circle cx="920" cy="229" r="2.5" fill="#207448" />
    
    <text x="928" y="315" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="928" dy="0">Debian or</tspan>
      <tspan x="928" dy="36">Ubuntu slim</tspan>
    </text>
    <line x1="830" y1="385" x2="1026" y2="385" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="928" y="460" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="928" dy="0">Compatible</tspan>
      <tspan x="928" dy="32">with</tspan>
      <tspan x="928" dy="32">manylinux</tspan>
      <tspan x="928" dy="32">wheels and</tspan>
      <tspan x="928" dy="32">NVIDIA</tspan>
      <tspan x="928" dy="32">binaries</tspan>
    </text>
  </g>

  
  <g id="card-ubi">
    <rect x="1066" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="1160" y="220" width="48" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1160" y1="237" x2="1208" y2="237" stroke="#207448" stroke-width="2.5" />
    <line x1="1160" y1="253" x2="1208" y2="253" stroke="#207448" stroke-width="2.5" />
    <circle cx="1170" cy="229" r="2.5" fill="#207448" />
    <circle cx="1170" cy="245" r="2.5" fill="#207448" />
    <circle cx="1170" cy="261" r="2.5" fill="#207448" />
    
    <text x="1184" y="305" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1184" dy="0">UBI or</tspan>
      <tspan x="1184" dy="36">RHEL-</tspan>
      <tspan x="1184" dy="36">compatible</tspan>
    </text>
    <line x1="1086" y1="410" x2="1282" y2="410" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="1184" y="490" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="1184" dy="0">Enterprise</tspan>
      <tspan x="1184" dy="32">support,</tspan>
      <tspan x="1184" dy="32">FIPS options</tspan>
    </text>
  </g>

  
  <g id="card-ngc">
    <rect x="1322" y="195" width="236" height="735" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="1418" y="223" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="1428" y="233" width="24" height="24" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="1425" y1="217" x2="1425" y2="223" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1440" y1="217" x2="1440" y2="223" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1455" y1="217" x2="1455" y2="223" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1425" y1="267" x2="1425" y2="273" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1440" y1="267" x2="1440" y2="273" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1455" y1="267" x2="1455" y2="273" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1412" y1="233" x2="1418" y2="233" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1412" y1="245" x2="1418" y2="245" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1412" y1="257" x2="1418" y2="257" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1462" y1="233" x2="1468" y2="233" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1462" y1="245" x2="1468" y2="245" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1462" y1="257" x2="1468" y2="257" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="1440" y="305" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1440" dy="0">NVIDIA NGC</tspan>
      <tspan x="1440" dy="36">and CUDA</tspan>
      <tspan x="1440" dy="36">images</tspan>
    </text>
    <line x1="1342" y1="410" x2="1538" y2="410" stroke="#207448" stroke-width="1.5" stroke-opacity="0.3" />
    
    <text x="1440" y="470" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#207448">
      <tspan x="1440" dy="0">CUDA, cuDNN,</tspan>
      <tspan x="1440" dy="32">NCCL,</tspan>
      <tspan x="1440" dy="32">TensorRT,</tspan>
      <tspan x="1440" dy="32">PyTorch</tspan>
      <tspan x="1440" dy="32">pre-</tspan>
      <tspan x="1440" dy="32">integrated</tspan>
    </text>
  </g>

  
  <g id="bracket-group">
    <path d="M 814,948 L 814,968 L 1184,968 L 1184,984 L 1184,968 L 1554,968 L 1554,948" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1184" y="1025" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Choose for GPU and ML work</text>
  </g>
</svg>