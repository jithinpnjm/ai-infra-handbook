<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <title>What a container is</title>
  <desc>What a container is</desc>

  
  <rect width="1600" height="920" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What a container is</text>

  
  <g id="subgraph-host">
    <rect x="60" y="100" width="1480" height="775" rx="20" fill="#ffffff" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(90, 118)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" fill="#e8f1ea" />
      <line x1="6" y1="21" x2="50" y2="21" />
      <line x1="6" y1="34" x2="50" y2="34" />
      <circle cx="14" cy="14" r="2" fill="#207448" />
      <line x1="22" y1="14" x2="42" y2="14" />
      <circle cx="14" cy="27" r="2" fill="#207448" />
      <line x1="22" y1="27" x2="42" y2="27" />
      <circle cx="14" cy="41" r="2" fill="#207448" />
      <line x1="22" y1="41" x2="42" y2="41" />
    </g>

    
    <text x="165" y="157" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Linux host (one kernel)</text>

    
    <g id="node-kernel">
      <rect x="100" y="195" width="1400" height="135" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />

      
      <g transform="translate(130, 234)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="12" width="32" height="32" rx="4" fill="#fffaf5" />
        <rect x="20" y="20" width="16" height="16" stroke="#db8129" stroke-width="2" />
        <line x1="20" y1="4" x2="20" y2="12" />
        <line x1="28" y1="4" x2="28" y2="12" />
        <line x1="36" y1="4" x2="36" y2="12" />
        <line x1="20" y1="44" x2="20" y2="52" />
        <line x1="28" y1="44" x2="28" y2="52" />
        <line x1="36" y1="44" x2="36" y2="52" />
        <line x1="4" y1="20" x2="12" y2="20" />
        <line x1="4" y1="28" x2="12" y2="28" />
        <line x1="4" y1="36" x2="12" y2="36" />
        <line x1="44" y1="20" x2="52" y2="20" />
        <line x1="44" y1="28" x2="52" y2="28" />
        <line x1="44" y1="36" x2="52" y2="36" />
      </g>

      
      <text x="215" y="250" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="215" dy="0">Kernel: namespaces, cgroups, capabilities,</tspan>
        <tspan x="215" dy="40">seccomp, LSM, overlayfs</tspan>
      </text>
    </g>

    
    
    <line x1="435" y1="330" x2="435" y2="405" stroke="#207448" stroke-width="3.5" />

    
    <line x1="1165" y1="330" x2="1165" y2="405" stroke="#207448" stroke-width="3.5" />

    
    <g id="subgraph-c1">
      <rect x="100" y="405" width="670" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

      
      <g transform="translate(130, 424)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="28,6 50,17 50,39 28,50 6,39 6,17" fill="#ffffff" />
        <line x1="28" y1="17" x2="28" y2="50" />
        <line x1="6" y1="17" x2="28" y2="28" />
        <line x1="50" y1="17" x2="28" y2="28" />
      </g>

      
      <text x="205" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Container A (process tree)</text>

      
      <g id="node-p1">
        <rect x="135" y="500" width="600" height="125" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
        
        <g transform="translate(160, 534)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea" />
          <line x1="6" y1="20" x2="50" y2="20" />
          <circle cx="14" cy="14" r="2.5" fill="#207448" />
          <circle cx="22" cy="14" r="2.5" fill="#207448" />
          <polyline points="16,29 22,35 16,41" />
          <line x1="26" y1="41" x2="38" y2="41" />
        </g>
        <text x="240" y="575" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">PID 1 (app)</text>
      </g>

      
      <g id="node-r1">
        <rect x="135" y="650" width="600" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
        
        <g transform="translate(160, 704)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="28" cy="14" rx="20" ry="7" fill="#e8f1ea" />
          <path d="M 8 14 V 28 C 8 32 17 35 28 35 C 39 35 48 32 48 28 V 14" />
          <path d="M 8 28 V 42 C 8 46 17 49 28 49 C 39 49 48 46 48 42 V 28" />
        </g>
        <text x="240" y="695" font-family="sans-serif" fill="#303a36">
          <tspan x="240" dy="0" font-size="28" font-weight="bold">rootfs:</tspan>
          <tspan x="240" dy="36" font-size="25">overlay of image layers +</tspan>
          <tspan x="240" dy="34" font-size="25">writable layer</tspan>
        </text>
      </g>
    </g>

    
    <g id="subgraph-c2">
      <rect x="830" y="405" width="670" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

      
      <g transform="translate(860, 424)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="28,6 50,17 50,39 28,50 6,39 6,17" fill="#ffffff" />
        <line x1="28" y1="17" x2="28" y2="50" />
        <line x1="6" y1="17" x2="28" y2="28" />
        <line x1="50" y1="17" x2="28" y2="28" />
      </g>

      
      <text x="935" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Container B</text>

      
      <g id="node-p2">
        <rect x="865" y="500" width="600" height="125" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
        
        <g transform="translate(890, 534)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="8" width="44" height="40" rx="6" fill="#e8f1ea" />
          <line x1="6" y1="20" x2="50" y2="20" />
          <circle cx="14" cy="14" r="2.5" fill="#207448" />
          <circle cx="22" cy="14" r="2.5" fill="#207448" />
          <polyline points="16,29 22,35 16,41" />
          <line x1="26" y1="41" x2="38" y2="41" />
        </g>
        <text x="970" y="575" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">PID 1 (app)</text>
      </g>

      
      <g id="node-r2">
        <rect x="865" y="650" width="600" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
        
        <g transform="translate(890, 704)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="28" cy="14" rx="20" ry="7" fill="#e8f1ea" />
          <path d="M 8 14 V 28 C 8 32 17 35 28 35 C 39 35 48 32 48 28 V 14" />
          <path d="M 8 28 V 42 C 8 46 17 49 28 49 C 39 49 48 46 48 42 V 28" />
        </g>
        <text x="970" y="745" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">rootfs</text>
      </g>
    </g>
  </g>
</svg>