<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" style="background:#f5f8f5;">
  <title>Who connects to which port</title>
  <desc>Hub-and-spoke diagram showing connections to kube-apiserver on 6443 HTTPS, etcd, kube-scheduler, kube-controller-manager, kubelet, kube-proxy, NodePort, and CoreDNS.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 18 9 L 0 16 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <text x="800" y="65" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Who connects to which port</text>

  
  <g id="node-etcd">
    <rect x="340" y="110" width="920" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(400, 140)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <ellipse cx="28" cy="14" rx="24" ry="10"/>
      <path d="M 4 14 v 36 c 0 5.5 10.7 10 24 10 s 24 -4.5 24 -10 v -36"/>
      <path d="M 4 32 c 0 5.5 10.7 10 24 10 s 24 -4.5 24 -10"/>
    </g>
    <text x="830" y="165" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="830" dy="0">etcd 2379 client, 2380 peer,</tspan>
      <tspan x="830" dy="38">mTLS, only API servers are clients</tspan>
    </text>
  </g>

  
  <line x1="800" y1="250" x2="800" y2="380" stroke="#207448" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

  
  <g id="node-kubectl">
    <rect x="50" y="390" width="370" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(207, 412)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="42" rx="6"/>
      <path d="M 12 14 l 10 7 l -10 7"/>
      <line x1="28" y1="28" x2="42" y2="28"/>
    </g>
    <text x="235" y="495" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">kubectl, CI, operators</text>
  </g>

  
  <line x1="420" y1="465" x2="565" y2="465" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-apiserver">
    <rect x="570" y="390" width="460" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <g transform="translate(772, 410)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="28,4 52,18 52,46 28,60 4,46 4,18"/>
      <circle cx="28" cy="32" r="9"/>
      <line x1="28" y1="4" x2="28" y2="23"/>
      <line x1="28" y1="41" x2="28" y2="60"/>
      <line x1="4" y1="32" x2="19" y2="32"/>
      <line x1="37" y1="32" x2="52" y2="32"/>
    </g>
    <text x="800" y="505" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">kube-apiserver (6443 HTTPS)</text>
  </g>

  
  <g id="node-scheduler">
    <rect x="1170" y="365" width="380" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1200, 385)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="24"/>
      <polyline points="28,14 28,28 38,28"/>
    </g>
    <text x="1380" y="423" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">kube-scheduler 10259</text>
  </g>

  <g id="node-controller-manager">
    <rect x="1170" y="485" width="380" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(1200, 508)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 46 20 A 20 20 0 1 0 48 34"/>
      <polyline points="48,14 48,24 38,24"/>
    </g>
    <text x="1380" y="528" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1380" dy="0">kube-controller-manager</tspan>
      <tspan x="1380" dy="34">10257</tspan>
    </text>
  </g>

  
  <path d="M 1170 412.5 L 1110 412.5 L 1110 465 L 1035 465" stroke="#207448" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 1170 537.5 L 1110 537.5 L 1110 465" stroke="#207448" stroke-width="4" fill="none"/>
  <text x="1070" y="450" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">watch/write</text>

  
  <g id="node-kubelet">
    <rect x="420" y="720" width="760" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <g transform="translate(460, 750)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <rect x="0" y="0" width="56" height="24" rx="4"/>
      <rect x="0" y="32" width="56" height="24" rx="4"/>
      <line x1="12" y1="12" x2="16" y2="12"/>
      <line x1="12" y1="44" x2="16" y2="44"/>
      <circle cx="42" cy="12" r="2" fill="#207448"/>
      <circle cx="42" cy="44" r="2" fill="#207448"/>
    </g>
    <text x="830" y="788" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">kubelet 10250 (healthz 10248 local)</text>
  </g>

  
  
  <line x1="660" y1="715" x2="660" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="640" y="625" font-size="24" font-weight="bold" fill="#303a36" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="640" dy="0">watch pods,</tspan>
    <tspan x="640" dy="32">heartbeat Leases</tspan>
  </text>

  
  <line x1="940" y1="545" x2="940" y2="715" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="960" y="625" font-size="24" font-weight="bold" fill="#db8129" text-anchor="start" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="960" dy="0">logs, exec,</tspan>
    <tspan x="960" dy="32">attach, port-forward</tspan>
  </text>

  
  
  <g id="node-kube-proxy">
    <rect x="50" y="875" width="470" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(80, 902)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 28 h 48"/>
      <path d="M 38 16 l 14 12 l -14 12"/>
      <path d="M 18 16 l -14 12 l 14 12"/>
    </g>
    <text x="295" y="920" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="295" dy="0">kube-proxy</tspan>
      <tspan x="295" dy="34" font-size="24">10256 healthz, 10249 metrics</tspan>
    </text>
  </g>

  
  <g id="node-nodeport">
    <rect x="565" y="875" width="470" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(595, 902)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4"/>
      <line x1="20" y1="20" x2="20" y2="36"/>
      <line x1="28" y1="20" x2="28" y2="36"/>
      <line x1="36" y1="20" x2="36" y2="36"/>
    </g>
    <text x="810" y="920" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="810" dy="0">NodePort</tspan>
      <tspan x="810" dy="34" font-size="24">30000-32767 on all nodes</tspan>
    </text>
  </g>

  
  <g id="node-coredns">
    <rect x="1080" y="875" width="470" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <g transform="translate(1110, 902)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="28" cy="28" r="24"/>
      <ellipse cx="28" cy="28" rx="11" ry="24"/>
      <line x1="4" y1="28" x2="52" y2="28"/>
    </g>
    <text x="1325" y="920" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="1325" dy="0">CoreDNS</tspan>
      <tspan x="1325" dy="34" font-size="24">53 TCP/UDP, 9153 metrics</tspan>
    </text>
  </g>

  
  <g id="callout-security">
    <rect x="50" y="1030" width="1500" height="110" rx="10" fill="#fdf2f2" stroke="#c53030" stroke-width="3"/>
    <g transform="translate(85, 1057)" stroke="#c53030" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 50 14 C 50 36 28 50 28 50 C 28 50 6 36 6 14 Z"/>
      <line x1="28" y1="20" x2="28" y2="32"/>
      <circle cx="28" cy="40" r="2" fill="#c53030"/>
    </g>
    <text x="815" y="1093" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">etcd holds every secret; kubelet can run commands in every container on its node</text>
  </g>
</svg>