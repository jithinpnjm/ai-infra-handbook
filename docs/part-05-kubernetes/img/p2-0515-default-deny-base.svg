<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>Three policies make a namespace baseline</title>
  <desc>Infographic showing the three baseline network policies applied to a namespace: default deny, restore DNS, and allow intra-namespace traffic.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three policies make a namespace baseline</text>

  
  <rect x="60" y="120" width="280" height="730" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
  
  
  <g transform="translate(200, 220)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  </g>

  
  <rect x="75" y="450" width="250" height="64" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="200" y="491" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Namespace: team-a</text>

  
  <rect x="380" y="120" width="860" height="220" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  
  
  <circle cx="435" cy="175" r="24" fill="#207448" />
  <text x="435" y="184" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

  
  <g transform="translate(485, 142)">
    
    <rect x="0" y="0" width="50" height="66" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="4" />
    
    <rect x="7" y="6" width="36" height="54" rx="2" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="36" cy="36" r="4" fill="#db8129" />
  </g>

  
  <text x="560" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Default deny all ingress and egress</text>
  <text x="560" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">in a namespace</text>

  
  <rect x="560" y="226" width="220" height="42" rx="8" fill="#e8f1ea" />
  <text x="575" y="255" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">default-deny-all</text>

  
  <text x="560" y="306" font-family="sans-serif" font-size="24" fill="#303a36">Denies everything</text>

  
  <rect x="380" y="375" width="860" height="210" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="435" cy="430" r="24" fill="#207448" />
  <text x="435" y="439" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

  
  <g transform="translate(485, 397)">
    
    <rect x="5" y="0" width="40" height="20" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="13" cy="10" r="2.5" fill="#207448" />
    <circle cx="21" cy="10" r="2.5" fill="#207448" />
    
    <line x1="25" y1="20" x2="25" y2="34" stroke="#207448" stroke-width="3" />
    <line x1="10" y1="34" x2="40" y2="34" stroke="#207448" stroke-width="3" />
    <line x1="10" y1="34" x2="10" y2="44" stroke="#207448" stroke-width="3" />
    <line x1="40" y1="34" x2="40" y2="44" stroke="#207448" stroke-width="3" />
    
    <circle cx="10" cy="52" r="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="40" cy="52" r="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="560" y="440" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Restore DNS</text>
  <text x="560" y="510" font-family="sans-serif" font-size="24" fill="#303a36">Lets pods resolve names again</text>

  
  <rect x="380" y="620" width="860" height="230" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="435" cy="675" r="24" fill="#207448" />
  <text x="435" y="684" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  
  <g transform="translate(485, 642)">
    
    <rect x="0" y="0" width="50" height="66" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="4" />
    
    <polygon points="6,6 30,12 30,62 6,58" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <circle cx="24" cy="37" r="3" fill="#207448" />
  </g>

  
  <text x="560" y="675" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Allow traffic inside the namespace</text>
  <text x="560" y="745" font-family="sans-serif" font-size="24" fill="#303a36">Pods in the same namespace can talk</text>

  
  
  <circle cx="1240" cy="230" r="6" fill="#207448" />
  
  
  <path d="M 1240 230 L 1380 230 L 1380 735 L 1252 735" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  
  
  <path d="M 1380 480 L 1252 480" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(1380, 345)">
    <rect x="-120" y="-24" width="240" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Applied to team-a</text>
  </g>

  
  <rect x="60" y="890" width="1480" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="936" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Each policy is a baseline you can apply to a namespace.</text>
</svg>