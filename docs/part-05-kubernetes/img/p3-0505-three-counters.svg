<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>resourceVersion versus generation versus observedGeneration</title>
  <desc>Visual comparison of Kubernetes resourceVersion, generation, and observedGeneration lifecycle across object edits and controller reconciliation.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">resourceVersion versus generation versus observedGeneration</text>

  
  <rect x="40" y="110" width="360" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(192, 190)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="8"/>
    <line x1="14" y1="18" x2="42" y2="18"/>
    <line x1="14" y1="28" x2="42" y2="28"/>
    <line x1="14" y1="38" x2="30" y2="38"/>
  </g>

  
  <rect x="420" y="110" width="360" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(572, 130)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="24" ry="10"/>
    <path d="M4,14 v28 c0,5.5 10.7,10 24,10 s24,-4.5 24,-10 v-28"/>
    <path d="M4,28 c0,5.5 10.7,10 24,10 s24,-4.5 24,-10"/>
  </g>
  <text x="600" y="215" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="600" dy="0">metadata.</tspan>
    <tspan x="600" dy="32">resourceVersion</tspan>
  </text>
  <text x="600" y="295" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="600" dy="0">resourceVersion changes on</tspan>
    <tspan x="600" dy="28">every write (metadata,</tspan>
    <tspan x="600" dy="28">spec or status)</tspan>
  </text>

  
  <rect x="800" y="110" width="360" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(952, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10,4 h24 l12,12 v36 h-36 z"/>
    <path d="M34,4 v12 h12"/>
    <line x1="18" y1="26" x2="38" y2="26"/>
    <line x1="18" y1="36" x2="38" y2="36"/>
  </g>
  <text x="980" y="215" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="980" dy="0">metadata.</tspan>
    <tspan x="980" dy="32">generation</tspan>
  </text>
  <text x="980" y="310" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="980" dy="0">generation increments only</tspan>
    <tspan x="980" dy="30">when spec changes</tspan>
  </text>

  
  <rect x="1180" y="110" width="380" height="270" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1342, 130)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="28" cy="28" r="14"/>
    <path d="M28,4 v6 M28,46 v6 M4,28 h6 M46,28 h6 M11,11 l4.5,4.5 M40.5,40.5 l4.5,4.5 M11,45 l4.5,-4.5 M40.5,15.5 l4.5,-4.5"/>
  </g>
  <text x="1370" y="215" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="1370" dy="0">status.</tspan>
    <tspan x="1370" dy="32">observedGeneration</tspan>
  </text>
  <text x="1370" y="285" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1370" dy="0">observedGeneration is written by</tspan>
    <tspan x="1370" dy="28">the controller to record the</tspan>
    <tspan x="1370" dy="28">generation it last reconciled</tspan>
  </text>

  
  <g>
    <rect x="40" y="400" width="360" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="80" cy="452" r="24" fill="#207448"/>
    <text x="80" y="460" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="125" y="462" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">spec edit</text>

    
    <rect x="420" y="400" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(575, 427)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="25" cy="12" rx="20" ry="8"/>
      <path d="M5,12 v24 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-24"/>
      <path d="M15,30 l7,7 l15,-15" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="800" y="400" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="850" y="425" width="260" height="55" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="980" y="462" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">generation 7</text>

    
    <rect x="1180" y="400" width="380" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1370" y="433" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">observedGeneration 6</text>
    <rect x="1205" y="450" width="330" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1370" y="479" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b91c1c">controller has not caught up</text>
  </g>

  
  <g>
    <rect x="40" y="517" width="360" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="80" cy="569" r="24" fill="#207448"/>
    <text x="80" y="577" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="125" y="579" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">label edit</text>

    
    <rect x="420" y="517" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(575, 544)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="25" cy="12" rx="20" ry="8"/>
      <path d="M5,12 v24 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-24"/>
      <path d="M15,30 l7,7 l15,-15" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="800" y="517" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(960, 564)" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="40" y2="0"/>
    </g>

    
    <rect x="1180" y="517" width="380" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(1350, 564)" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="40" y2="0"/>
    </g>
  </g>

  
  <g>
    <rect x="40" y="634" width="360" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="80" cy="686" r="24" fill="#207448"/>
    <text x="80" y="694" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="125" y="672" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">status write</tspan>
      <tspan x="125" dy="34">by controller</tspan>
    </text>

    
    <rect x="420" y="634" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(575, 661)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="25" cy="12" rx="20" ry="8"/>
      <path d="M5,12 v24 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-24"/>
      <path d="M15,30 l7,7 l15,-15" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="800" y="634" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(960, 681)" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="40" y2="0"/>
    </g>

    
    <rect x="1180" y="634" width="380" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(1350, 681)" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="40" y2="0"/>
    </g>
  </g>

  
  <g>
    <rect x="40" y="751" width="360" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <circle cx="80" cy="803" r="24" fill="#207448"/>
    <text x="80" y="811" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <text x="125" y="789" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="125" dy="0">controller finishes</tspan>
      <tspan x="125" dy="34">reconcile</tspan>
    </text>

    
    <rect x="420" y="751" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(575, 778)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="25" cy="12" rx="20" ry="8"/>
      <path d="M5,12 v24 c0,4.4 9,8 20,8 s20,-3.6 20,-8 v-24"/>
      <path d="M15,30 l7,7 l15,-15" stroke="#207448" stroke-width="3"/>
    </g>

    
    <rect x="800" y="751" width="360" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(960, 798)" stroke="#207448" stroke-width="4" stroke-linecap="round">
      <path d="M5,15 l10,10 l25,-25" fill="none"/>
    </g>

    
    <rect x="1180" y="751" width="380" height="105" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="1370" y="812" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#15803d">status reflects the latest spec</text>
  </g>

  
  
  <rect x="40" y="895" width="486" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(70, 940)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="22" width="44" height="30" rx="6"/>
    <path d="M16,22 v-10 a12,12 0 0,1 24,0 v10"/>
    <circle cx="28" cy="36" r="3" fill="#207448"/>
  </g>
  <text x="150" y="965" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0">resourceVersion is opaque,</tspan>
    <tspan x="150" dy="36">compare only for equality,</tspan>
    <tspan x="150" dy="36">derived from the etcd</tspan>
    <tspan x="150" dy="36">mod_revision</tspan>
  </text>

  
  <rect x="556" y="895" width="486" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(586, 940)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="44" rx="6"/>
    <circle cx="28" cy="24" r="8"/>
    <path d="M14,44 c0,-7.7 6.3,-14 14,-14 s14,6.3 14,14"/>
  </g>
  <text x="666" y="980" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="666" dy="0">uid identifies one instance;</tspan>
    <tspan x="666" dy="36">a recreated object gets</tspan>
    <tspan x="666" dy="36">a new uid</tspan>
  </text>

  
  <rect x="1074" y="895" width="486" height="260" rx="12" fill="#fffaf0" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(1104, 940)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="6"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <path d="M12,28 l8,6 l-8,6"/>
    <line x1="26" y1="40" x2="38" y2="40"/>
  </g>
  <text x="1184" y="1015" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">
    <tspan x="1184" dy="0">kubectl rollout</tspan>
    <tspan x="1184" dy="38">status uses this</tspan>
  </text>
</svg>