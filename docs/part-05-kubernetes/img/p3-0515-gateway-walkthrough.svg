<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Walking requests through the allow-gateway-to-model policy</title>
  <desc>Visual walkthrough of Kubernetes network policy allow-gateway-to-model showing ingress elements, egress rules, and request evaluations.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Walking requests through the allow-gateway-to-model policy</text>

  
  <g transform="translate(40, 130)">
    <rect width="1520" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(20, 7)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="40" rx="6"/>
      <line x1="4" y1="20" x2="52" y2="20"/>
      <circle cx="12" cy="14" r="2" fill="#207448"/>
      <circle cx="20" cy="14" r="2" fill="#207448"/>
    </g>
    <text x="96" y="45" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Worked example on the policy for pods app vllm in namespace serving</text>
  </g>

  
  
  <g transform="translate(40, 235)">
    <rect width="930" height="200" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 20)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 6 L48 14 V28 C48 40 28 50 28 50 C28 50 8 40 8 28 V14 Z"/>
      <line x1="28" y1="18" x2="28" y2="38"/>
      <line x1="18" y1="28" x2="38" y2="28"/>
    </g>
    <text x="100" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ingress element 1</text>
    <text x="30" y="112" font-family="sans-serif" font-size="24" fill="#303a36">namespace kubernetes.io/metadata.name edge AND pod app gateway</text>
    <text x="30" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="30" dy="0">with ports TCP 8000 and TCP 9000 to 9010</tspan>
      <tspan x="30" dy="32">(endPort, eleven ports in the range)</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 475)">
    <rect width="930" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 27)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="18" height="16" rx="3"/>
      <rect x="32" y="8" width="18" height="16" rx="3"/>
      <rect x="19" y="32" width="18" height="16" rx="3"/>
      <line x1="15" y1="24" x2="15" y2="28"/>
      <line x1="41" y1="24" x2="41" y2="28"/>
      <line x1="15" y1="28" x2="41" y2="28"/>
      <line x1="28" y1="28" x2="28" y2="32"/>
    </g>
    <text x="100" y="50" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ingress element 2 (separate element, OR)</text>
    <text x="100" y="88" font-family="sans-serif" font-size="24" fill="#303a36">ipBlock 10.20.0.0/16 except 10.20.5.0/24</text>
  </g>

  
  <g transform="translate(1010, 235)">
    <rect width="550" height="350" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 18)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <path d="M6 28 H50"/>
      <path d="M28 6 C36 14 36 42 28 50 C20 42 20 14 28 6 Z"/>
    </g>
    <text x="100" y="56" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Egress half</text>

    
    <g transform="translate(20, 85)">
      <rect width="510" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(12, 10)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="27" cy="27" r="10"/>
        <path d="M27 7 V13 M27 41 V47 M7 27 H13 M41 27 H47 M13 13 L17 17 M37 37 L41 41 M13 41 L17 37 M37 17 L41 13"/>
      </g>
      <text x="80" y="34" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="80" dy="0">DNS to kube-dns in kube-system</tspan>
        <tspan x="80" dy="28">on UDP and TCP 53</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 175)">
      <rect width="510" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(12, 10)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="27" cy="15" rx="16" ry="6"/>
        <path d="M11 15 V37 C11 41 18 44 27 44 C36 44 43 41 43 37 V15"/>
        <path d="M11 26 C11 30 18 33 27 33 C36 33 43 30 43 26"/>
      </g>
      <text x="80" y="34" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="80" dy="0">object storage VIPs 10.30.0.0/16</tspan>
        <tspan x="80" dy="28">on TCP 443</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 265)">
      <rect width="510" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(12, 6)" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="13" y="22" width="28" height="22" rx="4"/>
        <path d="M19 22 V14 C19 10 23 7 27 7 C31 7 35 10 35 14 V22"/>
      </g>
      <text x="80" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">anything else denied</text>
    </g>
  </g>

  
  <text x="40" y="628" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Four request rows with results</text>

  
  <g transform="translate(40, 650)">
    <rect width="1520" height="105" rx="12" fill="#fff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(24, 25)" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 6 L48 14 V28 C48 40 28 50 28 50 C28 50 8 40 8 28 V14 Z"/>
      <path d="M18 28 L25 35 L38 20"/>
    </g>
    <text x="100" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">gateway pod in edge calls port 8000: matches both selectors, ALLOWED</text>
  </g>

  
  <g transform="translate(40, 775)">
    <rect width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 25)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 6 L48 14 V28 C48 40 28 50 28 50 C28 50 8 40 8 28 V14 Z"/>
      <line x1="18" y1="20" x2="38" y2="36"/>
      <line x1="38" y1="20" x2="18" y2="36"/>
    </g>
    <text x="100" y="62" font-family="sans-serif" font-size="26" fill="#303a36">pod app debug in edge: fails app gateway, not in the ipBlock, DENIED</text>
  </g>

  
  <g transform="translate(40, 900)">
    <rect width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 25)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6"/>
      <line x1="18" y1="18" x2="38" y2="38"/>
      <line x1="38" y1="18" x2="18" y2="38"/>
    </g>
    <text x="100" y="62" font-family="sans-serif" font-size="26" fill="#303a36">gateway-labelled pod in another namespace: namespace selector fails, DENIED</text>
  </g>

  
  <g transform="translate(40, 1025)">
    <rect width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(24, 25)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12 H48 L34 30 V46 L22 40 V30 Z"/>
    </g>
    <text x="100" y="62" font-family="sans-serif" font-size="26" fill="#303a36">source 10.20.5.7: inside the except range, DENIED; source 10.20.9.1: ALLOWED</text>
  </g>
</svg>