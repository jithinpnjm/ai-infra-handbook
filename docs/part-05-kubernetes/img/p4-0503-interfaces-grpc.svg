<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>Decoupling Through Interfaces: Kubelet and Pluggable Runtimes</title>
  <desc>Architecture infographic illustrating interface decoupling between Kubelet and pluggable runtimes via CRI, CNI, and CSI interfaces.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2 2 L 11 7 L 2 12 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1280" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">
    Decoupling Through Interfaces: Kubelet and Pluggable Runtimes
  </text>

  
  <g id="kubelet-node">
    <rect x="180" y="95" width="1240" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <rect x="220" y="125" width="60" height="60" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="235" y="140" width="30" height="30" rx="4" fill="#207448" />
    <line x1="250" y1="115" x2="250" y2="125" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="115" x2="230" y2="125" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="270" y1="115" x2="270" y2="125" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="250" y1="185" x2="250" y2="195" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="185" x2="230" y2="195" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="270" y1="185" x2="270" y2="195" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    
    
    <text x="320" y="167" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#303a36">
      Kubelet (Core Kubernetes)
    </text>
  </g>

  
  
  <path d="M 300 215 L 300 365" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <path d="M 800 215 L 800 365" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1300 215 L 1300 365" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="cri-column">
    
    <rect x="50" y="370" width="490" height="280" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" />

    
    <circle cx="105" cy="425" r="26" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="105" cy="425" r="10" fill="#db8129" />

    
    <text x="145" y="420" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      CRI (Container Runtime Interface)
    </text>
    <text x="145" y="450" font-family="sans-serif" font-size="24px" fill="#303a36">
      over gRPC UNIX socket
    </text>

    
    <rect x="75" y="480" width="440" height="150" rx="8" fill="#e8f1ea" />
    <text x="95" y="520" font-family="monospace" font-size="24px" fill="#303a36">CreateContainerRequest</text>
    <text x="95" y="565" font-family="monospace" font-size="24px" fill="#303a36">StartContainerRequest</text>
    <text x="95" y="610" font-family="monospace" font-size="24px" fill="#303a36">RunPodSandbox</text>

    
    <path d="M 295 650 L 295 725" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="50" y="730" width="490" height="500" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="75" y="755" width="440" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="95" y="800" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">containerd</text>
    <text x="95" y="840" font-family="sans-serif" font-size="24px" fill="#303a36">via containerd-cri plugin</text>

    
    <rect x="75" y="885" width="440" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="95" y="930" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">CRI-O</text>

    
    <rect x="75" y="975" width="440" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="95" y="1020" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Firecracker</text>

    
    <path d="M 295 1045 L 295 1090" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <rect x="75" y="1100" width="440" height="100" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="95" y="1140" font-family="sans-serif" font-size="24px" fill="#303a36">which in turn execute</text>
    <text x="95" y="1178" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">OCI runc/runw</text>
  </g>

  
  <g id="cni-column">
    
    <rect x="555" y="370" width="490" height="280" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

    
    <circle cx="610" cy="425" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 596 425 L 624 425 M 610 411 L 610 439" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="650" y="420" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      CNI (Container Network Interface)
    </text>
    <text x="650" y="450" font-family="sans-serif" font-size="24px" fill="#303a36">
      invoked as binary plugin or daemon
    </text>

    
    <rect x="580" y="480" width="440" height="150" rx="8" fill="#e8f1ea" />
    <text x="600" y="535" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">ADD/DEL commands</text>
    <text x="600" y="585" font-family="sans-serif" font-size="24px" fill="#303a36">with JSON payload</text>

    
    <path d="M 800 650 L 800 725" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="555" y="730" width="490" height="500" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="580" y="770" width="440" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="600" y="840" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      Calico / Cilium / Flannel
    </text>

    
    <path d="M 800 890 L 800 955" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="580" y="965" width="440" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="605" y="1025" font-family="sans-serif" font-size="24px" fill="#303a36">to attach veth pairs</text>
    <text x="605" y="1080" font-family="sans-serif" font-size="24px" fill="#303a36">to host and pod</text>
    <text x="605" y="1135" font-family="sans-serif" font-size="24px" fill="#303a36">network namespaces</text>
  </g>

  
  <g id="csi-column">
    
    <rect x="1060" y="370" width="490" height="280" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" />

    
    <ellipse cx="1115" cy="415" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1093 415 v 20 c 0 5 10 9 22 9 s 22 -4 22 -9 v -20" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1093 430 v 15 c 0 5 10 9 22 9 s 22 -4 22 -9 v -15" fill="none" stroke="#207448" stroke-width="4" />

    
    <text x="1155" y="420" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      CSI (Container Storage Interface)
    </text>
    <text x="1155" y="450" font-family="sans-serif" font-size="24px" fill="#303a36">
      over gRPC UNIX socket
    </text>

    
    <rect x="1085" y="480" width="440" height="150" rx="8" fill="#e8f1ea" />
    <text x="1110" y="540" font-family="monospace" font-size="25px" fill="#303a36">NodeStageVolume</text>
    <text x="1110" y="595" font-family="monospace" font-size="25px" fill="#303a36">NodePublishVolume</text>

    
    <path d="M 1305 650 L 1305 725" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="1060" y="730" width="490" height="500" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="1085" y="770" width="440" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1105" y="820" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      Ceph / Cloud EBS /
    </text>
    <text x="1105" y="860" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      Lustre / local-path
    </text>

    
    <path d="M 1305 890 L 1305 955" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    <rect x="1085" y="965" width="440" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1110" y="1045" font-family="sans-serif" font-size="24px" fill="#303a36">to mount block devices</text>
    <text x="1110" y="1115" font-family="sans-serif" font-size="24px" fill="#303a36">into pod directories</text>
  </g>

</svg>