<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Compaction frees space inside the file, defrag shrinks the file</title>
  <desc>Visual comparison showing that etcdctl compact creates free holes inside the bbolt database file without changing file size, while etcdctl defrag rewrites the file shorter to shrink disk usage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="80" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="80" dy="0">Compaction frees space inside the file,</tspan>
    <tspan x="80" dy="58">defrag shrinks the file</tspan>
  </text>

  
  <g id="panel-1">
    
    <rect x="80" y="150" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(110, 166)">
      <ellipse cx="28" cy="10" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 24 C 4 32 52 32 52 24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 38 C 4 46 52 46 52 38" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="10" x2="4" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="52" y1="10" x2="52" y2="38" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="180" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">before</text>

    
    <g transform="translate(110, 235)">
      
      <rect x="0" y="0" width="690" height="70" rx="8" fill="#84928b" />
      <text x="345" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">old revisions</text>

      
      <rect x="690" y="0" width="690" height="70" rx="8" fill="#207448" />
      <text x="1035" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">current data</text>
    </g>
  </g>

  
  <g id="step-1">
    
    <circle cx="390" cy="377" r="24" fill="#207448" />
    <text x="390" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    
    <line x1="450" y1="330" x2="450" y2="423" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <text x="480" y="386" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas" font-size="26" font-weight="bold" fill="#207448">etcdctl compact</text>
  </g>

  
  <g id="panel-2">
    
    <rect x="80" y="425" width="1440" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(110, 441)">
      <ellipse cx="28" cy="10" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 24 C 4 32 52 32 52 24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 38 C 4 46 52 46 52 38" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="10" x2="4" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="52" y1="10" x2="52" y2="38" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="180" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">the bar stays the same size</text>

    
    <g transform="translate(110, 510)">
      
      <rect x="0" y="0" width="690" height="70" rx="8" fill="#f0f4f1" stroke="#84928b" stroke-width="2" stroke-dasharray="8,6" />
      <text x="345" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">free holes</text>

      
      <rect x="690" y="0" width="690" height="70" rx="8" fill="#207448" />
    </g>

    
    <rect x="110" y="605" width="1380" height="60" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="3" />
    <text x="800" y="643" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">compaction alone does not shrink the file on disk</text>
  </g>

  
  <g id="step-2">
    
    <circle cx="390" cy="742" r="24" fill="#207448" />
    <text x="390" y="751" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <line x1="450" y1="695" x2="450" y2="788" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <text x="480" y="751" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Consolas" font-size="24" font-weight="bold" fill="#207448">etcdctl defrag, one member at a time</text>
  </g>

  
  <g id="panel-3">
    
    <rect x="80" y="790" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(110, 806)">
      <ellipse cx="28" cy="10" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 24 C 4 32 52 32 52 24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 4 38 C 4 46 52 46 52 38" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="4" y1="10" x2="4" y2="38" stroke="#207448" stroke-width="4" />
      <line x1="52" y1="10" x2="52" y2="38" stroke="#207448" stroke-width="4" />
    </g>

    
    <text x="180" y="844" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">file on disk shrinks</text>

    
    <g transform="translate(110, 875)">
      
      <rect x="0" y="0" width="690" height="70" rx="8" fill="#207448" />

      
      <rect x="690" y="0" width="690" height="70" rx="8" fill="none" stroke="#b0c4b5" stroke-width="2" stroke-dasharray="8,6" />
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="80" y="1000" width="1440" height="65" rx="12" fill="#207448" />
    <text x="800" y="1040" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">compact, then defrag each member one at a time, then disarm the alarm if the quota was hit</text>
  </g>
</svg>