  </g>
  <text x="987.5" y="396" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">external-resizer</text>

  
  <rect x="1185" y="290" width="335" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1325, 302)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 8 16 h 10 l 4 -6 h 12 l 4 6 h 10 a 4 4 0 0 1 4 4 v 24 a 4 4 0 0 1 -4 4 h -40 a 4 4 0 0 1 -4 -4 v -24 a 4 4 0 0 1 4 -4 z" />
    <circle cx="28" cy="30" r="8" />
  </g>
  <text x="1352.5" y="396" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">external-snapshotter</text>

  
  <rect x="90" y="460" width="1430" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(120, 492)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="6" width="48" height="44" rx="6" />
    <line x1="4" y1="28" x2="52" y2="28" />
    <circle cx="14" cy="17" r="3" fill="#207448" />
    <circle cx="24" cy="17" r="3" fill="#207448" />
    <circle cx="14" cy="39" r="3" fill="#207448" />
    <circle cx="24" cy="39" r="3" fill="#207448" />
    <line x1="36" y1="17" x2="44" y2="17" stroke-linecap="round" />
    <line x1="36" y1="39" x2="44" y2="39" stroke-linecap="round" />
  </g>
  <text x="200" y="495" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">CSI driver (Controller RPCs):</text>
  <text x="200" y="528" font-size="24" font-family="monospace" fill="#303a36">CreateVolume / DeleteVolume</text>
  <text x="200" y="559" font-size="24" font-family="monospace" fill="#303a36">ControllerPublish / Expand / Snapshot</text>

  
  <rect x="60" y="635" width="1480" height="495" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="90" y="673" font-size="30" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">CSI Node Service (DaemonSet on every node)</text>

  
  <rect x="90" y="698" width="350" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(237, 708)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="10" y="6" width="36" height="46" rx="4" />
    <line x1="18" y1="16" x2="38" y2="16" stroke-linecap="round" />
    <line x1="18" y1="24" x2="38" y2="24" stroke-linecap="round" />
    <polyline points="16,36 22,41 34,31" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="265" y="792" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">node-driver-registrar</text>

  
  <rect x="510" y="698" width="600" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(535, 727)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" />
    <circle cx="28" cy="28" r="9" />
    <line x1="28" y1="6" x2="28" y2="19" stroke-linecap="round" />
    <line x1="28" y1="37" x2="28" y2="50" stroke-linecap="round" />
    <line x1="6" y1="28" x2="19" y2="28" stroke-linecap="round" />
    <line x1="37" y1="28" x2="50" y2="28" stroke-linecap="round" />
    <line x1="12" y1="12" x2="22" y2="22" stroke-linecap="round" />
    <line x1="34" y1="34" x2="44" y2="44" stroke-linecap="round" />
    <line x1="12" y1="44" x2="22" y2="34" stroke-linecap="round" />
    <line x1="34" y1="22" x2="44" y2="12" stroke-linecap="round" />
  </g>
  <text x="615" y="742" font-size="28" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">kubelet</text>
  <text x="615" y="782" font-size="24" font-family="monospace" fill="#207448">(plugin registration socket)</text>

  
  <rect x="1175" y="698" width="345" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1320, 708)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="28" cy="28" r="22" />
    <path d="M 12 28 h 8 l 4 -9 l 7 19 l 5 -10 h 8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1347.5" y="792" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">livenessprobe</text>

  
  <rect x="90" y="960" width="1430" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(120, 1007)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 6 12 l 6 -6 h 16 l 6 6 h 16 v 34 h -44 z" />
    <ellipse cx="28" cy="30" rx="12" ry="4" />
    <path d="M 16 30 v 8 c 0 2.2 5.4 4 12 4 s 12 -1.8 12 -4 v -8" />
  </g>
  <text x="200" y="1005" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">CSI driver (Node RPCs):</text>
  <text x="200" y="1045" font-size="24" font-family="monospace" fill="#303a36">NodeStageVolume / NodeUnstageVolume</text>
  <text x="200" y="1082" font-size="24" font-family="monospace" fill="#303a36">NodePublish / Unpublish / GetVolumeStats</text>

  

   EXT1 -->
  <line x1="257.5" y1="187" x2="257.5" y2="290" stroke="#207448" stroke-width="3" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)" />

   EXT2 -->
  <line x1="622.5" y1="187" x2="622.5" y2="290" stroke="#207448" stroke-width="3" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)" />

   CTRL -->
  <line x1="257.5" y1="415" x2="257.5" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   CTRL -->
  <line x1="622.5" y1="415" x2="622.5" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   CTRL -->
  <line x1="987.5" y1="415" x2="987.5" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

   CTRL -->
  <line x1="1352.5" y1="415" x2="1352.5" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

