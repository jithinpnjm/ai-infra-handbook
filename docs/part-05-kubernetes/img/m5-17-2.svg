<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The CSI architecture</title>
  <desc>Visual diagram of the Kubernetes Container Storage Interface architecture showing API server objects, Controller Service deployment, and Node Service DaemonSet.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-start" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 11 2 L 1 6 L 11 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">The CSI architecture</text>

  
  <rect x="60" y="95" width="1480" height="92" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(85, 113)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="4" width="48" height="48" rx="8" stroke="#207448" />
    <path d="M 4 20 L 52 20 M 4 36 L 52 36" />
    <circle cx="12" cy="12" r="2.5" fill="#207448" />
    <circle cx="12" cy="28" r="2.5" fill="#207448" />
    <circle cx="12" cy="44" r="2.5" fill="#207448" />
    <line x1="20" y1="12" x2="44" y2="12" stroke-linecap="round" />
    <line x1="20" y1="28" x2="40" y2="28" stroke-linecap="round" />
    <line x1="20" y1="44" x2="36" y2="44" stroke-linecap="round" />
  </g>
  <text x="160" y="134" font-size="28" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">API server objects:</text>
  <text x="160" y="167" font-size="24" font-family="monospace" fill="#207448">PVC, PV, VolumeAttachment, CSINode, VolumeSnapshot</text>

  
  <rect x="60" y="230" width="1480" height="365" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <text x="90" y="268" font-size="30" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">CSI Controller Service (Deployment, any node)</text>

  
  <rect x="90" y="290" width="335" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(230, 302)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="27" cy="12" rx="20" ry="7" />
    <path d="M 7 12 v 16 c 0 3.8 9 7 20 7 s 20 -3.2 20 -7 v -16" />
    <path d="M 7 20 c 0 3.8 9 7 20 7 s 20 -3.2 20 -7" />
    <line x1="27" y1="40" x2="27" y2="50" stroke-linecap="round" />
    <line x1="22" y1="45" x2="32" y2="45" stroke-linecap="round" />
  </g>
  <text x="257.5" y="396" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">external-provisioner</text>

  
  <rect x="455" y="290" width="335" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(595, 302)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="8" y="10" width="16" height="32" rx="4" />
    <rect x="30" y="10" width="16" height="32" rx="4" />
    <line x1="24" y1="26" x2="30" y2="26" stroke-linecap="round" />
    <line x1="2" y1="26" x2="8" y2="26" stroke-linecap="round" />
    <line x1="46" y1="26" x2="52" y2="26" stroke-linecap="round" />
  </g>
  <text x="622.5" y="396" text-anchor="middle" font-size="24" font-family="monospace" fill="#303a36">external-attacher</text>

  
  <rect x="820" y="290" width="335" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(960, 302)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="27" cy="14" rx="18" ry="6" />
    <path d="M 9 14 v 18 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -18" />
