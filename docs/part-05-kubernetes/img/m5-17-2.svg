   NODE with gRPC socket label -->
  <line x1="550" y1="813" x2="550" y2="960" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

   NODE gRPC Call -->
  <rect x="580" y="845" width="800" height="78" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <line x1="550" y1="884" x2="580" y2="884" stroke="#db8129" stroke-width="2.5" stroke-dasharray="4 4" />
  <text x="980" y="876" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">gRPC on unix socket</text>
  <text x="980" y="908" text-anchor="middle" font-size="24" font-family="monospace" fill="#db8129">/var/lib/kubelet/plugins/&lt;driver&gt;/csi.sock</text>
</svg>