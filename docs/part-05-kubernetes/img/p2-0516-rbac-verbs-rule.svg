<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990" width="1600" height="990">
  <title>A Role grants verbs on a resource, default deny</title>
  <desc>Visual explanation of Kubernetes Role permissions and default deny behavior.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#303a36"/>
    </marker>
  </defs>

  
  <rect width="1600" height="990" fill="#f5f8f5"/>

  
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A Role grants verbs on a resource, default deny</text>

  
  <rect x="240" y="120" width="1120" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <path d="M 300 148 L 328 136 L 356 148 C 356 178 328 198 328 198 C 328 198 300 178 300 148 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="328" cy="162" r="5" fill="#207448"/>
  <path d="M 326 165 L 330 165 L 332 176 L 324 176 Z" fill="#207448"/>

  
  <text x="380" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Role: grants verbs on a resource</text>

  
  
  <rect x="280" y="230" width="270" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="415" y="266" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Resource: pods</text>

  
  <rect x="575" y="230" width="330" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="740" y="266" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Verbs: list, watch</text>

  
  <rect x="930" y="230" width="390" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1125" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Namespace: one namespace</text>

  
  <rect x="80" y="370" width="680" height="465" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <circle cx="135" cy="430" r="28" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <path d="M 123 430 L 131 438 L 147 420" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  
  <rect x="110" y="490" width="620" height="315" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="185" y="440" font-size="30" font-weight="bold" fill="#207448">Monitoring agent:</tspan>
    <tspan x="160" y="580" font-size="28" font-weight="bold">list and watch on pods,</tspan>
    <tspan x="160" y="635" font-size="28" font-weight="bold">nothing else</tspan>
  </text>

  
  <rect x="840" y="370" width="680" height="465" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

  
  <rect x="1050" y="405" width="260" height="52" rx="8" fill="#ffffff" stroke="#8c9b90" stroke-width="2"/>
  <text x="1180" y="440" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">create pods</text>

  
  <line x1="1180" y1="457" x2="1180" y2="502" stroke="#303a36" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="870" y="510" width="620" height="205" rx="12" fill="#fdf8f8" stroke="#f1c7c7" stroke-width="1.5"/>

  
  <circle cx="920" cy="600" r="28" fill="#ffffff" stroke="#c53030" stroke-width="4"/>
  <path d="M 908 588 L 932 612 M 932 588 L 908 612" fill="none" stroke="#c53030" stroke-width="4" stroke-linecap="round"/>

  
  <text font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="975" y="565" font-size="28" font-weight="bold">Attempt to create or</tspan>
    <tspan x="975" y="602" font-size="28" font-weight="bold">delete a pod:</tspan>
    <tspan x="975" y="650" font-size="34" font-weight="bold" fill="#c53030">403 Forbidden</tspan>
  </text>

  
  <rect x="870" y="735" width="620" height="80" rx="8" fill="#f5f8f5" stroke="#d5dfd8" stroke-width="1"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1180" y="768">Denied by default unless</tspan>
    <tspan x="1180" y="800">a Role grants the verb</tspan>
  </text>

  
  <rect x="80" y="875" width="1440" height="70" rx="12" fill="#207448"/>
  <text x="800" y="919" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Start each Role from the smallest verb set the workload needs.</text>
</svg>