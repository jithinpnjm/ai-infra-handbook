<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Service types as a stack of trade-offs</title>
  <desc>Visual explanation of Kubernetes Service types as nested layers, specialized headless and selectorless patterns, and a three-step decision model.</desc>

  <rect width="1600" height="1140" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Service types as a stack of trade-offs</text>

  

  
  <rect x="50" y="120" width="930" height="740" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(75, 145)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 28 A14 14 0 0 1 38 20 A12 12 0 0 1 50 28 A10 10 0 0 1 44 46 L12 46 A10 10 0 0 1 10 28 Z"/>
    <path d="M28 46 L28 54"/>
    <path d="M14 54 L42 54"/>
    <circle cx="14" cy="54" r="2" fill="#207448"/>
    <circle cx="28" cy="54" r="2" fill="#207448"/>
    <circle cx="42" cy="54" r="2" fill="#207448"/>
  </g>

  
  <text x="150" y="172" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="30" font-weight="bold" fill="#207448">LoadBalancer: </tspan>
    <tspan x="150" dy="34" font-size="24" fill="#303a36">external load balancer with an external IP or hostname</tspan>
  </text>

  
  <rect x="80" y="245" width="870" height="585" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(105, 270)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="40" rx="6"/>
    <line x1="6" y1="28" x2="50" y2="28"/>
    <circle cx="16" cy="18" r="3" fill="#207448"/>
    <circle cx="28" cy="18" r="3" fill="#207448"/>
    <circle cx="40" cy="18" r="3" fill="#207448"/>
    <path d="M18 38 L38 38"/>
    <path d="M28 38 L28 48"/>
  </g>

  
  <text x="180" y="297" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="30" font-weight="bold" fill="#207448">NodePort: </tspan>
    <tspan x="180" dy="34" font-size="24" fill="#303a36">a port 30000-32767 opened on every node</tspan>
  </text>

  
  <rect x="110" y="370" width="810" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(135, 395)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22"/>
    <circle cx="28" cy="28" r="8"/>
    <line x1="28" y1="6" x2="28" y2="20"/>
    <line x1="28" y1="36" x2="28" y2="50"/>
    <line x1="6" y1="28" x2="20" y2="28"/>
    <line x1="36" y1="28" x2="50" y2="28"/>
  </g>

  
  <text x="210" y="422" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="30" font-weight="bold" fill="#207448">ClusterIP: </tspan>
    <tspan x="210" dy="34" font-size="24" fill="#303a36">virtual IP reachable inside the cluster</tspan>
    <tspan x="210" dy="30" font-size="24" fill="#303a36">(default)</tspan>
  </text>

  
  <rect x="140" y="535" width="750" height="145" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 6"/>
  <g transform="translate(170, 560)" stroke="#207448" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="190" height="95" rx="8"/>
    <circle cx="35" cy="48" r="16"/>
    <path d="M90 35 L160 35 M90 55 L145 55"/>
  </g>
  <g transform="translate(420, 560)" stroke="#207448" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="190" height="95" rx="8"/>
    <circle cx="35" cy="48" r="16"/>
    <path d="M90 35 L160 35 M90 55 L145 55"/>
  </g>
  <g transform="translate(670, 560)" stroke="#207448" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="190" height="95" rx="8"/>
    <circle cx="35" cy="48" r="16"/>
    <path d="M90 35 L160 35 M90 55 L145 55"/>
  </g>

  
  <g transform="translate(285, 715)">
    <rect x="0" y="0" width="460" height="56" rx="28" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <path d="M42 38 L42 18 M34 26 L42 18 L50 26" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="250" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">builds on the type before it</text>
  </g>

  

  
  <rect x="1020" y="120" width="530" height="350" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4"/>

  
  <g transform="translate(1050, 145)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="18" r="8"/>
    <circle cx="40" cy="18" r="8"/>
    <circle cx="28" cy="42" r="8"/>
    <line x1="22" y1="23" x2="34" y2="37"/>
    <line x1="34" y1="23" x2="22" y2="37"/>
  </g>

  
  <text x="1125" y="172" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#303a36">Headless (clusterIP: None):</tspan>
    <tspan x="1125" dy="34" font-size="24" fill="#303a36">no virtual IP,</tspan>
    <tspan x="1125" dy="30" font-size="24" fill="#303a36">DNS returns Pod IPs</tspan>
  </text>

  
  <rect x="1045" y="295" width="480" height="150" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="2"/>
  <text x="1065" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1065" dy="0">StatefulSets and training</tspan>
    <tspan x="1065" dy="32">workers that find each other</tspan>
    <tspan x="1065" dy="32">by name</tspan>
  </text>

  
  <rect x="1020" y="510" width="530" height="350" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1050, 535)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="24" rx="4"/>
    <circle cx="16" cy="44" r="6"/>
    <circle cx="40" cy="44" r="6"/>
    <path d="M16 32 L16 38 M40 32 L40 38"/>
  </g>

  
  <text x="1125" y="565" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#303a36">Services without selectors:</tspan>
    <tspan x="1125" dy="36" font-size="24" fill="#303a36">you manage EndpointSlices</tspan>
  </text>

  
  <g transform="translate(1050, 680)" stroke="#207448" stroke-width="3" fill="#f5f8f5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="130" height="70" rx="6"/>
    <line x1="130" y1="35" x2="190" y2="35" stroke-dasharray="6 4"/>
    <rect x="190" y="0" width="130" height="70" rx="6"/>
    <line x1="320" y1="35" x2="380" y2="35" stroke-dasharray="6 4"/>
    <rect x="380" y="0" width="90" height="70" rx="6"/>
  </g>

  

  
  <rect x="50" y="895" width="460" height="205" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="95" cy="945" r="24" fill="#207448"/>
  <text x="95" y="953" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="140" y="942" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="24" fill="#303a36">Only other Pods call it:</tspan>
    <tspan x="140" dy="42" font-size="30" font-weight="bold" fill="#207448">ClusterIP</tspan>
  </text>

  
  <rect x="540" y="895" width="520" height="205" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="585" cy="945" r="24" fill="#207448"/>
  <text x="585" y="953" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="630" y="938" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="24" fill="#303a36">Something outside</tspan>
    <tspan x="630" dy="30" font-size="24" fill="#303a36">must reach it:</tspan>
    <tspan x="630" dy="40" font-size="28" font-weight="bold" fill="#207448">NodePort or LoadBalancer</tspan>
  </text>

  
  <rect x="1090" y="895" width="460" height="205" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="1135" cy="945" r="24" fill="#207448"/>
  <text x="1135" y="953" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="1180" y="938" font-family="system-ui, -apple-system, sans-serif">
    <tspan font-size="24" fill="#303a36">Caller needs every</tspan>
    <tspan x="1180" dy="30" font-size="24" fill="#303a36">Pod address:</tspan>
    <tspan x="1180" dy="40" font-size="30" font-weight="bold" fill="#db8129">headless</tspan>
  </text>
</svg>