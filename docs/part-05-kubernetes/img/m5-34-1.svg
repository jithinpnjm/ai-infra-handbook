<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>Standard vs Autopilot</title>
  <desc>Visual workflow of GKE Standard GPU architecture covering quota and capacity, standard cluster control plane, dedicated GPU node pools, multi-node training fabric, and scheduling with sub-GPU sharing.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Standard vs Autopilot</text>

  
  <g>
    
    <rect x="200" y="105" width="1200" height="150" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="255" cy="180" r="24" fill="#207448"/>
    <text x="255" y="180" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 320 190 A 22 22 0 1 1 360 190"/>
      <line x1="340" y1="182" x2="354" y2="168"/>
      <circle cx="340" cy="182" r="3.5" fill="#207448"/>
      <line x1="325" y1="198" x2="355" y2="198"/>
    </g>
    
    
    <line x1="390" y1="125" x2="390" y2="235" stroke="#c2d8c7" stroke-width="1.5"/>
    
    
    <text x="420" y="150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1. Quota &amp; Capacity Model</text>
    <text x="420" y="188" font-family="sans-serif" font-size="24" fill="#303a36">Verify Regional GPU/CPU/SSD Quota;</text>
    <text x="420" y="226" font-family="sans-serif" font-size="24" fill="#303a36">Reservation / Flex-Start / Spot</text>
  </g>

  
  <line x1="800" y1="255" x2="800" y2="300" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g>
    
    <rect x="200" y="300" width="1200" height="150" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="255" cy="375" r="24" fill="#207448"/>
    <text x="255" y="375" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="340" cy="375" r="9"/>
      <circle cx="340" cy="355" r="4.5"/>
      <circle cx="340" cy="395" r="4.5"/>
      <circle cx="320" cy="375" r="4.5"/>
      <circle cx="360" cy="375" r="4.5"/>
      <line x1="340" y1="366" x2="340" y2="360"/>
      <line x1="340" y1="384" x2="340" y2="390"/>
      <line x1="331" y1="375" x2="325" y2="375"/>
      <line x1="349" y1="375" x2="355" y2="375"/>
    </g>
    
    
    <line x1="390" y1="320" x2="390" y2="430" stroke="#c2d8c7" stroke-width="1.5"/>
    
    
    <text x="420" y="345" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2. GKE Standard Cluster</text>
    <text x="420" y="383" font-family="sans-serif" font-size="24" fill="#303a36">CPU-only system pool (e2-standard-4);</text>
    <text x="420" y="421" font-family="sans-serif" font-size="24" fill="#303a36">Dataplane V2 + Workload Identity + DCGM</text>
  </g>

  
  <line x1="800" y1="450" x2="800" y2="495" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g>
    
    <rect x="200" y="495" width="1200" height="150" rx="12" ry="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
    
    
    <circle cx="255" cy="570" r="24" fill="#db8129"/>
    <text x="255" y="570" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    
    <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="322" y="552" width="36" height="36" rx="4"/>
      <rect x="330" y="560" width="20" height="20" rx="2"/>
      <line x1="332" y1="547" x2="332" y2="552"/>
      <line x1="348" y1="547" x2="348" y2="552"/>
      <line x1="332" y1="588" x2="332" y2="593"/>
      <line x1="348" y1="588" x2="348" y2="593"/>
      <line x1="317" y1="562" x2="322" y2="562"/>
      <line x1="317" y1="578" x2="322" y2="578"/>
      <line x1="358" y1="562" x2="363" y2="562"/>
      <line x1="358" y1="578" x2="363" y2="578"/>
    </g>
    
    
    <line x1="390" y1="515" x2="390" y2="625" stroke="#c2d8c7" stroke-width="1.5"/>
    
    
    <text x="420" y="540" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">3. Dedicated GPU Node Pool(s)</text>
    <text x="420" y="578" font-family="monospace" font-size="24" fill="#303a36">a3-highgpu-8g / a2-highgpu-8g / g2-standard;</text>
    <text x="420" y="616" font-family="monospace" font-size="24" fill="#303a36">gpu-driver-version=default|latest + gVNIC</text>
  </g>

  
  <line x1="800" y1="645" x2="800" y2="690" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g>
    
    <rect x="200" y="690" width="1200" height="150" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="255" cy="765" r="24" fill="#207448"/>
    <text x="255" y="765" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    
    <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="323" cy="750" r="3.5" fill="#207448"/>
      <circle cx="340" cy="750" r="3.5" fill="#207448"/>
      <circle cx="357" cy="750" r="3.5" fill="#207448"/>
      <circle cx="323" cy="780" r="3.5" fill="#207448"/>
      <circle cx="340" cy="780" r="3.5" fill="#207448"/>
      <circle cx="357" cy="780" r="3.5" fill="#207448"/>
      <line x1="318" y1="758" x2="362" y2="758"/>
      <line x1="318" y1="772" x2="362" y2="772"/>
      <line x1="323" y1="754" x2="323" y2="758"/>
      <line x1="340" y1="754" x2="340" y2="758"/>
      <line x1="357" y1="754" x2="357" y2="758"/>
      <line x1="323" y1="772" x2="323" y2="776"/>
      <line x1="340" y1="772" x2="340" y2="776"/>
      <line x1="357" y1="772" x2="357" y2="776"/>
      <line x1="326" y1="758" x2="354" y2="772"/>
      <line x1="354" y1="758" x2="326" y2="772"/>
    </g>
    
    
    <line x1="390" y1="710" x2="390" y2="820" stroke="#c2d8c7" stroke-width="1.5"/>
    
    
    <text x="420" y="735" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4. Multi-Node Training Fabric</text>
    <text x="420" y="773" font-family="monospace" font-size="24" fill="#303a36">--placement-type COMPACT + Multi-Networking</text>
    <text x="420" y="811" font-family="monospace" font-size="24" fill="#303a36">(--additional-node-network / network-profile)</text>
  </g>

  
  <line x1="800" y1="840" x2="800" y2="885" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <g>
    
    <rect x="200" y="885" width="1200" height="150" rx="12" ry="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <circle cx="255" cy="960" r="24" fill="#207448"/>
    <text x="255" y="960" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="340" cy="960" r="21"/>
      <line x1="340" y1="960" x2="340" y2="941"/>
      <line x1="340" y1="960" x2="357" y2="970"/>
      <line x1="340" y1="960" x2="323" y2="970"/>
      <circle cx="340" cy="960" r="3.5" fill="#207448"/>
    </g>
    
    
    <line x1="390" y1="905" x2="390" y2="1015" stroke="#c2d8c7" stroke-width="1.5"/>
    
    
    <text x="420" y="930" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">5. Scheduling &amp; Sub-GPU Sharing</text>
    <text x="420" y="968" font-family="monospace" font-size="24" fill="#303a36">nvidia.com/gpu=present:NoSchedule + Kueue;</text>
    <text x="420" y="1006" font-family="sans-serif" font-size="24" fill="#303a36">Whole 8-GPU training vs MIG / Time-Sharing</text>
  </g>
</svg>