<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280">
  <title>A Service with no selector pointing at an outside database</title>
  <desc>Visual explanation of a Kubernetes Service without a selector pointing to an external legacy database via a manually defined Endpoints object.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b382b" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1280" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448">A Service with no selector pointing at an outside database</text>

  
  <rect x="40" y="100" width="1070" height="880" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="10,6"/>
  <rect x="60" y="82" width="280" height="34" rx="6" fill="#e8f1ea"/>
  <text x="75" y="106" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">KUBERNETES CLUSTER</text>

  
  <g filter="url(#shadow)">
    <rect x="70" y="240" width="300" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <rect x="95" y="265" width="56" height="50" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="95" y1="282" x2="151" y2="282" stroke="#207448" stroke-width="3"/>
  <circle cx="107" cy="274" r="3" fill="#207448"/>
  <circle cx="118" cy="274" r="3" fill="#207448"/>
  <circle cx="129" cy="274" r="3" fill="#207448"/>
  <text x="165" y="302" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">App Pods</text>

  <text font-family="sans-serif" font-size="25px" fill="#303a36">
    <tspan x="95" y="360">app pods inside the</tspan>
    <tspan x="95" y="398">cluster call</tspan>
    <tspan x="95" y="436" font-family="monospace" font-weight="bold">'my-database-server'</tspan>
    <tspan x="95" y="474">by name</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="490" y="140" width="590" height="330" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <circle cx="528" cy="182" r="18" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 528 156 L 528 162 M 528 202 L 528 208 M 502 182 L 508 182 M 548 182 L 554 182 M 510 164 L 514 168 M 542 196 L 546 200 M 510 200 L 514 196 M 542 168 L 546 164" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="562" y="192" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Service Definition</text>

  <text font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="515" y="246" font-weight="bold">Service my-database-server with the</tspan>
    <tspan x="515" y="284" font-weight="bold" fill="#db8129">spec.selector</tspan>
    <tspan y="284" font-weight="bold"> field removed, only</tspan>
    <tspan x="515" y="322">metadata and ports (1433)</tspan>
  </text>

  
  <rect x="515" y="354" width="540" height="96" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="2.5"/>
  <circle cx="542" cy="402" r="14" fill="#db8129"/>
  <text x="542" y="411" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
    <tspan x="568" y="392">Because there is no selector,</tspan>
    <tspan x="568" y="428">no endpoints are created automatically</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="490" y="550" width="590" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <rect x="515" y="575" width="48" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="525" y1="588" x2="553" y2="588" stroke="#207448" stroke-width="3"/>
  <line x1="525" y1="597" x2="553" y2="597" stroke="#207448" stroke-width="3"/>
  <line x1="525" y1="606" x2="543" y2="606" stroke="#207448" stroke-width="3"/>
  <text x="578" y="606" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Manual Endpoints</text>

  <text font-family="monospace" font-size="24px" fill="#303a36">
    <tspan x="515" y="656" font-family="sans-serif">Endpoints name my-database-server</tspan>
    <tspan x="515" y="694" font-family="sans-serif">(must match the Service name)</tspan>
    <tspan x="515" y="734">subsets addresses ip 1.2.3.4</tspan>
    <tspan x="515" y="774">ports port 1433</tspan>
  </text>

  
  <rect x="490" y="860" width="590" height="90" rx="8" fill="#f0f7f2" stroke="#207448" stroke-width="2"/>
  <text font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="510" y="898" font-weight="bold" fill="#207448">Rule: </tspan>
    <tspan y="898">if the external IP changes,</tspan>
    <tspan x="510" y="932">update the Endpoints object</tspan>
  </text>

  
  <rect x="1140" y="100" width="420" height="880" rx="16" fill="#ffffff" stroke="#788c7f" stroke-width="2.5" stroke-dasharray="10,6"/>
  <rect x="1160" y="82" width="270" height="34" rx="6" fill="#e2eae4"/>
  <text x="1175" y="106" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#526659">OUTSIDE CLUSTER</text>

  
  <g filter="url(#shadow)">
    <rect x="1170" y="470" width="360" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  </g>
  
  <path d="M 1200 515 C 1200 500, 1260 500, 1260 515 C 1260 530, 1200 530, 1200 515 Z" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 1200 515 L 1200 555 C 1200 570, 1260 570, 1260 555 L 1260 515" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 1200 535 C 1200 550, 1260 550, 1260 535" fill="none" stroke="#207448" stroke-width="4"/>
  <text x="1278" y="542" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Database</text>

  <text font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
    <tspan x="1195" y="620">legacy database</tspan>
    <tspan x="1195" y="660">server 1.2.3.4</tspan>
  </text>
  <rect x="1195" y="695" width="200" height="44" rx="6" fill="#207448"/>
  <text x="1295" y="726" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">PORT 1433</text>

  

  
  <path d="M 370 280 L 490 280" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="270" y="210" width="80" height="38" rx="19" fill="#207448"/>
  <text x="310" y="236" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">app</text>

  
  <rect x="376" y="246" width="138" height="42" rx="21" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="445" y="275" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">DNS name</text>

  
  <rect x="940" y="152" width="120" height="38" rx="19" fill="#207448"/>
  <text x="1000" y="178" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff" text-anchor="middle">Service</text>

  
  <path d="M 760 470 L 760 550" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="790" y="492" width="140" height="42" rx="21" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="860" y="521" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">endpoint</text>

  
  <path d="M 1080 680 L 1170 680" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <rect x="1075" y="628" width="115" height="42" rx="21" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
  <text x="1132" y="657" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">1.2.3.4</text>

  
  <rect x="40" y="1010" width="1520" height="230" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  
  <rect x="40" y="1010" width="16" height="230" rx="8" fill="#207448"/>

  <text font-family="sans-serif" font-size="24px" fill="#303a36">
    <tspan x="80" y="1060" font-weight="bold" fill="#207448">the other direction, reaching a Service from outside, try in order:</tspan>
    <tspan x="80" y="1108">1. internal load balancer in the private network,</tspan>
    <tspan x="80" y="1152">2. then NodePort behind a physical load balancer or DNS,</tspan>
    <tspan x="80" y="1196">3. and only then complex options (kube-proxy on an external machine, Consul)</tspan>
  </text>
</svg>