<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Helvetica, Arial, sans-serif">
  <title>A sudo-style impersonation rule keeps daily work read-only</title>
  <desc>Diagram of an operator john in group ops-team with kubectl, three bindings (view, cluster-admin, impersonate), and a three-step command story ending in an audited impersonated create.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#207448"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="64" text-anchor="middle" font-size="48" font-weight="700" fill="#303a36">A sudo-style impersonation rule</text>
  <text x="800" y="118" text-anchor="middle" font-size="48" font-weight="700" fill="#303a36">keeps daily work read-only</text>

  
  <rect x="40" y="440" width="300" height="280" rx="18" fill="#e8f1ea" stroke="#cfe2d5" stroke-width="1.5"/>
  <g transform="translate(162,470)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="52" height="42" rx="6"/>
    <line x1="2" y1="15" x2="54" y2="15"/>
    <polyline points="11,24 18,29 11,34"/>
    <line x1="24" y1="34" x2="34" y2="34"/>
  </g>
  <text x="190" y="566" text-anchor="middle" font-size="34" font-weight="700" fill="#303a36">john</text>
  <rect x="80" y="586" width="220" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="190" y="620" text-anchor="middle" font-size="26" fill="#303a36">ops-team</text>

  
  <rect x="380" y="190" width="540" height="220" rx="18" fill="#e8f1ea" stroke="#cfe2d5" stroke-width="1.5"/>
  <g transform="translate(400,206)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 22 C12 9 32 9 40 22 C32 35 12 35 4 22 Z"/>
    <circle cx="22" cy="22" r="7"/>
  </g>
  <text x="456" y="238" font-size="30" font-weight="700" fill="#303a36">cluster-admin-view</text>
  <circle cx="880" cy="216" r="24" fill="#207448"/>
  <text x="880" y="225" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>

  <rect x="460" y="310" width="180" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="550" y="343" text-anchor="middle" font-size="24" fill="#303a36">ops-team</text>
  <line x1="640" y1="335" x2="688" y2="335" stroke="#207448" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="690" y="310" width="150" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="765" y="343" text-anchor="middle" font-size="24" font-weight="700" fill="#207448">view</text>

  
  <rect x="380" y="450" width="540" height="220" rx="18" fill="#e8f1ea" stroke="#cfe2d5" stroke-width="1.5"/>
  <g transform="translate(400,466)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 3 L39 9 V21 C39 32 32 38.5 22 41 C12 38.5 5 32 5 21 V9 Z"/>
  </g>
  <text x="456" y="498" font-size="30" font-weight="700" fill="#303a36">cluster-admin-crb</text>

  <rect x="410" y="525" width="220" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="520" y="558" text-anchor="middle" font-size="24" fill="#303a36">cluster-admin</text>
  <line x1="630" y1="550" x2="668" y2="550" stroke="#207448" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="670" y="525" width="220" height="50" rx="25" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="780" y="558" text-anchor="middle" font-size="24" font-weight="700" fill="#207448">cluster-admin</text>
  <text x="650" y="630" text-anchor="middle" font-size="24" fill="#5f6f66">no human logs in as this user</text>

  
  <rect x="380" y="710" width="540" height="280" rx="18" fill="#e8f1ea" stroke="#cfe2d5" stroke-width="1.5"/>
  <g transform="translate(400,726)" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="20" width="28" height="21" rx="4"/>
    <path d="M14 20 V13 A8 8 0 0 1 30 13 V20"/>
    <circle cx="22" cy="30" r="2.5"/>
  </g>
  <text x="456" y="758" font-size="30" font-weight="700" fill="#303a36">cluster-admin-impersonate</text>
  <circle cx="880" cy="736" r="24" fill="#207448"/>
  <text x="880" y="745" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>

  <rect x="410" y="776" width="180" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="500" y="809" text-anchor="middle" font-size="24" fill="#303a36">ops-team</text>
  <line x1="500" y1="826" x2="500" y2="856" stroke="#207448" stroke-width="2.5" marker-end="url(#arw)"/>

  <rect x="410" y="860" width="480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="430" y="892" font-size="26" font-weight="700" fill="#207448">cluster-admin-impersonator</text>
  <text x="430" y="922" font-size="24" fill="#303a36">verbs impersonate on users,</text>
  <text x="430" y="950" font-size="24" fill="#303a36">resourceNames cluster-admin</text>

  
  <rect x="970" y="190" width="590" height="150" rx="16" fill="#ffffff" stroke="#d5e3d9" stroke-width="1.5"/>
  <text x="1000" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#303a36">kubectl get configmaps</text>
  <text x="1000" y="274" font-size="26" font-weight="700" fill="#207448">no resources found</text>
  <text x="1000" y="306" font-size="24" fill="#5f6f66">allowed, read-only</text>

  
  <rect x="970" y="380" width="590" height="150" rx="16" fill="#ffffff" stroke="#d5e3d9" stroke-width="1.5"/>
  <text x="1000" y="420" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#303a36">kubectl create configmap</text>
  <text x="1000" y="464" font-size="26" font-weight="700" fill="#303a36">Forbidden</text>
  <text x="1000" y="496" font-size="24" fill="#5f6f66">user john cannot create</text>

  
  <rect x="970" y="570" width="590" height="180" rx="16" fill="#ffffff" stroke="#d5e3d9" stroke-width="1.5"/>
  <circle cx="1000" cy="604" r="24" fill="#207448"/>
  <text x="1000" y="613" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <text x="1042" y="610" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#303a36">kubectl</text>
  <rect x="1152" y="584" width="278" height="34" rx="6" fill="#db8129"/>
  <text x="1158" y="610" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#ffffff">--as=cluster-admin</text>
  <text x="1042" y="646" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#303a36">create configmap</text>
  <text x="1000" y="706" font-size="26" font-weight="700" fill="#207448">configmap created</text>

  
  <rect x="970" y="790" width="590" height="110" rx="16" fill="#e8f1ea"/>
  <g transform="translate(992,806)" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="28" height="32" rx="4"/>
    <rect x="14" y="2" width="12" height="8" rx="3"/>
    <line x1="13" y1="16" x2="27" y2="16"/>
    <line x1="13" y1="23" x2="27" y2="23"/>
    <line x1="13" y1="30" x2="21" y2="30"/>
  </g>
  <text x="1046" y="822" font-size="24" fill="#303a36">the audit log records both john</text>
  <text x="1046" y="856" font-size="24" fill="#303a36">and the impersonated cluster-admin</text>

  
  <rect x="40" y="1040" width="1520" height="100" rx="16" fill="#207448"/>
  <text x="800" y="1082" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">daily work runs with reader rights, and a deliberate command</text>
  <text x="800" y="1116" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">raises the rights for one action.</text>
</svg>