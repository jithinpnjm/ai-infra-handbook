<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>Reference GPU platform in six layers</title>
  <desc>Stack of six layers representing reference GPU platform architecture</desc>

  <rect width="1600" height="1380" fill="#f5f8f5"/>

  
  <text x="800" y="80" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Reference GPU platform in six layers</text>

  
  <g id="layer-1">
    <rect x="80" y="140" width="1440" height="180" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4"/>
    
    <g transform="translate(115, 195)" stroke="#db8129" stroke-width="3.5" fill="none">
      <rect x="10" y="10" width="50" height="50" rx="8"/>
      <rect x="23" y="23" width="24" height="24" rx="3" fill="#db8129" fill-opacity="0.2"/>
      <line x1="22" y1="4" x2="22" y2="10"/>
      <line x1="35" y1="4" x2="35" y2="10"/>
      <line x1="48" y1="4" x2="48" y2="10"/>
      <line x1="22" y1="60" x2="22" y2="66"/>
      <line x1="35" y1="60" x2="35" y2="66"/>
      <line x1="48" y1="60" x2="48" y2="66"/>
      <line x1="4" y1="22" x2="10" y2="22"/>
      <line x1="4" y1="35" x2="10" y2="35"/>
      <line x1="4" y1="48" x2="10" y2="48"/>
      <line x1="60" y1="22" x2="66" y2="22"/>
      <line x1="60" y1="35" x2="66" y2="35"/>
      <line x1="60" y1="48" x2="66" y2="48"/>
    </g>
    <line x1="210" y1="160" x2="210" y2="300" stroke="#f0c294" stroke-width="2"/>
    <text x="245" y="195" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#db8129">1 Pools: </tspan><tspan font-size="24">gpu-h100-training tainted and labelled </tspan>
      <tspan x="245" y="238" font-size="24">homogeneous 8-GPU nodes, gpu-l4-inference, </tspan>
      <tspan x="245" y="281" font-size="24">cpu-system, spot-experiment</tspan>
    </text>
  </g>

  
  <g id="layer-2">
    <rect x="80" y="340" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(115, 395)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="8" y="15" width="14" height="40" rx="3"/>
      <rect x="28" y="15" width="14" height="40" rx="3"/>
      <rect x="48" y="15" width="14" height="40" rx="3" fill="#207448" fill-opacity="0.2"/>
      <path d="M4 35 L66 35" stroke-dasharray="4 3"/>
      <path d="M58 27 L66 35 L58 43"/>
    </g>
    <line x1="210" y1="360" x2="210" y2="500" stroke="#b7d5bf" stroke-width="2"/>
    <text x="245" y="395" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">2 Admission: </tspan><tspan font-size="24">all batch jobs through Kueue LocalQueues; ClusterQueue per team </tspan>
      <tspan x="245" y="438" font-size="24">with nominal quota, cohort borrowing, preemption policy; inference as Deployments </tspan>
      <tspan x="245" y="481" font-size="24">with a high PriorityClass and a reserved pool</tspan>
    </text>
  </g>

  
  <g id="layer-3">
    <rect x="80" y="540" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(115, 595)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="10" y="10" width="50" height="50" rx="6"/>
      <line x1="35" y1="10" x2="35" y2="60"/>
      <line x1="10" y1="35" x2="60" y2="35"/>
      <rect x="15" y="15" width="15" height="15" rx="2" fill="#207448"/>
      <rect x="40" y="15" width="15" height="15" rx="2" fill="#207448" fill-opacity="0.3"/>
      <rect x="15" y="40" width="15" height="15" rx="2" fill="#207448"/>
    </g>
    <line x1="210" y1="560" x2="210" y2="700" stroke="#b7d5bf" stroke-width="2"/>
    <text x="245" y="595" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">3 Placement: </tspan><tspan font-size="24">MostAllocated bin-packing on GPU pools so whole nodes stay free; </tspan>
      <tspan x="245" y="638" font-size="24">topology constraints for training; </tspan>
      <tspan x="245" y="681" font-size="24">topologySpreadConstraints across zones or racks for inference</tspan>
    </text>
  </g>

  
  <g id="layer-4">
    <rect x="80" y="740" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(115, 795)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M35 10 L58 20 V40 C58 53 35 62 35 62 C35 62 12 53 12 40 V20 Z"/>
      <path d="M26 36 L32 42 L45 28" stroke-width="3"/>
    </g>
    <line x1="210" y1="760" x2="210" y2="900" stroke="#b7d5bf" stroke-width="2"/>
    <text x="245" y="795" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">4 Resilience: </tspan><tspan font-size="24">PDBs for inference; training checkpoint-aware with </tspan>
      <tspan x="245" y="838" font-size="24">SIGTERM handling and terminationGracePeriodSeconds; </tspan>
      <tspan x="245" y="881" font-size="24">node health taints from NPD or DCGM-based remediation</tspan>
    </text>
  </g>

  
  <g id="layer-5">
    <rect x="80" y="940" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(115, 995)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="10" y="10" width="50" height="50" rx="6"/>
      <line x1="23" y1="50" x2="23" y2="35" stroke-linecap="round" stroke-width="5"/>
      <line x1="35" y1="50" x2="35" y2="22" stroke-linecap="round" stroke-width="5"/>
      <line x1="47" y1="50" x2="47" y2="30" stroke-linecap="round" stroke-width="5"/>
    </g>
    <line x1="210" y1="960" x2="210" y2="1100" stroke="#b7d5bf" stroke-width="2"/>
    <text x="245" y="995" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">5 Visibility: </tspan><tspan font-size="24">pending reasons, queue wait time, GPU allocation versus utilisation, </tspan>
      <tspan x="245" y="1038" font-size="24">fragmentation (largest placeable GPU block), preemption counts, </tspan>
      <tspan x="245" y="1081" font-size="24">admission latency, per-team usage</tspan>
    </text>
  </g>

  
  <g id="layer-6">
    <rect x="80" y="1140" width="1440" height="180" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(115, 1195)" stroke="#207448" stroke-width="3.5" fill="none">
      <rect x="15" y="26" width="40" height="32" rx="5"/>
      <path d="M23 26 V18 C23 11 28 6 35 6 C42 6 47 11 47 18 V26"/>
      <circle cx="35" cy="40" r="3" fill="#207448"/>
      <line x1="35" y1="43" x2="35" y2="49" stroke-width="2.5"/>
    </g>
    <line x1="210" y1="1160" x2="210" y2="1300" stroke="#b7d5bf" stroke-width="2"/>
    <text x="245" y="1195" font-family="sans-serif" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">6 Governance: </tspan><tspan font-size="24">ResourceQuota, LimitRange defaults, admission policy requiring </tspan>
      <tspan x="245" y="1238" font-size="24">queue labels and allow-listed priority classes, </tspan>
      <tspan x="245" y="1281" font-size="24">namespaces mapped to teams via GitOps</tspan>
    </text>
  </g>
</svg>