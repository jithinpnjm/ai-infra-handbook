<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reference GPU platform in six layers</title>
  <desc>Stack of six layers, each with its key choices from the chapter.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reference GPU platform in six layers</text>

  
  <g id="layer-1">
    <rect x="40" y="115" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 157)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="10" width="36" height="36" rx="6"/>
      <rect x="20" y="20" width="16" height="16" rx="2"/>
      <line x1="18" y1="3" x2="18" y2="10"/>
      <line x1="28" y1="3" x2="28" y2="10"/>
      <line x1="38" y1="3" x2="38" y2="10"/>
      <line x1="18" y1="46" x2="18" y2="53"/>
      <line x1="28" y1="46" x2="28" y2="53"/>
      <line x1="38" y1="46" x2="38" y2="53"/>
      <line x1="3" y1="18" x2="10" y2="18"/>
      <line x1="3" y1="28" x2="10" y2="28"/>
      <line x1="3" y1="38" x2="10" y2="38"/>
      <line x1="46" y1="18" x2="53" y2="18"/>
      <line x1="46" y1="28" x2="53" y2="28"/>
      <line x1="46" y1="38" x2="53" y2="38"/>
    </g>
    
    <text x="144" y="196" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1 Pools:</text>
    
    <line x1="390" y1="131" x2="390" y2="239" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <rect x="414" y="147" width="940" height="36" rx="6" fill="#fffdfa" stroke="#db8129" stroke-width="2"/>
    
    <text x="424" y="174" font-family="sans-serif" font-size="24" fill="#303a36">gpu-h100-training tainted and labelled homogeneous 8-GPU nodes,</text>
    <text x="424" y="218" font-family="sans-serif" font-size="24" fill="#303a36">gpu-l4-inference, cpu-system, spot-experiment</text>
  </g>

  
  <g id="layer-2">
    <rect x="40" y="295" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 337)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="6" width="36" height="44" rx="4"/>
      <path d="M20 6 V3 H36 V6"/>
      <path d="M18 28 L25 35 L38 20"/>
      <line x1="18" y1="14" x2="38" y2="14"/>
    </g>
    
    <text x="144" y="376" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2 Admission:</text>
    
    <line x1="390" y1="311" x2="390" y2="419" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <text x="424" y="339" font-family="sans-serif" font-size="24" fill="#303a36">all batch jobs through Kueue LocalQueues; ClusterQueue per team with</text>
    <text x="424" y="373" font-family="sans-serif" font-size="24" fill="#303a36">nominal quota, cohort borrowing, preemption policy; inference as</text>
    <text x="424" y="407" font-family="sans-serif" font-size="24" fill="#303a36">Deployments with a high PriorityClass and a reserved pool</text>
  </g>

  
  <g id="layer-3">
    <rect x="40" y="475" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 517)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="6" width="44" height="44" rx="4"/>
      <line x1="28" y1="6" x2="28" y2="50"/>
      <line x1="6" y1="28" x2="50" y2="28"/>
      <rect x="11" y="11" width="12" height="12" rx="2" fill="#207448"/>
      <rect x="33" y="11" width="12" height="12" rx="2" fill="#207448"/>
      <rect x="11" y="33" width="12" height="12" rx="2" fill="#207448"/>
    </g>
    
    <text x="144" y="556" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3 Placement:</text>
    
    <line x1="390" y1="491" x2="390" y2="599" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <text x="424" y="519" font-family="sans-serif" font-size="24" fill="#303a36">MostAllocated bin-packing on GPU pools so whole nodes stay free;</text>
    <text x="424" y="553" font-family="sans-serif" font-size="24" fill="#303a36">topology constraints for training; topologySpreadConstraints</text>
    <text x="424" y="587" font-family="sans-serif" font-size="24" fill="#303a36">across zones or racks for inference</text>
  </g>

  
  <g id="layer-4">
    <rect x="40" y="655" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 697)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M28 6 L46 14 V26 C46 38 28 48 28 48 C28 48 10 38 10 26 V14 Z"/>
      <path d="M20 27 L25 32 L36 21"/>
    </g>
    
    <text x="144" y="736" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4 Resilience:</text>
    
    <line x1="390" y1="671" x2="390" y2="779" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <text x="424" y="699" font-family="sans-serif" font-size="24" fill="#303a36">PDBs for inference; training checkpoint-aware with SIGTERM handling</text>
    <text x="424" y="733" font-family="sans-serif" font-size="24" fill="#303a36">and terminationGracePeriodSeconds; node health taints from</text>
    <text x="424" y="767" font-family="sans-serif" font-size="24" fill="#303a36">NPD or DCGM-based remediation</text>
  </g>

  
  <g id="layer-5">
    <rect x="40" y="835" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 877)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M6 28 C14 14 42 14 50 28 C42 42 14 42 6 28 Z"/>
      <circle cx="28" cy="28" r="8"/>
      <circle cx="28" cy="28" r="3" fill="#207448"/>
    </g>
    
    <text x="144" y="916" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">5 Visibility:</text>
    
    <line x1="390" y1="851" x2="390" y2="959" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <text x="424" y="879" font-family="sans-serif" font-size="24" fill="#303a36">pending reasons, queue wait time, GPU allocation versus utilisation,</text>
    <text x="424" y="913" font-family="sans-serif" font-size="24" fill="#303a36">fragmentation (largest placeable GPU block), preemption counts,</text>
    <text x="424" y="947" font-family="sans-serif" font-size="24" fill="#303a36">admission latency, per-team usage</text>
  </g>

  
  <g id="layer-6">
    <rect x="40" y="1015" width="1520" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(68, 1057)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="12" y="22" width="32" height="26" rx="4"/>
      <path d="M19 22 V14 C19 9 37 9 37 14 V22"/>
      <circle cx="28" cy="33" r="3" fill="#207448"/>
      <line x1="28" y1="35" x2="28" y2="40" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="144" y="1096" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">6 Governance:</text>
    
    <line x1="390" y1="1031" x2="390" y2="1139" stroke="#207448" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    
    <text x="424" y="1059" font-family="sans-serif" font-size="24" fill="#303a36">ResourceQuota, LimitRange defaults, admission policy requiring</text>
    <text x="424" y="1093" font-family="sans-serif" font-size="24" fill="#303a36">queue labels and allow-listed priority classes, namespaces mapped</text>
    <text x="424" y="1127" font-family="sans-serif" font-size="24" fill="#303a36">to teams via GitOps</text>
  </g>
</svg>