<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Socket-Level Load Balancing with eBPF vs Traditional Packet DNAT</title>
  <desc>Comparison between traditional kube-proxy packet-level DNAT and Cilium eBPF socket-level load balancing.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Socket-Level Load Balancing with eBPF vs Traditional Packet DNAT</text>

  
  
  
  <rect x="40" y="80" width="1520" height="675" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="125" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Traditional kube-proxy packet DNAT</text>

  
  <g id="top-step-1">
    <rect x="70" y="150" width="420" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="94" y="174" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="94" y1="186" x2="138" y2="186" stroke="#207448" stroke-width="2" />
    <circle cx="103" cy="180" r="2.5" fill="#207448" />
    <circle cx="111" cy="180" r="2.5" fill="#207448" />
    <text x="150" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 1:</text>
    <text x="94" y="246" font-family="sans-serif" font-size="24" fill="#303a36">Application in Pod calls</text>
    <text x="94" y="280" font-family="sans-serif" font-size="24" fill="#303a36">connect() to ClusterIP:80</text>
    <text x="94" y="314" font-family="monospace" font-size="24" fill="#303a36">(10.96.0.100:80).</text>
  </g>

  
  <line x1="490" y1="267" x2="576" y2="267" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="top-step-2">
    <rect x="590" y="150" width="420" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="614" y="174" width="42" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="622" y1="168" x2="622" y2="174" stroke="#207448" stroke-width="2" />
    <line x1="635" y1="168" x2="635" y2="174" stroke="#207448" stroke-width="2" />
    <line x1="648" y1="168" x2="648" y2="174" stroke="#207448" stroke-width="2" />
    <line x1="622" y1="208" x2="622" y2="214" stroke="#207448" stroke-width="2" />
    <line x1="635" y1="208" x2="635" y2="214" stroke="#207448" stroke-width="2" />
    <line x1="648" y1="208" x2="648" y2="214" stroke="#207448" stroke-width="2" />
    <text x="670" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 2:</text>
    <text x="614" y="246" font-family="sans-serif" font-size="24" fill="#303a36">Linux kernel constructs</text>
    <text x="614" y="280" font-family="sans-serif" font-size="24" fill="#303a36">TCP SYN packet with</text>
    <text x="614" y="314" font-family="monospace" font-size="24" fill="#303a36">src=10.244.1.5,</text>
    <text x="614" y="348" font-family="monospace" font-size="24" fill="#303a36">dst=10.96.0.100:80.</text>
  </g>

  
  <line x1="1010" y1="267" x2="1096" y2="267" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="top-step-3">
    <rect x="1110" y="150" width="420" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="1134" cy="191" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 1126 191 L 1142 191 M 1134 183 L 1134 199" stroke="#207448" stroke-width="3" />
    <text x="1162" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 3:</text>
    <text x="1134" y="246" font-family="sans-serif" font-size="24" fill="#303a36">Packet leaves Pod veth</text>
    <text x="1134" y="280" font-family="sans-serif" font-size="24" fill="#303a36">and hits netfilter</text>
    <text x="1134" y="314" font-family="monospace" font-size="24" fill="#303a36">PREROUTING hook on host.</text>
  </g>

  
  <path d="M 1320 385 L 1320 422 L 1195 422 L 1195 450" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="top-step-4">
    <rect x="850" y="460" width="680" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="876" y="484" width="42" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="876" y1="500" x2="918" y2="500" stroke="#207448" stroke-width="2" />
    <line x1="897" y1="500" x2="897" y2="518" stroke="#207448" stroke-width="2" />
    <text x="930" y="512" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 4:</text>
    <text x="876" y="556" font-family="sans-serif" font-size="24" fill="#303a36">iptables or nftables DNAT rewrites</text>
    <text x="876" y="590" font-family="sans-serif" font-size="24" fill="#303a36">destination IP:port to Pod IP</text>
    <text x="876" y="624" font-family="monospace" font-size="24" fill="#303a36">10.244.2.9:8000 and allocates</text>
    <text x="876" y="658" font-family="sans-serif" font-size="24" fill="#303a36">a conntrack entry.</text>
  </g>

  
  <line x1="850" y1="590" x2="714" y2="590" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="top-step-5">
    <rect x="70" y="460" width="630" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 96 508 C 96 490 126 490 126 508 C 126 522 108 522 96 512" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="102,518 96,512 102,504" fill="none" stroke="#207448" stroke-width="3" />
    <text x="140" y="512" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 5:</text>
    <text x="96" y="566" font-family="sans-serif" font-size="24" fill="#303a36">Reverse NAT is required on</text>
    <text x="96" y="606" font-family="sans-serif" font-size="24" fill="#303a36">return packet path.</text>
  </g>

  
  
  
  <rect x="40" y="780" width="1520" height="680" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="70" y="825" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Cilium eBPF Socket-LB (cgroup/connect4)</text>

  
  <g id="bottom-step-1">
    <rect x="70" y="850" width="420" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="94" y="874" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="94" y1="886" x2="138" y2="886" stroke="#207448" stroke-width="2" />
    <circle cx="103" cy="880" r="2.5" fill="#207448" />
    <circle cx="111" cy="880" r="2.5" fill="#207448" />
    <text x="150" y="902" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 1:</text>
    <text x="94" y="948" font-family="sans-serif" font-size="24" fill="#303a36">Application calls connect()</text>
    <text x="94" y="986" font-family="sans-serif" font-size="24" fill="#303a36">to ClusterIP:80.</text>
  </g>

  
  <line x1="490" y1="972" x2="576" y2="972" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="bottom-step-2">
    <rect x="590" y="850" width="420" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 614 880 L 634 880 C 642 880 646 886 646 894 C 646 902 638 906 630 906 L 624 906" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="620" cy="906" r="4" fill="#207448" />
    <text x="660" y="902" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 2:</text>
    <text x="614" y="944" font-family="sans-serif" font-size="24" fill="#303a36">Attached eBPF cgroup/connect4</text>
    <text x="614" y="976" font-family="sans-serif" font-size="24" fill="#303a36">hook intercepts the syscall inside</text>
    <text x="614" y="1008" font-family="sans-serif" font-size="24" fill="#303a36">the kernel before packet</text>
    <text x="614" y="1040" font-family="sans-serif" font-size="24" fill="#303a36">construction.</text>
  </g>

  
  <line x1="1010" y1="972" x2="1096" y2="972" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g id="bottom-step-3">
    <rect x="1110" y="850" width="420" height="245" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <rect x="1134" y="874" width="38" height="34" rx="4" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="1134" y1="886" x2="1172" y2="886" stroke="#db8129" stroke-width="2" />
    <line x1="1134" y1="896" x2="1172" y2="896" stroke="#db8129" stroke-width="2" />
    <text x="1182" y="902" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">Step 3:</text>
    <text x="1134" y="944" font-family="sans-serif" font-size="24" fill="#303a36">Hook queries BPF LB map</text>
    <text x="1134" y="976" font-family="sans-serif" font-size="24" fill="#303a36">and directly rewrites the</text>
    <text x="1134" y="1008" font-family="monospace" font-size="24" fill="#303a36">destination sockaddr_in to</text>
    <text x="1134" y="1040" font-family="monospace" font-size="24" fill="#303a36">10.244.2.9:8000 in memory.</text>
  </g>

  
  <path d="M 1320 1095 L 1320 1132 L 1195 1132 L 1195 1160" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="bottom-step-4">
    <rect x="850" y="1170" width="680" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="876" y="1194" width="44" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 876 1200 L 898 1214 L 920 1200" fill="none" stroke="#207448" stroke-width="2" />
    <text x="932" y="1222" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 4:</text>
    <text x="876" y="1268" font-family="sans-serif" font-size="24" fill="#303a36">Kernel constructs TCP SYN packet with</text>
    <text x="876" y="1304" font-family="monospace" font-size="24" fill="#303a36">dst=10.244.2.9:8000 already populated.</text>
  </g>

  
  <line x1="850" y1="1300" x2="714" y2="1300" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="bottom-step-5">
    <rect x="70" y="1170" width="630" height="260" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <line x1="96" y1="1210" x2="136" y2="1210" stroke="#207448" stroke-width="3" stroke-dasharray="4 3" />
    <polyline points="130,1204 138,1210 130,1216" fill="none" stroke="#207448" stroke-width="3" />
    <text x="150" y="1222" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Step 5:</text>
    <text x="96" y="1268" font-family="sans-serif" font-size="24" fill="#303a36">Wire packet flows directly to target pod</text>
    <text x="96" y="1302" font-family="sans-serif" font-size="24" fill="#303a36">with zero netfilter DNAT, zero conntrack</text>
    <text x="96" y="1336" font-family="sans-serif" font-size="24" fill="#303a36">allocation, and no reverse NAT.</text>
  </g>

</svg>