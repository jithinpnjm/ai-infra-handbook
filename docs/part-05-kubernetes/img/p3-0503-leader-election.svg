<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Leader election with Lease objects</title>
  <desc>Visual infographic explaining Kubernetes leader election for control plane components using Lease objects</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Leader election with Lease objects</text>
  <rect x="520" y="82" width="560" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="113" font-family="monospace" font-size="24" fill="#207448" text-anchor="middle">kubectl get lease -n kube-system</text>

  

  
  <rect x="50" y="150" width="460" height="315" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <rect x="75" y="176" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="87" cy="184" r="2.5" fill="#207448"/>
  <rect x="75" y="198" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="87" cy="206" r="2.5" fill="#207448"/>
  <text x="280" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">control-plane node 1</text>
  
  <rect x="150" y="235" width="260" height="52" rx="26" fill="#db8129"/>
  <text x="280" y="270" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">active leader</text>
  
  <rect x="80" y="315" width="400" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="280" y="350" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-scheduler</text>
  <rect x="80" y="385" width="400" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="280" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-controller-manager</text>

  
  <rect x="570" y="150" width="460" height="315" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="620" y="176" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="632" cy="184" r="2.5" fill="#207448"/>
  <rect x="620" y="198" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="632" cy="206" r="2.5" fill="#207448"/>
  <text x="800" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">node 2</text>
  
  <rect x="700" y="235" width="200" height="52" rx="26" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="270" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">standby</text>
  
  <rect x="600" y="315" width="400" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="350" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-scheduler</text>
  <rect x="600" y="385" width="400" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="800" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-controller-manager</text>

  
  <rect x="1090" y="150" width="460" height="315" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="1140" y="176" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1152" cy="184" r="2.5" fill="#207448"/>
  <rect x="1140" y="198" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1152" cy="206" r="2.5" fill="#207448"/>
  <text x="1320" y="202" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">node 3</text>
  
  <rect x="1220" y="235" width="200" height="52" rx="26" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1320" y="270" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">standby</text>
  
  <rect x="1120" y="315" width="400" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1320" y="350" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-scheduler</text>
  <rect x="1120" y="385" width="400" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1320" y="420" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">kube-controller-manager</text>

  
  <path d="M 210 465 L 210 590 L 336 590" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>
  
  <rect x="250" y="495" width="620" height="50" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="560" y="529" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">renews renewTime every 2 s (retryPeriod)</text>

  
  <rect x="350" y="555" width="900" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <rect x="375" y="575" width="26" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 381 575 L 381 568 A 7 7 0 0 1 395 568 L 395 575" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="810" y="599" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">Lease object in kube-system (coordination.k8s.io/v1)</text>

  

  
  <rect x="50" y="685" width="660" height="175" rx="14" fill="#fdf2f2" stroke="#d9534f" stroke-width="2"/>
  
  <circle cx="115" cy="772" r="28" fill="#d9534f"/>
  <path d="M 103 760 L 127 784 M 127 760 L 103 784" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="170" y="756" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="170" dy="0">leader crashes, no renewal</tspan>
    <tspan x="170" dy="38">within 15 s (leaseDuration)</tspan>
  </text>

  
  <path d="M 710 772 L 826 772" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="840" y="685" width="710" height="175" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="905" cy="772" r="28" fill="#207448"/>
  <path d="M 894 772 L 902 780 L 918 764" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="960" y="756" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="960" dy="0">a standby acquires the Lease</tspan>
    <tspan x="960" dy="38">and takes over, failover about 15 s</tspan>
  </text>

  
  <rect x="50" y="905" width="1500" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 100 938 L 120 946 L 120 970 C 120 986 100 996 100 996 C 100 996 80 986 80 970 L 80 946 Z" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="150" y="955" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0" font-weight="bold">Three active schedulers would cause conflicting bindings and duplicate ReplicaSet creations;</tspan>
    <tspan x="150" dy="36">API servers stay active-active behind a load balancer</tspan>
  </text>
</svg>