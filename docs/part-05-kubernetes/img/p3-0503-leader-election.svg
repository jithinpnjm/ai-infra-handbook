<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Leader election with Lease objects</title>
  <desc>Architecture infographic illustrating Kubernetes leader election among control-plane nodes using Lease objects, normal renewal cycles, and failover takeover when the active leader crashes.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Leader election with Lease objects</text>

  
  
  <rect x="40" y="95" width="1520" height="275" rx="18" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  
  <rect x="60" y="225" width="1480" height="58" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">kube-scheduler</text>

  
  <rect x="60" y="295" width="1480" height="58" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">kube-controller-manager</text>

  
  <g id="node-1">
    <rect x="60" y="110" width="480" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="4" />
      <rect x="4" y="32" width="48" height="18" rx="4" />
      <circle cx="14" cy="15" r="2" fill="#207448" />
      <circle cx="22" cy="15" r="2" fill="#207448" />
      <circle cx="14" cy="41" r="2" fill="#207448" />
      <circle cx="22" cy="41" r="2" fill="#207448" />
      <line x1="38" y1="15" x2="44" y2="15" />
      <line x1="38" y1="41" x2="44" y2="41" />
    </g>
    
    <text x="145" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">control-plane node 1</text>
    
    <rect x="145" y="165" width="180" height="34" rx="6" fill="#207448" />
    <text x="235" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">active leader</text>
  </g>

  
  
  <rect x="1005" y="118" width="130" height="36" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1070" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">standby</text>

  
  <g id="node-2">
    <rect x="560" y="110" width="460" height="100" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(580, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="4" />
      <rect x="4" y="32" width="48" height="18" rx="4" />
      <circle cx="14" cy="15" r="2" fill="#207448" />
      <circle cx="22" cy="15" r="2" fill="#207448" />
      <circle cx="14" cy="41" r="2" fill="#207448" />
      <circle cx="22" cy="41" r="2" fill="#207448" />
      <line x1="38" y1="15" x2="44" y2="15" />
      <line x1="38" y1="41" x2="44" y2="41" />
    </g>
    
    <text x="660" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 2</text>
  </g>

  
  <g id="node-3">
    <rect x="1040" y="110" width="500" height="100" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    
    <g transform="translate(1160, 132)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="18" rx="4" />
      <rect x="4" y="32" width="48" height="18" rx="4" />
      <circle cx="14" cy="15" r="2" fill="#207448" />
      <circle cx="22" cy="15" r="2" fill="#207448" />
      <circle cx="14" cy="41" r="2" fill="#207448" />
      <circle cx="22" cy="41" r="2" fill="#207448" />
      <line x1="38" y1="15" x2="44" y2="15" />
      <line x1="38" y1="41" x2="44" y2="41" />
    </g>
    
    <text x="1240" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 3</text>
  </g>

  
  
  <path d="M 100 370 L 100 475 L 230 475" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="135" y="390" width="630" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="450" y="422" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">renews renewTime every 2 s (retryPeriod)</text>

  
  <rect x="230" y="445" width="1140" height="66" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(250, 450)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="24" width="32" height="26" rx="4" />
    <path d="M 20 24 L 20 14 C 20 8 36 8 36 14 L 36 24" />
    <circle cx="28" cy="37" r="3" fill="#207448" />
  </g>
  <text x="825" y="488" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">Lease object in kube-system (coordination.k8s.io/v1)</text>

  
  
  <rect x="40" y="550" width="700" height="170" rx="16" fill="#ffffff" stroke="#c53030" stroke-width="2.5" />
  
  
  <g transform="translate(65, 607)" stroke="#303a36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="18" rx="4" />
    <rect x="4" y="32" width="48" height="18" rx="4" />
    <circle cx="14" cy="15" r="2" fill="#303a36" />
    <circle cx="22" cy="15" r="2" fill="#303a36" />
    <circle cx="14" cy="41" r="2" fill="#303a36" />
    <circle cx="22" cy="41" r="2" fill="#303a36" />
  </g>
  
  <line x1="60" y1="602" x2="126" y2="668" stroke="#c53030" stroke-width="6" stroke-linecap="round" />
  <line x1="126" y1="602" x2="60" y2="668" stroke="#c53030" stroke-width="6" stroke-linecap="round" />

  
  <text x="430" y="620" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="430" dy="0">leader crashes, no renewal</tspan>
    <tspan x="430" dy="36">within 15 s (leaseDuration)</tspan>
  </text>

  
  <line x1="740" y1="635" x2="840" y2="635" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <rect x="840" y="550" width="720" height="170" rx="16" fill="#fdf6ec" stroke="#db8129" stroke-width="3" />
  
  
  <g transform="translate(865, 607)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="18" width="40" height="32" rx="4" />
    <path d="M 18 18 L 18 10 C 18 4 38 4 38 10 L 38 18" />
    <polyline points="22,34 26,38 34,30" />
  </g>

  
  <text x="1210" y="620" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="1210" dy="0">a standby acquires the Lease</tspan>
    <tspan x="1210" dy="36">and takes over, failover about 15 s</tspan>
  </text>

  
  
  <rect x="40" y="755" width="1520" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(65, 802)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 48 14 L 48 28 C 48 42 28 50 28 50 C 28 50 8 42 8 28 L 8 14 Z" />
    <line x1="28" y1="20" x2="28" y2="30" />
    <circle cx="28" cy="38" r="2" fill="#207448" />
  </g>
  <text x="820" y="805" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="820" dy="0">Three active schedulers would cause conflicting bindings</tspan>
    <tspan x="820" dy="32">and duplicate ReplicaSet creations;</tspan>
    <tspan x="820" dy="32">API servers stay active-active behind a load balancer</tspan>
  </text>

  
  <rect x="40" y="930" width="1520" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 947)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="48" height="44" rx="4" />
    <polyline points="14,22 22,28 14,34" />
    <line x1="26" y1="34" x2="38" y2="34" />
  </g>
  <text x="800" y="986" text-anchor="middle" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">kubectl get lease -n kube-system</text>

</svg>