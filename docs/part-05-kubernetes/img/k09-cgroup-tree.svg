<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Where a pod sits in the cgroup tree depends on its QoS class</title>
  <desc>Diagram showing the Linux cgroup hierarchy under kubepods.slice for Guaranteed, Burstable, and BestEffort QoS classes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#718279" />
    </marker>
  </defs>

  
  <rect width="1600" height="1300" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="42" font-weight="bold" fill="#303a36" text-anchor="middle">Where a pod sits in the cgroup tree depends on its QoS class</text>

  
  <g id="root">
    <path d="M 610 125 L 670 125 L 685 137 L 990 137 L 990 195 L 610 195 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="800" y="172" font-family="monospace" font-size="28" font-weight="bold" fill="#207448" text-anchor="middle">/sys/fs/cgroup</text>
  </g>

  
  <path d="M 800 195 L 800 230" fill="none" stroke="#718279" stroke-width="3" />
  <path d="M 280 230 L 1400 230" fill="none" stroke="#718279" stroke-width="3" />
  <path d="M 280 230 L 280 262" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />
  <path d="M 880 230 L 880 260" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <path d="M 1400 230 L 1400 262" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />

  
  <g id="system-slice">
    <path d="M 70 265 L 140 265 L 155 277 L 490 277 L 490 435 L 70 435 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="280" y="310" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">system.slice</text>
    <text x="280" y="347" font-family="sans-serif" font-size="24" fill="#55625c" text-anchor="middle">OS services, including</text>
    <text x="280" y="380" font-family="monospace" font-size="24" fill="#55625c" text-anchor="middle">kubelet.service and</text>
    <text x="280" y="413" font-family="monospace" font-size="24" fill="#55625c" text-anchor="middle">containerd.service</text>
  </g>

  
  <g id="kubepods-slice">
    <path d="M 540 265 L 630 265 L 645 277 L 1220 277 L 1220 435 L 540 435 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <text x="880" y="318" font-family="monospace" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">kubepods.slice</text>
    <text x="880" y="362" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">all pods; memory.max equals</text>
    <text x="880" y="398" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">node allocatable for pods</text>
  </g>

  
  <g id="user-slice">
    <path d="M 1270 265 L 1330 265 L 1345 277 L 1530 277 L 1530 435 L 1270 435 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="1400" y="358" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">user.slice</text>
  </g>

  
  <path d="M 880 435 L 880 465" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 290 465 L 1310 465" fill="none" stroke="#718279" stroke-width="3" />
  <path d="M 290 465 L 290 495" fill="none" stroke="#207448" stroke-width="3.5" />
  <path d="M 800 465 L 800 572" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />
  <path d="M 1310 465 L 1310 572" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />

  
  
  <g id="col1-note">
    <rect x="80" y="495" width="420" height="66" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="2.5" />
    <text x="290" y="523" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">the path tells you the</text>
    <text x="290" y="550" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">QoS class at a glance</text>
    <path d="M 290 561 L 290 574" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="col1-pod">
    <path d="M 70 580 L 140 580 L 155 592 L 510 592 L 510 740 L 70 740 Z" fill="#ffffff" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    
    <rect x="90" y="604" width="400" height="48" rx="6" fill="#fdf0e2" stroke="#db8129" stroke-width="2" />
    <text x="290" y="637" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">kubepods-pod uid slice</text>
    <text x="290" y="695" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">Guaranteed pods sit directly here</text>
  </g>

  
  <path d="M 290 740 L 290 840" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <g id="col1-container">
    <rect x="70" y="850" width="440" height="160" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3.5" />
    <rect x="180" y="872" width="220" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="290" y="902" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">container</text>
    <text x="290" y="965" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">cri-containerd id scope</text>
  </g>

  
  
  <g id="col2-top">
    <path d="M 580 580 L 650 580 L 665 592 L 1020 592 L 1020 685 L 580 685 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="800" y="642" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">kubepods-burstable.slice</text>
  </g>

  
  <path d="M 800 685 L 800 732" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />

  
  <g id="col2-pod">
    <path d="M 580 740 L 650 740 L 665 752 L 1020 752 L 1020 850 L 580 850 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="800" y="790" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">kubepods-burstable-</text>
    <text x="800" y="825" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">pod uid slice</text>
  </g>

  
  <path d="M 800 850 L 800 892" fill="none" stroke="#718279" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" />

  
  <g id="col2-container">
    <rect x="580" y="900" width="440" height="110" rx="10" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-dasharray="8,8" />
    <text x="800" y="964" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">container</text>
  </g>

  
  
  <g id="col3-top">
    <path d="M 1090 580 L 1160 580 L 1175 592 L 1530 592 L 1530 685 L 1090 685 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="1310" y="642" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">kubepods-besteffort.slice</text>
  </g>

  
  <path d="M 1310 685 L 1310 732" fill="none" stroke="#718279" stroke-width="3" marker-end="url(#arrow-grey)" />

  
  <g id="col3-pod">
    <path d="M 1090 740 L 1160 740 L 1175 752 L 1530 752 L 1530 850 L 1090 850 Z" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-linejoin="round" />
    <text x="1310" y="790" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">kubepods-besteffort-</text>
    <text x="1310" y="825" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">pod uid slice</text>
  </g>

  
  <path d="M 1310 850 L 1310 892" fill="none" stroke="#718279" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-grey)" />

  
  <g id="col3-container">
    <rect x="1090" y="900" width="440" height="110" rx="10" fill="#ffffff" stroke="#9eaba2" stroke-width="2.5" stroke-dasharray="8,8" />
    <text x="1310" y="964" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">container</text>
  </g>

  
  <g id="bottom-side-note">
    <rect x="70" y="1055" width="1460" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="1099" font-family="sans-serif" font-size="25" fill="#303a36" text-anchor="middle">cgroupsPerQOS true builds these slices, and the kubelet sets cpu.weight from requests.</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="70" y="1155" width="1460" height="70" rx="10" fill="#207448" />
    <text x="800" y="1199" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">the path to a pod's cgroup shows its QoS class immediately.</text>
  </g>
</svg>