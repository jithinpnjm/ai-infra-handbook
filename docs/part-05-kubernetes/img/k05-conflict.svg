<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Two writers and a 409 Conflict</title>
  <desc>Swimlane diagram illustrating optimistic concurrency control and 409 Conflict in the Kubernetes API server when two engineers modify a ConfigMap concurrently.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 14 10" refX="12" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 12 5 L 0 9 z" fill="#207448" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 14 10" refX="12" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 12 5 L 0 9 z" fill="#303a36" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 14 10" refX="12" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 12 5 L 0 9 z" fill="#d32f2f" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two writers and a 409 Conflict</text>

  
  <line x1="240" y1="170" x2="240" y2="1015" stroke="#a3c4b2" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="800" y1="170" x2="800" y2="1015" stroke="#a3c4b2" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="1360" y1="170" x2="1360" y2="1015" stroke="#a3c4b2" stroke-width="3" stroke-dasharray="8 8" />

  
  
  <g id="header-engineer-a">
    <rect x="70" y="85" width="340" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(100, 100)">
      <circle cx="28" cy="20" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 52 C 6 38, 16 34, 28 34 C 40 34, 50 38, 50 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="175" y="138" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Engineer A</text>
  </g>

  
  <g id="header-api-server">
    <rect x="580" y="85" width="440" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(605, 100)">
      <ellipse cx="28" cy="14" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 14 V 28 C 6 34, 50 34, 50 28 V 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 28 V 42 C 6 48, 50 48, 50 42 V 28" fill="none" stroke="#207448" stroke-width="4" />
    </g>
    <text x="675" y="138" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">API server (etcd)</text>
  </g>

  
  <g id="header-engineer-b">
    <rect x="1190" y="85" width="340" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1220, 100)">
      <circle cx="28" cy="20" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 6 52 C 6 38, 16 34, 28 34 C 40 34, 50 34, 50 52" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="1295" y="138" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Engineer B</text>
  </g>

  
  <g id="initial-read-section">
    
    <rect x="70" y="195" width="1460" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="800" y="227" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Both engineers first read the same ConfigMap at resourceVersion 5012</text>

    
    <rect x="720" y="255" width="160" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <line x1="240" y1="280" x2="718" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="480" y="271" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">read</text>

    
    <line x1="1360" y1="280" x2="882" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="1120" y="271" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">read</text>
  </g>

  
  <g id="step-1-section">
    
    <rect x="70" y="330" width="1460" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="105" cy="353" r="20" fill="#207448" />
    <text x="105" y="361" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="140" y="363" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1: Engineer A saves</text>

    
    <rect x="720" y="405" width="160" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <line x1="240" y1="430" x2="718" y2="430" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />
    <text x="480" y="420" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">write at </tspan>
      <tspan font-family="monospace">resourceVersion 5012</tspan>
    </text>

    
    <line x1="720" y1="485" x2="242" y2="485" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="480" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#207448">
      <tspan font-family="sans-serif">stored, now </tspan>
      <tspan font-family="monospace">5013</tspan>
    </text>
  </g>

  
  <g id="step-2-section">
    
    <rect x="70" y="540" width="1460" height="46" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="1.5" />
    <circle cx="105" cy="563" r="20" fill="#db8129" />
    <text x="105" y="571" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="140" y="573" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Step 2: Engineer B saves</text>

    
    <rect x="90" y="620" width="560" height="85" rx="10" fill="#fff5eb" stroke="#db8129" stroke-width="2.5" />
    <text x="370" y="656" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="370" dy="0">the server refuses to guess,</tspan>
      <tspan x="370" dy="30">so no edit is lost</tspan>
    </text>

    
    <rect x="720" y="615" width="160" height="110" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2" />

    
    <line x1="1360" y1="635" x2="882" y2="635" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />
    <text x="1120" y="625" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">write at </tspan>
      <tspan font-family="monospace">resourceVersion 5012</tspan>
    </text>

    
    <circle cx="895" cy="700" r="18" fill="#d32f2f" />
    <line x1="883" y1="688" x2="907" y2="712" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="907" y1="688" x2="883" y2="712" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    
    <line x1="915" y1="700" x2="1358" y2="700" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrow-red)" />
    <text x="1135" y="668" text-anchor="middle" font-size="24" font-weight="bold" fill="#d32f2f">
      <tspan x="1135" dy="0" font-family="monospace">409 Conflict,</tspan>
      <tspan x="1135" dy="26" font-family="sans-serif">the object has been modified</tspan>
    </text>
  </g>

  
  <g id="step-3-section">
    
    <rect x="70" y="760" width="1460" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="105" cy="783" r="20" fill="#207448" />
    <text x="105" y="791" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="140" y="793" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3: Engineer B reads the new version, then reapplies the change and saves again</text>

    
    <rect x="720" y="830" width="160" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <line x1="1360" y1="850" x2="882" y2="850" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="1120" y="841" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">read latest</text>

    
    <line x1="1360" y1="920" x2="882" y2="920" stroke="#303a36" stroke-width="3" marker-end="url(#arrow-dark)" />
    <text x="1120" y="911" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
      <tspan font-family="sans-serif">write at </tspan>
      <tspan font-family="monospace">5013</tspan>
    </text>

    
    <line x1="880" y1="975" x2="1358" y2="975" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <text x="1120" y="966" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">stored</text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="70" y="1040" width="1460" height="75" rx="12" fill="#207448" />
    <text x="800" y="1087" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">optimistic concurrency checks only at write time</text>
  </g>
</svg>