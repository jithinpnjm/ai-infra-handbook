<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Two-phase rotation: add the new credential before removing the old one</title>
  <desc>Infographic explaining two-phase credential rotation by adding the new credential, switching consumers, and removing the old credential.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 10 4.5, 0 9" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Two-phase rotation: add the new credential</tspan>
    <tspan x="800" dy="58">before removing the old one</tspan>
  </text>

  
  <g transform="translate(735, 142)">
    <rect width="520" height="92" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" filter="url(#shadow)"/>
    <path d="M 34 62 L 54 26 L 74 62 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="54" y1="38" x2="54" y2="49" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="54" cy="55" r="2" fill="#db8129"/>
    <text x="295" y="32" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="295" dy="0">if you remove the old credential</tspan>
      <tspan x="295" dy="28">first, any consumer you forgot</tspan>
      <tspan x="295" dy="28">to update fails at once.</tspan>
    </text>
  </g>

  
  <g transform="translate(45, 255)">
    <rect width="340" height="545" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <circle cx="170" cy="46" r="24" fill="#207448"/>
    <text x="170" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <text x="170" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">old credential</tspan>
      <tspan x="170" dy="38">only</tspan>
    </text>
    
    <rect x="85" y="210" width="170" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(130, 298) rotate(-45)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="22" y1="0" x2="68" y2="0" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="16" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
      <line x1="62" y1="0" x2="62" y2="16" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    <text x="170" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="170" dy="0">consumers use</tspan>
      <tspan x="170" dy="32">the old value</tspan>
    </text>
  </g>

  
  <line x1="385" y1="527" x2="433" y2="527" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <g transform="translate(435, 255)">
    <rect width="340" height="545" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <circle cx="170" cy="46" r="24" fill="#207448"/>
    <text x="170" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <text x="170" y="105" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">add new</tspan>
      <tspan x="170" dy="36">credential,</tspan>
      <tspan x="170" dy="36">both work</tspan>
    </text>
    
    <g transform="translate(25, 210)">
      
      <rect x="0" y="0" width="135" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(68, 88) rotate(-45)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="16" y1="0" x2="50" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="0" x2="34" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="45" y1="0" x2="45" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <rect x="155" y="0" width="135" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(222, 88) rotate(-45)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="16" y1="0" x2="50" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="0" x2="34" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="45" y1="0" x2="45" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
    
    <text x="170" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="170" dy="0">old and new both</tspan>
      <tspan x="170" dy="32">valid for a while</tspan>
    </text>
  </g>

  
  <line x1="775" y1="527" x2="823" y2="527" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <g transform="translate(825, 255)">
    <rect width="340" height="545" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <circle cx="170" cy="46" r="24" fill="#207448"/>
    <text x="170" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <text x="170" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">switch</tspan>
      <tspan x="170" dy="38">consumers over</tspan>
    </text>
    
    
    <g transform="translate(18, 205)">
      <rect x="0" y="0" width="70" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <ellipse cx="35" cy="30" rx="22" ry="10" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 13 30 L 13 60 A 22 10 0 0 0 57 60 L 57 30" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 13 60 L 13 90 A 22 10 0 0 0 57 90 L 57 60" fill="none" stroke="#207448" stroke-width="3"/>
      <g transform="translate(35, 140) rotate(-45)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="12" y1="0" x2="30" y2="0" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="0" x2="22" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    
    <path d="M 88 255 L 133 235" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 88 297 L 133 297" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 88 340 L 133 360" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)"/>

    
    <rect x="135" y="205" width="185" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="227.5" y="239" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">consumer A</text>
    <rect x="135" y="271" width="185" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="227.5" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">consumer B</text>
    <rect x="135" y="337" width="185" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="227.5" y="371" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">consumer C</text>

    
    <text x="170" y="445" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="170" dy="0">every consumer</tspan>
      <tspan x="170" dy="32">moves to the</tspan>
      <tspan x="170" dy="32">new value</tspan>
    </text>
  </g>

  
  <line x1="1165" y1="527" x2="1213" y2="527" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <g transform="translate(1215, 255)">
    <rect width="340" height="545" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <circle cx="170" cy="46" r="24" fill="#207448"/>
    <text x="170" y="55" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <text x="170" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="170" dy="0">remove</tspan>
      <tspan x="170" dy="38">old credential</tspan>
    </text>
    
    <g transform="translate(25, 210)">
      
      <rect x="0" y="0" width="135" height="175" rx="12" fill="#ffffff" stroke="#8c9890" stroke-width="2"/>
      <g transform="translate(68, 88) rotate(-45)" opacity="0.45">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#303a36" stroke-width="4"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#303a36" stroke-width="2.5"/>
        <line x1="16" y1="0" x2="50" y2="0" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="0" x2="34" y2="13" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
        <line x1="45" y1="0" x2="45" y2="13" stroke="#303a36" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <line x1="22" y1="22" x2="113" y2="153" stroke="#303a36" stroke-width="5" stroke-linecap="round"/>
      <line x1="113" y1="22" x2="22" y2="153" stroke="#303a36" stroke-width="5" stroke-linecap="round"/>

      
      <rect x="155" y="0" width="135" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <g transform="translate(222, 88) rotate(-45)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
        <line x1="16" y1="0" x2="50" y2="0" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="0" x2="34" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <line x1="45" y1="0" x2="45" y2="13" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <circle cx="222" cy="148" r="12" fill="#207448"/>
      <polyline points="216,148 220,152 228,144" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  
  <g transform="translate(45, 835)">
    <rect width="1510" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    
    <g transform="translate(48, 48)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#207448"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#207448" stroke-width="4"/>
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#207448" stroke-width="4"/>
      <line x1="-15" y1="15" x2="15" y2="-15" stroke="#207448" stroke-width="4"/>
    </g>
    <text x="800" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="800" dy="0">reload: file mounts refresh through the kubelet but the app must re-read them,</tspan>
      <tspan x="800" dy="32">environment variables need a pod restart.</tspan>
    </text>
  </g>

  
  <g transform="translate(45, 965)">
    <rect width="1510" height="74" rx="12" fill="#207448" filter="url(#shadow)"/>
    <text x="800" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      add the new credential first, move every consumer, then remove the old one.
    </text>
  </g>
</svg>