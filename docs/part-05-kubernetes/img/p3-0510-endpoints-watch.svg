<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Watching endpoints change during a rollout</title>
  <desc>Visualization of kubectl get endpoints watch output during a pod rollout, alongside readiness probe settings and live cluster updates.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Watching endpoints change during a rollout</text>

  
  <g id="watch-container">
    <rect x="50" y="110" width="1020" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="50" y="110" width="1020" height="70" rx="16" fill="#207448"/>
    <rect x="50" y="160" width="1020" height="20" fill="#207448"/>

    
    <circle cx="85" cy="145" r="9" fill="#e8f1ea" opacity="0.8"/>
    <circle cx="115" cy="145" r="9" fill="#e8f1ea" opacity="0.8"/>
    <circle cx="145" cy="145" r="9" fill="#e8f1ea" opacity="0.8"/>

    
    <text x="180" y="154" font-family="monospace" font-size="26" font-weight="bold" fill="#ffffff">kubectl get endpoints alpaca-prod --watch</text>

    
    <text x="75" y="215" font-family="sans-serif" font-size="24" fill="#303a36">Annotated kubectl get endpoints alpaca-prod --watch output</text>

    
    <g id="row-1">
      <circle cx="95" cy="285" r="24" fill="#207448"/>
      <text x="95" y="294" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <rect x="135" y="250" width="910" height="95" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>
      <text x="155" y="285" font-family="monospace" font-size="24" fill="#303a36">10.112.1.54:8080,10.112.2.84:8080,10.112.2.85:8080</text>
      <text x="155" y="325" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">all three pods ready</text>
    </g>

    
    <g id="row-2">
      <circle cx="95" cy="405" r="24" fill="#207448"/>
      <text x="95" y="414" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <rect x="135" y="370" width="910" height="95" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>
      <text x="155" y="405" font-family="monospace" font-size="24" fill="#303a36">10.112.1.54:8080,10.112.2.84:8080</text>
      <text x="155" y="445" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">one pod removed</text>
    </g>

    
    <g id="row-3">
      <circle cx="95" cy="525" r="24" fill="#db8129"/>
      <text x="95" y="534" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <rect x="135" y="490" width="910" height="95" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
      <text x="155" y="525" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">&lt;none&gt;</text>
      <text x="155" y="565" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">no ready endpoints, connections are refused</text>
    </g>

    
    <g id="row-4">
      <circle cx="95" cy="645" r="24" fill="#207448"/>
      <text x="95" y="654" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <rect x="135" y="610" width="910" height="95" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>
      <text x="155" y="645" font-family="monospace" font-size="24" fill="#303a36">10.112.2.90:8080</text>
      <text x="155" y="685" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">first new pod ready</text>
    </g>

    
    <g id="row-5">
      <circle cx="95" cy="765" r="24" fill="#207448"/>
      <text x="95" y="774" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <rect x="135" y="730" width="910" height="95" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>
      <text x="155" y="765" font-family="monospace" font-size="24" fill="#303a36">10.112.1.57:8080,10.112.2.90:8080</text>
      <text x="155" y="805" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">second</text>
    </g>

    
    <g id="row-6">
      <circle cx="95" cy="885" r="24" fill="#207448"/>
      <text x="95" y="894" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
      <rect x="135" y="850" width="910" height="95" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>
      <text x="155" y="885" font-family="monospace" font-size="24" fill="#303a36">10.112.0.28:8080,10.112.1.57:8080,10.112.2.90:8080</text>
      <text x="155" y="925" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">all three new pods</text>
    </g>

    
    <g transform="translate(135, 970)">
      
      <g transform="translate(10, 15)">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4"/>
        <polyline points="28,14 28,28 40,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="80" y="52" font-family="sans-serif" font-size="24" fill="#303a36">one row per event with a plain-language label beside each</text>
    </g>
  </g>

  
  <g id="probe-container">
    <rect x="1110" y="110" width="440" height="970" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <rect x="1110" y="110" width="440" height="70" rx="16" fill="#207448"/>
    <rect x="1110" y="160" width="440" height="20" fill="#207448"/>
    <text x="1140" y="154" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Readiness Probe</text>

    
    <g transform="translate(1140, 210)">
      <rect x="0" y="0" width="70" height="60" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 8 32 L 24 32 L 32 14 L 42 46 L 50 32 L 62 32" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="1230" y="248" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Health Checks</text>

    
    <rect x="1140" y="300" width="380" height="740" rx="12" fill="#ffffff" stroke="#c0d4c5" stroke-width="2"/>

    
    <text x="1165" y="355" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">GET /ready on 8080</text>
    <text x="1165" y="395" font-family="sans-serif" font-size="24" fill="#303a36">every 2 s,</text>

    
    <line x1="1165" y1="435" x2="1495" y2="435" stroke="#e8f1ea" stroke-width="3"/>

    
    <g transform="translate(1165, 470)">
      
      <path d="M 0 10 Q 0 0 10 0 L 30 0 Q 40 0 40 10 L 40 30 Q 40 50 20 60 Q 0 50 0 30 Z" fill="none" stroke="#db8129" stroke-width="3"/>
      <text x="16" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">!</text>
      <text x="55" y="32" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Failure</text>
      <text x="55" y="62" font-family="monospace" font-size="24" fill="#db8129">failureThreshold 3:</text>
      <text x="0" y="110" font-family="sans-serif" font-size="24" fill="#303a36">three failures remove</text>
      <text x="0" y="145" font-family="sans-serif" font-size="24" fill="#303a36">the pod</text>
    </g>

    
    <line x1="1165" y1="660" x2="1495" y2="660" stroke="#e8f1ea" stroke-width="3"/>

    
    <g transform="translate(1165, 695)">
      
      <path d="M 0 10 Q 0 0 10 0 L 30 0 Q 40 0 40 10 L 40 30 Q 40 50 20 60 Q 0 50 0 30 Z" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 10 30 L 18 38 L 30 22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <text x="55" y="32" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Success</text>
      <text x="55" y="62" font-family="monospace" font-size="24" fill="#207448">successThreshold 1:</text>
      <text x="0" y="110" font-family="sans-serif" font-size="24" fill="#303a36">one success adds it</text>
      <text x="0" y="145" font-family="sans-serif" font-size="24" fill="#303a36">back</text>
    </g>

    
    <rect x="1160" y="900" width="340" height="110" rx="8" fill="#e8f1ea"/>
    <text x="1175" y="940" font-family="sans-serif" font-size="24" fill="#303a36">Endpoints track</text>
    <text x="1175" y="975" font-family="sans-serif" font-size="24" fill="#207448" font-weight="bold">ready pods in real time</text>
  </g>

  
  <g id="footer-bar">
    <rect x="50" y="1105" width="1500" height="70" rx="12" fill="#207448"/>
    <text x="800" y="1149" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">each new line is one change the cluster had to handle; a watch is a subscription, not repeated asking</text>
  </g>
</svg>