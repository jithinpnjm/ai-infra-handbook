<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Watching endpoints change during a rollout</title>
  <desc>Visual breakdown of kubectl get endpoints --watch output showing transition states during a deployment rollout alongside readiness probe mechanics.</desc>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Watching endpoints change during a rollout</text>

  
  <rect x="40" y="130" width="1140" height="810" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g>
    <rect x="70" y="155" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="70" y1="173" x2="126" y2="173" stroke="#207448" stroke-width="3"/>
    <path d="M 80 185 L 86 190 L 80 195" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="92" y1="195" x2="100" y2="195" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="145" y="190" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">kubectl get endpoints alpaca-prod --watch</text>
  </g>

  
  <g>
    <rect x="55" y="230" width="1110" height="96" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <circle cx="95" cy="278" r="24" fill="#207448"/>
    <text x="95" y="278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="135" y="286" font-family="monospace" font-size="24" fill="#303a36">10.112.1.54:8080,10.112.2.84:8080,10.112.2.85:8080</text>
    <text x="855" y="286" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">all three pods ready</text>
  </g>

  
  <g>
    <rect x="55" y="342" width="1110" height="96" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <circle cx="95" cy="390" r="24" fill="#207448"/>
    <text x="95" y="390" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="135" y="398" font-family="monospace" font-size="24" fill="#303a36">10.112.1.54:8080,10.112.2.84:8080</text>
    <text x="855" y="398" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">one pod removed</text>
  </g>

  
  <g>
    <rect x="55" y="454" width="1110" height="96" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    <circle cx="95" cy="502" r="24" fill="#207448"/>
    <text x="95" y="502" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="135" y="510" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">&lt;none&gt;</text>
    <text x="250" y="510" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">no ready endpoints, connections are refused</text>
  </g>

  
  <g>
    <rect x="55" y="566" width="1110" height="96" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <circle cx="95" cy="614" r="24" fill="#207448"/>
    <text x="95" y="614" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="135" y="622" font-family="monospace" font-size="24" fill="#303a36">10.112.2.90:8080</text>
    <text x="855" y="622" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">first new pod ready</text>
  </g>

  
  <g>
    <rect x="55" y="678" width="1110" height="96" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <circle cx="95" cy="726" r="24" fill="#207448"/>
    <text x="95" y="726" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="135" y="734" font-family="monospace" font-size="24" fill="#303a36">10.112.1.57:8080,10.112.2.90:8080</text>
    <text x="855" y="734" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">second</text>
  </g>

  
  <g>
    <rect x="55" y="790" width="1110" height="96" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>
    <circle cx="95" cy="838" r="24" fill="#207448"/>
    <text x="95" y="838" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
    <text x="135" y="846" font-family="monospace" font-size="24" fill="#303a36">10.112.0.28:8080,10.112.1.57:8080,10.112.2.90:8080</text>
    <text x="855" y="846" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">all three new pods</text>
  </g>

  
  <rect x="1220" y="130" width="340" height="810" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g>
    <circle cx="1390" cy="180" r="26" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 1390 180 V 166 M 1390 180 H 1403" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1390" y1="156" x2="1390" y2="160" stroke="#207448" stroke-width="3"/>
  </g>

  
  <rect x="1238" y="230" width="304" height="656" rx="8" fill="#ffffff" stroke="#c4d8c8" stroke-width="1.5"/>

  
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1258" y="295" font-family="monospace" font-weight="bold" fill="#207448">GET /ready on 8080</tspan>
    <tspan x="1258" y="345">every 2 s,</tspan>

    <tspan x="1258" y="445" font-family="monospace" font-weight="bold" fill="#207448">failureThreshold</tspan>
    <tspan x="1258" y="495">3: three failures</tspan>
    <tspan x="1258" y="545">remove the pod,</tspan>

    <tspan x="1258" y="645" font-family="monospace" font-weight="bold" fill="#207448">successThreshold</tspan>
    <tspan x="1258" y="695">1: one success</tspan>
    <tspan x="1258" y="745">adds it back</tspan>
  </text>

  
  <rect x="40" y="990" width="1520" height="64" rx="8" fill="#207448"/>
  <text x="800" y="1032" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">each new line is one change the cluster had to handle; a watch is a subscription, not repeated asking</text>
</svg>