<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Secret encryption: provider order and key rotation</title>
  <desc>Infographic explaining Kubernetes EncryptionConfiguration provider order, key rotation, and etcd value inspection.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c62828"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="65" font-family="sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#303a36">Secret encryption: provider order and key rotation</text>

  
  <text x="50" y="130" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">providers list in EncryptionConfiguration</text>

  
  <g id="panel-correct">
    <rect x="50" y="155" width="850" height="235" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 72 185 L 94 175 L 116 185 V 205 C 116 220 94 230 94 230 C 94 230 72 220 72 205 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 82 203 L 90 211 L 106 195" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="135" y="208" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Correct</text>

    
    <rect x="75" y="230" width="430" height="55" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <text x="290" y="266" font-family="monospace" font-size="24" text-anchor="middle" fill="#303a36">secretbox key secret-key-1</text>

    <rect x="530" y="230" width="180" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="620" y="266" font-family="monospace" font-size="24" text-anchor="middle" fill="#303a36">identity</text>

    
    <rect x="75" y="300" width="800" height="75" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    <text x="475" y="332" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
      <tspan x="475" dy="0">encryption always uses the first entry;</tspan>
      <tspan x="475" dy="28">identity (plain text) goes last</tspan>
    </text>
  </g>

  
  <g id="panel-wrong">
    <rect x="50" y="410" width="850" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 72 440 L 94 430 L 116 440 V 460 C 116 475 94 485 94 485 C 94 485 72 475 72 460 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 85 450 L 103 468 M 103 450 L 85 468" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
    
    <text x="135" y="462" font-family="sans-serif" font-size="32" font-weight="bold" fill="#c62828">Wrong</text>

    
    <rect x="75" y="490" width="250" height="65" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
    <text x="200" y="531" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">identity first</text>

    
    <line x1="325" y1="522" x2="373" y2="522" stroke="#c62828" stroke-width="3" marker-end="url(#arrow-red)"/>

    
    <rect x="375" y="490" width="470" height="65" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="610" y="531" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">Secrets are not encrypted</text>
  </g>

  
  <g id="panel-rotation">
    <rect x="50" y="610" width="850" height="425" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 76 662 A 18 18 0 1 1 112 662" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 112 662 A 18 18 0 1 1 76 662" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 107 655 L 113 662 L 106 669" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 81 669 L 75 662 L 82 655" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="135" y="668" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Rotation</text>

    
    <rect x="75" y="695" width="230" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="190" y="731" font-family="monospace" font-size="24" text-anchor="middle" fill="#303a36">secret-key-2</text>

    <line x1="305" y1="722" x2="343" y2="722" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    <rect x="345" y="695" width="530" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="610" y="731" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">new writes use secret-key-2</text>

    
    <rect x="75" y="765" width="230" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="190" y="806" font-family="monospace" font-size="24" text-anchor="middle" fill="#303a36">secret-key-1</text>

    <line x1="305" y1="797" x2="343" y2="797" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    <rect x="345" y="765" width="530" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="610" y="793" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
      <tspan x="610" dy="0">secret-key-1 stays to decrypt</tspan>
      <tspan x="610" dy="28">existing Secrets</tspan>
    </text>

    
    <rect x="75" y="850" width="800" height="165" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="475" y="890" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#c62828">
      <tspan x="475" dy="0">remove secret-key-1 too early:</tspan>
      <tspan x="475" dy="36" font-family="monospace">unable to transform key,</tspan>
      <tspan x="475" dy="32" font-family="monospace">no matching key was found</tspan>
    </text>
  </g>

  
  <g id="panel-etcd">
    <rect x="940" y="155" width="610" height="880" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <ellipse cx="985" cy="190" rx="22" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 963 190 V 220 C 963 226 1007 226 1007 220 V 190" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 963 205 C 963 211 1007 211 1007 205" fill="none" stroke="#207448" stroke-width="4"/>
    
    <text x="1035" y="208" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">etcd value check</text>

    
    <rect x="965" y="255" width="560" height="235" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <rect x="980" y="280" width="530" height="80" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1"/>
    <text x="1245" y="328" font-family="monospace" font-size="24" text-anchor="middle" fill="#303a36">k8s:enc:secretbox:v1:secret-key-1:</text>

    
    <line x1="1245" y1="360" x2="1245" y2="393" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    <rect x="1010" y="395" width="470" height="65" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1245" y="436" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">prefix means encrypted</text>

    
    <rect x="965" y="520" width="560" height="495" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <rect x="985" y="555" width="520" height="425" rx="8" fill="#f5f8f5" stroke="#303a36" stroke-width="1"/>
    <text x="1245" y="680" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#303a36">
      <tspan x="1245" dy="0">login1 created before the key</tspan>
      <tspan x="1245" dy="48">shows readable text,</tspan>
      <tspan x="1245" dy="56">only new or altered Secrets</tspan>
      <tspan x="1245" dy="48">use the active key</tspan>
    </text>
  </g>
</svg>