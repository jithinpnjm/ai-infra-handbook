<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240">
  <title>Grants that quietly equal cluster-admin</title>
  <desc>Hub-and-spoke diagram showing six Kubernetes permissions that effectively grant full cluster-admin access, along with five mitigations below.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1240" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Grants that quietly equal cluster-admin</text>

  
  
  <path d="M 570 230 H 720 V 410" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 570 490 H 630" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 570 750 H 720 V 570" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 1030 230 H 880 V 410" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 1030 490 H 970" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />
  
  <path d="M 1030 750 H 880 V 570" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="630" y="410" width="340" height="160" rx="16" fill="#db8129" stroke="#b86618" stroke-width="3" />
  
  <g transform="translate(778, 430)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 4 34 L 40 34 L 44 14 L 31 22 L 22 8 L 13 22 L 0 14 Z" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="22" cy="8" r="2" fill="#ffffff" />
    <circle cx="0" cy="14" r="2" fill="#ffffff" />
    <circle cx="44" cy="14" r="2" fill="#ffffff" />
  </g>
  <text x="800" y="525" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">cluster-admin</text>

  
  <rect x="40" y="110" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 134)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 4 14 L 24 3 L 44 14 L 44 34 L 24 45 L 4 34 Z" />
    <path d="M 24 3 L 24 24 L 44 34" />
    <path d="M 24 24 L 4 34" />
  </g>
  <text x="128" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">create pods:</text>
  <text x="68" y="210" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="68" dy="0">roughly equivalent to reading</tspan>
    <tspan x="68" dy="30">secrets and tokens in the namespace</tspan>
    <tspan x="68" dy="30">(mount another ServiceAccount token,</tspan>
    <tspan x="68" dy="30">or run privileged if PSA is absent)</tspan>
  </text>

  
  <rect x="40" y="370" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 394)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3" y="6" width="42" height="34" rx="4" />
    <path d="M 11 18 L 19 23 L 11 28" />
    <line x1="23" y1="28" x2="33" y2="28" />
  </g>
  <text x="128" y="425" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pods/exec in prod:</text>
  <text x="68" y="480" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="68" dy="0">shell inside a pod with</tspan>
    <tspan x="68" dy="32">its secrets and token</tspan>
  </text>

  
  <rect x="40" y="630" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 654)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="18" cy="20" r="11" />
    <path d="M 26 26 L 41 41" />
    <path d="M 34 34 L 39 29" />
    <path d="M 38 38 L 43 33" />
    <circle cx="18" cy="20" r="4" fill="#207448" />
  </g>
  <text x="128" y="675" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="128" dy="0">get, list, watch</tspan>
    <tspan x="128" dy="32">on secrets:</tspan>
  </text>
  <text x="68" y="760" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="68" dy="0">listing reveals contents</tspan>
  </text>

  
  <rect x="1030" y="110" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1058, 134)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 6 42 L 18 42 L 18 30 L 30 30 L 30 18 L 42 18" />
    <path d="M 30 6 L 42 18 L 42 6 Z" fill="#207448" />
  </g>
  <text x="1118" y="155" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="1118" dy="0">escalate and bind</tspan>
    <tspan x="1118" dy="32">verbs on roles:</tspan>
  </text>
  <text x="1058" y="235" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1058" dy="0">allow granting permissions</tspan>
    <tspan x="1058" dy="30">you do not hold</tspan>
  </text>

  
  <rect x="1030" y="370" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1058, 394)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 6 18 C 12 12, 18 14, 24 20 C 30 14, 36 12, 42 18 C 42 32, 28 40, 24 40 C 20 40, 6 32, 6 18 Z" />
    <ellipse cx="16" cy="23" rx="4" ry="3" />
    <ellipse cx="32" cy="23" rx="4" ry="3" />
  </g>
  <text x="1118" y="425" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">impersonate:</text>
  <text x="1058" y="480" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1058" dy="0">act as another identity</tspan>
    <tspan x="1058" dy="32">such as cluster-admin</tspan>
  </text>

  
  <rect x="1030" y="630" width="530" height="240" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1058, 654)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="8" width="40" height="14" rx="2" />
    <rect x="4" y="26" width="40" height="14" rx="2" />
    <circle cx="12" cy="15" r="2" fill="#207448" />
    <circle cx="12" cy="33" r="2" fill="#207448" />
    <line x1="28" y1="15" x2="38" y2="15" />
    <line x1="28" y1="33" x2="38" y2="33" />
  </g>
  <text x="1118" y="685" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">nodes/proxy:</text>
  <text x="1058" y="740" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1058" dy="0">reaches the kubelet</tspan>
    <tspan x="1058" dy="32">on the node</tspan>
  </text>

  
  <rect x="40" y="910" width="288" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(162, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 28 6 C 24 2, 16 2, 12 6 C 9 9, 8 13, 10 17 L 3 38 C 2 41, 5 44, 8 43 L 29 36 C 33 38, 37 37, 40 34 C 44 30, 44 22, 40 18 L 33 25 L 26 22 L 24 15 Z" />
  </g>
  <text x="184" y="1020" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="184" dy="0">tighten roles and</tspan>
    <tspan x="184" dy="32">remove wildcards</tspan>
  </text>

  
  <rect x="348" y="910" width="288" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(470, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 22 4 L 40 10 L 40 24 C 40 35, 22 43, 22 43 C 22 43, 4 35, 4 24 L 4 10 Z" />
    <path d="M 13 23 L 19 29 L 31 17" />
  </g>
  <text x="492" y="990" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="492" dy="0">Pod Security</tspan>
    <tspan x="492" dy="30">Admission or</tspan>
    <tspan x="492" dy="30">admission policy</tspan>
    <tspan x="492" dy="30">for what pods</tspan>
    <tspan x="492" dy="30">may look like</tspan>
  </text>

  
  <rect x="656" y="910" width="288" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(778, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="8" y="18" width="28" height="22" rx="3" />
    <path d="M 14 18 L 14 11 C 14 6, 30 6, 30 11 L 30 18" />
    <line x1="4" y1="4" x2="40" y2="40" stroke-width="3.5" />
  </g>
  <text x="800" y="990" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">no cluster-wide</tspan>
    <tspan x="800" dy="30">list or watch</tspan>
    <tspan x="800" dy="30">on secrets for</tspan>
    <tspan x="800" dy="30">monitoring or</tspan>
    <tspan x="800" dy="30">view roles</tspan>
  </text>

  
  <rect x="964" y="910" width="288" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1086, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="22" cy="14" r="7" />
    <path d="M 8 36 C 8 28, 14 24, 22 24 C 30 24, 36 28, 36 36" />
    <line x1="4" y1="4" x2="40" y2="40" stroke-width="3.5" />
  </g>
  <text x="1108" y="1005" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1108" dy="0">never bind roles</tspan>
    <tspan x="1108" dy="32">to system:</tspan>
    <tspan x="1108" dy="32">authenticated</tspan>
  </text>

  
  <rect x="1272" y="910" width="288" height="290" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(1394, 925)" stroke="#207448" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="22" cy="22" r="18" />
    <path d="M 22 10 L 22 22 L 30 26" />
  </g>
  <text x="1416" y="990" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1416" dy="0">sudo-style</tspan>
    <tspan x="1416" dy="30">impersonation</tspan>
    <tspan x="1416" dy="30">with --as for</tspan>
    <tspan x="1416" dy="30">one command,</tspan>
    <tspan x="1416" dy="30">audited</tspan>
  </text>
</svg>