<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>Three ways into one ConfigMap, and which ones pick up a change</title>
  <desc>Visual comparison showing how environment variables, a volumeMount directory, and a subPath single file mount consume a Kubernetes ConfigMap, and which access methods pick up live configuration updates.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#788880" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Three ways into one ConfigMap, </tspan>
    <tspan x="800" dy="56">and which ones pick up a change</tspan>
  </text>

  
  <g id="configmap-group">
    
    <rect x="60" y="325" width="380" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />

    
    <circle cx="105" cy="370" r="24" fill="#207448" />
    <text x="105" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

    
    <g transform="translate(150, 346)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="12" rx="22" ry="8" fill="#ffffff" />
      <path d="M 2 12 V 34 C 2 38.4 11.9 42 24 42 C 36.1 42 46 38.4 46 34 V 12" />
      <path d="M 2 23 C 2 27.4 11.9 31 24 31 C 36.1 31 46 27.4 46 23" />
    </g>

    
    <text x="250" y="438" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="250" dy="0">trainer-config </tspan>
      <tspan x="250" dy="36">(ConfigMap)</tspan>
    </text>

    
    <rect x="90" y="520" width="320" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="250" y="559" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">LOG_LEVEL</text>

    
    <rect x="90" y="605" width="320" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="250" y="644" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">hparams.yaml</text>
  </g>

  

  
  <g id="door-1-group">
    
    <path d="M 440 420 H 550 Q 580 420 580 370 V 345 Q 580 320 610 320 H 936" fill="none" stroke="#788880" stroke-width="4" marker-end="url(#arrow-grey)" />

    
    <rect x="610" y="250" width="260" height="44" rx="8" fill="#ffffff" stroke="#788880" stroke-width="2" />
    <text x="740" y="280" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">envFrom or env</text>

    
    <rect x="555" y="345" width="370" height="50" rx="10" fill="#f0f3f1" stroke="#9aa8a1" stroke-width="2" />
    <text x="740" y="378" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">no update while running</text>
  </g>

  
  <g id="door-2-group">
    
    <circle cx="485" cy="460" r="24" fill="#207448" />
    <text x="485" y="468" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

    
    <line x1="440" y1="520" x2="936" y2="520" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="525" y="450" width="230" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="640" y="480" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">volumeMount</text>

    
    <rect x="480" y="545" width="420" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="690" y="580" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="690" dy="0">updates in about </tspan>
      <tspan x="690" dy="30">1 to 2 minutes via </tspan>
      <tspan x="690" dy="30">the ..data symlink swap</tspan>
    </text>
  </g>

  
  <g id="door-3-group">
    
    <path d="M 440 620 H 550 Q 580 620 580 670 V 700 Q 580 725 610 725 H 936" fill="none" stroke="#788880" stroke-width="4" marker-end="url(#arrow-grey)" />

    
    <rect x="620" y="655" width="160" height="44" rx="8" fill="#ffffff" stroke="#788880" stroke-width="2" />
    <text x="700" y="685" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">subPath</text>

    
    <rect x="650" y="750" width="240" height="50" rx="10" fill="#fff6ed" stroke="#db8129" stroke-width="3" />
    <text x="770" y="783" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">never updates</text>
  </g>

  
  <g id="trainer-container-group">
    
    <rect x="940" y="160" width="600" height="695" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

    
    
    <g transform="translate(1080, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="46" height="36" rx="5" />
      <line x1="2" y1="16" x2="48" y2="16" />
      <circle cx="10" cy="10" r="2.5" fill="#207448" />
      <circle cx="18" cy="10" r="2.5" fill="#207448" />
      <circle cx="26" cy="10" r="2.5" fill="#207448" />
    </g>

    
    <text x="1240" y="210" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">trainer</text>

    
    <g transform="translate(1350, 178)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="9" />
      <circle cx="22" cy="22" r="3" fill="#207448" />
      <line x1="22" y1="3" x2="22" y2="8" />
      <line x1="22" y1="36" x2="22" y2="41" />
      <line x1="3" y1="22" x2="8" y2="22" />
      <line x1="36" y1="22" x2="41" y2="22" />
      <line x1="8.5" y1="8.5" x2="12" y2="12" />
      <line x1="32" y1="32" x2="35.5" y2="35.5" />
      <line x1="8.5" y1="35.5" x2="12" y2="32" />
      <line x1="32" y1="12" x2="35.5" y2="8.5" />
    </g>

    
    <rect x="970" y="245" width="540" height="150" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1240" y="298" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">environment variables</text>
    <text x="1240" y="358" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#506058">read at container start</text>

    
    <rect x="970" y="445" width="540" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="1240" y="508" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1240" dy="0">file at /etc/trainer/hparams.yaml </tspan>
      <tspan x="1240" dy="34">read-only</tspan>
    </text>

    
    <rect x="970" y="650" width="540" height="150" rx="12" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="1240" y="735" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">single file bind mount</text>
  </g>

  
  <rect x="970" y="875" width="540" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1240" y="908" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1240" dy="0">to pick up an env change, </tspan>
    <tspan x="1240" dy="30">start a new container</tspan>
  </text>

  
  <g id="takeaway-bar">
    <rect x="50" y="975" width="1500" height="70" rx="12" fill="#207448" />
    <text x="800" y="1019" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">env values are fixed at start, volumes refresh in place, and subPath never sees a change.</text>
  </g>
</svg>