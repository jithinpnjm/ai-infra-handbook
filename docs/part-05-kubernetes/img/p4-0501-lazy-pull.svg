<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Traditional Pull vs Lazy Pulling with Remote Snapshotters</title>
  <desc>A visual comparison between traditional image pulling with overlayfs and lazy pulling using remote snapshotters like SOCI, eStargz, and Nydus for large container workloads.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Traditional Pull vs Lazy Pulling with Remote Snapshotters</text>

  
  <g id="workflow-a">
    
    <rect x="40" y="90" width="1520" height="470" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Traditional Pull (containerd overlayfs)</text>

    
    <rect x="60" y="155" width="340" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(80, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 36 A 14 14 0 0 1 18 14 A 18 18 0 0 1 44 16 A 12 12 0 0 1 50 36 Z" />
      <line x1="28" y1="26" x2="28" y2="48" />
      <polyline points="20 40 28 48 36 40" />
    </g>
    
    <circle cx="175" cy="203" r="24" fill="#207448" />
    <text x="175" y="211" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="212" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 1</text>
    
    <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">Download all layer</tspan>
      <tspan x="80" dy="30">tarballs sequentially</tspan>
      <tspan x="80" dy="30">or in parallel over</tspan>
      <tspan x="80" dy="30">network (20 GB</tspan>
      <tspan x="80" dy="30">total; node network</tspan>
      <tspan x="80" dy="30">saturated, waiting</tspan>
      <tspan x="80" dy="30">15-30 minutes)</tspan>
    </text>

    
    <line x1="400" y1="347" x2="428" y2="347" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="430" y="155" width="340" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(450, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="14" rx="22" ry="8" />
      <path d="M 6 14 v 14 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -14" />
      <path d="M 6 28 v 14 c 0 4.4 9.8 8 22 8 s 22 -3.6 22 -8 v -14" />
    </g>
    
    <circle cx="545" cy="203" r="24" fill="#207448" />
    <text x="545" y="211" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="582" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 2</text>
    
    <text x="450" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="450" dy="0">Unpack tarballs</tspan>
      <tspan x="450" dy="34">sequentially into</tspan>
      <tspan x="450" dy="34">local rootfs</tspan>
      <tspan x="450" dy="34">snapshots on disk</tspan>
    </text>

    
    <line x1="770" y1="347" x2="798" y2="347" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="800" y="155" width="740" height="385" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(825, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="48" height="38" rx="4" />
      <line x1="4" y1="18" x2="52" y2="18" />
      <circle cx="12" cy="13" r="1.5" fill="#207448" />
      <circle cx="18" cy="13" r="1.5" fill="#207448" />
      <circle cx="28" cy="32" r="8" />
      <line x1="28" y1="28" x2="28" y2="32" />
      <line x1="28" y1="32" x2="33" y2="32" />
    </g>
    
    <circle cx="920" cy="203" r="24" fill="#207448" />
    <text x="920" y="211" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="957" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 3</text>
    
    <text x="825" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">Launch container process PID 1</tspan>
      <tspan x="825" dy="38">(GPUs sit completely idle until 100 percent</tspan>
      <tspan x="825" dy="38">of bytes are downloaded and unpacked)</tspan>
    </text>
  </g>

  
  <g id="workflow-b">
    
    <rect x="40" y="585" width="1520" height="585" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="70" y="632" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Lazy Pulling (SOCI, eStargz, Nydus)</text>

    
    <rect x="60" y="655" width="340" height="495" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(80, 675)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 6 L 36 6 L 48 18 L 48 50 L 8 50 Z" />
      <polyline points="36 6 36 18 48 18" />
      <line x1="16" y1="28" x2="36" y2="28" />
      <line x1="16" y1="36" x2="40" y2="36" />
      <line x1="16" y1="44" x2="30" y2="44" />
    </g>
    
    <circle cx="175" cy="703" r="24" fill="#207448" />
    <text x="175" y="711" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="212" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 1</text>
    
    <text x="80" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">Download only</tspan>
      <tspan x="80" dy="32">metadata index and</tspan>
      <tspan x="80" dy="32">Table of Contents</tspan>
      <tspan x="80" dy="32">(approx 10 MB in</tspan>
      <tspan x="80" dy="32">2 seconds)</tspan>
    </text>

    
    <line x1="400" y1="902" x2="428" y2="902" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="430" y="655" width="340" height="495" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(450, 675)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 12 L 22 12 L 28 20 L 50 20 L 50 48 L 6 48 Z" />
      <polygon points="24,28 36,34 24,40" fill="#207448" stroke="none" />
    </g>
    
    <circle cx="545" cy="703" r="24" fill="#207448" />
    <text x="545" y="711" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="582" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 2</text>
    
    <text x="450" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="450" dy="0">Mount remote</tspan>
      <tspan x="450" dy="30">virtual filesystem</tspan>
      <tspan x="450" dy="30">immediately and</tspan>
      <tspan x="450" dy="30">launch PID 1</tspan>
      <tspan x="450" dy="30">(container starts in</tspan>
      <tspan x="450" dy="30">under 5 seconds;</tspan>
      <tspan x="450" dy="30">GPU begins</tspan>
      <tspan x="450" dy="30">initialization)</tspan>
    </text>

    
    <line x1="770" y1="902" x2="798" y2="902" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="800" y="655" width="420" height="495" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(825, 675)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="16" height="16" rx="2" />
      <rect x="32" y="10" width="16" height="16" rx="2" />
      <rect x="19" y="30" width="16" height="16" rx="2" />
      <line x1="22" y1="18" x2="32" y2="18" />
      <line x1="14" y1="26" x2="21" y2="30" />
      <line x1="40" y1="26" x2="33" y2="30" />
    </g>
    
    <circle cx="920" cy="703" r="24" fill="#207448" />
    <text x="920" y="711" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="957" y="712" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Step 3</text>
    
    <text x="825" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">Background and</tspan>
      <tspan x="825" dy="28">on-demand streaming:</tspan>
      <tspan x="825" dy="28">as PyTorch imports</tspan>
      <tspan x="825" dy="28">modules, only accessed</tspan>
      <tspan x="825" dy="28">chunks (approx 1.5 GB of</tspan>
      <tspan x="825" dy="28">actual code/libraries)</tspan>
      <tspan x="825" dy="28">are fetched via HTTP</tspan>
      <tspan x="825" dy="28">Range requests; unread</tspan>
      <tspan x="825" dy="28">compiler tools and</tspan>
      <tspan x="825" dy="28">debug symbols remain</tspan>
      <tspan x="825" dy="28">in the registry.</tspan>
    </text>

    
    <rect x="1240" y="655" width="300" height="495" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <g transform="translate(1265, 675)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="20" />
      <path d="M 28 12 L 32 24 L 44 28 L 32 32 L 28 44 L 24 32 L 12 28 L 24 24 Z" fill="#db8129" />
    </g>
    
    <text x="1265" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1265" dy="0">Eliminates GPU</tspan>
      <tspan x="1265" dy="34">cold-start stall</tspan>
      <tspan x="1265" dy="34">for large AI</tspan>
      <tspan x="1265" dy="34">inference and</tspan>
      <tspan x="1265" dy="34">training</tspan>
      <tspan x="1265" dy="34">workloads.</tspan>
    </text>
  </g>
</svg>