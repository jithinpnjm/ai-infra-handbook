<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>A gRPC client with one connection sends every request to one pod</title>
  <desc>Visual comparison showing how a ClusterIP Service pins one long-lived gRPC connection to a single vLLM pod, leaving other pods idle, whereas a headless Service with client-side round-robin distributes requests across all pods.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="#f5f8f5" />

  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">A gRPC client with one connection</tspan>
    <tspan x="800" dy="56">sends every request to one pod</tspan>
  </text>

  <line x1="800" y1="145" x2="800" y2="925" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />

  
  <g id="left-panel">
    <rect x="40" y="145" width="735" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <text x="407" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">ClusterIP Service, layer 4</text>

    
    <g id="left-client">
      <rect x="65" y="425" width="140" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(107, 442)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="44" rx="6" />
        <line x1="0" y1="14" x2="56" y2="14" />
        <circle cx="12" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="28" cy="7" r="2.5" fill="#207448" />
        <line x1="12" y1="28" x2="26" y2="28" />
        <polyline points="10,23 15,28 10,33" />
      </g>
      <text x="135" y="535" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
        <tspan x="135" dy="0">gRPC</tspan>
        <tspan x="135" dy="34">client</tspan>
      </text>
    </g>

    
    <line x1="205" y1="512" x2="285" y2="512" stroke="#207448" stroke-width="6" />

    
    <g id="badge-tcp-connection">
      <line x1="245" y1="512" x2="245" y2="625" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
      <rect x="135" y="625" width="240" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="255" y="660" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="255" dy="0">one long-lived</tspan>
        <tspan x="255" dy="32">TCP connection</tspan>
      </text>
    </g>

    
    <g id="left-service">
      <rect x="285" y="425" width="190" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(352, 442)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="12" />
        <path d="M 28 6 L 28 14 M 28 42 L 28 50 M 6 28 L 14 28 M 42 28 L 50 28 M 12 12 L 18 18 M 38 38 L 44 44 M 12 44 L 18 38 M 38 18 L 44 12" />
      </g>
      <text x="380" y="535" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="380" dy="0">ClusterIP</tspan>
        <tspan x="380" dy="34">Service</tspan>
      </text>
    </g>

    
    <path d="M 430 425 L 430 330 L 603 330" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="badge-chosen-once">
      <line x1="390" y1="282" x2="430" y2="282" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
      <rect x="130" y="245" width="260" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="260" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="260" dy="0">chosen once,</tspan>
        <tspan x="260" dy="30">at connect time</tspan>
      </text>
    </g>

    
    <g id="left-pod-1">
      <rect x="605" y="255" width="150" height="150" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
      <g transform="translate(652, 268)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <line x1="4" y1="18" x2="10" y2="18" />
        <line x1="4" y1="28" x2="10" y2="28" />
        <line x1="4" y1="38" x2="10" y2="38" />
        <line x1="46" y1="18" x2="52" y2="18" />
        <line x1="46" y1="28" x2="52" y2="28" />
        <line x1="46" y1="38" x2="52" y2="38" />
        <circle cx="28" cy="28" r="6" />
      </g>
      <text x="680" y="356" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
        <tspan x="680" dy="0">vllm</tspan>
        <tspan x="680" dy="32">pod 1</tspan>
      </text>
    </g>

    
    <g id="left-pod-2">
      <rect x="605" y="445" width="150" height="110" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" />
      <g transform="translate(652, 478)" stroke="#9ca3af" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <circle cx="28" cy="28" r="6" />
      </g>
    </g>

    <g id="left-pod-3">
      <rect x="605" y="595" width="150" height="110" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" />
      <g transform="translate(652, 628)" stroke="#9ca3af" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <circle cx="28" cy="28" r="6" />
      </g>
    </g>

    
    <g id="idle-group">
      <path d="M 600 480 L 590 480 Q 585 480 585 520 L 585 540 Q 585 550 575 550 Q 585 550 585 560 L 585 580 Q 585 620 590 620 L 600 620" fill="none" stroke="#9ca3af" stroke-width="2" />
      <rect x="495" y="532" width="90" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
      <text x="540" y="557" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#6b7280">idle</text>
    </g>

    
    <g id="counter-pod-1">
      <rect x="132" y="745" width="550" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <text x="407" y="792" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">1000 of 1000 requests to pod 1</text>
    </g>
  </g>

  
  <g id="right-panel">
    <rect x="825" y="145" width="735" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    <text x="1192" y="185" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1192" dy="0">headless Service</tspan>
      <tspan x="1192" dy="36">with client-side round_robin</tspan>
    </text>

    
    <g id="right-client">
      <rect x="855" y="425" width="140" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(897, 490)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="56" height="44" rx="6" />
        <line x1="0" y1="14" x2="56" y2="14" />
        <circle cx="12" cy="7" r="2.5" fill="#207448" />
        <circle cx="20" cy="7" r="2.5" fill="#207448" />
        <circle cx="28" cy="7" r="2.5" fill="#207448" />
        <line x1="12" y1="28" x2="26" y2="28" />
        <polyline points="10,23 15,28 10,33" />
      </g>
    </g>

    
    <path d="M 995 480 L 1050 480 L 1050 325 L 1378 325" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <line x1="995" y1="512" x2="1378" y2="512" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <path d="M 995 545 L 1050 545 L 1050 665 L 1378 665" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

    
    <g id="badge-share-requests">
      <rect x="1090" y="381" width="250" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <text x="1215" y="414" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="1215" dy="0">a share of</tspan>
        <tspan x="1215" dy="30">the requests</tspan>
      </text>
    </g>

    
    <g id="right-pod-1">
      <rect x="1380" y="270" width="150" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(1427, 297)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <circle cx="28" cy="28" r="6" />
      </g>
    </g>

    <g id="right-pod-2">
      <rect x="1380" y="457" width="150" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(1427, 484)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <circle cx="28" cy="28" r="6" />
      </g>
    </g>

    <g id="right-pod-3">
      <rect x="1380" y="610" width="150" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <g transform="translate(1427, 637)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="10" width="36" height="36" rx="4" />
        <line x1="18" y1="4" x2="18" y2="10" />
        <line x1="28" y1="4" x2="28" y2="10" />
        <line x1="38" y1="4" x2="38" y2="10" />
        <line x1="18" y1="46" x2="18" y2="52" />
        <line x1="28" y1="46" x2="28" y2="52" />
        <line x1="38" y1="46" x2="38" y2="52" />
        <circle cx="28" cy="28" r="6" />
      </g>
    </g>

    
    <g id="note-client-picks">
      <rect x="932" y="740" width="520" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
      <text x="1192" y="776" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="1192" dy="0">the client picks the pod,</tspan>
        <tspan x="1192" dy="30">not one TCP connection</tspan>
      </text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="955" width="1520" height="90" rx="14" fill="#207448" />
    <text x="800" y="990" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">a Service balances connections, so a multiplexed gRPC stream</tspan>
      <tspan x="800" dy="32">stays on one pod unless the client or an L7 proxy spreads the requests.</tspan>
    </text>
  </g>
</svg>