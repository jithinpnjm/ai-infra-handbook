<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>KEDA: the switch and the dimmer</title>
  <desc>Visual infographic explaining KEDA two-stage scaling architecture: Stage A switch, Stage B dimmer, ScaledObject configuration, triggers, ScaledJob contrast, and cold start warning.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">KEDA: the switch and the dimmer</text>

  
  
  <g>
    <rect x="60" y="105" width="690" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="90" y="125" width="56" height="32" rx="16" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="130" cy="141" r="10" fill="#207448"/>

    <text x="165" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Stage A</text>
    <text x="90" y="200" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">zero to one: the switch, handled by KEDA operator </tspan>
      <tspan x="90" dy="36">(a plain HPA cannot scale to zero because the </tspan>
      <tspan x="90" dy="36">formula multiplies by zero)</tspan>
    </text>
  </g>

  
  <line x1="755" y1="212" x2="840" y2="212" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <g>
    <rect x="850" y="105" width="690" height="215" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <line x1="880" y1="141" x2="936" y2="141" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <rect x="904" y="127" width="12" height="28" rx="4" fill="#207448"/>
    <line x1="884" y1="120" x2="884" y2="128" stroke="#207448" stroke-width="3"/>
    <line x1="908" y1="116" x2="908" y2="124" stroke="#207448" stroke-width="3"/>
    <line x1="932" y1="120" x2="932" y2="128" stroke="#207448" stroke-width="3"/>

    <text x="955" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Stage B</text>
    <text x="880" y="200" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="880" dy="0">one to N: the dimmer, handled by the HPA that </tspan>
      <tspan x="880" dy="36">KEDA creates, fed by KEDA metrics adapter </tspan>
      <tspan x="880" dy="36">on the External Metrics API</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="60" y="350" width="1480" height="555" rx="20" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <path d="M 60 370 A 20 20 0 0 1 80 350 L 1520 350 A 20 20 0 0 1 1540 370 L 1540 415 L 60 415 Z" fill="#e8f1ea"/>
    
    
    <rect x="90" y="365" width="40" height="38" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="90" y1="384" x2="130" y2="384" stroke="#207448" stroke-width="3"/>
    <circle cx="102" cy="375" r="3" fill="#207448"/>
    <circle cx="114" cy="375" r="3" fill="#207448"/>

    <text x="145" y="394" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">ScaledObject batch-embed</text>

    
    <rect x="90" y="435" width="650" height="330" rx="14" fill="#f5f8f5" stroke="#c0d6c5" stroke-width="2"/>
    <text x="120" y="475" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Configuration</text>
    
    <text x="120" y="515" font-family="monospace" font-size="24" fill="#303a36">minReplicaCount 0</text>
    <text x="120" y="555" font-family="monospace" font-size="24" fill="#303a36">maxReplicaCount 50</text>
    <text x="120" y="595" font-family="monospace" font-size="24" fill="#303a36">pollingInterval 15</text>
    <text x="120" y="635" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="120" dy="0" font-family="monospace">cooldownPeriod 300 </tspan>
      <tspan x="120" dy="32">(quiet time before one to zero)</tspan>
    </text>
    <text x="120" y="705" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="120" dy="0">scaleDown </tspan>
      <tspan x="120" dy="32">stabilizationWindowSeconds 600</tspan>
    </text>

    
    <rect x="770" y="435" width="740" height="330" rx="14" fill="#f5f8f5" stroke="#c0d6c5" stroke-width="2"/>
    <text x="800" y="475" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Triggers</text>

    
    <rect x="800" y="495" width="680" height="52" rx="10" fill="#ffffff" stroke="#c0d6c5" stroke-width="1.5"/>
    <text x="825" y="530" font-family="monospace" font-size="24" fill="#303a36">kafka lagThreshold 200</text>

    
    <rect x="800" y="560" width="680" height="85" rx="10" fill="#ffffff" stroke="#c0d6c5" stroke-width="1.5"/>
    <text x="825" y="595" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">prometheus query </tspan>
      <tspan x="825" dy="32">sum vllm:num_requests_waiting threshold 5</tspan>
    </text>

    
    <rect x="800" y="660" width="680" height="85" rx="10" fill="#ffffff" stroke="#c0d6c5" stroke-width="1.5"/>
    <text x="825" y="695" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">cron 0 8 to 0 20 Monday to Friday </tspan>
      <tspan x="825" dy="32">desiredReplicas 4 (pre-warm business hours)</tspan>
    </text>

    
    <rect x="90" y="790" width="1420" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="800" y="828" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
      <tspan x="800" dy="0">the largest desired count across active triggers wins, </tspan>
      <tspan x="800" dy="34">so cron acts as a floor in business hours</tspan>
    </text>
  </g>

  
  
  <g>
    <rect x="60" y="930" width="690" height="235" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    
    <rect x="90" y="950" width="46" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="90" y="968" width="46" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="90" y="986" width="46" height="13" rx="3" fill="none" stroke="#207448" stroke-width="3"/>

    <text x="155" y="980" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">ScaledJob transcribe-job</text>
    <text x="90" y="1030" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">one short Job per queued message, </tspan>
      <tspan x="90" dy="36">aws-sqs-queue queueLength 1, </tspan>
      <tspan x="90" dy="36">maxReplicaCount 20, strategy accurate</tspan>
    </text>
  </g>

  
  <g>
    <rect x="765" y="1025" width="70" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="1053" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">vs</text>
  </g>

  
  <g>
    <rect x="850" y="930" width="690" height="235" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3"/>

    
    <rect x="880" y="952" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="880" y1="968" x2="924" y2="968" stroke="#207448" stroke-width="3"/>
    <circle cx="891" cy="960" r="2.5" fill="#207448"/>
    <circle cx="902" cy="960" r="2.5" fill="#207448"/>

    <text x="945" y="980" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">ScaledObject</text>
    <text x="880" y="1045" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="880" dy="0">keeps a long-running Deployment </tspan>
      <tspan x="880" dy="36">and changes its size</tspan>
    </text>
  </g>

  
  <g>
    <rect x="60" y="1190" width="1480" height="175" rx="16" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>

    
    <polygon points="120,1235 90,1295 150,1295" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <line x1="120" y1="1255" x2="120" y2="1275" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="1285" r="3" fill="#db8129"/>

    <text x="175" y="1270" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="175" dy="0" font-weight="bold" fill="#db8129">Warning: </tspan>
      <tspan dy="0">scale-to-zero on a GPU service costs a cold start; </tspan>
      <tspan x="175" dy="38">fine for a nightly batch job, painful for a person typing in chat</tspan>
    </text>
  </g>
</svg>