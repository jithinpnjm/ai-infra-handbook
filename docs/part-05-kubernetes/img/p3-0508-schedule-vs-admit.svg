<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Scheduler checks totals, kubelet checks the real layout</title>
  <desc>Comparison between kube-scheduler verifying node-level totals versus kubelet admission validating exact NUMA layout and device affinity.</desc>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">Scheduler checks totals, kubelet checks the real layout</text>

  
  <g id="left-stage">
    
    <rect x="60" y="125" width="720" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <circle cx="110" cy="180" r="24" fill="#207448"/>
    <text x="110" y="180" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">1</text>

    
    <g transform="translate(155, 152)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12"/>
      <path d="M28 4 v6 M28 46 v6 M4 28 h6 M46 28 h6 M11 11 l4.2 4.2 M40.8 40.8 l4.2 4.2 M11 45 l4.2 -4.2 M40.8 15.2 l4.2 -4.2"/>
    </g>

    
    <text x="90" y="260" font-size="34" font-weight="bold" fill="#303a36" font-family="sans-serif">kube-scheduler</text>

    
    <rect x="90" y="355" width="660" height="125" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="120" y="410" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="120" dy="0">checks node-level sums (allocatable CPUs,</tspan>
      <tspan x="120" dy="36">memory, total nvidia.com/gpu count)</tspan>
    </text>

    
    <rect x="90" y="505" width="660" height="110" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="120" y="555" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="120" dy="0">does not know the allocation state</tspan>
      <tspan x="120" dy="36">of each NUMA node</tspan>
    </text>

    
    <rect x="90" y="640" width="660" height="235" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    <circle cx="135" cy="740" r="22" fill="#207448"/>
    <path d="M124 740 l7 8 l16 -16" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="733" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">
      <tspan x="180" dy="0">Scheduled: Successfully assigned</tspan>
      <tspan x="180" dy="36">ns/pod to node</tspan>
    </text>
  </g>

  
  <g id="right-stage">
    
    <rect x="820" y="125" width="720" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <circle cx="870" cy="180" r="24" fill="#207448"/>
    <text x="870" y="180" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">2</text>

    
    <g transform="translate(915, 152)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="36" height="36" rx="6"/>
      <rect x="20" y="20" width="16" height="16" rx="2"/>
      <path d="M18 4 v6 M28 4 v6 M38 4 v6 M18 46 v6 M28 46 v6 M38 46 v6 M4 18 h6 M4 28 h6 M4 38 h6 M46 18 h6 M46 28 h6 M46 38 h6"/>
    </g>

    
    <text x="850" y="255" font-size="30" font-weight="bold" fill="#303a36" font-family="sans-serif">
      <tspan x="850" dy="0">kubelet admission on the node</tspan>
      <tspan x="850" dy="36">(Topology Manager restricted</tspan>
      <tspan x="850" dy="36">or single-numa-node)</tspan>
    </text>

    
    <rect x="850" y="355" width="660" height="125" rx="10" fill="#ffffff" stroke="#c0d4c5" stroke-width="1.5"/>
    <text x="880" y="396" font-size="24" fill="#303a36" font-family="sans-serif">
      <tspan x="880" dy="0">checks that requested GPUs, RDMA NICs</tspan>
      <tspan x="880" dy="34">and exclusive CPUs can all come from the</tspan>
      <tspan x="880" dy="34">same NUMA node given existing pods</tspan>
    </text>

    
    <rect x="850" y="505" width="660" height="110" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(875, 536)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18"/>
      <path d="M24 14 v12 M24 32 v2"/>
    </g>
    <text x="935" y="569" font-size="24" font-weight="bold" fill="#db8129" font-family="sans-serif">
      <tspan x="935" dy="0">fragmentation makes that impossible</tspan>
    </text>

    
    <rect x="850" y="640" width="660" height="235" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="895" cy="695" r="22" fill="#dc2626"/>
    <path d="M885 685 l20 20 M905 685 l-20 20" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="935" y="688" font-size="24" font-weight="bold" fill="#b91c1c" font-family="sans-serif">
      <tspan x="935" dy="0">pod set to Failed:</tspan>
      <tspan x="935" dy="36" font-weight="normal">TopologyAffinityError,</tspan>
      <tspan x="935" dy="36" font-weight="normal">OutOfnvidia.com/gpu, OutOfcpu</tspan>
      <tspan x="935" dy="36" font-weight="normal">or NodeAffinity</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="935" width="1480" height="80" rx="12" fill="#207448"/>
    <text x="800" y="984" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">A pod can pass the first check and fail the second because the totals looked fine while the layout did not</text>
  </g>
</svg>