<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480" style="background:#f5f8f5;">
  <title>Device plugin conversation with the kubelet</title>
  <desc>Sequence diagram illustrating the interaction between the NVIDIA device plugin and the kubelet device manager, with Pod Resources API and DRA footer.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Device plugin conversation with the kubelet</text>

  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="380" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
    
    <g transform="translate(162, 14)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="42" rx="6" fill="#f5f8f5"/>
      <rect x="14" y="10" width="28" height="22" rx="3" fill="#e8f1ea"/>
      <path d="M 12 0 L 12 -6 M 28 0 L 28 -6 M 44 0 L 44 -6" stroke-linecap="round"/>
      <path d="M 12 42 L 12 48 M 28 42 L 28 48 M 44 42 L 44 48" stroke-linecap="round"/>
    </g>
    <text x="190" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">NVIDIA device plugin</text>
  </g>

  
  <g transform="translate(720, 110)">
    <rect x="0" y="0" width="380" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
    
    <g transform="translate(162, 12)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="24" r="16" fill="#f5f8f5"/>
      <circle cx="28" cy="24" r="7" fill="#e8f1ea"/>
      <path d="M 28 2 L 28 8 M 28 40 L 28 46 M 6 24 L 12 24 M 44 24 L 50 24 M 12 8 L 17 13 M 39 35 L 44 40 M 12 40 L 17 35 M 39 13 L 44 8" stroke-linecap="round"/>
    </g>
    <text x="190" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">kubelet device manager</text>
  </g>

  
  <g transform="translate(1140, 110)">
    <rect x="0" y="0" width="400" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#shadow)"/>
    
    <g transform="translate(172, 14)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="42" rx="6" fill="#f5f8f5"/>
      <line x1="0" y1="14" x2="56" y2="14"/>
      <circle cx="12" cy="7" r="2.5" fill="#207448"/>
      <circle cx="22" cy="7" r="2.5" fill="#207448"/>
      <circle cx="32" cy="7" r="2.5" fill="#207448"/>
    </g>
    <text x="200" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Pod Resources API</text>
  </g>

  
  
  <line x1="250" y1="240" x2="250" y2="1320" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>
  
  <line x1="910" y1="240" x2="910" y2="1320" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>

  
  <g transform="translate(1140, 270)">
    <rect x="0" y="0" width="400" height="970" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(24, 30)">
      <rect x="0" y="0" width="352" height="48" rx="8" fill="#e8f1ea"/>
      <text x="176" y="32" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">Endpoint &amp; Inspection</text>
      
      
      <text x="0" y="90" font-family="monospace" font-size="24" fill="#303a36">
        <tspan x="0" dy="0">/var/lib/kubelet/</tspan>
        <tspan x="0" dy="34">pod-resources/</tspan>
        <tspan x="0" dy="34">kubelet.sock</tspan>
      </text>

      <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
        <tspan x="0" dy="0">offers List,</tspan>
        <tspan x="0" dy="38">GetAllocatableResources,</tspan>
        <tspan x="0" dy="38">Get;</tspan>
      </text>

      <line x1="0" y1="360" x2="352" y2="360" stroke="#e8f1ea" stroke-width="3"/>

      
      <text x="0" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="0" dy="0" font-family="monospace" font-weight="bold" fill="#207448">dcgm-exporter</tspan>
        <tspan x="0" dy="38">uses it to label GPU</tspan>
        <tspan x="0" dy="38">metrics with pod,</tspan>
        <tspan x="0" dy="38">namespace and</tspan>
        <tspan x="0" dy="38">container</tspan>
      </text>
    </g>
  </g>

  

  
  <g transform="translate(0, 270)">
    
    <circle cx="210" cy="55" r="24" fill="#207448"/>
    <text x="210" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    
    <line x1="250" y1="55" x2="894" y2="55" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    
    <rect x="290" y="75" width="580" height="96" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="310" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="310" dy="0">plugin registers over gRPC at</tspan>
      <tspan x="310" dy="34" font-family="monospace" font-size="24" fill="#207448">/var/lib/kubelet/device-plugins/kubelet.sock</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 470)">
    
    <circle cx="210" cy="45" r="24" fill="#207448"/>
    <text x="210" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    
    <line x1="250" y1="45" x2="894" y2="45" stroke="#207448" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
    
    
    <rect x="280" y="65" width="600" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0" font-weight="bold" fill="#207448">ListAndWatch:</tspan>
      <tspan font-weight="normal"> streams device IDs (GPU-uuid-0..7),</tspan>
      <tspan x="300" dy="34">health (Healthy or Unhealthy on XID faults)</tspan>
      <tspan x="300" dy="34">and NUMA topology hints</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 700)">
    
    <circle cx="950" cy="45" r="24" fill="#207448"/>
    <text x="950" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    
    <line x1="910" y1="45" x2="266" y2="45" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    
    <rect x="280" y="65" width="600" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0" font-family="monospace" font-weight="bold" fill="#207448">GetPreferredAllocation(available, count):</tspan>
      <tspan x="300" dy="34">hint a good subset, for example 2 GPUs on</tspan>
      <tspan x="300" dy="34">the same NVLink bridge or PCIe switch</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 930)">
    
    <circle cx="210" cy="45" r="24" fill="#db8129"/>
    <text x="210" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    
    <line x1="250" y1="45" x2="894" y2="45" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
    
    
    <rect x="280" y="65" width="600" height="144" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0" font-weight="bold" fill="#db8129">Allocate during syncPod:</tspan>
      <tspan font-weight="normal"> returns</tspan>
      <tspan x="300" dy="34" font-family="monospace" fill="#303a36">NVIDIA_VISIBLE_DEVICES,</tspan>
      <tspan x="300" dy="34" font-family="monospace" fill="#303a36">/dev/nvidia* paths,</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" fill="#303a36"> CDI annotations</tspan>
    </text>
  </g>

  
  <g transform="translate(0, 1160)">
    
    <circle cx="950" cy="45" r="24" fill="#207448"/>
    <text x="950" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    
    
    <path d="M 910 45 L 970 45 L 970 115 L 926 115" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    
    
    <rect x="280" y="20" width="600" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="300" dy="0">kubelet checkpoints to</tspan>
      <tspan x="300" dy="32" font-family="monospace" font-size="24" fill="#207448">/var/lib/kubelet/device-plugins/</tspan>
      <tspan x="300" dy="32" font-family="monospace" font-size="24" fill="#207448">kubelet_internal_checkpoint</tspan>
      <tspan x="300" dy="34" font-family="system-ui, -apple-system, sans-serif">so a restart keeps allocations</tspan>
    </text>
  </g>

  
  <g transform="translate(60, 1370)">
    <rect x="0" y="0" width="1480" height="74" rx="12" fill="#207448"/>
    <text x="740" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">DRA replaces integer counting with ResourceClaim and driver-published ResourceSlice</text>
  </g>
</svg>