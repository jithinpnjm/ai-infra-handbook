<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Container Lifecycle State Machine, Signals, and Exit Codes</title>
  <desc>Visual explanation of container lifecycle states, transitions, signals, and termination exit codes.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#303a36" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">
    Container Lifecycle State Machine, Signals, and Exit Codes
  </text>

  
  
  

  
  <g filter="url(#card-shadow)">
    <rect x="80" y="95" width="260" height="110" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <ellipse cx="125" cy="135" rx="22" ry="9" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 103 135 v 28 c 0 5 10 9 22 9 s 22 -4 22 -9 v -28" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 103 149 c 0 5 10 9 22 9 s 22 -4 22 -9" fill="none" stroke="#207448" stroke-width="4" />
    <text x="170" y="162" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Image</text>
  </g>

  
  <line x1="340" y1="150" x2="380" y2="150" stroke="#207448" stroke-width="3" />
  <line x1="1120" y1="150" x2="1178" y2="150" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g filter="url(#card-shadow)">
    <rect x="380" y="90" width="740" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="750" y="128" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">docker create</text>
    <text x="750" y="162" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      (rootfs assembled, namespaces set up,
    </text>
    <text x="750" y="194" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      process not yet started)
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1180" y="95" width="340" height="110" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="1208" y="128" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 1208 144 h 44 M 1230 144 v 28" fill="none" stroke="#207448" stroke-width="3" />
    <text x="1275" y="162" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Created</text>
  </g>

  
  
  

  
  <path d="M 1350 205 v 65 H 1170" fill="none" stroke="#207448" stroke-width="3" />
  <path d="M 430 270 H 250 v 75" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g filter="url(#card-shadow)">
    <rect x="430" y="215" width="740" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="252" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">docker start</text>
    <text x="800" y="284" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      (or directly via 'docker run';
    </text>
    <text x="800" y="312" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      PID 1 starts inside namespaces)
    </text>
  </g>

  
  
  

  
  <g filter="url(#card-shadow)">
    <rect x="80" y="355" width="340" height="120" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <circle cx="128" cy="415" r="24" fill="none" stroke="#db8129" stroke-width="4" />
    <polygon points="122,403 140,415 122,427" fill="#db8129" />
    <text x="175" y="425" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Running</text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1180" y="355" width="340" height="120" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="1230" cy="415" r="24" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1222" y1="403" x2="1222" y2="427" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="1238" y1="403" x2="1238" y2="427" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="1280" y="425" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Paused</text>
  </g>

  
  <line x1="420" y1="390" x2="480" y2="390" stroke="#207448" stroke-width="3" />
  <line x1="1120" y1="390" x2="1178" y2="390" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  <line x1="1180" y1="445" x2="1010" y2="445" stroke="#207448" stroke-width="3" />
  <line x1="590" y1="445" x2="422" y2="445" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g filter="url(#card-shadow)">
    <rect x="480" y="350" width="640" height="78" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="380" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">docker pause</text>
    <text x="800" y="410" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      (cgroup freezer pauses processes)
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="590" y="432" width="420" height="48" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="800" y="465" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">docker unpause</text>
  </g>

  
  
  

  
  <line x1="250" y1="475" x2="250" y2="528" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="80" y="530" width="1440" height="660" rx="20" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />

  
  <g>
    <rect x="110" y="555" width="1380" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="602" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Path A: Clean exit (process finishes, exit code 0)
    </text>
  </g>

  
  <g>
    <rect x="110" y="645" width="1380" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="692" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Path B: Application error (exit code 1 or 2)
    </text>
  </g>

  
  <g>
    <rect x="110" y="735" width="1380" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="775" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Path C: Graceful stop via 'docker stop' (sends SIGTERM 15;
    </text>
    <text x="140" y="809" font-family="sans-serif" font-size="24" fill="#303a36">
      if unhandled within default 10s grace period, kernel sends SIGKILL 9,
    </text>
    <text x="140" y="839" font-family="sans-serif" font-size="24" fill="#303a36">
      resulting in exit code 143 or 137)
    </text>
  </g>

  
  <g>
    <rect x="110" y="865" width="1380" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="905" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Path D: Immediate termination via 'docker kill' (kernel SIGKILL 9, exit code 137)
    </text>
    <text x="140" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
      or Cgroup OOM kill (kernel OOM-killer fires when memory hits memory.max,
    </text>
    <text x="140" y="976" font-family="sans-serif" font-size="24" fill="#303a36">
      exit code 137 with State.OOMKilled=true)
    </text>
  </g>

  
  <g>
    <rect x="110" y="1030" width="1380" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="1075" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      Path E: Segmentation fault (SIGSEGV 11, exit code 139)
    </text>
    <text x="140" y="1115" font-family="sans-serif" font-size="24" fill="#303a36">
      or bus error from full /dev/shm (SIGBUS 7, exit code 135)
    </text>
  </g>

  
  
  

  
  <line x1="250" y1="1190" x2="250" y2="1238" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g filter="url(#card-shadow)">
    <rect x="80" y="1240" width="360" height="120" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="108" y="1278" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="120" y="1290" width="20" height="20" fill="#207448" />
    <text x="168" y="1312" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Stopped / Exited</text>
  </g>

  
  <line x1="440" y1="1300" x2="490" y2="1300" stroke="#207448" stroke-width="3" />
  <line x1="1130" y1="1300" x2="1178" y2="1300" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g filter="url(#card-shadow)">
    <rect x="490" y="1240" width="640" height="120" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="810" y="1278" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">docker rm</text>
    <text x="810" y="1312" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      (writable overlayfs upper layer and
    </text>
    <text x="810" y="1342" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      container config deleted)
    </text>
  </g>

  
  <g filter="url(#card-shadow)">
    <rect x="1180" y="1240" width="340" height="120" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <path d="M 1215 1282 h 30 M 1224 1276 h 12 M 1219 1282 v 36 c 0 3 2 5 5 5 h 12 c 3 0 5 -2 5 -5 v -36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="1226" y1="1290" x2="1226" y2="1312" stroke="#207448" stroke-width="3" />
    <line x1="1234" y1="1290" x2="1234" y2="1312" stroke="#207448" stroke-width="3" />
    <text x="1275" y="1312" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Removed</text>
  </g>

</svg>