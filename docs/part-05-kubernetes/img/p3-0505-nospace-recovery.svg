<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>etcd NOSPACE alarm and the safe member replacement order</title>
  <desc>Infographic illustrating the etcd recovery sequence from a NOSPACE alarm on the left and the correct versus incorrect member replacement sequence on the right.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#d32f2f" />
    </marker>
  </defs>

  
  <rect width="1600" height="900" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">etcd NOSPACE alarm and the safe member replacement order</text>

  
  
  

  
  <rect x="50" y="95" width="700" height="180" rx="14" fill="#fdf7f2" stroke="#db8129" stroke-width="3" />
  
  
  <g transform="translate(75, 157)">
    <ellipse cx="28" cy="14" rx="24" ry="10" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 4 14 v 28 c 0 6 11 10 24 10 s 24 -4 24 -10 v -28" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 4 28 c 0 6 11 10 24 10 s 24 -4 24 -10" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="46" cy="42" r="14" fill="#fdf7f2" stroke="#db8129" stroke-width="3" />
    <line x1="46" y1="34" x2="46" y2="44" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="46" cy="49" r="1.5" fill="#db8129" />
  </g>

  
  <text x="150" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="150" dy="0" font-family="ui-monospace, monospace" font-size="24">database exceeds --quota-backend-bytes</tspan>
    <tspan x="150" dy="33">(default 2 GiB, up to 8 GiB recommended):</tspan>
    <tspan x="150" dy="33" font-weight="bold" fill="#db8129">NOSPACE alarm, cluster read-only,</tspan>
    <tspan x="150" dy="33" font-family="ui-monospace, monospace" font-size="24">error mvcc: database space exceeded</tspan>
  </text>

  
  <line x1="400" y1="275" x2="400" y2="305" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="305" width="700" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="367" r="24" fill="#207448" />
  <text x="95" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <text x="140" y="344" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="140" dy="0">rev=$(etcdctl endpoint status</tspan>
    <tspan x="140" dy="32">-w json | jq</tspan>
    <tspan x="140" dy="32">.[0].Status.header.revision)</tspan>
  </text>

  
  <g transform="translate(645, 339)">
    <rect x="4" y="6" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 18 l 8 8 l -8 8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="34" x2="42" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <line x1="400" y1="430" x2="400" y2="455" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="455" width="700" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="500" r="24" fill="#207448" />
  <text x="95" y="509" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <text x="140" y="508" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">etcdctl compact $rev</text>

  
  <g transform="translate(645, 472)">
    <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 28 h 28" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 28 14 l -6 6 h 12 z" fill="#207448" />
    <path d="M 28 42 l -6 -6 h 12 z" fill="#207448" />
  </g>

  
  <line x1="400" y1="545" x2="400" y2="570" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="570" width="700" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="635" r="24" fill="#207448" />
  <text x="95" y="644" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <text x="140" y="612" font-size="24" fill="#303a36">
    <tspan x="140" dy="0" font-family="ui-monospace, monospace">etcdctl defrag,</tspan>
    <tspan x="140" dy="32" font-family="system-ui, -apple-system, sans-serif">one member at a time</tspan>
    <tspan x="140" dy="32" font-family="system-ui, -apple-system, sans-serif">(briefly blocks that member)</tspan>
  </text>

  
  <g transform="translate(645, 607)">
    <rect x="6" y="6" width="18" height="18" rx="3" fill="#207448" />
    <rect x="32" y="6" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="6" y="32" width="18" height="18" rx="3" fill="#207448" />
    <rect x="32" y="32" width="18" height="18" rx="3" fill="#207448" />
  </g>

  
  <line x1="400" y1="700" x2="400" y2="725" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="50" y="725" width="700" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="95" cy="770" r="24" fill="#207448" />
  <text x="95" y="779" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <text x="140" y="778" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">etcdctl alarm disarm</text>

  
  <g transform="translate(645, 742)">
    <path d="M 28 6 C 16 6 12 16 12 28 C 12 36 8 40 6 42 h 44 c -2 -2 -6 -6 -6 -14 C 44 16 40 6 28 6 Z" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 22 46 c 1 4 4 6 6 6 s 5 -2 6 -6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 10 l 32 32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  
  

  
  <rect x="790" y="95" width="760" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(815, 110)">
    <circle cx="14" cy="28" r="10" fill="#207448" />
    <circle cx="36" cy="28" r="10" fill="#207448" />
    <circle cx="58" cy="28" r="10" fill="none" stroke="#d32f2f" stroke-width="3" />
    <line x1="53" y1="23" x2="63" y2="33" stroke="#d32f2f" stroke-width="3" />
    <line x1="63" y1="23" x2="53" y2="33" stroke="#d32f2f" stroke-width="3" />
  </g>

  <text x="895" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">members cp1 cp2 cp3 where cp3 is dead</text>

  
  <rect x="790" y="205" width="760" height="280" rx="16" fill="#fdf6f6" stroke="#e0b4b4" stroke-width="2" />
  
  
  <g transform="translate(815, 224)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#d32f2f" stroke-width="3" />
    <line x1="12" y1="12" x2="24" y2="24" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="12" x2="12" y2="24" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="865" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#c53030">Wrong: add cp4 first</text>

  
  <rect x="815" y="285" width="420" height="170" rx="12" fill="#ffffff" stroke="#d32f2f" stroke-width="2" />
  
  <g transform="translate(835, 305)">
    <circle cx="14" cy="14" r="8" fill="#207448" />
    <circle cx="34" cy="14" r="8" fill="#207448" />
    <circle cx="14" cy="34" r="8" fill="none" stroke="#d32f2f" stroke-width="2" />
    <circle cx="34" cy="34" r="8" fill="#db8129" />
  </g>
  <text x="835" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="835" dy="0">4 members, quorum 3,</tspan>
    <tspan x="835" dy="36">only 2 alive</tspan>
  </text>

  
  <line x1="1235" y1="370" x2="1285" y2="370" stroke="#d32f2f" stroke-width="4" marker-end="url(#arrow-red)" />

  
  <rect x="1285" y="285" width="245" height="170" rx="12" fill="#fdeeed" stroke="#d32f2f" stroke-width="3" />
  
  <g transform="translate(1385, 305)">
    <path d="M 22 4 L 42 40 L 2 40 Z" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round" />
    <line x1="22" y1="16" x2="22" y2="28" stroke="#d32f2f" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="34" r="2" fill="#d32f2f" />
  </g>
  <text x="1407" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#d32f2f">quorum lost</text>


  
  <rect x="790" y="515" width="760" height="300" rx="16" fill="#f4faf6" stroke="#b2d8c3" stroke-width="2" />
  
  
  <g transform="translate(815, 534)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 10 18 l 6 6 l 10 -12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="865" y="559" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Right: member remove cp3 first</text>

  
  <rect x="815" y="595" width="230" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(835, 615)">
    <circle cx="16" cy="20" r="10" fill="#207448" />
    <circle cx="44" cy="20" r="10" fill="#207448" />
    <path d="M 16 38 h 28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="835" y="718" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">2 of 2 alive</text>

  
  <line x1="1045" y1="690" x2="1095" y2="690" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="1095" y="595" width="435" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(1120, 615)">
    <circle cx="16" cy="18" r="8" fill="#207448" />
    <circle cx="36" cy="18" r="8" fill="#207448" />
    <circle cx="56" cy="18" r="8" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 56 30 v 8 m -4 -4 h 8" stroke="#207448" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="1120" y="700" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="1120" dy="0">member add cp4 as learner,</tspan>
    <tspan x="1120" dy="38">promote when caught up</tspan>
  </text>

</svg>