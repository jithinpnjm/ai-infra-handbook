<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Why one big image pull blocks a node</title>
  <desc>Queue diagram showing serial pull head-of-line blocking on Kubernetes nodes, parallel pull configuration fix, and image pull stages.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why one big image pull blocks a node</text>

  
  
  
  <rect x="50" y="120" width="880" height="460" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(80, 145)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="14"/>
    <path d="M 28 4 L 28 14 M 28 42 L 28 52 M 4 28 L 14 28 M 42 28 L 52 28 M 11 11 L 18 18 M 38 38 L 45 45 M 11 45 L 18 38 M 38 18 L 45 11"/>
  </g>

  
  <text x="160" y="165" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="160" dy="0">serializeImagePulls true (default):</tspan>
    <tspan x="160" dy="36">one PullImage CRI call at a time</tspan>
  </text>

  
  <rect x="80" y="240" width="820" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(105, 267)" stroke="#207448" stroke-width="4" fill="none">
    <ellipse cx="28" cy="14" rx="20" ry="8"/>
    <path d="M 8 14 v 28 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8 v -28"/>
    <path d="M 8 28 c 0 4.4 9 8 20 8 s 20 -3.6 20 -8"/>
  </g>
  <text x="180" y="305" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    A 25 GB PyTorch image takes about 3 minutes
  </text>

  
  <line x1="490" y1="352" x2="490" y2="388" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="80" y="390" width="820" height="160" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(105, 442)" stroke="#db8129" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="22"/>
    <polyline points="28,14 28,28 38,28"/>
  </g>
  <text x="180" y="455" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="180" dy="0">behind it waits a tiny 5 MB busybox or monitoring pod</tspan>
    <tspan x="180" dy="38" font-weight="bold" fill="#db8129">stuck in ContainerCreating or PodInitializing</tspan>
  </text>

  
  
  
  <rect x="50" y="610" width="880" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(80, 640)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="14" y="14" width="28" height="28" rx="4"/>
    <path d="M 20 4 L 20 14 M 28 4 L 28 14 M 36 4 L 36 14 M 20 42 L 20 52 M 28 42 L 28 52 M 36 42 L 36 52 M 4 20 L 14 20 M 4 28 L 14 28 M 4 36 L 14 36 M 42 20 L 52 20 M 42 28 L 52 28 M 42 36 L 52 36"/>
  </g>

  <rect x="80" y="720" width="820" height="220" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  <text x="110" y="775" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="110" dy="0" font-weight="bold">serializeImagePulls false and maxParallelImagePulls 4 (3 to 5 concurrent)</tspan>
    <tspan x="110" dy="48">on nodes with fast NVMe and network;</tspan>
    <tspan x="110" dy="48">kubelet also enforces registryPullQPS and Burst</tspan>
  </text>

  
  
  
  <rect x="960" y="120" width="590" height="850" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="990" y="160" width="530" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1040" cy="205" r="24" fill="#207448"/>
  <text x="1040" y="213" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="1090" y="213" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">tag</text>

  
  <line x1="1255" y1="250" x2="1255" y2="290" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="990" y="292" width="530" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1040" cy="337" r="24" fill="#207448"/>
  <text x="1040" y="345" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="1090" y="345" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">manifest or index</text>

  
  <line x1="1255" y1="382" x2="1255" y2="422" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="990" y="424" width="530" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1040" cy="469" r="24" fill="#207448"/>
  <text x="1040" y="477" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1090" y="477" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">config</text>

  
  <line x1="1255" y1="514" x2="1255" y2="554" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <rect x="990" y="556" width="530" height="380" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1040" cy="610" r="24" fill="#207448"/>
  <text x="1040" y="618" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(1440, 582)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="8" width="48" height="38" rx="4"/>
    <line x1="4" y1="18" x2="52" y2="18"/>
    <circle cx="12" cy="13" r="2" fill="#207448"/>
    <circle cx="18" cy="13" r="2" fill="#207448"/>
  </g>
  <text x="1025" y="680" font-family="sans-serif" font-size="26" fill="#303a36">
    <tspan x="1025" dy="0" font-weight="bold">layers downloaded in parallel,</tspan>
    <tspan x="1025" dy="54" font-weight="bold">digests verified,</tspan>
    <tspan x="1025" dy="54" font-weight="bold">unpacked into the</tspan>
    <tspan x="1025" dy="54" font-weight="bold">overlayfs snapshotter</tspan>
  </text>

  
  
  
  <rect x="50" y="1000" width="1500" height="80" rx="12" fill="#207448"/>
  
  <g transform="translate(75, 1012)" stroke="#ffffff" stroke-width="4" fill="none">
    <path d="M 28 6 L 48 14 v 16 c 0 14 -20 24 -20 24 s -20 -10 -20 -24 V 14 Z"/>
  </g>
  <text x="150" y="1050" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    100 GPU nodes pulling 20 GB each is a registry and bandwidth problem; pre-pull with a DaemonSet
  </text>
</svg>