<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The scheduler's job and model</title>
  <desc>Visual explanation of the Kubernetes scheduler architecture, scheduling queue stages, scheduling cycle plugins, and binding cycle.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448" stroke="#207448" stroke-linejoin="round" />
    </marker>

    
    <marker id="arrow-orange" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#db8129" stroke="#db8129" stroke-linejoin="round" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The scheduler's job and model</text>

  
  
  
  <g transform="translate(50, 105)">
    <rect width="470" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(20, 26)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="46" height="16" rx="3" />
      <circle cx="10" cy="10" r="2" fill="#207448" />
      <circle cx="18" cy="10" r="2" fill="#207448" />
      <rect x="2" y="24" width="46" height="16" rx="3" />
      <circle cx="10" cy="32" r="2" fill="#207448" />
      <circle cx="18" cy="32" r="2" fill="#207448" />
      <line x1="25" y1="40" x2="25" y2="48" />
      <line x1="12" y1="48" x2="38" y2="48" />
    </g>
    
    
    <text x="88" y="52" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">API server: new/updated</text>
    <text x="88" y="84" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Pods, Nodes, PVs, ...</text>
  </g>

  
  
  
  <g transform="translate(50, 260)">
    
    <rect width="470" height="580" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
    <text x="24" y="44" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scheduling queue</text>

    
    <g transform="translate(20, 65)">
      <rect width="430" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(18, 20)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="26,4 48,46 4,46" />
        <line x1="12" y1="32" x2="40" y2="32" />
        <line x1="19" y1="18" x2="33" y2="18" />
      </g>
      <text x="82" y="48" font-family="sans-serif" font-size="27" font-weight="bold" fill="#303a36">activeQ</text>
      <text x="82" y="84" font-family="sans-serif" font-size="24" fill="#303a36">(heap by priority/</text>
      <text x="82" y="116" font-family="sans-serif" font-size="24" fill="#303a36">QueueSort)</text>
    </g>

    
    <g transform="translate(20, 235)">
      <rect width="430" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(18, 20)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
        <circle cx="26" cy="26" r="22" />
        <polyline points="26,12 26,26 36,32" />
      </g>
      <text x="82" y="48" font-family="sans-serif" font-size="27" font-weight="bold" fill="#303a36">backoffQ</text>
      <text x="82" y="84" font-family="sans-serif" font-size="24" fill="#303a36">(recently failed,</text>
      <text x="82" y="116" font-family="sans-serif" font-size="24" fill="#303a36">exponential backoff)</text>
    </g>

    
    <g transform="translate(20, 405)">
      <rect width="430" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      
      <g transform="translate(18, 24)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round">
        <circle cx="26" cy="26" r="22" />
        <line x1="20" y1="16" x2="20" y2="36" />
        <line x1="32" y1="16" x2="32" y2="36" />
      </g>
      <text x="82" y="44" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">unschedulablePods</text>
      <text x="82" y="78" font-family="sans-serif" font-size="24" fill="#303a36">(waiting for a cluster</text>
      <text x="82" y="110" font-family="sans-serif" font-size="24" fill="#303a36">event that could help)</text>
    </g>
  </g>

  
  
  

  
  <g transform="translate(580, 260)">
    <rect width="970" height="96" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <circle cx="46" cy="48" r="24" fill="#207448" />
    <text x="46" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(86, 22)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="26" r="10" />
      <path d="M26,4 L26,10 M26,42 L26,48 M4,26 L10,26 M42,26 L48,26 M10.4,10.4 L14.7,14.7 M37.3,37.3 L41.6,41.6 M10.4,41.6 L14.7,37.3 M37.3,14.7 L41.6,10.4" />
    </g>
    <text x="156" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduling cycle (serial per pod)</text>
  </g>

  
  <g transform="translate(580, 400)">
    <rect width="970" height="106" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="46" cy="53" r="24" fill="#207448" />
    <text x="46" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(86, 26)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4,6 48,6 30,28 30,46 22,42 22,28" />
    </g>
    <text x="156" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">PreFilter → Filter (nodes, parallel) →</text>
    <text x="156" y="84" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">PostFilter (preemption if none fit)</text>
  </g>

  
  <g transform="translate(580, 550)">
    <rect width="970" height="106" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="46" cy="53" r="24" fill="#207448" />
    <text x="46" y="62" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(86, 26)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="44" x2="46" y2="44" />
      <line x1="6" y1="8" x2="6" y2="44" />
      <rect x="12" y="28" width="8" height="16" />
      <rect x="24" y="18" width="8" height="26" />
      <rect x="36" y="8" width="8" height="36" />
    </g>
    <text x="156" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">PreScore → Score (parallel) →</text>
    <text x="156" y="84" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">NormalizeScore → select best</text>
  </g>

  
  <g transform="translate(580, 700)">
    <rect width="970" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="46" cy="48" r="24" fill="#207448" />
    <text x="46" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(86, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26,6 L44,14 L44,28 C44,38 26,46 26,46 C26,46 8,38 8,28 L8,14 Z" />
      <polyline points="18,26 24,32 34,20" />
    </g>
    <text x="156" y="58" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Reserve → Permit (approve/deny/wait)</text>
  </g>

  
  <g transform="translate(580, 840)">
    <rect width="970" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="46" cy="48" r="24" fill="#207448" />
    <text x="46" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(86, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18,30 L12,36 C8,40 8,46 12,50 C16,54 22,54 26,50 L32,44" />
      <path d="M34,22 L40,16 C44,12 44,6 40,2 C36,-2 30,-2 26,2 L20,8" />
      <line x1="18" y1="34" x2="34" y2="18" />
    </g>
    <text x="156" y="58" font-family="sans-serif" font-size="27" font-weight="bold" fill="#303a36">Binding cycle (async): PreBind → Bind → PostBind</text>
  </g>

  
  <g transform="translate(580, 980)">
    <rect width="970" height="96" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="46" cy="48" r="24" fill="#207448" />
    <text x="46" y="57" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g transform="translate(86, 22)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8,6 L32,6 L44,18 L44,46 L8,46 Z" />
      <polyline points="32,6 32,18 44,18" />
      <line x1="16" y1="28" x2="32" y2="28" />
      <line x1="16" y1="36" x2="26" y2="36" />
    </g>
    <text x="156" y="58" font-family="sans-serif" font-size="27" font-weight="bold" fill="#303a36">Binding written (<tspan font-family="monospace">spec.nodeName</tspan>)</text>
  </g>

  
  
  

  
  
  <path d="M 285 215 L 285 321" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  
  <path d="M 500 397 L 540 397 L 540 308 L 576 308" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-orange)" />

  
  <path d="M 1065 356 L 1065 396" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1065 506 L 1065 546" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1065 656 L 1065 696" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1065 796 L 1065 836" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1065 936 L 1065 976" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  
  <path d="M 580 330 L 525 330 L 525 740 L 504 740" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  
  <g transform="translate(535, 480)">
    <rect x="-8" y="-2" width="166" height="42" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="75" y="27" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">no node fits</text>
  </g>

  
  
  <path d="M 70 740 L 25 740 L 25 397 L 66 397" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  
  <g transform="translate(50, 1105)">
    <rect x="0" y="0" width="670" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="335" y="30" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">relevant event (node added, pod deleted, ...)</text>
  </g>
</svg>