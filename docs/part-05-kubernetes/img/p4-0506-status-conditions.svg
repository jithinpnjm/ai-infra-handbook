<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Anatomy of Conditions, observedGeneration, and the /status Subresource</title>
  <desc>Visual explanation of the Kubernetes status subresource boundary, generation tracking, and the structure of conditions.</desc>

  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 44px; font-weight: bold; fill: #303a36; }
      .panel-title { font-family: sans-serif; font-size: 32px; font-weight: bold; fill: #207448; }
      .node-title { font-family: sans-serif; font-size: 30px; font-weight: bold; fill: #303a36; }
      .node-text { font-family: sans-serif; font-size: 24px; fill: #303a36; }
      .code-text { font-family: monospace; font-size: 24px; fill: #207448; font-weight: bold; }
      .code-orange { font-family: monospace; font-size: 24px; fill: #db8129; font-weight: bold; }
      .pill-text { font-family: sans-serif; font-size: 24px; fill: #303a36; font-weight: bold; }
      .desc-text { font-family: sans-serif; font-size: 24px; fill: #52635c; }
      .highlight-text { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; }
    </style>

    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1480" fill="#f5f8f5" />

  
  <text x="60" y="70" class="title">Anatomy of Conditions, observedGeneration, and the /status Subresource</text>

  
  <g id="top-panel">
    <rect x="50" y="110" width="1500" height="520" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="80" y="160" class="panel-title">Subresource Flow</text>

    
    <rect x="80" y="200" width="300" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="130" cy="250" r="20" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 104 290 A 26 26 0 0 1 156 290" fill="none" stroke="#207448" stroke-width="4" />
    <text x="170" y="270" class="node-title">An API client</text>

    
    <rect x="580" y="200" width="440" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="630" cy="250" r="16" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 630 226 L 630 234 M 630 266 L 630 274 M 606 250 L 614 250 M 646 250 L 654 250" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <text x="670" y="260" class="node-title">apiserver</text>
    <text x="610" y="325" class="node-text">increment metadata.generation</text>
    <text x="610" y="360" class="code-text">from 1 to 2</text>

    
    <rect x="1140" y="200" width="380" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 1190 234 A 18 18 0 1 1 1172 252" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="1164,244 1172,254 1182,246" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1225" y="250" class="node-title">Deployment</text>
    <text x="1225" y="285" class="node-title">controller</text>
    <text x="1170" y="350" class="node-text">reconciles the changes</text>

    
    <path d="M 380 270 L 576 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="395" y="195" width="165" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="402" y="224" class="node-text" font-size="20">writes a spec update to</text>
    <text x="160" y="445" class="code-text">/api/v1/namespaces/default/deployments/web</text>

    
    <path d="M 1020 270 L 1136 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    
    <path d="M 1330 400 L 1330 520 L 800 520 L 800 404" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="850" y="465" width="460" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="862" y="494" class="code-orange">writes exclusively to the /status subresource</text>

    <text x="440" y="560" class="node-text">setting status.observedGeneration to 2 without re-incrementing metadata.generation</text>

    
    <rect x="440" y="580" width="420" height="38" rx="8" fill="#db8129" />
    <text x="455" y="607" class="highlight-text">stopping infinite reconcile loops</text>
  </g>

  
  <g id="bottom-panel">
    <rect x="50" y="660" width="1500" height="780" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="80" y="715" class="panel-title">Condition Anatomy</text>

    
    <rect x="80" y="745" width="1440" height="665" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="80" y="745" width="1440" height="60" rx="12" fill="#207448" />
    <text x="110" y="787" class="highlight-text" font-size="28">status.conditions</text>

    

    
    <g transform="translate(110, 830)">
      <rect x="0" y="0" width="550" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" class="code-text">type=Available</text>
      
      <rect x="570" y="0" width="800" height="68" rx="8" fill="#f5f8f5" />
      <text x="594" y="44" class="desc-text">high-level capability</text>
    </g>

    
    <g transform="translate(110, 925)">
      <rect x="0" y="0" width="550" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" class="code-text">status=True</text>
      
      <rect x="570" y="0" width="800" height="68" rx="8" fill="#f5f8f5" />
      <text x="594" y="44" class="desc-text">three-state value: True, False, Unknown</text>
    </g>

    
    <g transform="translate(110, 1020)">
      <rect x="0" y="0" width="550" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" class="code-text">reason=MinimumReplicasAvailable</text>
      
      <rect x="570" y="0" width="800" height="68" rx="8" fill="#f5f8f5" />
      <text x="594" y="44" class="desc-text">machine-readable CamelCase token</text>
    </g>

    
    <g transform="translate(110, 1115)">
      <rect x="0" y="0" width="550" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" class="code-text" font-size="22">message=Deployment has minimum availability</text>
      
      <rect x="570" y="0" width="800" height="68" rx="8" fill="#f5f8f5" />
      <text x="594" y="44" class="desc-text">human diagnostic text</text>
    </g>

    
    <g transform="translate(110, 1210)">
      <rect x="0" y="0" width="550" height="68" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="24" y="44" class="code-text" font-size="21">lastTransitionTime=2025-05-10T12:00:00Z</text>
      
      <rect x="570" y="0" width="800" height="68" rx="8" fill="#f5f8f5" />
      <text x="594" y="44" class="desc-text">timestamp updated only when status flips</text>
    </g>

    
    <g transform="translate(110, 1305)">
      <rect x="0" y="0" width="550" height="78" rx="8" fill="#fdf5ec" stroke="#db8129" stroke-width="2" />
      <text x="24" y="48" class="code-orange">observedGeneration=2</text>
      
      <rect x="570" y="0" width="800" height="78" rx="8" fill="#f5f8f5" />
      <text x="594" y="36" class="desc-text">matching spec generation to confirm</text>
      <text x="594" y="64" class="desc-text">reconciliation is complete</text>
    </g>
  </g>
</svg>