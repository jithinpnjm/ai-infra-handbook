<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Autoscaling symptom to layer to first check</title>
  <desc>Visual guide mapping autoscaling symptoms across metrics, HPA, node, and other infrastructure layers to root causes and initial diagnostic checks.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Autoscaling symptom to layer to first check</text>

  
  <rect x="40" y="80" width="1520" height="42" rx="6" fill="#207448"/>
  <text x="60" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Layer</text>
  <text x="362" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Symptom</text>
  <text x="1112" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">First check</text>

  
  
  <rect x="40" y="132" width="290" height="98" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 153)">
    <path d="M 6 36 A 22 22 0 1 1 48 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <path d="M 27 27 L 38 15" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="27" r="3" fill="#207448"/>
  </g>
  <text x="126" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="126" dy="0">Metrics</tspan>
    <tspan x="126" dy="34">layer</tspan>
  </text>

  
  <rect x="342" y="132" width="738" height="98" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">HPA unknown metric or FailedGetResourceMetric:</tspan>
    <tspan x="362" dy="28">metrics-server missing or unhealthy,</tspan>
    <tspan x="362" dy="28">no CPU requests, kubelet certs</tspan>
  </text>

  
  <rect x="1092" y="132" width="468" height="98" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="160" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
    <tspan x="1112" dy="0">kubectl top pods,</tspan>
    <tspan x="1112" dy="28">metrics-server logs,</tspan>
    <tspan x="1112" dy="28">set requests</tspan>
  </text>

  
  
  <rect x="40" y="242" width="290" height="264" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(157, 305)">
    <rect x="-24" y="-18" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="-38" y="2" width="34" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="4" y="2" width="34" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="185" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">HPA layer</text>

  
  <rect x="342" y="242" width="738" height="88" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">not scaling despite load:</tspan>
    <tspan x="362" dy="26">metric below target, tolerance band,</tspan>
    <tspan x="362" dy="26">readiness delay, maxReplicas hit</tspan>
  </text>

  
  <rect x="1092" y="242" width="468" height="88" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="280" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
    <tspan x="1112" dy="0">kubectl describe hpa</tspan>
    <tspan x="1112" dy="28">conditions and events</tspan>
  </text>

  
  <rect x="342" y="330" width="738" height="88" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">flapping: short scale-down window,</tspan>
    <tspan x="362" dy="30">noisy metric, readiness lag</tspan>
  </text>

  
  <rect x="1092" y="330" width="468" height="88" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">increase stabilisation, smooth</tspan>
    <tspan x="1112" dy="28">metric with</tspan>
    <tspan font-family="ui-monospace, monospace" fill="#207448"> Prometheus avg_over_time</tspan>
  </text>

  
  <rect x="342" y="418" width="738" height="88" rx="6" fill="#fffcf8" stroke="#db8129" stroke-width="2.5"/>
  <text x="362" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold" fill="#db8129">over-scaling inference: </tspan>
    <tspan fill="#303a36">HPA reacts to</tspan>
    <tspan x="362" dy="30">queue spikes faster than model start</tspan>
  </text>

  
  <rect x="1092" y="418" width="468" height="88" rx="6" fill="#fffcf8" stroke="#db8129" stroke-width="2.5"/>
  <text x="1112" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">cap scale-up rate,</tspan>
    <tspan x="1112" dy="30">per-replica metric, pre-warm</tspan>
  </text>

  
  
  <rect x="40" y="518" width="290" height="334" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(157, 620)">
    <rect x="-26" y="-30" width="52" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="-16" cy="-22" r="2" fill="#207448"/>
    <rect x="-26" y="-8" width="52" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="-16" cy="0" r="2" fill="#207448"/>
    <rect x="-26" y="14" width="52" height="15" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="-16" cy="22" r="2" fill="#207448"/>
  </g>
  <text x="185" y="715" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Node layer</text>

  
  <rect x="342" y="518" width="738" height="80" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">scale-up creates Pending pods:</tspan>
    <tspan x="362" dy="28">no capacity, CA disabled, quota</tspan>
  </text>

  
  <rect x="1092" y="518" width="468" height="80" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">CA logs, status ConfigMap</tspan>
  </text>

  
  <rect x="342" y="598" width="738" height="94" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="626" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">CA will not scale up: pod fits no node</tspan>
    <tspan x="362" dy="28">group template (GPU label or taint mismatch),</tspan>
    <tspan x="362" dy="28">group at max, permissions</tspan>
  </text>

  
  <rect x="1092" y="598" width="468" height="94" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="638" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
    <tspan x="1112" dy="0">kubectl -n kube-system logs</tspan>
    <tspan x="1112" dy="30">deploy/cluster-autoscaler</tspan>
  </text>

  
  <rect x="342" y="692" width="738" height="80" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="724" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">CA will not scale down: local storage,</tspan>
    <tspan x="362" dy="28">PDB, annotations, utilisation above threshold</tspan>
  </text>

  
  <rect x="1092" y="692" width="468" height="80" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="724" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">add safe-to-evict,</tspan>
    <tspan x="1112" dy="28">adjust thresholds</tspan>
  </text>

  
  <rect x="342" y="772" width="738" height="80" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="362" dy="0">Karpenter launches wrong instance:</tspan>
  </text>

  
  <rect x="1092" y="772" width="468" height="80" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">requirements too loose</tspan>
  </text>

  
  
  <rect x="40" y="864" width="290" height="254" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(157, 940)">
    <line x1="-22" y1="-26" x2="-22" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-22" cy="-10" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="12" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
    <line x1="22" y1="-26" x2="22" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="-16" r="5" fill="#e8f1ea" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="185" y="1025" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Others</text>

  
  <rect x="342" y="864" width="738" height="80" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="362" dy="0">VPA evicting repeatedly:</tspan>
  </text>

  
  <rect x="1092" y="864" width="468" height="80" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="910" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">Auto mode, use Off or Initial</tspan>
  </text>

  
  <rect x="342" y="944" width="738" height="94" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="972" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="362" dy="0" font-weight="bold">KEDA not scaling from zero: trigger</tspan>
    <tspan x="362" dy="28">authentication, scaler errors, duplicate</tspan>
    <tspan x="362" dy="28">HPA on same target</tspan>
  </text>

  
  <rect x="1092" y="944" width="468" height="94" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="998" font-family="ui-monospace, monospace" font-size="24" fill="#207448">
    <tspan x="1112" dy="0">kubectl describe scaledobject</tspan>
  </text>

  
  <rect x="342" y="1038" width="738" height="80" rx="6" fill="#ffffff" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="362" y="1084" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="362" dy="0">costs high:</tspan>
  </text>

  
  <rect x="1092" y="1038" width="468" height="80" rx="6" fill="#f8faf8" stroke="#c4dcd0" stroke-width="1.5"/>
  <text x="1112" y="1070" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1112" dy="0">minReplicas high, idle pools,</tspan>
    <tspan x="1112" dy="28">spot fallback to on-demand</tspan>
  </text>

  
  <rect x="40" y="1126" width="1520" height="56" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">read the cause before changing a threshold because a threshold change can hide the real fault</text>
</svg>