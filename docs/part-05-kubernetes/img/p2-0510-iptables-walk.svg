<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
  <title>iptables walks a list; IPVS jumps to a hash</title>
  <desc>Comparison between iptables sequential list walk O(n) and IPVS direct hash lookup O(1) for Kubernetes service routing.</desc>

  <defs>
    <marker id="arrow-down" viewBox="0 0 12 12" refX="6" refY="12" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 6 11 L 11 1 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1020" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">iptables walks a list; IPVS jumps to a hash</text>

  
  <rect x="50" y="110" width="730" height="755" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="80" y="140" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <line x1="94" y1="156" x2="122" y2="156" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="168" x2="122" y2="168" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="180" x2="114" y2="180" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="155" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">iptables mode: rules as a list</text>

  
  <rect x="112" y="224" width="56" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <polyline points="112,228 140,248 168,228" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>

  
  <line x1="140" y1="274" x2="140" y2="548" stroke="#207448" stroke-width="4" marker-end="url(#arrow-down)"/>

  
  <text x="175" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="175" dy="0">First packet</tspan>
    <tspan x="175" dy="34">walks the list</tspan>
    <tspan x="175" dy="34">until it matches</tspan>
  </text>

  
  
  <rect x="425" y="225" width="315" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="582" y="267" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service 1 rule</text>

  
  <rect x="425" y="305" width="315" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="582" y="347" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service 2 rule</text>

  
  <rect x="425" y="385" width="315" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="582" y="427" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service 3 rule</text>

  
  <circle cx="582" cy="466" r="4.5" fill="#207448"/>
  <circle cx="582" cy="480" r="4.5" fill="#207448"/>
  <circle cx="582" cy="494" r="4.5" fill="#207448"/>

  
  <rect x="425" y="515" width="315" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="582" y="557" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Service n rule</text>

  
  <rect x="75" y="605" width="680" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="415" y="646" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Cost grows with the number of Services: O(n)</text>

  
  <rect x="75" y="690" width="680" height="75" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <text x="415" y="737" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">Every update rewrites the whole table</text>

  
  <rect x="820" y="110" width="730" height="755" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <rect x="850" y="140" width="56" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <line x1="868" y1="148" x2="868" y2="188" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="888" y1="148" x2="888" y2="188" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="858" y1="158" x2="898" y2="158" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="858" y1="178" x2="898" y2="178" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

  
  <text x="925" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">IPVS mode: hash lookup</text>

  
  <rect x="837" y="395" width="56" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <polyline points="837,399 865,419 893,399" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>

  
  <rect x="1205" y="225" width="315" height="430" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3"/>

  
  <rect x="1225" y="245" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  <rect x="1225" y="297" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  <rect x="1225" y="349" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  
  <rect x="1225" y="401" width="275" height="42" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <rect x="1225" y="453" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  <rect x="1225" y="505" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  <rect x="1225" y="557" width="275" height="42" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>
  <rect x="1225" y="603" width="275" height="38" rx="6" fill="#f5f8f5" stroke="#9bb8a5" stroke-width="1.5"/>

  
  <line x1="897" y1="422" x2="1221" y2="422" stroke="#207448" stroke-width="4" marker-end="url(#arrow-right)"/>

  
  <text x="1059" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Hash lookup: O(1)</text>

  
  <rect x="845" y="690" width="680" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="1185" y="737" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Incremental updates</text>

  
  <rect x="50" y="890" width="1500" height="80" rx="12" fill="#207448"/>
  <text x="800" y="941" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Past tens of thousands of Services, consider IPVS.</text>
</svg>