<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>iptables walks a list; IPVS jumps to a hash</title>
  <desc>Visual comparison between sequential iptables list traversal and O(1) IPVS hash lookup in Kubernetes networking.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-down" markerWidth="14" markerHeight="14" refX="7" refY="10" orient="auto">
      <path d="M 2 1 L 7 11 L 12 1 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    iptables walks a list; IPVS jumps to a hash
  </text>

  
  <rect x="60" y="110" width="710" height="800" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="415" y="165" text-anchor="middle" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">
    iptables mode: rules as a list
  </text>

  
  <g transform="translate(110, 205)">
    <rect x="0" y="0" width="60" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <path d="M 4 4 L 30 26 L 56 4" fill="none" stroke="#207448" stroke-width="3" />
  </g>

  
  
  <g transform="translate(370, 200)">
    <rect x="0" y="0" width="350" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="175" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Service 1 rule</text>
  </g>

  
  <g transform="translate(370, 275)">
    <rect x="0" y="0" width="350" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="175" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Service 2 rule</text>
  </g>

  
  <g transform="translate(370, 350)">
    <rect x="0" y="0" width="350" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="175" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Service 3 rule</text>
  </g>

  
  <circle cx="545" cy="425" r="4" fill="#207448" />
  <circle cx="545" cy="440" r="4" fill="#207448" />
  <circle cx="545" cy="455" r="4" fill="#207448" />

  
  <g transform="translate(370, 480)">
    <rect x="0" y="0" width="350" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="175" y="38" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Service n rule</text>
  </g>

  
  
  <path d="M 175 227 L 290 227 L 290 508 L 360 508" fill="none" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />
  
  
  <rect x="95" y="335" width="220" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="205" y="368" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">First packet walks</text>
  <text x="205" y="400" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">the list until it matches</text>

  
  <g transform="translate(90, 580)">
    <rect x="0" y="0" width="650" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="55" cy="45" r="26" fill="none" stroke="#207448" stroke-width="4" />
    <polyline points="55,27 55,45 69,45" fill="none" stroke="#207448" stroke-width="4" />
    <text x="375" y="54" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      Cost grows with the number of Services: O(n)
    </text>
  </g>

  
  <g transform="translate(90, 700)">
    <rect x="0" y="0" width="650" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(35, 45)">
      <path d="M 28 8 A 24 24 0 1 0 52 32" fill="none" stroke="#db8129" stroke-width="4" />
      <polygon points="56,18 42,32 58,34" fill="#db8129" />
    </g>
    <text x="385" y="85" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#db8129">
      Every update rewrites the whole table
    </text>
  </g>


  
  <rect x="830" y="110" width="710" height="800" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <text x="1185" y="165" text-anchor="middle" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">
    IPVS mode: hash lookup
  </text>

  
  <g transform="translate(880, 310)">
    <rect x="0" y="0" width="60" height="44" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <path d="M 4 4 L 30 26 L 56 4" fill="none" stroke="#207448" stroke-width="3" />
  </g>

  
  <g transform="translate(1220, 200)">
    
    <rect x="0" y="0" width="280" height="340" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="20" y="20" width="240" height="42" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="49" text-anchor="middle" font-family="monospace" font-size="24px" fill="#303a36">[ slot 0 ]</text>

    <rect x="20" y="74" width="240" height="42" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="103" text-anchor="middle" font-family="monospace" font-size="24px" fill="#303a36">[ slot 1 ]</text>

    
    <rect x="20" y="128" width="240" height="46" rx="6" fill="#207448" stroke="#207448" stroke-width="2" />
    <text x="140" y="159" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#ffffff">[ target slot ]</text>

    <rect x="20" y="186" width="240" height="42" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="215" text-anchor="middle" font-family="monospace" font-size="24px" fill="#303a36">[ slot 3 ]</text>

    <circle cx="140" cy="250" r="4" fill="#207448" />
    <circle cx="140" cy="264" r="4" fill="#207448" />
    <circle cx="140" cy="278" r="4" fill="#207448" />

    <rect x="20" y="292" width="240" height="36" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="140" y="318" text-anchor="middle" font-family="monospace" font-size="24px" fill="#303a36">[ slot n ]</text>
  </g>

  
  <path d="M 945 332 L 1210 351" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(970, 245)">
    <rect x="0" y="0" width="230" height="52" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="115" y="35" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
      Hash lookup: O(1)
    </text>
  </g>

  
  <g transform="translate(860, 580)">
    <rect x="0" y="0" width="650" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(305, 50)">
      <circle cx="20" cy="20" r="34" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <polygon points="22, -2 10, 22 22, 22 18, 42 34, 16 22, 16" fill="#207448" />
    </g>
    <text x="325" y="180" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      Incremental updates
    </text>
  </g>


  
  <g transform="translate(60, 940)">
    <rect x="0" y="0" width="1480" height="74" rx="12" fill="#207448" />
    <text x="740" y="47" text-anchor="middle" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">
      Past tens of thousands of Services, consider IPVS.
    </text>
  </g>
</svg>