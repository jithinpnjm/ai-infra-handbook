<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">Where to capture packets on the path between two pods</title>
  <desc>Packet capture points along the path between two pods on two nodes, with a note and a takeaway.</desc>

  <rect width="1600" height="900" fill="#f5f8f5"/>

  
  <text x="60" y="68" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">Where to capture packets on the path</text>
  <text x="60" y="124" font-family="sans-serif" font-size="48" font-weight="700" fill="#303a36">between two pods</text>

  
  <rect x="40" y="185" width="560" height="450" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3">
    <rect x="76" y="205" width="36" height="11" rx="3"/>
    <rect x="76" y="220" width="36" height="11" rx="3"/>
    <rect x="76" y="235" width="36" height="11" rx="3"/>
  </g>
  <text x="124" y="238" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Node A</text>

  
  <rect x="1000" y="185" width="560" height="450" rx="18" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="3">
    <rect x="1036" y="205" width="36" height="11" rx="3"/>
    <rect x="1036" y="220" width="36" height="11" rx="3"/>
    <rect x="1036" y="235" width="36" height="11" rx="3"/>
  </g>
  <text x="1084" y="238" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36">Node B</text>

  
  <rect x="80" y="375" width="200" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4">
    <rect x="152" y="411" width="56" height="44" rx="6"/>
    <line x1="152" y1="426" x2="208" y2="426" stroke-width="3"/>
  </g>
  <circle cx="161" cy="419" r="2.5" fill="#207448"/>
  <circle cx="170" cy="419" r="2.5" fill="#207448"/>
  <text x="180" y="525" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">client pod</text>

  
  <rect x="1320" y="375" width="200" height="190" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
  <g fill="none" stroke="#207448" stroke-width="4">
    <rect x="1392" y="411" width="56" height="44" rx="6"/>
    <line x1="1392" y1="426" x2="1448" y2="426" stroke-width="3"/>
  </g>
  <circle cx="1401" cy="419" r="2.5" fill="#207448"/>
  <circle cx="1410" cy="419" r="2.5" fill="#207448"/>
  <text x="1420" y="525" font-family="sans-serif" font-size="30" font-weight="700" fill="#303a36" text-anchor="middle">server pod</text>

  
  <rect x="280" y="432" width="140" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <ellipse cx="314" cy="470" rx="12" ry="26" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="296" y="424" font-family="sans-serif" font-size="24" fill="#303a36">client veth</text>

  
  <rect x="1180" y="432" width="140" height="76" rx="38" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  <ellipse cx="1286" cy="470" rx="12" ry="26" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="1304" y="424" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="end">server veth</text>

  
  <line x1="280" y1="470" x2="1300" y2="470" stroke="#207448" stroke-width="5"/>
  <polygon points="1320,470 1299,460 1299,480" fill="#207448"/>

  
  <circle cx="390" cy="470" r="24" fill="#207448"/>
  <text x="390" y="480" font-family="sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="800" cy="470" r="24" fill="#207448"/>
  <text x="800" y="480" font-family="sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="1210" cy="470" r="24" fill="#207448"/>
  <text x="1210" y="480" font-family="sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <text x="390" y="545" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">capture here</text>
  <text x="800" y="545" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">capture here</text>
  <text x="1210" y="545" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">capture here</text>

  
  <text x="800" y="400" font-family="sans-serif" font-size="24" fill="#
#303a36" text-anchor="middle">node uplink</text>
  <text x="680" y="445" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">packets</text>

  
  <rect x="610" y="580" width="380" height="168" rx="12" fill="#fdf3e8" stroke="#db8129" stroke-width="3"/>
  <text x="630" y="622" font-family="sans-serif" font-size="24" fill="#303a36"><tspan x="630" dy="0">running <tspan font-family="monospace">tcpdump</tspan> only</tspan><tspan x="630" dy="34">on the node's primary</tspan><tspan x="630" dy="34">interface misses the</tspan><tspan x="630" dy="34">veth and bridge hops.</tspan></text>

  
  <rect x="40" y="790" width="1520" height="64" rx="14" fill="#207448"/>
  <text x="800" y="832" font-family="sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">capture at each hop, so you see where the packets disappear.</text>
</svg>