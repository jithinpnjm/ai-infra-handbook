<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Which pods a ReplicaSet deletes first when scaling down</title>
  <desc>Infographic illustrating the prioritized evaluation order Kubernetes ReplicaSet uses to select pods for deletion during a scale-down event.</desc>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Which pods a ReplicaSet deletes first</tspan>
    <tspan x="800" dy="58">when scaling down</tspan>
  </text>

  
  <g id="worked-example">
    <rect x="40" y="175" width="1520" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">scale from 5 replicas to 3, delete 2</text>
    
    
    <g transform="translate(860, 193)">
      
      <g transform="translate(0, 0)">
        <rect width="90" height="64" rx="8" fill="#ffffff" stroke="#7a8c82" stroke-width="2" stroke-dasharray="6 4"/>
        <line x1="28" y1="16" x2="62" y2="48" stroke="#7a8c82" stroke-width="3" stroke-linecap="round"/>
        <line x1="62" y1="16" x2="28" y2="48" stroke="#7a8c82" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <g transform="translate(125, 0)">
        <rect width="90" height="64" rx="8" fill="#ffffff" stroke="#7a8c82" stroke-width="2" stroke-dasharray="6 4"/>
        <line x1="28" y1="16" x2="62" y2="48" stroke="#7a8c82" stroke-width="3" stroke-linecap="round"/>
        <line x1="62" y1="16" x2="28" y2="48" stroke="#7a8c82" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <g transform="translate(250, 0)">
        <rect width="90" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <polyline points="28,32 40,46 64,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <g transform="translate(375, 0)">
        <rect width="90" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <polyline points="28,32 40,46 64,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <g transform="translate(500, 0)">
        <rect width="90" height="64" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
        <polyline points="28,32 40,46 64,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  
  <g id="bar-1">
    <rect x="40" y="315" width="1520" height="105" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="88" cy="367" r="24" fill="#db8129"/>
    <text x="88" y="367" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(136, 339)">
      <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#db8129" stroke-width="4" stroke-dasharray="6 4"/>
      <circle cx="28" cy="28" r="10" fill="none" stroke="#db8129" stroke-width="4"/>
    </g>
    
    <text x="224" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="224" dy="0">Unscheduled pods (<tspan font-family="monospace, ui-monospace, SFMono-Regular, Menlo, monospace">spec.nodeName</tspan> empty, Pending)</tspan>
      <tspan x="224" dy="34" font-size="24" font-weight="normal">before scheduled pods</tspan>
    </text>
  </g>

  
  <g id="bar-2">
    <rect x="40" y="460" width="1520" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="88" cy="512" r="24" fill="#207448"/>
    <text x="88" y="512" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(136, 484)">
      <path d="M8,28 L24,12 L48,12 L48,36 L32,52 L8,28 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="38" cy="22" r="4" fill="#207448"/>
    </g>
    
    <text x="224" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="224" dy="0">Pods with annotation <tspan font-family="monospace, ui-monospace, SFMono-Regular, Menlo, monospace">controller.kubernetes.io/pod-deletion-cost</tspan>,</tspan>
      <tspan x="224" dy="34" font-weight="normal">lowest integer first</tspan>
    </text>
  </g>

  
  <g id="bar-3">
    <rect x="40" y="605" width="1520" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="88" cy="657" r="24" fill="#207448"/>
    <text x="88" y="657" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(136, 629)">
      <rect x="6" y="8" width="18" height="40" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="32" y="8" width="18" height="40" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="12" y1="18" x2="18" y2="18" stroke="#207448" stroke-width="3"/>
      <line x1="38" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="224" y="647" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="224" dy="0">Pods on nodes with more replicas of this ReplicaSet,</tspan>
      <tspan x="224" dy="34" font-size="24" font-weight="normal">keeps survivors spread across nodes</tspan>
    </text>
  </g>

  
  <g id="bar-4">
    <rect x="40" y="750" width="1520" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="88" cy="802" r="24" fill="#207448"/>
    <text x="88" y="802" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(136, 774)">
      <path d="M28,6 L48,14 L48,30 C48,42 28,50 28,50 C28,50 8,42 8,30 L8,14 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="20" x2="28" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="38" r="2" fill="#207448"/>
    </g>
    
    <text x="224" y="811" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">Not-Ready pods before Ready pods</text>
  </g>

  
  <g id="bar-5">
    <rect x="40" y="895" width="1520" height="105" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="88" cy="947" r="24" fill="#207448"/>
    <text x="88" y="947" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(136, 919)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <text x="224" y="937" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="224" dy="0">Pods Ready for the shortest time last:</tspan>
      <tspan x="224" dy="34" font-size="24" font-weight="normal">newest pods or higher restart counts</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1040" width="1520" height="80" rx="10" fill="#207448"/>
    <text x="800" y="1090" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The controller does not pick at random</text>
  </g>
</svg>