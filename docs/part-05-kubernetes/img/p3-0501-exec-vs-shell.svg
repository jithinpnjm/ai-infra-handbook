<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Shell form hides your app from SIGTERM; exec form does not</title>
  <desc>Visual comparison showing why exec form forwards SIGTERM for graceful shutdown while shell form blocks SIGTERM, leading to timeout and abrupt SIGKILL.</desc>

  <defs>
    
    <marker id="arrow-default" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#303a36" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">Shell form hides your app from SIGTERM; exec form does not</text>

  
  
  <rect x="40" y="110" width="1520" height="490" rx="16" fill="#ffffff" stroke="#c93b2b" stroke-width="4" />

  
  <text x="70" y="155" font-family="monospace" font-size="28px" font-weight="bold" fill="#c93b2b">Shell form: ENTRYPOINT python app.py</text>

  
  <path d="M 70 310 L 298 310" fill="none" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-default)" />
  <text x="175" y="295" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">SIGTERM</text>
  <text x="185" y="355" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#c93b2b">the shell does not forward it</text>

  
  <rect x="310" y="220" width="370" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="330" y="240" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="330" y1="254" x2="378" y2="254" stroke="#207448" stroke-width="3" />
  <circle cx="342" cy="247" r="2.5" fill="#207448" />
  <circle cx="352" cy="247" r="2.5" fill="#207448" />
  <text x="390" y="268" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">PID 1: /bin/sh</text>
  <text x="330" y="340" font-family="monospace" font-size="25px" fill="#303a36">-c python app.py</text>

  
  <rect x="370" y="440" width="250" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <path d="M 495 400 L 495 438" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="495" y="495" text-anchor="middle" font-family="monospace" font-size="26px" font-weight="bold" fill="#303a36">python app</text>

  
  <path d="M 680 310 L 738 310" fill="none" stroke="#303a36" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow-default)" />

  
  <rect x="750" y="200" width="370" height="220" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="935" cy="245" r="24" fill="none" stroke="#207448" stroke-width="4" />
  <polyline points="935,229 935,245 947,245" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="935" y="300" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">waits the full</text>
  <text x="935" y="332" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">terminationGracePeriodSeconds</text>
  <text x="935" y="365" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">(30 seconds by default in</text>
  <text x="935" y="395" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">Kubernetes, 10 seconds for docker stop)</text>

  
  <path d="M 935 420 L 935 485 L 632 485" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
  <text x="800" y="470" text-anchor="middle" font-family="monospace" font-size="28px" font-weight="bold" fill="#db8129">SIGKILL</text>

  
  <rect x="1140" y="440" width="395" height="90" rx="8" fill="#fff5eb" stroke="#db8129" stroke-width="2" />
  <text x="1337" y="478" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#db8129">in-flight requests or</text>
  <text x="1337" y="508" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#db8129">checkpoints can be corrupted</text>

  
  <line x1="935" y1="485" x2="1140" y2="485" stroke="#db8129" stroke-width="2" stroke-dasharray="4,4" />

  
  
  <rect x="40" y="625" width="1520" height="345" rx="16" fill="#ffffff" stroke="#207448" stroke-width="4" />

  
  <text x="70" y="670" font-family="monospace" font-size="28px" font-weight="bold" fill="#207448">Exec form: ENTRYPOINT [python, app.py]</text>

  
  <path d="M 70 805 L 578 805" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)" />
  <text x="310" y="785" text-anchor="middle" font-family="monospace" font-size="28px" font-weight="bold" fill="#207448">SIGTERM</text>
  <text x="310" y="845" text-anchor="middle" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">graceful shutdown</text>

  
  <rect x="590" y="725" width="410" height="160" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
  
  <rect x="620" y="775" width="56" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="620" y1="792" x2="676" y2="792" stroke="#207448" stroke-width="3" />
  <circle cx="632" cy="784" r="3" fill="#207448" />
  <circle cx="644" cy="784" r="3" fill="#207448" />
  <text x="695" y="817" font-family="monospace" font-size="30px" font-weight="bold" fill="#303a36">PID 1: python app</text>

  
  <rect x="1050" y="745" width="485" height="120" rx="10" fill="#f5f8f5" stroke="#303a36" stroke-width="2" />
  <text x="1292" y="795" text-anchor="middle" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">Exit codes:</text>
  <text x="1292" y="830" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">143 = SIGTERM with no handler,</text>
  <text x="1292" y="858" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">137 = SIGKILL</text>

  
  <rect x="40" y="1000" width="1520" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <circle cx="95" cy="1075" r="24" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 95 1043 L 95 1051 M 95 1099 L 95 1107 M 63 1075 L 71 1075 M 119 1075 L 127 1075 M 72 1052 L 78 1058 M 112 1092 L 118 1098 M 72 1098 L 78 1092 M 112 1058 L 118 1052" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="145" y="1062" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">App forks children? Add tini or --init:</text>
  <text x="145" y="1102" font-family="sans-serif" font-size="26px" fill="#303a36">a tiny init that forwards signals and reaps zombies</text>
</svg>