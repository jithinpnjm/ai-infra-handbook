<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300">
  <title>Method</title>
  <desc>Kubernetes troubleshooting method flowchart from symptom definition through layered analysis to hypothesis and fix.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1300" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Method</text>

  
  <rect x="300" y="75" width="1000" height="70" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(325, 90)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="20" cy="18" r="14"/>
    <line x1="20" y1="10" x2="20" y2="20"/>
    <circle cx="20" cy="24" r="1.5" fill="#207448"/>
  </g>
  <text x="820" y="119" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Symptom (what, who, since when, scope)</text>

  
  <line x1="800" y1="145" x2="800" y2="175" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="180" y="175" width="1240" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(210, 192)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="18"/>
    <circle cx="24" cy="24" r="9"/>
    <line x1="24" y1="2" x2="24" y2="46"/>
    <line x1="2" y1="24" x2="46" y2="24"/>
  </g>
  <text x="825" y="212" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="825" dy="0">Define scope: one pod / one node / one namespace / cluster-wide?</tspan>
    <tspan x="825" dy="32">one version / one zone?</tspan>
  </text>

  
  <line x1="800" y1="260" x2="800" y2="290" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="200" y="290" width="1200" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(230, 307)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="24" cy="24" r="18"/>
    <polyline points="24,12 24,24 33,28"/>
  </g>
  <text x="825" y="327" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="825" dy="0">Recent changes: deploys, config, upgrades, node events,</tspan>
    <tspan x="825" dy="32">certs, quotas</tspan>
  </text>

  
  <line x1="800" y1="375" x2="800" y2="415" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <polygon points="800,415 890,455 800,495 710,455" fill="#db8129" stroke="#db8129" stroke-width="2"/>
  <text x="800" y="464" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Layer</text>

  
  <line x1="800" y1="495" x2="800" y2="520" stroke="#207448" stroke-width="3"/>
  <line x1="770" y1="520" x2="830" y2="520" stroke="#207448" stroke-width="3"/>
  <line x1="770" y1="520" x2="770" y2="945" stroke="#207448" stroke-width="3"/>
  <line x1="830" y1="520" x2="830" y2="885" stroke="#207448" stroke-width="3"/>

  

  
  <line x1="770" y1="595" x2="520" y2="595" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="605" y="578" width="80" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="603" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">app</text>

  
  <rect x="40" y="540" width="480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 575)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="36" height="32" rx="4"/>
    <line x1="0" y1="10" x2="36" y2="10"/>
    <circle cx="8" cy="5" r="1.5" fill="#207448"/>
    <circle cx="16" cy="5" r="1.5" fill="#207448"/>
  </g>
  <text x="108" y="572" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="108" dy="0">Logs, probes, exit codes,</tspan>
    <tspan x="108" dy="30">resource limits, config,</tspan>
    <tspan x="108" dy="30">dependencies</tspan>
  </text>

  
  <line x1="770" y1="710" x2="520" y2="710" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="545" y="693" width="200" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="718" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">pod/runtime</text>

  
  <rect x="40" y="660" width="480" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 692)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 18 2 L 34 10 L 34 26 L 18 34 L 2 26 L 2 10 Z"/>
    <line x1="18" y1="18" x2="18" y2="34"/>
    <line x1="18" y1="18" x2="34" y2="10"/>
    <line x1="18" y1="18" x2="2" y2="10"/>
  </g>
  <text x="108" y="692" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="108" dy="0">Events, describe, crictl,</tspan>
    <tspan x="108" dy="30">cgroups, mounts,</tspan>
    <tspan x="108" dy="30">namespaces</tspan>
  </text>

  
  <line x1="770" y1="825" x2="520" y2="825" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="555" y="808" width="180" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="833" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">scheduling</text>

  
  <rect x="40" y="775" width="480" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 807)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="2" y="6" width="32" height="26" rx="3"/>
    <line x1="2" y1="14" x2="34" y2="14"/>
    <line x1="10" y1="2" x2="10" y2="8"/>
    <line x1="26" y1="2" x2="26" y2="8"/>
  </g>
  <text x="108" y="807" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="108" dy="0">FailedScheduling reasons,</tspan>
    <tspan x="108" dy="30">quotas, queues, taints,</tspan>
    <tspan x="108" dy="30">capacity</tspan>
  </text>

  
  <line x1="770" y1="945" x2="520" y2="945" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="575" y="928" width="140" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="645" y="953" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">network</text>

  
  <rect x="40" y="890" width="480" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(56, 927)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="8" r="5"/>
    <circle cx="8" cy="28" r="5"/>
    <circle cx="28" cy="28" r="5"/>
    <line x1="15" y1="12" x2="10" y2="24"/>
    <line x1="21" y1="12" x2="26" y2="24"/>
  </g>
  <text x="108" y="922" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="108" dy="0">DNS → Service → endpoints</tspan>
    <tspan x="108" dy="30">→ CNI → node → underlay</tspan>
    <tspan x="108" dy="30">(ip, tcpdump)</tspan>
  </text>

  

  
  <line x1="830" y1="600" x2="1080" y2="600" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="885" y="583" width="140" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="955" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">storage</text>

  
  <rect x="1080" y="555" width="480" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1096, 582)" stroke="#207448" stroke-width="3" fill="none">
    <ellipse cx="18" cy="8" rx="14" ry="5"/>
    <path d="M 4 8 L 4 26 C 4 30 32 30 32 26 L 32 8"/>
    <path d="M 4 17 C 4 21 32 21 32 17"/>
  </g>
  <text x="1148" y="594" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1148" dy="0">PVC/PV, CSI, mount,</tspan>
    <tspan x="1148" dy="32">fs, I/O latency</tspan>
  </text>

  
  <line x1="830" y1="735" x2="1080" y2="735" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="905" y="718" width="100" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="955" y="743" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">node</text>

  
  <rect x="1080" y="690" width="480" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1096, 717)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="2" y="4" width="32" height="12" rx="2"/>
    <rect x="2" y="20" width="32" height="12" rx="2"/>
    <circle cx="28" cy="10" r="1.5" fill="#207448"/>
    <circle cx="28" cy="26" r="1.5" fill="#207448"/>
  </g>
  <text x="1148" y="729" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1148" dy="0">kubelet, runtime, kernel,</tspan>
    <tspan x="1148" dy="32">hardware, GPU/NIC health</tspan>
  </text>

  
  <line x1="830" y1="885" x2="1080" y2="885" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="845" y="868" width="220" height="34" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="955" y="893" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">control plane</text>

  
  <rect x="1080" y="835" width="480" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1096, 867)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="18" r="8"/>
    <path d="M 18 2 L 18 7 M 18 29 L 18 34 M 2 18 L 7 18 M 29 18 L 34 18"/>
    <path d="M 7 7 L 10 10 M 26 26 L 29 29 M 7 29 L 10 26 M 26 10 L 29 7"/>
  </g>
  <text x="1148" y="867" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1148" dy="0">API latency, etcd,</tspan>
    <tspan x="1148" dy="30">controllers, webhooks,</tspan>
    <tspan x="1148" dy="30">certs</tspan>
  </text>

  

  
  <line x1="40" y1="595" x2="18" y2="595" stroke="#207448" stroke-width="3"/>
  <line x1="40" y1="710" x2="18" y2="710" stroke="#207448" stroke-width="3"/>
  <line x1="40" y1="825" x2="18" y2="825" stroke="#207448" stroke-width="3"/>
  <line x1="40" y1="945" x2="18" y2="945" stroke="#207448" stroke-width="3"/>
  
  <line x1="18" y1="595" x2="18" y2="1035" stroke="#207448" stroke-width="3"/>
  
  <line x1="18" y1="1035" x2="800" y2="1035" stroke="#207448" stroke-width="3"/>

  
  <line x1="1560" y1="600" x2="1582" y2="600" stroke="#207448" stroke-width="3"/>
  <line x1="1560" y1="735" x2="1582" y2="735" stroke="#207448" stroke-width="3"/>
  <line x1="1560" y1="885" x2="1582" y2="885" stroke="#207448" stroke-width="3"/>
  
  <line x1="1582" y1="600" x2="1582" y2="1035" stroke="#207448" stroke-width="3"/>
  
  <line x1="1582" y1="1035" x2="800" y2="1035" stroke="#207448" stroke-width="3"/>

  
  <line x1="800" y1="1035" x2="800" y2="1065" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  

  
  <rect x="300" y="1065" width="1000" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(325, 1083)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 12 28 L 24 28 M 14 33 L 22 33"/>
    <path d="M 10 18 C 6 14 8 6 18 6 C 28 6 30 14 26 18 C 23 21 23 24 23 25 L 13 25 C 13 24 13 21 10 18 Z"/>
  </g>
  <text x="825" y="1112" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Form hypothesis → cheapest discriminating test</text>

  
  <line x1="800" y1="1140" x2="800" y2="1175" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="350" y="1175" width="900" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(375, 1193)" stroke="#207448" stroke-width="3" fill="none">
    <circle cx="18" cy="18" r="16"/>
    <polyline points="10,18 16,24 27,12"/>
  </g>
  <text x="825" y="1222" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">Fix or mitigate → verify → document</text>
</svg>