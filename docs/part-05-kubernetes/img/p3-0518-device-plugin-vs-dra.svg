<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Counting GPUs versus describing them</title>
  <desc>Comparison between Kubernetes device plugin count-based allocation and Dynamic Resource Allocation (DRA) shape-based matching.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Counting GPUs versus describing them</text>

  
  <rect x="40" y="115" width="730" height="935" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="75" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Device plugin: I have 8 GPUs</text>

  
  <rect x="65" y="195" width="680" height="200" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="245" r="24" fill="#207448" />
  <text x="115" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <rect x="160" y="224" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="170" y1="238" x2="185" y2="238" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="170" y1="252" x2="185" y2="252" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <circle cx="204" cy="238" r="3" fill="#207448" />
  <circle cx="204" cy="252" r="3" fill="#207448" />
  <text x="100" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="100" dy="0">node advertises</tspan>
    <tspan x="100" dy="34" font-family="ui-monospace, monospace">nvidia.com/gpu: 8</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> as an integer</tspan>
  </text>

  
  <rect x="65" y="420" width="680" height="385" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="470" r="24" fill="#207448" />
  <text x="115" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <path d="M 188 442 L 214 456 L 214 484 L 188 498 L 162 484 L 162 456 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <path d="M 188 442 L 188 470 M 162 456 L 188 470 L 214 456" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  <text x="100" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="100" dy="0">pod asks for a count</tspan>
  </text>

  
  <rect x="65" y="830" width="680" height="200" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="115" cy="880" r="24" fill="#207448" />
  <text x="115" y="889" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <circle cx="188" cy="880" r="16" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="188" y1="856" x2="188" y2="862" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="188" y1="898" x2="188" y2="904" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="164" y1="880" x2="170" y2="880" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="206" y1="880" x2="212" y2="880" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="100" y="950" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="100" dy="0">scheduler cannot tell which GPUs</tspan>
    <tspan x="100" dy="34">share a PCIe root or NVLink domain</tspan>
  </text>

  
  <rect x="830" y="115" width="730" height="935" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="865" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">DRA: describe the shape</text>

  
  <rect x="855" y="195" width="680" height="200" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="905" cy="245" r="24" fill="#207448" />
  <text x="905" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <rect x="950" y="222" width="48" height="28" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="958" y1="258" x2="998" y2="258" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <line x1="964" y1="266" x2="992" y2="266" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <text x="890" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">drivers publish <tspan font-family="ui-monospace, monospace">ResourceSlice</tspan> objects</tspan>
    <tspan x="890" dy="32">with attributes product, memory,</tspan>
    <tspan x="890" dy="32">MIG profile, PCI root, NVLink domain</tspan>
  </text>

  
  <rect x="855" y="420" width="680" height="385" rx="12" ry="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="905" cy="470" r="24" fill="#207448" />
  <text x="905" y="479" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <rect x="952" y="444" width="40" height="50" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="962" y1="458" x2="982" y2="458" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="962" y1="468" x2="982" y2="468" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="962" y1="478" x2="976" y2="478" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="890" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">pod references a <tspan font-family="ui-monospace, monospace">ResourceClaimTemplate</tspan></tspan>
    <tspan x="890" dy="31" font-family="ui-monospace, monospace">four-gpus-same-root</tspan>
    <tspan x="890" dy="31">with <tspan font-family="ui-monospace, monospace">deviceClassName gpu.nvidia.com,</tspan></tspan>
    <tspan x="890" dy="31" font-family="ui-monospace, monospace">count 4,</tspan> a CEL selector
    <tspan x="890" dy="31" font-family="ui-monospace, monospace">device.attributes productName ==</tspan>
    <tspan x="890" dy="31" font-family="ui-monospace, monospace">NVIDIA H100 80GB HBM3,</tspan> and constraint
    <tspan x="890" dy="31"><tspan font-family="ui-monospace, monospace">matchAttribute</tspan></tspan>
    <tspan x="890" dy="31" font-family="ui-monospace, monospace">resource.kubernetes.io/pcieRoot</tspan>
  </text>

  
  <rect x="855" y="830" width="680" height="200" rx="12" ry="12" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
  <circle cx="905" cy="880" r="24" fill="#db8129" />
  <text x="905" y="889" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <circle cx="975" cy="880" r="18" fill="none" stroke="#db8129" stroke-width="4" />
  <circle cx="975" cy="880" r="7" fill="none" stroke="#db8129" stroke-width="3" />
  <line x1="975" y1="854" x2="975" y2="860" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="975" y1="900" x2="975" y2="906" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="949" y1="880" x2="955" y2="880" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <line x1="995" y1="880" x2="1001" y2="880" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <text x="890" y="950" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="890" dy="0">scheduler matches a request</tspan>
    <tspan x="890" dy="34">for a shape of hardware</tspan>
  </text>

  
  <rect x="40" y="1070" width="1520" height="90" rx="10" ry="10" fill="#207448" />
  <text x="800" y="1108" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">
    <tspan x="800" dy="0">attribute names and API versions differ by driver and release, verify them;</tspan>
    <tspan x="800" dy="34">choose the topology key first, then apply it with node affinity, Kueue TAS or a DRA claim</tspan>
  </text>
</svg>