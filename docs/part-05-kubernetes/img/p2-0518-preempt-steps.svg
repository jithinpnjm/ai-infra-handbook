<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Preemption: simulate first, evict only if it fits</title>
  <desc>Infographic showing the Kubernetes preemption lifecycle: simulation, eviction decision, node selection ranking, victim termination, and preemptor scheduling.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Preemption: simulate first, evict only if it fits</text>

  
  <rect x="160" y="95" width="840" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="215" cy="140" r="24" fill="#207448"/>
  <text x="215" y="149" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="260" y="115" width="50" height="50" rx="10"/>
    <line x1="285" y1="126" x2="285" y2="145"/>
    <circle cx="285" cy="154" r="1.5" fill="#207448"/>
  </g>
  
  <text x="340" y="133" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">High-priority pod fits on no node</text>
  <text x="340" y="167" font-family="monospace" font-size="28" font-weight="bold" fill="#303a36">(PostFilter)</text>

  
  <line x1="580" y1="185" x2="580" y2="220" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="160" y="220" width="840" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="215" cy="265" r="24" fill="#207448"/>
  <text x="215" y="274" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="260" y="240" width="50" height="36" rx="6"/>
    <line x1="285" y1="276" x2="285" y2="288"/>
    <line x1="273" y1="288" x2="297" y2="288"/>
    <polygon points="280,250 292,258 280,266" fill="#207448"/>
  </g>
  
  <text x="340" y="257" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Simulate removing lower-priority</text>
  <text x="340" y="291" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">pods on candidate nodes</text>

  
  <line x1="580" y1="310" x2="580" y2="345" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  
  <circle cx="230" cy="370" r="24" fill="#207448"/>
  <text x="230" y="379" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  
  <polygon points="580,345 880,445 580,545 280,445" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="580" y1="365" x2="580" y2="400"/>
    <line x1="563" y1="373" x2="597" y2="373"/>
    <polygon points="558,388 568,388 563,373"/>
    <polygon points="592,388 602,388 597,373"/>
    <line x1="572" y1="400" x2="588" y2="400"/>
  </g>

  
  <text x="580" y="435" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Would the new pod</text>
  <text x="580" y="468" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">fit if these pods</text>
  <text x="580" y="501" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">were gone?</text>

  
  <path d="M 280 445 L 80 445 L 80 265 L 160 265" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="210" y="435" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">no</text>

  
  <line x1="580" y1="545" x2="580" y2="615" stroke="#db8129" stroke-width="4.5" marker-end="url(#arrow-orange)"/>
  <text x="605" y="585" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">yes</text>

  
  <rect x="160" y="615" width="840" height="277" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="215" cy="660" r="24" fill="#207448"/>
  <text x="215" y="669" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 642 L 308 642 L 293 662 L 293 678 L 277 678 L 277 662 Z"/>
    <line x1="272" y1="650" x2="298" y2="650"/>
  </g>
  
  <text x="340" y="652" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pick the candidate node</text>
  <text x="340" y="686" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">that needs the fewest victims</text>

  
  <rect x="200" y="705" width="760" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="731" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fewest PDB violations</text>

  <rect x="200" y="751" width="760" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="777" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">lowest highest-victim priority</text>

  <rect x="200" y="797" width="760" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="823" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">fewest victims</text>

  <rect x="200" y="843" width="760" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="869" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">latest start time</text>

  
  <line x1="580" y1="892" x2="580" y2="925" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="160" y="925" width="840" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="215" cy="980" r="24" fill="#207448"/>
  <text x="215" y="989" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="285" cy="980" r="22"/>
    <polyline points="285,966 285,980 297,980"/>
  </g>
  
  <text x="340" y="958" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Set <tspan font-family="monospace">status.nominatedNodeName</tspan></text>
  <text x="340" y="988" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">and delete the victims, which</text>
  <text x="340" y="1018" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">finish their grace periods</text>

  
  <line x1="580" y1="1035" x2="580" y2="1070" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="160" y="1070" width="840" height="90" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="202" y="1092" width="46" height="46" rx="8"/>
    <line x1="214" y1="1086" x2="214" y2="1094"/>
    <line x1="236" y1="1086" x2="236" y2="1094"/>
    <polyline points="214,1116 222,1124 236,1106"/>
  </g>
  
  <text x="275" y="1106" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Preemptor schedules once resources free up,</text>
  <text x="275" y="1140" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">though other pods may take them</text>

  
  <rect x="1070" y="650" width="460" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="1300,682 1334,742 1266,742"/>
    <line x1="1300" y1="701" x2="1300" y2="723"/>
    <circle cx="1300" cy="733" r="1.5" fill="#207448"/>
  </g>
  
  <text x="1300" y="780" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Preemption can cascade:</text>
  <text x="1300" y="815" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">a victim rescheduled</text>
  <text x="1300" y="850" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">may preempt another pod</text>
</svg>