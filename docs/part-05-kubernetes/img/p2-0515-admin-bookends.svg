<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Admin policy at the front, baseline at the back</title>
  <desc>Evaluation order showing AdminNetworkPolicy guardrail at the front, NetworkPolicy in the middle, and BaselineAdminNetworkPolicy default at the back.</desc>

  <rect width="1600" height="1000" fill="#f5f8f5"/>

  
  <text x="800" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Admin policy at the front, baseline at the back</text>

  
  
  <path d="M 30 200 L 1550 200" fill="none" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1570,200 1546,190 1546,210" fill="#207448"/>

  
  <path d="M 750 200 C 780 200 810 150 850 150 L 910 150" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <polygon points="925,150 905,142 905,158" fill="#207448"/>
  <text x="935" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">A team can still open a port here</text>

  
  <rect x="40" y="240" width="1520" height="460" rx="20" fill="#f5f8f5" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>

  
  <rect x="50" y="250" width="450" height="440" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>

  
  <g transform="translate(247, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0 15 L 8 0 L 16 15 L 16 55 L 0 55 Z"/>
    <path d="M 20 15 L 28 0 L 36 15 L 36 55 L 20 55 Z"/>
    <path d="M 40 15 L 48 0 L 56 15 L 56 55 L 40 55 Z"/>
    <line x1="-6" y1="22" x2="62" y2="22"/>
    <line x1="-6" y1="42" x2="62" y2="42"/>
  </g>

  
  <text x="275" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="275" dy="0">Guardrail tenants</tspan>
    <tspan x="275" dy="32">cannot override</tspan>
  </text>

  <line x1="80" y1="445" x2="470" y2="445" stroke="#db8129" stroke-width="2" stroke-opacity="0.4"/>

  
  <text x="275" y="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="275" dy="0" font-size="30" font-weight="bold" fill="#303a36">AdminNetworkPolicy:</tspan>
    <tspan x="275" dy="44" font-size="24" fill="#303a36">runs first, Allow, Deny</tspan>
    <tspan x="275" dy="36" font-size="24" fill="#303a36">or Pass by priority</tspan>
  </text>

  
  <rect x="525" y="250" width="450" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(722, 275)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0 8 L 28 0 L 56 8 C 56 32 28 56 28 56 C 28 56 0 32 0 8 Z"/>
    <circle cx="28" cy="24" r="6"/>
    <path d="M 28 30 L 28 40"/>
  </g>

  <line x1="555" y1="445" x2="945" y2="445" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

  
  <text x="750" y="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="750" dy="0" font-size="30" font-weight="bold" fill="#303a36">NetworkPolicy:</tspan>
    <tspan x="750" dy="44" font-size="24" fill="#303a36">the namespace</tspan>
    <tspan x="750" dy="36" font-size="24" fill="#303a36">owner&apos;s policy</tspan>
  </text>

  
  <rect x="1000" y="250" width="550" height="440" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <g transform="translate(1247, 280)" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 6 22 L 6 8 C 6 4 10 0 14 0 L 42 0 C 46 0 50 4 50 8 L 50 22"/>
    <rect x="0" y="16" width="12" height="28" rx="6"/>
    <rect x="44" y="16" width="12" height="28" rx="6"/>
    <rect x="12" y="24" width="32" height="20" rx="4"/>
    <line x1="8" y1="44" x2="4" y2="52"/>
    <line x1="48" y1="44" x2="52" y2="52"/>
  </g>

  
  <text x="1275" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Default, not a wall</text>

  <line x1="1030" y1="445" x2="1520" y2="445" stroke="#207448" stroke-width="2" stroke-opacity="0.3"/>

  
  <text x="1275" y="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <tspan x="1275" dy="0" font-size="30" font-weight="bold" fill="#303a36">BaselineAdminNetworkPolicy:</tspan>
    <tspan x="1275" dy="44" font-size="24" fill="#303a36">default posture for traffic</tspan>
    <tspan x="1275" dy="36" font-size="24" fill="#303a36">no namespace policy claims</tspan>
  </text>

  
  <rect x="320" y="735" width="960" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="788" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">Deny egress to the Internet unless allowed</text>

  
  <rect x="50" y="865" width="1500" height="80" rx="14" fill="#207448"/>
  <text x="800" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Admin policy and baseline are bookends around namespace policy.</text>
</svg>