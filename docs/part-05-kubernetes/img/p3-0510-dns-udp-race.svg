<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The 1 to 5 second DNS delay from a UDP race</title>
  <desc>Sequence diagram illustrating parallel UDP DNS lookups racing for conntrack DNAT entry insertion resulting in a 1 to 5 second delay.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The 1 to 5 second DNS delay from a UDP race</text>

  

  
  <g id="participant-pod">
    <rect x="50" y="95" width="380" height="110" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 122)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="52" height="44" rx="5" />
      <line x1="2" y1="18" x2="54" y2="18" />
      <circle cx="10" cy="12" r="2" fill="#207448" />
      <circle cx="18" cy="12" r="2" fill="#207448" />
      <circle cx="26" cy="12" r="2" fill="#207448" />
    </g>
    <text x="260" y="162" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Pod resolver</text>
  </g>

  
  <line x1="240" y1="205" x2="240" y2="605" stroke="#a9c4b3" stroke-width="3" stroke-dasharray="8 6" />

  
  <g id="note-parallel-port">
    <rect x="50" y="235" width="380" height="85" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="240" y="270" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="240" dy="0">in parallel from the</tspan>
      <tspan x="240" dy="30">same UDP source port</tspan>
    </text>
  </g>

  
  <g id="step-pod-wait">
    <rect x="50" y="475" width="380" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(70, 510)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="22" cy="22" r="20" />
      <polyline points="22,10 22,22 32,22" />
    </g>
    <text x="255" y="525" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="255" dy="0">Pod waits 1 s or 5 s</tspan>
      <tspan x="255" dy="32">then retries</tspan>
    </text>
  </g>

  
  
  <g id="msg-a-lookup">
    <line x1="430" y1="270" x2="858" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="645" y="255" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">A lookup</text>
  </g>

  
  <g id="msg-aaaa-lookup">
    <line x1="430" y1="345" x2="858" y2="345" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="645" y="330" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">AAAA lookup</text>
  </g>

  
  <g id="panel-node-kernel">
    <rect x="860" y="95" width="690" height="515" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g id="card-node-insert">
      <rect x="885" y="115" width="640" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(905, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="40" height="40" rx="5" />
        <rect x="18" y="18" width="20" height="20" stroke-width="3" />
        <line x1="18" y1="2" x2="18" y2="8" />
        <line x1="28" y1="2" x2="28" y2="8" />
        <line x1="38" y1="2" x2="38" y2="8" />
        <line x1="18" y1="48" x2="18" y2="54" />
        <line x1="28" y1="48" x2="28" y2="54" />
        <line x1="38" y1="48" x2="38" y2="54" />
        <line x1="2" y1="18" x2="8" y2="18" />
        <line x1="2" y1="28" x2="8" y2="28" />
        <line x1="2" y1="38" x2="8" y2="38" />
        <line x1="48" y1="18" x2="54" y2="18" />
        <line x1="48" y1="28" x2="54" y2="28" />
        <line x1="48" y1="38" x2="54" y2="38" />
      </g>
      <text x="1245" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1245" dy="0">Both reach the node;</tspan>
        <tspan x="1245" dy="30">the kernel must insert the</tspan>
        <tspan x="1245" dy="30">DNAT conntrack entry for each</tspan>
      </text>
    </g>

    
    <g id="card-guest-book">
      <rect x="885" y="255" width="640" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(905, 284)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 10 L 28 14 L 48 10 L 48 46 L 28 50 L 8 46 Z" />
        <line x1="28" y1="14" x2="28" y2="50" />
        <line x1="14" y1="22" x2="22" y2="24" />
        <line x1="14" y1="32" x2="22" y2="34" />
        <line x1="34" y1="24" x2="42" y2="22" />
        <line x1="34" y1="34" x2="42" y2="32" />
      </g>
      <text x="1245" y="297" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="1245" dy="0">two people sign the same guest</tspan>
        <tspan x="1245" dy="32">book at the same instant</tspan>
      </text>
    </g>

    
    <g id="card-packet-lost">
      <rect x="885" y="385" width="640" height="210" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
      
      <g transform="translate(905, 462)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="22" />
        <line x1="28" y1="14" x2="28" y2="30" stroke-width="4.5" />
        <circle cx="28" cy="38" r="2.5" fill="#db8129" />
      </g>
      <text x="1245" y="480" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
        <tspan x="1245" dy="0">one packet loses the insertion,</tspan>
        <tspan x="1245" dy="36">a reply is lost</tspan>
      </text>
    </g>
  </g>

  
  <g id="section-timeline-bar">
    <rect x="50" y="630" width="1500" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 680)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <line x1="28" y1="14" x2="28" y2="28" />
      <line x1="28" y1="28" x2="38" y2="28" />
      <line x1="16" y1="8" x2="22" y2="4" />
      <line x1="40" y1="8" x2="34" y2="4" />
    </g>

    
    <g id="bar-normal">
      <rect x="160" y="648" width="1360" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <rect x="160" y="648" width="180" height="54" rx="8" fill="#207448" />
      <text x="370" y="683" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">normal reply in milliseconds</text>
    </g>

    
    <g id="bar-delay">
      <rect x="160" y="715" width="1360" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <rect x="160" y="715" width="950" height="54" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <text x="370" y="750" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">delay of 1 s or 5 s</text>
    </g>
  </g>

  
  <g id="section-mitigations">
    <rect x="50" y="800" width="1500" height="160" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 852)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 10 L 28 4 L 46 10 C 46 32 28 48 28 48 C 28 48 10 32 10 10 Z" />
      <path d="M 20 25 L 26 31 L 37 19" />
    </g>
    
    <rect x="160" y="818" width="1360" height="124" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="840" y="870" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">
      <tspan x="840" dy="0"><tspan font-family="monospace">single-request-reopen</tspan> in <tspan font-family="monospace">resolv.conf</tspan> options, use TCP for DNS,</tspan>
      <tspan x="840" dy="36">NodeLocal DNSCache, newer kernels fix it</tspan>
    </text>
  </g>

  
  <g id="section-related">
    <rect x="50" y="980" width="1500" height="170" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 1037)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11" stroke-width="4.5" />
    </g>
    
    <rect x="160" y="998" width="1360" height="134" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="840" y="1052" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="840" dy="0">stale UDP conntrack entries can keep sending to a deleted backend until timeout;</tspan>
      <tspan x="840" dy="36">check <tspan font-family="monospace">conntrack -L -p udp | grep svc</tspan></tspan>
    </text>
  </g>
</svg>