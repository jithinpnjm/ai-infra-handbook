<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>Proving a default deny: open, deny, then one allowed door</title>
  <desc>Visual explanation showing three steps to prove a Kubernetes NetworkPolicy: baseline open connection, default deny ingress timeout, and specific test-source allow rule.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>

    
    <marker id="arrow-grey" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#7a8b82"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Proving a default deny: open, deny, then one allowed door</text>


  
  
  <circle cx="290" cy="115" r="24" fill="#207448"/>
  <text x="290" y="124" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

  
  <rect x="50" y="155" width="480" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="290" y="196" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="290" dy="0">Step 1</tspan>
    <tspan x="290" dy="34">open, no policy</tspan>
  </text>
  <line x1="75" y1="248" x2="505" y2="248" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4"/>

  
  <g id="p1-test-source">
    <rect x="70" y="270" width="160" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(126, 285)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="34" rx="4"/>
      <line x1="0" y1="11" x2="48" y2="11"/>
      <circle cx="8" cy="5.5" r="2" fill="#207448"/>
      <circle cx="16" cy="5.5" r="2" fill="#207448"/>
    </g>
    
    <text x="150" y="365" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">test-source</text>
  </g>

  
  <g id="p1-namespace">
    <rect x="210" y="475" width="300" height="440" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
    
    
    <rect x="280" y="530" width="160" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(336, 555)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="36" rx="4"/>
      <line x1="0" y1="12" x2="48" y2="12"/>
      <circle cx="8" cy="6" r="2" fill="#207448"/>
      <circle cx="16" cy="6" r="2" fill="#207448"/>
    </g>
    
    <text x="360" y="650" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">kuard</text>

    
    <rect x="230" y="835" width="260" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="360" y="870" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">kuard-networkpolicy</text>
  </g>

  
  <path d="M 150 395 L 150 470 L 360 470 L 360 530" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <text x="255" y="418" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="255" dy="0">wget returns</tspan>
    <tspan x="255" dy="28">the page</tspan>
  </text>


  
  
  <circle cx="800" cy="115" r="24" fill="#207448"/>
  <text x="800" y="124" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

  
  <rect x="560" y="155" width="480" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="800" y="196" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">Step 2</tspan>
    <tspan x="800" dy="34">default deny ingress</tspan>
  </text>
  <line x1="585" y1="248" x2="1015" y2="248" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4"/>

  
  <g id="p2-source">
    <rect x="580" y="270" width="160" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(636, 315)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="34" rx="4"/>
      <line x1="0" y1="11" x2="48" y2="11"/>
      <circle cx="8" cy="5.5" r="2" fill="#207448"/>
      <circle cx="16" cy="5.5" r="2" fill="#207448"/>
    </g>
  </g>

  
  <g id="p2-namespace">
    <rect x="720" y="475" width="300" height="440" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

    
    <rect x="790" y="580" width="160" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(846, 635)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="36" rx="4"/>
      <line x1="0" y1="12" x2="48" y2="12"/>
      <circle cx="8" cy="6" r="2" fill="#207448"/>
      <circle cx="16" cy="6" r="2" fill="#207448"/>
    </g>

    
    <path d="M 735 515 L 1005 515 L 1005 710 Q 1005 870 870 895 Q 735 870 735 710 Z" fill="#fffaf5" fill-opacity="0.88" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      
    
    <g transform="translate(854, 532)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="14" width="32" height="24" rx="3"/>
      <path d="M 12 14 V 8 A 8 8 0 0 1 28 8 V 14"/>
      <circle cx="20" cy="24" r="2.5" fill="none"/>
      <line x1="20" y1="26.5" x2="20" y2="31"/>
    </g>

    
    <text x="870" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">default-deny-ingress</text>
  </g>

  
  <path d="M 660 395 L 660 470 L 870 470 L 870 515" fill="none" stroke="#7a8b82" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-grey)"/>
  
  <text x="765" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8b82">wget times out</text>


  
  
  <circle cx="1310" cy="115" r="24" fill="#207448"/>
  <text x="1310" y="124" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

  
  <rect x="1070" y="155" width="480" height="785" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

  
  <text x="1310" y="196" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="1310" dy="0">Step 3</tspan>
    <tspan x="1310" dy="34">allow test source</tspan>
  </text>
  <line x1="1095" y1="248" x2="1525" y2="248" stroke="#207448" stroke-width="1.5" stroke-opacity="0.4"/>

  
  <g id="p3-test-source">
    <rect x="1090" y="270" width="160" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(1146, 315)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="34" rx="4"/>
      <line x1="0" y1="11" x2="48" y2="11"/>
      <circle cx="8" cy="5.5" r="2" fill="#207448"/>
      <circle cx="16" cy="5.5" r="2" fill="#207448"/>
    </g>
  </g>

  
  <g id="p3-any-other-pod" opacity="0.75">
    <rect x="1085" y="740" width="185" height="145" rx="12" fill="#ffffff" stroke="#7a8b82" stroke-width="2.5" stroke-dasharray="6 4"/>
    
    <g transform="translate(1153, 762)" stroke="#7a8b82" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="36" rx="4"/>
      <line x1="0" y1="12" x2="48" y2="12"/>
      <circle cx="8" cy="6" r="2" fill="#7a8b82"/>
      <circle cx="16" cy="6" r="2" fill="#7a8b82"/>
    </g>
    
    <text x="1177" y="855" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8b82">any other pod</text>
  </g>

  
  <g id="p3-namespace">
    <rect x="1285" y="460" width="250" height="455" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>

    
    <rect x="1335" y="650" width="160" height="150" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(1391, 705)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="48" height="36" rx="4"/>
      <line x1="0" y1="12" x2="48" y2="12"/>
      <circle cx="8" cy="6" r="2" fill="#207448"/>
      <circle cx="16" cy="6" r="2" fill="#207448"/>
    </g>

    
    <path d="M 1370 540 L 1310 540 L 1310 850 L 1510 850 L 1510 540 L 1460 540" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    
    
    <g id="door-structure">
      
      <line x1="1370" y1="540" x2="1460" y2="540" stroke="#207448" stroke-width="2" stroke-dasharray="4 3"/>
      
      <line x1="1460" y1="540" x2="1490" y2="510" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

      
      <rect x="1145" y="510" width="215" height="58" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(1155, 522)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="10" width="22" height="16" rx="2"/>
        <path d="M 8 10 V 6 A 6 6 0 0 1 20 6 V 10"/>
        <circle cx="14" cy="18" r="2" fill="#207448"/>
      </g>
      
      <text x="1270" y="548" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">access-kuard</text>
    </g>
  </g>

  
  
  <path d="M 1170 395 L 1170 470 L 1415 470 L 1415 650" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  
  <text x="1295" y="418" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1295" dy="0">run test-source</tspan>
    <tspan x="1295" dy="28">allowed</tspan>
  </text>

  
  <line x1="1270" y1="815" x2="1310" y2="815" stroke="#7a8b82" stroke-width="3.5" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>


  
  <rect x="50" y="965" width="1500" height="75" rx="12" fill="#207448"/>
  <text x="800" y="1012" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">the open test sets the baseline, the deny test proves the default works, and the allow test shows one rule opens exactly one door.</text>

</svg>