<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Proving a default deny: open, deny, then one allowed door</title>
  <desc>Three-step visual sequence showing default deny network policy: first open without policy, then default deny blocking ingress traffic, and finally one policy allowing a single test source.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#7a8b84" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    Proving a default deny: open, deny, then one allowed door
  </text>

  
  
  
  <g id="panel-1">
    
    <rect x="50" y="110" width="480" height="810" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <circle cx="290" cy="155" r="22" fill="#207448" />
    <text x="290" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>

    
    <text x="290" y="205" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Step 1 open, no policy
    </text>

    
    <rect x="160" y="235" width="260" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="176" y="252" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="176" y1="260" x2="210" y2="260" stroke="#207448" stroke-width="2" />
    <circle cx="183" cy="256" r="1.5" fill="#207448" />
    <circle cx="189" cy="256" r="1.5" fill="#207448" />
    
    <text x="225" y="278" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">test-source</text>

    
    <rect x="250" y="425" width="220" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="360" y="456" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="360" dy="0">wget returns</tspan>
      <tspan x="360" dy="28">the page</tspan>
    </text>

    
    <line x1="220" y1="305" x2="220" y2="678" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="80" y="540" width="420" height="340" rx="16" fill="#f2f7f3" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />
    <text x="105" y="580" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kuard-networkpolicy</text>

    
    <rect x="160" y="680" width="260" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="180" y="705" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="180" y1="713" x2="214" y2="713" stroke="#207448" stroke-width="2" />
    <circle cx="187" cy="709" r="1.5" fill="#207448" />
    <circle cx="193" cy="709" r="1.5" fill="#207448" />
    
    <text x="240" y="732" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">kuard</text>
  </g>

  
  
  
  <g id="panel-2">
    
    <rect x="560" y="110" width="480" height="810" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <circle cx="800" cy="155" r="22" fill="#207448" />
    <text x="800" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>

    
    <text x="800" y="205" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Step 2 default deny ingress
    </text>

    
    <rect x="670" y="235" width="260" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="686" y="252" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="686" y1="260" x2="720" y2="260" stroke="#207448" stroke-width="2" />
    <circle cx="693" cy="256" r="1.5" fill="#207448" />
    <circle cx="699" cy="256" r="1.5" fill="#207448" />
    
    <text x="735" y="278" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">test-source</text>

    
    <rect x="760" y="435" width="220" height="60" rx="12" fill="#ffffff" stroke="#7a8b84" stroke-width="2" />
    <text x="870" y="472" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8b84">wget times out</text>

    
    <line x1="730" y1="305" x2="730" y2="605" stroke="#7a8b84" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow-grey)" />

    
    <rect x="590" y="540" width="420" height="340" rx="16" fill="#f2f7f3" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />
    <text x="615" y="580" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kuard-networkpolicy</text>

    
    <rect x="615" y="608" width="370" height="66" rx="12" fill="#fff7ed" stroke="#db8129" stroke-width="4" />
    
    <rect x="635" y="632" width="22" height="18" rx="3" fill="none" stroke="#db8129" stroke-width="2.5" />
    <path d="M 640 632 L 640 624 A 6 6 0 0 1 652 624 L 652 632" fill="none" stroke="#db8129" stroke-width="2.5" />
    <circle cx="646" cy="641" r="2" fill="#db8129" />
    
    <text x="672" y="649" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">default-deny-ingress</text>

    
    <rect x="670" y="710" width="260" height="80" rx="10" fill="#ffffff" stroke="#7a8b84" stroke-width="3" />
    
    <rect x="690" y="735" width="34" height="26" rx="4" fill="none" stroke="#7a8b84" stroke-width="2.5" />
    <line x1="690" y1="743" x2="724" y2="743" stroke="#7a8b84" stroke-width="2" />
    <circle cx="697" cy="739" r="1.5" fill="#7a8b84" />
    <circle cx="703" cy="739" r="1.5" fill="#7a8b84" />
    
    <text x="750" y="762" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">kuard</text>
  </g>

  
  
  
  <g id="panel-3">
    
    <rect x="1070" y="110" width="480" height="810" rx="16" fill="#ffffff" stroke="#c8dcd0" stroke-width="2" />

    
    <circle cx="1310" cy="155" r="22" fill="#207448" />
    <text x="1310" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>

    
    <text x="1310" y="205" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      Step 3 allow test source
    </text>

    
    <rect x="1085" y="235" width="215" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <rect x="1097" y="252" width="30" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="1097" y1="260" x2="1127" y2="260" stroke="#207448" stroke-width="2" />
    <circle cx="1103" cy="256" r="1.5" fill="#207448" />
    <circle cx="1109" cy="256" r="1.5" fill="#207448" />
    <text x="1136" y="278" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">test-source</text>

    
    <rect x="1320" y="235" width="215" height="70" rx="10" fill="#f5f5f5" stroke="#a2b2a8" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.85" />
    <rect x="1330" y="252" width="30" height="24" rx="4" fill="none" stroke="#a2b2a8" stroke-width="2.5" />
    <line x1="1330" y1="260" x2="1360" y2="260" stroke="#a2b2a8" stroke-width="2" />
    <circle cx="1336" cy="256" r="1.5" fill="#a2b2a8" />
    <circle cx="1342" cy="256" r="1.5" fill="#a2b2a8" />
    <text x="1370" y="278" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a8b84">any other pod</text>

    
    <rect x="1205" y="425" width="205" height="75" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1307" y="456" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1307" dy="0">run test-source</tspan>
      <tspan x="1307" dy="28">allowed</tspan>
    </text>

    
    <line x1="1435" y1="305" x2="1435" y2="605" stroke="#7a8b84" stroke-width="3.5" stroke-dasharray="6 6" marker-end="url(#arrow-grey)" />

    
    <rect x="1100" y="540" width="420" height="340" rx="16" fill="#f2f7f3" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />
    <text x="1125" y="580" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kuard-networkpolicy</text>

    
    <rect x="1110" y="608" width="225" height="66" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <rect x="1122" y="632" width="20" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <path d="M 1127 632 L 1127 622 A 5 5 0 0 1 1137 622" fill="none" stroke="#207448" stroke-width="2.5" />
    <circle cx="1132" cy="641" r="2" fill="#207448" />
    <text x="1152" y="650" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">access-kuard</text>

    
    <rect x="1350" y="608" width="155" height="66" rx="10" fill="#f0f3f1" stroke="#7a8b84" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="1420" y1="641" x2="1450" y2="641" stroke="#7a8b84" stroke-width="4" stroke-linecap="round" />

    
    <line x1="1185" y1="305" x2="1185" y2="708" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="1180" y="710" width="260" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <rect x="1200" y="735" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="1200" y1="743" x2="1234" y2="743" stroke="#207448" stroke-width="2" />
    <circle cx="1207" cy="739" r="1.5" fill="#207448" />
    <circle cx="1213" cy="739" r="1.5" fill="#207448" />
    
    <text x="1260" y="762" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36">kuard</text>
  </g>

  
  
  
  <g id="takeaway-bar">
    <rect x="50" y="945" width="1500" height="85" rx="16" fill="#207448" />
    <text x="800" y="980" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">the open test sets the baseline, the deny test proves the default works,</tspan>
      <tspan x="800" dy="32">and the allow test shows one rule opens exactly one door.</tspan>
    </text>
  </g>
</svg>