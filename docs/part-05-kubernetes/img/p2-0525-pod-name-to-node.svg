<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>From a pod name to the node's directory and ID</title>
  <desc>Infographic explaining how Kubernetes pod names translate to node log directories, container runtime IDs, and container logs.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">From a pod name to the node's directory and ID</text>

  

  
  <rect x="70" y="125" width="530" height="250" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="170" r="24" fill="#207448" />
  <text x="115" y="178" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>

  
  <g transform="translate(160, 145)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="25" cy="25" r="18" />
    <circle cx="25" cy="25" r="7" fill="#207448" />
    <line x1="25" y1="2" x2="25" y2="10" />
    <line x1="25" y1="40" x2="25" y2="48" />
    <line x1="2" y1="25" x2="10" y2="25" />
    <line x1="40" y1="25" x2="48" y2="25" />
    <line x1="9" y1="9" x2="15" y2="15" />
    <line x1="35" y1="35" x2="41" y2="41" />
    <line x1="9" y1="41" x2="15" y2="35" />
    <line x1="35" y1="15" x2="41" y2="9" />
  </g>

  
  <text x="100" y="255" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="100" dy="0">kubectl: pod trainer-0</tspan>
    <tspan x="100" dy="42">in namespace training</tspan>
  </text>

  
  <line x1="600" y1="250" x2="700" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="710" y="125" width="820" height="250" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="5" />
  
  
  <circle cx="755" cy="170" r="24" fill="#db8129" />
  <text x="755" y="178" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>

  
  <g transform="translate(800, 146)" stroke="#db8129" stroke-width="3.5" fill="none">
    <path d="M 5 8 L 22 8 L 29 16 L 45 16 A 4 4 0 0 1 49 20 L 49 40 A 4 4 0 0 1 45 44 L 5 44 A 4 4 0 0 1 1 40 L 1 12 A 4 4 0 0 1 5 8 Z" />
  </g>

  
  <text x="740" y="240" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="740" dy="0">Node stores logs by</tspan>
    <tspan x="740" dy="40">namespace, name and pod UID</tspan>
  </text>

  
  <rect x="740" y="305" width="750" height="50" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="760" y="339" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/var/log/pods/&lt;namespace&gt;_&lt;name&gt;_&lt;UID&gt;</text>

  
  <path d="M 1120 375 V 425 H 260 V 465" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <rect x="70" y="475" width="380" height="295" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="115" cy="515" r="24" fill="#207448" />
  <text x="115" y="523" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>

  
  <g transform="translate(160, 492)" stroke="#207448" stroke-width="3" fill="none">
    <path d="M 2 12 L 22 2 L 42 12 L 22 22 Z" />
    <path d="M 2 12 L 2 34 L 22 44 L 22 22 Z" />
    <path d="M 42 12 L 42 34 L 22 44 Z" />
  </g>

  
  <text x="100" y="585" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="100" dy="0">Runtime knows the</tspan>
    <tspan x="100" dy="38">container by an ID</tspan>
  </text>

  
  <rect x="100" y="690" width="220" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="120" y="722" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">crictl ps -a</text>

  
  <line x1="450" y1="622" x2="500" y2="622" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="500" y="475" width="430" height="295" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="545" cy="515" r="24" fill="#207448" />
  <text x="545" y="523" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>

  
  <g transform="translate(590, 492)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="18" cy="18" r="14" />
    <line x1="28" y1="28" x2="42" y2="42" />
  </g>

  
  <text x="530" y="585" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
    <tspan x="530" dy="0">Inspect the sandbox</tspan>
    <tspan x="530" dy="38">and container</tspan>
  </text>

  
  <rect x="530" y="650" width="370" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="545" y="682" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">crictl inspectp &lt;pod-id&gt;</text>

  <rect x="530" y="708" width="370" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="545" y="740" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">crictl inspect &lt;ctr-id&gt;</text>

  
  <line x1="930" y1="622" x2="980" y2="622" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="980" y="475" width="550" height="295" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <circle cx="1025" cy="515" r="24" fill="#207448" />
  <text x="1025" y="523" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>

  
  <g transform="translate(1070, 492)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="4" y="2" width="28" height="38" rx="3" />
    <line x1="10" y1="12" x2="26" y2="12" />
    <line x1="10" y1="20" x2="26" y2="20" />
    <line x1="10" y1="28" x2="20" y2="28" />
  </g>

  
  <text x="1010" y="600" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Logs</text>

  
  <rect x="1005" y="675" width="500" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1025" y="710" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">crictl logs --tail 100 &lt;ctr-id&gt;</text>

  
  <rect x="70" y="800" width="1460" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(95, 813)" stroke="#207448" stroke-width="3" fill="none">
    <rect x="0" y="0" width="46" height="40" rx="6" />
    <path d="M 10 13 L 20 20 L 10 27" />
    <line x1="24" y1="27" x2="36" y2="27" />
  </g>

  <rect x="160" y="810" width="850" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="180" y="842" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">journalctl -u kubelet -u containerd --since -30 min</text>

  
  <text x="800" y="905" text-anchor="middle" font-family="sans-serif" font-size="26" font-style="italic" fill="#303a36">Walk the chain once, and it becomes easy to repeat.</text>

  
  <rect x="70" y="945" width="1460" height="85" rx="14" fill="#207448" />
  <text x="800" y="998" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Follow the pod name to the node directory, then to the runtime ID, then to the logs.</text>
</svg>