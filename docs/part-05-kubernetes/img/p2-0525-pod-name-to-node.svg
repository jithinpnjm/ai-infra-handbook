<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>From a pod name to the node's directory and ID</title>
  <desc>Visual chain showing how Kubernetes pod names translate to node-level directories, container IDs, inspection commands, and logs on the node.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <text x="80" y="80" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">From a pod name to the node's directory and ID</text>

  

  
  <g transform="translate(80, 130)">
    <rect width="660" height="280" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="50" cy="50" r="24" fill="#207448" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <g transform="translate(100, 22)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="28" cy="28" r="16" />
      <circle cx="28" cy="28" r="6" />
      <line x1="28" y1="4" x2="28" y2="12" />
      <line x1="28" y1="44" x2="28" y2="52" />
      <line x1="6" y1="18" x2="14" y2="22" />
      <line x1="42" y1="34" x2="50" y2="38" />
      <line x1="6" y1="38" x2="14" y2="34" />
      <line x1="42" y1="22" x2="50" y2="18" />
    </g>

    
    <text x="40" y="160" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="40" dy="0">kubectl: pod trainer-0</tspan>
      <tspan x="40" dy="44">in namespace training</tspan>
    </text>
  </g>

  
  <line x1="740" y1="270" x2="852" y2="270" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(860, 130)">
    <rect width="660" height="280" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="5" />
    
    
    <circle cx="50" cy="50" r="24" fill="#207448" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <g transform="translate(100, 22)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 6 12 L 22 12 L 28 18 L 50 18 C 52.2 18 54 19.8 54 22 L 54 44 C 54 46.2 52.2 48 50 48 L 6 48 C 3.8 48 2 46.2 2 44 L 2 16 C 2 13.8 3.8 12 6 12 Z" />
      <line x1="2" y1="24" x2="54" y2="24" />
    </g>

    
    <text x="40" y="135" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="40" dy="0">Node stores logs by</tspan>
      <tspan x="40" dy="42">namespace, name and pod UID</tspan>
    </text>

    
    <rect x="40" y="200" width="580" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="56" y="235" font-family="monospace" font-size="24" fill="#303a36">/var/log/pods/&lt;namespace&gt;_&lt;name&gt;_&lt;UID&gt;</text>
  </g>

  
  <path d="M 1190 410 L 1190 460 L 410 460 L 410 502" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <g transform="translate(80, 510)">
    <rect width="420" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="50" cy="50" r="24" fill="#207448" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <g transform="translate(100, 22)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="14" width="36" height="32" rx="4" />
      <line x1="10" y1="24" x2="46" y2="24" />
      <line x1="20" y1="8" x2="20" y2="14" />
      <line x1="36" y1="8" x2="36" y2="14" />
      <line x1="20" y1="46" x2="20" y2="52" />
      <line x1="36" y1="46" x2="36" y2="52" />
      <circle cx="28" cy="34" r="3" fill="#207448" />
    </g>

    
    <text x="40" y="140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="40" dy="0">Runtime knows the</tspan>
      <tspan x="40" dy="42">container by an ID</tspan>
    </text>

    
    <rect x="40" y="240" width="340" height="52" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="60" y="275" font-family="monospace" font-size="24" fill="#303a36">crictl ps -a</text>
  </g>

  
  <line x1="500" y1="680" x2="572" y2="680" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(580, 510)">
    <rect width="530" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="50" cy="50" r="24" fill="#207448" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <g transform="translate(100, 22)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="24" cy="24" r="16" />
      <line x1="36" y1="36" x2="52" y2="52" />
    </g>

    
    <text x="40" y="140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="40" dy="0">Inspect the sandbox</tspan>
      <tspan x="40" dy="42">and container</tspan>
    </text>

    
    <rect x="40" y="206" width="450" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="56" y="240" font-family="monospace" font-size="24" fill="#303a36">crictl inspectp &lt;pod-id&gt;</text>

    <rect x="40" y="268" width="450" height="50" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="56" y="302" font-family="monospace" font-size="24" fill="#303a36">crictl inspect &lt;ctr-id&gt;</text>
  </g>

  
  <line x1="1110" y1="680" x2="1182" y2="680" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(1190, 510)">
    <rect width="330" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <circle cx="50" cy="50" r="24" fill="#207448" />
    <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    
    <g transform="translate(100, 22)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" />
      <line x1="36" y1="6" x2="36" y2="16" />
      <line x1="36" y1="16" x2="46" y2="16" />
      <line x1="20" y1="26" x2="38" y2="26" />
      <line x1="20" y1="36" x2="38" y2="36" />
    </g>

    
    <text x="40" y="140" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Logs</text>

    
    <rect x="20" y="240" width="290" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="28" y="272" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="28" dy="0">crictl logs --tail</tspan>
      <tspan x="28" dy="28">100 &lt;ctr-id&gt;</tspan>
    </text>
  </g>

  

  <g transform="translate(80, 890)">
    <rect width="1440" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(30, 20)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="48" height="42" rx="6" />
      <path d="M 16 20 L 26 27 L 16 34" />
      <line x1="30" y1="36" x2="42" y2="36" />
    </g>

    
    <rect x="110" y="20" width="1290" height="56" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="140" y="56" font-family="monospace" font-size="24" fill="#303a36">journalctl -u kubelet -u containerd --since -30 min</text>
  </g>

  

  <g transform="translate(80, 1026)">
    <rect width="1440" height="74" rx="12" fill="#207448" />
    <text x="720" y="1073" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Walk the chain once, and it becomes easy to repeat.</text>
  </g>

</svg>