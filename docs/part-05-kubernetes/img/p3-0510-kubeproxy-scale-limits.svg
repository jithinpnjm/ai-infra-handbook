<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>When iptables mode stops scaling</title>
  <desc>When iptables mode stops scaling</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">When iptables mode stops scaling</text>

  
  <rect x="40" y="110" width="455" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="58" y="128" width="419" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(82, 148)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="22" />
    <polyline points="28,14 28,28 38,28" />
  </g>
  <text x="82" y="246" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Per new connection:</text>
  <text x="82" y="286" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="82" dy="0">linear walk of</tspan>
    <tspan x="82" dy="34"><tspan font-family="monospace">KUBE-SERVICES,</tspan> O(n)</tspan>
  </text>

  
  <rect x="58" y="378" width="419" height="584" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(82, 398)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="22" width="36" height="28" rx="4" />
    <path d="M 18 22 V 14 A 10 10 0 0 1 38 14 V 22" />
    <circle cx="28" cy="36" r="3" fill="#207448" />
  </g>
  <text x="82" y="494" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">per change:</text>
  <text x="82" y="534" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="82" dy="0"><tspan font-family="monospace">iptables-restore</tspan> rewrites</tspan>
    <tspan x="82" dy="34">the whole ruleset, takes</tspan>
    <tspan x="82" dy="34">the xtables lock</tspan>
    <tspan x="82" dy="34" font-family="monospace">(/run/xtables.lock),</tspan>
    <tspan x="82" dy="34">seconds or minutes at</tspan>
    <tspan x="82" dy="34">tens of thousands</tspan>
    <tspan x="82" dy="34">of rules, can collide</tspan>
    <tspan x="82" dy="34">with CNI plug-ins and</tspan>
    <tspan x="82" dy="34">send traffic to</tspan>
    <tspan x="82" dy="34">stale endpoints</tspan>
  </text>

  
  <rect x="540" y="110" width="330" height="870" rx="16" fill="#fff8f0" stroke="#db8129" stroke-width="4" />
  
  <g transform="translate(677, 320)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 6 L 50 48 L 6 48 Z" />
    <line x1="28" y1="20" x2="28" y2="34" />
    <circle cx="28" cy="42" r="2" fill="#207448" />
  </g>
  <text x="705" y="420" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="705" dy="0">iptables</tspan>
    <tspan x="705" dy="45">degrades beyond</tspan>
    <tspan x="705" dy="45">roughly 5,000</tspan>
    <tspan x="705" dy="45">Services or</tspan>
    <tspan x="705" dy="45">25,000 endpoints</tspan>
  </text>

  
  <line x1="495" y1="545" x2="540" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="870" y1="545" x2="915" y2="545" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="915" y="110" width="645" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="933" y="128" width="609" height="240" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 146)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="8" x2="18" y2="48" />
    <line x1="38" y1="8" x2="38" y2="48" />
    <line x1="8" y1="18" x2="48" y2="18" />
    <line x1="8" y1="38" x2="48" y2="38" />
  </g>
  <text x="1027" y="184" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">IPVS: <tspan font-weight="normal" font-size="24">hash lookup O(1),</tspan></text>
  <text x="957" y="226" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="957" dy="0">incremental updates, schedulers</tspan>
    <tspan x="957" dy="34" font-family="monospace">rr lc sh dh sed nq,</tspan>
    <tspan x="957" dy="34">needs <tspan font-family="monospace">ip_vs</tspan> modules and <tspan font-family="monospace">ipset,</tspan></tspan>
    <tspan x="957" dy="34"><tspan font-family="monospace">strictARP true</tspan> for MetalLB L2</tspan>
  </text>

  
  <rect x="933" y="388" width="609" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 406)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="10" width="40" height="36" rx="4" />
    <line x1="8" y1="22" x2="48" y2="22" />
    <line x1="24" y1="22" x2="24" y2="46" />
  </g>
  <text x="1027" y="444" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">nftables: <tspan font-weight="normal" font-size="24">single kube-proxy</tspan></text>
  <text x="957" y="486" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="957" dy="0">table with maps, O(1),</tspan>
    <tspan x="957" dy="34">incremental <tspan font-family="monospace">nft -f</tspan> deltas</tspan>
  </text>

  
  <rect x="933" y="588" width="609" height="374" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(957, 606)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="28" height="28" rx="4" />
    <line x1="20" y1="6" x2="20" y2="14" />
    <line x1="28" y1="6" x2="28" y2="14" />
    <line x1="36" y1="6" x2="36" y2="14" />
    <line x1="20" y1="42" x2="20" y2="50" />
    <line x1="28" y1="42" x2="28" y2="50" />
    <line x1="36" y1="42" x2="36" y2="50" />
  </g>
  <text x="1027" y="644" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">eBPF</text>
  <text x="957" y="684" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="957" dy="0">(Cilium <tspan font-family="monospace">kubeProxyReplacement=true):</tspan></tspan>
    <tspan x="957" dy="34"><tspan font-family="monospace">cgroup/connect4</tspan> hook rewrites</tspan>
    <tspan x="957" dy="34">the destination at connect time,</tspan>
    <tspan x="957" dy="34">no packet NAT, no conntrack for</tspan>
    <tspan x="957" dy="34">in-cluster Service traffic,</tspan>
    <tspan x="957" dy="34">kernel 5.10+ recommended</tspan>
  </text>

  
  <rect x="40" y="1020" width="1520" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 1062)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6,28 16,28 22,12 34,44 40,28 50,28" />
  </g>
  <text x="144" y="1062" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="144" dy="0">kubeproxy_sync_proxy_rules_duration_seconds,</tspan>
    <tspan x="144" dy="34">kubeproxy_network_programming_duration_seconds,</tspan>
    <tspan x="144" dy="34">kubeproxy_sync_proxy_rules_iptables_total</tspan>
  </text>
</svg>