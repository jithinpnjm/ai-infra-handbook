<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" style="background:#f5f8f5; font-family:sans-serif;">
  <title>VPA: recommender, updater and admission controller</title>
  <desc>Visual infographic explaining Kubernetes Vertical Pod Autoscaler architecture loop, operating modes, and sizing rules.</desc>

  
  <text x="800" y="65" text-anchor="middle" font-size="48" font-weight="bold" fill="#207448">VPA: recommender, updater and admission controller</text>

  

  
  <rect x="50" y="110" width="460" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="92" cy="145" r="22" fill="#207448"/>
  <text x="92" y="145" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="130" y1="160" x2="175" y2="160"/>
    <rect x="135" y="144" width="8" height="16" fill="#207448" opacity="0.3"/>
    <rect x="148" y="132" width="8" height="28" fill="#207448" opacity="0.5"/>
    <rect x="161" y="120" width="8" height="40" fill="#207448"/>
    <path d="M 132 135 L 152 122 L 172 115"/>
  </g>
  
  <text x="75" y="195" font-size="30" font-weight="bold" fill="#207448">Recommender:</text>
  
  <text x="75" y="235" font-size="24" fill="#303a36">analyses historical and</text>
  <text x="75" y="267" font-size="24" fill="#303a36">live usage, produces target,</text>
  <text x="75" y="299" font-size="24" fill="#303a36">lower and upper bounds</text>
  <text x="75" y="331" font-size="24" fill="#303a36">(the tailor who measures)</text>

  
  <rect x="570" y="110" width="460" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="612" cy="145" r="22" fill="#207448"/>
  <text x="612" y="145" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 672 130 A 18 18 0 1 0 674 154"/>
    <polyline points="665,123 674,130 682,123"/>
    <circle cx="658" cy="142" r="4" fill="#207448"/>
  </g>
  
  <text x="595" y="195" font-size="30" font-weight="bold" fill="#207448">Updater:</text>
  
  <text x="595" y="235" font-size="24" fill="#303a36">evicts pods whose requests</text>
  <text x="595" y="271" font-size="24" fill="#303a36">deviate so new values apply</text>
  <text x="595" y="307" font-size="24" fill="#303a36">(calls the customer in)</text>

  
  <rect x="1090" y="110" width="460" height="260" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1132" cy="145" r="22" fill="#207448"/>
  <text x="1132" y="145" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1178 132 C 1178 124 1188 124 1188 132 L 1188 136"/>
    <path d="M 1168 152 L 1188 136 L 1208 152 Z"/>
    <line x1="1168" y1="152" x2="1208" y2="152"/>
  </g>
  
  <text x="1115" y="195" font-size="30" font-weight="bold" fill="#207448">Admission controller:</text>
  
  <text x="1115" y="245" font-size="24" fill="#303a36">sets requests on new pods</text>
  <text x="1115" y="285" font-size="24" fill="#303a36">(fits the new garment)</text>

  
  <line x1="510" y1="235" x2="556" y2="235" stroke="#207448" stroke-width="4"/>
  <polygon points="554,227 568,235 554,243" fill="#207448"/>

  
  <line x1="1030" y1="235" x2="1076" y2="235" stroke="#207448" stroke-width="4"/>
  <polygon points="1074,227 1088,235 1074,243" fill="#207448"/>

  
  <path d="M 1320 370 L 1320 405 L 280 405 L 280 384" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="272,386 280,372 288,386" fill="#207448"/>

  
  <g id="mode-table">
    
    <rect x="50" y="445" width="1500" height="290" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <path d="M 50 457 Q 50 445 62 445 L 1538 445 Q 1550 445 1550 457 L 1550 500 L 50 500 Z" fill="#207448"/>
    <text x="75" y="482" font-size="30" font-weight="bold" fill="#ffffff">Modes</text>

    
    <rect x="51" y="559" width="1498" height="58" fill="#f0f6f2"/>
    <path d="M 51 677 L 1549 677 L 1549 723 Q 1549 734 1538 734 L 62 734 Q 51 734 51 723 Z" fill="#f0f6f2"/>

    
    <line x1="50" y1="558" x2="1550" y2="558" stroke="#c0d7c7" stroke-width="1.5"/>
    <line x1="50" y1="617" x2="1550" y2="617" stroke="#c0d7c7" stroke-width="1.5"/>
    <line x1="50" y1="676" x2="1550" y2="676" stroke="#c0d7c7" stroke-width="1.5"/>
    
    <line x1="340" y1="500" x2="340" y2="735" stroke="#c0d7c7" stroke-width="1.5"/>

    
    <text x="75" y="538" font-size="24" font-weight="bold" fill="#207448">Off:</text>
    <text x="360" y="538" font-size="24" fill="#303a36">recommendations only</text>

    
    <text x="75" y="596" font-size="24" font-weight="bold" fill="#207448">Initial:</text>
    <text x="360" y="596" font-size="24" fill="#303a36">sets requests when a pod is created</text>

    
    <text x="75" y="655" font-size="24" font-weight="bold" fill="#207448">Recreate or Auto:</text>
    <text x="360" y="655" font-size="24" fill="#303a36">evict and recreate pods with new requests</text>

    
    <text x="75" y="714" font-size="24" font-weight="bold" fill="#207448">InPlaceOrRecreate:</text>
    <text x="360" y="714" font-size="24" fill="#303a36">newer in-place resize changes CPU and memory without restarts where supported</text>
  </g>

  
  <g id="rules-section">
    
    <text x="50" y="778" font-size="30" font-weight="bold" fill="#207448">Rules</text>

    
    <rect x="50" y="800" width="735" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="858" font-size="24" fill="#303a36">use recommendation mode to right-size</text>
    <text x="75" y="896" font-size="24" fill="#303a36">services and data-prep jobs</text>

    
    <rect x="815" y="800" width="735" height="140" rx="12" fill="#fffbf5" stroke="#db8129" stroke-width="3"/>
    <text x="840" y="845" font-size="24" fill="#303a36">avoid Auto for GPU model servers: a restart</text>
    <text x="840" y="880" font-size="24" fill="#303a36">costs minutes and model weights dominate</text>
    <text x="840" y="915" font-size="24" fill="#303a36">fixed memory</text>

    
    <rect x="50" y="960" width="735" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="75" y="1000" font-size="24" fill="#303a36">HPA and VPA on the same CPU or memory metric</text>
    <text x="75" y="1034" font-size="24" fill="#303a36">fight each other; HPA on custom or external</text>
    <text x="75" y="1068" font-size="24" fill="#303a36">metrics with VPA on resources is acceptable</text>
    <text x="75" y="1102" font-size="24" fill="#303a36">(HPA answers how many copies, VPA answers</text>
    <text x="75" y="1136" font-size="24" fill="#303a36">how big each is)</text>

    
    <rect x="815" y="960" width="735" height="190" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="840" y="1025" font-size="24" fill="#303a36">VPA evicting pods repeatedly means Auto mode</text>
    <text x="840" y="1065" font-size="24" fill="#303a36">with fluctuating recommendations: use Off or</text>
    <text x="840" y="1105" font-size="24" fill="#303a36">Initial, set bounds, PDBs</text>
  </g>
</svg>