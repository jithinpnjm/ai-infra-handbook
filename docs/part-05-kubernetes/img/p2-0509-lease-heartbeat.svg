<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Lease heartbeats and the node monitor grace period</title>
  <desc>Visual explanation of Kubernetes node lease renewals, status updates, heartbeat interruption, and the node monitor grace period leading to node conditions updates.</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 2,2 L 12,7 L 2,12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="50" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Lease heartbeats and the node monitor grace period</text>

  
  <g id="top-lane">
    <rect x="50" y="130" width="510" height="345" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="95" cy="180" r="28" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 77,180 L 85,180 L 90,168 L 96,192 L 102,174 L 107,180 L 113,180" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    
    <text x="140" y="174" font-family="sans-serif" font-size="24" font-weight="bold">
      <tspan x="140" dy="0" fill="#207448">Kubelet renews Lease</tspan>
      <tspan x="140" dy="32" font-family="monospace" fill="#303a36">kube-node-lease/node</tspan>
      <tspan x="140" dy="32" fill="#207448">every 10 s</tspan>
    </text>

    
    <line x1="75" y1="365" x2="525" y2="365" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    
    <rect x="85" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="125" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="165" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="205" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="245" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="285" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="325" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="365" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="405" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="445" y="345" width="8" height="40" rx="4" fill="#207448" />
    <rect x="485" y="345" width="8" height="40" rx="4" fill="#207448" />
  </g>

  
  <g id="second-lane">
    <rect x="50" y="505" width="510" height="345" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="95" cy="555" r="28" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="83" y="541" width="24" height="28" rx="3" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="89" y1="549" x2="101" y2="549" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="89" y1="556" x2="101" y2="556" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    <line x1="89" y1="563" x2="97" y2="563" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />

    
    <text x="140" y="555" font-family="sans-serif" font-size="24" font-weight="bold">
      <tspan x="140" dy="0" fill="#207448">Node.status updated on change,</tspan>
      <tspan x="140" dy="34" fill="#303a36">or every 5 min</tspan>
    </text>

    
    <line x1="75" y1="740" x2="525" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    
    <rect x="135" y="718" width="14" height="44" rx="4" fill="#207448" />
    <rect x="385" y="718" width="14" height="44" rx="4" fill="#207448" />
  </g>

  
  <g id="heartbeats-stop">
    <rect x="585" y="130" width="135" height="720" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <path d="M 622,230 L 672,210 L 632,260 L 682,240" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    
    <text x="652" y="470" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">
      <tspan x="652" dy="0">Heartbeats</tspan>
      <tspan x="652" dy="36">stop</tspan>
    </text>

    
    <path d="M 622,690 L 672,670 L 632,720 L 682,700" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <g id="grace-period-box">
    <rect x="745" y="130" width="485" height="720" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <circle cx="987" cy="205" r="32" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <path d="M 973,191 L 1001,191 M 973,219 L 1001,219" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 975,191 L 999,191 L 990,205 L 999,219 L 975,219 L 984,205 Z" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="987" cy="213" r="2.5" fill="#207448" />

    
    <text x="987" y="295" text-anchor="middle" font-family="sans-serif">
      <tspan x="987" dy="0" font-size="24" font-weight="bold" fill="#207448">node-monitor-grace-period:</tspan>
      <tspan x="987" dy="38" font-size="24" fill="#303a36">the node controller waits,</tspan>
      <tspan x="987" dy="38" font-size="24" font-weight="bold" fill="#303a36">then marks Ready=Unknown</tspan>
    </text>

    
    <path d="M 785,445 L 785,475 Q 785,490 810,490 L 967,490 Q 987,490 987,510 Q 987,490 1007,490 L 1165,490 Q 1190,490 1190,475 L 1190,445" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />

    
    <rect x="807" y="550" width="360" height="58" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="987" y="587" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Older releases used 40 s</text>
  </g>

  
  <g id="condition-chips">
    <rect x="1255" y="130" width="295" height="720" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="1275" y="180" width="255" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1402" y="227" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Ready</text>

    
    <rect x="1275" y="295" width="255" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1402" y="342" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">MemoryPressure</text>

    
    <rect x="1275" y="410" width="255" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1402" y="457" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">DiskPressure</text>

    
    <rect x="1275" y="525" width="255" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1402" y="572" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">PIDPressure</text>

    
    <rect x="1275" y="640" width="255" height="75" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1402" y="687" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">NetworkUnavailable</text>
  </g>

  
  <g id="bottom-caption">
    <rect x="50" y="885" width="1500" height="75" rx="14" fill="#207448" />
    <text x="800" y="932" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Leases are cheap heartbeats, and status updates carry the wider node conditions.</text>
  </g>
</svg>