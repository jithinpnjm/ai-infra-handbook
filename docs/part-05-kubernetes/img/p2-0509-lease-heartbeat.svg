<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" width="1600" height="1030">
  <title>Lease heartbeats and the node monitor grace period</title>
  <desc>Infographic illustrating Kubernetes node lease renewal heartbeats, status update frequency, heartbeat failure sequence, and node condition monitoring.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1030" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Lease heartbeats and the node monitor grace period</text>

  
  <rect x="60" y="125" width="1480" height="345" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <circle cx="118" cy="180" r="26" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <polyline points="118,164 118,180 132,180" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <text x="165" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Kubelet renews Lease <tspan font-family="ui-monospace, monospace">kube-node-lease/node</tspan> every 10 s</text>

  
  <line x1="100" y1="330" x2="790" y2="330" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  
  <line x1="140" y1="310" x2="140" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="140" cy="330" r="7" fill="#207448"/>
  
  <line x1="190" y1="310" x2="190" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="330" r="7" fill="#207448"/>
  
  <line x1="240" y1="310" x2="240" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="330" r="7" fill="#207448"/>
  
  <line x1="290" y1="310" x2="290" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="290" cy="330" r="7" fill="#207448"/>
  
  <line x1="340" y1="310" x2="340" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="340" cy="330" r="7" fill="#207448"/>
  
  <line x1="390" y1="310" x2="390" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="390" cy="330" r="7" fill="#207448"/>
  
  <line x1="440" y1="310" x2="440" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="440" cy="330" r="7" fill="#207448"/>
  
  <line x1="490" y1="310" x2="490" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="490" cy="330" r="7" fill="#207448"/>
  
  <line x1="540" y1="310" x2="540" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="540" cy="330" r="7" fill="#207448"/>
  
  <line x1="590" y1="310" x2="590" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="590" cy="330" r="7" fill="#207448"/>
  
  <line x1="640" y1="310" x2="640" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="640" cy="330" r="7" fill="#207448"/>
  
  <line x1="690" y1="310" x2="690" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="690" cy="330" r="7" fill="#207448"/>
  
  <line x1="740" y1="310" x2="740" y2="350" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="740" cy="330" r="7" fill="#207448"/>

  
  <rect x="815" y="240" width="220" height="180" rx="16" fill="#fff8f0" stroke="#db8129" stroke-width="4"/>
  
  <path d="M 845,305 L 870,305 L 885,280 L 900,330 L 915,305 L 945,305" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="965" y1="285" x2="995" y2="315" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  <line x1="995" y1="285" x2="965" y2="315" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
  
  <text x="925" y="360" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Heartbeats stop</text>

  
  <line x1="1035" y1="330" x2="1065" y2="330" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

  
  <rect x="1075" y="240" width="445" height="205" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="3"/>

  
  <path d="M 1100,265 L 1136,265 L 1118,290 L 1136,315 L 1100,315 L 1118,290 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>

  
  <text x="1295" y="285" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1295" dy="0" font-family="ui-monospace, monospace" font-weight="bold">node-monitor-grace-period:</tspan>
    <tspan x="1295" dy="34">the node controller waits,</tspan>
    <tspan x="1295" dy="34">then marks <tspan font-family="ui-monospace, monospace" font-weight="bold">Ready=Unknown</tspan></tspan>
  </text>

  
  <text x="1295" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Older releases used 40 s</text>


  
  <rect x="60" y="495" width="1480" height="385" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <rect x="94" y="528" width="48" height="48" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="4"/>
  <rect x="106" y="540" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="84" y1="544" x2="94" y2="544" stroke="#207448" stroke-width="4"/>
  <line x1="84" y1="560" x2="94" y2="560" stroke="#207448" stroke-width="4"/>
  <line x1="142" y1="544" x2="152" y2="544" stroke="#207448" stroke-width="4"/>
  <line x1="142" y1="560" x2="152" y2="560" stroke="#207448" stroke-width="4"/>

  
  <text x="165" y="562" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36"><tspan font-family="ui-monospace, monospace">Node.status</tspan> updated on change, or every 5 min</text>

  
  <line x1="100" y1="710" x2="810" y2="710" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  
  <line x1="200" y1="680" x2="200" y2="740" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="710" r="10" fill="#207448"/>
  <rect x="175" y="640" width="50" height="30" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <line x1="185" y1="655" x2="215" y2="655" stroke="#207448" stroke-width="3"/>

  
  <line x1="480" y1="680" x2="480" y2="740" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="480" cy="710" r="10" fill="#207448"/>
  <rect x="455" y="640" width="50" height="30" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <line x1="465" y1="655" x2="495" y2="655" stroke="#207448" stroke-width="3"/>

  
  <line x1="760" y1="680" x2="760" y2="740" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="760" cy="710" r="10" fill="#207448"/>
  <rect x="735" y="640" width="50" height="30" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>
  <line x1="745" y1="655" x2="775" y2="655" stroke="#207448" stroke-width="3"/>

  
  <rect x="850" y="605" width="670" height="250" rx="16" fill="#f5f8f5" stroke="#207448" stroke-width="2"/>

  
  <path d="M 875,630 L 895,622 L 915,630 L 915,655 C 915,670 895,680 895,680 C 895,680 875,670 875,655 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="886,648 893,655 905,640" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="940" y="625" width="170" height="56" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1025" y="662" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">Ready</text>

  
  <rect x="1135" y="625" width="360" height="56" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1315" y="662" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">MemoryPressure</text>

  
  <rect x="940" y="705" width="260" height="56" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1070" y="742" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">DiskPressure</text>

  
  <rect x="1225" y="705" width="270" height="56" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1360" y="742" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">PIDPressure</text>

  
  <rect x="1025" y="785" width="370" height="56" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="1210" y="822" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">NetworkUnavailable</text>


  
  <rect x="60" y="915" width="1480" height="75" rx="16" fill="#207448"/>
  <text x="800" y="962" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Leases are cheap heartbeats, and status updates carry the wider node conditions.</text>
</svg>