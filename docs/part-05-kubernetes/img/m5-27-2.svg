<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Image promotion pipeline</title>
  <desc>Visual explainer of the image promotion pipeline showing quarantine, scanning, policy verification, cryptographic signing, repository promotion, rejection handling, and admission verification.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Image promotion pipeline</text>

  
  
  <path d="M 490 240 L 590 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1010 240 L 1110 240" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1320 350 L 1320 450" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1320 670 L 1320 770" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1336" y="704" width="46" height="32" rx="6" fill="#f5f8f5" />
  <text x="1359" y="728" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">no</text>

  
  <path d="M 1110 560 L 1010 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="1036" y="512" width="52" height="32" rx="6" fill="#f5f8f5" />
  <text x="1062" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">yes</text>

  
  <path d="M 590 560 L 490 560" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 280 670 L 280 770" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <g id="node-up">
    <rect x="70" y="130" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="112" cy="172" r="24" fill="#207448" />
    <text x="112" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 262 196 A 15 15 0 0 1 273 174 A 20 20 0 0 1 302 178 A 14 14 0 0 1 304 196 Z" />
      <line x1="282" y1="184" x2="282" y2="204" />
      <polyline points="275,198 282,204 289,198" />
    </g>
    
    <text x="280" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">Upstream image</tspan>
      <tspan x="280" dy="36">(NGC / community)</tspan>
    </text>
  </g>

  
  <g id="node-mir">
    <rect x="590" y="130" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="632" cy="172" r="24" fill="#207448" />
    <text x="632" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="788" cy="172" rx="20" ry="7" />
      <path d="M 768 172 v 14 c 0 3.9 9 7 20 7 s 20 -3.1 20 -7 v -14" />
      <path d="M 768 186 v 14 c 0 3.9 9 7 20 7 s 20 -3.1 20 -7 v -14" />
      <line x1="816" y1="174" x2="816" y2="204" />
      <line x1="824" y1="174" x2="824" y2="204" />
      <line x1="812" y1="183" x2="828" y2="183" />
      <line x1="812" y1="195" x2="828" y2="195" />
    </g>
    
    <text x="800" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Mirror into</tspan>
      <tspan x="800" dy="34">'quarantine' repo</tspan>
      <tspan x="800" dy="34">by digest</tspan>
    </text>
  </g>

  
  <g id="node-sc">
    <rect x="1110" y="130" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="1152" cy="172" r="24" fill="#207448" />
    <text x="1152" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1302" y="165" width="26" height="36" rx="3" />
      <line x1="1308" y1="174" x2="1320" y2="174" />
      <line x1="1308" y1="182" x2="1320" y2="182" />
      <line x1="1308" y1="190" x2="1316" y2="190" />
      <circle cx="1328" cy="192" r="10" />
      <line x1="1335" y1="199" x2="1344" y2="208" />
    </g>
    
    <text x="1320" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">Scan, SBOM,</tspan>
      <tspan x="1320" dy="34">license check,</tspan>
      <tspan x="1320" dy="34">optional rebuild</tspan>
    </text>
  </g>

  

  
  <g id="node-prod">
    <rect x="70" y="450" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="112" cy="492" r="24" fill="#207448" />
    <text x="112" y="501" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="280" cy="492" rx="22" ry="7" />
      <path d="M 258 492 v 14 c 0 3.9 10 7 22 7 s 22 -3.1 22 -7 v -14" />
      <path d="M 258 506 v 14 c 0 3.9 10 7 22 7 s 22 -3.1 22 -7 v -14" />
      <line x1="280" y1="517" x2="280" y2="497" />
      <polyline points="274,503 280,497 286,503" />
    </g>
    
    <text x="280" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">Promote to</tspan>
      <tspan x="280" dy="36">'approved' repo</tspan>
    </text>
  </g>

  
  <g id="node-sign">
    <rect x="590" y="450" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <circle cx="632" cy="492" r="24" fill="#db8129" />
    <text x="632" y="501" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="792" cy="505" r="14" />
      <path d="M 786 517 L 782 527 L 792 522 L 802 527 L 798 517" />
      <circle cx="814" cy="496" r="6" />
      <path d="M 814 502 L 814 518 L 820 518" />
      <line x1="814" y1="512" x2="818" y2="512" />
    </g>
    
    <text x="800" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="800" dy="0">Sign + attest</tspan>
      <tspan x="800" dy="36">(your identity)</tspan>
    </text>
  </g>

  
  <g id="node-pol">
    
    <polygon points="1146,450 1494,450 1530,486 1530,634 1494,670 1146,670 1110,634 1110,486" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="1160" cy="492" r="24" fill="#207448" />
    <text x="1160" y="501" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1320 488 L 1338 495 C 1338 514 1320 525 1320 525 C 1320 525 1302 514 1302 495 Z" />
      <path d="M 1315 501 C 1315 496 1325 496 1325 502 C 1325 506 1320 508 1320 512" />
      <circle cx="1320" cy="517" r="1.2" fill="#207448" />
    </g>
    
    <text x="1320" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="middle">Policy pass?</text>
  </g>

  

  
  <g id="node-adm">
    <rect x="70" y="770" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <circle cx="112" cy="812" r="24" fill="#207448" />
    <text x="112" y="821" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 280 808 L 298 815 C 298 834 280 845 280 845 C 280 845 262 834 262 815 Z" />
      <rect x="274" y="825" width="12" height="10" rx="1.5" />
      <path d="M 276 825 v -4 a 4 4 0 0 1 8 0 v 4" />
    </g>
    
    <text x="280" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="280" dy="0">Admission verifies</tspan>
      <tspan x="280" dy="36">your signature only</tspan>
    </text>
  </g>

  
  <g id="node-rej">
    <rect x="1110" y="770" width="420" height="220" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="4" stroke-dasharray="8 6" />
    
    <g stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1304" y="808" width="32" height="36" rx="4" />
      <line x1="1313" y1="820" x2="1327" y2="834" />
      <line x1="1327" y1="820" x2="1313" y2="834" />
    </g>
    
    <text x="1320" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="1320" dy="0">Reject / ticket /</tspan>
      <tspan x="1320" dy="36">exception</tspan>
    </text>
  </g>
</svg>