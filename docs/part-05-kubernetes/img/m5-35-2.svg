  <path d="M 65 205 C 65 188, 105 188, 105 205" fill="none" stroke="#207448" stroke-width="4" />
  <text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">User</text>

  
