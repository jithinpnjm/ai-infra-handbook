  <text x="705" y="360" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="705" dy="0">Workload gets</tspan>
    <tspan x="705" dy="28">QuotaReservation</tspan>
    <tspan x="705" dy="28">in ClusterQueue</tspan>
  </text>

  
  <circle cx="580" cy="460" r="24" fill="#207448" />
  <text x="580" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="755" y="452" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="755" dy="0">create remote Workload</tspan>
    <tspan x="755" dy="28">(dispatcher picks clusters)</tspan>
  </text>
  <line x1="530" y1="495" x2="972" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <circle cx="1030" cy="548" r="24" fill="#207448" />
  <text x="1030" y="548" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1185" y="556" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">create remote Workload</text>
  <line x1="530" y1="578" x2="1382" y2="578" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <path d="M 1390 645 L 1315 645 A 16 16 0 0 0 1299 661 L 1299 679 A 16 16 0 0 0 1315 695 L 1382 695" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrowhead-orange)" />
  <circle cx="1260" cy="650" r="24" fill="#db8129" />
  <text x="1260" y="650" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="1140" y="650" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="1140" dy="0">admits the</tspan>
    <tspan x="1140" dy="28">Workload</tspan>
  </text>

  
  <circle cx="580" cy="715" r="24" fill="#207448" />
  <text x="580" y="715" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
  <text x="755" y="725" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">delete remote Workload</text>
  <line x1="530" y1="748" x2="972" y2="748" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <circle cx="1030" cy="808" r="24" fill="#207448" />
  <text x="1030" y="808" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
  <text x="1185" y="792" text-anchor="middle" fill="#303a36">
    <tspan x="1185" dy="0" font-family="sans-serif" font-size="24" font-weight="bold">create copy of the Job</tspan>
    <tspan x="1185" dy="28" font-family="sans-serif" font-size="24" font-weight="bold">labelled</tspan>
    <tspan x="1185" dy="28" font-family="monospace" font-size="24" font-weight="bold">prebuilt-workload-name</tspan>
  </text>
  <line x1="530" y1="872" x2="1382" y2="872" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <path d="M 1390 935 L 1315 935 A 16 16 0 0 0 1299 951 L 1299 969 A 16 16 0 0 0 1315 985 L 1382 985" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
  <circle cx="1260" cy="940" r="24" fill="#207448" />
  <text x="1260" y="940" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
  <text x="1220" y="948" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">run Job</text>

  > M) -->
  <circle cx="1340" cy="1010" r="24" fill="#207448" />
  <text x="1340" y="1010" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">9</text>
  <text x="755" y="1010" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="755" dy="0">status synced back</tspan>
    <tspan x="755" dy="28">to local Job</tspan>
  </text>
  <line x1="1390" y1="1050" x2="538" y2="1050" stroke="#207448" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowhead)" />

  
  <circle cx="1030" cy="1092" r="24" fill="#207448" />
  <text x="1030" y="1092" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">10</text>
  <text x="1185" y="1090" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1185" dy="0">delete remote objects</tspan>
    <tspan x="1185" dy="28">when Workload Finished</tspan>
  </text>
  <line x1="530" y1="1135" x2="1382" y2="1135" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
