  <rect x="1260" y="135" width="260" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="1285" y="160" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4" />
  <line x1="1293" y1="173" x2="1307" y2="173" stroke="#207448" stroke-width="4" stroke-linecap="round" />
