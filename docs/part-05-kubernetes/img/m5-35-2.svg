<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Kueue MultiKueue (read from the Kueue docs and API types)</title>
  <desc>Sequence diagram illustrating MultiKueue workload scheduling across manager and worker clusters.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <polygon points="0 1, 13 5, 0 9" fill="#207448" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <polygon points="0 1, 13 5, 0 9" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Kueue MultiKueue</text>
  <text x="800" y="106" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">(read from the Kueue docs and API types)</text>

  
