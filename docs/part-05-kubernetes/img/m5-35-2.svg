  <path d="M 390 156 L 390 162 M 390 198 L 390 204 M 366 180 L 372 180 M 408 180 L 414 180 M 373 163 L 377 167 M 403 193 L 407 197 M 373 197 L 377 193 M 403 167 L 407 163" stroke="#207448" stroke-width="4" stroke-linecap="round" />
