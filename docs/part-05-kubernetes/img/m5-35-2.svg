  <text x="360" y="260" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="360" dy="0">submit Job</tspan>
    <tspan x="360" dy="28">to LocalQueue</tspan>
  </text>
  <line x1="150" y1="305" x2="522" y2="305" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />

  
  <path d="M 530 365 L 610 365 A 16 16 0 0 1 626 381 L 626 399 A 16 16 0 0 1 610 415 L 538 415" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead)" />
  <circle cx="660" cy="365" r="24" fill="#207448" />
