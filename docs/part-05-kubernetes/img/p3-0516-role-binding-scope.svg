<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Role, ClusterRole and their bindings: where permissions apply</title>
  <desc>Two-by-two scope grid explaining Kubernetes Role, ClusterRole, RoleBinding, and ClusterRoleBinding permissions and scope.</desc>

  <defs>
    <pattern id="hatchPattern" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#d5e3d8" stroke-width="3" />
    </pattern>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Role, ClusterRole and their bindings:</text>
  <text x="50" y="130" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">where permissions apply</text>

  
  <rect x="50" y="165" width="1040" height="570" rx="16" fill="#ffffff" stroke="#c0d7c7" stroke-width="2" />

  
  <rect x="125" y="180" width="945" height="42" rx="8" fill="#e8f1ea" />
  <text x="597" y="210" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">what it grants</text>

  
  <rect x="65" y="235" width="46" height="480" rx="8" fill="#e8f1ea" />
  <text transform="rotate(-90 88 475)" x="88" y="475" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">binding type</text>

  
  <rect x="125" y="235" width="430" height="275" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="2" />
  
  <g transform="translate(145, 250)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12 L18 12 L24 20 L50 20 A4 4 0 0 1 54 24 L54 46 A4 4 0 0 1 50 50 L4 50 A4 4 0 0 1 0 46 L0 16 A4 4 0 0 1 4 12 Z" />
    <line x1="14" y1="34" x2="40" y2="34" />
  </g>
  <text x="145" y="340" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Role (namespace) +</text>
  <text x="145" y="375" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">RoleBinding (namespace):</text>
  <text x="145" y="425" font-family="sans-serif" font-size="24" fill="#303a36">permissions inside that</text>
  <text x="145" y="460" font-family="sans-serif" font-size="24" fill="#303a36">namespace only</text>

  
  <rect x="575" y="235" width="495" height="275" rx="12" fill="#fff9f5" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(995, 250)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="42" height="42" rx="6" />
    <path d="M16 4 L16 46" />
    <path d="M28 25 L40 25" />
    <path d="M34 19 L40 25 L34 31" />
  </g>
  <text x="595" y="275" font-family="sans-serif" font-size="26" font-weight="bold" fill="#db8129">ClusterRole + RoleBinding:</text>
  <text x="595" y="315" font-family="sans-serif" font-size="24" fill="#303a36">the ClusterRole is reusable,</text>
  <text x="595" y="348" font-family="sans-serif" font-size="24" fill="#303a36">but the grant applies only</text>
  <text x="595" y="381" font-family="sans-serif" font-size="24" fill="#303a36">within the RoleBinding namespace,</text>
  <text x="595" y="414" font-family="sans-serif" font-size="24" fill="#303a36">so a RoleBinding in team-a that</text>
  <text x="595" y="447" font-family="sans-serif" font-size="24" fill="#303a36">references a ClusterRole keeps</text>
  <text x="595" y="480" font-family="sans-serif" font-size="24" fill="#303a36">permissions strictly inside team-a</text>

  
  <rect x="125" y="525" width="430" height="190" rx="12" fill="url(#hatchPattern)" stroke="#c0d7c7" stroke-width="1.5" stroke-dasharray="6 6" />
  <g transform="translate(312, 592)" stroke="#9ab3a3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <line x1="11" y1="11" x2="45" y2="45" />
  </g>

  
  <rect x="575" y="525" width="495" height="190" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="2" />
  
  <g transform="translate(595, 545)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24" />
    <ellipse cx="28" cy="28" rx="11" ry="24" />
    <line x1="4" y1="28" x2="52" y2="28" />
  </g>
  <text x="670" y="580" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">ClusterRole +</text>
  <text x="670" y="615" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">ClusterRoleBinding:</text>
  <text x="670" y="675" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">cluster-wide</text>

  
  <rect x="1110" y="165" width="440" height="570" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1140, 195)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="14" rx="3" />
    <rect x="6" y="28" width="44" height="14" rx="3" />
    <circle cx="14" cy="15" r="2" fill="#207448" />
    <circle cx="14" cy="35" r="2" fill="#207448" />
    <line x1="36" y1="15" x2="42" y2="15" />
    <line x1="36" y1="35" x2="42" y2="35" />
  </g>
  <text x="1140" y="300" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">ClusterRole is needed for</text>
  <text x="1140" y="345" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">cluster-scoped resources</text>
  <text x="1140" y="390" font-family="sans-serif" font-size="24" fill="#303a36">(nodes, PVs, CRDs),</text>
  <text x="1140" y="445" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">non-resource URLs</text>
  <text x="1140" y="490" font-family="sans-serif" font-size="24" fill="#303a36">(/healthz, /metrics),</text>
  <text x="1140" y="555" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">or reuse across namespaces</text>

  
  <rect x="50" y="760" width="1500" height="395" rx="16" fill="#ffffff" stroke="#c0d7c7" stroke-width="2" />

  
  <rect x="70" y="780" width="490" height="165" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="1.5" />
  
  <g transform="translate(500, 795)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 10 L24 2 L42 10 L42 26 C42 38 24 46 24 46 C24 46 6 38 6 26 Z" />
    <line x1="24" y1="16" x2="24" y2="32" />
    <line x1="16" y1="24" x2="32" y2="24" />
  </g>
  <text x="90" y="825" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">additive only, no deny rules,</text>
  <text x="90" y="865" font-family="sans-serif" font-size="24" fill="#303a36">permissions are the union</text>
  <text x="90" y="905" font-family="sans-serif" font-size="24" fill="#303a36">of all bindings</text>

  
  <rect x="580" y="780" width="510" height="165" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="1.5" />
  
  <g transform="translate(1030, 795)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="20" width="36" height="28" rx="4" />
    <path d="M16 20 L16 12 A10 10 0 0 1 36 12 L36 20" />
    <circle cx="26" cy="34" r="3" fill="#207448" />
  </g>
  <text x="600" y="835" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">roleRef cannot be changed:</text>
  <text x="600" y="885" font-family="sans-serif" font-size="24" fill="#303a36">delete and recreate the binding</text>

  
  <rect x="1110" y="780" width="420" height="165" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="1.5" />
  
  <g transform="translate(1460, 795)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="14" r="10" />
    <path d="M6 44 C6 32 14 28 24 28 C34 28 42 32 42 44" />
  </g>
  <text x="1130" y="830" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">subjects:</text>
  <text x="1130" y="880" font-family="sans-serif" font-size="24" fill="#303a36">User, Group or ServiceAccount</text>

  
  <rect x="70" y="965" width="670" height="170" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="1.5" />
  
  <g transform="translate(675, 980)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="24 4, 30 18, 45 18, 33 28, 38 42, 24 33, 10 42, 15 28, 3 18, 18 18" />
  </g>
  <text x="90" y="1005" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">default roles: cluster-admin (everything),</text>
  <text x="90" y="1042" font-family="sans-serif" font-size="24" fill="#303a36">admin (namespace admin incl. RBAC),</text>
  <text x="90" y="1079" font-family="sans-serif" font-size="24" fill="#303a36">edit (read and write most objects,</text>
  <text x="90" y="1116" font-family="sans-serif" font-size="24" fill="#303a36">not roles or bindings), view</text>

  
  <rect x="760" y="965" width="770" height="170" rx="12" fill="#e8f1ea" stroke="#c0d7c7" stroke-width="1.5" />
  
  <g transform="translate(1465, 980)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 24 A18 18 0 1 1 36 12" />
    <polyline points="36 4 36 14 46 14" />
  </g>
  <text x="780" y="1005" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">built-in ClusterRoles are reconciled at</text>
  <text x="780" y="1042" font-family="sans-serif" font-size="24" fill="#303a36">API server start unless annotated</text>
  <text x="780" y="1085" font-family="monospace" font-size="24" fill="#207448">rbac.authorization.kubernetes.io/autoupdate</text>
  <text x="780" y="1118" font-family="monospace" font-size="24" fill="#207448">false</text>
</svg>