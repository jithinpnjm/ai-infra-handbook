<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Layers of autoscaling</title>
  <desc>Visual infographic explaining the layers of autoscaling in Kubernetes, from metrics triggering HPA and VPA, to pending pods triggering Cluster Autoscaler and Karpenter, node provisioning, scheduling, and scale-down.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Layers of autoscaling</text>

  
  
  <line x1="500" y1="200" x2="500" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="1250" y1="200" x2="1250" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="500" y1="360" x2="500" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="500" y1="530" x2="500" y2="590" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="500" y1="700" x2="500" y2="760" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="500" y1="870" x2="500" y2="930" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  
  <line x1="1250" y1="700" x2="1250" y2="760" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g id="node-metrics">
    <rect x="80" y="90" width="1440" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(108, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 44 A 25 25 0 1 1 50 44"/>
      <line x1="28" y1="34" x2="42" y2="18"/>
      <circle cx="28" cy="34" r="3.5" fill="#207448"/>
      <line x1="28" y1="12" x2="28" y2="17"/>
      <line x1="12" y1="28" x2="17" y2="28"/>
      <line x1="44" y1="28" x2="39" y2="28"/>
    </g>
    
    <text x="185" y="137" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Metrics: <tspan font-size="26" font-weight="normal" fill="#303a36">CPU/mem, request rate, queue depth,</tspan></text>
    <text x="185" y="174" font-family="sans-serif" font-size="26" fill="#303a36">tokens/s, KV-cache, external events</text>
  </g>

  
  <g id="node-hpa">
    <rect x="80" y="250" width="840" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="128" cy="305" r="22" fill="#207448"/>
    <text x="128" y="313" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(170, 277)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="14" width="22" height="30" rx="4"/>
      <rect x="22" y="6" width="22" height="30" rx="4"/>
      <line x1="36" y1="46" x2="52" y2="46"/>
      <polyline points="47,41 52,46 47,51"/>
    </g>
    
    <text x="245" y="295" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">HPA / KEDA</text>
    <text x="245" y="332" font-family="sans-serif" font-size="24" fill="#506059">adjust replicas</text>
  </g>

  
  <g id="node-vpa">
    <rect x="980" y="250" width="540" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1008, 277)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4"/>
      <line x1="28" y1="18" x2="28" y2="38"/>
      <polyline points="22,24 28,18 34,24"/>
      <polyline points="22,32 28,38 34,32"/>
    </g>
    
    <text x="1080" y="295" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">VPA</text>
    <text x="1080" y="332" font-family="sans-serif" font-size="24" fill="#506059">adjust requests/limits</text>
  </g>

  
  <g id="node-pending">
    <rect x="80" y="420" width="840" height="110" rx="14" fill="#fef3e7" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="128" cy="475" r="22" fill="#db8129"/>
    <text x="128" y="483" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(170, 447)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 8 L 46 8 L 32 28 L 46 48 L 10 48 L 24 28 Z"/>
      <line x1="28" y1="36" x2="28" y2="40"/>
    </g>
    
    <text x="245" y="485" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Pending pods (no capacity)</text>
  </g>

  
  <g id="node-ca">
    <rect x="80" y="590" width="840" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="128" cy="645" r="22" fill="#207448"/>
    <text x="128" y="653" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(170, 617)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="36" height="18" rx="3"/>
      <rect x="4" y="28" width="36" height="18" rx="3"/>
      <circle cx="10" cy="15" r="1.5" fill="#207448"/>
      <circle cx="10" cy="37" r="1.5" fill="#207448"/>
      <line x1="47" y1="26" x2="55" y2="26"/>
      <line x1="51" y1="22" x2="51" y2="30"/>
    </g>
    
    <text x="245" y="635" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cluster Autoscaler / Karpenter</text>
    <text x="245" y="672" font-family="sans-serif" font-size="24" fill="#506059">add nodes</text>
  </g>

  
  <g id="node-idle">
    <rect x="980" y="590" width="540" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1008, 617)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="34" rx="4"/>
      <circle cx="14" cy="27" r="2" fill="#207448"/>
      <line x1="24" y1="27" x2="42" y2="27" stroke-dasharray="2 6"/>
    </g>
    
    <text x="1080" y="655" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Idle/underused nodes</text>
  </g>

  
  <g id="node-nodes">
    <rect x="80" y="760" width="840" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="128" cy="815" r="22" fill="#207448"/>
    <text x="128" y="823" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(170, 787)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="36" height="36" rx="4"/>
      <line x1="16" y1="4" x2="16" y2="8"/>
      <line x1="26" y1="4" x2="26" y2="8"/>
      <line x1="36" y1="4" x2="36" y2="8"/>
      <line x1="16" y1="44" x2="16" y2="48"/>
      <line x1="26" y1="44" x2="26" y2="48"/>
      <line x1="36" y1="44" x2="36" y2="48"/>
      <circle cx="26" cy="26" r="8"/>
      <polyline points="26,22 26,26 29,26"/>
    </g>
    
    <text x="245" y="825" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">New nodes join (minutes for GPU)</text>
  </g>

  
  <g id="node-cad">
    <rect x="980" y="760" width="540" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1008, 787)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="34" height="34" rx="4"/>
      <line x1="12" y1="27" x2="28" y2="27"/>
      <line x1="42" y1="18" x2="52" y2="18"/>
      <polyline points="47,13 52,18 47,23"/>
      <line x1="42" y1="36" x2="52" y2="36"/>
      <polyline points="47,31 52,36 47,41"/>
    </g>
    
    <text x="1080" y="805" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CA scale-down:</text>
    <text x="1080" y="842" font-family="sans-serif" font-size="26" fill="#506059">drain &amp; remove</text>
  </g>

  
  <g id="node-sched">
    <rect x="80" y="930" width="840" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="128" cy="985" r="22" fill="#207448"/>
    <text x="128" y="993" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    
    <g transform="translate(170, 957)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="44" height="42" rx="4"/>
      <line x1="6" y1="20" x2="50" y2="20"/>
      <line x1="22" y1="20" x2="22" y2="48"/>
      <polyline points="29,35 34,40 44,28"/>
    </g>
    
    <text x="245" y="995" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduler places pods</text>
  </g>
</svg>