<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>ContainerCreating: the event names the missing part</title>
  <desc>Visual infographic explaining how Kubernetes events identify the missing dependency causing Pods to be stuck in ContainerCreating, comparing FailedMount, FailedCreatePodSandBox, and Pulling.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">ContainerCreating: the event names the missing part</text>

  
  <rect x="60" y="115" width="940" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(502, 135)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 28 18 L 28 28 L 36 28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <text x="530" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="530" dy="0">Pod stuck in ContainerCreating:</tspan>
    <tspan x="530" dy="42">the event names what it waits for</tspan>
  </text>

  
  <rect x="1040" y="115" width="500" height="240" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6 6" />

  
  <g transform="translate(1210, 135)">
    
    <path d="M 0 45 L 60 45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 6 45 A 24 24 0 0 1 54 45 Z" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="30" cy="18" r="4" fill="#207448" />
    <path d="M 24 10 Q 20 2 24 -6" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />
    <path d="M 36 10 Q 40 2 36 -6" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" />

    
    <path d="M 95 45 L 165 45" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 105 45 L 105 60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 155 45 L 155 60" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="130" cy="35" r="7" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 126 31 L 134 39 M 134 31 L 126 39" stroke="#db8129" stroke-width="2" stroke-linecap="round" />
  </g>

  
  <text x="1290" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="1290" dy="0">Kitchen ready, table not set:</tspan>
    <tspan x="1290" dy="36">the meal cannot start</tspan>
  </text>

  
  <path d="M 470 355 C 470 415 290 395 290 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 530 355 C 530 415 800 395 800 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 590 355 C 590 415 1310 395 1310 460" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="60" y="460" width="460" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(262, 485)">
    <ellipse cx="28" cy="10" rx="24" ry="8" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 4 10 L 4 44 A 24 8 0 0 0 52 44 L 52 10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 4 27 A 24 8 0 0 0 52 27" fill="none" stroke="#207448" stroke-width="4" />
  </g>

  <text x="290" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">FailedMount</text>
  <text x="290" y="640" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="290" dy="0" font-family="system-ui, -apple-system, sans-serif">CSI or the volume:</tspan>
    <tspan x="290" dy="36">
      <tspan font-family="system-ui, -apple-system, sans-serif">check </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">volumeattachment</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">,</tspan>
    </tspan>
    <tspan x="290" dy="36">
      <tspan font-family="system-ui, -apple-system, sans-serif">driver logs, </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">findmnt</tspan>
    </tspan>
  </text>

  
  <rect x="570" y="460" width="460" height="330" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
  
  
  <g transform="translate(772, 485)">
    <circle cx="28" cy="10" r="7" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="8" cy="44" r="7" fill="none" stroke="#db8129" stroke-width="4" />
    <circle cx="48" cy="44" r="7" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="24" y1="16" x2="12" y2="38" stroke="#db8129" stroke-width="4" />
    <line x1="32" y1="16" x2="44" y2="38" stroke="#db8129" stroke-width="4" />
    <line x1="15" y1="44" x2="41" y2="44" stroke="#db8129" stroke-width="4" />
  </g>

  <text x="800" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129" text-anchor="middle">FailedCreatePodSandBox</text>
  <text x="800" y="650" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">
      <tspan font-family="system-ui, -apple-system, sans-serif">CNI: check </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">/etc/cni/net.d</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">,</tspan>
    </tspan>
    <tspan x="800" dy="40" font-family="system-ui, -apple-system, sans-serif">IPAM, MTU, runtime logs</tspan>
  </text>

  
  <rect x="1080" y="460" width="460" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(1282, 485)">
    <path d="M 4 36 L 4 48 L 52 48 L 52 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="6" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <path d="M 16 22 L 28 34 L 40 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="1310" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Pulling</text>
  <text x="1310" y="626" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1310" dy="0" font-family="system-ui, -apple-system, sans-serif">Large image still</tspan>
    <tspan x="1310" dy="34" font-family="system-ui, -apple-system, sans-serif">downloading: check</tspan>
    <tspan x="1310" dy="34" font-family="system-ui, -apple-system, sans-serif">registry bandwidth,</tspan>
    <tspan x="1310" dy="34">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">crictl images</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">, the mirror</tspan>
    </tspan>
  </text>

  
  <rect x="60" y="835" width="1480" height="80" rx="16" fill="#207448" />
  <text x="800" y="886" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The waiter is the event: read which part is missing.</text>
</svg>