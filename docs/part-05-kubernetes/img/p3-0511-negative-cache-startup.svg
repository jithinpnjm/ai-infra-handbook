<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Why a worker that asks too early waits 30 seconds</title>
  <desc>Timeline of DNS negative caching (NXDOMAIN) causing a 30-second worker startup delay, with fixes and JVM side notes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why a worker that asks too early waits 30 seconds</text>

  
  <rect x="50" y="100" width="880" height="910" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(75, 120)">
    <rect x="0" y="5" width="44" height="42" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="12" y1="0" x2="12" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="32" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="135" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Timeline</text>

  
  <rect x="75" y="175" width="830" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="215" r="24" fill="#207448"/>
  <text x="115" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(160, 193)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="22,12 22,22 32,22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="225" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">T0</text>
  <text x="115" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">worker pod resolves trainer-0.trainer.ml</tspan>
    <tspan x="115" dy="34">before that pod exists: NXDOMAIN, cached as a</tspan>
    <tspan x="115" dy="34">negative answer (cache denial, SOA minimum 30 s)</tspan>
  </text>

  
  <line x1="490" y1="345" x2="490" y2="380" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="380" width="830" height="140" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="420" r="24" fill="#207448"/>
  <text x="115" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(160, 398)">
    <rect x="0" y="0" width="44" height="42" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="14" x2="44" y2="14" stroke="#207448" stroke-width="3"/>
    <circle cx="10" cy="7" r="2.5" fill="#207448"/>
    <polygon points="17,21 17,35 29,28" fill="#207448"/>
  </g>
  <text x="225" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">T0+few s</text>
  <text x="115" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">trainer-0 pod starts and its record now exists</text>

  
  <line x1="490" y1="520" x2="490" y2="555" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="555" width="830" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
  <circle cx="115" cy="595" r="24" fill="#207448"/>
  <text x="115" y="603" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(160, 573)">
    <rect x="2" y="0" width="40" height="44" rx="4" fill="none" stroke="#db8129" stroke-width="4"/>
    <path d="M 28 0 L 42 14 L 28 14 Z" fill="#db8129"/>
    <line x1="14" y1="22" x2="30" y2="34" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="30" y1="22" x2="14" y2="34" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="225" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Until T0+30 s</text>
  <text x="115" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">the worker keeps getting the cached NXDOMAIN:</tspan>
    <tspan x="115" dy="34">sticky note saying no such person</tspan>
  </text>

  
  <line x1="490" y1="735" x2="490" y2="770" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="75" y="770" width="830" height="170" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="115" cy="810" r="24" fill="#207448"/>
  <text x="115" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(160, 788)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="12,22 19,30 33,14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="225" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">T0+30 s</text>
  <text x="115" y="870" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="115" dy="0">cache entry expires, lookup succeeds,</tspan>
    <tspan x="115" dy="34">worker joins</tspan>
  </text>

  
  <rect x="970" y="100" width="580" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(995, 120)">
    <circle cx="22" cy="22" r="10" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 22 2 L 22 8 M 22 36 L 22 42 M 2 22 L 8 22 M 36 22 L 42 22 M 8 8 L 12 12 M 32 32 L 36 36 M 8 36 L 12 32 M 32 12 L 36 8" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1055" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Fix</text>

  
  <rect x="995" y="180" width="530" height="325" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1020" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1020" dy="0">workers retry with backoff and</tspan>
    <tspan x="1020" dy="36">bounded timeouts; applications</tspan>
    <tspan x="1020" dy="36">avoid caching failures;</tspan>
    <tspan x="1020" dy="36">headless Service with</tspan>
    <tspan x="1020" dy="36">publishNotReadyAddresses true</tspan>
    <tspan x="1020" dy="36">so peers resolve before ready;</tspan>
    <tspan x="1020" dy="36">stagger startup</tspan>
  </text>

  
  <rect x="970" y="560" width="580" height="450" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(995, 580)">
    <path d="M 6 10 L 22 2 L 38 10 L 38 24 C 38 35 22 42 22 42 C 22 42 6 35 6 24 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="1055" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Side</text>

  
  <rect x="995" y="640" width="530" height="345" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1020" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1020" dy="0">JVM caches successful lookups</tspan>
    <tspan x="1020" dy="38">indefinitely with a security</tspan>
    <tspan x="1020" dy="38">manager, 30 s without one;</tspan>
    <tspan x="1020" dy="38">set TTL properties so clients</tspan>
    <tspan x="1020" dy="38">drop old IPs after failover</tspan>
  </text>
</svg>