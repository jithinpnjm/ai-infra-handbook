<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <title>Architecture</title>
  <desc>Lustre architecture diagram showing Clients, Metadata servers and targets, and Data servers and targets.</desc>

  <defs>
    
