  <rect x="0" y="0" width="1600" height="1150" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Architecture</text>

  
  
  
