<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Busy is not efficient: IPC tells you whether the CPU is stalled or executing</title>
  <desc>Visual infographic explaining why high CPU utilisation does not imply execution efficiency, comparing memory-stalled low IPC to efficient high IPC, with pmcarch measurement guidelines.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Busy is not efficient:</text>
  <text x="50" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">IPC tells you whether the CPU is stalled or executing</text>

  

  
  <rect x="50" y="160" width="970" height="195" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="70" y="175" width="310" height="70" rx="8" fill="#e8f1ea"/>
  <text x="225" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">mostly stalled, usually on memory</text>
  <text x="225" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">(below about 0.2 to 0.5)</text>

  
  <rect x="540" y="175" width="460" height="70" rx="8" fill="#e8f1ea"/>
  <text x="770" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">busy executing (above about 1 to 2)</text>

  
  <line x1="100" y1="285" x2="980" y2="285" stroke="#207448" stroke-width="6" stroke-linecap="round"/>

  
  <line x1="100" y1="270" x2="100" y2="300" stroke="#207448" stroke-width="4"/>
  <text x="80" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="end">0</text>

  
  <line x1="980" y1="270" x2="980" y2="300" stroke="#207448" stroke-width="4"/>
  <text x="1000" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36" text-anchor="start">2</text>

  
  <line x1="232" y1="270" x2="232" y2="300" stroke="#207448" stroke-width="4"/>
  <circle cx="232" cy="285" r="8" fill="#207448"/>
  <rect x="152" y="303" width="160" height="42" rx="8" fill="#207448"/>
  <text x="232" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">IPC 0.30</text>

  
  <line x1="500" y1="270" x2="500" y2="300" stroke="#207448" stroke-width="4"/>
  <circle cx="500" cy="285" r="8" fill="#207448"/>
  <rect x="420" y="303" width="160" height="42" rx="8" fill="#207448"/>
  <text x="500" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">IPC 0.91</text>

  
  <line x1="892" y1="270" x2="892" y2="300" stroke="#207448" stroke-width="4"/>
  <circle cx="892" cy="285" r="8" fill="#207448"/>
  <rect x="812" y="303" width="160" height="42" rx="8" fill="#207448"/>
  <text x="892" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">IPC 1.80</text>

  
  <rect x="50" y="375" width="970" height="120" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  
  <g transform="translate(75, 407)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
    <line x1="28" y1="28" x2="42" y2="18" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="4" fill="#db8129"/>
  </g>
  <text x="155" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Utilisation counts every cycle that is not idle, including cycles spent</text>
  <text x="155" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">waiting on memory, so a CPU at 100% busy is not necessarily 100% efficient</text>

  
  <rect x="50" y="515" width="970" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 545)">
    <rect x="8" y="8" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="155" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">(the pmcarch sample: 87,166,313 instructions over 96,163,187 cycles,</text>
  <text x="155" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">BMR% 3.44, LLC% 73.45)</text>

  
  <rect x="50" y="650" width="470" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(75, 672)">
    <rect x="4" y="12" width="48" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="12" y1="44" x2="12" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="20" y1="44" x2="20" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="36" y1="44" x2="36" y2="52" stroke="#207448" stroke-width="3"/>
    <line x1="44" y1="44" x2="44" y2="52" stroke="#207448" stroke-width="3"/>
    <rect x="10" y="20" width="8" height="14" fill="#207448"/>
    <rect x="24" y="20" width="8" height="14" fill="#207448"/>
    <rect x="38" y="20" width="8" height="14" fill="#207448"/>
  </g>
  <text x="75" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Faster memory, better locality,</text>
  <text x="75" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">fewer memory accesses; check</text>
  <text x="75" y="836" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">NUMA, cache misses, TLB;</text>
  <text x="75" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">consider huge pages, binding,</text>
  <text x="75" y="916" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">data layout</text>

  
  <rect x="550" y="650" width="470" height="295" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(575, 672)">
    <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="4" x2="28" y2="12" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="44" x2="28" y2="52" stroke="#207448" stroke-width="4"/>
    <line x1="4" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4"/>
    <line x1="44" y1="28" x2="52" y2="28" stroke="#207448" stroke-width="4"/>
    <line x1="11" y1="11" x2="17" y2="17" stroke="#207448" stroke-width="4"/>
    <line x1="39" y1="39" x2="45" y2="45" stroke="#207448" stroke-width="4"/>
    <line x1="11" y1="45" x2="17" y2="39" stroke="#207448" stroke-width="4"/>
    <line x1="39" y1="17" x2="45" y2="11" stroke="#207448" stroke-width="4"/>
  </g>
  <text x="575" y="756" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Run fewer instructions:</text>
  <text x="575" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a better algorithm,</text>
  <text x="575" y="836" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">vectorisation,</text>
  <text x="575" y="876" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">compiler options</text>

  

  
  <rect x="1050" y="160" width="500" height="785" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <path d="M 1050 174 Q 1050 160 1064 160 L 1536 160 Q 1550 160 1550 174 L 1550 240 L 1050 240 Z" fill="#e8f1ea"/>
  <line x1="1050" y1="240" x2="1550" y2="240" stroke="#207448" stroke-width="2"/>
  
  <g transform="translate(1075, 172)">
    <rect x="4" y="6" width="48" height="38" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 12 18 L 22 25 L 12 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="32" x2="38" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1145" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">How to measure</text>

  
  <rect x="1075" y="260" width="450" height="300" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1095" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">perf stat -e cycles,</text>
  <text x="1095" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">instructions,</text>
  <text x="1095" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">cache-misses,</text>
  <text x="1095" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">context-switches,</text>
  <text x="1095" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">cpu-migrations ./prog</text>

  
  <rect x="1075" y="580" width="450" height="345" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
  <text x="1095" y="630" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">pmcarch prints</text>
  <text x="1095" y="680" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">K_CYCLES, K_INSTR, IPC,</text>
  <text x="1095" y="730" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">BR_RETIRED, BR_MISPRED,</text>
  <text x="1095" y="780" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">BMR%, LLCREF, LLCMISS,</text>
  <text x="1095" y="830" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">LLC%</text>

  
  <rect x="50" y="965" width="1500" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1018" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">A training job whose host threads show high CPU use and low IPC is memory-bound on the host</text>

  
  <rect x="50" y="1070" width="1500" height="85" rx="12" fill="#207448"/>
  <text x="800" y="1123" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Keep utilisation and efficiency apart</text>
</svg>