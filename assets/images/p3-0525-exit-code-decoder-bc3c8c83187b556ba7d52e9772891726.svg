<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading a container exit code</title>
  <desc>Visual decoder table and diagnostic steps for container exit codes, identifying root causes from SIGKILL and segfaults to configuration errors.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <g transform="translate(60, 45)">
    
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="0" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="3"/>
    <circle cx="12" cy="9" r="3" fill="#207448"/>
    <circle cx="22" cy="9" r="3" fill="#207448"/>
    <circle cx="32" cy="9" r="3" fill="#207448"/>
    <path d="M 12 36 L 22 41 L 12 46" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="46" x2="42" y2="46" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="76" y="44" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">Reading a container exit code</text>
  </g>

  
  <g id="decoder-table" transform="translate(60, 125)">
    
    <rect x="0" y="0" width="1480" height="52" rx="8" fill="#207448"/>
    <text x="24" y="36" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">Exit code</text>
    <text x="240" y="36" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">who ended the process</text>
    <text x="760" y="36" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">first checks</text>

    
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="1480" height="106" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(20, 25)">
        <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#db8129" stroke-width="4"/>
        <line x1="14" y1="16" x2="42" y2="16" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="28" x2="42" y2="28" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="40" x2="30" y2="40" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <rect x="92" y="28" width="120" height="50" rx="8" fill="#db8129"/>
      <text x="152" y="63" font-family="monospace" font-size="32px" font-weight="bold" fill="#ffffff" text-anchor="middle">137</text>

      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="240" y="45">something forced it to stop (</tspan>
        <tspan font-family="monospace" font-weight="bold">SIGKILL</tspan>
        <tspan>), most often</tspan>
        <tspan x="240" y="78">the memory limit or a kill from the runtime</tspan>
      </text>

      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="760" y="45">check </tspan>
        <tspan font-family="monospace" font-weight="bold">OOMKilled</tspan>
        <tspan>, node pressure, memory limit against</tspan>
        <tspan x="760" y="78" font-family="monospace">/dev/shm</tspan>
        <tspan font-family="sans-serif"> and page cache</tspan>
      </text>
    </g>

    
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="1480" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 14)">
        <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="14" y1="14" x2="42" y2="42" stroke="#207448" stroke-width="4"/>
        <line x1="42" y1="14" x2="14" y2="42" stroke="#207448" stroke-width="4"/>
      </g>
      <rect x="92" y="17" width="120" height="50" rx="8" fill="#207448"/>
      <text x="152" y="52" font-family="monospace" font-size="32px" font-weight="bold" fill="#ffffff" text-anchor="middle">139</text>

      <text x="240" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">segfault</text>
      <text x="760" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">image or driver mismatch or a bad CUDA library</text>
    </g>

    
    <g transform="translate(0, 272)">
      <rect x="0" y="0" width="1480" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 14)">
        <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
        <polyline points="28,14 28,28 38,28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect x="92" y="17" width="120" height="50" rx="8" fill="#207448"/>
      <text x="152" y="52" font-family="monospace" font-size="32px" font-weight="bold" fill="#ffffff" text-anchor="middle">143</text>

      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="240" y="38">something asked it to stop politely (</tspan>
        <tspan font-family="monospace" font-weight="bold">SIGTERM</tspan>
        <tspan>),</tspan>
        <tspan x="240" y="68">most often the kubelet during shutdown</tspan>
      </text>

      <text x="760" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">or a probe failure</text>
    </g>

    
    <g transform="translate(0, 366)">
      <rect x="0" y="0" width="1480" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 14)">
        <path d="M 12 6 L 36 6 L 46 16 L 46 50 L 12 50 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
        <line x1="22" y1="36" x2="36" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <rect x="92" y="17" width="120" height="50" rx="8" fill="#207448"/>
      <text x="152" y="52" font-family="monospace" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">126 and 127</text>

      <text x="240" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">entrypoint is missing or not executable</text>
    </g>

    
    <g transform="translate(0, 460)">
      <rect x="0" y="0" width="1480" height="84" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 14)">
        <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="28" y1="6" x2="28" y2="12" stroke="#207448" stroke-width="4"/>
        <line x1="28" y1="44" x2="28" y2="50" stroke="#207448" stroke-width="4"/>
        <line x1="6" y1="28" x2="12" y2="28" stroke="#207448" stroke-width="4"/>
        <line x1="44" y1="28" x2="50" y2="28" stroke="#207448" stroke-width="4"/>
      </g>
      <rect x="92" y="17" width="120" height="50" rx="8" fill="#207448"/>
      <text x="152" y="52" font-family="monospace" font-size="28px" font-weight="bold" fill="#ffffff" text-anchor="middle">1 and 2</text>

      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="240" y="38">the app stopped itself because of an error</tspan>
        <tspan x="240" y="68">it chose to report</tspan>
      </text>

      <text x="760" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">config, missing secret or env var, dependency</text>
    </g>
  </g>

  
  <g id="steps-strip" transform="translate(60, 695)">
    
    <text x="0" y="32" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Steps strip</text>

    
    <defs>
      <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <polygon points="0 0, 9 4.5, 0 9" fill="#207448"/>
      </marker>
    </defs>
    <line x1="345" y1="185" x2="375" y2="185" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>
    <line x1="720" y1="185" x2="750" y2="185" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>
    <line x1="1095" y1="185" x2="1125" y2="185" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="345" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <circle cx="44" cy="44" r="24" fill="#207448"/>
      <text x="44" y="53" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      
      <g transform="translate(265, 16)">
        <path d="M 6 4 L 38 4 L 50 16 L 50 52 L 6 52 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
        <line x1="16" y1="26" x2="38" y2="26" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="16" y1="36" x2="34" y2="36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <text font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">
        <tspan x="20" y="125">kubectl logs</tspan>
        <tspan x="20" y="165">--previous</tspan>
        <tspan x="20" y="205">--timestamps</tspan>
      </text>
    </g>

    
    <g transform="translate(375, 50)">
      <rect x="0" y="0" width="345" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <circle cx="44" cy="44" r="24" fill="#207448"/>
      <text x="44" y="53" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      
      <g transform="translate(265, 16)">
        <circle cx="24" cy="24" r="16" fill="none" stroke="#207448" stroke-width="4"/>
        <line x1="36" y1="36" x2="50" y2="50" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      </g>
      
      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="20" y="115">read State and Last State</tspan>
        <tspan x="20" y="152">in </tspan>
        <tspan font-family="monospace" font-weight="bold">kubectl describe</tspan>
        <tspan x="20" y="188" font-family="monospace" font-weight="bold">pod</tspan>
        <tspan font-family="sans-serif"> for exit code</tspan>
        <tspan x="20" y="224">and reason</tspan>
      </text>
    </g>

    
    <g transform="translate(750, 50)">
      <rect x="0" y="0" width="345" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <circle cx="44" cy="44" r="24" fill="#207448"/>
      <text x="44" y="53" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      
      <g transform="translate(265, 16)">
        <rect x="4" y="4" width="36" height="36" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
        <path d="M 22 22 L 48 48" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
        <circle cx="48" cy="48" r="4" fill="#207448"/>
      </g>
      
      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="20" y="105">reproduce with</tspan>
        <tspan x="20" y="137" font-family="monospace" font-weight="bold">kubectl debug</tspan>
        <tspan x="20" y="169" font-family="monospace" font-weight="bold">--copy-to</tspan>
        <tspan font-family="sans-serif"> overriding</tspan>
        <tspan x="20" y="201">command to </tspan>
        <tspan font-family="monospace">sleep infinity</tspan>
        <tspan x="20" y="233">(keeps volumes,</tspan>
        <tspan x="20" y="261">environment and labels)</tspan>
      </text>
    </g>

    
    <g transform="translate(1125, 50)">
      <rect x="0" y="0" width="355" height="270" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      
      <circle cx="44" cy="44" r="24" fill="#207448"/>
      <text x="44" y="53" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      
      <g transform="translate(275, 16)">
        <rect x="6" y="10" width="44" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
        <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3"/>
        <line x1="14" y1="46" x2="14" y2="52" stroke="#207448" stroke-width="3"/>
        <line x1="28" y1="46" x2="28" y2="52" stroke="#207448" stroke-width="3"/>
        <line x1="42" y1="46" x2="42" y2="52" stroke="#207448" stroke-width="3"/>
      </g>
      
      <text font-family="sans-serif" font-size="24px" fill="#303a36">
        <tspan x="20" y="112">check mounts, env,</tspan>
        <tspan x="20" y="148">DNS, GPU visibility with</tspan>
        <tspan x="20" y="184" font-family="monospace" font-weight="bold">nvidia-smi</tspan>
        <tspan font-family="sans-serif">, permissions</tspan>
      </text>
    </g>
  </g>

  
  <g id="reminder-bar" transform="translate(60, 1070)">
    <rect x="0" y="0" width="1480" height="85" rx="10" fill="#207448"/>
    
    <g transform="translate(24, 15)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#ffffff" stroke-width="4"/>
      <line x1="28" y1="18" x2="28" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="40" r="3" fill="#ffffff"/>
    </g>
    
    <text x="96" y="52" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Reminder</text>
    
    <text x="260" y="52" font-family="sans-serif" font-size="26px" fill="#ffffff">
      <tspan font-family="monospace" font-weight="bold">CrashLoopBackOff</tspan>
      <tspan> is a symptom, the cause is in the logs or the exit code</tspan>
    </text>
  </g>
</svg>