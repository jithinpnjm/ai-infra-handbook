<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How preemption goes wrong for training jobs</title>
  <desc>Visual infographic explaining preemption issues in distributed training jobs: cascading preemption, multi-pod waste, priority inversion, victim choice simulation, and mitigations.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How preemption goes wrong for training jobs</text>

  
  <g id="diagram-cascade">
    
    <rect x="40" y="130" width="480" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(60, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="4" width="10" height="36" rx="2" />
      <rect x="16" y="8" width="10" height="32" rx="2" transform="rotate(15 21 24)" />
      <rect x="34" y="14" width="10" height="28" rx="2" transform="rotate(35 39 28)" />
    </g>
    
    
    <text x="125" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">1 Cascade</text>

    
    <g transform="translate(60, 210)">
      <rect x="20" y="5" width="22" height="60" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <rect x="110" y="10" width="22" height="58" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" transform="rotate(18 121 39)" />
      <rect x="210" y="20" width="22" height="54" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" transform="rotate(38 221 47)" />
      <rect x="320" y="35" width="22" height="50" rx="4" fill="#ffffff" stroke="#207448" stroke-width="3" transform="rotate(60 331 60)" />
    </g>

    
    <text x="65" y="325" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">high-priority pod preempts</tspan>
      <tspan x="65" dy="34">victim A; A is rescheduled</tspan>
      <tspan x="65" dy="34">and may preempt B, which</tspan>
      <tspan x="65" dy="34">may preempt C</tspan>
      <tspan x="65" dy="34">(row of dominoes)</tspan>
    </text>
  </g>

  
  <g id="diagram-multipod-waste">
    
    <rect x="560" y="130" width="480" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(580, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="18" height="18" rx="3" />
      <rect x="26" y="0" width="18" height="18" rx="3" />
      <rect x="0" y="26" width="18" height="18" rx="3" />
      <rect x="26" y="26" width="18" height="18" rx="3" stroke-dasharray="4,3" />
    </g>

    
    <text x="645" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">2 Multi-pod waste</text>

    
    <g transform="translate(585, 210)">
      
      <rect x="0" y="5" width="85" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="42" cy="35" r="12" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="38" y1="29" x2="38" y2="41" stroke="#207448" stroke-width="2.5" />
      <line x1="46" y1="29" x2="46" y2="41" stroke="#207448" stroke-width="2.5" />

      
      <rect x="110" y="5" width="85" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="152" cy="35" r="12" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="148" y1="29" x2="148" y2="41" stroke="#207448" stroke-width="2.5" />
      <line x1="156" y1="29" x2="156" y2="41" stroke="#207448" stroke-width="2.5" />

      
      <rect x="220" y="5" width="85" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="262" cy="35" r="12" fill="none" stroke="#207448" stroke-width="2.5" />
      <line x1="258" y1="29" x2="258" y2="41" stroke="#207448" stroke-width="2.5" />
      <line x1="266" y1="29" x2="266" y2="41" stroke="#207448" stroke-width="2.5" />

      
      <rect x="330" y="5" width="85" height="60" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="4" stroke-dasharray="6,4" />
      <line x1="355" y1="20" x2="390" y2="50" stroke="#303a36" stroke-width="3" />
      <line x1="390" y1="20" x2="355" y2="50" stroke="#303a36" stroke-width="3" />
    </g>

    
    <text x="585" y="320" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">one pod of a 4-pod training</tspan>
      <tspan x="585" dy="32">job is evicted; the other</tspan>
      <tspan x="585" dy="32">pods sit idle until the</tspan>
      <tspan x="585" dy="32">operator restarts them all;</tspan>
      <tspan x="585" dy="32">progress of the whole</tspan>
      <tspan x="585" dy="32">job is wasted</tspan>
    </text>
  </g>

  
  <g id="diagram-priority-inversion">
    
    <rect x="1080" y="130" width="480" height="390" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(1100, 150)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2 L40 8 V22 C40 33 22 42 22 42 C22 42 4 33 4 22 V8 Z" />
      <circle cx="22" cy="20" r="4" />
      <path d="M22 24 V29" />
    </g>

    
    <text x="1165" y="180" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">3 Priority inversion</text>

    
    <g transform="translate(1105, 210)">
      <rect x="10" y="5" width="160" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <path d="M205 10 L205 60" stroke="#207448" stroke-width="4" stroke-dasharray="8,6" />
      <rect x="240" y="5" width="160" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" />
      <circle cx="90" cy="35" r="16" fill="none" stroke="#207448" stroke-width="3" />
      <path d="M85 35 L90 40 L97 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="320" cy="35" r="16" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="310" y1="35" x2="330" y2="35" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>

    
    <text x="1105" y="325" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1105" dy="0">low-priority pods hold</tspan>
      <tspan x="1105" dy="34">resources; the high-priority</tspan>
      <tspan x="1105" dy="34">pod cannot preempt them</tspan>
      <tspan x="1105" dy="34">because of PDBs</tspan>
      <tspan x="1105" dy="34">or affinity</tspan>
    </text>
  </g>

  
  <g id="victim-choice-strip">
    
    <rect x="40" y="560" width="1520" height="200" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 575)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6 V38" />
      <path d="M8 14 L22 10 L36 14" />
      <path d="M8 14 L3 26 H13 Z" />
      <path d="M36 14 L31 26 H41 Z" />
      <path d="M12 38 H32" />
    </g>

    
    <text x="125" y="605" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Victim choice strip</text>

    
    <rect x="65" y="625" width="1470" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />

    
    <text x="90" y="660" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">scheduler simulates first; picks the node needing the fewest victims, ranked by</tspan>
      <tspan x="90" dy="34">fewest PDB violations, lowest highest-victim priority, fewest victims, latest start time;</tspan>
      <tspan x="90" dy="34">sets <tspan font-family="monospace">status.nominatedNodeName</tspan> and deletes victims</tspan>
    </text>
  </g>

  
  <g id="mitigations">
    
    <rect x="40" y="800" width="1520" height="360" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(65, 815)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 4 L38 10 V22 C38 32 22 40 22 40 C22 40 6 32 6 22 V10 Z" />
      <path d="M14 21 L19 26 L29 16" />
    </g>

    
    <text x="125" y="845" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Mitigations</text>

    
    
    <rect x="65" y="865" width="470" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="85" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0" font-family="monospace">preemptionPolicy Never</tspan>
      <tspan x="85" dy="36">for training-low</tspan>
    </text>

    
    <rect x="565" y="865" width="470" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="585" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="585" dy="0">non-preemptible or equal</tspan>
      <tspan x="585" dy="36">priority within a tier</tspan>
    </text>

    
    <rect x="1065" y="865" width="470" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="1085" y="910" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1085" dy="0">queue-level preemption</tspan>
      <tspan x="1085" dy="36">with Kueue</tspan>
    </text>

    
    
    <rect x="65" y="995" width="720" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="85" y="1040" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="85" dy="0">avoid priority inflation where</tspan>
      <tspan x="85" dy="36">everything is critical</tspan>
    </text>

    
    <rect x="815" y="995" width="720" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="835" y="1040" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="835" dy="0"><tspan font-family="monospace">ResourceQuota</tspan> scopes on</tspan>
      <tspan x="835" dy="36"><tspan font-family="monospace">PriorityClass</tspan></tspan>
    </text>
  </g>
</svg>