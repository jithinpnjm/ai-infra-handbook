<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Anatomy of a logrotate file for Slurm logs</title>
  <desc>Infographic explaining the anatomy of a logrotate file for Slurm logs, callouts, rename chain, and key commands</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Anatomy of a logrotate file for Slurm logs</text>

  
  <g id="config-card">
    <rect x="40" y="110" width="630" height="820" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <path d="M 40 122 A 12 12 0 0 1 52 110 L 658 110 A 12 12 0 0 1 670 122 L 670 168 L 40 168 Z" fill="#e8f1ea" />
    <line x1="40" y1="168" x2="670" y2="168" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(60, 124)">
      <path d="M 4 2 L 20 2 L 28 10 L 28 32 L 4 32 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
      <path d="M 20 2 L 20 10 L 28 10" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    </g>
    <text x="105" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">/etc/logrotate.d/slurm</text>

    
    
    <text x="70" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">/var/log/slurm/*.log {</text>

    
    <text x="110" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">daily</text>

    
    <text x="110" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">rotate 14</text>

    
    <text x="110" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">compress</text>

    
    <text x="110" y="435" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">delaycompress</text>

    
    <text x="110" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">missingok</text>

    
    <text x="110" y="545" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">notifempty</text>

    
    <text x="110" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">create 0640 slurm slurm</text>

    
    <text x="110" y="655" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">sharedscripts</text>

    
    <rect x="60" y="682" width="590" height="42" rx="6" fill="#fff5eb" stroke="#db8129" stroke-width="1.5" />
    <text x="110" y="711" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="bold" fill="#db8129">postrotate</text>

    
    <text x="110" y="760" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="110" dy="0">systemctl kill -s HUP --kill-whom=main</tspan>
      <tspan x="110" dy="34">slurmctld 2>/dev/null || true</tspan>
    </text>

    
    <text x="110" y="845" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">endscript</text>

    
    <text x="70" y="895" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">}</text>
  </g>

  
  
  <g id="callout-1">
    <rect x="700" y="180" width="480" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="732" cy="215" r="18" fill="#207448" />
    <text x="732" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="764" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">which files this block applies to</text>
  </g>
  <line x1="670" y1="215" x2="698" y2="215" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <g id="callout-2">
    <rect x="700" y="265" width="480" height="80" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="732" cy="305" r="18" fill="#207448" />
    <text x="732" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="764" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="764" dy="0">schedule (also weekly,</tspan>
      <tspan x="764" dy="32">monthly, size 500M, maxsize)</tspan>
    </text>
  </g>
  <path d="M 670 275 L 685 275 L 685 305 L 698 305" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <g id="callout-3">
    <rect x="700" y="360" width="480" height="65" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="732" cy="392" r="18" fill="#207448" />
    <text x="732" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="764" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">keep 14 old copies</text>
  </g>
  <path d="M 670 330 L 685 330 L 685 392 L 698 392" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <g id="callout-4">
    <rect x="700" y="440" width="480" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="732" cy="485" r="18" fill="#207448" />
    <text x="732" y="493" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="764" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="764" dy="0">gzip, but leave the newest</tspan>
      <tspan x="764" dy="32">rotated file uncompressed to</tspan>
      <tspan x="764" dy="32">give programs time to close it</tspan>
    </text>
  </g>
  
  <path d="M 670 385 L 682 385 L 682 435 L 670 435 M 682 410 L 690 410 L 690 500 L 698 500" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <g id="callout-5">
    <rect x="700" y="590" width="480" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="732" cy="632" r="18" fill="#207448" />
    <text x="732" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="764" y="626" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="764" dy="0">the fresh empty file gets this</tspan>
      <tspan x="764" dy="32">mode, owner and group</tspan>
    </text>
  </g>
  <path d="M 670 600 L 685 600 L 685 632 L 698 632" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

  
  <g id="callout-6">
    <rect x="700" y="690" width="480" height="135" rx="10" fill="#fff5eb" stroke="#db8129" stroke-width="2.5" />
    <circle cx="732" cy="735" r="18" fill="#db8129" />
    <text x="732" y="743" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="764" y="730" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="764" dy="0">tell the daemon to reopen its</tspan>
      <tspan x="764" dy="32">log, so it stops writing to</tspan>
      <tspan x="764" dy="32">the renamed file</tspan>
    </text>
  </g>
  <path d="M 670 710 L 685 710 L 685 750 L 698 750" fill="none" stroke="#db8129" stroke-width="2.5" marker-end="url(#arrow-orange)" />

  
  <g id="side-strip">
    <rect x="1210" y="110" width="350" height="820" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(1357, 130)">
      
      <ellipse cx="28" cy="12" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 2 12 L 2 28 A 26 9 0 0 0 54 28 L 54 12" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 2 28 L 2 44 A 26 9 0 0 0 54 44 L 54 28" fill="none" stroke="#207448" stroke-width="4" />
    </g>

    
    <rect x="1230" y="215" width="310" height="695" rx="8" fill="#ffffff" stroke="#b2cfbb" stroke-width="1.5" />

    <text x="1245" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1245" dy="0">auth.log becomes</tspan>
      <tspan x="1245" dy="34">auth.log.1,</tspan>
      <tspan x="1245" dy="68">.1 becomes .2.gz,</tspan>
      <tspan x="1245" dy="68">.2.gz becomes</tspan>
      <tspan x="1245" dy="34">.3.gz,</tspan>
      <tspan x="1245" dy="68">the oldest is</tspan>
      <tspan x="1245" dy="34">deleted,</tspan>
      <tspan x="1245" dy="68">a new empty</tspan>
      <tspan x="1245" dy="34">auth.log is created</tspan>
    </text>
  </g>

  
  <g id="bottom-strip">
    <rect x="40" y="960" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="60" y="980" width="510" height="90" rx="8" fill="#ffffff" stroke="#b2cfbb" stroke-width="1.5" />
    <g transform="translate(76, 996)">
      
      <polyline points="4,6 12,14 4,22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="115" y="1018" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="115" dy="0">sudo logrotate -d</tspan>
      <tspan x="115" dy="32">/etc/logrotate.d/slurm (dry run)</tspan>
    </text>

    
    <rect x="590" y="980" width="510" height="90" rx="8" fill="#ffffff" stroke="#b2cfbb" stroke-width="1.5" />
    <g transform="translate(606, 996)">
      <polyline points="4,6 12,14 4,22" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="22" x2="26" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="645" y="1018" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="645" dy="0">sudo logrotate -f</tspan>
      <tspan x="645" dy="32">/etc/logrotate.conf (force now)</tspan>
    </text>

    
    <rect x="1120" y="980" width="420" height="90" rx="8" fill="#ffffff" stroke="#b2cfbb" stroke-width="1.5" />
    <g transform="translate(1136, 996)">
      
      <circle cx="14" cy="14" r="10" fill="none" stroke="#207448" stroke-width="3" />
      <polyline points="14,8 14,14 19,17" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1175" y="1018" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="1175" dy="0">state in</tspan>
      <tspan x="1175" dy="32">/var/lib/logrotate/status</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="60" rx="10" fill="#207448" />
    <text x="800" y="1153" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">Check whether the daemon can reopen its log before choosing postrotate or copytruncate</text>
  </g>
</svg>