<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Cancellation and timeouts: what happens at the await</title>
  <desc>Visual infographic explaining task.cancel() sequence, error propagation, timeouts, and asyncio primitives.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Cancellation and timeouts: what happens at the await</text>

  
  <rect x="40" y="115" width="940" height="610" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <rect x="65" y="135" width="450" height="105" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="187" r="24" fill="#207448" />
  <text x="105" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(142, 160)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 14 36 C 14 36 28 36 28 20 C 28 10 24 6 18 6 C 12 6 8 10 8 20 C 8 36 22 36 22 36" />
    <path d="M 6 36 L 30 36" />
    <path d="M 14 42 C 14 44 16 46 18 46 C 20 46 22 44 22 42" />
  </g>
  <text x="205" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="205" dy="0">task.cancel()</tspan>
    <tspan x="205" dy="30">requested</tspan>
  </text>

  
  <line x1="290" y1="240" x2="290" y2="267" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="270" width="450" height="125" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="332" r="24" fill="#207448" />
  <text x="105" y="341" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(144, 308)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="18,4 6,26 18,26 14,46 28,20 18,20" />
  </g>
  <text x="205" y="312" fill="#303a36">
    <tspan x="205" dy="0" font-family="ui-monospace, monospace" font-size="24" font-weight="bold">asyncio.CancelledError</tspan>
    <tspan x="205" dy="30" font-family="system-ui, -apple-system, sans-serif" font-size="24">is raised at the task's</tspan>
    <tspan x="205" dy="30" font-family="system-ui, -apple-system, sans-serif" font-size="24">current await</tspan>
  </text>

  
  <line x1="290" y1="395" x2="290" y2="422" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="425" width="450" height="110" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  <circle cx="105" cy="480" r="24" fill="#207448" />
  <text x="105" y="489" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(142, 455)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 6 L 28 22 L 8 22 Z" />
    <path d="M 6 38 L 16 38" />
    <path d="M 22 38 L 32 38" />
    <path d="M 12 44 L 26 44" />
  </g>
  <text x="205" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="205" dy="0">cleanup in a</tspan>
    <tspan x="205" dy="30">finally block</tspan>
  </text>

  
  <line x1="290" y1="535" x2="290" y2="562" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />

  
  <line x1="515" y1="480" x2="552" y2="480" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <rect x="65" y="565" width="450" height="135" rx="8" fill="#fff9f4" stroke="#db8129" stroke-width="3" />
  <circle cx="105" cy="632" r="24" fill="#db8129" />
  <text x="105" y="641" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  
  <g transform="translate(142, 608)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="6,20 16,14 30,14 30,34 16,34 6,28" />
    <line x1="16" y1="34" x2="16" y2="44" />
    <path d="M 34 18 C 38 21 38 27 34 30" />
  </g>
  <text x="205" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="205" dy="0">say it again:</tspan>
    <tspan x="205" dy="30">re-raise CancelledError,</tspan>
    <tspan x="205" dy="30">never swallow it</tspan>
  </text>

  
  <rect x="555" y="135" width="405" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(575, 166)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 4 L 8 10 L 8 26 C 8 36 22 44 22 44 C 22 44 36 36 36 26 L 36 10 Z" />
    <path d="M 16 24 L 20 28 L 28 18" />
  </g>
  <text x="635" y="185" fill="#303a36">
    <tspan x="635" dy="0" font-family="ui-monospace, monospace" font-size="24" font-weight="bold">asyncio.shield()</tspan>
    <tspan x="635" dy="32" font-family="system-ui, -apple-system, sans-serif" font-size="24">protects critical sections</tspan>
  </text>

  
  <rect x="555" y="420" width="405" height="120" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(575, 455)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="24" r="18" />
    <line x1="9" y1="11" x2="35" y2="37" />
  </g>
  <text x="635" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="635" dy="0" font-weight="bold">swallowed with a bare</tspan>
    <tspan x="635" dy="30">except: cannot cancel</tspan>
    <tspan x="635" dy="30">or shut down</tspan>
  </text>

  
  <rect x="1010" y="115" width="550" height="610" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="1030" y="135" width="510" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1050, 160)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="18" />
    <polyline points="24,12 24,24 32,28" />
  </g>
  <text x="1115" y="172" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan x="1115" dy="0" font-weight="bold">await asyncio.wait_for(</tspan>
    <tspan x="1115" dy="30">  coro, timeout) or</tspan>
    <tspan x="1115" dy="30">async with</tspan>
    <tspan x="1115" dy="30">  asyncio.timeout(10): (3.11)</tspan>
  </text>

  
  <rect x="1030" y="325" width="510" height="220" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1050, 355)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="14" width="16" height="20" rx="2" />
    <line x1="16" y1="4" x2="16" y2="14" />
    <line x1="8" y1="34" x2="8" y2="44" />
    <line x1="24" y1="34" x2="24" y2="44" />
    <line x1="30" y1="12" x2="42" y2="24" />
    <line x1="42" y1="12" x2="30" y2="24" />
  </g>
  <text x="1115" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1115" dy="0" font-weight="bold">every network await</tspan>
    <tspan x="1115" dy="32">needs a timeout: without one</tspan>
    <tspan x="1115" dy="32">a half-open connection</tspan>
    <tspan x="1115" dy="32">waits forever and you get</tspan>
    <tspan x="1115" dy="32">a silent hang</tspan>
  </text>

  
  <rect x="1030" y="560" width="510" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <g transform="translate(1050, 605)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="18" r="8" />
    <circle cx="34" cy="18" r="8" />
    <path d="M 14 26 C 14 36 34 36 34 26" />
    <polyline points="30,32 34,36 38,32" />
  </g>
  <text x="1115" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1115" dy="0">timeouts and TaskGroup both</tspan>
    <tspan x="1115" dy="34">rely on cancellation</tspan>
  </text>

  
  <rect x="40" y="745" width="1520" height="240" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(75, 785)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="20" width="28" height="22" rx="3" />
    <path d="M 14 20 L 14 12 C 14 8 18 4 22 4 C 26 4 30 8 30 12 L 30 20" />
    <circle cx="22" cy="30" r="3" fill="#207448" />
    <line x1="42" y1="12" x2="52" y2="12" />
    <line x1="42" y1="24" x2="52" y2="24" />
    <line x1="42" y1="36" x2="52" y2="36" />
  </g>
  <text x="155" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="155" dy="0" font-weight="bold">asyncio Lock, Semaphore, Event, Condition, Queue</tspan>
    <tspan x="155" dy="36">are async versions of the thread primitives; not thread-safe across threads;</tspan>
    <tspan x="155" dy="36">bounded Queue: await q.put() waits while full;</tspan>
    <tspan x="155" dy="36">Semaphore(100) throttles active HTTP requests</tspan>
  </text>

  
  <rect x="40" y="1005" width="1520" height="75" rx="8" fill="#207448" />
  <text x="800" y="1053" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Cancellation is an exception delivered at an await</text>
</svg>