<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where template data comes from, and what the template module does</title>
  <desc>Infographic illustrating Ansible template data sources and the execution steps of the template module.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Where template data comes from,</tspan>
    <tspan x="800" dy="55">and what the template module does</tspan>
  </text>

  
  <g id="left-container">
    <rect x="50" y="150" width="660" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(80, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="10" rx="20" ry="7" />
      <path d="M 4 10 v 10 c 0 3.8 9 7 20 7 s 20 -3.2 20 -7 v -10" />
      <path d="M 4 20 v 10 c 0 3.8 9 7 20 7 s 20 -3.2 20 -7 v -10" />
    </g>
    <text x="145" y="206" font-family="sans-serif" font-size="32px" font-weight="bold" fill="#207448">data sources</text>

    
    <rect x="70" y="235" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(85, 244)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="36" height="36" rx="4" />
      <path d="M 8 12 l 6 6 l -6 6 M 18 24 h 10" />
    </g>
    <text x="135" y="271" font-family="monospace" font-size="24px" fill="#303a36">lookup(env, HOME)</text>

    
    <rect x="70" y="301" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(88, 309)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 2 h 18 l 8 8 v 24 h -26 z" />
      <path d="M 22 2 v 8 h 8" />
      <line x1="9" y1="18" x2="21" y2="18" />
      <line x1="9" y1="24" x2="17" y2="24" />
    </g>
    <text x="135" y="337" font-family="monospace" font-size="24px" fill="#303a36">lookup(file, x)</text>

    
    <rect x="70" y="367" width="620" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(85, 383)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="36" height="42" rx="4" />
      <path d="M 7 15 l 5 6 l -5 6 M 16 27 h 8" />
      <line x1="28" y1="8" x2="28" y2="34" stroke-dasharray="3 3" />
    </g>
    <text x="135" y="399" font-family="monospace" font-size="24px" fill="#303a36">lookup(pipe, cmd) <tspan font-family="sans-serif" x="135" dy="28">runs on the control node</tspan></text>

    
    <rect x="70" y="453" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(87, 462)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="14" r="10" />
      <line x1="22" y1="22" x2="31" y2="31" />
    </g>
    <text x="135" y="489" font-family="monospace" font-size="24px" fill="#303a36">query</text>

    
    <rect x="70" y="519" width="620" height="74" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(85, 536)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="32" height="22" rx="3" />
      <line x1="18" y1="24" x2="18" y2="34" />
      <line x1="6" y1="34" x2="30" y2="34" />
    </g>
    <text x="135" y="551" font-family="monospace" font-size="24px" fill="#303a36">hostvars[host]<tspan x="135" dy="28">[ansible_default_ipv4][address]</tspan></text>

    
    <rect x="70" y="605" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(87, 614)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="22" height="22" rx="2" />
      <line x1="11" y1="1" x2="11" y2="6" />
      <line x1="17" y1="1" x2="17" y2="6" />
      <line x1="23" y1="1" x2="23" y2="6" />
      <line x1="11" y1="28" x2="11" y2="33" />
      <line x1="17" y1="28" x2="17" y2="33" />
      <line x1="23" y1="28" x2="23" y2="33" />
      <line x1="1" y1="11" x2="6" y2="11" />
      <line x1="1" y1="17" x2="6" y2="17" />
      <line x1="1" y1="23" x2="6" y2="23" />
      <line x1="28" y1="11" x2="33" y2="11" />
      <line x1="28" y1="17" x2="33" y2="17" />
      <line x1="28" y1="23" x2="33" y2="23" />
    </g>
    <text x="135" y="641" font-family="monospace" font-size="24px" fill="#303a36">groups[gpu]</text>

    
    <rect x="70" y="671" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(85, 680)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="32" height="12" rx="2" />
      <rect x="2" y="20" width="32" height="12" rx="2" />
      <circle cx="8" cy="10" r="1.5" fill="#207448" />
      <circle cx="8" cy="26" r="1.5" fill="#207448" />
    </g>
    <text x="135" y="707" font-family="monospace" font-size="24px" fill="#303a36">inventory_hostname</text>

    
    <rect x="70" y="737" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(88, 745)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="26" height="30" rx="2" />
      <path d="M 9 6 v -3 h 12 v 3" />
      <line x1="7" y1="14" x2="23" y2="14" />
      <line x1="7" y1="20" x2="19" y2="20" />
      <line x1="7" y1="26" x2="21" y2="26" />
    </g>
    <text x="135" y="773" font-family="monospace" font-size="24px" fill="#303a36">ansible_facts</text>

    
    <rect x="70" y="803" width="620" height="54" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(85, 812)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="10" r="4" />
      <circle cx="29" cy="10" r="4" />
      <circle cx="18" cy="28" r="4" />
      <line x1="11" y1="10" x2="25" y2="10" />
      <line x1="9" y1="14" x2="15" y2="24" />
      <line x1="27" y1="14" x2="21" y2="24" />
    </g>
    <text x="135" y="839" font-family="monospace" font-size="24px" fill="#303a36">play_hosts</text>
  </g>

  
  <g id="right-container">
    <rect x="750" y="150" width="800" height="770" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(775, 172)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 h 36 v 28 h -36 z" />
      <path d="M 6 18 l 18 12 l 18 -12" />
    </g>
    <text x="835" y="200" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">
      <tspan font-family="monospace">ansible.builtin.template</tspan>: a careful courier
    </text>

    
    <rect x="775" y="248" width="750" height="82" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="815" cy="289" r="24" fill="#207448" />
    <text x="815" y="297" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(855, 267)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="28" height="38" rx="2" />
      <line x1="10" y1="12" x2="26" y2="12" />
      <line x1="10" y1="20" x2="22" y2="20" />
      <line x1="10" y1="28" x2="18" y2="28" />
      <path d="M 32 30 l 8 -8 l -4 -4 l -8 8 v 4 h 4 z" fill="#e8f1ea" />
    </g>
    <text x="915" y="297" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">fills in the form on the control node</text>

    
    <line x1="1150" y1="330" x2="1150" y2="363" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="775" y="365" width="750" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="815" cy="414" r="24" fill="#207448" />
    <text x="815" y="422" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(855, 390)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 2 l 16 6 v 14 c 0 12 -16 22 -16 22 s -16 -10 -16 -22 v -14 z" />
      <path d="M 14 22 l 6 6 l 10 -10" />
    </g>
    <text x="915" y="405" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="915" dy="0">checks the result if you asked it to</tspan>
      <tspan x="915" dy="32" font-family="monospace" font-size="24px" font-weight="normal">(validate: visudo -cf %s)</tspan>
    </text>

    
    <line x1="1150" y1="463" x2="1150" y2="496" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <rect x="775" y="498" width="750" height="90" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="815" cy="543" r="24" fill="#207448" />
    <text x="815" y="551" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(855, 521)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="30" height="26" rx="2" />
      <path d="M 32 16 l 10 0 l 6 8 v 8 h -16 z" />
      <circle cx="10" cy="34" r="4" />
      <circle cx="38" cy="34" r="4" />
    </g>
    <text x="915" y="537" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">
      <tspan x="915" dy="0">only then delivers the finished copy</tspan>
      <tspan x="915" dy="30">to the target</tspan>
    </text>

    
    <rect x="775" y="612" width="750" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <g transform="translate(790, 638)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="10" r="5" />
      <line x1="17" y1="10" x2="36" y2="10" />
      <circle cx="28" cy="24" r="5" />
      <line x1="4" y1="24" x2="23" y2="24" />
      <circle cx="16" cy="38" r="5" />
      <line x1="21" y1="38" x2="36" y2="38" />
    </g>
    <text x="845" y="650" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="845" dy="0" font-family="monospace">owner, group, mode, backup,</tspan>
      <tspan x="845" dy="32"><tspan font-family="monospace">variable_start_string</tspan> for different delimiters, <tspan font-family="monospace">validate</tspan></tspan>
    </text>

    
    <rect x="775" y="727" width="750" height="75" rx="8" fill="#fdf5ec" stroke="#db8129" stroke-width="3" />
    <g transform="translate(792, 742)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="16" width="30" height="24" rx="3" />
      <path d="M 12 16 v -8 a 9 9 0 0 1 18 0 v 8" />
      <circle cx="21" cy="28" r="3" fill="#db8129" />
    </g>
    <text x="845" y="773" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">ansible_managed</tspan> gives a do-not-edit header
    </text>
  </g>

  
  <g id="performance-strip">
    <rect x="50" y="945" width="1500" height="120" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <g transform="translate(72, 977)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <path d="M 28 14 v 14 l 10 6" />
      <line x1="4" y1="28" x2="10" y2="28" />
      <line x1="46" y1="28" x2="52" y2="28" />
      <line x1="28" y1="4" x2="28" y2="10" />
    </g>
    <text x="145" y="983" font-family="sans-serif" font-size="24px" fill="#303a36">
      <tspan x="145" dy="0">each <tspan font-family="monospace">lookup(pipe)</tspan> is a trip to the shop: cheap once, slow repeated for every host in a fleet of thousands;</tspan>
      <tspan x="145" dy="30">heavy Jinja inside loops over thousands of hosts is slow;</tspan>
      <tspan x="145" dy="30">precompute with <tspan font-family="monospace">set_fact</tspan> or filters</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1090" width="1500" height="65" rx="10" fill="#207448" />
    <text x="800" y="1133" text-anchor="middle" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">Render on the control node, validate, then deliver</text>
  </g>
</svg>