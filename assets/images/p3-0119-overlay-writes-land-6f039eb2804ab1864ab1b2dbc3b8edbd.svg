<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where does a write land: the image layer or a volume</title>
  <desc>A decision tree illustrating container write paths: volume bypass versus OverlayFS image layer copy-up, delete whiteouts, and operational consequences.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>

    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129" />
    </marker>

    
    <marker id="arrow-dark" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where does a write land: the image layer or a volume</text>

  
  
  <path d="M 800 160 L 800 195" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 340 265 L 255 265 L 255 390" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 800 335 L 800 350 L 1025 350 L 1025 365" fill="none" stroke="#303a36" stroke-width="3.5" marker-end="url(#arrow-dark)" />

  
  <path d="M 615 420 L 585 420 L 585 515" fill="none" stroke="#303a36" stroke-width="3.5" marker-end="url(#arrow-dark)" />

  
  <path d="M 1435 420 L 1465 420 L 1465 515" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <path d="M 1025 480 L 1025 650 L 750 650 L 750 670" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <path d="M 1302 850 L 1302 870" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1302 925 L 1302 945" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <path d="M 1302 1015 L 1302 1030" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  
  <rect x="270" y="235" width="60" height="34" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="300" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Yes</text>

  
  <rect x="885" y="332" width="55" height="34" rx="6" fill="#ffffff" stroke="#303a36" stroke-width="1.5" />
  <text x="912" y="357" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">No</text>

  
  <rect x="555" y="445" width="55" height="34" rx="6" fill="#ffffff" stroke="#303a36" stroke-width="1.5" />
  <text x="582" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">No</text>

  
  <rect x="1435" y="445" width="60" height="34" rx="6" fill="#fff8f0" stroke="#db8129" stroke-width="1.5" />
  <text x="1465" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">Yes</text>

  
  <g id="node-start">
    <rect x="460" y="85" width="680" height="75" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(485, 95)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="52" height="48" rx="6" />
      <line x1="0" y1="14" x2="52" y2="14" />
      <circle cx="8" cy="7" r="2.5" fill="#207448" />
      <circle cx="16" cy="7" r="2.5" fill="#207448" />
      <path d="M 10 28 L 18 34 L 10 40" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="22" y1="40" x2="34" y2="40" stroke-linecap="round" />
    </g>
    <text x="560" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">A container process writes a file</text>
  </g>

  
  <g id="node-diamond-volume">
    <polygon points="800,195 1260,265 800,335 340,265" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="800" y="248" font-size="28" font-weight="bold">Is the path on a volume</tspan>
      <tspan x="800" y="280" font-size="24">(bind mount, </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="24">emptyDir</tspan>
      <tspan font-size="24">, </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="24">hostPath</tspan>
      <tspan font-size="24"> or </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="24">PVC</tspan>
      <tspan font-size="24">)?</tspan>
    </text>
  </g>

  
  
  <g id="node-volumes-bypass">
    <rect x="40" y="390" width="430" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(65, 412)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 0 12 C 0 5, 44 5, 44 12 C 44 19, 0 19, 0 12 Z" />
      <path d="M 0 12 L 0 38 C 0 45, 44 45, 44 38 L 44 12" />
      <path d="M 0 25 C 0 32, 44 32, 44 25" />
      
      <path d="M 54 8 L 54 44" stroke="#207448" stroke-width="3" />
      <path d="M 48 38 L 54 44 L 60 38" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="145" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="145" dy="0">Volumes bypass</tspan>
      <tspan x="145" dy="34">overlay completely:</tspan>
    </text>
    <text x="65" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">no copy-up, data stays</tspan>
      <tspan x="65" dy="32">outside the image storage</tspan>
    </text>
  </g>

  
  <g id="node-side-list">
    <rect x="40" y="630" width="430" height="455" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="6 4" />
    <rect x="40" y="630" width="430" height="60" rx="12" fill="#e8f1ea" />
    
    <g transform="translate(60, 638)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 2 10 L 16 10 L 22 16 L 46 16 L 46 38 L 2 38 Z" />
      <path d="M 14 26 L 34 26" />
      <path d="M 24 20 L 24 32" />
    </g>
    
    <text x="120" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Put in volumes:</text>
    <text x="65" y="730" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">mutable and large data,</tspan>
      <tspan x="65" dy="44">package caches,</tspan>
      <tspan x="65" dy="44">model weights and datasets</tspan>
      <tspan x="65" dy="55" fill="#4a5852">(mount them, do not copy</tspan>
      <tspan x="65" dy="34" fill="#4a5852">them into images)</tspan>
    </text>
  </g>

  
  <g id="node-diamond-lower">
    <polygon points="1025,360 1435,420 1025,480 615,420" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="1025" y="412" font-size="28" font-weight="bold">Does the file already exist</tspan>
      <tspan x="1025" y="448" font-size="28" font-weight="bold">in a lower image layer?</tspan>
    </text>
  </g>

  
  
  <g id="node-new-file">
    <rect x="495" y="515" width="510" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(520, 542)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 4 2 L 28 2 L 42 16 L 42 50 L 4 50 Z" />
      <path d="M 28 2 L 28 16 L 42 16" />
      <line x1="16" y1="32" x2="30" y2="32" stroke-linecap="round" />
      <line x1="23" y1="25" x2="23" y2="39" stroke-linecap="round" />
    </g>
    
    <text x="590" y="556" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="590" dy="0" font-size="28" font-weight="bold">New file lands in </tspan>
      <tspan font-family="ui-monospace, monospace" font-size="28" font-weight="bold">upperdir</tspan>
      <tspan x="590" dy="36" font-size="24" fill="#606c66">(the read-write layer)</tspan>
    </text>
  </g>

  
  <g id="node-delete-whiteout">
    <rect x="495" y="670" width="510" height="415" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(520, 695)" stroke="#207448" stroke-width="3.5" fill="none">
      <path d="M 6 12 L 42 12" />
      <path d="M 12 12 L 14 44 L 34 44 L 36 12" />
      <path d="M 18 12 L 18 6 L 30 6 L 30 12" />
      
      <circle cx="24" cy="28" r="9" stroke="#207448" stroke-width="2.5" />
      <line x1="18" y1="22" x2="30" y2="34" stroke="#207448" stroke-width="2.5" />
    </g>
    
    <text x="590" y="730" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">
      rm <tspan font-family="system-ui, -apple-system, sans-serif">of a lower file creates</tspan>
    </text>
    <text x="520" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="520" dy="0">a 0/0 character device whiteout in</tspan>
      <tspan x="520" dy="34"><tspan font-family="ui-monospace, monospace">upperdir</tspan> (or an opaque-directory</tspan>
      <tspan x="520" dy="34">xattr for removed directories):</tspan>
      <tspan x="520" dy="34">the lower data stays on disk,</tspan>
      <tspan x="520" dy="34">so deleting in a later <tspan font-family="ui-monospace, monospace">Dockerfile</tspan></tspan>
      <tspan x="520" dy="34">layer does not shrink the image</tspan>
      <tspan x="520" dy="34">and a baked-in secret can still</tspan>
      <tspan x="520" dy="34">be extracted</tspan>
    </text>
  </g>

  
  
  <g id="node-copy-up">
    <rect x="1045" y="515" width="515" height="220" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(1070, 532)" stroke="#db8129" stroke-width="3.5" fill="none">
      <rect x="2" y="14" width="28" height="34" rx="4" />
      <rect x="16" y="2" width="28" height="34" rx="4" stroke-dasharray="4 2" />
      <path d="M 12 30 L 28 14" stroke="#db8129" stroke-width="3" />
      <path d="M 20 14 L 28 14 L 28 22" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="1140" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#db8129">Copy-up:</text>
    <text x="1070" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1070" dy="0">the whole file is copied into <tspan font-family="ui-monospace, monospace">upperdir</tspan></tspan>
      <tspan x="1070" dy="32">before the write lands (metadata-only</tspan>
      <tspan x="1070" dy="32">changes copy only metadata on</tspan>
      <tspan x="1070" dy="32">modern kernels with <tspan font-family="ui-monospace, monospace">metacopy</tspan>)</tspan>
    </text>
  </g>

  
  <g id="node-chain-1">
    <rect x="1045" y="755" width="515" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1065, 775)" stroke="#207448" stroke-width="2.5" fill="none">
      <rect x="2" y="2" width="30" height="42" rx="4" />
      <path d="M 22 2 L 32 12 L 32 44" />
      <path d="M 38 18 L 46 14" />
      <path d="M 38 28 L 48 28" />
      <path d="M 38 38 L 46 42" />
    </g>
    <text x="1125" y="784" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0">a job appending to a</tspan>
      <tspan x="1125" dy="28">multi-GB file baked into an image</tspan>
      <tspan x="1125" dy="28">triggers a huge copy</tspan>
    </text>
  </g>

  
  <g id="node-chain-2">
    <rect x="1045" y="870" width="515" height="55" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1065, 878)" stroke="#207448" stroke-width="2.5" fill="none">
      <path d="M 4 20 L 36 20" />
      <path d="M 20 6 L 20 34" />
      <circle cx="10" cy="12" r="3" />
      <circle cx="30" cy="28" r="3" />
    </g>
    <text x="1125" y="906" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">doubles disk use</text>
  </g>

  
  <g id="node-chain-3">
    <rect x="1045" y="945" width="515" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1065, 955)" stroke="#207448" stroke-width="2.5" fill="none">
      <rect x="2" y="4" width="40" height="14" rx="3" />
      <rect x="2" y="24" width="40" height="14" rx="3" />
      <line x1="8" y1="11" x2="14" y2="11" />
      <line x1="8" y1="31" x2="14" y2="31" />
      <circle cx="34" cy="11" r="2" fill="#207448" />
      <circle cx="34" cy="31" r="2" fill="#207448" />
    </g>
    <text x="1125" y="974" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0">fills <tspan font-family="ui-monospace, monospace">/var/lib/containerd</tspan></tspan>
      <tspan x="1125" dy="28">or <tspan font-family="ui-monospace, monospace">/var/lib/docker</tspan></tspan>
    </text>
  </g>

  
  <g id="node-chain-4">
    <rect x="1045" y="1030" width="515" height="55" rx="10" fill="#fbebe8" stroke="#c0392b" stroke-width="2" />
    
    <g transform="translate(1065, 1038)" stroke="#c0392b" stroke-width="2.5" fill="none">
      <path d="M 20 4 L 36 10 L 36 24 C 36 34 20 40 20 40 C 20 40 4 34 4 24 L 4 10 Z" />
      <line x1="20" y1="15" x2="20" y2="24" stroke-linecap="round" />
      <circle cx="20" cy="29" r="1.5" fill="#c0392b" />
    </g>
    <text x="1125" y="1066" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#96281b">
      evictions and <tspan font-family="ui-monospace, monospace">NodeNotReady</tspan>
    </text>
  </g>

  
  <g id="node-bottom-bar">
    <rect x="40" y="1120" width="1520" height="55" rx="10" fill="#207448" />
    <text x="800" y="1156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Before you size a node's disk, check whether your writes land in a volume or in the image layer</text>
  </g>
</svg>