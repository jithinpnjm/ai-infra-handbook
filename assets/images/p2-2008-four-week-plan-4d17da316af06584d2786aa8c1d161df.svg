<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 890" width="1600" height="890">
  <title>A four-week practice routine</title>
  <desc>A horizontal timeline infographic detailing a four-week technical interview practice routine with weekly milestones, time commitments, and focus areas.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <clipPath id="card-header-clip">
      <rect width="340" height="115" rx="14"/>
    </clipPath>
  </defs>

  
  <rect width="1600" height="890" fill="#f5f8f5"/>

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">A four-week practice routine</text>

  
  <g transform="translate(60, 105)">
    
    <rect x="0" y="0" width="340" height="420" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <path d="M 0 14 Q 0 0 14 0 L 326 0 Q 340 0 340 14 L 340 115 L 0 115 Z" fill="#207448"/>
    <text x="22" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d2ebd9">Week 1</text>
    <text x="22" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Language basics</text>
    
    
    <rect x="272" y="24" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 288 40 L 282 48 L 288 56 M 304 40 L 310 48 L 304 56" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    
    <rect x="16" y="130" width="308" height="175" rx="10" fill="#f7faf8" stroke="#e0eae2" stroke-width="1.5"/>
    <text x="32" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="32" dy="24">Dicts, counters,</tspan>
      <tspan x="32" dy="36">sorting, strings,</tspan>
      <tspan x="32" dy="36">the harness</tspan>
    </text>

    
    <rect x="16" y="320" width="308" height="82" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="48" cy="361" r="16" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 48 351 L 48 361 L 56 361" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="76" dy="0">Time: 5 sessions</tspan>
      <tspan x="76" dy="28">of 1 hour</tspan>
    </text>
  </g>

  
  <line x1="400" y1="162" x2="436" y2="162" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(440, 105)">
    
    <rect x="0" y="0" width="340" height="420" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <path d="M 0 14 Q 0 0 14 0 L 326 0 Q 340 0 340 14 L 340 115 L 0 115 Z" fill="#207448"/>
    <text x="22" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d2ebd9">Week 2</text>
    <text x="22" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Core patterns</text>
    
    
    <rect x="272" y="24" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 282 48 L 310 48 M 289 41 L 282 48 L 289 55 M 303 41 L 310 48 L 303 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    
    <rect x="16" y="130" width="308" height="175" rx="10" fill="#f7faf8" stroke="#e0eae2" stroke-width="1.5"/>
    <text x="32" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="32" dy="24">Hash maps,</tspan>
      <tspan x="32" dy="36">two pointers,</tspan>
      <tspan x="32" dy="36">sliding window, stacks</tspan>
    </text>

    
    <rect x="16" y="320" width="308" height="82" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="48" cy="361" r="16" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 48 351 L 48 361 L 56 361" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="76" dy="0">Time: 4 sessions</tspan>
      <tspan x="76" dy="28">of 75 minutes</tspan>
    </text>
  </g>

  
  <line x1="780" y1="162" x2="816" y2="162" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(820, 105)">
    
    <rect x="0" y="0" width="340" height="420" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <path d="M 0 14 Q 0 0 14 0 L 326 0 Q 340 0 340 14 L 340 115 L 0 115 Z" fill="#207448"/>
    <text x="22" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d2ebd9">Week 3</text>
    <text x="22" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Advanced patterns</text>
    
    
    <rect x="272" y="24" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="296" cy="37" r="4" fill="#ffffff"/>
    <circle cx="284" cy="57" r="4" fill="#ffffff"/>
    <circle cx="308" cy="57" r="4" fill="#ffffff"/>
    <path d="M 296 41 L 284 53 M 296 41 L 308 53" stroke="#ffffff" stroke-width="2.5"/>

    
    <rect x="16" y="130" width="308" height="175" rx="10" fill="#f7faf8" stroke="#e0eae2" stroke-width="1.5"/>
    <text x="32" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="32" dy="24">Heaps, intervals,</tspan>
      <tspan x="32" dy="36">binary search,</tspan>
      <tspan x="32" dy="36">graphs</tspan>
    </text>

    
    <rect x="16" y="320" width="308" height="82" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="48" cy="361" r="16" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 48 351 L 48 361 L 56 361" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="76" dy="0">Time: 4 sessions</tspan>
      <tspan x="76" dy="28">of 75 minutes</tspan>
    </text>
  </g>

  
  <line x1="1160" y1="162" x2="1196" y2="162" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g transform="translate(1200, 105)">
    
    <rect x="0" y="0" width="340" height="420" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="5"/>
    
    
    <path d="M 0 14 Q 0 0 14 0 L 326 0 Q 340 0 340 14 L 340 115 L 0 115 Z" fill="#207448"/>
    <text x="22" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#d2ebd9">Week 4</text>
    <text x="22" y="86" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Full mock rounds</text>
    
    
    <rect x="272" y="24" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="296" cy="50" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 296 42 L 296 50 L 302 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 293 32 L 299 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    
    <rect x="16" y="130" width="308" height="175" rx="10" fill="#f7faf8" stroke="#e0eae2" stroke-width="1.5"/>
    <text x="32" y="152" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="32" dy="24">Two problems in</tspan>
      <tspan x="32" dy="36">60 minutes,</tspan>
      <tspan x="32" dy="36">once recorded</tspan>
    </text>

    
    <rect x="16" y="320" width="308" height="82" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <circle cx="48" cy="361" r="16" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 48 351 L 48 361 L 56 361" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="76" dy="0">Time: 3 mocks</tspan>
      <tspan x="76" dy="28">of 90 minutes</tspan>
    </text>
  </g>

  
  
  <line x1="230" y1="525" x2="230" y2="550" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(90, 550)">
    <rect x="0" y="0" width="280" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="28" cy="26" r="15" fill="#207448"/>
    <path d="M 21 26 L 26 31 L 35 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">End-of-week test</text>
  </g>

  
  <line x1="610" y1="525" x2="610" y2="550" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(470, 550)">
    <rect x="0" y="0" width="280" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="28" cy="26" r="15" fill="#207448"/>
    <path d="M 21 26 L 26 31 L 35 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">End-of-week test</text>
  </g>

  
  <line x1="990" y1="525" x2="990" y2="550" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(850, 550)">
    <rect x="0" y="0" width="280" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="28" cy="26" r="15" fill="#207448"/>
    <path d="M 21 26 L 26 31 L 35 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">End-of-week test</text>
  </g>

  
  <line x1="1370" y1="525" x2="1370" y2="550" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(1230, 550)">
    <rect x="0" y="0" width="280" height="52" rx="26" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="28" cy="26" r="15" fill="#207448"/>
    <path d="M 21 26 L 26 31 L 35 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">End-of-week test</text>
  </g>

  
  <g transform="translate(60, 630)">
    <rect x="0" y="0" width="1480" height="86" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(40, 21)" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round">
      <ellipse cx="22" cy="25" rx="14" ry="16"/>
      <path d="M 22 9 L 22 41 M 8 20 L 36 20 M 8 30 L 36 30 M 12 12 L 4 6 M 32 12 L 40 6 M 10 37 L 4 43 M 34 37 L 40 43"/>
    </g>
    <text x="110" y="52" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Keep a bug log: harness-found bugs are what to practise on</text>
  </g>

  
  <g transform="translate(60, 742)">
    <rect x="0" y="0" width="1480" height="78" rx="16" fill="#207448"/>
    <text x="740" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Practise the process under time pressure.</text>
  </g>
</svg>