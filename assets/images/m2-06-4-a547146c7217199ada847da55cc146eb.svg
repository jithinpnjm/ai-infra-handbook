<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A diagnostic flow</title>
  <desc>A decision tree and diagnostic workflow for troubleshooting TCP connection, latency, throughput, and reset symptoms.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
    
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14261c" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g transform="translate(60, 48)">
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A diagnostic flow</text>
  </g>

  
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <path d="M 330 148 L 410 148" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 545 110 L 545 78 L 760 78" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 545 186 L 545 218 L 760 218" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 680 148 L 710 148 L 710 328 L 305 328 L 305 400" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 305 500 L 305 600" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 440 432 L 670 432" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 440 468 L 670 468" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 520 622 L 760 622" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <path d="M 520 642 L 620 642 L 620 770 L 760 770" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 390 700 L 390 918 L 760 918" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

    
    <path d="M 305 700 L 305 1066 L 760 1066" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  </g>

  
  
  <g transform="translate(562, 54)">
    <rect x="0" y="0" width="108" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="54" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">refused</text>
  </g>

  
  <g transform="translate(562, 194)">
    <rect x="0" y="0" width="112" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="56" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">timeout</text>
  </g>

  
  <g transform="translate(480, 310)">
    <rect x="0" y="0" width="126" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="63" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">connects</text>
  </g>

  
  <g transform="translate(315, 532)">
    <rect x="0" y="0" width="64" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="32" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>
  </g>

  
  <g transform="translate(460, 396)">
    <rect x="0" y="0" width="186" height="48" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="93" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">no, but</text>
    <text x="93" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">latency spikes</text>
  </g>

  
  <g transform="translate(500, 474)">
    <rect x="0" y="0" width="96" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="48" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">resets</text>
  </g>

  
  <g transform="translate(508, 576)">
    <rect x="0" y="0" width="242" height="36" rx="6" fill="#f5f8f5" stroke="#db8129" stroke-width="2" />
    <text x="121" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#db8129">cwnd_limited / retrans</text>
  </g>

  
  <g transform="translate(630, 712)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="60" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">rwnd_limited</text>
    <text x="60" y="46" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">/ zero window</text>
  </g>

  
  <g transform="translate(430, 874)">
    <rect x="0" y="0" width="190" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="95" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">sndbuf_limited</text>
  </g>

  
  <g transform="translate(430, 1022)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="80" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">app_limited</text>
  </g>

  

  
  <g id="node-Q" transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="270" height="76" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 10)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" stroke-width="3" />
      <path d="M 12 28 L 20 28 L 24 16 L 32 40 L 36 24 L 40 28 L 44 28" />
    </g>
    <text x="88" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">TCP symptom</text>
  </g>

  
  <g id="node-A" transform="translate(410, 110)" filter="url(#shadow)">
    <rect width="270" height="76" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 10)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="28" r="10" />
      <circle cx="38" cy="28" r="10" />
      <path d="M 28 28 L 28 28" stroke-width="6" />
      <path d="M 18 18 C 24 12, 32 12, 38 18" stroke-width="3" stroke-dasharray="2 3" />
    </g>
    <text x="86" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Can connect?</text>
  </g>

  
  <g id="node-A1" transform="translate(760, 24)" filter="url(#shadow)">
    <rect width="780" height="108" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 26)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 42, 28 50, 28 50 C 28 50, 8 42, 8 28 L 8 14 Z" />
      <path d="M 18 28 L 38 28" />
    </g>
    <text x="92" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">No listener / reject rule:</tspan>
      <tspan font-family="ui-monospace, monospace"> ss -tlnp on server;</tspan>
    </text>
    <text x="92" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>check bind address </tspan>
      <tspan font-family="ui-monospace, monospace">(127.0.0.1 vs 0.0.0.0)</tspan>
    </text>
  </g>

  
  <g id="node-A2" transform="translate(760, 164)" filter="url(#shadow)">
    <rect width="780" height="108" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 26)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="4" />
      <path d="M 8 22 L 48 22 M 8 34 L 48 34 M 22 10 L 22 22 M 34 22 L 34 34 M 18 34 L 18 46" />
    </g>
    <text x="92" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">SYN dropped: </tspan>
      <tspan font-family="ui-monospace, monospace">tcpdump</tspan>
      <tspan> both ends; routing,</tspan>
    </text>
    <text x="92" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>SG/NSG/firewall, </tspan>
      <tspan font-family="ui-monospace, monospace">rp_filter</tspan>
      <tspan>, listen queue (</tspan>
      <tspan font-family="ui-monospace, monospace">nstat</tspan>
      <tspan>)</tspan>
    </text>
  </g>

  
  <g id="node-B" transform="translate(170, 400)" filter="url(#shadow)">
    <rect width="270" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 40 A 20 20 0 1 1 44 40" />
      <path d="M 28 32 L 36 20" />
      <circle cx="28" cy="32" r="3" fill="#207448" />
    </g>
    <text x="86" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Throughput</text>
    <text x="86" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">low?</text>
  </g>

  
  <g id="node-C" transform="translate(670, 312)" filter="url(#shadow)">
    <rect width="870" height="116" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 30)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 28 16 L 28 28 L 36 34" />
      <path d="M 44 8 L 48 4" />
    </g>
    <text x="96" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>Nagle+delayed ACK, RTO events, accept queue,</tspan>
    </text>
    <text x="96" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>GC pauses, conntrack, bufferbloat (</tspan>
      <tspan font-family="ui-monospace, monospace">tcp_notsent_lowat</tspan>
      <tspan>)</tspan>
    </text>
  </g>

  
  <g id="node-D" transform="translate(670, 444)" filter="url(#shadow)">
    <rect width="870" height="116" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(24, 30)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" />
    </g>
    <text x="96" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>Idle timeouts on LB/NAT/firewall; app crash; keepalives;</tspan>
    </text>
    <text x="96" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>RST source IP/TTL in </tspan>
      <tspan font-family="ui-monospace, monospace">tcpdump</tspan>
    </text>
  </g>

  
  <g id="node-B1" transform="translate(90, 600)" filter="url(#shadow)">
    <rect width="430" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="36" rx="4" />
      <path d="M 14 22 L 22 28 L 14 34" />
      <path d="M 26 34 L 38 34" />
    </g>
    <text x="84" y="48" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#303a36">ss -ti:</text>
    <text x="84" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">which limit?</text>
  </g>

  
  <g id="node-B2" transform="translate(760, 580)" filter="url(#shadow)">
    <rect width="780" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 28)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="16" cy="28" r="6" />
      <circle cx="40" cy="28" r="6" />
      <path d="M 22 28 L 34 28" stroke-dasharray="3 3" />
      <path d="M 24 16 L 32 24 M 32 16 L 24 24" stroke="#db8129" stroke-width="3" />
    </g>
    <text x="92" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">Loss/congestion: </tspan>
      <tspan>path counters, drops at NIC/switch,</tspan>
    </text>
    <text x="92" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>CC algorithm, ECN</tspan>
    </text>
  </g>

  
  <g id="node-B3" transform="translate(760, 724)" filter="url(#shadow)">
    <rect width="780" height="112" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 28)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="14" width="40" height="28" rx="4" />
      <path d="M 16 14 L 16 42 M 24 14 L 24 42 M 32 14 L 32 42" stroke-width="2" />
      <path d="M 40 28 L 46 28" stroke-width="4" />
    </g>
    <text x="92" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold">Receiver app slow or buffer too small: </tspan>
    </text>
    <text x="92" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>app profile, </tspan>
      <tspan font-family="ui-monospace, monospace">rmem</tspan>
    </text>
  </g>

  
  <g id="node-B4" transform="translate(760, 868)" filter="url(#shadow)">
    <rect width="780" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="14" width="40" height="28" rx="4" />
      <path d="M 28 22 L 28 34 M 22 28 L 34 28" stroke-width="3" />
    </g>
    <text x="92" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>Increase </tspan>
      <tspan font-family="ui-monospace, monospace">wmem</tspan>
      <tspan> or fix app write pattern</tspan>
    </text>
  </g>

  
  <g id="node-B5" transform="translate(760, 1016)" filter="url(#shadow)">
    <rect width="780" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(22, 22)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="40" height="36" rx="4" />
      <path d="M 8 20 L 48 20" />
      <circle cx="16" cy="15" r="2" fill="#207448" />
      <circle cx="22" cy="15" r="2" fill="#207448" />
      <path d="M 20 30 L 36 30" stroke-width="3" />
    </g>
    <text x="92" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan>Application not sending enough: look at the app</tspan>
    </text>
  </g>
</svg>