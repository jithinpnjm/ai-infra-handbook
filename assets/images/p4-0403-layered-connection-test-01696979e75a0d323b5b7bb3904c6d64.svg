<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <title>Test a connection from the bottom up, through a bastion if needed</title>
  <desc>Visual infographic explaining troubleshooting Ansible network connectivity layer-by-layer and configuring a bastion jump host.</desc>

  <defs>
    <marker id="arrow-up" viewBox="0 0 12 12" refX="6" refY="2" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 10 L 6 2 L 11 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 1 L 10 6 L 2 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1100" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Test a connection from the bottom up,</text>
  <text x="50" y="115" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">through a bastion if needed</text>

  
  <rect x="50" y="140" width="1500" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 155)">
    <circle cx="26" cy="26" r="22" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 20 18 C 20 12, 32 12, 32 20 C 32 25, 26 27, 26 33" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="40" r="2.5" fill="#207448" />
  </g>
  <text x="135" y="174" font-family="sans-serif" font-size="24" fill="#303a36">which user is Ansible logging in as and which key does it offer?</text>
  <text x="135" y="206" font-family="sans-serif" font-size="24" fill="#303a36">does the host name resolve and does the port answer?</text>

  
  <text x="120" y="270" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">each removes one suspect</text>

  
  <line x1="80" y1="775" x2="80" y2="305" stroke="#207448" stroke-width="6" marker-end="url(#arrow-up)" />

  
  <rect x="120" y="295" width="640" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="165" cy="345" r="24" fill="#207448" />
  <text x="165" y="353" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">4</text>
  
  <g transform="translate(205, 317)">
    <rect x="6" y="4" width="40" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="14" y1="16" x2="38" y2="16" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="26" x2="38" y2="26" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="36" x2="28" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="275" y="354" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">then the playbook</text>

  
  <rect x="120" y="415" width="640" height="100" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="165" cy="465" r="24" fill="#207448" />
  <text x="165" y="473" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">3</text>
  
  <g transform="translate(205, 437)">
    <rect x="4" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 14 20 L 22 28 L 14 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="26" y1="36" x2="38" y2="36" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="275" y="452" font-family="monospace" font-size="24" fill="#303a36">ansible ping</text>
  <text x="275" y="484" font-family="sans-serif" font-size="24" fill="#303a36">with the same inventory</text>

  
  <rect x="120" y="535" width="640" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="165" cy="590" r="24" fill="#207448" />
  <text x="165" y="598" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">2</text>
  
  <g transform="translate(205, 562)">
    <circle cx="20" cy="20" r="12" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="29" y1="29" x2="46" y2="46" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="39" y1="39" x2="45" y2="33" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="275" y="577" font-family="sans-serif" font-size="24" fill="#303a36">plain ssh login works with</text>
  <text x="275" y="611" font-family="sans-serif" font-size="24" fill="#303a36">the same user and key</text>

  
  <rect x="120" y="665" width="640" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="165" cy="727" r="24" fill="#207448" />
  <text x="165" y="735" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">1</text>
  
  <g transform="translate(205, 699)">
    <circle cx="26" cy="16" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="26" y1="26" x2="26" y2="40" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="44" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="40" cy="44" r="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="12" y1="40" x2="40" y2="40" stroke="#207448" stroke-width="4" />
  </g>
  <text x="275" y="715" font-family="sans-serif" font-size="24" fill="#303a36">name resolves and the port answers</text>
  <text x="275" y="751" font-family="monospace" font-size="24" fill="#207448">(nc -vz host 22)</text>

  
  <rect x="50" y="810" width="710" height="120" rx="8" fill="#e8f1ea" stroke="#303a36" stroke-width="2" />
  
  <g transform="translate(75, 842)">
    <path d="M 26 4 L 50 46 L 2 46 Z" fill="none" stroke="#303a36" stroke-width="4" stroke-linejoin="round" />
    <line x1="26" y1="18" x2="26" y2="32" stroke="#303a36" stroke-width="4" stroke-linecap="round" />
    <circle cx="26" cy="40" r="2.5" fill="#303a36" />
  </g>
  <text x="145" y="857" font-family="sans-serif" font-size="24" fill="#303a36">editing a task to chase a connection error</text>
  <text x="145" y="893" font-family="sans-serif" font-size="24" fill="#303a36">wastes time and can hide the real cause</text>

  
  <rect x="790" y="250" width="760" height="680" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <text x="820" y="295" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Targets behind a bastion host:</text>
  <text x="820" y="328" font-family="sans-serif" font-size="24" fill="#303a36">a single hardened machine every outside</text>
  <text x="820" y="360" font-family="sans-serif" font-size="24" fill="#303a36">connection must pass through</text>

  
  
  <rect x="815" y="395" width="175" height="125" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(874, 407)">
    <rect x="6" y="8" width="38" height="26" rx="2" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="2" y1="40" x2="48" y2="40" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="902" y="495" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">control node</text>

  
  <line x1="995" y1="457" x2="1030" y2="457" stroke="#207448" stroke-width="4" marker-end="url(#arrow-right)" />

  
  <rect x="1035" y="395" width="280" height="125" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1149, 407)">
    <path d="M 26 4 L 46 12 L 46 26 C 46 38, 26 48, 26 48 C 26 48, 6 38, 6 26 L 6 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  </g>
  <text x="1175" y="495" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">bastion.example.com</text>

  
  <line x1="1320" y1="457" x2="1355" y2="457" stroke="#207448" stroke-width="4" marker-end="url(#arrow-right)" />

  
  <rect x="1360" y="395" width="170" height="125" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1419, 407)">
    <rect x="6" y="6" width="38" height="12" rx="2" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="12" r="2" fill="#207448" />
    <rect x="6" y="24" width="38" height="12" rx="2" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="14" cy="30" r="2" fill="#207448" />
  </g>
  <text x="1445" y="495" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">private targets</text>

  
  <rect x="815" y="545" width="715" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(835, 565)">
    <circle cx="26" cy="26" r="10" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 26 6 L 26 12 M 26 40 L 26 46 M 6 26 L 12 26 M 40 26 L 46 26 M 12 12 L 16 16 M 36 36 L 40 40 M 12 40 L 16 36 M 36 16 L 40 12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="910" y="595" font-family="monospace" font-size="24" fill="#207448">ansible_ssh_common_args:</text>
  <text x="910" y="635" font-family="monospace" font-size="24" fill="#303a36">-o ProxyJump=bastion.example.com</text>
  <text x="910" y="675" font-family="sans-serif" font-size="24" fill="#303a36">in group vars</text>

  
  <rect x="815" y="740" width="715" height="160" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(835, 765)">
    <rect x="6" y="4" width="38" height="46" rx="4" fill="none" stroke="#db8129" stroke-width="4" />
    <line x1="14" y1="16" x2="34" y2="16" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="26" x2="34" y2="26" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <line x1="14" y1="36" x2="26" y2="36" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="910" y="798" font-family="monospace" font-size="24" fill="#db8129">~/.ssh/config<tspan font-family="sans-serif" fill="#303a36">, because Ansible honours</tspan></text>
  <text x="910" y="842" font-family="sans-serif" font-size="24" fill="#303a36">your SSH config</text>

  
  <rect x="50" y="960" width="1500" height="80" rx="8" fill="#207448" />
  <text x="800" y="1010" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Clear connection errors before you debug playbook logic</text>
</svg>