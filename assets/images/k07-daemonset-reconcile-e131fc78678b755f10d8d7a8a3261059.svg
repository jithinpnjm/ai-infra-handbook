<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>A DaemonSet adds one Pod to each new node</title>
  <desc>Visual explanation of a Kubernetes DaemonSet reconciling Pods on existing nodes and automatically placing one onto newly joined nodes without the scheduler.</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A DaemonSet adds one Pod to each new node</text>

  

  
  <rect x="460" y="115" width="680" height="110" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(485, 142)">
    <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 15 L 45 11" stroke="#207448" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="6" fill="#207448"/>
  </g>

  
  <text x="565" y="158" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#207448">DaemonSet fluentd</text>
  <text x="565" y="196" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">desired state is a Pod on every node</text>

  
  <line x1="800" y1="225" x2="800" y2="330" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>
  
  
  <rect x="625" y="256" width="350" height="42" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
  <text x="800" y="285" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#db8129">controller reconciles</text>

  
  <rect x="60" y="330" width="1480" height="160" rx="16" fill="#f0f5f1" stroke="#207448" stroke-width="2"/>

  
  <rect x="85" y="350" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(105, 382)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 0 L 16 8 M 26 0 L 26 8 M 36 0 L 36 8 M 16 44 L 16 52 M 26 44 L 26 52 M 36 44 L 36 52 M 0 16 L 8 16 M 0 26 L 8 26 M 0 36 L 8 36 M 44 16 L 52 16 M 44 26 L 52 26 M 44 36 L 52 36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="180" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 1</text>
  <rect x="310" y="375" width="200" height="70" rx="8" fill="#207448" stroke="#175333" stroke-width="2"/>
  <text x="410" y="418" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">fluentd</text>

  
  <rect x="575" y="350" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(595, 382)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 0 L 16 8 M 26 0 L 26 8 M 36 0 L 36 8 M 16 44 L 16 52 M 26 44 L 26 52 M 36 44 L 36 52 M 0 16 L 8 16 M 0 26 L 8 26 M 0 36 L 8 36 M 44 16 L 52 16 M 44 26 L 52 26 M 44 36 L 52 36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="670" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 2</text>
  <rect x="800" y="375" width="200" height="70" rx="8" fill="#207448" stroke="#175333" stroke-width="2"/>
  <text x="900" y="418" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">fluentd</text>

  
  <rect x="1065" y="350" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1085, 382)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 0 L 16 8 M 26 0 L 26 8 M 36 0 L 36 8 M 16 44 L 16 52 M 26 44 L 26 52 M 36 44 L 36 52 M 0 16 L 8 16 M 0 26 L 8 26 M 0 36 L 8 36 M 44 16 L 52 16 M 44 26 L 52 26 M 44 36 L 52 36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1160" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 3</text>
  <rect x="1290" y="375" width="200" height="70" rx="8" fill="#207448" stroke="#175333" stroke-width="2"/>
  <text x="1390" y="418" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">fluentd</text>

  

  
  <rect x="60" y="525" width="345" height="355" rx="16" fill="#ffffff" stroke="#b0cbb6" stroke-width="2"/>
  <circle cx="100" cy="565" r="24" fill="#207448"/>
  <text x="100" y="574" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="140" y="560" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="140" dy="0">a new node joins</tspan>
    <tspan x="140" dy="30">the cluster</tspan>
  </text>
  
  <rect x="85" y="665" width="295" height="180" rx="12" fill="#fafdfa" stroke="#207448" stroke-width="3" stroke-dasharray="8,6"/>
  <g transform="translate(110, 725)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 0 L 16 8 M 26 0 L 26 8 M 36 0 L 36 8 M 16 44 L 16 52 M 26 44 L 26 52 M 36 44 L 36 52 M 0 16 L 8 16 M 0 26 L 8 26 M 0 36 L 8 36 M 44 16 L 52 16 M 44 26 L 52 26 M 44 36 L 52 36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="185" y="763" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 4</text>

  
  <rect x="430" y="525" width="345" height="355" rx="16" fill="#ffffff" stroke="#b0cbb6" stroke-width="2"/>
  <circle cx="470" cy="565" r="24" fill="#207448"/>
  <text x="470" y="574" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="510" y="546" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="510" dy="0">the DaemonSet</tspan>
    <tspan x="510" dy="28">controller</tspan>
    <tspan x="510" dy="28">notices the</tspan>
    <tspan x="510" dy="28">missing Pod</tspan>
  </text>
  
  <rect x="455" y="665" width="295" height="180" rx="12" fill="#f5f8f5" stroke="#b0cbb6" stroke-width="2"/>
  <g transform="translate(575, 725)">
    <path d="M 0 30 Q 28 0 56 30 Q 28 60 0 30 Z" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="30" r="10" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="30" r="3" fill="#207448"/>
  </g>

  
  <rect x="800" y="525" width="345" height="355" rx="16" fill="#ffffff" stroke="#b0cbb6" stroke-width="2"/>
  <circle cx="840" cy="565" r="24" fill="#207448"/>
  <text x="840" y="574" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="880" y="555" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="880" dy="0">a fluentd pod</tspan>
    <tspan x="880" dy="28">is added to</tspan>
    <tspan x="880" dy="28">the new node</tspan>
  </text>
  
  <rect x="825" y="665" width="295" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(845, 680)">
    <rect x="8" y="8" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 16 0 L 16 8 M 26 0 L 26 8 M 36 0 L 36 8 M 16 44 L 16 52 M 26 44 L 26 52 M 36 44 L 36 52 M 0 16 L 8 16 M 0 26 L 8 26 M 0 36 L 8 36 M 44 16 L 52 16 M 44 26 L 52 26 M 44 36 L 52 36" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="915" y="718" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#303a36">node 4</text>
  <rect x="845" y="760" width="255" height="65" rx="8" fill="#207448" stroke="#175333" stroke-width="2"/>
  <text x="972" y="801" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">fluentd</text>

  
  <rect x="1170" y="525" width="370" height="355" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  
  <g transform="translate(1200, 552)">
    <path d="M 0 12 L 24 2 L 48 12 C 48 38 24 54 24 54 C 24 54 0 38 0 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 14 26 L 22 34 L 34 18" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1265" y="572" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="1265" dy="0">you take no action</tspan>
    <tspan x="1265" dy="30">for the new node</tspan>
  </text>

  <line x1="1195" y1="645" x2="1515" y2="645" stroke="#b0cbb6" stroke-width="2"/>

  
  <text x="1195" y="682" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1195" dy="0">the pod is placed by</tspan>
    <tspan x="1195" dy="34"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="bold">nodeName</tspan> set by the</tspan>
    <tspan x="1195" dy="34">DaemonSet, so the</tspan>
    <tspan x="1195" dy="34">scheduler is skipped</tspan>
  </text>

  
  <rect x="60" y="915" width="1480" height="80" rx="12" fill="#207448"/>
  <text x="800" y="964" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">a DaemonSet keeps one copy of a Pod on every node, including nodes added later</text>
</svg>