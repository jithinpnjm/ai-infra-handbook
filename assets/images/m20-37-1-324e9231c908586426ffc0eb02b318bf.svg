<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>The visibility map: three layers, and you own only one</title>
  <desc>Architecture flowchart showing telemetry flow across the client, gateway, GPU replicas, regional monitoring, storage, console dashboards, federate API, customer Prometheus/Grafana, and status page.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="70" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The visibility map: three layers, and you own only one</text>

  
  
