  <line x1="230" y1="330" x2="230" y2="450" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <line x1="230" y1="750" x2="230" y2="630" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />

  

  
