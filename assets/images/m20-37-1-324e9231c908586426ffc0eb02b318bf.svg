  <line x1="770" y1="240" x2="850" y2="240" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

  
  <line x1="1150" y1="240" x2="1230" y2="240" stroke="#207448" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-green)" />

  
