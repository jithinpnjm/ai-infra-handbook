<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The scheduler's job and model</title>
  <desc>Architecture and flow of the Kubernetes scheduler showing the scheduling queue stages, scheduling cycle, and binding cycle.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The scheduler's job and model</text>

  

  
  <g filter="url(#shadow)">
    <rect x="230" y="95" width="480" height="140" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <rect x="255" y="133" width="48" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="263" y1="145" x2="285" y2="145" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="263" y1="155" x2="277" y2="155" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="293" cy="145" r="2.5" fill="#207448"/>
    <circle cx="293" cy="155" r="2.5" fill="#207448"/>
    <line x1="279" y1="167" x2="279" y2="175" stroke="#207448" stroke-width="3"/>
    <line x1="267" y1="175" x2="291" y2="175" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="325" y="140" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">API server:</text>
    <text x="325" y="176" font-family="sans-serif" font-size="24" fill="#303a36">new/updated Pods,</text>
    <text x="325" y="210" font-family="sans-serif" font-size="24" fill="#303a36">Nodes, PVs, ...</text>
  </g>

  
  <rect x="230" y="275" width="480" height="605" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-dasharray="9,6"/>

  
  <rect x="250" y="295" width="225" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="362" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Scheduling queue</text>

  
  <g filter="url(#shadow)">
    <rect x="250" y="355" width="440" height="130" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="268" y="415" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="274" y="399" width="32" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="280" y="383" width="20" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 304 380 L 304 372 M 300 376 L 304 372 L 308 376" stroke="#207448" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <text x="325" y="394" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">activeQ</text>
    <text x="325" y="430" font-family="sans-serif" font-size="24" fill="#303a36">(heap by priority/</text>
    <text x="325" y="462" font-family="sans-serif" font-size="24" fill="#303a36">QueueSort)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="250" y="510" width="440" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="290" cy="582" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="290,570 290,582 300,582" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 276 568 A 18 18 0 0 0 273 594" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

    <text x="325" y="550" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">backoffQ</text>
    <text x="325" y="588" font-family="sans-serif" font-size="24" fill="#303a36">(recently failed,</text>
    <text x="325" y="622" font-family="sans-serif" font-size="24" fill="#303a36">exponential backoff)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="250" y="680" width="440" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 274 742 L 306 742 L 296 760 L 306 778 L 274 778 L 284 760 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="270" y1="742" x2="310" y2="742" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="778" x2="310" y2="778" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <text x="325" y="722" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">unschedulablePods</text>
    <text x="325" y="762" font-family="sans-serif" font-size="24" fill="#303a36">(waiting for a cluster event</text>
    <text x="325" y="798" font-family="sans-serif" font-size="24" fill="#303a36">that could help)</text>
  </g>

  

  
  <g filter="url(#shadow)">
    <rect x="970" y="95" width="590" height="135" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
    
    <circle cx="1005" cy="135" r="22" fill="#db8129"/>
    <text x="1005" y="143" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <rect x="1045" y="118" width="34" height="34" rx="4" fill="none" stroke="#db8129" stroke-width="3"/>
    <line x1="1052" y1="112" x2="1052" y2="118" stroke="#db8129" stroke-width="2.5"/>
    <line x1="1062" y1="112" x2="1062" y2="118" stroke="#db8129" stroke-width="2.5"/>
    <line x1="1072" y1="112" x2="1072" y2="118" stroke="#db8129" stroke-width="2.5"/>
    <line x1="1052" y1="152" x2="1052" y2="158" stroke="#db8129" stroke-width="2.5"/>
    <line x1="1062" y1="152" x2="1062" y2="158" stroke="#db8129" stroke-width="2.5"/>
    <line x1="1072" y1="152" x2="1072" y2="158" stroke="#db8129" stroke-width="2.5"/>

    <text x="1105" y="145" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Scheduling cycle</text>
    <text x="1105" y="186" font-family="sans-serif" font-size="24" fill="#303a36">(serial per pod)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="970" y="265" width="590" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1005" cy="305" r="22" fill="#207448"/>
    <text x="1005" y="313" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <polygon points="1045,290 1085,290 1069,314 1069,334 1061,330 1061,314" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>

    <text x="1105" y="310" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">PreFilter →</text>
    <text x="1105" y="348" font-family="sans-serif" font-size="25" fill="#303a36">Filter (nodes, parallel) →</text>
    <text x="1105" y="386" font-family="sans-serif" font-size="25" fill="#303a36">PostFilter (preemption if none fit)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="970" y="460" width="590" height="160" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1005" cy="500" r="22" fill="#207448"/>
    <text x="1005" y="508" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <path d="M 1045 528 A 20 20 0 0 1 1085 528" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1065" y1="528" x2="1078" y2="512" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1065" cy="528" r="3" fill="#207448"/>

    <text x="1105" y="515" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">PreScore → Score (parallel) →</text>
    <text x="1105" y="565" font-family="sans-serif" font-size="25" fill="#303a36">NormalizeScore → select best</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="970" y="655" width="590" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1005" cy="695" r="22" fill="#207448"/>
    <text x="1005" y="703" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    
    <path d="M 1045 680 L 1065 672 L 1085 680 L 1085 704 C 1085 718 1065 726 1065 726 C 1065 726 1045 718 1045 704 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="1057,698 1063,704 1073,694" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1105" y="705" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Reserve → Permit</text>
    <text x="1105" y="745" font-family="sans-serif" font-size="24" fill="#303a36">(approve/deny/wait)</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="970" y="825" width="590" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1005" cy="865" r="22" fill="#207448"/>
    <text x="1005" y="873" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    
    <rect x="1046" y="855" width="22" height="12" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="1062" y="865" width="22" height="12" rx="6" fill="none" stroke="#207448" stroke-width="3"/>

    <text x="1105" y="875" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Binding cycle (async):</text>
    <text x="1105" y="915" font-family="sans-serif" font-size="24" fill="#303a36">PreBind → Bind → PostBind</text>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="970" y="995" width="590" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3"/>
    
    <circle cx="1005" cy="1035" r="22" fill="#207448"/>
    <text x="1005" y="1043" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    
    <path d="M 1048 1015 L 1072 1015 L 1082 1025 L 1082 1055 L 1048 1055 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <line x1="1056" y1="1032" x2="1074" y2="1032" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1056" y1="1042" x2="1070" y2="1042" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

    <text x="1105" y="1045" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Binding written</text>
    <text x="1105" y="1085" font-family="monospace" font-size="24" fill="#303a36">(spec.nodeName)</text>
  </g>

  

   AQ: Clean straight vertical arrow (x=580 avoids the title badge completely) -->
  <line x1="580" y1="235" x2="580" y2="353" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   SC: Orthogonal arrow running up through the gap -->
  <path d="M 690 420 L 760 420 L 760 162 L 968 162" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   PF -->
  <line x1="1265" y1="230" x2="1265" y2="263" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   PS -->
  <line x1="1265" y1="425" x2="1265" y2="458" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   RS -->
  <line x1="1265" y1="620" x2="1265" y2="653" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   BC -->
  <line x1="1265" y1="790" x2="1265" y2="823" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

   API2 -->
  <line x1="1265" y1="960" x2="1265" y2="993" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <path d="M 970 195 L 860 195 L 860 762 L 692 762" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
  
  <g filter="url(#shadow)">
    <rect x="765" y="520" width="190" height="48" rx="24" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="860" y="552" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">no node fits</text>
  </g>

  
  <path d="M 250 762 L 115 762 L 115 420 L 248 420" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow)"/>
  
  <g filter="url(#shadow)">
    <rect x="15" y="530" width="200" height="126" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="115" y="566" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">relevant event</text>
    <text x="115" y="600" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(node added,</text>
    <text x="115" y="632" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">pod deleted, ...)</text>
  </g>

</svg>