<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Topology-aware routing keeps requests in the zone</title>
  <desc>Visual comparison between default Kubernetes Service routing across availability zones and topology-aware routing with PreferClose keeping requests in-zone.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Topology-aware routing keeps requests in the zone</text>

  
  <g id="panel-left">
    <rect x="50" y="90" width="730" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(75, 108)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <ellipse cx="28" cy="28" rx="10" ry="22" />
      <line x1="6" y1="28" x2="50" y2="28" />
    </g>

    
    <text x="145" y="148" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">default</text>

    
    <text x="75" y="196" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">a client in zone A may land on endpoints in any zone,</tspan>
      <tspan x="75" dy="32">crossing zone boundaries (extra latency and cost)</tspan>
    </text>

    
    <g id="left-zone-a">
      <rect x="75" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="90" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="180" y="325" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">zone A</text>

      
      <rect x="90" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(102, 375)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>
      <text x="156" y="413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">client</text>

      
      <rect x="90" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(102, 590)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
      </g>
      <text x="180" y="665" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">endpoints</text>
    </g>

    
    <g id="left-zone-b">
      <rect x="310" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="325" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="415" y="325" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">zone B</text>

      
      <rect x="325" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />
      <g transform="translate(395, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>

      
      <rect x="325" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(375, 605)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
        <rect x="54" y="2" width="22" height="18" rx="3" />
      </g>
    </g>

    
    <g id="left-zone-c">
      <rect x="545" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="560" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <text x="650" y="325" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">zone C</text>

      
      <rect x="560" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />
      <g transform="translate(630, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>

      
      <rect x="560" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(610, 605)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
        <rect x="54" y="2" width="22" height="18" rx="3" />
      </g>
    </g>

    
    
    <path d="M 130 450 L 130 575" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <path d="M 230 450 L 230 485 L 650 485 L 650 575" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />

    
    <path d="M 180 450 L 180 525 L 415 525 L 415 575" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="panel-right">
    <rect x="820" y="90" width="730" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />

    
    <g transform="translate(845, 108)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 30 C 48 42 28 50 28 50 C 28 50 8 42 8 30 L 8 14 Z" />
      <circle cx="28" cy="27" r="7" />
    </g>

    
    <text x="915" y="135" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">
      <tspan x="915" dy="0" font-family="monospace">trafficDistribution PreferClose</tspan>
      <tspan x="845" dy="32" font-size="24" font-weight="normal" fill="#303a36">(earlier: annotation</tspan>
      <tspan x="845" dy="30" font-size="24" font-weight="normal" font-family="monospace" fill="#303a36">service.kubernetes.io/topology-mode Auto)</tspan>
    </text>

    
    <text x="845" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">EndpointSlice hints with <tspan font-family="monospace">forZones</tspan> keep the</tspan>
      <tspan x="845" dy="32">request inside zone A while it has endpoints</tspan>
    </text>

    
    <g id="right-zone-a">
      <rect x="845" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="860" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <line x1="895" y1="316" x2="1005" y2="316" stroke="#207448" stroke-width="3" stroke-linecap="round" />

      
      <rect x="860" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(932, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>

      
      <rect x="860" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(910, 605)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
        <rect x="54" y="2" width="22" height="18" rx="3" />
      </g>

      
      <path d="M 950 450 L 950 575" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
    </g>

    
    <g id="right-zone-b">
      <rect x="1080" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1095" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <line x1="1130" y1="316" x2="1240" y2="316" stroke="#207448" stroke-width="3" stroke-linecap="round" />

      
      <rect x="1095" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />
      <g transform="translate(1165, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>

      
      <rect x="1095" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(1145, 605)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
        <rect x="54" y="2" width="22" height="18" rx="3" />
      </g>
    </g>

    
    <g id="right-zone-c">
      <rect x="1315" y="280" width="210" height="435" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <rect x="1330" y="295" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
      <line x1="1365" y1="316" x2="1475" y2="316" stroke="#207448" stroke-width="3" stroke-linecap="round" />

      
      <rect x="1330" y="355" width="180" height="95" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" stroke-dasharray="4 3" />
      <g transform="translate(1400, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="34" height="24" rx="3" />
        <line x1="14" y1="28" x2="24" y2="28" />
        <line x1="9" y1="34" x2="29" y2="34" />
      </g>

      
      <rect x="1330" y="575" width="180" height="115" rx="10" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
      <g transform="translate(1380, 605)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="22" height="18" rx="3" />
        <rect x="28" y="2" width="22" height="18" rx="3" />
        <rect x="54" y="2" width="22" height="18" rx="3" />
      </g>
    </g>
  </g>

  
  
  <g id="box-fallback">
    <rect x="50" y="765" width="730" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 805)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 28 A 18 18 0 1 1 28 46" />
      <polyline points="12,18 12,28 22,28" />
      <line x1="28" y1="20" x2="28" y2="30" />
      <circle cx="28" cy="38" r="2.5" fill="#207448" />
    </g>
    <text x="145" y="815" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">if a zone has no endpoints or endpoints</tspan>
      <tspan x="145" dy="32">are unbalanced, traffic falls back to</tspan>
      <tspan x="145" dy="32">cluster-wide routing</tspan>
    </text>
  </g>

  
  <g id="box-needs">
    <rect x="820" y="765" width="730" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(845, 805)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="5" />
      <line x1="16" y1="20" x2="38" y2="20" />
      <line x1="16" y1="30" x2="38" y2="30" />
      <line x1="16" y1="40" x2="28" y2="40" />
    </g>
    <text x="915" y="828" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="915" dy="0">zone labels on nodes and enough</tspan>
      <tspan x="915" dy="34">endpoints in each zone</tspan>
    </text>
  </g>

  
  <g id="strip-analogy">
    <rect x="50" y="925" width="1500" height="105" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(75, 950)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="36" rx="4" />
      <line x1="6" y1="22" x2="50" y2="22" />
      <line x1="28" y1="22" x2="28" y2="46" />
      <path d="M 18 10 L 28 4 L 38 10" />
    </g>
    <text x="150" y="988" font-family="sans-serif" font-size="26" fill="#303a36">parcel goes to the depot in the same town until it is empty</text>
  </g>

  
  <g id="bar-footer">
    <rect x="50" y="1055" width="1500" height="85" rx="14" fill="#207448" />
    <text x="800" y="1108" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">check each zone has endpoints before turning it on, then watch where requests land</text>
  </g>
</svg>