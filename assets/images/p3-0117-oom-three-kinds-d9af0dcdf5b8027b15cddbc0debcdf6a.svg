<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Three kinds of OOM: cgroup, global and NUMA-constrained</title>
  <desc>Visual comparison of cgroup OOM, global OOM, and NUMA-constrained OOM mechanisms, indicators, and evidence.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Three kinds of OOM: cgroup, global and NUMA-constrained</text>

  
  
  <rect x="40" y="105" width="480" height="76" rx="12" fill="#db8129"/>
  
  <circle cx="88" cy="143" r="26" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  
  <path d="M74 135 L88 127 L102 135 L88 143 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74 135 L74 151 L88 159 L88 143" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <path d="M102 135 L102 151 L88 159" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  
  <text x="130" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">cgroup OOM</text>

  
  <rect x="40" y="195" width="480" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  
  <g opacity="0.35">
    <rect x="260" y="215" width="240" height="145" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="280" y1="235" x2="480" y2="235" stroke="#207448" stroke-width="2"/>
    <line x1="280" y1="260" x2="480" y2="260" stroke="#207448" stroke-width="2"/>
    <line x1="280" y1="335" x2="480" y2="335" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="280" y="285" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="280" dy="0">hundreds of</tspan>
    <tspan x="280" dy="32">GB free</tspan>
  </text>

  
  <rect x="60" y="240" width="185" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="62" y="242" width="181" height="116" rx="6" fill="#207448" opacity="0.85"/>
  
  <line x1="55" y1="240" x2="250" y2="240" stroke="#207448" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="65" y="230" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">memory.max</text>

  
  <rect x="40" y="395" width="480" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="60" y="432" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">The group exceeds memory.max</tspan>
    <tspan x="60" dy="32">and cannot reclaim, so the</tspan>
    <tspan x="60" dy="32">kernel runs the OOM killer</tspan>
    <tspan x="60" dy="32">inside that cgroup: one</tspan>
    <tspan x="60" dy="32">process, or the whole group</tspan>
    <tspan x="60" dy="32">if memory.oom.group=1</tspan>
  </text>

  
  <rect x="40" y="640" width="480" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="60" y="680" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="60" dy="0">memory.events counters</tspan>
    <tspan x="60" dy="35">high, max, oom, oom_kill;</tspan>
    <tspan x="60" dy="35">dmesg constraint=</tspan>
    <tspan x="60" dy="35">CONSTRAINT_MEMCG plus</tspan>
    <tspan x="60" dy="35">the cgroup path;</tspan>
    <tspan x="60" dy="35">Kubernetes reason OOMKilled</tspan>
  </text>


  
  
  <rect x="560" y="105" width="480" height="76" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="608" cy="143" r="26" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  
  <rect x="593" y="131" width="30" height="24" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="593" y1="139" x2="623" y2="139" stroke="#207448" stroke-width="2"/>
  <line x1="593" y1="147" x2="623" y2="147" stroke="#207448" stroke-width="2"/>
  <circle cx="617" cy="135" r="1.5" fill="#207448"/>
  <circle cx="617" cy="143" r="1.5" fill="#207448"/>
  <circle cx="617" cy="151" r="1.5" fill="#207448"/>
  
  <text x="650" y="152" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Global OOM</text>

  
  <rect x="560" y="195" width="480" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <g>
    <rect x="580" y="215" width="95" height="145" rx="6" fill="#207448"/>
    <rect x="690" y="215" width="95" height="145" rx="6" fill="#207448"/>
    <rect x="800" y="215" width="95" height="145" rx="6" fill="#207448"/>
    <rect x="910" y="215" width="110" height="145" rx="6" fill="#207448"/>
    
    <line x1="585" y1="240" x2="670" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="585" y1="270" x2="670" y2="270" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="585" y1="300" x2="670" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="585" y1="330" x2="670" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="695" y1="240" x2="780" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="695" y1="270" x2="780" y2="270" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="695" y1="300" x2="780" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="695" y1="330" x2="780" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="805" y1="240" x2="890" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="805" y1="270" x2="890" y2="270" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="805" y1="300" x2="890" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="805" y1="330" x2="890" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="915" y1="240" x2="1015" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="915" y1="270" x2="1015" y2="270" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="915" y1="300" x2="1015" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="915" y1="330" x2="1015" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>

  
  <rect x="560" y="395" width="480" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="470" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="580" dy="0">the whole machine is</tspan>
    <tspan x="580" dy="36">out of memory and</tspan>
    <tspan x="580" dy="36">reclaim has failed</tspan>
  </text>

  
  <rect x="560" y="640" width="480" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="580" y="680" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="580" dy="0">Out of memory: Killed</tspan>
    <tspan x="580" dy="35">process 1234 (python)</tspan>
    <tspan x="580" dy="35">total-vm: anon-rss:;</tspan>
    <tspan x="580" dy="35">oom-kill:constraint= and a</tspan>
    <tspan x="580" dy="35">dump of candidate processes</tspan>
    <tspan x="580" dy="35">in dmesg or journalctl -k</tspan>
  </text>


  
  
  <rect x="1080" y="105" width="480" height="76" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1128" cy="143" r="26" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  
  <rect x="1112" y="131" width="14" height="24" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
  <rect x="1130" y="131" width="14" height="24" rx="2" fill="none" stroke="#207448" stroke-width="2.5"/>
  <line x1="1126" y1="143" x2="1130" y2="143" stroke="#207448" stroke-width="3"/>
  
  <text x="1170" y="152" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NUMA-constrained OOM</text>

  
  <rect x="1080" y="195" width="480" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="1105" y="215" width="205" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="1113" y="223" width="189" height="129" rx="6" fill="#207448"/>
  <line x1="1125" y1="245" x2="1290" y2="245" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="1125" y1="275" x2="1290" y2="275" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="1125" y1="305" x2="1290" y2="305" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="1125" y1="335" x2="1290" y2="335" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  
  <line x1="1310" y1="287" x2="1330" y2="287" stroke="#207448" stroke-width="4"/>

  
  <rect x="1330" y="215" width="205" height="145" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <rect x="1338" y="325" width="189" height="27" rx="4" fill="#207448" opacity="0.8"/>
  <rect x="1338" y="223" width="189" height="98" rx="4" fill="#ffffff" opacity="0.7"/>
  <line x1="1350" y1="250" x2="1515" y2="250" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="1350" y1="285" x2="1515" y2="285" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  
  <rect x="1080" y="395" width="480" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1100" y="445" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">a process bound with</tspan>
    <tspan x="1100" dy="34">--membind or cpuset.mems</tspan>
    <tspan x="1100" dy="34">to a full node hits OOM</tspan>
    <tspan x="1100" dy="34">while other nodes have</tspan>
    <tspan x="1100" dy="34">free memory</tspan>
  </text>

  
  <rect x="1080" y="640" width="480" height="295" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <text x="1100" y="730" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">low-memory zones such as</tspan>
    <tspan x="1100" dy="36">DMA32 can run out: check</tspan>
    <tspan x="1100" dy="36">the Node 0 DMA32 free lines</tspan>
  </text>


  
  <rect x="40" y="955" width="1520" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="95" cy="1007" r="28" fill="#ffffff" stroke="#207448" stroke-width="4"/>
  
  <path d="M85 997 L105 1017 M105 997 L85 1017" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  
  <text x="145" y="996" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">The victim gets SIGKILL, so no handler, no final checkpoint, no flush;</tspan>
    <tspan x="145" dy="34">the parent or Kubernetes sees exit status 137 (128 + 9)</tspan>
  </text>


  
  <rect x="40" y="1080" width="1520" height="70" rx="12" fill="#207448"/>
  <text x="800" y="1124" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Look in dmesg, not in your application log</text>

</svg>