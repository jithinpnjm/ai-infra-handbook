<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090">
  <title>Load counts threads, pressure counts the time somebody waited</title>
  <desc>Load keeps climbing, pressure stops at 100: two aligned lanes comparing Load average and PSI cpu some on a 2-CPU host, showing how load average keeps climbing while pressure stops at ceiling 100.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448"/>
    </marker>

    
    <g id="icon-load">
      <rect x="0" y="0" width="56" height="56" fill="none"/>
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 14 36 A 16 16 0 1 1 42 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="28" y1="28" x2="38" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="28" r="4" fill="#207448"/>
    </g>

    
    <g id="icon-psi">
      <rect x="0" y="0" width="56" height="56" fill="none"/>
      <path d="M 10 38 C 10 22 22 10 28 10 C 34 10 46 22 46 38 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="46" x2="28" y2="22" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 18 34 L 28 22 L 38 34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <g id="cpu-chip">
      <rect x="4" y="4" width="48" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      
      <line x1="16" y1="0" x2="16" y2="4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="0" x2="28" y2="4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="0" x2="40" y2="4" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="52" x2="16" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="52" x2="28" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="40" y1="52" x2="40" y2="56" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="4" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="4" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="40" x2="4" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="52" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="52" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <line x1="52" y1="40" x2="56" y2="40" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  
  <rect width="1600" height="1090" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">Load counts threads, </tspan><tspan x="800" dy="54">pressure counts the time somebody waited</tspan></text>

  
  <g id="host-pill">
    <rect x="670" y="128" width="260" height="42" rx="21" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="157" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">on a 2-CPU host</text>
  </g>

  
  <g id="col-headers">
    
    <rect x="378" y="188" width="244" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="500" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">1 busy thread</text>

    
    <rect x="648" y="188" width="244" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="770" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">2 busy threads</text>

    
    <rect x="918" y="188" width="244" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1040" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">3 busy threads</text>

    
    <rect x="1188" y="188" width="244" height="46" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1310" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">4 busy threads</text>
  </g>

  
  <g id="top-lane">
    
    <rect x="60" y="250" width="1480" height="235" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <use href="#icon-load" x="90" y="280"/>
    <text x="165" y="318" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Load average</text>

    
    <line x1="390" y1="455" x2="1460" y2="455" stroke="#c0d4c6" stroke-width="2"/>

    
    <path d="M 450 275 H 1450" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="850" y="254" width="240" height="42" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="970" y="283" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">keeps climbing</text>

    
    <rect x="442" y="420" width="116" height="35" rx="6" fill="#207448"/>
    <text x="500" y="405" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">1.0</text>

    
    <rect x="712" y="385" width="116" height="70" rx="6" fill="#207448"/>
    <text x="770" y="370" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">2.0</text>

    
    <rect x="982" y="350" width="116" height="105" rx="6" fill="#207448"/>
    <text x="1040" y="335" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">3.0</text>

    
    <rect x="1252" y="315" width="116" height="140" rx="6" fill="#207448"/>
    <text x="1310" y="300" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">4.0</text>
  </g>

  
  <g id="bottom-lane">
    
    <rect x="60" y="500" width="1480" height="235" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>

    
    <use href="#icon-psi" x="90" y="525"/>
    <text x="165" y="560" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">PSI cpu some</text>
    <text x="165" y="595" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/proc/pressure/cpu</text>

    
    <line x1="390" y1="705" x2="1460" y2="705" stroke="#c0d4c6" stroke-width="2"/>

    
    <line x1="390" y1="595" x2="1460" y2="595" stroke="#db8129" stroke-width="3" stroke-dasharray="10 6"/>
    
    <rect x="390" y="573" width="140" height="44" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2"/>
    <text x="460" y="603" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">ceiling</text>

    
    <path d="M 1200 551 H 1295" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <rect x="920" y="530" width="270" height="42" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1055" y="559" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">stops at ceiling</text>

    
    <line x1="442" y1="705" x2="558" y2="705" stroke="#207448" stroke-width="4"/>
    <text x="500" y="688" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">0.0</text>

    
    <line x1="712" y1="705" x2="828" y2="705" stroke="#207448" stroke-width="4"/>
    <text x="770" y="688" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">0.0</text>

    
    <rect x="982" y="650" width="116" height="55" rx="6" fill="#cbe5d4" stroke="#207448" stroke-width="2"/>
    <text x="1040" y="635" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">50.0</text>

    
    <rect x="1252" y="595" width="116" height="110" rx="6" fill="#cbe5d4" stroke="#207448" stroke-width="2.5"/>
    <text x="1310" y="580" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">100.0</text>
  </g>

  
  <g id="cpu-icons-row">
    
    <g transform="translate(425, 748)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
      
      <use href="#cpu-chip" x="14" y="18"/>
      <circle cx="42" cy="46" r="13" fill="#207448"/>
      
      <use href="#cpu-chip" x="80" y="18"/>
      <circle cx="108" cy="46" r="13" fill="none" stroke="#a0b8a8" stroke-width="2" stroke-dasharray="3 3"/>
    </g>

    
    <g transform="translate(695, 748)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
      
      <use href="#cpu-chip" x="14" y="18"/>
      <circle cx="42" cy="46" r="13" fill="#207448"/>
      
      <use href="#cpu-chip" x="80" y="18"/>
      <circle cx="108" cy="46" r="13" fill="#207448"/>
    </g>

    
    <g transform="translate(965, 748)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
      
      <use href="#cpu-chip" x="14" y="18"/>
      <circle cx="34" cy="46" r="9" fill="#207448"/>
      <circle cx="50" cy="46" r="9" fill="#207448"/>
      
      <use href="#cpu-chip" x="80" y="18"/>
      <circle cx="108" cy="46" r="13" fill="#207448"/>
    </g>

    
    <g transform="translate(1235, 748)">
      <rect x="0" y="0" width="150" height="92" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5"/>
      
      <use href="#cpu-chip" x="14" y="18"/>
      <circle cx="34" cy="46" r="9" fill="#207448"/>
      <circle cx="50" cy="46" r="9" fill="#207448"/>
      
      <use href="#cpu-chip" x="80" y="18"/>
      <circle cx="100" cy="46" r="9" fill="#207448"/>
      <circle cx="116" cy="46" r="9" fill="#207448"/>
    </g>
  </g>

  
  <g id="numbered-steps">
    
    <g id="step-1">
      <rect x="60" y="855" width="720" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="115" cy="902" r="24" fill="#207448"/>
      <text x="115" y="911" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
      <text x="165" y="911" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">read <tspan font-family="monospace" font-size="26" fill="#207448">/proc/pressure/*</tspan> first</text>
    </g>

    
    <g id="step-2">
      <rect x="820" y="855" width="720" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <circle cx="875" cy="902" r="24" fill="#207448"/>
      <text x="875" y="911" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
      <text x="925" y="890" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36"><tspan x="925" dy="0">compare the 10 second value </tspan><tspan x="925" dy="34">with the 300 second value</tspan></text>
    </g>
  </g>

  
  <g id="takeaway-bar">
    <rect x="60" y="975" width="1480" height="80" rx="12" fill="#207448"/>
    <text x="800" y="1025" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Load is how much work piled up, pressure is how much of the time something waited.</text>
  </g>
</svg>