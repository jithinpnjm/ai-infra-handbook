<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>NETCONF, RESTCONF and gNMI compared</title>
  <desc>Visual comparison table of NETCONF, RESTCONF, and gNMI across encoding, transport, transaction scope, streaming telemetry, tooling, and best use cases.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">NETCONF, RESTCONF and gNMI compared</text>

  
  <rect x="50" y="110" width="270" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="110" cy="157" r="20" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="100" y1="157" x2="120" y2="157" stroke="#207448" stroke-width="3"/>
  <line x1="110" y1="147" x2="110" y2="167" stroke="#207448" stroke-width="3"/>
  <line x1="150" y1="135" x2="280" y2="135" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="157" x2="250" y2="157" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="179" x2="270" y2="179" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <rect x="340" y="110" width="390" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(370, 130)">
    <rect x="0" y="10" width="56" height="34" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="14" cy="27" r="4" fill="#207448"/>
    <circle cx="28" cy="27" r="4" fill="#207448"/>
    <circle cx="42" cy="27" r="4" fill="#207448"/>
  </g>
  <text x="445" y="170" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">NETCONF</text>

  
  <rect x="750" y="110" width="390" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(775, 130)">
    <circle cx="28" cy="27" r="23" fill="none" stroke="#207448" stroke-width="4"/>
    <ellipse cx="28" cy="27" rx="11" ry="23" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="5" y1="27" x2="51" y2="27" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="845" y="170" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">RESTCONF</text>

  
  <rect x="1160" y="110" width="390" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <g transform="translate(1195, 130)">
    <path d="M 6 42 A 25 25 0 1 1 50 42" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="28" y1="28" x2="42" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  <text x="1275" y="170" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">gNMI</text>

  
  
  <rect x="50" y="225" width="270" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 255)">
    <rect x="2" y="2" width="46" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 16 20 L 10 25 L 16 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 34 20 L 40 25 L 34 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="27" y1="17" x2="23" y2="33" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="128" y="289" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Encoding</text>

  
  <rect x="340" y="225" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="289" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">XML</text>

  
  <rect x="750" y="225" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="289" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">JSON or XML</text>

  
  <rect x="1160" y="225" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="1355" y="272" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1355" dy="0">JSON, JSON_IETF or</tspan>
    <tspan x="1355" dy="32">PROTO (protobuf)</tspan>
  </text>

  
  
  <rect x="50" y="355" width="270" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 385)">
    <circle cx="12" cy="35" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="38" cy="15" r="7" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 18 31 C 26 27, 24 23, 32 19" fill="none" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="128" y="419" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Transport</text>

  
  <rect x="340" y="355" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="419" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">SSH (TLS)</text>

  
  <rect x="750" y="355" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="419" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#303a36">HTTP(S)</text>

  
  <rect x="1160" y="355" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="1355" y="419" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">gRPC over HTTP/2 + TLS</text>

  
  
  <rect x="50" y="485" width="270" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 525)">
    <rect x="8" y="18" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 16 18 L 16 12 A 9 9 0 0 1 34 12 L 34 18" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="25" cy="30" r="3" fill="#207448"/>
  </g>
  <text x="124" y="542" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="124" dy="0">Transaction</tspan>
    <tspan x="124" dy="32">scope</tspan>
  </text>

  
  <rect x="340" y="485" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="542" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="535" dy="0">network-wide capable</tspan>
    <tspan x="535" dy="32">(lock, candidate, commit)</tspan>
  </text>

  
  <rect x="750" y="485" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="542" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="945" dy="0">single target,</tspan>
    <tspan x="945" dy="32">single shot</tspan>
  </text>

  
  <rect x="1160" y="485" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="1355" y="542" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1355" dy="0">single target,</tspan>
    <tspan x="1355" dy="32">Set atomic per request</tspan>
  </text>

  
  
  <rect x="50" y="640" width="270" height="135" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 680)">
    <circle cx="10" cy="38" r="4" fill="#207448"/>
    <path d="M 18 30 A 14 14 0 0 1 24 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 26 22 A 25 25 0 0 1 36 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 34 14 A 36 36 0 0 1 48 38" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="124" y="697" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="124" dy="0">Streaming</tspan>
    <tspan x="124" dy="32">telemetry</tspan>
  </text>

  
  <rect x="340" y="640" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="535" dy="0">notifications</tspan>
    <tspan x="535" dy="32">(limited)</tspan>
  </text>

  
  <rect x="750" y="640" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="945" dy="0">SSE</tspan>
    <tspan x="945" dy="32">(limited)</tspan>
  </text>

  
  <rect x="1160" y="640" width="390" height="135" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="1355" y="697" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1355" dy="0">native Subscribe</tspan>
    <tspan x="1355" dy="32">(sample, on-change)</tspan>
  </text>

  
  
  <rect x="50" y="795" width="270" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 825)">
    <path d="M 36 10 C 30 10, 26 14, 27 19 L 14 32 C 11 35, 11 40, 14 43 C 17 46, 22 46, 25 43 L 38 30 C 43 31, 47 27, 47 21 C 47 18, 44 16, 44 16 L 38 22 L 32 16 L 38 10 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="128" y="859" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Tooling</text>

  
  <rect x="340" y="795" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="859" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">ncclient</text>

  
  <rect x="750" y="795" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="859" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">curl, requests</text>

  
  <rect x="1160" y="795" width="390" height="110" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="1355" y="842" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1355" dy="0">gNMIc, pygnmi,</tspan>
    <tspan x="1355" dy="32">Telegraf</tspan>
  </text>

  
  
  <rect x="50" y="925" width="270" height="115" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(65, 955)">
    <circle cx="25" cy="27" r="20" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="25" cy="27" r="11" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="25" cy="27" r="3" fill="#207448"/>
  </g>
  <text x="128" y="992" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">Best for</text>

  
  <rect x="340" y="925" width="390" height="115" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="535" y="975" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="535" dy="0">configuration with</tspan>
    <tspan x="535" dy="32">transactions</tspan>
  </text>

  
  <rect x="750" y="925" width="390" height="115" rx="10" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
  <text x="945" y="992" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">simple CRUD</text>

  
  <rect x="1160" y="925" width="390" height="115" rx="10" fill="#fdf3e7" stroke="#db8129" stroke-width="3"/>
  <text x="1355" y="992" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#db8129">high-rate telemetry</text>

  
  <rect x="50" y="1065" width="1500" height="85" rx="14" fill="#207448"/>
  <text x="800" y="1118" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Choose NETCONF when you need transactions, and gNMI for high-rate telemetry</text>
</svg>