<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1165" viewBox="0 0 1600 1165">
  <title>Layers of fleet management</title>
  <desc>Architecture infographic illustrating the six layers of fleet management: Provisioning, Configuration delivery, Workload placement, Connectivity, Identity and policy, and Observability and ops.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 8 L 0 14 Z" fill="#207448"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#303a36" flood-opacity="0.08"/>
    </filter>
  </defs>

  
  <rect width="100%" height="100%" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Layers of fleet management</text>

  
  
  
  <g id="layer-1">
    <rect x="50" y="80" width="1500" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1 Provisioning</text>

    
    <g transform="translate(70, 138)" filter="url(#card-shadow)">
      <rect width="465" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polygon points="24,4 44,14 24,24 4,14" />
        <polygon points="24,24 44,34 24,44 4,34" />
        <line x1="4" y1="14" x2="4" y2="34" />
        <line x1="44" y1="14" x2="44" y2="34" />
        <line x1="24" y1="24" x2="24" y2="44" />
      </g>
      <text x="86" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Terraform or OpenTofu</text>
    </g>

    
    <g transform="translate(565, 138)" filter="url(#card-shadow)">
      <rect width="470" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="24" cy="14" r="8" fill="#e8f1ea" />
        <circle cx="10" cy="38" r="6" />
        <circle cx="38" cy="38" r="6" />
        <line x1="18" y1="20" x2="13" y2="32" />
        <line x1="30" y1="20" x2="35" y2="32" />
      </g>
      <text x="86" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Cluster API</text>
    </g>

    
    <g transform="translate(1065, 138)" filter="url(#card-shadow)">
      <rect width="465" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(20, 16)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M12,36 A10,10 0 0,1 12,18 A14,14 0 0,1 36,16 A12,12 0 0,1 42,36 Z" />
        <circle cx="27" cy="27" r="3" fill="#207448" />
      </g>
      <text x="86" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="86" dy="0">Managed services:</tspan>
        <tspan x="86" dy="28">GKE, EKS, AKS</tspan>
      </text>
    </g>
  </g>

  
  <line x1="800" y1="235" x2="800" y2="268" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  
  
  <g id="layer-2">
    <rect x="50" y="270" width="1500" height="155" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="308" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2 Configuration delivery</text>

    
    <g transform="translate(70, 328)" filter="url(#card-shadow)">
      <rect width="710" height="80" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
      
      <g transform="translate(24, 16)" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="12" cy="12" r="5" fill="#fff8f0" />
        <circle cx="12" cy="36" r="5" fill="#fff8f0" />
        <circle cx="36" cy="18" r="5" fill="#fff8f0" />
        <line x1="12" y1="17" x2="12" y2="31" />
        <path d="M12,28 C12,18 36,28 36,23" />
      </g>
      <text x="86" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Git source of truth</text>
    </g>

    
    <g transform="translate(820, 328)" filter="url(#card-shadow)">
      <rect width="710" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(24, 16)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M38,20 A16,16 0 0,0 12,16 L6,16" />
        <polyline points="10,10 4,16 10,22" />
        <path d="M10,28 A16,16 0 0,0 36,32 L42,32" />
        <polyline points="38,26 44,32 38,38" />
      </g>
      <text x="86" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Argo CD ApplicationSets or Flux</text>
    </g>
  </g>

  
  <line x1="270" y1="425" x2="270" y2="473" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="425" x2="800" y2="473" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="1330" y1="425" x2="1330" y2="473" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  
  
  <g id="layer-5">
    <rect x="50" y="475" width="440" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="80" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">5 Identity and policy</text>

    
    <g transform="translate(70, 560)" filter="url(#card-shadow)">
      <rect width="400" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(176, 26)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="6" y="4" width="36" height="46" rx="4" />
        <circle cx="24" cy="20" r="7" />
        <path d="M12,40 C12,32 36,32 36,40" />
        <line x1="18" y1="10" x2="30" y2="10" />
      </g>
      <text x="200" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="200" dy="0">Workload identity,</tspan>
        <tspan x="200" dy="34">SPIFFE, OIDC</tspan>
      </text>
    </g>

    
    <g transform="translate(70, 835)" filter="url(#card-shadow)">
      <rect width="400" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(176, 32)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M24,4 L42,12 L42,26 C42,38 24,48 24,48 C24,48 6,38 6,26 L6,12 Z" />
        <polyline points="15,24 21,30 33,18" />
      </g>
      <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="200" dy="0">Kyverno or Gatekeeper,</tspan>
        <tspan x="200" dy="34">RBAC baselines</tspan>
      </text>
    </g>
  </g>

  
  
  
  
  <g id="layer-3">
    <rect x="525" y="475" width="550" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="555" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3 Workload placement</text>

    
    <g transform="translate(545, 532)" filter="url(#card-shadow)">
      <rect width="510" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(18, 14)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="4" y="6" width="10" height="12" rx="2" />
        <rect x="18" y="6" width="10" height="12" rx="2" />
        <rect x="32" y="6" width="10" height="12" rx="2" />
        <path d="M4,28 L42,28" />
        <polyline points="36,24 42,28 36,32" />
      </g>
      <text x="80" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Kueue MultiKueue</text>
    </g>

    
    <g transform="translate(545, 614)" filter="url(#card-shadow)">
      <rect width="510" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(18, 14)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="23" cy="21" r="7" fill="#e8f1ea" />
        <circle cx="8" cy="8" r="4" />
        <circle cx="38" cy="8" r="4" />
        <circle cx="8" cy="34" r="4" />
        <circle cx="38" cy="34" r="4" />
        <line x1="12" y1="11" x2="18" y2="16" />
        <line x1="34" y1="11" x2="28" y2="16" />
        <line x1="12" y1="31" x2="18" y2="26" />
        <line x1="34" y1="31" x2="28" y2="26" />
      </g>
      <text x="80" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Karmada or OCM</text>
    </g>

    
    <g transform="translate(545, 696)" filter="url(#card-shadow)">
      <rect width="510" height="70" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(18, 14)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="23" cy="21" r="16" />
        <polyline points="23,11 23,21 31,25" />
      </g>
      <text x="80" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Schedulers per cluster</text>
    </g>
  </g>

  
  <line x1="800" y1="785" x2="800" y2="823" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="layer-4">
    <rect x="525" y="825" width="550" height="300" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="555" y="865" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4 Connectivity</text>

    
    <g transform="translate(545, 882)" filter="url(#card-shadow)">
      <rect width="510" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(18, 44)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="6" cy="24" r="5" />
        <circle cx="24" cy="6" r="5" />
        <circle cx="42" cy="24" r="5" />
        <circle cx="24" cy="42" r="5" />
        <line x1="10" y1="21" x2="20" y2="10" />
        <line x1="28" y1="10" x2="38" y2="21" />
        <line x1="38" y1="27" x2="28" y2="38" />
        <line x1="20" y1="38" x2="10" y2="27" />
        <line x1="11" y1="24" x2="37" y2="24" />
      </g>
      <text x="78" y="38" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="78" dy="0">ClusterMesh, Submariner,</tspan>
        <tspan x="78" dy="32">mesh multi-cluster,</tspan>
        <tspan x="78" dy="32">plain VPN or peering</tspan>
      </text>
    </g>

    
    <g transform="translate(545, 1029)" filter="url(#card-shadow)">
      <rect width="510" height="80" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(18, 16)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="24" cy="24" r="18" />
        <ellipse cx="24" cy="24" rx="8" ry="18" />
        <line x1="6" y1="24" x2="42" y2="24" />
      </g>
      <text x="78" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Global DNS and load balancing</text>
    </g>
  </g>

  
  
  
  <g id="layer-6">
    <rect x="1110" y="475" width="440" height="650" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="1140" y="515" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">6 Observability and ops</text>

    
    <g transform="translate(1130, 560)" filter="url(#card-shadow)">
      <rect width="400" height="230" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(176, 26)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="4" y="4" width="40" height="30" rx="3" />
        <polyline points="8,22 16,14 24,24 32,12 40,20" />
        <line x1="16" y1="42" x2="32" y2="42" />
        <line x1="24" y1="34" x2="24" y2="42" />
      </g>
      <text x="200" y="146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="200" dy="0">Metrics federation,</tspan>
        <tspan x="200" dy="34">central logs, tracing</tspan>
      </text>
    </g>

    
    <g transform="translate(1130, 835)" filter="url(#card-shadow)">
      <rect width="400" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(176, 32)" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M6,16 C12,10 18,22 24,16 C30,10 36,22 42,16" />
        <path d="M6,28 C12,22 18,34 24,28 C30,22 36,34 42,28" />
        <line x1="24" y1="44" x2="24" y2="36" />
        <polyline points="18,40 24,34 30,40" />
      </g>
      <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="200" dy="0">Wave-based upgrades,</tspan>
        <tspan x="200" dy="34">drift detection</tspan>
      </text>
    </g>
  </g>
</svg>