<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140">
  <title>Stream Processor Polymorphism with Interchangeable Readers and Writers</title>
  <desc>Architecture diagram illustrating polymorphic stream processing with interchangeable data sources and sinks.</desc>

  <defs>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#207448" />
    </marker>
    <marker id="inheritance-arrow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <polygon points="0,2 14,8 0,14" fill="#ffffff" stroke="#207448" stroke-width="2" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Stream Processor Polymorphism with</text>
  <text x="800" y="122" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Interchangeable Readers and Writers</text>

  
  <rect x="50" y="155" width="450" height="575" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(75, 175)">
    <rect x="0" y="4" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="0" y="20" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="0" y="36" width="48" height="12" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="10" cy="10" r="2" fill="#207448" />
    <circle cx="10" cy="26" r="2" fill="#207448" />
    <circle cx="10" cy="42" r="2" fill="#207448" />
  </g>
  <text x="140" y="212" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Data Sources</text>

  
  <rect x="75" y="245" width="400" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="275" y="288" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Reader</text>

  
  <line x1="275" y1="355" x2="275" y2="324" stroke="#207448" stroke-width="2" marker-end="url(#inheritance-arrow)" />

  
  <rect x="75" y="355" width="400" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(425, 370)">
    <path d="M 0 0 L 22 0 L 32 10 L 32 38 L 0 38 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <polyline points="22,0 22,10 32,10" fill="none" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="95" y="392" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">FileReader</text>
  <text x="95" y="432" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">read()</tspan> reading local files</text>

  
  <rect x="75" y="475" width="400" height="110" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(425, 490)">
    <rect x="4" y="10" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="10" y1="0" x2="10" y2="10" stroke="#207448" stroke-width="2.5" />
    <line x1="22" y1="0" x2="22" y2="10" stroke="#207448" stroke-width="2.5" />
    <path d="M 16 34 L 16 42" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="95" y="510" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">SocketReader</text>
  <text x="95" y="546" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">read()</tspan></text>
  <text x="95" y="573" font-family="sans-serif" font-size="24" fill="#303a36">reading network sockets</text>

  
  <rect x="75" y="600" width="400" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(425, 615)">
    <path d="M 6 24 A 8 8 0 0 1 20 12 A 10 10 0 0 1 34 18 A 6 6 0 0 1 32 30 L 8 30 A 6 6 0 0 1 6 24 Z" fill="none" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="95" y="635" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">FtpReader</text>
  <text x="95" y="675" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">read()</tspan> reading FTP streams</text>

  
  <rect x="530" y="155" width="540" height="575" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(555, 175)">
    <rect x="6" y="6" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="0" x2="14" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="0" x2="24" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="0" x2="34" y2="6" stroke="#207448" stroke-width="3" />
    <line x1="14" y1="42" x2="14" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="42" x2="24" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="34" y1="42" x2="34" y2="48" stroke="#207448" stroke-width="3" />
  </g>
  <text x="620" y="212" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Core Loop</text>

  
  <rect x="555" y="245" width="490" height="65" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="800" y="287" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">processor(reader, converter, writer)</text>

  
  <rect x="555" y="340" width="490" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="595" cy="392" r="22" fill="#207448" />
  <text x="595" y="400" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="635" y="380" font-family="monospace" font-size="24" fill="#303a36">data = reader.read()</text>
  <text x="635" y="415" font-family="monospace" font-size="24" fill="#303a36">(break if empty)</text>

  
  <rect x="555" y="465" width="490" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="595" cy="512" r="22" fill="#207448" />
  <text x="595" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="635" y="522" font-family="monospace" font-size="24" fill="#303a36">data = converter(data)</text>

  
  <rect x="555" y="580" width="490" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <circle cx="595" cy="627" r="22" fill="#207448" />
  <text x="595" y="635" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="635" y="637" font-family="monospace" font-size="24" fill="#303a36">writer.write(data)</text>

  
  <rect x="1100" y="155" width="450" height="575" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1125, 175)">
    <path d="M 4 8 L 18 8 L 24 14 L 44 14 L 44 42 L 4 42 Z" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="24" y1="24" x2="24" y2="34" stroke="#207448" stroke-width="3" />
    <polyline points="18,29 24,35 30,29" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="1190" y="212" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Data Sinks</text>

  
  <rect x="1125" y="315" width="400" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1470, 335)">
    <path d="M 0 0 L 20 0 L 28 8 L 28 34 L 0 34 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <line x1="8" y1="18" x2="20" y2="18" stroke="#207448" stroke-width="2.5" />
    <line x1="8" y1="24" x2="16" y2="24" stroke="#207448" stroke-width="2.5" />
  </g>
  <text x="1155" y="365" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">FileWriter</text>
  <text x="1155" y="420" font-family="monospace" font-size="24" fill="#303a36">write()</text>

  
  <rect x="1125" y="515" width="400" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(1470, 535)">
    <text x="0" y="26" font-family="monospace" font-size="28" font-weight="bold" fill="#207448">{ }</text>
  </g>
  <text x="1155" y="565" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">JsonWriter</text>
  <text x="1155" y="620" font-family="monospace" font-size="24" fill="#303a36">write()</text>

  
  <line x1="500" y1="392" x2="528" y2="392" stroke="#207448" stroke-width="3" marker-end="url(#green-arrow)" />
  <line x1="1070" y1="627" x2="1098" y2="627" stroke="#207448" stroke-width="3" marker-end="url(#green-arrow)" />

  
  
  <rect x="50" y="760" width="880" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  <rect x="75" y="785" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="490" y="835" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">processor(FileReader(...), converter, FileWriter(...))</text>

  <rect x="75" y="885" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="490" y="935" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">processor(SocketReader(...), converter, FileWriter(...))</text>

  <rect x="75" y="985" width="830" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="490" y="1035" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">processor(FtpReader(...), converter, JsonWriter(...))</text>

  
  <rect x="960" y="760" width="590" height="340" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />

  
  <g transform="translate(995, 795)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="20" y1="18" x2="20" y2="28" stroke="#db8129" stroke-width="3" />
    <circle cx="20" cy="11" r="2.5" fill="#db8129" />
  </g>

  
  <text x="995" y="870" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="995" dy="0">The processing loop relies solely on</tspan>
    <tspan x="995" dy="42">the polymorphic read() and write()</tspan>
    <tspan x="995" dy="42">interface without inspecting</tspan>
    <tspan x="995" dy="42">concrete object types.</tspan>
  </text>
</svg>