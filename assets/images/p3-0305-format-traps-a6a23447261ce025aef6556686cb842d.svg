<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Data format cheat sheet: purpose, safe call and trap</title>
  <desc>Infographic comparing JSON, YAML, TOML, CSV, INI, and Parquet data formats with safe calls, common traps, validation rules, and time handling.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="40" y="52" font-size="40" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="40" dy="0">Data format cheat sheet:</tspan>
    <tspan x="40" dy="46">purpose, safe call and trap</tspan>
  </text>

  
  <g>
    <rect x="40" y="112" width="1520" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <path d="M72 130 L94 164 L50 164 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="72" y1="143" x2="72" y2="152" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="72" cy="158" r="1.5" fill="#207448" />
    
    <text x="120" y="150" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan>a metrics export contains NaN that the next tool in the chain refuses to read</tspan>
    </text>
  </g>

  
  <g>
    
    <path d="M40 188 h1520 v36 h-1520 z" fill="#207448" />
    <text x="56" y="214" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Format</text>
    <text x="216" y="214" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Use for</text>
    <text x="456" y="214" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Safe call</text>
    <text x="998" y="214" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Trap</text>

    
    <rect x="40" y="188" width="1520" height="692" rx="4" fill="none" stroke="#207448" stroke-width="2" />

    
    <line x1="200" y1="188" x2="200" y2="880" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="440" y1="188" x2="440" y2="880" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="980" y1="188" x2="980" y2="880" stroke="#c0d4c6" stroke-width="1.5" />

    
    <line x1="40" y1="370" x2="1560" y2="370" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="40" y1="530" x2="1560" y2="530" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="40" y1="615" x2="1560" y2="615" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="40" y1="725" x2="1560" y2="725" stroke="#c0d4c6" stroke-width="1.5" />
    <line x1="40" y1="805" x2="1560" y2="805" stroke="#c0d4c6" stroke-width="1.5" />

    
    <rect x="41" y="225" width="1518" height="144" fill="#ffffff" />
    <text x="56" y="304" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">JSON</text>
    <text x="216" y="290" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="216" dy="0">machine</tspan>
      <tspan x="216" dy="28">interchange</tspan>
    </text>
    <text x="456" y="272" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="456" dy="0">json.loads, json.dumps(data,</tspan>
      <tspan x="456" dy="27">  indent=2, sort_keys=True,</tspan>
      <tspan x="456" dy="27">  ensure_ascii=False,</tspan>
      <tspan x="456" dy="27">  default=str)</tspan>
    </text>
    <text x="998" y="270" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="998" dy="0">float precision, large integers,</tspan>
      <tspan x="998" dy="26">NaN, duplicate keys; JSON Lines</tspan>
      <tspan x="998" dy="26">for streaming: for line in</tspan>
      <tspan x="998" dy="26" font-family="ui-monospace, monospace">open(events.jsonl): json.loads(line)</tspan>
    </text>

    
    <rect x="41" y="371" width="1518" height="158" fill="#fbfdfb" />
    <rect x="981" y="371" width="578" height="158" fill="#fdf6ee" />
    <text x="56" y="454" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">YAML</text>
    <text x="216" y="440" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="216" dy="0">configs people</tspan>
      <tspan x="216" dy="28">edit by hand</tspan>
    </text>
    <text x="456" y="408" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="456" dy="0">yaml.safe_load,</tspan>
      <tspan x="456" dy="26">yaml.safe_dump(sort_keys=False),</tspan>
      <tspan x="456" dy="26">yaml.safe_load_all for multi-</tspan>
      <tspan x="456" dy="26">document manifests; ruamel.yaml</tspan>
      <tspan x="456" dy="26">preserves comments</tspan>
    </text>
    <text x="998" y="416" font-size="24" fill="#db8129" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="998" dy="0">never yaml.load on untrusted input</tspan>
      <tspan x="998" dy="28">(arbitrary object construction);</tspan>
      <tspan x="998" dy="28">the Norway problem:</tspan>
      <tspan x="998" dy="28">region: no becomes boolean False</tspan>
    </text>

    
    <rect x="41" y="531" width="1518" height="83" fill="#ffffff" />
    <text x="56" y="580" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">TOML</text>
    <text x="216" y="580" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">tool settings</text>
    <text x="456" y="568" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="456" dy="0">tomllib.loads (read-only stdlib</tspan>
      <tspan x="456" dy="28">since 3.11; tomli-w to write)</tspan>
    </text>
    <text x="998" y="580" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">no stdlib writer</text>

    
    <rect x="41" y="616" width="1518" height="108" fill="#fbfdfb" />
    <text x="56" y="675" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">CSV</text>
    <text x="216" y="675" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">tabular exports</text>
    <text x="456" y="660" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="456" dy="0">csv.DictReader and DictWriter</tspan>
      <tspan x="456" dy="28">with newline="" and encoding</tspan>
    </text>
    <text x="998" y="656" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="998" dy="0">spreadsheets may use utf-8-sig</tspan>
      <tspan x="998" dy="27">or cp1252; large data: pandas</tspan>
      <tspan x="998" dy="27">(chapter 3.10)</tspan>
    </text>

    
    <rect x="41" y="726" width="1518" height="78" fill="#ffffff" />
    <text x="56" y="770" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">INI</text>
    <text x="216" y="770" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">legacy config</text>
    <text x="456" y="756" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="456" dy="0">configparser:</tspan>
      <tspan x="456" dy="28">cp[db].getint(port, fallback=5432)</tspan>
    </text>
    <text x="998" y="770" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">-</text>

    
    <rect x="41" y="806" width="1518" height="73" fill="#fbfdfb" />
    <text x="56" y="836" font-size="24" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">
      <tspan x="56" dy="0">Parquet or</tspan>
      <tspan x="56" dy="26">JSON Lines</tspan>
    </text>
    <text x="216" y="850" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">large datasets</text>
    <text x="456" y="850" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">-</text>
    <text x="998" y="850" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">-</text>
  </g>

  
  <g>
    <rect x="40" y="895" width="1520" height="75" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <path d="M72 911 L92 920 C92 942 72 954 72 954 C72 954 52 942 52 920 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    
    <text x="120" y="927" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="120" dy="0">validate parsed data with a schema or pydantic; handle JSONDecodeError and</tspan>
      <tspan x="120" dy="27">YAMLError with file and line context; never eval data</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="985" width="1520" height="142" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="72" cy="1056" r="22" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="72,1044 72,1056 82,1056" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="120" y="1015" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="120" dy="0" font-family="ui-monospace, monospace">datetime.now(timezone.utc)</tspan>
      <tspan> for aware datetimes;</tspan>
      <tspan x="120" dy="27" font-family="ui-monospace, monospace">time.monotonic()</tspan>
      <tspan> for durations, immune to clock changes; </tspan>
      <tspan font-family="ui-monospace, monospace">time.time()</tspan>
      <tspan> wall clock; </tspan>
      <tspan font-family="ui-monospace, monospace">time.perf_counter()</tspan>
      <tspan> for benchmarks;</tspan>
      <tspan x="120" dy="27" font-family="ui-monospace, monospace">zoneinfo.ZoneInfo(Europe/Berlin)</tspan>
      <tspan> for time zones; </tspan>
      <tspan font-family="ui-monospace, monospace">datetime.fromisoformat</tspan>
      <tspan> and ISO 8601 with a timezone;</tspan>
      <tspan x="120" dy="27">store UTC and log in UTC; avoid naive datetimes</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1142" width="1520" height="50" rx="8" fill="#207448" />
    
    <circle cx="68" cy="1167" r="14" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <polyline points="61,1167 66,1172 76,1162" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="100" y="1175" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
      <tspan>Choose each format for its purpose, and parse with the safe call</tspan>
    </text>
  </g>
</svg>