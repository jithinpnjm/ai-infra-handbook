<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The canary ladder moves traffic up in steps, and each step must pass its gates</title>
  <desc>Visual infographic explaining the canary traffic staircase, latency and quality gates, promote, hold, and rollback decisions.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The canary ladder moves traffic up in steps, </tspan>
    <tspan x="800" dy="56">and each step must pass its gates</tspan>
  </text>
  <g id="latency-gates">
    <rect x="40" y="150" width="730" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(65, 182)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="28,14 28,28 40,28" />
    </g>
    <text x="140" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Latency gates</text>
    <text x="140" y="226" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="140" dy="0">canary TTFT p99 and ITL p99 </tspan>
      <tspan x="140" dy="30">against baseline, ratio limit</tspan>
    </text>
  </g>
  <g id="quality-gates">
    <rect x="830" y="150" width="735" height="120" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <g transform="translate(855, 182)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <polyline points="20,26 26,32 36,20" />
    </g>
    <text x="930" y="190" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Quality gates</text>
    <text x="930" y="226" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="930" dy="0">eval score, finish_reason length share, </tspan>
      <tspan x="930" dy="30">error rate</tspan>
    </text>
  </g>
  <g id="step-1">
    <rect x="40.0" y="640.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="74.0" cy="676.0" r="22" fill="#207448" />
    <text x="74.0" y="684.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(136.0, 656.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 32 C 6 18 16 8 26 8 C 36 8 46 18 46 32" stroke-dasharray="4,3" />
      <circle cx="26" cy="18" r="4" fill="#207448" />
      <line x1="12" y1="36" x2="40" y2="36" />
    </g>
    <text x="119.0" y="722.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="119.0" dy="0">Shadow</tspan>
      <tspan x="119.0" dy="32">traffic</tspan>
    </text>
  </g>
  <g id="step-2">
    <rect x="302.0" y="580.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="336.0" cy="616.0" r="22" fill="#207448" />
    <text x="336.0" y="624.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(398.0, 596.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="24" y1="24" x2="24" y2="10" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    <text x="381.0" y="662.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="381.0" dy="0">1</tspan>
      <tspan x="381.0" dy="32">percent</tspan>
    </text>
  </g>
  <g id="step-3">
    <rect x="564.0" y="520.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="598.0" cy="556.0" r="22" fill="#207448" />
    <text x="598.0" y="564.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(660.0, 536.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="24" y1="24" x2="31" y2="12" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    <text x="643.0" y="602.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="643.0" dy="0">5</tspan>
      <tspan x="643.0" dy="32">percent</tspan>
    </text>
  </g>
  <g id="step-4">
    <rect x="826.0" y="460.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="860.0" cy="496.0" r="22" fill="#207448" />
    <text x="860.0" y="504.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(922.0, 476.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="24" y1="24" x2="38" y2="24" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    <text x="905.0" y="542.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="905.0" dy="0">25</tspan>
      <tspan x="905.0" dy="32">percent</tspan>
    </text>
  </g>
  <g id="step-5">
    <rect x="1088.0" y="400.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1122.0" cy="436.0" r="22" fill="#207448" />
    <text x="1122.0" y="444.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(1184.0, 416.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <line x1="24" y1="24" x2="24" y2="38" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    <text x="1167.0" y="482.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1167.0" dy="0">50</tspan>
      <tspan x="1167.0" dy="32">percent</tspan>
    </text>
  </g>
  <g id="step-6">
    <rect x="1350.0" y="340.0" width="158.0" height="120.0" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="1384.0" cy="376.0" r="22" fill="#207448" />
    <text x="1384.0" y="384.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
    <g transform="translate(1446.0, 356.0)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <circle cx="24" cy="24" r="9" />
      <circle cx="24" cy="24" r="3" fill="#207448" />
    </g>
    <text x="1429.0" y="422.0" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1429.0" dy="0">100</tspan>
      <tspan x="1429.0" dy="32">percent</tspan>
    </text>
  </g>
  <g id="gate-diamond-1">
    <polygon points="250.0,632.0 302.0,670.0 250.0,708.0 198.0,670.0" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="250.0" y="668.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="250.0" dy="0">gates</tspan>
      <tspan x="250.0" dy="26">pass</tspan>
    </text>
  </g>
  <g id="gate-diamond-2">
    <polygon points="512.0,572.0 564.0,610.0 512.0,648.0 460.0,610.0" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="512.0" y="608.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="512.0" dy="0">gates</tspan>
      <tspan x="512.0" dy="26">pass</tspan>
    </text>
  </g>
  <g id="gate-diamond-3">
    <polygon points="774.0,512.0 826.0,550.0 774.0,588.0 722.0,550.0" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="774.0" y="548.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="774.0" dy="0">gates</tspan>
      <tspan x="774.0" dy="26">pass</tspan>
    </text>
  </g>
  <g id="gate-diamond-4">
    <polygon points="1036.0,452.0 1088.0,490.0 1036.0,528.0 984.0,490.0" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="1036.0" y="488.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1036.0" dy="0">gates</tspan>
      <tspan x="1036.0" dy="26">pass</tspan>
    </text>
  </g>
  <g id="gate-diamond-5">
    <polygon points="1298.0,392.0 1350.0,430.0 1298.0,468.0 1246.0,430.0" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="1298.0" y="428.0" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="1298.0" dy="0">gates</tspan>
      <tspan x="1298.0" dy="26">pass</tspan>
    </text>
  </g>
  <g id="outcome-promote">
    <rect x="40" y="840" width="480" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <g transform="translate(65, 865)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <polyline points="18,28 24,34 38,20" />
    </g>
    <text x="145" y="902" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Promote</text>
    <text x="280" y="960" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="280" dy="0">all gates passed, </tspan>
      <tspan x="280" dy="30">enough traffic</tspan>
    </text>
  </g>
  <g id="outcome-hold">
    <rect x="555" y="840" width="480" height="180" rx="14" fill="#f0f2f0" stroke="#707874" stroke-width="2.5" />
    <g transform="translate(580, 865)" stroke="#707874" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <line x1="22" y1="18" x2="22" y2="38" />
      <line x1="34" y1="18" x2="34" y2="38" />
    </g>
    <text x="660" y="902" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Hold</text>
    <text x="795" y="960" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="795" dy="0">marginal results or </tspan>
      <tspan x="795" dy="30">too few requests</tspan>
    </text>
  </g>
  <g id="outcome-rollback">
    <rect x="1070" y="840" width="495" height="180" rx="14" fill="#fff9f2" stroke="#db8129" stroke-width="3" />
    <g transform="translate(1095, 865)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24" />
      <path d="M 18 24 L 28 14 L 38 24" />
      <path d="M 28 16 V 36" />
    </g>
    <text x="1175" y="902" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">Rollback</text>
    <text x="1317" y="960" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1317" dy="0">hard failure such as </tspan>
      <tspan x="1317" dy="30">quality drop or zero tokens</tspan>
    </text>
  </g>
  <!-- Arrow 1: Down arrow from gate row to Rollback (hard failure) -->
  <line x1="1555" y1="270" x2="1555" y2="838" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <rect x="1335" y="525" width="205" height="44" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="1437" y="555" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">hard failure</text>
  <!-- Arrow 2: Arrow from Hold back to the same step (wait for more evidence) -->
  <line x1="643.0" y1="840" x2="643.0" y2="642.0" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <rect x="465.0" y="718" width="356" height="44" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="643.0" y="748" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">wait for more evidence</text>
  <g id="takeaway-bar">
    <rect x="40" y="1080" width="1520" height="64" rx="12" fill="#207448" />
    <text x="800" y="1121" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Promote only on a clean pass with enough traffic, hold on thin data, roll back on a hard signal.</text>
  </g>
</svg>