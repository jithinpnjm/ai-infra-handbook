<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>Container Registry Anatomy and Multi-Region Replication</title>
  <desc>Visual explanation of container registry internal architecture and multi-region replication across failure domains.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5"/>

  
  <text x="800" y="58" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Container Registry Anatomy and Multi-Region Replication</text>

  
  <rect x="40" y="90" width="560" height="905" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="320" y="135" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Registry Internal Architecture</text>

  
  <g>
    <rect x="65" y="160" width="510" height="265" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 180)">
      <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3"/>
      <circle cx="10" cy="7" r="2.5" fill="#207448"/>
      <circle cx="18" cy="7" r="2.5" fill="#207448"/>
      <path d="M 16 30 L 24 23 L 16 18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="32" x2="40" y2="32" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="165" y="215" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">API and UI Server</text>
    <text x="90" y="260" font-family="sans-serif" font-size="24" fill="#303a36">implementing OCI Distribution API</text>
    <text x="90" y="298" font-family="monospace" font-size="24" fill="#207448">GET /v2/name/manifests/ref</text>
    <text x="90" y="334" font-family="monospace" font-size="24" fill="#207448">GET /v2/name/blobs/digest</text>
    <text x="90" y="372" font-family="sans-serif" font-size="24" fill="#303a36">chunked blob upload</text>
    <text x="90" y="406" font-family="sans-serif" font-size="24" fill="#303a36">auth token verification</text>
  </g>

  
  <g>
    <rect x="65" y="445" width="510" height="255" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 465)">
      <ellipse cx="28" cy="10" rx="26" ry="9" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 2 10 v 34 c 0 5 11.6 9 26 9 s 26 -4 26 -9 v -34" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 2 21 c 0 5 11.6 9 26 9 s 26 -4 26 -9" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 2 32 c 0 5 11.6 9 26 9 s 26 -4 26 -9" fill="none" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="165" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Metadata Database</text>
    <text x="90" y="550" font-family="sans-serif" font-size="24" fill="#303a36">repository tags</text>
    <text x="320" y="550" font-family="sans-serif" font-size="24" fill="#303a36">RBAC policies</text>
    <text x="90" y="600" font-family="sans-serif" font-size="24" fill="#303a36">image vulnerability scan results</text>
    <text x="90" y="650" font-family="sans-serif" font-size="24" fill="#303a36">manifest index mappings</text>
  </g>

  
  <g>
    <rect x="65" y="720" width="510" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(90, 740)">
      <path d="M 5 12 L 11 48 C 12 52 19 55 28 55 C 37 55 44 52 45 48 L 51 12 Z" fill="none" stroke="#207448" stroke-width="3.5"/>
      <ellipse cx="28" cy="12" rx="23" ry="8" fill="none" stroke="#207448" stroke-width="3.5"/>
      <ellipse cx="28" cy="30" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="2.5"/>
    </g>

    <text x="165" y="775" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Blob Store (S3, GCS, Ceph)</text>
    <text x="90" y="840" font-family="sans-serif" font-size="24" fill="#303a36">content-addressed immutable blobs</text>
    <text x="90" y="900" font-family="monospace" font-size="24" fill="#207448">blobs/sha256/hash</text>
  </g>

  
  <rect x="630" y="90" width="930" height="905" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1095" y="135" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448" text-anchor="middle">Topology Across Failure Domains</text>

  
  <g>
    
    <path d="M 1095 145 L 1095 195" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <text x="1115" y="175" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">CI/CD build pushes</text>

    <rect x="660" y="200" width="870" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(690, 230)">
      <rect x="0" y="10" width="56" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="12" cy="29" r="3" fill="#207448"/>
      <circle cx="24" cy="29" r="3" fill="#207448"/>
      <line x1="36" y1="29" x2="46" y2="29" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 18 10 C 18 2 38 2 38 10" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>

    <text x="765" y="272" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Central Registry in Region A</text>
  </g>

  
  <g>
    <rect x="660" y="440" width="415" height="210" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(685, 470)">
      <rect x="0" y="4" width="46" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="0" y="30" width="46" height="22" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
      <circle cx="10" cy="15" r="2.5" fill="#207448"/>
      <circle cx="10" cy="41" r="2.5" fill="#207448"/>
      <path d="M 38 15 L 48 27 L 38 39" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="755" y="505" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Secondary Registry</text>
    <text x="755" y="542" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">in Region B</text>
  </g>

  
  <g>
    <rect x="1115" y="440" width="415" height="470" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1140, 470)">
      <rect x="4" y="4" width="22" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="30" y="4" width="22" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="17" y="32" width="22" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="15" y1="24" x2="28" y2="32" stroke="#207448" stroke-width="2.5"/>
      <line x1="41" y1="24" x2="28" y2="32" stroke="#207448" stroke-width="2.5"/>
    </g>

    <text x="1210" y="505" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">In-Cluster</text>
    <text x="1210" y="540" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Registry/Cache</text>
    <text x="1210" y="575" font-family="sans-serif" font-size="24" fill="#303a36">in a Shared Services</text>
    <text x="1210" y="610" font-family="sans-serif" font-size="24" fill="#303a36">Cluster</text>
  </g>

  
  <g>
    <rect x="660" y="720" width="415" height="190" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(685, 750)">
      <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="18" y="18" width="20" height="20" fill="none" stroke="#207448" stroke-width="2.5"/>
      <line x1="20" y1="0" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="0" x2="36" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="48" x2="20" y2="56" stroke="#207448" stroke-width="3"/>
      <line x1="36" y1="48" x2="36" y2="56" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="20" x2="8" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="0" y1="36" x2="8" y2="36" stroke="#207448" stroke-width="3"/>
      <line x1="48" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="48" y1="36" x2="56" y2="36" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="755" y="785" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Nodes in Region B</text>
  </g>

  
  <g>
    
    <path d="M 867 320 L 867 432" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
    
    
    <path d="M 1322 320 L 1322 432" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
    
    
    <line x1="867" y1="375" x2="950" y2="375" stroke="#db8129" stroke-width="3"/>
    <line x1="1240" y1="375" x2="1322" y2="375" stroke="#db8129" stroke-width="3"/>

    
    <text x="1095" y="365" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">push replication or</text>
    <text x="1095" y="395" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">webhook-triggered</text>
  </g>

  
  <path d="M 867 650 L 867 712" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)"/>

  
  <rect x="40" y="1020" width="1520" height="95" rx="14" fill="#207448"/>
  <text x="800" y="1058" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Nodes in Region B pull from their local regional mirror rather than crossing the WAN,</text>
  <text x="800" y="1092" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">eliminating cross-region egress costs and surviving central registry outages.</text>
</svg>