<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Deadlock: two locks held in opposite order, and three ways out</title>
  <desc>Visual infographic explaining deadlock wait cycles, synchronization primitives, diagnostic tools, and three remedies.</desc>

  <defs>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#db8129" />
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1,2 L 11,7 L 1,12 Z" fill="#207448" />
    </marker>

    
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b3626" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="800" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#207448" text-anchor="middle">Deadlock: two locks held in opposite order, and three ways out</text>

  
  
  <rect x="50" y="95" width="710" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(80, 118)">
    
    <circle cx="20" cy="20" r="18" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 12,20 L 28,20 M 20,12 L 20,28" stroke="#db8129" stroke-width="3" />
  </g>

  
  <rect x="130" y="145" width="550" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
  
  <rect x="155" y="180" width="50" height="50" rx="8" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="167" y1="180" x2="167" y2="172" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="193" y1="180" x2="193" y2="172" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="167" y1="230" x2="167" y2="238" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="193" y1="230" x2="193" y2="238" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="180" cy="205" r="10" fill="#207448" />

  
  <text x="225" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="225" dy="0">thread 1 holds lock A</tspan>
    <tspan x="225" dy="36">and waits for lock B</tspan>
  </text>

  
  <rect x="130" y="425" width="550" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
  
  <rect x="155" y="460" width="50" height="50" rx="8" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="167" y1="460" x2="167" y2="452" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="193" y1="460" x2="193" y2="452" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="167" y1="510" x2="167" y2="518" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="193" y1="510" x2="193" y2="518" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="180" cy="485" r="10" fill="#207448" />

  
  <text x="225" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="225" dy="0">thread 2 holds lock B</tspan>
    <tspan x="225" dy="36">and waits for lock A</tspan>
  </text>

  
  
  <path d="M 540,280 L 540,422" fill="none" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)" />
  
  
  <path d="M 270,425 L 270,283" fill="none" stroke="#db8129" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)" />

  
  <rect x="235" y="328" width="340" height="50" rx="25" fill="#db8129" filter="url(#card-shadow)" />
  <text x="405" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">everything idle forever</text>


  
  <rect x="790" y="95" width="760" height="510" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="815" y="115" width="710" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
  
  <circle cx="855" cy="187" r="24" fill="#207448" />
  <text x="855" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <text x="900" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="900" dy="0">global lock order: always acquire A</tspan>
    <tspan x="900" dy="36">before B, so no cycle can form</tspan>
  </text>

  
  <rect x="815" y="278" width="710" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
  
  <circle cx="855" cy="350" r="24" fill="#207448" />
  <text x="855" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <text x="900" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="900" dy="0">acquire with timeouts: give up,</tspan>
    <tspan x="900" dy="36">release, retry</tspan>
  </text>

  
  <rect x="815" y="440" width="710" height="145" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
  
  <circle cx="855" cy="512" r="24" fill="#207448" />
  <text x="855" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <text x="900" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="900" dy="0">hold at most one lock</tspan>
  </text>


  
  <g id="primitives-table">
    
    
    <rect x="50" y="630" width="725" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect x="75" y="667" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 83,667 L 83,656 A 9 9 0 0 1 101,656 L 101,667" fill="none" stroke="#207448" stroke-width="3" />
    <text x="130" y="694" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">Lock: with lock:</text>

    
    <rect x="800" y="630" width="750" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="835" cy="685" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="835" y1="685" x2="845" y2="675" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="870" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="870" dy="0" font-family="monospace" font-weight="bold">Semaphore or BoundedSemaphore:</tspan>
      <tspan x="870" dy="34">limit access to N resources (connection limits)</tspan>
    </text>

    
    
    <rect x="50" y="755" width="725" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect x="75" y="792" width="34" height="26" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 83,792 L 83,781 A 9 9 0 0 1 101,781 L 101,792" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 70,805 A 24 24 0 0 1 92,767" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <text x="130" y="802" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">RLock:</tspan> same thread may acquire repeatedly
    </text>

    
    <rect x="800" y="755" width="750" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <line x1="822" y1="785" x2="822" y2="835" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="848" y1="785" x2="848" y2="835" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="822" y1="810" x2="848" y2="810" stroke="#207448" stroke-width="3" />
    <text x="870" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">Barrier:</tspan> rendezvous N threads
    </text>

    
    
    <rect x="50" y="880" width="725" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <path d="M 80,935 L 80,895 L 105,907 L 80,919" fill="#207448" stroke="#207448" stroke-width="2" />
    <text x="130" y="924" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0"><tspan font-family="monospace" font-weight="bold">Event:</tspan> set, clear, wait(timeout);</tspan>
      <tspan x="130" dy="34">shutdown signals</tspan>
    </text>

    
    <rect x="800" y="880" width="750" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="835" cy="935" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="835,924 835,935 843,935" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="870" y="943" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace" font-weight="bold">Timer:</tspan> run after a delay
    </text>

    
    
    <rect x="50" y="1005" width="725" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <circle cx="85" cy="1072" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 76,1072 L 82,1078 L 94,1066" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="130" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0"><tspan font-family="monospace" font-weight="bold">Condition:</tspan></tspan>
      <tspan x="130" dy="34">wait_for(predicate) under a lock</tspan>
    </text>

    
    <rect x="800" y="1005" width="750" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect x="815" y="1058" width="14" height="28" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    <rect x="833" y="1058" width="14" height="28" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    <rect x="851" y="1058" width="14" height="28" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="880" y="1048" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="880" dy="0" font-weight="bold">queue.Queue, LifoQueue,</tspan>
      <tspan x="880" dy="33" font-weight="bold">PriorityQueue, SimpleQueue:</tspan>
      <tspan x="880" dy="33" font-family="system-ui, -apple-system, sans-serif" font-weight="normal">maxsize bounds, task_done and join</tspan>
    </text>
  </g>

  
  <rect x="50" y="1165" width="1500" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="85" cy="1212" r="16" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="97" y1="1224" x2="110" y2="1237" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  
  <text x="135" y="1203" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="135" dy="0">faulthandler.dump_traceback_later(60), py-spy dump,</tspan>
    <tspan x="135" dy="34">threading.enumerate(), sys._current_frames()</tspan>
  </text>

  
  <rect x="50" y="1285" width="1500" height="75" rx="12" fill="#207448" />
  <text x="800" y="1332" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Ordering the locks removes the cycle</text>

</svg>