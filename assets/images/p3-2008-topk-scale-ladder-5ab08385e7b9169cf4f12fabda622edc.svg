<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Top error endpoints: three layers as the log gets bigger</title>
  <desc>Visual explanation of scaling error endpoint aggregation from a single-line parse pipeline to three architectural layers: in-memory Counter, bounded heap, and hash-based sharding.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="50" y="62" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Top error endpoints: three layers as the log gets bigger</text>

  
  
  

  
  <rect x="48" y="100" width="460" height="970" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(68, 120)">
    <rect width="420" height="230" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <g transform="translate(344, 16)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="46" rx="6" />
      <path d="M 12 16 L 22 23 L 12 30" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="26" y1="30" x2="42" y2="30" stroke-linecap="round" />
    </g>

    
    <text x="24" y="104" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">parse: 10.0.0.7 - GET /v1/chat 503 12ms</text>

    
    <g transform="translate(20, 134)">
      
      <rect x="0" y="0" width="120" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="60" y="42" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">address</text>
      
      
      <rect x="130" y="0" width="120" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="190" y="42" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">status</text>
      
      
      <rect x="260" y="0" width="120" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
      <text x="320" y="42" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">latency</text>
    </g>
  </g>

  
  <line x1="278" y1="350" x2="278" y2="400" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(68, 400)">
    <rect width="420" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    
    <g transform="translate(344, 16)" stroke="#207448" stroke-width="3" fill="none">
      <polygon points="6,6 50,6 34,26 34,46 22,52 22,26" stroke-linejoin="round" />
    </g>

    
    <text x="210" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">keep 5xx only</text>
  </g>

  
  <line x1="278" y1="550" x2="278" y2="600" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g transform="translate(68, 600)">
    <rect width="420" height="150" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="44" cy="44" r="24" fill="#207448" />
    <text x="44" y="53" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    
    <g transform="translate(344, 16)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="6" width="48" height="42" rx="4" />
      <line x1="16" y1="16" x2="16" y2="38" stroke-linecap="round" />
      <line x1="26" y1="16" x2="26" y2="38" stroke-linecap="round" />
      <line x1="36" y1="16" x2="36" y2="38" stroke-linecap="round" />
      <line x1="10" y1="36" x2="42" y2="18" stroke-linecap="round" />
    </g>

    
    <text x="210" y="112" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">count by endpoint</text>
  </g>

  
  <g transform="translate(68, 780)">
    <rect width="420" height="268" rx="12" fill="#f5f8f5" stroke="#207448" stroke-dasharray="8,6" stroke-width="2" />
    
    
    <g transform="translate(24, 20)" stroke="#207448" stroke-width="3" fill="none">
      <line x1="28" y1="8" x2="28" y2="44" stroke-linecap="round" />
      <line x1="10" y1="18" x2="46" y2="18" stroke-linecap="round" />
      <path d="M 10 18 L 4 36 L 16 36 Z" />
      <path d="M 46 18 L 40 36 L 52 36 Z" />
      <line x1="18" y1="44" x2="38" y2="44" stroke-linecap="round" />
    </g>

    
    <text x="24" y="94" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">ties go to the alphabetically</tspan>
      <tspan x="24" dy="34">smaller endpoint, key = negative</tspan>
      <tspan x="24" dy="34">count then name via heapq.nsmallest;</tspan>
      <tspan x="24" dy="34">most_common gives first-seen order</tspan>
    </text>
  </g>

  
  
  

  
  <g transform="translate(548, 100)">
    <rect width="1004" height="200" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(32, 24)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="56" height="56" rx="8" />
      <line x1="0" y1="28" x2="56" y2="28" />
      <line x1="28" y1="0" x2="28" y2="56" />
      <circle cx="14" cy="14" r="4" fill="#207448" />
      <circle cx="42" cy="14" r="4" fill="#207448" />
      <circle cx="14" cy="42" r="4" fill="#207448" />
      <circle cx="42" cy="42" r="4" fill="#207448" />
    </g>

    
    <text x="108" y="62" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Counter, then take the top k</text>
    
    
    <rect x="32" y="96" width="940" height="80" rx="8" fill="#e8f1ea" />
    <text x="52" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="52" dy="0">fine at any log size when the endpoint set is bounded; memory depends on</tspan>
      <tspan x="52" dy="32">distinct endpoints, not lines</tspan>
    </text>
  </g>

  
  <g transform="translate(1050, 300)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    <rect x="20" y="16" width="310" height="48" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="175" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">too many keys to sort</text>
  </g>

  
  <g transform="translate(548, 380)">
    <rect width="1004" height="200" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(32, 24)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="12" r="8" />
      <circle cx="12" cy="44" r="8" />
      <circle cx="44" cy="44" r="8" />
      <line x1="22" y1="18" x2="16" y2="38" />
      <line x1="34" y1="18" x2="40" y2="38" />
    </g>

    
    <text x="108" y="62" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Heap of size k over the counts</text>

    
    <rect x="32" y="96" width="940" height="80" rx="8" fill="#e8f1ea" />
    <text x="52" y="130" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="52" dy="0">keeps only k items; counting is linear in n and the heap step is about n log k</tspan>
      <tspan x="52" dy="32">in the worst case</tspan>
    </text>
  </g>

  
  <g transform="translate(1050, 580)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    
    <rect x="20" y="16" width="460" height="48" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="250" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">distinct endpoints no longer fit in memory</text>
  </g>

  
  <g transform="translate(548, 660)">
    <rect width="1004" height="410" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(32, 22)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="10" />
      <circle cx="10" cy="14" r="6" />
      <circle cx="46" cy="14" r="6" />
      <circle cx="28" cy="50" r="6" />
      <line x1="15" y1="18" x2="20" y2="22" />
      <line x1="41" y1="18" x2="36" y2="22" />
      <line x1="28" y1="38" x2="28" y2="44" />
    </g>

    
    <text x="108" y="60" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Shard by a hash of the endpoint</text>

    
    <rect x="580" y="24" width="392" height="48" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    <text x="776" y="56" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">my reasoning, not a Nebius answer</text>

    
    <g transform="translate(32, 100)">
      
      <g transform="translate(0, 0)">
        <rect width="280" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <text x="140" y="62" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">worker 1</text>
      </g>

      
      <g transform="translate(330, 0)">
        <rect width="280" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <text x="140" y="62" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">worker 2</text>
      </g>

      
      <g transform="translate(660, 0)">
        <rect width="280" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
        <text x="140" y="62" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">worker 3</text>
      </g>
    </g>

    
    <line x1="172" y1="210" x2="320" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="502" y1="210" x2="502" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <line x1="832" y1="210" x2="684" y2="280" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g transform="translate(182, 280)">
      <rect width="640" height="96" rx="12" fill="#207448" />
      <text x="320" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">merge the per-worker top k lists</text>
    </g>
  </g>

  
  
  
  <g transform="translate(48, 1100)">
    <rect width="1504" height="64" rx="10" fill="#207448" />
    <text x="752" y="42" font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">When the parameters change, say what assumption in your solution just broke.</text>
  </g>

</svg>