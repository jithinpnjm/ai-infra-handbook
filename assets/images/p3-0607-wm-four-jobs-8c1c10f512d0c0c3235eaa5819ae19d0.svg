<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>What a workload manager does and its three parts</title>
  <desc>Infographic explaining what a workload manager does across four jobs and its three architectural parts, with contrast between batch systems and service orchestrators.</desc>

  
  <rect width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">What a workload manager does and its three parts</text>

  

  
  <g id="job-1">
    <rect x="40" y="110" width="362" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="68" y="138" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="90" cy="160" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="60" y1="150" x2="68" y2="150" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="170" x2="68" y2="170" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="150" x2="120" y2="150" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="170" x2="120" y2="170" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="130" x2="80" y2="138" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="130" x2="100" y2="138" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="182" x2="80" y2="190" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="182" x2="100" y2="190" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="136" y="156" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">1 Resource</text>
    <text x="136" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">management:</text>
    
    <text x="64" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">know what exists</tspan>
      <tspan x="64" dy="30">(nodes, CPUs,</tspan>
      <tspan x="64" dy="30">memory, GPUs,</tspan>
      <tspan x="64" dy="30">licences) and</tspan>
      <tspan x="64" dy="30">what is in use, and</tspan>
      <tspan x="64" dy="30">enforce that jobs</tspan>
      <tspan x="64" dy="30">use only what they</tspan>
      <tspan x="64" dy="30">were given</tspan>
    </text>
  </g>

  
  <g id="job-2">
    <rect x="426" y="110" width="362" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <circle cx="476" cy="160" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="476,146 476,160 488,160" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="476" y1="134" x2="476" y2="138" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="476" y1="182" x2="476" y2="186" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="450" y1="160" x2="454" y2="160" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="498" y1="160" x2="502" y2="160" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="522" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">2 Scheduling:</text>
    
    <text x="450" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="450" dy="0">decide who runs</tspan>
      <tspan x="450" dy="32">where and when from</tspan>
      <tspan x="450" dy="32">queue, priorities,</tspan>
      <tspan x="450" dy="32">limits, fairness</tspan>
      <tspan x="450" dy="32">and the shape of</tspan>
      <tspan x="450" dy="32">each request</tspan>
    </text>
  </g>

  
  <g id="job-3">
    <rect x="812" y="110" width="362" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M856,182 L852,170 L860,140 Q866,134 872,140 L880,170 L876,182 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="866" y1="152" x2="866" y2="162" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M852,170 L842,176 L846,184 L854,180" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M880,170 L890,176 L886,184 L878,180" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    
    <text x="908" y="156" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">3 Launching</text>
    <text x="908" y="190" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">and control:</text>
    
    <text x="836" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="836" dy="0">start the program</tspan>
      <tspan x="836" dy="32">on chosen nodes,</tspan>
      <tspan x="836" dy="32">set up environment,</tspan>
      <tspan x="836" dy="32">track every process,</tspan>
      <tspan x="836" dy="32">clean up when it</tspan>
      <tspan x="836" dy="32">ends or is killed</tspan>
    </text>
  </g>

  
  <g id="job-4">
    <rect x="1198" y="110" width="362" height="370" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="1226" y="138" width="40" height="48" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="1234" y1="150" x2="1258" y2="150" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1234" y1="162" x2="1258" y2="162" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="1234" y1="174" x2="1248" y2="174" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="1294" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">4 Accounting:</text>
    
    <text x="1222" y="232" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1222" dy="0">record who used</tspan>
      <tspan x="1222" dy="32">what for how long,</tspan>
      <tspan x="1222" dy="32">to bill, enforce</tspan>
      <tspan x="1222" dy="32">quotas, balance</tspan>
      <tspan x="1222" dy="32">fairness and answer</tspan>
      <tspan x="1222" dy="32">why my job died</tspan>
    </text>
  </g>

  

  
  <g id="part-queue-manager">
    <rect x="40" y="520" width="362" height="620" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M68,552 L116,552 L116,584 L102,584 L98,592 L86,592 L82,584 L68,584 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="76" y1="562" x2="108" y2="562" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="76" y1="572" x2="100" y2="572" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="136" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">queue</text>
    <text x="136" y="600" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">manager:</text>
    
    <text x="64" y="642" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="64" dy="0">front desk, accepts</tspan>
      <tspan x="64" dy="34">a job, shows state</tspan>
      <tspan x="64" dy="34">of queues and jobs</tspan>
    </text>
  </g>

  
  <g id="part-scheduler">
    <rect x="426" y="520" width="362" height="620" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
    
    <circle cx="476" cy="570" r="14" fill="none" stroke="#db8129" stroke-width="4"/>
    <circle cx="476" cy="570" r="4" fill="#db8129"/>
    <line x1="476" y1="548" x2="476" y2="554" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="476" y1="586" x2="476" y2="592" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="454" y1="570" x2="460" y2="570" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="492" y1="570" x2="498" y2="570" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="461" y1="555" x2="465" y2="559" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="487" y1="581" x2="491" y2="585" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="461" y1="585" x2="465" y2="581" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <line x1="487" y1="559" x2="491" y2="555" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    
    <text x="522" y="578" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">scheduler:</text>
    
    <text x="450" y="630" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="450" dy="0">decides when a job</tspan>
      <tspan x="450" dy="32">starts and which</tspan>
      <tspan x="450" dy="32">resources;</tspan>
      <tspan x="450" dy="32">first-come</tspan>
      <tspan x="450" dy="32">first-served leaves</tspan>
      <tspan x="450" dy="32">processors idle while</tspan>
      <tspan x="450" dy="32">a large job waits;</tspan>
      <tspan x="450" dy="32">a complex scheduler</tspan>
      <tspan x="450" dy="32">can take tens of</tspan>
      <tspan x="450" dy="32">minutes to produce</tspan>
      <tspan x="450" dy="32">a plan</tspan>
    </text>
  </g>

  
  <g id="part-agents">
    <rect x="812" y="520" width="362" height="620" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <rect x="836" y="556" width="52" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="850" cy="572" r="3" fill="#207448"/>
    <circle cx="862" cy="572" r="3" fill="#207448"/>
    <line x1="872" y1="572" x2="880" y2="572" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M848,556 L848,546 Q862,542 876,546 L876,556" fill="none" stroke="#207448" stroke-width="3"/>
    
    <text x="904" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">agents on</text>
    <text x="904" y="600" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">compute nodes:</text>
    
    <text x="836" y="642" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="836" dy="0">help start and</tspan>
      <tspan x="836" dy="34">watch a job; stop</tspan>
      <tspan x="836" dy="34">processes a crashed</tspan>
      <tspan x="836" dy="34">or withdrawn job</tspan>
      <tspan x="836" dy="34">left behind so a</tspan>
      <tspan x="836" dy="34">dead job does not</tspan>
      <tspan x="836" dy="34">hold a node</tspan>
    </text>
  </g>

  
  <g id="side-contrast">
    <rect x="1198" y="520" width="362" height="620" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <path d="M1226,554 L1250,554 L1250,566 L1266,550 L1250,534 L1250,546 L1226,546 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1266,580 L1242,580 L1242,568 L1226,584 L1242,600 L1242,588 L1266,588 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    
    <text x="1286" y="566" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Slurm is a</text>
    <text x="1286" y="600" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">batch system:</text>
    
    <text x="1222" y="634" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1222" dy="0">you describe nodes,</tspan>
      <tspan x="1222" dy="30">GPUs and time,</tspan>
      <tspan x="1222" dy="30">submit, and the</tspan>
      <tspan x="1222" dy="30">request waits in the</tspan>
      <tspan x="1222" dy="30">queue until it can</tspan>
      <tspan x="1222" dy="30">get exactly that</tspan>
      <tspan x="1222" dy="30">all at once;</tspan>
      <tspan x="1222" dy="30">Kubernetes is built</tspan>
      <tspan x="1222" dy="30">to scale long-running</tspan>
      <tspan x="1222" dy="30">services where</tspan>
      <tspan x="1222" dy="30">capacity exceeds</tspan>
      <tspan x="1222" dy="30">demand, not for</tspan>
      <tspan x="1222" dy="30">network topology,</tspan>
      <tspan x="1222" dy="30">job priorities or</tspan>
      <tspan x="1222" dy="30">queuing</tspan>
    </text>
  </g>
</svg>