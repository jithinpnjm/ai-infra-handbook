<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" width="1600" height="1420">
  <title>Standalone LDAP Connection Storm Versus Node-Local SSSD Caching at Scale</title>
  <desc>Architecture failure cascade during job-launch storms on standalone LDAP versus mitigation through node-local SSSD caching.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#5c6f66" />
    </marker>
  </defs>

  
  <rect width="1600" height="1420" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#303a36">
    Standalone LDAP Connection Storm
  </text>
  <text x="800" y="108" text-anchor="middle" font-family="sans-serif" font-size="34px" font-weight="bold" fill="#207448">
    Versus Node-Local SSSD Caching at Scale
  </text>

  
  
  
  <g id="top-panel">
    <rect x="40" y="130" width="1520" height="580" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="40" y="130" width="1520" height="56" rx="16" fill="#207448" />
    <rect x="40" y="166" width="1520" height="20" fill="#207448" />
    <text x="70" y="170" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">
      The Job-Launch Storm on Standalone LDAP
    </text>

    
    <rect x="70" y="210" width="450" height="470" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="95" y="235" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="95" y1="252" x2="141" y2="252" stroke="#207448" stroke-width="3" />
    <circle cx="107" cy="244" r="3" fill="#207448" />
    <circle cx="107" cy="260" r="3" fill="#207448" />
    <text x="155" y="262" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      500 Compute Nodes
    </text>

    
    <rect x="95" y="290" width="400" height="54" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="115" y="326" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">
      gpu001
    </text>
    <text x="250" y="326" font-family="sans-serif" font-size="24px" fill="#5c6f66">
      through
    </text>
    <text x="375" y="326" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">
      gpu500
    </text>

    
    <rect x="95" y="360" width="400" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="115" y="394" font-family="sans-serif" font-size="24px" fill="#303a36">
      Process execution at t=0:
    </text>
    <text x="115" y="428" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">
      getpwnam(alice)
    </text>

    
    <rect x="95" y="465" width="400" height="190" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="2.5" />
    <text x="115" y="502" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
      Slurm Step Launch Failure:
    </text>
    <text x="115" y="540" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">
      slurmstepd: error:
    </text>
    <text x="115" y="574" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">
      user alice not found
    </text>
    <text x="115" y="620" font-family="sans-serif" font-size="24px" fill="#303a36">
      Queries timeout; jobs aborted
    </text>

    
    <g id="storm-arrows">
      
      <line x1="520" y1="310" x2="1030" y2="400" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
      <line x1="520" y1="360" x2="1030" y2="420" stroke="#db8129" stroke-width="3" />
      <line x1="520" y1="400" x2="1030" y2="445" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
      <line x1="520" y1="440" x2="1030" y2="470" stroke="#db8129" stroke-width="3" />
      <line x1="520" y1="480" x2="1030" y2="490" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

      
      <rect x="555" y="280" width="445" height="100" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      <text x="777" y="318" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
        500 concurrent TCP/TLS
      </text>
      <text x="777" y="354" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">
        connection storm at time t=0
      </text>
    </g>

    
    <rect x="1050" y="210" width="480" height="470" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="1080" y="235" width="40" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1080" y1="250" x2="1120" y2="250" stroke="#207448" stroke-width="2" />
    <line x1="1080" y1="265" x2="1120" y2="265" stroke="#207448" stroke-width="2" />
    <circle cx="1108" cy="242" r="3" fill="#207448" />
    <circle cx="1108" cy="257" r="3" fill="#207448" />
    <circle cx="1108" cy="272" r="3" fill="#207448" />

    <text x="1135" y="258" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
      Central Standalone LDAP Server
    </text>
    <text x="1135" y="288" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">
      (port 636)
    </text>

    
    <rect x="1075" y="320" width="430" height="330" rx="10" fill="#f5f8f5" stroke="#5c6f66" stroke-width="1.5" />
    
    <rect x="1095" y="345" width="390" height="110" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="1115" y="380" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
      Worker Thread Pool:
    </text>
    <text x="1115" y="414" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
      64 threads (saturated)
    </text>
    <text x="1115" y="442" font-family="sans-serif" font-size="24px" fill="#5c6f66">
      Active threads maxed out
    </text>

    <rect x="1095" y="475" width="390" height="150" rx="8" fill="#fff5ec" stroke="#db8129" stroke-width="1.5" />
    <text x="1115" y="512" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
      TCP Backlog Overflow:
    </text>
    <text x="1115" y="550" font-family="sans-serif" font-size="24px" fill="#303a36">
      • Connection timeouts
    </text>
    <text x="1115" y="585" font-family="sans-serif" font-size="24px" fill="#303a36">
      • SYN dropped packets
    </text>
  </g>

  
  
  
  <g id="bottom-panel">
    <rect x="40" y="745" width="1520" height="635" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <rect x="40" y="745" width="1520" height="56" rx="16" fill="#207448" />
    <rect x="40" y="781" width="1520" height="20" fill="#207448" />
    <text x="70" y="785" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">
      Mitigation via Node-Local SSSD Caching
    </text>

    
    <rect x="70" y="825" width="940" height="525" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
    <rect x="95" y="845" width="46" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="95" y1="862" x2="141" y2="862" stroke="#207448" stroke-width="3" />
    <circle cx="107" cy="854" r="3" fill="#207448" />
    <circle cx="107" cy="870" r="3" fill="#207448" />
    
    <text x="155" y="872" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      Each Compute Node (Node-Local Resolution)
    </text>

    
    <rect x="95" y="905" width="410" height="95" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="125" cy="935" r="15" fill="#207448" />
    <text x="125" y="943" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">1</text>
    <text x="155" y="940" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">Process initiates query:</text>
    <text x="155" y="976" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">getpwnam(alice)</text>

    
    <path d="M 300 1000 L 300 1045" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="95" y="1050" width="890" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <circle cx="125" cy="1085" r="15" fill="#207448" />
    <text x="125" y="1093" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">2</text>
    <text x="155" y="1082" font-family="sans-serif" font-size="24px" fill="#303a36">NSS module delegates via local Unix domain socket:</text>
    <text x="155" y="1120" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">/var/run/sssd/sssd.pipe</text>

    
    <path d="M 300 1140 L 300 1175" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="95" y="1180" width="890" height="150" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <circle cx="125" cy="1215" r="15" fill="#207448" />
    <text x="125" y="1223" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">3</text>
    <text x="155" y="1215" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#207448">SSSD Daemon</text>
    <text x="345" y="1215" font-family="sans-serif" font-size="24px" fill="#303a36">performs in-memory LDB database lookup:</text>
    <text x="155" y="1255" font-family="monospace" font-size="26px" font-weight="bold" fill="#207448">/var/lib/sss/db/cache_cluster.ldb</text>
    <text x="155" y="1300" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
      Result: &lt; 1 ms lookup | 0 network round trips | immediate launch
    </text>

    
    <rect x="1080" y="825" width="450" height="525" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="1110" y="845" width="40" height="46" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="1110" y1="860" x2="1150" y2="860" stroke="#207448" stroke-width="2" />
    <line x1="1110" y1="875" x2="1150" y2="875" stroke="#207448" stroke-width="2" />
    <circle cx="1138" cy="852" r="3" fill="#207448" />
    <circle cx="1138" cy="867" r="3" fill="#207448" />
    <circle cx="1138" cy="882" r="3" fill="#207448" />

    <text x="1165" y="870" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
      Central Standalone LDAP Server
    </text>
    <text x="1165" y="900" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">
      (port 636)
    </text>

    
    <rect x="1110" y="930" width="390" height="150" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="1130" y="970" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
      Zero Query Storm
    </text>
    <text x="1130" y="1008" font-family="sans-serif" font-size="24px" fill="#303a36">
      • Thread pool idle/ready
    </text>
    <text x="1130" y="1042" font-family="sans-serif" font-size="24px" fill="#303a36">
      • TCP backlog queue clean
    </text>

    
    <path d="M 985 1240 L 1080 1240" fill="none" stroke="#5c6f66" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-grey)" />
    <rect x="1110" y="1120" width="390" height="190" rx="8" fill="#f5f8f5" stroke="#5c6f66" stroke-width="1.5" />
    <text x="1130" y="1160" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">
      Background Sync:
    </text>
    <text x="1130" y="1200" font-family="sans-serif" font-size="24px" fill="#5c6f66">
      Single periodic dashed arrow:
    </text>
    <text x="1130" y="1235" font-family="sans-serif" font-size="24px" fill="#5c6f66">
      asynchronous cache refresh
    </text>
    <text x="1130" y="1270" font-family="sans-serif" font-size="24px" fill="#207448">
      completely eliminates storms
    </text>
  </g>
</svg>