<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1170" width="1600" height="1170">
  <title>The Nagle and delayed ACK deadlock: about 40 ms added to a small request</title>
  <desc>Sequence diagram illustrating the deadlock between Nagle algorithm on the sender and delayed ACK on the receiver causing a 40 ms latency penalty, along with three fixes.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1170" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">The Nagle and delayed ACK deadlock:</tspan>
    <tspan x="800" dy="56">about 40 ms added to a small request</tspan>
  </text>

  
  
  <rect x="120" y="160" width="340" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="140" y="180" width="42" height="38" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="140" y1="192" x2="182" y2="192" stroke="#207448" stroke-width="3" />
  <circle cx="149" cy="186" r="2.5" fill="#207448" />
  <circle cx="157" cy="186" r="2.5" fill="#207448" />
  <text x="196" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Sender (Nagle on)</text>

  
  <rect x="670" y="160" width="370" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="690" y="178" width="42" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="690" y="202" width="42" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3" />
  <circle cx="722" cy="187" r="2.5" fill="#207448" />
  <circle cx="722" cy="211" r="2.5" fill="#207448" />
  <text x="746" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Receiver (delayed ACK)</text>

  
  <line x1="290" y1="240" x2="290" y2="1030" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.35" />
  <line x1="855" y1="240" x2="855" y2="1030" stroke="#207448" stroke-width="3" stroke-dasharray="8,8" opacity="0.35" />

  
  <circle cx="90" cy="305" r="24" fill="#207448" />
  <text x="90" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <line x1="290" y1="305" x2="847" y2="305" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="420" y="275" width="310" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="575" y="304" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">send a 4-byte header</text>

  
  <circle cx="90" cy="400" r="24" fill="#207448" />
  <text x="90" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <rect x="130" y="365" width="330" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <path d="M 152 396 A 10 10 0 0 1 172 396 L 172 404 L 152 404 Z" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="146" y="404" width="32" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="150" y="460">
    <tspan x="150" dy="0" font-weight="bold">send a 100-byte body:</tspan>
    <tspan x="150" dy="32">held back by Nagle,</tspan>
    <tspan x="150" dy="32">waiting for the ACK</tspan>
    <tspan x="150" dy="32">of the header</tspan>
  </text>

  
  <circle cx="1035" cy="455" r="24" fill="#207448" />
  <text x="1035" y="463" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <rect x="685" y="420" width="330" height="200" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  <circle cx="715" cy="452" r="16" fill="none" stroke="#207448" stroke-width="3" />
  <polyline points="715,442 715,452 725,452" fill="none" stroke="#207448" stroke-width="3" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="705" y="500">
    <tspan x="705" dy="0" font-weight="bold">delayed ACK:</tspan>
    <tspan x="705" dy="32">waits to send an ACK,</tspan>
    <tspan x="705" dy="32">up to 40 ms on Linux</tspan>
  </text>

  
  <rect x="475" y="455" width="195" height="115" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <path d="M 495 480 C 530 435, 615 435, 650 480" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <path d="M 650 545 C 615 590, 530 590, 495 545" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />
  <text x="572" y="502" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="572" dy="0">each is politely</tspan>
    <tspan x="572" dy="28">waiting for</tspan>
    <tspan x="572" dy="28">the other</tspan>
  </text>

  
  <g transform="translate(130, 660)">
    <rect x="0" y="0" width="885" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <circle cx="45" cy="32" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <polyline points="45,22 45,32 55,32" fill="none" stroke="#207448" stroke-width="3" />
    <text x="442" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">about 40 ms added to the exchange</text>
  </g>

  
  <circle cx="90" cy="790" r="24" fill="#207448" />
  <text x="90" y="798" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <line x1="855" y1="780" x2="298" y2="780" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="460" y="755" width="240" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="580" y="784" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">ACK finally sent</text>

  
  <line x1="290" y1="875" x2="847" y2="875" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="465" y="850" width="230" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="580" y="879" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">body released</text>

  
  <rect x="1080" y="160" width="470" height="870" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <path d="M 1115 185 L 1130 192 L 1130 208 C 1130 220 1115 226 1115 226 C 1115 226 1100 220 1100 208 L 1100 192 Z" fill="none" stroke="#207448" stroke-width="3" />
  <text x="1145" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">Three fixes</text>

  
  <rect x="1100" y="240" width="430" height="195" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="1120" y="280">
    <tspan x="1120" dy="0" font-weight="bold">1 <tspan font-family="monospace">TCP_NODELAY</tspan> disables Nagle</tspan>
    <tspan x="1120" dy="34">in latency-sensitive services:</tspan>
    <tspan x="1120" dy="34">gRPC, Redis clients and</tspan>
    <tspan x="1120" dy="34">NCCL's sockets set it</tspan>
  </text>

  
  <rect x="1100" y="450" width="430" height="235" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="1120" y="490">
    <tspan x="1120" dy="0" font-weight="bold">2 coalesce writes with writev,</tspan>
    <tspan x="1120" dy="34"><tspan font-family="monospace">MSG_MORE</tspan> or <tspan font-family="monospace">TCP_CORK</tspan> instead</tspan>
    <tspan x="1120" dy="34">of splitting a message across</tspan>
    <tspan x="1120" dy="34">several small writes (or one</tspan>
    <tspan x="1120" dy="34">single write)</tspan>
  </text>

  
  <rect x="1100" y="700" width="430" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="1120" y="745">
    <tspan x="1120" dy="0" font-weight="bold">3 <tspan font-family="monospace">TCP_QUICKACK</tspan></tspan>
    <tspan x="1120" dy="34">where it is needed</tspan>
  </text>

  
  <rect x="1100" y="825" width="430" height="185" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <circle cx="1128" cy="852" r="12" fill="none" stroke="#207448" stroke-width="2.5" />
  <line x1="1128" y1="849" x2="1128" y2="858" stroke="#207448" stroke-width="2.5" />
  <circle cx="1128" cy="845" r="1.5" fill="#207448" />
  <text font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" x="1120" y="890">
    <tspan x="1120" dy="0">Receivers acknowledge every</tspan>
    <tspan x="1120" dy="32">second full segment, or after</tspan>
    <tspan x="1120" dy="32">a short wait; quickack modes</tspan>
    <tspan x="1120" dy="32">override</tspan>
  </text>

  
  <rect x="50" y="1065" width="1500" height="70" rx="12" fill="#207448" />
  <text x="800" y="1109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="bold" fill="#ffffff">A notorious latency bug in RPC-style protocols that write twice and then read</text>
</svg>