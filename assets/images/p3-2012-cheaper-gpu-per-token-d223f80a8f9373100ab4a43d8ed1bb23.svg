<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Is the cheaper GPU cheaper per token?</title>
  <desc>Side-by-side worked comparison for Qwen3-8B BF16 at batch 32 with list prices fetched 2026-11-09.</desc>

  <defs>
    
    <g id="icon-chip" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="6"/>
      <rect x="18" y="18" width="20" height="20" rx="3"/>
      <line x1="18" y1="2" x2="18" y2="8"/>
      <line x1="28" y1="2" x2="28" y2="8"/>
      <line x1="38" y1="2" x2="38" y2="8"/>
      <line x1="18" y1="48" x2="18" y2="54"/>
      <line x1="28" y1="48" x2="28" y2="54"/>
      <line x1="38" y1="48" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="8" y2="18"/>
      <line x1="2" y1="28" x2="8" y2="28"/>
      <line x1="2" y1="38" x2="8" y2="38"/>
      <line x1="48" y1="18" x2="54" y2="18"/>
      <line x1="48" y1="28" x2="54" y2="28"/>
      <line x1="48" y1="38" x2="54" y2="38"/>
    </g>

    
    <g id="icon-bandwidth" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="14" width="44" height="28" rx="4"/>
      <line x1="15" y1="14" x2="15" y2="42"/>
      <line x1="28" y1="14" x2="28" y2="42"/>
      <line x1="41" y1="14" x2="41" y2="42"/>
      <path d="M 10 6 L 28 6 L 46 6"/>
      <polyline points="22,2 28,6 22,10"/>
      <path d="M 10 50 L 28 50 L 46 50"/>
      <polyline points="34,46 28,50 34,54"/>
    </g>

    
    <g id="icon-gauge" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 42 A 22 22 0 1 1 48 42"/>
      <circle cx="28" cy="38" r="4" fill="#207448"/>
      <line x1="28" y1="38" x2="40" y2="22"/>
      <line x1="12" y1="28" x2="16" y2="28"/>
      <line x1="28" y1="12" x2="28" y2="16"/>
      <line x1="44" y1="28" x2="40" y2="28"/>
    </g>

    
    <g id="icon-tokens" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="20" height="20" rx="3"/>
      <rect x="30" y="10" width="20" height="20" rx="3"/>
      <rect x="18" y="26" width="20" height="20" rx="3"/>
      <path d="M 12 36 L 12 46 L 44 46 L 44 36"/>
    </g>

    
    <g id="icon-cost-orange" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22"/>
      <circle cx="28" cy="28" r="14"/>
      <line x1="28" y1="10" x2="28" y2="14"/>
      <line x1="28" y1="42" x2="28" y2="46"/>
      <line x1="10" y1="28" x2="14" y2="28"/>
      <line x1="42" y1="28" x2="46" y2="28"/>
    </g>

    
    <g id="icon-clock" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="30" r="20"/>
      <polyline points="28,18 28,30 38,30"/>
      <line x1="28" y1="4" x2="28" y2="10"/>
      <line x1="22" y1="4" x2="34" y2="4"/>
    </g>

    
    <g id="icon-budget" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="12" width="44" height="32" rx="4"/>
      <line x1="22" y1="12" x2="22" y2="44"/>
      <line x1="36" y1="12" x2="36" y2="44"/>
      <rect x="10" y="18" width="8" height="20" rx="2"/>
    </g>

    
    <g id="icon-decode" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="44" height="16" rx="3"/>
      <rect x="6" y="30" width="44" height="16" rx="3"/>
      <polyline points="18,18 24,24 18,30"/>
      <polyline points="32,18 38,24 32,30"/>
    </g>

    
    <g id="icon-prefill" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="30,4 12,30 26,30 20,52 42,22 28,22"/>
    </g>

    
    <g id="icon-calc" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="6" width="36" height="44" rx="4"/>
      <rect x="16" y="12" width="24" height="8" rx="2"/>
      <line x1="16" y1="26" x2="22" y2="26"/>
      <line x1="28" y1="26" x2="34" y2="26"/>
      <line x1="16" y1="34" x2="22" y2="34"/>
      <line x1="28" y1="34" x2="34" y2="34"/>
      <line x1="16" y1="42" x2="34" y2="42"/>
    </g>

    
    <g id="icon-shield" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 V 28 C 48 42 28 52 28 52 C 28 52 8 42 8 28 V 14 Z"/>
      <polyline points="20,28 26,34 38,20"/>
    </g>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Is the cheaper GPU cheaper per token?</text>

  
  <text x="800" y="100" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Side-by-side worked comparison for Qwen3-8B BF16 at batch 32 with list prices fetched 2026-11-09.</text>

  
  <g id="column-h100">
    
    <rect x="50" y="128" width="725" height="896" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <rect id="card-h-hdr" x="70" y="148" width="685" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-chip" x="90" y="158"/>
    <text id="txt-h-hdr" x="170" y="196" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">H100 at $4.50 per GPU-hour</text>

    
    <rect id="card-h1" x="70" y="256" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-bandwidth" x="95" y="285"/>
    <text id="txt-h1" x="175" y="322" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">80 GB, 3.35 TB/s</text>

    
    <rect id="card-h2" x="70" y="402" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-gauge" x="95" y="431"/>
    <text id="txt-h2" x="175" y="468" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">4.66 requests per second</text>

    
    <rect id="card-h3" x="70" y="549" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-tokens" x="95" y="578"/>
    <text id="txt-h3" x="175" y="615" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">about 2,330 output tokens per second</text>

    
    <rect id="card-h4" x="70" y="696" width="685" height="160" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    <use href="#icon-cost-orange" x="95" y="748"/>
    <text id="txt-h4" x="175" y="787" font-family="sans-serif" font-size="28" font-weight="bold" fill="#db8129">$0.54 per million output tokens</text>

    
    <rect id="card-h5" x="70" y="890" width="685" height="114" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-clock" x="95" y="919"/>
    <text id="txt-h5" x="175" y="956" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">latency about 6.9 s per request</text>
  </g>

  
  <g id="column-l40s">
    
    <rect x="825" y="128" width="725" height="896" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>

    
    <rect id="card-l-hdr" x="845" y="148" width="685" height="76" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-chip" x="865" y="158"/>
    <text id="txt-l-hdr" x="945" y="196" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">L40S at $1.55 per GPU-hour</text>

    
    <rect id="card-l1" x="845" y="234" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-bandwidth" x="865" y="252"/>
    <text id="txt-l1" x="940" y="273" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">48 GB at 864 GB/s and</tspan>
      <tspan x="940" dy="27">about 362 dense BF16 TFLOPS</tspan>
    </text>

    
    <rect id="card-l2" x="845" y="336" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-budget" x="865" y="354"/>
    <text id="txt-l2" x="940" y="375" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">budget 48 x 0.9 - 16.4 - 5 =</tspan>
      <tspan x="940" dy="27">21.8 GB = 59 requests</tspan>
    </text>

    
    <rect id="card-l3" x="845" y="438" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-decode" x="865" y="456"/>
    <text id="txt-l3" x="940" y="477" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">decode step (16.4 + 11.796) / 864 =</tspan>
      <tspan x="940" dy="27">32.6 ms so 981 tokens per second</tspan>
    </text>

    
    <rect id="card-l4" x="845" y="540" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-prefill" x="865" y="558"/>
    <text id="txt-l4" x="940" y="579" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">prefill 362e12 x 0.4 / 16.4e9 =</tspan>
      <tspan x="940" dy="27">8,829 tokens per second so 0.2265 s per prompt</tspan>
    </text>

    
    <rect id="card-l5" x="845" y="642" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-gauge" x="865" y="660"/>
    <text id="txt-l5" x="940" y="681" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">GPU seconds per request 0.2265 + 0.5097 =</tspan>
      <tspan x="940" dy="27">0.736 so 1.36 requests per second</tspan>
    </text>

    
    <rect id="card-l6" x="845" y="744" width="685" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-tokens" x="865" y="753"/>
    <text id="txt-l6" x="940" y="790" font-family="sans-serif" font-size="24" fill="#303a36">about 679 output tokens per second</text>

    
    <rect id="card-l7" x="845" y="828" width="685" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-calc" x="865" y="846"/>
    <text id="txt-l7" x="940" y="867" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="940" dy="0">$1.55 / (679 x 3,600) x 1e6 =</tspan>
      <tspan x="940" dy="27">$0.63 per million</tspan>
    </text>

    
    <rect id="card-l8" x="845" y="930" width="685" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <use href="#icon-clock" x="865" y="939"/>
    <text id="txt-l8" x="940" y="976" font-family="sans-serif" font-size="24" fill="#303a36">latency about 24 s per request</text>
  </g>

  
  <g id="takeaway-bar">
    <rect id="card-takeaway" x="50" y="1064" width="1500" height="96" rx="14" fill="#207448"/>
    <use href="#icon-shield" x="75" y="1084"/>
    <text id="txt-takeaway" x="150" y="1106" font-family="sans-serif" font-size="24" fill="#ffffff">
      <tspan x="150" dy="0">the H100 costs less per token even though it costs three times more per hour:</tspan>
      <tspan x="150" dy="30">tokens per second sit in the bottom of the fraction</tspan>
    </text>
  </g>
</svg>