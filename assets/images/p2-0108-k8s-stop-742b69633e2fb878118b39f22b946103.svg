<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Why a pod ignores SIGTERM for 30 seconds: the shell wrapper is PID 1</title>
  <desc>Infographic explaining why a shell wrapper entrypoint prevents SIGTERM forwarding to the application process, leading to a 30-second delay and SIGKILL, compared to an exec entrypoint.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Why a pod ignores SIGTERM for 30 seconds: the shell wrapper is PID 1</text>

  
  
  
  <g id="top-row-panel">
    
    <rect x="35" y="110" width="1530" height="445" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="3.5" />
    <text x="65" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Shell wrapper entrypoint</text>

    
    <rect x="55" y="175" width="235" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="93" cy="213" r="24" fill="#207448" />
    <text x="93" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <rect x="220" y="195" width="48" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="220" y1="207" x2="268" y2="207" stroke="#207448" stroke-width="2" />
    <polyline points="228,217 234,222 228,227" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="238" y1="227" x2="248" y2="227" stroke="#207448" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="70" y="275" fill="#303a36">
      <tspan x="70" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">kubectl</tspan>
      <tspan x="70" dy="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">delete pod:</tspan>
      <tspan x="70" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">Kubernetes</tspan>
      <tspan x="70" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">sends SIGTERM</tspan>
      <tspan x="70" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">to PID 1</tspan>
    </text>

    
    <line x1="290" y1="318" x2="314" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="314" y="175" width="235" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="352" cy="213" r="24" fill="#207448" />
    <text x="352" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <path d="M 480 193 L 506 193 L 518 205 L 518 233 L 480 233 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <polyline points="506,193 506,205 518,205" fill="none" stroke="#207448" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="488" y1="211" x2="502" y2="211" stroke="#207448" stroke-width="2" />
    <line x1="488" y1="219" x2="510" y2="219" stroke="#207448" stroke-width="2" />
    
    <text x="329" y="275" fill="#303a36">
      <tspan x="329" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">sh script</tspan>
      <tspan x="329" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">as PID 1:</tspan>
      <tspan x="329" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">does not</tspan>
      <tspan x="329" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">forward the</tspan>
      <tspan x="329" dy="34" font-family="system-ui, -apple-system, sans-serif" font-size="24">signal</tspan>
    </text>

    
    <line x1="549" y1="318" x2="573" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="573" y="175" width="230" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="611" cy="213" r="24" fill="#207448" />
    <text x="611" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <polygon points="738,207 748,207 758,197 758,229 748,219 738,219" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <line x1="766" y1="205" x2="778" y2="217" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <line x1="778" y1="205" x2="766" y2="217" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    
    <text x="588" y="282" fill="#303a36">
      <tspan x="588" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">python</tspan>
      <tspan x="588" dy="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">train.py</tspan>
      <tspan x="588" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="24">never hears</tspan>
      <tspan x="588" dy="36" font-family="system-ui, -apple-system, sans-serif" font-size="24">SIGTERM</tspan>
    </text>

    
    <line x1="803" y1="318" x2="827" y2="318" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="827" y="175" width="480" height="285" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="865" cy="213" r="24" fill="#207448" />
    <text x="865" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <circle cx="1255" cy="213" r="20" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="1255" y1="189" x2="1255" y2="193" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="1255" y1="213" x2="1255" y2="201" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="1255" y1="213" x2="1255" y2="227" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="1255" cy="213" r="3" fill="#207448" />
    
    <text x="847" y="295" fill="#303a36">
      <tspan x="847" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold">After</tspan>
      <tspan x="847" dy="42" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">terminationGracePeriodSeconds,</tspan>
      <tspan x="847" dy="42" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold">default 30 s</tspan>
    </text>

    
    <line x1="1307" y1="318" x2="1331" y2="318" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

    
    <rect x="1331" y="175" width="214" height="285" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
    
    <circle cx="1369" cy="213" r="24" fill="#db8129" />
    <text x="1369" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <polygon points="1498,197 1516,197 1526,207 1526,221 1516,231 1498,231 1488,221 1488,207" fill="none" stroke="#db8129" stroke-width="3" />
    <line x1="1507" y1="205" x2="1507" y2="217" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="1507" cy="223" r="1.5" fill="#db8129" />
    
    <text x="1346" y="298" fill="#303a36">
      <tspan x="1346" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">SIGKILL,</tspan>
      <tspan x="1346" dy="40" font-family="system-ui, -apple-system, sans-serif" font-size="24">exit code</tspan>
      <tspan x="1346" dy="38" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold">137</tspan>
    </text>

    
    <rect x="55" y="480" width="1490" height="56" rx="8" fill="#f0f4f1" stroke="#8a9a90" stroke-width="1.5" />
    <text x="800" y="516" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Inside a PID namespace, PID 1 with no SIGTERM handler ignores SIGTERM.</text>
  </g>

  
  
  
  <g id="bottom-row-panel">
    
    <rect x="35" y="580" width="1530" height="375" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3.5" />
    <text x="65" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">exec entrypoint</text>

    
    <rect x="55" y="645" width="450" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="93" cy="685" r="24" fill="#207448" />
    <text x="93" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <circle cx="445" cy="685" r="5" fill="#207448" />
    <path d="M 437 677 A 12 12 0 0 0 437 693" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 453 677 A 12 12 0 0 1 453 693" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 429 669 A 23 23 0 0 0 429 701" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <path d="M 461 669 A 23 23 0 0 1 461 701" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="75" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">SIGTERM to PID 1</text>

    
    <line x1="505" y1="757" x2="575" y2="757" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <rect x="575" y="645" width="450" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="613" cy="685" r="24" fill="#207448" />
    <text x="613" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <rect x="948" y="667" width="44" height="36" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <polygon points="962,675 976,685 962,695" fill="#207448" />
    <line x1="978" y1="675" x2="978" y2="695" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="595" y="755" fill="#303a36">
      <tspan x="595" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">exec python train.py:</tspan>
      <tspan x="595" dy="40" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold">Python is PID 1</tspan>
    </text>

    
    <line x1="1025" y1="757" x2="1095" y2="757" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />

    
    <rect x="1095" y="645" width="450" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="1133" cy="685" r="24" fill="#207448" />
    <text x="1133" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <rect x="1465" y="665" width="28" height="40" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <circle cx="1485" cy="685" r="2.5" fill="#207448" />
    <polyline points="1500,680 1508,685 1500,690" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="1490" y1="685" x2="1507" y2="685" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    
    <text x="1115" y="755" fill="#303a36">
      <tspan x="1115" dy="0" font-family="system-ui, -apple-system, sans-serif" font-size="26">Python handles</tspan>
      <tspan x="1115" dy="40" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold">SIGTERM and exits</tspan>
    </text>

    
    <rect x="55" y="885" width="1490" height="50" rx="8" fill="#f0f4f1" stroke="#8a9a90" stroke-width="1.5" />
    <text x="800" y="918" fill="#303a36" text-anchor="middle">
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">Or use </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">tini</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> or </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">--init</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24"> together with </tspan>
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">exec</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif" font-size="24">.</tspan>
    </text>
  </g>

  
  
  
  <g id="caption-bar">
    <rect x="180" y="985" width="1240" height="60" rx="10" fill="#207448" />
    <text x="800" y="1023" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Exit code 137 equals 128 plus 9, which means SIGKILL.</text>
  </g>
</svg>