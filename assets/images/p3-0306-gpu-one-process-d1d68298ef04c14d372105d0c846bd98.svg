<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>One process per GPU, with threads only for I/O</title>
  <desc>Technical infographic illustrating one training process per GPU rank, with DataLoader worker processes, I/O prefetching threads, and NCCL communication.</desc>

  <defs>
    <marker id="arrow-end" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    <marker id="arrow-start" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M 11 2 L 1 7 L 11 12 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="68" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">One process per GPU, with threads only for I/O</text>

  
  <rect x="50" y="105" width="1500" height="725" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(80, 125)">
    <rect x="0" y="0" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="10" y1="14" x2="30" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="10" y1="28" x2="30" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="44" cy="14" r="3" fill="#207448" />
    <circle cx="44" cy="28" r="3" fill="#207448" />
  </g>
  <text x="150" y="156" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">A node with GPU ranks</text>

  
  <rect x="80" y="185" width="1440" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(105, 215)">
    <rect x="0" y="0" width="56" height="50" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <polyline points="12,16 24,25 12,34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="30" y1="34" x2="44" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="180" y="232" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Each GPU box maps to one process (a rank) launched by</text>
  <text x="180" y="274" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">torchrun, accelerate, DeepSpeed, mpirun or Slurm srun</text>

  
  <rect x="80" y="325" width="600" height="480" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(105, 345)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <rect x="105" y="415" width="550" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(125, 435)">
    <ellipse cx="24" cy="10" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4,10 L 4,28 A 20,7 0 0,0 44,28 L 44,10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4,28 L 4,44 A 20,7 0 0,0 44,44 L 44,28" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="185" y="452" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="185" dy="0" font-weight="bold">DataLoader(num_workers=N)</tspan>
    <tspan x="185" dy="32">worker processes decode</tspan>
    <tspan x="185" dy="32">and augment data; tune</tspan>
    <tspan x="185" dy="32">num_workers, prefetch_factor,</tspan>
    <tspan x="185" dy="32">pin_memory, persistent_workers</tspan>
  </text>

  
  <rect x="105" y="635" width="550" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  
  <g transform="translate(125, 655)">
    <path d="M 6,12 Q 24,2 24,18 T 42,24" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <path d="M 6,32 Q 24,22 24,38 T 42,44" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <polyline points="38,20 44,24 38,28" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="38,40 44,44 38,48" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="185" y="675" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="185" dy="0">threads inside a rank</tspan>
    <tspan x="185" dy="32">are for I/O such as</tspan>
    <tspan x="185" dy="32">prefetching, not for</tspan>
    <tspan x="185" dy="32">compute</tspan>
  </text>

  
  <rect x="715" y="465" width="280" height="125" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="855" y="508" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#207448">
    <tspan x="855" dy="0">NCCL handles</tspan>
    <tspan x="855" dy="34">communication</tspan>
    <tspan x="855" dy="34">(Part 14)</tspan>
  </text>
  
  <line x1="685" y1="620" x2="1025" y2="620" stroke="#207448" stroke-width="4" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />

  
  <rect x="1030" y="325" width="490" height="480" rx="14" fill="#f5f8f5" stroke="#207448" stroke-width="3" />
  
  
  <g transform="translate(1055, 345)">
    <rect x="10" y="10" width="36" height="36" rx="4" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <rect x="1055" y="415" width="440" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
  <g transform="translate(1085, 495)">
    <ellipse cx="24" cy="10" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4,10 L 4,28 A 20,7 0 0,0 44,28 L 44,10" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 4,28 L 4,44 A 20,7 0 0,0 44,44 L 44,28" fill="none" stroke="#207448" stroke-width="3" />
  </g>

  
  <rect x="1055" y="635" width="440" height="150" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" stroke-dasharray="8 6" />
  <g transform="translate(1085, 685)">
    <path d="M 6,12 Q 24,2 24,18 T 42,24" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <path d="M 6,32 Q 24,22 24,38 T 42,44" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <polyline points="38,20 44,24 38,28" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="38,40 44,44 38,48" fill="none" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  
  <rect x="50" y="855" width="1500" height="85" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(85, 875)">
    <path d="M 22,4 L 42,40 L 2,40 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
    <line x1="22" y1="18" x2="22" y2="28" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <circle cx="22" cy="34" r="2.5" fill="#db8129" />
  </g>
  <text x="145" y="908" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">avoid forking after CUDA is initialised; watch for memory duplication</text>

  
  <rect x="50" y="965" width="1500" height="75" rx="12" fill="#207448" />
  
  <g transform="translate(85, 982)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="3" />
    <polyline points="10,20 17,27 30,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="800" y="1012" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Keep one process per GPU, and let threads handle only the I/O</text>
</svg>