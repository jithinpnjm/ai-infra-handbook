<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The typed provider layer: enum, frozen dataclass, Protocol and a fake</title>
  <desc>Architecture diagram illustrating State enum, Instance frozen dataclass, Compute Protocol, real cloud client and FakeCompute implementers, ensure_running function, test strip, and the twelve design habits.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The typed provider layer: enum, frozen dataclass, Protocol and a fake</text>

  
  <g id="layer-state">
    <rect x="50" y="85" width="1500" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 91)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="48" height="32" rx="6"/>
      <circle cx="14" cy="24" r="3.5" fill="#207448"/>
      <circle cx="26" cy="24" r="3.5" fill="#207448"/>
      <circle cx="38" cy="24" r="3.5" fill="#207448"/>
    </g>
    <text x="142" y="126" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">State(StrEnum): PENDING, RUNNING, STOPPED</text>
  </g>

  
  <g id="layer-instance">
    <rect x="50" y="155" width="1500" height="62" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 161)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="18" width="36" height="26" rx="4"/>
      <path d="M 16 18 L 16 12 A 10 10 0 0 1 36 12 L 36 18"/>
      <circle cx="26" cy="31" r="2.5" fill="#207448"/>
    </g>
    <text x="142" y="197" font-family="monospace" font-size="25" fill="#303a36">
      <tspan font-size="30" font-weight="bold" fill="#207448">Instance: </tspan>frozen, slots dataclass with id, name, state, ip: str | None = None
    </text>
  </g>

  
  
  <g id="left-implementer">
    <rect x="50" y="227" width="350" height="138" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(70, 268)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 38 A 12 12 0 0 1 12 20 A 16 16 0 0 1 42 16 A 14 14 0 0 1 50 38 Z"/>
    </g>
    <text x="145" y="288" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">a real</tspan>
      <tspan x="145" dy="38">cloud client</tspan>
    </text>
  </g>

  
  <g id="middle-protocol">
    <rect x="420" y="227" width="760" height="138" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(438, 268)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="40" height="40" rx="4"/>
      <line x1="18" y1="2" x2="18" y2="8"/><line x1="28" y1="2" x2="28" y2="8"/><line x1="38" y1="2" x2="38" y2="8"/>
      <line x1="18" y1="48" x2="18" y2="54"/><line x1="28" y1="48" x2="28" y2="54"/><line x1="38" y1="48" x2="38" y2="54"/>
      <line x1="2" y1="18" x2="8" y2="18"/><line x1="2" y1="28" x2="8" y2="28"/><line x1="2" y1="38" x2="8" y2="38"/>
      <line x1="48" y1="18" x2="54" y2="18"/><line x1="48" y1="28" x2="54" y2="28"/><line x1="48" y1="38" x2="54" y2="38"/>
    </g>
    <text x="515" y="263" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="515" dy="0" font-size="30" font-weight="bold" fill="#207448">Compute(Protocol):</tspan>
      <tspan x="515" dy="36">list_instances(project) -&gt; list[Instance];</tspan>
      <tspan x="515" dy="34">start(project, instance_id) -&gt; None</tspan>
    </text>
  </g>

  
  <g id="right-implementer-fake">
    <rect x="1200" y="227" width="350" height="138" rx="12" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(1216, 268)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 6 L 36 6 M 28 6 L 28 18 L 46 44 A 4 4 0 0 1 42 50 L 14 50 A 4 4 0 0 1 10 44 L 28 18 Z"/>
      <line x1="18" y1="38" x2="38" y2="38"/>
    </g>
    <text x="1280" y="258" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1280" dy="0" font-family="monospace" font-size="30" font-weight="bold" fill="#db8129">FakeCompute:</tspan>
      <tspan x="1280" dy="30">instances and</tspan>
      <tspan x="1280" dy="28">started lists,</tspan>
      <tspan x="1280" dy="28">no inheritance</tspan>
    </text>
  </g>

  
  <g id="layer-ensure-running">
    <rect x="50" y="375" width="1500" height="146" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 420)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="12"/>
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 15 15 M 41 41 L 45 45 M 11 45 L 15 41 M 41 11 L 45 15"/>
    </g>
    <text x="142" y="410" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="142" dy="0" font-size="26" font-weight="bold" fill="#207448">ensure_running(c: Compute, project, names: set[str]) -&gt; list[str]:</tspan>
      <tspan x="142" dy="30">    for inst in c.list_instances(project):</tspan>
      <tspan x="142" dy="30">        if inst.name in names and inst.state is not State.RUNNING:</tspan>
      <tspan x="142" dy="30">            c.start(project, inst.id); started.append(inst.name)</tspan>
    </text>
  </g>

  
  <g id="layer-test-strip">
    <rect x="50" y="531" width="1500" height="112" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 559)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 14 L 48 28 C 48 40 28 50 28 50 C 28 50 8 40 8 28 L 8 14 Z"/>
      <polyline points="18,26 25,33 38,18"/>
    </g>
    <text x="142" y="566" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="142" dy="0">FakeCompute([Instance(1, a, STOPPED), Instance(2, b, RUNNING)]);</tspan>
      <tspan x="142" dy="30">ensure_running(fake, p, {a, b}) == [a] and fake.started == [1]:</tspan>
      <tspan x="142" dy="30" font-family="sans-serif" font-weight="bold" fill="#207448">only the stopped instance a needs to start, and no cloud API is touched</tspan>
    </text>
  </g>

  
  <g id="habits-panel">
    <rect x="50" y="653" width="1500" height="472" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <line x1="800" y1="665" x2="800" y2="1113" stroke="#e8f1ea" stroke-width="2.5"/>

    
    <g transform="translate(772, 663)" stroke="#207448" stroke-width="3.5" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="42" rx="6" fill="#ffffff"/>
      <path d="M 18 6 L 18 2 L 38 2 L 38 6"/>
      <line x1="14" y1="18" x2="18" y2="22"/><line x1="18" y1="22" x2="26" y2="14"/>
      <line x1="30" y1="18" x2="44" y2="18"/>
      <line x1="14" y1="30" x2="18" y2="34"/><line x1="18" y1="34" x2="26" y2="26"/>
      <line x1="30" y1="30" x2="44" y2="30"/>
    </g>

    
    
    <text x="75" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">1 </tspan>functions until state or polymorphism appears
    </text>

    
    <text x="75" y="754" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0"><tspan font-weight="bold" fill="#207448">2 </tspan>separate IO from logic:</tspan>
      <tspan x="99" dy="28">functional core, imperative shell</tspan>
    </text>

    
    <text x="75" y="834" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0"><tspan font-weight="bold" fill="#207448">3 </tspan>make illegal states unrepresentable:</tspan>
      <tspan x="99" dy="28">enums, Literals, frozen dataclasses,</tspan>
      <tspan x="99" dy="28">validation at construction</tspan>
    </text>

    
    <text x="75" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0"><tspan font-weight="bold" fill="#207448">4 </tspan>small explicit interfaces:</tspan>
      <tspan x="99" dy="28">depend on a two-method Protocol and inject it</tspan>
    </text>

    
    <text x="75" y="1020" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">5 </tspan>immutable configuration and value objects
    </text>

    
    <text x="75" y="1068" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0"><tspan font-weight="bold" fill="#207448">6 </tspan>errors are part of the API:</tspan>
      <tspan x="99" dy="28">MyOpsError with NodeNotFound beneath it</tspan>
    </text>

    
    
    <text x="830" y="700" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">7 </tspan>avoid deep inheritance: one or two levels
    </text>

    
    <text x="830" y="754" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="830" dy="0"><tspan font-weight="bold" fill="#207448">8 </tspan>enums for fixed choices;</tspan>
      <tspan x="854" dy="28">auto(), Flag for bit flags</tspan>
    </text>

    
    <text x="830" y="834" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">9 </tspan>useful __repr__ and log with %r
    </text>

    
    <text x="830" y="888" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan font-weight="bold" fill="#207448">10 </tspan>no global mutable singletons
    </text>

    
    <text x="830" y="942" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="830" dy="0"><tspan font-weight="bold" fill="#207448">11 </tspan>docstrings and types; deprecate with</tspan>
      <tspan x="866" dy="28">warnings.warn(..., DeprecationWarning)</tspan>
    </text>

    
    <text x="830" y="1022" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="830" dy="0"><tspan font-weight="bold" fill="#207448">12 </tspan>SOLID: one responsibility, registries</tspan>
      <tspan x="866" dy="28">or plugins, contracts, Protocols, injection</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1135" width="1500" height="50" rx="8" fill="#207448"/>
    <text x="800" y="1169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Pass the collaborator in, and the test needs no cloud</text>
  </g>
</svg>