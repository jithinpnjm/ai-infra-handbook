<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" style="background:#f5f8f5;">
  <title>Tail sampling needs two tiers so every span of a trace reaches one sampler</title>
  <desc>Architecture infographic illustrating two-tier tail sampling with edge agents routing by trace ID to stateful tail samplers</desc>

  <defs>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#207448" />
    </marker>
    <marker id="arrow-green-small" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#207448" />
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <polygon points="0 2, 12 7, 0 12" fill="#db8129" />
    </marker>
  </defs>

  
  <text x="800" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    Tail sampling needs two tiers so every
  </text>
  <text x="800" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    span of a trace reaches one sampler
  </text>

  
  <rect x="990" y="150" width="400" height="560" rx="12" fill="#d9e8dc" stroke="#207448" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="980" y="155" width="400" height="560" rx="12" fill="#e0eee3" stroke="#207448" stroke-width="1.5" />

  
  <rect x="40" y="270" width="240" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="132" y="305" width="56" height="46" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <line x1="132" y1="321" x2="188" y2="321" stroke="#207448" stroke-width="3" />
  <circle cx="143" cy="313" r="2.5" fill="#207448" />
  <circle cx="152" cy="313" r="2.5" fill="#207448" />
  <circle cx="161" cy="313" r="2.5" fill="#207448" />
  
  <text x="160" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Engines and
  </text>
  <text x="160" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    gateway emit
  </text>
  <text x="160" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    OTLP spans
  </text>

  
  <line x1="280" y1="430" x2="340" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <circle cx="310" cy="430" r="24" fill="#207448" />
  <text x="310" y="439" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>

  
  <rect x="340" y="160" width="340" height="550" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(370, 182)">
    <circle cx="28" cy="28" r="20" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="28" cy="28" r="8" fill="#207448" />
    <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 16 16 M 40 40 L 45 45 M 11 45 L 16 40 M 40 16 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="445" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Edge agents
  </text>

  
  
  <rect x="365" y="255" width="290" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="510" y="294" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    OTLP receiver
  </text>

  <line x1="510" y1="315" x2="510" y2="335" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-small)" />

  
  <rect x="365" y="335" width="290" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="510" y="374" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    memory_limiter
  </text>

  <line x1="510" y1="395" x2="510" y2="415" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-small)" />

  
  <rect x="365" y="415" width="290" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="510" y="454" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    batch
  </text>

  <line x1="510" y1="475" x2="510" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-small)" />

  
  <rect x="365" y="495" width="290" height="185" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="510" y="535" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    load_balancing
  </text>
  <text x="510" y="568" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    exporter
  </text>
  <rect x="380" y="590" width="260" height="65" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="510" y="632" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
    routing key traceID
  </text>

  
  <line x1="680" y1="430" x2="970" y2="430" stroke="#db8129" stroke-width="6" marker-end="url(#arrow-orange)" />
  <circle cx="825" cy="430" r="24" fill="#207448" />
  <text x="825" y="439" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>

  
  <text x="825" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">
    by trace id
  </text>
  <text x="825" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    every span of
  </text>
  <text x="825" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    one trace reaches
  </text>
  <text x="825" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    the same sampler
  </text>

  
  <rect x="970" y="160" width="400" height="550" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(995, 182)">
    <circle cx="28" cy="28" r="24" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <polyline points="28 14, 28 28, 40 28" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  <text x="1070" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">
    Tail samplers
  </text>

  
  
  <rect x="995" y="255" width="350" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1170" y="292" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    memory_limiter
  </text>

  <line x1="1170" y1="310" x2="1170" y2="328" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-small)" />

  
  <rect x="995" y="328" width="350" height="232" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1170" y="360" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#207448">
    tail_sampling
  </text>
  <line x1="1015" y1="375" x2="1325" y2="375" stroke="#e8f1ea" stroke-width="2" />

  <text x="1015" y="405" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    keep-errors (status ERROR)
  </text>

  <text x="1015" y="460" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    keep-slow
  </text>
  <text x="1015" y="490" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    (latency over 5000 ms)
  </text>

  <text x="1015" y="525" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">
    keep-some-healthy
  </text>
  <text x="1015" y="552" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    (probabilistic 1 percent)
  </text>

  <line x1="1170" y1="560" x2="1170" y2="575" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-small)" />

  
  <rect x="995" y="575" width="350" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1170" y="612" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#303a36">
    batch
  </text>

  
  <line x1="1370" y1="430" x2="1430" y2="430" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <circle cx="1400" cy="430" r="24" fill="#207448" />
  <text x="1400" y="439" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>

  
  <rect x="1430" y="270" width="130" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1467, 340)">
    <path d="M 0 14 A 28 10 0 0 0 56 14 A 28 10 0 0 0 0 14 Z M 0 14 V 50 A 28 10 0 0 0 56 50 V 14" fill="#ffffff" stroke="#207448" stroke-width="4" />
    <path d="M 0 32 A 28 10 0 0 0 56 32" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="1495" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    Trace
  </text>
  <text x="1495" y="490" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    store
  </text>

  
  <rect x="945" y="750" width="450" height="205" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
  <text x="1170" y="795" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    5,000 new traces per second
  </text>
  <text x="1170" y="835" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    times 30 s decision_wait
  </text>
  <text x="1170" y="875" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    equals 150,000 traces held,
  </text>
  <text x="1170" y="915" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">
    num_traces 200,000
  </text>

  
  <rect x="40" y="1005" width="1520" height="120" rx="12" fill="#207448" />
  <text x="800" y="1052" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    Keep every error and slow trace, route by trace id to a stateful tier,
  </text>
  <text x="800" y="1092" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    and size memory from decision wait times trace rate.
  </text>
</svg>