  <text x="295" y="663" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">yes</text>

   E1 -->
  <line x1="500" y1="740" x2="660" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
