<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A layered method</title>
  <desc>A diagnostic decision flow for triage across YAML syntax, connections, task failures, data templates, permissions, and application host issues.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">A layered method</text>

  
  <g id="node-A">
    <rect x="125" y="78" width="300" height="64" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <path d="M 152 127 L 172 89 L 192 127 Z M 172 103 L 172 115 M 172 120 L 172 122" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="121" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Failure</text>
  </g>

  
  <g id="node-B">
    <rect x="50" y="182" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 214)">
      <path d="M 8 4 L 36 4 L 48 16 L 48 52 L 8 52 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 36 4 L 36 16 L 48 16" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 18 30 L 24 36 L 18 42 M 32 42 L 38 42" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="145" y="234" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">Parse error</tspan>
      <tspan x="145" dy="36">before any task?</tspan>
    </text>
  </g>

  <g id="node-B1">
    <rect x="660" y="182" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 214)">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 18 24 L 12 28 L 18 32 M 38 24 L 44 28 L 38 32 M 30 20 L 26 36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="760" y="234" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">YAML / syntax / templating at load:</tspan>
      <tspan x="760" dy="36" font-family="monospace" font-size="24">--syntax-check, yamllint, ansible-lint</tspan>
    </text>
  </g>

  
  <g id="node-C">
    <rect x="50" y="348" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 380)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 14 14 L 42 42" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 28 6 L 28 50 M 6 28 L 50 28" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    <text x="145" y="418" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">UNREACHABLE?</text>
  </g>

  <g id="node-C1">
    <rect x="660" y="348" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 380)">
      <rect x="6" y="10" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="6" y="30" width="44" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="16" cy="18" r="2.5" fill="#207448"/>
      <circle cx="16" cy="38" r="2.5" fill="#207448"/>
      <path d="M 32 18 L 42 18 M 32 38 L 42 38" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="760" y="400" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Connection layer:</tspan>
      <tspan x="760" dy="36" font-family="sans-serif" font-size="24">SSH, DNS, user, key, host key, bastion, port, firewall</tspan>
    </text>
  </g>

  
  <g id="node-D">
    <rect x="50" y="514" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 546)">
      <rect x="10" y="12" width="36" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 20 12 L 20 6 L 36 6 L 36 12" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 20 28 L 36 44 M 36 28 L 20 44" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="145" y="584" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Task FAILED?</text>
  </g>

  <g id="node-H">
    <rect x="660" y="514" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 546)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 16 28 L 24 36 L 40 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="760" y="566" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Succeeded but wrong result:</tspan>
      <tspan x="760" dy="36" font-family="sans-serif" font-size="24">assertions, check mode, idempotency, drift</tspan>
    </text>
  </g>

  
  <g id="node-E">
    <rect x="50" y="680" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 712)">
