      <path d="M 18 20 Q 14 28 18 36 M 22 20 Q 18 28 22 36 M 38 20 Q 42 28 38 36 M 34 20 Q 38 28 34 36" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="145" y="732" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">Message mentions</tspan>
      <tspan x="145" dy="36">variable/template?</tspan>
    </text>
  </g>

  <g id="node-E1">
    <rect x="660" y="680" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 712)">
      <ellipse cx="28" cy="14" rx="20" ry="7" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 14 L 8 42 A 20 7 0 0 0 48 42 L 48 14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 8 28 A 20 7 0 0 0 48 28" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="760" y="732" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Data layer:</tspan>
      <tspan x="760" dy="36" font-family="sans-serif" font-size="24">undefined var, wrong type, precedence</tspan>
    </text>
  </g>

  
  <g id="node-F">
    <rect x="50" y="846" width="450" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(68, 878)">
      <rect x="10" y="22" width="36" height="28" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 18 22 L 18 14 A 10 10 0 0 1 38 14 L 38 22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="28" cy="34" r="3" fill="#207448"/>
      <path d="M 28 37 L 28 43" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="145" y="898" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="145" dy="0">Permission / sudo /</tspan>
      <tspan x="145" dy="36">module error?</tspan>
    </text>
  </g>

  <g id="node-F1">
    <rect x="660" y="846" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 878)">
      <path d="M 28 6 L 46 14 L 46 28 C 46 40 28 50 28 50 C 28 50 10 40 10 28 L 10 14 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 20 28 L 26 34 L 36 22" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="760" y="898" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Privilege/module layer:</tspan>
      <tspan x="760" dy="36" font-family="sans-serif" font-size="24">become, interpreter, module args, target state</tspan>
    </text>
  </g>

  
  <g id="node-G">
    <rect x="660" y="1012" width="890" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(682, 1044)">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 6 18 L 50 18" fill="none" stroke="#207448" stroke-width="3"/>
      <path d="M 14 28 L 20 34 L 14 40 M 26 40 L 36 40" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="760" y="1064" fill="#303a36">
      <tspan x="760" dy="0" font-family="sans-serif" font-size="30" font-weight="bold">Application layer:</tspan>
      <tspan x="760" dy="36" font-family="sans-serif" font-size="24">command failed on host: run it by hand</tspan>
    </text>
  </g>

  
  
