<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
  <title>Reading an IPVS listing: one NodePort, four doors</title>
  <desc>Annotated ipvsadm listing infographic showing four virtual service doors directing traffic to the same real server pods</desc>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 1 L 18 9 L 0 17 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1060" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading an IPVS listing: one NodePort, four doors</text>
  <text x="800" y="98" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">Annotated ipvsadm --list --numeric output</text>

  
  <rect x="40" y="125" width="1520" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 144)">
    <rect x="4" y="8" width="48" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="16" y1="0" x2="16" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="0" x2="28" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="0" x2="40" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="48" x2="16" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="48" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="48" x2="40" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  <text x="145" y="163" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="145" dy="0">ip address show dev kube-ipvs0:</tspan>
    <tspan x="145" dy="32">dummy interface holding /32 addresses such as 10.110.34.183, 10.96.0.10, 10.96.0.1</tspan>
  </text>

  
  
  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="540" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 35)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 2 L 28 10 M 28 46 L 28 54 M 2 28 L 10 28 M 46 28 L 54 28 M 10 10 L 16 16 M 40 40 L 46 46 M 10 46 L 16 40 M 40 16 L 46 10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">TCP 10.0.99.67:30737 rr</tspan>
      <tspan x="95" dy="32">(node IP)</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 395)">
    <rect x="0" y="0" width="540" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 35)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 2 L 28 10 M 28 46 L 28 54 M 2 28 L 10 28 M 46 28 L 54 28 M 10 10 L 16 16 M 40 40 L 46 46 M 10 46 L 16 40 M 40 16 L 46 10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">TCP 10.110.34.183:80 rr</tspan>
      <tspan x="95" dy="32">(ClusterIP)</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 545)">
    <rect x="0" y="0" width="540" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 35)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 2 L 28 10 M 28 46 L 28 54 M 2 28 L 10 28 M 46 28 L 54 28 M 10 10 L 16 16 M 40 40 L 46 46 M 10 46 L 16 40 M 40 16 L 46 10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">TCP 127.0.0.1:30737 rr</tspan>
      <tspan x="95" dy="32">(loopback)</tspan>
    </text>
  </g>

  
  <g transform="translate(40, 695)">
    <rect x="0" y="0" width="540" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 35)">
      <circle cx="28" cy="28" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 28 2 L 28 10 M 28 46 L 28 54 M 2 28 L 10 28 M 46 28 L 54 28 M 10 10 L 16 16 M 40 40 L 46 46 M 10 46 L 16 40 M 40 16 L 46 10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="95" y="55" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="95" dy="0">TCP 192.168.246.64:30737 rr</tspan>
      <tspan x="95" dy="32">(secondary node interface)</tspan>
    </text>
  </g>

  
  <path d="M 580 307 L 680 307 L 680 532" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 580 457 L 680 457" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 580 607 L 680 607" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 580 757 L 680 757 L 680 532" fill="none" stroke="#207448" stroke-width="4" />

  
  <line x1="680" y1="532" x2="1040" y2="532" stroke="#db8129" stroke-width="6" marker-end="url(#arrow-orange)" />

  
  <rect x="710" y="482" width="300" height="100" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3" />
  <text x="860" y="524" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="860" dy="0">four doors into</tspan>
    <tspan x="860" dy="32">the same room</tspan>
  </text>

  
  <rect x="1040" y="245" width="520" height="575" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(1065, 265)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="4" />
    <circle cx="12" cy="7" r="3" fill="#207448" />
    <circle cx="22" cy="7" r="3" fill="#207448" />
    <circle cx="32" cy="7" r="3" fill="#207448" />
  </g>
  <text x="1135" y="297" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">the Service endpoints, i.e. pods</text>

  
  
  <g transform="translate(1065, 335)">
    <rect x="0" y="0" width="470" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 40)">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="48" x2="18" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="48" x2="38" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="85" y="60" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="85" dy="0">192.168.89.153:80</tspan>
      <tspan x="85" dy="32">Masq weight 1</tspan>
    </text>
  </g>

  
  <g transform="translate(1065, 495)">
    <rect x="0" y="0" width="470" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 40)">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="48" x2="18" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="48" x2="38" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="85" y="76" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">192.168.89.154:80</text>
  </g>

  
  <g transform="translate(1065, 655)">
    <rect x="0" y="0" width="470" height="135" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 40)">
      <rect x="6" y="8" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="48" x2="18" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="48" x2="38" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="85" y="76" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">192.168.89.155:80</text>
  </g>

  
  <rect x="40" y="855" width="1520" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="902" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">virtual service = TCP line, real server = indented arrow line, scheduler rr, Forward Masq</text>

  
  <rect x="40" y="955" width="1520" height="75" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="1002" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ipvsadm -Ln, ipvsadm -Lnc, ipset list KUBE-CLUSTER-IP</text>
</svg>