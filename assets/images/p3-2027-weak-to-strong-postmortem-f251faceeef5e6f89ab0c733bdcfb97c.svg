<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Repairing a weak post-mortem</title>
  <desc>Comparison between a weak post-mortem draft and a repaired version across summary, impact, and checkable action items.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="65" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Repairing a weak post-mortem</text>

  
  <g id="process-strip">
    <rect x="40" y="95" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="68" y="133" width="42" height="54" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="78" y1="149" x2="100" y2="149" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="78" y1="161" x2="100" y2="161" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <polyline points="76,173 84,179 98,167" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="135" y="135" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">run the linter first so the problems come from a rule not your mood:</tspan>
      <tspan x="135" dy="32">it reports fifteen findings on the bad fixture, from missing sections to blame language;</tspan>
      <tspan x="135" dy="32">take them in order of value; the good fixture reports zero findings</tspan>
    </text>
  </g>

  
  <g id="column-headers">
    <rect x="230" y="245" width="655" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="557" y="280" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">weak draft</text>

    <rect x="905" y="245" width="655" height="50" rx="8" fill="#207448"/>
    <text x="1232" y="280" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">repaired</text>
  </g>

  
  <g id="row-summary">
    
    <rect x="40" y="310" width="170" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="102" y="330" width="46" height="54" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="112" y1="346" x2="138" y2="346" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="360" x2="138" y2="360" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="374" x2="128" y2="374" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="125" y="422" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Summary</text>

    
    <rect x="230" y="310" width="655" height="140" rx="10" fill="#ffffff" stroke="#c8d6ce" stroke-width="2"/>
    
    <circle cx="283" cy="362" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M263,398 C263,382 271,376 283,376 C295,376 303,382 303,398" fill="none" stroke="#207448" stroke-width="4"/>
    <text x="325" y="352" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="325" dy="0">Human error during a config push</tspan>
      <tspan x="325" dy="32">broke the endpoint</tspan>
      <tspan x="325" dy="34" fill="#66706b">(the person is the story)</tspan>
    </text>

    
    <rect x="905" y="310" width="655" height="140" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="958" cy="380" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M958,356 L958,362 M958,398 L958,404 M934,380 L940,380 M976,380 L982,380 M941,363 L945,367 M971,393 L975,397 M941,397 L945,393 M971,367 L975,363" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="1000" y="368" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1000" dy="0">A config change reduced the cache budget</tspan>
      <tspan x="1000" dy="34">and the rollout tool promoted it</tspan>
    </text>
  </g>

  
  <g id="row-impact">
    
    <rect x="40" y="470" width="170" height="110" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <rect x="100" y="508" width="8" height="22" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="116" y="496" width="8" height="34" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="132" y="486" width="8" height="44" fill="none" stroke="#207448" stroke-width="4"/>
    <text x="125" y="562" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Impact</text>

    
    <rect x="230" y="470" width="655" height="110" rx="10" fill="#ffffff" stroke="#c8d6ce" stroke-width="2"/>
    
    <circle cx="283" cy="525" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="267" y1="525" x2="299" y2="525" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="325" y="534" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">missing</text>

    
    <rect x="905" y="470" width="655" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <polyline points="936,538 950,522 964,530 980,508" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="980" cy="508" r="4" fill="#207448"/>
    <text x="1000" y="534" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">add the impact numbers</text>
  </g>

  
  <g id="row-actions">
    
    <rect x="40" y="600" width="170" height="460" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="125" cy="800" r="24" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="125" cy="800" r="12" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="125" cy="800" r="3" fill="#207448"/>
    <text x="125" y="875" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Actions</text>

    
    <rect x="230" y="600" width="655" height="460" rx="10" fill="#ffffff" stroke="#c8d6ce" stroke-width="2"/>

    
    <rect x="245" y="618" width="625" height="92" rx="8" fill="#f5f8f5" stroke="#c8d6ce" stroke-width="1.5"/>
    <circle cx="282" cy="664" r="16" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="282" cy="664" r="6" fill="#207448"/>
    <text x="325" y="672" font-family="sans-serif" font-size="24" fill="#303a36">Improve monitoring (owned by everyone)</text>

    
    <rect x="245" y="730" width="625" height="92" rx="8" fill="#f5f8f5" stroke="#c8d6ce" stroke-width="1.5"/>
    <polygon points="282,752 264,784 300,784" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="282" y1="764" x2="282" y2="774" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="325" y="784" font-family="sans-serif" font-size="24" fill="#303a36">Be more careful with config pushes</text>

    
    <rect x="245" y="842" width="625" height="92" rx="8" fill="#f5f8f5" stroke="#c8d6ce" stroke-width="1.5"/>
    <rect x="264" y="868" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="274" y1="886" x2="290" y2="886" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <text x="325" y="896" font-family="sans-serif" font-size="24" fill="#66706b">(nothing checkable)</text>

    
    <rect x="905" y="600" width="655" height="460" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>

    
    <rect x="920" y="618" width="625" height="72" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
    
    <path d="M952,630 L972,638 L972,654 C972,668 952,676 952,676 C952,676 932,668 932,654 L932,638 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="942,652 949,658 962,644" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="990" y="663" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">add a canary latency gate (prevent)</text>

    
    <rect x="920" y="700" width="625" height="74" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M944,746 C944,734 964,734 964,746 L968,752 L940,752 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="954" cy="758" r="3" fill="#207448"/>
    <text x="990" y="731" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="990" dy="0">add a per-group alert with</tspan>
      <tspan x="990" dy="28">a 2 minute window (detect)</tspan>
    </text>

    
    <rect x="920" y="784" width="625" height="74" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="940" y="800" width="28" height="38" rx="2" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="948" y1="812" x2="960" y2="812" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="948" y1="822" x2="960" y2="822" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="990" y="815" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="990" dy="0">add a gateway weight step to the</tspan>
      <tspan x="990" dy="28">runbook (mitigate)</tspan>
    </text>

    
    <rect x="920" y="868" width="625" height="176" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    
    <circle cx="954" cy="956" r="18" fill="none" stroke="#207448" stroke-width="4"/>
    <polyline points="946,956 952,962 964,948" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="990" y="904" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="990" dy="0">each with one owner, a due date</tspan>
      <tspan x="990" dy="32">and a measure such as</tspan>
      <tspan x="990" dy="32" font-weight="bold">'replay of the failing change</tspan>
      <tspan x="990" dy="32" font-weight="bold">is blocked in staging'</tspan>
    </text>
  </g>

  
  <g id="footer-takeaway">
    <rect x="40" y="1080" width="1520" height="90" rx="10" fill="#207448"/>
    <text x="800" y="1120" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">a good post-mortem reads as a plan:</tspan>
      <tspan x="800" dy="34">what changed, who will check it, how they will know it worked</tspan>
    </text>
  </g>
</svg>