<svg width="1600" height="1080" viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg">
  <title>Weight versus quota</title>
  <desc>Visual comparison between cgroup CPU weight proportional sharing and CPU quota hard limits.</desc>

  <rect width="1600" height="1080" fill="#f5f8f5"/>

  
  <text x="800" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Weight versus quota</text>

  
  <g id="panel-weight">
    
    <rect x="50" y="115" width="730" height="925" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(75, 135)">
      
      <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="28" y1="6" x2="28" y2="48"/>
        <line x1="16" y1="48" x2="40" y2="48"/>
        <line x1="8" y1="16" x2="48" y2="16"/>
        
        <path d="M 8 16 L 2 34 L 14 34 Z"/>
        
        <path d="M 48 16 L 42 34 L 54 34 Z"/>
      </g>
      
      <text x="75" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#207448">Weight</text>
    </g>

    
    <g id="weight-node-1">
      <rect x="75" y="200" width="680" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(95, 232)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="6" y1="14" x2="50" y2="14"/>
        <circle cx="20" cy="14" r="5" fill="#207448"/>
        <line x1="6" y1="28" x2="50" y2="28"/>
        <circle cx="38" cy="28" r="5" fill="#207448"/>
        <line x1="6" y1="42" x2="50" y2="42"/>
        <circle cx="26" cy="42" r="5" fill="#207448"/>
      </g>
      
      <text x="175" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">cpu.weight</tspan>, 1 to 10000, default 100;
      </text>
      <text x="175" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        v1 <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">cpu.shares</tspan> default 1024
      </text>
    </g>

    
    <g id="weight-node-2">
      <rect x="75" y="340" width="680" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(95, 395)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="22"/>
        <line x1="28" y1="28" x2="28" y2="6"/>
        <line x1="28" y1="28" x2="45" y2="40"/>
        <line x1="28" y1="28" x2="11" y2="40"/>
      </g>
      
      <text x="175" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">a promise about proportions,</text>
      <text x="175" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">only under contention and</text>
      <text x="175" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">only among siblings,</text>
    </g>

    
    <g id="weight-node-3">
      <rect x="75" y="525" width="680" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(95, 620)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="6" y="8" width="44" height="40" rx="8"/>
        <line x1="14" y1="20" x2="42" y2="20"/>
        <line x1="14" y1="28" x2="42" y2="28"/>
        <line x1="14" y1="36" x2="42" y2="36"/>
      </g>
      
      <text x="175" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">never wastes capacity,</text>
      <text x="175" y="685" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">never limits alone;</text>
    </g>

    
    <g id="weight-node-4">
      <rect x="75" y="790" width="680" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(95, 875)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="28" r="14"/>
        <circle cx="28" cy="28" r="4" fill="#207448"/>
        <line x1="28" y1="6" x2="28" y2="50"/>
        <line x1="6" y1="28" x2="50" y2="28"/>
        <line x1="12" y1="12" x2="44" y2="44"/>
        <line x1="12" y1="44" x2="44" y2="12"/>
      </g>
      
      <text x="175" y="875" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Kubernetes CPU request</text>
      <text x="175" y="920" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">becomes weight.</text>
    </g>
  </g>

  
  <g id="panel-quota">
    
    <rect x="820" y="115" width="730" height="925" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(845, 135)">
      
      <g stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        
        <line x1="6" y1="8" x2="50" y2="8" stroke-width="6"/>
        <path d="M 10 46 A 22 22 0 0 1 46 46"/>
        <line x1="28" y1="46" x2="28" y2="16"/>
        <circle cx="28" cy="46" r="3" fill="#207448"/>
      </g>
      
      <text x="75" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#207448">Quota</text>
    </g>

    
    <g id="quota-node-1">
      <rect x="845" y="200" width="680" height="120" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(865, 232)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="6" y="8" width="44" height="40" rx="8"/>
        <line x1="14" y1="18" x2="42" y2="18" stroke-dasharray="4,4"/>
        <line x1="28" y1="38" x2="28" y2="22"/>
        <polyline points="22,28 28,22 34,28"/>
      </g>
      
      <text x="945" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">cpu.max</tspan>, form <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">$MAX $PERIOD</tspan>
      </text>
      <text x="945" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        in microseconds, default max 100000
      </text>
    </g>

    
    <g id="quota-node-2">
      <rect x="845" y="340" width="680" height="165" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(865, 395)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="6" y1="12" x2="50" y2="12" stroke-width="6"/>
        <line x1="12" y1="12" x2="6" y2="22"/>
        <line x1="26" y1="12" x2="20" y2="22"/>
        <line x1="40" y1="12" x2="34" y2="22"/>
        <line x1="28" y1="46" x2="28" y2="24"/>
        <line x1="18" y1="24" x2="38" y2="24"/>
      </g>
      
      <text x="945" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">hard ceiling;</text>
      <text x="945" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">200000 100000</tspan> means 200 ms of CPU
      </text>
      <text x="945" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">per 100 ms period, two CPUs' worth.</text>
    </g>

    
    <g id="quota-node-3">
      <rect x="845" y="525" width="680" height="245" rx="12" fill="#fffbf5" stroke="#db8129" stroke-width="2.5"/>
      
      <g transform="translate(865, 620)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="28" cy="30" r="20"/>
        <line x1="28" y1="4" x2="28" y2="10"/>
        
        <path d="M 28 30 L 28 10 A 20 20 0 0 1 42 16 Z" fill="#db8129" fill-opacity="0.25"/>
        <line x1="28" y1="30" x2="42" y2="16"/>
      </g>
      
      <text x="945" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">Example:</text>
      <text x="945" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">16 busy threads with a 2-CPU quota</text>
      <text x="945" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">burn 200 ms in about 12.5 ms</text>
      <text x="945" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">then sleep 87.5 ms.</text>
    </g>

    
    <g id="quota-node-4">
      <rect x="845" y="790" width="680" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(865, 875)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="6" y="8" width="44" height="40" rx="8"/>
        <path d="M 12 30 L 20 30 L 24 16 L 30 40 L 36 24 L 40 30 L 44 30"/>
      </g>
      
      <text x="945" y="850" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Check throttling:</text>
      <text x="945" y="895" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">nr_throttled</tspan> versus <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">nr_periods</tspan>
      </text>
      <text x="945" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        in <tspan font-family="'SF Mono', Consolas, monospace" font-weight="bold" fill="#207448">cpu.stat</tspan>.
      </text>
    </g>
  </g>
</svg>