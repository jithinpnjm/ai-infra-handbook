<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A 100 Gb/s link sends about 8 million packets per second, so capture needs a ladder of options</title>
  <desc>A vertical ladder of seven numbered options for high-speed packet capture, progressing from lightweight software filtering to dedicated hardware capture.</desc>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f5f8f5" />

  <!-- Title -->
  <text x="40" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A 100 Gb/s link sends about 8 million packets<tspan x="40" dy="48">per second, so capture needs a ladder of options</tspan></text>

  <!-- Top Banner (Arithmetic) -->
  <rect x="40" y="134" width="1520" height="50" rx="8" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  <text x="800" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Arithmetic: 100 Gb/s and 1500-byte frames is about 8 million packets per second</text>

  <!-- Widening Arrow (Left) -->
  <path d="M 79,224 L 91,224 L 111,1023 L 128,1023 L 85,1066 L 42,1023 L 59,1023 Z" fill="#207448" />
  <text x="184" y="645" transform="rotate(90, 184, 645)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle" letter-spacing="1">more power, more hardware</text>

  <!-- Step 1 -->
  <rect x="240" y="224" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="267" r="24" fill="#207448" />
  <text x="284" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  <!-- Funnel / Filter Icon -->
  <path d="M 330,250 L 370,250 L 356,268 L 356,284 L 344,278 L 344,268 Z" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="395" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Capture only what you need:</text>
  <text x="395" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">tight filter and <tspan font-family="ui-monospace, monospace" font-weight="bold">-s 96</tspan></text>

  <!-- Step 2 -->
  <rect x="240" y="350" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="393" r="24" fill="#207448" />
  <text x="284" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  <!-- Disk Storage Cylinder Icon -->
  <ellipse cx="350" cy="381" rx="18" ry="6" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 332,381 V 394 A 18 6 0 0 0 368,394 V 381" stroke="#207448" stroke-width="3.5" fill="none" />
  <path d="M 332,394 V 407 A 18 6 0 0 0 368,407 V 394" stroke="#207448" stroke-width="3.5" fill="none" />
  <text x="395" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Bigger kernel buffer <tspan font-family="ui-monospace, monospace">(-B)</tspan>,</text>
  <text x="395" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">RAM disk or striped NVMe, no name lookups</text>

  <!-- Step 3 -->
  <rect x="240" y="476" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="519" r="24" fill="#207448" />
  <text x="284" y="519" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  <!-- Queue Steering Icon -->
  <path d="M 332,519 H 345" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 345,519 C 352,519 354,506 362,506 H 368" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polyline points="364,502 368,506 364,510" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 345,519 C 352,519 354,532 362,532 H 368" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polyline points="364,528 368,532 364,536" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 345,519 H 368" stroke="#207448" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polyline points="364,515 368,519 364,523" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="395" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Per queue or per flow:</text>
  <text x="395" y="541" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">steer the flow with <tspan font-family="ui-monospace, monospace" font-weight="bold">ethtool</tspan> flow rules</text>

  <!-- Step 4 -->
  <rect x="240" y="602" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="645" r="24" fill="#207448" />
  <text x="284" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  <!-- Fast Bypass Lightning Bolt Icon -->
  <polygon points="354,625 336,647 349,647 345,665 364,643 351,643" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="395" y="638" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Fast capture tools:</text>
  <text x="395" y="667" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">PF_RING, AF_XDP, DPDK-based tools</text>

  <!-- Step 5 -->
  <rect x="240" y="728" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="771" r="24" fill="#207448" />
  <text x="284" y="771" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  <!-- Hardware Chip / DPU Icon -->
  <rect x="334" y="755" width="32" height="32" rx="4" stroke="#207448" stroke-width="3.5" fill="none" />
  <rect x="342" y="763" width="16" height="16" rx="2" stroke="#207448" stroke-width="2.5" fill="none" />
  <line x1="340" y1="749" x2="340" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="350" y1="749" x2="350" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="360" y1="749" x2="360" y2="755" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="340" y1="787" x2="340" y2="793" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="350" y1="787" x2="350" y2="793" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="360" y1="787" x2="360" y2="793" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <text x="395" y="764" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Hardware:</text>
  <text x="395" y="793" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">switch SPAN or ERSPAN to a capture server, or a NIC or DPU</text>

  <!-- Step 6 -->
  <rect x="240" y="854" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="897" r="24" fill="#207448" />
  <text x="284" y="897" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  <!-- Sampling Gauge Icon -->
  <path d="M 332,911 A 20 20 0 1 1 368,911" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <line x1="350" y1="907" x2="362" y2="893" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="350" cy="907" r="3" fill="#207448" />
  <text x="395" y="890" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Sample instead of capturing everything:</text>
  <text x="395" y="919" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">sFlow, IPFIX, <tspan font-family="ui-monospace, monospace" font-weight="bold">tcpdump -c</tspan></text>

  <!-- Step 7 -->
  <rect x="240" y="980" width="1320" height="86" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <circle cx="284" cy="1023" r="24" fill="#207448" />
  <text x="284" y="1023" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
  <!-- Circular Ring Buffer with Trigger Icon -->
  <path d="M 350,1005 A 18 18 0 1 1 332,1023" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <polyline points="345,1000 351,1005 345,1010" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="350" y1="1017" x2="350" y2="1025" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <circle cx="350" cy="1030" r="2" fill="#207448" />
  <text x="395" y="1016" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Trigger-based ring:</text>
  <text x="395" y="1045" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">rolling <tspan font-family="ui-monospace, monospace" font-weight="bold">-C</tspan> and <tspan font-family="ui-monospace, monospace" font-weight="bold">-W</tspan> files, stopped by an event, so earlier packets are kept</text>

  <!-- Caption / Takeaway Bar -->
  <rect x="40" y="1108" width="1520" height="52" rx="8" fill="#207448" />
  <text x="800" y="1140" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Climb only as far as the question requires.</text>
</svg>
