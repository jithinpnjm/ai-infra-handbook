<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The probe that follows each part of your dossier</title>
  <desc>Visual table outlining technical interview dossier parts, probes, and the shape of good answers.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="46" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The probe that follows each part of your dossier</text>

  
  <g id="table-header">
    <rect x="40" y="64" width="295" height="120" rx="8" fill="#207448"/>
    <rect x="335" y="64" width="425" height="120" rx="8" fill="#207448"/>
    <rect x="760" y="64" width="800" height="120" rx="8" fill="#207448"/>

    <text x="56" y="134" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Part</text>
    <text x="355" y="134" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Probe</text>
    <text x="780" y="102" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Shape of a good answer</text>
    <text x="780" y="134" font-family="sans-serif" font-size="24" fill="#e8f1ea">(the author's reasoning about how technical</text>
    <text x="780" y="164" font-family="sans-serif" font-size="24" fill="#e8f1ea">interviewers probe, not a record of Nebius questions)</text>
  </g>

  
  <g id="row-1">
    <rect x="40" y="190" width="295" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="190" width="425" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="190" width="800" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>

    
    <circle cx="74" cy="247" r="14" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="74" y1="227" x2="74" y2="233" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="74" y1="261" x2="74" y2="267" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="54" y1="247" x2="60" y2="247" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="88" y1="247" x2="94" y2="247" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="74" cy="247" r="2.5" fill="#207448"/>

    <text x="104" y="256" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Context</text>

    <text x="355" y="238" font-family="sans-serif" font-size="24" fill="#303a36">Why did this need</text>
    <text x="355" y="268" font-family="sans-serif" font-size="24" fill="#303a36">doing at all?</text>

    <text x="780" y="238" font-family="sans-serif" font-size="24" fill="#303a36">the pain in one sentence a non-engineer would</text>
    <text x="780" y="268" font-family="sans-serif" font-size="24" fill="#303a36">follow, then the number that showed it was real</text>
  </g>

  
  <g id="row-2">
    <rect x="40" y="310" width="295" height="118" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="310" width="425" height="118" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="310" width="800" height="118" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>

    
    <line x1="58" y1="384" x2="90" y2="384" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="384" x2="65" y2="373" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="74" y1="384" x2="74" y2="361" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="83" y1="384" x2="83" y2="350" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

    <text x="104" y="378" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Numbers</text>

    <text x="355" y="376" font-family="sans-serif" font-size="24" fill="#303a36">How big was this?</text>

    <text x="780" y="346" font-family="sans-serif" font-size="24" fill="#303a36">scale, normal load, peak load and cost with units,</text>
    <text x="780" y="374" font-family="sans-serif" font-size="24" fill="#303a36">and where each figure came from; if unknown, I did</text>
    <text x="780" y="402" font-family="sans-serif" font-size="24" fill="#303a36">not measure that, here is how I would</text>
  </g>

  
  <g id="row-3">
    <rect x="40" y="434" width="295" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="434" width="425" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="434" width="800" height="114" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>

    
    <rect x="67" y="475" width="14" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="56" y="500" width="14" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="78" y="500" width="14" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="74" y1="487" x2="63" y2="500" stroke="#207448" stroke-width="2.5"/>
    <line x1="74" y1="487" x2="85" y2="500" stroke="#207448" stroke-width="2.5"/>

    <text x="104" y="500" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Architecture</text>

    <text x="355" y="498" font-family="sans-serif" font-size="24" fill="#303a36">Draw it.</text>

    <text x="780" y="468" font-family="sans-serif" font-size="24" fill="#303a36">follow one request or one deploy end to end, name</text>
    <text x="780" y="496" font-family="sans-serif" font-size="24" fill="#303a36">the three components that mattered and why; start</text>
    <text x="780" y="524" font-family="sans-serif" font-size="24" fill="#303a36">with the boxes the user touches</text>
  </g>

  
  <g id="row-4">
    <rect x="40" y="554" width="295" height="132" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="554" width="425" height="132" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="554" width="800" height="132" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>

    
    <line x1="74" y1="638" x2="74" y2="624" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 74 624 C 74 615 62 615 62 605" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 74 624 C 74 615 86 615 86 605" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="605" r="3" fill="#207448"/>
    <circle cx="86" cy="605" r="3" fill="#207448"/>

    <text x="104" y="628" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Decisions</text>

    <text x="355" y="587" font-family="sans-serif" font-size="24" fill="#303a36">Why that?</text>
    <text x="355" y="613" font-family="sans-serif" font-size="24" fill="#303a36">What else did you consider?</text>
    <text x="355" y="639" font-family="sans-serif" font-size="24" fill="#303a36">What would make you switch?</text>
    <text x="355" y="665" font-family="sans-serif" font-size="24" fill="#303a36">What did it cost?</text>

    <text x="780" y="597" font-family="sans-serif" font-size="24" fill="#303a36">a short chosen option, two or more alternatives</text>
    <text x="780" y="625" font-family="sans-serif" font-size="24" fill="#303a36">with one reason each for rejecting them,</text>
    <text x="780" y="653" font-family="sans-serif" font-size="24" fill="#303a36">the cost accepted</text>
  </g>

  
  <g id="row-5">
    <rect x="40" y="692" width="295" height="114" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <rect x="335" y="692" width="425" height="114" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <rect x="760" y="692" width="800" height="114" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>

    
    <path d="M 74 731 L 91 762 L 57 762 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="74" y1="742" x2="74" y2="750" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="74" cy="756" r="1.5" fill="#db8129"/>

    <text x="104" y="758" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Failures</text>

    <text x="355" y="740" font-family="sans-serif" font-size="24" fill="#303a36">What broke and what</text>
    <text x="355" y="770" font-family="sans-serif" font-size="24" fill="#303a36">did you do first?</text>

    <text x="780" y="740" font-family="sans-serif" font-size="24" fill="#303a36">protect then diagnose: reduce user harm first,</text>
    <text x="780" y="770" font-family="sans-serif" font-size="24" fill="#303a36">dig for the cause second</text>
  </g>

  
  <g id="row-6">
    <rect x="40" y="812" width="295" height="114" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="812" width="425" height="114" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="812" width="800" height="114" rx="8" fill="#f0f6f2" stroke="#d0ded2" stroke-width="1.5"/>

    
    <path d="M 85 860 A 13 13 0 1 0 87 874" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 82 854 L 88 860 L 82 866" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="104" y="856" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">What you</text>
    <text x="104" y="888" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">would change</text>

    <text x="355" y="876" font-family="sans-serif" font-size="24" fill="#303a36">Knowing what you know now?</text>

    <text x="780" y="860" font-family="sans-serif" font-size="24" fill="#303a36">one change, the evidence, what you would measure</text>
    <text x="780" y="890" font-family="sans-serif" font-size="24" fill="#303a36">first, and what you would leave alone</text>
  </g>

  
  <g id="row-7">
    <rect x="40" y="932" width="295" height="118" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="335" y="932" width="425" height="118" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>
    <rect x="760" y="932" width="800" height="118" rx="8" fill="#ffffff" stroke="#d0ded2" stroke-width="1.5"/>

    
    <circle cx="68" cy="980" r="4.5" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 59 1000 C 59 992 63 990 68 990 C 73 990 77 992 77 1000" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="81" cy="980" r="4.5" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M 76 1000 C 76 992 78 990 81 990 C 86 990 89 992 89 1000" fill="none" stroke="#207448" stroke-width="3"/>

    <text x="104" y="1000" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Teamwork</text>

    <text x="355" y="982" font-family="sans-serif" font-size="24" fill="#303a36">Tell me about a</text>
    <text x="355" y="1012" font-family="sans-serif" font-size="24" fill="#303a36">disagreement.</text>

    <text x="780" y="968" font-family="sans-serif" font-size="24" fill="#303a36">the other person's position fairly, the evidence</text>
    <text x="780" y="996" font-family="sans-serif" font-size="24" fill="#303a36">that settled it, how the relationship ended up;</text>
    <text x="780" y="1024" font-family="sans-serif" font-size="24" fill="#303a36">do not be the only wise person in the story</text>
  </g>

  
  <g id="footer">
    <rect x="40" y="1058" width="1520" height="112" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <rect x="40" y="1058" width="12" height="112" rx="6" fill="#207448"/>
    <text x="76" y="1102" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">for every claim know the next question and have one number or one fact ready;</text>
    <text x="76" y="1136" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">ask yourself how you would know it is true and what you would say if the number were wrong</text>
  </g>
</svg>