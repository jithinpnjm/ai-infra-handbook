<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>lookup returns a string, query returns a list: what a loop sees</title>
  <desc>Visual comparison showing that Ansible lookup returns a comma-joined string running a loop once with wrong data, while query returns a list running the loop once per item.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" dy="0">lookup returns a string, query returns a list:</tspan>
    <tspan x="800" dy="56">what a loop sees</tspan>
  </text>

  
  <g id="opening-story">
    <rect x="40" y="135" width="1520" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(65, 175)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="20" width="44" height="32" rx="6"/>
      <path d="M 16 20 V 13 A 12 12 0 0 1 40 13 V 20"/>
      <circle cx="28" cy="34" r="4" fill="#207448"/>
      <path d="M 28 38 V 44"/>
    </g>
    <text x="145" y="177" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">a secret lives in a vault, a value lives in a file, a hostname comes from DNS:</tspan>
      <tspan x="145" dy="32">a lookup fetches it at run time instead of copying it into code where it goes stale;</tspan>
      <tspan x="145" dy="32">next month the secret is rotated, the copy is not, and the job fails at night</tspan>
    </text>
  </g>

  
  <g id="two-lanes-container">
    <rect x="40" y="290" width="1520" height="425" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="70" y="328" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Two lanes over three SSH keys</text>

    
    <g id="lane-lookup">
      <rect x="65" y="345" width="720" height="350" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
      
      
      <g transform="translate(90, 365)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="14"/>
        <line x1="33" y1="33" x2="48" y2="48"/>
        <line x1="16" y1="22" x2="28" y2="22"/>
      </g>
      
      <text x="160" y="392" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">lookup(...)</text>
      <text x="160" y="424" font-family="sans-serif" font-size="24" fill="#303a36">returns a string joined with commas by default</text>

      
      <g transform="translate(160, 448)">
        
        <g transform="translate(0, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
        
        <g transform="translate(85, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
        
        <g transform="translate(170, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
      </g>

      
      <path d="M 285 480 V 555" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

      
      <rect x="85" y="565" width="680" height="115" rx="8" fill="#fff7ed" stroke="#db8129" stroke-width="3"/>
      
      <g transform="translate(105, 595)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="26,6 48,46 4,46"/>
        <line x1="26" y1="20" x2="26" y2="32"/>
        <circle cx="26" cy="39" r="1.5" fill="#db8129"/>
      </g>
      <text x="170" y="598" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="170" dy="0">the loop sees one long string with commas</tspan>
        <tspan x="170" dy="30">in it and runs once with the wrong shape</tspan>
        <tspan x="170" dy="30">of data</tspan>
      </text>
    </g>

    
    <g id="lane-query">
      <rect x="815" y="345" width="720" height="350" rx="10" fill="#ffffff" stroke="#c8dcd0" stroke-width="2"/>
      
      
      <g transform="translate(840, 365)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="40" height="40" rx="6"/>
        <line x1="16" y1="20" x2="40" y2="20"/>
        <line x1="16" y1="28" x2="40" y2="28"/>
        <line x1="16" y1="36" x2="40" y2="36"/>
      </g>
      
      <text x="910" y="392" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">query(...) or q(...)</text>
      <text x="910" y="424" font-family="sans-serif" font-size="24" fill="#303a36">always returns a list</text>

      
      <g transform="translate(910, 448)">
        
        <g transform="translate(0, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
        
        <g transform="translate(160, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
        
        <g transform="translate(320, 0)" stroke="#207448" stroke-width="3" fill="none">
          <circle cx="16" cy="14" r="8"/>
          <line x1="24" y1="14" x2="52" y2="14"/>
          <line x1="42" y1="14" x2="42" y2="20"/>
          <line x1="48" y1="14" x2="48" y2="20"/>
        </g>
      </g>

      
      <path d="M 945 480 V 555" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
      <path d="M 1105 480 V 555" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
      <path d="M 1265 480 V 555" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

      
      <rect x="835" y="565" width="680" height="115" rx="8" fill="#f0f7f2" stroke="#207448" stroke-width="2.5"/>
      
      <g transform="translate(855, 595)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 42 22 A 16 16 0 1 0 42 34"/>
        <polyline points="36,12 44,22 34,26"/>
      </g>
      <text x="925" y="616" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="925" dy="0">the loop sees three items</tspan>
        <tspan x="925" dy="32">and runs three times</tspan>
      </text>
    </g>
  </g>

  
  <g id="rules-strip">
    <rect x="40" y="730" width="1520" height="370" rx="12" fill="#f5f8f5" stroke="#c8dcd0" stroke-width="2"/>

    
    <g id="rule-prefer-query">
      <rect x="60" y="745" width="720" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(80, 775)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="22"/>
        <polyline points="18,28 25,36 38,20"/>
      </g>
      <text x="155" y="818" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
        <tspan x="155" dy="0">prefer query when you feed</tspan>
        <tspan x="155" dy="32">the result into a loop</tspan>
      </text>
    </g>

    
    <g id="rule-ansible-controller">
      <rect x="820" y="745" width="720" height="160" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(840, 775)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="30" rx="4"/>
        <line x1="16" y1="38" x2="10" y2="48"/>
        <line x1="40" y1="38" x2="46" y2="48"/>
        <line x1="10" y1="48" x2="46" y2="48"/>
      </g>
      <text x="915" y="798" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="915" dy="0">lookups run where Ansible runs, not on</tspan>
        <tspan x="915" dy="30">the targets: for data from a target use</tspan>
        <tspan x="915" dy="30">a module and register</tspan>
      </text>
    </g>

    
    <g id="rule-expensive-lookups">
      <rect x="60" y="920" width="720" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(80, 945)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="22"/>
        <polyline points="28,14 28,28 38,34"/>
      </g>
      <text x="155" y="948" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="155" dy="0">a lookup runs every time it is evaluated,</tspan>
        <tspan x="155" dy="27">so keep expensive lookups out of loops:</tspan>
        <tspan x="155" dy="27">a url lookup inside a loop over a</tspan>
        <tspan x="155" dy="27">large group fetches the same page</tspan>
        <tspan x="155" dy="27">once for every host</tspan>
      </text>
    </g>

    
    <g id="rule-with-lookup">
      <rect x="820" y="920" width="720" height="165" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <g transform="translate(840, 945)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18,12 8,28 18,44"/>
        <polyline points="38,12 48,28 38,44"/>
        <line x1="32" y1="12" x2="24" y2="44"/>
      </g>
      <text x="915" y="964" font-family="sans-serif" font-size="24" fill="#303a36">
        <tspan x="915" dy="0">with_&lt;lookup&gt;: is the older way</tspan>
        <tspan x="915" dy="29">of writing loop: with a lookup;</tspan>
        <tspan x="915" dy="29">the loop: form does the same job</tspan>
        <tspan x="915" dy="29">more clearly</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="65" rx="10" fill="#207448"/>
    <text x="800" y="1157" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Use query when the loop needs items</text>
  </g>
</svg>