<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Fixtures: how pytest hands setup to a test, and how long it lives</title>
  <desc>Visual explanation of pytest fixture injection by parameter name, scope ladder from narrow to wide, example fixtures, conftest sharing, and preventing state leaks.</desc>

  <defs>
    <marker id="arrowhead-green" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#207448" />
    </marker>
    <marker id="arrowhead-ladder" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1400" fill="#f5f8f5" />

  
  <text x="800" y="65" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Fixtures: how pytest hands setup to a test, and how long it lives</text>

  
  
  <rect x="40" y="105" width="350" height="215" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(60, 122)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 6 L28 6 M22 6 L22 18 L8 44 A4 4 0 0 0 12 50 L32 50 A4 4 0 0 0 36 44 L22 18" />
    <path d="M12 40 L32 40" stroke-width="2" />
  </g>
  <text x="115" y="152" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">fixture called env</text>
  <rect x="60" y="180" width="310" height="115" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  <text x="75" y="218" font-size="24" font-family="monospace" fill="#303a36">@pytest.fixture</text>
  <text x="75" y="252" font-size="24" font-family="monospace" fill="#207448" font-weight="bold">def env():</text>
  <text x="75" y="284" font-size="24" font-family="monospace" fill="#606c66">    return FleetEnv()</text>

  
  <rect x="1210" y="105" width="350" height="215" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(1230, 122)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="38" height="38" rx="5" />
    <path d="M12 24 L20 32 L34 16" />
  </g>
  <text x="1285" y="152" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">test function</text>
  <rect x="1230" y="180" width="310" height="115" rx="8" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  
  <rect x="1405" y="200" width="55" height="32" rx="6" fill="#d7edd9" stroke="#207448" stroke-width="1.5" />
  <text x="1245" y="224" font-size="24" font-family="monospace" fill="#303a36">def test_api(<tspan font-weight="bold" fill="#207448">env</tspan>):</text>
  <text x="1245" y="254" font-size="24" font-family="monospace" fill="#606c66">    assert env.ready()</text>
  <text x="1245" y="284" font-size="24" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">parameter named env</text>

  
  <line x1="390" y1="212" x2="1205" y2="212" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead-green)" />

  
  <rect x="420" y="145" width="760" height="135" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <text x="800" y="185" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="800" dy="0">pytest matches a fixture to a test</tspan>
    <tspan x="800" dy="34">by parameter name: an argument named env</tspan>
    <tspan x="800" dy="34">gets the fixture called env</tspan>
  </text>

  

  
  <rect x="40" y="345" width="370" height="585" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(60, 362)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="10" y1="6" x2="10" y2="44" />
    <line x1="30" y1="6" x2="30" y2="44" />
    <line x1="10" y1="16" x2="30" y2="16" />
    <line x1="10" y1="26" x2="30" y2="26" />
    <line x1="10" y1="36" x2="30" y2="36" />
  </g>
  <text x="110" y="385" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="110" dy="0">Scope ladder</tspan>
    <tspan x="110" dy="32">from narrow to wide</tspan>
  </text>

  
  <rect x="58" y="460" width="334" height="78" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="225" y="493" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="225" dy="0">use the narrowest scope</tspan>
    <tspan x="225" dy="30">you can afford</tspan>
  </text>

  
  
  <line x1="80" y1="585" x2="80" y2="875" stroke="#207448" stroke-width="3" marker-end="url(#arrowhead-ladder)" />

  
  <rect x="105" y="565" width="285" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="125" y="603" font-size="24" font-weight="bold" fill="#207448" font-family="monospace">function (default)</text>

  
  <rect x="105" y="650" width="285" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="125" y="688" font-size="24" font-weight="bold" fill="#303a36" font-family="monospace">class</text>

  
  <rect x="105" y="735" width="285" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="125" y="773" font-size="24" font-weight="bold" fill="#303a36" font-family="monospace">module</text>

  
  <rect x="105" y="820" width="285" height="60" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  <text x="125" y="858" font-size="24" font-weight="bold" fill="#db8129" font-family="monospace">session</text>

  
  <rect x="435" y="345" width="675" height="585" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(455, 362)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18,12 8,24 18,36" />
    <polyline points="30,12 40,24 30,36" />
    <line x1="26" y1="12" x2="22" y2="36" />
  </g>
  <text x="510" y="394" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">Example fixtures</text>

  
  <rect x="455" y="420" width="635" height="145" rx="10" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  <text x="475" y="452" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="475" dy="0" font-family="monospace" font-weight="bold" fill="#207448">env:</tspan>
    <tspan font-family="monospace"> monkeypatch.setenv(FLEET_TOKEN,</tspan>
    <tspan x="475" dy="32" font-family="monospace">test-token) and delenv(FLEET_CONFIG,</tspan>
    <tspan x="475" dy="32" font-family="monospace">raising=False):</tspan>
    <tspan font-family="system-ui, -apple-system, sans-serif"> undone automatically</tspan>
    <tspan x="475" dy="30" font-family="system-ui, -apple-system, sans-serif">after the test</tspan>
  </text>

  
  <rect x="455" y="580" width="635" height="110" rx="10" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  <text x="475" y="618" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="475" dy="0" font-family="monospace" font-weight="bold" fill="#207448">workdir:</tspan>
    <tspan font-family="monospace"> monkeypatch.chdir(tmp_path)</tspan>
    <tspan x="475" dy="36">and return tmp_path</tspan>
  </text>

  
  <rect x="455" y="705" width="635" height="205" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  <text x="475" y="740" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="475" dy="0" font-family="monospace" font-weight="bold" fill="#db8129">kind_cluster, scope=session:</tspan>
    <tspan x="475" dy="34">create_kind_cluster() is expensive</tspan>
    <tspan x="475" dy="32">and shared; yield name;</tspan>
    <tspan x="475" dy="32">delete_kind_cluster(name) teardown</tspan>
    <tspan x="475" dy="32">always runs, even when the test fails</tspan>
  </text>

  
  <rect x="1135" y="345" width="425" height="585" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1155, 362)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 10 L18 10 L24 16 L42 16 A3 3 0 0 1 45 19 L45 39 A3 3 0 0 1 42 42 L6 42 A3 3 0 0 1 3 39 L3 13 A3 3 0 0 1 6 10 Z" />
  </g>
  <text x="1210" y="394" font-size="28" font-weight="bold" fill="#207448" font-family="system-ui, -apple-system, sans-serif">Side list</text>

  
  <rect x="1155" y="420" width="385" height="205" rx="10" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  <text x="1175" y="462" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="1175" dy="0" font-family="monospace" font-weight="bold" fill="#207448">conftest.py</tspan>
    <tspan font-weight="bold"> shares fixtures</tspan>
    <tspan x="1175" dy="38">across a directory</tspan>
    <tspan x="1175" dy="38">without imports</tspan>
  </text>

  
  <rect x="1155" y="640" width="385" height="270" rx="10" fill="#ffffff" stroke="#c0d6c4" stroke-width="1.5" />
  <text x="1175" y="678" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="1175" dy="0" font-weight="bold" fill="#207448">built-in fixtures:</tspan>
    <tspan x="1175" dy="38" font-family="monospace">tmp_path,</tspan>
    <tspan x="1175" dy="34" font-family="monospace">monkeypatch, capsys,</tspan>
    <tspan x="1175" dy="34" font-family="monospace">capfd, caplog,</tspan>
    <tspan x="1175" dy="34" font-family="monospace">request,</tspan>
    <tspan x="1175" dy="34" font-family="monospace">tmp_path_factory</tspan>
  </text>

  
  <rect x="40" y="955" width="1520" height="305" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(65, 975)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6 L42 12 L42 26 C42 38 24 46 24 46 C24 46 6 38 6 26 L6 12 Z" />
    <line x1="24" y1="18" x2="24" y2="28" />
    <circle cx="24" cy="35" r="1.5" fill="#db8129" />
  </g>
  <text x="125" y="1008" font-size="28" font-weight="bold" fill="#db8129" font-family="system-ui, -apple-system, sans-serif">Leak story strip</text>

  <text x="70" y="1055" font-size="24" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
    <tspan x="70" dy="0" font-weight="bold" fill="#db8129">the classic leak:</tspan>
    <tspan> a test mutates a module-level dict or a default argument,</tspan>
    <tspan x="70" dy="36">and a later test fails for an unrelated-looking reason;</tspan>
    <tspan x="70" dy="38" font-weight="bold" fill="#207448">fix with fixtures that build fresh objects and monkeypatch instead of assigning globals;</tspan>
    <tspan x="70" dy="38" font-weight="bold" fill="#207448">run pytest-randomly in CI;</tspan>
    <tspan x="70" dy="38" font-weight="bold" fill="#303a36">never share mutable state through a session fixture unless it is reset for each test</tspan>
  </text>

  
  <rect x="40" y="1285" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1333" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Each fixture undoes its own changes</text>
</svg>