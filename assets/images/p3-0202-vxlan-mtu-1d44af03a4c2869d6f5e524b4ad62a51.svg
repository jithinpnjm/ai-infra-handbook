<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>A tunnel shrinks the MTU: VXLAN adds 50 bytes and the MSS falls to 1410</title>
  <desc>Visual breakdown of how VXLAN tunnel encapsulation overhead reduces the inner MTU and TCP MSS, consequences of failing to clamp MSS or reduce MTU, comparison with other encapsulation protocols, and critical deployment warnings.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 14 8 L 2 13 Z" fill="#db8129" />
    </marker>

    
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b382b" flood-opacity="0.06" />
    </filter>
  </defs>

  
  <rect width="1600" height="1160" fill="#f5f8f5" />

  
  <g id="header">
    <text x="800" y="72" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#303a36" textLength="1520" lengthAdjust="spacingAndGlyphs">A tunnel shrinks the MTU: VXLAN adds 50 bytes and the MSS falls to 1410</text>
  </g>

  
  <g id="nested-packet">
    
    <path d="M 45 150 L 45 136 Q 45 128 55 128 L 375 128 Q 385 128 385 120 Q 385 128 395 128 L 715 128 Q 725 128 725 136 L 725 150" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="385" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#207448">50 bytes of VXLAN overhead</text>

    
    <rect x="40" y="160" width="165" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <text x="122.5" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="122.5" dy="0">Outer</tspan>
      <tspan x="122.5" dy="32">Ethernet 14</tspan>
    </text>

    
    <rect x="220" y="160" width="150" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <text x="295" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="295" dy="0">Outer</tspan>
      <tspan x="295" dy="32">IP 20</tspan>
    </text>

    
    <rect x="385" y="160" width="150" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <text x="460" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="460" dy="0">Outer</tspan>
      <tspan x="460" dy="32">UDP 8</tspan>
    </text>

    
    <rect x="550" y="160" width="175" height="108" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    <text x="637.5" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="637.5" dy="0">VXLAN</tspan>
      <tspan x="637.5" dy="32">header 8</tspan>
    </text>

    
    <rect x="745" y="160" width="815" height="108" rx="8" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#card-shadow)" />
    
    <path d="M 765 178 L 765 250" stroke="#207448" stroke-width="6" stroke-linecap="round" />
    <text x="1162.5" y="224" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Inner packet: IP 20 + TCP 20 + data</text>
  </g>

  
  <g id="middle-section">
    
    <rect x="40" y="306" width="270" height="204" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(147, 326)">
      <rect x="0" y="0" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="8" y1="14" x2="48" y2="14" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="3" />
    </g>
    <text x="175" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">Underlay</tspan>
      <tspan x="175" dy="38">MTU 1500</tspan>
    </text>

    
    <line x1="318" y1="408" x2="360" y2="408" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <rect x="368" y="306" width="310" height="204" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(495, 326)">
      <circle cx="28" cy="21" r="21" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="16" y1="21" x2="40" y2="21" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="523" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="523" dy="0">minus 50 for VXLAN</tspan>
      <tspan x="523" dy="36">= 1450 inner MTU</tspan>
    </text>

    
    <line x1="686" y1="408" x2="728" y2="408" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="736" y="306" width="310" height="204" rx="12" fill="#fff7ee" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(863, 326)">
      <circle cx="28" cy="21" r="21" fill="none" stroke="#db8129" stroke-width="4" />
      <circle cx="28" cy="21" r="9" fill="none" stroke="#db8129" stroke-width="3" />
    </g>
    <text x="891" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      <tspan x="891" dy="0">minus 40 for IP and TCP</tspan>
      <tspan x="891" dy="36">= 1410 MSS</tspan>
    </text>

    
    <rect x="1076" y="306" width="484" height="204" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(1096, 324)">
      <path d="M 20 4 L 4 10 L 4 24 C 4 34 11 43 20 46 C 29 43 36 34 36 24 L 36 10 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    </g>
    <text x="1146" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Other overheads</text>

    
    <circle cx="1106" cy="404" r="5" fill="#207448" />
    <text x="1126" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">GRE adds 24 bytes over IPv4</text>

    
    <circle cx="1106" cy="446" r="5" fill="#207448" />
    <text x="1126" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">IPsec ESP adds 50 to 70 bytes or more</text>

    
    <circle cx="1106" cy="488" r="5" fill="#207448" />
    <text x="1126" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">WireGuard adds 60</text>
  </g>

  
  <g id="bottom-lanes">
    
    <rect x="40" y="540" width="1520" height="136" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" filter="url(#card-shadow)" />
    
    <g transform="translate(64, 574)">
      <circle cx="34" cy="34" r="28" fill="#207448" />
      <path d="M 22 34 L 30 42 L 46 26" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="146" y="594" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">MSS clamped or inner MTU reduced</text>
    <text x="146" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#303a36">packets fit, transfer works</text>

    
    <rect x="40" y="704" width="1520" height="184" rx="12" fill="#fff7ee" stroke="#db8129" stroke-width="3" filter="url(#card-shadow)" />
    
    <g transform="translate(64, 756)">
      <polygon points="34,6 64,58 4,58" fill="none" stroke="#db8129" stroke-width="4.5" stroke-linejoin="round" />
      <line x1="34" y1="24" x2="34" y2="40" stroke="#db8129" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="34" cy="49" r="3" fill="#db8129" />
    </g>
    <text x="146" y="756" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Neither done</text>
    <text x="146" y="808" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="146" dy="0">large packets exceed the path MTU: fragmented (slow) or dropped with ICMP fragmentation needed;</tspan>
      <tspan x="146" dy="38">if that ICMP is filtered, a black hole: small requests work and large ones vanish</tspan>
    </text>
  </g>

  
  <g id="footer">
    <rect x="40" y="916" width="1520" height="88" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#card-shadow)" />
    
    <g transform="translate(68, 932)">
      <rect x="0" y="14" width="22" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <rect x="34" y="14" width="22" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="22" y1="28" x2="34" y2="28" stroke="#db8129" stroke-width="4" stroke-dasharray="2 3" />
    </g>
    <text x="146" y="970" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#303a36">A single link at 1500 in a 9000 fabric cripples throughput or breaks RoCE</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1030" width="1520" height="92" rx="10" fill="#207448" filter="url(#card-shadow)" />
    
    <g transform="translate(74, 1051)">
      <rect x="0" y="6" width="50" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="3.5" />
      <line x1="12" y1="6" x2="12" y2="22" stroke="#ffffff" stroke-width="3" />
      <line x1="25" y1="6" x2="25" y2="16" stroke="#ffffff" stroke-width="3" />
      <line x1="38" y1="6" x2="38" y2="22" stroke="#ffffff" stroke-width="3" />
    </g>
    <text x="800" y="1086" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Before you deploy an overlay, measure the end-to-end MTU across it</text>
  </g>
</svg>