<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Packet Transformation: Layer 2 Switching versus Layer 3 Routing</title>
  <desc>Side-by-side comparison of packet transformations, forwarding logic, and broadcast boundaries between an L2 switch and an L3 router.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1480" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="44px" font-weight="bold" fill="#207448">Packet Transformation: Layer 2 Switching versus Layer 3 Routing</text>

  
  
  
  <rect x="40" y="85" width="740" height="1065" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(65, 105)">
    
    <rect x="0" y="0" width="56" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 12 14 L 44 14 M 36 8 L 44 14 L 36 20 M 44 28 L 12 28 M 20 22 L 12 28 L 20 34" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="135" y="137" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Layer 2 Switch (Same Subnet)</text>

  
  <rect x="65" y="165" width="690" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="410" y="194" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">Host A sending a frame to Host B</text>

  
  <rect x="65" y="222" width="690" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="65" y="222" width="690" height="38" rx="10" fill="#207448" />
  <text x="85" y="249" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Ingress frame header:</text>

  <text x="85" y="292" font-family="monospace" font-size="24px" fill="#303a36">Destination MAC B (00:11:22:33:44:02)</text>
  <text x="85" y="328" font-family="monospace" font-size="24px" fill="#303a36">Source MAC A (00:11:22:33:44:01)</text>
  <text x="85" y="364" font-family="monospace" font-size="24px" fill="#303a36">EtherType 0x0800</text>
  <text x="85" y="400" font-family="monospace" font-size="24px" fill="#303a36">IP Src 10.0.0.1, IP Dst 10.0.0.2</text>
  <text x="85" y="436" font-family="monospace" font-size="24px" fill="#303a36">TTL 64, FCS</text>

  
  <line x1="410" y1="477" x2="410" y2="507" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="515" width="690" height="80" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="410" y="563" text-anchor="middle" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#207448">Switch inspects MAC table (FDB) only</text>

  
  <line x1="410" y1="595" x2="410" y2="625" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="65" y="633" width="690" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="65" y="633" width="690" height="38" rx="10" fill="#207448" />
  <text x="85" y="660" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Egress frame header out port 2:</text>

  <text x="85" y="705" font-family="monospace" font-size="24px" fill="#303a36">identical Destination MAC B</text>
  <text x="85" y="743" font-family="monospace" font-size="24px" fill="#303a36">Source MAC A</text>
  <text x="85" y="781" font-family="monospace" font-size="24px" fill="#303a36">TTL 64 untouched</text>
  <text x="85" y="819" font-family="monospace" font-size="24px" fill="#303a36">payload unchanged</text>

  
  <rect x="65" y="872" width="690" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 8" />
  
  <text x="410" y="915" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">Dotted boundary indicates broadcast domain</text>
  <text x="410" y="948" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">spans all ports;</text>
  
  <rect x="90" y="975" width="640" height="125" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="410" y="1025" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">flooded broadcast (ff:ff:ff:ff:ff:ff)</text>
  <text x="410" y="1065" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">crosses the switch</text>

  
  
  
  <rect x="820" y="85" width="740" height="1065" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(845, 105)">
    
    <circle cx="28" cy="21" r="21" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 16 21 L 40 21 M 21 16 L 16 21 L 21 26 M 35 16 L 40 21 L 35 26" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="915" y="137" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#207448">Layer 3 Router (Inter-Subnet)</text>

  
  <rect x="845" y="165" width="690" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1190" y="194" text-anchor="middle" font-family="sans-serif" font-size="24px" fill="#303a36">Host A sending to off-subnet Host C (192.168.1.5)</text>

  
  <rect x="845" y="222" width="690" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="845" y="222" width="690" height="38" rx="10" fill="#207448" />
  <text x="865" y="249" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Ingress frame header:</text>

  <text x="865" y="287" font-family="monospace" font-size="24px" fill="#303a36">Destination MAC is Router Ingress MAC</text>
  <text x="865" y="320" font-family="monospace" font-size="24px" fill="#303a36">eth0 (00:aa:bb:cc:dd:01)</text>
  <text x="865" y="358" font-family="monospace" font-size="24px" fill="#303a36">Source MAC A (00:11:22:33:44:01)</text>
  <text x="865" y="396" font-family="monospace" font-size="24px" fill="#303a36">IP Dst 192.168.1.5, TTL 64</text>

  
  <line x1="1190" y1="452" x2="1190" y2="477" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="845" y="482" width="690" height="255" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="845" y="482" width="690" height="38" rx="10" fill="#207448" />
  <text x="865" y="509" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Internal router flow in 3 callouts:</text>

  
  <circle cx="880" cy="548" r="18" fill="#207448" />
  <text x="880" y="556" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">1</text>
  <text x="912" y="556" font-family="sans-serif" font-size="24px" fill="#303a36">Strips incoming L2 header</text>

  
  <circle cx="880" cy="608" r="18" fill="#db8129" />
  <text x="880" y="616" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">2</text>
  <text x="912" y="605" font-family="sans-serif" font-size="24px" fill="#303a36">FIB lookup for destination IP</text>
  <text x="912" y="635" font-family="monospace" font-size="24px" font-weight="bold" fill="#db8129">192.168.1.5 -&gt; egress eth1</text>

  
  <circle cx="880" cy="685" r="18" fill="#207448" />
  <text x="880" y="693" text-anchor="middle" font-family="sans-serif" font-size="22px" font-weight="bold" fill="#ffffff">3</text>
  <text x="912" y="680" font-family="sans-serif" font-size="24px" fill="#303a36">Decrements TTL to 63 and</text>
  <text x="912" y="710" font-family="sans-serif" font-size="24px" fill="#303a36">recalculates IP checksum</text>

  
  <line x1="1190" y1="737" x2="1190" y2="760" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="845" y="765" width="690" height="230" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <rect x="845" y="765" width="690" height="38" rx="10" fill="#207448" />
  <text x="865" y="792" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Egress frame header on eth1:</text>

  <text x="865" y="830" font-family="monospace" font-size="24px" fill="#303a36">Destination MAC rewritten to Next-Hop MAC</text>
  <text x="865" y="862" font-family="monospace" font-size="24px" fill="#303a36">(00:55:66:77:88:99)</text>
  <text x="865" y="900" font-family="monospace" font-size="24px" fill="#303a36">Source MAC rewritten to Router Egress MAC eth1</text>
  <text x="865" y="932" font-family="monospace" font-size="24px" fill="#303a36">(00:aa:bb:cc:dd:02)</text>
  <text x="865" y="968" font-family="monospace" font-size="24px" fill="#303a36">TTL decremented to 63, new FCS generated</text>

  
  <rect x="845" y="1010" width="690" height="117" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="3" />
  <text x="1190" y="1052" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#c0392b">Red solid boundary line indicates router</text>
  <text x="1190" y="1088" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#c0392b">drops L2 broadcasts, containing broadcast domains</text>

  
  
  
  <rect x="40" y="1175" width="1520" height="275" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <rect x="65" y="1198" width="1470" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="65" y="1198" width="310" height="66" rx="8" fill="#207448" />
  <text x="220" y="1240" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Addressing/Header</text>
  <text x="395" y="1240" font-family="sans-serif" font-size="24px" fill="#303a36">MAC preserved vs MAC rewritten and TTL decremented</text>

  
  <rect x="65" y="1280" width="1470" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="65" y="1280" width="310" height="66" rx="8" fill="#207448" />
  <text x="220" y="1322" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Scaling</text>
  <text x="395" y="1322" font-family="sans-serif" font-size="24px" fill="#303a36">FDB flat per host vs FIB prefix aggregation</text>

  
  <rect x="65" y="1362" width="1470" height="66" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <rect x="65" y="1362" width="310" height="66" rx="8" fill="#207448" />
  <text x="220" y="1404" text-anchor="middle" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">Broadcasts</text>
  <text x="395" y="1404" font-family="sans-serif" font-size="24px" fill="#303a36">flooded vs contained</text>

</svg>