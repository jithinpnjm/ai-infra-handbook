<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The same journey for AI workloads: which steps each one uses</title>
  <desc>Visual matrix comparing network stack traversal across AI workloads, from DNS and routing to TCP, TLS, HTTP, and RDMA bypass.</desc>

  <defs>
    <marker id="orange-arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">The same journey for AI workloads: which steps each one uses</text>

  
  <g>
    
    <rect x="240" y="68" width="180" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="330" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">DNS</text>

    
    <rect x="430" y="68" width="210" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="535" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">route and ARP</text>

    
    <rect x="650" y="68" width="120" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="710" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TCP</text>

    
    <rect x="780" y="68" width="240" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="900" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">TLS</text>

    
    <rect x="1030" y="68" width="190" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="1125" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">HTTP</text>

    
    <rect x="1230" y="68" width="330" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="1395" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">RDMA bypass</text>
  </g>

  
  <g>
    <rect x="40" y="118" width="1520" height="166" rx="12" fill="#ffffff" stroke="#c8d8cc" stroke-width="1.5" />

    
    <rect x="40" y="118" width="190" height="166" rx="12" fill="#e8f1ea" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 135 130 L 165 145 L 165 175 L 135 190 L 105 175 L 105 145 Z" />
      <path d="M 135 145 L 135 190" />
      <path d="M 105 145 L 135 160 L 165 145" />
    </g>
    <text x="135" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="135" dy="0">Container</tspan>
      <tspan x="135" dy="34">image pull</tspan>
    </text>

    
    
    <rect x="240" y="128" width="180" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="330" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="330" dy="0">DNS yes</tspan>
      <tspan x="330" dy="30">(registry name)</tspan>
    </text>

    
    <rect x="430" y="128" width="210" height="84" rx="8" fill="#f8faf8" stroke="#d5e0d7" stroke-width="1.5" stroke-dasharray="6,4" />

    
    <rect x="650" y="128" width="120" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="710" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">TCP yes</text>

    
    <rect x="780" y="128" width="240" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="900" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="900" dy="0">TLS yes</tspan>
      <tspan x="900" dy="26">(often through a</tspan>
      <tspan x="900" dy="26">corporate proxy or mirror,</tspan>
      <tspan x="900" dy="26">authenticates)</tspan>
    </text>

    
    <rect x="1030" y="128" width="190" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1125" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1125" dy="0">HTTP yes</tspan>
      <tspan x="1125" dy="30">(layers over HTTP/2 or HTTP/1.1)</tspan>
    </text>

    
    <rect x="1230" y="128" width="310" height="84" rx="8" fill="#f8faf8" stroke="#d5e0d7" stroke-width="1.5" stroke-dasharray="6,4" />

    
    <rect x="240" y="222" width="1300" height="52" rx="6" fill="#f0f5f1" stroke="#c8d8cc" stroke-width="1" />
    <text x="256" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">slow pulls: DNS, TLS chain or proxy, MTU black holes on cloud overlays, rate limits, a congested NAT gateway</text>
  </g>

  
  <g>
    <rect x="40" y="294" width="1520" height="162" rx="12" fill="#ffffff" stroke="#c8d8cc" stroke-width="1.5" />

    
    <rect x="40" y="294" width="190" height="162" rx="12" fill="#e8f1ea" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="135" cy="320" rx="30" ry="10" />
      <path d="M 105 320 L 105 344 A 30 10 0 0 0 165 344 L 165 320" />
      <path d="M 105 344 L 105 368 A 30 10 0 0 0 165 368 L 165 344" />
    </g>
    <text x="135" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="135" dy="0">Object storage</tspan>
      <tspan x="135" dy="34">(GCS, S3)</tspan>
    </text>

    
    <rect x="240" y="304" width="400" height="66" rx="8" fill="#f8faf8" stroke="#d5e0d7" stroke-width="1.5" stroke-dasharray="6,4" />

    
    <rect x="650" y="304" width="570" height="66" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="935" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">HTTPS with many parallel connections</text>

    
    <rect x="1230" y="304" width="310" height="66" rx="8" fill="#f8faf8" stroke="#d5e0d7" stroke-width="1.5" stroke-dasharray="6,4" />

    
    <rect x="240" y="380" width="1300" height="66" rx="6" fill="#f0f5f1" stroke="#c8d8cc" stroke-width="1" />
    <text x="256" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="256" dy="0">per-connection throughput limited by RTT and window; per instance by the NIC and cloud caps;</tspan>
      <tspan x="256" dy="28">per prefix or bucket by quotas; private endpoints change DNS and path</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="466" width="1520" height="194" rx="12" fill="#ffffff" stroke="#c8d8cc" stroke-width="1.5" />

    
    <rect x="40" y="466" width="190" height="194" rx="12" fill="#e8f1ea" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="135" cy="492" r="10" />
      <circle cx="112" cy="528" r="10" />
      <circle cx="158" cy="528" r="10" />
      <line x1="135" y1="502" x2="112" y2="518" />
      <line x1="135" y1="502" x2="158" y2="518" />
      <line x1="122" y1="528" x2="148" y2="528" />
    </g>
    <text x="135" y="562" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#303a36">
      <tspan x="135" dy="0" font-size="30" font-weight="bold">Cluster</tspan>
      <tspan x="135" dy="32" font-size="30" font-weight="bold">bootstrap</tspan>
      <tspan x="135" dy="30" font-size="24">(torchrun, MPI,</tspan>
      <tspan x="135" dy="26" font-size="24">NCCL rendezvous)</tspan>
    </text>

    
    <rect x="240" y="478" width="530" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="256" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#207448">
      <tspan x="256" dy="0">TCP on the management or front-end network</tspan>
    </text>
    <rect x="256" y="542" width="498" height="92" rx="6" fill="#ffffff" stroke="#c8d8cc" stroke-width="1" />
    <text x="272" y="574" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="272" dy="0">depends on hostnames, DNS,</tspan>
      <tspan x="272" dy="30" font-family="monospace, monospace">/etc/hosts</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">, </tspan>
      <tspan font-family="monospace, monospace">NCCL_SOCKET_IFNAME</tspan>
    </text>

    
    <path d="M 770 563 L 836 563" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#orange-arrow)" />

    
    <rect x="840" y="478" width="700" height="170" rx="8" fill="#fff8f2" stroke="#db8129" stroke-width="3" />
    <text x="862" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">
      <tspan x="862" dy="0">RDMA verbs over InfiniBand or RoCE bypass the</tspan>
      <tspan x="862" dy="38">kernel TCP/IP stack; GPUDirect RDMA reads GPU</tspan>
      <tspan x="862" dy="38">memory without CPU copies</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="668" width="1520" height="136" rx="12" fill="#ffffff" stroke="#c8d8cc" stroke-width="1.5" />

    
    <rect x="40" y="668" width="190" height="136" rx="12" fill="#e8f1ea" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 135 682 L 162 698 L 162 728 L 135 744 L 108 728 L 108 698 Z" />
      <circle cx="135" cy="713" r="7" fill="#207448" />
    </g>
    <text x="135" y="776" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod request</text>

    
    <rect x="240" y="678" width="1300" height="116" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="256" y="711" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="256" dy="0">CoreDNS lookups with </tspan>
      <tspan font-family="monospace, monospace">ndots:5</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">, service virtual IPs translated by </tspan>
      <tspan font-family="monospace, monospace">kube-proxy</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> or </tspan>
      <tspan font-family="monospace, monospace">eBPF</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif"> through </tspan>
      <tspan font-family="monospace, monospace">DNAT</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">,</tspan>
      <tspan x="256" dy="34">a CNI veth or bridge or a VXLAN overlay, NetworkPolicy,</tspan>
      <tspan x="256" dy="34">then the node's normal path</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="812" width="1520" height="112" rx="12" fill="#ffffff" stroke="#c8d8cc" stroke-width="1.5" />

    
    <rect x="40" y="812" width="190" height="112" rx="12" fill="#e8f1ea" />
    
    <path d="M 115 852 A 14 14 0 0 1 138 840 A 18 18 0 0 1 160 852 A 12 12 0 0 1 160 870 L 115 870 A 12 12 0 0 1 115 852 Z" stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" />
    <text x="135" y="902" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud</text>

    
    <rect x="240" y="822" width="1300" height="92" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="256" y="858" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="256" dy="0">the router and switch are virtual: VPC routing, firewall rules,</tspan>
      <tspan x="256" dy="32">NAT gateways, load balancers, peering</tspan>
    </text>
  </g>

  
  <g>
    
    <rect x="40" y="934" width="750" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 75 956 L 98 966 L 98 996 Q 98 1018 75 1028 Q 52 1018 52 996 L 52 966 Z" />
      <line x1="75" y1="974" x2="75" y2="996" />
      <circle cx="75" cy="1008" r="2" fill="#207448" />
    </g>
    <text x="115" y="982" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="115" dy="0">A cluster can show healthy RDMA traffic</tspan>
      <tspan x="115" dy="36">and still fail to start a job, because the</tspan>
      <tspan x="115" dy="36">ordinary TCP part broke first</tspan>
    </text>

    
    <rect x="810" y="934" width="750" height="160" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g stroke="#207448" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 830 1006 A 26 26 0 1 1 874 1006" />
      <line x1="852" y1="992" x2="866" y2="974" />
      <circle cx="852" cy="992" r="3" fill="#207448" />
    </g>
    <text x="886" y="982" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="886" dy="0">RDMA traffic is not visible to </tspan>
      <tspan font-family="monospace, monospace">tcpdump</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">, </tspan>
      <tspan font-family="monospace, monospace">iptables</tspan>
      <tspan x="886" dy="36">or </tspan>
      <tspan font-family="monospace, monospace">ss</tspan>
      <tspan font-family="system-ui, -apple-system, sans-serif">: use RDMA tools and NIC counters</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1106" width="1520" height="66" rx="8" fill="#207448" />
    <text x="800" y="1148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">List which steps a workload uses before you start troubleshooting its network</text>
  </g>
</svg>