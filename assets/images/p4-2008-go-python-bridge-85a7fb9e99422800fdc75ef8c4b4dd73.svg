<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <title>Python standard library tools and their Go equivalents</title>
  <desc>A side-by-side comparison matrix comparing Python standard library tools with their Go equivalent implementations across five key algorithmic features.</desc>

  
  <rect width="1600" height="1400" fill="#f5f8f5"/>

  
  <text x="40" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#207448">Python standard library tools and their Go equivalents</text>

  
  <rect x="40" y="95" width="1520" height="65" rx="8" fill="#207448"/>

  
  <text x="155" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Feature / Pattern</text>
  <text x="490" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Python stdlib tool</text>
  <text x="925" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Go equivalent implementation</text>
  <text x="1355" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Interview trade-off note</text>

  
  
  <rect x="40" y="175" width="230" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="133" y="196" width="9" height="26" rx="2" fill="#207448"/>
  <rect x="146" y="188" width="9" height="34" rx="2" fill="#207448"/>
  <rect x="159" y="192" width="9" height="30" rx="2" fill="#207448"/>
  <rect x="172" y="204" width="9" height="18" rx="2" fill="#207448"/>
  <text x="155" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="155" dy="0">Frequency</tspan>
    <tspan x="155" dy="32">counting</tspan>
  </text>

  
  <rect x="280" y="175" width="420" height="175" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="310" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">Counter(s)</text>

  
  <rect x="710" y="175" width="430" height="175" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="740" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">map[rune]int</text>
  <text x="740" y="285" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">m[r]++</tspan></text>

  
  <rect x="1150" y="175" width="410" height="175" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1175" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">Go maps return the zero</tspan>
    <tspan x="1175" dy="30">value (0) on missing</tspan>
    <tspan x="1175" dy="30">keys, eliminating the</tspan>
    <tspan x="1175" dy="30">need for defaultdict.</tspan>
  </text>

  
  
  <rect x="40" y="365" width="230" height="370" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="155" cy="455" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="127" cy="505" r="11" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="183" cy="505" r="11" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="145" y1="467" x2="135" y2="495" stroke="#207448" stroke-width="3"/>
  <line x1="165" y1="467" x2="175" y2="495" stroke="#207448" stroke-width="3"/>
  <text x="155" y="565" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="155" dy="0">Priority Queue /</tspan>
    <tspan x="155" dy="32">Heap</tspan>
  </text>

  
  <rect x="280" y="365" width="420" height="370" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="310" y="500" font-size="24" fill="#303a36">
    <tspan x="310" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">heapq.heappush /</tspan>
    <tspan x="310" dy="32" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">heappop</tspan>
    <tspan x="310" dy="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(built-in min-heap</tspan>
    <tspan x="310" dy="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">over list)</tspan>
  </text>

  
  <rect x="710" y="365" width="430" height="370" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="740" y="420" font-size="24" fill="#303a36">
    <tspan x="740" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">container/heap</tspan>
    <tspan x="740" dy="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">requiring custom</tspan>
    <tspan x="740" dy="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">slice type</tspan>
    <tspan x="740" dy="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">intHeap []int</tspan>
    <tspan x="740" dy="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">implementing 5</tspan>
    <tspan x="740" dy="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">interface methods:</tspan>
    <tspan x="740" dy="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Len(), Less(), Swap(),</tspan>
    <tspan x="740" dy="32" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Push(any), Pop() any</tspan>
    <tspan x="740" dy="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">with pointer receivers</tspan>
  </text>

  
  <rect x="1150" y="365" width="410" height="370" rx="8" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <path d="M 1340 455 L 1355 425 L 1370 455 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
  <line x1="1355" y1="437" x2="1355" y2="445" stroke="#db8129" stroke-width="3"/>
  <circle cx="1355" cy="450" r="1.5" fill="#db8129"/>
  <text x="1175" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">High interview</tspan>
    <tspan x="1175" dy="34">boilerplate in Go; know</tspan>
    <tspan x="1175" dy="34">the 5 methods by</tspan>
    <tspan x="1175" dy="34">heart or use Python.</tspan>
  </text>

  
  
  <rect x="40" y="750" width="230" height="160" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="150" cy="785" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="160" y1="795" x2="173" y2="808" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="845" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="155" dy="0">Binary search</tspan>
    <tspan x="155" dy="32">lower bound</tspan>
  </text>

  
  <rect x="280" y="750" width="420" height="160" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="310" y="840" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">bisect.bisect_left(a, x)</text>

  
  <rect x="710" y="750" width="430" height="160" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="740" y="840" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">sort.SearchInts(a, x)</text>

  
  <rect x="1150" y="750" width="410" height="160" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1175" y="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">Both return the</tspan>
    <tspan x="1175" dy="32">first index where</tspan>
    <tspan x="1175" dy="32">element &gt;= x.</tspan>
  </text>

  
  
  <rect x="40" y="925" width="230" height="230" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="135" y="960" width="28" height="20" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="147" y="972" width="28" height="20" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  <text x="155" y="1035" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="155" dy="0">Sorting</tspan>
    <tspan x="155" dy="32">stability</tspan>
  </text>

  
  <rect x="280" y="925" width="420" height="230" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="310" y="1005" font-size="24" fill="#303a36">
    <tspan x="310" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">list.sort()</tspan>
    <tspan x="310" dy="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(Timsort,</tspan>
    <tspan x="310" dy="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">guaranteed stable)</tspan>
  </text>

  
  <rect x="710" y="925" width="430" height="230" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="740" y="975" font-size="24" fill="#303a36">
    <tspan x="740" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">sort.Slice()</tspan>
    <tspan x="740" dy="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(unstable)</tspan>
    <tspan x="740" dy="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">vs</tspan>
    <tspan x="740" dy="32" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">sort.SliceStable()</tspan>
    <tspan x="740" dy="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(stable)</tspan>
  </text>

  
  <rect x="1150" y="925" width="410" height="230" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1175" y="1010" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">Go requires explicit</tspan>
    <tspan x="1175" dy="34">SliceStable to preserve</tspan>
    <tspan x="1175" dy="34">order of equal keys.</tspan>
  </text>

  
  
  <rect x="40" y="1170" width="230" height="190" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="135" y="1195" width="40" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="145" y1="1207" x2="165" y2="1207" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="1217" x2="157" y2="1217" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="1275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="155" dy="0">String element</tspan>
    <tspan x="155" dy="32">access</tspan>
  </text>

  
  <rect x="280" y="1170" width="420" height="190" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="310" y="1250" font-size="24" fill="#303a36">
    <tspan x="310" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">for ch in s</tspan>
    <tspan x="310" dy="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(characters)</tspan>
  </text>

  
  <rect x="710" y="1170" width="430" height="190" rx="8" fill="#ffffff" stroke="#d0dfd4" stroke-width="2"/>
  <text x="740" y="1235" font-size="24" fill="#303a36">
    <tspan x="740" dy="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">for _, r := range s</tspan>
    <tspan x="740" dy="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">(yields runes,</tspan>
    <tspan x="740" dy="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">not raw bytes)</tspan>
  </text>

  
  <rect x="1150" y="1170" width="410" height="190" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="1175" y="1230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1175" dy="0">Slicing bytes directly in</tspan>
    <tspan x="1175" dy="30">Go can corrupt multi-byte</tspan>
    <tspan x="1175" dy="30">UTF-8 characters.</tspan>
  </text>
</svg>