<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <title>What lives in /proc/PID</title>
  <desc>Visual map of the Linux /proc/PID process directory and system-wide diagnostic files.</desc>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1160" fill="#f5f8f5" />

  <!-- Title -->
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">What lives in /proc/PID</text>

  <!-- ==================== SPOKE ARROWS (underneath boxes) ==================== -->
  <g stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. To cwd, exe, root -->
    <path d="M 630 465 L 630 295 L 270 295 L 270 283" marker-end="url(#arrow-green)" />

    <!-- 2. To fd/ -->
    <line x1="800" y1="465" x2="800" y2="283" marker-end="url(#arrow-green)" />

    <!-- 3. To maps and smaps -->
    <path d="M 970 465 L 970 295 L 1330 295 L 1330 283" marker-end="url(#arrow-green)" />

    <!-- 4. To cmdline -->
    <path d="M 580 490 L 525 490 L 525 377 L 498 377" marker-end="url(#arrow-green)" />

    <!-- 5. To environ -->
    <line x1="580" y1="540" x2="498" y2="540" marker-end="url(#arrow-green)" />

    <!-- 6. To status -->
    <path d="M 580 590 L 525 590 L 525 752 L 498 752" marker-end="url(#arrow-green)" />

    <!-- 7. To limits -->
    <path d="M 1020 490 L 1075 490 L 1075 377 L 1102 377" marker-end="url(#arrow-green)" />

    <!-- 8. To io -->
    <line x1="1020" y1="557" x2="1102" y2="557" marker-end="url(#arrow-green)" />

    <!-- 9. To wchan and stack -->
    <path d="M 1020 590 L 1075 590 L 1075 752 L 1102 752" marker-end="url(#arrow-green)" />

    <!-- 10. To cgroup -->
    <line x1="660" y1="615" x2="660" y2="667" marker-end="url(#arrow-green)" />

    <!-- 11. To ns/ -->
    <line x1="940" y1="615" x2="940" y2="667" marker-end="url(#arrow-green)" />
  </g>

  <!-- ==================== TOP ROW NODES ==================== -->

  <!-- Node: cwd, exe, root (symlinks) -->
  <g id="node-cwd-exe-root">
    <rect x="50" y="120" width="440" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Link Icon -->
    <g transform="translate(246, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="12" width="26" height="16" rx="8" />
      <rect x="20" y="12" width="26" height="16" rx="8" />
      <line x1="16" y1="20" x2="32" y2="20" />
    </g>
    <text x="270" y="212" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cwd, exe, root</text>
    <text x="270" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(symlinks)</text>
  </g>

  <!-- Node: fd/ (one symlink per open descriptor) -->
  <g id="node-fd">
    <rect x="540" y="120" width="520" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Descriptors array Icon -->
    <g transform="translate(776, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="28" rx="4" />
      <line x1="17" y1="6" x2="17" y2="34" />
      <line x1="31" y1="6" x2="31" y2="34" />
      <circle cx="10" cy="20" r="2" fill="#207448" />
      <circle cx="24" cy="20" r="2" fill="#207448" />
      <circle cx="38" cy="20" r="2" fill="#207448" />
    </g>
    <text x="800" y="212" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">fd/</text>
    <text x="800" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(one symlink per open descriptor)</text>
  </g>

  <!-- Node: maps and smaps (memory mappings) -->
  <g id="node-maps-smaps">
    <rect x="1110" y="120" width="440" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Memory layout blocks Icon -->
    <g transform="translate(1306, 136)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="36" height="32" rx="3" />
      <line x1="6" y1="14" x2="42" y2="14" />
      <line x1="6" y1="24" x2="42" y2="24" />
      <line x1="20" y1="4" x2="20" y2="14" />
      <line x1="28" y1="14" x2="28" y2="24" />
      <line x1="16" y1="24" x2="16" y2="36" />
    </g>
    <text x="1330" y="212" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">maps and smaps</text>
    <text x="1330" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(memory mappings)</text>
  </g>

  <!-- ==================== LEFT COLUMN NODES ==================== -->

  <!-- Node: cmdline -->
  <g id="node-cmdline">
    <rect x="50" y="315" width="440" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Terminal prompt Icon -->
    <g transform="translate(246, 329)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="28" rx="4" />
      <path d="M 12 15 L 18 20 L 12 25" />
      <line x1="22" y1="25" x2="32" y2="25" />
    </g>
    <text x="270" y="405" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cmdline</text>
  </g>

  <!-- Node: environ -->
  <g id="node-environ">
    <rect x="50" y="480" width="440" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Variable assignment / Braces Icon -->
    <g transform="translate(246, 494)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 8 C 8 8 8 16 8 20 C 8 24 4 20 4 20 C 4 20 8 20 8 24 C 8 28 8 32 14 32" />
      <path d="M 34 8 C 40 8 40 16 40 20 C 40 24 44 20 44 20 C 44 20 40 20 40 24 C 40 28 40 32 34 32" />
      <line x1="18" y1="20" x2="30" y2="20" />
    </g>
    <text x="270" y="570" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">environ</text>
  </g>

  <!-- Node: status (name, state, UIDs, VmRSS) -->
  <g id="node-status">
    <rect x="50" y="675" width="440" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Status checklist Icon -->
    <g transform="translate(246, 691)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="36" height="32" rx="4" />
      <polyline points="12,18 18,24 24,14" />
      <line x1="28" y1="16" x2="36" y2="16" />
      <line x1="14" y1="28" x2="36" y2="28" />
    </g>
    <text x="270" y="767" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">status</text>
    <text x="270" y="801" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(name, state, UIDs, VmRSS)</text>
  </g>

  <!-- ==================== RIGHT COLUMN NODES ==================== -->

  <!-- Node: limits -->
  <g id="node-limits">
    <rect x="1110" y="315" width="440" height="125" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Gauge / Threshold Icon -->
    <g transform="translate(1306, 329)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 32 A 18 18 0 1 1 40 32" />
      <line x1="24" y1="28" x2="34" y2="16" />
      <circle cx="24" cy="28" r="3" fill="#207448" />
    </g>
    <text x="1330" y="405" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">limits</text>
  </g>

  <!-- Node: io (read_bytes, write_bytes) -->
  <g id="node-io">
    <rect x="1110" y="480" width="440" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Disk I/O Icon -->
    <g transform="translate(1306, 496)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="10" rx="18" ry="6" />
      <path d="M 6 10 L 6 28 C 6 32 42 32 42 28 L 42 10" />
      <path d="M 6 19 C 6 23 42 23 42 19" />
    </g>
    <text x="1330" y="572" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">io</text>
    <text x="1330" y="606" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(read_bytes, write_bytes)</text>
  </g>

  <!-- Node: wchan and stack (kernel function waiting in) -->
  <g id="node-wchan-stack">
    <rect x="1110" y="675" width="440" height="155" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Call Stack Icon -->
    <g transform="translate(1306, 691)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="6" width="32" height="7" rx="2" />
      <rect x="8" y="16" width="32" height="7" rx="2" />
      <rect x="8" y="26" width="32" height="7" rx="2" />
    </g>
    <text x="1330" y="767" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">wchan and stack</text>
    <text x="1330" y="801" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(kernel function waiting in)</text>
  </g>

  <!-- ==================== CENTER: /proc/PID ==================== -->
  <g id="node-proc-pid">
    <rect x="580" y="465" width="440" height="150" rx="16" fill="#207448" stroke="#207448" stroke-width="3" />
    <!-- Folder Icon -->
    <g transform="translate(776, 483)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 8 L 18 8 L 24 14 L 44 14 A 3 3 0 0 1 47 17 L 47 34 A 3 3 0 0 1 44 37 L 4 37 A 3 3 0 0 1 1 34 L 1 11 A 3 3 0 0 1 4 8 Z" />
      <line x1="1" y1="16" x2="47" y2="16" />
    </g>
    <text x="800" y="572" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#ffffff">/proc/PID</text>
  </g>

  <!-- ==================== MID-BOTTOM NODES ==================== -->

  <!-- Node: cgroup -->
  <g id="node-cgroup">
    <rect x="540" y="675" width="240" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Hierarchy tree Icon -->
    <g transform="translate(636, 691)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="4" width="12" height="10" rx="2" />
      <line x1="24" y1="14" x2="24" y2="22" />
      <line x1="12" y1="22" x2="36" y2="22" />
      <rect x="6" y="22" width="12" height="10" rx="2" />
      <rect x="30" y="22" width="12" height="10" rx="2" />
    </g>
    <text x="660" y="775" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">cgroup</text>
  </g>

  <!-- Node: ns/ -->
  <g id="node-ns">
    <rect x="820" y="675" width="240" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <!-- Namespace shield / enclosure Icon -->
    <g transform="translate(916, 691)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="20" r="16" />
      <circle cx="24" cy="20" r="8" fill="#e8f1ea" />
    </g>
    <text x="940" y="775" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">ns/</text>
  </g>

  <!-- ==================== BOTTOM ROW ==================== -->

  <!-- Separate small box: system-wide /proc/loadavg, /proc/meminfo, /proc/pressure/* -->
  <g id="box-system-wide">
    <rect x="100" y="875" width="680" height="195" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <!-- System globe / monitor Icon -->
    <g transform="translate(416, 891)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="20" r="16" />
      <ellipse cx="24" cy="20" rx="7" ry="16" />
      <line x1="8" y1="20" x2="40" y2="20" />
    </g>
    <text x="440" y="968" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">system-wide</text>
    <text x="440" y="1008" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="440" dy="0">/proc/loadavg, /proc/meminfo, </tspan>
      <tspan x="440" dy="34">/proc/pressure/*</tspan>
    </text>
  </g>

  <!-- Orange note: reading these is how ps and top work -->
  <g id="box-orange-note">
    <rect x="820" y="875" width="680" height="195" rx="14" fill="#fff9f5" stroke="#db8129" stroke-width="3" />
    <!-- Magnifying Glass / Inspection Icon -->
    <g transform="translate(1136, 891)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="18" r="12" />
      <line x1="29" y1="27" x2="41" y2="39" />
      <line x1="16" y1="18" x2="24" y2="18" />
      <line x1="20" y1="14" x2="20" y2="22" />
    </g>
    <text x="1160" y="975" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="1160" dy="0">reading these is how </tspan>
      <tspan x="1160" dy="38">ps and top work</tspan>
    </text>
  </g>

</svg>