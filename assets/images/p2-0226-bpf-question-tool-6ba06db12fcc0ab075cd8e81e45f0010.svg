<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Match the question to the BPF tool that answers it</title>
  <desc>A decision map mapping network performance and troubleshooting questions to corresponding BPF analysis tools.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Match the question to the BPF tool that answers it</text>

  
  <path d="M 230 420 C 285 420 285 157 340 157" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 460 C 285 460 285 271 340 271" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 500 C 285 500 285 385 340 385" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M 230 535 C 285 535 285 499 340 499" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 575 C 285 575 285 613 340 613" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 610 C 285 610 285 727 340 727" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 650 C 285 650 285 841 340 841" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 230 690 C 285 690 285 955 340 955" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <line x1="950" y1="157" x2="1030" y2="157" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="271" x2="1030" y2="271" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="385" x2="1030" y2="385" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <line x1="950" y1="499" x2="1030" y2="499" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="613" x2="1030" y2="613" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="727" x2="1030" y2="727" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="841" x2="1030" y2="841" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="950" y1="955" x2="1030" y2="955" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <g id="central-box">
    <rect x="40" y="340" width="190" height="432" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    
    <g transform="translate(135, 465)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="7" fill="#207448"/>
      <line x1="0" y1="-22" x2="0" y2="-32" stroke="#207448" stroke-width="3.5"/>
      <circle cx="0" cy="-35" r="4" fill="#207448"/>
      <line x1="19" y1="11" x2="28" y2="16" stroke="#207448" stroke-width="3.5"/>
      <circle cx="31" cy="18" r="4" fill="#207448"/>
      <line x1="-19" y1="11" x2="-28" y2="16" stroke="#207448" stroke-width="3.5"/>
      <circle cx="-31" cy="18" r="4" fill="#207448"/>
    </g>
    <text x="135" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#207448">
      <tspan x="135" dy="0">Network</tspan>
      <tspan x="135" dy="40">question</tspan>
    </text>
  </g>

  
  <g id="row-1">
    
    <rect x="340" y="110" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 133)">
      <rect x="2" y="10" width="16" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <rect x="30" y="10" width="16" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="18" y1="19" x2="30" y2="19" stroke="#207448" stroke-width="3.5"/>
      <line x1="18" y1="29" x2="30" y2="29" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="430" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Which processes connect</tspan>
      <tspan x="430" dy="34">or accept, and where?</tspan>
    </text>

    
    <rect x="1030" y="110" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 133)">
      <rect x="2" y="4" width="44" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="2" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="3"/>
      <path d="M 10 24 L 16 29 L 10 34" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="22" y1="34" x2="32" y2="34" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1116" y="150" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1116" dy="0">tcpconnect, tcpaccept,</tspan>
      <tspan x="1116" dy="32">sockstat</tspan>
    </text>
  </g>

  
  <g id="row-2">
    
    <rect x="340" y="224" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 247)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="24,10 24,24 34,24" fill="none" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="430" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">How long do sessions live,</tspan>
      <tspan x="430" dy="34">and how much do they move?</tspan>
    </text>

    
    <rect x="1030" y="224" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 247)">
      <line x1="4" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="3.5"/>
      <circle cx="8" cy="24" r="5" fill="#207448"/>
      <circle cx="40" cy="24" r="5" fill="#207448"/>
      <path d="M 24 12 L 24 24" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1116" y="280" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">tcplife</text>
  </g>

  
  <g id="row-3">
    
    <rect x="340" y="338" width="610" height="94" rx="10" fill="#fff8f2" stroke="#db8129" stroke-width="3.5"/>
    
    <g transform="translate(362, 361)">
      <path d="M 12 24 A 14 14 0 1 1 24 38" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <polyline points="24,44 24,34 14,34" fill="none" stroke="#db8129" stroke-width="3.5"/>
    </g>
    <text x="430" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Which flows retransmit,</tspan>
      <tspan x="430" dy="34">and in which state?</tspan>
    </text>

    
    <rect x="1030" y="338" width="530" height="94" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3.5"/>
    
    <g transform="translate(1052, 361)">
      <rect x="6" y="10" width="36" height="28" rx="3" fill="none" stroke="#db8129" stroke-width="3.5"/>
      <path d="M 14 24 L 34 24" stroke="#db8129" stroke-width="3.5"/>
      <polyline points="26,17 34,24 26,31" fill="none" stroke="#db8129" stroke-width="3.5"/>
    </g>
    <text x="1116" y="394" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#db8129">tcpretrans</text>
  </g>

  
  <g id="row-4">
    
    <rect x="340" y="452" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 475)">
      <rect x="8" y="6" width="32" height="24" rx="2" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="16" y1="36" x2="32" y2="44" stroke="#207448" stroke-width="3.5"/>
      <line x1="32" y1="36" x2="16" y2="44" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="430" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Why were packets dropped,</tspan>
      <tspan x="430" dy="34">and from which call stack?</tspan>
    </text>

    
    <rect x="1030" y="452" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 475)">
      <rect x="6" y="8" width="36" height="8" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="20" width="36" height="8" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="6" y="32" width="36" height="8" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1116" y="492" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1116" dy="0">tcpdrop, or</tspan>
      <tspan x="1116" dy="32">bpftrace on kfree_skb</tspan>
    </text>
  </g>

  
  <g id="row-5">
    
    <rect x="340" y="566" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 589)">
      <circle cx="24" cy="26" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="24" y1="4" x2="24" y2="8" stroke="#207448" stroke-width="3.5"/>
      <line x1="24" y1="26" x2="34" y2="18" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="430" y="606" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">How long does the handshake</tspan>
      <tspan x="430" dy="34">take per destination?</tspan>
    </text>

    
    <rect x="1030" y="566" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 589)">
      <path d="M 8 36 A 18 18 0 1 1 40 36" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="24" y1="24" x2="32" y2="14" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="1116" y="622" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">tcpconnlat</text>
  </g>

  
  <g id="row-6">
    
    <rect x="340" y="680" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 703)">
      <rect x="4" y="26" width="8" height="18" rx="1" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="16" y="18" width="8" height="26" rx="1" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="28" y="10" width="8" height="34" rx="1" fill="none" stroke="#207448" stroke-width="3"/>
      <rect x="40" y="2" width="8" height="42" rx="1" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="430" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Which process uses</tspan>
      <tspan x="430" dy="34">the most bandwidth?</tspan>
    </text>

    
    <rect x="1030" y="680" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 703)">
      <rect x="4" y="6" width="40" height="36" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="4" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="26" x2="36" y2="26" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="34" x2="28" y2="34" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1116" y="736" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">tcptop</text>
  </g>

  
  <g id="row-7">
    
    <rect x="340" y="794" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 817)">
      <path d="M 6 14 L 6 40 L 42 40 L 42 14" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="12" y1="32" x2="36" y2="32" stroke="#207448" stroke-width="3"/>
      <line x1="12" y1="24" x2="36" y2="24" stroke="#207448" stroke-width="3"/>
      <path d="M 24 16 L 24 4 M 18 10 L 24 4 L 30 10" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="430" y="834" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Is the listen backlog</tspan>
      <tspan x="430" dy="34">overflowing?</tspan>
    </text>

    
    <rect x="1030" y="794" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 817)">
      <rect x="4" y="6" width="40" height="36" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="10,28 18,20 26,26 36,14" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="1116" y="834" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1116" dy="0">solisten,</tspan>
      <tspan x="1116" dy="32">nstat ListenOverflows</tspan>
    </text>
  </g>

  
  <g id="row-8">
    
    <rect x="340" y="908" width="610" height="94" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(362, 931)">
      <rect x="10" y="10" width="28" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
      <line x1="16" y1="2" x2="16" y2="10" stroke="#207448" stroke-width="3"/>
      <line x1="24" y1="2" x2="24" y2="10" stroke="#207448" stroke-width="3"/>
      <line x1="32" y1="2" x2="32" y2="10" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="38" x2="16" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="24" y1="38" x2="24" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="32" y1="38" x2="32" y2="46" stroke="#207448" stroke-width="3"/>
      <path d="M 26 16 L 20 24 L 28 24 L 22 32" fill="none" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="430" y="948" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">
      <tspan x="430" dy="0">Is softirq or scheduler</tspan>
      <tspan x="430" dy="34">time the cost?</tspan>
    </text>

    
    <rect x="1030" y="908" width="530" height="94" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1052, 931)">
      <circle cx="24" cy="24" r="18" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="24,12 24,24 30,30" fill="none" stroke="#207448" stroke-width="3.5"/>
      <path d="M 4 24 L 0 24 M 48 24 L 44 24" stroke="#207448" stroke-width="3.5"/>
    </g>
    <text x="1116" y="948" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#207448">
      <tspan x="1116" dy="0">softirqs, hardirqs,</tspan>
      <tspan x="1116" dy="32">runqlat</tspan>
    </text>
  </g>

  
  <g id="takeaway-bar">
    <rect x="40" y="1055" width="1520" height="80" rx="12" fill="#207448"/>
    <text x="800" y="1106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">BPF tools complement the pcap, they do not replace it.</text>
  </g>
</svg>