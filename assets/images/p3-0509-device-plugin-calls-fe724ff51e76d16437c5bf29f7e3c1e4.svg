<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Device plugin conversation with the kubelet</title>
  <desc>Sequence diagram illustrating the gRPC registration, ListAndWatch streaming, allocation hinting, runtime allocation, checkpointing, and the Pod Resources API between the NVIDIA device plugin and the kubelet device manager.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g transform="translate(60, 40)">
    <text x="0" y="44" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Device plugin conversation with the kubelet</text>
  </g>

  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="380" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 17)">
      <rect x="10" y="10" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="4" />
      <rect x="18" y="18" width="20" height="20" fill="#207448" opacity="0.25" />
      <line x1="18" y1="2" x2="18" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="2" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="2" x2="38" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="46" x2="18" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="46" x2="28" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="46" x2="38" y2="54" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="18" x2="10" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="2" y1="38" x2="10" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="92" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">NVIDIA device plugin</text>
  </g>

  
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="410" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(20, 17)">
      <circle cx="28" cy="28" r="14" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="28" r="6" fill="#207448" opacity="0.3" />
      <path d="M 28 4 L 28 10 M 28 46 L 28 52 M 4 28 L 10 28 M 46 28 L 52 28 M 11 11 L 16 16 M 40 40 L 45 45 M 11 45 L 16 40 M 40 16 L 45 11" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="92" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">kubelet device manager</text>
  </g>

  
  
  <line x1="250" y1="200" x2="250" y2="1080" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.5" />
  
  <line x1="885" y1="200" x2="885" y2="1080" stroke="#207448" stroke-width="3" stroke-dasharray="8 8" opacity="0.5" />

  
  <g transform="translate(0, 220)">
    
    <circle cx="250" cy="50" r="24" fill="#207448" />
    <text x="250" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    
    <line x1="274" y1="50" x2="870" y2="50" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <rect x="290" y="70" width="560" height="85" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="306" y="104" font-family="sans-serif" font-size="24" fill="#303a36">plugin registers over gRPC at</text>
    <text x="306" y="136" font-family="monospace" font-size="24" fill="#303a36">/var/lib/kubelet/device-plugins/kubelet.sock</text>
  </g>

  
  <g transform="translate(0, 390)">
    
    <circle cx="250" cy="50" r="24" fill="#207448" />
    <text x="250" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    
    <line x1="274" y1="50" x2="870" y2="50" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <rect x="290" y="70" width="560" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="306" y="104" font-family="sans-serif" font-size="24" fill="#303a36">ListAndWatch: streams device IDs (GPU-uuid-0..7),</text>
    <text x="306" y="136" font-family="sans-serif" font-size="24" fill="#303a36">health (Healthy or Unhealthy on XID faults)</text>
    <text x="306" y="168" font-family="sans-serif" font-size="24" fill="#303a36">and NUMA topology hints</text>
  </g>

  
  <g transform="translate(0, 590)">
    
    <circle cx="885" cy="50" r="24" fill="#207448" />
    <text x="885" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    
    <line x1="861" y1="50" x2="265" y2="50" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <rect x="290" y="70" width="560" height="115" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="306" y="104" font-family="sans-serif" font-size="24" fill="#303a36">GetPreferredAllocation(available, count):</text>
    <text x="306" y="136" font-family="sans-serif" font-size="24" fill="#303a36">hint a good subset, for example 2 GPUs</text>
    <text x="306" y="168" font-family="sans-serif" font-size="24" fill="#303a36">on the same NVLink bridge or PCIe switch</text>
  </g>

  
  <g transform="translate(0, 790)">
    
    <circle cx="250" cy="50" r="24" fill="#db8129" />
    <text x="250" y="59" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    
    <line x1="274" y1="50" x2="870" y2="50" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
    
    
    <rect x="290" y="70" width="560" height="115" rx="8" fill="#e8f1ea" stroke="#db8129" stroke-width="2" />
    <text x="306" y="104" font-family="sans-serif" font-size="24" fill="#303a36">Allocate during syncPod: returns</text>
    <text x="306" y="136" font-family="monospace" font-size="24" fill="#303a36">NVIDIA_VISIBLE_DEVICES</text>
    <text x="610" y="136" font-family="sans-serif" font-size="24" fill="#303a36">, </text>
    <text x="626" y="136" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidia*</text>
    <text x="774" y="136" font-family="sans-serif" font-size="24" fill="#303a36"> paths,</text>
    <text x="306" y="168" font-family="sans-serif" font-size="24" fill="#303a36">CDI annotations</text>
  </g>

  
  <g transform="translate(0, 975)">
    
    <circle cx="885" cy="45" r="24" fill="#207448" />
    <text x="885" y="54" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    
    <path d="M 909 45 L 945 45 L 945 85 L 900 85" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <rect x="290" y="20" width="560" height="90" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="306" y="52" font-family="sans-serif" font-size="24" fill="#303a36">kubelet checkpoints to</text>
    <text x="306" y="82" font-family="monospace" font-size="24" fill="#303a36">/var/lib/kubelet/device-plugins/kubelet_internal_checkpoint</text>
    <text x="590" y="52" font-family="sans-serif" font-size="24" fill="#303a36">so a restart keeps allocations</text>
  </g>

  
  <g transform="translate(1130, 110)">
    <rect x="0" y="0" width="410" height="960" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    
    <g transform="translate(20, 24)">
      
      <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
      <circle cx="12" cy="8" r="3" fill="#207448" />
      <circle cx="22" cy="8" r="3" fill="#207448" />
      <circle cx="32" cy="8" r="3" fill="#207448" />
      
      <text x="74" y="38" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod Resources API</text>
    </g>

    
    <g transform="translate(24, 120)">
      
      <rect x="0" y="0" width="362" height="150" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="16" y="40" font-family="monospace" font-size="24" fill="#303a36">/var/lib/kubelet/</text>
      <text x="16" y="74" font-family="monospace" font-size="24" fill="#303a36">pod-resources/</text>
      <text x="16" y="108" font-family="monospace" font-size="24" fill="#303a36">kubelet.sock</text>
      <text x="16" y="136" font-family="sans-serif" font-size="24" fill="#303a36">offers List,</text>

      <rect x="0" y="170" width="362" height="100" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="16" y="210" font-family="sans-serif" font-size="24" fill="#303a36">GetAllocatableResources,</text>
      <text x="16" y="248" font-family="sans-serif" font-size="24" fill="#303a36">Get;</text>

      <rect x="0" y="290" width="362" height="230" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
      <text x="16" y="330" font-family="monospace" font-size="24" fill="#303a36">dcgm-exporter</text>
      <text x="16" y="370" font-family="sans-serif" font-size="24" fill="#303a36">uses it to label GPU</text>
      <text x="16" y="410" font-family="sans-serif" font-size="24" fill="#303a36">metrics with pod,</text>
      <text x="16" y="450" font-family="sans-serif" font-size="24" fill="#303a36">namespace and</text>
      <text x="16" y="490" font-family="sans-serif" font-size="24" fill="#303a36">container</text>
    </g>
  </g>

  
  <g transform="translate(60, 1100)">
    <rect x="0" y="0" width="1480" height="70" rx="10" fill="#207448" />
    <text x="30" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">DRA replaces integer counting with ResourceClaim and driver-published ResourceSlice</text>
  </g>
</svg>