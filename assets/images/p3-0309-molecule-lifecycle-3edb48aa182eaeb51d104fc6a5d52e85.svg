  <circle cx="80" cy="533" r="2.5" fill="#207448"/>
  <circle cx="88" cy="533" r="2.5" fill="#207448"/>
  <polyline points="80,550 86,555 80,560" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="560" x2="102" y2="560" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="630" font-family="monospace" font-size="25" font-weight="bold" fill="#303a36">
    <tspan x="70" dy="0">molecule init scenario -r ssh</tspan>
    <tspan x="70" dy="42">--driver-name docker</tspan>
  </text>

  
  <rect x="40" y="805" width="500" height="275" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="70" y="835" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="855" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="70" y="875" width="56" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <text x="70" y="960" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">
    <tspan x="70" dy="0">Docker, Podman, Vagrant</tspan>
    <tspan x="70" dy="42">or VirtualBox, cloud drivers</tspan>
  </text>

  
  <rect x="570" y="495" width="990" height="585" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 605 520 L 625 527 L 625 542 C 625 554 605 562 605 562 C 605 562 585 554 585 542 L 585 527 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
  <polyline points="597,540 603,546 613,534" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="645" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Testinfra verify</text>

  
  <rect x="595" y="575" width="940" height="115" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <text x="620" y="612" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="620" dy="0">hosts = testinfra.utils.ansible_runner.AnsibleRunner(</tspan>
    <tspan x="620" dy="32">    os.environ[MOLECULE_INVENTORY_FILE]</tspan>
    <tspan x="620" dy="32">).get_hosts(all)</tspan>
  </text>

  
  <rect x="595" y="705" width="940" height="270" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  
  <circle cx="625" cy="742" r="10" fill="#207448"/>
  <polyline points="620,742 624,746 631,738" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="750" font-family="monospace" font-size="24" fill="#303a36">host.package(openssh-server).is_installed</text>

  
  <circle cx="625" cy="798" r="10" fill="#207448"/>
  <polyline points="620,798 624,802 631,794" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="806" font-family="monospace" font-size="24" fill="#303a36">host.service(sshd).is_running</text>

  
  <circle cx="625" cy="860" r="10" fill="#207448"/>
  <polyline points="620,860 624,864 631,856" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="860" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="650" dy="0">host.file(/etc/ssh/ssh_host_ed25519_key.pub)</tspan>
    <tspan x="690" dy="30">.mode == 0o644</tspan>
  </text>

  
  <circle cx="625" cy="942" r="10" fill="#207448"/>
  <polyline points="620,942 624,946 631,938" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="950" font-family="monospace" font-size="24" fill="#303a36">host.user(sshd).exists</text>

  
  <rect x="595" y="990" width="940" height="70" rx="8" fill="#ffffff" stroke="#c2d8c7" stroke-width="1.5"/>
  <polygon points="625,1008 615,1026 623,1026 619,1042 633,1022 625,1022" fill="#207448"/>
  <text x="650" y="1034" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">Goss: goss -g test_sshd.yml validate</text>

  
  <rect x="40" y="1105" width="1520" height="70" rx="10" fill="#207448"/>
  <text x="800" y="1149" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Testinfra checks the real state of the host</text>
</svg>