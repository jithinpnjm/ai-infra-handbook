  <text x="40" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Molecule role lifecycle and the Testinfra assertions</text>
  <text x="40" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#52635b">
    <tspan x="40" dy="0">Ansible: Up and Running, chapter 14, Quality Assurance with Molecule;</tspan>
    <tspan x="40" dy="32">modelled in code/part03/python_testing_quality_ci.py</tspan>
  </text>

  
  
