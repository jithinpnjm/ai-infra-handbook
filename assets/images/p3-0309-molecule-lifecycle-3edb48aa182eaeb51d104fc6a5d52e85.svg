  </text>
  <text x="800" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#db8129" text-anchor="middle">
    <tspan x="800" dy="0">run the role again</tspan>
    <tspan x="800" dy="32">and expect no changes</tspan>
  </text>

  
