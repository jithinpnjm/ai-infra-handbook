    <tspan x="475" dy="0">molecule</tspan>
    <tspan x="475" dy="40">converge</tspan>
  </text>

  
  <line x1="610" y1="320" x2="640" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <rect x="640" y="180" width="320" height="280" rx="12" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
  <circle cx="682" cy="225" r="22" fill="#db8129"/>
