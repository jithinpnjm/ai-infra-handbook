    <tspan x="175" dy="40">create</tspan>
  </text>

  
  <line x1="310" y1="320" x2="340" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrowhead)"/>

  
  <rect x="340" y="180" width="270" height="280" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="382" cy="225" r="22" fill="#207448"/>
