    <tspan x="1425" dy="40">destroy</tspan>
  </text>

  
  
  
  <rect x="40" y="495" width="500" height="275" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="70" y="525" width="56" height="42" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
