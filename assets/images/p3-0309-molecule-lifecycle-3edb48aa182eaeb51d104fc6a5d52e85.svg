<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Molecule role lifecycle and the Testinfra assertions</title>
  <desc>Visual infographic explaining the Molecule role lifecycle steps and Testinfra host verification assertions.</desc>

  <defs>
