<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>FLOPS prefixes and precision: read a headline number carefully</title>
  <desc>Visual infographic explaining FLOPS prefixes from giga to exa, precision tiers from FP64 to INT4, the scales analogy, and key questions to evaluate FLOPS claims.</desc>

  <defs>
    <marker id="arrow-up" viewBox="0 0 12 12" refX="6" refY="3" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 8 L 6 1 L 11 8 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">FLOPS prefixes and precision: read a headline number carefully</text>

  
  <g id="ladder-of-prefixes">
    
    <rect x="40" y="100" width="540" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 118)">
      <line x1="8" y1="4" x2="8" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="40" y1="4" x2="40" y2="44" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="12" x2="40" y2="12" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="24" x2="40" y2="24" stroke="#207448" stroke-width="4"/>
      <line x1="8" y1="36" x2="40" y2="36" stroke="#207448" stroke-width="4"/>
    </g>

    <text x="125" y="150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ladder of prefixes</text>
    <text x="65" y="195" font-family="sans-serif" font-size="24" fill="#303a36">each step a factor of one thousand</text>

    
    <line x1="110" y1="490" x2="110" y2="472" stroke="#207448" stroke-width="4" marker-end="url(#arrow-up)"/>
    <line x1="110" y1="400" x2="110" y2="382" stroke="#207448" stroke-width="4" marker-end="url(#arrow-up)"/>
    <line x1="110" y1="310" x2="110" y2="292" stroke="#207448" stroke-width="4" marker-end="url(#arrow-up)"/>

    
    <rect x="65" y="225" width="490" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="267" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">exa 10^18</text>

    
    <rect x="65" y="315" width="490" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="357" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">peta 10^15</text>

    
    <rect x="65" y="405" width="490" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="447" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">tera 10^12</text>

    
    <rect x="65" y="495" width="490" height="65" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="140" y="537" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">giga 10^9</text>

    
    <rect x="65" y="585" width="490" height="70" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="310" y="628" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">an exaflop is one thousand petaflops</text>

    
    <rect x="65" y="675" width="490" height="85" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3"/>
    <g transform="translate(85, 694)">
      <polygon points="18,2 34,34 2,34" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
      <line x1="18" y1="14" x2="18" y2="22" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="28" r="2" fill="#db8129"/>
    </g>
    <text x="325" y="726" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">a missed prefix hides a thousand times</text>
  </g>

  
  <g id="precision-to-workload">
    
    <rect x="610" y="100" width="950" height="710" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(635, 118)">
      <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="16" y="16" width="16" height="16" fill="none" stroke="#207448" stroke-width="2"/>
      <line x1="16" y1="2" x2="16" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="32" y1="2" x2="32" y2="8" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="40" x2="16" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="32" y1="40" x2="32" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="2" y1="16" x2="8" y2="16" stroke="#207448" stroke-width="3"/>
      <line x1="2" y1="32" x2="8" y2="32" stroke="#207448" stroke-width="3"/>
      <line x1="40" y1="16" x2="46" y2="16" stroke="#207448" stroke-width="3"/>
      <line x1="40" y1="32" x2="46" y2="32" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="695" y="150" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Precision to workload</text>

    
    <rect x="635" y="180" width="900" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="660" y="218" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="660" dy="0">FP64 double: physics simulation and TOP500 Linpack,</tspan>
      <tspan x="660" dy="34">highest silicon cost per operation, many AI GPUs run</tspan>
      <tspan x="660" dy="34">FP64 at a small fraction of their tensor rate</tspan>
    </text>

    
    <rect x="635" y="320" width="900" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="660" y="366" font-family="sans-serif" font-size="24" fill="#303a36">FP32: graphics, CAD, legacy simulation, older ML</text>

    
    <rect x="635" y="410" width="900" height="125" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="660" y="448" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="660" dy="0">TF32, BF16, FP16: mixed-precision deep-learning training,</tspan>
      <tspan x="660" dy="34">Tensor Core paths deliver an order of magnitude more</tspan>
      <tspan x="660" dy="34">throughput than scalar FP64</tspan>
    </text>

    
    <rect x="635" y="550" width="900" height="95" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="660" y="588" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="660" dy="0">FP8, FP4: frontier LLM training and high-throughput</tspan>
      <tspan x="660" dy="34">inference, highest floating-point rates</tspan>
    </text>

    
    <rect x="635" y="660" width="900" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="660" y="706" font-family="sans-serif" font-size="24" fill="#303a36">INT8, INT4: quantized inference</text>
  </g>

  
  <g id="scales-analogy">
    
    <rect x="40" y="835" width="700" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(65, 855)">
      <line x1="24" y1="6" x2="24" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="6" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="12" y1="42" x2="36" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 6 14 L 0 28 L 12 28 Z" fill="none" stroke="#207448" stroke-width="2"/>
      <path d="M 42 14 L 36 28 L 48 28 Z" fill="none" stroke="#207448" stroke-width="2"/>
    </g>

    <text x="125" y="885" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Scales analogy</text>

    
    <rect x="65" y="920" width="650" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>

    <text x="390" y="985" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">FP64 is the jeweler's scale,</text>
    <text x="390" y="1030" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">low precision is the warehouse scale</text>

    
    
    <g transform="translate(230, 1060)">
      <line x1="30" y1="5" x2="30" y2="45" stroke="#207448" stroke-width="3"/>
      <line x1="10" y1="15" x2="50" y2="15" stroke="#207448" stroke-width="3"/>
      <line x1="18" y1="45" x2="42" y2="45" stroke="#207448" stroke-width="3"/>
      <path d="M 10 15 L 4 30 L 16 30 Z" fill="none" stroke="#207448" stroke-width="2"/>
      <path d="M 50 15 L 44 30 L 56 30 Z" fill="none" stroke="#207448" stroke-width="2"/>
    </g>

    
    <g transform="translate(480, 1060)">
      <rect x="8" y="32" width="54" height="13" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="32" x2="20" y2="8" stroke="#207448" stroke-width="3"/>
      <circle cx="20" cy="8" r="8" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="20" y1="8" x2="24" y2="5" stroke="#207448" stroke-width="2"/>
      <rect x="30" y="18" width="26" height="14" fill="none" stroke="#207448" stroke-width="2"/>
    </g>
  </g>

  
  <g id="three-questions-box">
    
    <rect x="770" y="835" width="790" height="330" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(795, 855)">
      <rect x="8" y="10" width="32" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 18 10 L 18 6 L 30 6 L 30 10" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="20" x2="32" y2="20" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="28" x2="32" y2="28" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="36" x2="26" y2="36" stroke="#207448" stroke-width="3"/>
    </g>

    <text x="850" y="885" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Three questions to ask of any FLOPS figure</text>

    
    <rect x="795" y="920" width="740" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="825" y="955" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">What precision?</text>

    
    <rect x="795" y="990" width="740" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="825" y="1025" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="825" dy="0">Dense or sparse (sparse assumes many zeros the</tspan>
      <tspan x="825" dy="32">hardware can skip, so it looks larger)?</tspan>
    </text>

    
    <rect x="795" y="1090" width="740" height="55" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="825" y="1125" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Theoretical peak Rpeak or measured Rmax?</text>
  </g>
</svg>