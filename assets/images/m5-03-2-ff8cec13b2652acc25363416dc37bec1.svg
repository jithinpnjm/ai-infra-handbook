    <text x="575" y="578" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">create ReplicaSet</text>
    <text x="575" y="606" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(deployment controller)</text>
  </g>

  
  
  <g>
    <line x1="770" y1="690" x2="362" y2="690" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="375" y="642" width="385" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="375" cy="690" r="24" fill="#207448"/>
    <text x="375" y="698" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="575" y="670" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(watch) ReplicaSet →</text>
    <text x="575" y="698" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">create Pods</text>
    <text x="575" y="726" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(replicaset controller)</text>
  </g>

  
  <g>
    <line x1="970" y1="795" x2="362" y2="795" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="475" y="762" width="380" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="475" cy="795" r="24" fill="#207448"/>
    <text x="475" y="803" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    <text x="670" y="788" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(watch)</text>
    <text x="670" y="816" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Pod with no nodeName</text>
  </g>

  
  <g>
    <path d="M 970 865 L 1020 865 A 15 15 0 0 1 1035 880 L 1035 890 A 15 15 0 0 1 1020 905 L 982 905" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="1045" y="852" width="300" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
