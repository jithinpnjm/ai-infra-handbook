    <text x="670" y="962" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">bind:</text>
    <text x="670" y="990" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">set spec.nodeName</text>
  </g>

  
  <g>
    <line x1="1170" y1="1055" x2="362" y2="1055" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="585" y="1022" width="350" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="585" cy="1055" r="24" fill="#207448"/>
    <text x="585" y="1063" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="765" y="1047" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(watch)</text>
    <text x="765" y="1075" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Pod bound to me</text>
  </g>

  
  
  <g>
