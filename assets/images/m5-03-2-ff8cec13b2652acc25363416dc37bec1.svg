    <circle cx="1180" cy="1180" r="24" fill="#db8129"/>
    <text x="1180" y="1188" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
    <text x="1350" y="1138" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">CRI: RunPodSandbox,</text>
    <text x="1350" y="1168" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">CreateContainer,</text>
    <text x="1350" y="1198" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">StartContainer</text>
    <text x="1350" y="1228" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(CNI, CSI mounts)</text>
  </g>

  
  <g>
    <line x1="1170" y1="1305" x2="362" y2="1305" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="545" y="1272" width="430" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="545" cy="1305" r="24" fill="#207448"/>
    <text x="545" y="1313" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
    <text x="765" y="1297" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">update Pod status</text>
    <text x="765" y="1325" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(Running, IPs, conditions)</text>
  </g>

  
  <g>
    <line x1="770" y1="1405" x2="362" y2="1405" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="375" y="1357" width="385" height="96" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="375" cy="1405" r="24" fill="#207448"/>
    <text x="375" y="1413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">13</text>
    <text x="575" y="1385" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">EndpointSlice controller</text>
    <text x="575" y="1413" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">adds the Pod IP</text>
    <text x="575" y="1441" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">when Ready</text>
