    <rect x="365" y="372" width="180" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="365" cy="405" r="24" fill="#207448"/>
    <text x="365" y="413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="460" y="398" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">persist</text>
    <text x="460" y="426" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Deployment</text>
  </g>

  
  <g>
    <line x1="770" y1="495" x2="362" y2="495" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="400" y="462" width="340" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="400" cy="495" r="24" fill="#207448"/>
    <text x="400" y="503" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="575" y="488" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(watch)</text>
    <text x="575" y="516" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Deployment created</text>
  </g>

  
  <g>
