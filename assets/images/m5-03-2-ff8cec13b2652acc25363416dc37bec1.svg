<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>From kubectl apply to a running container</title>
  <desc>Visual sequence diagram showing the lifecycle from kubectl apply to a running container in Kubernetes.</desc>

  <defs>
    
    <marker id="arrow-green-right" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#207448"/>
    </marker>
    <marker id="arrow-green-left" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 14 3 L 2 8 L 14 13 z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange-right" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#db8129"/>
    </marker>
    
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#303a36" flood-opacity="0.08"/>
