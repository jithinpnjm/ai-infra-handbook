  <line x1="1170" y1="175" x2="1170" y2="1465" stroke="#b8ccbe" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="1520" y1="175" x2="1520" y2="1465" stroke="#b8ccbe" stroke-width="2" stroke-dasharray="8,8"/>

  

  
