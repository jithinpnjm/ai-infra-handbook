    <text x="230" y="246" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">Deployment</text>
  </g>

  
  <g>
    <path d="M 350 295 L 400 295 A 15 15 0 0 1 415 310 L 415 320 A 15 15 0 0 1 400 335 L 362 335" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green-left)"/>
    <rect x="425" y="282" width="460" height="66" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="425" cy="315" r="24" fill="#207448"/>
    <text x="425" y="323" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="655" y="308" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">authn, authz, admission</text>
    <text x="655" y="336" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(mutate/validate)</text>
  </g>

  
  <g>
