<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Sealed Secrets: safe in Git, plain only inside the cluster</title>
  <desc>Visual infographic explaining the Sealed Secrets workflow, Git safety, controller decryption, key handling, and operational caveats.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="56" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Sealed Secrets: safe in Git,</text>
  <text x="800" y="112" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">plain only inside the cluster</text>

  

  
  <g id="step-1">
    <rect x="40" y="150" width="440" height="180" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="75" cy="185" r="20" fill="#207448" />
    <text x="75" y="193" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(115, 160)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="36" height="44" rx="4" />
      <line x1="12" y1="16" x2="32" y2="16" />
      <line x1="12" y1="24" x2="26" y2="24" />
      <circle cx="22" cy="36" r="6" />
      <path d="M 26 40 L 32 46" />
    </g>
    
    <text x="60" y="238" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubeseal --fetch-cert</text>
    <text x="60" y="274" font-family="sans-serif" font-size="24" fill="#303a36">gets the public key only</text>
    <text x="60" y="308" font-family="sans-serif" font-size="24" fill="#303a36">(encryption key)</text>
  </g>

  
  <line x1="260" y1="330" x2="260" y2="368" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="step-2">
    <rect x="40" y="370" width="440" height="325" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="75" cy="405" r="20" fill="#207448" />
    <text x="75" y="413" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(115, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="44" height="36" rx="4" />
      <polyline points="12,18 20,24 12,30" />
      <line x1="24" y1="30" x2="34" y2="30" />
    </g>
    
    <text x="60" y="440" font-family="sans-serif" font-size="24" fill="#303a36">developer runs</text>
    <text x="60" y="468" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">kubeseal mysecret.yaml:</text>
    <text x="60" y="496" font-family="sans-serif" font-size="24" fill="#303a36">plain Secret mysecret with</text>
    <text x="60" y="524" font-family="sans-serif" font-size="24" fill="#303a36">dbuser and dbkey becomes</text>
    <text x="60" y="552" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">SealedSecret</text>
    <text x="60" y="580" font-family="monospace" font-size="24" fill="#303a36">(bitnami.com/v1alpha1)</text>
    <text x="60" y="608" font-family="monospace" font-size="24" fill="#303a36">with spec.encryptedData</text>
    <text x="60" y="636" font-family="sans-serif" font-size="24" fill="#303a36">dbkey and dbuser</text>
    <text x="60" y="664" font-family="sans-serif" font-size="24" fill="#303a36">as ciphertext</text>
  </g>

  
  <line x1="480" y1="530" x2="523" y2="530" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="git-repo-boundary">
    <rect x="505" y="150" width="430" height="545" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" />
    
    <text x="529" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Git repo boundary</text>
    
    <g transform="translate(870, 160)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="14" r="5" />
      <circle cx="12" cy="38" r="5" />
      <circle cx="36" cy="22" r="5" />
      <line x1="12" y1="19" x2="12" y2="33" />
      <path d="M 12 26 C 24 26 26 22 31 22" />
    </g>

    
    <g id="step-3">
      <rect x="525" y="215" width="390" height="460" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="4" />
      
      <circle cx="560" cy="255" r="20" fill="#207448" />
      <text x="560" y="263" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      
      <g transform="translate(600, 230)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 8 10 L 26 4 L 44 10 C 44 28 26 42 26 42 C 26 42 8 28 8 10 Z" />
        <circle cx="26" cy="22" r="4" />
        <path d="M 26 26 L 26 32" />
      </g>
      
      <text x="550" y="330" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">SealedSecret</text>
      <text x="550" y="370" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">committed anywhere</text>
      <text x="550" y="410" font-family="sans-serif" font-size="24" fill="#303a36">in Git, safe while</text>
      <text x="550" y="450" font-family="sans-serif" font-size="24" fill="#303a36">the private key</text>
      <text x="550" y="490" font-family="sans-serif" font-size="24" fill="#303a36">stays safe</text>
    </g>
  </g>

  
  <line x1="915" y1="490" x2="968" y2="490" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g id="cluster-box">
    <rect x="950" y="150" width="610" height="545" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="974" y="190" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Cluster box</text>
    
    <g transform="translate(1500, 160)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="24,6 40,15 40,33 24,42 8,33 8,15" />
      <circle cx="24" cy="24" r="6" />
    </g>

    
    <g id="controller-card">
      <rect x="970" y="205" width="570" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(988, 218)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="8" />
        <path d="M 24 6 L 24 12 M 24 36 L 24 42 M 6 24 L 12 24 M 36 24 L 42 24 M 11 11 L 16 16 M 32 32 L 37 37 M 11 37 L 16 32 M 32 16 L 37 11" />
      </g>
      <text x="1045" y="240" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">sealed-secret-controller</text>
      <text x="990" y="272" font-family="sans-serif" font-size="24" fill="#303a36">generates keys by default;</text>
      <text x="990" y="300" font-family="sans-serif" font-size="24" fill="#303a36">public and private keys</text>
      <text x="990" y="328" font-family="sans-serif" font-size="24" fill="#303a36">sit in Secret</text>
      <text x="990" y="356" font-family="monospace" font-size="24" fill="#303a36">kube-system/sealed-secret-key</text>
      <text x="990" y="384" font-family="sans-serif" font-size="24" fill="#303a36">(do not read it directly)</text>
    </g>

    
    <g id="step-4">
      <rect x="970" y="420" width="570" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="1000" cy="450" r="20" fill="#207448" />
      <text x="1000" y="458" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      
      <g transform="translate(1035, 427)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="18" r="8" />
        <path d="M 24 24 L 38 38 M 32 32 L 36 28 M 35 35 L 39 31" />
      </g>
      
      <text x="1090" y="450" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">controller decrypts with the</text>
      <text x="990" y="482" font-family="sans-serif" font-size="24" fill="#303a36">private key and creates plain</text>
      <text x="990" y="512" font-family="sans-serif" font-size="24" fill="#303a36">Secret mysecret, with</text>
      <text x="990" y="542" font-family="monospace" font-size="24" fill="#303a36">ownerReferences kind SealedSecret</text>
    </g>

    
    <line x1="1255" y1="570" x2="1255" y2="583" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <g id="step-5">
      <rect x="970" y="585" width="570" height="105" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <circle cx="1000" cy="635" r="20" fill="#207448" />
      <text x="1000" y="643" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
      
      <g transform="translate(1035, 612)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8,12 40,12" />
        <line x1="18" y1="12" x2="18" y2="6" />
        <line x1="30" y1="12" x2="30" y2="6" />
        <path d="M 12 12 L 14 40 L 34 40 L 36 12" />
      </g>
      
      <text x="1090" y="620" font-family="sans-serif" font-size="24" fill="#303a36">delete the SealedSecret</text>
      <text x="1090" y="648" font-family="sans-serif" font-size="24" fill="#303a36">and the Secret is</text>
      <text x="1090" y="676" font-family="sans-serif" font-size="24" fill="#303a36">garbage collected</text>
    </g>
  </g>

  
  <g id="side-notes-section">
    <rect x="40" y="720" width="1520" height="440" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="64" y="758" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Side notes</text>

    
    <g id="side-note-1">
      <rect x="60" y="780" width="720" height="195" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(80, 800)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="18" />
        <polyline points="24,12 24,24 32,24" />
      </g>
      <text x="145" y="825" font-family="sans-serif" font-size="24" fill="#303a36">key renewal every 30 days by default;</text>
      <text x="145" y="865" font-family="sans-serif" font-size="24" fill="#303a36">new key joins old ones,</text>
      <text x="145" y="905" font-family="sans-serif" font-size="24" fill="#303a36">does not replace them</text>
    </g>

    
    <g id="side-note-2">
      <rect x="820" y="780" width="720" height="195" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(840, 800)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 24 6 L 42 38 L 6 38 Z" />
        <line x1="24" y1="18" x2="24" y2="26" />
        <circle cx="24" cy="32" r="2" fill="#207448" />
      </g>
      <text x="905" y="815" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">leaked private key:</text>
      <text x="905" y="845" font-family="sans-serif" font-size="24" fill="#303a36">rotate the encryption key AND</text>
      <text x="905" y="875" font-family="sans-serif" font-size="24" fill="#303a36">rotate the secrets themselves,</text>
      <text x="905" y="905" font-family="sans-serif" font-size="24" fill="#303a36">re-encrypting alone is not enough because</text>
      <text x="905" y="935" font-family="sans-serif" font-size="24" fill="#303a36">old encrypted files remain in Git history</text>
    </g>

    
    <g id="side-note-3">
      <rect x="60" y="995" width="720" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(80, 1015)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="36" height="36" rx="4" stroke-dasharray="4,4" />
        <circle cx="24" cy="24" r="6" />
      </g>
      <text x="145" y="1040" font-family="sans-serif" font-size="24" fill="#303a36">bound to the Namespace</text>
      <text x="145" y="1075" font-family="sans-serif" font-size="24" fill="#303a36">where it was sealed;</text>
      <text x="145" y="1110" font-family="sans-serif" font-size="24" fill="#303a36">cannot simply be moved</text>
    </g>

    
    <g id="side-note-4">
      <rect x="820" y="995" width="720" height="145" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(840, 1015)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="36" height="32" rx="4" />
        <circle cx="24" cy="24" r="7" />
        <line x1="24" y1="17" x2="24" y2="20" />
        <line x1="24" y1="28" x2="24" y2="31" />
        <line x1="17" y1="24" x2="20" y2="24" />
        <line x1="28" y1="24" x2="31" y2="24" />
      </g>
      <text x="905" y="1060" font-family="sans-serif" font-size="24" fill="#303a36">does not replace etcd encryption</text>
      <text x="905" y="1098" font-family="sans-serif" font-size="24" fill="#303a36">or Vault</text>
    </g>
  </g>
</svg>