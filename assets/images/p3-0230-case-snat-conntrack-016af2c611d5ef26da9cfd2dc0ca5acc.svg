<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Two state-table limits that look like random timeouts: SNAT ports and conntrack</title>
  <desc>Technical infographic explaining SNAT port exhaustion and conntrack table saturation limits causing silent connection drops.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">
    <tspan x="800" y="52">Two state-table limits that look like</tspan>
    <tspan x="800" y="104">random timeouts: SNAT ports and conntrack</tspan>
  </text>

  
  <g id="panel-1">
    
    <rect x="40" y="125" width="740" height="950" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="40" y="125" width="740" height="54" rx="12" fill="#207448"/>
    <rect x="40" y="155" width="740" height="24" fill="#207448"/>
    <text x="410" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Case 1: SNAT port exhaustion</text>

    
    <g id="p1-flow">
      <rect x="68" y="205" width="684" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 223)">
        <ellipse cx="25" cy="12" rx="18" ry="6" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M7 12 v24 c0 3.3 8 6 18 6 s18 -2.7 18 -6 v-24" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M7 24 c0 3.3 8 6 18 6 s18 -2.7 18 -6" fill="none" stroke="#207448" stroke-width="3.5"/>
      </g>
      <text x="154" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="241">about 5,000 containers connect through</tspan>
        <tspan x="154" y="269">one NAT IP to one database IP and port</tspan>
      </text>
    </g>

    
    <line x1="410" y1="291" x2="410" y2="307" stroke="#207448" stroke-width="3" stroke-dasharray="4 3"/>

    
    <g id="p1-arithmetic">
      <rect x="68" y="307" width="684" height="172" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 368)">
        <rect x="5" y="10" width="40" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="12" y1="20" x2="16" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="23" y1="20" x2="27" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="34" y1="20" x2="38" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="12" y1="28" x2="16" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="23" y1="28" x2="27" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="34" y1="28" x2="38" y2="28" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="154" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="344">one source IP has about 60,000 usable</tspan>
        <tspan x="154" y="372">ephemeral ports per destination IP and</tspan>
        <tspan x="154" y="400">port; each connection to that one</tspan>
        <tspan x="154" y="428">database needs its own source port on</tspan>
        <tspan x="154" y="456">the gateway</tspan>
      </text>
    </g>

    
    <line x1="410" y1="479" x2="410" y2="493" stroke="#207448" stroke-width="4"/>
    <polygon points="402,493 418,493 410,503" fill="#207448"/>

    
    <g id="p1-failure">
      <rect x="68" y="503" width="684" height="144" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 550)">
        <circle cx="25" cy="25" r="19" fill="none" stroke="#207448" stroke-width="3.5"/>
        <polyline points="25,14 25,25 34,25" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="6" y1="44" x2="44" y2="6" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="154" y="541" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="541">ports run out, new connections get no</tspan>
        <tspan x="154" y="569">mapping and time out; the database is</tspan>
        <tspan x="154" y="597">healthy, CPU is low, dmesg shows no</tspan>
        <tspan x="154" y="625">conntrack drops</tspan>
      </text>
    </g>

    
    <g id="p1-metaphor">
      <rect x="68" y="667" width="684" height="116" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 700)">
        <rect x="6" y="6" width="38" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3.5"/>
        <path d="M18 36 V14 h9 c4.4 0 7 2.5 7 6 s-2.6 6 -7 6 h-9" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="154" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="705">a car park with a fixed number of</tspan>
        <tspan x="154" y="733">spaces: the traffic is not heavy but</tspan>
        <tspan x="154" y="761">all the spaces are taken</tspan>
      </text>
    </g>

    
    <g id="p1-fix">
      <rect x="68" y="803" width="684" height="144" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 850)">
        <path d="M35 7 a9 9 0 0 0 -8 13 l-17 17 a3 3 0 0 0 4 4 l17 -17 a9 9 0 0 0 13 -8 l-5 5 -4 -1 -1 -4 5 -5 a9 9 0 0 0 -4 -4 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
      </g>
      <text x="154" y="841" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="841">add NAT gateway IPs and ports (Cloud</tspan>
        <tspan x="154" y="869">NAT port allocation), use a pooler</tspan>
        <tspan x="154" y="897">such as PgBouncer, shorten TIME_WAIT,</tspan>
        <tspan x="154" y="925">reuse connections</tspan>
      </text>
    </g>

    
    <g id="p1-lesson">
      <rect x="68" y="967" width="684" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(86, 985)">
        <rect x="7" y="7" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="25" y1="7" x2="25" y2="43" stroke="#207448" stroke-width="3.5"/>
        <line x1="7" y1="25" x2="43" y2="25" stroke="#207448" stroke-width="3.5"/>
        <circle cx="16" cy="16" r="3" fill="#207448"/>
        <circle cx="34" cy="16" r="3" fill="#207448"/>
        <circle cx="16" cy="34" r="3" fill="#207448"/>
        <circle cx="34" cy="34" r="3" fill="#207448"/>
      </g>
      <text x="154" y="1003" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="154" y="1003">count the tuple dimensions: source IP,</tspan>
        <tspan x="154" y="1031">destination IP and port</tspan>
      </text>
    </g>
  </g>

  
  <g id="panel-2">
    
    <rect x="820" y="125" width="740" height="950" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="2"/>
    <rect x="820" y="125" width="740" height="54" rx="12" fill="#db8129"/>
    <rect x="820" y="155" width="740" height="24" fill="#db8129"/>
    <text x="1190" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Case 3: Conntrack table full</text>

    
    <g id="p2-symptom">
      <rect x="848" y="205" width="684" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(866, 242)">
        <rect x="12" y="12" width="26" height="26" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="18" y1="5" x2="18" y2="12" stroke="#207448" stroke-width="3"/>
        <line x1="32" y1="5" x2="32" y2="12" stroke="#207448" stroke-width="3"/>
        <line x1="18" y1="38" x2="18" y2="45" stroke="#207448" stroke-width="3"/>
        <line x1="32" y1="38" x2="32" y2="45" stroke="#207448" stroke-width="3"/>
        <line x1="5" y1="18" x2="12" y2="18" stroke="#207448" stroke-width="3"/>
        <line x1="5" y1="32" x2="12" y2="32" stroke="#207448" stroke-width="3"/>
        <line x1="38" y1="18" x2="45" y2="18" stroke="#207448" stroke-width="3"/>
        <line x1="38" y1="32" x2="45" y2="32" stroke="#207448" stroke-width="3"/>
        <circle cx="25" cy="25" r="5" fill="#207448"/>
      </g>
      <text x="934" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="934" y="247">busy Kubernetes nodes, intermittent</tspan>
        <tspan x="934" y="275">timeouts for new connections, CPU and</tspan>
        <tspan x="934" y="303">bandwidth fine</tspan>
      </text>
    </g>

    
    <g id="p2-evidence">
      <rect x="848" y="385" width="684" height="155" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(866, 437)">
        <rect x="6" y="9" width="38" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="6" y1="18" x2="44" y2="18" stroke="#207448" stroke-width="3"/>
        <polyline points="12,24 17,28 12,32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="32" x2="30" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="934" y="427" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
        <tspan x="934" y="427">dmesg: nf_conntrack: table full,</tspan>
        <tspan x="934" y="455">dropping packet; conntrack -C equals</tspan>
        <tspan x="934" y="483">nf_conntrack_max; conntrack -S shows</tspan>
        <tspan x="934" y="511">insert_failed</tspan>
      </text>
    </g>

    
    <g id="p2-causes">
      <rect x="848" y="596" width="684" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(866, 633)">
        <rect x="7" y="11" width="36" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
        <line x1="7" y1="19" x2="43" y2="19" stroke="#207448" stroke-width="3"/>
        <line x1="16" y1="6" x2="16" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <line x1="34" y1="6" x2="34" y2="11" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
        <circle cx="25" cy="30" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
        <polyline points="25,27 25,30 28,30" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="934" y="638" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="934" y="638">established timeout of 5 days keeps</tspan>
        <tspan x="934" y="666">dead flows forever; table too small</tspan>
        <tspan x="934" y="694">for the load</tspan>
      </text>
    </g>

    
    <g id="p2-note">
      <rect x="848" y="777" width="684" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(866, 800)">
        <path d="M25 7 L10 13 V24 C10 33 16 39 25 43 C34 39 40 33 40 24 V13 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
        <polyline points="18,24 23,29 32,19" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="934" y="818" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="934" y="818">established connections keep working,</tspan>
        <tspan x="934" y="846">only new ones fail</tspan>
      </text>
    </g>

    
    <g id="p2-fix">
      <rect x="848" y="928" width="684" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <g transform="translate(866, 965)">
        <line x1="8" y1="14" x2="42" y2="14" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="18" cy="14" r="5" fill="#f5f8f5" stroke="#207448" stroke-width="3.5"/>
        <line x1="8" y1="25" x2="42" y2="25" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="32" cy="25" r="5" fill="#f5f8f5" stroke="#207448" stroke-width="3.5"/>
        <line x1="8" y1="36" x2="42" y2="36" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="22" cy="36" r="5" fill="#f5f8f5" stroke="#207448" stroke-width="3.5"/>
      </g>
      <text x="934" y="970" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
        <tspan x="934" y="970">raise the max and hash size, lower</tspan>
        <tspan x="934" y="998">timeouts, find chatty clients, notrack</tspan>
        <tspan x="934" y="1026">for DNS and east-west flows</tspan>
      </text>
    </g>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1095" width="1520" height="60" rx="8" fill="#207448"/>
    <text x="800" y="1136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Capacity limits in state tables look like random packet loss</text>
  </g>
</svg>