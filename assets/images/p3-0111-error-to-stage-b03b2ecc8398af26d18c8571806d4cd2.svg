    <tspan x="460" dy="32" font-family="monospace">ld-linux-x86-64.so.2</tspan>
    <tspan x="460" dy="34">missing)</tspan>
  </text>

  
  <rect x="442" y="920" width="328" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
