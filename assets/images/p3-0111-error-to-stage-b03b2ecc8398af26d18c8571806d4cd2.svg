  </g>
  
  <text x="56" y="175" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="56" dy="0">shell fork</tspan>
    <tspan x="56" dy="30">and execve</tspan>
  </text>

  
  <line x1="236" y1="190" x2="256" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="258" y="85" width="224" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
