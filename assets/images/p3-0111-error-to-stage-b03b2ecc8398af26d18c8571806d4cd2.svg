  <text x="288" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(378, 97)">
    <path d="M 4 0 L 26 0 L 38 12 L 38 38 L 4 38 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
    <path d="M 26 0 L 26 12 L 38 12" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="12" y1="20" x2="28" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="28" x2="24" y2="28" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="274" y="166" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="274" dy="0">kernel checks</tspan>
    <tspan x="274" dy="28">the file and picks</tspan>
    <tspan x="274" dy="28">a format handler</tspan>
  </text>

  
  <line x1="482" y1="190" x2="502" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="504" y="85" width="196" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="534" cy="117" r="22" fill="#207448" />
  <text x="534" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(616, 97)">
    <rect x="0" y="2" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="0" y="15" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="0" y="28" width="44" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
  </g>
  
  <text x="518" y="166" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="518" dy="0">ELF loader maps</tspan>
    <tspan x="518" dy="28">LOAD segments,</tspan>
    <tspan x="518" dy="28">builds the stack</tspan>
  </text>

  
  <line x1="700" y1="190" x2="720" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="722" y="85" width="246" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
