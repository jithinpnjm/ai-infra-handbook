<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <title>Which startup stage produced this error message</title>
  <desc>Horizontal pipeline of six execution startup stages mapped to characteristic error messages and first-check diagnostics.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1080" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Which startup stage produced this error message</text>

  
  
  

  
  <rect x="40" y="85" width="196" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="70" cy="117" r="22" fill="#207448" />
