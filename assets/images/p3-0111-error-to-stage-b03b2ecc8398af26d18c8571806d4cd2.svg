  </text>


  
  <rect x="812" y="320" width="360" height="730" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <path d="M 812 332 A 12 12 0 0 1 824 320 L 1160 320 A 12 12 0 0 1 1172 332 L 1172 385 L 812 385 Z" fill="#db8129" />
