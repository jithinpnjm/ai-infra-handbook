    <circle cx="34" cy="19" r="8" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="19" x2="26" y2="19" stroke="#207448" stroke-width="4" />
  </g>
  
  <text x="738" y="160" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="738" dy="0" font-family="monospace">PT_INTERP:</tspan>
    <tspan x="738" dy="26">kernel maps ld.so,</tspan>
    <tspan x="738" dy="26">execution starts in</tspan>
    <tspan x="738" dy="26">the dynamic linker</tspan>
  </text>

  
  <line x1="968" y1="190" x2="988" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="990" y="85" width="246" height="210" rx="10" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <circle cx="1020" cy="117" r="22" fill="#db8129" />
  <text x="1020" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <g transform="translate(1142, 97)">
    <rect x="2" y="2" width="20" height="18" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <rect x="18" y="16" width="20" height="18" rx="2" fill="none" stroke="#db8129" stroke-width="3" />
    <path d="M 12 20 L 12 28 L 18 28" fill="none" stroke="#db8129" stroke-width="2" />
  </g>
  
  <text x="1006" y="160" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1006" dy="0">ld.so loads</tspan>
    <tspan x="1006" dy="26" font-family="monospace">DT_NEEDED</tspan>
    <tspan x="1006" dy="26">libraries, relocates,</tspan>
    <tspan x="1006" dy="26">runs constructors</tspan>
  </text>

  
  <line x1="1236" y1="190" x2="1256" y2="190" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1258" y="85" width="302" height="210" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="1288" cy="117" r="22" fill="#207448" />
  <text x="1288" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  
  <g transform="translate(1468, 97)">
    <rect x="6" y="6" width="34" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <polygon points="19,16 30,23 19,30" fill="#207448" />
  </g>
  
  <text x="1274" y="166" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1274" dy="0">_start,</tspan>
    <tspan x="1274" dy="28">__libc_start_main,</tspan>
    <tspan x="1274" dy="28">main</tspan>
  </text>


  
  
  

  
  <rect x="40" y="320" width="360" height="730" rx="12" fill="#ffffff" stroke="#c8dcce" stroke-width="2" />
  
  <path d="M 40 332 A 12 12 0 0 1 52 320 L 388 320 A 12 12 0 0 1 400 332 L 400 385 L 40 385 Z" fill="#207448" />
  <text x="220" y="364" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 1/2</text>

  
  <rect x="56" y="405" width="328" height="225" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="74" y="440" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="74" dy="0" font-weight="bold">Exec format error</tspan>
    <tspan x="74" dy="32">(wrong CPU architecture</tspan>
    <tspan x="74" dy="30">such as x86-64 on</tspan>
    <tspan x="74" dy="30">aarch64, or a script</tspan>
    <tspan x="74" dy="30">without shebang)</tspan>
  </text>

  
  <rect x="56" y="646" width="328" height="110" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="74" y="688" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="74" dy="0">exit 126 found</tspan>
    <tspan x="74" dy="32">but not executable</tspan>
  </text>

  
  <rect x="56" y="772" width="328" height="90" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="74" y="826" font-family="sans-serif" font-size="24" fill="#303a36">exit 127 not found</text>

  
  <rect x="56" y="920" width="328" height="110" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
