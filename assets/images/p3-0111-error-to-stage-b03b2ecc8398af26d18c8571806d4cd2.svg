  </text>


  
  <rect x="1198" y="320" width="360" height="730" rx="12" fill="#ffffff" stroke="#c8dcce" stroke-width="2" />
  
  <path d="M 1198 332 A 12 12 0 0 1 1210 320 L 1546 320 A 12 12 0 0 1 1558 332 L 1558 385 L 1198 385 Z" fill="#207448" />
