  <path d="M 426 332 A 12 12 0 0 1 438 320 L 774 320 A 12 12 0 0 1 786 332 L 786 385 L 426 385 Z" fill="#207448" />
  <text x="606" y="364" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage 4</text>

  
  <rect x="442" y="405" width="328" height="495" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
  <text x="460" y="445" font-family="sans-serif" font-size="24" fill="#303a36">
