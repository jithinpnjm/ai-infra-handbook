    <tspan x="844" dy="30">cannot open shared</tspan>
    <tspan x="844" dy="28">object file</tspan>
  </text>

  
  <rect x="828" y="535" width="328" height="126" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="844" y="568" font-family="sans-serif" font-size="24" fill="#303a36">
