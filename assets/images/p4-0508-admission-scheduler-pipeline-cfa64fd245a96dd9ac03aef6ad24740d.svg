<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" width="1600" height="1500">
  <title>Admission and Scheduling Pipeline from YAML to Node Binding</title>
  <desc>Two-lane vertical flowchart illustrating control plane admission and scheduling pipeline from kubectl apply to node binding.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1500" fill="#f5f8f5"/>

  
  <text x="800" y="55" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36">Admission and Scheduling Pipeline from YAML to Node Binding</text>

  
  <rect x="40" y="90" width="730" height="1380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 40 145 L 40 106 Q 40 90 56 90 L 754 90 Q 770 90 770 106 L 770 145 Z" fill="#207448"/>
  <text x="405" y="128" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">kube-apiserver and etcd</text>

  
  <rect x="65" y="165" width="680" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="85" y="185" width="46" height="38" rx="5" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="85" y1="198" x2="131" y2="198" stroke="#207448" stroke-width="3"/>
  <polyline points="93,208 99,214 93,220" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <circle cx="155" cy="204" r="20" fill="#207448"/>
  <text x="155" y="211" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1</text>
  
  <text x="190" y="202" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">1. User/Controller sends Pod</tspan>
    <tspan x="190" dy="36" font-size="24" font-family="monospace">via 'kubectl apply'</tspan>
  </text>

  
  <line x1="405" y1="300" x2="405" y2="328" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="65" y="330" width="680" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <path d="M 108 348 L 126 356 C 126 376 108 388 108 388 C 108 388 90 376 90 356 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  
  <circle cx="155" cy="368" r="20" fill="#207448"/>
  <text x="155" y="375" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text>
  
  <text x="190" y="366" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">2. Authentication &amp; Authorization</tspan>
    <tspan x="190" dy="36" font-size="24">verify credentials and RBAC</tspan>
  </text>

  
  <line x1="405" y1="465" x2="405" y2="493" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="65" y="495" width="680" height="225" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="108" cy="535" r="14" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 108 515 L 108 521 M 108 549 L 108 555 M 88 535 L 94 535 M 122 535 L 128 535 M 94 521 L 98 525 M 118 545 L 122 549 M 94 549 L 98 545 M 118 525 L 122 521" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  
  <circle cx="155" cy="535" r="20" fill="#207448"/>
  <text x="155" y="542" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3</text>
  
  <text x="190" y="533" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">3. Mutating Admission Webhook</tspan>
    <tspan x="190" dy="34" font-size="24">modifies spec: injects</tspan>
    <tspan x="190" dy="30" font-size="24">ServiceAccount token volume,</tspan>
    <tspan x="190" dy="30" font-size="24">DefaultTolerationSeconds,</tspan>
    <tspan x="190" dy="30" font-size="24">LimitRange defaults, sidecars</tspan>
  </text>

  
  <line x1="405" y1="720" x2="405" y2="748" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="65" y="750" width="680" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="88" y="775" width="40" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="96,797 104,805 120,789" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <circle cx="155" cy="795" r="20" fill="#207448"/>
  <text x="155" y="802" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">4</text>
  
  <text x="190" y="793" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">4. Validating Admission</tspan>
    <tspan x="190" dy="34" font-size="24">runs schema validation,</tspan>
    <tspan x="190" dy="30" font-size="24">ResourceQuota checks, and</tspan>
    <tspan x="190" dy="30" font-size="24">PodSecurity enforcement</tspan>
  </text>

  
  <line x1="405" y1="955" x2="405" y2="983" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="65" y="985" width="680" height="205" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <ellipse cx="108" cy="1010" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 88 1010 L 88 1034 C 88 1039 97 1043 108 1043 C 119 1043 128 1039 128 1034 L 128 1010" fill="none" stroke="#207448" stroke-width="4"/>
  
  <circle cx="155" cy="1025" r="20" fill="#207448"/>
  <text x="155" y="1032" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">5</text>
  
  <text x="190" y="1023" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">5. Write to etcd: state is persisted</tspan>
    <tspan x="190" dy="34" font-size="24">as status.phase='Pending',</tspan>
    <tspan x="190" dy="30" font-size="24">spec.nodeName=''</tspan>
  </text>

  
  <path d="M 745 1087 L 800 1087 L 800 220 L 853 220" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="830" y="90" width="730" height="1380" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <path d="M 830 145 L 830 106 Q 830 90 846 90 L 1544 90 Q 1560 90 1560 106 L 1560 145 Z" fill="#207448"/>
  <text x="1195" y="128" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">kube-scheduler</text>

  
  <rect x="855" y="165" width="680" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <line x1="880" y1="205" x2="920" y2="205" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="880" y1="217" x2="920" y2="217" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="880" y1="229" x2="920" y2="229" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  
  <circle cx="945" cy="217" r="20" fill="#207448"/>
  <text x="945" y="224" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">6</text>
  
  <text x="980" y="215" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">6. Scheduler Queue picks pod</tspan>
  </text>

  
  <line x1="1195" y1="280" x2="1195" y2="303" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="855" y="305" width="680" height="445" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <polygon points="880,325 920,325 906,347 906,365 894,365 894,347" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
  
  <circle cx="945" cy="342" r="20" fill="#207448"/>
  <text x="945" y="349" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">7</text>
  
  <text x="980" y="340" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">7. Filtering (Predicates) checks:</tspan>
    <tspan x="980" dy="34" font-size="24">allocatable resources including</tspan>
    <tspan x="980" dy="28" font-size="24">nvidia.com/gpu, nodeSelector/affinity,</tspan>
    <tspan x="980" dy="28" font-size="24">taints and tolerations, volume topology</tspan>
    <tspan x="980" dy="28" font-size="24">and zones, host ports,</tspan>
    <tspan x="980" dy="28" font-size="24">pod topology spread.</tspan>
  </text>

  
  <rect x="875" y="525" width="640" height="205" rx="10" fill="#fff5eb" stroke="#db8129" stroke-width="2"/>
  <text x="895" y="555" font-family="sans-serif" fill="#303a36">
    <tspan font-size="24" font-weight="bold" fill="#db8129">Decision fork: If 0 nodes pass,</tspan>
    <tspan x="895" dy="28" font-size="24">emit event 'FailedScheduling:</tspan>
    <tspan x="895" dy="28" font-size="24">0/50 nodes available</tspan>
    <tspan x="895" dy="28" font-size="24">(20 Insufficient nvidia.com/gpu,</tspan>
    <tspan x="895" dy="28" font-size="24">30 untolerated taint)'</tspan>
    <tspan x="895" dy="28" font-size="24" font-weight="bold" fill="#db8129">with PodScheduled=False.</tspan>
  </text>

  
  <line x1="1195" y1="750" x2="1195" y2="773" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="855" y="775" width="680" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <line x1="885" y1="835" x2="885" y2="815" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="897" y1="835" x2="897" y2="800" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="909" y1="835" x2="909" y2="790" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="877" y1="837" x2="919" y2="837" stroke="#207448" stroke-width="3"/>
  
  <circle cx="945" cy="815" r="20" fill="#207448"/>
  <text x="945" y="822" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">8</text>
  
  <text x="980" y="813" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">8. Scoring (Priorities) ranks</tspan>
    <tspan x="980" dy="34" font-size="24">passing nodes: pod spread,</tspan>
    <tspan x="980" dy="30" font-size="24">image locality, resource balance,</tspan>
    <tspan x="980" dy="30" font-size="24">affinity weights.</tspan>
  </text>

  
  <line x1="1195" y1="950" x2="1195" y2="973" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="855" y="975" width="680" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <rect x="880" y="1002" width="40" height="26" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="895" y1="1002" x2="895" y2="1028" stroke="#207448" stroke-width="3" stroke-dasharray="3 3"/>
  
  <circle cx="945" cy="1015" r="20" fill="#207448"/>
  <text x="945" y="1022" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">9</text>
  
  <text x="980" y="1013" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">9. Reserve &amp; Permit</tspan>
    <tspan x="980" dy="34" font-size="24">(gang scheduling check).</tspan>
  </text>

  
  <line x1="1195" y1="1090" x2="1195" y2="1113" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <rect x="855" y="1115" width="680" height="245" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  
  <circle cx="893" cy="1150" r="10" fill="none" stroke="#207448" stroke-width="4"/>
  <circle cx="915" cy="1165" r="10" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="900" y1="1155" x2="908" y2="1160" stroke="#207448" stroke-width="4"/>
  
  <circle cx="945" cy="1155" r="20" fill="#207448"/>
  <text x="945" y="1162" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">10</text>
  
  <text x="980" y="1153" font-family="sans-serif" fill="#303a36">
    <tspan font-size="30" font-weight="bold">10. Binding: scheduler sends</tspan>
    <tspan x="980" dy="34" font-size="24">POST Binding to apiserver,</tspan>
    <tspan x="980" dy="29" font-size="24">setting spec.nodeName, emitting event</tspan>
    <tspan x="980" dy="29" font-size="24">'Scheduled: Successfully assigned</tspan>
    <tspan x="980" dy="29" font-size="24">ns/pod to node' and</tspan>
    <tspan x="980" dy="29" font-size="24" font-weight="bold">PodScheduled=True.</tspan>
  </text>

  
  <line x1="855" y1="1235" x2="772" y2="1235" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>
</svg>