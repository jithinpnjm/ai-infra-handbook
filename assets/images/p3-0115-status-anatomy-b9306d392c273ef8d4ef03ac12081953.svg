<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Reading systemctl status line by line</title>
  <desc>An infographic explaining how to read systemctl status output line by line with numbered callouts and a key takeaway bar.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="50" y="75" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading systemctl status line by line</text>

  
  <rect x="50" y="105" width="840" height="985" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <path d="M 50,117 Q 50,105 62,105 L 878,105 Q 890,105 890,117 L 890,145 L 50,145 Z" fill="#e8f1ea"/>
  <circle cx="75" cy="125" r="6" fill="#c2d8c8"/>
  <circle cx="95" cy="125" r="6" fill="#88b898"/>
  <circle cx="115" cy="125" r="6" fill="#207448"/>
  <line x1="50" y1="145" x2="890" y2="145" stroke="#c2d8c8" stroke-width="1"/>

  
  <text x="80" y="175" font-family="monospace" font-size="24" fill="#303a36">● sshd.service - OpenBSD Secure Shell server</text>

  
  <rect x="65" y="195" width="810" height="100" rx="8" fill="#e8f1ea" stroke="#c2d8c8" stroke-width="1.5"/>
  <text x="80" y="235" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">Loaded: loaded (/lib/systemd/system/ssh.service;</tspan>
    <tspan x="110" dy="35">enabled; vendor preset: enabled)</tspan>
  </text>

  
  <rect x="65" y="315" width="810" height="270" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5"/>
  <text x="80" y="435" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">Active: active (running) since Fri 2025-04-16</tspan>
    <tspan x="110" dy="35">08:15:41 UTC; 1 month 1 day ago</tspan>
  </text>

  
  <rect x="65" y="605" width="810" height="80" rx="8" fill="#e8f1ea" stroke="#c2d8c8" stroke-width="1.5"/>
  <text x="80" y="652" font-family="monospace" font-size="24" fill="#303a36">Main PID: 1110 (sshd)</text>

  
  <rect x="65" y="705" width="810" height="100" rx="8" fill="#e8f1ea" stroke="#c2d8c8" stroke-width="1.5"/>
  <text x="80" y="736" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">Tasks: 1 (limit: 4915)</tspan>
    <tspan x="80" dy="28">Memory: 5.1M</tspan>
    <tspan x="80" dy="28">CPU: 2.103s</tspan>
  </text>

  
  <rect x="65" y="825" width="810" height="110" rx="8" fill="#e8f1ea" stroke="#c2d8c8" stroke-width="1.5"/>
  <text x="80" y="855" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">CGroup: /system.slice/ssh.service</tspan>
    <tspan x="80" dy="32">└─1110 "sshd: /usr/sbin/sshd -D [listener]</tspan>
    <tspan x="110" dy="32">0 of 10-100 startups"</tspan>
  </text>

  
  <rect x="65" y="955" width="810" height="120" rx="8" fill="#e8f1ea" stroke="#c2d8c8" stroke-width="1.5"/>
  <text x="80" y="1000" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">Apr 16 08:15:41 node1 systemd[1]:</tspan>
    <tspan x="110" dy="35">Started OpenBSD Secure Shell server.</tspan>
  </text>

  
  <line x1="875" y1="245" x2="950" y2="245" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="875" y1="450" x2="950" y2="450" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <line x1="875" y1="645" x2="950" y2="645" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="875" y1="755" x2="950" y2="755" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="875" y1="880" x2="950" y2="880" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="875" y1="1015" x2="950" y2="1015" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="950" y="195" width="600" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="990" cy="245" r="24" fill="#207448"/>
  <text x="990" y="254" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <g transform="translate(1030, 217)">
    <path d="M 5,3 L 30,3 L 42,15 L 42,53 L 5,53 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 30,3 L 30,15 L 42,15" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <line x1="12" y1="27" x2="35" y2="27" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="39" x2="35" y2="39" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="1100" y="238" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0">file path, enablement state,</tspan>
    <tspan x="1100" dy="32">vendor preset</tspan>
  </text>

  
  <rect x="950" y="315" width="600" height="270" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <circle cx="990" cy="358" r="24" fill="#db8129"/>
  <text x="990" y="367" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <g transform="translate(1032, 330)">
    <circle cx="28" cy="28" r="24" fill="none" stroke="#db8129" stroke-width="4"/>
    <path d="M 8,28 L 17,28 L 22,15 L 30,41 L 36,22 L 40,28 L 48,28" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="980" y="415" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="980" dy="0">state: active (running),</tspan>
    <tspan x="980" dy="28">active (exited) for oneshots,</tspan>
    <tspan x="980" dy="28">inactive (dead), activating, failed;</tspan>
    <tspan x="980" dy="28">after a failure a Result follows:</tspan>
    <tspan x="980" dy="28">exit-code, signal, timeout</tspan>
    <tspan x="980" dy="28">or start-limit-hit</tspan>
  </text>

  
  <rect x="950" y="605" width="600" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="990" cy="645" r="24" fill="#207448"/>
  <text x="990" y="654" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <g transform="translate(1030, 617)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <circle cx="28" cy="28" r="8" fill="#207448"/>
    <line x1="28" y1="0" x2="28" y2="10" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="46" x2="28" y2="56" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="10" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <line x1="46" y1="28" x2="56" y2="28" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="1100" y="653" font-family="sans-serif" font-size="24" fill="#303a36">the tracked process</text>

  
  <rect x="950" y="705" width="600" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="990" cy="755" r="24" fill="#207448"/>
  <text x="990" y="764" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <g transform="translate(1030, 727)">
    <rect x="8" y="8" width="40" height="40" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <rect x="16" y="16" width="24" height="24" rx="3" fill="#207448" opacity="0.25"/>
    <line x1="18" y1="2" x2="18" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="2" x2="28" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="38" y1="2" x2="38" y2="8" stroke="#207448" stroke-width="3"/>
    <line x1="18" y1="48" x2="18" y2="54" stroke="#207448" stroke-width="3"/>
    <line x1="28" y1="48" x2="28" y2="54" stroke="#207448" stroke-width="3"/>
    <line x1="38" y1="48" x2="38" y2="54" stroke="#207448" stroke-width="3"/>
    <line x1="2" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="2" y1="28" x2="8" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="2" y1="38" x2="8" y2="38" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="18" x2="54" y2="18" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="28" x2="54" y2="28" stroke="#207448" stroke-width="3"/>
    <line x1="48" y1="38" x2="54" y2="38" stroke="#207448" stroke-width="3"/>
  </g>
  <text x="1100" y="763" font-family="sans-serif" font-size="24" fill="#303a36">accounting from the cgroup</text>

  
  <rect x="950" y="825" width="600" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="990" cy="880" r="24" fill="#207448"/>
  <text x="990" y="889" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <g transform="translate(1030, 852)">
    <rect x="18" y="2" width="20" height="16" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 28,18 L 28,32 M 12,32 L 44,32 M 12,32 L 12,40 M 44,32 L 44,40" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="3" y="40" width="18" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="35" y="40" width="18" height="14" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
  </g>
  <text x="1095" y="868" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" dy="0">every process of the service,</tspan>
    <tspan x="1095" dy="32">however many times it forked</tspan>
  </text>

  
  <rect x="950" y="955" width="600" height="120" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="990" cy="1015" r="24" fill="#207448"/>
  <text x="990" y="1024" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <g transform="translate(1030, 987)">
    <rect x="4" y="4" width="48" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 12,18 L 22,28 L 12,38" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="38" x2="42" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="1095" y="990" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1095" dy="0">newest journal lines only;</tspan>
    <tspan x="1095" dy="30">the full log is</tspan>
    <tspan x="1095" dy="30">journalctl -u NAME</tspan>
  </text>

  
  <rect x="50" y="1110" width="1500" height="60" rx="12" fill="#207448"/>
  <text x="800" y="1148" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Read Active first, then the Result, then the log</text>
</svg>