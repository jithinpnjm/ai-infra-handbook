<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Search domains and ndots: why one lookup becomes several</title>
  <desc>SVG infographic explaining how search domains and ndots configuration expand a single DNS query into multiple queries.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" text-anchor="middle" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Search domains and ndots: why one lookup becomes several</text>

  

  
  <rect x="130" y="105" width="440" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="146" y="118" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 156 135 L 164 140 L 156 145" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="170" y1="145" x2="180" y2="145" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="150" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Name typed: <tspan font-family="ui-monospace, monospace">myhost</tspan></text>

  
  <line x1="350" y1="175" x2="350" y2="198" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <polygon points="350,200 670,320 350,440 30,320" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
  
  <circle cx="350" cy="242" r="18" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 344 236 C 344 230, 356 230, 356 238 C 356 244, 350 244, 350 248" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <circle cx="350" cy="254" r="1.5" fill="#207448"/>
  
  <text x="350" y="286" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Does the name have</text>
  <text x="350" y="322" text-anchor="middle" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">fewer dots than ndots?</text>
  <text x="350" y="365" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">(default ndots 1;</text>
  <text x="350" y="398" text-anchor="middle" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Kubernetes sets 5)</text>

  
  <line x1="350" y1="440" x2="350" y2="508" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="365" y="458" width="60" height="34" rx="6" fill="#207448"/>
  <text x="395" y="482" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">Yes</text>

  
  <line x1="670" y1="320" x2="718" y2="320" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="676" y="275" width="50" height="34" rx="6" fill="#303a36"/>
  <text x="701" y="299" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">No</text>

  
  <rect x="722" y="235" width="260" height="170" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="852" cy="278" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 842 278 L 849 285 L 864 270" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="852" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">try the name as</text>
  <text x="852" y="380" text-anchor="middle" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">typed first</text>

  
  <rect x="40" y="508" width="620" height="372" rx="12" fill="none" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 6"/>

  
  <rect x="55" y="520" width="590" height="95" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="95" cy="567" r="24" fill="#207448"/>
  <text x="95" y="575" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">1</text>
  <text x="135" y="556" font-size="26" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">try myhost.corp.example.com</text>
  <text x="135" y="590" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">(the first search suffix)</text>
  
  <circle cx="600" cy="562" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="610" y1="572" x2="622" y2="584" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

  
  <line x1="350" y1="615" x2="350" y2="636" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="55" y="638" width="590" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="95" cy="680" r="24" fill="#207448"/>
  <text x="95" y="688" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">2</text>
  <text x="135" y="688" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">try each further search suffix</text>
  
  <circle cx="600" cy="680" r="14" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 594 680 L 606 680 M 602 674 L 608 680 L 602 686" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  
  <line x1="350" y1="723" x2="350" y2="746" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

  
  <rect x="55" y="748" width="590" height="85" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="95" cy="790" r="24" fill="#207448"/>
  <text x="95" y="798" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">3</text>
  <text x="135" y="798" font-size="26" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">try <tspan font-family="ui-monospace, monospace">myhost</tspan> as typed</text>
  
  <rect x="582" y="768" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 590 781 L 596 786 L 590 791 M 600 791 L 608 791" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>

  

  
  <rect x="1020" y="105" width="540" height="375" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  
  <path d="M 1020 117 A 12 12 0 0 1 1032 105 L 1548 105 A 12 12 0 0 1 1560 117 L 1560 120 L 1020 120 Z" fill="#db8129"/>
  
  <circle cx="1073" cy="163" r="22" fill="none" stroke="#db8129" stroke-width="4"/>
  <path d="M 1073 147 L 1073 179 M 1059 155 L 1087 171 M 1059 171 L 1087 155" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  
  <text x="1115" y="156" font-size="30" font-weight="bold" fill="#db8129" font-family="system-ui, -apple-system, sans-serif">Why this bites</text>
  <text x="1115" y="190" font-size="30" font-weight="bold" fill="#db8129" font-family="system-ui, -apple-system, sans-serif">in Kubernetes</text>
  
  <line x1="1045" y1="210" x2="1535" y2="210" stroke="#db8129" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  
  <text x="1045" y="240" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">a pod's <tspan font-family="ui-monospace, monospace">/etc/resolv.conf</tspan> has</text>
  <text x="1045" y="270" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif"><tspan font-family="ui-monospace, monospace">ndots:5</tspan>; <tspan font-family="ui-monospace, monospace">example.com</tspan> has one</text>
  <text x="1045" y="300" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">dot, fewer than 5, so the resolver</text>
  <text x="1045" y="330" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">tries it with each search suffix</text>
  <text x="1045" y="360" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">before the real name, and every</text>
  <text x="1045" y="390" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">extra try is a DNS query;</text>
  <text x="1045" y="420" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">A and AAAA are asked in parallel,</text>
  <text x="1045" y="450" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">so queries multiply</text>

  
  <rect x="1020" y="500" width="540" height="405" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1073" cy="543" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="1063" y1="533" x2="1083" y2="553" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="1083" y1="533" x2="1063" y2="553" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  
  <text x="1115" y="538" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">What a failed lookup</text>
  <text x="1115" y="570" font-size="30" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">looks like</text>
  
  <line x1="1045" y1="590" x2="1535" y2="590" stroke="#207448" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  
  <rect x="1040" y="605" width="500" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <rect x="1055" y="625" width="36" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 1063 638 L 1070 643 L 1063 648 M 1074 648 L 1083 648" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1105" y="638" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Could not resolve host</text>
  <text x="1105" y="668" font-size="24" fill="#303a36" font-family="ui-monospace, monospace">(curl exit code 6)</text>

  
  <rect x="1040" y="698" width="500" height="80" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <path d="M 1073 720 L 1091 752 L 1055 752 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
  <line x1="1073" y1="732" x2="1073" y2="742" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="1073" cy="747" r="1.5" fill="#207448"/>
  <text x="1105" y="732" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">Temporary failure in</text>
  <text x="1105" y="762" font-size="24" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">name resolution</text>

  
  <rect x="1040" y="792" width="500" height="98" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
  <circle cx="1073" cy="841" r="18" fill="none" stroke="#207448" stroke-width="3"/>
  <polyline points="1073,830 1073,841 1081,845" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1105" y="822" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">a long pause before anything</text>
  <text x="1105" y="852" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">else, shown as a large</text>
  <text x="1105" y="880" font-size="24" font-weight="bold" fill="#303a36" font-family="ui-monospace, monospace">time_namelookup</text>

  
  <rect x="40" y="930" width="1520" height="155" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="95" cy="1005" r="22" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 87 997 L 103 1013 M 103 997 L 87 1013" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  
  <text x="145" y="975" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif"><tspan font-weight="bold">Other causes:</tspan> wrong resolver in <tspan font-family="ui-monospace, monospace">/etc/resolv.conf</tspan> (set by hand or DHCP), split-horizon DNS,</text>
  <text x="145" y="1015" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">stale cache controlled by the TTL, AAAA answers for hosts you cannot reach over IPv6,</text>
  <text x="145" y="1055" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">firewalls blocking UDP/53 or TCP/53, DNSSEC failures, a dead first resolver</text>

  
  <rect x="40" y="1110" width="1520" height="65" rx="8" fill="#207448"/>
  <text x="800" y="1152" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">One lookup can quietly turn into several</text>
</svg>