<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Memory policy by node type</title>
  <desc>Infographic table showing memory configuration policies including Swap, Swappiness, THP, and Limits across different system node types.</desc>

  <rect width="1600" height="1120" fill="#f5f8f5"/>

  
  <text x="800" y="78" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Memory policy by node type</text>

  
  
  <rect x="60" y="130" width="300" height="60" rx="8" fill="#207448"/>
  <text x="210" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Node type</text>

  
  <rect x="376" y="130" width="205" height="60" rx="8" fill="#207448"/>
  <text x="478" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Swap</text>

  
  <rect x="597" y="130" width="185" height="60" rx="8" fill="#207448"/>
  <text x="689" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Swappiness</text>

  
  <rect x="798" y="130" width="225" height="60" rx="8" fill="#207448"/>
  <text x="910" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">THP</text>

  
  <rect x="1039" y="130" width="501" height="60" rx="8" fill="#207448"/>
  <text x="1289" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Limits</text>

  
  
  <rect x="60" y="206" width="300" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="190" y="226" width="40" height="38" rx="6" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="199" y="235" width="22" height="20" rx="3" fill="#207448" opacity="0.2" stroke="#207448" stroke-width="2"/>
  <line x1="198" y1="219" x2="198" y2="226" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="219" x2="222" y2="226" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="198" y1="264" x2="198" y2="271" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="264" x2="222" y2="271" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="236" x2="190" y2="236" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="254" x2="190" y2="254" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="236" x2="237" y2="236" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="254" x2="237" y2="254" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="312" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Training or</text>
  <text x="210" y="344" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">HPC compute</text>
  
  <rect x="376" y="206" width="205" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="478" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">none or</text>
  <text x="478" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">minimal</text>
  
  <rect x="597" y="206" width="185" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="689" y="297" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0 to 10</text>
  
  <rect x="798" y="206" width="225" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="910" y="280" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">always or</text>
  <text x="910" y="314" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">madvise</text>
  
  <rect x="1039" y="206" width="501" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="1065" y="280" font-family="monospace" font-size="24" fill="#303a36">cgroup memory.max per job,</text>
  <text x="1065" y="316" font-family="monospace" font-size="24" fill="#303a36">memlock unlimited</text>

  
  
  <rect x="60" y="392" width="300" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="210" cy="433" r="22" fill="none" stroke="#db8129" stroke-width="3.5"/>
  <line x1="210" y1="433" x2="223" y2="420" stroke="#db8129" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="210" cy="433" r="4" fill="#db8129"/>
  <text x="210" y="498" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Inference or</text>
  <text x="210" y="530" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">latency-critical</text>
  
  <rect x="376" y="392" width="205" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="478" y="483" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">none</text>
  
  <rect x="597" y="392" width="185" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="689" y="483" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">0 to 10</text>
  
  <rect x="798" y="392" width="225" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="910" y="466" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">madvise or</text>
  <text x="910" y="500" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">never</text>
  
  <rect x="1039" y="392" width="501" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="1065" y="466" font-family="sans-serif" font-size="24" fill="#303a36">per-service limits,</text>
  <text x="1065" y="502" font-family="sans-serif" font-size="24" fill="#303a36"><tspan font-family="monospace">memory.high</tspan> as early warning</text>

  
  
  <rect x="60" y="578" width="300" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="187" y="597" width="46" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M195,607 L201,613 L195,619" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="205" y1="619" x2="216" y2="619" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="202" y1="629" x2="202" y2="636" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="218" y1="629" x2="218" y2="636" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="636" x2="224" y2="636" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="684" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Login or</text>
  <text x="210" y="716" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">shared nodes</text>
  
  <rect x="376" y="578" width="205" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="478" y="652" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">small swap,</text>
  <text x="478" y="686" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">maybe zram</text>
  
  <rect x="597" y="578" width="185" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="689" y="669" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">10 to 60</text>
  
  <rect x="798" y="578" width="225" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="910" y="669" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">default</text>
  
  <rect x="1039" y="578" width="501" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="1065" y="652" font-family="sans-serif" font-size="24" fill="#303a36">per-user slice</text>
  <text x="1065" y="688" font-family="monospace" font-size="24" fill="#303a36">MemoryMax</text>

  
  
  <rect x="60" y="764" width="300" height="170" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="190" y="784" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="212" y="784" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="201" y="806" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="199" y1="802" x2="205" y2="806" stroke="#207448" stroke-width="2"/>
  <line x1="221" y1="802" x2="215" y2="806" stroke="#207448" stroke-width="2"/>
  <text x="210" y="870" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Kubernetes</text>
  <text x="210" y="902" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">workers</text>
  
  <rect x="376" y="764" width="205" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="478" y="855" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">usually off</text>
  
  <rect x="597" y="764" width="185" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="689" y="855" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">low</text>
  
  <rect x="798" y="764" width="225" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="910" y="855" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">per workload</text>
  
  <rect x="1039" y="764" width="501" height="170" rx="8" fill="#ffffff" stroke="#c8d8cd" stroke-width="1.5"/>
  <text x="1065" y="832" font-family="monospace" font-size="24" fill="#303a36">systemReserved,</text>
  <text x="1065" y="866" font-family="monospace" font-size="24" fill="#303a36">kubeReserved,</text>
  <text x="1065" y="900" font-family="sans-serif" font-size="24" fill="#303a36">QoS classes</text>

  
  <rect x="60" y="960" width="1480" height="80" rx="12" fill="#207448"/>
  <text x="800" y="1010" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">start from your row and change it only after you measure.</text>
</svg>