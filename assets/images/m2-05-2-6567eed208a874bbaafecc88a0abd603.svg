<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Diagnosing routing problems</title>
  <desc>Visual flowchart guide for troubleshooting Linux routing issues from route lookup to next-hop ARP reachability and packet egress</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1120" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Diagnosing routing problems</text>

  
  
  <line x1="330" y1="175" x2="330" y2="215" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <line x1="330" y1="350" x2="330" y2="470" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="345" y="392" width="48" height="34" rx="6" fill="#f5f8f5" />
  <text x="348" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">ok</text>

  
  <line x1="330" y1="620" x2="330" y2="740" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="345" y="662" width="48" height="34" rx="6" fill="#f5f8f5" />
  <text x="348" y="687" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">ok</text>

  
  <line x1="590" y1="262" x2="880" y2="262" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="735" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="735" dy="0">RTNETLINK:</tspan>
    <tspan x="735" dy="28">Network is unreachable</tspan>
  </text>

  
  <path d="M 590 320 H 660 V 375 H 880" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="770" y="334" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="770" dy="0">wrong dev /</tspan>
    <tspan x="770" dy="28">wrong src</tspan>
  </text>

  
  <line x1="590" y1="550" x2="880" y2="550" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="735" y="506" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="735" dy="0">neighbour</tspan>
    <tspan x="735" dy="28">FAILED/INCOMPLETE</tspan>
  </text>

  
  <path d="M 590 760 H 650 V 725 H 880" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="765" y="708" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">leave, no reply</text>

  
  <path d="M 590 810 H 630 V 880 H 880" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="755" y="842" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="755" dy="0">reply arrives on</tspan>
    <tspan x="755" dy="26">another NIC</tspan>
  </text>

  
  <path d="M 590 860 H 610 V 1015 H 880" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="745" y="1000" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">do not leave</text>


  

  
  <g id="node-s">
    <rect x="70" y="100" width="520" height="75" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(100, 115)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 4 L 41 38 L 3 38 Z" />
      <line x1="22" y1="17" x2="22" y2="26" />
      <circle cx="22" cy="32" r="1.5" fill="#db8129" />
    </g>
    <text x="165" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Can't reach D</text>
  </g>

  
  <g id="node-a">
    <rect x="70" y="215" width="520" height="135" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="112" cy="254" r="22" fill="#207448" />
    <text x="112" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(150, 230)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" />
      <path d="M 12 24 L 36 24" />
      <path d="M 24 12 L 24 36" />
      <path d="M 30 18 L 36 24 L 30 30" />
      <path d="M 18 18 L 24 12 L 30 18" />
    </g>
    <text x="215" y="263" font-family="'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="28" font-weight="bold" fill="#207448">ip route get D</text>
    <text x="105" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">sensible dev, via, src?</text>
  </g>

  
  <g id="node-b">
    <rect x="70" y="470" width="520" height="150" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="112" cy="510" r="22" fill="#207448" />
    <text x="112" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(150, 486)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 36 A 20 20 0 0 1 40 36" />
      <path d="M 15 36 A 12 12 0 0 1 33 36" />
      <circle cx="24" cy="36" r="3" fill="#207448" />
    </g>
    <text x="215" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Can I reach the next hop?</text>
    <text x="105" y="566" font-family="'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="105" dy="0">ip neigh / arping /</tspan>
      <tspan x="105" dy="30">ping gateway</tspan>
    </text>
  </g>

  
  <g id="node-c">
    <rect x="70" y="740" width="520" height="145" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="112" cy="780" r="22" fill="#207448" />
    <text x="112" y="788" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(150, 756)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="36" height="26" rx="4" />
      <path d="M 6 21 H 42" />
      <circle cx="14" cy="15" r="2" fill="#207448" />
      <circle cx="22" cy="15" r="2" fill="#207448" />
      <path d="M 24 34 V 40" />
      <path d="M 16 40 H 32" />
    </g>
    <text x="215" y="788" font-family="'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#207448">tcpdump on the egress NIC:</text>
    <text x="105" y="848" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">do packets leave? replies return?</text>
  </g>


  

  
  <g id="node-a1">
    <rect x="880" y="210" width="660" height="100" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 235)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 10 H 36 L 42 22 L 36 34 H 8 Z" />
      <line x1="20" y1="34" x2="20" y2="44" />
      <line x1="8" y1="44" x2="32" y2="44" />
      <line x1="12" y1="12" x2="36" y2="32" stroke="#db8129" stroke-width="3" />
    </g>
    <text x="965" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">No route: add default/static route;</tspan>
      <tspan x="965" dy="32">is the NIC up/has address?</tspan>
    </text>
  </g>

  
  <g id="node-a2">
    <rect x="880" y="325" width="660" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 355)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 40 V 26 C 12 18 20 12 36 12" />
      <path d="M 30 6 L 36 12 L 30 18" />
      <path d="M 12 26 C 12 18 6 12 2 12" stroke-dasharray="3 3" />
    </g>
    <text x="965" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">Metric, duplicate default, overlapping prefix,</tspan>
      <tspan x="965" dy="32">missing policy rule; fix routes/rules</tspan>
    </text>
  </g>

  
  <g id="node-b1">
    <rect x="880" y="495" width="660" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 525)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="8" width="28" height="24" rx="3" />
      <path d="M 17 8 V 16" />
      <path d="M 24 8 V 16" />
      <path d="M 31 8 V 16" />
      <path d="M 18 32 V 42" />
      <path d="M 30 32 V 42" />
    </g>
    <text x="965" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">L2 problem: VLAN, cable, switch port,</tspan>
      <tspan x="965" dy="32">wrong gateway IP, firewall on ARP</tspan>
    </text>
  </g>

  
  <g id="node-c1">
    <rect x="880" y="665" width="660" height="120" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 698)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 36 A 10 10 0 0 1 10 20 A 14 14 0 0 1 34 16 A 11 11 0 0 1 42 30 A 8 8 0 0 1 38 36 Z" />
      <path d="M 22 22 L 28 30" stroke="#db8129" />
      <path d="M 28 22 L 22 30" stroke="#db8129" />
    </g>
    <text x="965" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">Remote/transit problem: gateway has no</tspan>
      <tspan x="965" dy="32">route back, NAT, firewall, asymmetric path;</tspan>
      <tspan x="965" dy="32">traceroute/mtr</tspan>
    </text>
  </g>

  
  <g id="node-c2">
    <rect x="880" y="825" width="660" height="105" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 855)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 16 H 38" />
      <path d="M 32 10 L 38 16 L 32 22" />
      <path d="M 38 34 H 8" />
      <path d="M 14 28 L 8 34 L 14 40" />
    </g>
    <text x="965" y="868" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">Asymmetric routing:</tspan>
      <tspan x="965" dy="32">rp_filter, policy routing</tspan>
    </text>
  </g>

  
  <g id="node-c3">
    <rect x="880" y="960" width="660" height="110" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(905, 990)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 40 10 V 22 C 40 33 24 42 24 42 C 24 42 8 33 8 22 V 10 Z" />
      <line x1="16" y1="22" x2="32" y2="22" />
      <line x1="24" y1="14" x2="24" y2="30" />
    </g>
    <text x="965" y="1003" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="965" dy="0">Local firewall/qdisc/xfrm, source address,</tspan>
      <tspan x="965" dy="32">MTU (ping -M do), netns confusion</tspan>
    </text>
  </g>

</svg>