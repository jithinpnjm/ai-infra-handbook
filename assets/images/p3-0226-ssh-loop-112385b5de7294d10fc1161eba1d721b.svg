<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>The SSH feedback loop in a live capture</title>
  <desc>Visual infographic explaining the SSH feedback loop when running tcpdump over a live management session, remediation options to break the loop, and other common packet capture mistakes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">The SSH feedback loop in a live capture</text>

  

  
  
  <line x1="440" y1="215" x2="510" y2="215" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="800" y1="290" x2="800" y2="830" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="520" y1="915" x2="450" y2="915" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="160" y1="840" x2="160" y2="300" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g id="box-1">
    <rect x="50" y="140" width="390" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="90" cy="180" r="24" fill="#207448" />
    <text x="90" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(360, 155)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="52" height="38" rx="6" />
      <path d="M 10 14 L 18 20 L 10 26" />
      <line x1="22" y1="26" x2="34" y2="26" />
    </g>
    
    <text x="70" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      <tspan font-family="monospace">tcpdump</tspan> runs live
    </text>
    <text x="70" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">over an SSH session</text>
  </g>

  
  <g id="box-2">
    <rect x="520" y="140" width="390" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="560" cy="180" r="24" fill="#207448" />
    <text x="560" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(830, 155)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="4" y="0" width="44" height="42" rx="4" />
      <line x1="12" y1="12" x2="36" y2="12" />
      <line x1="12" y1="20" x2="32" y2="20" />
      <line x1="12" y1="28" x2="26" y2="28" />
    </g>
    
    <text x="540" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">it prints a line</text>
    <text x="540" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">for each packet</text>
  </g>

  
  <g id="box-3">
    <rect x="520" y="840" width="390" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="560" cy="880" r="24" fill="#207448" />
    <text x="560" y="888" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(830, 855)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="6" width="50" height="28" rx="6" />
      <path d="M 12 20 L 22 20 M 28 20 L 38 20" stroke-dasharray="4 2" />
      <circle cx="25" cy="20" r="3" fill="#207448" />
    </g>
    
    <text x="540" y="938" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">the printed lines travel</text>
    <text x="540" y="968" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">over the SSH connection</text>
  </g>

  
  <g id="box-4">
    <rect x="50" y="840" width="390" height="150" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <circle cx="90" cy="880" r="24" fill="#207448" />
    <text x="90" y="888" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(360, 855)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 10 24 A 16 16 0 1 1 36 28" />
      <polyline points="38,20 36,30 26,28" />
    </g>
    
    <text x="70" y="928" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">each SSH packet is</text>
    <text x="70" y="956" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">captured and</text>
    <text x="70" y="984" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">printed again</text>
  </g>

  
  <g id="centre-box">
    <rect x="230" y="470" width="500" height="190" rx="16" fill="#fff7ed" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(456, 492)" stroke="#db8129" stroke-width="3.5" fill="none">
      <polygon points="24,2 46,40 2,40" stroke-linejoin="round" />
      <line x1="24" y1="16" x2="24" y2="27" />
      <circle cx="24" cy="33" r="2" fill="#db8129" />
    </g>
    
    <text x="480" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">the capture is useless and</text>
    <text x="480" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">the session slows down;</text>
    <text x="480" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">nothing is broken on the node</text>
  </g>

  

  
  <g id="panel-break-the-loop">
    <rect x="960" y="120" width="600" height="355" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(990, 142)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="16" cy="16" r="14" />
      <line x1="6" y1="6" x2="26" y2="26" />
    </g>
    <text x="1035" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Break the loop</text>

    
    <rect x="980" y="190" width="560" height="60" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <circle cx="1005" cy="220" r="7" fill="#207448" />
    <text x="1025" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">not port 22</tspan> (essential when
    </text>
    <text x="1025" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">capturing over SSH)</text>

    
    <rect x="980" y="258" width="560" height="60" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <circle cx="1005" cy="288" r="7" fill="#207448" />
    <text x="1025" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      write to a file with <tspan font-family="monospace">-w</tspan> instead
    </text>
    <text x="1025" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">of printing live</text>

    
    <rect x="980" y="326" width="560" height="60" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <circle cx="1005" cy="356" r="7" fill="#207448" />
    <text x="1025" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">turn name resolution off with</text>
    <text x="1025" y="377" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan font-family="monospace">-n or -nn</tspan>
    </text>

    
    <rect x="980" y="394" width="560" height="54" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <circle cx="1005" cy="421" r="7" fill="#207448" />
    <text x="1025" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      truncate with <tspan font-family="monospace">-s 96</tspan>
    </text>
  </g>

  
  <g id="panel-other-common-mistakes">
    <rect x="960" y="515" width="600" height="525" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <g transform="translate(990, 535)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="16" cy="16" r="14" />
      <line x1="16" y1="9" x2="16" y2="18" />
      <circle cx="16" cy="23" r="1.5" fill="#207448" />
    </g>
    <text x="1035" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Other common mistakes</text>

    
    <rect x="980" y="580" width="560" height="78" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      heavy <tspan font-family="monospace">bpftrace</tspan> probes such as
    </text>
    <text x="1005" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      per-packet <tspan font-family="monospace">printf</tspan> can hurt a
    </text>
    <text x="1005" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">busy production host</text>

    
    <rect x="980" y="664" width="560" height="56" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="689" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">outbound bad checksums and giant</text>
    <text x="1005" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">frames are usually offload effects</text>

    
    <rect x="980" y="726" width="560" height="78" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="751" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">out of order in a multi-queue</text>
    <text x="1005" y="776" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">capture describes the capture,</text>
    <text x="1005" y="801" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">not the network</text>

    
    <rect x="980" y="810" width="560" height="56" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="835" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">capturing one side leaves</text>
    <text x="1005" y="860" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the other side a guess</text>

    
    <rect x="980" y="872" width="560" height="56" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="897" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">unsynchronised clocks cannot</text>
    <text x="1005" y="922" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">be compared reliably</text>

    
    <rect x="980" y="934" width="560" height="42" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="963" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">kernel captures miss RDMA traffic</text>

    
    <rect x="980" y="982" width="560" height="52" rx="8" fill="#ffffff" stroke="#cbdcd0" stroke-width="1.5" />
    <text x="1005" y="1007" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">never decrypt TLS in production or</text>
    <text x="1005" y="1031" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">share a raw capture with secrets</text>
  </g>

  
  <g id="bottom-bar">
    <rect x="50" y="1070" width="1510" height="70" rx="14" fill="#207448" />
    
    <g transform="translate(75, 1087)" stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 18 4 L 32 10 L 32 20 C 32 29 18 34 18 34 C 18 34 4 29 4 20 L 4 10 Z" />
    </g>
    <text x="805" y="1114" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Exclude your own management session before you start
    </text>
  </g>
</svg>