<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>From symptom to likely cause, with the first tool to use</title>
  <desc>A three-column diagnostic ladder mapping seventeen concurrency symptoms to their likely causes and remedies.</desc>
  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36"><tspan x="800" dy="0">From symptom to likely cause, </tspan><tspan x="800" dy="50">with the first tool to use</tspan></text>

  
  <rect x="40" y="104" width="1520" height="926" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>

  
  <rect x="40" y="104" width="1520" height="78" fill="#ffffff"/>
  <line x1="40" y1="182" x2="1560" y2="182" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="128.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">Tasks stall, timeouts </tspan><tspan x="60" dy="24">everywhere, slow callback </tspan><tspan x="60" dy="24">warnings</tspan></text>
  <text x="520" y="151.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">blocking the event loop</text>
  <text x="940" y="151.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">async APIs or to_thread</text>
  
  <rect x="40" y="182" width="1520" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="236" x2="1560" y2="236" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="205.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">Work never happens; </tspan><tspan x="60" dy="24">was never awaited warning</tspan></text>
  <text x="520" y="217.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">un-awaited coroutine</text>
  <text x="940" y="217.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">await or create_task</text>
  
  <rect x="40" y="236" width="1520" height="54" fill="#ffffff"/>
  <line x1="40" y1="290" x2="1560" y2="290" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="259.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">Task exception was </tspan><tspan x="60" dy="24">never retrieved</tspan></text>
  <text x="520" y="271.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">dropped task reference</text>
  <text x="940" y="259.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">keep references, await or add </tspan><tspan x="940" dy="24">done callbacks</tspan></text>
  
  <rect x="40" y="290" width="1520" height="44" fill="#e8f1ea"/>
  <line x1="40" y1="334" x2="1560" y2="334" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="320.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Cannot cancel or shut down</text>
  <text x="520" y="320.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">swallowed CancelledError</text>
  <text x="940" y="320.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">re-raise it, no bare except</text>
  
  <rect x="40" y="334" width="1520" height="54" fill="#ffffff"/>
  <line x1="40" y1="388" x2="1560" y2="388" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="369.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Hangs after network blips</text>
  <text x="520" y="369.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">missing timeouts</text>
  <text x="940" y="357.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">wait_for or timeout on every await; </tspan><tspan x="940" dy="24">client timeout=</tspan></text>
  
  <rect x="40" y="388" width="1520" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="442" x2="1560" y2="442" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="411.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">OOM, too many open files, </tspan><tspan x="60" dy="24">target overload</tspan></text>
  <text x="520" y="423.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">unbounded fan-out</text>
  <text x="940" y="411.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">semaphores, bounded queues, </tspan><tspan x="940" dy="24">islice feeding</tspan></text>
  
  <rect x="40" y="442" width="1520" height="54" fill="#ffffff"/>
  <line x1="40" y1="496" x2="1560" y2="496" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="477.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Rare wrong results</text>
  <text x="520" y="477.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">thread-unsafe shared state</text>
  <text x="940" y="465.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">locks, queues, thread-local, </tspan><tspan x="940" dy="24">immutable data</tspan></text>
  
  <rect x="40" y="496" width="1520" height="78" fill="#e8f1ea"/>
  <line x1="40" y1="574" x2="1560" y2="574" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="543.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Everything idle forever</text>
  <text x="520" y="543.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">deadlock</text>
  <text x="940" y="520.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">lock ordering, timeouts; </tspan><tspan x="940" dy="24">faulthandler.dump_traceback_later(60); </tspan><tspan x="940" dy="24">py-spy dump</tspan></text>
  
  <rect x="40" y="574" width="1520" height="54" fill="#ffffff"/>
  <line x1="40" y1="628" x2="1560" y2="628" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="597.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">Hangs in children, </tspan><tspan x="60" dy="24">CUDA errors</tspan></text>
  <text x="520" y="597.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan x="520" dy="0">fork with threads, </tspan><tspan x="520" dy="24">CUDA or locks</tspan></text>
  <text x="940" y="609.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">spawn or forkserver</text>
  
  <rect x="40" y="628" width="1520" height="44" fill="#e8f1ea"/>
  <line x1="40" y1="672" x2="1560" y2="672" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="658.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Can't pickle local object</text>
  <text x="520" y="658.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">pickle errors</text>
  <text x="940" y="658.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">top-level functions</text>
  
  <rect x="40" y="672" width="1520" height="44" fill="#ffffff"/>
  <line x1="40" y1="716" x2="1560" y2="716" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="702.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Memory growth in pools</text>
  <text x="520" y="702.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">worker leaks</text>
  <text x="940" y="702.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">maxtasksperchild, tracemalloc</text>
  
  <rect x="40" y="716" width="1520" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="770" x2="1560" y2="770" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="739.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">Defunct processes, </tspan><tspan x="60" dy="24">leftover workers</tspan></text>
  <text x="520" y="751.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">zombies or orphans</text>
  <text x="940" y="739.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">wait(), context managers, </tspan><tspan x="940" dy="24">process groups, supervisors</tspan></text>
  
  <rect x="40" y="770" width="1520" height="54" fill="#ffffff"/>
  <line x1="40" y1="824" x2="1560" y2="824" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="805.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">CPU throttling, slow runs</text>
  <text x="520" y="805.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">oversubscription</text>
  <text x="940" y="793.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">match cgroup limits, </tspan><tspan x="940" dy="24">OMP_NUM_THREADS=1</tspan></text>
  
  <rect x="40" y="824" width="1520" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="878" x2="1560" y2="878" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="859.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Target collapse</text>
  <text x="520" y="847.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan x="520" dy="0">thundering herd or </tspan><tspan x="520" dy="24">retry storm</tspan></text>
  <text x="940" y="847.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">jittered backoff, limits, </tspan><tspan x="940" dy="24">circuit breakers</tspan></text>
  
  <rect x="40" y="878" width="1520" height="44" fill="#ffffff"/>
  <line x1="40" y1="922" x2="1560" y2="922" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="908.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">Silent partial results</text>
  <text x="520" y="908.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">lost exceptions in threads</text>
  <text x="940" y="908.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">futures, threading.excepthook</text>
  
  <rect x="40" y="922" width="1520" height="54" fill="#e8f1ea"/>
  <line x1="40" y1="976" x2="1560" y2="976" stroke="#207448" stroke-width="1" opacity="0.25"/>
  <text x="60" y="945.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448"><tspan x="60" dy="0">ValueError: signal only </tspan><tspan x="60" dy="24">works in main thread</tspan></text>
  <text x="520" y="945.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan x="520" dy="0">signal in a non-main </tspan><tspan x="520" dy="24">thread</tspan></text>
  <text x="940" y="945.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">install handlers in the main thread </tspan><tspan x="940" dy="24">or loop.add_signal_handler</tspan></text>
  
  <rect x="40" y="976" width="1520" height="54" fill="#ffffff"/>
  <text x="60" y="1011.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">RuntimeError</text>
  <text x="520" y="999.0" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan x="520" dy="0">asyncio.run() inside a </tspan><tspan x="520" dy="24">running loop (Jupyter)</tspan></text>
  <text x="940" y="999.0" font-family="ui-monospace, monospace" font-size="24" fill="#303a36"><tspan x="940" dy="0">await instead; nest_asyncio only </tspan><tspan x="940" dy="24">for notebooks</tspan></text>
  
  <line x1="500" y1="104" x2="500" y2="1030" stroke="#207448" stroke-width="1.5" opacity="0.35"/>
  <line x1="920" y1="104" x2="920" y2="1030" stroke="#207448" stroke-width="1.5" opacity="0.35"/>

  
  <rect x="40" y="1046" width="1520" height="58" rx="8" fill="#fff7f0" stroke="#db8129" stroke-width="2.5"/>
  <g transform="translate(68, 1057)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="14"/>
    <polyline points="18,10 18,18 24,18"/>
  </g>
  <g transform="translate(1480, 1057)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="28" height="28" rx="5"/>
    <line x1="4" y1="18" x2="32" y2="18"/>
    <line x1="18" y1="4" x2="18" y2="32"/>
  </g>
  <text x="800" y="1081" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#db8129">a timeout on every wait, a bound on every queue and pool</text>

  
  <rect x="40" y="1118" width="1520" height="64" rx="8" fill="#207448"/>
  <text x="800" y="1157" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Start from the symptom you see</text>
</svg>