<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Two-Step Atomic Symlink Replacement Workflow</title>
  <desc>Three-stage workflow sequence diagram showing safe checkpoint pointer rotation without race conditions or missing link windows.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#587467" />
    </marker>
  </defs>

  
  <rect width="1600" height="1350" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">Two-Step Atomic Symlink Replacement Workflow</text>
  <text x="800" y="105" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">Three-stage workflow sequence diagram showing safe checkpoint pointer rotation.</text>

  
  <g id="stage-t0">
    
    <rect x="40" y="140" width="1520" height="310" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <circle cx="85" cy="190" r="24" fill="#207448" />
    <text x="85" y="198" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">T0</text>
    <text x="125" y="199" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Initial State (T0)</text>

    
    <g transform="translate(680, 160)" stroke="#207448" stroke-width="3" fill="none">
      <ellipse cx="28" cy="14" rx="26" ry="10" fill="#f5f8f5" />
      <path d="M 2 14 V 42 C 2 48 14 54 28 54 C 42 54 54 48 54 42 V 14" />
      <path d="M 2 28 C 2 34 14 40 28 40 C 42 40 54 34 54 28" />
    </g>

    
    <rect x="65" y="235" width="760" height="185" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    <text x="85" y="275" font-family="sans-serif" font-size="24" fill="#303a36">Directory contains checkpoint directories</text>
    <text x="85" y="307" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">&#39;checkpoints/step_000900&#39; and &#39;checkpoints/step_001000&#39;.</text>
    
    <text x="85" y="355" font-family="sans-serif" font-size="24" fill="#303a36">Active symlink &#39;latest&#39; points to &#39;step_000900&#39;.</text>
    <text x="85" y="395" font-family="sans-serif" font-size="24" fill="#303a36">Concurrent Reader process resolves &#39;latest/model.pt&#39; -&gt; &#39;step_000900/model.pt&#39;.</text>

    
    <rect x="850" y="165" width="685" height="255" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    
    
    <rect x="880" y="240" width="170" height="60" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="965" y="278" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">latest</text>

    
    <path d="M 1050 270 L 1170 230" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="1185" y="200" width="320" height="55" rx="8" fill="#207448" />
    <text x="1345" y="236" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">step_000900</text>

    
    <rect x="1185" y="295" width="320" height="55" rx="8" fill="#ffffff" stroke="#587467" stroke-width="2" stroke-dasharray="6 4" />
    <text x="1345" y="331" text-anchor="middle" font-family="monospace" font-size="24" fill="#587467">step_001000</text>
  </g>

  
  <g id="stage-t1">
    
    <rect x="40" y="480" width="1520" height="340" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="85" cy="530" r="24" fill="#207448" />
    <text x="85" y="538" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="125" y="539" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 1 (T1 - Prepare)</text>

    
    <g transform="translate(680, 500)" stroke="#207448" stroke-width="3" fill="none">
      <circle cx="28" cy="28" r="14" fill="#f5f8f5" />
      <path d="M 28 4 L 28 14 M 28 42 L 28 52 M 4 28 L 14 28 M 42 28 L 52 28 M 11 11 L 18 18 M 38 38 L 45 45 M 11 45 L 18 38 M 38 18 L 45 11" />
    </g>

    
    <rect x="65" y="575" width="760" height="220" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />
    
    
    <rect x="85" y="595" width="720" height="46" rx="6" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <text x="100" y="627" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">ln -sfn checkpoints/step_001000 latest.tmp</text>

    
    <text x="85" y="675" font-family="sans-serif" font-size="24" fill="#303a36">A temporary symlink &#39;latest.tmp&#39; is created pointing to &#39;step_001000&#39;.</text>
    <text x="85" y="715" font-family="sans-serif" font-size="24" fill="#303a36">The existing &#39;latest&#39; symlink remains untouched and live.</text>
    <text x="85" y="755" font-family="sans-serif" font-size="24" fill="#303a36">Concurrent Readers during T1 still resolve &#39;step_000900&#39; with zero errors.</text>

    
    <rect x="850" y="505" width="685" height="290" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />

    
    <rect x="880" y="540" width="180" height="52" rx="8" fill="#f5f8f5" stroke="#207448" stroke-width="2" />
    <text x="970" y="575" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">latest</text>

    
    <rect x="880" y="710" width="180" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="4 4" />
    <text x="970" y="745" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">latest.tmp</text>

    
    <rect x="1185" y="540" width="320" height="52" rx="8" fill="#207448" />
    <text x="1345" y="575" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">step_000900</text>

    
    <rect x="1185" y="710" width="320" height="52" rx="8" fill="#207448" />
    <text x="1345" y="745" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">step_001000</text>

    
    <path d="M 1060 566 L 1170 566" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 1060 736 L 1170 736" fill="none" stroke="#207448" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow-green)" />
  </g>

  
  <g id="stage-t2">
    
    <rect x="40" y="850" width="1520" height="350" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <circle cx="85" cy="900" r="24" fill="#db8129" />
    <text x="85" y="908" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="125" y="909" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Step 2 (T2 - Atomic Swap)</text>

    
    <g transform="translate(680, 870)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 28 6 L 48 16 V 32 C 48 45 28 54 28 54 C 28 54 8 45 8 32 V 16 Z" fill="#ffffff" />
      <path d="M 22 30 L 28 36 L 36 24" stroke="#db8129" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    
    <rect x="65" y="945" width="760" height="230" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />

    
    <rect x="85" y="965" width="720" height="46" rx="6" fill="#fdf4ec" stroke="#db8129" stroke-width="2" />
    <text x="100" y="997" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">mv -T latest.tmp latest</text>

    
    <text x="85" y="1045" font-family="sans-serif" font-size="24" fill="#303a36">The Linux kernel executes an atomic rename() syscall, replacing</text>
    <text x="85" y="1075" font-family="sans-serif" font-size="24" fill="#303a36">&#39;latest&#39; with &#39;latest.tmp&#39; in a single filesystem operation.</text>
    <text x="85" y="1120" font-family="sans-serif" font-size="24" fill="#303a36">Final State: &#39;latest&#39; now points to &#39;step_001000&#39;.</text>
    <text x="85" y="1155" font-family="sans-serif" font-size="24" fill="#303a36">&#39;latest.tmp&#39; disappears.</text>

    
    <rect x="850" y="875" width="685" height="300" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="1.5" />

    
    <rect x="880" y="955" width="180" height="56" rx="8" fill="#fdf4ec" stroke="#db8129" stroke-width="2.5" />
    <text x="970" y="992" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#db8129">latest</text>

    
    <rect x="1185" y="910" width="320" height="52" rx="8" fill="#ffffff" stroke="#587467" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="1345" y="945" text-anchor="middle" font-family="monospace" font-size="24" fill="#587467">step_000900</text>

    
    <rect x="1185" y="1080" width="320" height="52" rx="8" fill="#207448" />
    <text x="1345" y="1115" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">step_001000</text>

    
    <path d="M 1060 985 L 1170 1095" fill="none" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

    
    <rect x="880" y="1080" width="180" height="52" rx="8" fill="#f5f8f5" stroke="#c0d4c6" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="970" y="1114" text-anchor="middle" font-family="monospace" font-size="24" fill="#587467">&#39;latest.tmp&#39; disappears.</text>
  </g>

  
  <g id="callout-takeaway">
    <rect x="40" y="1230" width="1520" height="80" rx="12" fill="#207448" />
    
    
    <g transform="translate(65, 1243)" stroke="#ffffff" stroke-width="2.5" fill="none">
      <path d="M 27 6 L 46 15 V 30 C 46 42 27 50 27 50 C 27 50 8 42 8 30 V 15 Z" fill="#207448" />
      <path d="M 20 28 L 25 33 L 34 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="135" y="1280" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Callout highlight: Readers at all moments see either step_000900 or step_001000, never encountering a missing link window (ENOENT).</text>
  </g>
</svg>