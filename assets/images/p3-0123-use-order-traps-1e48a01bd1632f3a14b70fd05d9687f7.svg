<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1480" width="1600" height="1480">
  <title>Reading USE results: check order and three traps</title>
  <desc>Infographic explaining the USE method results check order, metric forms, three common traps, and software resources considerations.</desc>

  <rect width="1600" height="1480" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Reading USE results: check order and three traps</text>

  
  
  <g id="box-errors">
    <rect x="50" y="110" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="95" cy="160" r="24" fill="#207448"/>
    <text x="95" y="169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="135" y="152" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Errors first:</text>
    <text x="135" y="184" font-family="sans-serif" font-size="26" fill="#303a36">cheap and objective</text>

    
    <path d="M 440 140 v 22 c 0 15 -14 26 -20 30 c -6 -4 -20 -15 -20 -30 v -22 l 20 -8 z" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="420" y1="152" x2="420" y2="168" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <circle cx="420" cy="178" r="2" fill="#207448"/>

    <line x1="75" y1="225" x2="485" y2="225" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>

    <rect x="70" y="245" width="420" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    <text x="90" y="315" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="90" dy="0">Errors: counts, such as 50</tspan>
      <tspan x="90" dy="36">disk errors</tspan>
    </text>
  </g>

  
  <path d="M 510 280 L 548 280" stroke="#207448" stroke-width="3" fill="none"/>
  <polygon points="550,280 540,273 540,287" fill="#207448"/>

  
  <g id="box-saturation">
    <rect x="570" y="110" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="615" cy="160" r="24" fill="#207448"/>
    <text x="615" y="169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="655" y="152" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Saturation second:</text>
    <text x="655" y="184" font-family="sans-serif" font-size="26" fill="#303a36">any amount of it matters</text>

    
    <rect x="940" y="142" width="40" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="940" y="158" width="40" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <rect x="940" y="174" width="40" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3"/>

    <line x1="595" y1="225" x2="1005" y2="225" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>

    <rect x="590" y="245" width="420" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    <text x="610" y="300" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="610" dy="0">Saturation: a queue length or</tspan>
      <tspan x="610" dy="36">wait time, such as run queue</tspan>
      <tspan x="610" dy="36">of 4</tspan>
    </text>
  </g>

  
  <path d="M 1030 280 L 1068 280" stroke="#207448" stroke-width="3" fill="none"/>
  <polygon points="1070,280 1060,273 1060,287" fill="#207448"/>

  
  <g id="box-utilisation">
    <rect x="1090" y="110" width="460" height="340" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="1135" cy="160" r="24" fill="#207448"/>
    <text x="1135" y="169" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="1175" y="152" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Utilisation third:</text>
    <text x="1175" y="184" font-family="sans-serif" font-size="26" fill="#303a36">needs interpretation</text>

    
    <path d="M 1450 182 A 22 22 0 1 1 1486 182" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="1468" y1="182" x2="1480" y2="164" stroke="#207448" stroke-width="3" stroke-linecap="round"/>

    <line x1="1115" y1="225" x2="1525" y2="225" stroke="#207448" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>

    <rect x="1110" y="245" width="420" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    <text x="1130" y="300" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1130" dy="0">Utilisation: a percent over an</tspan>
      <tspan x="1130" dy="36">interval, such as one CPU</tspan>
      <tspan x="1130" dy="36">at 90%</tspan>
    </text>
  </g>

  
  
  <g id="trap-1">
    <rect x="50" y="480" width="460" height="610" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <circle cx="92" cy="525" r="22" fill="none" stroke="#207448" stroke-width="3"/>
    <polyline points="92,513 92,525 102,525" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="534" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Trap 1: interval length</text>

    
    <rect x="75" y="565" width="410" height="190" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    
    
    <line x1="95" y1="720" x2="465" y2="720" stroke="#a0b8a6" stroke-width="1.5"/>
    <rect x="110" y="664" width="48" height="56" fill="#a0b8a6" rx="2"/>
    <line x1="95" y1="664" x2="165" y2="664" stroke="#a0b8a6" stroke-width="1" stroke-dasharray="3 3"/>

    
    <g fill="#db8129">
      <rect x="180" y="580" width="3" height="140"/>
      <rect x="184" y="580" width="3" height="140"/>
      <rect x="188" y="580" width="3" height="140"/>
      <rect x="192" y="580" width="3" height="140"/>
      <rect x="196" y="580" width="3" height="140"/>
      <rect x="200" y="580" width="3" height="140"/>
      <rect x="204" y="580" width="3" height="140"/>
      <rect x="208" y="580" width="3" height="140"/>
      <rect x="212" y="580" width="3" height="140"/>
      <rect x="216" y="580" width="3" height="140"/>
      <rect x="220" y="580" width="3" height="140"/>
      <rect x="224" y="580" width="3" height="140"/>
      <rect x="228" y="580" width="3" height="140"/>
      <rect x="232" y="580" width="3" height="140"/>
      <rect x="236" y="580" width="3" height="140"/>
      <rect x="240" y="580" width="3" height="140"/>
      <rect x="244" y="580" width="3" height="140"/>
      <rect x="248" y="580" width="3" height="140"/>
      <rect x="252" y="580" width="3" height="140"/>
      <rect x="256" y="580" width="3" height="140"/>
      <rect x="260" y="580" width="3" height="140"/>
      <rect x="264" y="580" width="3" height="140"/>
      <rect x="268" y="580" width="3" height="140"/>
      <rect x="272" y="580" width="3" height="140"/>
      <rect x="276" y="580" width="3" height="140"/>
      <rect x="280" y="580" width="3" height="140"/>
      <rect x="284" y="580" width="3" height="140"/>
      <rect x="288" y="580" width="3" height="140"/>
      <rect x="292" y="580" width="3" height="140"/>
      <rect x="296" y="580" width="3" height="140"/>
      <rect x="300" y="580" width="3" height="140"/>
      <rect x="304" y="580" width="3" height="140"/>
      <rect x="308" y="580" width="3" height="140"/>
      <rect x="312" y="580" width="3" height="140"/>
      <rect x="316" y="580" width="3" height="140"/>
      <rect x="320" y="580" width="3" height="140"/>
      <rect x="324" y="580" width="3" height="140"/>
      <rect x="328" y="580" width="3" height="140"/>
      <rect x="332" y="580" width="3" height="140"/>
      <rect x="336" y="580" width="3" height="140"/>
      <rect x="340" y="580" width="3" height="140"/>
      <rect x="344" y="580" width="3" height="140"/>
      <rect x="348" y="580" width="3" height="140"/>
      <rect x="352" y="580" width="3" height="140"/>
      <rect x="356" y="580" width="3" height="140"/>
      <rect x="360" y="580" width="3" height="140"/>
      <rect x="364" y="580" width="3" height="140"/>
      <rect x="368" y="580" width="3" height="140"/>
      <rect x="372" y="580" width="3" height="140"/>
      <rect x="376" y="580" width="3" height="140"/>
      <rect x="380" y="580" width="3" height="140"/>
      <rect x="384" y="580" width="3" height="140"/>
      <rect x="388" y="580" width="3" height="140"/>
      <rect x="392" y="580" width="3" height="140"/>
      <rect x="396" y="580" width="3" height="140"/>
      <rect x="400" y="580" width="3" height="140"/>
      <rect x="404" y="580" width="3" height="140"/>
      <rect x="408" y="580" width="3" height="140"/>
      <rect x="412" y="580" width="3" height="140"/>
      <rect x="416" y="580" width="3" height="140"/>
    </g>

    
    <text x="75" y="795" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">five-minute averages can</tspan>
      <tspan x="75" dy="36">show 40% while every second</tspan>
      <tspan x="75" dy="36">saturates: look at 1 s data</tspan>
    </text>
  </g>

  
  <g id="trap-2">
    <rect x="570" y="480" width="460" height="610" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 602 540 c 0 -15 15 -18 20 -28" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="595" y1="540" x2="630" y2="540" stroke="#207448" stroke-width="3"/>
    <text x="640" y="534" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Trap 2: the 60% line</text>

    
    <rect x="595" y="565" width="410" height="190" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="625" y1="720" x2="975" y2="720" stroke="#a0b8a6" stroke-width="1.5"/>
    <line x1="625" y1="585" x2="625" y2="720" stroke="#a0b8a6" stroke-width="1.5"/>

    
    <line x1="820" y1="585" x2="820" y2="720" stroke="#207448" stroke-width="2" stroke-dasharray="4 4"/>
    
    
    <path d="M 625 714 Q 780 710 820 685 T 945 590" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>

    
    <text x="595" y="790" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="595" dy="0">above about 60% utilisation</tspan>
      <tspan x="595" dy="34">queueing delays become frequent</tspan>
      <tspan x="595" dy="34">for non-preemptible resources such</tspan>
      <tspan x="595" dy="34">as disks, NICs and links; CPUs</tspan>
      <tspan x="595" dy="34">preempt and degrade more</tspan>
      <tspan x="595" dy="34">gracefully</tspan>
    </text>
  </g>

  
  
  <g id="trap-3">
    <rect x="1090" y="480" width="460" height="610" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1120, 502)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#207448" stroke-width="3"/>
      <line x1="26" y1="26" x2="38" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 12 16 L 20 16 M 16 12 L 16 20" stroke="#207448" stroke-width="2" stroke-linecap="round"/>
    </g>

    
    <text x="1175" y="525" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="1175" dy="0">Trap 3: the first finding</tspan>
      <tspan x="1175" dy="32">is not necessarily the finding</tspan>
    </text>

    
    <rect x="1115" y="580" width="410" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1" stroke-opacity="0.3"/>
    
    <g transform="translate(1140, 615)">
      
      <rect x="10" y="25" width="75" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <line x1="18" y1="50" x2="77" y2="50" stroke="#207448" stroke-width="2.5"/>
      <line x1="18" y1="60" x2="55" y2="60" stroke="#207448" stroke-width="2"/>
      <line x1="25" y1="35" x2="70" y2="65" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>

      
      <path d="M 95 50 L 125 50" stroke="#207448" stroke-width="2.5" fill="none"/>
      <polygon points="128,50 120,45 120,55" fill="#207448"/>

      
      <rect x="135" y="25" width="75" height="50" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="172" cy="50" r="14" fill="none" stroke="#207448" stroke-width="2.5"/>
      <polyline points="172,42 172,50 178,50" fill="none" stroke="#207448" stroke-width="2"/>

      
      <path d="M 220 50 L 250 50" stroke="#207448" stroke-width="2.5" fill="none"/>
      <polygon points="253,50 245,45 245,55" fill="#207448"/>

      
      <rect x="260" y="25" width="85" height="50" rx="6" fill="#207448"/>
      <polyline points="285,50 298,62 325,38" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      
      <path d="M 302 20 C 302 -5, 172 -5, 172 15" stroke="#207448" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
      <polygon points="172,20 167,11 177,11" fill="#207448"/>
    </g>

    
    <text x="1115" y="795" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1115" dy="0">systems can have several</tspan>
      <tspan x="1115" dy="36">issues: fix one, re-measure,</tspan>
      <tspan x="1115" dy="36">iterate</tspan>
    </text>
  </g>

  
  <g id="software-resources">
    <rect x="50" y="1120" width="1500" height="210" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(85, 1180)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
      <polyline points="16,28 22,20 22,36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="40,28 34,20 34,36" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="25" y1="36" x2="31" y2="20" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="170" y="1165" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="170" dy="0">Include software resources: mutex locks, thread pools, file descriptors, process counts, connection</tspan>
      <tspan x="170" dy="38">pools, and cgroup limits; a memory cgroup is saturated by an allocation failure or swapping caused</tspan>
      <tspan x="170" dy="38">by the limit even when the host is fine; CPU quota throttling is saturation</tspan>
    </text>
  </g>

  
  <g id="bottom-takeaway">
    <rect x="50" y="1360" width="1500" height="70" rx="10" fill="#207448"/>
    <text x="800" y="1405" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The method works through resources, not tools</text>
  </g>
</svg>