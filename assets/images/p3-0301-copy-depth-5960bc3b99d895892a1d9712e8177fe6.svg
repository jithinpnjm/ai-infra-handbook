<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Alias, shallow copy and deep copy of a dict of lists</title>
  <desc>Visual infographic explaining alias, shallow copy, and deep copy semantics on a Python dict of lists, including side facts on tuples, slicing, and equality versus identity.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Alias, shallow copy and deep copy of a dict of lists</text>

  
  <rect x="40" y="75" width="1040" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 109)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="0" y1="20" x2="56" y2="20" stroke="#207448" stroke-width="2.5"/>
    <circle cx="16" cy="10" r="3" fill="#207448"/>
    <circle cx="28" cy="10" r="3" fill="#207448"/>
    <rect x="10" y="30" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 26 38 L 46 38 M 41 33 L 46 38 L 41 43" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="150" y="125" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">&apos;original&apos; dict with key rack1</text>
  <text x="150" y="165" font-family="system-ui, sans-serif" font-size="25" fill="#303a36">pointing to a list <tspan font-family="ui-monospace, monospace">[&apos;gpu01&apos;,&apos;gpu02&apos;]</tspan> object</text>

  
  <rect x="40" y="240" width="1040" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 274)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="6" y="8" width="18" height="14" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="32" y="8" width="18" height="14" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="28" cy="42" r="10" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 15 22 L 23 34" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 41 22 L 33 34" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="150" y="285" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">b = a: alias</text>
  <text x="150" y="330" font-family="system-ui, sans-serif" font-size="25" fill="#303a36">two names, one object; <tspan font-family="ui-monospace, monospace">b.append</tspan> changes what <tspan font-family="ui-monospace, monospace">a</tspan> shows.</text>

  
  <rect x="40" y="405" width="1040" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 464)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="6" y="8" width="20" height="20" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="30" y="8" width="20" height="20" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="18" y="36" width="20" height="14" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 16 28 L 24 36" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 40 28 L 32 36" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="150" y="450" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">a.copy() (also a[:], list(a), copy.copy)</text>
  <text x="150" y="495" font-family="system-ui, sans-serif" font-size="25" fill="#303a36">new outer container, same inner element objects;</text>
  <text x="150" y="540" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#db8129"><tspan font-family="ui-monospace, monospace">original[&apos;rack1&apos;].append(&apos;gpu03&apos;)</tspan> shows up in the copy too</text>

  
  <rect x="40" y="620" width="1040" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 679)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <rect x="6" y="8" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="6" y="32" width="18" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 15 26 L 15 32" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="32" y="8" width="18" height="18" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <rect x="32" y="32" width="18" height="16" rx="3" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 41 26 L 41 32" fill="none" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="150" y="665" font-family="ui-monospace, monospace" font-size="30" font-weight="bold" fill="#207448">copy.deepcopy(a)</text>
  <text x="150" y="710" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">recursively copies nested mutable structures, cycles included;</text>
  <text x="150" y="750" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">the inner list is a new object and does not change; costs time.</text>

  
  <rect x="1120" y="75" width="440" height="165" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1148, 129)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="18" cy="38" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="38" cy="38" r="6" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 22 34 L 38 18 M 34 34 L 18 18" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="1230" y="145" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">slicing returns</text>
  <text x="1230" y="185" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">shallow copies</text>

  
  <rect x="1120" y="280" width="440" height="515" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1148, 305)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 16 12 C 10 20, 10 36, 16 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <path d="M 40 12 C 46 20, 46 36, 40 44" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <rect x="22" y="26" width="12" height="10" rx="2" fill="none" stroke="#207448" stroke-width="2"/>
    <path d="M 25 26 L 25 21 C 25 18, 31 18, 31 21 L 31 26" fill="none" stroke="#207448" stroke-width="2"/>
  </g>
  <text x="1230" y="332" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">Tuples contain</text>
  <text x="1230" y="367" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">references:</text>
  <text x="1150" y="445" font-family="system-ui, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, monospace">t = ([1], 2)</tspan> cannot change</text>
  <text x="1150" y="495" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">which objects it holds, yet</text>
  <text x="1150" y="545" font-family="system-ui, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, monospace">t[0].append(5)</tspan> mutates</text>
  <text x="1150" y="595" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">the list inside; a tuple is</text>
  <text x="1150" y="645" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">hashable only if all its</text>
  <text x="1150" y="695" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">elements are</text>

  
  <rect x="40" y="835" width="1520" height="175" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <g transform="translate(64, 894)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="28" y1="12" x2="28" y2="44" stroke="#207448" stroke-width="3"/>
    <line x1="14" y1="20" x2="42" y2="20" stroke="#207448" stroke-width="3"/>
    <path d="M 14 20 L 8 32 L 20 32 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M 42 20 L 36 32 L 48 32 Z" fill="none" stroke="#207448" stroke-width="2.5"/>
  </g>
  <text x="150" y="880" font-family="system-ui, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">==</tspan> compares values by calling <tspan font-family="ui-monospace, monospace">__eq__</tspan>, <tspan font-family="ui-monospace, monospace" font-weight="bold" fill="#207448">is</tspan> compares identity; use <tspan font-family="ui-monospace, monospace">is</tspan> only for singletons such as <tspan font-family="ui-monospace, monospace">x is None</tspan>;</text>
  <text x="150" y="925" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">small ints (about -5 to 256) and many short strings are interned so <tspan font-family="ui-monospace, monospace">is</tspan> sometimes appears to work;</text>
  <text x="150" y="970" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448">never rely on it</text>

  
  <rect x="40" y="1050" width="1520" height="90" rx="12" fill="#207448"/>
  <g transform="translate(64, 1067)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M 20 28 C 14 28, 12 24, 12 20 C 12 16, 16 14, 22 14 L 28 14 C 34 14, 38 18, 38 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36 28 C 42 28, 44 32, 44 36 C 44 40, 40 42, 34 42 L 28 42 C 22 42, 18 38, 18 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="800" y="1106" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Assignment never copies objects, it binds names to objects</text>
</svg>