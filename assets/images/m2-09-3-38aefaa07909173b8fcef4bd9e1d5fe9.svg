    <text x="1310" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle"><tspan font-family="ui-monospace, monospace">conntrack</tspan> drop</text>
    <text x="1310" y="985" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">(table full, timeouts),</text>
    <text x="1310" y="1025" font-family="ui-monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">rp_filter, FORWARD rules</text>
