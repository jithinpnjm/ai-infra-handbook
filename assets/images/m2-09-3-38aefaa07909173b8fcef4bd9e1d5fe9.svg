    <text x="290" y="985" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">SNAT/masquerade rule</text>
    <text x="290" y="1035" font-family="ui-monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">(wrong -o, -s); rule order</text>
  </g>

  
  <g id="node-D2">
    <rect x="570" y="820" width="460" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(772, 845)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
