      <line x1="8" y1="46" x2="48" y2="46" stroke-width="3" />
      <line x1="28" y1="36" x2="28" y2="44" stroke-width="3" />
    </g>
    <text x="800" y="945" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">Upstream routing/filtering;</text>
    <text x="800" y="985" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">asymmetric path;</text>
    <text x="800" y="1025" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">wrong outside IP</text>
  </g>

  
  <g id="node-D3">
    <rect x="1080" y="820" width="460" height="320" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1282, 845)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
