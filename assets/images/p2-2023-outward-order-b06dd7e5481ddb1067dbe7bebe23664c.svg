  </text>
  
  <rect x="1310" y="442" width="240" height="34" rx="7" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1430" y="466" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl logs</text>
  
  <rect x="1170" y="481" width="380" height="34" rx="7" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1360" y="505" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl logs --previous</text>

  
  <rect x="400" y="542" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="587" r="24" fill="#207448"/>
  <text x="444" y="596" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="488" y="565" width="44" height="44" rx="6"/>
    <polyline points="496,581 504,587 496,593"/>
    <line x1="508" y1="593" x2="520" y2="593"/>
  </g>
  <text x="560" y="581" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="560" dy="0">Exec into the container,</tspan>
    <tspan x="560" dy="32">only if the pod looks fine</tspan>
  </text>
  
  <rect x="1330" y="565" width="220" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1440" y="595" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl exec</text>

  
  <rect x="400" y="650" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="695" r="24" fill="#207448"/>
  <text x="444" y="704" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">6</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="488" y="674" width="44" height="42" rx="6"/>
    <line x1="488" y1="688" x2="532" y2="688"/>
    <line x1="488" y1="702" x2="532" y2="702"/>
    <circle cx="496" cy="681" r="1.5" fill="#207448"/>
    <circle cx="496" cy="695" r="1.5" fill="#207448"/>
    <circle cx="496" cy="709" r="1.5" fill="#207448"/>
  </g>
  <text x="560" y="705" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node: Conditions, Taints and Lease</text>
  
  <rect x="1190" y="673" width="360" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1370" y="703" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl describe node</text>

  
  <rect x="400" y="758" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="803" r="24" fill="#207448"/>
  <text x="444" y="812" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">7</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="490" y="781" width="36" height="44" rx="5"/>
    <line x1="498" y1="793" x2="518" y2="793"/>
    <line x1="498" y1="803" x2="518" y2="803"/>
    <line x1="498" y1="813" x2="512" y2="813"/>
    <polyline points="516,781 516,793 522,789 526,793 526,781"/>
  </g>
  <text x="560" y="813" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Kubelet journal</text>
  
  <rect x="1170" y="781" width="380" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1360" y="811" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">journalctl -xeu kubelet</text>

  
  <rect x="400" y="866" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="911" r="24" fill="#207448"/>
  <text x="444" y="920" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">8</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 510 889 L 528 898 L 528 920 L 510 930 L 492 920 L 492 898 Z"/>
    <line x1="510" y1="910" x2="510" y2="930"/>
    <line x1="510" y1="910" x2="528" y2="898"/>
    <line x1="510" y1="910" x2="492" y2="898"/>
  </g>
  <text x="560" y="921" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Container runtime</text>
  
  <rect x="1390" y="889" width="160" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1470" y="919" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">crictl</text>

  
  <rect x="400" y="974" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="1019" r="24" fill="#207448"/>
  <text x="444" y="1028" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">9</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="510" cy="999" r="6"/>
    <circle cx="496" cy="1031" r="6"/>
    <circle cx="524" cy="1031" r="6"/>
    <line x1="506" y1="1005" x2="500" y2="1025"/>
    <line x1="514" y1="1005" x2="520" y2="1025"/>
    <line x1="502" y1="1031" x2="518" y2="1031"/>
  </g>
  <text x="560" y="1029" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Network plugin, then DNS</text>

  
  <rect x="50" y="1095" width="1500" height="70" rx="14" fill="#207448"/>
  <text x="800" y="1139" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Each seam is a handoff between two teams, so ask who holds the object now.</text>
</svg>