  <text x="1395" y="379" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl get events</text>

  
  <rect x="400" y="434" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="479" r="24" fill="#207448"/>
  <text x="444" y="488" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="490" y="456" width="34" height="44" rx="4"/>
    <line x1="498" y1="467" x2="516" y2="467"/>
    <line x1="498" y1="477" x2="516" y2="477"/>
    <line x1="498" y1="487" x2="510" y2="487"/>
  </g>
  <text x="560" y="473" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="560" dy="0">Logs of the running container</tspan>
