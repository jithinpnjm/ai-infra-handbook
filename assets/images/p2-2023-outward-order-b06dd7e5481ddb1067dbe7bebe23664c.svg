  <text x="1375" y="271" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl describe pod</text>

  
  <rect x="400" y="326" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="371" r="24" fill="#207448"/>
  <text x="444" y="380" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
