<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Debug from the object outward, cheapest question first</title>
  <desc>A troubleshooting ladder of nine steps from cluster API checks to node diagnostics, cheapest question first.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#303a36">Debug from the object outward, cheapest question first</text>

  
  
  <path d="M 390 115 L 370 115 A 14 14 0 0 0 356 129 L 356 303 A 14 14 0 0 1 342 317 A 14 14 0 0 1 356 331 L 356 505 A 14 14 0 0 0 370 519 L 390 519" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="35" y="272" width="285" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="177" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="177" dy="0">Cheap:</tspan>
    <tspan x="177" dy="32">the cluster API</tspan>
  </text>

  
  
  <path d="M 390 655 L 370 655 A 14 14 0 0 0 356 669 L 356 843 A 14 14 0 0 1 342 857 A 14 14 0 0 1 356 871 L 356 1045 A 14 14 0 0 0 370 1059 L 390 1059" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>

  
  <rect x="35" y="812" width="285" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <text x="177" y="850" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448">
    <tspan x="177" dy="0">Expensive:</tspan>
    <tspan x="177" dy="32">the node</tspan>
  </text>

  
  <line x1="444" y1="155" x2="444" y2="1019" stroke="#207448" stroke-width="4" opacity="0.25"/>

  
  <rect x="400" y="110" width="1170" height="90" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="444" cy="155" r="24" fill="#207448"/>
  <text x="444" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  
  <g stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="488" y="133" width="44" height="44" rx="6"/>
    <line x1="488" y1="147" x2="532" y2="147"/>
    <polyline points="502,162 509,168 522,154"/>
  </g>
  <text x="560" y="165" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">STATUS column of the pod</text>
  
  <rect x="1270" y="133" width="280" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
  <text x="1410" y="163" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">kubectl get pod</text>

  
  <rect x="400" y="218" width="1170" height="90" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4"/>
  <circle cx="444" cy="263" r="24" fill="#db8129"/>
  <text x="444" y="272" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  
  <g stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="488" y="241" width="44" height="44" rx="6"/>
    <line x1="488" y1="255" x2="532" y2="255"/>
    <line x1="488" y1="267" x2="532" y2="267"/>
    <line x1="504" y1="274" x2="504" y2="279"/>
