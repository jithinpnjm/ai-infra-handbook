<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How to get the tool onto the host: six channels compared</title>
  <desc>Visual comparison of six distribution channels for Python CLI tools, including trade-offs, release pipeline hygiene, and pyproject packaging metadata.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="68" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How to get the tool onto the host: six channels compared</text>

  
  <rect x="40" y="102" width="500" height="42" rx="6" fill="#e8f1ea"/>
  <text x="60" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Approach</text>

  <rect x="556" y="102" width="420" height="42" rx="6" fill="#e8f1ea"/>
  <text x="576" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Good for</text>

  <rect x="992" y="102" width="568" height="42" rx="6" fill="#e8f1ea"/>
  <text x="1012" y="132" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Trade-off</text>

  
  <g>
    <rect x="40" y="152" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <circle cx="82" cy="198" r="22" fill="none" stroke="#207448" stroke-width="3.5"/>
    <circle cx="82" cy="198" r="8" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 82 176 L 82 220 M 60 198 L 104 198" stroke="#207448" stroke-width="3.5"/>
    <text x="126" y="189" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">Wheel on an internal index</tspan>
      <tspan x="126" dy="28" font-family="monospace">plus pipx install fleetctl</tspan>
    </text>

    <rect x="556" y="152" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="206" font-family="sans-serif" font-size="24" fill="#303a36">operator laptops, jump hosts</text>

    <rect x="992" y="152" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="189" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1012" dy="0">isolated environment per tool,</tspan>
      <tspan x="1012" dy="28">easy upgrades; pin the Python version</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="253" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <path d="M 86 178 L 72 200 L 84 200 L 78 218 L 94 194 L 82 194 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="126" y="307" font-family="monospace" font-size="24" fill="#303a36">uv tool install or uvx</text>

    <rect x="556" y="253" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="307" font-family="sans-serif" font-size="24" fill="#303a36">fast installs, reproducible</text>

    <rect x="992" y="253" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="307" font-family="sans-serif" font-size="24" fill="#303a36">lockfile support</text>
  </g>

  
  <g>
    <rect x="40" y="354" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="64" y="378" width="36" height="44" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 76 378 L 76 404 M 88 378 L 88 404" stroke="#207448" stroke-width="3.5"/>
    <rect x="74" y="404" width="16" height="12" rx="2" fill="none" stroke="#207448" stroke-width="3"/>
    <text x="126" y="391" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">Zipapp (shiv, pex,</tspan>
      <tspan x="126" dy="28" font-family="monospace">python -m zipapp)</tspan>
    </text>

    <rect x="556" y="354" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="391" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="576" dy="0">single-file deployment to hosts</tspan>
      <tspan x="576" dy="28">with matching Python</tspan>
    </text>

    <rect x="992" y="354" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="391" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1012" dy="0">needs a compatible interpreter</tspan>
      <tspan x="1012" dy="28">and wheels for the platform</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="455" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="62" y="481" width="40" height="40" rx="3" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="75" y1="481" x2="75" y2="521" stroke="#207448" stroke-width="3"/>
    <line x1="88" y1="481" x2="88" y2="521" stroke="#207448" stroke-width="3"/>
    <text x="126" y="509" font-family="sans-serif" font-size="24" fill="#303a36">Container image</text>

    <rect x="556" y="455" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="492" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="576" dy="0">CI, Kubernetes jobs,</tspan>
      <tspan x="576" dy="28">consistent runtime</tspan>
    </text>

    <rect x="992" y="455" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="492" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1012" dy="0">larger; mount kubeconfig</tspan>
      <tspan x="1012" dy="28">and credentials explicitly</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="556" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="64" y="582" width="36" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <line x1="56" y1="592" x2="64" y2="592" stroke="#207448" stroke-width="3"/>
    <line x1="56" y1="612" x2="64" y2="612" stroke="#207448" stroke-width="3"/>
    <line x1="100" y1="592" x2="108" y2="592" stroke="#207448" stroke-width="3"/>
    <line x1="100" y1="612" x2="108" y2="612" stroke="#207448" stroke-width="3"/>
    <circle cx="82" cy="602" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <text x="126" y="593" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">PyInstaller or Nuitka</tspan>
      <tspan x="126" dy="28">single binary</tspan>
    </text>

    <rect x="556" y="556" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="610" font-family="sans-serif" font-size="24" fill="#303a36">hosts without Python, air-gapped</text>

    <rect x="992" y="556" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="593" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1012" dy="0">platform-specific builds,</tspan>
      <tspan x="1012" dy="28">larger, slower startup</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="657" width="500" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    
    <rect x="62" y="683" width="40" height="40" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 62 697 L 102 697 M 82 697 L 82 723" stroke="#207448" stroke-width="3.5"/>
    <text x="126" y="694" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="126" dy="0">OS packages</tspan>
      <tspan x="126" dy="28">(deb or rpm via fpm)</tspan>
    </text>

    <rect x="556" y="657" width="420" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="576" y="711" font-family="sans-serif" font-size="24" fill="#303a36">fleet-wide config-managed rollout</text>

    <rect x="992" y="657" width="568" height="92" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
    <text x="1012" y="694" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1012" dy="0">fits Ansible and Foreman;</tspan>
      <tspan x="1012" dy="28">versioned and auditable</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="765" width="1520" height="180" rx="8" fill="#fff9f3" stroke="#db8129" stroke-width="2.5"/>
    <rect x="40" y="765" width="10" height="180" rx="5" fill="#db8129"/>
    
    <path d="M 82 828 L 104 840 L 104 864 Q 104 882 82 892 Q 60 882 60 864 L 60 840 Z" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 72 860 L 79 867 L 93 853" fill="none" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="802" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">semantic versioning and a changelog; <tspan font-family="monospace">--version</tspan> prints the git SHA;</tspan>
      <tspan x="130" dy="30">hashed lock files via <tspan font-family="monospace">uv lock</tspan> or <tspan font-family="monospace">pip-compile --generate-hashes</tspan>;</tspan>
      <tspan x="130" dy="30"><tspan font-family="monospace">pip-audit</tspan>, an SBOM, signed artefacts, trusted publishing from CI; shell completions;</tspan>
      <tspan x="130" dy="30">man pages or <tspan font-family="monospace">--help</tspan> documenting exit codes;</tspan>
      <tspan x="130" dy="30">an upgrade check that warns when older than the server's minimum version</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="960" width="1520" height="135" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <rect x="40" y="960" width="10" height="135" rx="5" fill="#207448"/>
    
    <rect x="62" y="1005" width="40" height="46" rx="4" fill="none" stroke="#207448" stroke-width="3.5"/>
    <path d="M 75 1022 L 70 1028 L 75 1034 M 89 1022 L 94 1028 L 89 1034" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="999" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="130" dy="0">pyproject.toml: [project] name fleetctl, version 1.4.0, requires-python &gt;=3.10,</tspan>
      <tspan x="130" dy="32">dependencies click, httpx, tenacity, rich; [project.scripts] fleetctl = fleetctl.cli:cli</tspan>
      <tspan x="130" dy="32">creates the executable on install; build-backend hatchling.build</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="1110" width="1520" height="65" rx="8" fill="#207448"/>
    
    <circle cx="82" cy="1142" r="18" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M 73 1142 L 79 1148 L 92 1135" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="1151" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The right channel depends on where the tool will run</text>
  </g>
</svg>