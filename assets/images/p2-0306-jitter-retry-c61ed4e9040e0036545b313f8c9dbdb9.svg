  <text x="600" y="708" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448">delay = random.uniform(0, min(cap, base * 2 ** attempt))</text>

  
  
