<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Fixed retry intervals sync the clients into a storm; full jitter spreads them out</title>
  <desc>Infographic comparing fixed backoff retry storm versus exponential backoff with full jitter spreading client retries.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Fixed retry intervals sync the clients into a storm;<tspan x="800" dy="55">full jitter spreads them out</tspan></text>

  
  <rect x="50" y="160" width="1500" height="405" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="3" />

  
  <circle cx="104" cy="200" r="22" stroke="#207448" stroke-width="4" fill="none" />
  <path d="M104,186 L104,200 L116,200" stroke="#207448" stroke-width="4" stroke-linecap="round" fill="none" />
  <text x="150" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#303a36">Fixed backoff: retries line up</text>

  
  <rect x="200" y="232" width="750" height="52" rx="8" fill="#fdf8f3" stroke="#db8129" stroke-width="2" />
  <text x="575" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">many clients hit the recovering API together</text>

  
  <rect x="1240" y="325" width="230" height="74" rx="10" fill="#fdf2f2" stroke="#d9383a" stroke-width="3" />
  <polygon points="1275,344 1258,376 1292,376" fill="none" stroke="#d9383a" stroke-width="3" stroke-linejoin="round" />
  <line x1="1275" y1="353" x2="1275" y2="363" stroke="#d9383a" stroke-width="3" stroke-linecap="round" />
  <circle cx="1275" cy="370" r="1.5" fill="#d9383a" />
  <text x="1360" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#d9383a">retry storm</text>

  
  <line x1="120" y1="460" x2="1460" y2="460" stroke="#303a36" stroke-width="3" />
  <polygon points="1460,453 1478,460 1460,467" fill="#303a36" />

  
