<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Debugging a Service: resolve, endpoints, rules, datapath, backend</title>
  <desc>Debugging a Service: resolve, endpoints, rules, datapath, backend</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="62" font-size="48" font-weight="bold" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
    <tspan x="40" dy="0">Debugging a Service:</tspan>
    <tspan x="40" dy="54">resolve, endpoints, rules, datapath, backend</tspan>
  </text>

  

  
  <g id="rung-1">
    <rect x="40" y="160" width="880" height="164" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="66" cy="204" r="24" fill="#207448"/>
    <text x="66" y="212" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1</text>
    
    <g transform="translate(102, 178)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="48" height="48" rx="8"/>
      <circle cx="24" cy="16" r="4"/>
      <circle cx="14" cy="34" r="3.5"/>
      <circle cx="34" cy="34" r="3.5"/>
      <line x1="24" y1="20" x2="14" y2="30"/>
      <line x1="24" y1="20" x2="34" y2="30"/>
    </g>
    <text x="175" y="198" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="175" dy="0" font-size="30" font-weight="bold">Endpoints: </tspan>
      <tspan x="175" dy="36" font-family="monospace">kubectl get endpointslices </tspan>
      <tspan x="175" dy="32" font-family="monospace">-l kubernetes.io/service-name=vllm; </tspan>
      <tspan x="175" dy="34">Endpoints none means selector or readiness problem</tspan>
    </text>
  </g>

  
  <line x1="66" y1="324" x2="66" y2="364" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="rung-2">
    <rect x="40" y="364" width="880" height="164" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="66" cy="408" r="24" fill="#207448"/>
    <text x="66" y="416" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">2</text>
    
    <g transform="translate(102, 382)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="48" height="44" rx="6"/>
      <line x1="0" y1="14" x2="48" y2="14"/>
      <polyline points="10,24 16,30 10,36"/>
      <line x1="20" y1="36" x2="34" y2="36"/>
    </g>
    <text x="175" y="402" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="175" dy="0" font-size="30" font-weight="bold">Resolve from a client pod (netshoot): </tspan>
      <tspan x="175" dy="44" font-family="monospace">nslookup vllm; </tspan>
      <tspan x="175" dy="40" font-family="monospace">curl vllm.serving.svc.cluster.local/health</tspan>
    </text>
  </g>

  
  <line x1="66" y1="528" x2="66" y2="568" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="rung-3">
    <rect x="40" y="568" width="880" height="164" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    <circle cx="66" cy="612" r="24" fill="#db8129"/>
    <text x="66" y="620" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
    
    <g transform="translate(102, 586)" stroke="#db8129" stroke-width="3" fill="none">
      <path d="M 24 4 L 44 14 L 24 24 L 4 14 Z"/>
      <path d="M 4 23 L 24 33 L 44 23"/>
      <path d="M 4 33 L 24 43 L 44 33"/>
    </g>
    <text x="175" y="606" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="175" dy="0" font-size="30" font-weight="bold">Bypass layers with three curls: </tspan>
      <tspan x="175" dy="36" font-family="monospace">by DNS name, by ClusterIP, by PodIP; </tspan>
      <tspan x="175" dy="34">works via PodIP but not ClusterIP means </tspan>
      <tspan x="175" dy="32">kube-proxy rules, conntrack or wrong targetPort</tspan>
    </text>
  </g>

  
  <line x1="66" y1="732" x2="66" y2="772" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="rung-4">
    <rect x="40" y="772" width="880" height="164" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="66" cy="816" r="24" fill="#207448"/>
    <text x="66" y="824" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4</text>
    
    <g transform="translate(102, 790)" stroke="#207448" stroke-width="3" fill="none">
      <path d="M 24 4 L 44 10 L 44 26 C 44 38 24 44 24 44 C 24 44 4 38 4 26 L 4 10 Z"/>
      <line x1="14" y1="24" x2="34" y2="24"/>
      <line x1="24" y1="16" x2="24" y2="32"/>
    </g>
    <text x="175" y="810" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="175" dy="0" font-size="30" font-weight="bold">Rules on the node: </tspan>
      <tspan x="175" dy="36" font-family="monospace">iptables-save -t nat | grep KUBE-SVC, </tspan>
      <tspan x="175" dy="32" font-family="monospace">nft list ruleset, ipvsadm -Ln, </tspan>
      <tspan x="175" dy="32" font-family="monospace">conntrack -L -d ClusterIP, kube-proxy logs</tspan>
    </text>
  </g>

  
  <line x1="66" y1="936" x2="66" y2="976" stroke="#207448" stroke-width="3" marker-end="url(#arrow)"/>

  
  <g id="rung-5">
    <rect x="40" y="976" width="880" height="164" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="66" cy="1020" r="24" fill="#207448"/>
    <text x="66" y="1028" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">5</text>
    
    <g transform="translate(102, 994)" stroke="#207448" stroke-width="3" fill="none">
      <rect x="0" y="0" width="48" height="44" rx="6"/>
      <polyline points="6,24 14,24 20,12 28,36 34,24 42,24"/>
    </g>
    <text x="175" y="1014" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
      <tspan x="175" dy="0" font-size="30" font-weight="bold">Packets: </tspan>
      <tspan x="175" dy="38" font-family="monospace">tcpdump -ni any host ClusterIP or host PodIP; </tspan>
      <tspan x="175" dy="40">ClusterIP on the pod veth, pod IP after DNAT</tspan>
    </text>
  </g>

  
  <g id="symptom-container">
    <rect x="960" y="160" width="600" height="980" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(1106, 182)" stroke="#207448" stroke-width="2.5" fill="none">
      <rect x="0" y="0" width="30" height="26" rx="4"/>
      <line x1="0" y1="12" x2="30" y2="12"/>
      <line x1="15" y1="0" x2="15" y2="26"/>
    </g>
    <text x="1275" y="204" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">symptom table</text>

    
    <g id="symptom-1">
      <rect x="984" y="228" width="552" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(1472, 246)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="20" cy="20" r="18"/>
        <line x1="8" y1="8" x2="32" y2="32"/>
        <line x1="32" y1="8" x2="8" y2="32"/>
      </g>
      <text x="1006" y="266" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
        <tspan x="1006" dy="0" font-size="30" font-weight="bold">connection refused </tspan>
        <tspan x="1006" dy="36" font-size="30" font-weight="bold">immediately = </tspan>
        <tspan x="1006" dy="38">no ready endpoints or </tspan>
        <tspan x="1006" dy="32">app not on targetPort</tspan>
      </text>
    </g>

    
    <g id="symptom-2">
      <rect x="984" y="456" width="552" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(1472, 474)" stroke="#207448" stroke-width="3" fill="none">
        <circle cx="20" cy="20" r="18"/>
        <polyline points="20,8 20,20 28,20"/>
      </g>
      <text x="1006" y="494" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
        <tspan x="1006" dy="0" font-size="30" font-weight="bold">timeout from some nodes only = </tspan>
        <tspan x="1006" dy="38">CNI, NetworkPolicy, </tspan>
        <tspan x="1006" dy="32">kube-proxy not running there, </tspan>
        <tspan x="1006" dy="32">br_netfilter off</tspan>
      </text>
    </g>

    
    <g id="symptom-3">
      <rect x="984" y="684" width="552" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(1472, 702)" stroke="#207448" stroke-width="3" fill="none">
        <rect x="0" y="4" width="40" height="34" rx="6"/>
        <circle cx="12" cy="21" r="3" fill="#207448"/>
        <path d="M 22 13 L 30 21 L 22 29"/>
      </g>
      <text x="1006" y="744" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
        <tspan x="1006" dy="0" font-size="30" font-weight="bold">client IP is node IP = </tspan>
        <tspan x="1006" dy="48">externalTrafficPolicy Cluster SNAT</tspan>
      </text>
    </g>

    
    <g id="symptom-4">
      <rect x="984" y="912" width="552" height="200" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      
      <g transform="translate(1472, 930)" stroke="#207448" stroke-width="3" fill="none">
        <line x1="6" y1="36" x2="6" y2="22" stroke-width="4"/>
        <line x1="15" y1="36" x2="15" y2="8" stroke-width="4"/>
        <line x1="24" y1="36" x2="24" y2="28" stroke-width="4"/>
        <line x1="33" y1="36" x2="33" y2="14" stroke-width="4"/>
        <line x1="2" y1="40" x2="38" y2="40"/>
      </g>
      <text x="1006" y="972" font-size="24" fill="#303a36" font-family="system-ui, -apple-system, sans-serif">
        <tspan x="1006" dy="0" font-size="30" font-weight="bold">uneven gRPC load = </tspan>
        <tspan x="1006" dy="48">L4 on long-lived connections</tspan>
      </text>
    </g>
  </g>
</svg>