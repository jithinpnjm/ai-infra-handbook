<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350">
  <title>Absolute versus Relative Path Resolution from Working Directory</title>
  <desc>Tree topology diagram showing file system hierarchy, absolute path traversal from root, and relative path navigation radiating from the current working directory.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#db8129" />
    </marker>
    <marker id="arrow-tree" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 11 6 L 1 10 z" fill="#527063" />
    </marker>
    
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14281e" flood-opacity="0.08" />
    </filter>
  </defs>

  
  <rect width="1600" height="1350" fill="#f5f8f5" />

  
  <g transform="translate(80, 48)">
    <text x="720" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="bold" fill="#303a36" text-anchor="middle">
      Absolute versus Relative Path Resolution from Working Directory
    </text>
  </g>

  
  
  <path d="M 720 230 L 720 270 L 320 270 L 320 310" fill="none" stroke="#527063" stroke-width="3" stroke-dasharray="6 6" />
  
  
  <path d="M 880 230 L 880 270 L 1260 270 L 1260 310" fill="none" stroke="#527063" stroke-width="3" stroke-dasharray="6 6" />

  
  <path d="M 320 380 L 320 440" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 320 510 L 320 570" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <path d="M 320 640 L 320 700" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <path d="M 1200 380 L 1200 420 L 880 420 L 880 470" fill="none" stroke="#527063" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow-tree)" />
  <path d="M 1320 380 L 1320 420 L 1320 450" fill="none" stroke="#527063" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow-tree)" />

  
  <g transform="translate(620, 150)" filter="url(#card-shadow)">
    <rect width="360" height="80" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 36 28 L 56 28 L 66 38 L 86 38 A 4 4 0 0 1 90 42 L 90 60 A 4 4 0 0 1 86 64 L 36 64 A 4 4 0 0 1 32 60 L 32 32 A 4 4 0 0 1 36 28 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="30px" font-weight="bold" fill="#303a36">
      Root directory '/'
    </text>
  </g>

  
  
  <rect x="70" y="270" width="500" height="820" rx="20" fill="#f0f5f1" stroke="#bdd6c5" stroke-width="2" />
  <text x="320" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle" letter-spacing="1">
    ABSOLUTE PATH TRAVERSAL
  </text>

  
  <g transform="translate(130, 320)">
    <rect width="380" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="88" y="41" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36">/home</text>
  </g>

  
  <g transform="translate(130, 450)">
    <rect width="380" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="88" y="41" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36">/home/alice</text>
  </g>

  
  <g transform="translate(130, 580)">
    <rect width="380" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="88" y="41" font-family="ui-monospace, monospace" font-size="26px" font-weight="bold" fill="#303a36">/home/alice/project</text>
  </g>

  
  <g transform="translate(130, 710)" filter="url(#card-shadow)">
    <rect width="380" height="64" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <path d="M 32 16 L 54 16 L 66 28 L 66 50 A 3 3 0 0 1 63 53 L 32 53 A 3 3 0 0 1 29 50 L 29 19 A 3 3 0 0 1 32 16 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <polyline points="54,16 54,28 66,28" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="88" y="43" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#207448">train.py</text>
  </g>

  
  <path d="M 320 774 L 320 830" fill="none" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(90, 830)">
    <rect width="460" height="230" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <text x="230" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      Absolute Path:
    </text>
    <text x="230" y="90" font-family="ui-monospace, monospace" font-size="25px" font-weight="bold" fill="#303a36" text-anchor="middle">
      /home/alice/project/train.py
    </text>
    <rect x="24" y="118" width="412" height="88" rx="8" fill="#f5f8f5" />
    <text x="230" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      (starts with /, identical target
    </text>
    <text x="230" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      from any process)
    </text>
  </g>

  
  
  <rect x="610" y="270" width="930" height="820" rx="20" fill="#f0f5f1" stroke="#bdd6c5" stroke-width="2" />
  <text x="1075" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle" letter-spacing="1">
    RELATIVE PATH TRAVERSAL FROM WORKING DIRECTORY
  </text>

  
  <g transform="translate(1140, 320)">
    <rect width="240" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="88" y="41" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36">/usr</text>
  </g>

  
  <g transform="translate(760, 480)">
    <rect width="240" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 24 18 L 40 18 L 48 26 L 64 26 A 3 3 0 0 1 67 29 L 67 44 A 3 3 0 0 1 64 47 L 24 47 A 3 3 0 0 1 21 44 L 21 21 A 3 3 0 0 1 24 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="80" y="41" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36">/usr/bin</text>
  </g>

  
  
  <g transform="translate(1080, 450)" filter="url(#card-shadow)">
    
    <rect width="420" height="150" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    
    <rect x="20" y="16" width="380" height="42" rx="21" fill="#fff5ec" stroke="#db8129" stroke-width="2" />
    
    <circle cx="44" cy="37" r="7" fill="#db8129" />
    <path d="M 44 44 L 44 52" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <text x="64" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#db8129">
      Current Working Directory (pwd)
    </text>

    
    <g transform="translate(20, 72)">
      <rect width="380" height="60" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
      <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
      <text x="88" y="41" font-family="ui-monospace, monospace" font-size="30px" font-weight="bold" fill="#207448">/usr/lib</text>
    </g>
  </g>

  
  <g transform="translate(1160, 930)">
    <rect width="280" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <path d="M 28 18 L 44 18 L 52 26 L 68 26 A 3 3 0 0 1 71 29 L 71 44 A 3 3 0 0 1 68 47 L 28 47 A 3 3 0 0 1 25 44 L 25 21 A 3 3 0 0 1 28 18 Z" fill="none" stroke="#207448" stroke-width="2.5" />
    <text x="84" y="43" font-family="ui-monospace, monospace" font-size="28px" font-weight="bold" fill="#303a36">/usr/lib/X11</text>
  </g>

  

  
  
  <path d="M 1500 500 C 1560 500 1560 570 1505 570" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <g transform="translate(1090, 620)">
    <rect width="430" height="72" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="215" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      (1) self-reference '.' staying at '/usr/lib'
    </text>
  </g>

  
  <path d="M 1300 696 L 1300 922" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <g transform="translate(1030, 770)">
    <rect width="490" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="245" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      (2) downward traversal './X11' or 'X11'
    </text>
    <text x="245" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      reaching '/usr/lib/X11'
    </text>
  </g>

  
  
  <path d="M 1240 450 L 1240 388" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow-green)" />
  <g transform="translate(630, 340)">
    <rect width="480" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="240" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      (3) upward traversal '..'
    </text>
    <text x="240" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      moving up to parent '/usr'
    </text>
  </g>

  
  
  <path d="M 1150 450 L 1150 405 L 880 405 L 880 472" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="6 3" marker-end="url(#arrow-green)" />
  <g transform="translate(630, 680)">
    <rect width="460" height="148" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="230" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#207448" text-anchor="middle">
      (4) composite traversal '../bin'
    </text>
    <text x="230" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      moving up to '..' (/usr)
    </text>
    <text x="230" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36" text-anchor="middle">
      then down to 'bin' (/usr/bin)
    </text>
  </g>

  
  <g transform="translate(70, 1140)" filter="url(#card-shadow)">
    <rect width="1460" height="130" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="60" cy="65" r="24" fill="#207448" />
    <text x="60" y="75" font-family="ui-monospace, monospace" font-size="30px" font-weight="bold" fill="#ffffff" text-anchor="middle">~</text>
    
    <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
      ~ shorthand expands in shell to user home directory (e.g. /home/alice),
    </text>
    <text x="110" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
      never seen directly by kernel.
    </text>
  </g>
</svg>