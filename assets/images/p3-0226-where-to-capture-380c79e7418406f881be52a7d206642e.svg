<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Choosing a capture point: the closest point that sees what you need</title>
  <desc>A decision tree mapping diagnostic questions to the closest capture point, covering server and client interfaces, container namespaces, physical wire mirrors, DPUs, and kernel drop tracepoints.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Choosing a capture point: </tspan>
    <tspan x="800" dy="54">the closest point that sees what you need</tspan>
  </text>

  
  <rect x="360" y="122" width="880" height="58" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(388, 131)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16" />
    <path d="M 15 15 C 15 11, 25 11, 25 16 C 25 20, 20 20, 20 24" />
    <circle cx="20" cy="29" r="1.5" fill="#207448" />
  </g>
  <text x="450" y="161" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Which packets must you see?</text>

  
  
  <rect x="40" y="198" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 221)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="6" width="36" height="14" rx="2" />
    <rect x="4" y="24" width="36" height="14" rx="2" />
    <circle cx="12" cy="13" r="2" fill="#207448" />
    <circle cx="12" cy="31" r="2" fill="#207448" />
    <line x1="26" y1="13" x2="32" y2="13" />
    <line x1="26" y1="31" x2="32" y2="31" />
  </g>
  <text x="120" y="236" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">Did the server receive </tspan>
    <tspan x="120" dy="34">the request?</tspan>
  </text>

  
  <line x1="680" y1="244" x2="730" y2="244" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="198" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 221)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="36" height="28" rx="4" />
    <line x1="12" y1="36" x2="12" y2="42" />
    <line x1="22" y1="36" x2="22" y2="42" />
    <line x1="32" y1="36" x2="32" y2="42" />
    <circle cx="22" cy="22" r="5" />
  </g>
  <text x="812" y="251" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">capture on the server interface</text>

  
  
  <rect x="40" y="312" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="32" height="22" rx="2" />
    <line x1="2" y1="36" x2="42" y2="36" />
    <line x1="18" y1="18" x2="26" y2="18" />
  </g>
  <text x="120" y="350" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">Did the request leave the </tspan>
    <tspan x="120" dy="34">client at all?</tspan>
  </text>

  
  <line x1="680" y1="358" x2="730" y2="358" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="312" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 335)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="36" height="24" rx="4" />
    <polyline points="14,22 22,30 32,16" />
  </g>
  <text x="812" y="350" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="812" dy="0">capture on the client interface; </tspan>
    <tspan x="812" dy="30">the offload caveat still applies</tspan>
  </text>

  
  
  <rect x="40" y="426" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 449)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="32" height="32" rx="4" />
    <circle cx="22" cy="22" r="6" />
    <line x1="22" y1="6" x2="22" y2="12" />
    <line x1="22" y1="32" x2="22" y2="38" />
    <line x1="6" y1="22" x2="12" y2="22" />
    <line x1="32" y1="22" x2="38" y2="22" />
  </g>
  <text x="120" y="479" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Traffic inside a pod</text>

  
  <line x1="680" y1="472" x2="730" y2="472" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="426" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 449)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="36" height="28" rx="4" />
    <polyline points="12,18 18,22 12,26" />
    <line x1="22" y1="26" x2="30" y2="26" />
  </g>
  <text x="812" y="479" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">nsenter -t PID -n tcpdump</text>

  
  
  <rect x="40" y="540" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 563)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="24" rx="2" />
    <rect x="24" y="10" width="16" height="24" rx="2" />
    <line x1="16" y1="22" x2="28" y2="22" stroke-dasharray="2,2" />
  </g>
  <text x="120" y="578" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">Traffic crossing between </tspan>
    <tspan x="120" dy="34">namespaces</tspan>
  </text>

  
  <line x1="680" y1="586" x2="730" y2="586" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="540" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 563)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="22" r="6" />
    <circle cx="34" cy="22" r="6" />
    <line x1="16" y1="22" x2="28" y2="22" />
  </g>
  <text x="812" y="578" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="812" dy="0">bridge or veth host-side; </tspan>
    <tspan x="812" dy="30">compare both ends of a veth</tspan>
  </text>

  
  
  <rect x="40" y="654" width="640" height="92" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
  <g transform="translate(58, 677)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 34 C 14 34, 14 10, 22 10 C 30 10, 30 34, 38 34" />
    <circle cx="6" cy="34" r="3" fill="#db8129" />
    <circle cx="38" cy="34" r="3" fill="#db8129" />
  </g>
  <text x="120" y="692" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">Need the wire itself, </tspan>
    <tspan x="120" dy="34">independent of the host stack</tspan>
  </text>

  
  <line x1="680" y1="700" x2="730" y2="700" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

  
  <rect x="730" y="654" width="830" height="92" rx="10" fill="#fff8f0" stroke="#db8129" stroke-width="3" />
  <g transform="translate(748, 677)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="12" width="36" height="22" rx="4" />
    <line x1="10" y1="23" x2="14" y2="23" />
    <line x1="20" y1="23" x2="24" y2="23" />
    <line x1="30" y1="23" x2="34" y2="23" />
    <path d="M 22 12 L 22 4" />
    <polyline points="18,7 22,3 26,7" />
  </g>
  <text x="812" y="692" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="812" dy="0">switch port mirror (SPAN, ERSPAN) or TAP; </tspan>
    <tspan x="812" dy="30">mirrored traffic can be dropped under congestion</tspan>
  </text>

  
  
  <rect x="40" y="768" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 791)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="24" height="24" rx="3" />
    <line x1="16" y1="4" x2="16" y2="10" />
    <line x1="28" y1="4" x2="28" y2="10" />
    <line x1="16" y1="34" x2="16" y2="40" />
    <line x1="28" y1="34" x2="28" y2="40" />
    <line x1="4" y1="16" x2="10" y2="16" />
    <line x1="4" y1="28" x2="10" y2="28" />
    <line x1="34" y1="16" x2="40" y2="16" />
    <line x1="34" y1="28" x2="40" y2="28" />
  </g>
  <text x="120" y="806" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">RoCE or traffic the </tspan>
    <tspan x="120" dy="34">kernel does not see</tspan>
  </text>

  
  <line x1="680" y1="814" x2="730" y2="814" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="768" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 791)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="36" height="22" rx="3" />
    <rect x="14" y="14" width="12" height="12" rx="2" />
    <line x1="8" y1="32" x2="8" y2="38" />
    <line x1="14" y1="32" x2="14" y2="38" />
    <line x1="20" y1="32" x2="20" y2="38" />
    <line x1="26" y1="32" x2="26" y2="38" />
  </g>
  <text x="812" y="806" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="812" dy="0">NIC or DPU capture: tcpdump -i mlx5_0 with </tspan>
    <tspan x="812" dy="30">rdma-core, ibdump, or a switch mirror</tspan>
  </text>

  
  
  <rect x="40" y="882" width="640" height="92" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(58, 905)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="14" />
    <line x1="30" y1="30" x2="40" y2="40" />
    <line x1="14" y1="14" x2="26" y2="26" />
    <line x1="26" y1="14" x2="14" y2="26" />
  </g>
  <text x="120" y="920" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="120" dy="0">Where was the packet dropped, </tspan>
    <tspan x="120" dy="34">without copying it?</tspan>
  </text>

  
  <line x1="680" y1="928" x2="730" y2="928" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <rect x="730" y="882" width="830" height="92" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  <g transform="translate(748, 905)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,22 14,22 18,10 24,34 30,16 34,22 42,22" />
  </g>
  <text x="812" y="920" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
    <tspan x="812" dy="0">tracepoints, kfree_skb, pwru; </tspan>
    <tspan x="812" dy="30">complement, do not replace, pcap</tspan>
  </text>

  
  <rect x="40" y="998" width="1520" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <g transform="translate(62, 1014)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 6 L 40 38 L 4 38 Z" />
    <line x1="22" y1="18" x2="22" y2="26" />
    <circle cx="22" cy="32" r="1.5" fill="#207448" />
  </g>
  <text x="126" y="1031" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="126" dy="0">-i any: all interfaces with cooked SLL headers, </tspan>
    <tspan x="126" dy="30">loses VLAN and ordering details; do not use for exact timing</tspan>
  </text>

  
  <rect x="40" y="1098" width="1520" height="52" rx="10" fill="#207448" />
  <text x="800" y="1133" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Move the tap closer to the place you suspect</text>

</svg>