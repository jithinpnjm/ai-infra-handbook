<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="1600" height="1250">
  <title>Where to capture</title>
  <desc>Visual guide for network packet capture points along the path from client to container namespace.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1250" fill="#f5f8f5"/>

  
  <text x="60" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where to capture</text>

  
  
  <rect x="60" y="130" width="150" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="110" y="150" width="50" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="125" y1="186" x2="145" y2="186" stroke="#207448" stroke-width="3"/>
  <line x1="118" y1="196" x2="152" y2="196" stroke="#207448" stroke-width="3"/>
  <text x="135" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">client</text>

  
  <line x1="210" y1="195" x2="246" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="250" y="130" width="180" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="315" y="150" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="327" y1="184" x2="327" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="337" y1="184" x2="337" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="347" y1="184" x2="347" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="357" y1="184" x2="357" y2="194" stroke="#207448" stroke-width="3"/>
  <text x="340" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">client NIC</text>

  
  <line x1="430" y1="195" x2="466" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="470" y="130" width="320" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="600" y="145" width="60" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 612 159 L 628 159 M 623 155 L 628 159 L 623 163" fill="none" stroke="#207448" stroke-width="2"/>
  <path d="M 648 159 L 632 159 M 637 155 L 632 159 L 637 163" fill="none" stroke="#207448" stroke-width="2"/>
  <text x="630" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">switch</text>
  <text x="630" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">(SPAN mirror/TAP)</text>

  
  <line x1="790" y1="195" x2="826" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="830" y="130" width="180" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="895" y="150" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="907" y1="184" x2="907" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="917" y1="184" x2="917" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="927" y1="184" x2="927" y2="194" stroke="#207448" stroke-width="3"/>
  <line x1="937" y1="184" x2="937" y2="194" stroke="#207448" stroke-width="3"/>
  <text x="920" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">server NIC</text>

  
  <line x1="1010" y1="195" x2="1046" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1050" y="130" width="230" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="1140" cy="165" r="9" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="1190" cy="165" r="9" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 1149 165 C 1160 150 1170 150 1181 165" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="1149" y1="165" x2="1181" y2="165" stroke="#207448" stroke-width="3"/>
  <text x="1165" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">host bridge/veth</text>

  
  <line x1="1280" y1="195" x2="1316" y2="195" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="1320" y="130" width="220" height="130" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <rect x="1405" y="146" width="50" height="34" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="1405" y1="158" x2="1455" y2="158" stroke="#207448" stroke-width="2"/>
  <circle cx="1415" cy="170" r="3" fill="#207448"/>
  <circle cx="1425" cy="170" r="3" fill="#207448"/>
  <text x="1430" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">container</text>
  <text x="1430" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">namespace</text>

  
  
  <rect x="60" y="300" width="720" height="215" rx="16" fill="#ffffff" stroke="#c8d9cc" stroke-width="2"/>
  <circle cx="106" cy="350" r="24" fill="#207448"/>
  <text x="106" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="148" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">on the host interface</text>
  <text x="148" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4a5852">
    <tspan x="148" dy="0">(post-GRO RX, pre-offload TX;</tspan>
    <tspan x="148" dy="36">offload artefacts)</tspan>
  </text>

  
  <rect x="820" y="300" width="720" height="215" rx="16" fill="#ffffff" stroke="#c8d9cc" stroke-width="2"/>
  <circle cx="866" cy="350" r="24" fill="#207448"/>
  <text x="866" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="908" y="358" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#207448">'tcpdump -i any'</text>
  <text x="908" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4a5852">
    <tspan x="908" dy="0">(cooked SLL headers, loses VLAN and</tspan>
    <tspan x="908" dy="36">ordering details; not for exact timing)</tspan>
  </text>

  
  
  <rect x="60" y="545" width="720" height="215" rx="16" fill="#ffffff" stroke="#c8d9cc" stroke-width="2"/>
  <circle cx="106" cy="595" r="24" fill="#207448"/>
  <text x="106" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="148" y="603" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">inside a container namespace</text>
  <rect x="148" y="630" width="370" height="46" rx="8" fill="#e8f1ea"/>
  <text x="162" y="662" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">'nsenter -t PID -n tcpdump'</text>

  
  <rect x="820" y="545" width="720" height="215" rx="16" fill="#ffffff" stroke="#c8d9cc" stroke-width="2"/>
  <circle cx="866" cy="595" r="24" fill="#207448"/>
  <text x="866" y="604" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="908" y="603" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">host side of bridge or veth,</text>
  <text x="908" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#4a5852">compare both ends</text>

  
  
  <rect x="60" y="790" width="720" height="240" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  <circle cx="106" cy="840" r="24" fill="#db8129"/>
  <text x="106" y="849" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="148" y="848" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">switch port mirror (SPAN), ERSPAN or TAP:</text>
  <text x="148" y="900" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="148" dy="0">the truth source for the wire,</tspan>
    <tspan x="148" dy="36">mirrored traffic can be dropped under congestion</tspan>
  </text>

  
  <rect x="820" y="790" width="720" height="240" rx="16" fill="#ffffff" stroke="#c8d9cc" stroke-width="2"/>
  <circle cx="866" cy="840" r="24" fill="#207448"/>
  <text x="866" y="849" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="908" y="848" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#303a36">kernel tracepoints</text>
  <rect x="908" y="872" width="250" height="44" rx="8" fill="#e8f1ea"/>
  <text x="922" y="903" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#207448">pwru, kfree_skb</text>
  <text x="908" y="955" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#4a5852">for drop locations</text>

  
  <rect x="60" y="1065" width="1480" height="110" rx="16" fill="#207448" stroke="#185937" stroke-width="2"/>
  <circle cx="120" cy="1120" r="24" fill="#ffffff" opacity="0.2"/>
  
  <path d="M 110 1120 L 117 1127 L 132 1112" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="165" y="1129" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Ask which packets you must see, then pick the closest point that sees them</text>
</svg>