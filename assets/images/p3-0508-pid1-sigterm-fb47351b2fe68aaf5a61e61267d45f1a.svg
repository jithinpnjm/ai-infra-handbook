<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Why a pod takes exactly 30 seconds to die</title>
  <desc>Visual comparison showing why pods without a SIGTERM handler take 30 seconds to terminate due to unhandled signals and grace period expiration versus pods with a registered handler that exit cleanly.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1180" fill="#f5f8f5"/>

  
  <text x="800" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Why a pod takes exactly 30 seconds to die</text>
  <text x="800" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Timeline from T+0 to T+30 s</text>

  
  <g id="t0-banner">
    <rect x="60" y="130" width="1480" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="115" cy="175" r="14" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 115 153 v 6 M 115 191 v 6 M 93 175 h 6 M 131 175 h 6 M 100 160 l 4 4 M 126 186 l 4 4 M 100 190 l 4 -4 M 126 164 l 4 -4" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <rect x="160" y="153" width="95" height="44" rx="8" fill="#207448"/>
    <text x="207" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">T+0</text>
    
    <text x="280" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">kubelet sends SIGTERM to PID 1 (after preStop)</text>
  </g>

  
  <g id="lane-a">
    <rect x="60" y="245" width="720" height="715" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 60 261 A 16 16 0 0 1 76 245 L 764 245 A 16 16 0 0 1 780 261 L 780 375 L 60 375 Z" fill="#e8f1ea"/>
    <line x1="60" y1="375" x2="780" y2="375" stroke="#207448" stroke-width="2"/>
    
    <rect x="90" y="260" width="125" height="36" rx="8" fill="#207448"/>
    <text x="152" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Lane A</text>
    
    <text x="90" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">PID 1 is /bin/sh or a process</text>
    <text x="90" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">with no SIGTERM handler</text>

    
    <rect x="90" y="400" width="660" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="130" cy="455" r="24" fill="#207448"/>
    <text x="130" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <path d="M 175 436 L 198 428 L 221 436 C 221 460 198 476 198 476 C 198 476 175 460 175 436 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <text x="245" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">the kernel ignores signals to PID 1</text>
    <text x="245" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">in a PID namespace unless a handler</text>
    <text x="245" y="503" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">is registered</text>

    
    <line x1="420" y1="510" x2="420" y2="540" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="90" y="540" width="660" height="110" rx="12" fill="#fffaf2" stroke="#db8129" stroke-width="3"/>
    <circle cx="130" cy="595" r="24" fill="#db8129"/>
    <text x="130" y="604" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    
    <circle cx="198" cy="595" r="20" fill="none" stroke="#db8129" stroke-width="4"/>
    <polyline points="198,583 198,595 210,595" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
    <text x="245" y="587" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">nothing happens for the whole</text>
    <text x="245" y="623" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">terminationGracePeriodSeconds</text>

    
    <line x1="420" y1="650" x2="420" y2="680" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="90" y="680" width="660" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="130" cy="735" r="24" fill="#207448"/>
    <text x="130" y="744" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    
    <rect x="175" y="715" width="115" height="40" rx="8" fill="#207448"/>
    <text x="232" y="743" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">T+30 s</text>
    
    <polygon points="318,715 338,715 326,735 344,735 322,761 328,741 314,741" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
    <text x="365" y="730" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">SIGKILL, which the kernel</text>
    <text x="365" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="bold" fill="#303a36">never ignores</text>

    
    <line x1="420" y1="790" x2="420" y2="830" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="90" y="830" width="660" height="90" rx="12" fill="#c83b3b" stroke="#992222" stroke-width="2"/>
    <circle cx="130" cy="875" r="24" fill="#ffffff"/>
    <text x="130" y="884" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#c83b3b">4</text>
    
    <path d="M 180 893 L 180 867 A 15 15 0 0 1 210 867 L 210 893 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <line x1="188" y1="875" x2="202" y2="875" stroke="#ffffff" stroke-width="4"/>
    <line x1="195" y1="868" x2="195" y2="882" stroke="#ffffff" stroke-width="4"/>
    <text x="440" y="885" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">pod takes 30 s to die</text>
  </g>

  
  <g id="lane-b">
    <rect x="820" y="245" width="720" height="715" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <path d="M 820 261 A 16 16 0 0 1 836 245 L 1524 245 A 16 16 0 0 1 1540 261 L 1540 375 L 820 375 Z" fill="#e8f1ea"/>
    <line x1="820" y1="375" x2="1540" y2="375" stroke="#207448" stroke-width="2"/>
    
    <rect x="850" y="260" width="125" height="36" rx="8" fill="#207448"/>
    <text x="912" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Lane B</text>
    
    <text x="850" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">PID 1 registers a SIGTERM handler</text>

    
    <rect x="850" y="440" width="660" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="890" cy="505" r="24" fill="#207448"/>
    <text x="890" y="514" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    
    <ellipse cx="960" cy="488" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 940 488 v 28 a 20 8 0 0 0 40 0 v -28" fill="none" stroke="#207448" stroke-width="4"/>
    <path d="M 940 502 a 20 8 0 0 0 40 0" fill="none" stroke="#207448" stroke-width="4"/>
    <text x="1010" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#303a36">saves checkpoint or drains,</text>
    <text x="1010" y="535" font-family="monospace" font-size="26" font-weight="bold" fill="#207448">exits 0</text>

    
    <line x1="1180" y1="570" x2="1180" y2="670" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>

    
    <rect x="850" y="670" width="660" height="90" rx="12" fill="#207448" stroke="#165233" stroke-width="2"/>
    <circle cx="890" cy="715" r="24" fill="#ffffff"/>
    <text x="890" y="724" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">2</text>
    
    <circle cx="960" cy="715" r="20" fill="none" stroke="#ffffff" stroke-width="4"/>
    <polyline points="948,715 956,723 972,707" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1200" y="725" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">pod ends early</text>
  </g>

  
  <g id="side-note">
    <rect x="60" y="990" width="1480" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <circle cx="115" cy="1065" r="22" fill="none" stroke="#207448" stroke-width="4"/>
    <line x1="115" y1="1058" x2="115" y2="1073" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    <circle cx="115" cy="1080" r="2.5" fill="#207448"/>
    
    <rect x="160" y="1015" width="150" height="36" rx="8" fill="#207448"/>
    <text x="235" y="1041" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Side note</text>
    
    <text x="160" y="1082" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">shell-form entrypoint can swallow SIGTERM; for training treat SIGTERM as checkpoint</text>
    <text x="160" y="1118" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">now and set the grace period from a measured checkpoint time plus margin</text>
  </g>
</svg>