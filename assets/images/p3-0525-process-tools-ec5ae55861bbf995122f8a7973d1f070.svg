<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Process tools by the question they answer</title>
  <desc>Visual diagnostic hierarchy mapping process-level questions to the right diagnostic tools, organized from broad system-wide investigation down to kernel internals and hardware events.</desc>
  <rect width="1600" height="1200" fill="#f5f8f5" />
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Process tools by the question they answer</text>

  
  <g id="card-1">
    <rect x="60" y="105" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="149" r="24" fill="#207448" />
    <text x="100" y="149" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(138, 127)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="30" height="30" rx="3" />
      <line x1="12" y1="1" x2="12" y2="6" />
      <line x1="21" y1="1" x2="21" y2="6" />
      <line x1="30" y1="1" x2="30" y2="6" />
      <line x1="12" y1="36" x2="12" y2="41" />
      <line x1="21" y1="36" x2="21" y2="41" />
      <line x1="30" y1="36" x2="30" y2="41" />
      <line x1="1" y1="12" x2="6" y2="12" />
      <line x1="1" y1="21" x2="6" y2="21" />
      <line x1="1" y1="30" x2="6" y2="30" />
      <line x1="36" y1="12" x2="41" y2="12" />
      <line x1="36" y1="21" x2="41" y2="21" />
      <line x1="36" y1="30" x2="41" y2="30" />
      <circle cx="21" cy="21" r="5" fill="#207448" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="196" y="157" font-family="sans-serif" font-weight="bold" font-size="30">Which threads are busy: </tspan>
      <tspan x="90" y="225" font-family="monospace" font-size="24">top -H, pidstat -u -r -w 1, </tspan>
      <tspan x="90" y="270" font-family="monospace" font-size="24">mpstat -P ALL 1, vmstat 1</tspan>
    </text>
  </g>

  
  <g id="card-2">
    <rect x="830" y="105" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="149" r="24" fill="#207448" />
    <text x="870" y="149" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(908, 127)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="21" cy="23" r="16" />
      <line x1="21" y1="2" x2="21" y2="7" />
      <line x1="16" y1="2" x2="26" y2="2" />
      <polyline points="21,13 21,23 29,23" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="966" y="157" font-family="sans-serif" font-weight="bold" font-size="30">Which code burns time: </tspan>
      <tspan x="860" y="218" font-family="monospace" font-size="24">perf top -p PID, </tspan>
      <tspan x="860" y="258" font-family="monospace" font-size="24">perf record -F 99 -g -p PID -- sleep 30, </tspan>
      <tspan x="860" y="298" font-family="monospace" font-size="24">bpftrace tracepoint on sys_enter_openat</tspan>
    </text>
  </g>

  
  <g id="card-3">
    <rect x="60" y="358" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
    <circle cx="100" cy="402" r="24" fill="#db8129" />
    <text x="100" y="402" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(138, 380)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="34" height="28" rx="4" />
      <line x1="4" y1="14" x2="38" y2="14" />
      <polyline points="10,21 15,25 10,29" />
      <line x1="18" y1="29" x2="26" y2="29" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="196" y="410" font-family="sans-serif" font-weight="bold" font-size="30">Which system calls does it make: </tspan>
      <tspan x="90" y="471" font-family="monospace" font-size="24">strace -f -tt -T -p PID </tspan>
      <tspan x="90" y="511" font-family="monospace" font-size="24">-e trace=network,file </tspan>
      <tspan x="90" y="551" font-family="monospace" font-size="24" fill="#db8129" font-weight="bold">(careful with overhead)</tspan>
    </text>
  </g>

  
  <g id="card-4">
    <rect x="830" y="358" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="402" r="24" fill="#207448" />
    <text x="870" y="402" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(908, 380)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 L 16 18 L 6 28" />
      <path d="M 22 28 L 32 18 L 22 8" />
      <circle cx="19" cy="18" r="2" fill="#207448" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="966" y="398" font-family="sans-serif" font-weight="bold" font-size="30">Python stacks </tspan>
      <tspan x="966" y="433" font-family="sans-serif" font-weight="bold" font-size="30">without a debugger: </tspan>
      <tspan x="860" y="493" font-family="monospace" font-size="24">py-spy dump --pid PID, </tspan>
      <tspan x="860" y="535" font-family="monospace" font-size="24">py-spy top</tspan>
    </text>
  </g>

  
  <g id="card-5">
    <rect x="60" y="611" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="655" r="24" fill="#207448" />
    <text x="100" y="655" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(138, 633)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 12 L 21 6 L 36 12 L 21 18 Z" />
      <path d="M 6 21 L 21 27 L 36 21" />
      <path d="M 6 30 L 21 36 L 36 30" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="196" y="651" font-family="sans-serif" font-weight="bold" font-size="30">Native stacks of a hung C, </tspan>
      <tspan x="196" y="686" font-family="sans-serif" font-weight="bold" font-size="30">C++ or CUDA process: </tspan>
      <tspan x="90" y="746" font-family="monospace" font-size="24">gdb -p PID -batch </tspan>
      <tspan x="90" y="788" font-family="monospace" font-size="24">-ex thread apply all bt</tspan>
    </text>
  </g>

  
  <g id="card-6">
    <rect x="830" y="611" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="655" r="24" fill="#207448" />
    <text x="870" y="655" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">6</text>
    <g transform="translate(908, 633)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="21" cy="21" r="16" />
      <line x1="16" y1="13" x2="16" y2="29" />
      <line x1="26" y1="13" x2="26" y2="29" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="966" y="663" font-family="sans-serif" font-weight="bold" font-size="30">Why is it sleeping: </tspan>
      <tspan x="860" y="726" font-family="monospace" font-size="24">cat /proc/PID/stack, </tspan>
      <tspan x="860" y="766" font-family="monospace" font-size="24">/proc/PID/wchan, </tspan>
      <tspan x="860" y="806" font-family="monospace" font-size="24">/proc/PID/sched</tspan>
    </text>
  </g>

  
  <g id="card-7">
    <rect x="60" y="864" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="100" cy="908" r="24" fill="#207448" />
    <text x="100" y="908" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">7</text>
    <g transform="translate(138, 886)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="10" x2="36" y2="10" />
      <circle cx="16" cy="10" r="4" fill="#207448" />
      <line x1="6" y1="21" x2="36" y2="21" />
      <circle cx="28" cy="21" r="4" fill="#207448" />
      <line x1="6" y1="32" x2="36" y2="32" />
      <circle cx="12" cy="32" r="4" fill="#207448" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="196" y="904" font-family="sans-serif" font-weight="bold" font-size="30">What are its cgroup limits </tspan>
      <tspan x="196" y="939" font-family="sans-serif" font-weight="bold" font-size="30">and events: </tspan>
      <tspan x="90" y="996" font-family="monospace" font-size="24">memory.events, cpu.stat, memory.max, </tspan>
      <tspan x="90" y="1033" font-family="monospace" font-size="24">memory.current, pids.current </tspan>
      <tspan x="90" y="1070" font-family="monospace" font-size="24">under /sys/fs/cgroup</tspan>
    </text>
  </g>

  
  <g id="card-8">
    <rect x="830" y="864" width="710" height="228" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="870" cy="908" r="24" fill="#207448" />
    <text x="870" y="908" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">8</text>
    <g transform="translate(908, 886)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="4" width="26" height="34" rx="3" />
      <line x1="14" y1="12" x2="28" y2="12" />
      <line x1="14" y1="19" x2="28" y2="19" />
      <line x1="14" y1="26" x2="22" y2="26" />
    </g>
    <text font-size="30" fill="#303a36">
      <tspan x="966" y="916" font-family="sans-serif" font-weight="bold" font-size="30">Kernel messages: </tspan>
      <tspan x="860" y="996" font-family="monospace" font-size="24">dmesg -T | tail -100; </tspan>
      <tspan x="860" y="1041" font-family="monospace" font-size="24">journalctl -k grep oom xid nvrm mlx error</tspan>
    </text>
  </g>

  
  <rect x="60" y="1120" width="1480" height="55" rx="10" fill="#207448" />
  <text x="800" y="1157" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">start broad and get narrower</text>
</svg>