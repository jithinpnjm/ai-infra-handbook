<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Capturing in and around a pod: three taps in order</title>
  <desc>An infographic illustrating packet flow from pod eth0 to uplink and three ordered network capture taps for Kubernetes troubleshooting.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 12 7 L 1 12 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="70" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Capturing in and around a pod: three taps in order</text>

  
  <rect x="50" y="105" width="1500" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="800" y="137" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">a packet missing between tap 1 and tap 2 tells you where to look next</text>

  

  
  <rect x="50" y="170" width="180" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="115" y="185" width="50" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="125" y1="217" x2="125" y2="225" stroke="#207448" stroke-width="3.5" />
  <line x1="140" y1="217" x2="140" y2="225" stroke="#207448" stroke-width="3.5" />
  <line x1="155" y1="217" x2="155" y2="225" stroke="#207448" stroke-width="3.5" />
  <circle cx="127" cy="195" r="3" fill="#207448" />
  <text x="140" y="275" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">pod eth0</text>

  
  <line x1="230" y1="240" x2="255" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="255" y="170" width="210" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="340" y="185" width="18" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
  <rect x="362" y="185" width="18" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="332" y1="199" x2="340" y2="199" stroke="#207448" stroke-width="3.5" />
  <line x1="380" y1="199" x2="388" y2="199" stroke="#207448" stroke-width="3.5" />
  <text x="360" y="258" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="360" dy="0">host-side</tspan>
    <tspan x="360" dy="34">veth</tspan>
  </text>

  
  <line x1="465" y1="240" x2="490" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="490" y="170" width="225" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="577" y="186" width="50" height="30" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="587" y1="201" x2="617" y2="201" stroke="#207448" stroke-width="3" />
  <line x1="595" y1="193" x2="609" y2="209" stroke="#207448" stroke-width="3" />
  <line x1="609" y1="193" x2="595" y2="209" stroke="#207448" stroke-width="3" />
  <text x="602" y="275" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">CNI bridge</text>

  
  <line x1="715" y1="240" x2="740" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="740" y="170" width="385" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="912" cy="201" rx="8" ry="15" fill="none" stroke="#207448" stroke-width="3.5" />
  <ellipse cx="952" cy="201" rx="8" ry="15" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="912" y1="186" x2="952" y2="186" stroke="#207448" stroke-width="3.5" />
  <line x1="912" y1="216" x2="952" y2="216" stroke="#207448" stroke-width="3.5" />
  <rect x="926" y="193" width="16" height="16" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <text x="932" y="258" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="932" dy="0">tunnel device after</tspan>
    <tspan x="932" dy="34">decapsulation</tspan>
  </text>

  
  <line x1="1125" y1="240" x2="1150" y2="240" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1150" y="170" width="400" height="140" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="1325" y="186" width="36" height="30" rx="3" fill="none" stroke="#207448" stroke-width="3.5" />
  <rect x="1333" y="192" width="20" height="18" rx="2" fill="none" stroke="#207448" stroke-width="2.5" />
  <line x1="1361" y1="195" x2="1381" y2="195" stroke="#207448" stroke-width="3.5" />
  <polyline points="1375,189 1381,195 1375,201" fill="none" stroke="#207448" stroke-width="3.5" />
  <line x1="1361" y1="207" x2="1381" y2="207" stroke="#207448" stroke-width="3.5" />
  <polyline points="1375,201 1381,207 1375,213" fill="none" stroke="#207448" stroke-width="3.5" />
  <text x="1350" y="258" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="1350" dy="0">uplink (outer</tspan>
    <tspan x="1350" dy="34">encapsulated packet)</tspan>
  </text>

  

  
  <rect x="50" y="335" width="450" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="86" cy="372" r="24" fill="#207448" />
  <text x="86" y="382" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">1</text>
  
  <text x="122" y="380" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tap 1 inside the pod</text>
  <text x="75" y="416" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">namespace: find the PID</tspan>
    <tspan x="75" dy="32">with the runtime inspect</tspan>
    <tspan x="75" dy="32">command, then</tspan>
  </text>
  <text x="75" y="540" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">sudo nsenter -t &lt;pid&gt;</tspan>
    <tspan x="75" dy="32">-n tcpdump -ni eth0</tspan>
    <tspan x="75" dy="32">-w /tmp/pod.pcap</tspan>
  </text>

  
  <rect x="525" y="335" width="495" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="561" cy="372" r="24" fill="#207448" />
  <text x="561" y="382" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">2</text>
  
  <text x="597" y="380" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tap 2 host-side veth,</text>
  <text x="550" y="426" font-family="sans-serif" font-size="24" fill="#303a36">found with</text>
  <text x="550" y="474" font-family="monospace" font-size="24" fill="#303a36">ip -o link | grep veth,</text>
  <text x="550" y="522" font-family="sans-serif" font-size="24" fill="#303a36">or the CNI bridge</text>

  
  <rect x="1045" y="335" width="505" height="320" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="1081" cy="372" r="24" fill="#207448" />
  <text x="1081" y="382" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">3</text>
  
  <text x="1117" y="380" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Tap 3 for overlays: the tunnel</text>
  <text x="1070" y="426" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1070" dy="0">device for the inner packet</tspan>
    <tspan x="1070" dy="36">after decapsulation, and the</tspan>
    <tspan x="1070" dy="36">uplink for the outer,</tspan>
    <tspan x="1070" dy="36">encapsulated packet</tspan>
  </text>

  

  
  <rect x="50" y="680" width="880" height="415" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <text x="75" y="722" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">kubectl debug node/&lt;node&gt; -it</tspan>
    <tspan x="75" dy="32">--image=nicolaka/netshoot gives the host namespaces</tspan>
  </text>

  
  <text x="75" y="818" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">kubectl debug -it &lt;pod&gt; --image=nicolaka/netshoot</tspan>
    <tspan x="75" dy="32">--target=&lt;container&gt; gives an ephemeral container</tspan>
    <tspan x="75" dy="32">sharing the pod's network namespace; needs permissions</tspan>
    <tspan x="75" dy="32">and NET_RAW and NET_ADMIN capabilities</tspan>
  </text>

  
  <text x="75" y="976" font-family="monospace" font-size="24" fill="#303a36">kubectl sniff (ksniff) streams a pod capture into Wireshark</text>

  
  <text x="75" y="1038" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="75" dy="0">docker run --network container:NAME</tspan>
    <tspan x="75" dy="32">nicolaka/netshoot tcpdump</tspan>
  </text>

  
  <rect x="955" y="680" width="595" height="415" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="3" />
  
  <rect x="985" y="705" width="46" height="46" rx="6" fill="none" stroke="#db8129" stroke-width="3.5" />
  <circle cx="1008" cy="728" r="10" fill="none" stroke="#db8129" stroke-width="3" />
  <line x1="995" y1="705" x2="995" y2="698" stroke="#db8129" stroke-width="3" />
  <line x1="1008" y1="705" x2="1008" y2="698" stroke="#db8129" stroke-width="3" />
  <line x1="1021" y1="705" x2="1021" y2="698" stroke="#db8129" stroke-width="3" />
  <line x1="995" y1="751" x2="995" y2="758" stroke="#db8129" stroke-width="3" />
  <line x1="1008" y1="751" x2="1008" y2="758" stroke="#db8129" stroke-width="3" />
  <line x1="1021" y1="751" x2="1021" y2="758" stroke="#db8129" stroke-width="3" />

  
  <text x="985" y="792" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="985" dy="0">RoCE traffic in a GPU pod never enters</tspan>
    <tspan x="985" dy="38">the kernel stack: capture at the NIC</tspan>
    <tspan x="985" dy="38">with ibdump or tcpdump -i mlx5_0,</tspan>
    <tspan x="985" dy="38">or at the switch; when diagnosing the</tspan>
    <tspan x="985" dy="38">NIC of a host, capture on a different</tspan>
    <tspan x="985" dy="38">host or at the switch</tspan>
  </text>

  
  <rect x="50" y="1115" width="1500" height="65" rx="10" fill="#207448" />
  <text x="800" y="1156" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Two files together show whether a packet left the pod and whether it reached the node</text>
</svg>