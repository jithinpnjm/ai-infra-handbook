<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>Ask startup or runtime first: two OOMs, two causes</title>
  <desc>Visual flowchart comparing startup GPU OOMs caused by sizing issues versus runtime GPU OOMs caused by traffic surges, detailing phases, causes, mitigations, and diagnostic checks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Ask startup or runtime first: two OOMs, two causes</text>

  
  <g transform="translate(470, 90)">
    <rect x="0" y="0" width="660" height="84" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(24, 14)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 22 22 C 22 16 34 16 34 23 C 34 28 28 29 28 35" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="43" r="2.5" fill="#207448" />
    </g>
    <text x="96" y="54" font-family="sans-serif" font-size="34" font-weight="bold" fill="#303a36">GPU OOM: when did it die?</text>
  </g>

  
  <path d="M 640 174 L 640 215 L 415 215 L 415 246" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 960 174 L 960 215 L 1185 215 L 1185 246" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="730" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 20)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <path d="M 28 10 C 37 15 42 26 42 38 L 14 38 C 14 26 19 15 28 10 Z" fill="none" stroke="#207448" stroke-width="3" />
        <circle cx="28" cy="24" r="4" fill="#207448" />
        <path d="M 20 38 L 16 46 M 36 38 L 40 46" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="72" y="40" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">At startup</text>
    </g>

    
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(14, 12)">
        <path d="M 20 6 A 14 14 0 1 1 8 16" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <polyline points="22,2 22,8 16,8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="56" y="42" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">a pod restarting in a loop</text>
    </g>

    
    
    <g transform="translate(24, 172)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="34" cy="32" r="20" fill="#207448" />
      <text x="34" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Load weights</text>
    </g>

    <path d="M 365 236 L 365 250" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g transform="translate(24, 254)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="34" cy="32" r="20" fill="#207448" />
      <text x="34" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Profiling pass</text>
    </g>

    <path d="M 365 318 L 365 332" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

    
    <g transform="translate(24, 336)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <circle cx="34" cy="32" r="20" fill="#207448" />
      <text x="34" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Capture CUDA graphs</text>
    </g>

    
    <g transform="translate(24, 420)">
      <rect x="0" y="0" width="682" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
      
      <g transform="translate(18, 17)">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="20" y1="18" x2="20" y2="29" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <circle cx="20" cy="11" r="2" fill="#207448" />
      </g>
      <text x="68" y="46" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Container exits before it listens</text>
    </g>

    
    <g transform="translate(24, 520)">
      
      <g transform="translate(0, 30)">
        <circle cx="22" cy="22" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 14 26 L 30 18 M 18 14 L 26 30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      
      <g transform="translate(56, 0)">
        <rect x="0" y="0" width="626" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <text x="24" y="34" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">gpu_memory_utilization</text>
      </g>

      
      <g transform="translate(56, 62)">
        <rect x="0" y="0" width="626" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <text x="24" y="34" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">max_model_len</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(820, 250)">
    <rect x="0" y="0" width="730" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    
    <g transform="translate(24, 20)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="56" height="56" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3" />
        <polyline points="8,34 18,34 26,14 34,42 42,26 48,26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="72" y="40" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">At runtime, under peak traffic</text>
    </g>

    
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(14, 12)">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <polyline points="20,10 20,20 27,20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="56" y="42" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">a process that dies hours later</text>
    </g>

    
    
    <g transform="translate(24, 172)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(18, 14)">
        <path d="M 6 24 C 14 8 20 8 28 24 C 34 36 40 36 46 20" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Activation spike</text>
    </g>

    
    <g transform="translate(24, 254)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(18, 14)">
        <line x1="8" y1="14" x2="38" y2="14" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="8" y1="24" x2="44" y2="24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="8" y1="34" x2="30" y2="34" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Longer prompts</text>
    </g>

    
    <g transform="translate(24, 336)">
      <rect x="0" y="0" width="682" height="64" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(18, 14)">
        <rect x="6" y="8" width="14" height="12" fill="none" stroke="#207448" stroke-width="3" rx="2" />
        <rect x="26" y="8" width="18" height="12" fill="#207448" rx="2" />
        <rect x="6" y="26" width="22" height="12" fill="#207448" rx="2" />
        <rect x="34" y="26" width="10" height="12" fill="none" stroke="#207448" stroke-width="3" rx="2" />
      </g>
      <text x="74" y="42" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Memory fragmentation</text>
    </g>

    
    <g transform="translate(24, 420)">
      <rect x="0" y="0" width="682" height="74" rx="10" fill="none" stroke="none" />
    </g>

    
    <g transform="translate(24, 520)">
      
      <g transform="translate(0, 30)">
        <circle cx="22" cy="22" r="18" fill="none" stroke="#207448" stroke-width="3" />
        <path d="M 14 26 L 30 18 M 18 14 L 26 30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      
      <g transform="translate(56, 0)">
        <rect x="0" y="0" width="626" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <text x="24" y="34" font-family="monospace" font-size="25" font-weight="bold" fill="#207448">max_num_batched_tokens</text>
      </g>

      
      <g transform="translate(56, 62)">
        <rect x="0" y="0" width="626" height="50" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
        <text x="24" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">cap prompt length at the gateway</text>
      </g>
    </g>
  </g>

  
  
  <g transform="translate(50, 936)">
    <rect x="0" y="0" width="730" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <path d="M 12 24 L 22 34 L 36 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="86" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="86" dy="0">Read the log and kubectl describe</tspan>
      <tspan x="86" dy="30">pod, last state</tspan>
    </text>
  </g>

  
  <g transform="translate(820, 936)">
    <rect x="0" y="0" width="730" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
      <path d="M 12 24 L 22 34 L 36 14" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="86" y="58" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Check nvidia-smi for other processes</text>
  </g>

  
  <g transform="translate(50, 1060)">
    <rect x="0" y="0" width="1500" height="74" rx="14" fill="#207448" />
    <text x="750" y="47" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">The first points to sizing and the second points to traffic.</text>
  </g>
</svg>