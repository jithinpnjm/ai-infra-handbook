<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320">
  <title>NUMA Architecture and GPU Socket Placement</title>
  <desc>Visual infographic explaining NUMA local vs remote memory access, interconnect latency, GPU placement, and process binding.</desc>

  <defs>
    
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 1 2 L 11 7 L 1 12 Z" fill="#db8129"/>
    </marker>

    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b382b" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1320" fill="#f5f8f5"/>

  
  <text x="800" y="62" font-family="sans-serif" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">
    NUMA: local memory is fast, remote memory crosses the interconnect
  </text>

  
  <g filter="url(#card-shadow)">
    
    <rect x="60" y="120" width="500" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="310" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      Socket 0 (NUMA node 0)
    </text>

    
    <rect x="150" y="210" width="260" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(175, 240)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <rect x="15" y="15" width="30" height="30" rx="4" fill="#207448" opacity="0.25"/>
      <line x1="12" y1="0" x2="12" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="30" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="60" x2="12" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="60" x2="30" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="60" x2="48" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="260" y="285" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">CPU</text>

    
    <rect x="150" y="440" width="260" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(170, 475)">
      <rect x="0" y="0" width="70" height="50" rx="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <rect x="10" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <rect x="29" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <rect x="48" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <line x1="6" y1="42" x2="64" y2="42" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    <text x="252" y="515" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Memory bank 0</text>

    
    
    <g transform="translate(80, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(195, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(310, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(425, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
  </g>

  
  
  <path d="M 230 340 L 230 435" fill="none" stroke="#207448" stroke-width="5" marker-end="url(#arrow-green)"/>
  
  <rect x="255" y="360" width="270" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="390" y="400" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    local access: about 80 ns
  </text>

  
  <g filter="url(#card-shadow)">
    
    <rect x="1040" y="120" width="500" height="660" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
    <text x="1290" y="168" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">
      Socket 1 (NUMA node 1)
    </text>

    
    <rect x="1130" y="210" width="260" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1150, 245)">
      <rect x="0" y="0" width="70" height="50" rx="5" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <rect x="10" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <rect x="29" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <rect x="48" y="10" width="12" height="18" fill="#207448" opacity="0.4"/>
      <line x1="6" y1="42" x2="64" y2="42" stroke="#207448" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    <text x="1232" y="285" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Memory bank 1</text>

    
    <rect x="1130" y="440" width="260" height="130" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(1155, 470)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>
      <rect x="15" y="15" width="30" height="30" rx="4" fill="#207448" opacity="0.25"/>
      <line x1="12" y1="0" x2="12" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="30" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="-6" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="60" x2="12" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="60" x2="30" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="60" x2="48" y2="66" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="1240" y="515" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">CPU</text>

    
    
    <g transform="translate(1060, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(1175, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(1290, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
    
    <g transform="translate(1405, 620)">
      <rect x="0" y="0" width="100" height="125" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <rect x="15" y="18" width="70" height="42" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
      <circle cx="50" cy="39" r="12" fill="none" stroke="#207448" stroke-width="2.5"/>
      <text x="50" y="102" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">GPU</text>
    </g>
  </g>

  
  
  <g transform="translate(600, 420)">
    
    <rect x="0" y="0" width="400" height="44" rx="8" fill="#d9e8dc" stroke="#207448" stroke-width="3"/>
    
    <polygon points="0,22 18,10 18,34" fill="#207448"/>
    
    <polygon points="400,22 382,10 382,34" fill="#207448"/>
    
    <line x1="30" y1="22" x2="370" y2="22" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  
  <text x="800" y="500" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">
    interconnect
  </text>

  
  
  
  <path d="M 410 300 L 1125 300" fill="none" stroke="#db8129" stroke-width="6" marker-end="url(#arrow-orange)"/>

  
  
  <rect x="620" y="200" width="360" height="76" rx="10" fill="#fff5ec" stroke="#db8129" stroke-width="2.5"/>
  <text x="800" y="234" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    remote access: about 139 ns,
  </text>
  <text x="800" y="262" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    roughly 75 percent slower
  </text>

  
  
  <g transform="translate(60, 830)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="700" height="180" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3"/>
    
    <g transform="translate(26, 30)">
      <polygon points="26,4 50,48 2,48" fill="#fff5ec" stroke="#db8129" stroke-width="3"/>
      <line x1="26" y1="20" x2="26" y2="34" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
      <circle cx="26" cy="42" r="2.5" fill="#db8129"/>
    </g>
    
    <text x="96" y="80" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      Data loader on the wrong socket pulls every batch
    </text>
    <text x="96" y="125" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
      across the interconnect, the GPU waits
    </text>
  </g>

  
  <g transform="translate(800, 830)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="740" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(25, 30)">
      <rect x="0" y="0" width="48" height="42" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <path d="M 12 14 L 22 21 L 12 28" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="26" y1="28" x2="36" y2="28" stroke="#207448" stroke-width="2.5"/>
    </g>
    
    <text x="92" y="80" font-family="monospace" font-size="24" font-weight="bold" fill="#207448">
      numactl --cpunodebind=NODE --membind=NODE
    </text>
    <text x="92" y="125" font-family="monospace" font-size="24" fill="#303a36">
      numastat: numa_hit vs numa_miss and numa_foreign
    </text>
  </g>

  
  <g transform="translate(60, 1045)">
    <rect x="0" y="0" width="1480" height="110" rx="12" fill="#ffffff" stroke="#8fa89b" stroke-width="2"/>
    
    <circle cx="45" cy="55" r="22" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    <text x="45" y="63" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">i</text>
    
    <text x="85" y="48" font-family="sans-serif" font-size="24" fill="#303a36">
      NUMA policy is not always inherited by child processes and Python workers,
    </text>
    <text x="85" y="84" font-family="sans-serif" font-size="24" fill="#303a36">
      apply it inside each worker and check.
    </text>
  </g>

  
  <g transform="translate(60, 1190)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="1480" height="85" rx="14" fill="#207448"/>
    <text x="740" y="52" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      On a multi-socket GPU host, ask which node the GPU belongs to before you ask why the data loader is slow.
    </text>
  </g>
</svg>