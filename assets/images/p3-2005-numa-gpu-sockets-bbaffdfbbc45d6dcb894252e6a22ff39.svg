    <tspan x="1190" dy="0">numactl --cpunodebind=NODE --membind=NODE</tspan>
    <tspan x="1190" dy="45">numastat: numa_hit vs numa_miss and numa_foreign</tspan>
  </text>

  
  <rect x="780" y="890" width="780" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(810, 938)" stroke="#207448" stroke-width="3" fill="none">
