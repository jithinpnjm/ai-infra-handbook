  <text x="390" y="855" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="390" dy="0">Data loader on the wrong socket</tspan>
    <tspan x="390" dy="44">pulls every batch across the interconnect,</tspan>
    <tspan x="390" dy="44">the GPU waits</tspan>
  </text>

  
  <rect x="780" y="720" width="780" height="150" rx="16" fill="#fdfefd" stroke="#207448" stroke-width="3" />
  
  <g transform="translate(810, 742)" stroke="#207448" stroke-width="3" fill="none">
