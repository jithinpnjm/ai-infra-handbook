    <line x1="10" y1="38" x2="24" y2="38" />
  </g>
  <text x="1200" y="945" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1200" dy="0">NUMA policy is not always inherited by</tspan>
    <tspan x="1200" dy="36">child processes and Python workers, apply it</tspan>
    <tspan x="1200" dy="36">inside each worker and check.</tspan>
  </text>

  
  <rect x="40" y="1080" width="1520" height="80" rx="12" fill="#207448" />
  <text x="800" y="1130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
    On a multi-socket GPU host, ask which node the GPU belongs to before you ask why the data loader is slow.
  </text>
