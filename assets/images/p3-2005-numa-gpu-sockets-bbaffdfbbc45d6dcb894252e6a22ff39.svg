<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>NUMA: local memory is fast, remote memory crosses the interconnect</title>
  <desc>Visual explanation of NUMA memory access latencies, interconnect penalties, multi-socket GPU topology, and worker binding policies.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
