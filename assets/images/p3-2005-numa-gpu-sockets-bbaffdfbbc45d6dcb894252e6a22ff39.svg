  <text x="477" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">GPU</text>

  
  
  <rect x="570" y="260" width="460" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <line x1="585" y1="290" x2="1015" y2="290" stroke="#207448" stroke-width="3" marker-start="url(#bar-arrow-left)" marker-end="url(#bar-arrow-right)" />
  <text x="800" y="299" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">interconnect</text>

  
  <path d="M 290 420 L 1046 420" fill="none" stroke="#db8129" stroke-width="5" marker-end="url(#arrow-orange)" />
  <text x="670" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="670" dy="0">remote access: about 139 ns,</tspan>
    <tspan x="670" dy="28">roughly 75 percent slower</tspan>
  </text>

  
  <rect x="1030" y="160" width="530" height="520" rx="16" fill="#fdfefd" stroke="#207448" stroke-width="3" />
  <rect x="1030" y="160" width="530" height="60" rx="16" fill="#e8f1ea" />
  <rect x="1030" y="204" width="530" height="16" fill="#e8f1ea" />
  <text x="1295" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Socket 1 (NUMA node 1)</text>

  
  <rect x="1055" y="240" width="225" height="100" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(1075, 262)" stroke="#207448" stroke-width="3" fill="none">
