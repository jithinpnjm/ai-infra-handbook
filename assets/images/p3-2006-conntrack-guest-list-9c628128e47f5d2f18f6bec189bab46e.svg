<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A full conntrack table: new connections fail, old ones keep working</title>
  <desc>Infographic explaining Linux conntrack table exhaustion: existing connections remain established while new connections fail, diagnosis steps, Kubernetes iptables impact, and remediation.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">A full conntrack table:</tspan>
    <tspan x="800" dy="54">new connections fail, old ones keep working</tspan>
  </text>

  

  
  <rect x="40" y="140" width="310" height="430" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(167, 165)">
    <circle cx="28" cy="14" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="10" cy="42" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <circle cx="46" cy="42" r="8" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="24" y1="20" x2="14" y2="36" stroke="#207448" stroke-width="4" />
    <line x1="32" y1="20" x2="42" y2="36" stroke="#207448" stroke-width="4" />
  </g>

  
  <text x="195" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
    <tspan x="195" dy="0">established flow:</tspan>
    <tspan x="195" dy="32">keeps its slot, works</tspan>
  </text>

  
  <line x1="280" y1="340" x2="380" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="280" y1="415" x2="380" y2="415" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="280" y1="490" x2="380" y2="490" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />


  
  <rect x="390" y="140" width="820" height="430" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />

  
  <g transform="translate(420, 160)">
    <rect x="0" y="0" width="56" height="48" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <line x1="0" y1="16" x2="56" y2="16" stroke="#207448" stroke-width="3" />
    <line x1="0" y1="32" x2="56" y2="32" stroke="#207448" stroke-width="3" />
    <line x1="18" y1="0" x2="18" y2="48" stroke="#207448" stroke-width="3" />
    <line x1="36" y1="0" x2="36" y2="48" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="495" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">conntrack table (hash table)</text>

  
  <rect x="415" y="225" width="770" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="256" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">nf_conntrack_count = nf_conntrack_max</text>

  
  
  <rect x="415" y="285" width="770" height="46" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <line x1="569" y1="285" x2="569" y2="331" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="723" y1="285" x2="723" y2="331" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="877" y1="285" x2="877" y2="331" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="1031" y1="285" x2="1031" y2="331" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />

  
  <rect x="415" y="341" width="770" height="74" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="800" dy="0">source address, source port,</tspan>
    <tspan x="800" dy="28">destination address, destination port, protocol</tspan>
  </text>

  
  <rect x="415" y="425" width="770" height="46" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <line x1="569" y1="425" x2="569" y2="471" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="723" y1="425" x2="723" y2="471" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="877" y1="425" x2="877" y2="471" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="1031" y1="425" x2="1031" y2="471" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />

  
  <rect x="415" y="481" width="770" height="46" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <line x1="569" y1="481" x2="569" y2="527" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="723" y1="481" x2="723" y2="527" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="877" y1="481" x2="877" y2="527" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="1031" y1="481" x2="1031" y2="527" stroke="#207448" stroke-width="1.5" stroke-dasharray="4,4" />


  
  <rect x="1250" y="140" width="310" height="430" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="2" />

  
  <g transform="translate(1365, 170)">
    
    <rect x="0" y="0" width="80" height="120" rx="4" fill="#faeee3" stroke="#db8129" stroke-width="4" />
    
    <rect x="8" y="8" width="64" height="104" rx="2" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="20" cy="60" r="5" fill="#db8129" />
    
    <line x1="12" y1="36" x2="68" y2="84" stroke="#db8129" stroke-width="4" />
    <line x1="12" y1="84" x2="68" y2="36" stroke="#db8129" stroke-width="4" />
  </g>

  
  <line x1="1520" y1="200" x2="1455" y2="200" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <line x1="1520" y1="230" x2="1455" y2="230" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <line x1="1520" y1="260" x2="1455" y2="260" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <text x="1405" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">
    <tspan x="1405" dy="0">new connection:</tspan>
    <tspan x="1405" dy="32">no space, cannot be made</tspan>
  </text>


  

  
  <rect x="40" y="600" width="530" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="80" cy="640" r="24" fill="#207448" />
  <text x="80" y="649" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <g transform="translate(118, 620)">
    <rect x="0" y="0" width="36" height="28" rx="3" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="6" y1="12" x2="14" y2="18" stroke="#207448" stroke-width="2.5" />
    <line x1="14" y1="18" x2="6" y2="24" stroke="#207448" stroke-width="2.5" />
    <line x1="18" y1="24" x2="28" y2="24" stroke="#207448" stroke-width="2.5" />
  </g>
  
  <text x="65" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="65" dy="0" font-weight="bold">Read the two numbers:</tspan>
    <tspan x="65" dy="30" font-family="'SF Mono', Consolas, Menlo, monospace">sysctl net.netfilter.</tspan>
    <tspan x="65" dy="28" font-family="'SF Mono', Consolas, Menlo, monospace">nf_conntrack_count</tspan>
    <tspan x="65" dy="28" font-family="'SF Mono', Consolas, Menlo, monospace">and nf_conntrack_max</tspan>
  </text>

  
  <rect x="590" y="600" width="330" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="630" cy="640" r="24" fill="#207448" />
  <text x="630" y="649" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  
  <g transform="translate(670, 616)">
    <circle cx="20" cy="8" r="3.5" fill="#207448" />
    <line x1="8" y1="20" x2="32" y2="20" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="20" cy="32" r="3.5" fill="#207448" />
  </g>
  
  <text x="615" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="615" dy="0">Divide:</tspan>
    <tspan x="615" dy="32">count / max</tspan>
  </text>

  
  <rect x="940" y="600" width="620" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <circle cx="980" cy="640" r="24" fill="#207448" />
  <text x="980" y="649" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  
  <g transform="translate(1018, 618)">
    <line x1="4" y1="36" x2="44" y2="36" stroke="#207448" stroke-width="3" />
    <line x1="4" y1="4" x2="4" y2="36" stroke="#207448" stroke-width="3" />
    <polyline points="6,30 18,14 30,22 42,6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <text x="965" y="688" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="965" dy="0" font-weight="bold">Watch the trend: read twice;</tspan>
    <tspan x="965" dy="30">climbing and staying = flows arrive</tspan>
    <tspan x="965" dy="28">faster than they leave;</tspan>
    <tspan x="965" dy="28">rising then falling = a burst</tspan>
  </text>

  
  <rect x="40" y="795" width="1520" height="58" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 804)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="20,10 20,20 28,24" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <text x="120" y="833" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">Established timeout default: 432000 seconds, five days</text>


  

  
  <rect x="40" y="875" width="740" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(68, 895)">
    <circle cx="24" cy="24" r="14" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M24,4 L24,10 M24,38 L24,44 M4,24 L10,24 M38,24 L44,24 M10,10 L14,14 M34,34 L38,38 M10,38 L14,34 M34,10 L38,14" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <text x="68" y="968" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="68" dy="0">Kube-proxy Service load balancing through iptables</tspan>
    <tspan x="68" dy="32">depends on conntrack, so a full table looks like</tspan>
    <tspan x="68" dy="32">Service flakiness; pods on one node share that</tspan>
    <tspan x="68" dy="32">node's table.</tspan>
  </text>

  
  <rect x="820" y="875" width="740" height="215" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(848, 895)">
    <path d="M38,6 C32,2 24,4 20,10 L8,22 C6,24 6,28 8,30 L16,38 C18,40 22,40 24,38 L36,26 C42,22 44,14 40,8 L32,16 L26,14 L24,8 Z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
  </g>
  
  <text x="848" y="972" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="848" dy="0">raise the maximum if memory allows,</tspan>
    <tspan x="848" dy="34">reuse connections,</tspan>
    <tspan x="848" dy="34">find the client opening connections in a loop</tspan>
  </text>


  
  <rect x="40" y="1115" width="1520" height="60" rx="12" fill="#207448" />
  <text x="800" y="1153" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">For any new connections fail, old ones work symptom, compare conntrack count to max first.</text>

</svg>