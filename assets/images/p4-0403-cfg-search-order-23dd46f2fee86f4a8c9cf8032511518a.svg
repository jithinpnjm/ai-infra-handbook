<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which ansible.cfg wins: the search order and the precedence of settings</title>
  <desc>Visual infographic explaining the search order of ansible.cfg files (first found wins, never merged) and the precedence of configuration settings from flags down to defaults.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" y="84">Which ansible.cfg wins: </tspan>
    <tspan x="800" y="130">the search order and the precedence of settings</tspan>
  </text>

  
  <g id="ladder-1">
    <rect x="40" y="172" width="740" height="446" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="64" y="208">Which file is read </tspan>
      <tspan x="64" y="240">(first found wins, never merged)</tspan>
    </text>

    
    <rect x="56" y="260" width="708" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="88" cy="290" r="24" fill="#207448" />
    <text x="88" y="299" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(124, 274)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="40" height="28" rx="5" />
      <path d="M 9 10 L 17 16 L 9 22" />
      <line x1="21" y1="22" x2="31" y2="22" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="180" y="298" font-family="monospace" font-weight="bold">ANSIBLE_CONFIG </tspan>
      <tspan x="382" y="298" font-family="sans-serif">environment variable</tspan>
    </text>

    
    <rect x="56" y="326" width="708" height="150" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="88" cy="364" r="24" fill="#207448" />
    <text x="88" y="373" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(124, 347)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 3 10 L 14 10 L 19 15 L 35 15 A 3 3 0 0 1 38 18 L 38 33 A 3 3 0 0 1 35 36 L 3 36 A 3 3 0 0 1 0 33 L 0 13 A 3 3 0 0 1 3 10 Z" />
      <rect x="15" y="20" width="13" height="11" rx="2" fill="#e8f1ea" />
      <path d="M 18 20 V 15 C 18 13 25 13 25 15 V 20" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="180" y="364" font-family="monospace" font-weight="bold">./ansible.cfg </tspan>
      <tspan x="180" y="391" font-family="sans-serif">in the current directory </tspan>
      <tspan x="72" y="423">(honoured only if it is not world-writable: a </tspan>
      <tspan x="72" y="451">folder any user can change cannot be trusted)</tspan>
    </text>

    
    <rect x="56" y="482" width="708" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="88" cy="512" r="24" fill="#207448" />
    <text x="88" y="521" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(124, 495)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 5 18 L 19 5 L 33 18 V 32 A 2 2 0 0 1 31 34 H 7 A 2 2 0 0 1 5 32 Z" />
      <path d="M 14 34 V 20 H 24 V 34" />
    </g>
    <text x="180" y="520" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">~/.ansible.cfg</text>

    
    <rect x="56" y="548" width="708" height="60" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="88" cy="578" r="24" fill="#207448" />
    <text x="88" y="587" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(124, 564)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="32" height="24" rx="3" />
      <line x1="3" y1="11" x2="35" y2="11" />
      <line x1="3" y1="19" x2="35" y2="19" />
      <circle cx="29" cy="7" r="1.5" fill="#207448" />
      <circle cx="29" cy="15" r="1.5" fill="#207448" />
      <circle cx="29" cy="23" r="1.5" fill="#207448" />
    </g>
    <text x="180" y="586" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">/etc/ansible/ansible.cfg</text>
  </g>

  
  <g id="ladder-2">
    <rect x="820" y="172" width="740" height="446" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    
    <text x="844" y="224" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Which value wins</text>

    
    <rect x="836" y="260" width="708" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="868" cy="301" r="24" fill="#207448" />
    <text x="868" y="310" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <g transform="translate(904, 283)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="10" y1="4" x2="10" y2="34" />
      <polygon points="10,6 34,13 10,20" fill="#e8f1ea" />
      <line x1="5" y1="34" x2="15" y2="34" />
    </g>
    <text x="960" y="311" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">command-line flags</text>

    
    <rect x="836" y="348" width="708" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="868" cy="389" r="24" fill="#207448" />
    <text x="868" y="398" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <g transform="translate(904, 372)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 5 C 6 5 6 16 2 18 C 6 20 6 31 12 31" />
      <path d="M 26 5 C 32 5 32 16 36 18 C 32 20 32 31 26 31" />
      <line x1="16" y1="18" x2="22" y2="18" />
    </g>
    <text x="960" y="399" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">environment variables</text>

    
    <rect x="836" y="436" width="708" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="868" cy="477" r="24" fill="#207448" />
    <text x="868" y="486" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <g transform="translate(904, 459)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 5 L 24 5 L 34 15 L 34 34 A 2 2 0 0 1 32 36 L 10 36 A 2 2 0 0 1 8 34 Z" />
      <polyline points="24,5 24,15 34,15" />
      <line x1="14" y1="22" x2="28" y2="22" />
      <line x1="14" y1="28" x2="24" y2="28" />
    </g>
    <text x="960" y="487" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">config file</text>

    
    <rect x="836" y="524" width="708" height="82" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <circle cx="868" cy="565" r="24" fill="#207448" />
    <text x="868" y="574" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    <g transform="translate(904, 548)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="15" width="32" height="17" rx="3" />
      <line x1="5" y1="23" x2="37" y2="23" />
      <line x1="21" y1="23" x2="21" y2="32" />
      <path d="M 14 15 V 6 L 28 6 V 15" />
    </g>
    <text x="960" y="575" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">defaults</text>
  </g>

  
  <g id="commands-strip">
    <rect x="40" y="658" width="1520" height="116" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(64, 698)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="44" height="32" rx="5" />
      <path d="M 11 12 L 19 18 L 11 24" />
      <line x1="23" y1="24" x2="35" y2="24" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" y="696"><tspan font-family="monospace" font-weight="bold">ansible-config dump --only-changed</tspan> shows only what you changed; </tspan>
      <tspan x="136" y="724"><tspan font-family="monospace" font-weight="bold">ansible-config list</tspan> shows every setting with its default; </tspan>
      <tspan x="136" y="752"><tspan font-family="monospace" font-weight="bold">ansible --version</tspan> shows the config file in use</tspan>
    </text>
  </g>

  
  <g id="surprise-story">
    <rect x="40" y="814" width="1520" height="88" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
    
    <g transform="translate(64, 840)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22,3 42,35 2,35" />
      <line x1="22" y1="13" x2="22" y2="23" />
      <circle cx="22" cy="29" r="1.5" fill="#db8129" stroke="none" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" y="852">an engineer runs Ansible from a folder they did not expect, </tspan>
      <tspan x="136" y="880">and the tool quietly picks up a different config file</tspan>
    </text>
  </g>

  
  <g id="rules-strip">
    <rect x="40" y="942" width="1520" height="116" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(64, 981)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 3 L 39 10 V 21 C 39 31 22 37 22 37 C 22 37 5 31 5 21 V 10 Z" />
      <polyline points="15,21 20,26 30,14" />
    </g>
    <text font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="136" y="980">keep a project-level <tspan font-family="monospace" font-weight="bold">ansible.cfg</tspan> in the repo root; </tspan>
      <tspan x="136" y="1008">keep secrets and personal paths out of it because it is committed; </tspan>
      <tspan x="136" y="1036">editing <tspan font-family="monospace" font-weight="bold">/etc/ansible</tspan> changes behaviour between laptops and CI and is invisible to Git</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1098" width="1520" height="60" rx="10" fill="#207448" />
    <text x="800" y="1136" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Knowing the search order turns a surprise into a quick check</text>
  </g>
</svg>