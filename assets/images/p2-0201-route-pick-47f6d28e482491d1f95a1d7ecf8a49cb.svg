<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The kernel picks a road by longest matching prefix, and the default route catches the rest</title>
  <desc>Visual flowchart of Linux kernel routing decision from connect() syscall through subnet matching, default gateway selection, source IP and ephemeral port assignment, and routing failure modes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" font-family="sans-serif, system-ui, -apple-system" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">The kernel picks a road by longest matching prefix,</text>
  <text x="800" y="104" font-family="sans-serif, system-ui, -apple-system" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">and the default route catches the rest</text>

  
  <g id="step-1">
    <rect x="180" y="135" width="1140" height="90" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="236" cy="180" r="24" fill="#207448"/>
    <text x="236" y="180" font-family="sans-serif, system-ui, -apple-system" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
    
    <g transform="translate(285, 155)">
      <circle cx="25" cy="25" r="21" stroke="#207448" stroke-width="3.5" fill="none"/>
      <ellipse cx="25" cy="25" rx="9" ry="21" stroke="#207448" stroke-width="3" fill="none"/>
      <line x1="4" y1="25" x2="46" y2="25" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="365" y="190" font-family="monospace, Courier New, Courier, monospace" font-size="30" font-weight="bold" fill="#303a36">connect() to 93.184.216.34 port 443</text>
  </g>

  
  <line x1="750" y1="225" x2="750" y2="263" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="decision-diamond">
    <polygon points="750,265 1070,345 750,425 430,345" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(728, 283)">
      <circle cx="22" cy="7" r="6" stroke="#207448" stroke-width="3" fill="none"/>
      <circle cx="8" cy="27" r="6" stroke="#207448" stroke-width="3" fill="none"/>
      <circle cx="36" cy="27" r="6" stroke="#207448" stroke-width="3" fill="none"/>
      <path d="M22 13 v6 M22 19 l-10 4 M22 19 l10 4" stroke="#207448" stroke-width="2.5" fill="none"/>
    </g>
    
    <text x="750" y="347" font-family="sans-serif, system-ui, -apple-system" font-size="27" font-weight="bold" fill="#303a36" text-anchor="middle">
      <tspan x="750" dy="0">Inside a connected subnet,</tspan>
      <tspan x="750" dy="34">such as 10.0.0.0/24?</tspan>
    </text>
  </g>

  
  <line x1="1070" y1="345" x2="1128" y2="345" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="1099" y="335" font-family="sans-serif, system-ui, -apple-system" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">yes</text>

  
  <g id="neighbour-box">
    <rect x="1130" y="295" width="410" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <g transform="translate(1148, 320)">
      <rect x="0" y="10" width="20" height="16" rx="2" stroke="#207448" stroke-width="3" fill="none"/>
      <rect x="36" y="10" width="20" height="16" rx="2" stroke="#207448" stroke-width="3" fill="none"/>
      <line x1="20" y1="18" x2="36" y2="18" stroke="#207448" stroke-width="3.5"/>
      <path d="M10 26 v12 h36 v-12" stroke="#207448" stroke-width="2.5" fill="none"/>
    </g>
    
    <text x="1222" y="337" font-family="sans-serif, system-ui, -apple-system" font-size="25" font-weight="bold" fill="#303a36">
      <tspan x="1222" dy="0">Send straight to the</tspan>
      <tspan x="1222" dy="32">neighbour on the link</tspan>
    </text>
  </g>

  
  <line x1="750" y1="425" x2="750" y2="463" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="765" y="450" font-family="sans-serif, system-ui, -apple-system" font-size="26" font-weight="bold" fill="#207448" text-anchor="start">no</text>

  
  <g id="step-2">
    <rect x="180" y="465" width="1140" height="120" rx="12" fill="#fff9f2" stroke="#db8129" stroke-width="4"/>
    
    <circle cx="236" cy="525" r="24" fill="#207448"/>
    <text x="236" y="525" font-family="sans-serif, system-ui, -apple-system" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
    
    <g transform="translate(285, 498)">
      <circle cx="27" cy="27" r="23" stroke="#db8129" stroke-width="3.5" fill="none"/>
      <path d="M14 27 h26 M34 21 l6 6 -6 6" stroke="#db8129" stroke-width="3" fill="none"/>
      <path d="M40 27 h-26 M20 21 l-6 6 6 6" stroke="#db8129" stroke-width="3" fill="none"/>
    </g>
    
    <text x="365" y="517" font-family="sans-serif, system-ui, -apple-system" font-size="30" font-weight="bold" fill="#303a36">Default route: default via 10.0.0.1 (0.0.0.0/0)</text>
    <text x="365" y="557" font-family="sans-serif, system-ui, -apple-system" font-size="25" fill="#303a36">longest matching prefix wins, default catches the rest</text>
  </g>

  
  <line x1="750" y1="585" x2="750" y2="623" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="step-3">
    <rect x="180" y="625" width="1140" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="236" cy="680" r="24" fill="#207448"/>
    <text x="236" y="680" font-family="sans-serif, system-ui, -apple-system" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
    
    <g transform="translate(285, 653)">
      <rect x="3" y="4" width="46" height="34" rx="4" stroke="#207448" stroke-width="3.5" fill="none"/>
      <rect x="13" y="14" width="16" height="14" rx="2" stroke="#207448" stroke-width="2.5" fill="none"/>
      <line x1="9" y1="38" x2="9" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="19" y1="38" x2="19" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="29" y1="38" x2="29" y2="46" stroke="#207448" stroke-width="3"/>
      <line x1="39" y1="38" x2="39" y2="46" stroke="#207448" stroke-width="3"/>
    </g>
    
    <text x="365" y="670" font-family="sans-serif, system-ui, -apple-system" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="365" dy="0">Source IP: primary address in the next hop's subnet,</tspan>
      <tspan x="365" dy="38" font-size="26">here src 10.0.0.15</tspan>
    </text>
  </g>

  
  <line x1="750" y1="735" x2="750" y2="773" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <g id="step-4">
    <rect x="180" y="775" width="1140" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <circle cx="236" cy="830" r="24" fill="#207448"/>
    <text x="236" y="830" font-family="sans-serif, system-ui, -apple-system" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
    
    <g transform="translate(285, 803)">
      <rect x="4" y="6" width="44" height="32" rx="4" stroke="#207448" stroke-width="3.5" fill="none"/>
      <rect x="18" y="38" width="16" height="10" stroke="#207448" stroke-width="3" fill="none"/>
      <circle cx="17" cy="22" r="3.5" fill="#207448"/>
      <circle cx="35" cy="22" r="3.5" fill="#207448"/>
    </g>
    
    <text x="365" y="820" font-family="sans-serif, system-ui, -apple-system" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="365" dy="0">Source port: ephemeral, from 32768 to 60999,</tspan>
      <tspan x="365" dy="38" font-size="26" font-weight="normal">which makes the 5-tuple unique</tspan>
    </text>
  </g>

  
  <g id="error-box-left">
    <rect x="60" y="925" width="715" height="105" rx="12" fill="#ecefeSet" style="fill:#edf0ee" stroke="#8a9992" stroke-width="2.5"/>
    
    <g transform="translate(85, 952)">
      <path d="M26 6 l23 40 h-46 z" stroke="#718079" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
      <line x1="26" y1="20" x2="26" y2="31" stroke="#718079" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="26" cy="38" r="2" fill="#718079"/>
    </g>
    
    <text x="155" y="967" font-family="sans-serif, system-ui, -apple-system" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="155" dy="0">No route at all:</tspan>
      <tspan x="155" dy="34" font-size="24">Network is unreachable (ENETUNREACH)</tspan>
    </text>
  </g>

  <g id="error-box-right">
    <rect x="825" y="925" width="715" height="105" rx="12" fill="#edf0ee" stroke="#8a9992" stroke-width="2.5"/>
    
    <g transform="translate(850, 952)">
      <rect x="4" y="6" width="44" height="30" rx="3" stroke="#718079" stroke-width="3.5" fill="none"/>
      <line x1="16" y1="36" x2="36" y2="36" stroke="#718079" stroke-width="3.5"/>
      <line x1="26" y1="36" x2="26" y2="44" stroke="#718079" stroke-width="3.5"/>
      <line x1="14" y1="44" x2="38" y2="44" stroke="#718079" stroke-width="3.5"/>
      <line x1="18" y1="14" x2="34" y2="28" stroke="#718079" stroke-width="3"/>
      <line x1="34" y1="14" x2="18" y2="28" stroke="#718079" stroke-width="3"/>
    </g>
    
    <text x="915" y="967" font-family="sans-serif, system-ui, -apple-system" font-size="26" font-weight="bold" fill="#303a36">
      <tspan x="915" dy="0">Route exists, next hop cannot be resolved:</tspan>
      <tspan x="915" dy="34" font-size="24">No route to host (EHOSTUNREACH)</tspan>
    </text>
  </g>

  
  <g id="bottom-strip">
    <rect x="60" y="1070" width="1480" height="80" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5"/>
    
    <rect x="85" y="1085" width="455" height="50" rx="8" fill="#207448"/>
    <text x="312" y="1119" font-family="monospace, Courier New, Courier, monospace" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">ip route get 93.184.216.34</text>
    
    <text x="575" y="1120" font-family="sans-serif, system-ui, -apple-system" font-size="26" font-weight="bold" fill="#303a36">Run ip route get first when a connection fails right away.</text>
  </g>
</svg>