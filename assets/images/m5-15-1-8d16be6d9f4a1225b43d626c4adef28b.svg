<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How enforcement works in the kernel</title>
  <desc>Decision flowchart showing kernel-level network policy enforcement across conntrack, AdminNetworkPolicy, Namespace NetworkPolicy, and BaselineAdminNetworkPolicy.</desc>

  <defs>
    
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">How enforcement works in the kernel</text>

  

  
  <path d="M 800 175 L 800 230" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 500 282 L 245 282 L 245 295" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 650 335 L 650 435" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 500 487 L 245 487 L 245 500" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 650 540 L 650 640" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1100 692 L 1345 692 L 1345 705" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 650 745 L 650 845" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 500 900 L 245 900 L 245 1045" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <path d="M 1100 900 L 1345 900 L 1345 1045" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  

  
  <rect x="235" y="242" width="245" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="357" y="267" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Yes: Stateful Reply</text>

  
  <rect x="680" y="367" width="370" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="865" y="392" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No: New Connection (SYN)</text>

  
  <rect x="235" y="447" width="250" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="360" y="472" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Action: Allow / Deny</text>

  
  <rect x="680" y="572" width="370" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="865" y="597" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Action: Pass / No Match</text>

  
  <rect x="1115" y="652" width="220" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1225" y="677" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No: Non-Isolated</text>

  
  <rect x="680" y="777" width="240" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="802" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Yes: Isolated</text>

  
  <rect x="330" y="860" width="85" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="372" y="885" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Yes</text>

  
  <rect x="1185" y="860" width="85" height="36" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="1227" y="885" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">No</text>

  

  
  <g id="node-pkt">
    <rect x="500" y="80" width="600" height="95" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(522, 100)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="10" width="48" height="34" rx="4" />
      <path d="M 4 22 L 52 22" />
      <path d="M 16 4 L 28 4 M 22 4 L 22 10" />
      <path d="M 32 44 L 44 44 M 38 38 L 38 44" />
    </g>
    <text x="595" y="117" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Packet Leaving Source Pod</text>
    <text x="595" y="153" font-family="sans-serif" font-size="24" fill="#303a36">or Arriving at Dest Pod</text>
  </g>

  
  <g id="node-ct">
    <rect x="500" y="230" width="600" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(522, 255)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="48" height="44" rx="4" />
      <path d="M 4 20 L 52 20" />
      <path d="M 4 34 L 52 34" />
      <path d="M 28 6 L 28 50" />
    </g>
    <text x="595" y="271" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Existing Established Flow</text>
    <text x="595" y="309" font-family="sans-serif" font-size="24" fill="#303a36">in conntrack / BPF CT Map?</text>
  </g>

  
  <g id="node-allowct">
    <rect x="40" y="295" width="410" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(62, 320)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <path d="M 18 26 L 25 33 L 38 18" />
    </g>
    <text x="135" y="358" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ALLOW immediately</text>
  </g>

  
  <g id="node-anp">
    <rect x="500" y="435" width="600" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(522, 460)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <path d="M 20 22 L 36 22 M 20 30 L 36 30 M 28 16 L 28 36" />
    </g>
    <text x="595" y="476" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">1. AdminNetworkPolicy</text>
    <text x="595" y="514" font-family="sans-serif" font-size="24" fill="#303a36">(Cluster Guardrails)</text>
  </g>

  
  <g id="node-verdict1">
    <rect x="40" y="500" width="410" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(62, 525)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="10" y="10" width="18" height="12" rx="2" transform="rotate(-45 19 16)" />
      <path d="M 23 20 L 44 41" />
      <path d="M 12 44 L 34 44" />
    </g>
    <text x="135" y="543" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Enforce Admin</text>
    <text x="135" y="581" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Verdict</text>
  </g>

  
  <g id="node-np">
    <rect x="500" y="640" width="600" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(522, 665)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="10" width="44" height="36" rx="4" />
      <circle cx="28" cy="28" r="8" />
      <path d="M 14 10 L 14 6 L 42 6 L 42 10" />
    </g>
    <text x="595" y="681" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">2. Namespace NetworkPolicy</text>
    <text x="595" y="719" font-family="sans-serif" font-size="24" fill="#303a36">Is Pod Isolated for Direction?</text>
  </g>

  
  <g id="node-banp">
    <rect x="1130" y="705" width="430" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(1317, 720)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="6" y="32" width="44" height="14" rx="2" />
      <rect x="12" y="18" width="32" height="14" rx="2" />
      <path d="M 28 6 L 28 18" />
    </g>
    <text x="1345" y="798" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">3. BaselineAdminNetworkPolicy</text>
    <text x="1345" y="832" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">(Default Cluster Posture)</text>
  </g>

  
  <g id="node-matchnp">
    <rect x="500" y="845" width="600" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(522, 872)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="20" cy="28" r="14" />
      <circle cx="36" cy="28" r="14" />
      <path d="M 28 17 L 28 39" />
    </g>
    <text x="595" y="885" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Matches Union of</text>
    <text x="595" y="925" font-family="sans-serif" font-size="24" fill="#303a36">Calico ipsets / Cilium Identities?</text>
  </g>

  
  <g id="node-allownp">
    <rect x="40" y="1045" width="410" height="105" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="4" />
    
    <g transform="translate(62, 1070)" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 24 6 L 44 14 C 44 32 24 44 24 44 C 24 44 6 32 6 14 Z" />
      <path d="M 14 24 L 20 30 L 32 16" />
      <path d="M 40 34 L 50 34 M 45 29 L 45 39" />
    </g>
    <text x="135" y="1088" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">ALLOW +</text>
    <text x="135" y="1126" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Create CT Entry</text>
  </g>

  
  <g id="node-dropnp">
    <rect x="1130" y="1045" width="430" height="105" rx="12" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(1152, 1070)" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 28 6 L 48 14 C 48 34 28 48 28 48 C 28 48 8 34 8 14 Z" />
      <path d="M 18 18 L 38 34 M 38 18 L 18 34" />
    </g>
    <text x="1225" y="1088" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">DROP</text>
    <text x="1225" y="1126" font-family="sans-serif" font-size="24" fill="#303a36">(Log / Hubble DROPPED)</text>
  </g>
</svg>