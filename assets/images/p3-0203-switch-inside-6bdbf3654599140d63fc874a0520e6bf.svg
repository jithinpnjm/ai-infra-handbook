<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Inside a switch: four steps, three speeds, and where queues fill</title>
  <desc>Visual infographic explaining switch pipeline steps, speed tiers, virtual output queues, iSLIP arbitration, and incast queue buildup.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#db8129"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Inside a switch: four steps, three speeds, and where queues fill</text>

  

  
  <g filter="url(#shadow)">
    <rect x="35" y="110" width="352" height="295" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  
  <g transform="translate(183, 125)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="22"/>
    <path d="M 28 6 A 22 22 0 0 1 50 28" stroke-width="4" stroke-linecap="round"/>
    <polygon points="46,24 54,28 46,32" fill="#207448"/>
    <circle cx="28" cy="28" r="10" stroke-dasharray="4 4" stroke-width="2"/>
    <circle cx="28" cy="6" r="3" fill="#207448"/>
    <circle cx="50" cy="28" r="3" fill="#207448"/>
    <circle cx="28" cy="50" r="3" fill="#207448"/>
    <circle cx="6" cy="28" r="3" fill="#207448"/>
  </g>
  
  <text x="211" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">1 Receive ring:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="211" y="244">the PHY writes into a</tspan>
    <tspan x="211" y="276">ring buffer in memory,</tspan>
    <tspan x="211" y="308">only pointers move,</tspan>
    <tspan x="211" y="340">nothing is copied</tspan>
  </text>

  
  <line x1="387" y1="250" x2="425" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g filter="url(#shadow)">
    <rect x="427" y="110" width="352" height="295" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  
  <g transform="translate(575, 125)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="8" y="8" width="40" height="40" rx="4"/>
    <line x1="20" y1="2" x2="20" y2="8"/>
    <line x1="28" y1="2" x2="28" y2="8"/>
    <line x1="36" y1="2" x2="36" y2="8"/>
    <line x1="20" y1="48" x2="20" y2="54"/>
    <line x1="28" y1="48" x2="28" y2="54"/>
    <line x1="36" y1="48" x2="36" y2="54"/>
    <circle cx="28" cy="28" r="8"/>
    <line x1="34" y1="34" x2="42" y2="42"/>
  </g>
  
  <text x="603" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">2 Process:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="603" y="238">look up the destination</tspan>
    <tspan x="603" y="266">in the MAC table</tspan>
    <tspan x="603" y="294">(switching) or the FIB</tspan>
    <tspan x="603" y="322">(routing), then apply</tspan>
    <tspan x="603" y="350">filters, NAT and</tspan>
    <tspan x="603" y="378">QoS marking</tspan>
  </text>

  
  <line x1="779" y1="250" x2="817" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g filter="url(#shadow)">
    <rect x="819" y="110" width="352" height="295" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  
  <g transform="translate(967, 125)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="4" width="48" height="48" rx="6"/>
    <line x1="4" y1="28" x2="52" y2="28"/>
    <line x1="28" y1="4" x2="28" y2="52"/>
    <line x1="12" y1="12" x2="44" y2="44"/>
    <line x1="12" y1="44" x2="44" y2="12"/>
    <circle cx="28" cy="28" r="4" fill="#207448"/>
  </g>
  
  <text x="995" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">3 Cross the device:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="995" y="244">shared memory pool in</tspan>
    <tspan x="995" y="276">small devices, internal</tspan>
    <tspan x="995" y="308">fabric or crossbar in</tspan>
    <tspan x="995" y="340">larger ones</tspan>
  </text>

  
  <line x1="1171" y1="250" x2="1209" y2="250" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)"/>

  
  <g filter="url(#shadow)">
    <rect x="1211" y="110" width="352" height="295" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  
  <g transform="translate(1359, 125)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="14" width="28" height="28" rx="4"/>
    <line x1="13" y1="14" x2="13" y2="42"/>
    <line x1="22" y1="14" x2="22" y2="42"/>
    <path d="M 32 28 L 52 28" stroke-linecap="round"/>
    <polygon points="46,24 54,28 46,32" fill="#207448"/>
  </g>
  
  <text x="1387" y="208" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">4 Transmit ring:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
    <tspan x="1387" y="254">queueing and egress</tspan>
    <tspan x="1387" y="286">QoS scheduling, then</tspan>
    <tspan x="1387" y="318">onto the wire</tspan>
  </text>

  

  
  <g filter="url(#shadow)">
    <rect x="35" y="425" width="1530" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  <g transform="translate(55, 432)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="8" y="8" width="40" height="40" rx="4"/>
    <circle cx="28" cy="28" r="10"/>
    <line x1="28" y1="2" x2="28" y2="8"/>
    <line x1="28" y1="48" x2="28" y2="54"/>
    <line x1="2" y1="28" x2="8" y2="28"/>
    <line x1="48" y1="28" x2="54" y2="28"/>
  </g>
  <text x="130" y="469" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Process switching:</text>
  <text x="440" y="469" font-family="sans-serif" font-size="24" fill="#303a36">the CPU is interrupted and schedules a process, the slow path</text>

  
  <g filter="url(#shadow)">
    <rect x="35" y="507" width="1530" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  <g transform="translate(55, 514)" stroke="#207448" stroke-width="4" fill="none">
    <polygon points="32,4 12,30 26,30 20,52 44,22 30,22" fill="none"/>
  </g>
  <text x="130" y="551" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Interrupt-context switching:</text>
  <text x="590" y="551" font-family="sans-serif" font-size="24" fill="#303a36">the interrupt handler switches the packet, moderate</text>

  
  <g filter="url(#shadow)">
    <rect x="35" y="589" width="1530" height="88" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="3"/>
  </g>
  <g transform="translate(55, 605)" stroke="#db8129" stroke-width="4" fill="none">
    <rect x="6" y="6" width="44" height="44" rx="6"/>
    <path d="M 16 16 L 40 16 L 40 40 L 16 40 Z"/>
    <line x1="16" y1="28" x2="40" y2="28"/>
    <line x1="28" y1="16" x2="28" y2="40"/>
  </g>
  <text x="130" y="643" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">ASIC or NPU hardware switching:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="655" y="630">TCAM, SRAM and HBM, pipelines and recirculation,</tspan>
    <tspan x="655" y="660">line rate, 12.8 to 51.2 Tb/s per chip</tspan>
  </text>

  

  
  <g filter="url(#shadow)">
    <rect x="35" y="695" width="990" height="420" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>

  
  <g transform="translate(55, 712)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="4" y="6" width="48" height="12" rx="2"/>
    <rect x="4" y="22" width="48" height="12" rx="2"/>
    <rect x="4" y="38" width="48" height="12" rx="2"/>
    <line x1="16" y1="6" x2="16" y2="18"/>
    <line x1="28" y1="6" x2="28" y2="18"/>
    <line x1="16" y1="22" x2="16" y2="34"/>
    <line x1="28" y1="22" x2="28" y2="34"/>
    <line x1="16" y1="38" x2="16" y2="50"/>
    <line x1="28" y1="38" x2="28" y2="50"/>
  </g>
  <text x="125" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Virtual output queues:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" y="774">a separate queue per output at each input, avoiding head-of-line blocking</tspan>
    <tspan x="125" y="804">(the first car waiting for a busy road holds up cars for a free road)</tspan>
  </text>

  
  <g transform="translate(320, 830)">
    
    <rect x="0" y="0" width="100" height="24" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="25" y1="0" x2="25" y2="24" stroke="#207448" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="24" stroke="#207448" stroke-width="2"/>
    <line x1="75" y1="0" x2="75" y2="24" stroke="#207448" stroke-width="2"/>

    <rect x="0" y="38" width="100" height="24" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="25" y1="38" x2="25" y2="62" stroke="#207448" stroke-width="2"/>
    <line x1="50" y1="38" x2="50" y2="62" stroke="#207448" stroke-width="2"/>
    <line x1="75" y1="38" x2="75" y2="62" stroke="#207448" stroke-width="2"/>

    <rect x="0" y="76" width="100" height="24" rx="3" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <line x1="25" y1="76" x2="25" y2="100" stroke="#207448" stroke-width="2"/>
    <line x1="50" y1="76" x2="50" y2="100" stroke="#207448" stroke-width="2"/>
    <line x1="75" y1="76" x2="75" y2="100" stroke="#207448" stroke-width="2"/>

    
    <line x1="100" y1="12" x2="310" y2="12" stroke="#207448" stroke-width="3"/>
    <line x1="100" y1="50" x2="310" y2="50" stroke="#207448" stroke-width="3"/>
    <line x1="100" y1="88" x2="310" y2="88" stroke="#207448" stroke-width="3"/>

    <line x1="160" y1="0" x2="160" y2="100" stroke="#207448" stroke-width="3"/>
    <line x1="210" y1="0" x2="210" y2="100" stroke="#207448" stroke-width="3"/>
    <line x1="260" y1="0" x2="260" y2="100" stroke="#207448" stroke-width="3"/>

    
    <circle cx="160" cy="12" r="6" fill="#207448"/>
    <circle cx="210" cy="50" r="6" fill="#207448"/>
    <circle cx="260" cy="88" r="6" fill="#207448"/>
    <circle cx="210" cy="12" r="3" fill="#7ba88a"/>
    <circle cx="260" cy="12" r="3" fill="#7ba88a"/>
    <circle cx="160" cy="50" r="3" fill="#7ba88a"/>
    <circle cx="260" cy="50" r="3" fill="#7ba88a"/>
    <circle cx="160" cy="88" r="3" fill="#7ba88a"/>
    <circle cx="210" cy="88" r="3" fill="#7ba88a"/>

    
    <line x1="310" y1="12" x2="350" y2="12" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <line x1="310" y1="50" x2="350" y2="50" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
    <line x1="310" y1="88" x2="350" y2="88" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  
  <g transform="translate(55, 960)" stroke="#207448" stroke-width="4" fill="none">
    <circle cx="28" cy="28" r="22"/>
    <path d="M 28 6 A 22 22 0 0 1 50 28" stroke-linecap="round"/>
    <path d="M 28 50 A 22 22 0 0 1 6 28" stroke-linecap="round"/>
    <polygon points="46,24 54,28 46,32" fill="#207448"/>
    <polygon points="10,32 2,28 10,24" fill="#207448"/>
  </g>
  <text x="125" y="988" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">iSLIP:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="125" y="1022">request, grant, accept over several iterations picks</tspan>
    <tspan x="125" y="1054">non-conflicting input and output pairs each cycle</tspan>
  </text>

  
  <g filter="url(#shadow)">
    <rect x="1045" y="695" width="520" height="420" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  </g>
  
  <g transform="translate(1065, 712)" stroke="#207448" stroke-width="4" fill="none">
    <polygon points="28,6 52,48 4,48" stroke-linejoin="round"/>
    <line x1="28" y1="20" x2="28" y2="34"/>
    <circle cx="28" cy="41" r="2" fill="#207448"/>
  </g>
  <text x="1135" y="740" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Incast:</text>
  <text font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1065" y="780">many inputs target one output,</tspan>
    <tspan x="1065" y="812">buffers fill; the signature of</tspan>
    <tspan x="1065" y="844">all-reduce, all-to-all and</tspan>
    <tspan x="1065" y="876">storage reads</tspan>
  </text>

  
  <g transform="translate(1065, 915)">
    
    <path d="M 10 10 L 140 50" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M 10 38 L 140 58" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M 10 82 L 140 66" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
    <path d="M 10 110 L 140 74" stroke="#207448" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

    
    <rect x="150" y="32" width="230" height="58" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="3"/>

    
    <rect x="156" y="38" width="38" height="46" rx="3" fill="#db8129"/>
    <rect x="198" y="38" width="38" height="46" rx="3" fill="#db8129"/>
    <rect x="240" y="38" width="38" height="46" rx="3" fill="#db8129"/>
    <rect x="282" y="38" width="38" height="46" rx="3" fill="#db8129"/>
    <rect x="324" y="38" width="50" height="46" rx="3" fill="#e03e3e"/>

    
    <path d="M 380 61 L 460 61" stroke="#db8129" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
  </g>

  
  <g filter="url(#shadow)">
    <rect x="35" y="1130" width="1530" height="50" rx="6" fill="#207448"/>
  </g>
  <text x="800" y="1165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Loss and latency happen in these queues</text>
</svg>