<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" width="1600" height="1450" style="background:#f5f8f5; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Socket buffers: what to raise, what to leave alone, and why</title>
  <desc>Visual explanation of Linux socket buffer tuning, sysctl knobs, BDP calculations, and recommendations.</desc>

  
  <text x="800" y="65" font-size="44" font-weight="bold" fill="#303a36" text-anchor="middle">Socket buffers: what to raise, what to leave alone, and why</text>

  
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="360" height="970" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    
    <g transform="translate(152, 25)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M10 28 h36 M34 18 l12 10 -12 10" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="320" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <path d="M20 30 L300 30" stroke="#207448" stroke-width="8" stroke-linecap="round"/>
      <rect x="40" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <rect x="85" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <rect x="130" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <text x="25" y="90" font-size="24" fill="#303a36">
        <tspan x="25" dy="0" font-weight="bold">send buffer:</tspan>
        <tspan x="25" dy="36">unacknowledged</tspan>
        <tspan x="25" dy="36">data on the</tspan>
        <tspan x="25" dy="36">send side</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 410)">
      <rect x="0" y="0" width="320" height="110" rx="10" fill="#ffffff" stroke="#207448" stroke-width="3"/>
      <path d="M160 -25 L160 0" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>
      <path d="M160 110 L160 135" stroke="#207448" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="160" y="48" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">
        <tspan x="160" dy="0">Linux autotunes</tspan>
        <tspan x="160" dy="34">both within limits</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 560)">
      <rect x="0" y="0" width="320" height="270" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      
      <path d="M20 30 L300 30" stroke="#207448" stroke-width="8" stroke-linecap="round"/>
      <rect x="160" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <rect x="205" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <rect x="250" y="16" width="30" height="28" rx="4" fill="#207448"/>
      <text x="25" y="90" font-size="24" fill="#303a36">
        <tspan x="25" dy="0" font-weight="bold">receive buffer:</tspan>
        <tspan x="25" dy="36">data the application</tspan>
        <tspan x="25" dy="36">has not read yet</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="520" height="970" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(232, 20)">
      <circle cx="16" cy="18" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="18" x2="8" y2="18" stroke="#207448" stroke-width="4"/>
      <line x1="24" y1="18" x2="56" y2="18" stroke="#207448" stroke-width="4"/>
      <circle cx="40" cy="38" r="8" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="0" y1="38" x2="32" y2="38" stroke="#207448" stroke-width="4"/>
      <line x1="48" y1="38" x2="56" y2="38" stroke="#207448" stroke-width="4"/>
    </g>

    
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="480" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-family="monospace">net.ipv4.tcp_rmem and tcp_wmem:</tspan>
        <tspan x="20" dy="34">min default max in bytes,</tspan>
        <tspan x="20" dy="34" font-family="monospace">for example 4096 131072 6291456</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="480" height="155" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-family="monospace">net.core.rmem_max and wmem_max:</tspan>
        <tspan x="20" dy="34">cap for explicit SO_RCVBUF</tspan>
        <tspan x="20" dy="34">and SO_SNDBUF</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 435)">
      <rect x="0" y="0" width="480" height="145" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="20" y="44" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-family="monospace">net.ipv4.tcp_mem:</tspan>
        <tspan x="20" dy="34">system-wide pages, low,</tspan>
        <tspan x="20" dy="34">pressure, high</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 595)">
      <rect x="0" y="0" width="480" height="120" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="20" y="44" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-family="monospace">tcp_moderate_rcvbuf:</tspan>
        <tspan x="20" dy="34">receive autotuning (1)</tspan>
      </text>
    </g>

    
    <g transform="translate(20, 730)">
      <rect x="0" y="0" width="480" height="215" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
      <text x="20" y="38" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-family="monospace">tcp_notsent_lowat:</tspan>
        <tspan x="20" dy="32">limit unsent data queued in the</tspan>
        <tspan x="20" dy="32">send buffer, reduces latency</tspan>
        <tspan x="20" dy="32">and bufferbloat,</tspan>
        <tspan x="20" dy="32" font-family="monospace">for example 131072</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(960, 100)">
    <rect x="0" y="0" width="600" height="970" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(20, 20)">
      
      <g transform="translate(10, 0)">
        <path d="M20 35 L35 15 L50 35 M35 18 L35 50" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="28" font-size="24" font-weight="bold" fill="#207448">
          <tspan x="65" dy="0">For 10 to 100 Gb/s</tspan>
          <tspan x="65" dy="28">long paths raise</tspan>
          <tspan x="65" dy="28">the maxima</tspan>
        </text>
      </g>

      
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="270" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="20" y="55" font-size="24" font-family="monospace" fill="#303a36">
          <tspan x="20" dy="0">tcp_rmem</tspan>
          <tspan x="20" dy="40">4096 131072</tspan>
          <tspan x="20" dy="40">134217728</tspan>
        </text>
      </g>

      <g transform="translate(0, 345)">
        <rect x="0" y="0" width="270" height="200" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="20" y="55" font-size="24" font-family="monospace" fill="#303a36">
          <tspan x="20" dy="0">tcp_wmem</tspan>
          <tspan x="20" dy="40">4096 65536</tspan>
          <tspan x="20" dy="40">134217728</tspan>
        </text>
      </g>

      <g transform="translate(0, 570)">
        <rect x="0" y="0" width="270" height="210" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
        <text x="20" y="55" font-size="24" font-family="monospace" fill="#303a36">
          <tspan x="20" dy="0">rmem_max =</tspan>
          <tspan x="20" dy="40">wmem_max =</tspan>
          <tspan x="20" dy="40">134217728</tspan>
        </text>
      </g>
    </g>

    
    <g transform="translate(310, 20)">
      
      <g transform="translate(10, 10)">
        <polygon points="25,5 50,45 0,45" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round"/>
        <line x1="25" y1="20" x2="25" y2="30" stroke="#db8129" stroke-width="4" stroke-linecap="round"/>
        <circle cx="25" cy="38" r="2" fill="#db8129"/>
        <text x="65" y="38" font-size="34" font-weight="bold" fill="#db8129">Do not</text>
      </g>

      
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="270" height="260" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
        <text x="18" y="38" font-size="24" fill="#303a36">
          <tspan x="18" dy="0">setting SO_RCVBUF</tspan>
          <tspan x="18" dy="32">or SO_SNDBUF in an</tspan>
          <tspan x="18" dy="32">application disables</tspan>
          <tspan x="18" dy="32">autotuning for that</tspan>
          <tspan x="18" dy="32">socket, almost</tspan>
          <tspan x="18" dy="32">always a mistake</tspan>
        </text>
      </g>

      <g transform="translate(0, 380)">
        <rect x="0" y="0" width="270" height="240" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
        <text x="18" y="38" font-size="24" fill="#303a36">
          <tspan x="18" dy="0">huge buffers on</tspan>
          <tspan x="18" dy="32">short-RTT paths add</tspan>
          <tspan x="18" dy="32">memory pressure and</tspan>
          <tspan x="18" dy="32">queueing delay:</tspan>
          <tspan x="18" dy="32">bufferbloat</tspan>
        </text>
      </g>

      <g transform="translate(0, 640)">
        <rect x="0" y="0" width="270" height="260" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2"/>
        <text x="18" y="38" font-size="24" fill="#303a36">
          <tspan x="18" dy="0">a 128 MB buffer on</tspan>
          <tspan x="18" dy="32">each of thousands of</tspan>
          <tspan x="18" dy="32">connections</tspan>
          <tspan x="18" dy="32">exhausts RAM;</tspan>
          <tspan x="18" dy="32">tcp_mem guards</tspan>
          <tspan x="18" dy="32">against it</tspan>
        </text>
      </g>
    </g>
  </g>

  
  <g transform="translate(40, 1100)">
    
    <rect x="0" y="0" width="1520" height="200" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="288" height="168" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-weight="bold">Same rack</tspan>
        <tspan x="20" dy="34">100 Gb/s</tspan>
        <tspan x="20" dy="34">20 microseconds:</tspan>
        <tspan x="20" dy="34" font-weight="bold" fill="#207448">250 KB</tspan>
      </text>
    </g>

    
    <g transform="translate(320, 16)">
      <rect x="0" y="0" width="288" height="168" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-weight="bold">Same DC</tspan>
        <tspan x="20" dy="34">100 Gb/s</tspan>
        <tspan x="20" dy="34">100 microseconds:</tspan>
        <tspan x="20" dy="34" font-weight="bold" fill="#207448">1.25 MB</tspan>
      </text>
    </g>

    
    <g transform="translate(624, 16)">
      <rect x="0" y="0" width="272" height="168" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="20" y="45" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-weight="bold">Metro</tspan>
        <tspan x="20" dy="36">10 Gb/s 2 ms:</tspan>
        <tspan x="20" dy="40" font-weight="bold" fill="#207448">2.5 MB</tspan>
      </text>
    </g>

    
    <g transform="translate(912, 16)">
      <rect x="0" y="0" width="288" height="168" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-weight="bold">Cross-continent</tspan>
        <tspan x="20" dy="34">10 Gb/s 70 ms:</tspan>
        <tspan x="20" dy="40" font-weight="bold" fill="#207448">87.5 MB</tspan>
      </text>
    </g>

    
    <g transform="translate(1216, 16)">
      <rect x="0" y="0" width="288" height="168" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5"/>
      <text x="20" y="42" font-size="24" fill="#303a36">
        <tspan x="20" dy="0" font-weight="bold">Intercontinental</tspan>
        <tspan x="20" dy="34">10 Gb/s 180 ms:</tspan>
        <tspan x="20" dy="40" font-weight="bold" fill="#207448">225 MB</tspan>
      </text>
    </g>
  </g>

  
  <g transform="translate(40, 1330)">
    <rect x="0" y="0" width="1520" height="80" rx="14" fill="#207448"/>
    <text x="760" y="50" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Choose buffer sizes from the BDP of the path you use, and leave autotuning on</text>
  </g>
</svg>