<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>What you see inside a container: host numbers versus the container's own</title>
  <desc>Visual comparison of host numbers visible inside containers versus container-specific cgroup metrics and key operational traps.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">What you see inside a container:</tspan>
    <tspan x="800" dy="54">host numbers versus the container's own</tspan>
  </text>

  
  <g id="left-column">
    <rect x="40" y="130" width="740" height="366" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2.5"/>
    <rect x="40" y="130" width="740" height="80" rx="12" fill="#fef5ed"/>
    <path d="M 40 210 L 780 210" stroke="#db8129" stroke-width="2"/>

    
    <g transform="translate(710, 144)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="46" height="42" rx="4"/>
      <line x1="4" y1="20" x2="50" y2="20"/>
      <line x1="4" y1="34" x2="50" y2="34"/>
      <circle cx="12" cy="13" r="2" fill="#db8129"/>
      <circle cx="12" cy="27" r="2" fill="#db8129"/>
      <circle cx="12" cy="41" r="2" fill="#db8129"/>
      <line x1="38" y1="13" x2="44" y2="13"/>
      <line x1="38" y1="27" x2="44" y2="27"/>
      <line x1="38" y1="41" x2="44" y2="41"/>
    </g>

    
    <text x="65" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">
      <tspan x="65" dy="0">Shows the HOST even inside a container</tspan>
      <tspan x="65" dy="34">(not namespaced)</tspan>
    </text>

    
    <rect x="60" y="222" width="700" height="36" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="75" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">top summary lines, uptime and load average</text>

    
    <rect x="60" y="266" width="700" height="36" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="75" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">mpstat, vmstat, free, iostat</text>

    
    <rect x="60" y="310" width="700" height="36" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="75" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">/proc/cpuinfo, /proc/meminfo, /proc/stat</text>

    
    <rect x="60" y="354" width="700" height="36" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="75" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">nproc</text>

    
    <rect x="60" y="398" width="700" height="86" rx="6" fill="#fcf8f2" stroke="#ebd9c3" stroke-width="1.5"/>
    <text x="75" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">Per-process tools such as ps and pidstat</tspan>
      <tspan x="75" dy="28">are filtered by the PID namespace,</tspan>
      <tspan x="75" dy="28">so they behave differently</tspan>
    </text>
  </g>

  
  <g id="right-column">
    <rect x="820" y="130" width="740" height="366" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <rect x="820" y="130" width="740" height="80" rx="12" fill="#e8f1ea"/>
    <path d="M 820 210 L 1560 210" stroke="#207448" stroke-width="2"/>

    
    <g transform="translate(1490, 144)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="27,6 48,17 27,28 6,17"/>
      <polygon points="6,17 27,28 27,48 6,37"/>
      <polygon points="48,17 27,28 27,48 48,37"/>
    </g>

    
    <text x="845" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="845" dy="0">Read the container's true usage</tspan>
      <tspan x="845" dy="34">and limits</tspan>
    </text>

    
    <rect x="840" y="222" width="700" height="34" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="855" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">cpu.stat (throttling)</text>

    
    <rect x="840" y="262" width="700" height="34" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="855" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">memory.current</text>

    
    <rect x="840" y="302" width="700" height="34" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="855" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">memory.events</text>

    
    <rect x="840" y="342" width="700" height="34" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="855" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">io.stat</text>

    
    <rect x="840" y="382" width="700" height="34" rx="6" fill="#f5f8f5" stroke="#e3eae4" stroke-width="1.5"/>
    <text x="855" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">PSI pressure files</text>

    
    <rect x="840" y="424" width="700" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="1.5"/>
    <text x="855" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">lxcfs can present cgroup-aware /proc files</text>
  </g>

  
  <g id="section-other-traps">
    <rect x="670" y="514" width="260" height="40" rx="20" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="800" y="542" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Other traps</text>
  </g>

  
  <g id="card-1">
    <rect x="40" y="566" width="740" height="246" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="76" cy="600" r="22" fill="#207448"/>
    <text x="76" y="608" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    
    <g transform="translate(712, 574)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 38 A 20 20 0 1 1 40 38"/>
      <line x1="24" y1="26" x2="36" y2="14"/>
      <circle cx="24" cy="26" r="3" fill="#207448"/>
      <line x1="36" y1="8" x2="42" y2="14"/>
    </g>

    <text x="114" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Limits are checked first:</text>
    <text x="65" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">software resource-control limits are hit</tspan>
      <tspan x="65" dy="32">long before hardware limits; top and</tspan>
      <tspan x="65" dy="32">iostat are blind to them</tspan>
    </text>
  </g>

  
  <g id="card-2">
    <rect x="820" y="566" width="740" height="246" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="856" cy="600" r="22" fill="#207448"/>
    <text x="856" y="608" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    
    <g transform="translate(1492, 574)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 24 Q 24 8 42 24 Q 24 40 6 24 Z"/>
      <circle cx="24" cy="24" r="7"/>
      <circle cx="24" cy="24" r="2.5" fill="#207448"/>
    </g>

    <text x="894" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">From the host everything is visible:</text>
    <text x="845" y="644" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">map a PID to its container through</tspan>
      <tspan x="845" dy="30">/proc/PID/cgroup where the container ID</tspan>
      <tspan x="845" dy="30">appears in the path; crictl ps, docker ps,</tspan>
      <tspan x="845" dy="30">nsenter; the kernel has no container ID,</tspan>
      <tspan x="845" dy="30">BPF tools use the cgroup ID or UTS nodename</tspan>
    </text>
  </g>

  
  <g id="card-3">
    <rect x="40" y="824" width="740" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="76" cy="858" r="22" fill="#207448"/>
    <text x="76" y="866" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    
    <g transform="translate(714, 834)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 6 L 38 12 C 38 26 22 38 22 40 C 22 38 6 26 6 12 Z"/>
      <line x1="14" y1="16" x2="30" y2="30"/>
    </g>

    <text x="114" y="866" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Tracing from inside is mostly blocked:</text>
    <text x="65" y="902" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">perf, bpftrace, strace need SYS_ADMIN,</tspan>
      <tspan x="65" dy="28">PERFMON, BPF, SYS_PTRACE and</tspan>
      <tspan x="65" dy="28">/sys/kernel/debug; seccomp blocks</tspan>
      <tspan x="65" dy="28">perf_event_open, bpf and ptrace by default;</tspan>
      <tspan x="65" dy="28">trace from the host or use kubectl debug</tspan>
      <tspan x="65" dy="28">ephemeral containers</tspan>
    </text>
  </g>

  
  <g id="card-4">
    <rect x="820" y="824" width="740" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <circle cx="856" cy="858" r="22" fill="#207448"/>
    <text x="856" y="866" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    
    
    <g transform="translate(1492, 834)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 22 L 12 22 L 17 8 L 25 38 L 31 16 L 36 26 L 44 26"/>
    </g>

    <text x="894" y="866" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Noisy neighbours:</text>
    <text x="845" y="904" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">contention on the dentry cache, locks,</tspan>
      <tspan x="845" dy="32">interrupts and CPU caches slows a container</tspan>
      <tspan x="845" dy="32">without any limit being hit;</tspan>
      <tspan x="845" dy="32">needs host-side tools</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1088" width="1520" height="84" rx="12" fill="#207448"/>
    <text x="800" y="1124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">Before you blame the hardware for a slow container,</tspan>
      <tspan x="800" dy="34">read its cgroup files and check for throttling</tspan>
    </text>
  </g>
</svg>