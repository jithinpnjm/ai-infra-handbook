<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Rack aliasing bugs: shared default, stored argument and shallow copy</title>
  <desc>Visual infographic explaining three common Python object reference aliasing bugs involving racks holding hosts: mutable default arguments, stored mutable arguments, and shallow versus deep copies.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 16 9 L 1 16 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448">Rack aliasing bugs: shared default, stored argument and shallow copy</text>

  
  <rect x="40" y="96" width="1520" height="78" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="129" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">functions receive arguments by object reference (call by sharing): </tspan>
    <tspan x="800" dy="30">the parameter is an alias of the caller's object, not a private copy</tspan>
  </text>

  
  <g transform="translate(40, 194)">
    
    <rect x="0" y="0" width="480" height="920" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="212" y="20" width="56" height="56" rx="8" fill="none" stroke="#207448" stroke-width="4" />
    <rect x="226" y="34" width="28" height="28" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="222" y1="20" x2="222" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="20" x2="240" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="258" y1="20" x2="258" y2="12" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="222" y1="76" x2="222" y2="84" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="76" x2="240" y2="84" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="258" y1="76" x2="258" y2="84" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="212" y1="30" x2="204" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="212" y1="48" x2="204" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="212" y1="66" x2="204" y2="66" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="268" y1="30" x2="276" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="268" y1="48" x2="276" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    <line x1="268" y1="66" x2="276" y2="66" stroke="#207448" stroke-width="4" stroke-linecap="round" />

    
    <text x="240" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Mutable default hosts=[]</text>

    
    
    <rect x="25" y="140" width="190" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="35" y="152" width="170" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="50" cy="167" r="4" fill="#207448" />
    <line x1="65" y1="167" x2="190" y2="167" stroke="#c8dcd0" stroke-width="3" />
    <rect x="35" y="192" width="170" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="50" cy="207" r="4" fill="#207448" />
    <line x1="65" y1="207" x2="190" y2="207" stroke="#c8dcd0" stroke-width="3" />
    <rect x="35" y="232" width="170" height="36" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="50" cy="250" r="4" fill="#207448" />
    <line x1="65" y1="250" x2="190" y2="250" stroke="#207448" stroke-width="3" />

    
    <rect x="265" y="140" width="190" height="140" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="275" y="152" width="170" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="290" cy="167" r="4" fill="#207448" />
    <line x1="305" y1="167" x2="430" y2="167" stroke="#c8dcd0" stroke-width="3" />
    <rect x="275" y="192" width="170" height="30" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="290" cy="207" r="4" fill="#207448" />
    <line x1="305" y1="207" x2="430" y2="207" stroke="#c8dcd0" stroke-width="3" />
    <rect x="275" y="232" width="170" height="36" rx="4" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <circle cx="290" cy="250" r="4" fill="#207448" />
    <line x1="305" y1="250" x2="430" y2="250" stroke="#207448" stroke-width="3" />

    
    <rect x="70" y="325" width="340" height="60" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4" />
    <rect x="155" y="337" width="170" height="36" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="175" cy="355" r="5" fill="#207448" />
    <line x1="195" y1="355" x2="310" y2="355" stroke="#207448" stroke-width="3" />

    
    <path d="M 120 280 L 120 305 L 170 305 L 170 321" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
    <path d="M 360 280 L 360 305 L 310 305 L 310 321" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

    
    <rect x="20" y="415" width="440" height="340" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="36" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0">two racks created with Rack() </tspan>
      <tspan x="36" dy="34">share the one default list </tspan>
      <tspan x="36" dy="34">stored in </tspan>
      <tspan x="36" dy="34" font-family="monospace">Rack.__init__.__defaults__[0]</tspan>
    </text>
    <line x1="36" y1="595" x2="444" y2="595" stroke="#e8f1ea" stroke-width="2" />
    <text x="36" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0">adding gpu09 to one rack </tspan>
      <tspan x="36" dy="34">makes it appear in the other</tspan>
    </text>

    
    <rect x="20" y="775" width="440" height="125" rx="10" fill="#c8dcd0" stroke="#207448" stroke-width="2" />
    <text x="240" y="828" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="240" dy="0">hosts=None, then </tspan>
      <tspan x="240" dy="34">self.hosts = [] when None</tspan>
    </text>
  </g>

  
  <g transform="translate(560, 194)">
    
    <rect x="0" y="0" width="480" height="920" rx="14" fill="#fffaf5" stroke="#db8129" stroke-width="3" />

    
    <circle cx="240" cy="48" r="18" fill="none" stroke="#db8129" stroke-width="4" />
    <path d="M 240 22 L 240 14 M 240 74 L 240 82 M 214 48 L 206 48 M 266 48 L 274 48 M 222 30 L 216 24 M 258 66 L 264 72 M 222 66 L 216 72 M 258 30 L 264 24" stroke="#db8129" stroke-width="4" stroke-linecap="round" />

    
    <text x="240" y="112" text-anchor="middle" font-family="system-ui, -apple-system, monospace" font-size="30" font-weight="bold" fill="#db8129">self.hosts = hosts</text>

    
    
    <rect x="25" y="150" width="185" height="125" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <rect x="35" y="162" width="165" height="26" rx="4" fill="#fffaf5" stroke="#db8129" stroke-width="1.5" />
    <circle cx="50" cy="175" r="4" fill="#207448" />
    <line x1="65" y1="175" x2="185" y2="175" stroke="#207448" stroke-width="3" />
    <rect x="35" y="196" width="165" height="26" rx="4" fill="#fdf0e2" stroke="#db8129" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="50" cy="209" r="4" fill="#db8129" />
    <line x1="65" y1="209" x2="185" y2="209" stroke="#db8129" stroke-width="2" stroke-dasharray="4 2" />
    <rect x="35" y="230" width="165" height="26" rx="4" fill="#fffaf5" stroke="#db8129" stroke-width="1.5" />
    <circle cx="50" cy="243" r="4" fill="#207448" />
    <line x1="65" y1="243" x2="185" y2="243" stroke="#207448" stroke-width="3" />

    
    <rect x="270" y="140" width="185" height="145" rx="8" fill="#ffffff" stroke="#303a36" stroke-width="2" />
    <rect x="280" y="152" width="165" height="32" rx="4" fill="#f5f8f5" stroke="#303a36" stroke-width="1.5" />
    <circle cx="295" cy="168" r="4" fill="#207448" />
    <line x1="310" y1="168" x2="430" y2="168" stroke="#303a36" stroke-width="3" />
    <rect x="280" y="192" width="165" height="32" rx="4" fill="#f5f8f5" stroke="#303a36" stroke-width="1.5" />
    <circle cx="295" cy="208" r="4" fill="#207448" />
    <line x1="310" y1="208" x2="430" y2="208" stroke="#303a36" stroke-width="3" />
    <rect x="280" y="232" width="165" height="42" rx="4" fill="#fffaf5" stroke="#db8129" stroke-width="2" />
    <circle cx="295" cy="253" r="5" fill="#db8129" />
    <line x1="310" y1="253" x2="430" y2="253" stroke="#db8129" stroke-width="3" />

    
    <path d="M 280 253 L 245 253 L 245 209 L 214 209" fill="none" stroke="#db8129" stroke-width="3.5" marker-end="url(#arrow-orange)" />

    
    <rect x="20" y="375" width="440" height="360" rx="10" fill="#ffffff" stroke="#db8129" stroke-width="2" />
    <text x="36" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0" font-family="monospace">maintenance = </tspan>
      <tspan x="36" dy="34" font-family="monospace">[gpu01, gpu02, gpu03] </tspan>
      <tspan x="36" dy="34">passed to Rack(maintenance)</tspan>
    </text>
    <line x1="36" y1="520" x2="444" y2="520" stroke="#fdf0e2" stroke-width="2" />
    <text x="36" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0" font-family="monospace">rack.drain(gpu02) </tspan>
      <tspan x="36" dy="34">calls remove on the </tspan>
      <tspan x="36" dy="34">caller's own list so </tspan>
      <tspan x="36" dy="34">gpu02 vanishes from </tspan>
      <tspan x="36" dy="34">maintenance</tspan>
    </text>

    
    <rect x="20" y="755" width="440" height="145" rx="10" fill="#c8dcd0" stroke="#207448" stroke-width="2" />
    <text x="240" y="788" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="240" dy="0">defensive copy </tspan>
      <tspan x="240" dy="30" font-family="monospace">self.hosts = list(hosts), </tspan>
      <tspan x="240" dy="30">which also accepts any </tspan>
      <tspan x="240" dy="30">iterable such as a tuple or a set</tspan>
    </text>
  </g>

  
  <g transform="translate(1080, 194)">
    
    <rect x="0" y="0" width="480" height="920" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="216" y="22" width="34" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
    <path d="M 230 22 L 230 14 L 264 14 L 264 54 L 250 54" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />

    
    <text x="240" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">copy.copy versus deepcopy</text>

    
    
    <rect x="25" y="140" width="105" height="110" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="33" y="150" width="89" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="33" y="180" width="89" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="33" y="210" width="89" height="30" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

    <rect x="150" y="140" width="105" height="110" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="158" y="150" width="89" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="158" y="180" width="89" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="158" y="210" width="89" height="30" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

    
    <rect x="40" y="295" width="200" height="45" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="55" y1="317" x2="225" y2="317" stroke="#207448" stroke-width="3" stroke-dasharray="16 8" />

    
    <path d="M 77 250 L 77 291" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <path d="M 202 250 L 202 291" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

    
    <rect x="310" y="140" width="145" height="110" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <rect x="320" y="150" width="125" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="320" y="180" width="125" height="24" rx="3" fill="#f5f8f5" stroke="#207448" stroke-width="1.5" />
    <rect x="320" y="210" width="125" height="30" rx="3" fill="#c8dcd0" stroke="#207448" stroke-width="1.5" />

    
    <rect x="310" y="295" width="145" height="45" rx="6" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <line x1="325" y1="317" x2="440" y2="317" stroke="#207448" stroke-width="4" />

    
    <path d="M 382 250 L 382 291" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow-green)" />

    
    <rect x="20" y="365" width="440" height="330" rx="10" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="36" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0" font-family="monospace">rack1 = Rack([gpu01..gpu04]), </tspan>
      <tspan x="36" dy="32" font-family="monospace">rack2 = copy.copy(rack1), </tspan>
      <tspan x="36" dy="32" font-family="monospace">rack3 = copy.deepcopy(rack1)</tspan>
    </text>
    <line x1="36" y1="480" x2="444" y2="480" stroke="#e8f1ea" stroke-width="2" />
    <text x="36" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="36" dy="0">rack1.drain(gpu02) also </tspan>
      <tspan x="36" dy="32">removes gpu02 from rack2.hosts </tspan>
      <tspan x="36" dy="32">because the shallow copy </tspan>
      <tspan x="36" dy="32">shares the inner list, while </tspan>
      <tspan x="36" dy="32">rack3.hosts keeps all four</tspan>
    </text>

    
    <rect x="20" y="715" width="440" height="185" rx="10" fill="#c8dcd0" stroke="#207448" stroke-width="2" />
    <text x="240" y="748" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="240" dy="0">deepcopy records each copied </tspan>
      <tspan x="240" dy="30">object in a memo dictionary </tspan>
      <tspan x="240" dy="30">so cycles such as </tspan>
      <tspan x="240" dy="30" font-family="monospace">a = [10, 20]; b = [a, 30]; </tspan>
      <tspan x="240" dy="30" font-family="monospace">a.append(b) </tspan>
      <tspan x="240" dy="30">do not loop forever</tspan>
    </text>
  </g>

  
  <rect x="40" y="1134" width="1520" height="52" rx="8" fill="#207448" />
  <text x="800" y="1169" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Functions should not change their arguments unless the documentation says so</text>
</svg>