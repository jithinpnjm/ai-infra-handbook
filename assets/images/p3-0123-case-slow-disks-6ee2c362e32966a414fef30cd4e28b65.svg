<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Case 1: slow disks became slow data loading, and then a memory budget problem</title>
  <desc>Case 1: slow disks became slow data loading, and then a memory budget problem</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#207448"/>
    </marker>
  </defs>
  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="56" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Case 1: slow disks became slow data loading,</text>
  <text x="800" y="110" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">and then a memory budget problem</text>

  
  <line x1="75" y1="236" x2="75" y2="252" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="370" x2="75" y2="386" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="528" x2="75" y2="544" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="662" x2="75" y2="678" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="820" x2="75" y2="836" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="75" y1="954" x2="75" y2="970" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

  
  <rect x="40" y="138" width="1060" height="98" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="187" r="24" fill="#207448"/>
  <text x="75" y="187" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <path d="M 122 170 h 38 a 6 6 0 0 1 0 34 h -38 a 6 6 0 0 1 0 -34 z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="134" y1="187" x2="148" y2="187" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="185" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Ticket:</text>
  <text x="185" y="210" font-family="sans-serif" font-size="24" fill="#303a36">NVMe scratch is slow, epochs 30% longer this week</text>

  
  <rect x="40" y="252" width="1060" height="118" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="311" r="24" fill="#207448"/>
  <text x="75" y="311" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <circle cx="138" cy="305" r="14" fill="none" stroke="#207448" stroke-width="4"/>
  <line x1="148" y1="315" x2="162" y2="329" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <text x="185" y="285" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Problem statement first:</text>
  <text x="185" y="318" font-family="sans-serif" font-size="24" fill="#303a36">measurable regression in epoch time or step data-wait?</text>
  <text x="185" y="350" font-family="sans-serif" font-size="24" fill="#303a36">since when? what changed? why the disks?</text>

  
  <rect x="40" y="386" width="1060" height="142" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="457" r="24" fill="#207448"/>
  <text x="75" y="457" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <path d="M 124 468 A 18 18 0 1 1 158 468" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="141" y1="465" x2="152" y2="453" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <circle cx="141" cy="465" r="3" fill="#207448"/>
  <text x="185" y="418" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">USE across all resources:</text>
  <text x="185" y="449" font-family="sans-serif" font-size="24" fill="#303a36">CPUs and network modest; NVMe 80% utilised at</text>
  <text x="185" y="478" font-family="sans-serif" font-size="24" fill="#303a36">one-minute resolution; at one-second resolution iostat shows</text>
  <text x="185" y="507" font-family="sans-serif" font-size="24" fill="#303a36">bursts to 100% with queueing; no device errors</text>

  
  <rect x="40" y="544" width="1060" height="118" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="603" r="24" fill="#207448"/>
  <text x="75" y="603" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <circle cx="141" cy="603" r="18" fill="none" stroke="#207448" stroke-width="4"/>
  <polyline points="141,592 141,603 150,603" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="185" y="577" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Off-CPU view:</text>
  <text x="185" y="610" font-family="sans-serif" font-size="24" fill="#303a36">data-loader workers are blocked in file reads,</text>
  <text x="185" y="642" font-family="sans-serif" font-size="24" fill="#303a36">so the disk is on the critical path, but not guilty</text>

  
  <rect x="40" y="678" width="1060" height="142" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="749" r="24" fill="#207448"/>
  <text x="75" y="749" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <ellipse cx="141" cy="736" rx="16" ry="6" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 125 736 v 24 c 0 4 7 6 16 6 s 16 -2 16 -6 v -24" fill="none" stroke="#207448" stroke-width="4"/>
  <path d="M 125 748 c 0 4 7 6 16 6 s 16 -2 16 -6" fill="none" stroke="#207448" stroke-width="4"/>
  <text x="185" y="710" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Workload characterisation:</text>
  <text x="185" y="741" font-family="sans-serif" font-size="24" fill="#303a36">reads dominate, small random I/O, steady rate;</text>
  <text x="185" y="770" font-family="sans-serif" font-size="24" fill="#303a36">the read rate and dataset have not changed,</text>
  <text x="185" y="799" font-family="sans-serif" font-size="24" fill="#303a36">so the disks behave normally for the load</text>

  
  <rect x="40" y="836" width="1060" height="118" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
  <circle cx="75" cy="895" r="24" fill="#db8129"/>
  <text x="75" y="895" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <rect x="127" y="881" width="28" height="28" rx="3" fill="none" stroke="#db8129" stroke-width="4"/>
  <line x1="120" y1="888" x2="127" y2="888" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="895" x2="127" y2="895" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="902" x2="127" y2="902" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="888" x2="162" y2="888" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="895" x2="162" y2="895" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="902" x2="162" y2="902" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
  <text x="185" y="869" font-family="sans-serif" font-size="30" font-weight="bold" fill="#db8129">Page cache hit ratio 91%</text>
  <text x="185" y="902" font-family="sans-serif" font-size="24" fill="#303a36">on this node versus 98% on sibling nodes,</text>
  <text x="185" y="934" font-family="sans-serif" font-size="24" fill="#303a36">and the cache is much smaller</text>

  
  <rect x="40" y="970" width="1060" height="142" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  <circle cx="75" cy="1041" r="24" fill="#207448"/>
  <text x="75" y="1041" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
  
  <path d="M 141 1058 C 127 1051 125 1039 125 1031 L 141 1025 L 157 1031 C 157 1039 155 1051 141 1058 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="134,1041 139,1046 148,1036" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="185" y="1002" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Memory accounting:</text>
  <text x="185" y="1033" font-family="sans-serif" font-size="24" fill="#303a36">a new prototype process grew to hundreds of GB</text>
  <text x="185" y="1062" font-family="sans-serif" font-size="24" fill="#303a36">and squeezed the page cache; moved it, the cache</text>
  <text x="185" y="1091" font-family="sans-serif" font-size="24" fill="#303a36">recovered, epoch times returned</text>

  
  <rect x="1135" y="138" width="425" height="974" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <path d="M 1334 195 C 1334 182 1360 182 1360 195 C 1360 203 1353 207 1353 214 H 1341 C 1341 207 1334 203 1334 195 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1343" y1="220" x2="1351" y2="220" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
  <line x1="1344" y1="226" x2="1350" y2="226" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
  <text x="1347" y="270" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Lessons:</text>
  <text x="1165" y="330" font-family="sans-serif" font-size="24" fill="#303a36">ask first, check all the</text>
  <text x="1165" y="372" font-family="sans-serif" font-size="24" fill="#303a36">resources before you</text>
  <text x="1165" y="414" font-family="sans-serif" font-size="24" fill="#303a36">trust the suspect, look</text>
  <text x="1165" y="456" font-family="sans-serif" font-size="24" fill="#303a36">at short intervals,</text>
  <text x="1165" y="498" font-family="sans-serif" font-size="24" fill="#303a36">characterise the load</text>
  <text x="1165" y="540" font-family="sans-serif" font-size="24" fill="#303a36">before you blame the</text>
  <text x="1165" y="582" font-family="sans-serif" font-size="24" fill="#303a36">devices; the answer</text>
  <text x="1165" y="624" font-family="sans-serif" font-size="24" fill="#303a36">was a memory budget</text>
  <text x="1165" y="666" font-family="sans-serif" font-size="24" fill="#303a36">problem found through</text>
  <text x="1165" y="708" font-family="sans-serif" font-size="24" fill="#303a36">the cache hit ratio,</text>
  <text x="1165" y="750" font-family="sans-serif" font-size="24" fill="#303a36">not through a disk tool</text>

  
  <rect x="40" y="1128" width="1520" height="52" rx="10" fill="#207448"/>
  <text x="800" y="1163" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">The suspect is not always the cause</text>
</svg>