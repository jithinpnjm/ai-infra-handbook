      <line x1="1205" y1="240" x2="1485" y2="240" stroke="#db8129" stroke-width="2.5" stroke-dasharray="6,4" />

      
      <line x1="1205" y1="340" x2="1485" y2="340" stroke="#207448" stroke-width="2" stroke-dasharray="4,4" />

      
