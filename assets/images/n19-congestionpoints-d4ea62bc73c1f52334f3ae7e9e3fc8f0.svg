      <line x1="372" y1="438" x2="420" y2="438" stroke="#207448" stroke-width="2.5" />
      <line x1="372" y1="452" x2="420" y2="452" stroke="#207448" stroke-width="2.5" />
      <circle cx="442" cy="445" r="4" fill="#207448" />
    </g>

    
    <line x1="210" y1="294" x2="130" y2="420" stroke="#207448" stroke-width="2.5" />
    <line x1="250" y1="294" x2="270" y2="420" stroke="#207448" stroke-width="2.5" />
    <line x1="310" y1="294" x2="410" y2="420" stroke="#207448" stroke-width="5" />

    
    <path d="M 130 420 L 210 294 Q 270 210 310 294 L 410 420" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />

    
    <g id="microburst-graph">
      <rect x="1165" y="160" width="360" height="265" rx="12" fill="#fff9f3" stroke="#db8129" stroke-width="2.5" />

      
