    <g transform="translate(120, 599)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="48" height="44" rx="6" />
      <line x1="4" y1="28" x2="52" y2="28" />
      <line x1="16" y1="17" x2="38" y2="17" stroke-width="3" />
      <circle cx="28" cy="39" r="3" fill="#207448" />
    </g>

    
    <text x="195" y="605" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Leaf downlink (leaf to server):</tspan>
      <tspan x="195" dy="42" font-size="26" fill="#303a36">incast</tspan>
    </text>
  </g>

  
  <g id="card-4">
    <rect x="820" y="545" width="740" height="165" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
    <circle cx="860" cy="627" r="24" fill="#207448" />
    <text x="860" y="635" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>

    
    <g transform="translate(900, 599)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 8 L 50 8 L 34 32 L 34 50 L 22 50 L 22 32 Z" />
      <line x1="28" y1="16" x2="28" y2="24" />
    </g>

    
    <text x="975" y="590" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Spine to leaf downlink:</tspan>
      <tspan x="975" dy="38" font-size="25" fill="#303a36">flows from several leaves converge</tspan>
      <tspan x="975" dy="34" font-size="25" fill="#303a36">on one link</tspan>
    </text>
  </g>

  
  <g id="card-2">
