      <rect x="14" y="6" width="28" height="14" rx="3" />
      <rect x="6" y="32" width="44" height="18" rx="3" />
      <line x1="28" y1="20" x2="28" y2="32" />
    </g>

    
    <text x="975" y="785" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Spine to super-spine:</tspan>
      <tspan x="975" dy="42" font-size="25" fill="#303a36">same effects plus oversubscription</tspan>
    </text>
  </g>

  
  <g id="card-3">
