      <line x1="618" y1="309" x2="652" y2="380" />
      <line x1="618" y1="309" x2="827" y2="380" />
      <line x1="618" y1="309" x2="1002" y2="380" />

      <line x1="758" y1="309" x2="652" y2="380" />
      <line x1="758" y1="309" x2="827" y2="380" />
      <line x1="758" y1="309" x2="1002" y2="380" />

      <line x1="898" y1="309" x2="652" y2="380" />
      <line x1="898" y1="309" x2="827" y2="380" />
      <line x1="898" y1="309" x2="1002" y2="380" />

      <line x1="1038" y1="309" x2="652" y2="380" />
      <line x1="1038" y1="309" x2="827" y2="380" />
      <line x1="1038" y1="309" x2="1002" y2="380" />
