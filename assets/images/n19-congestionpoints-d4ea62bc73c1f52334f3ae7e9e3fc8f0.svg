    <rect x="40" y="85" width="1520" height="440" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="70" y="125" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Small leaf-spine-super-spine drawing with numbered markers</text>

    
    <line x1="510" y1="140" x2="510" y2="505" stroke="#e8f1ea" stroke-width="2" />
    <line x1="1130" y1="140" x2="1130" y2="505" stroke="#e8f1ea" stroke-width="2" />

    
    
    <g id="super-spines">
