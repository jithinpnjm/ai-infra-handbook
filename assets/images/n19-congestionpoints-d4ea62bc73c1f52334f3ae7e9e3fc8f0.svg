      <circle cx="28" cy="12" r="5" fill="#207448" />
    </g>

    
    <text x="195" y="950" font-family="sans-serif">
      <tspan font-size="30" font-weight="bold" fill="#207448">Leaf to spine uplink:</tspan>
      <tspan x="195" dy="38" font-size="25" fill="#303a36">hash collisions put elephant flows</tspan>
