<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Where congestion appears in a fabric</title>
  <desc>Visual infographic showing where congestion appears in a leaf-spine-super-spine fabric: leaf downlinks (incast), local leaf switching, leaf-to-spine uplinks (hash collisions), spine-to-leaf downlinks, spine-to-super-spine oversubscription, and microbursts.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="54" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Where congestion appears in a fabric</text>

  
