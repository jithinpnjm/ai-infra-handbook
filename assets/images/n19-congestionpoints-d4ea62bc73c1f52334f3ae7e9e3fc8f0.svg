      <line x1="578" y1="287" x2="658" y2="287" stroke="#207448" stroke-width="3" />
      <circle cx="618" cy="287" r="5" fill="#207448" />

      <rect x="700" y="265" width="115" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
      <line x1="718" y1="287" x2="798" y2="287" stroke="#207448" stroke-width="3" />
      <circle cx="758" cy="287" r="5" fill="#207448" />

