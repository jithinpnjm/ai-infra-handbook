<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <title>The estimation chain</title>
  <desc>Flowchart diagram illustrating the complete estimation chain from GPU memory and weights to batch size, throughput, cluster sizing, and cost per million tokens.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 14 8 L 0 14 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="960" fill="#f5f8f5" />

  
  <text x="800" y="72" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The estimation chain</text>

  

  
  <g id="node-A">
    <rect x="80" y="130" width="330" height="105" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(105, 157)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="42" height="34" rx="4" />
      <line x1="12" y1="18" x2="16" y2="18" />
      <line x1="23" y1="18" x2="27" y2="18" />
      <line x1="34" y1="18" x2="38" y2="18" />
      <line x1="10" y1="42" x2="10" y2="48" />
      <line x1="18" y1="42" x2="18" y2="48" />
      <line x1="25" y1="42" x2="25" y2="48" />
      <line x1="32" y1="42" x2="32" y2="48" />
      <line x1="40" y1="42" x2="40" y2="48" />
      <circle cx="25" cy="4" r="2" />
    </g>
    <text x="175" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">Weights</tspan>
      <tspan x="175" dy="36">memory</tspan>
    </text>
  </g>

  
  <g id="node-B">
    <rect x="80" y="255" width="330" height="105" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(105, 282)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="10" width="30" height="30" rx="3" />
      <rect x="18" y="18" width="14" height="14" fill="#207448" fill-opacity="0.15" />
      <line x1="16" y1="2" x2="16" y2="10" />
      <line x1="25" y1="2" x2="25" y2="10" />
      <line x1="34" y1="2" x2="34" y2="10" />
      <line x1="16" y1="40" x2="16" y2="48" />
      <line x1="25" y1="40" x2="25" y2="48" />
      <line x1="34" y1="40" x2="34" y2="48" />
      <line x1="2" y1="16" x2="10" y2="16" />
      <line x1="2" y1="25" x2="10" y2="25" />
      <line x1="2" y1="34" x2="10" y2="34" />
      <line x1="40" y1="16" x2="48" y2="16" />
      <line x1="40" y1="25" x2="48" y2="25" />
      <line x1="40" y1="34" x2="48" y2="34" />
    </g>
    <text x="175" y="299" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="175" dy="0">GPU memory</tspan>
      <tspan x="175" dy="36">x 0.9</tspan>
    </text>
  </g>

  
  <g id="node-C">
    <rect x="470" y="130" width="310" height="230" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(600, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="42" height="40" rx="6" />
      <line x1="4" y1="19" x2="46" y2="19" />
      <line x1="4" y1="32" x2="46" y2="32" />
      <line x1="18" y1="19" x2="18" y2="46" />
      <line x1="32" y1="19" x2="32" y2="46" />
      <circle cx="12" cy="12.5" r="2.5" fill="#207448" />
      <circle cx="20" cy="12.5" r="2.5" fill="#207448" />
    </g>
    <text x="625" y="272" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="625" dy="0">Free memory</tspan>
      <tspan x="625" dy="40">for KV</tspan>
    </text>
  </g>

  
  <g id="node-D">
    <rect x="840" y="130" width="310" height="230" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(970, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="38" height="36" rx="5" />
      <path d="M 14 18 L 36 18" />
      <path d="M 14 26 L 36 26" />
      <path d="M 14 34 L 28 34" />
      <circle cx="34" cy="34" r="2.5" fill="#207448" />
    </g>
    <text x="995" y="272" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="995" dy="0">Requests</tspan>
      <tspan x="995" dy="40">that fit</tspan>
    </text>
  </g>

  
  <g id="node-E">
    <rect x="1210" y="130" width="310" height="230" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1340, 160)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="38" height="38" rx="6" />
      <rect x="14" y="14" width="8" height="8" rx="2" fill="#207448" />
      <rect x="28" y="14" width="8" height="8" rx="2" fill="#207448" />
      <rect x="14" y="28" width="8" height="8" rx="2" fill="#207448" />
      <rect x="28" y="28" width="8" height="8" rx="2" fill="#207448" />
    </g>
    <text x="1365" y="292" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">Batch size</text>
  </g>

  

  
  <g id="node-H">
    <rect x="80" y="420" width="700" height="230" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(145, 510)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 40 A 22 22 0 1 1 46 40" />
      <line x1="26" y1="28" x2="38" y2="16" stroke-width="4" />
      <circle cx="26" cy="28" r="4" fill="#207448" />
      <line x1="12" y1="22" x2="16" y2="24" />
      <line x1="26" y1="10" x2="26" y2="14" />
      <line x1="40" y1="22" x2="36" y2="24" />
    </g>
    <text x="235" y="546" font-family="sans-serif" font-size="36" font-weight="bold" fill="#303a36">Requests/s per GPU</text>
  </g>

  
  <g id="node-F">
    <rect x="1210" y="420" width="310" height="105" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1235, 447)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="25" cy="25" r="20" />
      <polyline points="25,13 25,25 33,25" />
      <path d="M 39 39 L 45 45" />
    </g>
    <text x="1310" y="464" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1310" dy="0">Decode</tspan>
      <tspan x="1310" dy="36">tokens/s</tspan>
    </text>
  </g>

  
  <g id="node-G">
    <rect x="1210" y="545" width="310" height="105" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1235, 572)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="8,10 24,25 8,40" />
      <polygon points="24,10 40,25 24,40" />
    </g>
    <text x="1310" y="589" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="1310" dy="0">Prefill</tspan>
      <tspan x="1310" dy="36">tokens/s</tspan>
    </text>
  </g>

  

  
  <g id="node-I">
    <rect x="80" y="710" width="700" height="180" rx="16" ry="16" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(135, 772)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="46" height="18" rx="3" />
      <circle cx="12" cy="15" r="2.5" fill="#207448" />
      <line x1="20" y1="15" x2="42" y2="15" />
      <rect x="4" y="30" width="46" height="18" rx="3" />
      <circle cx="12" cy="39" r="2.5" fill="#207448" />
      <line x1="20" y1="39" x2="42" y2="39" />
    </g>
    <text x="215" y="788" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
      <tspan x="215" dy="0">GPUs for QPS</tspan>
      <tspan x="215" dy="40">+ headroom + N+1</tspan>
    </text>
  </g>

  
  <g id="node-J">
    <rect x="860" y="710" width="660" height="180" rx="16" ry="16" fill="#fef8f0" stroke="#db8129" stroke-width="3.5" />
    
    <g transform="translate(915, 772)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="27" cy="27" r="22" />
      <circle cx="27" cy="27" r="16" stroke-dasharray="4 3" />
      <path d="M 23 18 L 27 15 L 31 18 L 31 39" />
      <line x1="21" y1="39" x2="33" y2="39" />
    </g>
    <text x="995" y="788" font-family="sans-serif" font-size="32" font-weight="bold" fill="#303a36">
      <tspan x="995" dy="0">Cost per</tspan>
      <tspan x="995" dy="40">million tokens</tspan>
    </text>
  </g>

  

  
  <line x1="410" y1="182.5" x2="470" y2="182.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="410" y1="307.5" x2="470" y2="307.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="780" y1="245" x2="840" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1150" y1="245" x2="1210" y2="245" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1365" y1="360" x2="1365" y2="420" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1210" y1="472.5" x2="780" y2="472.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="1210" y1="597.5" x2="780" y2="597.5" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="430" y1="650" x2="430" y2="710" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="780" y1="800" x2="860" y2="800" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

</svg>