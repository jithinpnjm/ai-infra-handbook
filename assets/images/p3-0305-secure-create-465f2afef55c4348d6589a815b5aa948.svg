<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Creating files safely: exclusive open, 0600 from the start, and unique temp names</title>
  <desc>Technical infographic contrasting unsafe and safe file creation patterns in Python, permissions calls, flock overlapping run handling, and untrusted archive extraction.</desc>

  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="40" y="70" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Creating files safely: exclusive open,</text>
  <text x="40" y="124" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">0600 from the start, and unique temp names</text>

  
  <g id="header-unsafe">
    <rect x="55" y="152" width="465" height="46" rx="8" fill="#fbebeb" stroke="#d97777" stroke-width="2"/>
    <path d="M 80 185 L 94 161 L 108 185 Z M 94 169 L 94 176 M 94 180 L 94 182" fill="none" stroke="#a83232" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="186" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#a83232">unsafe</text>
  </g>

  <g id="header-safe">
    <rect x="540" y="152" width="485" height="46" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <path d="M 565 163 L 579 159 L 593 163 C 593 177 579 187 579 187 C 579 187 565 177 565 163 Z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 572 173 L 577 178 L 586 168" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="790" y="186" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">safe</text>
  </g>

  
  <g id="row-secret-file">
    <rect x="40" y="210" width="1000" height="215" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    
    <g transform="translate(56, 222)">
      <rect x="8" y="22" width="40" height="30" rx="6" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 18 22 L 18 14 C 18 7.3 22.5 3 28 3 C 33.5 3 38 7.3 38 14 L 38 22" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="35" r="3" fill="#207448"/>
      <line x1="28" y1="38" x2="28" y2="44" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="126" y="258" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">secret file</text>

    
    <rect x="55" y="274" width="465" height="136" rx="8" fill="#fdf8f8" stroke="#e8c4c4" stroke-width="1.5"/>
    <text x="75" y="310" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">create the file, then chmod it</tspan>
      <tspan x="75" dy="32">afterward: readable to others</tspan>
      <tspan x="75" dy="32">while it waits</tspan>
    </text>

    
    <rect x="540" y="274" width="485" height="136" rx="8" fill="#fdf8f2" stroke="#db8129" stroke-width="3"/>
    <text x="560" y="302" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="560" dy="0">os.open(path, os.O_WRONLY |</tspan>
      <tspan x="560" dy="26">os.O_CREAT | os.O_EXCL,</tspan>
      <tspan x="560" dy="26">0o600): restrictive mode</tspan>
      <tspan x="560" dy="26" font-family="sans-serif">from the start; check your</tspan>
      <tspan x="560" dy="26" font-family="sans-serif">0o octal literals</tspan>
    </text>
  </g>

  
  <g id="row-create-only-if-missing">
    <rect x="40" y="440" width="1000" height="205" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    
    <g transform="translate(56, 452)">
      <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 26 16 L 40 16 C 45 16 48 19 48 24 L 48 38" fill="none" stroke="#207448" stroke-width="4"/>
      <rect x="38" y="38" width="16" height="16" rx="3" fill="none" stroke="#207448" stroke-width="4"/>
      <line x1="16" y1="26" x2="16" y2="48" stroke="#207448" stroke-width="4"/>
      <circle cx="16" cy="48" r="4" fill="#207448"/>
    </g>
    <text x="126" y="488" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">create only if missing</text>

    
    <rect x="55" y="504" width="465" height="126" rx="8" fill="#fdf8f8" stroke="#e8c4c4" stroke-width="1.5"/>
    <text x="75" y="534" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">if not exists: create, which</tspan>
      <tspan x="75" dy="29">leaves a gap another process</tspan>
      <tspan x="75" dy="29">can enter (TOCTOU, time of</tspan>
      <tspan x="75" dy="29">check to time of use)</tspan>
    </text>

    
    <rect x="540" y="504" width="485" height="126" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="560" y="534" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="560" dy="0">attempt the operation and</tspan>
      <tspan x="560" dy="29">handle the exception:</tspan>
      <tspan x="560" dy="29" font-family="monospace">open(..., x), os.mkdir,</tspan>
      <tspan x="560" dy="29" font-family="monospace">Path.mkdir(exist_ok=True)</tspan>
    </text>
  </g>

  
  <g id="row-temp-files">
    <rect x="40" y="660" width="1000" height="285" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    
    <g transform="translate(56, 672)">
      <circle cx="28" cy="28" r="22" fill="none" stroke="#207448" stroke-width="4"/>
      <polyline points="28,14 28,28 38,34" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
      <line x1="24" y1="3" x2="32" y2="3" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="126" y="708" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">temp files</text>

    
    <rect x="55" y="724" width="465" height="206" rx="8" fill="#fdf8f8" stroke="#e8c4c4" stroke-width="1.5"/>
    <text x="75" y="768" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="75" dy="0">build temp names yourself</tspan>
      <tspan x="75" dy="32">in /tmp: predictable names</tspan>
      <tspan x="75" dy="32">enable symlink attacks</tspan>
      <tspan x="75" dy="32">and collisions</tspan>
    </text>

    
    <rect x="540" y="724" width="485" height="206" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    <text x="560" y="750" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="560" dy="0" font-family="monospace">tempfile.mkstemp() makes</tspan>
      <tspan x="560" dy="25">unique files with mode 0600;</tspan>
      <tspan x="560" dy="25" font-family="monospace">TemporaryDirectory(),</tspan>
      <tspan x="560" dy="25" font-family="monospace">NamedTemporaryFile(</tspan>
      <tspan x="560" dy="25" font-family="monospace">delete=False), mkdtemp();</tspan>
      <tspan x="560" dy="25">clean up with context managers;</tspan>
      <tspan x="560" dy="25">place large scratch data by</tspan>
      <tspan x="560" dy="25">setting TMPDIR</tspan>
    </text>
  </g>

  
  <g id="panel-permissions">
    <rect x="1070" y="152" width="490" height="300" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    
    <g transform="translate(1088, 166)">
      <circle cx="20" cy="22" r="14" fill="none" stroke="#207448" stroke-width="4"/>
      <circle cx="20" cy="22" r="5" fill="#207448"/>
      <path d="M 32 28 L 50 44 L 46 48 L 40 44 L 36 48 L 30 42" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1158" y="202" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Permissions calls</text>

    <text x="1092" y="248" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1092" dy="0">os.chmod, os.chown, os.umask,</tspan>
      <tspan x="1092" dy="36">Path.chmod, stat modes</tspan>
      <tspan x="1092" dy="36">such as stat.S_IRUSR;</tspan>
      <tspan x="1092" dy="36" font-family="sans-serif">os.access exists but</tspan>
      <tspan x="1092" dy="36" font-family="sans-serif">beware TOCTOU races</tspan>
    </text>
  </g>

  
  <g id="panel-overlapping-runs">
    <rect x="1070" y="472" width="490" height="473" rx="12" fill="#ffffff" stroke="#c2d6c7" stroke-width="2"/>
    
    <g transform="translate(1088, 486)">
      <rect x="6" y="14" width="28" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 12 14 L 12 8 C 12 4.7 15 2 20 2 C 25 2 28 4.7 28 8 L 28 14" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
      <rect x="22" y="26" width="28" height="24" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 28 26 L 28 20 C 28 16.7 31 14 36 14 C 41 14 44 16.7 44 20 L 44 26" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1158" y="522" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Overlapping runs</text>

    <text x="1092" y="566" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1092" dy="0" font-family="monospace">fcntl.flock(fd,</tspan>
      <tspan x="1092" dy="28" font-family="monospace">LOCK_EX | LOCK_NB)</tspan>
      <tspan x="1092" dy="28">is advisory (enforced only</tspan>
      <tspan x="1092" dy="28">for programs that ask) and</tspan>
      <tspan x="1092" dy="28">released when the process</tspan>
      <tspan x="1092" dy="28">exits; other options:</tspan>
      <tspan x="1092" dy="28" font-family="monospace">os.open with O_CREAT |</tspan>
      <tspan x="1092" dy="28">O_EXCL, the filelock library,</tspan>
      <tspan x="1092" dy="28">the flock command, database</tspan>
      <tspan x="1092" dy="28">or etcd leases for</tspan>
      <tspan x="1092" dy="28">distributed locks; sample:</tspan>
      <tspan x="1092" dy="28" font-family="monospace">BlockingIOError then</tspan>
      <tspan x="1092" dy="28">sys.exit(another instance</tspan>
      <tspan x="1092" dy="28">is running)</tspan>
    </text>
  </g>

  
  <g id="archive-strip">
    <rect x="40" y="965" width="1520" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
    
    <g transform="translate(60, 1002)">
      <rect x="6" y="16" width="44" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4"/>
      <path d="M 6 16 L 28 4 L 50 16" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round"/>
      <line x1="28" y1="4" x2="28" y2="30" stroke="#207448" stroke-width="3"/>
      <line x1="16" y1="26" x2="40" y2="26" stroke="#207448" stroke-width="3"/>
    </g>
    <text x="135" y="1000" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="135" dy="0">tarfile with untrusted archives: a member name such as ../ writes outside</tspan>
      <tspan x="135" dy="26">the chosen directory; use filter=data on 3.12 or later, or validate each member;</tspan>
      <tspan x="135" dy="26">rmtree is dangerous, validate the path first; shutil.copy2 preserves metadata;</tspan>
      <tspan x="135" dy="26">hashlib.sha256 streams a digest in 1 MiB chunks</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="55" rx="10" fill="#207448"/>
    <text x="800" y="1151" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Attempt the operation and handle the failure instead of checking first</text>
  </g>
</svg>