<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Streaming a child, building a pipeline, and killing the whole tree</title>
  <desc>Visual guide to subprocess streaming with timeouts, pipeline construction without a shell, and process tree termination</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Streaming a child, building a pipeline,</tspan>
    <tspan x="800" dy="54">and killing the whole tree</tspan>
  </text>

  
  <g id="lane-1">
    <rect x="40" y="135" width="1520" height="240" rx="14" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    <text x="65" y="174" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Stream with a deadline</text>

    
    <rect x="60" y="192" width="510" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="95" cy="226" r="24" fill="#207448"/>
    <text x="95" y="235" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <rect x="135" y="208" width="46" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M143 220 l6 6 l-6 6 M155 232 h12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="80" y="278" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">Popen([ping, -c, 5, 10.0.0.1],</tspan>
      <tspan x="80" dy="30">      stdout=PIPE, stderr=STDOUT,</tspan>
      <tspan x="80" dy="30">      text=True, bufsize=1)</tspan>
    </text>

    
    <line x1="570" y1="274" x2="618" y2="274" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <rect x="620" y="192" width="640" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="655" cy="226" r="24" fill="#207448"/>
    <text x="655" y="235" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <circle cx="705" cy="226" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M705 214 v12 h8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="640" y="278" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="640" dy="0">deadline = time.monotonic() + 30;</tspan>
      <tspan x="640" dy="30">for line in p.stdout: handle(line);</tspan>
      <tspan x="640" dy="30">if past the deadline: p.kill(); break</tspan>
    </text>

    
    <line x1="1260" y1="274" x2="1308" y2="274" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <rect x="1310" y="192" width="230" height="165" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="1345" cy="226" r="24" fill="#207448"/>
    <text x="1345" y="235" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    
    <circle cx="1395" cy="226" r="18" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M1387 226 l6 6 l10 -10" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="1330" y="295" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1330" dy="0">rc = p.wait()</tspan>
    </text>
  </g>

  
  <g id="lane-2">
    <rect x="40" y="395" width="1520" height="260" rx="14" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    <text x="65" y="434" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Pipeline without a shell: dmesg | grep -i error | tail -20</text>

    
    <rect x="60" y="452" width="270" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="80" y="490" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">p1</text>
    
    <rect x="268" y="466" width="36" height="44" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M276 478 h20 M276 488 h20 M276 498 h12" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="80" y="546" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">Popen([dmesg],</tspan>
      <tspan x="80" dy="32">      stdout=PIPE)</tspan>
    </text>

    
    <line x1="330" y1="544" x2="368" y2="544" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <rect x="370" y="452" width="380" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="390" y="490" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">p2</text>
    
    <circle cx="700" cy="484" r="14" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="711" y1="495" x2="724" y2="508" stroke="#207448" stroke-width="4" stroke-linecap="round"/>
    
    <text x="390" y="534" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="390" dy="0">Popen([grep, -i, error],</tspan>
      <tspan x="390" dy="30">      stdin=p1.stdout,</tspan>
      <tspan x="390" dy="30">      stdout=PIPE)</tspan>
    </text>

    
    <line x1="750" y1="544" x2="788" y2="544" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)"/>

    
    <rect x="790" y="452" width="360" height="185" rx="10" fill="#fff9f3" stroke="#db8129" stroke-width="3"/>
    
    <path d="M822 470 l18 32 h-36 z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round"/>
    <line x1="822" y1="482" x2="822" y2="491" stroke="#db8129" stroke-width="3" stroke-linecap="round"/>
    <circle cx="822" cy="496" r="2" fill="#db8129"/>
    
    <text x="810" y="534" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="810" dy="0" font-family="monospace" font-weight="bold">p1.stdout.close()</tspan>
      <tspan x="810" dy="32">so p1 can receive SIGPIPE</tspan>
      <tspan x="810" dy="32">if p2 exits</tspan>
    </text>

    
    <line x1="1150" y1="544" x2="1188" y2="544" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <rect x="1190" y="452" width="350" height="185" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    <text x="1210" y="490" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">p3</text>
    
    <rect x="1485" y="466" width="36" height="44" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M1493 478 h20 M1493 488 h20 M1497 498 l6 6 l6 -6" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="1210" y="524" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1210" dy="0">run([tail, -20],</tspan>
      <tspan x="1210" dy="28">    stdin=p2.stdout,</tspan>
      <tspan x="1210" dy="28">    capture_output=True,</tspan>
      <tspan x="1210" dy="28">    text=True)</tspan>
    </text>
  </g>

  
  <g id="lane-3">
    <rect x="40" y="675" width="1520" height="160" rx="14" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    <text x="65" y="714" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Kill the whole tree on timeout</text>

    
    <rect x="60" y="730" width="670" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="95" cy="772" r="24" fill="#207448"/>
    <text x="95" y="781" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    
    <circle cx="140" cy="772" r="6" fill="none" stroke="#207448" stroke-width="3"/>
    <circle cx="168" cy="760" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <circle cx="168" cy="784" r="5" fill="none" stroke="#207448" stroke-width="2.5"/>
    <path d="M146 772 h8 c3 0 5 -12 9 -12 M154 772 c3 0 5 12 9 12" fill="none" stroke="#207448" stroke-width="2.5"/>
    
    <text x="195" y="780" font-family="monospace" font-size="24" fill="#303a36">p = Popen(cmd, start_new_session=True)</text>

    
    <line x1="730" y1="772" x2="798" y2="772" stroke="#207448" stroke-width="4" marker-end="url(#arrow)"/>

    
    <rect x="800" y="730" width="740" height="85" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
    
    <circle cx="835" cy="772" r="24" fill="#207448"/>
    <text x="835" y="781" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    
    <circle cx="880" cy="772" r="16" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M871 763 l18 18 M889 763 l-18 18" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    
    <text x="915" y="780" font-family="monospace" font-size="24" fill="#303a36">os.killpg(os.getpgid(p.pid), signal.SIGTERM)</text>
  </g>

  
  <g id="side-facts">
    
    <rect x="40" y="855" width="480" height="240" rx="12" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    
    <path d="M68 876 l18 5 v12 c0 11 -9 18 -18 22 c-9 -4 -18 -11 -18 -22 v-12 z" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round"/>
    <path d="M63 893 l4 4 l8 -8" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="897" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">deadlock avoidance:</text>
    
    <text x="60" y="934" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="60" dy="0">communicate(),</tspan>
      <tspan x="60" dy="32">capture_output=True,</tspan>
      <tspan x="60" dy="32">merge stderr=STDOUT, threads,</tspan>
      <tspan x="60" dy="32">or asyncio.create_subprocess_exec</tspan>
      <tspan x="60" dy="32">(chapter 3.6)</tspan>
    </text>

    
    <rect x="540" y="855" width="560" height="240" rx="12" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    
    <path d="M570 914 v-20 a14 14 0 0 1 28 0 v20 z" fill="none" stroke="#207448" stroke-width="3"/>
    <line x1="564" y1="914" x2="604" y2="914" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <line x1="584" y1="888" x2="584" y2="904" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="578" y1="894" x2="590" y2="894" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="560" y="940" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="560" dy="0">a zombie is a finished child whose</tspan>
      <tspan x="560" dy="32">exit status nobody collected;</tspan>
      <tspan x="560" dy="32">wait() and communicate() reap</tspan>
      <tspan x="560" dy="32">children; unreaped children</tspan>
      <tspan x="560" dy="32">linger as defunct</tspan>
    </text>

    
    <rect x="1120" y="855" width="440" height="240" rx="12" fill="#e8f1ea" stroke="#c2d9c7" stroke-width="2"/>
    
    <circle cx="1152" cy="894" r="8" fill="none" stroke="#207448" stroke-width="3"/>
    <path d="M1152 878 v4 M1152 906 v4 M1136 894 h4 M1164 894 h4 M1141 883 l3 3 M1160 902 l3 3 M1141 905 l3 -3 M1160 886 l3 -3" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round"/>
    <text x="1178" y="902" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">services and daemons:</text>
    
    <text x="1140" y="954" font-family="sans-serif" font-size="24" fill="#303a36">
      <tspan x="1140" dy="0">use Popen and manage</tspan>
      <tspan x="1140" dy="36">the lifecycle yourself</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="40" y="1115" width="1520" height="65" rx="10" fill="#207448"/>
    <text x="800" y="1157" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
      Reap every child, and kill the process group, not just the parent
    </text>
  </g>
</svg>