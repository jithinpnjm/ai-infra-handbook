<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>A block tries the change, rescue recovers from a failure, and always runs in every case</title>
  <desc>Infographic explaining Ansible try-except-finally pattern with block, rescue, and always lanes, showing failure recovery flow and diagnostic execution.</desc>

  <defs>
    
    <marker id="arrow-orange" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#db8129" />
    </marker>
    
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 0 2 L 16 9 L 0 16 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">
    <tspan x="800" y="58">A block tries the change, rescue recovers from a failure,</tspan>
    <tspan x="800" y="112">and always runs in every case</tspan>
  </text>

  
  <g id="lane-block">
    
    <rect x="50" y="148" width="1060" height="270" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="80" y="194" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">block: the change</text>

    
    <g id="box-install-driver">
      <rect x="75" y="216" width="315" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(142, 226)">
        <rect x="0" y="8" width="56" height="34" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="12" y1="42" x2="12" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="22" y1="42" x2="22" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="32" y1="42" x2="32" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="42" y1="42" x2="42" y2="48" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="25" r="8" fill="none" stroke="#207448" stroke-width="4" />
      </g>
      
      <g transform="translate(262, 230)">
        <circle cx="16" cy="16" r="16" fill="#fdf2f2" stroke="#d9383a" stroke-width="2" />
        <line x1="8" y1="8" x2="24" y2="24" stroke="#d9383a" stroke-width="4" stroke-linecap="round" />
        <line x1="24" y1="8" x2="8" y2="24" stroke="#d9383a" stroke-width="4" stroke-linecap="round" />
      </g>
      
      <text x="232" y="302" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Install new driver</text>
      
      <rect x="85" y="322" width="295" height="62" rx="6" fill="#fdf2f2" stroke="#d9383a" stroke-width="1.5" />
      <text font-family="sans-serif" font-size="24" font-weight="bold" fill="#d9383a" text-anchor="middle">
        <tspan x="232" y="348">task fails:</tspan>
        <tspan x="232" y="374">the block stops here</tspan>
      </text>
    </g>

    
    <g id="box-reload-module">
      <rect x="422" y="216" width="315" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(552, 230)">
        <path d="M 46 22 A 20 20 0 1 0 42 36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <polyline points="46,12 46,24 34,24" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="580" y="324">Reload</tspan>
        <tspan x="580" y="364">kernel module</tspan>
      </text>
    </g>

    
    <g id="box-verify-gpus">
      <rect x="770" y="216" width="315" height="180" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(899, 230)">
        <rect x="6" y="6" width="44" height="44" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <line x1="16" y1="0" x2="16" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="28" y1="0" x2="28" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <line x1="40" y1="0" x2="40" y2="6" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <polyline points="18,28 26,36 38,20" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <text x="927" y="344" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Verify GPUs</text>
    </g>
  </g>

  
  <path d="M 232 396 L 232 462" stroke="#db8129" stroke-width="5" fill="none" marker-end="url(#arrow-orange)" />

  
  <g id="lane-rescue">
    
    <rect x="50" y="470" width="1060" height="270" rx="16" fill="#fffaf5" stroke="#db8129" stroke-width="4" />
    
    <text x="80" y="516" font-family="sans-serif" font-size="32" font-weight="bold" fill="#db8129">rescue: runs only after a failure</text>

    
    <g id="box-record-failed-task">
      <rect x="75" y="538" width="315" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      
      <g transform="translate(204, 548)">
        <rect x="8" y="10" width="40" height="42" rx="4" fill="none" stroke="#207448" stroke-width="4" />
        <path d="M 20 10 L 20 4 L 36 4 L 36 10 Z" fill="none" stroke="#207448" stroke-width="3" />
        <line x1="16" y1="22" x2="40" y2="22" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="16" y1="32" x2="40" y2="32" stroke="#207448" stroke-width="3" stroke-linecap="round" />
        <line x1="16" y1="42" x2="30" y2="42" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      </g>
      
      <text x="232" y="632" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">Record</text>
      <text x="232" y="674" font-family="monospace" font-size="24" fill="#303a36" text-anchor="middle">ansible_failed_task</text>
    </g>

    
    <g id="box-rollback-driver">
      <rect x="422" y="538" width="315" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      
      <g transform="translate(552, 548)">
        <path d="M 44 42 A 18 18 0 0 0 16 26 L 10 26" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <polyline points="20,16 10,26 20,36" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="580" y="632">Roll back to</tspan>
        <tspan x="580" y="674">the old driver</tspan>
      </text>
    </g>

    
    <g id="box-fail-host">
      <rect x="770" y="538" width="315" height="180" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="2" />
      
      <g transform="translate(899, 546)">
        <polygon points="28,4 52,48 4,48" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
        <line x1="28" y1="20" x2="28" y2="34" stroke="#207448" stroke-width="4" stroke-linecap="round" />
        <circle cx="28" cy="42" r="2" fill="#207448" />
      </g>
      
      <text font-family="sans-serif" text-anchor="middle">
        <tspan x="927" y="622" font-size="30" font-weight="bold" fill="#303a36">fail:</tspan>
        <tspan x="927" y="658" font-size="24" fill="#303a36">keep node drained</tspan>
        <tspan x="927" y="692" font-size="24" fill="#303a36">and fail the host loudly</tspan>
      </text>
    </g>
  </g>

  
  <path d="M 927 740 L 927 784" stroke="#207448" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />

  
  <g id="lane-always">
    
    <rect x="50" y="790" width="1060" height="225" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <text x="80" y="836" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">always: runs in every case</text>

    
    <g id="box-collect-journal">
      <rect x="180" y="858" width="800" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(215, 898)">
        <rect x="0" y="0" width="56" height="48" rx="6" fill="none" stroke="#207448" stroke-width="4" />
        <polyline points="12,18 20,24 12,30" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="26" y1="30" x2="42" y2="30" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      </g>
      
      <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36" text-anchor="middle">
        <tspan x="610" y="918">Collect kernel journal tail</tspan>
        <tspan x="610" y="960">for diagnostics</tspan>
      </text>
    </g>
  </g>

  
  <g id="side-note">
    <rect x="1150" y="320" width="400" height="490" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 6" />
    
    <g transform="translate(1322, 355)">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="28" y1="24" x2="28" y2="42" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <circle cx="28" cy="16" r="3" fill="#207448" />
    </g>
    
    <text font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="1350" y="456">If rescue finishes</tspan>
      <tspan x="1350" y="496">without failing, the host</tspan>
      <tspan x="1350" y="536">is recovered and the recap</tspan>
      <tspan x="1350" y="576">shows rescued. Re-raise</tspan>
      <tspan x="1350" y="616">with fail to keep the</tspan>
      <tspan x="1350" y="656">failure visible.</tspan>
    </text>
  </g>

  
  <g id="takeaway-caption">
    <rect x="50" y="1055" width="1500" height="100" rx="16" fill="#207448" />
    <text font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan x="800" y="1098">block says what to try, rescue says what to do when it breaks,</tspan>
      <tspan x="800" y="1134">always says what must happen anyway.</tspan>
    </text>
  </g>
</svg>