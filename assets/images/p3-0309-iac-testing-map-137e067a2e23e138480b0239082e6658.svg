<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Which checker for which infrastructure file type</title>
  <desc>A reference table mapping infrastructure file types such as Ansible, Terraform, Kubernetes, Docker, Shell, Jinja, and YAML to their recommended validation and testing checkers.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">Which checker for which infrastructure file type</text>

  
  
  <path d="M 40,145 L 40,103 Q 40,95 48,95 L 1552,95 Q 1560,95 1560,103 L 1560,145 Z" fill="#207448" />
  <line x1="530" y1="95" x2="530" y2="145" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  <text x="70" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">File type</text>
  <text x="560" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Checks</text>

  
  <rect x="40" y="145" width="1520" height="105" fill="#ffffff" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="145" x2="530" y2="250" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 170)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="4" width="40" height="48" rx="4" />
    <line x1="14" y1="14" x2="26" y2="14" />
    <line x1="14" y1="22" x2="34" y2="22" />
    <polygon points="20,32 34,39 20,46" fill="#207448" stroke="none" />
  </g>
  <text x="145" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ansible</text>
  <text x="560" y="177" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">yamllint ., ansible-lint, ansible-later (.later.yml),</text>
  <text x="560" y="207" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">ansible-playbook --syntax-check,</text>
  <text x="560" y="237" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">--check --diff against a staging host</text>

  
  <rect x="40" y="250" width="1520" height="165" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="250" x2="530" y2="415" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 305)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="38" x2="28" y2="20" />
    <line x1="28" y1="20" x2="42" y2="34" />
    <line x1="28" y1="20" x2="36" y2="8" />
    <circle cx="14" cy="38" r="7" fill="#e8f1ea" />
    <circle cx="28" cy="20" r="8" fill="#e8f1ea" />
    <circle cx="42" cy="34" r="6" fill="#e8f1ea" />
    <circle cx="36" cy="8" r="5" fill="#e8f1ea" />
  </g>
  <text x="145" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Ansible roles</text>
  <text x="145" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">(Molecule)</text>
  <text x="560" y="282" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">molecule init scenario -r ssh --driver-name docker;</text>
  <text x="560" y="312" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
    <tspan>molecule create, converge, </tspan>
    <tspan fill="#db8129" font-weight="bold">idempotence</tspan>
    <tspan>, verify, destroy;</tspan>
  </text>
  <text x="560" y="342" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">drivers Docker, Podman, Vagrant, VirtualBox, cloud;</text>
  <text x="560" y="372" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Testinfra checks real host state;</text>
  <text x="560" y="402" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">or Goss: goss -g test_sshd.yml validate</text>

  
  <rect x="40" y="415" width="1520" height="105" fill="#ffffff" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="415" x2="530" y2="520" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 440)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="18" height="18" rx="2" />
    <rect x="28" y="8" width="18" height="18" rx="2" />
    <rect x="18" y="28" width="18" height="18" rx="2" />
  </g>
  <text x="145" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Terraform and</text>
  <text x="145" y="491" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">OpenTofu</text>
  <text x="560" y="447" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">fmt -check, validate, tflint; OPA and Conftest,</text>
  <text x="560" y="477" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Checkov or tfsec policy; plan in CI with output reviewed;</text>
  <text x="560" y="507" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">Terratest in Go or terraform test for ephemeral environments</text>

  
  <rect x="40" y="520" width="1520" height="130" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="520" x2="530" y2="650" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 557)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="20" />
    <circle cx="28" cy="28" r="6" />
    <line x1="28" y1="8" x2="28" y2="2" />
    <line x1="28" y1="48" x2="28" y2="54" />
    <line x1="10" y1="18" x2="5" y2="15" />
    <line x1="46" y1="38" x2="51" y2="41" />
    <line x1="10" y1="38" x2="5" y2="41" />
    <line x1="46" y1="18" x2="51" y2="15" />
  </g>
  <text x="145" y="573" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Kubernetes manifests</text>
  <text x="145" y="609" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">and Helm</text>
  <text x="560" y="552" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">kubeconform or kubeval; helm lint;</text>
  <text x="560" y="582" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">helm template piped into kubeconform;</text>
  <text x="560" y="612" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">kube-linter and conftest policies; kind smoke deploys;</text>
  <text x="560" y="642" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">chainsaw or kuttl for operators</text>

  
  <rect x="40" y="650" width="1520" height="75" fill="#ffffff" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="650" x2="530" y2="725" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 660)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="10" width="44" height="34" rx="3" />
    <line x1="17" y1="10" x2="17" y2="44" />
    <line x1="28" y1="10" x2="28" y2="44" />
    <line x1="39" y1="10" x2="39" y2="44" />
    <line x1="6" y1="27" x2="50" y2="27" />
  </g>
  <text x="145" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Dockerfiles and</text>
  <text x="145" y="711" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">images</text>
  <text x="560" y="695" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">hadolint; trivy or grype scans; container-structure-test</text>

  
  <rect x="40" y="725" width="1520" height="70" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="725" x2="530" y2="795" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 732)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="8" width="44" height="36" rx="4" />
    <polyline points="14,21 21,27 14,33" />
    <line x1="26" y1="33" x2="36" y2="33" />
  </g>
  <text x="145" y="770" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Shell</text>
  <text x="560" y="767" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">shellcheck, shfmt, bats</text>

  
  <rect x="40" y="795" width="1520" height="105" fill="#ffffff" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="795" x2="530" y2="900" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 820)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="12" width="44" height="30" rx="4" />
    <line x1="14" y1="27" x2="42" y2="27" />
    <polyline points="19,22 14,27 19,32" />
    <polyline points="37,22 42,27 37,32" />
    <circle cx="14" cy="46" r="2" fill="#207448" />
    <circle cx="28" cy="46" r="2" fill="#207448" />
    <circle cx="42" cy="46" r="2" fill="#207448" />
  </g>
  <text x="145" y="835" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Jinja network</text>
  <text x="145" y="871" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">templates</text>
  <text x="560" y="827" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">render with representative variables, diff against golden files,</text>
  <text x="560" y="857" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">validate with the target parser such as nft -c -f</text>
  <text x="560" y="887" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">or FRR vtysh dry-run style checks</text>

  
  <path d="M 40,900 L 1560,900 L 1560,972 Q 1560,980 1552,980 L 48,980 Q 40,980 40,972 Z" fill="#e8f1ea" stroke="#d0ded3" stroke-width="1" />
  <line x1="530" y1="900" x2="530" y2="980" stroke="#d0ded3" stroke-width="1" />
  
  <g transform="translate(65, 912)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="38" height="44" rx="4" />
    <line x1="16" y1="18" x2="38" y2="18" />
    <line x1="16" y1="28" x2="38" y2="28" />
    <line x1="16" y1="38" x2="38" y2="38" />
    <circle cx="22" cy="18" r="3" fill="#207448" />
    <circle cx="32" cy="28" r="3" fill="#207448" />
    <circle cx="20" cy="38" r="3" fill="#207448" />
  </g>
  <text x="145" y="950" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Config YAML</text>
  <text x="560" y="935" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">pydantic or JSON Schema in CI</text>
  <text x="560" y="965" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">so malformed YAML never reaches production</text>

  
  <rect x="40" y="95" width="1520" height="885" rx="8" fill="none" stroke="#207448" stroke-width="3" />

  
  <rect x="40" y="1005" width="1520" height="70" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(65, 1020)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="16" />
    <line x1="20" y1="18" x2="20" y2="28" />
    <circle cx="20" cy="12" r="1.5" fill="#207448" stroke="none" />
  </g>
  <text x="120" y="1048" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a green Python suite says nothing about the playbooks, manifests or templates beside it</text>

  
  <rect x="40" y="1095" width="1520" height="70" rx="8" fill="#207448" />
  <text x="800" y="1139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Pick the checker for each file type and make it a required CI step</text>
</svg>