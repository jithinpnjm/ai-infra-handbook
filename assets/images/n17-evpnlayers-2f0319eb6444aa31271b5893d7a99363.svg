<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180">
  <title>EVPN: underlay and overlay</title>
  <desc>Visual comparison showing the Underlay IP ECMP fabric layer and the Overlay EVPN BGP and VXLAN tunnel layer with MAC-VRF, IP-VRF, and RD chips.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 2 L 16 9 L 0 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-green-rev" viewBox="0 0 18 18" refX="2" refY="9" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 18 2 L 2 9 L 18 16 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1180" fill="#f5f8f5" />

  
  <text x="800" y="62" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">EVPN: underlay and overlay</text>

  
  
  <g id="chip-evi">
    <rect x="90" y="96" width="450" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(106, 105)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="48" height="36" rx="6" />
      <path d="M 12 28 L 22 28 M 34 28 L 44 28" />
      <circle cx="28" cy="28" r="3" fill="#207448" />
    </g>
    <text x="178" y="128" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="178" dy="0">EVI = MAC-VRF</tspan>
      <tspan x="178" dy="28">for an L2 segment</tspan>
    </text>
  </g>

  
  <g id="chip-ip-vrf">
    <rect x="575" y="96" width="450" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(591, 105)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="22" />
      <path d="M 14 28 L 42 28 M 28 14 L 28 42" />
      <path d="M 36 22 L 42 28 L 36 34 M 20 34 L 14 28 L 20 22" />
    </g>
    <text x="663" y="128" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="663" dy="0">IP-VRF for</tspan>
      <tspan x="663" dy="28">L3 routing</tspan>
    </text>
  </g>

  
  <g id="chip-rd">
    <rect x="1060" y="96" width="450" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(1076, 105)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 8 L 46 16 L 46 32 C 46 42 38 48 28 52 C 18 48 10 42 10 32 L 10 16 Z" />
      <path d="M 22 28 L 26 32 L 34 24" />
    </g>
    <text x="1148" y="128" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1148" dy="0">RD makes routes</tspan>
      <tspan x="1148" dy="28">unique across VRFs</tspan>
    </text>
  </g>

  
  <g id="layer-overlay">
    <rect x="60" y="195" width="1480" height="465" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="85" y="212" width="190" height="46" rx="8" fill="#207448" />
    <text x="180" y="245" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Overlay</text>

    
    
    <g id="overlay-spines">
      <rect x="90" y="272" width="890" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(112, 286)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <path d="M 16 28 L 40 28 M 32 20 L 40 28 L 32 36" />
      </g>
      
      <g transform="translate(898, 286)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <path d="M 40 28 L 16 28 M 24 20 L 16 28 L 24 36" />
      </g>
      <text x="535" y="308" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="535" dy="0">spines act as route servers,</tspan>
        <tspan x="535" dy="30">not tunnel endpoints</tspan>
      </text>
    </g>

    
    <line x1="320" y1="356" x2="320" y2="388" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <line x1="750" y1="356" x2="750" y2="388" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />

    
    <g id="overlay-bgp-sessions">
      <rect x="90" y="388" width="890" height="76" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="8 5" />
      <g transform="translate(112, 398)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="20" />
        <path d="M 18 28 L 38 28 M 28 18 L 28 38" />
      </g>
      <text x="545" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        <tspan x="545" dy="0">EVPN as an extra BGP address family</tspan>
        <tspan x="545" dy="28">on the leaf-spine sessions</tspan>
      </text>
    </g>

    
    <line x1="230" y1="496" x2="230" y2="464" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <line x1="535" y1="496" x2="535" y2="464" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
    <line x1="840" y1="496" x2="840" y2="464" stroke="#207448" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />

    
    <g id="overlay-leaves">
      <rect x="90" y="496" width="890" height="142" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />

      
      <line x1="270" y1="540" x2="500" y2="540" stroke="#207448" stroke-width="5" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)" />
      <line x1="570" y1="540" x2="800" y2="540" stroke="#207448" stroke-width="5" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)" />

      
      <g transform="translate(202, 512)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="6" fill="#207448" />
      </g>
      
      <g transform="translate(507, 512)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="6" fill="#207448" />
      </g>
      
      <g transform="translate(812, 512)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="6" fill="#207448" />
      </g>

      <text x="535" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
        leaves are VTEPs with VXLAN tunnels between them
      </text>
    </g>

    
    <g id="overlay-callout">
      <rect x="1015" y="272" width="505" height="366" rx="14" fill="#ffffff" stroke="#db8129" stroke-width="3.5" />
      <rect x="1015" y="272" width="505" height="74" rx="14" fill="#fcf3eb" stroke="#db8129" stroke-width="1" />

      
      <g transform="translate(1239, 281)" stroke="#db8129" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 18 L 32 10 L 32 46 L 12 38 Z" />
        <path d="M 32 20 C 40 22 46 25 46 28 C 46 31 40 34 32 36" />
        <path d="M 18 38 L 18 48 L 26 48 L 26 36" />
      </g>

      <text x="1267" y="408" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="1267" dy="0">BGP tells every VTEP</tspan>
        <tspan x="1267" dy="38">where each MAC and</tspan>
        <tspan x="1267" dy="38">IP lives, so no</tspan>
        <tspan x="1267" dy="38">flooding to learn</tspan>
      </text>
    </g>
  </g>

  
  <g id="layer-underlay">
    <rect x="60" y="685" width="1480" height="465" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

    
    <rect x="85" y="702" width="190" height="46" rx="8" fill="#207448" />
    <text x="180" y="735" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Underlay</text>

    
    
    <g id="underlay-spines">
      <rect x="90" y="762" width="890" height="84" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(302, 776)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <path d="M 14 28 L 42 28 M 28 16 L 28 40" />
      </g>
      
      <g transform="translate(732, 776)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <path d="M 14 28 L 42 28 M 28 16 L 28 40" />
      </g>
    </g>

    
    <line x1="330" y1="846" x2="330" y2="876" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <line x1="760" y1="846" x2="760" y2="876" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="underlay-ecmp-bus">
      <rect x="90" y="876" width="890" height="74" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      <line x1="160" y1="913" x2="820" y2="913" stroke="#207448" stroke-width="4" />
      
      <circle cx="230" cy="913" r="7" fill="#207448" />
      <circle cx="330" cy="913" r="7" fill="#207448" />
      <circle cx="535" cy="913" r="7" fill="#207448" />
      <circle cx="760" cy="913" r="7" fill="#207448" />
      <circle cx="840" cy="913" r="7" fill="#207448" />
    </g>

    
    <line x1="230" y1="950" x2="230" y2="980" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <line x1="535" y1="950" x2="535" y2="980" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    <line x1="840" y1="950" x2="840" y2="980" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

    
    <g id="underlay-leaves">
      <rect x="90" y="980" width="890" height="148" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" />
      
      <g transform="translate(202, 1024)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="8" />
      </g>
      
      <g transform="translate(507, 1024)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="8" />
      </g>
      
      <g transform="translate(812, 1024)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="44" height="40" rx="6" />
        <circle cx="28" cy="28" r="8" />
      </g>
    </g>

    
    <g id="underlay-fabric-card">
      <rect x="1015" y="762" width="505" height="366" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2.5" />
      <rect x="1015" y="762" width="505" height="74" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="1" />

      
      <g transform="translate(1239, 771)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="6" />
        <circle cx="40" cy="16" r="6" />
        <circle cx="16" cy="40" r="6" />
        <circle cx="40" cy="40" r="6" />
        <path d="M 22 16 L 34 16 M 16 22 L 16 34 M 40 22 L 40 34 M 22 40 L 34 40 M 21 21 L 35 35" />
      </g>

      <text x="1267" y="888" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#303a36">
        <tspan x="1267" dy="0">eBGP, OSPF or IS-IS</tspan>
        <tspan x="1267" dy="38">ECMP fabric giving</tspan>
        <tspan x="1267" dy="38">IP reachability</tspan>
        <tspan x="1267" dy="38">between VTEP</tspan>
        <tspan x="1267" dy="38">loopbacks</tspan>
      </text>
    </g>
  </g>
</svg>