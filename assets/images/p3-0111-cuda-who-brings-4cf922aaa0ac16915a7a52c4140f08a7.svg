<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Who supplies what when a CUDA program starts: the app brings libraries, the host brings the driver</title>
  <desc>Infographic showing the division of responsibilities between containerized application libraries and host driver components during CUDA program startup.</desc>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Who supplies what when a CUDA program starts:</text>
  <text x="800" y="112" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">the app brings libraries, the host brings the driver</text>

  
  <rect x="40" y="150" width="610" height="595" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(65, 172)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="2" y="8" width="48" height="34" rx="4"/>
    <line x1="14" y1="8" x2="14" y2="42"/>
    <line x1="26" y1="8" x2="26" y2="42"/>
    <line x1="38" y1="8" x2="38" y2="42"/>
    <path d="M10,8 L26,2 L42,8"/>
  </g>
  <text x="135" y="204" font-family="sans-serif" font-size="32" font-weight="bold" fill="#207448">Container</text>

  
  <text x="345" y="248" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">Travels with the application</text>
  <text x="345" y="280" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#207448">(wheel or container image)</text>

  
  <rect x="65" y="300" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="329" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Python extension modules</text>

  <rect x="65" y="348" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="377" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libtorch_cuda.so</text>

  <rect x="65" y="396" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="425" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libcudart.so.12</text>

  <rect x="65" y="444" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="473" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libcublas.so.12</text>

  <rect x="65" y="492" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="521" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libcudnn.so.9</text>

  <rect x="65" y="540" width="560" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="345" y="569" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libnccl.so.2</text>

  
  <rect x="65" y="595" width="560" height="130" rx="10" fill="#d8e8dc" stroke="#207448" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="345" y="632" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">found through RUNPATH with $ORIGIN;</text>
  <text x="345" y="664" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">can differ per application so several</text>
  <text x="345" y="696" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">CUDA versions share one host</text>

  
  <rect x="665" y="235" width="330" height="135" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="830" y="268" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">NVIDIA Container</text>
  <text x="830" y="296" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Toolkit injects</text>
  <text x="830" y="324" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">these into the</text>
  <text x="830" y="352" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">container at start</text>

  <line x1="1010" y1="390" x2="668" y2="390" stroke="#207448" stroke-width="4"/>
  <polygon points="650,390 668,381 668,399" fill="#207448"/>

  
  <rect x="1010" y="150" width="550" height="595" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3"/>

  
  <g transform="translate(1035, 172)" stroke="#207448" stroke-width="4" fill="none">
    <rect x="2" y="4" width="48" height="16" rx="3"/>
    <rect x="2" y="24" width="48" height="16" rx="3"/>
    <circle cx="10" cy="12" r="2" fill="#207448"/>
    <circle cx="10" cy="32" r="2" fill="#207448"/>
    <line x1="20" y1="12" x2="42" y2="12"/>
    <line x1="20" y1="32" x2="42" y2="32"/>
  </g>
  <text x="1105" y="204" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Comes from the host (driver)</text>

  
  <rect x="1030" y="240" width="510" height="95" rx="10" fill="#fff9f2" stroke="#db8129" stroke-width="3"/>
  <g transform="translate(1048, 264)" stroke="#db8129" stroke-width="3.5" fill="none">
    <rect x="6" y="6" width="34" height="34" rx="4"/>
    <line x1="12" y1="2" x2="12" y2="6"/>
    <line x1="23" y1="2" x2="23" y2="6"/>
    <line x1="34" y1="2" x2="34" y2="6"/>
    <line x1="12" y1="40" x2="12" y2="44"/>
    <line x1="23" y1="40" x2="23" y2="44"/>
    <line x1="34" y1="40" x2="34" y2="44"/>
    <line x1="2" y1="12" x2="6" y2="12"/>
    <line x1="2" y1="23" x2="6" y2="23"/>
    <line x1="2" y1="34" x2="6" y2="34"/>
    <line x1="40" y1="12" x2="44" y2="12"/>
    <line x1="40" y1="23" x2="44" y2="23"/>
    <line x1="40" y1="34" x2="44" y2="34"/>
  </g>
  <text x="1115" y="278" font-family="monospace" font-size="26" font-weight="bold" fill="#db8129">libcuda.so.1</text>
  <text x="1115" y="312" font-family="sans-serif" font-size="24" fill="#303a36">(user-space half of the driver)</text>

  
  <rect x="1030" y="350" width="510" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1048, 364)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="23" cy="23" r="18"/>
    <line x1="23" y1="23" x2="33" y2="15"/>
    <circle cx="23" cy="23" r="3" fill="#207448"/>
  </g>
  <text x="1115" y="396" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">libnvidia-ml.so, nvidia-smi</text>

  
  <rect x="1030" y="440" width="510" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1048, 454)" stroke="#207448" stroke-width="3.5" fill="none">
    <circle cx="23" cy="23" r="8"/>
    <circle cx="23" cy="23" r="16" stroke-dasharray="7 5"/>
  </g>
  <text x="1115" y="486" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">kernel module nvidia.ko</text>

  
  <rect x="1030" y="530" width="510" height="115" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <g transform="translate(1048, 564)" stroke="#207448" stroke-width="3.5" fill="none">
    <rect x="6" y="8" width="34" height="28" rx="3"/>
    <line x1="14" y1="36" x2="14" y2="42"/>
    <line x1="23" y1="36" x2="23" y2="42"/>
    <line x1="32" y1="36" x2="32" y2="42"/>
    <circle cx="23" cy="20" r="4"/>
  </g>
  <text x="1115" y="562" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">device nodes</text>
  <text x="1115" y="594" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidiactl, /dev/nvidia0,</text>
  <text x="1115" y="626" font-family="monospace" font-size="24" fill="#303a36">/dev/nvidia-uvm</text>

  
  
  <rect x="40" y="760" width="288" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="184" cy="795" r="24" fill="#207448"/>
  <text x="184" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="184" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="184" dy="0">Python extension</tspan>
    <tspan x="184" dy="32">modules</tspan>
  </text>

  
  <rect x="348" y="760" width="288" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="492" cy="795" r="24" fill="#207448"/>
  <text x="492" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="492" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="492" dy="0">bundled CUDA</tspan>
    <tspan x="492" dy="32">libraries</tspan>
  </text>

  
  <rect x="656" y="760" width="288" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="800" cy="795" r="24" fill="#207448"/>
  <text x="800" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="800" y="865" text-anchor="middle" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0" font-family="monospace">libcuda.so.1</tspan>
    <tspan x="800" dy="32" font-family="sans-serif">via dlopen</tspan>
  </text>

  
  <rect x="964" y="760" width="288" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1108" cy="795" r="24" fill="#207448"/>
  <text x="1108" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  <text x="1108" y="840" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="1108" dy="0" font-weight="bold">openat</tspan>
    <tspan x="1108" dy="28">/dev/nvidiactl,</tspan>
    <tspan x="1108" dy="28">/dev/nvidia0,</tspan>
    <tspan x="1108" dy="28">/dev/nvidia-uvm</tspan>
  </text>

  
  <rect x="1272" y="760" width="288" height="190" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <circle cx="1416" cy="795" r="24" fill="#207448"/>
  <text x="1416" y="803" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">5</text>
  <text x="1416" y="865" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="1416" dy="0">a storm of</tspan>
    <tspan x="1416" dy="32">ioctl calls</tspan>
  </text>

  
  <rect x="40" y="970" width="1520" height="75" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2"/>
  <text x="800" y="1016" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36">strace -f -e trace=openat python -c &quot;import torch; torch.zeros(1).cuda()&quot; 2&gt;&amp;1 | grep -E &quot;\.so|nvidia&quot;</text>

  
  <rect x="40" y="1065" width="1520" height="85" rx="10" fill="#207448" stroke="#185837" stroke-width="2"/>
  <text x="800" y="1118" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff">The application&apos;s CUDA version must be supported by the host driver</text>
</svg>