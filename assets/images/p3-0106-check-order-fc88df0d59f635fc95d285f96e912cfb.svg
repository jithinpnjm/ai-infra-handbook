<svg width="1600" height="1140" viewBox="0 0 1600 1140" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>How the kernel checks permissions: first match wins, nothing adds up</title>
  <desc>Flowchart illustrating that the Linux kernel evaluates permissions sequentially by user, group, and other, stopping at the first match.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 15 9 L 1 16 Z" fill="#207448" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 18 18" refX="15" refY="9" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 15 9 L 1 16 Z" fill="#303a36" />
    </marker>
  </defs>

  
  <rect width="1600" height="1140" fill="#f5f8f5" />

  
  <text x="800" y="56" font-size="48" font-weight="bold" text-anchor="middle" fill="#303a36">How the kernel checks permissions:</text>
  <text x="800" y="112" font-size="48" font-weight="bold" text-anchor="middle" fill="#207448">first match wins, nothing adds up</text>

  

  
  <g id="start-box">
    <rect x="60" y="145" width="920" height="140" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(90, 177)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 0 L 32 0 L 48 16 L 48 56 L 8 56 Z" />
      <path d="M 32 0 L 32 16 L 48 16" />
      <line x1="16" y1="28" x2="40" y2="28" />
      <line x1="16" y1="40" x2="32" y2="40" />
    </g>
    
    <text x="165" y="195" font-size="30" font-weight="bold" fill="#303a36">Process asks to read report.txt</text>
    <text x="165" y="235" font-size="24" font-family="monospace" fill="#303a36">file: owner alice UID 1042, group projx GID 2001</text>
    <text x="165" y="267" font-size="24" font-family="monospace" fill="#207448">mode 0070 shown as '---rwx---'</text>
  </g>

  
  <line x1="270" y1="285" x2="270" y2="340" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g id="diamond-1">
    <polygon points="270,345 490,455 270,565 50,455" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    
    <g transform="translate(250, 370)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="14" r="10" />
      <path d="M 4 38 C 4 28, 12 26, 20 26 C 28 26, 36 28, 36 38" />
    </g>
    
    <text x="270" y="440" font-size="30" font-weight="bold" text-anchor="middle" fill="#303a36">Effective UID</text>
    <text x="270" y="475" font-size="30" font-weight="bold" text-anchor="middle" fill="#303a36">equals the</text>
    <text x="270" y="510" font-size="30" font-weight="bold" text-anchor="middle" fill="#303a36">file owner?</text>
    
    <circle cx="85" cy="370" r="24" fill="#207448" />
    <text x="85" y="379" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  </g>

  
  <line x1="490" y1="455" x2="555" y2="455" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="525" y="443" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">yes</text>

  
  <g id="box-1">
    <rect x="560" y="385" width="420" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(585, 430)" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="22" />
      <line x1="9" y1="9" x2="39" y2="39" />
    </g>
    <text x="645" y="432" font-size="28" font-weight="bold" fill="#303a36">Use the user triple</text>
    <text x="645" y="466" font-size="26" font-weight="bold" fill="#303a36">only: ---</text>
    <text x="645" y="500" font-size="26" font-weight="bold" fill="#c0392b">so DENIED (stop)</text>
  </g>

  
  <line x1="270" y1="565" x2="270" y2="645" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-dark)" />
  <text x="295" y="610" font-size="24" font-weight="bold" fill="#303a36">no</text>

  
  <g id="diamond-2">
    <polygon points="270,650 490,760 270,870 50,760" fill="#e8f1ea" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    
    <g transform="translate(250, 670)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="15" cy="14" r="8" />
      <path d="M 3 32 C 3 24, 9 22, 15 22 C 21 22, 27 24, 27 32" />
      <circle cx="29" cy="12" r="6" />
      <path d="M 27 22 C 31 22, 37 24, 37 30" />
    </g>
    
    <text x="270" y="730" font-size="28" font-weight="bold" text-anchor="middle" fill="#303a36">Effective GID or</text>
    <text x="270" y="762" font-size="28" font-weight="bold" text-anchor="middle" fill="#303a36">a supplementary group</text>
    <text x="270" y="794" font-size="28" font-weight="bold" text-anchor="middle" fill="#303a36">equals the</text>
    <text x="270" y="826" font-size="28" font-weight="bold" text-anchor="middle" fill="#303a36">file group?</text>
    
    <circle cx="85" cy="675" r="24" fill="#207448" />
    <text x="85" y="684" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  </g>

  
  <line x1="490" y1="760" x2="555" y2="760" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <text x="525" y="748" font-size="24" font-weight="bold" text-anchor="middle" fill="#207448">yes</text>

  
  <g id="box-2">
    <rect x="560" y="695" width="420" height="140" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(585, 740)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="22" />
      <path d="M 13 24 L 21 32 L 35 16" />
    </g>
    <text x="645" y="742" font-size="28" font-weight="bold" fill="#303a36">Use the group triple</text>
    <text x="645" y="776" font-size="26" font-weight="bold" fill="#303a36">only: rwx</text>
    <text x="645" y="810" font-size="26" font-weight="bold" fill="#207448">so GRANTED (stop)</text>
  </g>

  
  <line x1="270" y1="870" x2="270" y2="925" stroke="#303a36" stroke-width="4" marker-end="url(#arrow-dark)" />
  <text x="295" y="905" font-size="24" font-weight="bold" fill="#303a36">no</text>

  
  <g id="box-3">
    <rect x="50" y="930" width="440" height="100" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    
    <circle cx="85" cy="980" r="24" fill="#207448" />
    <text x="85" y="989" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
    
    <g transform="translate(125, 956)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="20" />
      <ellipse cx="24" cy="24" rx="9" ry="20" />
      <line x1="4" y1="24" x2="44" y2="24" />
    </g>
    
    <text x="185" y="976" font-size="28" font-weight="bold" fill="#303a36">Use the other</text>
    <text x="185" y="1010" font-size="28" font-weight="bold" fill="#303a36">triple: ---</text>
  </g>

  

  
  <g id="result-card-alice">
    <rect x="1030" y="145" width="520" height="320" rx="16" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(1065, 175)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="18" r="12" />
      <path d="M 6 46 C 6 34, 15 32, 24 32 C 33 32, 42 34, 42 46" />
      <circle cx="42" cy="16" r="10" stroke="#db8129" />
      <line x1="35" y1="16" x2="49" y2="16" />
    </g>
    
    <text x="1065" y="260" font-size="26" fill="#303a36">
      <tspan x="1065" dy="0" font-weight="bold">alice (UID 1042,</tspan>
      <tspan x="1065" dy="34" font-weight="bold">member of projx):</tspan>
      <tspan x="1065" dy="40">matches owner first,</tspan>
      <tspan x="1065" dy="34">user triple --- ,</tspan>
      <tspan x="1065" dy="36" font-weight="bold" fill="#db8129">denied even though</tspan>
      <tspan x="1065" dy="34" font-weight="bold" fill="#db8129">she is in projx</tspan>
    </text>
  </g>

  
  <g id="result-card-bob">
    <rect x="1030" y="495" width="520" height="300" rx="16" fill="#ffffff" stroke="#207448" stroke-width="3" />
    
    <g transform="translate(1065, 525)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="18" r="12" />
      <path d="M 6 46 C 6 34, 15 32, 24 32 C 33 32, 42 34, 42 46" />
      <circle cx="42" cy="16" r="10" stroke="#207448" />
      <path d="M 37 16 L 40 19 L 47 13" />
    </g>
    
    <text x="1065" y="610" font-size="26" fill="#303a36">
      <tspan x="1065" dy="0" font-weight="bold">bob (UID 1043,</tspan>
      <tspan x="1065" dy="34" font-weight="bold">member of projx):</tspan>
      <tspan x="1065" dy="40">not the owner, matches group,</tspan>
      <tspan x="1065" dy="34">group triple rwx,</tspan>
      <tspan x="1065" dy="36" font-weight="bold" fill="#207448">granted</tspan>
    </text>
  </g>

  
  <g id="small-note-root">
    <rect x="1030" y="825" width="520" height="180" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" stroke-dasharray="8 6" />
    
    <g transform="translate(1060, 885)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 4 L 44 12 L 44 28 C 44 40, 24 48, 24 48 C 24 48, 4 40, 4 28 L 4 12 Z" />
      <path d="M 24 16 L 24 34" />
      <path d="M 16 24 L 32 24" />
    </g>
    
    <text x="1125" y="895" font-size="26" fill="#303a36">
      <tspan x="1125" dy="0" font-weight="bold">root (UID 0) passes</tspan>
      <tspan x="1125" dy="36" font-weight="bold">nearly all checks through</tspan>
      <tspan x="1125" dy="36" font-weight="bold" fill="#207448">capabilities</tspan>
    </text>
  </g>

  
  <g id="bottom-bar">
    <rect x="60" y="1045" width="1490" height="65" rx="12" fill="#207448" />
    <text x="805" y="1088" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">The checks do not add up: the first matching class decides</text>
  </g>
</svg>