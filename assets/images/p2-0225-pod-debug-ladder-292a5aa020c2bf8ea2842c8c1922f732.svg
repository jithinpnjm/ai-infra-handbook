<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Debug pod-to-pod traffic in eight checks, from the pod's own routes out to the capture</title>
  <desc>A vertical ladder of eight numbered troubleshooting checks for Kubernetes pod-to-pod network connectivity.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 2 L 11 6 L 1 10 Z" fill="#207448"/>
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5"/>

  
  <text x="800" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">Debug pod-to-pod traffic in eight checks,</text>
  <text x="800" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36" text-anchor="middle">from the pod's own routes out to the capture</text>

  
  <rect x="345" y="122" width="460" height="46" rx="8" fill="#eaf0ec" stroke="#7e8f87" stroke-width="2"/>
  <text x="575" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#52635b" text-anchor="middle">Pod A cannot reach pod B</text>

  
  <line x1="575" y1="168" x2="575" y2="193" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="193" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="236" r="24" fill="#207448"/>
  <text x="86" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
  
  <circle cx="150" cy="222" r="6" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="136" cy="250" r="6" fill="none" stroke="#207448" stroke-width="3"/>
  <circle cx="164" cy="250" r="6" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="146" y1="227" x2="140" y2="245" stroke="#207448" stroke-width="2.5"/>
  <line x1="154" y1="227" x2="160" y2="245" stroke="#207448" stroke-width="2.5"/>
  <line x1="142" y1="250" x2="158" y2="250" stroke="#207448" stroke-width="2.5"/>
  
  <text x="196" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Both pods have IPs and routes: <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#207448">ip route in each namespace</tspan></text>

  
  <rect x="1135" y="193" width="415" height="86" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1342" y="244" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">nsenter -t PID -n ip route</text>

  
  <line x1="575" y1="279" x2="575" y2="305" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="305" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="348" r="24" fill="#207448"/>
  <text x="86" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
  
  <rect x="130" y="332" width="15" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <rect x="155" y="332" width="15" height="32" rx="3" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="145" y1="344" x2="155" y2="344" stroke="#207448" stroke-width="3"/>
  <line x1="145" y1="352" x2="155" y2="352" stroke="#207448" stroke-width="3"/>
  
  <text x="196" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Pod A reaches its gateway and the host: <tspan x="196" dy="30" font-size="24" font-weight="normal" fill="#303a36">ARP resolves, veth and host-side interface are up</tspan></text>

  
  <line x1="575" y1="391" x2="575" y2="417" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="417" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="460" r="24" fill="#207448"/>
  <text x="86" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
  
  <rect x="130" y="442" width="40" height="36" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 136 454 L 164 454 M 158 449 L 164 454 L 158 459" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 164 466 L 136 466 M 142 461 L 136 466 L 142 471" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="196" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Node forwarding: <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#207448">ip_forward, rp_filter, bridge-nf-call-iptables</tspan></text>

  
  <line x1="575" y1="503" x2="575" y2="529" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="529" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="572" r="24" fill="#207448"/>
  <text x="86" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
  
  <ellipse cx="136" cy="572" rx="6" ry="16" fill="none" stroke="#207448" stroke-width="3"/>
  <ellipse cx="164" cy="572" rx="6" ry="16" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="136" y1="556" x2="164" y2="556" stroke="#207448" stroke-width="3"/>
  <line x1="136" y1="588" x2="164" y2="588" stroke="#207448" stroke-width="3"/>
  <line x1="144" y1="572" x2="156" y2="572" stroke="#207448" stroke-width="2.5" stroke-dasharray="3 3"/>
  
  <text x="196" y="563" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cross-node path: <tspan font-size="24" font-weight="normal" fill="#303a36">route or tunnel to node B, underlay ping, MTU, UDP 8472 or 4789, BGP TCP 179</tspan></text>

  
  <line x1="575" y1="615" x2="575" y2="641" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="641" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="684" r="24" fill="#207448"/>
  <text x="86" y="684" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">5</text>
  
  <path d="M 150 666 L 168 673 C 168 687 150 699 150 699 C 150 699 132 687 132 673 Z" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="141" y1="682" x2="159" y2="682" stroke="#207448" stroke-width="2.5"/>
  <line x1="150" y1="675" x2="150" y2="690" stroke="#207448" stroke-width="2.5"/>
  
  <text x="196" y="675" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">NetworkPolicy and iptables: <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#207448">counters and conntrack -L</tspan></text>

  
  <line x1="575" y1="727" x2="575" y2="753" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="753" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="796" r="24" fill="#207448"/>
  <text x="86" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">6</text>
  
  <circle cx="140" cy="796" r="8" fill="none" stroke="#207448" stroke-width="3"/>
  <path d="M 153 787 A 13 13 0 0 1 153 805" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 161 781 A 21 21 0 0 1 161 811" fill="none" stroke="#207448" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="196" y="787" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Destination listens on the right address: <tspan font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#207448">ss -tulpn inside pod B</tspan></text>

  
  <line x1="575" y1="839" x2="575" y2="865" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="865" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2"/>
  
  <circle cx="86" cy="908" r="24" fill="#207448"/>
  <text x="86" y="908" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">7</text>
  
  <rect x="132" y="892" width="36" height="32" rx="4" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="138" y1="900" x2="152" y2="900" stroke="#207448" stroke-width="2.5"/>
  <line x1="138" y1="908" x2="162" y2="908" stroke="#207448" stroke-width="2.5"/>
  <line x1="138" y1="916" x2="148" y2="916" stroke="#207448" stroke-width="2.5"/>
  
  <text x="196" y="917" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Names involved: <tspan font-size="30" font-weight="bold" fill="#207448">check DNS</tspan></text>

  
  <line x1="575" y1="951" x2="575" y2="977" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)"/>

  
  <rect x="50" y="977" width="1050" height="86" rx="10" fill="#e8f1ea" stroke="#db8129" stroke-width="4"/>
  
  <circle cx="86" cy="1020" r="24" fill="#207448"/>
  <text x="86" y="1020" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">8</text>
  
  <circle cx="147" cy="1016" r="13" fill="none" stroke="#207448" stroke-width="3"/>
  <line x1="156" y1="1025" x2="167" y2="1036" stroke="#207448" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 139 1016 L 143 1016 L 146 1011 L 149 1021 L 152 1016 L 155 1016" fill="none" stroke="#207448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <text x="196" y="1011" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#303a36">Capture on the veth of A, the uplink of node 1, <tspan x="196" dy="30" font-size="24" font-weight="normal" fill="#303a36">the uplink of node 2 and the veth of B</tspan></text>

  
  <rect x="50" y="1098" width="1500" height="60" rx="10" fill="#207448"/>
  <text x="800" y="1138" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Each check removes one layer from the suspect list.</text>
</svg>