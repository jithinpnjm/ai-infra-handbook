    <tspan x="1197" dy="36">NumPy, Arrow, mmap or</tspan>
    <tspan x="1197" dy="36">shared memory instead</tspan>
    <tspan x="1197" dy="36">of Python lists, so the</tspan>
    <tspan x="1197" dy="36">pages stay shared</tspan>
  </text>

  
