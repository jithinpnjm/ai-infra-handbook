    <tspan x="430" dy="38">counting writes</tspan>
    <tspan x="430" dy="38">to each object</tspan>
    <tspan x="430" dy="38">it touches</tspan>
  </text>

  
  <rect x="435" y="400" width="283" height="85" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <g transform="translate(450, 422)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
