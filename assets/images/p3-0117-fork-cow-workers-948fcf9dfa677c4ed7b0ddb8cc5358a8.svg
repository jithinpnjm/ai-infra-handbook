    <tspan x="806" dy="0">memory grows with</tspan>
    <tspan x="806" dy="36">every worker you add</tspan>
    <tspan x="806" dy="36">instead of staying</tspan>
    <tspan x="806" dy="36">flat</tspan>
  </text>


  
  <rect x="1157" y="135" width="403" height="750" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
