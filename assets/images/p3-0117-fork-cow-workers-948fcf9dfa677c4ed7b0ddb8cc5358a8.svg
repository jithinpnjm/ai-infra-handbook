  <path d="M 1199 260 L 1203 264 L 1211 256" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1228" y="267" font-family="sans-serif" font-size="24" fill="#303a36">
