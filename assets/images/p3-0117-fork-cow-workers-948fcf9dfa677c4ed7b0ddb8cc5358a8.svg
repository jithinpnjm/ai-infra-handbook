  <text x="100" y="946" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan>GPU note: </tspan>
    <tspan font-family="monospace">del plus torch.cuda.empty_cache()</tspan>
    <tspan> acts on GPU memory only, not on host RAM</tspan>
  </text>


  
  <rect x="40" y="990" width="1520" height="75" rx="12" fill="#207448" />
  <text x="800" y="1038" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Fork shares pages copy-on-write, but reference counting writes to them</text>

