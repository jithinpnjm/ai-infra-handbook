  <rect x="450" y="715" width="120" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <rect x="585" y="715" width="120" height="95" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />


  
  <rect x="768" y="135" width="365" height="750" rx="16" fill="#ffffff" stroke="#207448" stroke-width="2" />

  
  <circle cx="803" cy="175" r="24" fill="#207448" />
  <text x="803" y="184" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  
  <g transform="translate(844, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="16" width="30" height="34" rx="4" />
    <path d="M 18 16 L 18 8 L 48 8 L 48 38 L 36 38" />
  </g>

  
  <text x="788" y="245" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="788" dy="0">the write breaks</tspan>
    <tspan x="788" dy="38">the sharing: each</tspan>
    <tspan x="788" dy="38">worker gradually</tspan>
    <tspan x="788" dy="38">copies the dataset</tspan>
  </text>

  
  
