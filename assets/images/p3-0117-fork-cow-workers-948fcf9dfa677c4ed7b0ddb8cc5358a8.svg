<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090">
  <title>Why every data-loader worker ends up with a full dataset copy</title>
  <desc>Visual explanation of copy-on-write page sharing, reference counting writes breaking sharing, and process dataset duplication in PyTorch DataLoader</desc>

