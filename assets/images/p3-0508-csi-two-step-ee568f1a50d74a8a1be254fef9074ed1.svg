<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>A PVC reaches the pod in three hand-offs</title>
  <desc>Visual infographic explaining how a Kubernetes PersistentVolumeClaim reaches a pod container across four steps and three hand-offs: cloud attach, node staging, pod publishing, and container mount namespace injection.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 15 8 L 1 14 Z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M 1 2 L 15 8 L 1 14 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1000" fill="#f5f8f5" />

  
  <text x="800" y="78" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#303a36">A PVC reaches the pod in three hand-offs</text>

  
  <g>
    <rect x="40" y="130" width="350" height="520" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="75" cy="175" r="24" fill="#207448" />
    <text x="75" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">1</text>
    <text x="115" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 1</text>

    
    <g transform="translate(306, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="28" cy="12" rx="22" ry="8" />
      <path d="M 6 12 L 6 42 A 22 8 0 0 0 50 42 L 50 12" />
      <path d="M 6 27 A 22 8 0 0 0 50 27" />
    </g>

    
    <line x1="60" y1="220" x2="370" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2" />

    
    <text x="65" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="65" dy="0">attach/detach</tspan>
      <tspan x="65" dy="34">controller attaches</tspan>
      <tspan x="65" dy="34">the block device</tspan>
      <tspan x="65" dy="34">to the node</tspan>
      <tspan x="65" dy="34">(VolumeAttachment);</tspan>
      <tspan x="65" dy="34">failure</tspan>
      <tspan x="65" dy="34">FailedAttachVolume</tspan>
      <tspan x="65" dy="34">or Multi-Attach</tspan>
      <tspan x="65" dy="34">error</tspan>
    </text>
  </g>

  
  <line x1="390" y1="390" x2="426" y2="390" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />

  
  <g>
    <rect x="430" y="130" width="350" height="520" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="465" cy="175" r="24" fill="#207448" />
    <text x="465" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">2</text>
    <text x="505" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 2</text>

    
    <g transform="translate(696, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 12 L 22 12 L 28 18 L 50 18 A 2 2 0 0 1 52 20 L 52 46 A 2 2 0 0 1 50 48 L 6 48 A 2 2 0 0 1 4 46 L 4 14 A 2 2 0 0 1 6 12 Z" />
      <circle cx="28" cy="33" r="6" />
    </g>

    
    <line x1="450" y1="220" x2="760" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2" />

    
    <text x="455" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="455" dy="0">NodeStageVolume,</tspan>
      <tspan x="455" dy="34">once per volume</tspan>
      <tspan x="455" dy="34">per node: format</tspan>
      <tspan x="455" dy="34">on first use and</tspan>
      <tspan x="455" dy="34">mount at a node-</tspan>
      <tspan x="455" dy="34">global staging dir</tspan>
    </text>
    <text x="455" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="455" dy="0">/var/lib/kubelet/</tspan>
      <tspan x="455" dy="34">plugins/</tspan>
      <tspan x="455" dy="34">kubernetes.io/csi/</tspan>
      <tspan x="455" dy="34">.../globalmount</tspan>
    </text>
  </g>

  
  <line x1="780" y1="390" x2="816" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="820" y="130" width="350" height="520" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="855" cy="175" r="24" fill="#207448" />
    <text x="855" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">3</text>
    <text x="895" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 3</text>

    
    <g transform="translate(1086, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 6 L 48 18 L 28 30 L 8 18 Z" />
      <path d="M 8 18 L 8 42 L 28 54 L 28 30 Z" />
      <path d="M 48 18 L 48 42 L 28 54 L 28 30 Z" />
    </g>

    
    <line x1="840" y1="220" x2="1150" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2" />

    
    <text x="845" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">NodePublishVolume,</tspan>
      <tspan x="845" dy="34">once per pod:</tspan>
      <tspan x="845" dy="34">bind-mount to</tspan>
    </text>
    <text x="845" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" fill="#303a36">
      <tspan x="845" dy="0">/var/lib/kubelet/</tspan>
      <tspan x="845" dy="34">pods/pod-uid/</tspan>
      <tspan x="845" dy="34">volumes/</tspan>
      <tspan x="845" dy="34">kubernetes.io~csi/</tspan>
      <tspan x="845" dy="34">pvc-name/mount</tspan>
    </text>
  </g>

  
  <line x1="1170" y1="390" x2="1206" y2="390" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <g>
    <rect x="1210" y="130" width="350" height="520" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="1245" cy="175" r="24" fill="#207448" />
    <text x="1245" y="184" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
    <text x="1285" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#207448">Step 4</text>

    
    <g transform="translate(1476, 147)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <line x1="6" y1="20" x2="50" y2="20" />
      <line x1="12" y1="14" x2="14" y2="14" />
      <line x1="18" y1="14" x2="20" y2="14" />
      <path d="M 14 30 L 22 35 L 14 40" />
      <line x1="26" y1="40" x2="36" y2="40" />
    </g>

    
    <line x1="1230" y1="220" x2="1540" y2="220" stroke="#207448" stroke-opacity="0.25" stroke-width="2" />

    
    <text x="1235" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="1235" dy="0">runc bind-mounts</tspan>
      <tspan x="1235" dy="34">that path into</tspan>
      <tspan x="1235" dy="34">the container</tspan>
      <tspan x="1235" dy="34">mount namespace</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="680" width="740" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(68, 717)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="22" height="22" rx="3" />
      <rect x="30" y="6" width="22" height="22" rx="3" />
      <path d="M 15 28 L 15 48 L 41 48 L 41 28" />
      <circle cx="28" cy="48" r="4" fill="#207448" />
    </g>
    <text x="145" y="736" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="145" dy="0">several pods on one node</tspan>
      <tspan x="145" dy="34">can share the one staged mount</tspan>
    </text>
  </g>

  
  <g>
    <rect x="820" y="680" width="740" height="130" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(848, 717)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 28 A 18 18 0 1 1 28 46" />
      <polyline points="20 46 28 46 28 38" />
      <line x1="20" y1="20" x2="36" y2="36" />
      <line x1="36" y1="20" x2="20" y2="36" />
    </g>
    <text x="925" y="736" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#303a36">
      <tspan x="925" dy="0">NodeUnpublishVolume, then NodeUnstage</tspan>
      <tspan x="925" dy="34">and detach when unused</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="840" width="1520" height="120" rx="12" fill="#207448" />
    <text x="800" y="890" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
      <tspan x="800" dy="0">until every mount succeeds the pod stays in ContainerCreating with FailedMount events;</tspan>
      <tspan x="800" dy="34">PVC attach from the cloud takes 5 to 60 s</tspan>
    </text>
  </g>
</svg>