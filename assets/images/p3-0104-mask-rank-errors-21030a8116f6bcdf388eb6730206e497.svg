<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120">
  <title>Worked example: masking numbers to rank distinct errors</title>
  <desc>Five-stage pipeline demonstrating how masking numbers with sed allows sorting and uniq to aggregate distinct error messages across cluster nodes.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 2 3 L 16 9 L 2 15 Z" fill="#207448" />
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="#f5f8f5" />
  <text x="800" y="65" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Worked example: masking numbers to rank distinct errors</text>
  <line x1="312" y1="145" x2="352" y2="145" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="624" y1="145" x2="664" y2="145" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="936" y1="145" x2="976" y2="145" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <line x1="1248" y1="145" x2="1288" y2="145" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  
  <g id="stage-1">
    <rect x="40" y="110" width="272" height="860" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="80" cy="145" r="24" fill="#207448" />
    <text x="80" y="154" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <g transform="translate(220, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="22" r="14" />
      <line x1="32" y1="32" x2="48" y2="48" stroke-width="5" />
      <line x1="14" y1="22" x2="30" y2="22" />
    </g>
    <text x="176" y="206" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="176" dy="0">grep -i</tspan>
      <tspan x="176" dy="34">error</tspan>
      <tspan x="176" dy="34">train.log</tspan>
    </text>
    <rect x="52" y="280" width="248" height="670" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="60" y="290" width="232" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="78" y="332" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">10:20:01</tspan>
      <tspan x="78" dy="28">ERROR NCCL</tspan>
      <tspan x="78" dy="28">timeout on</tspan>
      <tspan x="78" dy="28">rank 3</tspan>
    </text>
    <rect x="60" y="450" width="232" height="150" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="78" y="492" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">10:31:09</tspan>
      <tspan x="78" dy="28">ERROR NCCL</tspan>
      <tspan x="78" dy="28">timeout on</tspan>
      <tspan x="78" dy="28">rank 5</tspan>
    </text>
    <rect x="60" y="610" width="232" height="180" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="78" y="652" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="78" dy="0">10:40:00</tspan>
      <tspan x="78" dy="28">ERROR CUDA</tspan>
      <tspan x="78" dy="28">out of</tspan>
      <tspan x="78" dy="28">memory</tspan>
      <tspan x="78" dy="28">on gpu=2</tspan>
    </text>
    <rect x="60" y="800" width="232" height="124" rx="8" fill="#f0f3f1" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="78" y="850" font-family="monospace" font-size="24" fill="#718096">
      <tspan x="78" dy="0">WARN loss</tspan>
      <tspan x="78" dy="32">spike</tspan>
    </text>
    <line x1="68" y1="878" x2="284" y2="845" stroke="#c53030" stroke-width="3" />
    <line x1="68" y1="845" x2="284" y2="878" stroke="#c53030" stroke-width="3" />
  </g>
  
  <g id="stage-2">
    <rect x="352" y="110" width="272" height="860" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="392" cy="145" r="24" fill="#207448" />
    <text x="392" y="154" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <g transform="translate(532, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="6" />
      <path d="M 16 28 h 10 M 21 18 v 20" />
      <path d="M 32 34 l 8 -12" />
    </g>
    <text x="488" y="222" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="488" dy="0">sed -E</tspan>
      <tspan x="488" dy="36">s/[0-9]+/N/g</tspan>
    </text>
    <rect x="364" y="280" width="248" height="670" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="372" y="296" width="232" height="144" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="390" y="338" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="390" dy="0">N:N:N ERROR</tspan>
      <tspan x="390" dy="32">NCCL timeout</tspan>
      <tspan x="390" dy="32">on rank N</tspan>
    </text>
    <rect x="372" y="460" width="232" height="144" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="390" y="502" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="390" dy="0">N:N:N ERROR</tspan>
      <tspan x="390" dy="32">NCCL timeout</tspan>
      <tspan x="390" dy="32">on rank N</tspan>
    </text>
    <rect x="372" y="624" width="232" height="176" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="390" y="666" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="390" dy="0">N:N:N ERROR</tspan>
      <tspan x="390" dy="32">CUDA out of</tspan>
      <tspan x="390" dy="32">memory on</tspan>
      <tspan x="390" dy="32">gpu=N</tspan>
    </text>
  </g>
  
  <g id="stage-3">
    <rect x="664" y="110" width="272" height="860" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="704" cy="145" r="24" fill="#207448" />
    <text x="704" y="154" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    <g transform="translate(844, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="12" x2="48" y2="12" stroke-width="4" />
      <line x1="8" y1="24" x2="38" y2="24" stroke-width="4" />
      <line x1="8" y1="36" x2="28" y2="36" stroke-width="4" />
      <line x1="8" y1="48" x2="18" y2="48" stroke-width="4" />
    </g>
    <text x="800" y="240" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">sort</text>
    <rect x="676" y="280" width="248" height="670" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="680" y="292" width="240" height="316" rx="8" fill="#d2e5d7" stroke="#207448" stroke-width="2" />
    <rect x="684" y="298" width="232" height="144" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="702" y="340" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="702" dy="0">N:N:N ERROR</tspan>
      <tspan x="702" dy="30">NCCL timeout</tspan>
      <tspan x="702" dy="30">on rank N</tspan>
    </text>
    <rect x="684" y="454" width="232" height="144" rx="6" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="702" y="496" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="702" dy="0">N:N:N ERROR</tspan>
      <tspan x="702" dy="30">NCCL timeout</tspan>
      <tspan x="702" dy="30">on rank N</tspan>
    </text>
    <text x="800" y="646" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">
      <tspan x="800" dy="0">groups the two</tspan>
      <tspan x="800" dy="30">identical NCCL</tspan>
      <tspan x="800" dy="30">lines next to</tspan>
      <tspan x="800" dy="30">each other</tspan>
    </text>
    <rect x="684" y="770" width="232" height="164" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
    <text x="702" y="812" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="702" dy="0">N:N:N ERROR</tspan>
      <tspan x="702" dy="30">CUDA out of</tspan>
      <tspan x="702" dy="30">memory on</tspan>
      <tspan x="702" dy="30">gpu=N</tspan>
    </text>
  </g>
  
  <g id="stage-4">
    <rect x="976" y="110" width="272" height="860" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="1016" cy="145" r="24" fill="#207448" />
    <text x="1016" y="154" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">4</text>
    <g transform="translate(1156, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="10" width="38" height="14" rx="3" />
      <rect x="8" y="30" width="38" height="14" rx="3" />
      <line x1="16" y1="17" x2="22" y2="17" stroke-width="3" />
      <line x1="16" y1="37" x2="22" y2="37" stroke-width="3" />
    </g>
    <text x="1112" y="240" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">uniq -c</text>
    <rect x="988" y="280" width="248" height="670" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <rect x="996" y="360" width="232" height="178" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1014" y="404" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0"><tspan font-weight="bold" fill="#207448">2 </tspan>N:N:N</tspan>
      <tspan x="1014" dy="32">ERROR NCCL</tspan>
      <tspan x="1014" dy="32">timeout on</tspan>
      <tspan x="1014" dy="32">rank N</tspan>
    </text>
    <rect x="996" y="620" width="232" height="206" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1014" y="664" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1014" dy="0"><tspan font-weight="bold" fill="#207448">1 </tspan>N:N:N</tspan>
      <tspan x="1014" dy="32">ERROR CUDA</tspan>
      <tspan x="1014" dy="32">out of</tspan>
      <tspan x="1014" dy="32">memory on</tspan>
      <tspan x="1014" dy="32">gpu=N</tspan>
    </text>
  </g>
  
  <g id="stage-5">
    <rect x="1288" y="110" width="272" height="860" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <circle cx="1328" cy="145" r="24" fill="#207448" />
    <text x="1328" y="154" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">5</text>
    <g transform="translate(1468, 117)" stroke="#207448" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,10 44,10 32,28 32,46 24,46 24,28" />
      <line x1="16" y1="18" x2="40" y2="18" stroke-width="3" />
    </g>
    <text x="1424" y="222" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#207448">
      <tspan x="1424" dy="0">sort -rn |</tspan>
      <tspan x="1424" dy="36">head</tspan>
    </text>
    <rect x="1300" y="280" width="248" height="670" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="1424" y="325" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      <tspan x="1424" dy="0">ranks them</tspan>
      <tspan x="1424" dy="30">with the count</tspan>
      <tspan x="1424" dy="30">2 line first</tspan>
    </text>
    <rect x="1308" y="425" width="232" height="178" rx="8" fill="#fff5ea" stroke="#db8129" stroke-width="3.5" />
    <text x="1326" y="469" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1326" dy="0"><tspan font-weight="bold">2 </tspan>N:N:N</tspan>
      <tspan x="1326" dy="32">ERROR NCCL</tspan>
      <tspan x="1326" dy="32">timeout on</tspan>
      <tspan x="1326" dy="32">rank N</tspan>
    </text>
    <rect x="1308" y="675" width="232" height="206" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="1326" y="719" font-family="monospace" font-size="24" fill="#303a36">
      <tspan x="1326" dy="0"><tspan font-weight="bold">1 </tspan>N:N:N</tspan>
      <tspan x="1326" dy="32">ERROR CUDA</tspan>
      <tspan x="1326" dy="32">out of</tspan>
      <tspan x="1326" dy="32">memory on</tspan>
      <tspan x="1326" dy="32">gpu=N</tspan>
    </text>
  </g>
  
  <g id="takeaway-bar">
    <rect x="40" y="1010" width="1520" height="70" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <text x="800" y="1054" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Masking the numbers makes different ranks the same message, so uniq can count them</text>
  </g>
</svg>