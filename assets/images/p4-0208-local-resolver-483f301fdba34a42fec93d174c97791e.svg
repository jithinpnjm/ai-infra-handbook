        </text>

        
        <text x="28" y="100" font-family="monospace" font-size="24px" fill="#303a36">
          domain=cluster.lab
        </text>
        <text x="28" y="145" font-family="monospace" font-size="24px" fill="#303a36">
          local=/cluster.lab/
        </text>
        <text x="28" y="190" font-family="monospace" font-size="24px" fill="#303a36">
          address=/gpu01.cluster.lab/10.20.0.45
        </text>
        <text x="28" y="235" font-family="monospace" font-size="24px" fill="#303a36">
          host-record=gpu02.cluster.lab,10.20.0.46
        </text>
        
        
        <text x="28" y="280" font-family="monospace" font-size="24px" fill="#303a36">
          ptr-record=45.0.20.10.in-addr.arpa,
        </text>
        <text x="50" y="315" font-family="monospace" font-size="24px" fill="#303a36">
          gpu01.cluster.lab
        </text>

        
        <rect x="280" y="75" width="405" height="44" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
        <text x="290" y="105" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
          hits Block A directly
        </text>
      </g>

      
      
      
      <g transform="translate(20, 460)">
        <rect width="700" height="235" rx="10" fill="#f5f8f5" stroke="#1d6fa5" stroke-width="2" />
        
        
        <rect x="18" y="16" width="340" height="42" rx="6" fill="#1d6fa5" />
        <text x="32" y="45" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff">
          Block B 'In-Memory Cache'
        </text>

        <rect x="380" y="16" width="305" height="42" rx="8" fill="#ebf3f9" stroke="#1d6fa5" stroke-width="1.5" />
        <text x="390" y="45" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#1d6fa5">
          hits Block B
        </text>

        <text x="28" y="105" font-family="sans-serif" font-size="24px" fill="#303a36">
          storing recent external query answers with remaining TTL
        </text>

        
        <rect x="28" y="140" width="644" height="60" rx="8" fill="#ebf3f9" stroke="#1d6fa5" stroke-width="1" />
        <text x="44" y="178" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#1d6fa5">
