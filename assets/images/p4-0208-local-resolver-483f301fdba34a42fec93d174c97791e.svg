  <g id="flow-1-routing">
    
    <path d="M 380 270 L 465 270" fill="none" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
    
    
    <g transform="translate(480, 280)">
      <rect x="0" y="0" width="620" height="90" rx="10" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
      <text x="18" y="34" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#207448">
