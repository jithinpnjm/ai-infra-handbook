<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110">
  <title>Seeding one node per rack turns a 700 second pull into a 163 second tree</title>
  <desc>Infographic comparing naive origin download of 700 seconds with two-stage tree distribution of 163 seconds across 10 racks.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1110" fill="#f5f8f5" />

  
  <text x="800" y="68" font-size="38" font-weight="bold" fill="#303a36" text-anchor="middle" font-family="sans-serif">
    Seeding one node per rack turns a 700 second pull into a 163 second tree
  </text>

  
  <g id="left-panel">
    <rect x="30" y="115" width="710" height="850" rx="16" fill="#e8f1ea" stroke="#c2daca" stroke-width="2" />

    
    <text x="145" y="170" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle" font-family="sans-serif">
      Naive, all 100 nodes<tspan x="145" dy="30">pull from origin: 700 s</tspan>
    </text>
    <rect x="100" y="225" width="90" height="495" rx="8" fill="#db8129" />

    
    
    <text x="260" y="515" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle" font-family="sans-serif">
      Tree total: 163 s
    </text>

    
    <rect x="220" y="557" width="80" height="93" rx="6" fill="#439e6c" />

    
    <rect x="220" y="650" width="80" height="70" rx="6" fill="#207448" />

    
    <line x1="80" y1="720" x2="680" y2="720" stroke="#8fa898" stroke-width="3" stroke-linecap="round" />

    
    <line x1="300" y1="603" x2="320" y2="603" stroke="#303a36" stroke-width="2" />
    <text x="330" y="593" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">
      Rack copy, 4 doubling rounds<tspan x="330" dy="30">at 23.3 s each: 93 s</tspan>
    </text>

    
    <line x1="300" y1="685" x2="320" y2="685" stroke="#207448" stroke-width="2" />
    <text x="330" y="692" font-size="24" font-weight="bold" fill="#207448" font-family="sans-serif">
      Seed one node per rack: 70 s
    </text>

    
    <rect x="50" y="760" width="670" height="175" rx="12" fill="#ffffff" stroke="#c0d8c8" stroke-width="2" />
    <text x="75" y="805" font-size="24" font-weight="bold" fill="#303a36" font-family="sans-serif">Note:</text>
    <text x="145" y="805" font-size="24" fill="#303a36" font-family="sans-serif">
      the rack stage is a sum, an upper bound,
    </text>
    <text x="75" y="845" font-size="24" fill="#303a36" font-family="sans-serif">
      since it overlaps with seeding.
    </text>
  </g>

  
  <g id="right-panel">
    <rect x="760" y="115" width="810" height="850" rx="16" fill="#e8f1ea" stroke="#c2daca" stroke-width="2" />

    
    <rect x="945" y="140" width="440" height="74" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    
