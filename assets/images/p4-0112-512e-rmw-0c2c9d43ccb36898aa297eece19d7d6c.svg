<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" width="1600" height="1380">
  <title>The 512e Read-Modify-Write Penalty</title>
  <desc>Comparative architectural diagram contrasting an aligned 4 KiB write with an unaligned 512-byte read-modify-write on a 512e Advanced Format drive.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#207448" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#db8129" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 z" fill="#dc2626" />
    </marker>

    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  
  <rect width="1600" height="1380" fill="#f5f8f5" />

  
  <text x="800" y="58" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">The 512e Read-Modify-Write Penalty</text>

  
  <rect x="40" y="95" width="740" height="1135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="410" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Panel A (Aligned 4 KiB Write)</text>

  
  <rect x="75" y="175" width="670" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  <rect x="100" y="202" width="60" height="55" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="100" y1="218" x2="160" y2="218" stroke="#207448" stroke-width="2" />
  <circle cx="112" cy="210" r="3" fill="#207448" />
  <circle cx="122" cy="210" r="3" fill="#207448" />
  <text x="430" y="222" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Application Buffer: 4,096 Bytes</text>
  <text x="430" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#606d66">(Aligned to 4 KiB offset 0)</text>

  
  <line x1="410" y1="290" x2="410" y2="415" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />
  <rect x="155" y="327" width="510" height="50" rx="25" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  <text x="410" y="360" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Single Direct Write (1 I/O operation)</text>

  
  <rect x="75" y="425" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  <rect x="100" y="450" width="60" height="60" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="112" y="462" width="36" height="36" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <line x1="110" y1="444" x2="110" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="125" y1="444" x2="125" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="140" y1="444" x2="140" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="150" y1="444" x2="150" y2="450" stroke="#207448" stroke-width="3" />
  <text x="430" y="492" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Drive Controller RAM Buffer</text>

  
  <line x1="410" y1="535" x2="410" y2="745" stroke="#207448" stroke-width="4" marker-end="url(#arrow-green)" />

  
  <rect x="75" y="960" width="670" height="235" rx="14" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  <rect x="75" y="960" width="670" height="48" rx="14" fill="#207448" />
  <text x="410" y="994" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Panel A Performance Metric</text>
  <text x="410" y="1065" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Read count: 0, Write count: 1, Total operations: 1</text>
  
  <rect x="220" y="1110" width="380" height="55" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="410" y="1146" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Optimal Aligned Throughput</text>


  
  <rect x="820" y="95" width="740" height="1135" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <text x="1190" y="145" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Panel B (Unaligned 512-Byte Write - Read-Modify-Write)</text>

  
  <rect x="855" y="175" width="670" height="115" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  <rect x="880" y="202" width="60" height="55" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <line x1="880" y1="218" x2="940" y2="218" stroke="#207448" stroke-width="2" />
  <circle cx="892" cy="210" r="3" fill="#207448" />
  <circle cx="902" cy="210" r="3" fill="#207448" />
  <text x="1210" y="222" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Application Buffer: 512 Bytes</text>
  <text x="1210" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#606d66">(Targeting logical sector 1, offset 512-1023)</text>

  
  <line x1="1190" y1="290" x2="1190" y2="415" stroke="#db8129" stroke-width="4" marker-end="url(#arrow-orange)" />
  <rect x="870" y="327" width="640" height="50" rx="25" fill="#ffffff" stroke="#db8129" stroke-width="2" filter="url(#shadow)" />
  <text x="1190" y="360" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">2. Overwrite bytes 512..1023 in controller DRAM</text>

  
  <rect x="855" y="425" width="670" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" filter="url(#shadow)" />
  
  <rect x="880" y="450" width="60" height="60" rx="6" fill="none" stroke="#207448" stroke-width="3" />
  <rect x="892" y="462" width="36" height="36" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <line x1="890" y1="444" x2="890" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="905" y1="444" x2="905" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="920" y1="444" x2="920" y2="450" stroke="#207448" stroke-width="3" />
  <line x1="930" y1="444" x2="930" y2="450" stroke="#207448" stroke-width="3" />
  <text x="1210" y="492" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Drive Controller DRAM Cache</text>

  
  <line x1="980" y1="745" x2="980" y2="545" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)" />
  <rect x="860" y="615" width="240" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="980" y="646" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2563eb">1. Read entire 4 KiB</text>
  <text x="980" y="674" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2563eb">physical sector</text>

  
  <line x1="1400" y1="535" x2="1400" y2="745" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)" />
  <rect x="1260" y="615" width="280" height="74" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <text x="1400" y="646" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#dc2626">3. Write modified 4 KiB</text>
  <text x="1400" y="674" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#dc2626">sector back to media</text>

  
  <rect x="855" y="960" width="670" height="235" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <rect x="855" y="960" width="670" height="48" rx="14" fill="#dc2626" />
  <text x="1190" y="994" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Panel B Penalty Metrics</text>
  <text x="1190" y="1055" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#303a36">Read count: 1, Write count: 1,</text>
  <text x="1190" y="1098" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#dc2626">Total operations: 2 (2x I/O magnification, latency spike)</text>
  
  <rect x="990" y="1130" width="400" height="45" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="1190" y="1161" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#dc2626">512e Read-Modify-Write Penalty</text>


  
  <rect x="75" y="750" width="1450" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="3" filter="url(#shadow)" />
  
  
  <g transform="translate(95, 785)">
    <path d="M 0 15 C 0 5 15 0 30 0 C 45 0 60 5 60 15 L 60 65 C 60 75 45 80 30 80 C 15 80 0 75 0 65 Z" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
    <path d="M 0 15 C 0 25 15 30 30 30 C 45 30 60 25 60 15" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 0 40 C 0 50 15 55 30 55 C 45 55 60 50 60 40" fill="none" stroke="#207448" stroke-width="3" />
  </g>

  
  <text x="800" y="792" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448">Physical NAND / Platter: Physical Sector 0 (4,096 Bytes)</text>

  
  
  <g transform="translate(180, 815)">
    <rect x="0" y="0" width="530" height="50" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <line x1="66" y1="0" x2="66" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="132" y1="0" x2="132" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="198" y1="0" x2="198" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="265" y1="0" x2="265" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="331" y1="0" x2="331" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="397" y1="0" x2="397" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="463" y1="0" x2="463" y2="50" stroke="#207448" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="265" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448">Whole 4 KiB Block Written Directly in 1 Cycle</text>
    <text x="265" y="85" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#606d66">Offset 0 to 4,095 (8 × 512B Emulated Sectors)</text>
  </g>

  
  <g transform="translate(890, 815)">
    <rect x="0" y="0" width="590" height="50" rx="8" fill="#f5f8f5" stroke="#303a36" stroke-width="2" />
    <rect x="0" y="0" width="73" height="50" fill="#e8f1ea" />
    <rect x="73" y="0" width="74" height="50" fill="#fed7aa" stroke="#db8129" stroke-width="3" />
    <rect x="147" y="0" width="443" height="50" fill="#e8f1ea" />
    <line x1="73" y1="0" x2="73" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="147" y1="0" x2="147" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="221" y1="0" x2="221" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="295" y1="0" x2="295" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="368" y1="0" x2="368" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="442" y1="0" x2="442" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="516" y1="0" x2="516" y2="50" stroke="#303a36" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="110" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">Sec 1</text>
    <text x="368" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#606d66">Unmodified Sectors (0, 2..7)</text>
    <text x="295" y="85" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#606d66">Physical Sector 0: Bytes 512..1023 Updated</text>
  </g>


  
  <rect x="40" y="1260" width="1520" height="80" rx="14" fill="#207448" />
  <text x="800" y="1310" text-anchor="middle">
    <tspan font-family="sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Check drive geometry with: </tspan>
    <tspan font-family="monospace" font-size="25" font-weight="bold" fill="#a7f3d0">lsblk -t (LOG-SEC=512, PHY-SEC=4096)</tspan>
  </text>
</svg>