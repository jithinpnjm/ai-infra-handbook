<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <title>Three ways to handle a missing dict key, and the __missing__ hook</title>
  <desc>Visual comparison of missing dict key handling methods and the StrKeyDict0 __missing__ hook workflow in Python.</desc>

  <defs>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 Z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1240" fill="#f5f8f5" />

  
  <text x="50" y="65" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#207448">Three ways to handle a missing dict key, and the __missing__ hook</text>

  
  <rect x="50" y="100" width="725" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  
  <g transform="translate(75, 120)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 10 14 H 34 M 10 22 H 34 M 10 30 H 24" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="135" y="152" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">comparison of three versions of indexing word locations (line_no, column_no)</text>

  
  <g transform="translate(75, 185)">
    <rect x="0" y="0" width="675" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="36" cy="62" r="16" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="48" y1="74" x2="60" y2="86" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="80" y="52" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">index.get(word, []) then append then</tspan>
      <tspan x="80" dy="38">index[word] = occurrences: two hash lookups per word</tspan>
    </text>
  </g>

  
  <g transform="translate(75, 325)">
    <rect x="0" y="0" width="675" height="125" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <rect x="20" y="44" width="34" height="34" rx="6" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 28 61 L 34 67 L 46 53" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="80" y="52" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">index.setdefault(word, []).append(location):</tspan>
      <tspan x="80" dy="38">one lookup</tspan>
    </text>
  </g>

  
  <g transform="translate(75, 465)">
    <rect x="0" y="0" width="675" height="170" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(18, 62)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#db8129" stroke-width="3" />
      <path d="M 20 0 V 6 M 20 34 V 40 M 0 20 H 6 M 34 20 H 40 M 6 6 L 10 10 M 30 30 L 34 34 M 6 34 L 10 30 M 30 10 L 34 6" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="80" y="48" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">index = collections.defaultdict(list);</tspan>
      <tspan x="80" dy="38">index[word].append(location):</tspan>
      <tspan x="80" dy="38" font-weight="bold" fill="#db8129">one lookup</tspan>
    </text>
  </g>

  
  <rect x="815" y="100" width="735" height="560" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(840, 120)">
    <circle cx="22" cy="22" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 14 22 L 30 22 M 22 14 L 30 22 L 22 30" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="895" y="152" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#207448">StrKeyDict0(dict) with d[2]</text>

  
  <g transform="translate(840, 175)">
    <rect x="0" y="0" width="685" height="90" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="342" y="40" font-family="ui-monospace, monospace" font-size="24" fill="#303a36" text-anchor="middle">
      <tspan x="342" dy="0">dict.__getitem__ misses and calls</tspan>
      <tspan x="342" dy="32">__missing__(self, key)</tspan>
    </text>
  </g>

  
  <line x1="1182" y1="265" x2="1182" y2="295" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1032, 298)">
    <rect x="0" y="0" width="300" height="54" rx="27" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="150" y="36" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">is key a str?</text>
  </g>

  
  <path d="M 1032 325 H 980 V 378" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(945, 335)">
    <rect x="0" y="0" width="56" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">yes</text>
  </g>

  
  <path d="M 1332 325 H 1380 V 378" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(1360, 335)">
    <rect x="0" y="0" width="56" height="34" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
    <text x="28" y="24" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">no</text>
  </g>

  
  <g transform="translate(840, 385)">
    <rect x="0" y="0" width="320" height="250" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <path d="M 35 48 L 48 24 L 61 48 Z" fill="none" stroke="#db8129" stroke-width="3" stroke-linejoin="round" />
    <line x1="48" y1="34" x2="48" y2="40" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
    <circle cx="48" cy="44" r="1.5" fill="#db8129" />
    <text x="70" y="44" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">raise KeyError(key);</text>
    <text x="24" y="86" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="24" dy="0">this guard stops</tspan>
      <tspan x="24" dy="36">infinite recursion</tspan>
      <tspan x="24" dy="36">when str(key) is</tspan>
      <tspan x="24" dy="36">also absent</tspan>
    </text>
  </g>

  
  <g transform="translate(1185, 385)">
    <rect x="0" y="0" width="340" height="95" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="38" cy="48" r="14" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 50 48 H 68 M 60 48 V 56 M 66 48 V 54" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="82" y="56" font-family="ui-monospace, monospace" font-size="24" font-weight="bold" fill="#303a36">return self[str(key)]</text>
  </g>

  
  <line x1="1355" y1="480" x2="1355" y2="520" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />

  
  <g transform="translate(1180, 528)">
    <rect x="0" y="0" width="350" height="105" rx="12" fill="#ffffff" stroke="#207448" stroke-width="3" />
    <text x="175" y="62" font-family="ui-monospace, monospace" font-size="25" font-weight="bold" fill="#207448" text-anchor="middle">d[2] == d["2"] == two</text>
  </g>

  
  
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="725" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <circle cx="48" cy="42" r="18" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="48" y1="36" x2="48" y2="44" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <circle cx="48" cy="50" r="1.5" fill="#207448" />
    <text x="80" y="44" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">the hook runs only for d[k], not for d.get(k)</tspan>
      <tspan x="80" dy="38">or k in d, unless you override those too;</tspan>
      <tspan x="80" dy="38" font-family="ui-monospace, monospace">get and __contains__ = key in self.keys()</tspan>
      <tspan x="80" dy="38" font-family="ui-monospace, monospace">or str(key) in self.keys()</tspan>
    </text>
  </g>

  
  <g transform="translate(815, 680)">
    <rect x="0" y="0" width="735" height="235" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <rect x="30" y="26" width="32" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3" />
    <path d="M 46 50 V 62 M 34 62 H 58" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="80" y="44" font-family="system-ui, sans-serif" font-size="24" fill="#303a36">
      <tspan x="80" dy="0">if you normalise keys in __setitem__, subclass</tspan>
      <tspan x="80" dy="38" font-family="ui-monospace, monospace">collections.UserDict rather than dict:</tspan>
      <tspan x="80" dy="38">it stores the dict in self.data and extends</tspan>
      <tspan x="80" dy="38">MutableMapping, so built-in C methods cannot bypass</tspan>
      <tspan x="80" dy="38">your overrides</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 935)">
    <rect x="0" y="0" width="1500" height="150" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="44" height="60" rx="6" fill="none" stroke="#207448" stroke-width="3" />
      <line x1="8" y1="18" x2="36" y2="18" stroke="#207448" stroke-width="2" />
      <line x1="8" y1="34" x2="36" y2="34" stroke="#207448" stroke-width="2" />
      <line x1="8" y1="48" x2="36" y2="48" stroke="#207448" stroke-width="2" />
      <circle cx="16" cy="18" r="4" fill="#207448" />
      <circle cx="28" cy="34" r="4" fill="#207448" />
      <circle cx="20" cy="48" r="4" fill="#207448" />
    </g>
    <text x="100" y="54" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">
      <tspan x="100" dy="0">Counter is a multiset: ct = Counter("abracadabra"); ct.update("aaaaazzz"); ct.most_common(3);</tspan>
      <tspan x="100" dy="48">+ adds, - subtracts, &amp; takes the minimum, | the maximum</tspan>
    </text>
  </g>

  
  <g transform="translate(50, 1105)">
    <rect x="0" y="0" width="1500" height="95" rx="14" fill="#207448" />
    
    <g transform="translate(35, 26)">
      <rect x="4" y="16" width="36" height="28" rx="6" fill="none" stroke="#ffffff" stroke-width="3" />
      <path d="M 12 16 V 10 C 12 4 32 4 32 10 V 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="100" y="56" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">
      Hash contract: if a == b then hash(a) == hash(b); 1 == 1.0 == True so {1, 1.0, True} has one element
    </text>
  </g>

</svg>