<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <title>The Kubernetes PKI</title>
  <desc>Visual architecture of Kubernetes Public Key Infrastructure showing the distinct Certificate Authorities, issued certificates, and service account key pair.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1050" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48px" font-weight="bold" fill="#303a36">The Kubernetes PKI</text>

  
  
  <path d="M 140 445 L 140 182 L 420 182" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 240 445 L 240 327 L 420 327" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 340 477 L 420 477" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 340 627 L 420 627" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 240 665 L 240 767 L 420 767" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 140 665 L 140 912 L 420 912" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1187 220 L 1187 260" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1442 220 L 1442 260" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <path d="M 1315 550 L 1315 600" fill="none" stroke="#207448" stroke-width="3.5" marker-end="url(#arrow)" />

  
  <g id="node-CA">
    <rect x="40" y="445" width="300" height="220" rx="16" fill="#e8f1ea" stroke="#db8129" stroke-width="4" />
    
    <g transform="translate(162, 465)">
      <path d="M 28 4 L 48 12 C 48 34 28 48 28 48 C 28 48 8 34 8 12 Z" fill="none" stroke="#db8129" stroke-width="4" stroke-linejoin="round" />
      <path d="M 28 16 L 28 36" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 20 26 L 36 26" stroke="#db8129" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="190" y="545" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">Cluster CA</text>
    <text x="190" y="582" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="24px" fill="#303a36">(ca.crt/ca.key)</text>
    <rect x="120" y="605" width="140" height="38" rx="19" fill="#db8129" />
    <text x="190" y="632" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24px" font-weight="bold" fill="#ffffff">10-year</text>
  </g>

  
  
  <g id="node-API">
    <rect x="420" y="120" width="600" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 154)">
      <rect x="0" y="0" width="56" height="46" rx="6" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="0" y1="14" x2="56" y2="14" stroke="#207448" stroke-width="3" />
      <circle cx="10" cy="7" r="2.5" fill="#207448" />
      <circle cx="18" cy="7" r="2.5" fill="#207448" />
      <line x1="12" y1="30" x2="44" y2="30" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="524" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">kube-apiserver serving cert</text>
    <text x="524" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">
      <tspan x="524" dy="0">(SANs: DNS names,</tspan>
      <tspan x="746" dy="0">IPs, service IP)</tspan>
    </text>
  </g>

  
  <g id="node-AKC">
    <rect x="420" y="270" width="600" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 302)">
      <circle cx="18" cy="24" r="12" fill="none" stroke="#207448" stroke-width="4" />
      <line x1="30" y1="24" x2="52" y2="24" stroke="#207448" stroke-width="4" stroke-linecap="round" />
      <line x1="42" y1="24" x2="42" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50" y1="24" x2="50" y2="32" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="524" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">apiserver-kubelet-client</text>
    <text x="524" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">(API server → kubelet)</text>
  </g>

  
  <g id="node-KCL">
    <rect x="420" y="410" width="600" height="135" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 449)">
      <rect x="10" y="8" width="36" height="36" rx="5" fill="none" stroke="#207448" stroke-width="4" />
      <circle cx="28" cy="26" r="6" fill="#207448" />
      <line x1="18" y1="0" x2="18" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="0" x2="38" y2="8" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="18" y1="44" x2="18" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="44" x2="38" y2="52" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="524" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">kubelet client certs</text>
    <text x="524" y="488" font-family="'SF Mono', Consolas, monospace" font-size="24px" fill="#303a36">
      <tspan x="524" dy="0">(CN=system:node:&lt;name&gt;,</tspan>
      <tspan x="524" dy="30">O=system:nodes)</tspan>
    </text>
  </g>

  
  <g id="node-KSV">
    <rect x="420" y="570" width="600" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 602)">
      <circle cx="28" cy="24" r="18" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 20 24 L 26 30 L 36 18" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 18 40 L 14 50 L 28 45 L 42 50 L 38 40" fill="none" stroke="#207448" stroke-width="3" stroke-linejoin="round" />
    </g>
    <text x="524" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">kubelet serving certs</text>
    <text x="524" y="652" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">(via CSR approval)</text>
  </g>

  
  <g id="node-ADM">
    <rect x="420" y="710" width="600" height="115" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 742)">
      <circle cx="28" cy="16" r="10" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 10 44 C 10 32 18 28 28 28 C 38 28 46 32 46 44" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
    </g>
    <text x="524" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">admin.conf client cert</text>
    <text x="524" y="792" font-family="'SF Mono', Consolas, monospace" font-size="24px" fill="#303a36">(O=kubeadm:cluster-admins)</text>
  </g>

  
  <g id="node-CM">
    <rect x="420" y="850" width="600" height="125" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(444, 886)">
      <circle cx="22" cy="22" r="9" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 22 7 L 22 11 M 22 33 L 22 37 M 7 22 L 11 22 M 33 22 L 37 22" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="38" cy="38" r="7" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="524" y="898" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      <tspan x="524" dy="0">controller-manager /</tspan>
      <tspan x="524" dy="34">scheduler client certs</tspan>
    </text>
  </g>

  
  
  <g id="node-ECA">
    <rect x="1070" y="120" width="490" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1094, 144)">
      <ellipse cx="28" cy="14" rx="20" ry="8" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 14 L 8 36 C 8 41 17 45 28 45 C 39 45 48 41 48 36 L 48 14" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 8 25 C 8 30 17 34 28 34 C 39 34 48 30 48 25" fill="none" stroke="#207448" stroke-width="3" />
    </g>
    <text x="1170" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">etcd CA</text>
    <text x="1170" y="194" font-family="'SF Mono', Consolas, monospace" font-size="24px" fill="#303a36">(etcd/ca.crt)</text>
  </g>

  
  <g id="node-ES">
    <rect x="1070" y="260" width="235" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1163, 276)">
      <circle cx="12" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <circle cx="36" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="20" y1="14" x2="28" y2="14" stroke="#207448" stroke-width="3" />
    </g>
    <text x="1187" y="342" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26px" font-weight="bold" fill="#303a36">
      <tspan x="1187" dy="0">etcd server +</tspan>
      <tspan x="1187" dy="32">peer certs</tspan>
    </text>
  </g>

  
  <g id="node-AEC">
    <rect x="1325" y="260" width="235" height="140" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1418, 276)">
      <circle cx="14" cy="14" r="8" fill="none" stroke="#207448" stroke-width="3.5" />
      <path d="M 22 14 L 38 14 M 32 14 L 32 20 M 38 14 L 38 20" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <text x="1442" y="342" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="26px" font-weight="bold" fill="#303a36">
      <tspan x="1442" dy="0">apiserver-</tspan>
      <tspan x="1442" dy="32">etcd-client</tspan>
    </text>
  </g>

  
  
  <g id="node-FCA">
    <rect x="1070" y="450" width="490" height="100" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1094, 474)">
      <path d="M 26 4 L 46 12 C 46 32 26 44 26 44 C 26 44 6 32 6 12 Z" fill="none" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
      <circle cx="26" cy="22" r="5" fill="#207448" />
    </g>
    <text x="1170" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">front-proxy CA</text>
  </g>

  
  <g id="node-FPC">
    <rect x="1070" y="600" width="490" height="110" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1094, 631)">
      <rect x="4" y="6" width="44" height="36" rx="5" fill="none" stroke="#207448" stroke-width="4" />
      <path d="M 16 24 L 36 24 M 28 16 L 36 24 L 28 32" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="1170" y="645" font-family="'SF Mono', Consolas, monospace" font-size="28px" font-weight="bold" fill="#303a36">front-proxy-client</text>
    <text x="1170" y="682" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">(aggregated API auth)</text>
  </g>

  
  
  <g id="node-SA">
    <rect x="1070" y="760" width="490" height="180" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    
    <g transform="translate(1094, 822)">
      
      <circle cx="16" cy="18" r="10" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="26" y1="18" x2="48" y2="18" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="38" y1="18" x2="38" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="18" x2="46" y2="25" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      
      <circle cx="16" cy="38" r="10" fill="none" stroke="#207448" stroke-width="3.5" />
      <line x1="26" y1="38" x2="48" y2="38" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
      <line x1="38" y1="38" x2="38" y2="45" stroke="#207448" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="38" x2="46" y2="45" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="1170" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" fill="#303a36">
      <tspan x="1170" dy="0">Service account</tspan>
      <tspan x="1170" dy="32">key pair</tspan>
    </text>
    <text x="1170" y="880" font-family="'SF Mono', Consolas, monospace" font-size="24px" fill="#303a36">(sa.key/sa.pub)</text>
    <text x="1170" y="915" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#303a36">signs SA tokens</text>
  </g>
</svg>