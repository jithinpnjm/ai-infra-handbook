  <g transform="translate(60, 975)">
    <rect x="0" y="0" width="680" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="95" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
      read <tspan font-family="monospace">/proc/pressure/*</tspan> first
    </text>
  </g>

  
  <g transform="translate(760, 975)">
    <rect x="0" y="0" width="780" height="90" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <circle cx="50" cy="45" r="24" fill="#207448" />
    <text x="50" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="95" y="53" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
