<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" width="1600" height="1260">
  <title>Load keeps climbing, pressure stops at 100</title>
  <desc>Visual comparison between Load Average and PSI cpu some on a 2-CPU host as thread concurrency increases.</desc>

  <defs>
    
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#207448" />
    </marker>
    
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect x="0" y="0" width="1600" height="1260" fill="#f5f8f5" />

  
  <text x="60" y="62" font-family="sans-serif" font-size="44" font-weight="bold" fill="#207448">Load counts threads, pressure counts the time somebody waited.</text>
  
  <rect x="60" y="86" width="530" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="75" y="115" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">Load keeps climbing, pressure stops at 100</text>

  
  <rect x="1310" y="86" width="230" height="42" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  <text x="1425" y="115" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">on a 2-CPU host</text>

  
  
  <rect x="420" y="148" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="530" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">1 busy thread</text>

  
  <rect x="715" y="148" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="825" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">2 busy threads</text>

  
  <rect x="1010" y="148" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1120" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">3 busy threads</text>

  
  <rect x="1305" y="148" width="220" height="46" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="1415" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">4 busy threads</text>

  
  
  <rect x="60" y="210" width="300" height="260" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="180" y="240" width="60" height="56" rx="6" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <polyline points="190,280 205,268 220,274 232,248" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="210" y="340" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">Load average</text>

  
  <rect x="380" y="210" width="1160" height="260" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <line x1="410" y1="440" x2="1510" y2="440" stroke="#a0b5a6" stroke-width="2" />

  
  <line x1="530" y1="225" x2="530" y2="440" stroke="#edf3ee" stroke-width="2" />
  <line x1="825" y1="225" x2="825" y2="440" stroke="#edf3ee" stroke-width="2" />
  <line x1="1120" y1="225" x2="1120" y2="440" stroke="#edf3ee" stroke-width="2" />
  <line x1="1415" y1="225" x2="1415" y2="440" stroke="#edf3ee" stroke-width="2" />

  
  <rect x="490" y="395" width="80" height="45" rx="6" fill="#207448" />
  <text x="530" y="375" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">1.0</text>

  
  <rect x="785" y="350" width="80" height="90" rx="6" fill="#207448" />
  <text x="825" y="330" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">2.0</text>

  
  <rect x="1080" y="305" width="80" height="135" rx="6" fill="#207448" />
  <text x="1120" y="285" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">3.0</text>

  
  <rect x="1375" y="260" width="80" height="180" rx="6" fill="#207448" />
  <text x="1415" y="240" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">4.0</text>

  
  <path d="M 575 350 Q 950 250 1365 225" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="850" y="248" width="210" height="38" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="955" y="274" font-family="sans-serif" font-size="24" font-weight="bold" fill="#207448" text-anchor="middle">keeps climbing</text>

  
  
  <rect x="60" y="490" width="300" height="270" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="210" cy="540" r="28" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <path d="M 195 552 A 20 20 0 1 1 225 552" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <line x1="210" y1="540" x2="224" y2="528" stroke="#db8129" stroke-width="3" stroke-linecap="round" />
  <text x="210" y="605" font-family="sans-serif" font-size="30" font-weight="bold" fill="#207448" text-anchor="middle">PSI cpu some</text>
  
  <rect x="75" y="635" width="270" height="42" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="210" y="664" font-family="monospace" font-size="24" font-weight="bold" fill="#303a36" text-anchor="middle">/proc/pressure/cpu</text>

  
  <rect x="380" y="490" width="1160" height="270" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  <line x1="410" y1="720" x2="1510" y2="720" stroke="#a0b5a6" stroke-width="2" />

  
  <line x1="530" y1="505" x2="530" y2="720" stroke="#edf3ee" stroke-width="2" />
  <line x1="825" y1="505" x2="825" y2="720" stroke="#edf3ee" stroke-width="2" />
  <line x1="1120" y1="505" x2="1120" y2="720" stroke="#edf3ee" stroke-width="2" />
  <line x1="1415" y1="505" x2="1415" y2="720" stroke="#edf3ee" stroke-width="2" />

  
  <line x1="410" y1="540" x2="1510" y2="540" stroke="#db8129" stroke-width="3" stroke-dasharray="8 6" />

  
  <rect x="410" y="520" width="110" height="38" rx="8" fill="#fff4eb" stroke="#db8129" stroke-width="2" />
  <text x="465" y="547" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">ceiling</text>

  
  <rect x="490" y="716" width="80" height="4" rx="2" fill="#7cc499" stroke="#207448" stroke-width="1.5" />
  <text x="530" y="700" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">0.0</text>

  
  <rect x="785" y="716" width="80" height="4" rx="2" fill="#7cc499" stroke="#207448" stroke-width="1.5" />
  <text x="825" y="700" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">0.0</text>

  
  <rect x="1080" y="630" width="80" height="90" rx="6" fill="#7cc499" stroke="#207448" stroke-width="2" />
  <text x="1120" y="612" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">50.0</text>

  
  <rect x="1375" y="540" width="80" height="180" rx="6" fill="#7cc499" stroke="#207448" stroke-width="2" />
  <text x="1415" y="522" font-family="monospace" font-size="26" font-weight="bold" fill="#303a36" text-anchor="middle">100.0</text>

  
  <path d="M 1165 620 Q 1240 540 1365 540" fill="none" stroke="#db8129" stroke-width="3" marker-end="url(#arrow-orange)" />
  <rect x="1150" y="521" width="200" height="38" rx="8" fill="#ffffff" stroke="#db8129" stroke-width="2" />
  <text x="1250" y="547" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129" text-anchor="middle">stops at ceiling</text>

  
  <rect x="60" y="780" width="1480" height="175" rx="14" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  
  
  <text x="210" y="875" font-family="sans-serif" font-size="26" font-weight="bold" fill="#207448" text-anchor="middle">CPU cores state</text>

  
  <g transform="translate(450, 805)">
    
    <rect x="10" y="10" width="60" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <line x1="25" y1="4" x2="25" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="40" y1="4" x2="40" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="55" y1="4" x2="55" y2="10" stroke="#207448" stroke-width="2" />
    <circle cx="40" cy="40" r="14" fill="#207448" />
    <text x="40" y="47" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="40" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 0</text>
    
    <rect x="90" y="10" width="60" height="60" rx="6" fill="#ffffff" stroke="#a0b5a6" stroke-width="2" stroke-dasharray="4 3" />
    <line x1="105" y1="4" x2="105" y2="10" stroke="#a0b5a6" stroke-width="2" />
    <line x1="120" y1="4" x2="120" y2="10" stroke="#a0b5a6" stroke-width="2" />
    <line x1="135" y1="4" x2="135" y2="10" stroke="#a0b5a6" stroke-width="2" />
    <text x="120" y="46" font-family="sans-serif" font-size="22" fill="#a0b5a6" text-anchor="middle">-</text>
    <text x="120" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 1</text>
  </g>

  
  <g transform="translate(745, 805)">
    
    <rect x="10" y="10" width="60" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <line x1="25" y1="4" x2="25" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="40" y1="4" x2="40" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="55" y1="4" x2="55" y2="10" stroke="#207448" stroke-width="2" />
    <circle cx="40" cy="40" r="14" fill="#207448" />
    <text x="40" y="47" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="40" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 0</text>
    
    <rect x="90" y="10" width="60" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <line x1="105" y1="4" x2="105" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="120" y1="4" x2="120" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="135" y1="4" x2="135" y2="10" stroke="#207448" stroke-width="2" />
    <circle cx="120" cy="40" r="14" fill="#207448" />
    <text x="120" y="47" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="120" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 1</text>
  </g>

  
  <g transform="translate(1040, 805)">
    
    <rect x="10" y="10" width="60" height="60" rx="6" fill="#fef5ed" stroke="#db8129" stroke-width="2" />
    <line x1="25" y1="4" x2="25" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="40" y1="4" x2="40" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="55" y1="4" x2="55" y2="10" stroke="#db8129" stroke-width="2" />
    <circle cx="28" cy="40" r="11" fill="#207448" />
    <circle cx="52" cy="40" r="11" fill="#db8129" />
    <text x="40" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 0</text>
    
    <rect x="90" y="10" width="60" height="60" rx="6" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <line x1="105" y1="4" x2="105" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="120" y1="4" x2="120" y2="10" stroke="#207448" stroke-width="2" />
    <line x1="135" y1="4" x2="135" y2="10" stroke="#207448" stroke-width="2" />
    <circle cx="120" cy="40" r="14" fill="#207448" />
    <text x="120" y="47" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="120" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 1</text>
  </g>

  
  <g transform="translate(1335, 805)">
    
    <rect x="10" y="10" width="60" height="60" rx="6" fill="#fef5ed" stroke="#db8129" stroke-width="2" />
    <line x1="25" y1="4" x2="25" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="40" y1="4" x2="40" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="55" y1="4" x2="55" y2="10" stroke="#db8129" stroke-width="2" />
    <circle cx="28" cy="40" r="11" fill="#207448" />
    <circle cx="52" cy="40" r="11" fill="#db8129" />
    <text x="40" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 0</text>
    
    <rect x="90" y="10" width="60" height="60" rx="6" fill="#fef5ed" stroke="#db8129" stroke-width="2" />
    <line x1="105" y1="4" x2="105" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="120" y1="4" x2="120" y2="10" stroke="#db8129" stroke-width="2" />
    <line x1="135" y1="4" x2="135" y2="10" stroke="#db8129" stroke-width="2" />
    <circle cx="108" cy="40" r="11" fill="#207448" />
    <circle cx="132" cy="40" r="11" fill="#db8129" />
    <text x="120" y="94" font-family="sans-serif" font-size="24" fill="#303a36" text-anchor="middle">CPU 1</text>
