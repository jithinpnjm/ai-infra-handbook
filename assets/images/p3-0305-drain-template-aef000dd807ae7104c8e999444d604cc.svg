<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>The drain_nodes template: flow and the qualities to copy</title>
  <desc>Visual architecture and execution flow of the drain_nodes template script showing command parsing, signal handling, node selection, safe drain loop, exit results, and key production qualities.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <g transform="translate(40, 28)">
    <text x="0" y="44" font-family="sans-serif" font-size="48px" font-weight="bold" fill="#303a36">The drain_nodes template: flow and the qualities to copy</text>
  </g>

  
  <g transform="translate(40, 88)">
    <rect x="0" y="0" width="940" height="52" rx="10" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
    <text x="24" y="34" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">drain_nodes --selector pool=gpu-a --max-failures 0 --dry-run -v</text>
  </g>

  

  
  <g transform="translate(40, 155)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="110" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="40" r="24" fill="#207448" />
    <text x="44" y="49" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <g transform="translate(86, 12)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="14" />
      <path d="M28 6 L28 12 M28 44 L28 50 M6 28 L12 28 M44 28 L50 28 M12 12 L17 17 M39 39 L44 44 M12 44 L17 39 M39 17 L44 12" />
    </g>
    
    <text x="160" y="42" font-family="monospace" font-size="30px" font-weight="bold" fill="#303a36">parse_args</text>
    <text x="44" y="92" font-family="sans-serif" font-size="24px" fill="#303a36">logging to stderr, level by -v count (WARNING, INFO, DEBUG)</text>
  </g>

  
  <path d="M 510 265 L 510 285" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(40, 285)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="96" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="48" r="24" fill="#207448" />
    <text x="44" y="57" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <g transform="translate(86, 20)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8 L46 16 C46 36 28 48 28 48 C28 48 10 36 10 16 Z" />
      <path d="M22 28 L28 22 L34 28 M28 24 L28 36" />
    </g>
    
    <text x="160" y="56" font-family="sans-serif" font-size="25px" font-weight="bold" fill="#303a36">signal handlers for SIGINT and SIGTERM set a stop Event</text>
  </g>

  
  <path d="M 510 381 L 510 401" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(40, 401)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="175" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="40" r="24" fill="#207448" />
    <text x="44" y="49" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <g transform="translate(86, 12)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="14" />
      <line x1="34" y1="34" x2="48" y2="48" />
      <line x1="18" y1="24" x2="30" y2="24" />
      <line x1="24" y1="18" x2="24" y2="30" />
    </g>
    
    <text x="160" y="44" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">select_nodes: kubectl get nodes -l selector -o json</text>

    
    <path d="M 245 68 L 245 95" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 695 68 L 695 95" fill="none" stroke="#207448" stroke-width="2.5" marker-end="url(#arrow)" />

    
    <rect x="25" y="97" width="435" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="40" y="137" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">OpsError: log.error, return 2</text>

    
    <rect x="480" y="97" width="435" height="62" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="495" y="137" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">no nodes: log.warning, return 0</text>
  </g>

  
  <path d="M 510 576 L 510 596" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(40, 596)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="270" rx="12" fill="#ffffff" stroke="#207448" stroke-width="2" />
    
    <circle cx="44" cy="40" r="24" fill="#207448" />
    <text x="44" y="49" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <g transform="translate(86, 12)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 20 A 18 18 0 1 0 46 32" />
      <polyline points="38 8 46 18 36 22" />
    </g>
    
    <text x="160" y="43" font-family="monospace" font-size="24px" font-weight="bold" fill="#303a36">for each node: drain():</text>

    
    <rect x="25" y="70" width="890" height="126" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <text x="42" y="102" font-family="monospace" font-size="24px" fill="#303a36">if stop.is_set(): Result(node, False, interrupted);</text>
    <text x="42" y="136" font-family="monospace" font-size="24px" fill="#303a36">kubectl cordon (idempotent); kubectl drain</text>
    <text x="42" y="170" font-family="monospace" font-size="24px" fill="#303a36">--ignore-daemonsets --delete-emptydir-data --timeout=300s;</text>

    
    <text x="35" y="224" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">Result(node, True) or Result(node, False, str(exc))</text>
    <text x="35" y="254" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">stop when failures exceed --max-failures (failure budget)</text>
  </g>

  
  <path d="M 510 866 L 510 886" fill="none" stroke="#207448" stroke-width="3" marker-end="url(#arrow)" />

  
  <g transform="translate(40, 886)" filter="url(#shadow)">
    <rect x="0" y="0" width="940" height="106" rx="12" fill="#ffffff" stroke="#db8129" stroke-width="3" />
    
    <circle cx="44" cy="53" r="24" fill="#db8129" />
    <text x="44" y="62" font-family="sans-serif" font-size="26px" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <g transform="translate(86, 25)" stroke="#db8129" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="8" width="44" height="40" rx="4" />
      <path d="M14 22 L22 28 L14 34 M26 34 L38 34" />
    </g>
    
    <text x="160" y="46" font-family="sans-serif" font-size="24px" font-weight="bold" fill="#303a36">print JSON to stdout: drained list and failed list</text>
    <text x="160" y="84" font-family="monospace" font-size="24px" font-weight="bold" fill="#207448">return 1 if failed else 0</text>
  </g>

  

  
  <g transform="translate(1020, 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="540" height="778" rx="14" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
    <rect x="0" y="0" width="540" height="64" rx="14" fill="#207448" />
    <rect x="0" y="44" width="540" height="20" fill="#207448" />

    
    <g transform="translate(20, 6)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="30" height="36" rx="4" />
      <path d="M20 12 V8 H34 V12" />
      <path d="M18 28 L24 34 L36 22" />
    </g>
    <text x="74" y="43" font-family="sans-serif" font-size="28px" font-weight="bold" fill="#ffffff">Qualities checklist</text>

    
    
    <g transform="translate(24, 84)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">a single main() returns the exit code</text>
    </g>

    
    <g transform="translate(24, 134)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">--dry-run previews the work</text>
    </g>

    
    <g transform="translate(24, 184)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">each step idempotent so a second</text>
      <text x="40" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">run does no harm</text>
    </g>

    
    <g transform="translate(24, 262)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">each node isolated from the others</text>
      <text x="40" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">with a failure budget</text>
    </g>

    
    <g transform="translate(24, 340)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">every subprocess has a timeout</text>
    </g>

    
    <g transform="translate(24, 390)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">logs go to stderr and machine-readable</text>
      <text x="40" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">results go to stdout</text>
    </g>

    
    <g transform="translate(24, 468)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">handles interrupts gracefully</text>
    </g>

    
    <g transform="translate(24, 518)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">no shell</text>
    </g>

    
    <g transform="translate(24, 568)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">error messages include the command</text>
      <text x="40" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">and its stderr</text>
    </g>

    
    <g transform="translate(24, 646)">
      <circle cx="16" cy="16" r="14" fill="#207448" />
      <path d="M10 16 L15 21 L22 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="24" font-family="sans-serif" font-size="24px" fill="#303a36">small testable functions; sequential for</text>
      <text x="40" y="52" font-family="sans-serif" font-size="24px" fill="#303a36">safety (rolling), parallelise cautiously</text>
    </g>
  </g>

  
  <g transform="translate(1020, 886)" filter="url(#shadow)">
    <rect x="0" y="0" width="540" height="106" rx="12" fill="#ffffff" stroke="#207448" stroke-dasharray="6,6" stroke-width="2" />
    <g transform="translate(18, 25)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="24" r="16" />
      <line x1="20" y1="18" x2="20" y2="26" />
      <circle cx="20" cy="32" r="1.5" fill="#207448" />
    </g>
    <text x="70" y="38" font-family="sans-serif" font-size="24px" fill="#303a36">dry-run: kubectl returns an empty string</text>
    <text x="70" y="72" font-family="sans-serif" font-size="24px" fill="#303a36">for drain, cordon, uncordon and delete</text>
  </g>

  
  <g transform="translate(40, 1024)">
    <rect x="0" y="0" width="1520" height="84" rx="14" fill="#207448" />
    <g transform="translate(28, 20)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6 L38 22 L22 38" />
      <path d="M6 22 L36 22" />
    </g>
    <text x="80" y="52" font-family="sans-serif" font-size="30px" font-weight="bold" fill="#ffffff">When one of the qualities is missing, ask whether the omission was deliberate</text>
  </g>
</svg>