<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Two-tier time on a cluster: head nodes face outward, compute nodes point at the head</title>
  <desc>Architecture diagram showing external reference clocks stratum 0, stratum 1, and site NTP synchronising to cluster head node, and compute nodes synchronising only to the head node with orphan fallback.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#207448" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#db8129" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="52" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#303a36">Two-tier time on a cluster:</text>
  <text x="800" y="104" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#207448">head nodes face outward, compute nodes point at the head</text>

  
  <rect x="40" y="128" width="1520" height="60" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="800" y="166" text-anchor="middle" font-family="monospace" font-size="24" fill="#303a36">Use exactly one time service on each host: systemctl disable --now systemd-timesyncd before installing chrony</text>

  

  
  <rect x="40" y="218" width="180" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <circle cx="130" cy="275" r="26" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <polyline points="130,260 130,275 142,275" fill="none" stroke="#207448" stroke-width="4" stroke-linecap="round" />
  <path d="M 108,245 A 36,36 0 0,1 152,245" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  <path d="M 100,237 A 48,48 0 0,1 160,237" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="130" y="360" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">
    <tspan x="130" dy="0">Stratum 0:</tspan>
  </text>
  <text x="130" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="130" dy="0">reference</tspan>
    <tspan x="130" dy="36">clocks</tspan>
    <tspan x="130" dy="36">(GPS,</tspan>
    <tspan x="130" dy="36">atomic)</tspan>
  </text>

  
  <line x1="220" y1="448" x2="258" y2="448" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="260" y="218" width="180" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <rect x="298" y="250" width="104" height="52" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <line x1="298" y1="276" x2="402" y2="276" stroke="#207448" stroke-width="3" />
  <circle cx="316" cy="263" r="4" fill="#207448" />
  <circle cx="316" cy="289" r="4" fill="#207448" />
  <circle cx="378" cy="276" r="14" fill="#ffffff" stroke="#207448" stroke-width="3" />
  <polyline points="378,268 378,276 384,276" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
  
  <text x="350" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="350" dy="0">Stratum 1</tspan>
    <tspan x="350" dy="36">servers</tspan>
    <tspan x="350" dy="36">connect to</tspan>
    <tspan x="350" dy="36">those</tspan>
    <tspan x="350" dy="36">clocks</tspan>
  </text>

  
  <line x1="440" y1="448" x2="478" y2="448" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="480" y="218" width="230" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 550,285 A 22,22 0 0,1 586,263 A 32,32 0 0,1 634,267 A 20,20 0 0,1 646,285 A 18,18 0 0,1 638,303 L 554,303 A 18,18 0 0,1 550,285 Z" fill="#ffffff" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  
  <text x="595" y="360" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="595" dy="0">Site NTP</tspan>
    <tspan x="595" dy="34">servers or</tspan>
    <tspan x="595" dy="34">the internet</tspan>
  </text>
  <text x="595" y="485" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="595" dy="0">(stratum 2</tspan>
    <tspan x="595" dy="34">and below</tspan>
    <tspan x="595" dy="34">synchronise</tspan>
    <tspan x="595" dy="34">upward)</tspan>
  </text>

  
  <line x1="710" y1="448" x2="768" y2="448" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <line x1="732" y1="416" x2="748" y2="480" stroke="#db8129" stroke-width="5" stroke-dasharray="8,5" />
  <line x1="748" y1="416" x2="732" y2="480" stroke="#db8129" stroke-width="5" stroke-dasharray="8,5" />
  <text x="740" y="398" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">upstream lost</text>
  
  <line x1="740" y1="485" x2="740" y2="720" stroke="#db8129" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow-orange)" />

  
  <rect x="770" y="218" width="380" height="460" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <rect x="910" y="246" width="100" height="56" rx="6" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <line x1="910" y1="274" x2="1010" y2="274" stroke="#207448" stroke-width="3" />
  <circle cx="928" cy="260" r="4" fill="#207448" />
  <circle cx="928" cy="288" r="4" fill="#207448" />
  <circle cx="980" cy="274" r="12" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  
  <text x="960" y="342" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Head or management node</text>
  
  <rect x="786" y="372" width="348" height="280" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  <text x="806" y="420" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="806" dy="0">pool 2.pool.ntp.org</tspan>
    <tspan x="836" dy="34">iburst maxsources 4</tspan>
  </text>
  <line x1="806" y1="482" x2="1114" y2="482" stroke="#e8f1ea" stroke-width="2" />
  <text x="806" y="524" font-family="monospace" font-size="24" fill="#303a36">allow 10.0.0.0/16</text>
  <line x1="806" y1="556" x2="1114" y2="556" stroke="#e8f1ea" stroke-width="2" />
  <text x="806" y="598" font-family="monospace" font-size="24" fill="#303a36">
    <tspan x="806" dy="0">local stratum 10</tspan>
    <tspan x="836" dy="34">orphan</tspan>
  </text>

  
  <line x1="1150" y1="448" x2="1188" y2="448" stroke="#207448" stroke-width="4" marker-end="url(#arrow)" />

  
  <rect x="1190" y="218" width="370" height="460" rx="12" fill="none" stroke="#207448" stroke-width="2" stroke-dasharray="6,6" />

  
  <rect x="1210" y="238" width="330" height="118" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1232" y="254" width="30" height="30" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <line x1="1240" y1="250" x2="1240" y2="254" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="250" x2="1254" y2="254" stroke="#207448" stroke-width="2" />
  <line x1="1240" y1="284" x2="1240" y2="288" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="284" x2="1254" y2="288" stroke="#207448" stroke-width="2" />
  <text x="1280" y="278" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node01</text>
  <text x="1232" y="324" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>

  
  <rect x="1210" y="388" width="330" height="118" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1232" y="404" width="30" height="30" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <line x1="1240" y1="400" x2="1240" y2="404" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="400" x2="1254" y2="404" stroke="#207448" stroke-width="2" />
  <line x1="1240" y1="434" x2="1240" y2="438" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="434" x2="1254" y2="438" stroke="#207448" stroke-width="2" />
  <text x="1280" y="428" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node02</text>
  <text x="1232" y="474" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>

  
  <rect x="1210" y="538" width="330" height="118" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <rect x="1232" y="554" width="30" height="30" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="3" />
  <line x1="1240" y1="550" x2="1240" y2="554" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="550" x2="1254" y2="554" stroke="#207448" stroke-width="2" />
  <line x1="1240" y1="584" x2="1240" y2="588" stroke="#207448" stroke-width="2" />
  <line x1="1254" y1="584" x2="1254" y2="588" stroke="#207448" stroke-width="2" />
  <text x="1280" y="578" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">node03</text>
  <text x="1232" y="624" font-family="monospace" font-size="24" fill="#303a36">server head iburst</text>


  

  
  <rect x="40" y="720" width="380" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <ellipse cx="230" cy="775" rx="36" ry="12" fill="#ffffff" stroke="#207448" stroke-width="4" />
  <path d="M 194,775 v 20 c 0,6.6 16.1,12 36,12 c 19.9,0 36,-5.4 36,-12 v -20" fill="none" stroke="#207448" stroke-width="4" />
  <path d="M 194,795 v 20 c 0,6.6 16.1,12 36,12 c 19.9,0 36,-5.4 36,-12 v -20" fill="none" stroke="#207448" stroke-width="4" />
  
  <text x="230" y="885" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#303a36">Diskless boot:</text>
  <text x="230" y="945" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="230" dy="0">put the NTP address</tspan>
    <tspan x="230" dy="38">in DHCP option 42</tspan>
  </text>

  
  <rect x="460" y="720" width="510" height="360" rx="12" fill="#fffaf5" stroke="#db8129" stroke-width="3" />
  
  <polygon points="715,750 745,765 745,800 715,820 685,800 685,765" fill="#ffffff" stroke="#db8129" stroke-width="4" />
  <line x1="715" y1="770" x2="715" y2="790" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
  <circle cx="715" cy="803" r="3" fill="#db8129" />
  
  <text x="715" y="870" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#db8129">
    <tspan x="715" dy="0">the head node keeps serving</tspan>
    <tspan x="715" dy="36">time through local stratum 10</tspan>
    <tspan x="715" dy="36">orphan, so the cluster stays</tspan>
    <tspan x="715" dy="36">consistent with itself</tspan>
  </text>

  
  <rect x="1010" y="720" width="550" height="360" rx="12" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  
  <path d="M 1255,775 A 18,18 0 0,1 1285,755 A 26,26 0 0,1 1325,760 A 18,18 0 0,1 1335,775 A 16,16 0 0,1 1325,795 L 1260,795 A 16,16 0 0,1 1255,775 Z" fill="#ffffff" stroke="#207448" stroke-width="4" stroke-linejoin="round" />
  
  <text x="1285" y="835" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#303a36">Cloud alternative</text>
  
  <rect x="1036" y="860" width="498" height="96" rx="8" fill="#ffffff" stroke="#207448" stroke-width="1.5" />
  <text x="1056" y="900" font-family="monospace" font-size="24" fill="#303a36">169.254.169.123 on AWS</text>
  <text x="1056" y="938" font-family="monospace" font-size="24" fill="#303a36">metadata.google.internal on GCP</text>
  
  <text x="1285" y="1000" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#303a36">
    <tspan x="1285" dy="0">work without Internet access and</tspan>
    <tspan x="1285" dy="34">smear leap seconds consistently</tspan>
  </text>

  
  <rect x="40" y="1120" width="1520" height="60" rx="8" fill="#207448" />
  <text x="800" y="1158" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Compute nodes point only at the head nodes</text>
</svg>