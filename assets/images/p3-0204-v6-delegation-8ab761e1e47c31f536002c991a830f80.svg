<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>How an IPv6 allocation is carved up: from a provider /32 down to a /64 and a cluster plan</title>
  <desc>How an IPv6 allocation is carved up: from a provider /32 down to a /64 and a cluster plan</desc>

  <defs>
    <marker id="ladder-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">How an IPv6 allocation is carved up:</text>
  <text x="800" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#303a36">from a provider /32 down to a /64 and a cluster plan</text>

  

  
  <rect x="50" y="150" width="710" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(68, 164)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 36 A 12 12 0 0 1 22 18 A 16 16 0 0 1 44 20 A 10 10 0 0 1 48 36 Z" />
  </g>
  <text x="140" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">ISP or cloud gives a /32</text>
  <text x="140" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">to a provider network</text>

  
  <line x1="100" y1="234" x2="100" y2="252" stroke="#207448" stroke-width="3" marker-end="url(#ladder-arrow)" />

  
  <rect x="75" y="254" width="685" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(93, 268)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="40" rx="2" />
    <line x1="18" y1="20" x2="24" y2="20" />
    <line x1="32" y1="20" x2="38" y2="20" />
    <line x1="18" y1="30" x2="24" y2="30" />
    <line x1="32" y1="30" x2="38" y2="30" />
    <rect x="23" y="38" width="10" height="12" />
  </g>
  <text x="165" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">a site or customer gets a /48:</text>
  <text x="165" y="321" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">65,536 /64 subnets</text>

  
  <line x1="125" y1="338" x2="125" y2="356" stroke="#207448" stroke-width="3" marker-end="url(#ladder-arrow)" />

  
  <rect x="100" y="358" width="660" height="84" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(118, 372)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 26 L 28 10 L 46 26" />
    <rect x="16" y="26" width="24" height="22" />
    <rect x="23" y="34" width="10" height="14" />
  </g>
  <text x="190" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">a home may get a /56:</text>
  <text x="190" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">256 /64 subnets</text>

  
  <line x1="150" y1="442" x2="150" y2="460" stroke="#207448" stroke-width="3" marker-end="url(#ladder-arrow)" />

  
  <rect x="125" y="462" width="635" height="106" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2.5" />
  
  <g transform="translate(143, 485)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="18" r="6" />
    <circle cx="14" cy="40" r="5" />
    <circle cx="42" cy="40" r="5" />
    <line x1="24" y1="23" x2="17" y2="35" />
    <line x1="32" y1="23" x2="39" y2="35" />
  </g>
  <text x="210" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">every subnet is a /64:</text>
  <text x="210" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">SLAAC and Neighbor Discovery assume</text>
  <text x="210" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">a 64-bit interface ID</text>

  
  <rect x="50" y="584" width="710" height="142" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" stroke-dasharray="6,4" />
  
  <g transform="translate(68, 624)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="14" width="40" height="28" rx="3" />
    <line x1="18" y1="14" x2="18" y2="42" />
    <line x1="28" y1="14" x2="28" y2="42" />
    <line x1="38" y1="14" x2="38" y2="42" />
  </g>
  <text x="135" y="622" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">Divide on hex nibble boundaries:</text>
  <text x="135" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">/52, /56, /60, /64, which keeps prefixes</text>
  <text x="135" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">readable and lets them aggregate</text>

  
  <rect x="50" y="746" width="710" height="194" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
  
  <g transform="translate(68, 808)" stroke="#db8129" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 8 L 46 16 L 46 32 C 46 44 28 52 28 52 C 28 52 10 44 10 32 L 10 16 Z" />
    <line x1="28" y1="22" x2="28" y2="34" />
    <circle cx="28" cy="42" r="1.5" fill="#db8129" />
  </g>

  
  <rect x="135" y="764" width="605" height="76" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="155" y="796" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#db8129">point-to-point router links:</text>
  <text x="155" y="826" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">/127 (RFC 6164)</text>

  
  <rect x="135" y="850" width="605" height="74" rx="6" fill="#ffffff" stroke="#db8129" stroke-width="1.5" />
  <text x="155" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#db8129">loopbacks: <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="normal" fill="#303a36">/128</tspan></text>


  

  
  <rect x="840" y="150" width="710" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 206)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="40" height="42" rx="3" />
    <line x1="8" y1="22" x2="48" y2="22" />
    <line x1="8" y1="36" x2="48" y2="36" />
    <circle cx="16" cy="15" r="1.5" fill="#207448" />
    <circle cx="16" cy="29" r="1.5" fill="#207448" />
    <circle cx="16" cy="43" r="1.5" fill="#207448" />
  </g>
  <text x="930" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Cluster: <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="normal" fill="#303a36">2001:db8:100::/48</tspan></text>
  
  <rect x="930" y="238" width="220" height="34" rx="4" fill="#207448" opacity="0.9" />
  <rect x="1155" y="238" width="370" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

  
  <rect x="840" y="345" width="710" height="175" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 401)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="29" r="10" />
    <path d="M 28 13 L 28 17 M 28 41 L 28 45 M 13 29 L 17 29 M 41 29 L 45 29 M 17 18 L 20 21 M 36 37 L 39 40 M 17 40 L 20 37 M 36 21 L 39 18" />
  </g>
  <text x="930" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Management: <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="normal" fill="#303a36">2001:db8:100:1::/64</tspan></text>
  
  <rect x="930" y="433" width="295" height="34" rx="4" fill="#207448" opacity="0.9" />
  <rect x="1230" y="433" width="295" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />

  
  <rect x="840" y="540" width="710" height="186" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 596)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="16" x2="48" y2="16" />
    <line x1="8" y1="28" x2="48" y2="28" />
    <line x1="8" y1="40" x2="48" y2="40" />
    <line x1="16" y1="10" x2="16" y2="46" />
    <line x1="40" y1="10" x2="40" y2="46" />
  </g>
  <text x="930" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#207448">16 rail subnets: 2001:db8:100:10::/60,</text>
  <text x="930" y="618" font-family="ui-monospace, monospace" font-size="24" fill="#303a36">from ...:10::/64 through ...:1f::/64</text>
  
  <g transform="translate(930, 642)">
    <rect x="0" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="38" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="76" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="114" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="152" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="190" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="228" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="266" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="304" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="342" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="380" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="418" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="456" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="494" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="532" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="570" y="0" width="34" height="26" rx="3" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  </g>

  
  <rect x="840" y="746" width="710" height="194" rx="8" fill="#ffffff" stroke="#207448" stroke-width="2" />
  
  <g transform="translate(865, 808)" stroke="#207448" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="8" width="36" height="42" rx="3" />
    <line x1="10" y1="22" x2="46" y2="22" />
    <line x1="10" y1="36" x2="46" y2="36" />
    <line x1="16" y1="15" x2="26" y2="15" />
    <line x1="16" y1="29" x2="26" y2="29" />
    <line x1="16" y1="43" x2="26" y2="43" />
  </g>
  <text x="930" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">Per-rack /64s: <tspan font-family="ui-monospace, monospace" font-size="26" font-weight="normal" fill="#303a36">2001:db8:100:100::/56</tspan></text>
  
  <g transform="translate(930, 836)">
    <rect x="0" y="0" width="138" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="150" y="0" width="138" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="300" y="0" width="138" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    <rect x="450" y="0" width="138" height="34" rx="4" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
  </g>


  
  <rect x="50" y="960" width="1500" height="120" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="75" y="996" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">Address types by first digits: 2000::/3 global unicast (starts with 2 or 3),</text>
  <text x="75" y="1029" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">fc00::/7 unique local (in practice fd00::/8), fe80::/10 link-local,</text>
  <text x="75" y="1062" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">ff00::/8 multicast; there is no broadcast in IPv6</text>


  
  <rect x="50" y="1100" width="1500" height="64" rx="8" fill="#207448" />
  <text x="800" y="1141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">If a /64 feels wasteful, remember the point of IPv6 is to stop counting addresses</text>
</svg>