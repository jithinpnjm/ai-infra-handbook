<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Scaling worked example: Amdahl with 64 workers, and three questions for multi-GPU curves</title>
  <desc>Infographic explaining Amdahl scaling with 64 workers, fitting recipe for Amdahl and USL models, and multi-GPU scaling diagnostic questions.</desc>

  
  <rect x="0" y="0" width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#303a36">
    <tspan x="800" dy="0">Scaling worked example: Amdahl with 64 workers,</tspan>
    <tspan x="800" dy="58">and three questions for multi-GPU curves</tspan>
  </text>

  
  
  
  <rect x="40" y="160" width="470" height="895" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="60" y="180" width="430" height="520" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />

  
  <g transform="translate(80, 200)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="36" height="36" rx="6" />
    <rect x="19" y="19" width="18" height="18" rx="2" />
    <line x1="18" y1="2" x2="18" y2="10" />
    <line x1="28" y1="2" x2="28" y2="10" />
    <line x1="38" y1="2" x2="38" y2="10" />
    <line x1="18" y1="46" x2="18" y2="54" />
    <line x1="28" y1="46" x2="28" y2="54" />
    <line x1="38" y1="46" x2="38" y2="54" />
    <line x1="2" y1="18" x2="10" y2="18" />
    <line x1="2" y1="28" x2="10" y2="28" />
    <line x1="2" y1="38" x2="10" y2="38" />
    <line x1="46" y1="18" x2="54" y2="18" />
    <line x1="46" y1="28" x2="54" y2="28" />
    <line x1="46" y1="38" x2="54" y2="38" />
  </g>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">
    <tspan x="148" y="238">Amdahl:</tspan>
    <tspan x="80" y="284">C(N) = N / (1 + alpha(N - 1))</tspan>
  </text>

  
  <text x="80" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">alpha = 0.05 (serial fraction),</tspan>
    <tspan x="80" dy="32">N = 64</tspan>
  </text>

  
  <text x="80" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="80" dy="0">C(64) = 64 / (1 + 0.05 x 63)</tspan>
    <tspan x="80" dy="32">= 15.4x</tspan>
  </text>

  
  
  <rect x="80" y="474" width="360" height="36" rx="6" fill="#207448" />
  <text x="95" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">64x ideal</text>

  
  <rect x="80" y="528" width="87" height="36" rx="6" fill="#db8129" />
  <text x="180" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">15.4x achieved</text>

  
  <line x1="193" y1="462" x2="193" y2="576" stroke="#303a36" stroke-width="3" stroke-dasharray="6,4" />

  
  <text x="80" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">ceiling 1/alpha = 20x:</tspan>
    <tspan x="80" dy="30">no number of workers can</tspan>
    <tspan x="80" dy="30">push the speed-up past it</tspan>
  </text>

  
  <rect x="60" y="720" width="430" height="315" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />

  
  <g transform="translate(80, 738)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,48 4,4 50,4" />
    <path d="M 6,44 Q 24,10 34,14 Q 44,18 48,38" />
    <circle cx="34" cy="14" r="3" fill="#207448" />
  </g>

  
  <text font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="#207448">
    <tspan x="148" y="772">C(N) = N /</tspan>
    <tspan x="80" y="816">(1 + alpha(N - 1) +</tspan>
    <tspan x="80" y="850">beta N (N - 1))</tspan>
  </text>

  
  <text x="80" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="80" dy="0">beta is the coherence delay;</tspan>
    <tspan x="80" dy="32">with beta greater than 0,</tspan>
    <tspan x="80" dy="32">throughput peaks and</tspan>
    <tspan x="80" dy="32">then declines</tspan>
  </text>

  
  
  
  <rect x="550" y="160" width="470" height="895" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <rect x="570" y="180" width="430" height="195" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  
  <circle cx="612" cy="225" r="22" fill="#207448" />
  <text x="612" y="233" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  
  <g transform="translate(650, 201)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="10" rx="20" ry="7" />
    <path d="M 4,10 v 14 c 0,4 9,7 20,7 s 20,-3 20,-7 v -14" />
    <path d="M 4,24 v 14 c 0,4 9,7 20,7 s 20,-3 20,-7 v -14" />
  </g>
  
  <text x="595" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="595" dy="0">collect data for a</tspan>
    <tspan x="595" dy="34">range of N</tspan>
  </text>

  
  <rect x="570" y="390" width="430" height="215" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  
  <circle cx="612" cy="435" r="22" fill="#207448" />
  <text x="612" y="443" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  
  <g transform="translate(650, 411)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,44 4,6 46,6" />
    <path d="M 6,38 Q 20,34 28,20 Q 36,8 46,6" />
    <circle cx="14" cy="37" r="2" fill="#207448" />
    <circle cx="24" cy="27" r="2" fill="#207448" />
    <circle cx="38" cy="14" r="2" fill="#207448" />
  </g>
  
  <text x="595" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="595" dy="0" font-weight="bold">fit alpha and beta by</tspan>
    <tspan x="595" dy="30" font-weight="bold">non-linear regression</tspan>
    <tspan x="595" dy="30" font-family="monospace" font-size="24">(R nls, gnuplot fit,</tspan>
    <tspan x="595" dy="30" font-family="monospace" font-size="24">scipy.optimize.curve_fit)</tspan>
  </text>

  
  <rect x="570" y="620" width="430" height="190" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  
  <circle cx="612" cy="665" r="22" fill="#207448" />
  <text x="612" y="673" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  
  <g transform="translate(650, 641)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,44 4,6 46,6" />
    <path d="M 6,38 C 18,36 28,20 46,10" stroke-dasharray="4,3" />
    <polyline points="6,40 18,32 30,22 42,12" />
  </g>
  
  <text x="595" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="595" dy="0">plot model</tspan>
    <tspan x="595" dy="34">against data</tspan>
  </text>

  
  <rect x="570" y="825" width="430" height="210" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  
  <circle cx="612" cy="870" r="22" fill="#207448" />
  <text x="612" y="878" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">4</text>
  
  <g transform="translate(650, 846)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="20" />
    <circle cx="24" cy="24" r="11" />
    <circle cx="24" cy="24" r="3" fill="#207448" />
  </g>
  
  <text x="595" y="942" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#303a36">
    <tspan x="595" dy="0">hold out later points</tspan>
    <tspan x="595" dy="34">to test the prediction</tspan>
  </text>

  
  
  
  <rect x="1060" y="160" width="500" height="895" rx="16" fill="#e8f1ea" stroke="#207448" stroke-width="2" />

  
  <g transform="translate(1085, 182)" stroke="#207448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="3" />
    <rect x="32" y="4" width="16" height="16" rx="3" />
    <rect x="4" y="32" width="16" height="16" rx="3" />
    <rect x="32" y="32" width="16" height="16" rx="3" />
    <line x1="20" y1="12" x2="32" y2="12" />
    <line x1="20" y1="40" x2="32" y2="40" />
    <line x1="12" y1="20" x2="12" y2="32" />
    <line x1="40" y1="20" x2="40" y2="32" />
  </g>

  
  <text x="1150" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Multi-GPU scaling</text>

  
  <rect x="1080" y="245" width="460" height="185" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  <text x="1100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0" font-weight="bold">Strong scaling, fixed</tspan>
    <tspan x="1100" dy="29">global batch, follows</tspan>
    <tspan x="1100" dy="29">Amdahl-like curves because</tspan>
    <tspan x="1100" dy="29">communication and serial</tspan>
    <tspan x="1100" dy="29">sections do not shrink</tspan>
  </text>

  
  <rect x="1080" y="442" width="460" height="185" rx="12" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  <text x="1100" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0" font-weight="bold">Weak scaling, batch grows</tspan>
    <tspan x="1100" dy="29">with GPUs, judged by</tspan>
    <tspan x="1100" dy="29">scaling efficiency =</tspan>
    <tspan x="1100" dy="29" font-weight="bold">throughput(N) /</tspan>
    <tspan x="1100" dy="29" font-weight="bold">(N x throughput(1))</tspan>
  </text>

  
  <rect x="1080" y="640" width="460" height="125" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  <text x="1100" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0" font-weight="bold">Where is the knee? Eight</tspan>
    <tspan x="1100" dy="28">GPUs form one NVLink domain,</tspan>
    <tspan x="1100" dy="28">beyond that traffic uses</tspan>
    <tspan x="1100" dy="28" font-weight="bold">InfiniBand</tspan>
  </text>

  
  <rect x="1080" y="777" width="460" height="118" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  <text x="1100" y="810" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0" font-weight="bold">Does efficiency drop at node</tspan>
    <tspan x="1100" dy="30">counts that exceed one</tspan>
    <tspan x="1100" dy="30">leaf or pod?</tspan>
  </text>

  
  <rect x="1080" y="907" width="460" height="128" rx="10" fill="#ffffff" stroke="#c0d4c6" stroke-width="2" />
  <text x="1100" y="940" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
    <tspan x="1100" dy="0" font-weight="bold">Does the curve change with</tspan>
    <tspan x="1100" dy="30">message size or algorithm,</tspan>
    <tspan x="1100" dy="30">NCCL ring or tree?</tspan>
  </text>

  
  
  
  <rect x="40" y="1080" width="1520" height="80" rx="12" fill="#207448" />
  <text x="800" y="1130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">A deviation from the model is informative</text>

</svg>