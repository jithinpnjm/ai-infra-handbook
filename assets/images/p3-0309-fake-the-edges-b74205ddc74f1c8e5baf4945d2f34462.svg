<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <title>Faking subprocess, filesystem, time and randomness</title>
  <desc>A reference table mapping testing edges to techniques for subprocesses, filesystems, time, randomness, and asynchronous code.</desc>

  <defs>
    <marker id="header-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#207448" />
    </marker>
  </defs>

  
  <rect width="1600" height="1200" fill="#f5f8f5" />

  
  <text x="800" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#207448" text-anchor="middle">Faking subprocess, filesystem, time and randomness</text>

  
  <rect x="40" y="96" width="1520" height="52" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="2" />
  <text x="75" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Edge</text>
  <line x1="165" y1="122" x2="505" y2="122" stroke="#207448" stroke-width="3.5" marker-end="url(#header-arrow)" />
  <text x="545" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Technique</text>

  
  <g>
    <rect x="40" y="160" width="490" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="58" y="176" width="44" height="38" rx="5" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="58" y1="188" x2="102" y2="188" stroke="#207448" stroke-width="3" />
    <path d="M66 197 l5 4 l-5 4" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="77" y1="205" x2="88" y2="205" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="122" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Subprocess parser</text>

    <rect x="545" y="160" width="1015" height="72" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">test with recorded output</text>
  </g>

  
  <g>
    <rect x="40" y="244" width="490" height="118" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="58" y="281" width="44" height="44" rx="6" fill="none" stroke="#207448" stroke-width="3.5" stroke-dasharray="5 3" />
    <rect x="68" y="291" width="24" height="24" rx="4" fill="none" stroke="#207448" stroke-width="3.5" />
    <text x="122" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Subprocess wrapper</text>

    <rect x="545" y="244" width="1015" height="118" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" y="280">patch <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">subprocess.run</tspan> to return</tspan>
      <tspan x="575" dy="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CompletedProcess(args, 0, stdout=..., stderr=...);</tspan>
      <tspan x="575" dy="32">include <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">subprocess.TimeoutExpired</tspan> and non-zero exits</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="374" width="490" height="94" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="68" cy="421" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="74" y1="421" x2="86" y2="421" stroke="#207448" stroke-width="3.5" />
    <circle cx="92" cy="421" r="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <line x1="92" y1="415" x2="92" y2="405" stroke="#207448" stroke-width="3.5" />
    <path d="M62 405 h36" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" />
    <text x="122" y="431" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Whole subprocess path</text>

    <rect x="545" y="374" width="1015" height="94" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" y="414">a tiny fake executable written to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tmp_path</tspan> and placed</tspan>
      <tspan x="575" dy="32">first in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PATH</tspan> exercises the real subprocess path end to end</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="480" width="490" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <path d="M60 500 h12 l4 5 h22 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 z" fill="none" stroke="#207448" stroke-width="3.5" stroke-linejoin="round" />
    <text x="122" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Filesystem</text>

    <rect x="545" y="480" width="1015" height="72" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tmp_path</tspan>; never let a test read a real home directory</text>
  </g>

  
  <g>
    <rect x="40" y="564" width="490" height="118" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="74" y="603" width="12" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <line x1="80" y1="613" x2="80" y2="623" stroke="#207448" stroke-width="3" />
    <line x1="68" y1="623" x2="92" y2="623" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <line x1="68" y1="623" x2="68" y2="631" stroke="#207448" stroke-width="3" />
    <line x1="92" y1="623" x2="92" y2="631" stroke="#207448" stroke-width="3" />
    <rect x="62" y="631" width="12" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <rect x="86" y="631" width="12" height="10" rx="2" fill="none" stroke="#207448" stroke-width="3" />
    <text x="122" y="633" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">/proc and /sys readers</text>

    <rect x="545" y="564" width="1015" height="118" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" y="600">take the root as a parameter, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">root=Path("/")</tspan>,</tspan>
      <tspan x="575" dy="32">and point it at a fixture tree; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pyfakefs</tspan> can fake</tspan>
      <tspan x="575" dy="32">the whole filesystem when necessary</tspan>
    </text>
  </g>

  
  <g>
    <rect x="40" y="694" width="490" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="58" y="709" width="44" height="40" rx="6" fill="none" stroke="#207448" stroke-width="3.5" />
    <path d="M84 722 c0-3-3-5-6-5 c-4 0-6 3-6 5 c0 5 12 4 12 9 c0 4-3 7-7 7 c-4 0-7-2-7-5 M80 717 v23" fill="none" stroke="#207448" stroke-width="3" stroke-linecap="round" />
    <text x="122" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Environment variables</text>

    <rect x="545" y="694" width="1015" height="72" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="739" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#303a36">monkeypatch.setenv</text>
  </g>

  
  <g>
    <rect x="40" y="778" width="490" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <circle cx="80" cy="814" r="20" fill="none" stroke="#207448" stroke-width="3.5" />
    <polyline points="80,802 80,814 89,820" fill="none" stroke="#207448" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="122" y="824" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Time</text>

    <rect x="545" y="778" width="1015" height="72" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="823" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">inject clocks or use <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">freezegun</tspan> or <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">time-machine</tspan></text>
  </g>

  
  <g>
    <rect x="40" y="862" width="490" height="72" rx="8" fill="#e8f1ea" stroke="#207448" stroke-width="1.5" />
    
    <rect x="60" y="878" width="40" height="40" rx="7" fill="none" stroke="#207448" stroke-width="3.5" />
    <circle cx="70" cy="888" r="3.5" fill="#207448" />
    <circle cx="80" cy="898" r="3.5" fill="#207448" />
    <circle cx="90" cy="908" r="3.5" fill="#207448" />
    <text x="122" y="908" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#207448">Randomness</text>

    <rect x="545" y="862" width="1015" height="72" rx="8" fill="#ffffff" stroke="#b8d4be" stroke-width="1.5" />
    <text x="575" y="907" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">seed explicitly or inject <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">random.Random(1)</tspan></text>
  </g>

  
  <g>
    <rect x="40" y="946" width="490" height="146" rx="8" fill="#fff6ed" stroke="#db8129" stroke-width="2.5" />
    
    <path d="M64 1019 a17 17 0 0 1 28 -8" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <polyline points="92,1005 92,1012 85,1012" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M96 1023 a17 17 0 0 1 -28 8" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" />
    <polyline points="68,1037 68,1030 75,1030" fill="none" stroke="#db8129" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="122" y="1029" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" fill="#db8129">Async code</text>

    <rect x="545" y="946" width="1015" height="146" rx="8" fill="#fffaf5" stroke="#db8129" stroke-width="2.5" />
    <text x="575" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#303a36">
      <tspan x="575" y="980"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pytest-asyncio</tspan> or the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">anyio</tspan> plugin with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">async def</tspan> tests;</tspan>
      <tspan x="575" dy="30">bound each test with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">asyncio.wait_for</tspan>; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AsyncMock</tspan> for awaitables;</tspan>
      <tspan x="575" dy="30">test <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">task.cancel()</tspan> and timeout behaviour explicitly;</tspan>
      <tspan x="575" dy="30">inject sleep or a fake event loop clock</tspan>
    </text>
  </g>

  
  <rect x="40" y="1110" width="1520" height="65" rx="10" fill="#207448" />
  <text x="800" y="1151" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Whenever a test would wait, inject the clock or sleep so it does not</text>
</svg>